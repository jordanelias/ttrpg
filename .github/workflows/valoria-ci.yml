name: Valoria Integrity Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on rapid pushes — saves CI minutes
concurrency:
  group: valoria-${{ github.ref }}
  cancel-in-progress: true

# Enforcement model: this CI is the ONE authoritative tier (on branch-protected main).
# Every gate is its own job that depends only on syntax-check, so a hiccup in one gate
# can never silently skip another. The local tier (.githooks/pre-commit +
# .claude/settings.json) calls the SAME tools/ci_*.py validators for fast feedback.

jobs:

  # ── FOUNDATION ──────────────────────────────────────────────────────────────
  syntax-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # GLOBBED 2026-08-12 (G9, ED-IN-0159 §2.2). This was a hand-maintained list of 32
      # names covering 32 of the 108 `.py` under `tools/` — so 76 tools, including all of
      # `tools/observability/` and `tools/sim_harness/`, could carry a syntax error into
      # main and this gate would pass. A roster that must be edited whenever a file is
      # added is a roster that rots; the glob cannot.
      #
      # `find | xargs`, not `tools/*.py`: the shell glob does not descend into
      # `tools/observability/` or `tools/sim_harness/`, which is half the uncovered set.
      # `py_compile` is kept as the mechanism (rather than `compileall`). It USED to be required:
      # `ci_gate_coverage.jobs()` keyed "this job is compile-only, it invokes nothing" on that
      # literal token and `test_gate_coverage` pinned the classification. Both retired 2026-08-21
      # (ED-IN-0194); the mechanism stays because it is the right one, not because a parser needs it.
      #
      # SHIPPED WITH THE `invoked_by` FIX, NOT BEFORE IT — see G9's note in
      # tools/build_apparatus_registry.py (retired 2026-08-21). Being compiled is not being invoked, and the
      # orphan census used to conflate the two. Expanding this list to name all 108 tools
      # would have been the obvious fix and would have driven the orphan count to zero.
      - name: Compile all validators and tools
        run: |
          files=$(find tools -name '*.py' -not -path '*/__pycache__/*' | sort)
          echo "$files" | wc -l | xargs echo "compiling tools:"
          python -m py_compile $files
          echo "All tools: syntax OK"

  # ── REGISTER + ARCHITECTURE GATES ───────────────────────────────────────────
  # ── COLLAPSED VALIDATOR JOBS ────────────────────────────────────────────────
  # WHY. Probed 2026-08-01: 29 of 31 validator nodes do 5.17 SECONDS of compute in
  # total, and they were spread across 25 jobs, each paying a full runner boot
  # (checkout + setup-python + pip, ~10-30s). The wall clock was runner setup, not
  # work. Collapsed to two jobs -> 23 fewer boots.
  #
  # ⚠ THE ANTI-DRIFT GUARD IS GONE, 2026-08-21 (ED-IN-0194) — recorded here rather than left for
  # someone to infer from a missing file. `tools/valoria_local.py --ci` derived its work-list from
  # `ci_gate_coverage.jobs()`, which regex-scanned each job BODY, so the local list could not drift
  # from this workflow; `test_gate_coverage.py` pinned the full command set and the tier split.
  # All three were retired: their subject was this repository's own gate wiring, which CLAUDE.md
  # §0.1 pt 5 excludes.
  #
  # CONSEQUENCE: `valoria_local.py --staged` and this file are now two independently maintained
  # lists, and LOCAL-GREEN NO LONGER IMPLIES CI-GREEN. That asymmetry is acceptable only because CI
  # is the unbypassable boundary (CLAUDE.md §8) — do not describe local-green as authoritative, and
  # when you add a validator here, add it there in the same commit.
  #
  # NO FAIL-FAST. Each validator runs even if an earlier one failed, and the job
  # exits non-zero at the end if any did. Fail-fast would report one failure per
  # run and hide the rest, turning one red CI into N sequential round-trips.
  validators:
    name: Validators (blocking)
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_BASE_REF: ${{ github.base_ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Every blocking validator
        run: |
          fail=0
          v() { echo "::group::$*"; if ! "$@"; then echo "::error::FAILED: $*"; fail=1; fi; echo "::endgroup::"; }
          v python3 tools/ci_register_size_check.py
          # RETIRED culling wave 3 (ED-IN-0194, 2026-08-21): ci_hooks_verifier.py. Its Check 6 (the deny-list) is independently asserted by tests/valoria/test_no_polling_triggers.py, which opens .claude/settings.json directly and never imported the verifier — the culling plan §5.3 hard gate, verified before deleting. CLAUDE.md §11 corrected to match.
          v python3 tools/ci_co_file_checker.py
          v python3 tools/ci_editorial_checker.py
          v python3 tools/ci_pp_frozen_check.py
          v python3 tools/ci_naming_check.py
          v python3 tools/ci_names_consistency.py
          v python3 tools/export_engine_params.py --check
          v python3 tools/export_key_types.py --check
          # ED — the writer half of the ttrpg -> Godot constants bridge. Blocking for the same
          # reason as its two siblings: it is deterministic and has no external pins. Its READER
          # half lives in the jordanelias/valoria-game repo, as a constants-parity checker run by
          # its own `Constants Parity (vs design oracle)` CI job, and cannot be
          # gated from here — that cross-repo hop is the residual, recorded in
          # proposals/2026-08-20-return-to-game-plan-v1.md Act C1.
          v python3 tools/export_game_constants.py --check
          # references/descriptor_registry.yaml -> the cooked artifact engine/substrate/descriptors.py
          # reads AT RUNTIME. Blocking: if this drifts, the engine imports a stale roster.
          v python3 tools/export_descriptors.py --check
          # references/module_contracts.yaml composition_roles -> the role map engine/mc_v18.py
          # resolves through. Blocking, and it IMPORTS every target at export time, so a broken row
          # reds CI instead of failing a campaign run hours later.
          v python3 tools/export_composition.py --check
          # ED-IN-0142: the test register drifted 3x in one session and only the pytest suite
          # noticed, because --check could not fail. Both fixed; this is the CI half.
          # RETIRED culling wave 2 (ED-IN-0194, 2026-08-21): build_test_register.py + its
          # references/test_register.json output. The register indexed test files for an
          # apparatus census; nothing in engine/ or systems/ read it.
          #
          # THE GAME SIGNAL MOVES — see the validators-report job, NOT here. `review_core.py`
          # retired in the same wave and it was what carried `m1.acceptance` into a required job,
          # the single game-subject signal wired into CI (CLAUDE.md §0.2's instrument). Losing it
          # silently would be the commensurability failure this cull was told to avoid.
          #
          # It is rewired REPORT-ONLY, deliberately. `m1_acceptance --check` exits 1 today —
          # stub_invocations and m1_junctures both fail, which is the true state of the milestone.
          # review_core graded it against a ratchet baseline (now retired with it), so it red only
          # on REGRESSION; a bare --check has no baseline and would red on arrival, refusing every
          # unrelated author's commit for a pre-existing condition. ED-IN-0112 paid for that once.
          # ED-IN-0172: moved OUT of the pytest suite, where it was racy by construction.
          # It shells out and reads the WHOLE tree, while `test_engine_atlas` deliberately
          # plants a throwaway probe module under a reserved subsystem name in the real
          # tree (see that test for the name — it is deliberately NOT written here, because
          # ci_claude_workflow_paths requires every path a workflow names to resolve, and a
          # path that exists for milliseconds inside a test resolves to DEAD). Under `-n auto` the
          # census saw that file, counted `probe_entry`, and the roll-up drifted by exactly
          # one name — per-subsystem files unaffected, because the probe dir has no `.md`
          # so it is not a subsystem. Green locally, red in CI, and the signature said so.
          # Whole-tree freshness belongs in a validator step, next to its three siblings.
          v python3 tools/build_identifier_census.py --check
          v python3 tools/ci_sim_fabrication_check.py
          v python3 tools/ci_claim_provenance_check.py
          v python3 tools/ci_vetting_check.py
          v python3 tools/validate_ed_citations.py
          v python3 tools/broken_dependency_checker.py
          v python3 tools/freshness_gate.py
          exit $fail

  validators-report:
    name: Validators (report-only)
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_BASE_REF: ${{ github.base_ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      # canon_coverage_check was repointed designs/ -> systems/ on 2026-08-01. It had been
      # walking a directory retired 2026-07-19 and reporting 0 findings against a 130-path
      # registry for 13 days, under --strict. Now 4 unregistered-with-header /
      # 27 registered-no-header -- real drift, report-only until it is burned down.
      - name: Every report-only validator (never fails the build)
        run: |
          # `w` runs a validator and NEVER propagates its status. The command must appear
          # as a bare invocation token so ci_gate_coverage parses it cleanly —
          # wrapping it inside an echo string made the parser capture the closing quote
          # and invent a phantom arg, which `--ci` would then have tried to execute.
          w() { echo "::group::$*"; "$@" || echo "::warning::non-zero (report-only): $*"; echo "::endgroup::"; }
          # G3 (ED-IN-0159 §1.9): these two moved DOWN from `validators` on 2026-08-12. Both
          # are structurally incapable of failing — ci_supersession_check.py:66 documents
          # "ALWAYS return 0 (WARN-ONLY)" and every one of its returns is 0;
          # ci_audit_registry_check is "Always exits 0 by design" per its own registry row.
          # A tool that cannot fail cannot gate, so hosting them in the blocking job made
          # that job's membership a false claim about what blocks a merge. Nothing about
          # their behaviour changes here; `valoria_local.py:162,172` ALREADY ran both
          # report-only, so this is CI catching up to the local tier, not a relaxation.
          # RETIRED culling wave 2 (ED-IN-0194, 2026-08-21): ci_supersession_check.py and
          # ci_audit_registry_check.py. Both were structurally incapable of failing, as the
          # paragraph above records — a tool that cannot fail cannot gate.
          #
          # THE GAME SIGNAL, REWIRED HERE (see the note in the blocking job). review_core.py
          # retired in this wave and it was the only carrier of `m1.acceptance` into CI.
          w python3 tools/m1_acceptance.py --summary
          w python3 tools/ci_names_check.py
          w python3 tools/currency_consistency_check.py
          w python3 tools/ci_quantity_vocabulary_check.py
          w python3 tools/mechanics_index_gen.py --strict
          w python3 tools/ci_generation_consistency.py
          w python3 tools/canon_coverage_check.py --strict --json
          w python3 tools/ci_module_shape_check.py
          # RETIRED culling wave 2 (ED-IN-0194, 2026-08-21): ci_workplan_pointer_check.py, with
          # the 11 workplans/POINTER_*.md files it guarded.
          w python3 tools/wiring_map_check.py --check
          # RETIRED culling wave 2 (ED-IN-0194, 2026-08-21): scope_ratchet.py + scope_baseline.yaml
          # and ci_program_claim_check.py. `ci_vacuous_assertion_check` below is KEPT by Jordan's
          # ruling of 2026-08-21 (culling plan §5.6): it is a literal encoding of CLAUDE.md §0.1
          # point 2, and deleting it would have required striking §0.1 in the same commit.
          w python3 tools/ci_vacuous_assertion_check.py
          exit 0

  contract-conformance:
    name: Module-Contract Conformance (report-only)
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 5
    # Report-only: the EXISTING design-side conformance scan (contract_adjudicator A1-A12,
    # the valoria-module-adjudicator skill's machine checks — reused, not re-implemented;
    # holonic doctrine ED-1083: conformance is deterministic, make it cheap and standing).
    # Current tree carries ~21 pre-existing violations / ~64 warnings — the ED-1051 backlog
    # (doc:null modules, cross-scale edges without transitions, unregistered Key types).
    # STEP-level continue-on-error (the freshness-gate precedent): the job stays green while
    # the log carries the standing count — a permanently red X for a known, docketed backlog
    # trains alarm-blindness. Remove the step flag (blocking) when ED-1051 triage reaches zero.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Contracts conform to the Key Type Registry + canonical sources (report-only)
        continue-on-error: true
        run: |
          python3 skills/valoria-module-adjudicator/scripts/contract_adjudicator.py \
            --contracts references/module_contracts.yaml \
            --registry  systems/_architecture/key_type_registry_v30.md \
            --sources   references/canonical_sources.yaml

  unit-tests:
    name: Validator Unit Tests
    runs-on: ubuntu-latest
    needs: syntax-check
    # tests/valoria alone runs ~9m on hosted runners (combat/sim-heavy cases + the two grid-mode
    # byte-exact subprocess batteries), plus pip install + tests/contracts — the old 5-min cap
    # cancelled the job mid-run. 12 min gave headroom above the observed ~9m23s full-suite time.
    # [RAISED 12 -> 16, ED-PC-0040] That headroom is now spent. This batch added ~2m20s of roster-wide
    # combat sweeps — the primitive-derived plate-participation guard (~25s), its four mutation cases
    # (~58s), and the armour-reference drift gate (~54s) — all of which sweep all 54 weapons by design,
    # because restricting them to a watched subset is the exact blind spot they exist to close. At the
    # old cap a slow runner would have landed ~11m43s against 12m and cancelled mid-run, which reads as
    # a mysterious red rather than as "the suite got slower". Sized so the added cost is visible in this
    # comment rather than discovered by a cancelled job.
    #
    # [CORRECTED 2026-07-29] The ED-PC-0040 paragraph above was WRONG about this job, and the error is the
    # reason numpy is now installed below. Those roster-wide sweeps never cost this job ~2m20s, because they
    # never RAN here: 18 of the 20 tests/valoria/test_combat_*.py modules carried a
    # `pytest.importorskip("numpy")` guard (13 at module level, 5 inside import helpers/test functions)
    # and numpy was not in the install line, so nearly the whole combat surface skipped silently
    # (only test_combat_balance_guard.py and test_combat_audit_pins.py, which have no guard, always ran). main @81948c1 reported 837 passed / 93 skipped in ~3m48s against 972 passed /
    # 21 skipped locally with numpy present. The guard was also unnecessary: the engine import chain has
    # been numpy-free since ED-1085, and only workbench/trace.py actually needs it — reached by exactly three
    # live-fight tests (two in test_combat_state_graph.py, one in test_combat_tradition_levers.py).
    # Every one of those importorskips is now deleted, so an absent numpy fails LOUDLY instead of green-
    # skipping the suite that guards the combat resolver. Expect wall time to grow from ~3m48s toward the
    # ~9-11m the paragraph above already predicted — measured 6m10s locally with numpy present, so a hosted
    # runner should land inside the existing 16-min cap with headroom. The cap is UNCHANGED; the growth is
    # the sweeps finally being paid for, not new work.
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY REQUIRED (ED-IN-0123, 2026-08-03). Not a convenience.
          #
          # ⚠ THE STATED REASON MOVED 2026-08-21 (ED-IN-0194). It named
          # tests/valoria/test_retired_tree_apparatus.py, which culling wave 3 retired — so the
          # justification pointed at a file that does not exist, and someone tidying that comment
          # could have dropped the setting with it. The LIVE reason is stronger:
          # tests/valoria/test_forked_status.py runs `git cat-file -e <ref>:<path>` against 242
          # restructure-ledger FORK rows. At the default depth-1 those refs are unreachable and all
          # 242 read as unfollowable at once. DO NOT LOWER THIS.
          #
          # The original reason also still holds, via the surviving half of that test's subject:
          # currency_consistency_check.check_current_stamp in BOTH directions — an
          # apparatus-only change must not trip the stamp, and a canonical head moving
          # must. It stubs the date source, so it needs no real dates -- but the check's
          # depth guard reads the actual commit count, and under the default depth-1
          # checkout that guard short-circuits before the path-selection logic runs.
          # The result is a check that is INERT in this job while reporting green, which
          # is the failure mode the second half of that test exists to catch. It caught it.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        # numpy is REQUIRED, not optional: without it the combat suite used to importorskip itself into
        # silence (see the [CORRECTED 2026-07-29] note above). Do not drop it to speed the job up.
        run: pip install pyyaml pytest numpy pytest-xdist
      # PARALLELISED, NOT FILTERED (ED-IN-0112, 2026-07-31).
      #
      # This job was 387s of a 428s run — 90% of CI's wall clock. The obvious fix, adding
      # `-m "not sim"` so an infrastructure PR skips the mass-battle suite, is FORBIDDEN:
      # pytest.ini's "ONE RULE" says a -m filter here is "a SHIPPING-GATE COVERAGE CUT, not
      # an optimisation ... Jordan's call, made loudly, never a side effect of a speed
      # change", and tests/valoria/test_pytest_marker_discipline.py fails on it.
      #
      # `-n auto` is a categorically different thing, and the distinction is the point: it
      # changes WHERE tests run, never WHICH. The collection is identical, so the gate is
      # untouched and the discipline guard's -m check is satisfied by construction.
      #
      # MEASURED on one machine, full suite, not projected:
      #     serial     416.97s  ->  9 failed, 1282 passed, 22 skipped
      #     -n auto    138.15s  ->  9 failed, 1282 passed, 22 skipped
      # 3.02x, with failure AND pass AND skip counts identical — the control that separates
      # "faster" from "ran less". (The 9-vs-CI's-10 delta is the documented local skip of
      # test_byte_exact_cell_mode, ED-MB-0061 §3.1b, not a difference this change caused.)
      #
      # IF THIS EVER NEEDS TO BE FASTER STILL: split into JOBS whose union is the full
      # collection. Do not select a subset of it.
      - run: python -m pytest tests/valoria -q -n auto
      # tests/contracts EVACUATED 2026-08-05 (ED-IN-0145); its step is removed here. It had been
      # wired since 2026-07-07 (ED-IN-0017) after being orphaned from CI. Content at fork ref c451bcb.

  sim-regression:
    name: Sim Reference Regression
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: pip install pyyaml pytest
      # Deterministic seeded oracle for the sim reference the Godot port validates
      # against (ED-1053). Before this, the reference had zero tests and never ran in
      # CI, so a degenerate-balance regression could land unflagged. Relocated from
      # sim/tests/ to engine/tests/ in the sim/ hollow-out (ED-IN-0071 P4 cont.). ~20s.
      - run: python -m pytest engine/tests -q

  field-goldens:
    name: Golden Modes Byte-Exact (shipped field configuration + the §4a cell-morale mode)
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # [ED-MB-0045 A1b, 2026-07-29] The shipped configuration's regression oracle.
      # test_mass_battle_byte_exact.py (in unit-tests above) covers only the two
      # FIELD_MOVEMENT=0 grid modes; before this job existed the two field goldens
      # sat RED for 5 days undetected (#235/#236 re-recorded grid only — bisected
      # and re-recorded in A1a, PR #260). Own job, not inside the unit-tests
      # budget: the two field batteries take ~4-8 min combined. The FULL
      # digest-relevant toggle vector is pinned inside the tool (single owner:
      # tools/ci_golden_modes_check.py FIELD_PINS; drift-guarded by
      # tests/valoria/test_field_golden_pins.py) — minimal pinning is how ED-1089
      # went wrong.
      - run: python3 tools/ci_golden_modes_check.py

  lanchester-signature:
    name: Lanchester Signature (REPORT-ONLY — never fails the build)
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # [ED-MB-0050 A6b, 2026-07-29] The engine's own attrition-law instrument, wired at last.
      # It has existed since 2026-06 and NOTHING ran it — not CI, not pytest — which is how it
      # sat red and unnoticed while its `melee p=2.50` was quoted as an engine property in two
      # audits and a handoff.
      #
      # REPORT-ONLY BY DESIGN, and this is not timidity. A6a repaired the instrument and the
      # repaired instrument legitimately FAILS: melee fits p≈3.20 against a ≤1.4 linear bar. That
      # is an ENGINE finding awaiting a design decision (plan-v2 fork #2 — two incompatible 2:1
      # validation targets, ≥65% vs ~70%, one of which must be repudiated), not a regression to
      # gate on. Making it blocking now would either wedge `main` or force the bar to be tuned to
      # whatever the engine currently does, which is how a validation target becomes a
      # rubber stamp. It flips to blocking when fork #2 is ruled.
      #
      # `|| true` is deliberate and is the whole of "report-only"; the log carries the numbers.
      - run: |
          cd tests/sim
          PYTHONPATH=. python3 -m mass_battle.lanchester_signature || true

  compliance-check:
    name: Compliance Check
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is REQUIRED, not an optimisation (ED-IN-0123, 2026-08-03). The reason is
          # unchanged but its carrier moved: this job used to run `review_core.py --check` (retired
          # 2026-08-21, ED-IN-0194) whose `currency.stamps` signal shelled out to
          # currency_consistency_check. That checker still runs in `validators-report` and still
          # compares CURRENT.md's reconcile stamp against
          # `git log -1 --format=%cs -- <each canonical head>`. At the default depth-1 there is
          # exactly ONE commit, so every path returns HEAD's date and EVERY canonical head falsely
          # reads as touched today. MEASURED: the signal went RED here while passing on full history,
          # the moment a commit landed more than one day after the stamp. `validators` and
          # `validators-report` already set this; this job was the outlier.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run compliance check
        run: python3 tools/compliance_check.py --check-only --repo-state .

      # RETIRED culling wave 2 (ED-IN-0194, 2026-08-21): the ED-IN-0077 repository-state ratchet
      # (review_core.py + registers/review_baseline.yaml). It graded twelve report-only signals
      # against a baseline and failed on regression — an apparatus-subject gate whose twelve
      # signals were, with one exception, apparatus signals.
      #
      # THE EXCEPTION IS WHY THIS BLOCK IS A COMMENT AND NOT A DELETION. `m1.acceptance` was the
      # one game-subject signal in it, and this job is the required one, so retiring review_core
      # silently would have removed the only path by which CLAUDE.md §0.2's instrument reached CI.
      # It is rewired as `m1_acceptance.py --summary` in `validators-report`; report-only, because
      # a bare --check has no baseline and reds on arrival. See the note at the blocking job.

  # ── AGGREGATOR: the single required check for branch protection ──────────────
  # Proves every authoritative gate actually RAN and PASSED (not skipped). Make
  # this job the required status check on main.
  ci-summary:
    name: All Gates Green
    runs-on: ubuntu-latest
    if: always()
    needs:
      - syntax-check
      - validators
      - unit-tests
      - sim-regression
      - field-goldens
      - compliance-check
    steps:
      - name: Assert all gates ran and succeeded
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          python3 -c "import json,sys; d=json.load(open('needs.json')); [print(f\"{k}: {v['result']}\") for k,v in d.items()]; bad={k:v['result'] for k,v in d.items() if v['result']!='success'}; print('FAILED (not success):', bad) if bad else print('All gates green.'); sys.exit(1 if bad else 0)"

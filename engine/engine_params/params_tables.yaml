      - Agility (Agi), Endurance (End), Strength (Str)
    - - Mental
      - Cognition (Cog), Recall (Rec), Focus (Foc)
    - - Social
      - Attunement (Att), Bonds (Bon), Charisma (Cha)
    - - Metaphysical
      - Spirit (Spi)
  - section: Derived Scores
    header:
    - Score
    - Formula
    - Range
    - Notes
    rows:
    - - Health
      - (End+6) × (MW+1), MW = min(floor(End/2)+1, 3)
      - 14–48 (cap MW=3)
      - Total damage capacity. Non-resetting; each wound subtracts WI=(End+6). **Each wound adds a fractional Ob to the roll — NEVER a −1D pool cut** (Jordan ruling 2026-07-08, ED-PC-0005; reverses PP-716's −1D unification). Combat = ED-1041's bilateral channel (+0.15 Ob attacking / +0.25 Ob defending per wound); non-combat per-pool values are a follow-on calibration, flagged pending (ED-PC-0006). Equipment adds flat Health. **See `systems/_architecture/derived_stats_v30.md` §4.1 as authoritative.** (PP-716's −1D unification superseded by ED-PC-0005; PP-717 D1 MW cap)
    - - Stamina
      - (3 × Endurance) + (2 × Spirit)
      - 5–35
      - Combat action economy. Variable action costs (standard 5, heavy 8, defensive 3). Armor adds to drain per action. Take a Breath restores (End + History) × 2. (ED-694)
    - - Composure
      - Charisma × 3
      - 3–21
      - Social damage buffer before Rattled. Strain scaled ×3. Equipment (attire, regalia) adds flat Composure. (ED-694, replaces Cha+6)
    - - Combat Pool
      - max(5, Relevant History + 6)
      - min 5
      - '**Agility-INDEPENDENT** resolution pool — ratified 2026-05-29 R1 (ED-901; re-ratified ED-900/904 with combat_engine_v1). Supersedes the struck (Agility × 2) + History + 3 form (PP-615/PP-247 era). Single source: `systems/combat/combat_engine_v1/` (see `references/module_contracts.yaml` personal_combat). ED-1084 propagation.'
    - - Thread Fatigue
      - Spirit × 5 (threshold)
      - 5–35
      - Thread action economy. Counts up from 0. Contact breaks at threshold. Variable operation costs (Pulling 5, Locking 7, Dissolution 10). Focus sets max operations per session (Focus − 1). (ED-694, replaces Contact Rounds = Focus)
    - - Concentration
      - (3 × Focus) + (2 × Spirit)
      - 5–35
      - Social-contest and combat attention/composure resource, shared derivation (ED-902 coefficients; ED-901 struck the interim Focus×3 form; ED-933 params propagation). Row added 2026-07-08 (ED-IN-0029 docket, OPT-AV-7) — this table lacked a Concentration row entirely despite the quantity being load-bearing in both contest (`params/contest.md`) and combat (`systems/combat/combat_engine_v1/config.py` `CONC_FOCUS`/`CONC_SPIRIT`). **See `systems/_architecture/derived_stats_v30.md` §4 as authoritative.**
    - - Truth
      - 5 (starting, varies by background)
      - 0–5
      - Per-character metaphysical stance — **consolidates the former Certainty Track + the character-scale piety / "religious standing" notion** (ED-IN-0075). Solmund orthodoxy (5, *Himmelenger pole*) → Thread-truth acceptance (0, *Edeyja pole*). Numeric is engine-internal — **players see the qualitative band, never the number**. The 13 Convictions are a separate value-frame system (`conviction_taxonomy_v30.md`) and are unchanged. See Truth Track section below.
    - - Coherence
      - 10 (starting); countdown to 0
      - 0–10
      - Personal rendering legibility
    - - Resolve
      - Spirit
      - 1–7
      - Maximum total Inspiration value
  - section: Truth Track (PP-551 — redesigned from PP-289; renamed from the former "Certainty Track" and consolidated with the character-scale piety / "religious standing" notion per ED-IN-0075)
    header:
    - Value
    - Label
    - Operative belief
    rows:
    - - '5'
      - Orthodox *(Himmelenger pole)*
      - Solmund created the rendered world. Thread phenomena are demonic or heretical.
    - - '4'
      - Faithful
      - Doctrine is basically correct; Thread phenomena are unusual but explicable within faith.
    - - '3'
      - Questioning
      - Doctrine shows cracks; Thread experiences are real but not fully explained.
    - - '2'
      - Skeptic
      - Solmund framework has failed to explain too much; Thread substrate is real.
    - - '1'
      - Transitional
      - Thread cosmology is the better account; Solmund is a rendering, not the source.
    - - '0'
      - Accepted *(Edeyja pole)*
      - Thread substrate is the ground of being; Solmund is a human rendering that exceeds it.
  - section: Attribute Roles — Fieldwork (PP-628, from fieldwork_v30.md §2.1)
    header:
    - Attribute
    - Fieldwork Role
    rows:
    - - Cognition (Cog)
      - Terrain/navigation exploration; physical evidence examination (Examine); Surveil; Concealment pool (Cognition × 2)
    - - Recall (Rec)
      - Lore/research investigation (Research); Reconstruct action
    - - Attunement (Att)
      - 'Thread-aware exploration (sensing); Witness/informant investigation (Interview); Socializing: Read, Negotiate'
    - - Spirit (Spi)
      - 'Thread-Read (perceptive Leap): (Spirit × 2) + History + TPS. All Thread contact pools. Sincerity Gate check.'
    - - Endurance (End)
      - Endurance-based exploration (forced marches, harsh terrain)
    - - Bonds (Bon)
      - 'Socializing: Connect action'
    - - Charisma (Cha)
      - 'Socializing: Impress, Rumour, Converse'

    # Tensions Deck


    **Source:** designs/architecture/conflict_architecture_proposal.md (CANON)

    **Purpose:** Per-game variability modifier. Settlement governance friction is the ignition system — the Tensions Deck amplifies one specific friction point per campaign.

    **Draw:** 6 cards, draw 1 at game start.


    ---


    ## Cards


    | # | Card | Amplifies | S8+ Event |

    |---|------|-----------|-----------|

    | 1 | **Royal Crisis** | T1 Crown-Church friction + succession | One Royal family member assassinated (sub-roll for target — see royal_assassination.md) |

    | 2 | **Feldmark Famine** | T5 Crown breadbasket | Prosperity collapse in Crown''s food supply → economic crisis |

    | 3 | **Cardinal Independence** | T1 + T9 Church internal | Rogue Cardinal unilaterally appoints bishop-governor in Crown settlement |

    | 4 | **Guild Fracture** | T8 Hafenmark-Guild friction | S017 Guild schism → Market Quarter becomes contested |

    | 5 | **Einhir Incident** | T4 + T13 Varfell-RM friction | Public Einhir cultural confrontation forces all factions to declare position |

    | 6 | **Ministry Crisis** | T14 Crown-Löwenritter + Crown governance | Ministry bureaucracy collapses → Crown governance vacuum → Church fills |


    ---


    ## Fuse Model


    Every card creates a visible fuse from S1 (NPC dialogue, atmospheric events, player-visible signals). The player can investigate and attempt intervention during S1–S7. The event fires if not averted at S8+ (exact season randomized within S8–S12 window).


    ---


    ## Design Rationale


    Settlement friction is the real ignition — 5 provinces have non-aligned settlements at game start. One amplifier card gives per-game variety without overwhelming the player''s attention. Different campaigns have different fires, but only one is externally stoked.


    ---


    ## Pair Validation


    All 15 faction pairs validated against belligerent-target-opportunity criteria (commit ab0365d). Each faction appears in exactly 3 cards.


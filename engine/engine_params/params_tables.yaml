  engine/params/bg/ci_seizure.md: '## CI Generation — Seasonal (canonical: military_layer_v30 §3, tc_political_redesign_v30 §§1–3)

    **Starting CI: 28. CI runs to 100 (no freeze). Milestone system: see victory_v30 §7.**


    Seasonal CI at Accounting (execute in order, per military_layer_v30 §3):

    1. **Conditional Passive (§3.2):** CI +1 only if Church L > controlling faction L in ≥ 2 territories.

    2. **Piety Yield (§3.3):** CI += Σ(PT tier × SW/5) per prominent territory, floored. SW = Spiritual Weight per territory (tc_political_redesign_v30 §1).

    3. **Charity Advantage (§3.4):** Church Wealth spent on charity → CI +1 per 2 Wealth, cap 2/season.

    4. **Templar Presence (§3.5):** +1 CI per territory with Church military unit AND Church Prominence.

    5. **Assert (§3.6):** Optional Church action. Influence vs Ob 2. Success: CI +1. Failure: Stability −1.

    6. **Suppress (§3.7):** Optional opponent action. L vs Ob = floor(Church L / 2) + 1. Success: negate Step 1. Failure: Stability −1.

    7. **Hafenmark Structural Suppression (§3.8):** While Baralta L ≥ 4, CI −1/season.


    **CI seasonal cap (PP-504):** ±3 per season from player-initiated Domain Actions. ±5 per season from all sources combined (includes Conditional Passive, Piety Yield, Calamity Drift, event cards).


    Legacy CI sources (Attention Pool threshold, Emergency Powers, Free Trade Decree, Church unit presence) are subsumed into the Piety Yield system — Church prominence in high-PT territories captures the same dynamics.



    ## Faction Political Pool (tc_political_redesign_v30 §3.4)

    **Church:** Political pool = L + floor(CI/20).

    **Non-Church (anti-Church motions):** Political pool = L − floor(CI/30).

    **Non-Church (non-Church motions):** Political pool = L (no CI modifier).

    CI creates asymmetric legitimacy: Church gains political bonus proportional to CI; opponents pay a legitimacy cost proportional to CI when directly opposing Church.



    ## Church Mass Seizure (one-shot — per victory_v30.md §3.2, §7)

    **CI ≥ 60 makes Mass Seizure available. One-time event. Declaration probability per season: P = ((CI−60)/40)^3.3 — 1% at CI 70, 10% at CI 80, 39% at CI 90, 100% at CI 100. Exponential shape models institutional restraint. CI runs to 100 (no freeze).**


    **Pre-Seizure accumulation path (PP-TBD):** Bishop Appointment (faction_actions.md, Church — Ecclesiastical Appointment) is the settlement-level precursor to Mass Seizure. Church accumulates governance of individual settlements via bishop-governor installation before CI 60+ triggers the formal peninsula-wide political formalization. Mass Seizure converts accumulated settlement-level Church governance into recognized territorial control.


    ### Seizure Ob

    Ob = 10 − PT − infrastructure modifiers (floor 1). See victory_v30 §3.2 for infrastructure table.

    Prominence required: Church L > controlling faction''s L in target territory.

    Church L ≥ 4 required to attempt seizure.


    ### Seizure Results

    Per victory_v30.md §7. Overwhelming seizure: PT +1 in target territory. This is a consequence effect — NOT subject to the ±1 PT seasonal cap. State-change consequences from seizure are exempt from action caps. (PP-502)


    ### Seizure Constraints

    One seizure attempt per season. Cannot target T15 (Askeheim) or T16 (Schoenland).


    ### Church Mass Seizure (one-shot, replaces PP-494)

    **Available:** CI ≥ 60. Declaration probability per season: P = ((CI−60)/40)^3.3, clamped [0,1]. 1% at CI 70, 10% at CI 80, 100% at CI 100. One attempt only. (Replaces Graduated Seizure PP-494.)

    **Pool:** Influence + floor(CI / 15). At CI 60: 10D. At CI 100: 12D.

    **Ob:** 10 − PT − infrastructure modifiers (floor 1). PT 5 with full infra = Ob 1. PT 0 no infra = Ob 10.


    | PT | Seizure Ob |

    |----|-----------|

    | 5 (Piety) | 2 |

    | 4 | 6 (before infra) |

    | 3 | 7 (before infra) |

    | 2 | 8 (before infra) |

    | 1 | 9 (before infra) |

    | 0 (Restoration) | 7 |


    **Prerequisites:** Church L ≥ 4. Prominence (Church L > controlling faction L). Prominence assessed at seizure declaration. (PP-509)

    **Overwhelming:** PT +1 in target territory (consequence, not cap-governed). (PP-494, PP-508)

    **Failure:** Stability −1.

    **Political cost:** Casus Belli granted to controlling faction on every seizure attempt. (See §Casus Belli.) (PP-510)

    **Fort Level:** Fort Level does NOT modify Seizure Ob. Seizure is a political act. (PP-506)

    **Battle requirement:** If the target territory has a garrison (Fort ≥ 1 AND at least one military unit present from the controlling faction), Church must first win a Battle before Seizure proceeds. Battle uses standard rules; Fort Level adds bonus dice to defender. If Church wins: Seizure roll proceeds immediately. If Church loses: no Seizure this season; Casus Belli still granted. An ungarrisoned fortified territory (Fort ≥ 1, no units present) may be Seized without Battle. (PP-506)

    **Early Seizure political visibility:**

    - CI < 50: all factions observe the seizure attempt. No concealment.

    - CI ≥ 50: only factions with Intel ≥ 3 in the target territory observe. (PP-507) [PROVISIONAL]

    **Mandatory Assert post-CI 75:** Suspended. Assert optional only once CI caps. (PP-511)

    **[ED-355 RESOLVED — PP-506. ED-365 RESOLVED — PP-507. ED-366 RESOLVED — PP-508. ED-367 RESOLVED — PP-509. ED-368 RESOLVED — PP-506. ED-369 RESOLVED — PP-511.]**


    ### Battle Ob Formula (PP-499, ED-343 resolved)

    **Battle Ob = floor(defender Military / 2) + 1.**

    Attacker rolls: Military pool vs Ob. Degree table per standard BG degree table (PP-249).

    **[PROVISIONAL ED-316] Weight-of-numbers (PP-570):** A faction attacking with Military ≥ 2× defending faction Military forces the defender to Stability −1 at Accounting regardless of battle outcome (the sheer scale is demoralising). Applies once per Accounting regardless of attack count.

    [Resolved by PP-548. Battle Ob = floor(defender Military / 2) + 1. Min 1 prevents auto-success vs Military 0 factions (RM). Flagged for simulation confirmation.]





    **Pre-Seizure accumulation path (PP-TBD):** Bishop Appointment (faction_actions.md, Church — Ecclesiastical Appointment) is the settlement-level precursor to Mass Seizure. Church accumulates governance of individual settlements via bishop-governor installation before CI 60+ triggers the formal peninsula-wide political formalization. Mass Seizure converts accumulated settlement-level Church governance into recognized territorial control.


    ### Seizure Ob

    Ob = 10 − PT − infrastructure modifiers (floor 1). See victory_v30 §3.2 for infrastructure table.

    Prominence required: Church L > controlling faction''s L in target territory.

    Church L ≥ 4 required to attempt seizure.



    ### Seizure Results

    Per victory_v30.md §7. Overwhelming seizure: PT +1 in target territory. This is a consequence effect — NOT subject to the ±1 PT seasonal cap. State-change consequences from seizure are exempt from action caps. (PP-502)



    ### Seizure Constraints

    One seizure attempt per season. Cannot target T15 (Askeheim) or T16 (Schoenland).



    ### Church Mass Seizure (one-shot, replaces PP-494)

    **Available:** CI ≥ 60. Declaration probability per season: P = ((CI−60)/40)^3.3, clamped [0,1]. 1% at CI 70, 10% at CI 80, 100% at CI 100. One attempt only. (Replaces Graduated Seizure PP-494.)

    **Pool:** Influence + floor(CI / 15). At CI 60: 10D. At CI 100: 12D.

    **Ob:** 10 − PT − infrastructure modifiers (floor 1). PT 5 with full infra = Ob 1. PT 0 no infra = Ob 10.


    | PT | Seizure Ob |

    |----|-----------|

    | 5 (Piety) | 2 |

    | 4 | 6 (before infra) |

    | 3 | 7 (before infra) |

    | 2 | 8 (before infra) |

    | 1 | 9 (before infra) |

    | 0 (Restoration) | 7 |


    **Prerequisites:** Church L ≥ 4. Prominence (Church L > controlling faction L). Prominence assessed at seizure declaration. (PP-509)

    **Overwhelming:** PT +1 in target territory (consequence, not cap-governed). (PP-494, PP-508)

    **Failure:** Stability −1.

    **Political cost:** Casus Belli granted to controlling faction on every seizure attempt. (See §Casus Belli.) (PP-510)

    **Fort Level:** Fort Level does NOT modify Seizure Ob. Seizure is a political act. (PP-506)

    **Battle requirement:** If the target territory has a garrison (Fort ≥ 1 AND at least one military unit present from the controlling faction), Church must first win a Battle before Seizure proceeds. Battle uses standard rules; Fort Level adds bonus dice to defender. If Church wins: Seizure roll proceeds immediately. If Church loses: no Seizure this season; Casus Belli still granted. An ungarrisoned fortified territory (Fort ≥ 1, no units present) may be Seized without Battle. (PP-506)

    **Early Seizure political visibility:**

    - CI < 50: all factions observe the seizure attempt. No concealment.

    - CI ≥ 50: only factions with Intel ≥ 3 in the target territory observe. (PP-507) [PROVISIONAL]

    **Mandatory Assert post-CI 75:** Suspended. Assert optional only once CI caps. (PP-511)

    **[ED-355 RESOLVED — PP-506. ED-365 RESOLVED — PP-507. ED-366 RESOLVED — PP-508. ED-367 RESOLVED — PP-509. ED-368 RESOLVED — PP-506. ED-369 RESOLVED — PP-511.]**



    ## Church Influence Starting Value — Canonical

    CI starts at **28**. (P-32, PP-189 correction. The 22 value from v04 B2 was superseded by P-32 in v05.)



    ## CI 75 Seizure — Territorial Seizure (PP-421)

    Cap: 2 territory transfers per seizure event (v04/v05 P-23). Previously set to 4 by PP-183 — reverted.



    ## CI 75 Seizure — Territory Values — SUPERSEDED

    **See TCV table in §Victory Conditions above.** Per-territory seizure Ob = 10 − PT − infrastructure modifiers (floor 1). See victory_v30 §3.2 for infrastructure table. Fort levels per geography_v30.md territory table.

    [TERRITORY-DEBT: RESOLVED 2026-04-08 — PP-493. All T# references verified against geography_v30.md.]


    ## CI Threshold Check — Zoom In Interaction (ED-056 resolved 2026-04-03)

    CI threshold check fires at turn-end regardless of Zoom In suspension.

    Zoom In cannot delay CI threshold check. Clocks continue during Zoom In personal phase.



    ## Church CI Gain — Redesign Required (ED-110 resolved 2026-04-03)

    Church must have more CI gain routes than Baralta has suppression capacity.

    Baralta is one person, not a nation. Church spans multiple territories and actors.

    Expand CI gain table before next BG simulation. Options under consideration: territory-hold bonuses, non-Hafenmark suppression routes.

    '
  engine/params/bg/clocks.md: '## Clock Environmental Effects (v04 B2)


    ### Mending Stability (MS) Effects

    **Canonical source: `designs/world/calamity_radiation_v30.md`** (Simplified BG Lookup Table).


    MS effects are geographically graduated by Proximity Rating (node distance from Askeheim T15), not applied globally.

    Each territory card includes a Proximity Rating (0–5). At Accounting, one lookup per territory: current MS band × Proximity Rating.


    | MS Band | Proximity 0 | Proximity 1 | Proximity 2 | Proximity 3 | Proximity 4–5 |

    |---|---|---|---|---|---|

    | 100–80 | Wound contained; Forgetting active; no radiation | — | — | — | — |

    | 79–60 | +1 Ob non-Thread; Forgetting active | Folklore (no mech) | — | — | — |

    | 59–40 | +2 Ob non-Thread; Shifting Objects | +1 Ob Thread; Shifting Objects (1d10: 1–2) | Folklore (no mech) | — | — |

    | 39–20 | Gaps auto; beings present | +1 Ob all; Gaps (1d10: 1–2) | +1 Ob Thread; Shifting Objects (1d10: 1) | Folklore (no mech) | — |

    | 19–1 | +2 Ob Mending; beings; Gaps (1d3) | +1 Ob all; Gaps (1d10: 1–4) | +1 Ob Thread; Gaps (1d10: 1–2) | Shifting Objects (1d10: 1) | Folklore (no mech) |


    Additional global MS effects at Critical (19–1): all Thread operations +1 Ob worldwide; seasonal Stability checks for all factions at Ob 1 (failure: Mandate −1).

    MS 0 = Rupture (campaign ends, all factions lose).


    Southernmost Surge (one-time, MS ≤ 10): all territories within Proximity 2 of Askeheim experience effects one band worse for one season. See calamity_radiation_v30.md.





    ### Church Influence (CI) Effects

    | CI Range | Effect |

    |----------|--------|

    | Below 30 | No modifier |

    | 30–49 | Church orders: −1 Ob in Church-held territory |

    | 50–69 | Church orders: −1 Ob everywhere. Non-Church Diplomacy targeting Church: +1 Ob. Mandatory Assert/Suppress each season |

    | 70–74 | As above. Territorial Seizure protocol pending — Church prioritises seizure actions. |


    ### Invasion Pressure (IP) Effects

    | IP Range | Effect |

    |----------|--------|

    | Below 30 | Trade with Schoenland: +1D |

    | 30–59 | Trade with Schoenland: +1 Ob. All factions: +1D to Intel orders |

    | 60–74 | Trade disrupted: +2 Ob. Proxy at T4: +1D military |


    **Battle Consequences (peninsular_strain_v30.md §3):**

    All battles on Valorian soil: MS −1 (MS −2 for Campaign/War scale). Each season with inter-faction battle: IP +2. Each season with inter-faction battle: Turmoil +1. Faction elimination: Strain +2. Territory Revolt (Accord 0): Strain +1. Covert actions and ungarrisoned Church Seizure: no MS/IP/Strain cost.



    **[PROVISIONAL ED-340] Altonian Vanguard Mechanics (PP-568 — flag for authorial review):**

    - Vanguard appears as NPC military presence at T10 (Spartfell — NE Altonian pass).

    - Vanguard stats: Military 5 equivalent; Size 3; cannot be negotiated, traded, or Diplomatically managed.

    - Advance: if no faction contests Vanguard territory for 2 consecutive seasons, Vanguard advances one territory along the invasion route (T10→T3→T2→T1).

    - Contest: any faction in Vanguard''s territory triggers automatic Battle (defender Military vs Ob 3). Win: Vanguard held. Loss: Vanguard advances.

    - While Vanguard occupies T1 (Valorsplatz): all factions −1 Stability/season. Shared pressure.

    - [EDITORIAL: authorial review required — Vanguard faction identity, advance route, and elimination conditions]


    ## Cascade Depth Cap (v04 B4)

    Maximum 3 immediate mechanical effects per card play resolution step. Additional effects queue to next Accounting.

    State-based modifiers (MS/CI/IP/PI environmental effects) do NOT count against this cap.

    '
  engine/params/bg/core.md: "\n\n<!-- [SUPERSEDED 2026-04-19] CULTURAL REFORMATION STRUCK + VTM STRUCK -->\n<!-- Per Jordan decision 2026-04-19 (session): Cultural Reformation was incompatible with Vaynard's identity. -->\n<!-- Vaynard is a military conqueror. He does not convert populations ideologically. Varfell expansion is purely military. -->\n<!-- VTM (Vaynard Thread Mastery) was also STRUCK — placeholder mechanic with no canonical advancement. -->\n<!-- Tribune intel (reveals enemy stats for target selection) remains. Thread operations remain as personal-scale actions -->\n<!-- available to Varfell first due to southern TS baseline + RM proximity, NOT as BG-layer combat/territorial bonuses. -->\n<!-- See commits: 297f892 (engine), 13b8f30 (workplan), 13b8f30 (canon audit workplan). -->\n<!-- [CORRECTED 2026-05-29, ED-880] The 'Varfell expansion is purely military / does not convert populations ideologically' claim above is SUPERSEDED. The 2026-04-19 strike validly removed the VTM-dependent\
    \ Cultural REFORMATION (VTM remains struck); the Conviction-Track redesign (designs/scene/conviction_track_v30.md) reintroduced the ideological-conversion capability VTM-free as Cultural RECLAMATION (Varfell: Influence vs Ob 2, target-territory Piety -1 toward Einhir Restoration). This acts on religious/cultural ALIGNMENT (Piety), NOT territory control, and is NOT a victory path. Varfell also takes all universal faction actions. Per GD-1 the SOLE victory condition for all factions is Peninsular Sovereignty (control 11+ of 15 territories) — no faction-specific or non-military victory path exists. -->\n\n## FACTION ASSIGNMENT (canonical, v04 B1)\n\n### Playable Factions\n| Faction | Player Count |\n|---------|-------------|\n| Crown | 2–5 players |\n| Church of Solmund | 2–5 players |\n| Hafenmark | 2–5 players |\n| Varfell | 2–5 players |\n| Restoration Movement | 5 players only (optional) — statless faction; operates through PT and Presence only |\n| Löwenritter | Conditional: Split\
    \ stage only |\n\n### NPC-Only Factions (never playable)\nLöwenritter (pre-Split), Riskbreakers, Inquisitors, Guilds, Schoenland, Altonia, Edeyja/Wardens.\n<!-- Niflhel deleted 2026-04-30 (was: STRUCK per conflict_architecture_proposal §Niflhel Dissolution). Functions distributed to settlement-level phenomena (black markets, intelligence brokers, Thread exploitation sites). -->\nMinistry: NPC faction (source document not yet identified — [GAP: Ministry NPC design doc not found in any read document. User confirmed it exists. Design blocked until source located.])\n\nNote: Guilds do NOT have player victory conditions. All Guilds victory condition text from prior params versions was struck (PP-191).\n\n\n### Playable Factions\n| Faction | Player Count |\n|---------|-------------|\n| Crown | 2–5 players |\n| Church of Solmund | 2–5 players |\n| Hafenmark | 2–5 players |\n| Varfell | 2–5 players |\n| Restoration Movement | 5 players only (optional) — statless faction; operates through PT\
    \ and Presence only |\n| Löwenritter | Conditional: Split stage only |\n\n\n### NPC-Only Factions (never playable)\nLöwenritter (pre-Split), Riskbreakers, Inquisitors, Guilds, Schoenland, Altonia, Edeyja/Wardens.\n<!-- Niflhel deleted 2026-04-30 (was: STRUCK per conflict_architecture_proposal §Niflhel Dissolution). Functions distributed to settlement-level phenomena (black markets, intelligence brokers, Thread exploitation sites). -->\nMinistry: NPC faction (source document not yet identified — [GAP: Ministry NPC design doc not found in any read document. User confirmed it exists. Design blocked until source located.])\n\nNote: Guilds do NOT have player victory conditions. All Guilds victory condition text from prior params versions was struck (PP-191).\n\n\n## Dice System (v05 correction)\nd10 pool. TN 7 (standard).\n| Face | Effect |\n|------|--------|\n| 1 | −1 success |\n| 2–6 | 0 |\n| 7–9 | +1 success |\n| 10 | +2 successes |\n\nNet successes = sum of contributions. May be negative\
    \ (treated as 0 for degree purposes = Failure).\nOb minimum: 1. No modifier may push Ob below 1.\n**Majority-1s (Catastrophic Failure) override: STRUCK** (v05 DESIGN DECISION 2026-04-02). All rolls resolve through standard degree table only. Low-pool results produce Failure; no additional consequence category exists.\n\n\n## Degree Table (PP-179 + PP-249 — matches TTRPG)\n| Net Successes | Degree |\n|--------------|--------|\n| ≥ 2× Ob AND ≥ 3 | Overwhelming |\n| ≥ Ob | Success |\n| 0 < net < Ob | Partial |\n| ≤ 0 | Failure |\nOverwhelming floor: net must be ≥ 3 regardless of Ob (matches PP-232 TTRPG rule). (PP-249)\nED-031 (Ob+1 surplus) is SUPERSEDED by PP-179 (2×Ob). PP-179 is canonical.\nOb 10 exception: Overwhelming unavailable. Partial requires net ≥ 5.\n[FLAGGED FOR REVIEW: ED-142-R — confirm 2×Ob canonical; confirm floor of 3 applies to BG; confirm Ob 10 exception carries.]\n\n\n## Starting Values (v04 B2, PP-188 correction)\n| Track | Start | Range | Notes |\n|-------|-------|-------|-------|\n\
    | Mending Stability (MS) | 72 | 0–100 | Rupture = shared loss |\n| Church Influence (CI) | **28** | 0–100 (no freeze) | CI 60 = Mass Seizure available (one-shot). CI 100 = cap. P-32 sets starting value at 28. |\n| Invasion Pressure (IP) | 20 | 0–100 | IP 75 = Altonian Vanguard appears. IP 80+ = sustained Vanguard presence + skirmishes / small unit border incursions through mountain passes. IP ≥ 100 = Altonia regularly invades through one or both mountain passes (T10 Spartfell NE pass; second pass location TBD) — large-scale military invasion, not just political occupation. See peninsular_strain §6.4. |\n| Parliament Integrity (PI) | **7** | 0–20 | Cumulative pressure meter. Auto-resolves at PI ≥ 20 (Crown elimination). |\n| | 2 | 0–5 | Near IP clock. |\n| Torben Loyalty | **7** | 0–7 | Active from game start. No IP trigger. On Crown elimination: Torben Loyalty track transfers to Löwenritter (they inherit the succession claim). Löwenritter wins or loses Torben via Influence actions the\
    \ same way Crown did. Church and Hafenmark may contest via Senator Outward Diplomacy (Ob = current Torben Loyalty ÷ 2). (PP-599: start 7, range 0–7. PP-498 start 3 superseded.) |\n| Elske Loyalty | 4 | 0–7 | Off-board card near T4. |\n| Löwenritter Autonomy | Loyal | Loyal→Restless→Autonomous→Split | Graduated autonomy (conflict_architecture_proposal). Replaces binary Coup Counter. See below. |\n\n#### Löwenritter Graduated Autonomy (replaces Coup Counter)\n\n| Stage | Trigger | T14 Status | Crown Effect |\n|-------|---------|------------|--------------|\n| **Loyal** | Start | S014 Barracks answers to Crown via Ehrenwall. Garrison deployable. | Normal. Crown controls T14 fully. |\n| **Restless** | Crown Stability ≤ 3, OR no military action 4+ seasons, OR Crown loses a province | S014 follows Löwenritter orders for defensive actions. Crown +1 Ob offensive deployment. | Fragmentation checks at T14 Ob +1. |\n| **Autonomous** | Crown Stability ≤ 2, OR Ehrenwall Disposition toward Almud <\
    \ 0, OR 4+ seasons Restless without resolution | S014 does not respond to Crown. T14 garrison under Ehrenwall exclusively. Crown retains sovereignty claim. | Crown Military reduced by T14 garrison. Cannot access Fort 3. PI −1. |\n| **Split** | Crown attacks Löwenritter, OR Crown eliminated, OR 4+ seasons Autonomous without resolution | T14 becomes Löwenritter territory. Löwenritter = separate faction (L3/PS3/Inf2/W3/Mil5/Stab5). PI −3. | Crown Military drops to 2 AND loses most units. Crown loses T14, PV drops by 3. Löwenritter negotiates independently. |\n\n| **Coup** | Löwenritter loses faith in monarch AND has candidate (Torben, Elske, or a Duke with Löwenritter support) | T14 under Löwenritter. Crown faction SUSPENDED. Löwenritter installs new monarch. | If Torben/Elske/Lenneth installed: Crown resumes under new monarch; Löwenritter recedes into Crown military arm. If Duke (Vaynard/Baralta) installed: Crown absorbed into that Duke's faction; Crown ceases as independent faction. Löwenritter\
    \ recedes into new monarch's military. Crown Military was 5 only because it WAS Löwenritter — without them, Crown Military = 2. |\n\n**Reversal:** Stages 1–3 reversible. Crown can return to Loyal by: raising Stability above 3, conducting military action validating Löwenritter identity, or improving Ehrenwall Disposition through diplomatic engagement. Stage 4 (Split) is irreversible without reconquest.\n| Warden Cooperation (WC) | 0 | 0–3 | Peninsula-wide. WR ≥ 2 required to advance. (PP-605) |\n| Warden Recognition (WR) | 0 | 0–3 | Varfell-only private track. Gates WC. (PP-605) |\n| Turmoil (= Strain) | 0 | 0–10 | Public. Also called \"Strain\" in peninsular_strain docs and phases.md §4d. Advances from inter-faction battles (+1/season), faction eliminations (+2), revolts (+1). Decays −1/peaceful season. See peninsular_strain_v1.md §4. |\n\n**Accord (per-territory attribute, range 0–3):** Tracks population acceptance of controller. Modifies effective Prosperity. Accord ≥ 2 required for\

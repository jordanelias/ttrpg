    # params_scale_transitions.md — Scale and Mode Transitions


    ## Scale Table

    | Scale | Example | Base Ob | Min Thread Sensitivity | Coherence auto-cost |

    |-------|---------|---------|--------|-------------------|

    | Object | One item, one wound | 1 | 30+ | 0 |

    | Personal | One person | 2 | 30+ | 0 |

    | Relational | Small group, social agreement | 3 | 50+ | −1 |

    | Territorial | A duchy, a district | 4 | 50+ | −1 |

    | Structural | A kingdom, an institution | 5+ | 70+ | −2 |


    ## Eight Handoff Rules

    | Transition | Rule |

    |-----------|------|

    | Personal → Thread | Leap triggers. Contact duration starts on round Leap succeeds. |

    | Personal → Faction | Game Master recognises faction scope. Personal Ob resolves first, Domain Action Ob second. Same roll. |

    | Personal → Scene | Personal roll may serve as opening move or Appeal in a social scene. |

    | Scene → Faction | Successful Appeal/Debate at sufficient scope → Domain Echo (faction attribute change). No extra roll. |

    | Thread → Faction | Thread op targeting faction-level config resolves as Domain Action. Thread pool, appropriate Ob. No extra roll. |

    | Thread → Mass | Combat ops: Phase 2 (before Engagement). Support ops: Phase 5 (Cascade). Both declared Phase 1. |

    | Mass → Personal | Personal Action available at Phase 5 (Priority 8). Limit: 1 exchange/battle turn. General''s Phase 5 consumed until personal combat resolved (Command (PP-232) suspended). |

    | Scene -> Mass | Social win: +1D to relevant unit Command this turn. Investigation win: +1D first Volley. Combat win: one free Reform action. Modifier to most relevant unit; 1 turn only. (PP-261/ED-151) |


    ## Domain Echo Rules (PP-108/PP-109)


    **Amount:** Faction stat change = +1 per degree above Partial.

    - Success: +1 to most relevant stat (per audit Q5 per-mechanic: L for procedural-political issues, PS for populist-political issues; Influence for social; Military for combat)

    - Overwhelming: +2

    - Cap: ±2 per scene. [PROVISIONAL — pre-ledger, accepted as canonical per 2026-04-26 audit]


    **Timing by mode:**

    - Full TTRPG (Register Shift): Domain Echo fires immediately at scene end. No extra roll.

    - Hybrid (Zoom In active): Domain Echo queues; fires at next BG Seasonal Accounting.


    **Intentional design (PP-109):** The timing difference is by design. Zoom In is a personal intervention in a strategic situation. Faction consequences propagate through seasonal accounting (not instantly) to prevent real-time manipulation of BG stats from personal scenes. This is documented here as an intentional mode asymmetry.


    **Multiple Domain Echoes (same scene):** Fire in the order they occurred in the scene. Each applies independently; cap resets per stat per Echo (not per scene total). [PROVISIONAL — pre-ledger, accepted as canonical per 2026-04-26 audit]


    **Known gap (ED-IN-0025, 2026-07-07, C-VERIFY-12):** all Domain Echo caps here and in `scale_transitions_v30.md` §5 are *per-scene-per-faction* (PP-329); there is **no season-level aggregate ceiling**, so a faction generating many qualifying scenes in one season can stack Echoes without limit. Whether a season cap is warranted is not adjudicated — flagged for Stratum B/E balance review (mirrors the design-doc note).


    **Debate outcome → Domain Echo:** Piety Track ≥7 (winner) queues +1 to winner''s faction in the contested axis (L for procedural debates, PS for populist debates per audit Q5). ≤3 queues −1 to loser''s faction in the same axis. [PP-108]


    **Composed keying (ED-SC-0002, Jordan ruling 2026-07-08):** this band mapping supplies the **magnitude** (Total → ±2, Decisive → ±1, Compromise → none); `social_contest_v30 §6`''s won-**genre** selects the **stat/channel** (Memory → Mandate/L; Projection → the outward-initiative channel / I). The two compose — neither supersedes the other. Sim realization: `sim/cross_scale/parliamentary_bridge.py` + `sim/cross_scale/domain_echo.py`.


    **Citation hygiene (ED-IN-0016, 2026-07-08):** `scale_transitions_v30.md` §4.3.2''s "Rank Advancement Recognition Event" row cited the dead `faction_politics_expanded_v1.md`, now repointed to its promoted successor `designs/provincial/faction_politics_v30.md` (PP-660). That same row''s "creating a debt scene per §1" clause cites a mechanic that does not exist in the promoted doc — flagged, not authored or struck, as **ED-IN-0030** (needs_jordan: author it or strike the clause).


    ## Mass→Personal Register Shift Rules (PP-111)


    One mass combat turn = one personal combat exchange. If general''s duel is unresolved after one exchange, it continues into the next turn''s Phase 5. The general''s unit loses CR bonus (effective CR 0) each turn the general is in personal combat. Maximum 5 exchanges before forced disengage or incapacitation. General''s Phase 5 consumed until combat resolved.


    ## Scope Shift

    Once per round, declared at turn start. No roll.

    Second scope action in same round: +1 Inspiration spend.


    ## Mode Tags (for simulation tagging)

    TTRPG / BG / Hybrid

    Transition points requiring explicit procedure definition:

    - TTRPG → BG: session boundary; faction stats carry over; personal character stats suspended

    - BG → Hybrid: mid-game zoom-in; personal characters enter board state

    - Hybrid → TTRPG: zoom-out; board state updated from personal scene results

    Phase-Lock Protocol (PP-103): legal Zoom In entry points are After Phase 1, After Phase 3, After Phase 6 Step 1. See state_transfer_spec.md for full variable inventory.

    Phase 6 continuation: Steps 2–6 resolve after Zoom Out using updated state (PP-110).

    Non-battle Zoom In: fires at end of current Domain Action being resolved (full procedure pending ED-073).

    ## Sufficient Scope — Register Shift Trigger (ED-074 resolved — provisional)

    A personal scene qualifies as faction-scope (triggering Scene→Faction Domain Echo) when it involves at least one of:

    1. A named faction leader or their designated representative

    2. A direct challenge to a faction''s institutional authority (not personal reputation)

    3. An action that would normally require a Domain Action roll (treaty negotiation, formal accusation, territorial claim)

    4. A Thread operation targeting a faction-level configuration (Relational+ scale)

    Personal conflicts (brawls, private debates, social introductions) are personal scope only.

    GM makes final scope determination. [PROVISIONAL — pre-ledger, accepted as canonical per 2026-04-26 audit]


    ## Domain Echo — Debate Outcome Mapping (PP-108 extension)

    Debate Piety Track outcomes map to Domain Echo as follows:

    | Outcome | Domain Echo |

    |---------|------------|

    | Track ≥ 7 (winner''s side) | Winner faction: +1 in contested axis (L procedural / PS populist) or other relevant stat. Loser faction: −1 L if they held institutional authority on the issue (audit Q3 institutional-failure pattern). |

    | Track 4–6 (compromise) | No Domain Echo. Scene-level consequence only (GM narrative). |

    | Track ≤ 3 (loser''s side) | See Track ≥ 7 reversed. |

    [PROVISIONAL — PP-108]

    '
  engine/params/southernmost.md: '<!-- version: v1.0 | source: designs/setting/southernmost_v30.md | last_updated: 2026-04-13 -->

    <!-- PATCHES APPLIED: PP-643 (SIM-STH-E1 2026-04-13) — combined TT reduction cap (−5/season) for Southernmost operations -->

    <!-- SIM STATUS: VERIFIED — forgetting checks, expedition Obs, ritual Ob calibrated -->


    # params_southernmost.md — Southernmost Mechanics


    ## Zone Types

    | Zone | Thread State | Primary Hazard |

    |------|-------------|----------------|

    | Snapped | Maximum tension | Objects crumble; configurations disrupt |

    | Locked | Frozen at catastrophe moment | Configuration instability; Truth drain |

    | Oscillating | Continuous cycling | Gap formation; monstrous entities |


    ## Forgetting Check

    Pool: Cognition + Recall. TN 8.

    TS bonus: TS ÷ 20 (round down) additional dice.

    | Exposure | Ob |

    |----------|-----|

    | Boundary zone < 1 hour | 1 |

    | Interior 1–4 hours | 2 |

    | Deep interior 4+ hours | 3 |

    | Einhir core sites | 4 |


    Degree outcomes:

    | Degree | Retention |

    |--------|-----------|

    | Overwhelming | Full facts + TS 40+ retains ontological understanding |

    | Success | Facts retained; threat context partially dissolved |

    | Partial | Emotional impressions only |

    | Failure | Nothing operational |


    Testimony Ob penalty (non-practitioners using Southernmost knowledge in Appeals/Debates):

    | Exposure depth | Ob penalty |

    |----------------|-----------|

    | Boundary | +1 |

    | Interior | +2 |

    | Deep interior / Core | +3 |


    Probability reference (7D base, TN8):

    | Ob | P(Retain facts) | P(Emotional only) | P(Nothing) |

    |----|---------------|-------------------|-----------|

    | 1 | 76% | 0% | 24% |

    | 2 | 60% | 15% | 24% |

    | 3 | 43% | 33% | 24% |

    | 4 | 27% | 49% | 24% |


    ## Southernmost Awareness (Faction Stat)

    Scale: 0–7 (or 0–10 for research-intensive factions).

    Starting values: see params_factions_ttrpg.md.

    Gate: [NAME-PENDING: ED-048] Ritual without Awareness 5+ → +2 Ob.


    ## Expedition Prerequisites

    - Thread Tension ≥ 40

    - Practitioner officer TS 30+

    - Planning roll: relevant History, Ob 3

    - Resources: Ob 3

    - Military escort: recommended (1+ unit)


    ## Expedition Procedure — Multi-Season Extended Action

    | Season | Phase | Key Roll |

    |--------|-------|---------|

    | 1 | Approach | Escort Discipline Ob 1; practitioner Discovery Event |

    | 2 | Exploration | Three zones; one encounter per zone |

    | 3 | Discovery | Diagnosis: TS 50+ auto; below TS 50: Ob 3 |

    | 4+ | Repair (optional) | Extraordinary Repair Weaving Ob 3 |


    ## Zone Hazard Table

    | Zone | Hazard | Roll | Ob | Fail consequence |

    |------|--------|------|----|-----------------|

    | Border (Snapped) | Shifting Objects | Weave or Agi | 2 | 1 Wound/character |

    | Inner (Oscillating) | Monstrous entity | Combat | varies | Gap open, TT +2 |

    | Core (Locked) | Config instability | Spirit (non-practitioners) | 2/round | Truth −1 |


    Core zone: Contact duration halved for practitioners.


    ## [NAME-PENDING: ED-048] Ritual

    Requirements: ED-048 Text in possession; Awareness 5+ (else +2 Ob); lead TS 60+; 2 participants TS 20+; 1 season prep.

    Roll: Weaving pool, Ob 5. Each participant TS 20+: +1D (max +4D bonus).

    | Degree | Result |

    |--------|--------|

    | Overwhelming | Permanent stabilisation. TT −10. Southernmost settleable. |

    | Success | Temporary. TT −6. Accessible 5 seasons. Re-attemptable. |

    | Partial | TT −3. Forgetting Ob −1 permanent. Lead cannot retry; new lead required. |

    | Failure | TT +8. Mode 3 entity at primary site. Lead Incapacitated. |


    Probability reference (lead 18D + participants):

    | Participants | Total pool | P(Success+) | P(Overwhelming) |

    |-------------|-----------|------------|----------------|

    | 0 | 18D | 80% | 42% |

    | 2 | 20D | 87% | 53% |

    | 4 | 22D | 92% | 63% |


    ## Extraordinary Repair Weaving

    Requirements: Awareness 8+; expedition reaching primary site complete; practitioner TS 50+ assigned to Research.

    Research roll: Recall + Einhir Scholar History, Ob 4.

    Repair roll (each season): Weaving pool, Ob 3. −1D Core zone contact penalty.

    | Degree | TT change | Other |

    |--------|-----------|-------|

    | Success/Overwhelming | TT −2 permanent | Awareness +1 |

    | Partial | TT −1 | Practitioner CD +1 |

    | Failure | TT +1 | CD +2 |


    After 4-5 successful seasons: Southernmost fully stabilised.


    ## Combined TT Reduction Cap (SIM-STH-E1, PP-[NEXT])

    <!-- PATCH: SIM-STH-E1 applied 2026-04-13 -->

    Combined TT reduction from Southernmost operations (Ritual + Extraordinary Repair): max −5 per season.

    Rationale: without cap, simultaneous Ritual + Repair can remove up to −12 TT/season,

    enabling one-season resolution of the campaign''s central threat. Cap preserves campaign tension.


    ## Crisis Timeline

    | Trigger | Event |

    |---------|-------|

    | TT 50 | Outer winding strain — visible faction event fires; player warning |

    | TT 50 sustained 3 seasons without stabilising Weave | Cracking begins — TT +1/season from Southernmost |

    | Cracking 3+ seasons without Ritual attempt | Outer winding fails — TT +2/season, permanent until Ritual succeeds |


    Stabilising Weave (pause cracking, not reverse): Ob 3, TS 40+, practitioner.



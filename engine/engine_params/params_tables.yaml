  engine/params/bg/faction_actions.md: "\n\n<!-- [SUPERSEDED 2026-04-19] CULTURAL REFORMATION STRUCK + VTM STRUCK -->\n<!-- Per Jordan decision 2026-04-19 (session): Cultural Reformation was incompatible with Vaynard's identity. -->\n<!-- Vaynard is a military conqueror. He does not convert populations ideologically. Varfell expansion is purely military. -->\n<!-- VTM (Vaynard Thread Mastery) was also STRUCK — placeholder mechanic with no canonical advancement. -->\n<!-- Tribune intel (reveals enemy stats for target selection) remains. Thread operations remain as personal-scale actions -->\n<!-- available to Varfell first due to southern TS baseline + RM proximity, NOT as BG-layer combat/territorial bonuses. -->\n<!-- See commits: 297f892 (engine), 13b8f30 (workplan), 13b8f30 (canon audit workplan). -->\n<!-- [CORRECTED 2026-05-29, ED-880] The \"purely military / does not convert populations ideologically\" framing above is SUPERSEDED. The 2026-04-19 strike validly removed VTM-dependent\
    \ Cultural REFORMATION (VTM remains struck); conviction_track_v30 reintroduced ideological conversion VTM-free as Cultural RECLAMATION (Varfell: Influence vs Ob 2; target-territory Piety/PT -1 toward Einhir Restoration) — a non-military Piety-ALIGNMENT action, NOT a control transfer and NOT a victory path. Per GD-1 the sole victory path for all factions is Peninsular Sovereignty. See params/bg/core.md and registers/supersession_register.yaml. -->\n\n## Faction Unique Actions — Board Game (PP-428–442, 2026-04-07)\n<!-- PATCHES APPLIED: PP-428–442 + PP-431-COR + PP-441-COR -->\n<!-- Status: applied -->\n\n### Church — Piety Spread (PP-428)\n**Type:** Consul Inward (Church only). **Prerequisite:** AP ≥ 1.\nRoll: L vs Ob = floor(controlling faction L / 2) + 1 + Fort Level.\nDoctrine-aligned territory: −1 Ob.\n**Post-CI 75:** Range-limited to adjacent territories only.\n\n| Degree | Effect |\n|--------|--------|\n| Overwhelming | PT +1 in territory + AP +1 |\n| Success | PT +1 in territory\
    \ |\n| Partial | AP +1 |\n| Failure | Stability −1 |\n\n---\n\n### Church — Active Inquisition (PP-429)\n**Type:** Senator Inward (Church only).\nRoll: L vs Ob = floor(territory Stability / 2) + 1.\n**First Inquisitor threshold:** AP ≥ 3 (ED-322 confirmed). Second: AP ≥ 6.\n\n| Degree | Effect |\n|--------|--------|\n| Overwhelming | AP +3 + immediate Inquisitor deployment if at threshold |\n| Success | AP +2 |\n| Partial | AP +1 |\n| Failure | AP −1 + Stability −1 |\n\n**Sustained AP (≥ 8 sustained across Accounting):** Territory Stability −1 at Accounting.\n\n---\n\n### Church — Cardinal Focus (PP-430)\n**Timing:** Phase 1 declarative. No cost. Once per season.\nDesignate one Cardinal as Focused:\n\n| Cardinal | Focus Effect |\n|----------|--------------|\n| Fortitude | Templar deploys without Legionary card this season |\n| Justice | AP threshold for first Inquisitor −1 this season |\n| Prudence | Wealth +1 (integer) this season |\n| Temperance | Altonian diplomacy action available\
    \ this season |\n\n**Schism interaction:** Schisming Cardinal ignores Focus. Focus has no effect if the designated Cardinal is in schism this season.\n\n---\n\n\n### Church — Ecclesiastical Appointment (PP-TBD)\n**Type:** Consul Outward (Church only).\n**Prerequisite:** Target settlement has Church building ≥ tier 2 (Church or Cathedral).\nTarget settlement has no governor OR existing governor Disposition toward Church ≥ +2.\n**Roll:** Influence vs Ob 1.\n\n| Degree | Effect |\n|--------|--------|\n| Overwhelming | Church bishop-governor installed. Settlement governance transfers to Church. Accord +1 in settlement (population accepts — bishop was already the de facto authority). PT +1 in territory. |\n| Success | Church bishop-governor installed. Settlement governance transfers to Church. Accord unchanged. |\n| Partial | Appointment contested. Governor remains. Church Stability −1 (institutional embarrassment). PT unchanged. |\n| Failure | Appointment rejected. Controlling faction gains\
    \ awareness of Church governance ambition. No Casus Belli generated (appointment is non-military). |\n\n**Notes:**\n- Does NOT generate Casus Belli (non-military institutional action).\n- Province fractionalizes if settlement controller now differs from Seat holder.\n- Fragmentation checks fire at next Accounting for affected province.\n- This action is the pre-Seizure accumulation path. Mass Seizure at CI 60+ remains\n  the formal political formalization of settlement-level Church governance.\n\n---\n\n### Hafenmark — Parliamentary Challenge (PP-431 + PP-431-COR)\n**Type:** Senator Inward (Hafenmark only). **Once per season.**\nRoll: L vs Ob 2 (−1 Ob if PI ≥ 5 → Ob 1 minimum).\n\n**PP-431-COR:** In any season Hafenmark plays Parliamentary Challenge, structural CI suppression (Baralta's L ≥ 4 automatic −1/season) does NOT fire. Challenge replaces structural — the replacement triggers on card play regardless of roll outcome.\n\n| Degree | Effect |\n|--------|--------|\n| Overwhelming\
    \ | CI −2 + Church must Uphold or Appease |\n| Success | CI −1 |\n| Partial | Stability −1 |\n| Failure | Stability −1 + Church L +1 |\n\n---\n\n### Hafenmark — Parliamentary Session (PP-432)\n**Type:** Senator Outward (Hafenmark only). **Once per arc.**\nAll factions vote (Support / Oppose / Abstain). Ministry vote = Support if AP-token in T1.\nBlocking factions generate Resentment tokens per PP-405.\n\n| Outcome | Effect |\n|---------|--------|\n| Majority Support | PI +1 + Hafenmark L +1 |\n| Majority Oppose | Hafenmark Stability −1 |\n| Tie | CI +1 (institutional paralysis) |\n\n**Diplomatic Token interaction (PP-320-ED):** Each active Diplomatic Token on a faction mat counts that faction as Support regardless of declared vote.\n\n---\n\n### Hafenmark — Diplomat Card (ED-320 RESOLVED)\n**Type:** Senator Outward. **Card type:** Hafenmark faction card. **Once per season.**\nRoll: Influence vs Ob = floor(target L / 2) + 1.\n**Restriction:** Cannot target Church if PI < 3.\n\n| Degree\
    \ | Effect |\n|--------|--------|\n| Overwhelming | Place 1 Diplomatic Token on target mat + target Stability +1 + PI +1. Target faction's actions against Hafenmark: +1 Ob this season and next. |\n| Success | Place 1 Diplomatic Token on target mat + PI +1 |\n| Partial | PI +1 (no Token) |\n| Failure | Hafenmark Stability −1 |\n\n**Diplomatic Token (PP-517/521):** Permanent marker on target faction mat. Removed on: (a) military conflict with Hafenmark — any season either faction plays Legionary targeting the other's held territory (intent of play; March to uncontested territory excluded); (b) target faction elimination; (c) Formal Crown Treaty formed with the token-holding faction (PP-521). Maximum 1 per faction mat. Public. Token effects: target faction counts as Support in Parliamentary Sessions. Token effect suspended while token-holding faction is in submitted (vassal) state or has PS 0 from submission. (PP-559 / ED-373)\n\n---\n\n### Crown — Royal Charter (PP-433)\n**Type:** Consul\
    \ Inward (Crown only).\nRoll: L vs Ob = floor(territory Prosperity / 2) + 1. Virtue: −1 Ob.\n**Limit:** Max floor(L / 2) + 1 active Charters simultaneously.\n\nSuccess: Territory becomes Crown Charter Territory:\n- All factions: Govern/Trade −1 Ob\n- Church Seizure: +1 Ob\n- Crown own actions: −2 Ob\nCharter dissolves on control transfer.\n\n---\n\n### Crown — Royal Decree Enhancement (PP-435)\n**Type:** Special/Unique Power. Ob 2. Once per season (existing mechanic).\n**Enhancement (Overwhelming only — net ≥ 2×Ob AND ≥ 3):**\nChoose one:\n(a) Stat ±2 to one faction\n(b) Stat ±1 to two different factions\n(c) Stat ±1 to one faction AND suspend one threshold effect for one season\n\nSuccess (unchanged): Stat ±1 to one faction. Consecutive: +1 Ob/season.\nCannot target Intel.\n\n---\n\n### Crown — Thread Liaison (PP-436)\n**Timing:** Phase 1 declarative. No roll.\nCrown designates one allied faction. Liaison's Thread operations in Crown-held territories count toward Crown's co-victory\
    \ RS threshold tracking.\n**Allied definition:** Active Treaty partner OR same-side Parliamentary Session voter OR common Resentment target.\n\n**Thread Liaison 'Allied' scope (PP-520):** For Thread Liaison designation only, 'Allied' = Active Crown Treaty partner. Parliamentary voter and Resentment conditions do not qualify for Liaison designation.\n**Dissolves on:** Military conflict between Crown and Liaison.\n**Dissolution timing (ED-372):** Prospective only. Thread operations already credited before dissolution remain valid. Future operations after dissolution provide no Liaison benefit.\n\n---\n\n### Crown — Diplomatic Outreach to Schoenland (PP-437)\n**Type:** Senator Outward (Crown only). Cannot use same season as Formal Crown Treaty.\nRoll: Influence vs Ob 2. Virtue: −1 Ob.\n**Fragmentation modifier:** +1 Ob if 3+ factions have Stability ≤ 2. *(PP-562: was +2 — punished Crown most when Decree most needed)*\n\n| Degree | Effect |\n|--------|--------|\n| Overwhelming | IP −2 |\n\
    | Success | IP −1 |\n| Partial | IP −0.5 |\n| Failure | no effect |\n\n---\n\n### Varfell — VTM Discretion — STRUCK (PP-664, 2026-04-19)\n\nVTM Discretion dissolved with VTM track (PP-663). Varfell no longer has a Thread-scaled CI suppression action at faction scale. Opposing Thread operations are handled at character scale per `threadwork_v30 §2.6` (PP-632 Opposing Operations) — any faction with a practitioner can contest an opponent's Thread operation; this is no longer Varfell-specific.\n\n**Replacement for VTM CI contribution:** struck. With VTM track dissolved, there is no \"publicly visible VTM tier\" to generate Church pressure. Church pressure on Varfell now accrues through standard means: Heresy Investigation (`faction_actions §Church`), Niflhel-derived Church Attention Pool (`params/bg/tracks §Church AP`), and territorial Piety Track drift.\n\n---\n\n### Varfell — Revelation Tokens / Path A (PP-439)\n**Full reveal criteria:** Overwhelming result on Tribune Investigate OR 4\
    \ consecutive PC Spy successes.\nOn full reveal: place Revelation Token on target faction mat (public, permanent).\n**Path A condition:** Two Revelation Tokens on two different rival faction mats = \"fully revealed\" condition met.\nTarget faction knows they've been revealed (public token).\n\n---\n\n### Varfell — Ethical Framework (PP-440)\n**Consequentialism −1 Ob applies to:**\n- Tribune Intel actions (Investigate, Spy, Counter-Narrative) [PP-664: VTM-building struck with VTM track]\n\n**+1 Ob penalty applies to:**\n- Public ideological campaigns\n- Open diplomatic commitments\n- Relationship investments with no Intel yield\n\n---\n\n### Varfell — Counter-Narrative (PP-441 + PP-441-COR)\n**Type:** Tribune Outward (Varfell only). Target = Church-held or Church-prominent territory.\nChurch-prominent = Church global L > controlling faction global L (assessed at action declaration).\nRoll: Intel vs Ob = floor(Church L / 2) + 1. Consequentialism: −1 Ob.\n**+2 Ob modifier:** If territory\
    \ has an active Inquisitor (applies to all Tribune Intel actions).\n\n| Degree | Effect |\n|--------|--------|\n| Overwhelming | CI −0.5 + AP +2 in territory |\n| Success | AP +2 in territory |\n| Partial | AP +1 |\n| Failure | Intel network exposed: Church notified of Varfell presence, AP +1 tagged as Varfell (+2 Ob to Counter-Narrative in this territory next season) |\n\n**CI tracking:** Fractional CI values accumulate. Track running decimal on CI track. Round to integer for threshold checks only.\n**AP note (ED-325):** AP is tracked per-territory (PP-185). Counter-Narrative AP in a territory contributes to that territory's AP pool, not a global pool. Inquisitor deploys in the territory where threshold is crossed.\n\n---\n\n### Counter-Intelligence Postures (PP-442)\nAll three are passive faction abilities (no card required, no roll):\n\n**Crown — Royal Guard** (Phase 4, Priority 1 — fires before all other Phase 4 actions):\nOnce per season, cancel one successful Intel action targeting\
    \ Crown. No card cost.\n\n**Hafenmark — Procedural Objection:**\nOn any Varfell Tribune Investigate success, Hafenmark may declare Procedural Objection. Cost: consumes Parliamentary Challenge use for this season (if Challenge already used: cannot declare Objection). Effect: if Hafenmark L ≥ 4, revealed stat is replaced with a false value for all non-Varfell observers. Varfell sees true value; others see false.\n\n**Church — Sanctuary Extension:**\nExisting Sanctuary card: extended to also block Varfell 4-PC Spy action once per season (in addition to existing Sanctuary effects).\n\n---\n\n## Dynastic Proclamation (Hafenmark only) — PP-649, peninsular_strain_v30.md §5.3\n\n**Card:** Diplomat (Hafenmark faction card). Once per season.\n**Pool:** Influence.\n**Ob:** floor(target faction Stability / 2) + 1. +1 Ob if target territory PT ≤ 1. −1 Ob if Diplomatic Token on target faction.\n**Prerequisites:** Hafenmark L ≥ 4. Hafenmark L > target controller L. Target adjacent to Hafenmark territory.\n\
    \n| Degree | Effect |\n|--------|--------|\n| Overwhelming | Territory transfers. Accord 2. Target L −1. Hafenmark L +1. +1 Standing. No CB. |\n| Success | Territory transfers. Accord 2. Target L −1. |\n| Partial | No transfer. Hafenmark gains CB vs target. Target territory Accord −1. |\n| Failure | Hafenmark Stability −1. |\n\n**Defensive:** Target may invoke Institutional Mandate (PP-189) if L ≥ 4 to cancel (per audit Q2: institutional → L).\n\n---\n\n## Cultural Reformation (Varfell only) — STRUCK (PP-664, 2026-04-19; supersedes PP-650, peninsular_strain_v30.md §5.4)\n\nCultural Reformation dissolved per CR-STRIKE-2026-04-19 (supersession_register). The VTM-dependent Reformation mechanic was incompatible with Vaynard's identity as military conqueror; VTM remains struck.\n\n**Replacement (corrected per ED-880, 2026-05-29):** the \"military-only\" framing is superseded. Reformation/VTM stay struck, but conviction_track_v30 reintroduced ideological conversion VTM-free as **Cultural Reclamation**\
    \ (Varfell: Influence vs Ob 2; target-territory Piety/PT −1 toward Einhir Restoration) — a non-military Piety-ALIGNMENT action, NOT a territory-control transfer and NOT a victory path. Per GD-1 the sole victory condition for all factions is Peninsular Sovereignty. See `params/bg/core.md` §Cultural Reformation and `registers/supersession_register.yaml`. Character-scale Thread operations remain available per `threadwork_v30` but do not transfer territory.\n\n---\n\n## Martial Governance (Löwenritter only) — PP-653, peninsular_strain_v30.md §2.6\n\n**Card:** Legionary (Govern variant).\n**Pool:** Military (not Influence).\n**Ob:** floor(Prosperity / 2) + 2 (harder than standard Govern).\n**Effect:** Accord +1 on Success (cap 2 via Martial Governance — Accord 3 requires standard Govern with Influence).\n"
  engine/params/bg/geography.md: "## Ducal Geography — RESOLVED (ED-107)\nCanonical geography applied. 17 territories per geography_v30.md. See Territory Table below.\nAll faction starting positions reflect canonical geography. Old v04 map assignments fully superseded.\n\n## Territory Table — Canonical (geography_v30.md)\n17 territories. Faction ownership per geography_v30.md. Fort levels, Prosperity (Pros), and special properties listed.\n\n| T# | Territory | Faction | Fort | Pros | Special |\n|----|-----------|---------|------|------|---------|\n| T1 | Valorsplatz | Crown ★ | 2 | 6 | Kingdom capital. Parliament seat. Ministry AP-token. Sea connection to T16 (Schoenland). |\n| T2 | Kronmark | Crown | 1 | 4 | Crown heartland. Adjacent to T1, T3, T9, T14. |\n| T3 | Lowenskyst | Crown | 3 | 3 | Border fortress. Fort max 4. Adjacent to T2, T9, T17. |\n| T4 | Grauwald | Varfell | 0 | 3 | Highland timber. Adjacent to T7, T12, T14. Proximity 3 (Calamity Radiation). |\n| T5 | Feldmark | Crown |\
    \ 0 | 5 | Crown breadbasket. +1 Pros/season uncontested. Adjacent to T1, T6, T14. Proximity 2 (Calamity Radiation). |\n| T6 | Stillhelm | Crown | 0 | 2 | Southern farmland. Southernmost Access point — Expedition into T15 staged from here. Non-Thread orders +1 Ob (frontier terrain). Proximity 1 (Calamity Radiation). Adjacent to T5, T13, T15. |\n| T7 | Rendstad | Hafenmark | 0 | 4 | Timber valley. Adjacent to T4, T8. |\n| T8 | Gransol | Hafenmark ★ | 1 | 5 | Hafenmark capital. Garrison: Muster +1D. Adjacent to T7, T9, T10, T17. |\n| T9 | Himmelenger | Church ★ | 2 | 5 | Cathedral city. Church starts here. CI +1/season Church controls. Church Unique Power −1 Ob. Adjacent to T2, T3, T8, T14, T17. |\n| T10 | Spartfell | Hafenmark | 2 | 3 | Border castle. NE Altonian pass. Invasion Pressure (IP) events fire here first. Adjacent to T8, T11. |\n| T11 | Halvardshelm | Varfell | 0 | 5 | Central fjords. Breadbasket +1 Pros/season uncontested. Muster Ob −1. Guilds CP-token. Adjacent to T10, T12.\
    \ |\n| T12 | Sigurdshelm | Varfell ★ | 1 | 3 | Varfell Seat. Niflhel Black Market: Trade +1 Ob, Niflhel Covert −1 Ob. Adjacent to T4, T11, T13. Proximity 2 (Calamity Radiation). |\n| T13 | Oastad | Varfell | 0 | 3 | Southern fjords. Einhir ruins: Restoration Weaving −1 Ob. Adjacent to T6, T12, T15. Proximity 1 (Calamity Radiation). |\n| T14 | Ehrenfeld | Crown | 3 | 4 | Military hinge. Central fortress. Fort max 4. Löwenritter garrison. Martial Law −1 Ob. Adjacent to T1, T2, T4, T5, T9. Proximity 3 (Calamity Radiation). |\n| T15 | Askeheim | Uncontrolled | 0 | 1 | The Southernmost. Epicentre. Warden domain. Not a normal territory — cannot be controlled by any faction. See §Southernmost Access System. Adjacent to T6, T13. Proximity 0 (Calamity Radiation). |\n| T16 | Schoenland | Neutral NPC | 1 | 5 | Maritime island. Sea connection to T1 (Valorsplatz). Altonian Trade. IP ≥ 75: Vanguard deploys. Proximity 4 (Calamity Radiation). |\n| T17 | Halvarshelm | Hafenmark | 0 | 3 | Northern mines.\
    \ Adjacent to T3, T8, T9. Proximity 5 (Calamity Radiation). |\n\n★ = faction capital.\n\n### Spiritual Weight (SW) — Territory Attribute (tc_political_redesign_v30 §1)\n\nSW is a fixed attribute per territory representing ecclesiastical importance. Pre-printed on territory cards. SW gates CI generation (Piety Yield weighting), Church political pool, and PT momentum.\n\n| T# | Territory | SW | Rationale |\n|----|-----------|-----|-----------|\n| T1 | Valorsplatz | 2 | Seat of secular power; Church present but contested |\n| T2 | Kronmark | 2 | Crown heartland |\n| T3 | Lowenskyst | 2 | Border fortress |\n| T4 | Grauwald | 1 | Highland, limited Church presence |\n| T5 | Feldmark | 2 | Breadbasket |\n| T6 | Stillhelm | 1 | Southern farmland, Calamity-proximate |\n| T7 | Rendstad | 2 | Timber valley |\n| T8 | Gransol | 3 | Trade city, strong Church commercial presence |\n| T9 | Himmelenger | 5 | Cathedral city, Church primary anchor |\n| T10 | Spartfell | 2 | Border castle |\n| T11 | Halvardshelm\
    \ | 1 | Fjords, minimal Church |\n| T12 | Sigurdshelm | 2 | Varfell seat |\n| T13 | Oastad | 1 | Southern fjords, minimal Church |\n| T14 | Ehrenfeld | 3 | Military stronghold, Church benediction tradition |\n| T15 | Askeheim | 0 | Calamity ground, Church presence impossible |\n| T16 | Schoenland | 1 | Island |\n| T17 | Halvarshelm | 2 | Northern mines |\n| **Total** | | **32** | |\n\n**SW use cases:** (1) Piety Yield: CI += Σ(PT tier × SW/5) per prominent territory. (2) Church political pool: += Σ(SW of prominent territories)/5. (3) PT momentum: +1D to PT change actions in SW ≥ 3 territories.\n\n\n\n### Spiritual Weight (SW) — Territory Attribute (tc_political_redesign_v30 §1)\n\nSW is a fixed attribute per territory representing ecclesiastical importance. Pre-printed on territory cards. SW gates CI generation (Piety Yield weighting), Church political pool, and PT momentum.\n\n| T# | Territory | SW | Rationale |\n|----|-----------|-----|-----------|\n| T1 | Valorsplatz | 2 | Seat of\
    \ secular power; Church present but contested |\n| T2 | Kronmark | 2 | Crown heartland |\n| T3 | Lowenskyst | 2 | Border fortress |\n| T4 | Grauwald | 1 | Highland, limited Church presence |\n| T5 | Feldmark | 2 | Breadbasket |\n| T6 | Stillhelm | 1 | Southern farmland, Calamity-proximate |\n| T7 | Rendstad | 2 | Timber valley |\n| T8 | Gransol | 3 | Trade city, strong Church commercial presence |\n| T9 | Himmelenger | 5 | Cathedral city, Church primary anchor |\n| T10 | Spartfell | 2 | Border castle |\n| T11 | Halvardshelm | 1 | Fjords, minimal Church |\n| T12 | Sigurdshelm | 2 | Varfell seat |\n| T13 | Oastad | 1 | Southern fjords, minimal Church |\n| T14 | Ehrenfeld | 3 | Military stronghold, Church benediction tradition |\n| T15 | Askeheim | 0 | Calamity ground, Church presence impossible |\n| T16 | Schoenland | 1 | Island |\n| T17 | Halvarshelm | 2 | Northern mines |\n| **Total** | | **32** | |\n\n**SW use cases:** (1) Piety Yield: CI += Σ(PT tier × SW/5) per prominent territory.\
    \ (2) Church political pool: += Σ(SW of prominent territories)/5. (3) PT momentum: +1D to PT change actions in SW ≥ 3 territories.\n\n\n\n\n\n## Starting Accord (peninsular_strain_v30.md §2.1)\n\n| T# | Territory | Controller | Accord |\n|----|-----------|-----------|--------|\n| T1 | Valorsplatz | Crown★ | 3 |\n| T2 | Kronmark | Crown | 2 |\n| T3 | Lowenskyst | Crown | 2 |\n| T4 | Grauwald | Varfell | 2 |\n| T5 | Feldmark | Crown | 2 |\n| T6 | Stillhelm | Crown | 2 |\n| T7 | Rendstad | Hafenmark | 2 |\n| T8 | Gransol | Hafenmark★ | 3 |\n| T9 | Himmelenger | Church★ | 3 |\n| T10 | Spartfell | Hafenmark | 2 |\n| T11 | Halvardshelm | Varfell | 2 |\n| T12 | Sigurdshelm | Varfell★ | 3 |\n| T13 | Oastad | Varfell | 2 |\n| T14 | Ehrenfeld | Crown | 2 |\n| T15 | Askeheim | Uncontrolled | — |\n| T16 | Schoenland | Schoenland | — |\n| T17 | Halvarshelm | Hafenmark | 2 |\n\nCapitals = 3 (Aligned). Home territories = 2 (Compliant). Accord ≥ 2 required for TCV contribution.\n\n## Starting Control\
    \ — Canonical (geography_v30.md)\n| Faction | Territories | Count | Starting TCV |\n|---------|------------|-------|-------------|\n| Crown | T1 Valorsplatz★, T2 Kronmark, T3 Lowenskyst, T5 Feldmark, T6 Stillhelm, T14 Ehrenfeld | 6 | 12 |\n| Hafenmark | T7 Rendstad, T8 Gransol★, T10 Spartfell, T17 Halvarshelm | 4 | 6 |\n| Varfell | T4 Grauwald, T11 Halvardshelm, T12 Sigurdshelm★, T13 Oastad | 4 | 6 |\n| Church of Solmund | T9 Himmelenger★ | 1 | 5 |\n| Löwenritter | T14 Ehrenfeld (shared with Crown pre-coup; full control on Coup trigger per PP-569) | shared → full |\n| Uncontrolled | T15 Askeheim | — | 0 |\n| NPC | T16 Schoenland | — | — |\n\n\n\n## Adjacency — Canonical (geography_v30.md)\n| Territory | Adjacent To |\n|-----------|------------|\n| T1 Valorsplatz | T2 Kronmark, T5 Feldmark, T14 Ehrenfeld, T16 Schoenland (sea) |\n| T2 Kronmark | T1 Valorsplatz, T3 Lowenskyst, T9 Himmelenger, T14 Ehrenfeld |\n| T3 Lowenskyst | T2 Kronmark, T9 Himmelenger, T17 Halvarshelm |\n| T4 Grauwald\
    \ | T7 Rendstad, T12 Sigurdshelm, T14 Ehrenfeld |\n| T5 Feldmark | T1 Valorsplatz, T6 Stillhelm, T14 Ehrenfeld |\n| T6 Stillhelm | T5 Feldmark, T13 Oastad, T15 Askeheim |\n| T7 Rendstad | T4 Grauwald, T8 Gransol |\n| T8 Gransol | T7 Rendstad, T9 Himmelenger, T10 Spartfell, T17 Halvarshelm |\n| T9 Himmelenger | T2 Kronmark, T3 Lowenskyst, T8 Gransol, T14 Ehrenfeld, T17 Halvarshelm |\n| T10 Spartfell | T8 Gransol, T11 Halvardshelm |\n| T11 Halvardshelm | T10 Spartfell, T12 Sigurdshelm |\n| T12 Sigurdshelm | T4 Grauwald, T11 Halvardshelm, T13 Oastad |\n| T13 Oastad | T6 Stillhelm, T12 Sigurdshelm, T15 Askeheim |\n| T14 Ehrenfeld | T1 Valorsplatz, T2 Kronmark, T4 Grauwald, T5 Feldmark, T9 Himmelenger |\n| T15 Askeheim | T6 Stillhelm, T13 Oastad |\n| T16 Schoenland | T1 Valorsplatz (sea) |\n| T17 Halvarshelm | T3 Lowenskyst, T8 Gransol, T9 Himmelenger |\n\n\n\n## Road Network — Canonical (geography_v30.md)\n\n### Primary Roads\n| Route | Territories |\n|-------|------------|\n| Crown Corridor\
    \ | T1 Valorsplatz — T5 Feldmark — T14 Ehrenfeld — T2 Kronmark |\n| Northern Arc | T2 Kronmark — T9 Himmelenger — T8 Gransol |\n| Eastern Coast | T1 Valorsplatz — T2 Kronmark — T3 Lowenskyst |\n| Western Highland | T14 Ehrenfeld — T4 Grauwald — T12 Sigurdshelm |\n\n### Secondary Roads\n| Route | Territories |\n|-------|------------|\n| Southern Approach | T5 Feldmark — T6 Stillhelm — T13 Oastad |\n| Fjord Route | T12 Sigurdshelm — T11 Halvardshelm — T10 Spartfell |\n| Hafenmark Interior | T8 Gransol — T7 Rendstad — T4 Grauwald |\n| Northern Mining | T8 Gransol — T17 Halvarshelm — T3 Lowenskyst |\n\n### Geographic Trade Notes\nSea routes: T1 (Valorsplatz) ↔ T16 (Schoenland). No land connection to Schoenland. No northern circumnavigation.\nHafenmark is fully landlocked — all maritime trade routes through Crown territory (T1 Valorsplatz or T3 Lowenskyst).\n\n### Altonian Mountain Passes\n| Pass | Connection | Notes |\n|------|-----------|-------|\n| NE Pass | T10 (Spartfell) ↔ off-map Altonia\
    \ | Primary invasion route. IP events fire at T10. Vanguard enters here. |\n| NW Pass | T3 (Lowenskyst) ↔ off-map Altonia | Event-only. Not a playable march. Fires at IP ≥ 90. |\n\n\n\n### Primary Roads\n| Route | Territories |\n|-------|------------|\n| Crown Corridor | T1 Valorsplatz — T5 Feldmark — T14 Ehrenfeld — T2 Kronmark |\n| Northern Arc | T2 Kronmark — T9 Himmelenger — T8 Gransol |\n| Eastern Coast | T1 Valorsplatz — T2 Kronmark — T3 Lowenskyst |\n| Western Highland | T14 Ehrenfeld — T4 Grauwald — T12 Sigurdshelm |\n\n\n### Secondary Roads\n| Route | Territories |\n|-------|------------|\n| Southern Approach | T5 Feldmark — T6 Stillhelm — T13 Oastad |\n| Fjord Route | T12 Sigurdshelm — T11 Halvardshelm — T10 Spartfell |\n| Hafenmark Interior | T8 Gransol — T7 Rendstad — T4 Grauwald |\n| Northern Mining | T8 Gransol — T17 Halvarshelm — T3 Lowenskyst |\n\n\n### Geographic Trade Notes\nSea routes: T1 (Valorsplatz) ↔ T16 (Schoenland). No land connection to Schoenland. No northern\
    \ circumnavigation.\nHafenmark is fully landlocked — all maritime trade routes through Crown territory (T1 Valorsplatz or T3 Lowenskyst).\n\n\n### Altonian Mountain Passes\n| Pass | Connection | Notes |\n|------|-----------|-------|\n| NE Pass | T10 (Spartfell) ↔ off-map Altonia | Primary invasion route. IP events fire at T10. Vanguard enters here. |\n| NW Pass | T3 (Lowenskyst) ↔ off-map Altonia | Event-only. Not a playable march. Fires at IP ≥ 90. |\n\n\n\n## Proximity Ratings (supersedes Southernmost Zones — PP-199)\n**Canonical source: `designs/setting/calamity_radiation_v30.md`** (Node Distance Map + Radiation Matrix).\n\nThe Southernmost Zones system is superseded by the Proximity Rating system. Each territory's Proximity Rating is its node distance from Askeheim (T15) on the adjacency graph. Printed on each territory card.\n\n| Proximity | Territories |\n|-----------|------------|\n| 0 | T15 Askeheim |\n| 1 | T6 Stillhelm, T13 Oastad |\n| 2 | T5 Feldmark, T12 Sigurdshelm |\n|\
    \ 3 | T1 Valorsplatz, T14 Ehrenfeld, T4 Grauwald, T11 Halvardshelm |\n| 4 | T2 Kronmark, T16 Schoenland, T9 Himmelenger, T7 Rendstad, T10 Spartfell |\n| 5 | T3 Lowenskyst, T8 Gransol, T17 Halvarshelm |\n\nMS effects per Proximity Rating: see §Mending Stability (MS) Effects above (Simplified BG Lookup Table from calamity_radiation_v30.md).\n\n\n\n## Southernmost Access System (PP-219)\n### Authority: designs/ttrpg/edeyja_npc.md; Philosophical Foundations P-13\n\n**T6 Stillhelm = normal territory.** Standard military march, territorial control,\nDomain Actions all apply. Difficult frontier terrain (+1 Ob non-Thread) and MS drain\nfrom substrate proximity, but no special access gate.\n\n**T15 Askeheim = the Southernmost proper.** Not a normal territory. Cannot be\ncontrolled by any faction through standard mechanics. The Warden presence and the\nsubstrate damage itself make conventional occupation impossible — any military force\nthat enters encounters Thread operations at TS 75–80 scale.\
    \ This has never needed\nadvertising. It has simply never been necessary.\n\n### Expedition Procedure (T6 → T15)\nRequired sequence to access Askeheim:\n\n1. **Stage in T6 (Stillhelm):** Faction must control T6 AND have a Champion with\n   TS ≥ 30 present there for at least 1 full season. Champion must not have been\n   used for military orders that season (Expedition requires full attention).\n\n2. **Declare Expedition:** Phase 4, Praetor or Tribune Inward in T6.\n   Roll: Champion pool (TS ÷ 10, rounded down, min 1D, max 3D) vs Ob 3.\n   Modifiers: Restoration Weaver with Presence in T6: −1 Ob. VTM ≥ 2: −1 Ob.\n   Failure: expedition does not depart this season. Try again next season.\n   Success/Overwhelming: expedition departs. Move to step 3.\n\n3. **Forgetting Check (on entry into T15):**\n   Same pool vs Ob 2. Modifiers same as above.\n   | Result | Effect |\n   |--------|--------|\n   | Failure | Champion enters T15 but retains nothing. No Warden contact. No Cooperation advance.\
    \ No VTM progress. Champion returns to T6 next season. |\n   | Partial | Emotional impressions retained. Warden Emergence fires (if not active). Cooperation +0 (Wardens observe but do not approach). |\n   | Success | Facts retained. Warden Emergence fires. Cooperation +1. VTM +1 (Varfell only, if VTM ≥ 2). |\n   | Overwhelming | Full retention. Warden Emergence fires. Cooperation +1. VTM +1 (Varfell). Edeyja makes contact. |\n\n4. **Meeting Edeyja:**\n   Requires Overwhelming on Forgetting Check, OR Success + 1 prior successful season\n   in T15. She assesses the Champion. TS < 30: she will not engage. TS 30–39: brief,\n   wary contact. TS 40+: substantive contact. She never leaves T15.\n\n### Champion TS Values (BG)\n| Champion | Faction | Starting TS | Qualifies at Start | Path to TS 30 |\n|----------|---------|-------------|-------------------|---------------|\n| Vaynard (VTM 3+) | Varfell | 30 (at VTM 3) | Yes — conditional on VTM development | VTM 3 achieved ~S7–9. Marginal: Forgetting\
    \ pool = 3D. |\n| Vaynard (VTM 4+) | Varfell | 40 | Yes | VTM 4 ~S10–12. Edeyja will engage substantively. |\n| Almud Almqvist | Crown | 0 | **No** | Discovery Event as rupture (not confirmation): any Thread-significant event with Almud present, Spirit Ob 1. At TS 0, Almud perceives nothing of Thread phenomena — the Discovery Event is first contact with something entirely outside his framework. On success: TS gains initial awareness (GM sets value, likely 10-15 Stirring range), Truth −1 (permanent). Politically costly: CI +1; Church learning triggers CI +2 + Heresy Investigation. *[ED-364 resolved 2026-04-11: Almud TS revised to 0. Remove secret Einhir sympathy. Einhir policy as governance pragmatism + genuine ethical doubt. Discovery Event as rupture not confirmation.]* |\n| Lenneth Almqvist (Queen) | Crown | Unknown (not yet documented) | **Unknown** | Arc-dependent. Holds pre-Altonian sea-republic archive with first-person Thread-perception accounts (~180 AG). Potential TS development\
    \ through intellectual confrontation with archive content + Thread exposure. [EDITORIAL: ED-119 — Lenneth full design required: starting TS, development path, stat block.] |\n| Restoration Weaver (TS 18) | Restoration | 18 | No | Does not qualify as expedition leader. Provides Ob −1 support when accompanying a qualifying Champion. |\n| Any other faction Champion | Any | < 30 | No | No standard development path. |\n\n**Crown's Southernmost access is conditional on in-game development.**\nNeither Almud nor Lenneth qualifies at game start. Almud starts at TS 0 — Crown must trigger\nhis Discovery Event (rupture: first Thread contact) to develop any Thread awareness at all.\nEven after a successful Discovery Event, Almud's TS will be in the Stirring range (10-15),\nfar below the Champion TS 30 threshold. Crown's Champion path requires MULTIPLE Discovery\nEvents or sustained Thread exposure over several seasons to reach TS 30. This is the slowest\nChampion path in the game. Lenneth's path\
    \ remains arc-dependent (ED-119 open).\n\n**Three factions have Southernmost access paths:**\n- Varfell: fastest (VTM development, S7–12)\n- Crown: slowest (Almud TS 0 → Discovery Event → sustained development to TS 30; multiple seasons)\n- Restoration: support role only (Weaver provides Ob −1, cannot lead)\n\n### What \"No Faction Control\" Means in BG\n- No control token can be placed in T15.\n- No Govern, Trade, Muster, Fortify, or Decree orders execute in T15.\n- CI 75 Church Territorial Seizure does not target T15.\n- Varfell Path B (T4+T6) refers to control of T6 — a normal territory.\n  The deed measures political and strategic presence at the Southernmost threshold,\n  not occupation of the epicentre itself.\n- Varfell Path C Deed 2 (T4+T6+1 other): same — T6 is the territorial condition.\n  T15 is never the territorial condition.\n- Warden Cooperation track advances through successful Expedition seasons in T15,\n  not through territorial control.\n\n\n### Authority: designs/ttrpg/edeyja_npc.md;\
    \ Philosophical Foundations P-13\n\n**T6 Stillhelm = normal territory.** Standard military march, territorial control,\nDomain Actions all apply. Difficult frontier terrain (+1 Ob non-Thread) and MS drain\nfrom substrate proximity, but no special access gate.\n\n**T15 Askeheim = the Southernmost proper.** Not a normal territory. Cannot be\ncontrolled by any faction through standard mechanics. The Warden presence and the\nsubstrate damage itself make conventional occupation impossible — any military force\nthat enters encounters Thread operations at TS 75–80 scale. This has never needed\nadvertising. It has simply never been necessary.\n\n\n### Expedition Procedure (T6 → T15)\nRequired sequence to access Askeheim:\n\n1. **Stage in T6 (Stillhelm):** Faction must control T6 AND have a Champion with\n   TS ≥ 30 present there for at least 1 full season. Champion must not have been\n   used for military orders that season (Expedition requires full attention).\n\n2. **Declare Expedition:**\
    \ Phase 4, Praetor or Tribune Inward in T6.\n   Roll: Champion pool (TS ÷ 10, rounded down, min 1D, max 3D) vs Ob 3.\n   Modifiers: Restoration Weaver with Presence in T6: −1 Ob. VTM ≥ 2: −1 Ob.\n   Failure: expedition does not depart this season. Try again next season.\n   Success/Overwhelming: expedition departs. Move to step 3.\n\n3. **Forgetting Check (on entry into T15):**\n   Same pool vs Ob 2. Modifiers same as above.\n   | Result | Effect |\n   |--------|--------|\n   | Failure | Champion enters T15 but retains nothing. No Warden contact. No Cooperation advance. No VTM progress. Champion returns to T6 next season. |\n   | Partial | Emotional impressions retained. Warden Emergence fires (if not active). Cooperation +0 (Wardens observe but do not approach). |\n   | Success | Facts retained. Warden Emergence fires. Cooperation +1. VTM +1 (Varfell only, if VTM ≥ 2). |\n   | Overwhelming | Full retention. Warden Emergence fires. Cooperation +1. VTM +1 (Varfell). Edeyja makes contact.\
    \ |\n\n4. **Meeting Edeyja:**\n   Requires Overwhelming on Forgetting Check, OR Success + 1 prior successful season\n   in T15. She assesses the Champion. TS < 30: she will not engage. TS 30–39: brief,\n   wary contact. TS 40+: substantive contact. She never leaves T15.\n\n\n### Champion TS Values (BG)\n| Champion | Faction | Starting TS | Qualifies at Start | Path to TS 30 |\n|----------|---------|-------------|-------------------|---------------|\n| Vaynard (VTM 3+) | Varfell | 30 (at VTM 3) | Yes — conditional on VTM development | VTM 3 achieved ~S7–9. Marginal: Forgetting pool = 3D. |\n| Vaynard (VTM 4+) | Varfell | 40 | Yes | VTM 4 ~S10–12. Edeyja will engage substantively. |\n| Almud Almqvist | Crown | 0 | **No** | Discovery Event as rupture (not confirmation): any Thread-significant event with Almud present, Spirit Ob 1. At TS 0, Almud perceives nothing of Thread phenomena — the Discovery Event is first contact with something entirely outside his framework. On success: TS gains\
    \ initial awareness (GM sets value, likely 10-15 Stirring range), Truth −1 (permanent). Politically costly: CI +1; Church learning triggers CI +2 + Heresy Investigation. *[ED-364 resolved 2026-04-11: Almud TS revised to 0. Remove secret Einhir sympathy. Einhir policy as governance pragmatism + genuine ethical doubt. Discovery Event as rupture not confirmation.]* |\n| Lenneth Almqvist (Queen) | Crown | Unknown (not yet documented) | **Unknown** | Arc-dependent. Holds pre-Altonian sea-republic archive with first-person Thread-perception accounts (~180 AG). Potential TS development through intellectual confrontation with archive content + Thread exposure. [EDITORIAL: ED-119 — Lenneth full design required: starting TS, development path, stat block.] |\n| Restoration Weaver (TS 18) | Restoration | 18 | No | Does not qualify as expedition leader. Provides Ob −1 support when accompanying a qualifying Champion. |\n| Any other faction Champion | Any | < 30 | No | No standard development path.\
    \ |\n\n**Crown's Southernmost access is conditional on in-game development.**\nNeither Almud nor Lenneth qualifies at game start. Almud starts at TS 0 — Crown must trigger\nhis Discovery Event (rupture: first Thread contact) to develop any Thread awareness at all.\nEven after a successful Discovery Event, Almud's TS will be in the Stirring range (10-15),\nfar below the Champion TS 30 threshold. Crown's Champion path requires MULTIPLE Discovery\nEvents or sustained Thread exposure over several seasons to reach TS 30. This is the slowest\nChampion path in the game. Lenneth's path remains arc-dependent (ED-119 open).\n\n**Three factions have Southernmost access paths:**\n- Varfell: fastest (VTM development, S7–12)\n- Crown: slowest (Almud TS 0 → Discovery Event → sustained development to TS 30; multiple seasons)\n- Restoration: support role only (Weaver provides Ob −1, cannot lead)\n\n\n### What \"No Faction Control\" Means in BG\n- No control token can be placed in T15.\n- No Govern, Trade,\
    \ Muster, Fortify, or Decree orders execute in T15.\n- CI 75 Church Territorial Seizure does not target T15.\n- Varfell Path B (T4+T6) refers to control of T6 — a normal territory.\n  The deed measures political and strategic presence at the Southernmost threshold,\n  not occupation of the epicentre itself.\n- Varfell Path C Deed 2 (T4+T6+1 other): same — T6 is the territorial condition.\n  T15 is never the territorial condition.\n- Warden Cooperation track advances through successful Expedition seasons in T15,\n  not through territorial control.\n\n\n## Faction Capital Territories — see Territory Table Reconciled (PP-195)\n[Superseded — Hafenmark capital = Gransol (T8). See Territory Table.]\n\n\n## Varfell Territorial Expansion Constraint (PP-191)\nVarfell's starting handicap is **positional**, not statistical.\nVarfell seat T12 (Sigurdshelm) is adjacent to: T4 (Grauwald, Varfell), T11 (Halvardshelm, Varfell), T13 (Oastad, Varfell).\n\nAll four Varfell starting territories form a chain\
    \ along the western fjords. Expansion paths:\n- From T4 (Grauwald): adjacent to T7 (Rendstad, Hafenmark), T12 (Varfell), T14 (Ehrenfeld, Crown Fort 3). T14 is the strongest fortress on the board — Löwenritter garrison, Fort 3 (max 4).\n- From T11 (Halvardshelm): adjacent to T10 (Spartfell, Hafenmark Fort 2), T12 (Varfell). Spartfell is fortified.\n- From T13 (Oastad): adjacent to T6 (Stillhelm, Crown), T12 (Varfell), T15 (Askeheim, uncontrolled). T6 is the Southernmost Access point. T15 cannot be controlled.\n- From T12 (Sigurdshelm): only adjacent to other Varfell territories — no outward expansion.\n\nEvery viable expansion runs into fortified or hostile positions. Varfell must either neutralise fortifications (Tribune Sabotage, Ob = Fort level) or accept unfavourable odds.\n\n**Fortification Combat Rule:** When attacking a fortified territory, defending faction adds Fort level as bonus dice to defensive Military roll. Fort 3 (Ehrenfeld) = defender rolls Military + 3D.\n\n**Varfell\
    \ Intelligence Path:** Varfell's dominant early game is information, not territory. The Intelligence Hegemony victory path requires TCV ≥ 10 + VTM ≥ 3 + 2 rival stats revealed. Path B (Southernmost Dominion) and Path C (Thread Supremacy) both run through T13 (Oastad)/T15 (Askeheim).\n\nStarting stat total revised: Varfell 4+4+4+4+4 = 20 points (vs Crown 22, Church 25, Hafenmark 20). Equal to Hafenmark on raw points; differentiated by asymmetric mechanics (Patience Protocol, VTM, positional constraint).\n\n\n## Victory Condition Territory References — SUPERSEDED\n**All victory territory references now use TCV from victory_v30.md §1.**\nTerritory numbering follows geography_v30.md (17-territory canonical map).\nOld PP-199 territory references using pre-geography_design numbering are stale.\n[TERRITORY-DEBT: RESOLVED 2026-04-08 — PP-493. TCV table, territory detail table, adjacencies, and all named T# references verified against geography_v30.md canonical numbering.]\n\n## Varfell Path\
    \ B — Southernmost Dominion (ED-311 RESOLVED — Option A)\n**[Replaces provisional conditions in victory_v30.md §3.4]**\n\n| Condition | Threshold |\n|-----------|-----------|\n| TCV held | ≥ 8 |\n| Control T4 (Grauwald) AND T13 (Oastad) | both held |\n| VTM | ≥ 3 |\n| Warden Recognition (WR) | ≥ 2 |\n\n**WR track (0–4):**\n- WR 0: Wardens unaware/indifferent\n- WR 1: Wardens have observed Vaynard (≥ 1 successful Expedition)\n- WR 2: Wardens recognise Vaynard as steward (prior WA ≥ +1 AND WC ≥ 1 conditions collapsed here)\n- WR 3: Wardens actively cooperate (+1D Thread ops peninsula-wide)\n- WR 4: Edeyja has made substantive contact (Overwhelming Forgetting Check)\n\nWR advances: successful Expedition seasons (+1 per Overwhelming or cumulative Successes).\nWR decreases: RM emergence (WR −2); T15 neglect 3+ seasons (no Expedition attempted): WR −1.\n**Blocked if:** WR has ever returned to 0 after first advancing past 1.\n"
  engine/params/bg/institutions.md: "## Church of Solmund — Canonical Structure (PP-194, from original source documents)\nNaming: \"Church of Solmund\" in source = **Church of Solmund** in all current docs (Galbados → Solmund).\nHoly See = elected from among the Bishopry. Second only to the Monarch.\n\n### Four Cardinals (appointed by Holy See)\n| Cardinal | Domain | BG Mechanical Role |\n|----------|--------|-------------------|\n| Cardinal of Fortitude | Commands Knights Templar | Templar deployment; military arm of Church |\n| Cardinal of Justice | Grand Adjudication + Inquisitors | Heresy Investigations; excommunication recommendations |\n| Cardinal of Prudence | Tithes collection + Charities | Wealth generation; Church's economic arm |\n| Cardinal of Temperance | Universities + Monasteries + Observatories | Scholarly institutions; Altonian diplomacy |\n\n**In BG, Cardinals are Church's internal officers.** When Church Stability drops below 3, one Cardinal may challenge the Confessor\
    \ (per v04 B3 \"internal schism\" note). The challenging Cardinal acts on their own priority for one season.\n\n**Cardinal-specific BG mechanics:**\n- **Fortitude (Templar):** Templar deployment requires Cardinal of Fortitude to be active (Church Stability ≥ 2). At Stability ≤ 1: Templars do not deploy regardless of card play.\n- **Justice (Inquisitors):** Heresy Investigations are issued under Cardinal of Justice. If Cardinal of Justice is compromised (via Varfell Intel action on Church — political intelligence work, prestige-coded): one Heresy Investigation this season is false (all factions notified that one Investigation this season was procedurally invalid).\n- **Prudence (Tithes):** Church Wealth generation: +0.5 Wealth/season from tithed territories (rounds down at Year-End). Territories where Church has Favour ≥ 3 contribute to tithe income.\n- **Temperance (Scholars):** Altonian diplomacy. While Church controls T9 (Himmelenger — university city), Cardinal of Temperance may pursue\
    \ Altonian diplomatic engagement at Phase 1. Specific hooks TBD (replaces removed AER track).\n\n\n### Cardinal Death — Succession (ED-336 resolved)\n**Multi-Cardinal death cap (ED-347):** No hard cap. Multiple Cardinal deaths per season are legally possible. Each death triggers its own succession gap independently. Cost (cascading Church mechanic suspensions) is the natural limiting factor, not a hard rule.\nWhen a Cardinal is killed during a Zoom In scene (Hybrid mode):\n\n**Gap period:** The Cardinal's BG mechanic is **suspended** until Year-End Accounting.\n- Fortitude: Templar deployment requires Legionary card (no free deployment).\n- Justice: Heresy Investigations cannot be issued (no authorising Cardinal).\n- Prudence: Tithe income halved (clerks continue but without Cardinal oversight).\n- Temperance: Altonian diplomatic action unavailable this season.\n\n**Succession:** At Year-End Accounting, Holy See appoints a replacement Cardinal. The new Cardinal is anonymous (no named\
    \ NPC stats — treat as standard Cardinal for mechanical purposes). Full mechanics restored immediately on appointment.\n\n**Player knowledge:** The replacement Cardinal is public (appointment announced). Church player may designate the new Cardinal as Focused (PP-430) the season after appointment.\n\n**Cardinal schism trigger:** If Church Stability = 2 AND any faction played a Senator action targeting Church this season: one Cardinal (random or GM discretion) challenges the Confessor. That Cardinal's faction sub-action fires as an NPC Priority regardless of the Church player's card plays.\n\n### Church Levies\nPer canonical source: \"Church has its own levies stationed in cathedrals across every major city. Two-thirds can be raised by the King at any given moment.\"\n**BG mechanic:** Crown may, once per Year-End, raise Church levies: Crown gains Military +1 for one season (levies mobilised). Church loses equivalent Military capacity: Church Military −1 for that season. Church cannot\
    \ refuse if Crown L ≥ 4.\n\n### Excommunication — Canonical Procedure\nExcommunication recommended by Cardinal of Justice for heresy conviction. Excommunicated factions/leaders:\n- Must pay penance: Wealth −1 per season until penance complete (3 seasons).\n- Must perform public service: one action per season must be Senator Outward (Diplomacy) toward Church.\n- Banishment (severe cases): faction permanently barred from Church-controlled territories.\n**BG trigger:** Excommunication is available to Church as Unique Power (existing). The penance/public service mechanic is new — applies only after a successful Excommunication, tracking on the targeted faction's mat.\n\n\n### Four Cardinals (appointed by Holy See)\n| Cardinal | Domain | BG Mechanical Role |\n|----------|--------|-------------------|\n| Cardinal of Fortitude | Commands Knights Templar | Templar deployment; military arm of Church |\n| Cardinal of Justice | Grand Adjudication + Inquisitors | Heresy Investigations; excommunication\
    \ recommendations |\n| Cardinal of Prudence | Tithes collection + Charities | Wealth generation; Church's economic arm |\n| Cardinal of Temperance | Universities + Monasteries + Observatories | Scholarly institutions; Altonian diplomacy |\n\n**In BG, Cardinals are Church's internal officers.** When Church Stability drops below 3, one Cardinal may challenge the Confessor (per v04 B3 \"internal schism\" note). The challenging Cardinal acts on their own priority for one season.\n\n**Cardinal-specific BG mechanics:**\n- **Fortitude (Templar):** Templar deployment requires Cardinal of Fortitude to be active (Church Stability ≥ 2). At Stability ≤ 1: Templars do not deploy regardless of card play.\n- **Justice (Inquisitors):** Heresy Investigations are issued under Cardinal of Justice. If Cardinal of Justice is compromised (via Varfell Intel action on Church — political intelligence work, prestige-coded): one Heresy Investigation this season is false (all factions notified that one Investigation\
    \ this season was procedurally invalid).\n- **Prudence (Tithes):** Church Wealth generation: +0.5 Wealth/season from tithed territories (rounds down at Year-End). Territories where Church has Favour ≥ 3 contribute to tithe income.\n- **Temperance (Scholars):** Altonian diplomacy. While Church controls T9 (Himmelenger — university city), Cardinal of Temperance may pursue Altonian diplomatic engagement at Phase 1. Specific hooks TBD (replaces removed AER track).\n\n\n\n### Cardinal Death — Succession (ED-336 resolved)\n**Multi-Cardinal death cap (ED-347):** No hard cap. Multiple Cardinal deaths per season are legally possible. Each death triggers its own succession gap independently. Cost (cascading Church mechanic suspensions) is the natural limiting factor, not a hard rule.\nWhen a Cardinal is killed during a Zoom In scene (Hybrid mode):\n\n**Gap period:** The Cardinal's BG mechanic is **suspended** until Year-End Accounting.\n- Fortitude: Templar deployment requires Legionary card (no\
    \ free deployment).\n- Justice: Heresy Investigations cannot be issued (no authorising Cardinal).\n- Prudence: Tithe income halved (clerks continue but without Cardinal oversight).\n- Temperance: Altonian diplomatic action unavailable this season.\n\n**Succession:** At Year-End Accounting, Holy See appoints a replacement Cardinal. The new Cardinal is anonymous (no named NPC stats — treat as standard Cardinal for mechanical purposes). Full mechanics restored immediately on appointment.\n\n**Player knowledge:** The replacement Cardinal is public (appointment announced). Church player may designate the new Cardinal as Focused (PP-430) the season after appointment.\n\n**Cardinal schism trigger:** If Church Stability = 2 AND any faction played a Senator action targeting Church this season: one Cardinal (random or GM discretion) challenges the Confessor. That Cardinal's faction sub-action fires as an NPC Priority regardless of the Church player's card plays.\n\n\n### Church Levies\nPer canonical\
    \ source: \"Church has its own levies stationed in cathedrals across every major city. Two-thirds can be raised by the King at any given moment.\"\n**BG mechanic:** Crown may, once per Year-End, raise Church levies: Crown gains Military +1 for one season (levies mobilised). Church loses equivalent Military capacity: Church Military −1 for that season. Church cannot refuse if Crown L ≥ 4.\n\n\n### Excommunication — Canonical Procedure\nExcommunication recommended by Cardinal of Justice for heresy conviction. Excommunicated factions/leaders:\n- Must pay penance: Wealth −1 per season until penance complete (3 seasons).\n- Must perform public service: one action per season must be Senator Outward (Diplomacy) toward Church.\n- Banishment (severe cases): faction permanently barred from Church-controlled territories.\n**BG trigger:** Excommunication is available to Church as Unique Power (existing). The penance/public service mechanic is new — applies only after a successful Excommunication,\
    \ tracking on the targeted faction's mat.\n\n\n## Löwenritter — Canonical Structure (PP-194)\nPer canonical source: Löwenritter serves the Monarch through military and civic arms via Lions' Council.\n\n### Structure\n- **Lions' Table:** Military arm. Coordinates military levies. Appoints Royal Guard.\n- **Lions' Helm:** Naval arm. (BG: no direct naval territory but relevant to Schoenland sea route — Löwenritter Helm can deny T10 sea access to Schoenland at IP < 75 if Crown requests.)\n- **Riskbreakers:** Sub-unit of Löwenritter, NOT independent faction. Operates outside the law to infiltrate cults and criminal organizations. [CORRECTION: Prior design documents treated Riskbreakers as independent NPC. Canonical source places them inside Löwenritter. They remain NPC-controlled but their Priority Tree now links to Löwenritter's coup counter and Crown's L.]\n- **Civic Arm:**\n  - Knights of the Peace: patrol and enforce law. BG: when Löwenritter is active (any phase), one territory per season\
    \ has its March Ob −1 (pacified roads).\n  - Royal Investigators: counter-espionage and investigation. BG: once per season, Löwenritter may cancel one successful Intel action targeting Crown (Royal Investigators intercept).\n\n**Riskbreaker correction (PP-194):** Riskbreakers are Löwenritter's covert sub-unit. In BG:\n- Pre-Split (Loyal/Restless/Autonomous): Riskbreakers fire under Löwenritter NPC AI Priority Tree (not independent).\n- Post-Split: Riskbreakers become a Löwenritter player resource — once per season, may execute one Priority Tree action at no card cost.\n- Riskbreaker \"independence\" in prior design documents (acting against Crown) remains mechanically valid — Riskbreakers serve Valoria, not Almud personally, consistent with canonical source.\n\n\n### Löwenritter — Reconstitution (ED-331 resolved)\n**Type:** Senator Inward (Löwenritter only, post-Split). Available only when PI = 0.\nRoll: L vs Ob 3. Once per season.\n\n| Degree | Effect |\n|--------|--------|\n| Overwhelming\
    \ | PI restored to 2. Parliamentary Manoeuvre re-enabled immediately. |\n| Success | PI restored to 1. Parliamentary Manoeuvre re-enabled. |\n| Partial | PI = 0 (no change). Stability −1. |\n| Failure | PI = 0 (no change). Stability −1. Church L +1 (institutional vacuum benefits Church). |\n\n**Rationale:** Löwenritter as successor authority has the standing to reconstitute parliamentary function. Without Reconstitution, PI = 0 is a permanent lock on Regency primary victory (PI ≥ 4 required). This action creates a credible recovery path without trivialising the coup's consequences.\n\n\n### Structure\n- **Lions' Table:** Military arm. Coordinates military levies. Appoints Royal Guard.\n- **Lions' Helm:** Naval arm. (BG: no direct naval territory but relevant to Schoenland sea route — Löwenritter Helm can deny T10 sea access to Schoenland at IP < 75 if Crown requests.)\n- **Riskbreakers:** Sub-unit of Löwenritter, NOT independent faction. Operates outside the law to infiltrate cults and\
    \ criminal organizations. [CORRECTION: Prior design documents treated Riskbreakers as independent NPC. Canonical source places them inside Löwenritter. They remain NPC-controlled but their Priority Tree now links to Löwenritter's coup counter and Crown's L.]\n- **Civic Arm:**\n  - Knights of the Peace: patrol and enforce law. BG: when Löwenritter is active (any phase), one territory per season has its March Ob −1 (pacified roads).\n  - Royal Investigators: counter-espionage and investigation. BG: once per season, Löwenritter may cancel one successful Intel action targeting Crown (Royal Investigators intercept).\n\n**Riskbreaker correction (PP-194):** Riskbreakers are Löwenritter's covert sub-unit. In BG:\n- Pre-Split (Loyal/Restless/Autonomous): Riskbreakers fire under Löwenritter NPC AI Priority Tree (not independent).\n- Post-Split: Riskbreakers become a Löwenritter player resource — once per season, may execute one Priority Tree action at no card cost.\n- Riskbreaker \"independence\"\
    \ in prior design documents (acting against Crown) remains mechanically valid — Riskbreakers serve Valoria, not Almud personally, consistent with canonical source.\n\n\n\n### Löwenritter — Reconstitution (ED-331 resolved)\n**Type:** Senator Inward (Löwenritter only, post-Split). Available only when PI = 0.\nRoll: L vs Ob 3. Once per season.\n\n| Degree | Effect |\n|--------|--------|\n| Overwhelming | PI restored to 2. Parliamentary Manoeuvre re-enabled immediately. |\n| Success | PI restored to 1. Parliamentary Manoeuvre re-enabled. |\n| Partial | PI = 0 (no change). Stability −1. |\n| Failure | PI = 0 (no change). Stability −1. Church L +1 (institutional vacuum benefits Church). |\n\n**Rationale:** Löwenritter as successor authority has the standing to reconstitute parliamentary function. Without Reconstitution, PI = 0 is a permanent lock on Regency primary victory (PI ≥ 4 required). This action creates a credible recovery path without trivialising the coup's consequences.\n\n\n##\
    \ Ministry — Canonical Identity (PP-194)\nPer canonical source: Valoria uses a system of ministries to provide services. Ministers nominated by Parliament, confirmed by Monarch.\n\nNamed ministries in source: Ministry of Law, Ministry of Guilds, Ministry of Logothetes, Ministry of Granaries, Ministry of Pure Water.\n\n**BG Ministry faction** = the collective ministerial apparatus. Its Influence (4) represents reach across all ministries. Its L (3) represents institutional legitimacy (PS not tracked — administrative apparatus has no separate populist axis, per audit Q2) — it has authority but is subordinate to Parliament's nominations.\n\n### Ministry of Guilds — Specific BG Role\nThe Ministry of Guilds monitors the guild system, arranges contracts between guilds and Imperial Court, sets taxation. In BG: Ministry of Guilds is the direct connection between Ministry (NPC) and Guilds (NPC).\n- If Ministry L ≥ 2 AND Guilds NPC is active: Guilds may not be targeted by Economic Leverage from\
    \ other factions without a free Ministry counter (Ministry files procedural objection: +1 Ob to the Economic Leverage roll).\n- If Ministry L ≤ 1: Guilds lose their trade contract protections — all Trade Ob in Guilds-controlled territories +1 (no Ministry to enforce non-competition).\n\n### Parliament Nomination Mechanic (PP-194)\nPer canonical source: Parliament nominates Ministers (confirmed by Monarch) and Rectorates.\n**BG mechanic — Ministry Nomination:**\nOnce per Year-End: Parliament (= Hafenmark Parliamentary Manoeuvre success this year + Crown not in Emergency Powers) may nominate a Ministerial agenda. Choose one:\n- **Ministry of Law agenda:** Ministry L +1. All Heresy Investigation Obs +1 (legal proceduralism slows Church).\n- **Ministry of Guilds agenda:** Guilds NPC Wealth +1. Ministry receives 1 Wealth (tithe/tax income).\n- **Ministry of Logothetes agenda:** All faction Intel orders next season: −1 Ob (administrative records are accessible). Ministry Influence +1 for 1\
    \ season.\nCrown must confirm: if Crown L ≥ 3, confirmation is automatic. If Crown L < 3: roll L vs Ob 2. Failure: nomination blocked (Crown too weak to confirm).\n\n### Parliament Deposition Mechanic (PP-194 — from canonical source)\nPer canonical source: \"Court Parliament has constitutional right to depose Monarch if deemed unfit for duties by the Holy See AND Imperial Court.\"\n**BG mechanic — Royal Deposition:**\nFires if ALL of: PI ≥ 5 (Parliament functional), Church L ≥ 5 (Holy See has standing), Crown L ≤ 1 (Monarch deemed unfit), AND at least 2 other player factions have active Standing tokens against Crown.\nEffect: Crown player must pass the Crown to Löwenritter (Split stage triggers) OR call an emergency Parliamentary Session (Senator Inward, Ob 3) to restore legitimacy. If neither: Crown faction is eliminated; Löwenritter Coup Counter immediately set to 4 (coup fires next season).\n\n\n### Ministry of Guilds — Specific BG Role\nThe Ministry of Guilds monitors the guild system,\
    \ arranges contracts between guilds and Imperial Court, sets taxation. In BG: Ministry of Guilds is the direct connection between Ministry (NPC) and Guilds (NPC).\n- If Ministry L ≥ 2 AND Guilds NPC is active: Guilds may not be targeted by Economic Leverage from other factions without a free Ministry counter (Ministry files procedural objection: +1 Ob to the Economic Leverage roll).\n- If Ministry L ≤ 1: Guilds lose their trade contract protections — all Trade Ob in Guilds-controlled territories +1 (no Ministry to enforce non-competition).\n\n\n### Parliament Nomination Mechanic (PP-194)\nPer canonical source: Parliament nominates Ministers (confirmed by Monarch) and Rectorates.\n**BG mechanic — Ministry Nomination:**\nOnce per Year-End: Parliament (= Hafenmark Parliamentary Manoeuvre success this year + Crown not in Emergency Powers) may nominate a Ministerial agenda. Choose one:\n- **Ministry of Law agenda:** Ministry L +1. All Heresy Investigation Obs +1 (legal proceduralism slows\
    \ Church).\n- **Ministry of Guilds agenda:** Guilds NPC Wealth +1. Ministry receives 1 Wealth (tithe/tax income).\n- **Ministry of Logothetes agenda:** All faction Intel orders next season: −1 Ob (administrative records are accessible). Ministry Influence +1 for 1 season.\nCrown must confirm: if Crown L ≥ 3, confirmation is automatic. If Crown L < 3: roll L vs Ob 2. Failure: nomination blocked (Crown too weak to confirm).\n\n\n### Parliament Deposition Mechanic (PP-194 — from canonical source)\nPer canonical source: \"Court Parliament has constitutional right to depose Monarch if deemed unfit for duties by the Holy See AND Imperial Court.\"\n**BG mechanic — Royal Deposition:**\nFires if ALL of: PI ≥ 5 (Parliament functional), Church L ≥ 5 (Holy See has standing), Crown L ≤ 1 (Monarch deemed unfit), AND at least 2 other player factions have active Standing tokens against Crown.\nEffect: Crown player must pass the Crown to Löwenritter (Split stage triggers) OR call an emergency Parliamentary\
    \ Session (Senator Inward, Ob 3) to restore legitimacy. If neither: Crown faction is eliminated; Löwenritter Coup Counter immediately set to 4 (coup fires next season).\n\n\n## Parish / Cathedral System — Church (ED-319 RESOLVED)\n**Prerequisite:** Church Consul Inward action in territory.\nParish: 2 sequential successful Consul Inward actions + 1 Wealth. Effect: PT floor raised to 1 (persists unless Cathedral). \nCathedral: 3 more successful Consul Inward (5 total from zero) + 2 additional Wealth. Effect: PT floor 2 + Church Prominence +1 in territory for seizure calculations.\n**Control change:** Parish survives. Cathedral degrades to Parish on control transfer.\n**Limits:** Max 1 Parish or Cathedral per territory. Max 1 upgrade attempt per territory per arc.\n\n---\n"
  engine/params/bg/military.md: '## Unit Muster Ob Table (from v04 B8 + compilation B6)

    | Unit Type | Muster Ob | Prerequisites |

    |-----------|----------|---------------|

    | Light Infantry | 1 | None |

    | Heavy Infantry | 2 | Prosperity ≥ 5 + Wealth Ob 2 |

    | Cavalry | 3 | Prosperity ≥ 6 or officer History |

    | Ranged | 2 | Officer with Ranged proficiency |

    | Artillery | 4 | Wealth Ob 4 + 1 season construction |

    | Knights Templar | Church only | Not standard Muster |


    Unit starting Discipline: Light Infantry 3, Heavy Infantry 4, Cavalry 4, Ranged 3, Artillery 3.



    ## BG Co-Movement Resolution Protocol (PP-182, ED-086 resolved 2026-04-03 — P-14 compliant)


    **Serialization (PP-503):** When multiple Thread operations fire in the same season, resolve each operation''s Co-Movement card fully (draw → apply all three dimensional effects → discard) before the next operation draws. Effects from earlier cards may alter conditions for later draws (e.g., MS threshold crossings).

    [Full protocol in PP-182 section — three-dimensional auto-effects for all Thread operations]

    History Resonance markers (temporal), Attention Pool (epistemic), Primary result (actualized).

    Thread Tension (TT) = sum of all History Resonance markers across board.

    | TT | Effect |

    |----|--------|

    | 0–9 | Normal |

    | ≥ 10 | All Thread operation Obs +1 globally |

    | ≥ 15 | Thread Wound formation triggers automatically in any territory with ≥ 2 markers |



    ## Drawn Battle Rule (PP-180)

    Equal net successes: Stalemate. Both Discipline −1. No territorial change.

    Both at Discipline 0: both units destroyed simultaneously. Territory uncontrolled.



    ## Ranged Faction Military Modifier (ED-087 resolved 2026-04-03)

    No BG Military modifier for ranged-specialist factions. BG correctly abstracts above weapon-type level. Intentional design decision — revisit only if faction asymmetry design requires it.



    ## Co-Movement Card Effects — BG Reference (PP-187)

    20-card deck. Draw on: Partial Community Weaving, Settlement-Broker Harvest (triggered by Intel ≥ 4 broker activity at black-market settlements), VTM preview.

    | Category | Count | Effect |

    |----------|-------|--------|

    | CI effect | 4 | CI +1 immediately |

    | MS stabilisation | 3 | MS +1 at next Accounting |

    | Faction intel leak | 3 | One random faction learns Thread operation occurred here |

    | Thread Debt adjacent | 3 | Thread Debt token in adjacent territory |

    | History Resonance adjacent | 3 | History Resonance marker in adjacent territory |

    | Benign | 4 | No mechanical effect |



    ## Casus Belli (PP-510)

    A one-season political token granted to the controlling faction on every Church Graduated Seizure attempt (successful or not). Also granted by other actions where specified.


    **When CB is granted:** receiving faction places a CB marker on their mat (colour-coded to offending faction).


    **Effects (fire at next Accounting after CB granted):**

    1. Free Senator Outward (Diplomacy) action targeting the offending faction this season — no card slot required.

    2. Legionary actions against the offending faction this season: Ob −1 (min 1). Military action is politically legitimised.

    3. All factions observe the grant (public). Any faction may invoke the CB to justify coalition this season (coalition Ob −1 while CB-holder is primary, this season only).


    **CB marker removed** at next Accounting regardless of whether effects were used.


    **Limit:** One CB marker per offending faction at a time. New CB from same source resets the timer.


    [PROVISIONAL: Multiple simultaneous CB markers from different sources (e.g. Church CB + Crown CB on same holder) — confirm whether stacking is permitted. Default: permitted, markers are distinct per source.]




    ### Battle Ob Formula (PP-499, ED-343 resolved)

    **Battle Ob = floor(defender Military / 2) + 1.**

    Attacker rolls: Military pool vs Ob. Degree table per standard BG degree table (PP-249).

    **[PROVISIONAL ED-316] Weight-of-numbers (PP-570):** A faction attacking with Military ≥ 2× defending faction Military forces the defender to Stability −1 at Accounting regardless of battle outcome (the sheer scale is demoralising). Applies once per Accounting regardless of attack count.

    [Resolved by PP-548. Battle Ob = floor(defender Military / 2) + 1. Min 1 prevents auto-success vs Military 0 factions (RM). Flagged for simulation confirmation.]





    ## Battle Resolution — Formal Outcome Table (PP-476)

    Both attacker and defender apply their own degree result independently.

    For each side: margin = (own net − opponent net), if positive; 0 if own net ≤ opponent net.

    Apply: margin 0 → no outcome for that side; margin 1 to Ob−1 → Discipline −2 on opponent unit;

    margin = Ob → Discipline −4 on opponent unit; margin > Ob → opponent unit destroyed.

    Drawn battle (equal net): no degree for either side; both Discipline −1.


    Discipline floor: 0. Any result pushing Discipline to ≤ 0 destroys the unit.

    Multi-unit territory: one roll per faction using Military stat pool. Player assigns Discipline loss to specific unit card of their choice.

    Unit removed (by stat cap reduction): returned to reserve with Discipline reset on next Muster.



    ## Fortify — Pool Stat (ED-338 provisional)

    [PROVISIONAL: Fortify uses Military stat pool. Confirmation pending.]



    ## Casus Belli — Stacking Cap and Consumption (PP-519)

    - **Stacking cap:** Maximum 1 active Casus Belli against any single target at a time. A second CB vs the same target replaces the first. A faction may hold CBs vs multiple different targets simultaneously (no cross-target cap).

    - **Consumption:** A Casus Belli grants −1 Ob to one declared Military action against the target. Consumed when that Military roll is made. Treaty-derived CBs (permanent until used, per PP-510) follow the same consumption rule.

    - **CB declaration timing:** Declared at Phase 4 start (before resolution, after cards played). Cannot be transferred to a different action once declared.



    ## Conflict Marker — Church + Hafenmark Partition (PP-479)

    Conflict Marker: flip token on Church or Hafenmark mat. Placed when either faction plays Legionary targeting the other''s territory. Removed at second Accounting after placement.

    "No active military conflict" condition for Partition co-victory = no Conflict Marker active on either mat.


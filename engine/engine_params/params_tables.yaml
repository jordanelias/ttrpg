    header:
    - Proceeding
    - Player-facing card text
    rows:
    - - Formal Contest
      - Three rounds before the assembly. Take turns, win the room, and let the track fall where the argument lands.
    - - Grand Contest
      - Five rounds, and the faction's course rides on them. Pace yourself; a citation spent early cannot be spent again.
    - - Royal Audience
      - You petition; the Crown objects at every turn. The judge is stern, but the throne's resistance is halved for the one who comes asking.
    - - Church Tribunal
      - The Inquisitor sets the terms and speaks first, and the room already leans against you. Halved resistance is the only mercy; every doubt they plant is meant to stick.
    - - Guild Arbitration
      - A fair table before a bench of guild masters. Both sides stand equal; three rounds, and the masters weigh the stronger case among themselves.
    - - Casual Dispute
      - One exchange, no judge, no scorekeeping. Make your point, hear theirs, and the stronger showing settles it on the spot.
    - - Private Negotiation
      - Just the two of you, up to three rounds, no judge and no fixed scorekeeping. Read them well, because failing to agree is its own answer.
    - - Personal Appeal
      - One plea, one chance, no one to referee it. Read the person in front of you and make it count the first time.

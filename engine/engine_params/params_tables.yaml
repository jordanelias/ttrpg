  engine/params/factions/riskbreakers_identity.md: "## ED-006 Resolution (PP-287) — Riskbreakers Identity [FLAGGED]\n\nRiskbreakers: extralegal arm of Löwenritter. Small-cadre elite consequentialists,\nloyal to Valoria-as-concept not to Crown or institution. Will go extralegal when\njudged necessary. Already documented in params_factions §Riskbreakers. Confirmed.\n[FLAGGED: full operational profile deferred to NPC roster development.]\n\n## ED-019 Resolution (PP-288) — Faction Tactic Cards [FLAGGED]\n\nProvisional minimal tactic card set (2 per faction):\n| Faction | Tactic A | Tactic B |\n|---------|----------|----------|\n| Crown | Royal Prerogative (+2D one L roll, 1/season) | Iron Decree (cancel 1 opposing DA, 1/campaign) |\n| Church | Sanctuary (protect 1 NPC from targeting 1 season) | Inquisition (force reveal 1 hidden faction stat) |\n| Hafenmark | Trade Leverage (+1D all Wealth rolls 1 season) | Constitutional Check (−2 Ob one Crown action) |\n| Varfell | Intelligence Supremacy (learn\
    \ full stat block of 1 faction) | Patience Protocol (pass; bank +2D for any future roll) |\n| Restoration | Community Shield (reduce MS cost of 1 Weaving by 2) | Solidarity (+1D all Presence marker actions 1 season) |\n| Löwenritter | Martial Discipline (immune to Feigned Retreat 1 battle) | Riskbreaker Activation (deploy Quiet-equivalent 1/campaign) |\n[FLAGGED: placeholder designs. Full design required before BG compilation.]\n\n## ED-024 Resolution (PP-289) — Mode 3 Entity Stats [FLAGGED]\n\nMinimal provisional stat block for simulation:\n| Stat | Value | Notes |\n|------|-------|-------|\n| Thread Pool Score | 8 | Acts as TS 80+ practitioner |\n| Wound threshold | 12 | Physical damage valid only in material-adjacent state |\n| Initiative | Always last | Responds, does not initiate |\n| Thread operation | Weaving (automatic, no Leap) 1/round, Object scale |\n| Coherence | N/A | No rendering substrate to degrade |\nFull stat blocks require designer decision. Floor for simulation only.\n\
    [FLAGGED: full Mode 3 design deferred to Southernmost supplement.]\n\n## ED-029 Resolution (PP-290) — Purpose Tracking / Clarity [FLAGGED]\n\nClarity countdown adopted: Clarity = d3+1 at zone entry. −1 per hour of exposure.\nClarity 0: Spirit TN7 Ob2 or forced exit. TS ≥ 40: +1 Clarity at entry.\n[FLAGGED: confirm d3+1 range and Spirit check parameters.]\n\n## ED-034 Resolution (PP-291) — Ceiral Ritual MS Asymmetry\n\nBG Co-Movement cap (MS +1) applies only to BG-layer Thread abstraction.\nCeiral Ritual is a TTRPG Zoom In — operates at full TTRPG MS values, bypassing BG cap.\nNot a contradiction. ED-034 resolved — no mechanical change needed.\n\n## ED-036 Resolution (PP-292) — Altonian Invasion Unit Stats [FLAGGED]\n\nProvisional stats for simulation unblocking (ED-036 P1-BLOCKER):\n| Unit | Size | Command | Discipline | Power | DR |\n|------|------|---------|-----------|-------|----|\n| Vanguard Infantry | 6 | 4 | 5 | 3 | 2 |\n| Vanguard Cavalry | 4 | 5 | 4 | 4 | 1 |\n| Vanguard Siege\
    \ | 3 | 3 | 3 | 5 | 3 |\nAltonian faction: L 6, PS 6, Military 7, Stability 5. No Influence/Wealth/Intel in Valoria context. (NPC seed-equal per PP-686 v2 — no separate populist dynamic for Altonian invasion force at game start.)\n[FLAGGED: confirm unit stats before Altonian engagement is canonically simulated. P1-BLOCKER cleared provisionally.]\n\n## ED-143–146 Resolution (PP-323) — PC Simulation Constructs [FLAGGED]\n\nCanonical test characters adopted for mechanical testing:\n- **Mira Sondhal** (ED-143): Practitioner-Scholar. TS 61. Confirmed.\n- **Arend Voss** (ED-144): Crown Agent-Soldier. Confirmed.\n- **Sister Dagmara Kuhl** (ED-145): Church Renegade. Confirmed.\n- **Theron Ault** (ED-146): Guilds Fixer. Confirmed.\nDesigner retains right to revise names and backstory before player-facing publication.\n[FLAGGED: confirm canonical adoption or request redesign.]\n\n## ED-147 Resolution (PP-324) — Crown Covert Penalty [FLAGGED]\n\nCrown covert actions use Influence pool at +1 Ob\
    \ (Crown Intel 3 exists post ED-787 restoration but Influence 5 is more favorable; +1 Ob is the covert-action penalty per PP-236). PP-236 confirmed.\n+1 Ob is the provisional modifier — represents Crown's institutional weakness at covert operations.\n[FLAGGED: confirm +1 Ob or set alternative modifier before Crown Domain Action compilation.]\n\n## ED-148 Resolution (PP-325) — Public Instability Hybrid [FLAGGED]\n\nPublic Instability: Hybrid secondary clock. Range 0–10, start 5.\nIncreases: +1/season Revolution Agitation resolves (any degree); +1/season IP rises while CI > 40.\nDecreases: −1/season Crown or Guilds completes successful social DA in contested territory.\nThreshold 8: Revolution free Agitation action. Threshold 10: Institutional collapse check.\n[FLAGGED: confirm thresholds before Hybrid cascade compilation.]\n\n## ED-149 Resolution (PP-326) — Crown-Löwenritter Delegation [FLAGGED]\n\nWhen Crown delegates covert DA to Löwenritter: roll uses Löwenritter Intel pool.\nCrown\
    \ +1 Ob penalty does NOT apply — constraint is institutional, not operational.\nPolitical consequences of discovery fall on Crown. PP-241 confirmed.\n[FLAGGED: confirm penalty non-application to delegated actions.]\n\n## ED-151 Resolution (PP-328) — Scene→Mass Transition [FLAGGED]\n\nModifiers confirmed (PP-244/251):\n- PC Overwhelming: mass action −1 Ob\n- PC Success: no modifier\n- PC Partial: +1 Ob\n- PC Failure: +2 Ob\nMid-combat zoom: pause at round boundary, resolve Strategic Phase, resume next session.\nAUD-P1-15 provisionally closed.\n[FLAGGED: confirm modifier values before Hybrid compilation.]\n\n## ED-152 Resolution (PP-329) — Domain Echo Formal Rule [FLAGGED]\n\nDomain Echo: Cascade Phase conversion of personal scene outcome to faction stat change.\nMagnitude: Overwhelming = stat ±2 or clock ±3; Success = stat ±1 or clock ±2; Partial = narrative only; Failure = own faction stat −1.\nOne Domain Echo max per scene per faction. GM determines relevant stat and direction.\n[FLAGGED:\
    \ confirm clock magnitudes before Hybrid compilation.]\n\n## ED-174 Resolution (PP-335) — Public Instability Cascade Brake [FLAGGED]\n\nWhen Revolution passes a revolt-check (Agitation Partial or better and PI > 5):\nStability +1 (internal movement cohesion). This prevents PI from spinning Revolution into\na Stability death spiral. Applies once per season max.\n[FLAGGED: confirm +1 Stability cascade brake before IP/PI interaction compilation.]\n\n## Community Weaving — Cross-Reference (PP-250)\n\nCommunity Weaving canonical formula in params_threadwork.md PP-250.\nPrior entries under PP-168 (Influence/TT÷20) and PP-195 (Mandate+History/Ob3, where Mandate was the unsplit pool — see PP-616 + PP-686 v2 supersession) are deprecated.\nNot a Domain Action. No faction stat output. MS restoration only.\n\n## Church Martyrdom Effect (PP-259)\n\nWhen a public accusatory Contest against a Church leader fails (net < Ob, public venue, wrong Resonant Style):\nChurch gains Stability +1.\nConditions:\
    \ (a) public venue with witnesses, (b) accusatory mode used vs Consequence-mode NPC, (c) Failure or Partial result.\nApplies to: Himlensendt, Olafsson, Klapp as institutional representatives.\n\n## Resentment Tokens (PP-405 — ED-298 resolved)\n\nGenerated when a faction votes **No** on a parliamentary motion that is successfully blocked.\n- Acting faction gains **+1 Standing** (blocking reward).\n- A **Resentment token** (cube) is placed between the blocking faction and the proposing faction.\n- Effect: blocking faction gets **−1 Ob** on Domain Actions targeting the proposer; proposer gets **+1 Ob** on Domain Actions targeting the blocking faction.\n- Scope: parliamentary votes only. Domain Actions do not generate Resentment.\n- Expiry: cleared at Year-End if neither faction took a hostile Domain Action against the other during the year.\n- Early resolution: Diplomacy action (Ob 2), both factions must consent.\n- Abstaining generates no Resentment and no Standing gain.\n\n## Canonical\
    \ Coalition Pairs (PP-504 — supersedes PP-405; ED-299 resolved)\n\nUsed by PP-404 (Missed Coalition Ob Penalty). A coalition trigger requires both factions'\nrelevant stats to meet or exceed the listed threshold simultaneously.\n\n| Coalition | Factions | Trigger condition | Effect on activation |\n|-----------|---------|-------------------|----------------------|\n| Diplomatic Alignment | Church + Hafenmark | Both Influence ≥ 5 | +1D to each other's Diplomacy rolls for the season; once per season during a Parliamentary Session, both factions count as same-side voters regardless of their declared votes (PP-526) |\n| Military Compact | Varfell + Löwenritter | Both Military ≥ 5 | Shared unit deployment: one faction's Legionary card may be played in the other's adjacent territory without adjacency restriction; on activation both factions jointly declare one Named Enemy — each gains 1 CB vs Named Enemy (PP-507 cap); Named Enemy may be changed by mutual Phase 1 agreement; Compact dissolves\
    \ if either partner plays Legionary targeting the other |\n| Trade Compact | Crown + Hafenmark | Crown TCV ≥ 14 AND Hafenmark TCV ≥ 10 | Each faction's Trade/Govern in the other's territory: −1 Ob this season |\n| Thread Stewardship | Varfell + Restoration Movement | VTM ≥ 3 AND RM has ≥ 2 Presence markers | Restoration Community Weaving in Varfell territories: −1 Ob; Varfell Tribune actions in RM Presence territories: +1D |\n\nFog-of-war exemption applies to all coalitions per PP-404.\nCoalition triggers are public knowledge (the threshold conditions are known); only the current stat values are subject to fog of war.\n\n## Hafenmark — Diplomat Card (ED-320 RESOLVED)\n\nSee params_board_game.md §Hafenmark — Diplomat Card for full mechanics.\n**Summary:** Senator Outward, Influence vs Ob = floor(target L / 2) + 1, once/season. Diplomatic Tokens enable Parliamentary Session pre-commitment. Restriction: not Church if PI < 3.\n\n## Hafenmark — RDT/TD Tracks (ED-321 RESOLVED)\n\nFull tables\
    \ in params_board_game.md §RDT/TD.\n**Summary:** RDT 0–5 (Reformed Settlement advances); TD 0–5 (activates at RDT 2, advances when Church Asserts).\n\n## Church — Parish/Cathedral (ED-319 RESOLVED)\n\nFull rules in params_board_game.md §Parish/Cathedral System.\n**Summary:** 2 Consul Inward successes + 1W = Parish (PT floor 1). 5 total + 3W total = Cathedral (PT floor 2 + Prominence +1). Parish survives control change; Cathedral degrades to Parish.\n\n## Total Domination (ED-318 RESOLVED)\n\n**Available to all factions.** TCV ≥ 28 + all rivals at Stability 0 (eliminated OR Submitted) for 2 consecutive Accounting steps. Submission: voluntary at Stability 0; submitted faction becomes NPC vassal.\n\n## Varfell — Warden Recognition (WR) Track (ED-311 RESOLVED)\n\nRange 0–4. Replaces WA+WC split for Path B. See params_board_game.md §Varfell Path B for full rules.\n\n## Varfell — Revelation Tokens (PP-439)\n\nFull reveal = Overwhelming Tribune Investigate OR 4 consecutive PC Spy successes.\n\
    Token placed on target faction mat (public, permanent). Two tokens on different rival mats = Path A fully revealed condition met.\n\n## Crown — Royal Charter (PP-433)\n\nMax active Charters = floor(L / 2) + 1. Charter territory: Govern/Trade −1 Ob for all factions; Church Seizure +1 Ob; Crown own actions −2 Ob. Dissolves on control transfer.\n\n## Crown — Thread Liaison (PP-436)\n\nPhase 1 declarative. Designate one allied faction. Their Thread operations in Crown territories count toward Crown co-victory MS tracking. Dissolves on military conflict.\n\n## Crown — Diplomatic Outreach to Schoenland (PP-437)\n\nSenator Outward, Crown only. Influence vs Ob = Altonian diplomacy level min 1. Cannot combine with Formal Crown Treaty same season.\n\n## Counter-Intelligence Postures (PP-442)\n\n- Crown Royal Guard: cancel 1 Intel action targeting Crown per season (Phase 4 Priority 1, no card).\n- Hafenmark Procedural Objection: on Varfell Investigate success, costs Challenge use; if M ≥ 4, revealed\
    \ stat falsified for non-Varfell observers.\n- Church Sanctuary extension: also blocks Varfell 4-PC Spy once per season.\n\n## Baralta BG Conviction [PP-482, ED-080 resolved]\n\nFires at any Accounting where PI ≥ 6 OR Hafenmark TCV ≥ 12.\nEffect: Hafenmark L +1. One-time per game.\n\n## Vaynard BG Conviction [PP-483, ED-081 resolved]\n\nFires at any Accounting where VTM ≥ 4 AND Varfell controls T9 or T13.\nEffect: Varfell L +1 AND VTM +1. One-time per game. [TODO: VTM struck 2026-04-19 per CR-STRIKE; revisit Varfell special-action effect in next victory-paths editorial.]\n\n## Varfell Succession — Maret Uln [PP-486, ED-308 resolved]\n\nIf Vaynard eliminated (Loyalty 0 + L 0 + PS 0 — full institutional + populist collapse): Maret Uln becomes faction leader. VTM resets to 0. [TODO: VTM struck 2026-04-19; revisit.]\nVarfell aligns with RM goals: cannot target RM, cannot seize RM-held territory.\nThis is factional realignment, NOT RM Emergence — RM does not gain faction stats or independent\
    \ actions.\nThe triple-condition hostile RM Emergence trigger remains the canonical path for RM as a playable faction.\n\n## Baralta Succession — PI-Gated [PP-487, ED-309 resolved]\n\nIf Baralta eliminated (Loyalty 0 + L 0 + PS 0):\n- PI ≥ 4: institutional succession. Hafenmark L −1, Stability −1. All mechanics intact.\n- PI < 4: fracture. Hafenmark L halved AND PS halved (round down each, independent halving — institutional and populist collapse both register the fracture). TCV victory requirement +2. Parliamentary Sovereignty unavailable until PI recovers to ≥ 4.\nNo named successor. Hafenmark's identity is institutional.\n\n## Cardinal Focus Temperance — Altonian diplomacy Gain [PP-490, ED-328 resolved]\n\nAltonian diplomacy +1 requires 2 consecutive seasons of Cardinal Focus declaration (not each season).\nSeason 1: mark Focus-declared on Church faction mat.\nSeason 2 (consecutive): Altonian diplomacy +1 fires.\nIf the Church misses a season, the consecutive chain resets. No Altonian\
    \ diplomacy gain from a single-season declaration.\nThis prevents Season-1 Altonian diplomacy 3 and preserves meaningful commitment cost.\n\n## Torben Loyalty After Crown Elimination [PP-494, ED-332 resolved]\n\nIf Crown is eliminated: Torben Loyalty track transfers to Löwenritter as dynastic successor.\nLöwenritter inherits Torben's current Loyalty value. Track meaning shifts:\n0 = Torben aligns with anti-Löwenritter faction (Church or Restoration). 7 = full Löwenritter loyalty.\nIf Löwenritter is also eliminated: Torben Loyalty track becomes contested — all remaining factions\nmay spend 1 Domain Action (Diplomat Inward) to bid for Torben's allegiance. Highest bid wins Torben\nas a named NPC ally (+1D on one Domain Action category per season).\n[PROVISIONAL]\n\n## Cardinal Death — Holy See Succession [PP-498, ED-336 resolved]\n\nWhen a Cardinal is killed (by PC action or event):\n- Cardinal-specific BG mechanics (Fortitude Templar, Justice Inquisitor, Prudence Tithes, Temperance Altonian\
    \ diplomacy)\n  are suspended for 1 season (the Holy See appointment procedure takes time).\n- At next Accounting: Church player rolls Church L vs Ob 2 (Holy See appointment).\n  Success: new Cardinal appointed, full mechanics resume.\n  Overwhelming: Appointment + Altonian diplomacy +1 (the crisis galvanises Church unity).\n  Failure: gap extended 1 additional season. Another attempt at next Accounting.\n- CI effect: Cardinal death triggers CI +1 (institutional disruption).\n[PROVISIONAL]\n\n## Restoration Movement — Mode and Founding Status (PP-478, PP-495)\n\n**BG-only mode:** Not a playable faction. No player controls RM.\n**Hybrid mode:** Not present at game start. Founded mid-campaign via Founding Mechanic (see params_board_game.md §RM Founding Mechanic). Post-founding stats depend on Founding degree (Success: Mandate 1/Influence 2/Wealth 1/Military 0/Stability 3; Overwhelming: Mandate 2/Influence 3/Wealth 1/Military 0/Stability 4).\n**TTRPG mode (PP-495):** Not present at campaign\
    \ start. GM introduces RM as an emergent faction when all narrative conditions converge: (1) cultural shift visible — at least 2 communities/NPCs have expressed dissatisfaction with Church authority or sympathy for Einhir practice in play; (2) substrate strain noticeable — Thread operations have produced visible consequences (Thread Wounds, Coherence loss, MS decline); (3) player engagement — at least one PC has interacted with Einhir cultural knowledge, Southernmost artefacts, or practitioner communities. GM declares the Founding Scene. A named NPC or PC becomes the Founding Agent. RM gains the stat block from §8.8. Floor: session 6 of a standard campaign (political landscape must develop before RM complicates it).\nPrior RM stat entries (Mandate -, Influence -, etc., where Mandate was unsplit pre-PP-686 v2) reflect pre-Founding state (RM does not exist). Post-Founding stats supersede those entries. (RM is statless per PP-460 — Founding mechanic likely obsolete; flagged for review.)\n\
    \n## NPC Recruitment — Faction Consequence (PP-643)\n\nOn successful NPC recruitment (npc_behavior_v30.md §9.5 Step 4 — Success or Overwhelming):\n- Losing faction: PS −1 in the NPC's primary territory (talent drain signal — populist defection rather than institutional discipline failure).\n- Applies once per recruitment. Does not stack with other L or PS penalties.\n- Overwhelming result additionally provides recruiting faction one Evidence token (Verified).\n- NPC's Disposition toward former faction drops to 0 on departure (regardless of prior value).\n"
  engine/params/factions/stats_1_7_scale.md: "## Stats (1–7 scale)\n\n**Faction stats (6): Mandate / Influence / Wealth / Military / Intel / Stability.** Mandate is the headline (DERIVED — size-weighted aggregate of per-SETTLEMENT Legitimacy + Popular Support; settlement_layer §1.8).\n\nIntel restored as canonical stat (between Military and\nStability) per ED-787 Position A 2026-05-03 — c2effdd Renaissance political-\ninfrastructure review carried; ED-748 STRUCK ruling overridden. Spy Ob formula\n`floor(target Intel / 2) + 1` is no longer broken; institutional intelligence\ncapacity is now a faction-level mechanical axis (ED-787 closure rationale: see\ndesigns/audit/2026-05-01-stage-10-validation/05_ED-755_resolutions.md §3.1\nAddendum).\n\nSeasonal cap: ±2 per stat per season (TTRPG); ±varies (BG — see accounting).\n\n## Starting Stats\n\n| Faction | L (TTRPG) | PS (TTRPG) | L (BG) | PS (BG) | I | W (TTRPG) | W (BG) | Mil | Int | Sta |\n|---------|-----------|------------|--------|---------|---|-----------|--------|-----|-----|-----|\n\
    | Crown | 5 | 5 | 5 | 5 | 5 | 4 | 4 | 5/6 | 3 | 4 | <!-- Mil: Crown fields the Löwenritter (5/6); prior value 4 struck per ED-869 / Jordan 2026-05-31 -->\n| Church | 5 | 5 | 5 | 5 | 6 | 5 | 5 | 4 | 4 | 5 |\n| Hafenmark | 4 | 4 | 4 | 4 | 4 | 5 | 5 | 3 | 3 | 4 |\n| Varfell | 4 | 4 | 4 | 4 | 4 | 4 | 4 | 4 | 4 | 4 |\n| Guilds | 3 | 3 | 3 | 3 | 4 | 6 | 6 | 2 | 4 | 5 |\n| Restoration Movement | — | — | — | — | — | — | — | — | — | No faction stats (PP-460). Operates via Presence markers and Community Weaving. Victory via Cultural Uprising of T9 Himmelenger. |\n| Löwenritter | — | — | 3 | 3 | 2/3 | — | — | 5/6 | 3 | 5/4 |\n\n**Intel column rationale (ED-787 closure 2026-05-03, Position A applied):**\n\n| Faction | Int | Rationale |\n|---------|-----|-----------|\n| Crown | 3 | Royal court has some intelligence capacity but not a priority. |\n| Church | 4 | Inquisition + nuncio network — institutional intelligence woven into existing diocesan and missionary infrastructure. |\n| Hafenmark | 3\
    \ | Merchant intelligence (trade routes are information routes), but not institutionalized as primary capability. |\n| Varfell | 4 | Pragmatic intelligence use (opportunist/revolutionary) but NOT specialist-themed. The Renaissance review proposed 5 framing Varfell as the Venice-analogue intel-superior faction; ED-787 closure (per Jordan 2026-05-03) revises to 4: Varfell is \"press whatever advantage possible\" — uses information pragmatically — not the institutionalized intel apparatus that 5 would imply. Their identity axes are anti-Altonian and caste-system-breaking, not intelligence-themed. |\n| Löwenritter | 3 | Military order, modest intelligence infrastructure (already authored — pre-ED-787, retained). |\n| Guilds | 4 | Trade networks provide intelligence; commercial information flows institutionalize partial intel capacity. |\n\n**Mechanical roles for Intel (per Renaissance review — now restored):**\n\n- **Defensive intelligence** (counter-espionage): `Spy Ob = floor(target Intel\
    \ / 2) + 1`. Previously broken (referenced struck stat); now operational.\n- **Offensive intelligence quality**: Investigate/Intel pool = Intel (not flat Influence as fallback).\n- **Counter-espionage detection** at Intel ≥ 4: on enemy Spy attempt in your territory, roll Intel vs Ob 3. Success = you learn the spy action occurred (not its result).\n- **Strategic fog**: without successful Intel action, enemy faction stats are hidden. Intel reveals them.\n\nNote: Varfell BG L 4 / PS 4 (post PP-686 v2 split, seed equal per factions_personal.md / faction_behavior_v30 §3.4-3.5) / Wealth 4 is intentional (political isolation at game start, not their full institutional depth). Pre-existing inconsistency: an earlier version of this footnote said \"Mandate 3 / Wealth 3\" while the Starting Stats table above shows Varfell BG Mandate 4 / Wealth 4. The table is authoritative; this note now matches. [TODO: confirm with Jordan if intent was 3 (footnote) or 4 (table) — flagged as part of ED-784 Phase\
    \ 2 sweep, not blocking.]\n\n## Clock Starting Values\n\n| Clock | TTRPG | BG (bg_v05 P-32) | Shared Loss |\n|-------|-------|-----------------|-------------|\n| Church Influence | 0 | 28 | — |\n| Mending Stability | 60 | 72 | Mending Stability = 0 |\n| Institutional Pressure | 20 | 20 | — |\n| Public Instability | — | 5 | — |\n\n## Domain Action Resolution (deterministic+stochastic) — CANONICAL (ED-874, ratified 2026-05-31; basis: ER-1 degeneracy + CK3/EU/KoDP precedent + Jordan authority — not GD-2)\n\n**This is the canonical resolution method for faction Domain Actions and bare-stat faction checks.** It supersedes the bare-stat-pool-vs-Ob dice approach (retained below for legacy/Zoom-In reference only). Jordan-directed ratification of the Stage-1/4/5-tested candidate (`designs/audit/2026-05-28-resolution-diagnostic/domain_action_resolver_spec.md`).\n\n**Why deterministic+stochastic.** The bare-stat d10 pool gave neither legible odds nor uniform leverage at the small pools faction\
    \ stats produce (1–7), making *noise* decisive on pivotal, irreversible outcomes where structure should be. Validated against precedent (Stage 5): the COIN / political-contest literature (`ners_historical_precedent_matrix.md` entry 2) finds real seizures/votes/coups are **structure-decisive with a stochastic tail, not low-variance coin-flips** — exactly what this resolver produces. It also restores consistency with the faction layer's deterministic-accounting spine.\n\n**Resolver.**\n\n```\nmargin  M = acting_stat − difficulty\n   difficulty = the contested target's relevant stat (contested actions),\n            # [F2 reconciliation, FSS-F2, 2026-05-30] This is the canonical home of the \"Ob = target stat\n            #  directly\" form in factions_personal_v30 §8.1 — the CONTESTED case. The factions_personal §8.1\n            #  line and this resolver line are the SAME rule, not conflicting canon (diagnostic F2 closed).\n                OR a fixed action-difficulty rating (non-contested\
    \ actions).\n   Legacy Ob mapping: an action previously \"vs Ob O\" has difficulty D = max(1, (O−1)·2).\n\nP_success(M)        = clamp(0.50 + 0.10·M, 0.05, 0.90)            # at-least-Success\nP_overwhelming(M)   = clamp(0.50 + 0.10·M − 0.35, 0, 0.55)\nP_atleast_partial   = clamp(0.50 + 0.10·M + 0.20, P_success, 0.97)\n\ndraw r ~ U[0,1)  (lower = better):\n   r < P_overwhelming                     → Overwhelming\n   P_overwhelming ≤ r < P_success         → Success\n   P_success ≤ r < P_atleast_partial      → Partial\n   r ≥ P_atleast_partial                  → Failure\n```\n\n**Canonical parameters** (ratified; tunable by future Jordan-logged ratification): BASE 0.50 (even contest is fair), SLOPE **0.10 — leverage is +10% per stat-point of margin, CONSTANT across the whole 1–7 range** (this is what closes the σ-leverage non-uniformity, ED-874; no dice pool can — leverage ∝ 1/√N is irreducible for pools), FLOOR 0.05 (punching-up is hard but never impossible — fixes the ~1% wall), CAP\
    \ 0.90 (overmatch reliable but never certain), plus the band offsets above. Live leverage zone M ∈ [−4, +4]; beyond, FLOOR/CAP clamp.\n\n**Output is unchanged.** The resolver emits the same four-degree ladder (Failure/Partial/Success/Overwhelming) the dice system did, so Domain Echo (`scale_transitions_v30` §5: Success +1, Overwhelming +2, cap ±2) and all cost tables are untouched — only the resolution *method* changes.\n\n**Governed checks (migration, ratified 2026-05-29).** The following faction bare-stat checks resolve via this method, with their named outcome-hooks preserved on the corresponding degree:\n- **All faction Domain Actions** (Assert, Reconstitute, Govern, Claim Masterless, etc.). Assert: M = Influence − 2 (legacy Ob 2 → difficulty 2). Reconstitute: M = Influence − 6 (legacy Ob 4 → difficulty 6).\n- **Suppress** — M = Mandate − (Church-L difficulty); **Failure → Stability −1 retained** (the PP-403 named exception attaches to the resolver's Failure degree).\n- **Parliamentary\
    \ Rebuttal** — **Overwhelming → +1 effect retained** (attaches to the resolver's Overwhelming degree).\n- **Treaty positioning & ratification** (faction_layer_v30 §3.3; ED-874 extension, 2026-05-30). Positioning (contested): M = own Influence − target Influence (Success+ → initiator sets opening terms). Ratification: M = Mandate − 2 (legacy Ob 2 → difficulty 2). Guarantor option → +1 M; Grand Debate Zoom-In degree → margin (Overwhelming +2 / Success +1 / Partial 0 / Failure −1). The Grand Debate social contest itself remains dice (scope boundary). CI institutional weight (Church) = +⌊CI/20⌋ to M (ci_political_v30 §3.2). Precedent: power-structural treaty-making (COIN/structural-contest, matrix entry 2).\n- **§1.4 Accounting Stability Check** — M = Stability − loss_magnitude; resolves via this method. **Co-designed with §1.3 Institutional Consolidation recovery (CC-4):** §1.4 is the cascade-DAMAGE check (Failure → −1); §1.3 is the deterministic clean-season +1 recovery. They operate on\
    \ different triggers and do not double-count.\n\n- **Unique Actions (migrated 2026-05-30, ED-874 — Jordan-ratified 2026-05-31).** Formerly bare-stat \"vs Ob\" rolls; now resolve via this method with named degree effects preserved on the ladder: **Royal Decree** M = Mandate − 2 (legacy Ob 2); **Excommunication** contested (faction leader) M = Mandate − target Mandate, non-leader M = Mandate − 2; **Private Collection** M = Intel − 2; **Economic Leverage** contested M = Wealth − target Wealth. A degree band an action's table omits takes the next-lower listed result (a Success/Failure action treats Partial as Failure). *(Hafenmark Sovereign Authority Doctrine — bare Mandate vs Ob 4 — is the same class but was not in the ratified four; pending decision.)*\n\n**Scope boundary.** This method governs **bare-stat faction checks only.** Healthy dice systems — personal combat, social contest (pools 5–18D), aggregated mass battle — **remain dice** (NERS-N/E: replacing them would add complexity without\
    \ fixing a defect). Trigger-5 (mass-battle resolution, ED-876) is dice and **orthogonal** to this resolver.\n\n## Domain Action Rules (TTRPG) — SUPERSEDED for faction Domain Actions (legacy / Zoom-In reference)\n\n> **[SUPERSEDED 2026-05-31, ED-874]** For faction Domain Actions, the deterministic+stochastic resolver above is canonical. The bare-stat-pool-vs-Ob method below is retained only as the legacy reference and for any explicit TTRPG-era Zoom-In context.\n\nOb = floor(relevant stat / 2) + 1.\nAttacker bonus dice: own faction's relevant stat if holding faction leadership.\nNon-Player Character faction rolls: relevant stat as d10 pool, TN 7.\n\n## CI Passive Advance (PP-402)\n\nChurch Influence (CI) advances by **+1 per season** from institutional momentum, regardless of Church action.\nApplied at Accounting before Assert/Suppress resolution.\n\n| Action | CI effect |\n|--------|-----------|\n| Passive baseline | +1 (always) |\n| Assert (Church) | +2 total (replaces passive; not\
    \ additive) |\n| Suppress (Crown or Hafenmark Domain Action) | Negates passive +1 for that season only. CI does not decrease. Ob = floor(Church L / 2) + 1 ÷ 2 (round up, min 1). |\n\nSuppress may be declared once per season by one faction. It cannot reduce CI below its value at season start.\nTTRPG: same rule applies. BG: same rule applies; Suppress is a Standard Action consuming one card.\n\n## Failed Domain Action Stability Cost (PP-403)\n\nA Domain Action that results in **Failure** (net successes ≤ 0) costs the acting faction **−1 Stability**.\nPartial success (net > 0 but < Ob): no Stability cost.\nSuccess/Overwhelming: normal effect, no cost.\n\n**Scope exclusions:**\n- Does not apply to self-improvement Domain Actions (acting faction targeting own stats).\n- Does not apply to TTRPG personal scene rolls or Thread operations.\n- Does not apply to Restoration Movement (RM has no Stability — PP-460).\n- Applies to faction-layer Domain Actions only.\n\n**Stability 1 edge case:** If\
    \ Stability is already 1, a Failure reduces it to 0, triggering an immediate Stability Check (existing mechanic). Factions with low Stability are further discouraged from sub-threshold gambles.\n\n## ~~Ethical Framework Ob Modifiers~~ — SUPERSEDED 2026-05-02 (PP-686 v2 / ED-784)\n\n<!-- [SUPERSEDED 2026-05-02 — SUPERSESSION-PP686-002] Replaced by triadic decomposition in designs/provincial/faction_behavior_v30.md §3.7: mission_alignment_modifier + cascade_alignment_modifier + expectation_alignment_modifier, clamped at ±2 (was ±3 — sim v2 confirmed ±3 produced dominant-strategy at high alignment). Strictness functions only as deviation-cost modulator (Crown Policy gate). See ED-784, params/bg/core.md (struck 2026-05-01 SUPERSESSION-PP686-001), params/factions_personal.md (struck 2026-05-01 same supersession), and audit §2.1. Retained below struck for patch-history reference only — do not implement. -->\n\n~~| Condition | Modifier |~~\n~~|-----------|---------|~~\n~~| Action aligned with\
    \ framework | −1 Ob |~~\n~~| Action contradicts framework | +1 Ob |~~\n~~| Church only: reveals Thread truth | +2 Ob |~~\n\n## Leadership Deviation Stability Check Obs\n\nCrown: 2 | Church: 3 | Hafenmark: 2 | Varfell: 2 | Guilds: 2 | Restoration Movement: 2 | Löwenritter: 2\n\n## Unique Actions (TTRPG, from stage6)\n\n| Faction | Action | Roll | Effect |\n|---------|--------|------|--------|\n| Crown | Royal Decree | d+σ resolver: M = Mandate − 2 | One faction stat ±1 immediate. Consecutive: +1 Ob/season. Cannot target Intel. |  <!-- LPS-1: L→Mandate -->\n| Church | Excommunication | d+σ resolver: M = Mandate − target Mandate (leader) / Mandate − 2 (non-leader) | Strips Circles bonus; −1 Legitimacy to each of the target's controlled settlements (settlement_layer §1.8). Reversal: Grand Debate (5 exchanges) or new Confessor. |\n| Church | Church Influence 60 Territorial Seizure | Influence + floor(CI/15) vs Ob = 7 − PT | Per-province seizure roll; AUTHORITATIVE per faction_layer §2.7.\
    \ Success: administrative control. Failure: Mandate −1. |\n| Restoration Movement | Community Weaving | Presence markers −1 Ob (base Ob 2) | Mending PS prerequisite: COMMUNITY-level PS ≥ 1 in a Presence locality (RM territoryless; faction_state_authoring §6 / LPS-1) |\n| [Others] | See stage6_factions.md §8.4–8.9 | — | Hafenmark, Varfell, Guilds, Löwenritter unique actions not extracted |\n\n## Nine Political Axes (qualitative — not tracked numerically)\n\n1. Sovereignty: Crown authority vs Church authority\n2. Knowledge: Thread truth accessible vs suppressed\n3. Legitimacy: Constitutional monarchy vs Theocratic governance\n4. Cultural identity: Einhir recovery vs Colonial settlement\n5. Economic control: Guild autonomy vs State/Church taxation\n6. Military authority: Ducal/Crown vs Templar independence\n7. Information: Transparency vs Secrecy\n8. External threat: Accommodation vs Resistance to Altonia\n9. Ontological: World as it appears vs World is more\n\n## Faction Non-Player Character\
    \ Trigger Conditions (key)\n\n| Non-Player Character | Trigger | Effect |\n|-----|---------|--------|\n| Ehrenwall | Coup trigger | Martial Law; Crown Loyalty check |\n| Vaynard | TK threshold | Research acceleration |\n| Baralta | Church Influence suppression | −1 Legitimacy/season to each Church-controlled settlement (settlement_layer §1.8) while Baralta L ≥ 4 |\n| Schoenland | Active spoiler | Various faction disruptions |\n\nMending Stability ≤ 10 adds +1 to coup/succession trigger check pools.\n\n## Unique Actions — All Factions (PP-168)\n\n### Crown — Royal Decree\nResolution: d+σ resolver (§Domain Action Resolution) — M = Mandate − 2 (legacy Ob 2). Once per season. Consecutive seasons: difficulty +2/season (legacy +1 Ob).  <!-- LPS-1: L→Mandate -->\n| Degree | Result |\n|--------|--------|\n| Overwhelming | One faction stat ±1 immediate; consecutive seasons: +1 Ob/season |\n| Success | One faction stat ±1 immediate; consecutive seasons: +1 Ob/season |\n| Failure | — |\nCannot\
    \ target Intel. Effect is immediate and unilateral.\n\n### Church — Excommunication\nResolution: d+σ resolver (§Domain Action Resolution) — contested (faction leader): M = Mandate − target Mandate; non-leader: M = Mandate − 2 (legacy Ob 2).  <!-- LPS-1: L→Mandate (faction-vs-faction); effects reconcile per settlement_layer §1.8 -->\n| Degree | Result |\n|--------|--------|\n| Success | Strips target's Circles bonus; −1 Legitimacy to each of the target's controlled settlements (settlement_layer §1.8) |\n| Failure | — |\nReversal: Grand Debate (5 exchanges) or new Confessor appointed.\n\n### Church — CI 60 Territorial Seizure\nTrigger: Church Influence (CI) reaches 60. Fires once per territory.\nRoll: Influence + floor(CI/15) vs Ob = 7 − PT (AUTHORITATIVE per faction_layer §2.7; supersedes the stale L-based formula). Failure → Mandate −1.\n| Degree | Result |\n|--------|--------|\n| Success | Administrative control of territory. Domain Actions vs Church authority require +2 Ob. Flat Church\
    \ Influence value fires immediately. |\n| Failure | Mandate −1 (authoritative faction_layer §2.7) |\nRiskbreaker exposure removes seized territory and prevents re-seizure for one season.\n\n### Hafenmark — Sovereign Authority Doctrine\nRoll: Mandate vs Ob 4. Once per campaign arc.  <!-- LPS-1: L→Mandate -->\n| Degree | Result |\n|--------|--------|\n| Overwhelming | Church Influence −3; −1 Legitimacy to each Church-controlled settlement (settlement_layer §1.8); Heresy Investigation blocked this season; +1D social vs Church for the arc |\n| Success | Church Influence −2; −1 Legitimacy to each Church-controlled settlement (settlement_layer §1.8); Heresy Investigation opens (Ob 4 to pursue) |\n| Partial | Church Influence −1; Heresy Investigation opens immediately; Church Influence +1 |\n| Failure | Church Influence +1; Heresy Investigation immediate; Baralta's L −1 |\nCI Suppression: while Baralta's L ≥ 4, Church Influence −1/season. Suppression ends if L < 4 or excommunication (CI +4\
    \ immediately).\n\n### Varfell — The Private Collection\nResolution: d+σ resolver (§Domain Action Resolution) — M = Intel − 2 (legacy Ob 2). Once per season.\n| Degree | Result |\n|--------|--------|\n| Success (choose one) | +2D to one Thread-related Domain Action this season; OR reveal one hidden faction attribute; OR −1 Ob to one Einhir Research action this season |\n| Failure | Artefact's Thread signature detected by a practitioner; Church Intel +1D vs Varfell for 1 season; Thread Tension +1 |\nLong-term cost: each use: +1 to Vaynard's hidden Thread Sensitivity (TS). At Thread Sensitivity 14+, each use triggers Spirit check TN 7 Ob 1 for a Discovery Event.\nPlayer Character takeover: collection transfers as institutional asset; triggers mandatory Discovery Event for new leader (Spirit TN 7 Ob 1; Success: Thread Knowledge (TK) +1; Failure: Truth −1, new Belief offered).\n\n### Guilds — Economic Leverage\nTrigger: Guild Favour ≥ 5 in target territory (1–7 territory track).\nResolution:\
    \ d+σ resolver (§Domain Action Resolution) — contested: M = Wealth − target faction's Wealth.\n| Degree | Result |\n|--------|--------|\n| Overwhelming | Target loses 1 Wealth + 1 Prosperity in that territory |\n| Success | Target faction loses 1 Wealth for 1 season |\n| Failure | Guild Favour −1 in that territory |\nCannot target factions in territories where Guild Favour < 5.\n\n<!-- §Niflhel — The Quiet Network deleted 2026-04-30 — was STRUCK per conflict_architecture_proposal §Niflhel Dissolution. Functions distributed to settlement-level intelligence brokers (settlement_layer §4.7-4.9). -->\n\n\n### Restoration Movement — Community Weaving [SUPERSEDED by PP-616]\n\n> **SUPERSEDED:** This spec is superseded by `params/threadwork.md` PP-616 (Community Organizing — Canonical Pool). PP-616 unifies all Thread operations under a single pool formula: `(Spirit × 2) + History + TPS`, supersedes the Influence-pool framing, replaces Thread Tension effect with direct MS effect, and removes\
    \ the Domain Action framing (\"Not a Domain Action — a Thread operation\"). Co-Movement card draw per P-01 remains canonical. Retained below for patch-history reference only — do not implement.\n\nRoll: Influence vs Ob = Thread Tension ÷ 20 (round up).\nRequires: at least one practitioner with Thread Sensitivity (TS) 30+ affiliated with the Restoration Movement.\n| Degree | Result |\n|--------|--------|\n| Overwhelming | Thread Tension −2 |\n| Success | Thread Tension −1 |\n| Partial | Thread Tension unchanged; Stability −1 |\n| Failure | Stability −1; Thread Tension +1 |\nCo-Movement Card drawn on every result (P-01 compliance).\nPrerequisite: PS ≥ 1 for Mending prerequisite (see stage6 §8.8).\n\n### Löwenritter — Martial Law / Coup Trigger\nNo standard Unique Action roll — Löwenritter action is triggered by Graduated Autonomy reaching 4.\n**Graduated Autonomy increments (+1 each):**\n- Church Influence reaches 40 while Crown took no action to reduce it that season\n- Torben's loyalty\
    \ reaches 3–2 or lower\n- Crown loses 2+ territories in one season without a military response Domain Action\nCounter never decrements. Fires at next seasonal accounting once at 4. (PP-577: threshold unified to 4, per params_board_game canonical)\n**Martial Law effects:** All non-Military Domain Actions in Crown territories require secondary Military check (Löwenritter Military pool, TN 7, Ob 2); failure blocks the action. Persists until players remove it (Influence vs Ob = Löwenritter Military ÷ 2, round up, min Ob 3) or Church Influence drops below 40.\n\n## Mandate Recovery (L + PS independently, ED-066b — REVISED by LPS-2e 2026-05-30: per controlled SETTLEMENT)\n\n> **[REVISED by LPS-2e (settlement_layer §1.8).]** L and PS are per-settlement; this recovery applies **per controlled settlement** (a settlement with L/PS below its seed recovers +1/season under the conditions), then Mandate re-aggregates.\n\nA controlled settlement with L < its seed value recovers +1 L/season AND with\
    \ PS < its seed value recovers +1 PS/season independently when:\n- No hostile Domain Action targeting that faction this season\n- Stability ≥ 2\nCap: neither L nor PS can recover above its starting value via this mechanic. [PROVISIONAL]\n\n## Hafenmark Wealth Sink (ED-064b resolved — provisional)\n\nWealth above 5 may be spent as bonus dice on trade-adjacent Domain Actions:\n- 1 Wealth token → +1D on Trade or Diplomacy Domain Action (max +2D per action)\n- Token is consumed on spend\n[PROVISIONAL]\n\n## Military Stat Change on Unit Destruction (ED-017 resolved — provisional)\n\nWhen a unit is destroyed in TTRPG mass combat: Faction Military −1 (immediate). Cap: −2 per season from destruction. [PROVISIONAL]\n\n## Military Seasonal Cap (ED-039 resolved — provisional)\n\nMilitary stat cap: ±2/season from all Domain Actions combined. Hard cap = faction Military rating (cannot exceed starting value +1 via Domain Actions alone). [PROVISIONAL]\n\n## Institutional Mandate Trigger (L-only per\
    \ audit Q2; ED-003 resolved — provisional)\n\nInstitutional Mandate (L) fires when:\n- Faction L ≥ 4, AND\n- A Domain Action directly challenges the faction's core institutional authority:\n  Crown: sovereignty or legal authority; Church: spiritual authority or excommunication power;\n  Guilds: trade monopoly or taxation; Hafenmark: guild autonomy; Varfell: territorial governance;\n  Restoration: community organizing; Löwenritter: military authority.\n[PROVISIONAL]\n\n## PC Faction Embedding — BG Layer (ED-075 resolved — provisional)\n\nPCs are always mechanically present in their primary faction between Zoom Ins.\nEffect: the PC's faction gains +1D on one Domain Action per season in territories the PC is physically located in (narrative confirmation required). [PROVISIONAL]\n\n## Institutional Mandate — Uphold / Appease (PP-189; L-only per audit Q2)\n\nTrigger: L ≥ 4 AND Domain Action directly challenges faction core institutional authority.\n| Choice | Timing | Effect | Cost |\n|--------|--------|--------|------|\n\
    | Uphold | Before roll | Roll proceeds | None |\n| Appease | Before roll | Action cancelled | L −1 |\nNPC: Appease if L ≥ 4 AND Stability ≤ 3.\n\n## Community Weaving — Procedure (PP-195) [SUPERSEDED by PP-616]\n\n> **SUPERSEDED:** This procedure is superseded by `params/threadwork.md` PP-616 (Community Organizing — Canonical Pool). PP-616 changes: (1) pool formula from `Mandate + History` to `(Spirit × 2) + History + TPS` unifying all Thread operations; (2) removes Domain Action framing — Community Organizing is a Thread operation, not a DA (\"One per contact window round. Not a Domain Action.\"); (3) removes the Failure → Mandate −1 consequence. PS ≥ 1 prerequisite retained (Mending PS). The [PROVISIONAL] tag is removed — PP-616 is final. Retained below for patch-history reference only — do not implement.\n\nRevolution Domain Action. Pool: PS (as dice) + History, TN 7, Ob 3. Prerequisite: PS ≥ 1.\n| Degree | MS Effect | Other |\n|--------|-----------|-------|\n| Overwhelming | MS +2\
    \ | PS unchanged |\n| Success | MS +1 | PS unchanged |\n| Partial | MS +0 | Wasted action |\n| Failure | MS +0 | PS −1 |\nFrequency: once per season. Consumes 1 Domain Action.\n\n## Simultaneous Catastrophe Rule (PP-199 — ED-077)\n\nIf MS=0 AND IP≥80 both trigger in the same Accounting phase:\n1. MS=0 resolves first (Shared Loss: game-ending Thread collapse condition).\n2. IP≥80 Altonian invasion pressure resolves second.\nBoth are independent effects. Priority: MS=0 > IP threshold. If MS=0 triggers Shared Loss end condition, IP escalation is moot.\n\n## Reformed Settlement Standing Effect (PP-201 — ED-081)\n\nWhen Reformed Settlement is in force (Church Influence ≥ 40 and Church has Resisted):\n- All Diplomacy Domain Actions targeting Hafenmark: permanent +1 Ob (Church institutional antagonism).\n- Effect persists until Church Influence drops below 40 OR Reformed Settlement is withdrawn.\n[Source: bg_v05 Cascade Test 2 simulation]\n\n## Restoration Movement — Named NPCs (ED-005 resolved\
    \ 2026-04-03)\n\n1. **MARET VOSSEN** — Primary contact. Grassroots organiser. TS 0, Charisma 5+, Circles 3+ in working-class networks. Non-practitioner. Full stat block deferred to campaign development.\n2. **ALDRIC HANN** — Operational doer. Lower Charisma than Vossen, higher Circles in logistics and street-level networks. Full stat block deferred.\n\n## Riskbreakers — Identity Confirmed (ED-006 resolved 2026-04-03)\n\nExtralegal arm of the Löwenritter. Small-cadre elite consequentialists loyal to Valoria as concept — not to Crown, institution, or faith.\nWill go extralegal (blackmail, hostage, theft, murder) when judged necessary for Valoria's survival.\nExistence known only to Crown and Lions' Table. Active concealment is core doctrine.\nSome members are Thread Practitioners. Operate alone or in small teams; present as ordinary people.\nWill not permit Valoria to fall under weak-willed, foreign, or religious rule.\nParallel archetype: Shadow Warriors (Sousou no Frieren).\nIndividual\
    \ profiles and stat blocks deferred to campaign development.\n\n---\n<!-- PP-236 applied 2026-04-04: Crown covert actions rule -->\n<!-- PP-237 applied 2026-04-04: Public Instability Hybrid definition -->\n<!-- PP-238 applied 2026-04-04: Lowenritter reactive Military NPC guidance -->\n<!-- PP-241 applied 2026-04-04: Crown-Lowenritter covert delegation rule (PROVISIONAL) -->\n<!-- PP-244 applied 2026-04-04: Scene→Mass transition modifier table (PROVISIONAL) -->\n<!-- PP-246 applied 2026-04-04: Lowenritter ethical framework modifiers extracted; Niflhel struck per CR-STRIKE-2026-04-19. -->\n\n## Crown Covert Actions (PP-236) [PROVISIONAL — pre-ledger, accepted as canonical per 2026-04-26 audit]\n\nCrown has NO Intel stat. Crown covert actions (investigation, sabotage, intelligence gathering) use the **Influence** pool at **+1 Ob**. This is a faction design constraint: Crown is institutionally weakest at covert operations. The +1 Ob penalty applies to all Crown-initiated covert Domain Actions\
    \ regardless of the action's formal label.\n\n## Crown-Lowenritter Covert Delegation (PP-241) [PROVISIONAL — pre-ledger, accepted as canonical per 2026-04-26 audit]\n\nWhen Crown delegates a covert Domain Action to Lowenritter, the roll uses **Lowenritter Intel** pool. The Crown covert +1 Ob penalty does NOT apply — the constraint is institutional, not operational. Lowenritter acts as Crown's deniable agent. Political consequences of Lowenritter action discovery fall on Crown, not Lowenritter.\n\n## Public Instability — Hybrid Mode (PP-237) [PROVISIONAL — pre-ledger, accepted as canonical per 2026-04-26 audit]\n\nPublic Instability is a Hybrid-mode secondary clock.\n- Range: 0–10. Starting value: 5.\n- In TTRPG mode: not a separate clock. Effects folded into Institutional Pressure.\n- Hybrid increases: +1 per season Revolution Agitation resolves (any degree); +1 per season IP increases while CI > 40.\n- Hybrid decreases: −1 per season Crown or Guilds completes successful social Domain\
    \ Action in contested territory.\n- Threshold 8: Revolution gains one free Agitation action at no Domain Action cost.\n- Threshold 10: Shared loss condition check (Institutional collapse — distinct from MS=0 Rupture).\n\n## Lowenritter Reactive Military NPC Guidance (PP-238)\n\nLowenritter NPC AI priority: if any bordering faction's Military exceeds Lowenritter Military, Lowenritter NPC AI prioritises Military Consolidation (internal) the following season. This is a guidance rule, not a threshold mechanic — no automatic trigger fires.\n\n## Scene→Mass Transition Modifiers — Hybrid (PP-244) [PROVISIONAL — pre-ledger, accepted as canonical per 2026-04-26 audit]\n\nWhen a personal combat scene precedes or overlaps a Strategic Phase mass action:\n- PC Overwhelming success: mass action at −1 Ob (officer neutralised, morale advantage)\n- PC Success: no modifier\n- PC Partial: mass action at +1 Ob (position degraded)\n- PC Failure: mass action at +2 Ob (PC captured/incapacitated; morale cost)\n\
    Mid-combat zoom: pause combat. Resolve Strategic Phase. Apply mass outcome as context. Resume personal combat next session.\n\n## ~~Ethical Framework Modifiers — Löwenritter (PP-246)~~ — SUPERSEDED 2026-05-02 (PP-686 v2 / ED-784)\n\n<!-- [SUPERSEDED 2026-05-02 — SUPERSESSION-PP686-003] Per-faction Ethical Framework table superseded alongside the general framework (SUPERSESSION-PP686-002 above). Löwenritter's Mission/cascade/expectation tags now authored in faction state per faction_behavior_v30.md §3.7 (Mission \"Honour the Crown's institutional authority\"; cascade narrow alignment with Crown procedural decisions; populist expectations track populist Crown loyalty). The previous binary \"aligned vs contradict\" framing is replaced by the triadic decomposition. Retained below struck for patch-history reference only — do not implement. -->\n\n~~| Faction | Framework | Aligned (−1 Ob) | Contradict (+1 Ob) |~~\n~~|---------|-----------|----------------|-------------------|~~\n~~| Löwenritter\
    \ | Martial Honour | Military actions + Crown-loyal actions | Political manipulation; acting against Crown interest |~~\n\n## PP-242 — Seasonal cap timing\n\n±2 cap applied at accounting. Multiple actions within a season tally; net clipped at accounting.\n\n## PP-243 — Royal Decree partial-sheet\n\nDecree may only target stats present on target faction's sheet.\n\n## PP-244 — PC excommunication succession\n\nExcommunicated PC faction leader: faction reverts to NPC institutional tendency until PC reinstated (Reversal) or replacement designated (Influence DA Ob 2 or GM succession).\n\n## PP-246 — DA→Contest escalation\n\nDA always produces outcome. Contest escalation only when: (a) both parties present, (b) stakes contested, (c) DA roll = Partial. On Partial: Contest at Piety Track 5. On Success/Failure: no Contest.\n\n## PP-254 — CI seizure classification\n\nTerritory seizure CI gains = distinct category (not DA). All CI sources subject to ±5/season combined cap. ±3 DA sub-cap does not\
    \ apply to seizure.\n\n## PP-255 — Public Instability full design (BG)\n\nRange 0–10. Start 5. Accrual: +1/season any faction PS < 3 at accounting. Recovery: −1/season zero hostile Stability-targeting DAs. PI ≥ 8: revolt check (Stability ≤ 3 factions → Stability Ob 2; fail → PS −1). PI = 10: GM narrative uprising event.\n\n## ED-174 provisional — PI cascade brake\n\nAt PI ≥ 8: factions passing Stability Ob 2 gain Stability +1. PI increase cap +2/season from all sources combined. Awaiting user confirmation.\n\n## PP-281 — PI cascade brake\n\nAt PI ≥ 8: revolt-pass → Stability +1. PI increase rate cap: +2/season max from all combined sources.\n\n## ED-005 Resolution (PP-286) — Restoration Movement Leader [FLAGGED]\n\nPrimary NPC contact: **Yrsa Vossen** (confirmed existing). Secondary: **Aldric Hann**.\nFull stat blocks deferred to campaign development. Names canonical from existing params.\n[FLAGGED: stat blocks required before NPC roster compilation.]"

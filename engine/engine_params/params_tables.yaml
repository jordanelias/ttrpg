  engine/params/fieldwork.md: "<!-- version: v1.0 | source: designs/scene/fieldwork_v30.md | last_updated: 2026-06-11 -->\n<!-- PATCHES APPLIED: PP-575 (initial), PP-576 (audit), PP-577 (transitions), PP-578 (threadwork), PP-579 (ontological), PP-580 (extended), PP-581 (P1 resolution), PP-582 (fidelity), PP-632 (Disposition redesign + Knot system) -->\n\n# params_fieldwork.md — Fieldwork System (Exploration / Investigation / Socializing)\n\n## Pool Formula (PP-615 heritage; combat analogy retired 2026-07-01, ED-1084)\nFieldwork Pool = (Primary Attribute × 2) + History bonus\nHistory bonus = relevant History points + 3\n[Note (ED-1084): PP-615's \"confirmed ×2\" ruling was made by analogy to the combat pool of its\nera. Combat has since been re-ratified Agility-independent — max(5, History + 6), ED-901 /\nED-900/904 — so the ×2 construction is now fieldwork-native (like the social contest's), not\ncombat-derived. The fieldwork formula itself is unchanged.]\nTN: 7 (Standard) | 6 (Controlled)\
    \ | 8 (Desperate)\nPool minimum: 5D (Attribute 1, no History: (1×2) + 3 = 5)\nPool maximum: 24D (Attribute 7, History 7: (7×2) + (7+3) = 24)\n\n## Primary Attribute by Activity\n| Activity | Sub-type | Primary Attribute |\n|----------|----------|-------------------|\n| Exploration | Terrain / navigation | Cognition |\n| Exploration | Thread-aware | Attunement |\n| Exploration | Endurance-based | Endurance |\n| Investigation | Physical evidence | Cognition |\n| Investigation | Witness / informant | Attunement |\n| Investigation | Lore / research | Recall |\n| Investigation | Thread-Read | Spirit (+ Thread Pool Score) |\n| Socializing | Read | Attunement |\n| Socializing | Impress | Charisma |\n| Socializing | Connect | Bonds |\n| Socializing | Rumour | Charisma |\n| Socializing | Negotiate | Attunement |\n\n<!-- ED-FI-0004 (2026-07-08, pessimist-action audit): DOC-SIDE decision only — NO param values change here.\n     Interview MERGE: the \"Investigation | Witness / informant\" (Attunement)\
    \ action's single-roll resolution is\n     superseded by the Dialogue Lattice (designs/scene/investigation_systems_v30.md System 3 / S14). The Attunement\n     attribute above is unchanged; what retires (once ED-921's schedule/attribute reconciliation lands) is the bare\n     single-roll resolution path, not the attribute mapping. No number moves in this pass. -->\n\n## Depth Axis\n| Depth | Name | Perception Gate | Base Ob |\n|-------|------|-----------------|---------|\n| 0 | Surface | None | Auto |\n| 1 | Settled | Cog ≥ 2 or local History | 1 |\n| 2 | Hidden | Cog ≥ 3 or Att ≥ 3 | 2 |\n| 3 | Buried | TS ≥ 10 (explore/invest) or Disposition ≥ +3 (social; ED-912 — was Bonds − 1) | 3 |\n| 4 | Liminal | TS ≥ 30 | 5 |\n| 5 | Unintelligible | TS ≥ 50; Coherence check Ob 2 | 8 |\n\nOb modifiers: hostile territory +1, foreign +1, allied −1, local resident −1, MS <60 at Proximity ≤2 +1, active HI +1. Floor: 1.\n\n## Degree Table (core engine — PP-232/PP-249)\n| Net | Degree |\n|-----|--------|\n\
    | ≥ 2×Ob AND ≥ 3 | Overwhelming |\n| ≥ Ob | Success |\n| 0 < net < Ob | Partial |\n| ≤ 0 | Failure |\n\n## Exploration — Discovery Procedure\n| Degree | Discovery Quality |\n|--------|-------------------|\n| Failure | Nothing. Exposure +1. |\n| Partial | POI located, unclear. One surface feature. |\n| Success | POI located, full detail. One actionable piece. |\n| Overwhelming | Full detail + hidden feature below POI's depth. +1 Momentum. |\n\nMulti-character: leader + max 2 assistants. Assistant rolls at same Ob +1. Assistant Success: +1 net to leader. Assistant Failure: +1 Exposure for party.\n\n## Rendering Strain (Depth 3+)\n| Depth | Effect |\n|-------|--------|\n| 3 (Remnant) | Minor. TS ≥ 10: no effect. TS < 10: vague unease. Truth pressure (GM marks). |\n| 4 (Anomaly) | Significant. Coherence check Ob 1 (fail: −1). Truth −1 if ≥ 3. |\n| 5 (Breach) | Severe. Coherence −1 auto. Truth forced ≤ 2. TS +1. Warning: Coherence ≤ 2 practitioners risk Crisis. |\n\nNon-sensitive at Depth\
    \ 3+: +0 Exposure (institutionally invisible). Sensitive: +1 Exposure.\n\n## Investigation — Evidence Track\n| Scope | Threshold |\n|-------|-----------|\n| Simple | 3 |\n| Complex | 5 |\n| Structural | 8 |\n\nProgress by degree: Failure +0, Partial +1, Success +2, Overwhelming +3.\nExposure by degree: Failure +2, Partial +1, Success +0, Overwhelming −1.\nOne track per investigation regardless of territory. Persistent across sessions.\nProgress above threshold: no additional effect.\nLet It Ride: failed action on specific target cannot be reattempted same scene.\n\n## Desperate Trail (Fail Forward)\nTrigger: 3 consecutive failed investigation actions (net ≤ 0) on same investigation.\nEffects: TN → 8. Exposure doubled on failure. GM introduces complication. Partial progress → +2.\nClears: any Success/Overwhelming, or season change. Persists through Compromised.\n\n## Evidence Quality Tags\n| Source | Tag | Admissibility |\n|--------|-----|---------------|\n| Examine | Verified | Court,\
    \ Contest, Domain Action |\n| Interview | Testimonial | Contest (Memory); −1 if hostile witness |\n| Research | Documentary | Court, Contest (+2D Recall) |\n| Surveil | Observational | Intelligence, Contest; high Exposure |\n| Thread-Read | Thread-verified | TS ≥ 30 only. Inert Knowledge for non-sensitives. Church inadmissible. |\n| Rumour | Unverified | Directional only |\n| Reconstruct | Derived | As strongest constituent |\n\nThread-verified evidence: half value (round down, min 0) for non-sensitive Evidence Track.\nResolved investigation produces Finding (strongest tag). Combined Findings: +1D Argue per additional (max +2D).\n\n## Thread-Read (Perceptive Leap)\nRequirements: TS ≥ 30. Standard Leap procedure. Co-movement fires (P-01).\nPool: (Att × 2) + History bonus + Thread Pool Score (TS ÷ 10). TN: 7.\nCoherence: per scale table (Object/Personal = 0; Relational = −1; Territorial = −1; Structural = −2).\nEvidence: +2 (Success), +3 (Overwhelming).\n\n## Thread Operation Investigative\
    \ Yield (contextual — GM determines)\n| Operation | Typical Yield |\n|-----------|---------------|\n| Thread-Read | +2/+3 (direct perception) |\n| Weaving | +1 if co-movement reveals |\n| Pulling | +2/+3 (reveals hidden/frozen) |\n| POP | +2/+3 (displaces; orphan = evidence) |\n| Locking | +1 (preserve) / +2 (resistance reveals structure) |\n| Dissolution | +2 (concealment destroyed) / +1 (Gap topology) |\n| Mending | +1 (reveals original) / +2 (opens access) |\n\nMending arc: severity reduction yields +1/+2/+2/+3 across four reductions.\n\n## Disposition Track (ED-912 — supersedes PP-632 redesign + PP-684 \"ceiling = Bonds\")\nRange: **−5 to +5** (flat; NOT Bonds-capped). Asymmetric per-NPC per-PC. Canonical spec: fieldwork_v30 §5.1.\n\n**Ob rule: stepped table (ED-912 — replaces the PP-632 direct-subtraction `max(1, base Ob − Disposition)`).** Floor Ob 1 always applies. Impress is exempt (it sets starting Disposition).\n\n| Value | Label | Ob mod | Info Gate |\n|-------|-------|--------|-----------|\n\
    | −5 | Hateful | +5 | Active enmity. Will harm given opportunity. |\n| −4 | Hostile | +4 | Refuses interaction. Violence possible. |\n| −3 | Antagonistic | +3 | Openly uncooperative. Obstructs. |\n| −2 | Suspicious | +2 | Minimal cooperation. |\n| −1 | Wary | +1 | Guarded. Surface only. |\n| 0 | Neutral | 0 | Standard. Surface. |\n| +1 | Warm | −1 | Settled information. |\n| +2 | Friendly | −1 | Hidden information. |\n| +3 | Trusting | −2 | Buried information. |\n| +4 | Devoted | −2 | Liminal information. |\n| +5 | Bonded | −3 | Knot candidate (Bonds ≥ 5 + TS ≥ 30). Deepest access. |\n\n**Starting Disposition — lifepath derivation (PP-632):**\nFor each relevant lifepath element, assign ±0.5 based on alignment/conflict with NPC faction, culture, and role. Sum, take floor, clamp to [−5, +5] (ED-912 — was [−4, floor(Bonds/2)+1]).\n- Same birthplace/cultural region: +0.5\n- Same occupation/guild/trade: +0.5\n- Same faction (loose): +0.5 / (full member): +1\n- Rival faction: −0.5 / (actively\
    \ opposed): −1\n- Opposing lineage or family conflict: −0.5\n- Shared formative history (war, disaster, institution): +0.5\n\nShift by degree: Failure −1, Partial +0, Success +1, Overwhelming +2.\nDecay: > +2 decays −1/season without contact. ≤ +2 stable indefinitely.\nRecovery from ≤ −3: requires significant narrative event before social actions.\nPost-Contest: winner Disposition +1 with adjudicator, loser −1.\nNPC learns investigation revealed their secrets: −2 (exception: +1 if NPC wanted truth).\n\n\n## Knot System (ED-912 / ED-773 strain model — supersedes PP-632 tier-cost; full mechanics: fieldwork_v30 §5.6 + params/threadwork.md)\nKnots are being-with (Mitsein), Thread-bound (TS ≥ 30 required — supersedes the PP-632 \"any character\").\n\n**Prerequisites (all):** Disposition **+5** (Bonded) · (PC or NPC) TS ≥ 30 · PC **Bonds ≥ 5** · Knot count < floor(Bonds/2)+1 · no existing Knot with this NPC.\nTiers: **Distant** / **Close** (Distant upgradeable to Close via 3 social scenes\
    \ at Disposition +5, §5.6a).\nFormation: Spirit pool (Spirit × 2) vs TN 7, **Ob 2**. Overwhelming → Close; Success → Distant; Partial/Failure → no Knot.\n**Strain: bidirectional −5..+5 bond-strain gauge** (Distant −2..+5, start 0; Close −5..+5, start −2). +1 strain per stress-use (Thread-Read, Composure buffer, counsel retrieval, sustained Disposition < +3 for 2 seasons). **Rupture at +5.** Reinforcement: −1/season at Accounting when Disposition ≥ +3 and no strain added. **−5 = Tempered** (Close — absorbs the next rupture trigger once, resets to 0).\nEffects: +1D social with partner; no Disposition decay; shared Composure buffer; relational contagion (P-12); Knot-mediated Thread-Read (+1 strain/use).\nBreak (strain +5): Disposition **−3** (floor −5); both take 4 Composure; benefits cease; Conviction Scar +1 on a Close break.\nBetrayal rupture (public citation of private counsel): Disposition → **−3**, bypasses strain.\nLoss (partner death / Dissolution): Knot removed; Coherence −1; 4\
    \ Composure damage.\n\n## Sincerity Gate\nTrigger: GM-called when Belief contradicts genuine engagement.\nPool: Spirit. TN: 7. Ob: 1.\nFailure: Disposition unchanged or −1. Success: normal result.\n\n## Gift/Bribe\nNo roll. Starting Disposition +1. Once per NPC per season. Fails at Disposition ≤ −2 (Suspicious and below reject gifts from strangers).\n\n## Knot-Mediated Remote Thread-Read (§2.6)\nPool: standard Thread-Read. TN: 7. Ob: Personal (2).\nCost: +1 Knot strain per use.\nDetection: Knotted party Spirit TN 7, Ob = practitioner Cog ÷ 2 (min 1). Detection: Disposition −3.\n\n## Non-Sensitive Dissonance (§2.7)\nSpirit check TN 7 vs Dissonance Factor (1-4 by severity).\nFailure: Spirit −1D remainder of scene. Rotation needed every 3-4 Thread-adjacent scenes.\n\n## Threadcut Being Social (§2.8)\nSocial actions work. Testimony tag: Testimonial (transmissible to non-sensitives — being translates).\nEvidence Track = player-level knowledge. Memory-Pull does not reverse track.\n\n## Cover\
    \ (Derived Value)\nCover = Cognition + most relevant History for concealment.\n| Cover | Noticed | Watched | Compromised |\n|-------|---------|---------|-------------|\n| 1–3 | 3 | 5 | 7 |\n| 4–5 | 4 | 6 | 8 |\n| 6–7 | 5 | 7 | 9 |\n| 8–9 | 6 | 8 | 10 |\n| 10–11 | 7 | 9 | 11 |\n| 12+ | 8 | 10 | 12 |\n\n## Exposure Sources\n| Source | Exposure |\n|--------|----------|\n| Failed explore/investigate | +1 (or +2 at Depth ≥ 3) |\n| Thread-Read | +1 |\n| Sensitive at Depth 3+ POI | +1 (non-sensitive: +0) |\n| Surveil | +2 |\n| Failed social at Disposition ≤ 0 | +1 |\n| Hostile territory per scene | +1 |\n| Conspicuous action | +1 |\n<!-- Niflhel social action modifier deleted 2026-04-30 — Niflhel struck. Replacement: settlement-broker social actions per settlement_layer §4.7-4.9. -->\n| Combat during fieldwork arc | +1 quiet / +2 conspicuous / +3 public |\n\nReduction: concealment (Cog ×2, Ob 2) −2; leave territory reset; season reset; cover identity −1/scene; faction support −2/season.\n\n\
    ## Exposure → Church AP (§6.5)\nChurch territory (PT ≥ 3 or Church-controlled): Watched → +1 AP at Accounting. Compromised → +1 AP immediately.\nCap: +1/character/season, +2/territory/season from fieldwork.\n\n## Wounds and Fieldwork (§2.2)\nPhysical wounds add **+0.15 Ob per wound** (cumulative; NEVER a −1D pool cut; Jordan ruling 2026-07-08, ED-PC-0005, reversing PP-716's −1D unification): apply to Endurance-based exploration and Surveil only. Value calibrated ED-PC-0006: reuses ED-1041's combat \"attacking\" magnitude (+0.15 Ob) — Endurance-exploration and Surveil are active-roller checks with no bilateral attacker/defender split, so the passive-defence +0.25 term does not apply.\nSocial/cognitive fieldwork: unaffected by physical wounds.\nRattled: +1 Ob per mark to social fieldwork actions.\nWounds and Thread ops: **+0.15 Ob per wound** to Leap-based Thread ops (concentration, not pool penalty; ED-PC-0006, same value as above). The prior \"+1 Ob\" figure predates the ED-PC-0005 ruling\
    \ and is superseded by this calibration (a flat, non-cumulative legacy figure vs. the new per-wound-cumulative value — at 1 wound the new figure is gentler, at 7+ wounds it exceeds the old flat +1).\n\n## Inspiration Spend\n1 Inspiration before rolling → Ob −1 (min 1).\n\n## Contest Escalation (§5.7)\nNegotiate applies only when: (a) shared goal, disagree on method, or (b) outcome not consequential enough for Contest.\nOpposed + uncertain + consequential → Contest per social_contest_v30.md §1.\nDisposition maps to Conviction offset: ±1 per 2 Disposition, cap ±2.\n\n## System Transitions (§2.3)\nFieldwork → Combat: action resolves first; Noticed+ → ambusher +1D first exchange Off.\nFieldwork → Contest: Disposition → Conviction offset; evidence → +2D Recall; not consumed.\nFieldwork → Mass Battle: suspension; Evidence freezes; Thread-Read in Phase 4 = intelligence.\nCombat → Fieldwork: wounds persist; combat Exposure +1/+2/+3.\nContest → Fieldwork: Appraise → +1 Evidence (Testimonial);\
    \ Disposition +1/−1 post-Contest.\nMass Battle → Fieldwork: resume from frozen; post-battle examine = 1 fieldwork scene.\n\n## Board Game — Survey Action (§8.1)\nCard: Consul Inward. Pool: Influence. Ob: (5 − Proximity Rating) + 1. Min 1.\nSuccess: reveal POI. Overwhelming: POI + Influence +1. Failure: +1 AP if Depth ≥ 3.\n| POI | BG Bonus |\n|-----|----------|\n| Resource | Prosperity +1 |\n| Secret | +1D next military/intel action |\n| Remnant | Thread op Ob −1 for 2 seasons; Thread Debt token |\n| Anomaly | MS −1 immediate; WC +1 eligible |\n\n## Domain Echo from Investigation (§2.5)\nResolved Finding with faction scope → Domain Echo per stage11 §11.5.\nMay trigger NPC arc events (Discovery Events, Loyalty shifts, clock advances, Coalition triggers).\n\n<!-- patch_history: references/params_fieldwork_history.md -->\n<!-- canonical_sources: references/canonical_sources.yaml -->\n"
  engine/params/history/board_game.md: '# params_board_game — Patch History

    ## Container: references/params_board_game.md

    ## Maintained by hand on patch application (former auto-maintainer valoria-orchestrator retired 2026-06-28, LB-22 — ED-1084)

    ## Do not read this file in simulations — it is history, not values


    ---


    ## PATCH SUMMARY (ST-BG series, applied 2026-04-02)


    ### PP-033 — Catastrophic Failure Replaces Failure Degree

    Catastrophic Failure is a fifth degree that REPLACES Failure. Not additive.


    ### PP-034 — Drawn Battles

    Equal net successes: both sides Discipline −1, hold position, no territory change.


    ### PP-035 — Hollow Victory Scope

    Hollow Victory applies to Deed-counting factions only (Hafenmark, Guilds).

    Restoration (RS-based) and Crown/Löwenritter (mandate-based) are excluded.


    ### PP-036 — Policy Instrument Definition (Crown)

    Crown bonus action at Mandate ≥ 4. Any standard action. Once/season. Not interruptible by Parliamentary Manoeuvre.


    ### PP-037 — Co-Movement VTM at Cap

    VTM effects blocked by once/season cap or VTM max (7): convert to +1D on following season''s Tribune action (max +2D total).


    ### PP-038 — BG vs TTRPG Pool Size

    BG aggregates (sum of all Martial). TTRPG uses per-unit pools. Not statistically equivalent by design.


    ### PP-039 — Military 0 + Muster

    At Military 0: Muster actions produce no units and may not be taken.


    ### PP-040 — BG Unit TS (Southernmost)

    Default TS=0. Restoration+Weaver: TS=30. Varfell VTM≥2: TS=30. Church Templar: TS=0 (doctrine).


    ### PP-041 — Military Loss Timing

    TTRPG: immediate. BG: queues to Accounting. Hybrid: TTRPG timing during battle.


    ### PP-042 — Military Victory and TC/RS

    Military victory alone produces no TC or RS change. Thread operations during battle produce standard RS changes.


    ### PP-043 — Wound Penalties in Hybrid

    Wound Ob penalties apply to PC''s CR checks in TTRPG mass battle. Do NOT reduce BG commander bonus (Military÷3 calculation).


    ## DEGREE TABLE — BG SPECIFIC

    ## [PROVISIONAL: Overwhelming threshold per ED-031]

    | Net Successes | Degree |

    |---|---|

    | ≥ Ob + 1 (surplus ≥ 1) | Overwhelming |

    | = Ob exactly | Success |

    | Ob − 1 | Partial |

    | ≤ 0 | Failure |


    Note: TTRPG parent uses 2×Ob for Overwhelming. BG uses Ob+1 (more achievable).

    This is intentional — BG is a strategic abstraction. Review during playtesting.

    No Catastrophic Failure category (struck 2026-04-02).


    ## PENDING EDITORIALS BLOCKING FULL SYNC

    - ED-001: Card-Hand system (P1-BLOCKER) — prevents full stage_bg sync

    - ED-031: PROVISIONAL — BG Overwhelming = Ob+1 surplus. Intentional divergence from TTRPG 2×Ob. Strategic abstraction warrants more achievable threshold.

    - ED-032: TC 80 seizure scope (P1)

    - ED-033: Commander bonus formula (P1)

    - ED-034: Ceiral Ritual scale asymmetry (P2)

    - ED-035: Muster output in BG context (P2)

    - ED-036: Altonian unit stats BLOCKER

    - ED-039: Military seasonal cap pooling (P2)


    ---


    ## AUDIT 2026-04-02 — GAP-FILL PATCHES (PP-112 through PP-122)


    ### PP-112 — Remove Struck Majority-1s Override

    Majority-1s override (P-12) struck from params. All rolls: standard degree table only.


    ### PP-113 — Stat Ceilings and Floors

    Faction stats floor 0, ceiling 7. Standing 0-10.


    ### PP-114 — IP Post-80 Escalation [PROVISIONAL]

    IP 81-89: Vanguard +1 territory/season. IP 90-99: Altonian Mil +2. IP 100: shared defeat.


    ### PP-115 — PI Threshold Table [PROVISIONAL: ED-055]

    PI 0 = dissolution + coup. 6-tier table added.


    ### PP-116 — TC Seasonal Cap + Ceiling [PROVISIONAL: ED-056]

    Domain Actions +-3. All sources +-5. Seizure exempt. TC ceiling 100 cosmetic.


    ### PP-117 — Faction Collapse Exit [PROVISIONAL: ED-053]

    1 season + no hostile actions + Govern Ob 2 Success. Auto-exit Season 2: Stability 1, Mandate 0.


    ### PP-118 — Simultaneous Catastrophe [PROVISIONAL: ED-054]

    RS Rupture Step 6 takes precedence. Restoration Step 5 victory pre-empts.


    ### PP-119 — BG Unit Cohesion [PROVISIONAL]

    Levy 3, Infantry 4, Elite 5, Cavalry 4, Artillery 3, Thread Corps 4. Track 0-6.


    ### PP-120 — No BG Coherence Cost [PROVISIONAL: ED-057]

    BG Thread ops: no Coherence. Hybrid: PC Coherence via Cascade Step 3.


    ### PP-121 — Reformed Settlement Penalty Permanent [PROVISIONAL: ED-058]

    +1 Ob Diplomacy vs Hafenmark permanent. No reversal mechanic.


    ### PP-122 — CP Awards in Hybrid [PROVISIONAL]

    CP +1 on BG Domain Action if Belief declared. BG-only: no CP.


    ### PP-177 — Fail Forward (BG Domain Actions) [PROVISIONAL: ED-085, ED-086, ED-087]

    Fail Forward operationalised for BG mode. Partial = goal achieved + Minor complication (player choice of Standing −1 or Public Instability +1). Failure = goal not achieved + Moderate complication (action-type specific, mandatory). Severe tier added for Ob ≥ 4 Failures (Moderate + Stability −1). Parliamentary Manoeuvre Partial supersedes PP-170 "no effect" ruling — player may choose "no effect" as their Minor option.


    ### PP-178 — LIR/FF Cross-Mode Applicability Note [PROVISIONAL: ED-087b]

    Let It Ride (LIR): TTRPG = full; Hybrid = full for PCs / action-economy for units; BG = action-economy-enforced (one slot per season).

    Fail Forward (FF): TTRPG = Hard Moves §13.5; Hybrid = Hard Moves for PCs / PP-177 for units; BG = PP-177 complication table.

    Debate exchanges: explicitly exempt from LIR (each exchange = new fictional state).

    Thread operation irreversibility: Thread rules govern; LIR does not add further restriction.


    ### PP-179 — BG Overwhelming Degree Table (applied prior session)

    See patch_register.yaml PP-179. Not a FF patch.


    ### PP-180 — Hybrid Zoom-Boundary FF Rule [PROVISIONAL: ED-087c]

    When a PC Failure in TTRPG/Hybrid mode produces a zoom transition to faction scale, the complication carries forward as: −1 Ob modifier on the faction''s next relevant Domain Action OR Standing −1 consequence (GM choice based on fiction). Complication is not discarded at the scale boundary.


    ### PP-181 — Pool Minimum = 1D (BG mode explicit)

    No penalty may reduce any BG pool below 1D. Relevant for low-pool practitioners in combat contexts. Aligns BG with TTRPG core.


    ### PP-182 — Ob Minimum = 1 (all modes explicit)

    Cross-mode statement. TTRPG and BG already had Ob minimum. Hybrid now explicitly stated. Relevant for Restoration Thread Ops with 4+ Presence markers.


    ### PP-183 — Domain Action Overwhelming Bonus Table [ED-086 resolved]

    Overwhelming = Success effect + action-type bonus. Govern: +1 Prosperity additional. Trade: +1 Wealth or IP −1. Muster: +1 Cohesion. Diplomacy: target Standing −1 or own Standing +1. Decree: immediate effect. Parliamentary Manoeuvre: confirmed PP-170. Investigate: +1 datum. Spy: no exposure + +1 datum. Thread: per Thread table. Community: +1 Ob removed next. Fortify: +1 Cohesion. Parliamentary Vote: +1 Mandate (winner).


    ### PP-184 — Govern Full Degree Table [ED-085 resolved]

    Overwhelming: Prosperity +2. Success: Prosperity +1. Partial: Prosperity +1 + Minor complication (FF). Failure: Prosperity −1 + Moderate complication (FF).


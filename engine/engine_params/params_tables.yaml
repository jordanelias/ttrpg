    # Royal Assassination Fuse


    **Source:** designs/architecture/conflict_architecture_proposal.md (CANON)

    **Trigger:** Royal Crisis Tension Card (Card #1)

    **Model:** Fuse (S0 seed → S8+ fire, succeed-on-fire)


    ---


    ## Fuse Timeline


    - **S0:** Player receives signals that a plot exists (NPC dialogue, atmospheric events, intelligence reports).

    - **S1–S7:** Escalation visible. Player can investigate (costs card slots). If the player identifies and stops the plot: assassination averted, but the investigation reveals faction-level tensions and NPC allegiances.

    - **S8–S12:** If not averted, event fires (exact season randomized). Assassination succeeds when it fires — no attempt/failure variance.


    ---


    ## Target Determination


    Sub-roll at game start (or when Royal Crisis card is drawn):


    | Roll | Target | Consequence Arc |

    |------|--------|-----------------|

    | 1–2 | **Lenneth** | Almud revenge arc |

    | 3–4 | **Torben** | Elske retrieval |

    | 5–6 | **Almud** | Lenneth takes throne |


    ---


    ## Target Consequences


    ### Lenneth dies → Almud revenge arc

    Crown''s king diverts resources to finding the killer. Crown governance suffers as Almud''s attention narrows. Investigation arc opens — every faction is a suspect. Crown''s defensive posture breaks from inside. Without Lenneth''s moderating influence, Crown''s Einhir policy hardens. RM PW advances. Southern Accord erodes.


    ### Torben dies → Elske retrieval

    Crown must get Elske back from Altonia — she''s the only remaining heir. Retrieval requires military deployment to T4 (Varfell territory) to establish an extraction route. Direct provocation against Varfell AND Altonian diplomatic crisis (IP spike). Succession question and Altonian question merge into one compound event touching three factions.


    ### Almud dies → Lenneth takes the throne

    Crown''s factional identity inverts. Lenneth is pro-Einhir, pro-Thread-research, anti-caste-suppression. Crown becomes ally of Varfell and RM on the Einhir question while becoming a heresy target for Church. Löwenritter must decide whether to protect a "heretic queen" or advance toward Autonomous/Split. Most transformative outcome — changes what Crown IS.


    ---


    ## Notes


    - Each target produces a different mid-game. The player sees the fuse burning from S1 and must decide: spend resources investigating (competing with faction-building) or let it burn and deal with the consequences.

    - Replaces the prior fixed backstory (Almud''s father assassination) per Session A Patch 7 backstory strike.

    '

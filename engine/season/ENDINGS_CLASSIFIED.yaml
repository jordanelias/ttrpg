# How each arc CLOSES — classified from the lanes' own `ends_when` strings by a pass that saw
# NOTHING ELSE: no shape document, no probe, no report. Committed because
# `04_UNIFIED_SHAPE.md` §3.3's 19/50 is load-bearing on the whole proposal, and an
# unreproducible number is a reading rather than a measurement (CLAUDE.md §0.1 point 4).
#
# THIS IS AN AGENT CLASSIFICATION OF PROSE, NOT AN EXECUTION. It is the weakest evidence in the
# suite and is labelled as such wherever it is cited. What makes it worth keeping: it was made
# blind, it quotes its deciding phrase per row so every call is checkable by hand, and its
# headline (8 THRESHOLD of 50) INDEPENDENTLY REPRODUCES the executed A2 core-blocker count of 8
# after the router was corrected. Two instruments that saw different things agreeing on 8 is
# worth more than either alone.
#
# labels:
#   DECIDER   a person, body, tribunal, vote or the players chooses, and that choice ends it
#   ROLL      a check resolves it; the person acted but the roll's result closes it
#   THRESHOLD a counter/clock/tracked resource/scheduled review fires, NOBODY named as choosing
#   NEVER     the record says it does not end, or has no closing condition by design
#   UNCLEAR   the record itself says UNCLEAR, or names no condition
#
# forced_by_threshold: a crossing FORCES the moment even where a person makes the final call.
#   This is the load-bearing column. 19 of 50.
#
# COUNTS: DECIDER=20 ROLL=9 THRESHOLD=8 NEVER=10 UNCLEAR=3   FORCED=19


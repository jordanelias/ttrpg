speech_kinds:
  # `19_PLAN.md` step 7: "the roster the design promised and never wrote... Ten members; the two
  # starred kinds are not rostered." ⚠ SIX OF TEN, NAMED SCOPE-DOWN. These six are Fig. 27's forensic
  # issue ladder (`18_FINDINGS.md:180`, §5 item 5, verbatim: "deny, cite something incompatible,
  # impugn the motive, concede the fact, concede the harm, hand the error back" -- `rosters.yaml:
  # ladder_rungs`, reused rather than re-coined, see that roster's own note). The remaining four
  # (including the two D-6/D-7 name as newly authorable, `H-153`/`H-154`) are NOT in the source's own
  # worked figures within this position's scope and are not invented here.
  #
  # `genres`, `min_rank`: Fig. 27's ladder is invoked specifically for a FORENSIC bench
  # (`interrogation`'s row); no source states a rung floor for it, so `min_rank: hearth` is the
  # loosest floor rather than an authored restriction -- flagged per-row, not silently assumed.
  #
  # `reachable_bands`: `[]` means no cap is authored (the full ladder is reachable); ONLY
  # `impugn_motive` carries a real one -- `18_FINDINGS.md` item 5, verbatim: "*Impugn the accuser's
  # motive* is **Partial by construction**" (Fig. 24's fixed native band). Demote-only, never a
  # lookup that returns a band (`19_PLAN.md` step 7's own falsifier).
  - id:               deny
    genres:            [forensic]
    min_rank:           hearth
    reachable_bands:    []
  - id:               cite_incompatible
    genres:            [forensic]
    min_rank:           hearth
    reachable_bands:    []
  - id:               impugn_motive
    genres:            [forensic]
    min_rank:           hearth
    reachable_bands:    [Partial]
  - id:               concede_fact
    genres:            [forensic]
    min_rank:           hearth
    reachable_bands:    []
  - id:               concede_harm
    genres:            [forensic]
    min_rank:           hearth
    reachable_bands:    []
  - id:               hand_error_back
    genres:            [forensic]
    min_rank:           hearth
    reachable_bands:    []

arrangements:
  # ── arbitration — one decider, chosen by the parties, and no appeal ───────────────────────────
  # `03_PARAMETERS.md` §E.2. `records_dissent: false` is THIS LOADING'S OWN READING, not a direct
  # transcription: the source's worked block does not state the key for this row at all (only
  # `verdict_reasons: given` is shown). A single arbiter is a bench of one, and "is a division
  # recorded" is vacuous over a bench with nobody to divide from -- so `false` (nothing to record)
  # and `given` (the arbiter's reasons ARE known to the parties) are not in tension the way they
  # would be for a multi-member bench; recorded here rather than left silent.
  - id:               arbitration
    disposal:          bench
    bench_basis:        determine
    floor:              closed
    records_dissent:    false
    venue_min_rank:     hearth
    term_required:      true
    appeal_basis:       none
    interposed:         []
    order:              alternating
    proofs:             [record, testimony, oath]
    disposes:           oblige
    disposal_reach:      room

  # ── parliamentary debate — many who must be persuaded, and no issue ladder ────────────────────
  # `03_PARAMETERS.md` §E.2, transcribed in full. `records_dissent: true` and the old
  # `verdict_reasons: given` AGREE outright -- no collapse judgment needed.
  - id:               parliamentary_debate
    disposal:          bench
    bench_basis:        determine
    floor:              open
    records_dissent:    true
    venue_min_rank:     duchy
    term_required:      true
    appeal_basis:       none
    interposed:         [procedure]
    order:              rank
    proofs:             []
    disposes:           Record
    disposal_reach:      realm

  # ── council of state — the same shape, and the opposite trade ─────────────────────────────────
  # `03_PARAMETERS.md` §E.2: "the same shape, and the opposite trade... Four keys differ from the
  # parliament" -- `floor`, `records_dissent`, `venue_min_rank` (shown in the diff but UNCHANGED at
  # `duchy`) and `disposal_reach` (explicitly "UNCHANGED from the parliament... the deliberation is
  # sealed, the decree is proclaimed"). Every other key inherits `parliamentary_debate`'s row,
  # transcribed rather than referenced, because this loader has no "inherits:" mechanism and
  # inventing one for two rows would be apparatus this position does not need.
  # `records_dissent: false` and the old `verdict_reasons: withheld` AGREE outright.
  - id:               council_of_state
    disposal:          bench
    bench_basis:        determine
    floor:              closed
    records_dissent:    false
    venue_min_rank:     duchy
    term_required:      true
    appeal_basis:       none
    interposed:         [procedure]
    order:              rank
    proofs:             []
    disposes:           Record
    disposal_reach:      realm

  # ════════════════════════════════════════════════════════════════════════════════════════════════
  # v9 SC-03a (#453 §10.4 step 3, §8.3; K-53/K-55; ratified as intent, ED-IN-0288): THE FOUR ROWS THE
  # HEADER ABOVE LEFT UNSEEDED FOR THEIR `<tenure>` PLACEHOLDER. `detain` and `ban` answer it. Every
  # key but `disposes:` is TRANSCRIBED from `03_PARAMETERS.md` §E.2 (the copy at
  # `proposals/2026-09-05-proceedings-subsystem/03_PARAMETERS.md:590-646`), under the thirteen-key
  # collapse the header states: `registers`, `verdict_reasons` and `stakes_grade` dropped, and each
  # row's `records_dissent` AGREES with its old `verdict_reasons` (true+given, false+withheld), so the
  # one-key collapse needs no judgment on any of the four.
  # ⚠ WHICH ROW DISPOSES WHICH KIND IS AN [ASSUMPTION; medium; SC-03a's; revert: swap the two kinds
  # on any row -- a data edit, no code reads a row by name]. The source writes `<tenure>` on all four
  # and #453 §8.1 assigns the kinds to STATES (custody, excommunication, outlawry), never to rows.
  # Read: a SECULAR bench imprisons (`legal_trial`, `interrogation` -> `detain`: the interrogated
  # subject is already in custody, and a trial's terminal sentence is the cell); a body disposing of
  # MEMBERSHIP excludes (`tribunal`, whose finding *"binds the order"* -> `ban`; `inquisition_hearing`,
  # the Church's bench, whose terminal outcome is excommunication, #453 §8.1 -> `ban`).

  # ── legal trial — the issue ladder, in public, with advocates ─────────────────────────────────
  # §E.2, transcribed in full but `disposes:`. `records_dissent: true` + old `given` AGREE.
  - id:               legal_trial
    disposal:          bench
    bench_basis:        determine
    floor:              open
    records_dissent:    true
    venue_min_rank:     settlement
    term_required:      true
    appeal_basis:       determine
    interposed:         [person, procedure]
    order:              rank
    proofs:             [record, testimony, oath]
    disposes:           detain
    disposal_reach:      settlement

  # ── tribunal — a standing commission, admitted floor ──────────────────────────────────────────
  # §E.2 writes this row as a DIFF against the trial ("differs from a trial in three keys"): `floor`,
  # `interposed`, `appeal_basis`, plus `disposal_reach: body`; every other key is the trial's,
  # transcribed (no `inherits:` mechanism, `council_of_state`'s reason). `floor: admitted:<basis>` is
  # written bare -- the source names no basis, and the loader admits bare `admitted` (§E.2 writes it
  # bare on three games). ⚠ `appeal_basis: none` makes the finding final, so the disposal must be
  # closable by another act (§E.2's own P-12 flag): the `ban` is closable by `pardon` (#453 step 5,
  # built at v9 IN-12: `loop/effects_governance.py::_eff_pardon`); the gate's `determination` closure arm
  # admits a bench's closure of it (`state/gate.py`).
  - id:               tribunal
    disposal:          bench
    bench_basis:        determine
    floor:              admitted
    records_dissent:    true
    venue_min_rank:     settlement
    term_required:      true
    appeal_basis:       none
    interposed:         [office, procedure]
    order:              rank
    proofs:             [record, testimony, oath]
    disposes:           ban
    disposal_reach:      body

  # ── interrogation — the questioner decides, and the subject cannot win ────────────────────────
  # §E.2, transcribed in full but `disposes:`. `records_dissent: false` + old `withheld` AGREE.
  - id:               interrogation
    disposal:          bench
    bench_basis:        determine
    floor:              closed
    records_dissent:    false
    venue_min_rank:     hearth
    term_required:      false
    appeal_basis:       none
    interposed:         []
    order:              scripted
    proofs:             [testimony, confession]
    disposes:           detain
    disposal_reach:      room

  # ── inquisition hearing — an interrogation with a bench ───────────────────────────────────────
  # §E.2's block omits `disposal:`; §E.1's table gives `bench` for the row, and its title -- *"an
  # interrogation WITH A BENCH"* -- says the same. Every other key transcribed. `records_dissent:
  # false` + old `withheld` AGREE.
  - id:               inquisition_hearing
    disposal:          bench
    bench_basis:        determine
    floor:              closed
    records_dissent:    false
    venue_min_rank:     settlement
    term_required:      false
    appeal_basis:       determine
    interposed:         [office, procedure, document]
    order:              scripted
    proofs:             [testimony, confession, record]
    disposes:           ban
    disposal_reach:      body

  # ════════════════════════════════════════════════════════════════════════════════════════════════
  # v9 SC-04: THE FIFTH `<tenure>` ROW, AND THE SUCCESSION ROW. See the header's last paragraph.
  # ════════════════════════════════════════════════════════════════════════════════════════════════

  # ── excommunication deliberation — a body disposing of a person who is not there ──────────────
  # §E.2 (`03_PARAMETERS.md:648-661`), transcribed in full but `disposes:`. The source writes
  # `disposes: <tenure>` and prose that the disposal *"severs a `commit`"*; #453 §8.1 (`proposals/
  # 2026-10-03-verb-coverage-and-gap-fill.md:1466`) reads excommunication as Tenure `ban` opened by
  # `determine` under a Church arrangement with `disposes: ban` -- an OPENING, which `disposes:` can name
  # and a severed `commit` it cannot -- so `ban`, the kind `inquisition_hearing` (the Church's bench) disposes.
  # ⚠ THE ONE ROW WHERE THE OLD PAIR DISAGREES: the source states `records_dissent: false` AND
  # `verdict_reasons: given`, and the thirteen-key collapse (header) keeps ONE key. [ASSUMPTION; medium;
  # SC-04's; revert: `records_dissent: true` -- a data edit, no code reads a row by name]: the surviving
  # key is the one the source WRITES, `false` (the deliberation is sealed, as the council's is), and the
  # dropped `verdict_reasons: given` is not carried. Reading it the other way would contradict a value the
  # source states outright; the same reading would seed `negotiation` (false + given), which this row does
  # not decide (header: a data row left, no other blocker).
  - id:               excommunication_deliberation
    disposal:          bench
    bench_basis:        determine
    floor:              closed
    records_dissent:    false
    venue_min_rank:     settlement
    term_required:      true
    appeal_basis:       determine
    interposed:         [procedure, ceremony]
    order:              rank
    proofs:             [record, testimony]
    disposes:           ban
    disposal_reach:      realm

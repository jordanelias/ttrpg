# B24p.03: CONTEXT (V2 p2 §I) -- era, regime and strife as CELL DELTAS the builder reads (B24p.13); no code per kind. B24p.03 wrote it AT CONTROL (every
# era weight 1.0, every delta 0, nothing unlawful, nothing added to or dropped from `admits`, every authority's `power` 1.0, no `silence` or
# `floor` override); B24p.23 wrote V2's (`sc2/host.py::ERAS`, `::REGIMES`, `::STRIFE`), each cell `[ASSUMPTION; Jordan to correct; revert: the control above]`.
# The regime's `gravity` delta is V2 p2 §I's (theocracy +0.5, crown and commune 0). A regime's `power` is the model's `power` dict: the weight of
# each authority it names, and 0 for each it does not (the model reads `.get(auth, 0.0)`, as `_power` does), so a crown weighs the polity and
# no other seat, a theocracy the church at 2.0, a commune the guild; the loader takes a weight of 0 or more. `eras`: a weight for each ground
# (`rosters.yaml: grounds`). `regimes`: `unlawful` names rites or arrangement ids; `standard` and `reason_lean` are deltas on the row's;
# `admits_add`/`admits_drop` are `matters` members; `power` weighs each `authorities` member; `silence`/`floor` override the rite's and the
# row's. `strife`: `turns` (whole, added to the row's), `unrest`, `gravity`, `care_want`. [ASSUMPTION; Jordan to correct: the table's key
# set and every control value.]
# ══════════════════════════════════════════════════════════════════════════════════════════════════════════
context:
  # [ASSUMPTION; Jordan to correct; revert: the control (every weight 1.0, every delta 0, nothing unlawful) -- basis: V2 p2 §I; the cells are the running model's
  # `sc2/host.py::ERAS`, `::REGIMES`, `::STRIFE`, each a ground or key the model leaves unnamed read at its neutral value.]
  eras:
    plain:        {evidence: 1.0, consequence: 1.0, authority: 1.0, solidarity: 1.0}
    age_of_faith: {evidence: 1.0, consequence: 0.8, authority: 1.4, solidarity: 1.0}
    mercantile:   {evidence: 1.0, consequence: 1.4, authority: 0.8, solidarity: 1.0}
  regimes:
    crown:     {unlawful: [], gravity: 0, standard: 0, reason_lean: 0, admits_add: [], admits_drop: [], power: {parties: 0.0, polity: 1.0, church: 0.0, guild: 0.0, none: 0.0}, silence: null, floor: null}
    theocracy: {unlawful: [debate, parliamentary_debate, council_of_state], gravity: 0.5, standard: 1, reason_lean: -0.1, admits_add: [confession, oath], admits_drop: [precedent], power: {parties: 0.0, polity: 0.0, church: 2.0, guild: 0.0, none: 0.0}, silence: admits, floor: null}
    commune:   {unlawful: [inquisition, inquisition_hearing, examination], gravity: 0, standard: -1, reason_lean: 0, admits_add: [rumour], admits_drop: [], power: {parties: 0.0, polity: 0.0, church: 0.0, guild: 1.0, none: 0.0}, silence: null, floor: open}
  strife:
    peace:  {turns: 0, unrest: 0, gravity: 0, care_want: 0}
    war:    {turns: -1, unrest: 0.5, gravity: 0.5, care_want: 0}
    famine: {turns: 0, unrest: 0.75, gravity: 0.25, care_want: 0.3}
    schism: {turns: 0, unrest: 0.25, gravity: 0.5, care_want: 0}


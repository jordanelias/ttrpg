# B24p.03: DISPOSAL (V2 p2 §J) -- `(what a row disposes, band) -> typed writes`; the fold performs every one (B24p.20, B24p.22, B27.28,
# B33.51). Keys are the `disposes` values (`none`, `yield`, `oblige`, `detain`, `ban`, and `Record`, which V2's `decree` row is keyed
# by: the tree's `parliamentary_debate` and `council_of_state` dispose `Record`, and their `disposes:` lines stay as they were). Each key
# states the four degree bands and `impasse` (no verdict); each write is a `rosters.yaml: disposal_writes` member. A claim's weight (a
# yield 1, a hint 0.4) is a cell of its write there. [ASSUMPTION; Jordan to correct: one key for the decree's writes, and the roster
# spelling of each write -- see `disposal_writes`' note.]
# ══════════════════════════════════════════════════════════════════════════════════════════════════════════
disposal:
  none:
    Overwhelming: ["pursuits+", "regard+", "claim:converted"]
    Success:      ["pursuits+", "regard+"]
    Partial:      ["regard+"]
    Failure:      ["regard-", "grievance"]
    impasse:      ["regard-"]
  yield:
    Overwhelming: ["claim:yielded", "record:confession", "regard-"]
    Success:      ["claim:yielded", "regard-"]
    Partial:      ["claim:hinted"]
    Failure:      ["regard-"]
    impasse:      ["regard-"]
  oblige:
    Overwhelming: ["tenure:oblige", "regard+", "precedent"]
    Success:      ["tenure:oblige", "regard+"]
    Partial:      ["docket:adjourned"]
    Failure:      ["grievance", "docket:other_forum"]
    impasse:      ["docket:other_forum"]
  detain:
    Overwhelming: ["tenure:detain", "office:contested", "precedent", "legitimacy+"]
    Success:      ["tenure:detain", "precedent", "legitimacy+"]
    Partial:      ["tenure:oblige", "docket:adjourned"]
    Failure:      ["record:acquittal", "precedent", "regard-"]
    impasse:      ["docket:adjourned"]
  ban:
    Overwhelming: ["tenure:ban", "office:contested", "precedent"]
    Success:      ["tenure:ban", "legitimacy+"]
    Partial:      ["tenure:oblige", "docket:adjourned"]
    Failure:      ["record:acquittal", "legitimacy-"]
    impasse:      ["docket:adjourned"]
  Record:
    Overwhelming: ["record:decree", "faction+", "precedent", "legitimacy+"]
    Success:      ["record:decree", "faction+"]
    Partial:      ["docket:adjourned"]
    Failure:      ["record:defeated", "faction-"]
    impasse:      ["docket:adjourned"]

arrangements:
  # `standard:` (B05.21, T13 edit 2) IS THE FOURTEENTH KEY, a `rosters.yaml: difficulty_levels` member: what the room demands of an act
  # a bench hears on a matter docketed under the row, sized by `Fixtures.difficulty_ob` and read by `sigma.py::OBSTACLE_TERMS["standard"]`.
  # Every row is `plain` at the control (size 0: nothing is listed). B05.23 (T13 commit 2, edit 2) authors T2's first values, copied:
  # one level per formal layer the row's `interposed:` names among `procedure`, `office`, `document`, `ceremony` (`person`, an advocate,
  # is help, not a layer); the authored value is the fact, so a designer overrides any row. Publicity (`floor: open`) is no term and
  # carries no bump here: its +1 sweep is reported in B05.23's commit body. [ASSUMPTION; medium; Jordan to correct; revert: every row `plain`.]
  # ── arbitration — one decider, chosen by the parties, and no appeal ───────────────────────────
  # `03_PARAMETERS.md` §E.2. `records_dissent: false` is THIS LOADING'S OWN READING, not a direct
  # transcription: the source's worked block does not state the key for this row at all (only
  # `verdict_reasons: given` is shown). A single arbiter is a bench of one, and "is a division
  # recorded" is vacuous over a bench with nobody to divide from -- so `false` (nothing to record)
  # and `given` (the arbiter's reasons ARE known to the parties) are not in tension the way they
  # would be for a multi-member bench; recorded here rather than left silent.
  - id:               arbitration
    rite:               default
    turns:              [2, 5]
    authority:          parties
    reason_lean:        0.2    # [ASSUMPTION; Jordan to correct; revert: 0] the model's `trial` rite (`sc2/host.py::RITES`)
    close:              bench
    bench_basis:        determine
    floor:              closed
    records_dissent:    false
    venue_min_rank:     hearth
    term_required:      true
    appeal_basis:       none
    interposed:         []
    admits:             [record, testimony, oath]
    disposes:           oblige
    disposal_reach:      room
    standard:           plain

  # ── parliamentary debate — many who must be persuaded, and no issue ladder ────────────────────
  # `03_PARAMETERS.md` §E.2, transcribed in full. `records_dissent: true` and the old
  # `verdict_reasons: given` AGREE outright -- no collapse judgment needed.
  - id:               parliamentary_debate
    rite:               default
    turns:              [2, 4]
    authority:          polity
    reason_lean:        -0.1    # [ASSUMPTION; Jordan to correct; revert: 0] the model's `debate` rite (`sc2/host.py::RITES`)
    close:              bench
    bench_basis:        determine
    floor:              open
    records_dissent:    true
    venue_min_rank:     duchy
    term_required:      true
    appeal_basis:       none
    interposed:         [procedure]
    admits:             []
    disposes:           Record
    disposal_reach:      realm
    standard:           routine

  # ── council of state — the same shape, and the opposite trade ─────────────────────────────────
  # `03_PARAMETERS.md` §E.2: "the same shape, and the opposite trade... Four keys differ from the
  # parliament" -- `floor`, `records_dissent`, `venue_min_rank` (shown in the diff but UNCHANGED at
  # `duchy`) and `disposal_reach` (explicitly "UNCHANGED from the parliament... the deliberation is
  # sealed, the decree is proclaimed"). Every other key inherits `parliamentary_debate`'s row,

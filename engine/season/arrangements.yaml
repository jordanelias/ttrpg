# B24p.03: THE RITES (V2 p1 §D, p2 §B) -- a type's STRUCTURE: what the live thing is called, who bears it (he opens), who must answer whom
# (`reply`: `must`, `may`, `raise`), what silence means (`silence`: `admits`, `refusal`, `free`), the issues it runs through (`issues`: an
# `issue_rungs` member each; EMPTY IS ONE UNDIVIDED ISSUE, the matter itself), what conceding does (`concede`: `descends` the issue ladder or
# `accepts` the other side's point), and who may do what (`moves`: a `proceeding_moves` member each, per side, `[]` for a side with none).
# The rows of `arrangements:` below are these structures ARRANGED by an authority: `rite:` names one. Cells copy the running model's
# (`sc2/host.py::RITES`, evidence only); `genre`, `live` and `bears` are labels no code compares (the module reads cells, never an id).
# `negotiation`'s `reply` is `may` on both sides (V2 p4 §F 30: an unanswered offer simply earns no deal, so `must` was inert and is cut).
# [ASSUMPTION; Jordan to correct: every cell below -- basis: the model's, which V2 p1 §D's table states in prose.]
# ══════════════════════════════════════════════════════════════════════════════════════════════════════════
rites:
  - id:               conversation
    genre:            dyadic
    live:             claim
    bears:            for
    reply:            {for: may, against: may}
    silence:          free
    issues:           []
    concede:          accepts
    moves:            {for: [argue, press, rest, concede], against: [argue, press, rest, concede]}
  - id:               negotiation
    genre:            dyadic
    live:             offer
    bears:            for
    reply:            {for: may, against: may}
    silence:          free
    issues:           []
    concede:          accepts
    moves:            {for: [argue, press, rest, concede], against: [argue, press, rest, concede]}
  - id:               questioning
    genre:            judicial
    live:             question
    bears:            for
    reply:            {for: may, against: must}
    silence:          refusal
    issues:           []
    concede:          accepts
    moves:            {for: [argue, press, rest], against: [argue, rest, concede]}
  - id:               inquisition
    genre:            judicial
    live:             charge
    bears:            for
    reply:            {for: may, against: must}
    silence:          admits
    issues:           [fact, justification]
    concede:          descends
    # B24.09: the rite of the polity's questioning gains the hearing's `present` and `answer` for both sides and the bench's `rule`, `adjourn`
    # [ASSUMPTION; Jordan to correct; revert: the three cells' old values -- basis: IS-B2-SC-03's `questioned` rite, read as this one: the only rite
    # whose rows are an inquisition by the polity (`examination`, `inquisition_hearing`); `questioning` is not a determination (B24.12)].
    moves:            {for: [argue, press, rest, present, answer], against: [argue, rest, concede, present, answer], bench: [rule, adjourn]}
    # B24.32 (KERN_B check 5): the rite lists the faults that apply, and the module records only those (`proceeding.py::exchange`'s `fault`); the hearing-capable rite lists all four.
    faults:           [self_contradiction, silence, forgery_found, irrelevance]
  - id:               trial
    genre:            judicial
    live:             charge
    bears:            for
    reply:            {for: must, against: must}
    silence:          refusal
    issues:           [fact, definition, justification]
    concede:          descends
    moves:            {for: [argue, press, rest, concede], against: [argue, press, rest, concede]}
  - id:               debate
    genre:            deliberative
    live:             motion
    bears:            for
    reply:            {for: may, against: may}
    silence:          free
    issues:           []
    concede:          accepts
    moves:            {for: [argue, press, rest, concede], against: [argue, press, rest, concede]}
  - id:               rally
    genre:            deliberative
    live:             theme
    bears:            for
    reply:            {for: raise}
    silence:          free
    issues:           []
    concede:          accepts
    moves:            {for: [argue, rest], against: []}
  - id:               audience
    genre:            deliberative
    live:             plea
    bears:            for
    reply:            {for: may, against: may}
    silence:          free
    issues:           []
    concede:          accepts
    moves:            {for: [argue, rest], against: [argue, press, rest]}
  # B24.09 (IS-B2-SC-03, HEAR_B edit 3): THE DEFAULT RITE, a rite as DATA until CR-60's two-valued block (`accusatorial`, `inquisitorial`) replaces
  # this row without touching the reader. `rite: default` is what `arbitration`, `legal_trial`, `tribunal`, `parliamentary_debate`,
  # `council_of_state` and `excommunication_deliberation` name. Beside the cells every rite states it carries the hearing's: `bears` as a
  # MAP `rung -> side` (who bears the question at each rung; sides as HEAR_B's `Exhibit.side`, for or against the party), `moves.bench` (the
  # bench's own moves), `faults` (`rosters.yaml: proceeding_faults`) and `disclosed` (whether the other side's filings stand on a mover's board).
  # The rite's opener is the bearer of its first issue. `issues` is the trial's three (`procedure` heads no rite's `issues`, so its bearer
  # cell is unread); the structure cells (`genre` to `concede`) are the `trial` rite's, which the three judicial rows already read.
  # [ASSUMPTION; Jordan to correct; revert: edit this row -- basis: the `bears:` map keeps `IS-B2-SC-03` step 1's assignment (the accuser bears
  # procedure, fact and definition and the party bears justification, the issue ladder HEAR_B carries from the kernel,
  # `audits/05_SC_audit_addendum_B.md:242`, `:246`) and writes it in THIS file's side words: `for` is the bearer, the speaker `claimants[0]` the
  # sitting places there (`sigma.proceeding_input`), every `trial` and `inquisition` row says `bears: for`, and `Item.side` is the mover's side; so the
  # accuser is `for` and the party `against` (B24.12's ruling; B24.09 had written it inverted). `moves` are the seven the speech and the hearing
  # give a side (the speech's `argue`, `press`, `concede`, `rest`; the hearing's `present`, `impugn`, `answer`: B24's close added `answer`, which HEAR_B names and the row
  # had dropped), `bench` the two the bench alone has.]
  - id:               default
    genre:            judicial
    live:             charge
    bears:            {procedure: for, fact: for, definition: for, justification: against}
    reply:            {for: must, against: must}
    silence:          refusal
    issues:           [fact, definition, justification]
    concede:          descends
    moves:            {for: [argue, press, concede, rest, present, impugn, answer], against: [argue, press, concede, rest, present, impugn, answer], bench: [rule, adjourn]}
    faults:           [self_contradiction, silence, forgery_found, irrelevance]
    disclosed:        true


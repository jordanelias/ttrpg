      hardness: core
    - need: "that actor's read must depend only on externally visible signals, such that private mitigations are invisible to it while public/structural events are highly visible"
      why: "the mismatch between players' true intentions and the third party's surface-level read is the source of the pivot going 'the other way'"
      hardness: core
    - need: "the chosen alignment must change the ongoing rate of a separate, unrelated escalating pressure quantity on one path, and open automatic passive intelligence leakage to a hostile power on the other"
      why: "the diplomatic path's rate reduction and the hostile path's leak are the two concrete payoffs that make the pivot matter"
      hardness: core
    - need: "the intelligence-leakage side effect must run passively and automatically regardless of player awareness, exposing covert operations run through that territory"
      why: "'this is a passive mechanic that runs regardless of whether anyone is watching' is explicit"
      hardness: important
    - need: "locking in the favorable alignment must require meeting several externally-visible qualifying conditions simultaneously, not any single action"
      why: "the multi-indicator threshold (Mandate, trade continuity, prosperity, no recent escalation) keeps the diplomatic path a genuine achievement, not a single roll"
      hardness: important
    - need: "the third party's default disposition must remain profit-seeking/neutral even under alignment, able to pull back into self-interest rather than becoming a committed ally or true enemy"
      why: "'it profits from sustained tension, not resolution' -- the actor must retain its own agenda even while cooperating"
      hardness: flavour
  temporal:
    span_seasons: 6
    needs_memory_of: "the running trend of the observed indicators over several past seasons, not just a current snapshot"
    needs_deadline: no
  who_acts:
    - "the neutral third-party actor (autonomous)"
    - "Crown/players (trying to present a legible stability signal)"
    - "a hostile external power benefiting from the unfavorable pivot"
  knowledge:
    - "the third party's alignment decision depends only on what it can observe; covert operations run through its territory become known to a hostile power without the operator's knowledge"
  ends_when: "never fully -- this is an ongoing background disposition that can flip again; it settles into a durable state only under sustained conditions on either side"


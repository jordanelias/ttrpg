- id: NPC-034
  name: Gustav Linder
  one_line: The Archbishop's Representative seated in the Crown's Inner Circle, whose formal permission is the sole legal conduit for Church heresy jurisdiction on Crown soil while his true loyalty answers to the Confessor.
  scale: faction
  season_requires:
    - need: "A person embedded in one institution's inner circle must be able to be the single necessary formal conduit through which a SECOND institution's authority -- to which he actually answers -- can legally act inside the first institution's territory; without him, that authority does not exist there procedurally."
      why: "This is Linder's entire mechanical function (Church heresy jurisdiction on Crown soil routes through him specifically); without a sole-conduit requirement, 'Archbishop's Representative' is a courtesy title with no gatekeeping content."
      hardness: core
    - need: "The institution he is embedded in must be able to refuse the request he is required to make on his true institution's behalf, under a specific named condition, so that his advocacy can fail even when he performs his function correctly."
      why: "Without a real chance of refusal, the conduit role always succeeds as a formality, and there is no tension in his being the bottleneck."
      hardness: important
    - need: "A person must be able to sit in formal council for one institution while his substantive loyalty and reporting duty run to a different institution's leadership, such that the two institutions could in principle issue him contradictory instructions in the same season."
      why: "Without the structural possibility of contradiction, dual loyalty is a backstory note rather than a mechanical conflict the season can actually generate."
      hardness: core
    - need: "This person's confidentiality obligation to the council he sits on must be able to come into direct tension with his reporting obligation to his true master, such that honoring one at some point requires violating the other, with a real consequence attached to the choice."
      why: "Without a forced choice between the two loyalties, the word 'dual' is never tested -- he simply serves one interest twice under two names."
      hardness: core
    - need: "A third party must be able to discover which of his two loyalties actually governed a specific past action of his, and that discovery must damage his standing in the institution he was seen to have subordinated, without necessarily being provable to the institution he was actually protecting."
      why: "Without asymmetric discovery, dual loyalty carries no risk -- he could favor either side freely with no chance of being caught."
      hardness: important
    - need: "This office-holder must be able to hold an automatic, standing hostile bias toward one category of person (Thread practitioners) that does not itself depend on which of his two loyalties is currently active, distinguishing 'things he does because he is a Church man' from 'things he does because he is favoring one master.'"
      why: "Without a loyalty-independent baseline, every one of his actions becomes ambiguous evidence for the loyalty-detection mechanic above, making it impossible to ever cleanly attribute a choice to either side."
      hardness: flavour
    - need: "UNCLEAR: no goal, ambition, or arc trajectory is authored for Gustav Linder anywhere in the corpus -- what his dual loyalty is FOR (surveillance of Crown policy? softening Crown actions toward the Church? preparing for a specific eventuality?) is unstated, so the tension his office permits has no content to resolve toward."
      why: "Without this, the season can represent that the conflict is structurally possible but has nothing specific driving it toward any particular outcome."
      hardness: core
  temporal:
    span_seasons: ongoing
    needs_memory_of: "whether Almud is currently in his Reformer arc (gates whether Linder's Crown permission-requests succeed automatically or require a contested check); any past instance where a third party attempted to determine which master a specific action of his served"
    needs_deadline: "situational -- each time the Church needs to act in Crown territory, his request is a per-instance gate, not a standing one"
  who_acts:

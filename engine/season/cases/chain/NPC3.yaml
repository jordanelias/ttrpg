```yaml
- id: NPC-020
  name: Almud Almqvist
  one_line: "A king whose season is entirely triage among pressures he cannot resolve, constrained more tightly by publicness than any private citizen would be."
  scale: realm
  season_requires:
    - need: "A single leader must be able to face several independent, ongoing pressure sources in one season and only be able to substantively address a subset of them, with the unaddressed ones compounding rather than pausing."
      why: "Without forced triage, the founding tension of the position (impressive but structurally fragile because pressed from every side at once) collapses into a resource-management puzzle with no real cost to inaction."
      hardness: core
    - need: "A leader's own long-held private doubt about a policy he enforces must be able to persist for many seasons without forcing a decision, and that persistence must itself count as a consequential choice rather than a null state."
      why: "The character's defining insight is that his uncertainty is itself a decision he does not recognize as one; if the engine cannot make inaction cost something, the central tragedy is not playable."
      hardness: core
    - need: "Actions taken in the leader's name by subordinates must be able to diverge from what he intended, through incompetence, institutional habit, or the subordinate's own judgment, and the leader must be able to learn of the divergence only after it happened."
      why: "This is what makes ruling through other people real rather than nominal; without it, giving an order is identical to doing the deed personally."
      hardness: core
    - need: "A standing armed institution nominally loyal to the leader's position must be able to gradually reassess that loyalty in stages, driven by events the leader does not fully control, up to and including ceasing to execute his will."
      why: "The coup threat has to depend on eroding obedience over time, not a single flip; a binary loyal/disloyal flag cannot carry the slow institutional judgment this needs."
      hardness: core
    - need: "The leader must be structurally unable to act on a piece of private knowledge or sympathy without incurring a cost that a lower-status person acting the same way would not incur."
      why: "This is the direct test of whether high status is interesting rather than merely powerful: he is MORE constrained by visibility than a private citizen, not less."
      hardness: core
    - need: "A close advisor must be able to openly contradict or oppose the leader in a private setting at no cost to the advisor, while the same disagreement voiced publicly would cost the advisor standing."
      why: "Without a private/public split, an inner circle is either yes-men (no real counsel) or indistinguishable from open rivals."
      hardness: important
    - need: "The leader must be able to formally and publicly recognize another person's deed in a way that changes what that person may subsequently do, and this recognition must be withholdable, not automatic."
      why: "This is one of the few concrete, personal things a king actually does himself rather than through others — and it is only a real grant if refusal is possible."
      hardness: important
    - need: "A crisis inside the leader's own family (an heir's death, a spouse's death, an heir's capture) must be able to fire unpredictably and reconfigure what the leader does for many subsequent seasons, visibly to every other actor."
      why: "A king who cannot be blindsided by grief, and whose grief has no political weight, is a functionary rather than a person whose family matters to the realm."
      hardness: important
    - need: "A third party's multi-season campaign to eventually replace the leader must be able to proceed in parallel to his reign without the leader having any action that ends it outright, only ones that slow or manage it."
      why: "A rival's decades-long positioning has to be able to run regardless of whether the current ruler ever specifically addresses it."
      hardness: important
    - need: "A future succession must be able to remain genuinely unsettled for the leader's whole reign, contested among parties with different bases of claim, none of which the leader can fully foreclose by simply naming an heir."
      why: "Naming an heir is not the same as controlling the outcome; other claimants and the heir's own maturation must be able to override the leader's stated preference."
      hardness: important
    - need: "The leader's own perceptual or sensory state must be able to change through no action of his own, altering what he privately understands while his public role stays unchanged until he chooses, or is forced, to reveal it."
      why: "A latent personal rupture available to the story, even if a given campaign never triggers it, is part of what keeps his private interior alive as a variable."
      hardness: flavour
  temporal:
    span_seasons: ongoing
    needs_memory_of: "cumulative private-doubt state, prior formal recognitions granted, the standing army's current stage of reassessment and every event that advanced it, each rival power's accumulated positioning, whether a family-crisis event has fired and which family member it targeted, whether a personal perceptual threshold has quietly been crossed"
    needs_deadline: "yes — at least one internal reform path closes permanently if a specific pair of conditions (his doubt deep enough, the army still settled) is not reached before the army's reassessment advances past a threshold; a family-crisis event is bound to a mid-campaign window"
  who_acts:
    - Almud
    - the standing army's commander
    - the standing army's liaison-officer
    - the inner circle of appointed advisors
    - the queen consort
    - the heir apparent
    - the rival duchess pressing her own claim
    - the rival duke pursuing revolution
    - the church leader
    - external foreign powers
    - players
  knowledge:
    - "other actors can only estimate, never confirm, whether a rival's ambition toward his seat is a contingency or an active campaign"
    - "the wider realm does not know the depth of his private doubt unless a direct, high-stakes confrontation forces it into the open"
    - "he does not control or necessarily know in advance which member of his family, if any, a looming crisis will strike"
    - "he does not know, and cannot choose, whether or when his own latent perceptual capacity might cross a threshold"
  ends_when: "never automatically; his personal arc concludes only via one of several mutually exclusive branch conditions — reform, defensive consolidation, being overthrown by his own army, being consumed by a family tragedy, or his own death, at which point a different named person's case begins in his place"

- id: NPC-021
  name: Arne Himlensendt
  one_line: "A religious institution's leader whose sincere private faith is the load-bearing pillar of a settlement he does not know is shaking."
  scale: faction
  season_requires:
    - need: "A religious institution's supreme leader must be able to publicly rule on doctrine in a way that materially shifts political-military measures elsewhere on the board."
      why: "His pastoral decisions are not flavor — they move real institutional pressure that other factions react to."
      hardness: important
    - need: "A leader whose personal faith is intact must be able to have that faith privately challenged by presented facts, with a real chance his private conviction cracks while he continues performing his public role unchanged."
      why: "His arc depends on a private erosion the public role masks — sincere devotion and hidden doubt have to be able to diverge."
      hardness: core
    - need: "If the leader's private crack becomes known, the institutional damage must scale with how publicly it becomes known (rumor vs. proof vs. confession) rather than being a single binary discovered/undiscovered flag."
      why: "A public crisis of faith and a quiet personal one have to be able to produce very different consequences for the institution."
      hardness: important
    - need: "The leader must be able to face a decision where every theologically coherent answer available to him damages the institution in a different way, so there is no clean resolution regardless of which he picks."
      why: "The choice forced on him by a rival's claim on his authority is designed so that both possible answers cost something — that has to be guaranteed by the mechanism, not just described in prose."
      hardness: core
    - need: "A rival secular territory must be able to categorically deny this leader's coercive authority over its own residents, forcing him to negotiate or act covertly rather than command."
      why: "A jurisdiction that simply refuses him is a real limit on a religious leader's reach that a purely military or wealth-based faction wouldn't face the same way."
      hardness: important
    - need: "The leader must be able to delegate separate domains of institutional power (military, judicial, economic, scholarly) to different subordinate leaders who can each independently drift from his control, up to becoming more dangerous than he was."
      why: "If he falls, the vacuum has to be able to be worse than his own rule, not automatically safer."
      hardness: important
    - need: "A person's capacity for a certain kind of perception must be able to be permanently foreclosed by their institutional belief system, reachable again only through a shock external to ordinary play."
      why: "His theological framework structurally prevents an ordinary developmental path to the perception his enemies have — this needs a real, not merely narrative, closure."
      hardness: important
    - need: "The same enforcement apparatus must be able to treat a follower differently purely based on which territory that follower is standing in when investigated."
      why: "His authority's actual reach is territory-conditioned, not uniform, and that difference has to be visible in play."
      hardness: important
    - need: "The leader must be able to shield a subordinate's confidential counsel from any mechanical or reputational penalty even when that counsel directly contradicts his own stated position."
      why: "Frank private counsel that costs the advisor nothing is part of how his institution actually functions day to day."
      hardness: flavour
  temporal:
    span_seasons: ongoing
    needs_memory_of: "cumulative institutional-legitimacy pressure, his private faith-state and any accumulated cracks in it, where and against whom prior investigations were conducted and under which territory's jurisdiction, whether a cooldown-gated institutional veto has been used recently, whether an irreversible personal faith-event has already happened to him"
    needs_deadline: "yes — an institutional veto power is reusable only on a multi-season cooldown, and a rival's succession bid forces an immediate, unscheduled doctrinal decision the moment it succeeds"
  who_acts:
    - Himlensendt
    - the four subordinate arm-leaders (military, judicial, economic, scholarly)
    - the duchess pressing a claim on the throne
    - the king
    - the secular territory that refuses his jurisdiction
    - players
  knowledge:
    - "the public does not know his private theological doubt unless a specific kind of contest defeat makes it known"
    - "he does not know for certain whether a rival's ambition toward secular power is opportunistic or a long campaign"
    - "no one knows in advance whether a subordinate arm-leader will seize control if his own crisis becomes public"
  ends_when: "never automatically; his personal arc resolves via unchallenged doctrinal dominance, a private crisis of faith, or public confrontation and schism, and the institution's leadership itself ends only on his death, incapacity, or forced doctrinal crisis triggering a successor process"

- id: NPC-050
  name: Inge Baralta
  one_line: "A duchess whose total personal command of her own duchy conceals that its survival without her is entirely unresolved, pressing a decades-long claim on a throne she cannot simply take."
  scale: faction
  season_requires:
    - need: "A leader must be able to build a multi-season positioning campaign toward a higher seat that only becomes attemptable once specific external conditions — the target seat's weakness AND a general instability threshold — are simultaneously true, so years of preparation can sit inert waiting on someone else's failure."
      why: "Her claim is explicitly gated on Crown weakness she does not control, not on her own readiness; this is the mechanism that makes a claim something 'pressed over seasons' rather than declared once."
      hardness: core
    - need: "An overreaching attempt at the higher seat must be able to fail, cost the claimant standing, and be un-repeatable for a fixed cooldown period."
      why: "Without a real, costly failure state, pressing the claim is a free repeatable check rather than a genuine multi-season bet."
      hardness: core
    - need: "A leader's personal authority over her own institution must be able to be nearly absolute — her open disagreement with it costs her nothing — while the institution's survival without her personally remains unresolved, with no designated successor."
      why: "The defining irony of her position is total present authority paired with hollow future authority; both halves must be representable at once."
      hardness: core
    - need: "A claimant's success at seizing the higher seat must be conditioned on a third party's institutional state at the exact moment of the claim, so that an early, a middle, and a late attempt in the same campaign produce categorically different outcomes."
      why: "Whether she rules with or without recognition, and at what cost, has to depend on when in the campaign she wins, not be a fixed result."
      hardness: important
    - need: "Taking the higher seat must be able to threaten the fracture of the claimant's home institution, contingent on a separate instability measure that keeps accumulating whether or not she is paying attention to it."
      why: "Leaving her duchy for the throne has to put the duchy itself at risk through a mechanism independent of her personal action economy."
      hardness: important
    - need: "A rival institution must be able to refuse to recognize this leader's coercive authority over its own followers as a matter of stated principle, and that refusal must be a fact other actors can react to."
      why: "Her signature doctrine is precisely a jurisdictional refusal aimed at a rival power; it has to bind, not merely be asserted."
      hardness: important
    - need: "A leader who governs entirely through legalistic, precedent-bound methods must be able to become willing to act outside those methods once a specific named institutional failure occurs, and that shift must persist rather than reset the following season."
      why: "Her willingness to go extralegal is supposed to be a durable state change triggered by a named failure, not a one-scene reaction."
      hardness: important
    - need: "A theological or ideological innovation a leader personally originates must be able to spread its effects across the population she governs on a timescale much longer than the campaign, so it can exist as true worldbuilding without being an active mechanical variable."
      why: "Her doctrinal innovation is explicitly generational in its effect, not something the current campaign needs to resolve."
      hardness: flavour
  temporal:
    span_seasons: ongoing
    needs_memory_of: "the target seat's political-strength history (has it crossed the threshold that makes her claim attemptable), a general instability measure's cumulative value, whether a prior claim attempt failed and its cooldown clock, the rival religious institution's own stability at the moment any claim resolves, whether that institution has moved against her directly"
    needs_deadline: "yes — a failed claim is un-repeatable for a fixed number of seasons, and the claim's ultimate meaning changes depending on how many campaign seasons remain when it is finally attempted"
  who_acts:
    - Baralta
    - the king
    - the church leader and his subordinate arm-leaders
    - her own inner council and legal advisor
    - the standing army's commander (a competing claimant)
    - players
  knowledge:
    - "other leaders can only estimate whether her ambition toward the throne is contingency or an active campaign"
    - "she must track the target seat's weakness and a general instability measure herself to time her attempt"
    - "no one knows whether the church will grant or refuse recognition until the moment her claim actually succeeds"
  ends_when: "never automatically; her personal arc resolves via unchallenged rule of her own duchy, a forced turn to extralegal action, or being cast out of the religious institution entirely, and separately her pursuit of the throne resolves win, loss, or her death/removal triggering her own duchy's succession"

- id: NPC-052
  name: Magnus Vaynard
  one_line: "A revolutionary duke whose authority is elective rather than absolute, whose private research risks transforming him, and whose fall could split his domain in two."
  scale: faction
  season_requires:
    - need: "A leader's personal, private research into a dangerous or forbidden knowledge domain must be able to advance his own capability while simultaneously risking a personal transformation he cannot fully control, checked probabilistically each time he uses it."
      why: "Every act of pursuing his central goal is also a private roll against himself, not a safe resource expenditure."
      hardness: core
    - need: "A confederated leader's authority must be able to be formally revocable by the collective body that grants it, through a multi-step process he cannot unilaterally block, requiring only a majority of his own senior subordinates."
      why: "His position as 'first among equals' rather than a hereditary monarch means his command is conditional in a way a king's is not."
      hardness: core
    - need: "A trusted subordinate acting in the leader's name must be able to carry a private, undisclosed conflict of loyalty that causes her to silently underperform one category of task, undetectable without independent investigation."
      why: "The leader's intelligence apparatus has to be able to be quietly compromised by its own operative's divided sympathies without his knowledge."
      hardness: important
    - need: "If this leader is removed from play, the identity of his successor must be able to remain genuinely undetermined among several qualified claimants, with the outcome capable of splitting his domain into two rival successor territories rather than resolving automatically to one heir."
      why: "His fall must be able to fracture his life's project rather than hand it cleanly to a designated fallback."
      hardness: core
    - need: "A leader must be able to declare that no other party, including his own institution, can be trusted with the thing he protects, and act on that declaration in a way that isolates him from natural allies pursuing the same outcome."
      why: "His inability to ally even with someone who shares his diagnosis has to be a structural consequence of a stance he holds, not an oversight."
      hardness: important
    - need: "A leader's public revolutionary ambition must be able to depend materially on the stability of the very system he intends to overthrow, without that dependency being visible to him or to the system's defenders."
      why: "His preparations are propped up by an equilibrium he is trying to destroy, and neither side can be allowed to simply notice this and act on it."
      hardness: important
    - need: "An ideologically aligned peer with institutional access this leader lacks must be able to refuse to accelerate a shared goal on his preferred timeline, so agreement on diagnosis does not guarantee cooperation on method or pace."
      why: "His potential alliance with a reform-minded royal has to fail on method even though both want the same end."
      hardness: important
    - need: "A non-military, non-secret means of contesting a territory's cultural or religious alignment must be able to shift that alignment without transferring who controls the territory."
      why: "He needs an ideological-pressure lever distinct from outright conquest."
      hardness: flavour
  temporal:
    span_seasons: ongoing
    needs_memory_of: "his cumulative advancement toward the personal-transformation threshold and any prior transformation events, the compromised operative's disposition and hesitation pattern history, the confederate assembly's disposition toward him for the revocation threshold, the outcome if a succession contest has already occurred once (a split, once made, is permanent)"
    needs_deadline: "no fixed date, but once a revocation process against him is invoked it runs on a bounded recovery window before the outcome (reinstatement or permanent removal) is forced"
  who_acts:
    - Vaynard
    - his intelligence operative and named successor-fallback
    - the confederate assembly's senior members
    - the movement leader who could back a rival successor
    - the reform-minded royal ally-that-isn't
    - players
  knowledge:
    - "he does not know his intelligence operative's underperformance is caused by divided loyalty rather than caution"
    - "the confederate assembly must gather witnessed, not merely rumored, evidence before it can act to remove him"
    - "no one knows whether a succession, if triggered, resolves unified or split until the contenders' relative strength is actually compared"
  ends_when: "never automatically; his personal arc resolves via unchecked scholarship, a personally transformative awakening, or being consumed by what he sought, and his leadership ends only on death, incapacity, or removal, triggering the succession/split outcome"

- id: NPC-070
  name: Lisbeth Ehrenwall
  one_line: "The commander of the crown's only standing army, whose institutional loyalty is a silent, gradually shifting professional judgment rather than a fixed allegiance."
  scale: faction
  season_requires:
    - need: "A standing military institution nominally loyal to a ruler must be able to progressively reassess that loyalty across several internal stages, driven by accumulating evidence of the ruler's failures, with no single season's evidence sufficient by itself to flip the institution against him."
      why: "This is the core mechanism of her arc; it must not collapse into a binary loyal/disloyal check."
      hardness: core
    - need: "The military leader assessing the ruler must be able to hold and act on a private professional judgment that is never voiced to the ruler as an accusation, yet still accumulates mechanically over time."
      why: "Her assessment of whether the ruler still deserves his position is an ongoing silent institutional process, not a confrontation scene."
      hardness: core
    - need: "If the military leader is removed, whoever is next in the chain of command must be able to hold different priorities that redirect the institution's future actions in a concrete, different way than the original leader would have."
      why: "Losing her has to change what the army actually does, not just who commands it."
      hardness: important
    - need: "The military leader's own death or removal must be able to lower the institution's tolerance threshold for further provocation, so an already-tense situation escalates faster under new leadership than it would have under her."
      why: "Her personal survival is itself a stabilizing variable for the ruler she serves, in a way neither of them can fully control."
      hardness: important
    - need: "A single named liaison individual must be able to function as the effective flashpoint of an internal power struggle between two institutions, because that individual's removal is what the underlying mechanism actually keys on, even though the nominal antagonists are larger bodies."
      why: "The internal power struggle needs one concrete, targetable person as its trigger point rather than firing on an abstract institutional threshold alone."
      hardness: important
    - need: "A diplomatic action by an outside party must be able to persuade the military institution to change its deployment posture without going through the ruler at all."
      why: "There has to be a lever on the army that bypasses the crown entirely, available to any sufficiently capable outside actor."
      hardness: important
    - need: "The military leader must be able to be personally reached by an appeal grounded in shared service or sacrifice in a way abstract political argument cannot, even though she is otherwise moved primarily by demonstrated consequences."
      why: "A narrow, hard-won personal channel to her has to exist distinct from her default decision logic."
      hardness: flavour
  temporal:
    span_seasons: ongoing
    needs_memory_of: "the current stage of institutional reassessment and every event that advanced it, whether the key liaison individual is alive and in position, whether she herself has died or been removed (which permanently changes the institution's thresholds going forward)"
    needs_deadline: "no fixed date; each stage of reassessment, once crossed, does not revert on its own"
  who_acts:
    - Ehrenwall
    - the king
    - the liaison individual the internal struggle keys on
    - her designated successor
    - the wider military chain of command
    - players
  knowledge:
    - "the rank and file need not know why institutional trust is eroding — it is aggregate drift, not a publicized vote"
    - "the ruler may not know precisely where the institution's reassessment currently stands — it is a private institutional judgment, not a shared number"
    - "if a member of the institution is discovered to hold forbidden knowledge, the institution's response is structural distrust regardless of its actual moral view of that knowledge"
  ends_when: "never automatically; concludes with either sustained loyalty through the campaign, an outright break in which the institution stops executing the ruler's will, or her removal transferring command with revised, harsher thresholds"

- id: NPC-003
  name: Yrsa Vossen
  one_line: "A movement leader whose authority exists entirely through relationship and visibility rather than any formal seat, and whose visibility is also her permanent vulnerability."
  scale: faction
  season_requires:
    - need: "A person recognized as a movement's leader must be able to exert real influence and be targeted by opponents before any formal institutional seat or organizational structure exists for the movement at all, with that authority measured through relational and reputational quantities rather than a rank she occupies."
      why: "This is the direct test of leadership with no post — she must be a legible target and actor purely on trust, reach, and visibility."
      hardness: core
    - need: "The leader's public visibility, which is the source of her influence, must be inseparable from the exact quality that exposes her to repeatable, institutional persecution — the game must not allow her to be influential while hidden."
      why: "Visibility-as-vulnerability is the defining trap of her position; separating the two would erase the case."
      hardness: core
    - need: "A leader must be able to choose, season after season, between consolidating her base in fewer places or spreading it thinly across many, with that choice producing a measurably different vulnerability to a specific opposing institution's enforcement action."
      why: "This is her defining behavioral flaw and it must be a real strategic tradeoff with consequences, not flavor text."
      hardness: core
    - need: "If the leader is captured, killed, or discredited before the movement has achieved any formal institutional status, the movement's continuity must be able to remain genuinely ambiguous — a successor, a fragmentation, or a simple loss of coordination — rather than resolved by a procedure built for institutions that already have a formal leadership seat."
      why: "Standard succession machinery assumes a faction sheet already exists; this movement may not have one yet when its leader falls."
      hardness: important
    - need: "The movement's own base must be able to hold a genuine internal disagreement about whether to accept patronage from an established power or reject that power's legitimacy outright, without the leader's personal position resolving the disagreement for everyone who follows her."
      why: "Her authority over her own base is not monolithic; that internal politics has to be able to exist independent of her."
      hardness: important
    - need: "An unincorporated movement must be able to acquire institutional standing incrementally — informal presence, then a single held settlement, then several, then a formal seat — with each threshold unlocking qualitatively different capabilities."
      why: "Leadership-without-a-post has to have a real path toward eventually acquiring one, in graduated stages."
      hardness: important
    - need: "Even after the movement gains a formal seat, it must remain permanently excluded from a category of formal political action available to every incumbent institution, marking it as structurally second-class even once arrived."
      why: "Her movement's outsider status should persist as a real mechanical limitation, not disappear the moment it becomes a recognized faction."
      hardness: important
    - need: "A local population must be able to unilaterally shift its own governance to this movement's control the moment its existing governance completely collapses, without the movement's central leadership needing to have taken any action there that season."
      why: "Local emergence should be able to happen independent of the leader's personal action economy that season."
      hardness: flavour
  temporal:
    span_seasons: ongoing
    needs_memory_of: "the cumulative distribution of the movement's presence across territories, the outcomes of prior persecution attempts against the movement or its leader, the movement's current stage of institutional emergence and which settlements (if any) it holds, a per-territory cooldown on local unilateral emergence, the base's internal disposition toward accepting outside patronage"
    needs_deadline: "yes — local unilateral emergence is capped to at most once per territory within a fixed number of seasons, and reaching the movement's highest institutional stage is implicitly bounded by the campaign's remaining length"
  who_acts:
    - Yrsa Vossen
    - a secondary, more operationally-focused movement leader
    - a reform-minded royal who could offer patronage
    - the church's field investigator conducting persecution
    - local settlement populations
    - a rival faction's disgraced heir who could back the movement
    - players
  knowledge:
    - "opponents do not need to discover her leadership — it is visible by design; what is uncertain is whether persecution against her or her network succeeds, which depends on how thinly her presence is spread that season"
    - "the movement's own rank and file may disagree amongst themselves about whether cooperating with an outside patron is betrayal or strategy, an internally contested belief rather than a single tracked value"
  ends_when: "never automatically while any presence remains; the movement formally ends only via reaching the highest institutional stage, total suppression with no remaining presence anywhere, or collapse once it has reached full institutional status"

- id: NPC-032
  name: Lenneth Almqvist
  one_line: "A queen consort with no independent action economy of her own, whose entire programme routes through persuading a man whose blockage is uncertainty, not disagreement — until an unpredictable event can make her sole ruler or kill her outright."
  scale: realm
  season_requires:
    - need: "A person with a genuine political programme and real institutional standing must be able to have no independent action economy of her own, so that everything she wants to achieve routes entirely through influencing a different person's decisions."
      why: "This is the definitional shape of power exercised without a formal seat of her own — she has no lever except another person."
      hardness: core
    - need: "Sustained private argument and demonstrated intellectual soundness from this person must be able to fail to move the decision-maker specifically because his blocking state is uncertainty rather than opposition, and the game must not treat sound argument as automatically persuasive against an uncertain target."
      why: "Arguing against disagreement and arguing against uncertainty are different failure modes; conflating them erases the specific frustration of her position."
      hardness: important
    - need: "A person's capability in a specialized domain must be able to have a hard ceiling reachable through sustained legitimate effort, past which continued investment produces no further progress, with a categorically higher tier of that capability closed to her except through a wholly different pathway."
      why: "Her personal development in the domain she cares about has a real, structural stop, not merely a slow one."
      hardness: core
    - need: "An external, unpredictable event unrelated to this person's own choices must be able to instantly convert her from an influence-only actor into the sole holder of supreme authority, with every downstream political relationship reconfiguring around the change in the same event."
      why: "Her elevation to power is not something she can pursue directly — it depends entirely on someone else's death, and everything else on the board must react to it at once."
      hardness: core
    - need: "The same unpredictable event, resolved differently, must instead be able to remove this person from play entirely, with the consequence of her death routing almost entirely through a different character's arc rather than her own."
      why: "Her survival is decided by the same random process as her elevation; either outcome is possible and neither is chosen by her."
      hardness: important
    - need: "Ascending to supreme authority through this path must be able to instantly and permanently redefine what the ruling institution stands for, flipping an ambient, privately-held policy uncertainty into an explicit, declared doctrine, rather than merely changing which person occupies the seat."
      why: "Her ascension has to change what the crown IS, not just who holds it."
      hardness: important
    - need: "A previously unified protective institution must be able to fracture into an internal decision point purely as a consequence of who now holds supreme authority, with no change to its own formal chain of command."
      why: "The standing army's forced choice under her rule has to follow automatically from the change in leadership."
      hardness: important
    - need: "A minor heir's declared loyalty must be able to transfer wholesale from one guardian to another the moment the first guardian is removed, without requiring the heir's own independent choice in that moment."
      why: "The heir's allegiance shifting automatically on his father's death, rather than by scene, is part of how the succession cascades."
      hardness: flavour
  temporal:
    span_seasons: ongoing
    needs_memory_of: "her accumulated progress toward her personal-capability ceiling, the current state of the decision-maker's uncertainty (the thing she has been trying to move), whether the unpredictable succession-crisis event has fired yet and in which direction"
    needs_deadline: "yes — the elevation-or-death event is bound to a specific mid-campaign window, after which the branch either fired or the standard arc continues indefinitely"
  who_acts:
    - Lenneth
    - the king
    - the heir apparent
    - the church leader
    - the standing army's commander
    - the rival duchess
    - the revolutionary duke
    - players
  knowledge:
    - "the king can see that her argument is sound but cannot translate that into a decision because his blockage is not disagreement"
    - "no one on the board knows in advance which member of the royal family, if any, the succession-crisis event will target until it resolves"
    - "UNCLEAR: whether Lenneth herself is aware her personal-capability ceiling is a hard structural stop rather than a target she simply hasn't reached yet — the source states the ceiling as setting fact but not her own awareness of it"
  ends_when: "never automatically while she remains queen consort; if she is elevated to sole ruler her case continues indefinitely as a new ongoing reign, and if she is instead the one killed her case ends immediately and permanently"

- id: NPC-031
  name: Torben Almqvist
  one_line: "A minor heir with no fixed political identity, whose eventual allegiance is won by whichever outside power invests in him fastest within a closing window, and who can be killed before it resolves."
  scale: realm
  season_requires:
    - need: "A minor political heir must be able to start with no fixed ideological alignment, such that his eventual alignment is determined by which external party successfully builds a relationship with him first, within a bounded time window."
      why: "This is the entire design of a heir as a contested asset rather than an authored character — his alignment must be won, not assigned."
      hardness: core
    - need: "If multiple outside parties reach the same threshold of investment in the heir at the same point in time, the tie must be broken by an objective, checkable prior fact rather than by arbitrary fiat."
      why: "The contest over him needs a fair, knowable resolution rule for the case where two parties invest equally."
      hardness: important
    - need: "Once the heir's alignment locks in, whether through successful investment or through the window simply expiring, it must become permanently unresponsive to further investment or victories from other parties for the rest of the campaign."
      why: "Permanence is the point — otherwise the contest over him never actually resolves anything."
      hardness: core
    - need: "The heir's maturation from a dependent status into an independent political actor with his own agenda must be able to be triggered by any of several different kinds of event — elapsed time, his own accumulated preparation, a crisis in the ruling institution, or the current ruler's death — whichever comes first."
      why: "His growing up cannot be pinned to a single fixed clock; several very different paths need to be able to trigger it."
      hardness: important
    - need: "The heir's relationship to whoever currently rules in his name must be able to range from voluntary total deference through open rivalry to an active, tracked contest for the same seat of power, determined by the accumulated quality of their relationship at the moment he matures."
      why: "The low end of this range has to be a genuine adversarial contest for power, not merely a strained relationship."
      hardness: core
    - need: "The heir must be able to be killed by an unpredictable event that terminates his entire ongoing political arc and simultaneously reroutes a separate, compound set of consequences involving other characters and factions that have no bearing on anything he himself believed or did."
      why: "His death has to matter to the board in a way substantively disconnected from his own unresolved arc, which is itself terminated rather than paid off."
      hardness: important
    - need: "A foreign power with cultural or educational influence over an at-risk heir must be able to leverage that influence as a standing political threat even without ever acting on it, purely through its potential to alter what the heir will become."
      why: "The mere existence of foreign influence over the heir's formation has to be a usable threat independent of whether it is ever exercised."
      hardness: important
    - need: "The heir must be able to become a formal instrument of an external, rival power's diplomacy specifically when both the external power's own strength has crossed a threshold and the heir's personal relationship with the current regent has soured, rather than either condition alone being sufficient."
      why: "This outcome needs to require both conditions jointly, not fire on either one alone."
      hardness: flavour
  temporal:
    span_seasons: ongoing
    needs_memory_of: "cumulative per-party investment toward the heir and its tiebreak facts, his accumulated maturation-readiness and which actions contributed to it, whether the alignment window closed with or without a winning party, his current relationship quality with whoever currently rules in his stead, whether the fatal event has already fired against him"
    needs_deadline: "yes — the alignment-contest window is a hard deadline, and the outer maturation clock is a soft deadline if no other maturation trigger fires first"
  who_acts:
    - Torben
    - the king
    - the queen consort
    - whichever outside parties invest in him
    - a foreign imperial court
    - the current regent, if any
    - players
  knowledge:
    - "the parties investing in him can compare their own standing with him even before the alignment window closes"
    - "no one can predict his eventual alignment with certainty before the window closes or a maturation trigger fires"
    - "whoever rules in his stead may not know his precise readiness for maturation without directly engaging him"
  ends_when: "the contested-alignment phase ends at the window's close (or earlier, if a party wins outright) with a locked identity; his dependent status ends at maturation; his overall case ends only on death or the campaign's end"

- id: NPC-030
  name: Elske Almqvist
  one_line: "A princess entirely off the main board whose safety alone drives another person's every relevant decision, and who is repatriated, if ever, only by an unrelated sibling's death."
  scale: realm
  season_requires:
    - need: "A person with no independent action economy, off the primary board entirely, must still be able to make another character's every relevant decision legible as being driven by concern for her specific safety."
      why: "Her narrative function is to be the reason a foreign administrator softens his behavior, not to act herself."
      hardness: core
    - need: "A hostile foreign power must be able to hold a standing coercive threat over the home polity purely through possession of a person, without ever needing to act on the threat, and that threat's mere existence must be able to move a slow institutional-pressure measure."
      why: "Her value as leverage has to work passively, as a standing chip, not only when actively exercised."
      hardness: core
    - need: "An intermediary supposed to serve the foreign power's interests against this person must be able to instead act to protect her, silently deviating from his mandate, and that deviation must be able to relay useful information back to her home polity through her personally."
      why: "The covert relay chain, with the hostage herself as a node passing information home, is a specific mechanism this case needs."
      hardness: important
    - need: "A slow institutional-pressure measure driven by concern for this person's safety must be able to convert instantly into an acute crisis the moment she is credibly endangered, rather than scaling continuously."
      why: "The threat to her has to be able to snap from background pressure to a crisis in a single step."
      hardness: important
    - need: "This person's return to her home polity must be conditioned entirely on an unrelated family member's death via an unpredictable event, and that return must require an active operation into hostile third-party territory rather than a simple diplomatic recall."
      why: "Her repatriation is not something she or her home polity can simply choose to do — it needs to be gated on an external death and a real military effort."
      hardness: important
    - need: "If this person is eventually returned home and made politically relevant, her formative external upbringing must be able to shape how her political identity subsequently develops, distinct from how a home-raised heir's identity develops."
      why: "Her cultural formation abroad has to leave a lasting, distinguishing mark if she ever becomes a live political actor."
      hardness: flavour
    - need: "A person's internal epistemic stability must be able to be measurably reduced by the structural condition of divided loyalty and hostage status alone, independent of any specific event happening to her that season."
      why: "Her situation itself, not an incident, is what should carry a standing personal cost."
      hardness: flavour
  temporal:
    span_seasons: ongoing
    needs_memory_of: "how many times the foreign intermediary has leaked information to her and whether her home polity received it, the current level of the slow institutional-pressure measure and whether an endangerment spike has fired, whether the unrelated sibling's fatal event has resolved"
    needs_deadline: "yes, conditionally — if the sibling's fatal event fires, her retrieval arc is bound to the same mid-campaign window as that event"
  who_acts:
    - Elske
    - the foreign administrator guarding her
    - the foreign imperial court
    - the king
    - the revolutionary duke whose territory any retrieval must cross
    - the heir apparent, whose death is the trigger
    - players
  knowledge:
    - "the foreign imperial court does not know its own administrator is deviating from their mandate to protect her, or has not acted on it if it does"
    - "her home polity's knowledge of foreign intentions is contingent on this one covert relay continuing to function"
    - "no one knows in advance whether the fatal event targeting her brother will occur, so her entire future status hinges on an event outside anyone's knowledge until it resolves"
  ends_when: "never automatically as a standing leverage asset; a triggered retrieval arc ends in extraction success, extraction failure, or an indefinite multi-season stalemate"

- id: NPC-001
  name: Edeyja
  one_line: "The single most perceptive person in the setting, holding an isolated post that answers to no institution, whose authority is real but reachable by almost nothing ordinary politics can offer her."
  scale: world
  season_requires:
    - need: "The single most capable person in a specialized domain must be structurally unable to communicate her work's urgency to anyone who cannot already perceive what she perceives, regardless of how clearly or urgently she tries."
      why: "The most important person in the setting being unable to ask for help through ordinary channels is the central tragedy of her position."
      hardness: core
    - need: "This character must be completely unmoved by political, emotional, or purely rhetorical appeals — only demonstrated competence and concrete evidence, and failing that a stated future consequence, can affect her judgment."
      why: "Her total resonant-style gate is what makes her authority non-political — nothing that works on every other named leader works on her."
      hardness: core
    - need: "This character must be able to operate entirely outside any faction's institutional incentive structure, so no faction can compel, bribe, or politically pressure her the way they can pressure an office-holder."
      why: "Her cooperation is earnable only on her own terms, which is what makes her authority not political at all."
      hardness: core
    - need: "This character's personal presence must be able to actively worsen the local instability of any place she is forced to travel through, specifically when she has been driven from her post, so her own survival-seeking behavior directly damages the places sheltering her."
      why: "Even her flight from catastrophe has to carry a cost to others, not just to her."
      hardness: important
    - need: "This character's personal discipline must be able to let her exceed the normal safety limits that would force anyone else to stop performing a dangerous specialized action, specifically once the surrounding instability crosses a severe threshold."
      why: "Her override of her own safety limits under crisis conditions is a concrete expression of what her convictions mean in practice."
      hardness: important
    - need: "A party who has repeatedly and visibly destabilized the thing this character protects must be able to trigger a mandatory, high-priority direct confrontation with her once their accumulated visible harm crosses a threshold, with at least three qualitatively different resolutions available depending on how they respond in the moment."
      why: "Her patience must have a hard, triggered limit with real branching stakes, not merely a disapproval meter."
      hardness: core
    - need: "A party who anticipates this confrontation must be able to preempt it by offering her a specific, falsifiable, time-bound commitment instead, with her willingness to accept scaling by how convincing the offer is, and a real chance the offer is refused outright."
      why: "There has to be a proactive alternative to being confronted, available to a party who reads the situation early."
      hardness: important
    - need: "A commitment made to her, once accepted and later fulfilled, must be able to permanently raise her tolerance for future provocation from that specific party, so the relationship is demonstrably and durably different afterward rather than merely reset."
      why: "A kept promise to her has to change the relationship's baseline permanently, not just clear a counter."
      hardness: important
    - need: "If a commitment made to her is broken, or a confrontation with her is escalated rather than resolved peacefully, the relationship must be able to close in a way that cannot be rebuilt through ordinary play for the remainder of the campaign."
      why: "Her trust, once destroyed this way, needs a genuinely hard floor, reserving only extraordinary named circumstances as a possible reopening."
      hardness: important
    - need: "Her cooperation must be reachable through several structurally different paths — sponsorship by a rival faction, ideological embrace by a popular movement, a party's own independently founded organization, patronage from a member of the ruling family, or an independent crisis with no faction involved — each producing a different governance shape for the group she leads once it becomes politically active."
      why: "Her eventual political relevance should not be reducible to a single faction's recruitment action."
      hardness: flavour
  temporal:
    span_seasons: ongoing
    needs_memory_of: "cumulative witnessed harm to what she protects, the current headcount of others who share her post and whether it has reached zero, the local instability level around her post, whether a time-bound commitment to her is active and its terms, which (if any) path toward wider political relevance has been pursued"
    needs_deadline: "yes — an active time-bound commitment resolves on a named future date or condition, and a post-confrontation probationary period runs on its own fixed window before any further violation refires the confrontation"
  who_acts:
    - Edeyja
    - a player or party acting on her directly
    - the wider network of people who share her post, off-screen
    - the revolutionary duke as a potential sponsor
    - the movement leader as an alternate sponsor
    - the queen consort as a potential patron
    - any independently founded organization
  knowledge:
    - "she must personally witness a party's destabilizing actions for them to count toward her confrontation threshold — being merely told does not count"
    - "she does not know in advance whether a party who wagers a future commitment to her will actually honor it"
    - "the wider world, lacking her kind of perception, cannot know what she knows about the true condition of what she protects"
  ends_when: "never automatically — her holdout is indefinite by default; her personal arc concludes locally via a confrontation's resolution, a wager's pass or fail, or her post's actual transition into one of several possible forms of wider political organization"
```
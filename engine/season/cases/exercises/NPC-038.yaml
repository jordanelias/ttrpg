# NPC-038 · ARNLOD OLAFSSON — `W28`'s `scale:` re-authoring. See NPC-033 for what is being repaired.
#
# ⚠ THIS CASE IS A DIRECT CANON HIT, AND IT CORRECTS THE FIRST DRAFT OF THIS FILE. Rev 1 read
# "Cardinal Justice" as a generic realm office and gave it no body. `systems/world/`'s
# `worldbuilding_v30.md` §3.1 — the Church of Solmund Four-Cardinal structure — has a row whose
# Cardinal is **Justice**, whose Arm is **Judicial**, whose Portfolio is *"Inquisitors, Grand
# Adjudication, heresy investigation, text suppression"*, and whose **Named NPC is Arnlod
# Olafsson**. The corpus case and canon are the same person. Nothing here is inferred.
case: NPC-038
name: Arnlod Olafsson
scale:
  was: faction
  is: realm
  why: >-
    `one_line`: "Cardinal Justice, the Church's institutional head of the Inquisition, whose own
    hidden compromising connection is a standing liability to the entire apparatus he authorizes."
    The INSTITUTIONAL HEAD of a realm-wide Church body acts at the realm; "the entire apparatus"
    is the stated reach. `who_acts` names a "nominal superior" and "the rest of the Inquisitor
    ladder (subordinates)", so the case itself describes a ladder he sits near the top of. Canon
    agrees from the other side: §3.1's four Cardinals are the Church's arms, not any one
    settlement's, and the Church holds Himmelenger (T9, Cathedral City) as a realm-scale seat.
  office:
    post: "Cardinal Justice"
    body: "Cardinal of Justice"
    remit: [issue, determine, dispatch]
    why: >-
      ⚠ `body` IS AUTHORED AND `faction` DERIVES — canon binds `Cardinal of Justice` to the Church
      of Solmund, so naming both would be storing a derivable fact twice and letting them disagree.
      The remit is read from the case's own nouns, checked against canon's Portfolio cell:
      "the entire apparatus he AUTHORIZES" is `issue`; "institutional head of the INQUISITION" —
      §3.1's Arm for this seat is literally *Judicial* — is `determine`; the subordinate Inquisitor
      ladder he directs is `dispatch`. ⚠ NOT `confer` or `revoke`: the case never says he appoints
      or removes anyone, and those are the governance canon's title/office verbs, which Jordan
      ruled turn on holdings and purview. Canon does not add them either — §3.5's Excommunication
      is a Church power over STANDING, not over an office's tenure.
# `W28-cast`, position `17b` PILOT. Read off this case's own sentences (quoted), written by an
# author, matched by no code. Arnlod's OWN office is the case-level `scale.office` above (held by
# the first seat, `p_a`), so his entry carries none -- a second would seat him twice. No
# `capability`: authorizing an apparatus is not a `verb_capability` key (`copying` only).
cast:
- who: Arnlod Olafsson
  role: protagonist
  # need 1: "a single named superior whose sponsorship, approval, or authorization is a formal
  # precondition for that branch's members to act above a defined severity or target-importance
  # threshold" -- the branch's members are who_acts[2], "Sæmund Haelgrund and the rest of the
  # Inquisitor ladder (subordinates)".
  ought:
    about: Sæmund Haelgrund
    predicate: acts above the severity threshold only by his authorization
- who: Arne Himlensendt
  role: nominal superior
  # who_acts[1]: "Confessor Arne Himlensendt (nominal superior)". Same seat NPC-021 authors.
  office:
    post: Confessor
    body: Holy See
    remit: []
    why: >-
      `who_acts[1]` names the post ("Confessor") and the man; `body: Holy See` is the Church's top
      organ, above the four Cardinal arms -- the reading `NPC-021.yaml` already makes for this same
      Confessor. `remit: []` as there: nothing in THIS case says what act the Confessor's seat
      carries, only that he is the nominal superior.
- who: Sæmund Haelgrund
  role: subordinate on the Inquisitor ladder
  # who_acts[2]: "Sæmund Haelgrund and the rest of the Inquisitor ladder (subordinates)".
  office:
    post: Inquisitor
    faction: Church of Solmund
    remit: []
    why: >-
      `who_acts[2]` names the ladder ("the Inquisitor ladder") the case seats him on, and
      `one_line` makes the Church the apparatus ("the Church's institutional head of the
      Inquisition"). NO `body`, deliberately: the Inquisitor ladder is not one of canon's
      `office_bodies` (the Cardinal of Justice body is the Cardinal's own organ, and seating a
      subordinate in it would call him its head), so `faction` is authored directly -- the arm
      `H-99` provides for an organ canon has not written. No remit act is named for the ladder.
- who: a rival faction's agent
  role: pursues exposure of his broker connection
  # who_acts[3]: "a rival faction's agent pursuing exposure of his broker connection". The faction
  # is not named, so no office: `office_faction` would refuse a guess.
  ought:
    about: Arnlod Olafsson
    predicate: has his broker connection exposed

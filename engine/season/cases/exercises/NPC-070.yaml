# NPC-070 -- `scale:` re-authoring, plan position `20-ii` (U9/R-04, `workplans/2026-09-18-governance-settlement-behaviour-plan_part2.md:1459-1474`). Read against the case's own `one_line`/`who_acts` (`engine/season/cases/chain/`), never matched by keyword (`harness/corpus_run.py::rescales`'s own warning: 23 of 47 match no institution word).
case: NPC-070
scale:
  was: faction
  is: realm
  why: 'following the reading NPC-008/NPC-033/NPC-038 already established for this corpus (a faction-wide
    or Crown/Church-level institution re-scales to `realm`, since `rung_kinds` has no `faction` member
    and the institution''s own reach is realm-wide): `one_line` names Ehrenwall ''The commander of the
    crown''s only standing army'' -- a single, Crown-wide command with no narrower territory named.'
  office:
    post: commander of the standing army
    faction: Löwenritter
    remit: []
    why: '`one_line`: ''The commander of the crown''s only standing army''. The seat belongs to the
      faction its holder COMMITS to, and the registry commits NPC-070 (`Grandmaster`) to Löwenritter, so
      `faction: Crown` made `leaders()` lose her: an office whose holder never committed to its faction
      is staff. `rosters.yaml: faction_leaders` names her Löwenritter''s leader, and `offices.yaml:
      off_grand_master` seats NPC-070 in the Löwenritter body `Lions'' Table`. Her army serves the Crown
      without being the Crown''s faction. `faction` is authored directly, per `office_faction`''s
      no-organ case, rather than naming `Lions'' Table` as the body, which would be a second opinion on
      a body this overlay''s `post` does not claim.'

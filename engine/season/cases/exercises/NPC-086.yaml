- need_sha: e51cecedc324
  hardness: core
  need: A technical specialist's field data must be able to exist as a persistent evidence object with
    its own scope and quality, independent of any single Contest roll -- something that can be examined,
    copied, corroborated, or suppressed as an artifact.
  exercises:
  - create_record
  - H-22
  from: A persistent evidence object with its own scope and quality, examinable independently of any roll,
    is a `Record`. `H-22` is `ruled` and carries `forgery_quality` and `subject_matter`, which is where
    scope and quality live; `create_record` is the act that makes one.
- need_sha: 7a5d7be123ee
  hardness: core
  need: Presenting his evidence to a political audience must be able to change what that audience believes
    about the cause of the sea-route blockage, and that changed belief must persist and spread to third
    parties who never saw the data themselves.
  exercises:
  - tell
  - H-79
  from: 'Changing what an audience BELIEVES, persistently, is a claim deposited in their ledgers -- `tell`
    is the verb and `H-79` decides what such a deposit is ABOUT. ⚠ THIS ROW ALSO DECLARED `H-84` AND THE
    NEED ITSELF REFUTES IT: the belief must spread to third parties ''who never saw the data themselves'',
    so propagation WITHOUT the artefact moving is exactly what is asked for, and requiring a Record to
    change hands was the wrong blocker. Caught by the `W10` adversarial pass.'
- need_sha: ce801d93e2ca
  hardness: core
  need: Corroborating or refuting his claim must be possible for a third party through independent fieldwork,
    not only by taking his word for it.
  exercises:
  - examine
  - interview
  - research
  from: 'Corroboration by INDEPENDENT fieldwork is precisely the investigation acts, and canon names
    which of them CORROBORATE: `fieldwork_v30.md` §4.3 tags Examine `Verified`, Interview `Testimonial`
    and Research `Documentary`, all three usable as "Contest corroboration". ⚠ THIS ROW DECLARED THE
    SINGLE TOKEN `the six investigation acts` UNTIL 2026-09-10 (ED-FI-0009): Part E carried them as one
    row with `requires: per act` and no predicate, so the fold could not execute it. Split into six rows
    with typed preconditions, all three are resolvable -- which is the sense in which this log reports
    them as executing: the FOLD can carry them. ⚠ TWO SENSES, AND THEY DIVERGE ON `examine`: over the 89
    corpus worlds `interview` and `research` are actually executed and `examine` never is, because it
    binds `exists:Site` and no question these worlds raise refers to a site -- the same fact that keeps
    `work` refused. Declared anyway: a token may name a real thing that is not yet REACHED, and that is
    the instrument working rather than an authoring error.'

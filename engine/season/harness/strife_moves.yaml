  - {code: DR,   name: Ruler dies,              verbs: [fight],                           kinds: [person.died],                                     needs: [office], ends: 0}
  - {code: IN,   name: Successor installed,     verbs: [succeed, confer, establish],      kinds: [succession.claimed, tenure.opened], ends: 3}
  - {code: IM,   name: New burden,              verbs: [issue, requisition, transfer, oblige], kinds: [dispensation.issued, requisition.taken, duty.taken], needs: [context], ends: 4}
  - {code: BR,   name: Breach of right,         verbs: [revoke, arrest, seize],           kinds: [tenure.closed, arrest.made, record.seized],      needs: [side, office], ends: 0}
  - {code: OW,   name: Outside war,             verbs: [march],                           kinds: [march.declared, field.won, field.lost],           needs: [side], dark: "build_realm foreign=False", ends: 3}
  - {code: PT,   name: Petition or demand,      verbs: [petition, carry],                 kinds: [petition.filed, petition.carried], ends: 1}
  - {code: MO,   name: Mobilization,            verbs: [recruit, form_unit, assign_troops, convene], kinds: [army.recruited, army.formed, army.assigned, date.scheduled], needs: [side], ends: 0}
  - {code: OP,   name: Rising begins,           verbs: [march, fight, raze, seize],       kinds: [march.declared, rung.seized, rung.razed],       needs: [side, context], ends: 0}
  - {code: RF,   name: Refusal or mutiny,       verbs: ["evade / defy"],                  kinds: [compliance.withheld],                              needs: [side], ends: 1}
  - {code: VI,   name: Violence or plunder,     verbs: [fight, raze, sabotage, requisition], kinds: [rung.razed, site.damaged, requisition.taken],  needs: [side], ends: 0}
  - {code: SZ,   name: Seizure,                 verbs: [seize, march],                    kinds: [rung.seized, record.seized, field.unopposed], ends: 0}
  - {code: RG,   name: Rival government,        verbs: [establish, found, convene],       kinds: [office.established, rung.founded],                 needs: [side], ends: 0}
  - {code: CL,   name: Claim or deposition,     verbs: [succeed, revoke],                 kinds: [succession.claimed],                               needs: [side], ends: 1}
  - {code: SP,   name: Spread or joining,       verbs: [march, recruit, commit],          kinds: [army.recruited, commitment.made],               needs: [context], ends: 0}
  - {code: FR,   name: Force sent,              verbs: [march, dispatch, order_unit],     kinds: [march.declared, army.arrived, order.given],     needs: [side], ends: 2}
  - {code: NG,   name: Talks,                   verbs: [speak, argue, convene, covenant, determine], kinds: [argument.won, argument.lost, covenant.offered, matter.determined], needs: [context], ends: 2}
  - {code: CO,   name: Concession,              verbs: [issue, give, transfer, pardon],  kinds: [dispensation.issued, record.given, transfer.made], needs: [side], ends: 10}
  - {code: CP,   name: Co-option,               verbs: [transfer, give, confer],          kinds: [transfer.made, record.given, tenure.opened],   needs: [side], ends: 1}
  - {code: RU,   name: Refusal or inaction,     verbs: ["evade / defy", comply],          kinds: [compliance.withheld, duty.refused],               needs: [office], ends: 0}
  - {code: RV,   name: Grant revoked,           verbs: [revoke, destroy_record],          kinds: [tenure.closed, record.destroyed],                  needs: [context], ends: 5}
  - {code: CH,   name: Religious sanction,      verbs: [],                                kinds: [],                                                 gap: "no verb or Event kind names a church sanction; ban/detain tenures exist but no church seat issues them", ends: 0}
  - {code: WN,   name: Siege or battle,         verbs: [march, fight, raze],              kinds: [march.declared, field.won, field.lost], ends: 1}
  - {code: WA,   name: Authority wins,          verbs: [march, fight],                    kinds: [field.won, field.lost],                            needs: [side], ends: 7}
  - {code: WR,   name: Rising wins,             verbs: [march, fight],                    kinds: [field.won, field.lost],                            needs: [side], ends: 0}
  - {code: FA,   name: Authority flees,         verbs: [move, migrate],                   kinds: [travel.moved, residence.changed],                  needs: [side, context], ends: 2}
  - {code: RT,   name: Rising retreats,         verbs: [move, migrate],                   kinds: [travel.moved, residence.changed],                  needs: [side, context], ends: 0}
  - {code: SB,   name: Surrender,               verbs: [give, covenant],                  kinds: [rung.ceded, field.unopposed],                      needs: [side], ends: 3}
  - {code: DA,   name: Defection or split,      verbs: [release, commit, forgive],        kinds: [commitment.ended, stance.moved],                 needs: [side], ends: 0}
  - {code: KL,   name: Leader killed,           verbs: [fight],                           kinds: [person.died],                                     needs: [side, office], ends: 5}

# The 40 move codes of the strife study (the artifact "Mechanics of Strife to c. 1600"), as a READING
# of what the season loop can produce. It resolves nothing: `harness/strife.py` reads it to report
# which codes the loop can reach, and which it did reach, in a seeded run.
#
# Each row:
#   code        the study's two-letter code (NOTE and OTH are not moves and are not rows)
#   name        the study's name for the move
#   verbs       verbs of `verb_table.yaml` whose act can produce the move (loader refuses a name not there)
#   kinds       Event kinds whose presence in the log counts as an instance (loader refuses a kind the
#               loop does not declare)
#   needs       what a kind alone cannot tell, so the count is an upper bound:
#                 side     the study splits the move by side (authority / rebels / outside power)
#                 office   the kind covers any person or seat, the move only an office-holder
#                 context  the move is defined by what precedes it (first outbreak, later trouble)
#   dark        a switch or value that ships off and so keeps the move out of default play
#   gap         no verb or kind in the tree produces the move
#
# `ends` is the number of the study's 102 cases whose last substantive move (NOTE and OTH set aside) is this code,
# by base code (KL-R and KL-O are KL), hand-read from the nine case-mapping tables [UNVERIFIED]; the loader
# checks only that they total 102. `terminal: false` marks XP: the study's mark of later linked trouble, not an
# ending the loop produces (master §4).
#
# [ASSUMPTION; medium; Jordan to correct; revert: delete this file, `harness/strife_data.py` and
# `harness/strife.py`] Every `verbs` and `kinds` entry is a reading of `verb_table.yaml`'s `emits:`
# column by name, not an execution. The instrument's observed count is the check, and a count of 0
# over several seeds is a finding about default play, not about the table.

row_keys: [code, name, verbs, kinds, needs, dark, gap, ends, terminal]
study_cases: 102
needs_vocabulary: [side, office, context]
signature_keys: [kind, cause_verb, attacker, victim_held, code]
attacker_values: [A, R]

# ACT-LEVEL SIGNATURES. A kind alone cannot tell a death in battle from a death by no act of anyone,
# nor a field won by the authority from one won by its challengers. A signature reads the ACT that
# caused the Event: `cause_verb` is its verb (`none` = no act caused it), `attacker` is the side of
# the faction that marched, read against the factions that govern the rung marched on, nearest first:
#   A  the attacker is the nearest governor, or a governor above it (the authority acting or sending force)
#   R  the attacker governs nothing up that chain (a challenger)
# `victim_held` is true when the person who died held a live `detain` tenure at the Event's tick. A death by
# `fight` of a held person is an execution (XE, master §9: a sentence determined, then carried out through
# the combat seam, as Jordan's 2026-09-02 ruling on kills requires); a death by `fight` of anyone else is KL.
# A code with a signature is graded on signature matches alone. An Event matching none is not guessed at.
# [ASSUMPTION; medium; Jordan to correct; revert: delete `signatures:` and the side-aware grade falls
# back to kind-only upper bounds.]
signatures:
  - {kind: person.died,    cause_verb: none,  code: DN}
  - {kind: person.died,    cause_verb: fight, victim_held: true,  code: XE}
  - {kind: person.died,    cause_verb: fight, victim_held: false, code: KL}
  - {kind: person.died,    cause_verb: march, code: KL}
  - {kind: field.won,      attacker: A, code: WA}
  - {kind: field.won,      attacker: R, code: WR}
  - {kind: field.lost,     attacker: A, code: WR}
  - {kind: field.lost,     attacker: R, code: WA}
  - {kind: march.declared, attacker: A, code: FR}
  - {kind: march.declared, attacker: R, code: WN}

moves:

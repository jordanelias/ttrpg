  - {code: XA,   name: Outside power,           verbs: [march, tell, petition],           kinds: [march.declared, news.told],                       needs: [side], dark: "build_realm foreign=False", ends: 1}
  - {code: AM,   name: Pardon or amnesty,       verbs: [pardon],                          kinds: [detention.ended, ban.ended], ends: 0}
  - {code: DN,   name: Leader dies,             verbs: [],                                kinds: [person.died],                                     needs: [side, office], dark: "age_step and illness_rate ship 0.0", ends: 1}
  - {code: XS,   name: Settlement,              verbs: [covenant, determine, issue],      kinds: [covenant.offered, matter.determined, dispensation.issued], needs: [context], ends: 4}
  - {code: XN,   name: Regime or border,        verbs: [seize, give, succeed],            kinds: [rung.seized, rung.ceded, succession.claimed],     needs: [context], ends: 4}
  - {code: XE,   name: Leader executed,         verbs: [fight, determine],        kinds: [person.died],                                     needs: [side], ends: 5}
  - {code: PU,   name: Punishment,              verbs: [arrest, raze, determine],         kinds: [arrest.made, rung.razed, matter.determined],       needs: [side], ends: 3}
  - {code: PC,   name: Penalty on place,        verbs: [requisition, issue, raze],        kinds: [requisition.taken, dispensation.issued, rung.razed], needs: [side], ends: 12}

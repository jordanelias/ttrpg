# authored seats of the built realm. Plan position `8a` (`13d-i` item 5, the last open item of
# that unit; items 1-4 landed `CONFERRAL_BASES`/`REVOCATION_BASES`/`refuse_a_title_in_a_body`).
#
# ⚠ TWO THINGS FOLD IN HERE, AND NEITHER WAS THIS SESSION'S TO DECIDE.
#
# 1. THE `titles:` SECTION BELOW IS `rosters.yaml: titles` MOVED, NOT COPIED -- Layer 1
#    (`architecture/meta/04_CODE_ARCHITECTURE.md` §B.7:308, *"there is no `Title` type"*) and §E.1
#    (`:1067`, *"`titles.domains` moves off the critical path... world-generation content read at
#    step 9"*) rule it world-gen DATA, and `proposals/2026-09-17-governance-and-holdings-r2/
#    05_LEDGER_AND_BUILD.md` RULED (c) settles the destination: *"`titles`, the roster
#    (`rosters.yaml:692`) -- RESIDUE. Its only code reader is `title_domain`... its domains move
#    into `offices.yaml`... and the roster goes."*
#    ⚠⚠ THE ROSTER'S PHYSICAL DELETION WAS DEFERRED ONE SESSION, NAMED RATHER THAN HIDDEN, AND HAS
#    NOW LANDED. `engine/season/rosters.yaml` was declared owned by a CONCURRENT plan position in
#    this same shared working tree at the time this file was authored (2026-09-29) -- deleting its
#    `titles:` block was a `rosters.yaml` edit that session did not make, to avoid a collision with
#    a sibling agent's in-flight work on that file. `data/rosters.py::TITLE_DOMAINS`/`title_domain`
#    were already repointed at THIS file, so `rosters.yaml: titles` stood as orphaned residue for
#    exactly one session -- `S11`'s own shape (*"loads clean, `roster()` raises at READ, not at
#    load"*) -- until the Phase-1 methodology close (2026-09-29, `/simplify` ALTITUDE lens)
#    physically deleted it, the follow-up `HANDOFF_IN.md` had named. The full Jordan-quoted
#    ruling this file's own `titles:` header already carries below is now the only copy.
#
# 2. THE `seats:` SECTION'S SHAPE IS `proposals/2026-09-17-governance-and-holdings-r2/
#    03_SEATS_AND_CONTENT.md` §A.14/§A.15 -- the fully adjudicated derivation of
#    `proposals/2026-09-16-term-ownership/offices_draft.yaml` (570 lines, transcribed-from-canon,
#    verified against the live rosters row by row: 12 seats transfer post+body only, 9 are authored
#    fresh from a draft row, 4 are dropped as superseded by the 2026-09-13 NPC-behaviour ruling or
#    unconstructable against today's rosters; see `03` §A.13 for the full row-by-row disposition).
#    ⚠ THAT DOCUMENT'S OWN `conferral`/`revocation` COLUMNS ARE SUPERSEDED AND ARE NOT COPIED.
#    `03:1043-1056` proposed `conferral_bases: [confer, determine, succeed]` and
#    `revocation_bases: [purview, holdings, none]` -- both dated before Jordan's ruling and both
#    replaced, in `rosters.yaml` (already, at plan items 1-4) and again here, by `ED-IN-0256`:
#    ruling (2), VERBATIM *"appointed, elected, annex"* -- HOW A SEAT IS FILLED; ruling (3),
#    VERBATIM *"rung above of same faction"* -- WHO MAY STRIP IT, a single structural rule replacing
#    BOTH the old purview-for-an-office and purview+holdings+rank-for-a-title readings. Every row
#    below carries `03`'s STRUCTURE (id, post, rung anchor, body/faction, remit_acts, holder,
#    source) with `conferral`/`revocation` RECOMPUTED against the two ED-IN-0256 rosters, never
#    against `03`'s own superseded value sets. The translation, and why each row landed where it did:
#      * `confer` (a superior names the holder) -> `appointed`.
#      * `determine` (an assembly, forum or college elects/determines the holder) -> `elected`.
#      * `succeed` (hereditary succession -- King, Queen, Heir, Princess, and the Crown's own
#        `Duke of Valorsmark` seat) -> **left `null`, a JUDGMENT CALL flagged for attack.**
#        `ED-IN-0256`'s three values are HOW A SEAT IS FILLED and none of them is heredity; a
#        monarch's heir is not "appointed" in the sense the roster's own note gives the word
#        (*"which act fills an elected or an annex seat is not ruled"* -- ruling (2) is silent on
#        succession entirely). `Office.conferral` is OPTIONAL (`state/carriers.py`: `if self.
#        conferral is not None: require_member(...)`), so `null` is lawful and matches what these
#        six seats already carry in the live build today. Heredity is `ARCH §B.8`'s separate
#        `succeed` Tenure/verb (`own`-eligible, a typed `relation` cell, no `@effect_for` body yet)
#        -- outside `Office.conferral`'s ruled roster, not silently folded into it.
#      * `purview`/`holdings` (old: purview alone for an office, purview+holdings+rank for a title)
#        -> `rung_above_same_faction` wherever a rung above could in principle hold a same-faction
#        seat (22 of 29 rows) -- the two old bases collapse to ED-IN-0256's one structural rule,
#        which is dispatched dynamically at revoke-time by `state/gate.py::seated_on_the_rung_above`
#        against WHOEVER actually holds that seat, not precomputed here.
#      * `none` (a seat with no revoker at all -- realm-scale seats with no rung above them, and
#        the two Church/Restoration seats canon calls sovereign or informal) -> stays `null`, 7 of
#        29 rows, preserving `03`'s own judgment about WHICH seats are protected rather than
#        re-deriving it.
#
# ⚠⚠ HOW `harness/populated.py::build_realm` READS THIS FILE (`8a`, 2026-09-29, then `13d-iii`,
# 2026-10-01). EVERY ROW IS ONE SEAT, AND ONE PASS OVER THE ROWS GIVES EACH ITS RUNG, ITS REMIT,
# ITS CONFERRAL AND ITS REVOCATION. The per-case loop seats a person from `references/
# npc_registry.yaml` (title, sub-organization, or a case overlay); a row is MATCHED to that seat by
# its `holder` case id (and by `post` where one case holds two rows), and the file's `rung`,
# `remit_acts`, `conferral` and `revocation` are overlaid on the seat the loop built. A row no
# loop-built seat matches is MINTED from the row alone, under its authored `id`.
#   * `rung` is an ANCHOR, resolved by `populated.resolve_anchor` -- ONE resolver over the four forms
#     `{realm: true}` · `{duchy: "<faction>"}` · `{territory: "<code>"}` · `{settlement: "<code>"}`,
#     against the index `build_realm` fills as it mints each rung. The resolved rung is the seat's
#     `Office.rung` (purview, `04:330`'s `via.scope`) AND its `Office.scope_rung` (a bench's ground,
#     `H-32`). No row authors a `settlement` anchor today; the resolver does not care which form a
#     row uses, only that it names exactly one live rung of the kind it says.
#   * `remit_acts` REPLACES what the loop would have granted (a declared `[]` is NOT filled from
#     `rosters.yaml: remit_default`), EXCEPT for the acts named in `meta: remit_unruled`, which a
#     LOOP-BUILT seat keeps if it held it before the overlay. `dispatch` is that act.
#     ⚠ SO `dispatch` IS GRANTED, NOT LEFT ALONE, AND NOT ONLY WHERE A ROW IS `[]`. The loop seats
#     with `remit_default` (every remit act, `dispatch` included) unless the case's own overlay
#     declares a remit, so a loop-built seat's `held` names `dispatch` and the overlay keeps it.
#     MEASURED, `build_realm(0)`, 2026-10-02: `dispatch` is held by 22 of the 29 authored seats --
#     22 of the 23 LOOP-BUILT and 0 of the 6 MINTED. Of the 22, seven are the rows whose
#     `remit_acts` is `[]` (`off_heir`, `off_princess`, `off_guard_captain`, `off_archbishops_rep`,
#     `off_legal_advisor_hm`, `off_commune_rep_hm`, `off_guild_comptroller`), where `dispatch` is
#     the seat's WHOLE remit; the other fifteen carry it alongside the acts their row names. The
#     one loop-built seat without it is `off_parliamentary_clerk`: NPC-008's overlay declares
#     `remit: [issue]`, so its `held` is that rather than the default. The seat no row authors,
#     `off_npc_084`, holds it too (23 of 30 offices). `march` (eligibility `remit:dispatch`) is
#     eligible to every one of those holders. A MINTED row holds only what it names, because a
#     minted seat has no `held`: identical rows diverge by BUILD ROUTE. J-8 (whether `dispatch` is
#     a remit act at all) is Jordan's, and stripping it -- delete the `remit_unruled` line, which
#     strips it from all 22 in one edit, or name it in the rows that should carry it -- is a GRANT
#     decision, not a code fix; the strip would leave the seven `[]`-row seats with no remit,
#     which `test_season_shape.py`'s remit-default test (`assert not ungranted`) would then report.
#   * MEASURED, `build_realm(0)`, 2026-10-01: the per-case loop seats 24, not r2 `03`'s 19. Four
#     `[NEW]`-marked holders (NPC-007, NPC-013, NPC-021, NPC-070) are already seated by it under a
#     registry-derived post, so those four are OVERLAID, not minted; six rows are MINTED
#     (`off_duke_valorsmark` -- the King's second seat -- `off_lord_steward`, `off_cardinal_fortitude`,
#     `off_cardinal_temperance`, `off_senior_inquisitor`, `off_restoration_leader`). And ONE seat
#     the loop builds has no row at all: NPC-084's (`off_npc_084`, "guild leader"). It stays
#     rungless, a declared exception -- authoring it a row, or dropping the seat, is a content
#     decision, not a resolver's.
#   * `obligees` become `oblige` Tenures on the seat, with no term (`04 §B.8`'s `term?`, lawful
#     null): a seat seeded at world-gen has no opening act to declare one.
#   * A loop-built seat keeps its `off_<holder>` id and its derived post/body/faction (a post
#     normalisation is a separate unit -- `rosters.yaml: remit_default`'s own note); only a MINTED
#     seat carries this file's `id`, `post`, `body` and `faction`.

meta:
  source: "engine/season/offices.yaml -- the governance ladder's titles, and 29 authored seats."
  derivation: "proposals/2026-09-16-term-ownership/offices_draft.yaml, per r2 03_SEATS_AND_CONTENT.md §A.13-§A.15, with conferral/revocation recomputed against ED-IN-0256 (see the header above)"
  rule: "one seat = one row. `rung` is an ANCHOR (never an id), resolved at load against the world being built -- `CLAUDE.md` §5's hand-transcription hazard, one layer earlier."
  # J-8, Jordan's open ruling: is `dispatch` a remit act at all? r2 `03`'s remit column assumed it
  # deleted; the tree carries it and `ED-IN-0256` is silent. UNRULED, so the overlay of `remit_acts`
  # below leaves it exactly where it is: a seat that held it before the overlay holds it after.
  remit_unruled: [dispatch]

# ⚠ MOVED FROM `rosters.yaml: titles`, VERBATIM CONTENT, NOT RE-DERIVED. Jordan, 2026-09-02,
# quoted in full at the roster's original site (kept there as residue -- see the header above):
# governing authority (this ladder), sovereign power (Parliament, deliberately not monopolised in
# the ruler -- RULED AND NOT BUILT, `H-90`) and holdings (what you actually own, disjoint from what
# you govern) are three different things and this roster models only the first. Delegation
# (*"all of Kings, Dukes, Counts and Lords can assign others of lesser rank to govern any of their
# holdings in their stead"*) is registered as open, not built.
titles:
  source: "JORDAN, 2026-09-02, VERBATIM. `H-90`. Folded from `rosters.yaml: titles` per r2 05 RULED (c) -- see this file's header."
  note: >-
    TOTAL OVER `rung_kinds` -- Jordan, 2026-09-02: *"realm = king/queen, duchy = duke/duchess,
    province = count/countess, territory = lord, settlement = mayor, community = community leader,
    hearth = family head, person = own autonomous individual."* Every rung has a governing title,
    down to a person governing themselves -- which is why Part E's `own` eligibility is not a
    special kind of permission: it is this ladder at scale `person`. A LORD IS THE ONE ASYMMETRY:
    territories *"that have not been assembled into a province"*, so a Lord may govern SEVERAL
    territories where a Count governs ONE -- rank is the ordinal in `rung_kinds`, never a headcount.
    Membership lives once, in `domains:` -- no parallel `values:` list, so a name added to one and
    not the other cannot go silently unread by the other (the exact defect the single-list shape
    forecloses; `rosters.yaml`'s original note names the incident this fixed).
  domains:
    King:              "realm"
    Queen:              "realm"
    Duke:               "duchy"
    Duchess:            "duchy"
    Count:              "province"
    Countess:           "province"
    Lord:               "territory"
    Mayor:              "settlement"
    "Community Leader": "community"
    "Family Head":      "hearth"
    Individual:         "person"


# THE NINE — the acceptance requirements for the adopted season loop.
#
# RULED BY JORDAN 2026-09-05, at adoption (ED-IN-0204), verbatim in `statement:`.
#
# ⚠ THIS FILE IS MECHANISM, NOT REFERENCE (CLAUDE.md §0.05). `register.py --requirements`
# reads it and FAILS on a row that claims `met` with no `measured:` line behind it. That is
# the whole point: these are the things the loop must DO, and §0.2 says a thing is done when
# it EXECUTES. A row here may not be closed by writing a document.
#
# `status:` is one of  not_met | partial | met  — and every value is the measurement in
# `measured:`, reproduced by `measure:`, NOT a judgement. Where a requirement has no
# instrument yet, status is `not_met` and `measure:` names what would have to exist.

ruled_by: "Jordan, 2026-09-05"
ed: "ED-IN-0204"

# THE SCALES OF PLAY — ruled by Jordan 2026-09-05, verbatim:
#   "we need to enable all scales of play that the game calls for, which includes character
#    creation/development/chronicling, grand strategy politics, social contests/debates, mass
#    battles/strategy warfare, personal combat/grid-based map combat with units,
#    investigations/detective/interactive fiction"
#
# ⚠ THIS IS R-05's SECOND CLAUSE, ANSWERED. R-05 says building out the verbs "requires planning out
# all the different scales of play required in a season" — this roster IS that plan, and it is
# Jordan's, not a session's inference. R-04 is measured against it.
#
# ⚠ AND IT COLLIDES WITH THE RETIREMENT AS STEP A RECORDED IT. Three of the six map ENTIRELY to
# subsystems in the retire set. "Superseded by engine/season/" means the loop must EXPRESS the
# scale, never that the scale goes away — so R-04 is not the narrow "faction + world" item the
# execution plan framed; it is six scales, and Step B cannot proceed on any subsystem whose scale
# the loop has not subsumed.
# ⚠ AND THE REPOSITORY ALREADY SPECIFIES THIS, WHICH IS THE POINT JORDAN MADE: *"the repository
# outlines all of this pretty explicitly at the different scales. the proposal since it's becoming
# adopted now and real needs to accommodate it all."* The canonical surface is
# `systems/_architecture/reference/scale_transitions_v30.md` (Status: CANONICAL), and the adopted loop
# currently honours NEITHER of its two tables:
#
#   §1 THREE MODES — TTRPG (scene-by-scene, rounds) · Hybrid (BG strategic + TTRPG scenes via
#   Zoom In/Out, seasons + scenes) · BG (faction Domain Actions, seasonal Accounting). The loop
#   implements one tick granularity and no zoom, so R-03's scene tick is the Hybrid mode's
#   precondition, not a local nicety.
#
#   §2 FIVE SCALES — Object · Personal · Relational · Territorial · Structural. ⚠ ITS "Base Ob"
#   COLUMN IS **THREAD-ONLY** AND IS NOT A GENERAL OBSTACLE SOURCE (Jordan, 2026-09-05: "base ob
#   by scale only makes sense for thread operations so ignore it"). I read that column as R-09's
#   Ob source and sent it to a live producer as canon before Jordan caught it. The scoping was
#   visible in the table I was quoting — its sibling columns are "Min Thread Sensitivity" and
#   "Coherence auto-cost", and every example in it is a Thread act. Recorded because the error is
#   instructive: pattern-matching on the term "Base Ob" instead of reading what the table governs.
#   **The live obstacle ruling is Jordan's 2026-08-14 "score/2 plus modifiers"**
#   (`dice_engine.py:241-247`, which records it as implemented nowhere). What DOES survive from §2
#   for R-04 is the SCALE SET itself: the loop's `person`/`realm`/`settlement` vocabulary is not
#   canon's five, and no mapping between them exists — that gap is R-04's real content.
#
#   §3 EIGHT HANDOFF RULES — Personal→Thread, Personal→Faction, Personal→Scene (Contest),
#   Scene→Faction (Domain Echo), Thread→Faction, and three more. These are the "zooms out and in
#   well across scales of play" and "transitions and sequences cleanly" tests of NERS **S**
#   (CLAUDE.md §0.06). The loop implements none of them.
#
# ⚠ `systems/_architecture/` IS IN THE RETIRE SET AND HOLDS ZERO `.py`. Under Step A's split rule
# it is kept because "the document IS the spec" — and this is the worked case for why that rule
# matters: the spec the adopted system must satisfy lives in a tree the ruling marked superseded.
# Superseded means the LOOP must express it. It never meant the requirement goes away.

scales:
  - scale:    "character creation / development / chronicling"
    subsystem: ["systems/characters (sim/conviction.py only)", "systems/npcs (no tracked file)"]
    retention: retire-set
    in_loop:   false
    note: >-
      `Person` carries `pursuits`, `ledger`, `stance`, `capability` — but NOTHING
      creates or develops a person: no generation, no progression, no chronicle. ⚠ `capability` is
      EMPTY on every person in the corpus (only `probes.py::_zero_capability` touches it, to zero
      it), which is why R-09's roll will vary by seed and not yet by person. W27 is the cast.
  - scale:    "grand strategy politics"
    subsystem: ["systems/factions (deleted)", "systems/settlements (geography YAML, svg, package marker)", "systems/world (adjacency_map.jsx only)"]
    retention: retire-set
    in_loop:   false
    note: >-
      R-04's opening headline, the pre-`20-ii` reading: 44 of 143 cases UNREPRESENTABLE at faction
      scale and 10 at world scale. `20-ii` closed that census on 2026-09-30 (R-04's `measured:`
      carries the run). ⚠ REWRITTEN 2026-10-01: this note used to say "`engine/mc_v18.py` runs this
      scale today and the season loop does not; the two are not joined." That cannot be said any
      more. THIS SCALE HAS NO CODE OF ITS OWN: the driver (`engine/mc_v18.py`, plan position
      `28-iii`), `systems/factions/` and `game_state.Faction`, the stat-vector dataclass (both
      `29b`), are deleted (their `FORK:5c5d8ec6` rows). A faction is a resolved VIEW
      (`engine/season/queries/faction_q.py::Faction`: built at a barrier, never a field of `World`,
      never `Act.actor`), and a faction's act is a person's act `via` a seat (`Act.via`,
      `engine/season/state/carriers.py`). Intent, for vocabulary only: Layer 1 PART D rows 1/8/14,
      which rule out a faction that acts, a stored aggregate and a banner holding territory.
  - scale:    "social contests / debates"
    subsystem: ["systems/social_contest (the kernel, under sim/contest/)"]
    retention: RETAINED
    in_loop:   "seam unbuilt"
    note: >-
      The kernel exists and already rolls through the substrate (`resolver.py` imports
      `degree_from_net` from `engine/autoload/dice_engine.py` and wraps `roll_net` from
      `engine/autoload/sigma_leverage.py`). The loop does NOT reach it. ⚠ REWRITTEN 2026-10-01: this
      sentence used to add "`parliamentary_vote.py` calls `roll_pool`"; that module and
      `parliamentary_stay.py` were deleted at `29b` (their `FORK:5c5d8ec6` rows), and nothing under
      `systems/social_contest` calls `roll_pool` now.
      3 of 44 verb rows declare `contests:` — `fight` (the body, the combat seam), `march` (a
      field, the mass-battle seam, `ecacb57`) and `tell` (a standing, resolved on the season side
      by `seam/wrappers/sigma.py`, not by this kernel). The kernel retires at plan position `2-ii`
      (`workplans/valoria_master_workplan_v8.md`).
  - scale:    "mass battles / strategy warfare"
    subsystem: ["systems/mass_battle"]
    retention: RETAINED
    in_loop:   "seam built; reached via a constructed `Question` (`test_march.py`) AND, measured,
      via natural computed play in `build_realm(0)`/`populated.run` (`harness/aperture.py`); not
      yet reached naturally in `corpus_run`'s separate 143-case NPC/ARC corpus"
    note: >-
      The seam exists (`ecacb57`, PR #436): `march` declares `contests: a field` and resolves
      through `seam/wrappers/mass_battle.py` → the `mass_battle.resolve_field` composition role.

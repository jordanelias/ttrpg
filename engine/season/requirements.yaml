  - id: R-06
    statement: >-
      characters must be robustly built with goals, ambitions, convictions, moral values, etc
    status: partial
    measured: >-
      `Person` carries `convictions` against a `conviction_axes` roster with an alignment
      matrix, and a zero matrix is refused at load (PLAN §W5's dead-carrier guardrail). AMBITION
      is not fieldless: a person's motive is expressed as a `commit` Tenure to an OUGHT
      Proposition (`engine/season/harness/headless.py::build_world`, `S.Tenure(..., "commit", ...)` to
      `prop_einhir`), and the Q4 source (`"Q4 -- \`need\`"`,
      `engine/season/queries/world_q.py::questions_for`, moved there at step 5) reads
      exactly that live `commit`-to-OUGHT tenure as a standing question every season — that IS
      the ambition mechanism, and it is why Carin acts in a quiet season. What's missing is a
      READ over it (no `ambitions(p)` query anywhere in the package) and a real cast per case
      (`W27`, `architecture/PLAN.md:1583`) rather than one shared OUGHT for all 143 corpus worlds.
      Convictions separately barely discriminate: only 2–7 of 22 candidates carry a nonzero
      score and the rest tie. ⚠ THE SECOND HALF OF THAT SENTENCE READ *"and are ordered
      alphabetically"* AND IS FALSE SINCE `U4` (2026-09-10): tied candidates are ordered by a
      per-person seeded draw (`decision/choose.py::_sample_order`), not by verb name.
      ⚠⚠ **AND THE DISCRIMINATION HALF IS LARGELY CLOSED BY `U3` (2026-09-11), MEASURED AGAINST A
      CONTROL.** Both arms at seed 0 over the same 86 buildable corpus worlds, control from a
      worktree at `a85bd45`: candidates carrying a nonzero conviction score move
      **7..11 of 28 -> 16..22 of 28**, mean **7.79 -> 21.84**. `U3` separates the thirteen
      CONVICTIONS from the four ethical AXES — `conviction_axes` had been holding one conviction
      (`Precedent`) beside three ad-hoc scalars so that §F2's `conviction[axis]` had something to
      look up — and projects between them through `conviction_axis_matrix_v30.md` §2's 13x4. A
      conviction now scores a verb on all four axes instead of through one sparse block.
      ⚠ **THE ROW STAYS `partial` FOR TWO REASONS, AND NEITHER IS THE ONE IT USED TO GIVE.**
      (1) `ambitions(p)` still does not exist and the cast is still one shared OUGHT across 143
      worlds — `U8`'s, unchanged. (2) A NEW ONE `U3` itself created: the thirteen convictions are
      CORRELATED, so people are now well-differentiated from their own alternatives and poorly
      differentiated from each other. Measured off `CONVICTION_PROJECTION`: the mean conviction
      vector is (traditional +0.285, sacred +0.215, hierarchical +0.200, instrumental -0.062) and
      NINE OF THIRTEEN convictions lie within 60° of it; distinct executed sets over 89 live
      worlds fall **40 -> 27**. Seeding 1-3 convictions per #353 §14 instead of one raised
      distinct axis directions 13 -> 80 of 86 and did not recover the executed sets. Whether the
      matrix should be re-centred is `ED-IN-0213`, and it is Jordan's: re-calibrating overwrites
      52 cells that document argues individually.
    measure: "python -m engine.season.harness.corpus_run  # 'RANKING DISCRIMINATION' line"
    blocks: [W27, H-62]

  - id: R-07
    statement: >-
      characters must have memories and feelings and attitudes and relationships, and they must
      only have imperfect knowledge
    status: partial
    measured: >-
      IMPERFECT KNOWLEDGE IS STRUCTURAL AND HOLDS — `choose` receives no World (enforced by
      test), a `View` is capped at k and raises on any world collection, and `LedgerReader`
      answers from the person's own ledger. `beliefs` and `ledger` carry memory. FEELINGS,
      ATTITUDES and RELATIONSHIPS have no field; `stance` is the nearest and nothing writes it
      — W-F, the item that would, is not started.
      ⚠ AND UNTIL 2026-09-07 THAT SENTENCE WAS TRUE OF THE PLUMBING AND FALSE OF THE WORLD, which
      is worth stating because the row read as stronger than it was. Every clause above is about
      the ACCESS PATH — who may read what, through which object. The CONTENT was identical for
      everyone: `fan_out_mode` shipped at `total`, so every person's ledger held every Event, and
      knowledge was private in its plumbing and universal in its facts. Under `R7` the default is
      `all_five` and the content differs: measured at `build_world(0)` over two seasons, the three
      persons' witness-deposit sets are IDENTICAL under `total` (0 differing pairs) and differ
      under the shipped arm (3 differing pairs, one of them between two people who both received
      deposits — a fact one holds and the other does not). Falsifier:
      `test_r7_two_persons_hold_different_things_and_at_total_they_cannot`, whose control is the
      `total` arm inside the same test.
    measure: "python -m pytest engine/season/tests -k 'choose_receives_no_world or a_view or r7_two_persons'"
    blocks: [W-F, W27]

  - id: R-08
    statement: >-
      decisions must not be omniscient and perfectly rational — characters may not make the
      optimal decision based upon their epistemic knowledge and personal inclinations
    status: partial
    measured: >-
      NON-OMNISCIENCE HOLDS, structurally (see R-07). NON-RATIONALITY DOES NOT EXIST: the chooser
      takes the top-ranked candidate deterministically — `engine/season/decision.py::make_chooser` sorts on
      `(-score, verb, subject)`, so a tie breaks ALPHABETICALLY BY VERB — and only 2–7 of 22
      candidates carry a nonzero conviction score, so most choices are settled by verb name rather
      than by anything about the person. There is no mechanism by which a person declines the
      optimum, and no mechanism by which inclination breaks a tie.
      ⚠ **THE LAST SENTENCE IS FALSE AS OF `U4` (2026-09-10), AND THE ROW STAYS `partial` ANYWAY —
      because the two halves it names came apart.** *A person declines the optimum*: **BUILT.** The
      order is sampled, `softmax(score / choice_temperature)` via Gumbel, in
      `engine/season/decision/choose.py::_sample_order`, so the top-ranked candidate is likely and
      no longer certain. Falsifier:
      `test_u4_the_choice_is_sampling_and_the_argmax_is_its_zero_temperature_control` — twenty
      seeds over ONE person and view yield >=2 distinct top acts, while the identical arm at
      `choice_temperature = 0` collapses to exactly one, so the spread is the sampler's and not the
      fixture's. *Inclination breaks a tie*: **STILL NOT BUILT**, and it cannot be while the
      alignment table is sparse (`H-96`'s ranking half · `H-66` · `U3`). A tie is now broken by the
      DRAW, which is not the person — it is the absence of a reason, not a reason of theirs. That
      is the whole of why this row does not go `met`.
      ⚠ WHAT `U4` ACTUALLY REMOVED, measured with a control: the ALPHABET deciding a triage. One
      ruled verb (`release`, `04 §A.3` row 14) under a name sorting EARLY executed in 18 corpus
      cases and displaced 71 acts (`utter` x56); the SAME verb, predicate and effect under a name
      sorting LAST executed in 5 and displaced 2. After `U4` the pair reads 13 vs 14 and 22 vs 25 —
      the gap collapses into noise. ⚠ AND THE COST IS RECORDED WITH IT: between-world variety falls
      monotonically with temperature (distinct executed sets, 89 live cases: tau=0 -> 16 · 0.1 -> 10
      · 0.25 -> 8 · 0.5 -> 7 · 1.0 -> 7), which is the opposite of what `U4`'s plan predicted, so
      the shipped `0.1` is the LEAST arm that removes the defect rather than a tuned one.
      ⚠ THE CITATION ABOVE IS STALE and is kept as written with the correction attached:
      `decision.py` became the DIRECTORY `decision/` at Arc 1 (`ED-IN-0206`), so the sort lives at
      `decision/choose.py::make_chooser`.
    measure: "python -m engine.season.harness.corpus_run  # 'RANKING DISCRIMINATION' + tie ordering"
    blocks: [W26, H-62]
    needs_jordan: false
    disposition: >-
      ⚠ AN EARLIER DRAFT OF THIS ROW FLAGGED `needs_jordan: true` AND WAS WRONG TWICE — corrected
      here rather than carried. (1) It described the CANDIDATE tie as broken by "an undeclared
      content-hash tiebreak". It is not; it is alphabetical, and the row's own `measure:` command
      prints that. The content hash is the WITHIN-SOURCE QUESTION tiebreak (`q.id`,
      `engine/season/decision.py::make_chooser`), a different mechanism. (2) That question tiebreak is ALREADY DISPOSED:
      `engine/season/decision.py::make_chooser` records it closing at §0 step 4 on `H-54`'s precedent with
      `needs_jordan` FALSE. Re-surfacing it as open is the ED-IN-0185 failure CLAUDE.md §0's five
      tests exist to prevent, and PR #368's body made the same error first. What remains open here
      is not a ruling but BUILD WORK: W26 and `H-62`.

  - id: R-09
    statement: "chains of events within a scene are probabilistic, not deterministic"
    status: partial
    measured: >-
      **A ROLL EXISTS AND IT REACHES THE GAME. `U1` / ED-SC-0037, 2026-09-11.**
      `engine/season/seam/wrappers/sigma.py` is the σ-leverage provider Jordan named --
      *"we have the sigma leverage d10 resolver in engine to use"* -- registered against
      `(contest, sigma_leverage)` and reached through `manifest.resolve`, never a literal in the
      seam. It composes the tree's own line, `systems/social_contest/sim/contest/resolver.py:302`:
      `net = roll_net(pool, rng=rng) + net_boost(lev, pool)`. BOTH names matter: `roll_net` alone
      is `roll_pool` minus the obstacle, i.e. the bare pool roll ED-SC-0037 costed wearing the
      ruled module's name; `net_boost` is the μ-shift ED-884/ED-934 ruled.
      **EXECUTED, NOT DECLARED.** `tell` declares `contests: "a standing"`, which routes here, so a
      telling is now GRADED: measured over the 27 NPC rung cases at seed 0, 3 seasons, **20
      `news.told` against 75 `news.untold`** -- a 21% success rate, and 26 of 27 cases produce a
      telling. The outcome moves with the seed: `build_world(0)` reads Failure 53 / Partial 16 /
      Success 2 and seed 7 reads 59 / 11 / 5.
      **WHY `partial` AND NOT `met`, STATED RATHER THAN LEFT TO BE FOUND.** R-09 asks that chains
      be probabilistic; what is probabilistic today is the ROLL, not the CHAIN, and it varies by
      SEED and FIXTURE rather than by PERSON. `Person.capability` is empty on every corpus person
      -- one writer, and it zeroes it -- so `_pool_of` returns `pool_default` for everybody and
      `_obstacle_of` returns `obstacle_default` for every non-person subject. `lev` is 0.0 with no
      producer, stated as zero because a fabricated leverage would be a number nobody chose. It
      varies by person the day capability is written, which is character development and out of
      this arc (`W27`'s cast, 0 of 143 cases).
      ⚠ **AND THE ROW IT REPLACES WAS TRUE WHEN WRITTEN.** It read *"THERE IS NO ROLL ANYWHERE IN
      THE LOOP"*, resting on a scan that asserted NO module produces a margin. That scan is now a
      SET EQUALITY on exactly one owner rather than an emptiness claim -- `S27.2` names a second
      resolver as this architecture's highest-value refusal, so *exactly one* is the stronger
      guard and it is red the day a second appears.
      ⚠ **WHAT THE ROLL COST, REPORTED RATHER THAN NETTED OFF.** Grading a verb that deposits
      beliefs narrows the deposit stream: §F1 clause 4's suppression channel lost one verb and 11
      candidates on ARC-01 (`surveil`, 80 drops -> 69), and the corpus universal executed set came
      back from `{}` to `{reconstruct}`, which is between-world variety `U2` had bought. Distinct
      executed sets rose 38 -> 40 and R3 cross-person propagation was UNMOVED at 84 of 143 -- so
      `U1` changed what people do, not whether what one does reaches another.
    measure: "python -m pytest engine/season/tests -k 'we_only_a_verb or u1_' ; python -m engine.season.harness.headless --seasons 2 --seed 0"
    blocks: [W23, H-98]

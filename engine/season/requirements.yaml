  - id: R-03
    statement: >-
      seasons must tick scene-by-scene, so what occurs after one scene can impact the next
      scene
    status: met
    measured: >-
      The scene container EXISTS and is not what's missing: `Scene` is a dataclass
      (`engine/season/state/carriers.py::Scene`, moved there at step 4 of the decomposition; this
      citation read `shape.py:2289` and named a file that no longer holds the class) and
      `deliberate` packs each person's choices into scenes and
      stamps every act with its scene id (`a.scene = sc.id`, `engine/season/loop/driver.py::SeasonDriver.deliberate`); `W17` LANDED
      2026-09-02 (`architecture/PLAN.md:1216`, `:1315`). What is missing is a scene-granular TICK.
      `SeasonDriver.season` (`engine/season/loop/driver.py`) calls `self.deliberate(...)` once, then
      `self.resolve(acts, ...)` once, then `self.witness(...)` once, then increments `w.tick`
      once — every scene for every person in the season is flattened into one
      `acts` list before RESOLVE ever runs, so nothing that happens in one scene can reach a
      later scene within the same season; the boundary that exists is season-to-season, not
      scene-to-scene.
      ⚠ CONSTRAINT ON HOW THIS IS BUILT — Jordan, 2026-09-05: *"only players really need the scene
      in its entirety"*, and the loop *"enables events to occur without a scene being called for not
      players"*. THE SCENE IS PLAYER GRANULARITY. The tick must give a PLAYER scene-by-scene
      resolution WITHOUT routing every NPC through a constructed scene — an NPC needs a resolution
      and an event, not a played-out scene. Built as "every person gets a scene per round", the cost
      of a season scales with the CAST rather than with the PLAYERS. The actorless channel
      (`SeasonDriver.matter`) already exists for the no-scene case, and both channels converge at
      `witness` into one log (S19.5).
      ⚠⚠ **MET 2026-09-11 BY `U2`, AND THE FLIP IS ON AN EXECUTION RATHER THAN A DOCUMENT
      (`CLAUDE.md` §0.2).** `SeasonDriver.season` is now
      `calendar -> matter -> for r in range(R): freeze -> deliberate -> resolve -> log -> witness`,
      with `R = scene_budget`. CALENDAR and MATTER stay once per season (AX-5's three motions are
      seasonal, `01_AXIOMS.md:151`; a docket forming five times a season is a fourth clock,
      `04 §C.1:504` + D-17/D-21), `w.tick` advances once (D-45), and the round index is a DRIVER
      LOCAL — `Claim.round` is the only carrier field the unit adds, and it is a different thing:
      WHEN a claim landed, which `questions_for(w, p, since=(tick, round))` reads.
      **THE ACCEPTANCE, EXECUTED:**
      `test_u2_a_deposit_in_one_round_changes_a_later_rounds_candidate_set_in_the_same_season`
      plants one claim in `p_bailiff`'s ledger at the end of round 0, about a rung they hold a
      live `contain` Tenure toward. UNPLANTED, `p_bailiff` raises no question in that world under
      any of §F1's four sources — Q1 no Date names them, Q3 no crossing reaches them, Q4 no
      `commit` to an OUGHT, and Q2 nothing has landed yet — so the control arm forms NO candidates
      in any round; the plant does not shift a deliberation, it CAUSES one, in a later round of
      the same season. ⚠ **"UNPLANTED" IS LOAD-BEARING AND AN EARLIER WRITING OF THIS PARAGRAPH
      DROPPED IT**, leaving a sentence that contradicts the acceptance it introduces: the plant
      works THROUGH Q2, which is one of the four. Q2 is not dark for `p_bailiff`; it is EMPTY
      until something lands, which is exactly why they are the right control. MEASURED
      2026-09-11, `build_world(0)`, 2 seasons, unplanted: `p_bailiff` raises 0 questions from any
      source while `p_carin` raises 45 (35 `claim_landed`, 10 `need`) — a real silence in a world
      that is producing questions, not a world where none can be raised. That is the
      channel R-03 names, and before `U2` no mechanism could carry it.
      **WHAT IT BOUGHT, MEASURED AGAINST A CONTROL** (both arms seed 0 over the same 143 corpus
      cases, the control run from a worktree at the commit before it): **R3 cross-person
      propagation 50 -> 84 of 143**, distinct executed sets **14 -> 38**, the universal executed
      set collapses from `{create_record}` to EMPTY (nothing is guaranteed a scene in every world
      any more), and the two rarest verbs more than double their reach (`research` 15 -> 35 worlds,
      `interview` 14 -> 25). R3 is R-01/R-02's own channel and this is the largest single move it
      has made.
      **THE CONTROL IS REAL AND IS THE `scene_budget = 1` ARM**, where the season is ONE round: the
      rounds loop, the queue, the fingerprint and the release all run and reproduce the pre-tick
      `(actor, verb, subject)` act multiset and Event-kind multiset EXACTLY. The content hash moves,
      by `Claim` gaining a field and for no other reason, which is why the test asserts the
      multisets and not the hash.
      ⚠ **AND TWO THINGS THE UNIT COST, REPORTED RATHER THAN NETTED OFF.** (1) In the `headless`
      world the verb mix NARROWS, 10 verbs to 6 over two seasons: a person re-ranks each round and
      takes the top of a fresh ranking, so they reach less deep into it than one `pack_scenes` call
      over the whole season did. That is local to a three-person world — corpus-wide the same 11
      verbs execute and the rare ones reach MORE worlds. (2) People now spend scene-actions their
      own packing used to strand: a person whose queue empties with budget left is asked again,
      where the one-pass loop simply lost the remainder. Roughly 6% more deposits in the headless
      world. Neither is what R-03 asked for and both are consequences of it.
    measure: "python -m engine.season.harness.headless --case NPC-088 --seasons 2 --seed 0  # and `pytest engine/season/tests -q -k test_u2_`, which is what §0.2 accepts"
    blocks: [W17]


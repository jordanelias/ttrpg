# THE NINE — the acceptance requirements for the adopted season loop.
#
# RULED BY JORDAN 2026-09-05, at adoption (ED-IN-0202), verbatim in `statement:`.
#
# ⚠ THIS FILE IS MECHANISM, NOT REFERENCE (CLAUDE.md §0.05). `register.py --requirements`
# reads it and FAILS on a row that claims `met` with no `measured:` line behind it. That is
# the whole point: these are the things the loop must DO, and §0.2 says a thing is done when
# it EXECUTES. A row here may not be closed by writing a document.
#
# `status:` is one of  not_met | partial | met  — and every value is the measurement in
# `measured:`, reproduced by `measure:`, NOT a judgement. Where a requirement has no
# instrument yet, status is `not_met` and `measure:` names what would have to exist.

ruled_by: "Jordan, 2026-09-05"
ed: "ED-IN-0202"

# THE SCALES OF PLAY — ruled by Jordan 2026-09-05, verbatim:
#   "we need to enable all scales of play that the game calls for, which includes character
#    creation/development/chronicling, grand strategy politics, social contests/debates, mass
#    battles/strategy warfare, personal combat/grid-based map combat with units,
#    investigations/detective/interactive fiction"
#
# ⚠ THIS IS R-05's SECOND CLAUSE, ANSWERED. R-05 says building out the verbs "requires planning out
# all the different scales of play required in a season" — this roster IS that plan, and it is
# Jordan's, not a session's inference. R-04 is measured against it.
#
# ⚠ AND IT COLLIDES WITH THE RETIREMENT AS STEP A RECORDED IT. Three of the six map ENTIRELY to
# subsystems in the retire set. "Superseded by engine/season/" means the loop must EXPRESS the
# scale, never that the scale goes away — so R-04 is not the narrow "faction + world" item the
# execution plan framed; it is six scales, and Step B cannot proceed on any subsystem whose scale
# the loop has not subsumed.
# ⚠ AND THE REPOSITORY ALREADY SPECIFIES THIS, WHICH IS THE POINT JORDAN MADE: *"the repository
# outlines all of this pretty explicitly at the different scales. the proposal since it's becoming
# adopted now and real needs to accommodate it all."* The canonical surface is
# `systems/_architecture/scale_transitions_v30.md` (Status: CANONICAL), and the adopted loop
# currently honours NEITHER of its two tables:
#
#   §1 THREE MODES — TTRPG (scene-by-scene, rounds) · Hybrid (BG strategic + TTRPG scenes via
#   Zoom In/Out, seasons + scenes) · BG (faction Domain Actions, seasonal Accounting). The loop
#   implements one tick granularity and no zoom, so R-03's scene tick is the Hybrid mode's
#   precondition, not a local nicety.
#
#   §2 FIVE SCALES — Object · Personal · Relational · Territorial · Structural. ⚠ ITS "Base Ob"
#   COLUMN IS **THREAD-ONLY** AND IS NOT A GENERAL OBSTACLE SOURCE (Jordan, 2026-09-05: "base ob
#   by scale only makes sense for thread operations so ignore it"). I read that column as R-09's
#   Ob source and sent it to a live producer as canon before Jordan caught it. The scoping was
#   visible in the table I was quoting — its sibling columns are "Min Thread Sensitivity" and
#   "Coherence auto-cost", and every example in it is a Thread act. Recorded because the error is
#   instructive: pattern-matching on the term "Base Ob" instead of reading what the table governs.
#   **The live obstacle ruling is Jordan's 2026-08-14 "score/2 plus modifiers"**
#   (`dice_engine.py:241-247`, which records it as implemented nowhere). What DOES survive from §2
#   for R-04 is the SCALE SET itself: the loop's `person`/`realm`/`settlement` vocabulary is not
#   canon's five, and no mapping between them exists — that gap is R-04's real content.
#
#   §3 EIGHT HANDOFF RULES — Personal→Thread, Personal→Faction, Personal→Scene (Contest),
#   Scene→Faction (Domain Echo), Thread→Faction, and three more. These are the "zooms out and in
#   well across scales of play" and "transitions and sequences cleanly" tests of NERS **S**
#   (CLAUDE.md §0.06). The loop implements none of them.
#
# ⚠ `systems/_architecture/` IS IN THE RETIRE SET AND HOLDS ZERO `.py`. Under Step A's split rule
# it is kept because "the document IS the spec" — and this is the worked case for why that rule
# matters: the spec the adopted system must satisfy lives in a tree the ruling marked superseded.
# Superseded means the LOOP must express it. It never meant the requirement goes away.

scales:
  - scale:    "character creation / development / chronicling"
    subsystem: ["systems/characters (5 py, 13 md)", "systems/npcs (0 py, 19 md)"]
    retention: retire-set
    in_loop:   false
    note: >-
      `Person` carries `convictions`, `beliefs`, `ledger`, `stance`, `capability` — but NOTHING
      creates or develops a person: no generation, no progression, no chronicle. ⚠ `capability` is
      EMPTY on every person in the corpus (only `probes.py::_zero_capability` touches it, to zero
      it), which is why R-09's roll will vary by seed and not yet by person. W27 is the cast.
  - scale:    "grand strategy politics"
    subsystem: ["systems/factions (18 py)", "systems/settlements (8 py)", "systems/world (6 py)"]
    retention: retire-set
    in_loop:   false
    note: >-
      This is R-04's headline: 44 of 143 cases are UNREPRESENTABLE at faction scale and 10 at world
      scale. `engine/mc_v18.py` runs this scale today and the season loop does not; the two are not
      joined. Layer 1 PART D rows 1/8/14 forbid porting `game_state.Faction` as-is.
  - scale:    "social contests / debates"
    subsystem: ["systems/social_contest (21 py)"]
    retention: RETAINED
    in_loop:   "seam unbuilt"
    note: >-
      The kernel exists and already rolls through the substrate (`resolver.py` calls
      `degree_from_net`; `parliamentary_vote.py` calls `roll_pool`). The loop does NOT reach it —
      1 of 32 verbs declares `contests:` and it is `kill / wound`. Wave 2 item 2.3 is this seam.
  - scale:    "mass battles / strategy warfare"
    subsystem: ["systems/mass_battle (33 py)"]
    retention: RETAINED
    in_loop:   "seam unbuilt"
    note: "Wave 4 item 4.2 carries the seam, alongside the season-loop campaign artifact."
  - scale:    "personal combat / grid-based map combat with units"
    subsystem: ["systems/combat/combat_engine_v1 (29 py)"]
    retention: "RETAINED, NOT DONE (Jordan, 2026-09-05: \"combat engine isn't done\")"
    in_loop:   "duel only, via combat_seam.py"
    note: >-
      ⚠ THE TWO HALVES OF THIS SCALE ARE NOT THE SAME THING AND ONLY ONE EXISTS. The duel engine is
      real and the loop already calls it (`combat_seam.py` -> `wrapper.fight`), but it is a
      CONTINUOUS RANGE model (`combat_systems.py::RANGE_COMMIT_PEAK`, `RANGE_AVAIL_FLOOR`) between
      two combatants. **GRID-BASED MAP COMBAT WITH UNITS DOES NOT EXIST ANYWHERE IN THE TREE** — no
      grid, hex or tile module in `systems/` or `engine/`; the only map artifacts are
      `settlements/valoria_map_v30.svg` (a picture) and `world/adjacency_map.jsx` (adjacency, not a
      tactical grid). This is unbuilt design, not an unwired seam, and it has no work item in the
      execution plan.
  - scale:    "settlement management / city building / domain actions"
    subsystem: ["systems/settlements (8 py, 12+ md)", "systems/overview (8 py)"]
    retention: retire-set
    in_loop:   false
    note: >-
      ADDED 2026-09-05 on Jordan's correction — the first draft of this roster missed it. The design
      surface is substantial and explicit: `settlement_layer_v30.md`, `settlement_generator_v1.md`,
      `settlements_currency_v1.md`, `march_layer_v30.md`, `governance_play_redesign_v1.md`,
      `scale_hierarchy_v1.md`. `references/module_contracts.yaml` declares `domain_actions` and
      `settlement_economy` — BOTH with `doc: null`, two of the nine contracts §6 counts as
      unimplementable. The loop has `Site`, `stores` and `condition` but no economy, no build and
      no domain action.

  - scale:    "investigations / detective / interactive fiction"
    subsystem: ["systems/fieldwork (5 py, 19 md)"]
    retention: retire-set
    in_loop:   false
    note: >-
      Six investigation acts exist in `verb_table.yaml` and NONE declares `contests:` — so
      investigation is not ungraded, it is UNGRADEABLE. Two composition roles
      (`scene_resolver.fieldwork`, `scene_resolver.investigation`) target this subsystem, which is
      why it is in the R04-pending ceiling.

rows:

  - id: R-01
    statement: "decisions must propagate"
    status: not_met
    measured: >-
      R3 (cross-person propagation) passes 30/30 NPC and 54/59 ARC on the cases that are
      representable, and the planted-edge control fires — so the DETECTOR works. But the
      forking exercise measured 2,403 forks with 100% reconvergence, and after W-A/W-B the
      later-decision divergence is only ~4%. Propagation is structurally present and
      behaviourally near-absent.
    measure: "python engine/season/corpus_run.py  # check R3 rows + the planted control"
    blocks: [W-F, H-111, H-116]

  - id: R-02
    statement: "decisions affect subsequent decisions"
    status: not_met
    measured: >-
      The loop was CLOSED by a theorem, not a bug — `Query.opening_set` never consults world
      state, so the only channel a decision has into a later decision is a ledger claim, and
      `belief_contradicts` could read no claim the corpus deposits. W-A/W-B opened it; the
      measured effect is ~4% later-decision divergence against 100% world divergence.
    measure: "python proposals/2026-09-04-degree-sweep/wd_acceptance.py  # fork-and-follow, both arms"
    blocks: [W-F, H-111]

  - id: R-03
    statement: >-
      seasons must tick scene-by-scene, so what occurs after one scene can impact the next
      scene
    status: not_met
    measured: >-
      The scene container EXISTS and is not what's missing: `Scene` is a dataclass
      (`engine/season/shape.py:2289`) and `deliberate` packs each person's choices into scenes and
      stamps every act with its scene id (`a.scene = sc.id`, `shape.py:5727`); `W17` LANDED
      2026-09-02 (`architecture/PLAN.md:1216`, `:1315`). What is missing is a scene-granular TICK.
      `SeasonDriver.season` (`shape.py:6470`) calls `self.deliberate(...)` once
      (`shape.py:6477`), then `self.resolve(acts, ...)` once (`shape.py:6478`), then
      `self.witness(...)` once (`shape.py:6482`), then increments `w.tick` once
      (`shape.py:6484`) — every scene for every person in the season is flattened into one
      `acts` list before RESOLVE ever runs, so nothing that happens in one scene can reach a
      later scene within the same season; the boundary that exists is season-to-season, not
      scene-to-scene.
      ⚠ CONSTRAINT ON HOW THIS IS BUILT — Jordan, 2026-09-05: *"only players really need the scene
      in its entirety"*, and the loop *"enables events to occur without a scene being called for not
      players"*. THE SCENE IS PLAYER GRANULARITY. The tick must give a PLAYER scene-by-scene
      resolution WITHOUT routing every NPC through a constructed scene — an NPC needs a resolution
      and an event, not a played-out scene. Built as "every person gets a scene per round", the cost
      of a season scales with the CAST rather than with the PLAYERS. The actorless channel
      (`SeasonDriver.matter`) already exists for the no-scene case, and both channels converge at
      `witness` into one log (S19.5).
    measure: "python engine/season/headless.py --case NPC-088 --seasons 2 --seed 0"
    blocks: [W17]

  - id: R-04
    statement: "strategic and management actions must be possible, ie decisions at differing scales"
    status: not_met
    measured: >-
      54 of 143 cases are UNREPRESENTABLE — 44 at faction scale, 10 at world scale. The loop
      runs at person, settlement and realm only. The strategic layer has no expression in this
      model; `engine/mc_v18.py` runs the faction scale and the two are not joined.
    measure: "python engine/season/corpus_run.py  # 'unrepresentable scales:' line"
    blocks: [W10, W13]

  - id: R-05
    statement: >-
      all verbs must be built out, and doing so requires planning out all the different scales
      of play required in a season
    status: not_met
    measured: >-
      6 of 32 verbs execute in the corpus (create_record, move, speak, tell, transfer, utter).
      20 carry no predicate and no effect, 5 are foldable but never attempted, 1 (`work`) is
      attempted and always refused. 1 of 32 declares `contests:`.
    measure: "python engine/season/corpus_run.py  # 'WHERE THE 32 GO' line"
    blocks: [W10-core, H-65, H-94]

  - id: R-06
    statement: >-
      characters must be robustly built with goals, ambitions, convictions, moral values, etc
    status: partial
    measured: >-
      `Person` carries `convictions` against a `conviction_axes` roster with an alignment
      matrix, and a zero matrix is refused at load (PLAN §W5's dead-carrier guardrail). AMBITION
      is not fieldless: a person's motive is expressed as a `commit` Tenure to an OUGHT
      Proposition (`engine/season/headless.py:81`, `S.Tenure(..., "commit", ...)` to
      `prop_einhir`), and `shape.py`'s Q4 source (`"Q4 -- \`need\`"`, `shape.py:3929-3936`) reads
      exactly that live `commit`-to-OUGHT tenure as a standing question every season — that IS
      the ambition mechanism, and it is why Carin acts in a quiet season. What's missing is a
      READ over it (no `ambitions(p)` query anywhere in `shape.py`) and a real cast per case
      (`W27`, `architecture/PLAN.md:1583`) rather than one shared OUGHT for all 143 corpus worlds.
      Convictions separately barely discriminate: only 2–7 of 22 candidates carry a nonzero
      score; the rest tie and are ordered alphabetically.
    measure: "python engine/season/corpus_run.py  # 'RANKING DISCRIMINATION' line"
    blocks: [W27, H-62]

  - id: R-07
    statement: >-
      characters must have memories and feelings and attitudes and relationships, and they must
      only have imperfect knowledge
    status: partial
    measured: >-
      IMPERFECT KNOWLEDGE IS STRUCTURAL AND HOLDS — `choose` receives no World (enforced by
      test), a `View` is capped at k and raises on any world collection, and `LedgerReader`
      answers from the person's own ledger. `beliefs` and `ledger` carry memory. FEELINGS,
      ATTITUDES and RELATIONSHIPS have no field; `stance` is the nearest and nothing writes it
      — W-F, the item that would, is not started.
    measure: "python -m pytest engine/season/tests -k 'choose_receives_no_world or a_view'"
    blocks: [W-F, W27]

  - id: R-08
    statement: >-
      decisions must not be omniscient and perfectly rational — characters may not make the
      optimal decision based upon their epistemic knowledge and personal inclinations
    status: partial
    measured: >-
      NON-OMNISCIENCE HOLDS, structurally (see R-07). NON-RATIONALITY DOES NOT EXIST: the chooser
      takes the top-ranked candidate deterministically — `shape.py:3508` sorts on
      `(-score, verb, subject)`, so a tie breaks ALPHABETICALLY BY VERB — and only 2–7 of 22
      candidates carry a nonzero conviction score, so most choices are settled by verb name rather
      than by anything about the person. There is no mechanism by which a person declines the
      optimum, and no mechanism by which inclination breaks a tie.
    measure: "python engine/season/corpus_run.py  # 'RANKING DISCRIMINATION' + tie ordering"
    blocks: [W26, H-62]
    needs_jordan: false
    disposition: >-
      ⚠ AN EARLIER DRAFT OF THIS ROW FLAGGED `needs_jordan: true` AND WAS WRONG TWICE — corrected
      here rather than carried. (1) It described the CANDIDATE tie as broken by "an undeclared
      content-hash tiebreak". It is not; it is alphabetical, and the row's own `measure:` command
      prints that. The content hash is the WITHIN-SOURCE QUESTION tiebreak (`q.id`,
      `shape.py:3958`), a different mechanism. (2) That question tiebreak is ALREADY DISPOSED:
      `shape.py:3939-3956` records it closing at §0 step 4 on `H-54`'s precedent with
      `needs_jordan` FALSE. Re-surfacing it as open is the ED-IN-0185 failure CLAUDE.md §0's five
      tests exist to prevent, and PR #368's body made the same error first. What remains open here
      is not a ruling but BUILD WORK: W26 and `H-62`.

  - id: R-09
    statement: "chains of events within a scene are probabilistic, not deterministic"
    status: not_met
    measured: >-
      THERE IS NO ROLL ANYWHERE IN THE LOOP. A test scans every non-test module for `net =` /
      `roll_pool` / `successes` with comments stripped and asserts the set is EMPTY — the degree
      ladder is a reader with no producer. The only randomness in the package is the seeded
      `Random` `combat_seam.py` hands to `systems/combat/`. No act has ever resolved at a degree
      of success in a corpus run; the contest seam is wired and unreached.
    measure: "python -m pytest engine/season/tests -k ladder_is_the_trees_own"
    blocks: [W23, H-98]

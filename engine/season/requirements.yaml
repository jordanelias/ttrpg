      ⚠ CORRECTED, the Phase 3 terminal critique's reconciliation, 2026-09-30: this note used to
      say march "still sits in `test_season_shape.py`'s never-attempted set for the NATURAL
      corpus" and that "no `questions_for` source in the natural corpus ever supplies march a

      state, so the only channel a decision has into a later decision is a ledger claim, and
      `belief_contradicts` could read no claim the corpus deposits. W-A/W-B opened it; the
      measured effect is ~4% later-decision divergence against 100% world divergence.
      ⚠ RE-MEASURED IN PART, ED-FI-0009 — see R-01, which carries the numbers and the exact scope
      of what was and was not re-run. In short: the clause the channel runs through had one
      reachable producer and now has six, and the pinned slice went 0/16 -> 14/18. The
      corpus-scale rate is not re-run, so this row's `~4%` stands as the last corpus-scale
      figure and its status is unchanged.
      ⚠⚠ **U10, 2026-09-30: THE CORPUS-SCALE RATE WAS ATTEMPTED AND THE INSTRUMENT BROKE BEFORE
      PRODUCING ONE.** This row's `measure:` is `wd_acceptance.py`'s fork-and-follow, the same
      family R-01 re-ran in full over the grown 143-case corpus (`wd_chunk.py` re-sliced
      `0/36/72/108/143`, all 36 cells run). **See R-01 for the full account and the exact numbers**
      (`/simplify`, BATCH-CLOSE Phase 2 — not re-quoted here) — `wd_collect.py` fails its own
      `probed`-must-not-depend-on-`observation_deposit_mode` assertion at the first fixture point,
      so no reconvergence figure was produced at ANY fixture point and none is claimed here. The
      `~4%` figure this row already
      carries is therefore still the last corpus-scale number on file, now provably stale (it
      predates the corpus growing 89->143) but not replaceable this session. Status stays
      `not_met`, honestly, on the instrument that owed the number rather than on a guess.
      ⚠⚠ **PLAN POSITION `11` (U6, run (i): the baseline after `11-fix`), 2026-10-01: MEASURED,
      AND THE STATUS MOVES TO `met` ON THE PRINTED NUMBER.** The run, the tree and every printed
      figure are in R-01's paragraph of the same date and are not re-quoted. The reading this rests
      on: at `2x3`, the acceptance point, the default arm `actor` reconverges **942/2189 = 43.03%,
      below 96%**. `none >= actor: True` is printed, and the 143-case completeness assertion holds
      for every arm. **THE DECLARED PRIOR FAILED.** `2x3` had read 100.00% with zero divergences on
      the 89-case basis. The collector's own `⚠ CONSEQUENCE` line retracts the diagnosis that 100%
      rested on: `opening_set` reads no World, but its `q` does (`questions_for(w, p)`, clause 3
      `subject in referents(q)`), so a ledger claim was never the only channel. This row's opening
      "CLOSED by a theorem" sentence and its `~4%` are SUPERSEDED and stay as dated history.
      **POLARITY.** A reading below 96% means at least 4% of genuine flips change one of the next
      three strictly-later-tick deliberations, so a decision reached a later one. A reading at or
      above 96% would have meant the flips were absorbed and the loop ran on rails, as the prior
      read. **THE ATTACK.** Each check below could have refuted the number, and none did. (a)
      `stream_only` cannot sit inside the divergence. It is defined as event stream changed AND
      reconverged (`wd_acceptance.py:202-203`), and it is 909 of the 942 reconverged at `actor`.
      Every one of the 1,247 DIVERGED forks changed a later-tick fingerprint. Draws are keyed
      `(world_seed, tick, pid, purpose)` (`engine/season/state/ids.py::draw_factory`), so a fork
      cannot move another person's draw by consuming a shared stream. (b) The arms differ only in
      `observation_deposit_mode` (`wd_acceptance.fixtures_for`). Paired by case, the deposit channel
      raises the divergence rate in 139 of 143 cases and lowers it in 2. Over the 94 cases whose
      probed and genuine counts are identical across arms, `none` diverges 21.80% and `actor`
      54.92%. (c) Index-shift bound: `fork_case` compares decision `j` with decision `j`
      (`arm9_forking.py:228-232`), so an added or lost deliberation would misalign the rest of the
      window. Even counting EVERY divergence whose last window slot changed as that artifact, `actor`
      is at most 64.60% reconverged (775 robust divergences) and `none` at most 89.45%. (d) The
      fingerprint is the RANKED verb list, not the take. A deterministic every-8th sample of 150
      committed `actor` divergences was re-run through the unmodified `A9._run`, and it reproduced
      `changed_idx` 150/150. Of the 150, 115 changed a later in-budget TAKEN verb set, 20 were
      misaligned and 15 changed only the out-of-budget ranking, so about three quarters of the
      divergence is a later act chosen differently. At `none`, a sample of 100 read 70 / 28 / 2. (e)
      Determinism: P-4 ran one cell twice and it was byte-identical apart from `seconds`. **THE
      CONTROLS, AT THEIR REAL STANDING.** `none >= default` is the only control this instrument
      yields (plan §`11`). `none` is now a channel-open arm, not a null one: 22.87% of its genuine
      forks diverge through channels this run does not isolate. Those are the rounds loop, U4's
      sampler, Q4's person referent, `11a`'s Q2 widening, and the content-hashed claim-id tiebreak in
      `questions_for`'s sort that the collector's `⚠ THE CARRIER` names. The comparator plant is
      detected (105/105 at `2x1`, 46/46 at `2x3`). The four widened-clause-4 plants clear the
      collector's count rule on 1 of 4 at `2x1` and 0 of 4 at `2x3`, and 2 of 4 at each cell by
      rate. A firing plant shrinks its own genuine denominator, so the count rule is the wrong
      comparison. Either way the plants are NOT clean evidence that the instrument sees a planted
      widening. **WHAT THE NUMBER DOES NOT SHOW.** It does not show that a meaningful consequence
      carries the change. The `2x1` forensics, which were not run at `2x3`, find every carrying
      clause-4 drop SELF-REFERENTIAL: operand equals subject, so a candidate of the wrong type is
      pruned by its holder's own claim, true when recorded. Of the 106 carriers at `actor`, 82 were
      deposited by a `*.refused` Event and 24 by `finding.none`. That is refusal-as-news, `H-111`,

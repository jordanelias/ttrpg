      (`workplans/valoria_master_workplan_v9.md`).
  - scale:    "mass battles / strategy warfare"
    conjunct:  R-04.c4
    subsystem: [mass_battle]   # `rosters.yaml` `modules:` entries -- the one owner of where each lives (A-25, plan position `30`)
    retention: RETAINED
    in_loop:   "seam built; reached via a constructed `Question` (`test_march.py`) AND, measured,
      via natural computed play in `build_realm(0)`/`populated.run` (`harness/aperture.py`); not
      yet reached naturally in `corpus_run`'s separate 143-case NPC/ARC corpus"
    note: >-
      The seam exists (`ecacb57`, PR #436): `march` declares `contests: a field` and resolves
      through `seam/wrappers/mass_battle.py` → the `mass_battle.resolve_field` composition role.
      `test_march.py::test_a_real_chooser_forms_and_folds_a_march_that_reaches_a_real_field_battle`
      (plan position `28-ii`, M6) demonstrates a real chosen act reaching it, through the real
      chooser, off a constructed `Question` naming a settlement referent.
      ⚠ CORRECTED, the Phase 3 terminal critique's reconciliation, 2026-09-30: this note used to
      say march "still sits in `test_season_shape.py`'s never-attempted set for the NATURAL
      corpus" and that "no `questions_for` source in the natural corpus ever supplies march a
      workable referent" -- measured FALSE for `build_realm(0)`/`populated.run`:
      `python -m engine.season.harness.aperture 1 0`, run twice reproducibly, shows march
      forming, being offered, being attempted and executing there via the real, unrestricted
      chooser, with zero constructed `Question` and zero hand-built `Act` (`hole_register.yaml`
      H-175). `march` DOES still sit in `test_season_shape.py`'s never-attempted set, but that
      set is drawn from `corpus_run`'s separate, narrower, individually-authored 143-case NPC/ARC
      corpus, not from the natural corpus generally -- a fresh `corpus_run` this same session
      re-confirms march is still absent there. `decision/options.py::opening_set`'s clause 3
      applies no referent-kind filter and `operands_for` already carries `march`'s operands
      correctly (neither was ever the gap). WHY `corpus_run`'s 143 cases specifically never
      supply march a workable referent, while the populated realm does, is UNMEASURED
      (`hole_register.yaml` H-175's `cite:`). `H-151`'s OWN `cite:` field, not H-175's, is where
      the earlier retraction of a stale "missing `operands_for` arm" citation actually lives.
  - scale:    "personal combat / grid-based map combat with units"
    conjunct:  R-04.c5
    subsystem: [combat]   # `rosters.yaml` `modules:` entries -- the one owner of where each lives (A-25, plan position `30`)
    retention: "RETAINED, NOT DONE (Jordan, 2026-09-05: \"combat engine isn't done\")"
    in_loop:   "duel only, via combat_seam.py"
    note: >-
      ⚠ THE TWO HALVES OF THIS SCALE ARE NOT THE SAME THING. The duel engine is real and the loop
      already calls it (`combat_seam.py` -> `wrapper.fight`), but it is a CONTINUOUS RANGE model
      (`combat_systems.py::RANGE_COMMIT_PEAK`, `RANGE_AVAIL_FLOOR`) between two combatants.
      ⚠ CORRECTED 2026-10-26 (v10 REM-03, B10-01): this note used to say grid-based map combat with
      units exists nowhere in the tree. `modules/mass_battle` holds a cell battlefield
      (`config.py:14` `BATTLEFIELD_SIZE`, `:23` `UNIT_GRID_SIZE`); what does not exist is the
      decision at its scale (commander-chosen orders). THE READING OF THIS ROW
      [ASSUMPTION; medium; Jordan to correct; revert: commander-chosen orders restored as a third
      gate]: it reads `in_loop` when, in computed play, (i) a duel resolves (`fight` or `accept` ->
      the combat seam; true today) and (ii) a fought field (`field.won` or `field.lost`, never
      `field.unopposed`) resolves on `modules/mass_battle`'s cell battlefield. Commander-chosen
      orders are not a gate: they are a named residue (the AUTOMATED mode may run the default
      orders, `massbattle.py:170-178`), whose trigger is a position that designs a typed `Orders`
      record shared by the PLAYABLE scene and the AUTOMATED planner (MB-08's AI-generals half,
      LEAVE). R-04 may read `met` at CP-T04's close when conjunct (1) and the other conjuncts also
      read (`workplans/valoria_master_workplan_v10_part2.md` §5).
  - scale:    "settlement management / city building / domain actions"
    conjunct:  R-04.c6
    subsystem: [settlements, overview]   # `rosters.yaml` `modules:` entries -- the one owner of where each lives (A-25, plan position `30`)
    retention: "RETAINED (Jordan, 2026-10-02, ED-IN-0283 -- the systems/ folders are the homes of their systems)"

      ⚠⚠ **THE POPULATED REALM, FOUR SEASONS, MEASURED 2026-09-30 -- AN AMBITION THERE ENDS BY
      BEING LAID DOWN OR WITH ITS HOLDER, NEVER BY COMING TRUE.** The run is R-01's realm
      paragraph's (`build_realm(0)`, tree `c8cc408`, hash `f99746ef1e57a796f7bdbb738f0c52b0`), not
      this row's `measure:`. Each of the 46 authored NPCs is built with a live `commit` to an OUGHT
      about the person it is tied to (`harness/populated.py`, the tie's one write), so the realm
      carries 46 distinct ambitions where the corpus carries one shared OUGHT (`W27`'s subject).
      **At the end of the run 44 of those 46 Tenures are still live, and none of the 44 was laid

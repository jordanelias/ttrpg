# THE SCALES OF PLAY — ruled by Jordan 2026-09-05, verbatim:
#   "we need to enable all scales of play that the game calls for, which includes character
#    creation/development/chronicling, grand strategy politics, social contests/debates, mass
#    battles/strategy warfare, personal combat/grid-based map combat with units,
#    investigations/detective/interactive fiction"
#
# ⚠ THIS IS R-05's SECOND CLAUSE, ANSWERED. R-05 says building out the verbs "requires planning out
# all the different scales of play required in a season" — this roster IS that plan, and it is
# Jordan's, not a session's inference. R-04 is measured against it.
#
# ⚠ AND IT COLLIDES WITH THE RETIREMENT AS STEP A RECORDED IT. Three of the six map ENTIRELY to
# subsystems in the retire set. "Superseded by engine/season/" means the loop must EXPRESS the
# scale, never that the scale goes away — so R-04 is not the narrow "faction + world" item the
# execution plan framed; it is six scales, and Step B cannot proceed on any subsystem whose scale
# the loop has not subsumed.
# ⚠ AND THE REPOSITORY ALREADY SPECIFIES THIS, WHICH IS THE POINT JORDAN MADE: *"the repository
# outlines all of this pretty explicitly at the different scales. the proposal since it's becoming
# adopted now and real needs to accommodate it all."* The canonical surface is
# `systems/_architecture/reference/scale_transitions_v30.md` (Status: CANONICAL), and the adopted loop
# currently honours NEITHER of its two tables:
#
#   §1 THREE MODES — TTRPG (scene-by-scene, rounds) · Hybrid (BG strategic + TTRPG scenes via
#   Zoom In/Out, seasons + scenes) · BG (faction Domain Actions, seasonal Accounting). The loop
#   implements one tick granularity and no zoom, so R-03's scene tick is the Hybrid mode's
#   precondition, not a local nicety.
#
#   §2 FIVE SCALES — Object · Personal · Relational · Territorial · Structural. ⚠ ITS "Base Ob"
#   COLUMN IS **THREAD-ONLY** AND IS NOT A GENERAL OBSTACLE SOURCE (Jordan, 2026-09-05: "base ob
#   by scale only makes sense for thread operations so ignore it"). I read that column as R-09's
#   Ob source and sent it to a live producer as canon before Jordan caught it. The scoping was
#   visible in the table I was quoting — its sibling columns are "Min Thread Sensitivity" and
#   "Coherence auto-cost", and every example in it is a Thread act. Recorded because the error is
#   instructive: pattern-matching on the term "Base Ob" instead of reading what the table governs.
#   **The live obstacle ruling is Jordan's 2026-08-14 "score/2 plus modifiers"**
#   (`dice_engine.py:241-247`, which records it as implemented nowhere). What DOES survive from §2
#   for R-04 is the SCALE SET itself: the loop's `person`/`realm`/`settlement` vocabulary is not
#   canon's five, and no mapping between them exists — that gap is R-04's real content.
#
#   §3 EIGHT HANDOFF RULES — Personal→Thread, Personal→Faction, Personal→Scene (Contest),
#   Scene→Faction (Domain Echo), Thread→Faction, and three more. These are the "zooms out and in
#   well across scales of play" and "transitions and sequences cleanly" tests of NERS **S**
#   (CLAUDE.md §0.06). The loop implements none of them.
#
# ⚠ `_architecture` IS NOT A SYSTEM (ED-IN-0284; a `stub` in `rosters.yaml` `modules:`, A-25) AND HOLDS
# ZERO `.py`. It was kept because "the document IS the spec" — the worked case for why that rule
# matters: the spec the adopted system must satisfy lived in a tree once marked superseded.
# Superseded meant the LOOP must express it. It never meant the requirement goes away.


rows:

  - id: R-01
    statement: "decisions must propagate"
    status: not_met
    measured: >-
      R3 (cross-person propagation) passes **22/30 NPC and 34/59 ARC** on the cases that are
      representable, and the planted-edge control fires — so the DETECTOR works. But the
      forking exercise measured 2,403 forks with 100% reconvergence, and after W-A/W-B the
      later-decision divergence is only ~4%. Propagation is structurally present and
      behaviourally near-absent.
      ⚠ **THE LAST SENTENCE IS NO LONGER TRUE OF THE MEASURED SLICE, AND THE CORPUS-SCALE RATE
      HAS NOT BEEN RE-RUN — BOTH HALVES ARE STATED (ED-FI-0009, 2026-09-10).** The channel a
      decision reaches a later decision by is §F1 clause 4, and `W-D`'s own diagnosis recorded why
      the rate was ~4%: *"§F1 clause 4 has exactly ONE reachable instance in the corpus"* — every
      drop in every cell was `move` refusing on a `contain.path` belief. Splitting the verb-table
      row `"the six investigation acts"` into the six acts canon names gave the grammar four more
      live cells (`exists:Site` · `exists:Person` · `exists:Record` · `exists:Rung`). MEASURED
      over the same 89 worlds at the shipped default by ONE script run on both sides, clause-4
      drops by verb: **25, all `move`, before; 1,491 raw after** — `examine` 387 · `restore` 387 ·
      `research` 379 · `interview` 306 · `move` 18 · `surveil` 14. ⚠ **387 OF THOSE CANNOT MOVE A
      DECISION, SO THE FIGURE THIS ROW IS ABOUT IS 1,104 IN FIVE VERBS.** `restore` is not in
      `resolvable_verbs()` (it writes `Site.condition` with no `EFFECTS` entry) and `choose.py`
      applies the `verbs=` filter AFTER `opening_set` returns, so clause 4 drops a Candidate that
      was never going to be offered. ⚠ TRUE ON 2026-09-10 AND NO LONGER: plan position `24e`
      (2026-09-29) gave `restore` its effect, so it IS resolvable and its clause-4 drops can now
      move a decision; the 1,104 above was not re-measured for it. Measured too: `examine` and `restore` fire on the IDENTICAL
      EIGHT SUBJECTS — same cell shape, so one belief counted under two verbs. The better statement
      of the change is the PREDICATE count: clause 4 went from ONE reachable predicate
      (`contain.path`) to FIVE (`+ exists:Site` · `exists:Record` · `exists:Person` ·
      `exists:Rung`). ⚠ THE FIRST
      WRITING OF THIS ROW SAID 13, QUOTED FROM A TEST DOCSTRING RATHER THAN MEASURED, WHICH PUT A
      QUOTED NUMBER AND A MEASURED ONE IN THE SAME RATIO — the asymmetry §0.1 pt 4 names. `move`
      itself FELL, 25 -> 18, which the quoted figure had reported as a rise. On the pinned NPC-088 2-slot slice the shipped
      arm went from **0 of 16 forks diverging to 14 of 18**. ⚠ WHAT IS NOT MEASURED: the
      corpus-scale fork rate (the 62/1467 figure), which needs the chunked `wd_chunk.py` run and
      was not re-run here. So the ~4% above is stale in an unknown direction and the status stays
      `not_met` on the instrument that set it, not on the slice that moved.
      ⚠ **AND THE OPENING R3 FIGURES MOVED TOO — THEY READ 30/30 NPC AND 54/59 ARC UNTIL
      ED-FI-0009. THE FALL IS A MEASURED BEHAVIOURAL CHANGE, NOT A STALE LINE (measured
      2026-09-10, and it is why the two numbers at the top of this row now read 22/30 and
      34/59).** The same command on both sides of that commit —
      `python -m engine.season.harness.corpus_run`, at `b154ce8` (before) and `5a35084` (after)
      — moves **28 cases from R3 true to R3 false and none the other way**, 8 NPC and 20 ARC.
      **It is displacement, not a blind instrument, and that was the falsifier this claim
      needed**: on four sampled flipped cases the emitter index `_r3_propagates` builds still
      attributes every Event it did before — `indexed` tracks `acts` exactly on both sides — and
      the cause-edge population does not collapse, while the cross-person subset goes to **zero
      in all four**: `ARC-45` acts 42→42 · edges 12→10 · **cross 12→0**; `ARC-R16` 42→42 ·
      12→12 · **12→0**; `NPC-008` 42→46 · 12→15 · **12→0**; `NPC-020` 42→42 · 12→14 · **12→0**.
      (One of the four edge counts falls; the other three hold or grow. The claim is that the
      population SURVIVES, not that it is monotone.) Every flipped case LOST no verb and GAINED
      `reconstruct`/`surveil`. So the six acts did not blind the detector; they displaced the act
      that used to be caused by another person's act — which is this row's own subject, measured
      moving in the adverse direction while §F1 clause 4 moved in the favourable one. Both are
      true and neither cancels the other.
      ⚠ **NOTHING IS ESCALATED AND NO GUARD IS MINTED.** The remedy is already this row's own
      `blocks:` entry `W-F` (cross-person transmission), so there is no ruling to ask for

    conjunct:  R-04.c1
    subsystem: [characters, npcs]   # `rosters.yaml` `modules:` entries -- the one owner of where each lives (A-25, plan position `30`)
    retention: "RETAINED (Jordan, 2026-10-02, ED-IN-0283 -- the systems/ folders are the homes of their systems)"
    in_loop:   false
    note: >-
      `Person` carries `pursuits`, `ledger`, `stance`, `capability` — but NOTHING
      creates or develops a person: no generation, no progression, no chronicle. ⚠ `capability` is
      empty on 81 of the 83 persons of `build_realm(0)` and holds `{inquiry: 2}` on two (`p_npc_088`,
      `p_npc_004`): read at `7924400` by counting `p.capability` over `build_realm(0).persons`.
  - scale:    "grand strategy politics"
    conjunct:  R-04.c2
    subsystem: [factions, settlements, world]   # `rosters.yaml` `modules:` entries -- the one owner of where each lives (A-25, plan position `30`)
    retention: "RETAINED (Jordan, 2026-10-02, ED-IN-0283 -- the systems/ folders are the homes of their systems)"
    in_loop:   false
    note: >-
      R-04's opening headline, the pre-`20-ii` reading: 44 of 143 cases UNREPRESENTABLE at faction
      scale and 10 at world scale. `20-ii` closed that census on 2026-09-30 (R-04's `measured:`
      carries the run). ⚠ REWRITTEN 2026-10-01: no second driver runs this scale beside the season

  - id: R-08
    statement: >-
      decisions must not be omniscient and perfectly rational — characters may not make the
      optimal decision based upon their epistemic knowledge and personal inclinations
    status: partial
    measured: >-
      NON-OMNISCIENCE HOLDS, structurally (see R-07). NON-RATIONALITY DOES NOT EXIST: the chooser
      takes the top-ranked candidate deterministically — `engine/season/decision.py::make_chooser` sorts on
      `(-score, verb, subject)`, so a tie breaks ALPHABETICALLY BY VERB — and only 2–7 of 22
      candidates carry a nonzero conviction score, so most choices are settled by verb name rather
      than by anything about the person. There is no mechanism by which a person declines the
      optimum, and no mechanism by which inclination breaks a tie.
      ⚠ **THE LAST SENTENCE IS FALSE AS OF `U4` (2026-09-10), AND THE ROW STAYS `partial` ANYWAY —
      because the two halves it names came apart.** *A person declines the optimum*: **BUILT.** The
      order is sampled, `softmax(score / choice_temperature)` via Gumbel, in
      `engine/season/decision/choose.py::_sample_order`, so the top-ranked candidate is likely and
      no longer certain. Falsifier:
      `test_u4_the_choice_is_sampling_and_the_argmax_is_its_zero_temperature_control` — twenty
      seeds over ONE person and view yield >=2 distinct top acts, while the identical arm at
      `choice_temperature = 0` collapses to exactly one, so the spread is the sampler's and not the
      fixture's. *Inclination breaks a tie*: **STILL NOT BUILT**, and it cannot be while the
      alignment table is sparse (`H-96`'s ranking half · `H-66` · `U3`). A tie is now broken by the
      DRAW, which is not the person — it is the absence of a reason, not a reason of theirs. That
      is the whole of why this row does not go `met`.
      ⚠ WHAT `U4` ACTUALLY REMOVED, measured with a control: the ALPHABET deciding a triage. One
      ruled verb (`release`, `04 §A.3` row 14) under a name sorting EARLY executed in 18 corpus
      cases and displaced 71 acts (`utter` x56); the SAME verb, predicate and effect under a name
      sorting LAST executed in 5 and displaced 2. After `U4` the pair reads 13 vs 14 and 22 vs 25 —
      the gap collapses into noise. ⚠ AND THE COST IS RECORDED WITH IT: between-world variety falls
      monotonically with temperature (distinct executed sets, 89 live cases: tau=0 -> 16 · 0.1 -> 10
      · 0.25 -> 8 · 0.5 -> 7 · 1.0 -> 7), which is the opposite of what `U4`'s plan predicted, so
      the shipped `0.1` is the LEAST arm that removes the defect rather than a tuned one.
      ⚠ THE CITATION ABOVE IS STALE and is kept as written with the correction attached:
      `decision.py` became the DIRECTORY `decision/` at Arc 1 (`ED-IN-0206`), so the sort lives at
      `decision/choose.py::make_chooser`.
      ⚠⚠ **U10, 2026-09-30, FRESH OFF THIS ROW'S OWN `measure:` COMMAND** (run twice against two
      tree states either side of an unrelated concurrent commit, byte-identical both times) — see
      R-06 for the quoted instrument line (`/simplify`, BATCH-CLOSE Phase 2 — not re-quoted here;
      both rows share it). **Neither half of why this row stays `partial` has moved**: the DRAW
      still breaks ties (built, `U4`), and inclination still does not (the alignment table is
      still sparse) — nothing in U7-U10's own work touched `choose.py`, `choice_temperature` or the
      alignment table.
      ⚠⚠ **IN-08's CELLS COMMIT (B-G) -- THE RANKING LINE IS READ OVER CELLED CANDIDATES (G-1,
      [medium; Jordan to correct]).** R-06's note states the reading and the figure: the tie this
      row asks inclination to break is counted only among candidates whose verb has at least one
      celled axis on the re-celled 15x7 basis, because an `uncelled:` verb (`tell` by design) or an
      all-`null` one cannot be broken by inclination at all, and counting it would report a tie no
      person could have broken. Off this row's `measure:` at seed 0: 19..27 of 27 celled candidates
      carry a nonzero pursuit score (32 in all); the remainder still tie and the DRAW breaks them.
      `choose.py` and `choice_temperature` are untouched; what moved is the table. Stays `partial`.

# THE NINE — the acceptance requirements for the adopted season loop.
#
# RULED BY JORDAN 2026-09-05, at adoption (ED-IN-0204), verbatim in `statement:`.
#
# ⚠ THIS FILE IS MECHANISM, NOT REFERENCE (CLAUDE.md §0.05). `register.py --requirements`
# reads it and FAILS on a row that claims `met` with no conjunct behind it. That is the whole
# point: these are the things the loop must DO, and §0.2 says a thing is done when it EXECUTES. A
# row here may not be closed by writing a document.
#
# `status:` is one of  not_met | partial | met  — and every value is what the row's `conjuncts:`
# read, NOT a judgement: `met` is every conjunct `holds: yes` with its `reading:`; `partial` is at
# least one. A conjunct is `{id, text, argv, expects, holds, reading}` (`check_requirements` owns
# the shape); `measure:` is one line, the row's cheapest conjunct. This file's history is its git
# log: a retired reading is deleted, not kept beside the live one. Where a requirement has no
# instrument yet, status is `not_met` and `measure:` names what would have to exist.

ruled_by: "Jordan, 2026-09-05"
ed: "ED-IN-0204"

# THE SCALES OF PLAY — ruled by Jordan 2026-09-05, verbatim:
#   "we need to enable all scales of play that the game calls for, which includes character
#    creation/development/chronicling, grand strategy politics, social contests/debates, mass
#    battles/strategy warfare, personal combat/grid-based map combat with units,
#    investigations/detective/interactive fiction"
#
# ⚠ THIS IS R-05's SECOND CLAUSE, ANSWERED. R-05 says building out the verbs "requires planning out
# all the different scales of play required in a season" — this roster IS that plan, and it is
# Jordan's, not a session's inference. R-04 is measured against it.
#
# ⚠ AND IT COLLIDES WITH THE RETIREMENT AS STEP A RECORDED IT. Three of the six map ENTIRELY to
# subsystems in the retire set. "Superseded by engine/season/" means the loop must EXPRESS the
# scale, never that the scale goes away — so R-04 is not the narrow "faction + world" item the
# execution plan framed; it is six scales, and Step B cannot proceed on any subsystem whose scale
# the loop has not subsumed.
# ⚠ AND THE REPOSITORY ALREADY SPECIFIES THIS, WHICH IS THE POINT JORDAN MADE: *"the repository
# outlines all of this pretty explicitly at the different scales. the proposal since it's becoming
# adopted now and real needs to accommodate it all."* The canonical surface is
# `systems/_architecture/reference/scale_transitions_v30.md` (Status: CANONICAL), and the adopted loop
# currently honours NEITHER of its two tables:
#
#   §1 THREE MODES — TTRPG (scene-by-scene, rounds) · Hybrid (BG strategic + TTRPG scenes via
#   Zoom In/Out, seasons + scenes) · BG (faction Domain Actions, seasonal Accounting). The loop
#   ticks scene by scene (R-03's `met` rests on R-03.a and R-03.b) and the zoom between the
#   modes is not built; the scene tick is the Hybrid mode's precondition, not a local nicety.
#
#   §2 FIVE SCALES — Object · Personal · Relational · Territorial · Structural. ⚠ ITS "Base Ob"
#   COLUMN IS **THREAD-ONLY** AND IS NOT A GENERAL OBSTACLE SOURCE (Jordan, 2026-09-05: "base ob
#   by scale only makes sense for thread operations so ignore it"). I read that column as R-09's
#   Ob source and sent it to a live producer as canon before Jordan caught it. The scoping was
#   visible in the table I was quoting — its sibling columns are "Min Thread Sensitivity" and
#   "Coherence auto-cost", and every example in it is a Thread act. Recorded because the error is
#   instructive: pattern-matching on the term "Base Ob" instead of reading what the table governs.
#   **The live obstacle ruling is Jordan's 2026-08-14 "score/2 plus modifiers"**
#   (`dice_engine.py:241-247`, which records it as implemented nowhere). What DOES survive from §2
#   for R-04 is the SCALE SET itself. The mapping from the loop's eight rung kinds to canon's five is
#   `rosters.yaml: scale_of_rung` (`SCALE_OF_RUNG`, `engine/season/data/rosters.py`); what is open is a
#   game reader of it (`hole_register.yaml` H-89).
#
#   §3 EIGHT HANDOFF RULES — Personal→Thread, Personal→Faction, Personal→Scene (Contest),
#   Scene→Faction (Domain Echo), Thread→Faction, and three more. These are the "zooms out and in
#   well across scales of play" and "transitions and sequences cleanly" tests of NERS **S**
#   (CLAUDE.md §0.06). The loop implements none of them.
#
# ⚠ `_architecture` IS NOT A SYSTEM (ED-IN-0284; a `stub` in `rosters.yaml` `modules:`, A-25) AND HOLDS
# ZERO `.py`. It was kept because "the document IS the spec" — the worked case for why that rule
# matters: the spec the adopted system must satisfy lived in a tree once marked superseded.
# Superseded meant the LOOP must express it. It never meant the requirement goes away.

# ⚠ RETENTION CORRECTED 2026-10-02 (Jordan, ED-IN-0283), verbatim: "we have to keep those systems folders as they are the home for those
# systems"; of this roster's retire-set labels: "all of this is wrong". Every scale below is RETAINED. The notes that follow
# describe the retirement as it was planned and are history; deletions already merged under the old label are an open question
# put to Jordan (ED-IN-0283).

scales:
  - scale:    "character creation / development / chronicling"
    subsystem: [characters, npcs]   # `rosters.yaml` `modules:` entries -- the one owner of where each lives (A-25, plan position `30`)
    retention: "RETAINED (Jordan, 2026-10-02, ED-IN-0283 -- the systems/ folders are the homes of their systems)"
    in_loop:   false
    note: >-
      `Person` carries `pursuits`, `ledger`, `stance`, `capability` — but NOTHING
      creates or develops a person: no generation, no progression, no chronicle. ⚠ `capability` is
      empty on 81 of the 83 persons of `build_realm(0)` and holds `{inquiry: 2}` on two (`p_npc_088`,
      `p_npc_004`): read at `7924400` by counting `p.capability` over `build_realm(0).persons`.
  - scale:    "grand strategy politics"
    subsystem: [factions, settlements, world]   # `rosters.yaml` `modules:` entries -- the one owner of where each lives (A-25, plan position `30`)
    retention: "RETAINED (Jordan, 2026-10-02, ED-IN-0283 -- the systems/ folders are the homes of their systems)"
    in_loop:   false
    note: >-
      R-04's opening headline, the pre-`20-ii` reading: 44 of 143 cases UNREPRESENTABLE at faction
      scale and 10 at world scale. `20-ii` closed that census on 2026-09-30 (R-04's `measured:`
      carries the run). ⚠ REWRITTEN 2026-10-01: no second driver runs this scale beside the season
      loop. THIS SCALE HAS NO CODE OF ITS OWN: the old campaign driver (plan position
      `28-iii`), `systems/factions/` and `game_state.Faction`, the stat-vector dataclass (both
      `29b`), are deleted (their `FORK:5c5d8ec6` rows). A faction is a resolved VIEW
      (`engine/season/queries/faction_q.py::Faction`: built at a barrier, never a field of `World`,
      never `Act.actor`), and a faction's act is a person's act `via` a seat (`Act.via`,
      `engine/season/state/carriers.py`). Intent, for vocabulary only: Layer 1 PART D rows 1/8/14,
      which rule out a faction that acts, a stored aggregate and a banner holding territory.
  - scale:    "social contests / debates"
    subsystem: [social_contest]   # `rosters.yaml` `modules:` entries -- the one owner of where each lives (A-25, plan position `30`)
    retention: RETAINED
    in_loop:   "seam unbuilt"
    note: >-
      The kernel exists and already rolls through the substrate (`resolver.py` imports
      `degree_from_net` from `engine/dice_engine/dice_engine.py` and wraps `roll_net` from
      `engine/dice_engine/sigma_leverage.py`). The loop does NOT reach it. ⚠ REWRITTEN 2026-10-01: this
      sentence used to add "`parliamentary_vote.py` calls `roll_pool`"; that module and
      `parliamentary_stay.py` were deleted at `29b` (their `FORK:5c5d8ec6` rows), and nothing under
      `systems/social_contest` calls `roll_pool` now.
      4 of 45 verb rows (46 before IN-11 cut `repudiate`) declare `contests:` — `fight` and `accept` (the body, the combat seam), `march` (a
      field, the mass-battle seam, `ecacb57`) and `tell` (a standing, resolved on the season side
      by `seam/wrappers/sigma.py`, not by this kernel). The kernel retires at plan position `2-ii`
      (`workplans/valoria_master_workplan_v9.md`).
  - scale:    "mass battles / strategy warfare"
    subsystem: [mass_battle]   # `rosters.yaml` `modules:` entries -- the one owner of where each lives (A-25, plan position `30`)
    retention: RETAINED
    in_loop:   "seam built; reached via a constructed `Question` (`test_march.py`) AND, measured,
      via natural computed play in `build_realm(0)`/`populated.run` (`harness/aperture.py`); not
      yet reached naturally in `corpus_run`'s separate 143-case NPC/ARC corpus"
    note: >-
      The seam exists (`ecacb57`, PR #436): `march` declares `contests: a field` and resolves
      through `seam/wrappers/mass_battle.py` → the `mass_battle.resolve_field` composition role.
      `test_march.py::test_a_real_chooser_forms_and_folds_a_march_that_reaches_a_real_field_battle`
      (plan position `28-ii`, M6) demonstrates a real chosen act reaching it, through the real
      chooser, off a constructed `Question` naming a settlement referent.
      ⚠ CORRECTED, the Phase 3 terminal critique's reconciliation, 2026-09-30: this note used to
      say march "still sits in `test_season_shape.py`'s never-attempted set for the NATURAL
      corpus" and that "no `questions_for` source in the natural corpus ever supplies march a
      workable referent" -- measured FALSE for `build_realm(0)`/`populated.run`:
      `python -m engine.season.harness.aperture 1 0`, run twice reproducibly, shows march
      forming, being offered, being attempted and executing there via the real, unrestricted
      chooser, with zero constructed `Question` and zero hand-built `Act` (`hole_register.yaml`
      H-175). `march` DOES still sit in `test_season_shape.py`'s never-attempted set, but that
      set is drawn from `corpus_run`'s separate, narrower, individually-authored 143-case NPC/ARC
      corpus, not from the natural corpus generally -- a fresh `corpus_run` this same session
      re-confirms march is still absent there. `decision/options.py::opening_set`'s clause 3
      applies no referent-kind filter and `operands_for` already carries `march`'s operands
      correctly (neither was ever the gap). WHY `corpus_run`'s 143 cases specifically never
      supply march a workable referent, while the populated realm does, is UNMEASURED
      (`hole_register.yaml` H-175's `cite:`). `H-151`'s OWN `cite:` field, not H-175's, is where
      the earlier retraction of a stale "missing `operands_for` arm" citation actually lives.
  - scale:    "personal combat / grid-based map combat with units"
    subsystem: [combat]   # `rosters.yaml` `modules:` entries -- the one owner of where each lives (A-25, plan position `30`)
    retention: "RETAINED, NOT DONE (Jordan, 2026-09-05: \"combat engine isn't done\")"
    in_loop:   "duel only, via combat_seam.py"
    note: >-
      ⚠ THE TWO HALVES OF THIS SCALE ARE NOT THE SAME THING. The duel engine is real and the loop
      already calls it (`combat_seam.py` -> `wrapper.fight`), but it is a CONTINUOUS RANGE model
      (`combat_systems.py::RANGE_COMMIT_PEAK`, `RANGE_AVAIL_FLOOR`) between two combatants.
      ⚠ CORRECTED 2026-10-26 (v10 REM-03, B10-01): this note used to say grid-based map combat with
      units exists nowhere in the tree. `modules/mass_battle` holds a cell battlefield
      (`config.py:14` `BATTLEFIELD_SIZE`, `:23` `UNIT_GRID_SIZE`); what does not exist is the
      decision at its scale (commander-chosen orders). THE READING OF THIS ROW
      [ASSUMPTION; medium; Jordan to correct; revert: commander-chosen orders restored as a third
      gate]: it reads `in_loop` when, in computed play, (i) a duel resolves (`fight` or `accept` ->
      the combat seam; true today) and (ii) a fought field (`field.won` or `field.lost`, never
      `field.unopposed`) resolves on `modules/mass_battle`'s cell battlefield. Commander-chosen
      orders are not a gate: they are a named residue (the AUTOMATED mode may run the default
      orders, `massbattle.py:170-178`), whose trigger is a position that designs a typed `Orders`
      record shared by the PLAYABLE scene and the AUTOMATED planner (MB-08's AI-generals half,
      LEAVE). R-04 may read `met` at CP-T04's close when conjunct (1) and the other conjuncts also
      read (`workplans/valoria_master_workplan_v10_part2.md` §5).
  - scale:    "settlement management / city building / domain actions"
    subsystem: [settlements, overview]   # `rosters.yaml` `modules:` entries -- the one owner of where each lives (A-25, plan position `30`)
    retention: "RETAINED (Jordan, 2026-10-02, ED-IN-0283 -- the systems/ folders are the homes of their systems)"
    in_loop:   false
    note: >-
      ADDED 2026-09-05 on Jordan's correction — the first draft of this roster missed it. The design
      surface is substantial and explicit: `settlement_layer_v30.md`, `settlement_generator_v1.md`,
      `settlements_currency_v1.md`, `march_layer_v30.md`, `governance_play_redesign_v1.md`,
      `scale_hierarchy_v1.md`. `references/module_contracts.yaml` declares `domain_actions` and
      `settlement_economy` — BOTH with `doc: null`, two of the nine contracts §6 counts as
      unimplementable. The loop has `Site`, `stores` and `condition`; `found`, `build`, `restore` and
      `work` are declared in `verb_table.yaml`; in the realm only `restore` executes (cohorts mending
      their own settlement's fabric since `24f`), while `found`, `build` and `work` are formed and
      refused because no computed act declares a works (`H-165`); no domain-action mechanism exists.

  - scale:    "investigations / detective / interactive fiction"
    subsystem: [fieldwork]   # `rosters.yaml` `modules:` entries -- the one owner of where each lives (A-25, plan position `30`)
    retention: "RETAINED (Jordan, 2026-10-02, ED-IN-0283 -- the systems/ folders are the homes of their systems)"
    in_loop:   false
    note: >-
      Six investigation acts exist in `verb_table.yaml` and NONE declares `contests:` — so
      investigation is not ungraded, it is UNGRADEABLE. ⚠ THE FIRST CLAUSE WAS FALSE UNTIL
      2026-09-10 AND IS NOW TRUE: one row spelled `"the six investigation acts"` stood for six,
      and ED-FI-0009 split it into `examine` · `interview` · `research` · `surveil` ·
      `thread_read` · `reconstruct`. The second clause is unchanged and is a RULING, not an
      omission — see `rosters.yaml`'s `THE SEAMS` comment block (*"INVESTIGATION MUST NOT BE MADE A
      CONTEST TO BECOME GRADEABLE"*; this note cited it by line, `:505-508`, and the lines moved).
      One composition role targets this subsystem since v9 FI-02/FI-03: `fieldwork.find`
      (`references/module_contracts.yaml`'s `composition_roles:` block), the `inquiry` role's entry,

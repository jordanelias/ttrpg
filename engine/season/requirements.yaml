# THE NINE — the acceptance requirements for the adopted season loop.
#
# RULED BY JORDAN 2026-09-05, at adoption (ED-IN-0204), verbatim in `statement:`.
#
# ⚠ THIS FILE IS MECHANISM, NOT REFERENCE (CLAUDE.md §0.05). `register.py --requirements`
# reads it and FAILS on a row that claims `met` with no `measured:` line behind it. That is
# the whole point: these are the things the loop must DO, and §0.2 says a thing is done when
# it EXECUTES. A row here may not be closed by writing a document.
#
# `status:` is one of  not_met | partial | met  — and every value is the measurement in
# `measured:`, reproduced by `measure:`, NOT a judgement. Where a requirement has no
# instrument yet, status is `not_met` and `measure:` names what would have to exist.

ruled_by: "Jordan, 2026-09-05"
ed: "ED-IN-0204"

# THE SCALES OF PLAY — ruled by Jordan 2026-09-05, verbatim:
#   "we need to enable all scales of play that the game calls for, which includes character
#    creation/development/chronicling, grand strategy politics, social contests/debates, mass
#    battles/strategy warfare, personal combat/grid-based map combat with units,
#    investigations/detective/interactive fiction"
#
# ⚠ THIS IS R-05's SECOND CLAUSE, ANSWERED. R-05 says building out the verbs "requires planning out
# all the different scales of play required in a season" — this roster IS that plan, and it is
# Jordan's, not a session's inference. R-04 is measured against it.
#
# ⚠ AND IT COLLIDES WITH THE RETIREMENT AS STEP A RECORDED IT. Three of the six map ENTIRELY to
# subsystems in the retire set. "Superseded by engine/season/" means the loop must EXPRESS the
# scale, never that the scale goes away — so R-04 is not the narrow "faction + world" item the
# execution plan framed; it is six scales, and Step B cannot proceed on any subsystem whose scale
# the loop has not subsumed.
# ⚠ AND THE REPOSITORY ALREADY SPECIFIES THIS, WHICH IS THE POINT JORDAN MADE: *"the repository
# outlines all of this pretty explicitly at the different scales. the proposal since it's becoming
# adopted now and real needs to accommodate it all."* The canonical surface is
# `systems/_architecture/reference/scale_transitions_v30.md` (Status: CANONICAL), and the adopted loop
# currently honours NEITHER of its two tables:
#
#   §1 THREE MODES — TTRPG (scene-by-scene, rounds) · Hybrid (BG strategic + TTRPG scenes via
#   Zoom In/Out, seasons + scenes) · BG (faction Domain Actions, seasonal Accounting). The loop
#   implements one tick granularity and no zoom, so R-03's scene tick is the Hybrid mode's
#   precondition, not a local nicety.
#
#   §2 FIVE SCALES — Object · Personal · Relational · Territorial · Structural. ⚠ ITS "Base Ob"
#   COLUMN IS **THREAD-ONLY** AND IS NOT A GENERAL OBSTACLE SOURCE (Jordan, 2026-09-05: "base ob
#   by scale only makes sense for thread operations so ignore it"). I read that column as R-09's
#   Ob source and sent it to a live producer as canon before Jordan caught it. The scoping was
#   visible in the table I was quoting — its sibling columns are "Min Thread Sensitivity" and
#   "Coherence auto-cost", and every example in it is a Thread act. Recorded because the error is
#   instructive: pattern-matching on the term "Base Ob" instead of reading what the table governs.
#   **The live obstacle ruling is Jordan's 2026-08-14 "score/2 plus modifiers"**
#   (`dice_engine.py:241-247`, which records it as implemented nowhere). What DOES survive from §2
#   for R-04 is the SCALE SET itself: the loop's `person`/`realm`/`settlement` vocabulary is not
#   canon's five, and no mapping between them exists — that gap is R-04's real content.
#
#   §3 EIGHT HANDOFF RULES — Personal→Thread, Personal→Faction, Personal→Scene (Contest),
#   Scene→Faction (Domain Echo), Thread→Faction, and three more. These are the "zooms out and in
#   well across scales of play" and "transitions and sequences cleanly" tests of NERS **S**
#   (CLAUDE.md §0.06). The loop implements none of them.
#
# ⚠ `systems/_architecture/` IS IN THE RETIRE SET AND HOLDS ZERO `.py`. Under Step A's split rule
# it is kept because "the document IS the spec" — and this is the worked case for why that rule
# matters: the spec the adopted system must satisfy lives in a tree the ruling marked superseded.
# Superseded means the LOOP must express it. It never meant the requirement goes away.

scales:
  - scale:    "character creation / development / chronicling"
    subsystem: ["systems/characters (5 py, 13 md)", "systems/npcs (0 py, 19 md)"]
    retention: retire-set
    in_loop:   false
    note: >-
      `Person` carries `convictions`, `beliefs`, `ledger`, `stance`, `capability` — but NOTHING
      creates or develops a person: no generation, no progression, no chronicle. ⚠ `capability` is
      EMPTY on every person in the corpus (only `probes.py::_zero_capability` touches it, to zero
      it), which is why R-09's roll will vary by seed and not yet by person. W27 is the cast.
  - scale:    "grand strategy politics"
    subsystem: ["systems/factions (18 py)", "systems/settlements (8 py)", "systems/world (6 py)"]
    retention: retire-set
    in_loop:   false
    note: >-
      This is R-04's headline: 44 of 143 cases are UNREPRESENTABLE at faction scale and 10 at world
      scale. `engine/mc_v18.py` runs this scale today and the season loop does not; the two are not
      joined. Layer 1 PART D rows 1/8/14 forbid porting `game_state.Faction` as-is.
  - scale:    "social contests / debates"
    subsystem: ["systems/social_contest (21 py)"]
    retention: RETAINED
    in_loop:   "seam unbuilt"
    note: >-
      The kernel exists and already rolls through the substrate (`resolver.py` calls
      `degree_from_net`; `parliamentary_vote.py` calls `roll_pool`). The loop does NOT reach it —
      1 of 32 verbs declares `contests:` and it is `kill / wound`. Wave 2 item 2.3 is this seam.
  - scale:    "mass battles / strategy warfare"
    subsystem: ["systems/mass_battle (33 py)"]
    retention: RETAINED
    in_loop:   "seam unbuilt"
    note: "Wave 4 item 4.2 carries the seam, alongside the season-loop campaign artifact."
  - scale:    "personal combat / grid-based map combat with units"
    subsystem: ["systems/combat/combat_engine_v1 (29 py)"]
    retention: "RETAINED, NOT DONE (Jordan, 2026-09-05: \"combat engine isn't done\")"
    in_loop:   "duel only, via combat_seam.py"
    note: >-
      ⚠ THE TWO HALVES OF THIS SCALE ARE NOT THE SAME THING AND ONLY ONE EXISTS. The duel engine is
      real and the loop already calls it (`combat_seam.py` -> `wrapper.fight`), but it is a
      CONTINUOUS RANGE model (`combat_systems.py::RANGE_COMMIT_PEAK`, `RANGE_AVAIL_FLOOR`) between
      two combatants. **GRID-BASED MAP COMBAT WITH UNITS DOES NOT EXIST ANYWHERE IN THE TREE** — no
      grid, hex or tile module in `systems/` or `engine/`; the only map artifacts are
      `settlements/valoria_map_v30.svg` (a picture) and `world/adjacency_map.jsx` (adjacency, not a
      tactical grid). This is unbuilt design, not an unwired seam, and it has no work item in the
      execution plan.
  - scale:    "settlement management / city building / domain actions"
    subsystem: ["systems/settlements (8 py, 12+ md)", "systems/overview (8 py)"]
    retention: retire-set
    in_loop:   false
    note: >-
      ADDED 2026-09-05 on Jordan's correction — the first draft of this roster missed it. The design
      surface is substantial and explicit: `settlement_layer_v30.md`, `settlement_generator_v1.md`,
      `settlements_currency_v1.md`, `march_layer_v30.md`, `governance_play_redesign_v1.md`,
      `scale_hierarchy_v1.md`. `references/module_contracts.yaml` declares `domain_actions` and
      `settlement_economy` — BOTH with `doc: null`, two of the nine contracts §6 counts as
      unimplementable. The loop has `Site`, `stores` and `condition` but no economy, no build and
      no domain action.

  - scale:    "investigations / detective / interactive fiction"
    subsystem: ["systems/fieldwork (5 py, 19 md)"]
    retention: retire-set
    in_loop:   false
    note: >-
      Six investigation acts exist in `verb_table.yaml` and NONE declares `contests:` — so
      investigation is not ungraded, it is UNGRADEABLE. ⚠ THE FIRST CLAUSE WAS FALSE UNTIL
      2026-09-10 AND IS NOW TRUE: one row spelled `"the six investigation acts"` stood for six,
      and ED-FI-0009 split it into `examine` · `interview` · `research` · `surveil` ·
      `thread_read` · `reconstruct`. The second clause is unchanged and is a RULING, not an
      omission — see `rosters.yaml:505-508`. Two composition roles
      (`scene_resolver.fieldwork`, `scene_resolver.investigation`) target this subsystem, which is
      why it is in the R04-pending ceiling.

rows:

  - id: R-01
    statement: "decisions must propagate"
    status: not_met
    measured: >-
      R3 (cross-person propagation) passes **22/30 NPC and 34/59 ARC** on the cases that are
      representable, and the planted-edge control fires — so the DETECTOR works. But the
      forking exercise measured 2,403 forks with 100% reconvergence, and after W-A/W-B the
      later-decision divergence is only ~4%. Propagation is structurally present and
      behaviourally near-absent.
      ⚠ **THE LAST SENTENCE IS NO LONGER TRUE OF THE MEASURED SLICE, AND THE CORPUS-SCALE RATE
      HAS NOT BEEN RE-RUN — BOTH HALVES ARE STATED (ED-FI-0009, 2026-09-10).** The channel a
      decision reaches a later decision by is §F1 clause 4, and `W-D`'s own diagnosis recorded why
      the rate was ~4%: *"§F1 clause 4 has exactly ONE reachable instance in the corpus"* — every
      drop in every cell was `move` refusing on a `contain.path` belief. Splitting the verb-table
      row `"the six investigation acts"` into the six acts canon names gave the grammar four more
      live cells (`exists:Site` · `exists:Person` · `exists:Record` · `exists:Rung`). MEASURED
      over the same 89 worlds at the shipped default by ONE script run on both sides, clause-4
      drops by verb: **25, all `move`, before; 1,491 raw after** — `examine` 387 · `restore` 387 ·
      `research` 379 · `interview` 306 · `move` 18 · `surveil` 14. ⚠ **387 OF THOSE CANNOT MOVE A
      DECISION, SO THE FIGURE THIS ROW IS ABOUT IS 1,104 IN FIVE VERBS.** `restore` is not in
      `resolvable_verbs()` (it writes `Site.condition` with no `EFFECTS` entry) and `choose.py`
      applies the `verbs=` filter AFTER `opening_set` returns, so clause 4 drops a Candidate that
      was never going to be offered. Measured too: `examine` and `restore` fire on the IDENTICAL
      EIGHT SUBJECTS — same cell shape, so one belief counted under two verbs. The better statement
      of the change is the PREDICATE count: clause 4 went from ONE reachable predicate
      (`contain.path`) to FIVE (`+ exists:Site` · `exists:Record` · `exists:Person` ·
      `exists:Rung`). ⚠ THE FIRST
      WRITING OF THIS ROW SAID 13, QUOTED FROM A TEST DOCSTRING RATHER THAN MEASURED, WHICH PUT A
      QUOTED NUMBER AND A MEASURED ONE IN THE SAME RATIO — the asymmetry §0.1 pt 4 names. `move`
      itself FELL, 25 -> 18, which the quoted figure had reported as a rise. On the pinned NPC-088 2-slot slice the shipped
      arm went from **0 of 16 forks diverging to 14 of 18**. ⚠ WHAT IS NOT MEASURED: the
      corpus-scale fork rate (the 62/1467 figure), which needs the chunked `wd_chunk.py` run and
      was not re-run here. So the ~4% above is stale in an unknown direction and the status stays
      `not_met` on the instrument that set it, not on the slice that moved.
      ⚠ **AND THE OPENING R3 FIGURES MOVED TOO — THEY READ 30/30 NPC AND 54/59 ARC UNTIL
      ED-FI-0009. THE FALL IS A MEASURED BEHAVIOURAL CHANGE, NOT A STALE LINE (measured
      2026-09-10, and it is why the two numbers at the top of this row now read 22/30 and
      34/59).** The same command on both sides of that commit —
      `python -m engine.season.harness.corpus_run`, at `b154ce8` (before) and `5a35084` (after)
      — moves **28 cases from R3 true to R3 false and none the other way**, 8 NPC and 20 ARC.
      **It is displacement, not a blind instrument, and that was the falsifier this claim
      needed**: on four sampled flipped cases the emitter index `_r3_propagates` builds still
      attributes every Event it did before — `indexed` tracks `acts` exactly on both sides — and
      the cause-edge population does not collapse, while the cross-person subset goes to **zero
      in all four**: `ARC-45` acts 42→42 · edges 12→10 · **cross 12→0**; `ARC-R16` 42→42 ·
      12→12 · **12→0**; `NPC-008` 42→46 · 12→15 · **12→0**; `NPC-020` 42→42 · 12→14 · **12→0**.
      (One of the four edge counts falls; the other three hold or grow. The claim is that the
      population SURVIVES, not that it is monotone.) Every flipped case LOST no verb and GAINED
      `reconstruct`/`surveil`. So the six acts did not blind the detector; they displaced the act
      that used to be caused by another person's act — which is this row's own subject, measured
      moving in the adverse direction while §F1 clause 4 moved in the favourable one. Both are
      true and neither cancels the other.
      ⚠ **NOTHING IS ESCALATED AND NO GUARD IS MINTED.** The remedy is already this row's own
      `blocks:` entry `W-F` (cross-person transmission), so there is no ruling to ask for
      (`CLAUDE.md` §0, gate 5); and pinning an R3 count in a test would pin a number the build is
      supposed to move, which is §7's uncontrolled path. What this row owed was the measurement.
    measure: "python -m engine.season.harness.corpus_run  # check R3 rows + the planted control"
    blocks: [W-F, H-111, H-116]

  - id: R-02
    statement: "decisions affect subsequent decisions"
    status: not_met
    measured: >-
      The loop was CLOSED by a theorem, not a bug — `decision.opening_set` never consults world
      state, so the only channel a decision has into a later decision is a ledger claim, and
      `belief_contradicts` could read no claim the corpus deposits. W-A/W-B opened it; the
      measured effect is ~4% later-decision divergence against 100% world divergence.
      ⚠ RE-MEASURED IN PART, ED-FI-0009 — see R-01, which carries the numbers and the exact scope
      of what was and was not re-run. In short: the clause the channel runs through had one
      reachable producer and now has six, and the pinned slice went 0/16 -> 14/18. The
      corpus-scale rate is not re-run, so this row's `~4%` stands as the last corpus-scale
      figure and its status is unchanged.
    measure: "python proposals/2026-09-04-degree-sweep/wd_acceptance.py  # fork-and-follow, both arms"
    blocks: [W-F, H-111]

  - id: R-03
    statement: >-
      seasons must tick scene-by-scene, so what occurs after one scene can impact the next
      scene
    status: not_met
    measured: >-
      The scene container EXISTS and is not what's missing: `Scene` is a dataclass
      (`engine/season/state/carriers.py::Scene`, moved there at step 4 of the decomposition; this
      citation read `shape.py:2289` and named a file that no longer holds the class) and
      `deliberate` packs each person's choices into scenes and
      stamps every act with its scene id (`a.scene = sc.id`, `engine/season/loop/driver.py::SeasonDriver.deliberate`); `W17` LANDED
      2026-09-02 (`architecture/PLAN.md:1216`, `:1315`). What is missing is a scene-granular TICK.
      `SeasonDriver.season` (`engine/season/loop/driver.py`) calls `self.deliberate(...)` once, then
      `self.resolve(acts, ...)` once, then `self.witness(...)` once, then increments `w.tick`
      once — every scene for every person in the season is flattened into one
      `acts` list before RESOLVE ever runs, so nothing that happens in one scene can reach a
      later scene within the same season; the boundary that exists is season-to-season, not
      scene-to-scene.
      ⚠ CONSTRAINT ON HOW THIS IS BUILT — Jordan, 2026-09-05: *"only players really need the scene
      in its entirety"*, and the loop *"enables events to occur without a scene being called for not
      players"*. THE SCENE IS PLAYER GRANULARITY. The tick must give a PLAYER scene-by-scene
      resolution WITHOUT routing every NPC through a constructed scene — an NPC needs a resolution
      and an event, not a played-out scene. Built as "every person gets a scene per round", the cost
      of a season scales with the CAST rather than with the PLAYERS. The actorless channel
      (`SeasonDriver.matter`) already exists for the no-scene case, and both channels converge at
      `witness` into one log (S19.5).
    measure: "python -m engine.season.harness.headless --case NPC-088 --seasons 2 --seed 0"
    blocks: [W17]

  - id: R-04
    statement: "strategic and management actions must be possible, ie decisions at differing scales"
    status: not_met
    measured: >-
      54 of 143 cases are UNREPRESENTABLE — 44 at faction scale, 10 at world scale. The loop
      runs at person, settlement and realm only. The strategic layer has no expression in this
      model; `engine/mc_v18.py` runs the faction scale and the two are not joined.
    measure: "python -m engine.season.harness.corpus_run  # 'unrepresentable scales:' line"
    blocks: [W10, W13]

  - id: R-05
    statement: >-
      all verbs must be built out, and doing so requires planning out all the different scales
      of play required in a season
    status: not_met
    measured: >-
      **10 of 37 verbs execute in the corpus** (create_record, interview, move, reconstruct,
      research, speak, surveil, tell, transfer, utter). 20 carry no predicate and no effect,
      5 are foldable but never attempted (the governance verbs, `H-71`), and 2 are attempted and
      always refused (`work` and `examine`, both because no question these worlds raise refers to
      a Site). 1 of 37 declares `contests:`.
      ⚠ **32 -> 37 IS A CORRECTION, NOT GROWTH** (ED-FI-0009, 2026-09-10). The row spelled
      `"the six investigation acts"` was ONE row standing for six acts canon names
      (`investigation_systems_v30.md:217`), carrying `requires: "per act"` — a cell deferring to
      acts the table did not have — so the fold could not evaluate it and `runs/CASELOG_NPC.md`
      reported it as a blocker on two cases. Split into six rows with typed preconditions built
      from the EXISTING closed grammar (no new form, operand or stem), four execute, one is
      always refused, and `thread_read` is not resolvable at all: it requires Thread Sensitivity
      >= 30, which the closed `requires_operands` roster has no name for (`H-85`).
      ⚠ WHAT THE SPLIT DID **NOT** BUILD, said here because a verb row is not a mechanism:
      `fieldwork_v30.md:302-309` grades all six on four bands and NOTHING RESOLVES A BAND. Their
      `emits:` is flat. `rosters.yaml:482` types investigation's seam UNRULED and `:487-491` rules
      that writing a plausible IN/OUT for it *"would be inventing the architecture rather than
      recording it"*; `:505-508` forbids the near escape of giving them a prize. ⚠ AND THAT BLANK
      IS ALREADY CLOSED, WHICH ED-FI-0009 FILED AS A JORDAN QUESTION AND WITHDREW THE SAME DAY:
      `workplans/2026-09-06-season-loop-execution-plan.md:647` ran it through §0's five tests four
      days earlier and closed it at test 3 — *"NOT A SEAM. The loop IS the mechanism"*, attaching
      RESOLVE → WITNESS, out = *"Claims graded by degree; Failure emits `finding.none` and deposits
      nothing"*, **work item 4.5**. What is missing is a degree PRODUCER, which is work.
    measure: "python -m engine.season.harness.corpus_run  # the 'WHERE THE <n> GO' line, which prints len(VERB_TABLE) -- 37 today, and was '32' in this cell until ED-FI-0009 made the count honest"
    blocks: [W10-core, H-65, H-94]

  - id: R-06
    statement: >-
      characters must be robustly built with goals, ambitions, convictions, moral values, etc
    status: partial
    measured: >-
      `Person` carries `convictions` against a `conviction_axes` roster with an alignment
      matrix, and a zero matrix is refused at load (PLAN §W5's dead-carrier guardrail). AMBITION
      is not fieldless: a person's motive is expressed as a `commit` Tenure to an OUGHT
      Proposition (`engine/season/harness/headless.py::build_world`, `S.Tenure(..., "commit", ...)` to
      `prop_einhir`), and the Q4 source (`"Q4 -- \`need\`"`,
      `engine/season/queries/world_q.py::questions_for`, moved there at step 5) reads
      exactly that live `commit`-to-OUGHT tenure as a standing question every season — that IS
      the ambition mechanism, and it is why Carin acts in a quiet season. What's missing is a
      READ over it (no `ambitions(p)` query anywhere in the package) and a real cast per case
      (`W27`, `architecture/PLAN.md:1583`) rather than one shared OUGHT for all 143 corpus worlds.
      Convictions separately barely discriminate: only 2–7 of 22 candidates carry a nonzero
      score; the rest tie and are ordered alphabetically.
    measure: "python -m engine.season.harness.corpus_run  # 'RANKING DISCRIMINATION' line"
    blocks: [W27, H-62]

  - id: R-07
    statement: >-
      characters must have memories and feelings and attitudes and relationships, and they must
      only have imperfect knowledge
    status: partial
    measured: >-
      IMPERFECT KNOWLEDGE IS STRUCTURAL AND HOLDS — `choose` receives no World (enforced by
      test), a `View` is capped at k and raises on any world collection, and `LedgerReader`
      answers from the person's own ledger. `beliefs` and `ledger` carry memory. FEELINGS,
      ATTITUDES and RELATIONSHIPS have no field; `stance` is the nearest and nothing writes it
      — W-F, the item that would, is not started.
      ⚠ AND UNTIL 2026-09-07 THAT SENTENCE WAS TRUE OF THE PLUMBING AND FALSE OF THE WORLD, which
      is worth stating because the row read as stronger than it was. Every clause above is about
      the ACCESS PATH — who may read what, through which object. The CONTENT was identical for
      everyone: `fan_out_mode` shipped at `total`, so every person's ledger held every Event, and
      knowledge was private in its plumbing and universal in its facts. Under `R7` the default is
      `all_five` and the content differs: measured at `build_world(0)` over two seasons, the three
      persons' witness-deposit sets are IDENTICAL under `total` (0 differing pairs) and differ
      under the shipped arm (3 differing pairs, one of them between two people who both received
      deposits — a fact one holds and the other does not). Falsifier:
      `test_r7_two_persons_hold_different_things_and_at_total_they_cannot`, whose control is the
      `total` arm inside the same test.
    measure: "python -m pytest engine/season/tests -k 'choose_receives_no_world or a_view or r7_two_persons'"
    blocks: [W-F, W27]

  - id: R-08
    statement: >-
      decisions must not be omniscient and perfectly rational — characters may not make the
      optimal decision based upon their epistemic knowledge and personal inclinations
    status: partial
    measured: >-
      NON-OMNISCIENCE HOLDS, structurally (see R-07). NON-RATIONALITY DOES NOT EXIST: the chooser
      takes the top-ranked candidate deterministically — `engine/season/decision.py::make_chooser` sorts on
      `(-score, verb, subject)`, so a tie breaks ALPHABETICALLY BY VERB — and only 2–7 of 22
      candidates carry a nonzero conviction score, so most choices are settled by verb name rather
      than by anything about the person. There is no mechanism by which a person declines the
      optimum, and no mechanism by which inclination breaks a tie.
      ⚠ **THE LAST SENTENCE IS FALSE AS OF `U4` (2026-09-10), AND THE ROW STAYS `partial` ANYWAY —
      because the two halves it names came apart.** *A person declines the optimum*: **BUILT.** The
      order is sampled, `softmax(score / choice_temperature)` via Gumbel, in
      `engine/season/decision/choose.py::_sample_order`, so the top-ranked candidate is likely and
      no longer certain. Falsifier:
      `test_u4_the_choice_is_sampling_and_the_argmax_is_its_zero_temperature_control` — twenty
      seeds over ONE person and view yield >=2 distinct top acts, while the identical arm at
      `choice_temperature = 0` collapses to exactly one, so the spread is the sampler's and not the
      fixture's. *Inclination breaks a tie*: **STILL NOT BUILT**, and it cannot be while the
      alignment table is sparse (`H-96`'s ranking half · `H-66` · `U3`). A tie is now broken by the
      DRAW, which is not the person — it is the absence of a reason, not a reason of theirs. That
      is the whole of why this row does not go `met`.
      ⚠ WHAT `U4` ACTUALLY REMOVED, measured with a control: the ALPHABET deciding a triage. One
      ruled verb (`release`, `04 §A.3` row 14) under a name sorting EARLY executed in 18 corpus
      cases and displaced 71 acts (`utter` x56); the SAME verb, predicate and effect under a name
      sorting LAST executed in 5 and displaced 2. After `U4` the pair reads 13 vs 14 and 22 vs 25 —
      the gap collapses into noise. ⚠ AND THE COST IS RECORDED WITH IT: between-world variety falls
      monotonically with temperature (distinct executed sets, 89 live cases: tau=0 -> 16 · 0.1 -> 10
      · 0.25 -> 8 · 0.5 -> 7 · 1.0 -> 7), which is the opposite of what `U4`'s plan predicted, so
      the shipped `0.1` is the LEAST arm that removes the defect rather than a tuned one.
      ⚠ THE CITATION ABOVE IS STALE and is kept as written with the correction attached:
      `decision.py` became the DIRECTORY `decision/` at Arc 1 (`ED-IN-0206`), so the sort lives at
      `decision/choose.py::make_chooser`.
    measure: "python -m engine.season.harness.corpus_run  # 'RANKING DISCRIMINATION' + tie ordering"
    blocks: [W26, H-62]
    needs_jordan: false
    disposition: >-
      ⚠ AN EARLIER DRAFT OF THIS ROW FLAGGED `needs_jordan: true` AND WAS WRONG TWICE — corrected
      here rather than carried. (1) It described the CANDIDATE tie as broken by "an undeclared
      content-hash tiebreak". It is not; it is alphabetical, and the row's own `measure:` command

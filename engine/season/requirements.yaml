      draw=draw_factory(...))`, then count `driver.resolved` by verb and `world.log` by kind. What
      IS instrumented, and is what the claim rests on, is the pair of assertions in
      `test_season_shape.py`: `release` in the executed set over the 143-case corpus, and 15 of the
      89 live worlds. The triple is context for those, not evidence beyond them.

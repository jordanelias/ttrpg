  - id: R-07
    statement: >-
      characters must have memories and feelings and attitudes and relationships, and they must
      only have imperfect knowledge
    status: partial
    measured: >-
      IMPERFECT KNOWLEDGE IS STRUCTURAL AND HOLDS — `choose` receives no World (enforced by
      test), a `View` is capped at k and raises on any world collection, and `LedgerReader`
      answers from the person's own ledger. `beliefs` and `ledger` carry memory. FEELINGS,
      ATTITUDES and RELATIONSHIPS have `stance` as their nearest field.
      ⚠ STALE AS OF 2026-10-01, KEPT AND MARKED RATHER THAN SILENTLY DROPPED: this sentence used
      to end here with "and nothing writes it — W-F, the item that would, is not started." See the
      realm paragraph below: `stance` has two production writers (`harness/populated.py`'s
      build-time faction-loyalty seed, `loop/effects_combat.py::_eff_march`'s M4 write), neither
      reached by a death or a witnessed claim, which is W-F's still-open gap and the reason the
      row stays `partial` — narrower than "nothing writes it," not the same claim.
      ⚠ CORRECTED 2026-10-01 (telling workplan `T3a`, `ED-IN-0282`): `stance`'s first READER beyond
      `choose`'s score is `decision/options.py::teller_weight`, which grades a told claim by the
      hearer's stored regard for the teller.
      ⚠ AND UNTIL 2026-09-07 THAT SENTENCE WAS TRUE OF THE PLUMBING AND FALSE OF THE WORLD, which
      is worth stating because the row read as stronger than it was. Every clause above is about
      the ACCESS PATH — who may read what, through which object. The CONTENT was identical for
      everyone: `fan_out_mode` shipped at `total`, so every person's ledger held every Event, and
      knowledge was private in its plumbing and universal in its facts. Under `R7` the default is
      `all_five` and the content differs: measured at `build_world(0)` over two seasons, the three
      persons' witness-deposit sets are IDENTICAL under `total` (0 differing pairs) and differ
      under the shipped arm (3 differing pairs, one of them between two people who both received
      deposits — a fact one holds and the other does not). Falsifier:
      `test_r7_two_persons_hold_different_things_and_at_total_they_cannot`, whose control is the
      `total` arm inside the same test.
      ⚠⚠ **THE POPULATED REALM, FOUR SEASONS, MEASURED 2026-09-30 -- A DEATH IS WITNESSED AND CAN
      MOVE A LATER DECISION; WHAT IT DOES NOT MOVE IS AN ATTITUDE, BECAUSE NOTHING THIS RUN
      REACHED WRITES ONE.** The run is R-01's realm paragraph's, not this row's `measure:`. Two
      persons die, both in `fight` (five fights: Felled 2 · Wounded 1 · Untouched 2). The season-2

      and `found`, `build` and `work` are formed and refused because no computed act declares a works
      (`H-165`); no domain-action mechanism exists.

  - scale:    "investigations / detective / interactive fiction"
    conjunct:  R-04.c7
    subsystem: [fieldwork]   # `rosters.yaml` `modules:` entries -- the one owner of where each lives (A-25, plan position `30`)
    retention: "RETAINED (Jordan, 2026-10-02, ED-IN-0283 -- the systems/ folders are the homes of their systems)"
    in_loop:   false
    note: >-
      Six investigation acts exist in `verb_table.yaml` and NONE declares `contests:` — so

# THE ROSTERS — every closed set the loop reads, as DATA.
#
# ⚠ RULED BY JORDAN, 2026-09-02, and this file exists because of it. Verbatim, across four
# messages: *"please note that convictions roster and axes etc may be modified in future"* …
# *"that goes for all"* … *"these must be easy to modify"* … *"I do not want definitions etc to
# be hardcoded."*
#
# THE RULE, STATED SO A LATER SESSION CANNOT SOFTEN IT: a DEFINITION — a roster, a taxonomy, an
# axis set, a kind list, a closed set of any sort — is read at runtime from here. Changing one is
# a DATA EDIT, never a code change, and it touches no other system. A definition written as a
# literal in a Python body is a defect, whatever else is true of it.
#
# WHAT THIS IS NOT. It is not a place for MECHANISM — the step→write-class map is a relation the
# code owns, not a definition someone may edit. The test is: *would changing this change the GAME,
# or change how the code works?* A roster changes the game. `STEP_CLASS` changes the code.
#
# ⚠ THE "NO NUMBERS" CLAUSE, NARROWED BY `W5` — and narrowed rather than deleted, because the
# distinction it was reaching for is real. It read *"it is not a place for NUMBERS — those are
# `Fixtures`"*, which is right about a free-standing tuning scalar and WRONG about a weight that
# is part of a definition. `alignment` below is a verb × axis matrix: its cells are numbers, but
# the matrix IS the definition, it is keyed on a roster in this file, and it is precisely the
# thing Jordan named (*"convictions roster and axes etc"*). Pushing it into `Fixtures` would put
# it back in a Python literal, which is the outcome the ruling forbids.
#
#   > **The test, stated so it is idempotent:** a number that is a PROPERTY OF A ROSTER MEMBER
#   > travels with the roster and lives here. A number that stands free of any roster — `K = 12`,
#   > a budget base, a ledger cap — is a `Fixture`. `alignment[axis][verb]` has no meaning apart
#   > from `pursuit_axes` and the verb table; `view_k` has meaning on its own.
#
# TABLES ARE A SECOND TOP-LEVEL KEY, not a roster with a strange shape. A roster is a SET and
# `roster()` returns a frozenset; a table is a MAPPING and `table()` returns a dict. Reading one
# with the other's function raises, so the two shapes cannot be confused at the call site.
#
# HOW TO CHANGE ONE. Edit the list. Nothing else. `shape.py` reads this file at import; a name
# the code asks for that is not here RAISES rather than defaulting, which is §42.2's polarity
# rule applied to definitions — an absent roster is a refusal, never an empty set.
#
# SCOPE AND SHAPE — BOTH RULED BY JORDAN, 2026-09-02, when this file asked.
#   * "only this proposal chain is in scope" — so `keys.py`'s `ROLES`, `SCALES` and
#     `PERMANENCE_VALUES` are not governed by it. ⚠ `AXES` LEFT ANYWAY, ED-IN-0230 (2026-09-14).
#     The live engine is outside the chain (PR #337 -> now) and stays that way. A later session
#     reading the ruling as tree-wide would be widening it; it was asked and answered narrow.
#   * "one file rosters i think" — ONE FILE, not one per subsystem. If it grows past legibility
#     that is a reason to ask again, not a reason to split it unilaterally.
#
# SOURCE PRECEDENCE FOR CANON VOCABULARY — RULED BY JORDAN, 2026-09-02, ACROSS FOUR MESSAGES.
# Read this before adding or changing any roster whose members are WORLD content (faction names,
# organizations, offices, places, people). It does not govern rosters that are architecture
# (`rung_kinds`, `remit_acts`, `tenure_kinds`) — those come from #353 and this chain.
#
#   TIER 1 · `systems/world/`   — CANON.  Verbatim: *"systems/world contains information to use
#            regarding factions that should be considered more thoroughly for actions, but for the
#            identity/names/organizations it is canon."*
#   TIER 2 · `systems/factions/` — NEAR-CANON, AND ONLY CONDITIONALLY. Verbatim: *"systems/factions
#            if it concerns directly the identity of a faction can be concerned near-canon but
#            superseded by anything in world."* Two conditions, both required: it must concern
#            directly a faction's IDENTITY, and world must not say otherwise.
#   TIER 2a · `systems/npcs/reference/npc_behavior_v30.md` SUPERSEDES
#            `systems/factions/reference/faction_politics_v30.md`. ⭐ RULED by Jordan, 2026-09-13,
#            verbatim: *"NPC behaviour supersedes faction politics."* It was asked because the two
#            disagree about WHO SITS IN A FACTION'S INNER CIRCLE, by half: politics §1.2c gives
#            Hafenmark four named and §1.3c gives Varfell five; behaviour §2.16/§2.17 give TWO and
#            TWO, dropping Almstedt, Feldhaus, Thorvald Hann, Maret Uln and Edeyja, and assigning
#            two of the survivors different Conviction and Resonant-Style values for the same
#            people. Both are tier 2, so the tier order could not settle it — which is why it went
#            to a ruling rather than being resolved by precedence.
#            ⚠ THE RULING CHANGES NO DATA IN THIS TREE, AND THAT IS THE USEFUL PART.
#            `references/npc_registry.yaml` — the structured 46-row cast — ALREADY matches
#            behaviour on every contested cell: two-person councils, the same two people in each,
#            the same four resonant styles. The one apparent difference is Björn Holdar's
#            conviction (behaviour `Continuity`, registry `Warden`), and that is the ratified
#            PP-685 §4 legacy migration (its Continuity -> Warden default: NPC-001's note, references/npc_registry_history.md), not a conflict.
#            So the superseding document and the machine-readable cast agree, and building from
#            the registry IS building to this ruling. MEASURED 2026-09-13.
#   TIER 3 · `research/`        — REFERENCE. Verbatim: *"research/ contains useful information to
#            make everything more robust"*, and *"the research directory will also speak towards
#            the kind of governance and bureaucratic functions that may be relevant to game too."*
#            It informs DESIGN; it is not a source of canon names.
#   TIER 4 · `systems/settlements/reference/governance_play_redesign_v1.md` — IDEAS. Verbatim: *"governance
#            play redesign is just for ideas. do not treat as required."*
#
# ⚠ THE PRECEDENCE IS A RULE ABOUT SOURCING, AND IT HAS ALREADY CAUGHT TWO ERRORS IN THIS FILE —
# which is why it is written here rather than in a plan nobody re-reads.
#   1. `factions` was sourced from TIER 2 and included `Ministry of the Peninsula`. World never
#      names it, and tier 2 itself says it is *"institutional infrastructure, not a faction"*.
#   2. Two rosters (`governance_modes`, `power_bases`) were built from TIER 3 and DELETED again.
#      They were not wrong; they were UNREAD — nothing in the loop or the office schema consumed
#      either, and `§0.1` point 5 forbids minting apparatus that is load-bearing on nothing. The
#      insight that motivated them is real and is recorded at `H-100`, where it can be acted on,
#      instead of sitting here as two lists shaped like mechanism.
#
# ⚠ SILENCE IN TIER 1 IS NOT SUPERSESSION. `role_templates` is tier 2 and survives because world
# has no competing concept — not because tier 2 won. The day world names one, world wins.
#
# ⚠ EVERY ROSTER HERE IS OPEN BY THE SAME RULING. None of them is closed by being written down.
# The `source:` field says where the current membership comes from; it is provenance, NOT
# ratification, and a roster with `open: true` must never be cited as settling a register row.

rosters:

  tenure_kinds:
    source: "#353 §15 `:537-544` — the seven Tenure kinds and their cardinalities; `reside` is plan position `19c`'s"
    open: true
    note: >-
      ⚠ `reside` (Person -> Rung, ONE live per person) IS THE EIGHTH, ADDED AT PLAN POSITION `19c`
      (MIGRATE, 2026-09-30), AND IT IS WHERE A PERSON LIVES AS DISTINCT FROM WHERE THEY ARE. `contain`
      is where they are (`04_CODE_ARCHITECTURE.md` §B: *"its contain edge is where they are"*) and
      `move` re-homes it; `reside` is opened only by `migrate` (and minted beside the first
      `contain` by every world builder), so a `move` leaves it behind. It is what `world_q.population`
      counts and `world_q.capacity` throttles (`RULINGS.yaml` RR-2). Like `contain`, it is NOT in
      `release`'s domain: its end is a relocation (`migrate` closes the old edge as it opens the
      new), and a released residence would leave a person living nowhere. The reasoning for a
      Tenure kind over a claim, a `Person` field or a flag on `contain` is `loop/effects.py::
      _eff_migrate`'s docstring.
      ⚠ `detain` (prisoner -> a seat) AND `ban` (person -> the excluding seat) ARE THE NINTH AND
      TENTH, ADDED AT v9 SC-03a (#453 §10.4 step 3, K-53; ratified as intent, ED-IN-0288). Each is
      a disposal a determination opens under an arrangement whose `disposes:` names it
      (`loop/effects_information.py::_eff_determine`). Neither is in `release`'s domain
      (`data/rosters.py::RESTRAINT_KINDS`): a prisoner who could release his own custody, or an
      outlaw his own ban, would walk out of the sentence, which is why they are kinds and not an
      `oblige` (#453 §8.3). Their readers: `move`/`migrate` decline a person holding a live `detain`,
      a mustered army excludes him (`loop/sides.py`), `oblige` refuses a `ban` holder service and
      `confer` declines to seat one. v9 IN-31 (H-100): `revoke` opens a `ban` too, on the man whose
      `appointed` seat it strips, objected on the revoking seat (`state/gate.py::
      REVOCATION_DISPOSAL`), so `ban`'s derived openers are `determine` and `revoke`; a revocation's
      ban has no term and no closer but his death.
    values: [hold, contain, commit, oblige, succeed, tie, knot, reside, detain, ban]
    # ⚠ LOADER INVARIANT 6's SECOND HALF (`04 §B.13 #6`, `04:466-467`, `ID-14`): every kind's OPENER
    # set is declared. THIS ROW USED TO CARRY THE MAPPING BY HAND -- `openers: {hold: [confer,
    # create_record], contain: [move], commit: [], oblige: [], succeed: [], tie: [], knot: []}` --
    # a SECOND COPY of a fact `engine/season/loop/effects.py`'s own `_eff_*` bodies already state
    # structurally (which verb's `Tenure(...)` construction names which `kind`). Correct the day it
    # was hand-transcribed (2026-09-25) and silently wrong the day a new opener effect landed with
    # no matching edit here -- `CLAUDE.md` §8's every-rule-lives-once hazard. Plan position
    # `OPENERS-DERIVE` (2026-09-29) DELETED the hand-written mapping: `data/verbs.py`'s
    # `_derive_openers_from_effects()` reads the same fact by walking `effects.py`'s own source (an
    # AST scan for `Tenure(...)` calls inside each `@effect_for`-registered function), so there is
    # one owner and no second copy to fall behind. The holes are UNCHANGED and still true, MEASURED
    # the same way, now computed rather than read off this roster: `succeed`, `tie` and `knot` each
    # declare `writes: Tenure.since` (verb_table.yaml) and no effect constructs a Tenure of that
    # kind -- `tenure_kinds_without_an_opener()` still reports them. `commit` left the list at plan
    # position `7a` (`_eff_commit`) and `oblige` at `17a` (`_eff_oblige`), each by gaining an
    # opener, which the derivation saw without an edit here.

  hold_object_kinds:
    source: "`architecture/holonic_ARCHITECTURE.md` §15's Tenure table — *\"`hold` | Person → Office | Rung | Record | Proposition | 1 per object\"*. Item 16 of `proposals/2026-09-17-governance-and-behaviour/01_THE_BUILD_ORDER.md` (⊕ R13)."
    open: true
    note: >-
      ⚠ THE CLASSES A `hold` MAY POINT AT, AND THE ROSTER IS THE OWNER RATHER THAN A LITERAL IN
      `add_tenure`. `holonic §15` states the domain and the codomain of every Tenure kind and
      NOTHING CHECKED EITHER: `add_tenure` validated the KIND against `tenure_kinds` and
      `contain`'s DIRECTION, and let a `hold` point at anything at all. Measured 2026-09-17 on
      `build_realm(0)`, that admitted 16 `hold` Tenures whose SUBJECT was a faction — a
      Proposition, not a person — and `in_holdings` (which reads *a `hold` whose object is a
      Rung*) was consequently **false for every person over every rung in the world**. A seat
      whose `revocation` basis is `"holdings"` therefore refused every revocation forever while
      looking exactly like a working precondition.
      ⚠ **AN UNRESOLVABLE ID PASSES, AND THAT IS DELIBERATE RATHER THAN A HOLE.** `_rehome` exists
      because a Tenure may legitimately be added BEFORE its subject is in `w.persons`, so a guard
      that refused every unknown id would refuse the ordering the store is built to tolerate. The
      conjunct refuses only an id that resolves to a class NOT on this roster — a Site, or a
      person — which is what makes `Tenure(..., "fac_crown", "terr_T1", "hold")` raise while
      `Tenure(..., "p_late", "off_x", "hold")` still lands in `_unowned` and rehomes.
    values: [Office, Rung, Record, Proposition]

  hold_subject_kinds:
    source: "`architecture/holonic_ARCHITECTURE.md` §15 — the DOMAIN half of the same row: `hold` is a PERSON's edge."
    open: true
    note: >-
      One member, and it is a roster rather than an `is not None` because the codomain above is
      one too (§8 — the rule lives once) and because the next kind to acquire a domain check reads
      its own row here instead of growing a second spelling. A subject that resolves to none of
      the world's collections is UNKNOWN, not wrong, for the `_rehome` reason stated above.
    values: [Person]

  record_kinds:
    source: >-
      `architecture/meta/04_CODE_ARCHITECTURE.md` §B.5's synthesis call, ratified (ED-IN-0204): *"`Petition`
      and `Dispensation` become `Record` kinds ... two existence rows collapse into one"*, and PART A row
      11. The KEY LISTS are r2 `02_THE_WRIT_AND_THE_WORD.md` §A.3/§A.5's (ED-IN-0234, PROPOSED); plan
      position `15` builds them. `faction_sheet` is plan position `20-iii`'s (THE INFORMATION CLUSTER,
      narrative #14 §F -- `proposals/2026-09-12-emergent-narrative-primitives-v2/01_THE_TEN.md`
      proposal 14 -- `D1-a` of `proposals/2026-09-27-mc-v18-retirement-plan/PROPOSAL.md`).
    open: true
    note: >-
      ⚠ THE KEYS ARE EXACT, NOT A MINIMUM. `Record.__post_init__` (`state/carriers.py`) refuses a
      `subject_matter` whose key set is not its kind's IN EITHER DIRECTION, and refuses a kind that is
      not listed here -- r2 `05_LEDGER_AND_BUILD.md`'s ⊕L35. A missing key is an operand no reader can
      bind; an extra key is a second vocabulary. `text: []` is why every Record minted before this
      roster stays lawful: its `subject_matter` is `None`, which has no keys.
      ⚠ r2's `commission` (r2 item 11, plan position `19`) IS STILL NOT HERE, AND THE OMISSION IS
      DELIBERATE: it has no producer yet and lands with the effect that mints it. A kind nothing mints
      is a member no reader reaches (`ID-13`). (`faction_sheet` below is NOT r2's `commission` and
      does not stand in for it -- a commission there is a document conferring a charge; a sheet is a
      description of a faction. Read cold, the plan's *"commissioned by an act"* for a sheet means
      only that an act pays for it.)
      ⚠ `works` LANDED AT PLAN POSITION `24e` (r2 item 12, `04_MATTER_AND_WORKS.md` §A.6) WITH ITS
      READERS: `found` and `build` make what its `plan` names at the rung its `at` names, and
      `queries/world_q.py::ceiling` bounds a Site's condition by how many of its declared terms have
      matured. Its PRODUCER is the `create_record` that already runs (r2 §A.6.2 moment 1): an act
      declaring `kind: works` and `subject_matter: {plan, at}`. `plan` is a KIND -- a `rung_kinds`
      member for `found`, a `site_kinds` member for `build` -- and `at` is a RUNG id: "a <plan> at
      <at>". r2's `{plan: {as, kind}}` is not taken: the verb says whether a Rung or a Site is made,
      so an `as` key would be a second place saying it. ⚠ THERE IS NO `stage` KEY -- r2 §A.6.1
      RULED it out (an ungated write on `subject_matter`, which has no matrix row, and a second
      progress ladder beside `Site.condition`); the terms are `Record.stages`, matured at MATTER.
      ⚠ `faction_sheet` LANDED AT PLAN POSITION `20-iii` WITH ITS PRODUCER, `survey`
      (`loop/effects.py::_eff_survey`): a document whose content is `queries/faction_q.py::resolve`'s
      five-field view of ONE faction -- who is committed to it, the rungs and the seats they hold --
      RESOLVED AT THE MOMENT OF WRITING and frozen there, so it goes stale as the world moves and
      nothing re-reads it. ITS KEYS ARE `faction_q.Faction`'s FIELDS, IN THAT DATACLASS'S ORDER, and
      `faction_q.py` REFUSES AT IMPORT if the two drift: the view owns the shape, this row owns what a
      Record of the kind may carry (⊕L35 reads it), and the import check is what keeps two owners
      of one key list from disagreeing silently. It has NO addressee key, so `world_q.named` reads
      nobody out of it and a sheet summons no one into a question; its HOLDER learns what it says
      through the content deposit below, like any document -- which is the whole of *"read free by
      holders"*: holding a document is reading it, and no act is spent to do so.
      ⚠ THIS ROW IS ALSO A VOCABULARY OF THE `exists:` STEM. `requires_typed: {form: existence, kind:
      petition}` asks *a Record of kind petition exists* (`queries/world_q.py::WorldReader.read`), so a
      member here must never also be a `tenure_kinds` member -- `data/rosters.py` refuses the overlap at
      load rather than letting one reading silently shadow the other.
    values:
      text:         []
      dispensation: [terms, to, at]
      petition:     [terms, to, from]
      works:        [plan, at]
      faction_sheet: [proposition, members, holdings, seats, head]
      # v9 IN-12 step 10 (#453 §8.2, §9.3; K-19): A CONCEALED IDENTITY. ONE key, `terms`, and it names
      # the ACTOR, written by `conceal`'s effect whatever the act's `subject` (the one kind whose
      # `terms` does not follow `content.read_from` below); the Record's own id is the alias. Its
      # stages are the mint's (`_declared_stages`). Its reader is `state/attribution.py::anchor_of`:
      # an act by a person holding a cover whose `terms` is himself, while a stage is unmatured,
      # anchors on the cover's id. Not a `record_sourced_operands` kind: a cover answers no operand,
      # and `ledger_names` reads nobody out of it (`ABOUT_KEYS`).
      cover:        [terms]
    # HOW A MINTED DOCUMENT'S CONTENT IS READ OFF THE ACT, AND WHAT A HOLDER LEARNS FROM IT. One
    # owner for three facts the mint (`loop/effects.py::_mint_document`) and the deposit rule
    # (`loop/witness.py`) both read, so neither spells them.
    content:
      # A KEY IS READ FROM THE ACT'S OPERAND OF THE SAME NAME, EXCEPT WHERE IT IS LISTED HERE. `terms`
      # is what the document is ABOUT, which is the act's `subject` -- the one entity a computed act
      # always carries (`decision/choose.py::_payload_of`). A key naming a `requires_operands` member
      # is required (a missing one is `_operand`'s caller defect); a key naming none -- `at`, r2 §A.6's
      # place of discharge -- is read as declared and may be absent.
      read_from:
        terms: subject
      # THE KEY THAT NAMES WHOM A DOCUMENT ADDRESSES, stored as an id LIST whatever the act carried
      # (r2 §A.9.1 -- *"the id set under the addressee key its kind declares"*). One shape for one
      # key across every kind that has it.
      addressee: to
      # THE DEPOSIT RULE'S PREDICATE STEM. A person who comes to hold a Record holds
      # `(record, "content:<kind>", <subject_matter, frozen>)` in their own ledger (r2 §A.9;
      # `loop/witness.py::content_value` owns the frozen shape).
      predicate: content

  rung_kinds:
    source: "#353 §10 — the containment ladder. `contain : Rung → Rung`, one parent"
    open: true
    values: [person, hearth, community, settlement, territory, province, duchy, realm]

  scale_of_rung:
    source: >-
      Plan position `20-ii` (U9/R-04). `.designs/systems/_architecture/reference/
      scale_transitions_v30.md` §2's Scope column (ARCHIVED-NOT-CANON, quarantined -- read for
      VOCABULARY ONLY, per `CLAUDE.md` §1/§0.05; cited for the mapping's derivation, never as the
      reason it is correct). Canon's `Scope` cell per scale, verbatim: Object -- "one item, one
      wound"; Personal -- "one person"; Relational -- "small group, social agreement";
      Territorial -- "a duchy, a district"; Structural -- "a kingdom, an institution".
    open: false
    note: >-
      ⚠ **STATED BEFORE WRITING IT, PER THE PLAN'S OWN INSTRUCTION: THIS SOLVES ONE OF TWO
      PROBLEMS, AND NOT THE OTHER.** `workplans/2026-09-09-r-execution-plan.md:1622-1633`
      (unretracted by the later plan) drew the line: problem (1) is a VOCABULARY MAPPING -- the
      eight `rung_kinds` admit neither `faction` nor `world`, and canon's five scales are a
      DIFFERENT vocabulary again, so something must translate between the two ladders wherever a
      caller needs canon's scale-band language (Thread mechanics' Base Ob / Min Thread
      Sensitivity / Coherence auto-cost, `scale_transitions_v30.md` §2's own columns -- NOT read
      here, since `04:5` rules the `Base Ob` column thread-only and never an obstacle source,
      Jordan 2026-09-05). Problem (2) is REPRESENTABILITY -- making a `faction`- or `world`-scale
      corpus CASE buildable at all, which `rung_kinds` itself must answer (it is the roster
      `corpus_run.run_case` checks membership against) and which THIS roster does **not** touch:
      a `scale_of_rung` mapping from the eight rungs onto five canon scales does not, by itself,
      make a faction or world case representable, because neither `faction` nor `world` is a
      `rung_kinds` member for this mapping to receive as a KEY. Problem (2) is answered
      separately, by `harness/corpus_run.py::rescales` and the 54 `cases/exercises/*.yaml`
      overlays this same position lands (`H-95`).
      ⚠ **THE MAPPING ITSELF, DERIVED FROM THE SCOPE CELLS ABOVE, NOT INVENTED.** `person` is
      canon's own example of `Personal` ("one person") -- an exact match, no judgment call.
      `hearth`/`community` are sub-settlement social units, matching `Relational`'s "small group,
      social agreement" -- neither is a geographic-political unit the way `settlement` and
      everything above it is. `Territorial`'s own example is *"a duchy, a district"* -- `duchy`
      appears in the example by name, and `settlement`/`territory`/`province` are every rung
      strictly between `community` and `duchy` on the SAME containment ladder, none of them
      bigger than a duchy, so all four take `Territorial`. `Structural`'s example is *"a kingdom,
      an institution"* -- `realm` is the one rung above `duchy`, canon's "kingdom" by name.
      ⚠ **`Object` RECEIVES NO RUNG, AND THAT IS AN HONEST GAP, NOT AN OMISSION.** Canon's `Object`
      scale is "one item, one wound" -- sub-personal, a Thread-mechanic reading of damage to a
      thing or a wound on a body, which has no analogue on the CONTAINMENT ladder at all (nothing
      in `rung_kinds` sits below `person`). Mapping any rung onto `Object` to fill the cell would
      be exactly the fabrication `CLAUDE.md` §0.05 forbids -- "generate none automatically rather
      than fabricate" (`faction_q.py::head`'s own precedent). `SCALE_OF_RUNG` is therefore a
      TOTAL map on `rung_kinds` (every rung has exactly one scale) and a PARTIAL map onto canon's
      five scales (`Object` is reachable by nothing here).
    scale:
      person:     Personal
      hearth:     Relational
      community:  Relational
      settlement: Territorial
      territory:  Territorial
      province:   Territorial
      duchy:      Territorial
      realm:      Structural

  remit_acts:
    source: "#353 §11 — the CLOSED five remit acts, plus `convene`"
    open: true
    note: >-
      ⚠ H-52 turns on this roster. `ARCHITECTURE_V2.md` gates `open_case` on `remit:determine`,
      and #353's closed remit acts do not include opening a case — so V2 invented an eligibility.
      The row stays open; adding a value here would close it by hardcoding, which is the move the
      ruling above forbids.
    values: [issue, determine, confer, revoke, dispatch, convene]

  remit_default:
    source: "⚠⚠ NOT CANON. A TESTING FIXTURE, RULED BY JORDAN 2026-09-18: *\"anyway, for testing purposes for now, just build out a generic remit\"*."
    open: true
    note: >-
      ⚠⚠ **THIS IS A TEST FIXTURE AND IT IS OBVIOUSLY NOT A DESIGN. READ THIS BEFORE USING IT FOR
      ANYTHING.** It hands EVERY seated office EVERY remit act, which is exactly the authority
      `harness/populated.py` refused to invent on its own account: *"inventing one would silently
      hand somebody an authority nobody granted"*. That refusal was right and is not overturned —
      what changed is that Jordan asked for a generic remit SO THE GOVERNANCE VERBS CAN BE
      EXERCISED AT ALL, and a value that is transparently wrong is safer as a placeholder than a
      plausible one, because nobody will mistake *"every office can do everything"* for canon.

      WHY IT EXISTS. `H-71` closed 2026-09-18 (`ED-IN-0255`): a holder's remit now rides on their
      `hold` Tenure and `person_side_eligible` reads it. But of the 19 offices the populated realm
      seats, only THREE carried a remit — blocked by DATA, not by any mechanism. This roster is
      that data, provisionally.
      ⚠ IT BUYS FOUR VERBS, NOT EIGHT, AND THE FIRST WRITING OF THIS NOTE SAID EIGHT WITHOUT
      MEASURING IT. Measured on `build_realm(0)`, both arms: BEFORE, five of the nine were already
      formable off the three granted seats (`determine`, `dispatch`, `issue`, `requisition`, `open_case`)
      and FOUR were unreachable (`confer`, `convene`, `establish`, `revoke`). The default closes
      those four. `H-71`'s own `cite:` says the never-attempted set went 5 -> 4 and is consistent;
      the "eight" was invented. `CLAUDE.md` §0.1 pt 3 — a number without its measurement.

      ⚠ IT DEFERS TO ANY REAL REMIT AND NEVER OVERWRITES ONE. The three grounded overlays
      (NPC-008 `issue`; NPC-033 `issue`/`dispatch`; NPC-038 `issue`/`determine`/`dispatch`) keep
      exactly what their case text supports. This fills ONLY an empty remit.

      WHAT REPLACES IT, and the shape is already known. A remit belongs to a POST, and an office is
      a post plus a scope. ⚠ BUT `Office.post` DOES NOT CURRENTLY HOLD A POST — measured
      2026-09-18, the realm's 19 posts include `"Cardinal Justice"`, `"Queen (Widow Regent if
      Almud eliminated)"`, `"Senior Jarl of the Western Highlands"` and `"Archbishop's
      Representative / Father"`, each fusing a post with a scope, a condition or a relationship.
      Jordan, same session: *"cardinal is a post / king is a post / confessor is a post"*. So
      per-post remits need the post field normalised first, and that is a prior unit rather than a
      detail of this one.

      ⚠ AND ECCLESIASTICAL POSTS ARE THE AWKWARD CASE, named here so the later work does not
      rediscover it. Jordan: *"Confessor governs the Church tho"* and *"they are super weird in
      that they don't have territories at first"*. So a Confessor's scope is a BODY
      (`rosters.yaml` maps `"Church of Solmund": ecclesiastical`) and NOT a rung, with territory
      arriving later if at all. `data/cast.py::title_of` says `Doux`, `Confessor`, `Father` and
      `Prince` *"are real titles that govern no rung"* — correct about the RUNG LADDER and wrong
      if read as governing nothing. No schema change is needed: `Office.rung` is already
      `Optional` (*"null is the office-cluster case (S6.2)"*) and `Office.body`/`faction` carry
      the institution.

      ⚠ IT POINTS AT `remit_acts` RATHER THAN RESTATING IT. The first writing spelled the same six
      values here, and a test pinned the two sets equal — so a seventh remit act meant editing two
      rows or reddening a test for an unrelated reason (§0.05 cl.3). "Every remit act" is what the
      fixture MEANS, so the pointer states the intent as well as removing the copy. Narrowing it
      later means replacing `from_roster:` with a `values:` list, which the loader accepts and
      which is a visible edit rather than a silent divergence.
    from_roster: remit_acts

  witness_channels:
    source: "#353 §28 `:1004` — the five channels the fan-out computes an observer set from · order and `claim_source:` from proceedings `19_PLAN.md` step 4 (a)/(b), plan position `15d`"
    open: true
    note: >-
      The channels are named; their PREDICATES are `H-33` and are graded `assumption` with total
      fan-out as the default and the control. Naming a channel is not specifying it.
      ⚠ ORDER IS SEMANTIC HERE (position `15d`): it is the PRECEDENCE, strongest first. A person
      admitted to one Event by several channels is credited to the FIRST of them
      (`epistemic.observers_for`), and that one channel sets the deposit's source through
      `claim_source:` below. The order follows `19_PLAN.md`'s ordinal of remove (*firsthand >
      knot-sourced > told*): presence first, so a person who WAS IN THE ROOM is never downgraded to
      hearsay because they also hold the changed thing or sit in the office whose remit covers it
      — which is what `19_PLAN.md` step 4's *breaks if wrong* names. Between the two `told_by`
      channels the order decides only which channel is reported, never the source: the holder of
      the changed thing before the public record. Editing the order changes who holds what as
      hearsay, a game change, which is why it is data.
      ⚠ `post_remit` IS LAST, AND THAT IS THE SAME ORDINAL TAKEN ONE STEP FURTHER (plan position
      `17a`, 2026-09-29). `19_PLAN.md`'s ordinal of remove is *firsthand > knot-sourced > told >
      inferred* in full (`:517`), and `post_remit` now mints `inferred`, so it ranks below both
      `told_by` channels: an obligee who is ALSO admitted by the public record (`chronicle`, every
      `binding_decision` emission) holds the Event `told_by`, never downgraded to `inferred`. At
      `15d` it sat fourth with source `told_by`, where its place among the told channels decided
      nothing; left there with `inferred` it would have decided the source against the ordinal.
      `claim_source:` is keyed on exactly these five and names only `claim_sources` members
      (`data/rosters.py` refuses at import otherwise). `chronicle` is `told_by` on
      `04_CODE_ARCHITECTURE.md` §C.6's own row, and so is `post_remit`'s `inferred` (§C.6: *"the
      change claims, `inferred`"*). ⚠ `post_remit` WAS `told_by` from `15d` to `17a`, following
      `19_PLAN.md` step 4 (*"a document or a remit gives told_by"*) -- right for the channel it
      then was, a remit-holder learning of every covered act realm-wide. `17a` REPLACED that
      channel (r2 item 9: *"the place-blind remit channel -> obligees co-located, minting
      `inferred`"*), so step 4's remit clause describes a predicate that no longer exists; see
      `epistemic._ch_post_remit` for what was retired and what it cost, measured.
      ⚠ `witness_key` ADMITS THE EVENT'S OWN ANCHOR AS WELL AS ITS KNOT PARTNERS
      (`_ch_witness_key`'s `pid == anchor`), and one channel carries one source. So an actor with
      NO PLACE -- whom `co_located` cannot admit -- holds their own act `firsthand_via_knot`, under
      the event id (S28's knot deposit). §C.6 separates the two (*"change claims about self; via a
      knot, the partner's deposits"*) and one channel cannot. MEASURED at `15d`: reached only by
      probe `P21`'s placeless cohort (`crowd_1`, now `firsthand_via_knot` in `runs/TRACE.txt`,
      where it was `firsthand`); in Carin's world, the realm and the 143-case corpus every anchor
      that witnessed its own Event was also `co_located`, so presence credited it first.
    ordered: true
    values: [co_located, witness_key, document_key, chronicle, post_remit]
    claim_source:
      co_located:   firsthand
      witness_key:  firsthand_via_knot
      document_key: told_by
      chronicle:    told_by
      post_remit:   inferred

  claim_sources:
    source: "#353 §20 — how a Claim came to be held"
    open: true
    note: >-
      ⚠ Jordan, 2026-09-02: *"our understanding of all other words and actions is subjective and
      singular."* Every value here is a way ONE person came to hold ONE claim. A source that
      described a shared or aggregated understanding would contradict the ruling, not extend it.
    values: [firsthand, told_by, inferred, firsthand_via_knot]

  strata:
    source: "#353 §27 — the five strata, in canonical resolution order"
    open: true
    note: >-
      ⚠ ORDER IS SEMANTIC HERE, not alphabetical: the fold resolves in this sequence, so editing
      the order changes which acts see which world. That is a game change, which is precisely why
      it belongs in data rather than in a body.
    ordered: true
    values: [movement, binding_decision, contested_physical, uncontested_material, social]

  eligibility_kinds:
    source: "#353 §9.2 / ARCHITECTURE_V2.md §E4 — the four ways a verb can be made available"
    open: true
    note: >-
      ⚠ `capability` IS NOT AND MUST NEVER BE A MEMBER. #353 §9.2: "`capability` supplies dice and
      GATES NOTHING… The only class-shaped gate in the design is Thread Sensitivity." An office
      makes an ORDINARY verb eligible; no verb exists only for office-holders. Adding a fifth kind
      is a DESIGN CHANGE — a new way to make a verb unavailable to someone — and not a table edit,
      so it needs a ruling before it needs an entry.
      This roster was itself a literal in `shape.py` for about ten minutes, and the guard Jordan's
      ruling earned caught it. Recorded because a guard that has never fired on its author is one
      nobody has tested.
    values: [own, remit, hold, presence]

  # The season-side roster of PURSUITS (`ED-IN-0261`), read from the single owner. IN-08's cells
  # commit (B-G) swapped the owner block to the fifteen; this row's values move with it.
  pursuits:
    source: >-
      references/descriptor_registry.yaml `pursuit_roster`, count 15 (ED-IN-0261), exported to
      engine/engine_params/descriptors.json behind a BLOCKING --check (tools/export_descriptors.py).
    open: true
    note: >-
      ⚠ **READ FROM THE SINGLE OWNER, NOT RE-TYPED.** `H-46` was closed by IN-43 AS FRAMED: the
      fifteen pursuits over seven axes (`ED-IN-0261`) are what this roster carries since IN-08's
      cells commit. JORDAN, 2026-09-02, VERBATIM: *"please note that convictions roster and axes
      etc may be modified in future."* Populating a roster from a single-owner export is a DATA
      EDIT, which the same ruling says is the correct shape; `open: true` says in data that the
      roster may change.
      ⚠ **THESE ARE PURSUITS AND THEY ARE NOT AXES.** The row immediately below carries SEVEN
      bipolar axes; a person's pursuits are weights over THESE FIFTEEN, and they reach the axes
      only through `tables.pursuit_projection` (15×7). Before `U3` this file held one index set
      doing both jobs.
    # ⚠⚠ **NO `values:` HERE, AND THAT IS THE WHOLE POINT OF THE ROW.** A first writing of `U3`
    # listed the thirteen names in this file, and that was a SECOND ROSTER —
    # `tests/valoria/test_conviction_roster_single_owner.py` exists because three incompatible
    # conviction rosters once shipped at the same time (nine names in
    # `systems/characters/sim/conviction.py`, eight in `systems/world/sim/npe.py`, thirteen
    # registered) and the disagreement silently disabled ED-912 §6.1's Conviction Scar. That guard
    # scans PYTHON, so a copy in YAML would have slipped past it while being the same defect.
    # `data/rosters.py` binds `PURSUITS` from `engine.substrate.descriptors` (as `CONVICTIONS`,
    # the leaf's own unrenamed name) — the one leaf reader, fed by the one exporter, from the one
    # owner at `references/descriptor_registry.yaml:pursuit_roster`. This row carries the
    # SOURCE and the NOTE, which is what a roster row is for when the values live somewhere better.
    # ⚠ `from_descriptor:`, NOT `values: []` (2026-09-15). This row carried an EMPTY list
    # while the real thirteen arrived by a separate direct import in `data/rosters.py`, so
    # `roster("pursuits")` returned `frozenset()` — the "membership test silently false"
    # outcome `roster()`'s own refusal text forbids, in the file whose header promises the
    # opposite. `from_descriptor` is the mechanism ED-IN-0230 built; this is the row that
    # motivated it, finally migrated. It also puts the data-side `forbidden:` bar within
    # reach of this roster, which a direct import cannot do.
    from_descriptor: pursuit_roster

  pursuit_axes:
    source: >-
      references/descriptor_registry.yaml `axis_roster` — SEVEN bipolar axes, both poles named
      (ED-IN-0261), scale "[-1,+1] bipolar; negative = the first-named pole, positive = the second".
      Owned in code by descriptors.py's `axis_roster` leaf.
    open: true
    forbidden: [exposure]
    note: >-
      ⚠⚠ **SEVEN SINCE IN-08's CELLS COMMIT (`ED-IN-0261`).** What follows is the history of the
      roster's shape; the count it argues about was four, and it is seven now.
      ⚠⚠ **FOUR, AND FOUR WAS THE WHOLE COUNT — THIS ROW USED TO SAY "FOUR OF THIRTEEN".** It read
      *"#353 says 'the closed 13' and NEVER ENUMERATES THEM ... this roster is NOT the closed 13 and
      must never be cited as it"*, and carried `incomplete: {have: 4, target: 13}` in data. That was
      an honest statement of a CONFLATION, not of a shortfall: the thirteen are CONVICTIONS and the
      four are AXES, and one index set was doing both jobs.
      ⚠ **THE OLD FOUR WERE NOT AXES AT ALL.** They were `Precedent` (one of the thirteen
      convictions), plus `self_preservation`, `suspicion` and `harm_borne` — three names the chain
      happened to use in probes `P31`/`P37` and PLAN §3.2. A roster mixing one conviction with three
      ad-hoc scalars could not be projected onto anything.
      ⚠ **THE FIX IS THE ONE THIS ROW ITSELF PREDICTED.** Its previous note closed: *"`key_substrate_v30.md`
      §2.5 has THIRTEEN convictions projecting onto FOUR axes through a 13×4 matrix ... V2 §F2's
      formula indexes convictions BY axis, i.e. treats them as ONE index set ... It is the likeliest
      thing to change when `H-46` closes."* `U3` makes that change WITHOUT closing `H-46`, which
      stayed open until IN-43 closed it as framed (2026-10-08): the roster above holds the thirteen,
      this row holds the four, and `tables.pursuit_projection` is the 13×4 between them. What V2
      §F2 spells `conviction[axis]` is now computed rather than looked up —
      `Σ_conv conviction[conv] · projection[conv][axis]` — so the formula is unchanged in shape and
      its index set is no longer overloaded.
      ⚠ `exposure` IS FORBIDDEN AS A BARE AXIS NAME and the loader RAISES on it — #353 `:1897`
      names "The Exposure collision — three senses of one word, including a need scalar and a
      per-person tally". Spell the sense you mean.
      ⚠⚠ **THE `values:` LIST IS GONE AND THAT IS THE REPAIR, NOT A REGRESSION (2026-09-14,
      ED-IN-0230).** This row used to carry its own literal copy and claimed, right here, that
      *"the engine substrate already single-owns this tuple, so a fifth axis or a rename is one
      edit there and a loader refusal here rather than two rosters drifting apart"*. **That
      refusal did not exist.** MEASURED by AST across the whole tree: exactly ONE module imports
      `engine/substrate/keys.py::AXES` — `engine/substrate/__init__.py`, re-exporting it — and
      NOTHING under `engine/season/` reads it. So the two literals could disagree in either
      direction in silence: a fifth axis in `keys.py` alone left `decision/choose.py` scoring on
      four, and a fifth here alone left the season engine scoring on five while `keys.py`
      invariant 6 rejected every Key that named it. Two failures, opposite directions, neither
      side able to see the other. A note asserting a guard that is not there is worse than no
      note, because it is trusted.
      ⚠ **`from_descriptor:` IS THE FIX AND IT IS THE `conviction_roster` PRECEDENT.** The 13
      Convictions were literals in two subsystems until 2026-08-24, when nine-vs-eight-vs-thirteen
      was found to have silently disabled a ratified mechanic; the roster moved to
      `references/descriptor_registry.yaml` with `engine/substrate/descriptors.py` as the one
      code-side reader. The axes are the same object one level up and get the same treatment.
      `keys.py::AXES` now reads that leaf too, so a fifth axis or a rename is genuinely ONE edit —
      `axis_roster.names` — and both readers see it.
    from_descriptor: axis_roster

  # IN-08 H10: the religious affiliations `Person.conviction` is keyed on (ED-IN-0251 R1/R2), read
  # from the single owner like the two rows above. `tables.incompatible` is keyed on these.
  affiliations:
    source: >-
      references/descriptor_registry.yaml `affiliation_roster` (count 4, scale 0-5), exported to
      engine/engine_params/descriptors.json behind a BLOCKING --check (tools/export_descriptors.py).
    open: true
    note: >-
      AN AFFILIATION IS A SIDE, NOT A PURSUIT. The pursuit `doctrine` is how much of a person's
      action concerns religious matters at all; `Person.conviction` says which affiliations they
      hold and how intensely. Neither is the faction `Church of Solmund`.
    from_descriptor: affiliation_roster

  question_sources:
    source: "ARCHITECTURE_V2.md §F1 (Q1–Q3) · PLAN.md `W5` (Q4 `need`) · folded to two at position `11a`, r2 `01_ATTENTION_AND_REACH.md` §A.2"
    open: true
    ordered: true
    note: >-
      ⚠ FOLDED FROM FOUR TO TWO AT POSITION `11a` (`ARCH §B.13` `ID-13` -- a declared source that
      reaches no code is the defect, not a design worth keeping). `date_due` and `band_crossed`
      MEASURED zero questions in every world the engine could build: Q1's addressing clause
      admitted every person unconditionally and its route out was dead (CALENDAR emitted no Event
      for a fired Date); Q3 keyed its Question on the crossing's VERB where an id was needed
      (`H-110`), so `occasioned_by`'s search could never match. Both fold into `claim_landed`
      rather than vanish -- the underlying Event (a fired date, a band crossing) is already
      witnessable and already deposits a claim; what was missing was a way for that claim to reach
      someone who was not literally standing where it happened, which `reach`/`place_of`
      (`queries/world_q.py`) now supply as a FILTER over the claims a person's own ledger already
      holds, never as a new witness channel (`01` §A.4.4).
      ⚠ V2 §F1 SAYS "EXACTLY THREE SOURCES, AND BY NOTHING ELSE" AND WAS WRONG BY ONE. PLAN `W5`:
      "**Without Q4 an NPC with a standing ambition and a quiet season forms no candidates at
      all**, which is most of the NPC corpus" (#353 `:509`, `:605`, `:1297`). A closed set that
      turned out to be missing a member is the strongest possible argument for keeping closed sets
      in data.
      THE ORDER IS A TIEBREAK WITHIN AN ATTENTION TIER (v9 IN-57, RS-22): `questions_for` sorts on
      `world_q.attention_key`, a tiered read of the person's own state, and `(order[q.source],
      q.id)` breaks ties inside a tier, so editing this order changes which question a
      budget-bounded person answers first only among questions of one tier.
      ⚠ BEFORE IN-57 THE WHOLE SORT WAS `(order[q.source], q.id)`, so WITHIN one source the
      tiebreak was `q.id` — and for `claim_landed`, the source that supplies most of the corpus's
      questions, `q.id` carries a CONTENT HASH minted off the depositing Event. MEASURED over 89
      corpus baselines: the leading source is SHARED with at least one other question in **801 of
      1,068 deliberations**, so three quarters of the time this roster's order did not decide the
      answer and a hash did. Recorded 2026-09-04 by the `W-D` adversarial pass; disposition on
      `H-54`. Within a tier `q.id` is still the last tiebreak.
    values: [claim_landed, need]

  referent_classes:
    source: "v9 IN-53 (H-207 'VACANCY AS NEED', DECISION 2026-10-13 D1)"
    open: false
    note: >-
      THE CLASSES A QUESTION MAY CARRY A REFERENT AS, and the closed set a verb row's
      `referent_class:` column may name (`verb_table.yaml`, validated by `data/verbs.py`). A CLASSED
      referent is a second partition of a question's referents (`state/carriers.py::Question.classes`),
      beside its plain `referents`: a row declaring a class forms ONLY on referents carried as that
      class, and a row declaring none forms ONLY on the plain ones, exactly as before IN-53
      (`decision/options.py::opening_set`, through `VerbRow.referents_of`). It exists because
      `opening_set` has no World (L2) and cannot ask what kind of thing an id is. `Office`: the
      vacant seats a person may fill (`queries/world_q.py::vacancies`, IN-53) AND the seats he has
      been told of (`seats_named`, v9 IN-10 (a)), which `questions_for` adds to the question the
      person answers (`_stamped`); a class is the carrier's own type name, so a
      stamp of a type this roster does not name is refused at the Question's construction.
      `Record` (v9 IN-09, H-203, DECISION 2026-10-13 [ASSUMPTION; medium; Jordan to correct]): the
      writs a person HOLDS (`queries/world_q.py::writs_held` -- a live `hold` on a Record of a kind
      `data/verbs.py::RECORD_REFERENT_KINDS` derives from the rows declaring this class), which
      `questions_for` adds to the question he answers beside his seats; only `comply` declares it
      (`evade / defy` and `construe` were typed beside it and reverted, executing 0 times; H-203).
      REVERT: drop the value and the row's column.
      `Rung` (v9 IN-45 `migrate`, H-168 limit 1, [ASSUMPTION; medium; Jordan to correct]): the
      places a person has been told of and could settle in (`queries/world_q.py::places_named` --
      a Rung his own ledger names, the §10 ladder seats him in, and he does not already live
      under), which `questions_for` adds to the question he answers beside his seats and writs;
      `migrate` declares it (and `requisition`, below), so its `to` binds ANOTHER place rather than the single referent
      of whatever he was asked about (most often his own residence). The destination channel H-168
      names, on IN-53 D1's partition and `seats_named`'s knowledge source: no operand is added
      (`to` still binds the referent, `decision/options.py::_derive_operand`) and no Record kind.
      REVERT: drop the value, `migrate`'s column and `places_named`'s splice.
      v9 IN-49 `requisition` (H-163 limit 3, [ASSUMPTION; medium; Jordan to correct]): AND the larders a
      seat may requisition (`queries/world_q.py::larders_in_purview` -- a Rung his own ledger names, holding
      the fixtures' requisition of their matter, inside the purview of a seat of his granting the remit act
      of a row declaring this class, `data/verbs.py::RUNG_REMIT_ACTS`, and not that seat's own rung,
      its treasury), stamped after the places and
      never twice; `requisition` declares it beside `migrate`, so its `subject` binds a stocked rung in
      purview rather than whatever he was asked about. The class is shared, as `Office` is between
      `confer` and `oblige`: each row forms on both sources and the fold disposes. REVERT: `requisition`'s
      column (which empties `RUNG_REMIT_ACTS`) and `larders_in_purview`'s splice.
    values: [Office, Record, Rung]

  person_predicates:
    source: "#353 §14 `:331` — `marks[]` … \"heritage · grade · Church standing · office · residence\""
    open: true
    note: >-
      THE PREDICATE VOCABULARY `standing` NEEDS (PLAN `W5`). A Claim carries `(subject, predicate,
      value)`; `standing` pairs claims ABOUT ME by predicate, so without a vocabulary "pairs by
      predicate" is pairing on a free string. #353 `:331` supplies one: these are the five things
      `marks[]` records about a person, which is the corpus's own list of what is readable off
      someone. Open, because a claim may assert something `marks[]` does not record.
    values: [heritage, grade, church_standing, office, residence]

  view_builder_rules:
    source: "#353 §18 `:623` — \"at most K claim ids from the holder's OWN ledger -- built, not filtered\""
    open: true
    note: >-
      ⚠ "BUILT, NOT FILTERED" SAYS WHAT A VIEW IS NOT AND NEVER SAYS WHICH K. PLAN `W5` names the
      gap: "`K = 12` says nothing about **which** K, and the instrument takes the last k". Each
      value here is one rule for choosing WHICH ids; `H-53` is the row, `recent` is its default,
      and all three are swept. `recent` is the instrument's incumbent and is kept as the default so
      the sweep has an honest control — not because it is argued for.
    values: [recent, highest_confidence, question_relevant]

  question_aggregation:
    source: "PLAN.md §1.4 hole 15 / `H-54` — \"nothing says how many questions a person forms per season\""
    open: true
    note: >-
      ⚠ THE INSTRUMENT ANSWERED THIS SILENTLY FOR FOUR REVISIONS. `deliberate` took `qs[0]` — the
      first question in `question_sources` order — with no row, no marker and no alternative, so
      an `absent` hole was being FILLED inside a subscript. That is `G1`, and it was decisive
      rather than cosmetic: `question_sources` is ORDERED, so `qs[0]` silently meant *a Date
      always beats a need*, an unruled priority rule that decides what every NPC does first.
      `first` is that same behaviour DECLARED, kept as the default because it is the incumbent
      and a sweep needs an honest control — not because it is argued for.
      `all` gives the person every question and lets the budget triage them, which is what §26.3's
      triage is FOR; `one_per_source` is the middle reading. `H-54` is the row.
    ordered: true
    values: [first, all, one_per_source]

  scene_packing_rules:
    source: "`W17` — which interactions share one scene. `player_agency_v30.md` §6.3 says a scene HOLDS 1–3 and never says WHICH"
    open: true
    note: >-
      ⚠ THIS IS `H-53`'S DEFECT ONE LEVEL UP, AND IT WAS FOUND THE SAME WAY — by an adversarial
      pass reading the body rather than the summary. `H-76` registers HOW MANY interactions a
      scene admits; nothing registered WHICH ones share one, and `make_chooser` answered it in a
      comment: *"the default policy fills scenes greedily in score order"*. H-53's own row says
      the shape of that error out loud: *"H-09 supplies `K = 12` and NOT WHICH K; the instrument
      takes the last k, WHICH IS AN INVENTION."*
      `greedy` is that invention DECLARED and kept as the sweep's control, not argued for.
      `one_per_scene` is the pre-ruling accounting — one interaction per scene action — and is
      the honest floor. `by_subject` is the reading `player_agency_v30.md` §6.3's own words
      suggest: *"one scene opportunity pursued"* is about SOMETHING, so the interactions sharing
      a scene are the ones sharing a subject. `H-78` is the row.
    values: [greedy, one_per_scene, by_subject]

  claim_subject_rules:
    source: "#353 §20 — `Claim := (id, holder, subject, predicate, value, ...)`, and NOTHING says what `subject` is for a WITNESS deposit"
    open: true
    note: >-
      ⚠ FOUND BY RUNNING ARTIFACT 2, AND ITS CONSEQUENCE IS THE WHOLE NARRATIVE SUBSTRATE.
      WITNESS deposited every claim with `subject = event.subject`, which the fold sets to the
      ACTOR. So every claim in the world is "I hold that <actor> did <kind>", and §F1's Q2 —
      *"a claim landing in the holder's ledger whose subject is that person, SOMETHING THEY HOLD,
      or a Proposition they have committed to"* — can never fire on its second clause, because no
      claim's subject is ever an object. Measured on NPC-088: the bailiff held 23 claims about
      Carin across three seasons and formed ZERO questions. Nothing propagates, nobody but the
      actor ever has a reason to act, and no arc walks past one link.
      `actor` is the incumbent, kept as the sweep's control. `per_change` mints one claim per
      `StateChange` with the CHANGED THING as its subject, which is what makes "something they
      hold" reachable and what #353 §13.1's own narration needs — a copy that can be found,
      carried, hidden or destroyed. `both` keeps the actor claim and adds the per-change ones.
      ⚠ **AND SINCE 2026-09-03 THAT LAST CLAUSE HOLDS ONLY WHERE `changes[]` IS NON-EMPTY.** An
      Event that WROTE NOTHING has no per-change subject to add, and under `per_change` and
      `both` alike its deposit is now minted about WHAT THE ACT NAMED instead of about the actor.
      That is what makes a listener's Q2 reachable at all — a claim about the teller can never
      satisfy *the holder, or something they hold* — and it is what took `R3` from 0 of 30 to 30
      of 30 (`H-102`).
      ⚠ **THE PRICE, STATED RATHER THAN LEFT TO BE DISCOVERED: WHERE THE ACT NAMED SOMETHING, NO
      LEDGER RECORDS WHO SPOKE.** For a speech, a telling, a compliance or a refusal THAT NAMES ITS
      SUBJECT, the deposit no longer names the actor, so under the DEFAULT arm the attribution of
      that act is in nobody's ledger. ⚠ **NARROWED 2026-09-04 — the first writing said this of every
      write-nothing act and that is not what the code does.** The replacement is guarded on
      `any(refs)`: a write-nothing act that names NOTHING leaves `out` untouched, and the actor
      survives — via the standing `out or [anchor]` fallback under `per_change` (`e.subject` until
      G1b deleted the field; `anchor_of` returns the same actor), and because the
      actor is already in `out` under `both`. So the price is paid exactly where there is a named
      subject to pay it with, which is also the only place the Q2 reachability it buys applies.
      ⚠ **AND THE NARROWING IS CODE-TRUE BUT CORPUS-VACUOUS, SAID HERE BECAUSE THE FIRST WRITING OF
      IT READ AS A LIVE CASE.** Measured 2026-09-04 by wrapping `claim_subjects` over a full
      `corpus_run`: **17,352 write-nothing deposits, 17,352 of them naming something, ZERO reaching
      the `refs == []` fallback.** Every Act the fold mints comes from `pack_scenes`, which sets
      `payload={"subject": ...}` from a Candidate drawn from `q.referents`, and all four question
      sources produce non-empty referents — so the guard's false arm is unreachable from the corpus
      as it stands. The branch is correct code and the sentence above is true OF it; what is not
      true is that anything exercises it. Falsifier, and it is what makes this a measurement rather
      than a reading of the source: a non-zero no-refs count would witness the case, and the count
      is zero. `H-111`'s refusal question is where a witness would first appear.
      Attribution is `T-d`'s subject and `H-107`'s — an Event carries no actor, and since G1b
      (2026-09-26) no `subject` either: `H-107`'s field is deleted and attribution reads
      `causes[]` through `state/attribution.py`. The `actor` arm is untouched and is
      where the incumbent behaviour survives.
      ⚠ **AND THE REASON IT REPLACES RATHER THAN JOINS IS RECORDED HONESTLY, BECAUSE IT IS NOT A
      DERIVATION.** Joining mints one extra claim per write-nothing Event; the cap evicts on
      `(confidence, recency)`; `H-40`'s decay sweep then reported a minimum confidence of 100 in
      all three arms. **That interaction is a real finding — a damping loop made unobservable by
      an amplifying one, which is `H-103`'s cite — and it is not the ground for the choice.** The
      ground is that the teller is not the news.
      ⚠ THIS ADDS NO FIELD TO `Event`. `PLAN.md` §8.1 forbids adding a `target` or `actor` field
      to Event, and this needs neither: `changes[]` already names what was written, so the
      subject is READ off the Event the design already has. `H-79` is the row.
    values: [actor, per_change, both]

  observation_deposit_modes:
    source: "`W-B`. #353 §28 says WITNESS deposits a Claim and never says whether a deposit may carry WHAT THE FOLD READ, or to whom. §20 types the Claim and stops there."
    cite: "H-122"
    open: true
    note: >-
      ⚠ THIS IS THE WRITE SIDE OF `H-116`, AND THE READ SIDE ALREADY SHIPPED. `belief_contradicts`
      evaluates the verb's own `requires_typed:` cell against `LedgerReader`, so the vocabulary a
      claim must be in to reach §F1 clause 4 is `stores:<kind>` / `condition` / `contain.path:<to>`
      / `claim.held` / `exists:<kind>` / a relation stem — the strings `Observation` DERIVES from
      the cell's own fields. Every deposit before `W-B` carried `predicate = e.kind` and
      `value = True`, which is a DISJOINT vocabulary and a value no comparator can send to False,
      so clause 4 could not fire in any run. Measured on NPC-088 over 3 seasons at seed 0: **600
      claims in ledgers, 0 of them in the derived namespace, 0 of them falsy.** The channel was
      closed by a theorem, not by a bug.
      `none` is THE CONTROL and is the behaviour before `W-B` exactly, so every measurement of this
      item has a baseline (`CLAUDE.md` §0.1 point 4). `actor` deposits an act's reads to the actor
      alone — the minimum that closes the loop, and the arm where every claim minted is one its
      holder can read back, because `belief_contradicts` binds `from` to the person's OWN
      containing rung and `actor` to their own id. `total` gives the reads the same fan-out the
      Event itself got, which is #353 §61's shape for the Event and is not stated for the read.
      ⚠ THE OBJECTION TO `total` IS §F1'S EPISTEMOLOGY AND IT IS WEAKER THAN IT LOOKS. The fold
      reads with `WorldReader` — world truth — so fanning a read to everyone teaches everyone a
      VERIFIED fact, and §F1 rests on people acting on beliefs that may be wrong. But
      `LedgerReader` resolves on `(when, confidence)` and the cap evicts, so a season-1 observation
      of `stores:grain = 5` is a STALE belief the moment the granary empties, and a person acting
      on it acts wrongly. The epistemic gap survives as RECENCY rather than as absence. That is a
      reading, not a result; the arm is swept and the measurement is on `H-122`.
      ⚠ UNKNOWN IS NEVER DEPOSITED IN ANY ARM. A read the world could not answer is the
      INSTRUMENT'S gap, and `H-94`'s `operands_for` refuses to mint an act with a hole precisely so
      that gap does not become a false belief; depositing UNKNOWN would reintroduce it from the
      other end. It is inert besides — it reads back UNKNOWN and can contradict nothing — while
      still costing a ledger slot the cap evicts somebody else for.
    values: [none, actor, total]

  combat_degree_bands:
    source: "JORDAN, 2026-09-03, VERBATIM: *\"kill/wound degrees should be directly taken from scene combat, which is what actually needs to be called when kill/wound is considered.\"* And 2026-09-04: *\"the combat engine determines the result there. your code just has to accept the result.\"*"
    cite: "H-98"
    note: >-
      ⚠ THE ORDER IS SEMANTIC AND IT IS SEVERITY, WORST FIRST. `shape.py` unpacks this row
      positionally (`FELLED, WOUNDED, UNTOUCHED = COMBAT_BANDS`), so reordering it renames the
      bands rather than reordering them, and `verb_table.yaml`'s `kill / wound` keys its
      degree-keyed `writes:`/`emits:` on the same three strings. A drift between the two is loud
      at the first act that folds: `VerbRow.writes_at` refuses an unlisted degree and PRINTS BOTH
      SETS.
      ⚠ THESE ARE NOT THE LADDER'S FOUR BANDS AND MUST NOT BE CONFUSED WITH THEM. `S39.4` reads
      four bands off a MARGIN and its single owner is `engine/dice_engine/dice_engine.py::
      degree_from_net`, which `shape.degree_of` IMPORTS AND CALLS. Combat is EXEMPT from that
      ladder by the ruling above: its bands are a READ of the engine's own `WoundTracker` — the
      subject went down, the subject bled, the subject was untouched — and every one of the three
      is a field `combat_seam.resolve` returns in `wound_state`.
      ⚠ WHY THERE IS NO FOURTH. The engine does not separate a DECISIVE win from a NARROW one
      beyond wound count on the victor, so an `Overwhelming`-vs-`Success` split has NO SOURCE IN
      THE DATA and is not invented. That is the whole of what survives in `H-98`.
    values: [Felled, Wounded, Untouched]

  wound_quantities:
    source: "`seam/wrappers/combat.py::resolve`'s `wound_state` -- the fields of the engine's own `WoundTracker` that the seam lifts per party before `wrapper.fight` collapses the scene to an int. Jordan 2026-09-02: *\"I do not want definitions etc to be hardcoded\"* -- the list was a literal inside `_state`."
    cite: "H-98"
    note: >-
      ⚠ THIS ROW IS THE CLOSED SET `combat_band_edges` IS VALIDATED AGAINST, AND `_state` READS IT TOO.
      One owner, so an edge cannot name a quantity the seam does not lift: `_state` builds each
      party's `wound_state` from THIS list and refuses, by name, a member the `WoundTracker` does not
      carry; `combat_band_edges` refuses at load an edge on a member that is not here. The ORDER is
      the order `wound_state` has always been built in (`felled` first), kept so the lifted dict is
      identical to the literal it replaced.
      ⚠ A QUANTITY IS A NUMBER OR A BOOLEAN THE TRACKER COMPUTES, NEVER A DERIVED RATIO. A ratio
      (`health_remaining / health_full`) is a magnitude `wound_harm_models` already reads at its own
      site; an edge over one would be a second reading of the same quantity.
    values: [felled, wounds, max_wounds, health_remaining, health_full]

  combat_band_edges:
    source: "`H-98`, plan position `8` (closed; `workplans/valoria_master_workplan_v8_part4.md`, retired, at `FORK:7b619328`) -- the edge between the bands was two literals in `seam/ladder.py::combat_degree` (`if st[\"felled\"]` / `st[\"wounds\"] > 0`). Jordan 2026-09-02: *\"I do not want definitions etc to be hardcoded\"*. The bands themselves are `combat_degree_bands`, ruled 2026-09-03/04 as a READ of the scene."
    cite: "H-98"
    keyed_on: combat_degree_bands
    note: >-
      ⚠ ONE EDGE PER BAND EXCEPT THE LAST, KEYED ON `combat_degree_bands`, AND THE LAST IS WHAT IS
      LEFT. `combat_degree` walks the bands in the order that row declares (SEVERITY, WORST FIRST)
      and returns the first whose edge HOLDS -- `quantity` strictly above `above` -- else the final
      band. `Felled` / `Wounded` / (`Untouched`) is therefore exactly the old
      `if felled: Felled; elif wounds > 0: Wounded; else Untouched`, and the SHIPPED values below
      reproduce it. The loader refuses a band with no edge, an edge on a band that row does not
      carry, an edge on the residual band, and an edge on a `quantity` that `wound_quantities` does
      not list (`rosters.load_combat_band_edges`).
      ⚠ `above` IS A COUNT OR THE NAME OF ANOTHER `wound_quantities` MEMBER, NEVER A RATIO AND NEVER
      A THIRD KIND OF THING. `felled` is a boolean the tracker computes and is compared as 0/1, so
      `{quantity: felled, above: 0}` is the engine's own verdict, accepted rather than re-decided
      (Jordan 2026-09-04: *\"the combat engine determines the result there. your code just has to
      accept the result.\"*). It is NOT swept, because sweeping it would re-decide who went down.
      ⚠ ONLY THE `Wounded` EDGE'S `above` IS A SWEPT FIXTURE -- `Fixtures.combat_wounded_above`,
      `None` meaning THIS ROW'S value (so `0` is authored once, here). The arms are on `H-98`:
      `0` (SHIPPED: any wound), `1` (the first wound is not enough), and `max_wounds` (the count
      must EXCEED the engine's own cap: a subject sitting exactly AT `max_wounds` reads Untouched). `wounds` is capped by the tracker at `max_wounds + 1`, so
      `wounds > max_wounds` holds only for a subject who reached the cap and is still standing --
      NOT for nobody; it is the arm at which the `Wounded` band shrinks to that one case.
      ⚠ THIS IS NOT THE FOURTH BAND. A decisive-vs-narrow split has no source in the data and is not
      invented (`combat_degree_bands`' own note); this row moves WHERE the existing split falls.
    edges:
      Felled: {quantity: felled, above: 0}
      Wounded: {quantity: wounds, above: 0}

  wound_harm_models:
    source: "`W-E`. #353's Part E `writes:` column names the CELL and never the VALUE, and no in-chain document says how much body a wound costs. `H-114` measured what the instrument did instead: `harm` defaulted to the person's whole body, so a fold at degree `Wounded` DELETED THE PERSON."
    cite: "H-123"
    note: >-
      HOW MUCH BODY A WOUND COSTS, WHEN THE SCENE SAYS THE SUBJECT BLED AND DID NOT GO DOWN.
      `scene_fraction` is the DEFAULT and it introduces no constant: the body is scaled by the
      fraction of health the fight left standing (`health_remaining / health_full`), both fields
      the engine's own `WoundTracker` computed on Combatants `combat_seam` still holds. That is
      Jordan's 2026-09-04 ruling applied to the magnitude as well as to the band — *the combat
      engine determines the result there* — rather than a number this chain chose.
      ⚠ `total` IS THE CONTROL AND IT IS THE CODE AS IT STOOD. Before `W-E`, `_eff_kill` subtracted
      `d.get("harm", p.body)`, i.e. the whole body, so every wound killed and `Wounded` was
      indistinguishable from `Felled`. Running this arm re-runs the defect deliberately, which is
      how the degree's worth is measured rather than asserted (`CLAUDE.md` §0.1 point 4).
      `none` is the SECOND control and isolates the other half: a wound writes nothing, the fold's
      own write-nothing guard emits the REFUSAL instead of the success, and what is left is only
      the difference the SELECTED WRITE SET makes.
      ⚠ A WOUND CANNOT KILL ON ANY ARM EXCEPT `total`. The band means the engine did not fell this
      person, so the body floors at 1 — `seam/wrappers/combat.py::party_end`'s own floor (*a dying person
      still fights*), followed rather than reinvented.
    values: [scene_fraction, total, none]

  field_degree_bands:
    source: "M4, `ED-IN-0279` clause (a). The token every `march` fold writes -- `seam/ladder.py`'s `field_degree`, analogous to `combat_degree_bands` above."
    row: H-147
    note: >-
      ⚠ ORDERED, AND UNPACKED POSITIONALLY LIKE `combat_degree_bands`. `Declared` is first because
      it is the band ENCOUNTER's own declaration fold writes at RESOLVE (`04 §A.2`, amended
      2026-09-28) -- the seventh-phase design's own deferral token, not a band any subsystem
      grades. `Won` / `Lost` / `Unopposed` are read off `seam/wrappers/mass_battle.py`'s lifted
      `attacker_wins`/`unopposed` fields, the shape `combat_degree` reads off a scene's own
      `wound_state` one row above.
      ⚠ `Declared` COSTS SOMETHING AND THE COST IS STATED HERE, NOT HIDDEN. `04 §C.4:621` fixes a
      verb at five columns, none conditional on the outcome except through `contests:`; a prize row
      that defers to ENCOUNTER folds once at RESOLVE writing nothing, under this band, because
      nothing has been fought yet. That is the price of the seventh-phase timing Jordan chose
      (M4 planning round 2) over synchronous resolution at RESOLVE, paid in the open rather than
      smuggled into a verb row nobody reads twice.
    values: [Declared, Won, Lost, Unopposed]

  field_casualty_models:
    source: "M4, `ED-IN-0279` clause (a). How much `Person.body` a lost field costs -- `wound_harm_models`'s question above, asked of mass_battle's survivor-ratio result instead of a scene's `WoundTracker`."
    row: H-148
    note: >-
      ⚠ THE MODELS ARE INVENTED, AS `wound_harm_models`' WERE, AND FOR THE SAME REASON: no ruling
      states a magnitude. `total` and `none` are the same two controls that row ships: `total`
      re-runs "losing kills you exactly as winning it does" deliberately, and `none` isolates
      whether the WRITE ITSELF, rather than its magnitude, is what a defeated side's later choices
      track (`CLAUDE.md` §0.1 pt 4 -- a number without a control is not a measurement in either
      direction).
      ⚠ THE DEFAULT IS `scaled_by_degree`, SET THE SAME WAY `wound_harm_model`'s WAS: A READ, NOT
      A CHOICE. Jordan's 2026-09-04 ruling on that row -- *"the combat engine determines the
      result there"* -- is a general principle about who owns a magnitude the engine already
      computed, and `attacker_size_pct`/`defender_size_pct` (`seam/wrappers/mass_battle.py`'s own
      `resolve()` return, read from the real dice-pool engine call at `engine_resolve_field`, not
      invented in this chain) is that same shape of number for a field battle. No fresh ruling
      settles the magnitude, so this row still ships `assumption`-graded -- but the choice among
      the three arms is settled by that precedent, not by a pending measurement.
      ⚠ `tools/balance_oracle.py` DOES NOT APPLY TO THIS QUESTION AND MUST NOT BE RUN FOR IT.
      That tool patched `dice_engine` and compared campaign-driver arms (the driver was deleted at
      plan position `28-iii`); `march` and `field_casualty_model` live entirely in `engine/season/`,
      which that driver could not reach.
      Patching it would leave both of `balance_oracle.py`'s arms identical by construction --
      exactly the "campaign-unreachable change" `CLAUDE.md` §7 names as **a fake control**, not a
      measurement. If this arm is ever re-examined, the instrument is a `field_casualty_model`
      sweep through `engine/season`'s own corpus (`corpus_run.run_case`), never this tool.
    values: [scaled_by_degree, total, none]

  march_target_kinds:
    source: "M4, `ED-IN-0279` clause (a). What a `march` may target."
    row: H-149
    note: >-
      ⚠ ONE MEMBER, NOT AN OPEN SET, AND THE ROSTER IS CLOSED FOR A REASON BOUND ELSEWHERE.
      Person containment never terminates at a settlement rung -- every person's `contain` targets
      a `home` building beneath one (`harness/populated.py`) -- and `contain_ascends`
      (`state/world.py`) forbids a sideways move to a foreign settlement, so "the exact rung
      marched to" is vacuous read literally. Jordan's ruling (M4 planning round 2) is "settlement
      plus everything under it", which only a `Rung` of kind `settlement` can anchor -- a subtree
      read, matching `world_q.density`'s existing composition rather than a new one. #353 names no
      other march target and this roster does not invent one; adding a member later is a data edit
      the moment a second target kind is ruled, not a design choice made here.
    values: [settlement]

  witness_channel_predicates:
    source: "#353 §20 names the five witness channels and gives NONE of them a predicate. `S61`: *\"WITNESS AS SPECIFIED FANS EVERY EVENT TO EVERY PERSON. Nothing said in private is private.\"*"
    cite: "H-33"
    note: >-
      ⚠ THESE PREDICATES ARE AN INJECTED DEFAULT, NOT SOMETHING #353 STATES. `H-33` is graded
      `assumption` for exactly that reason, and its declared sweep is `total / presence-only / all
      five`.
      ⚠ **`total` IS THE CONTROL AND THE SPECIFIED BEHAVIOUR, AND SINCE 2026-09-07 IT IS NO LONGER
      THE DEFAULT** (`ED-IN-0205`; this line read *"`total` is BOTH the default and the control"*
      until then). `R7` chose the architecture model over the echo model -- *legitimacy falls where
      the news has reached* -- and total fan-out is that echo model at the deposit layer. The
      shipped arm is `all_five`, in `data/fixtures.py`. **The GRADE does not move with it**: `R7`
      rules which arm ships and says nothing about what these five predicates are, so they remain
      an injected default and this row stays `assumption`.
      ⚠ **AND THE GRADE NOW CARRIES MORE WEIGHT THAN IT DID.** Under `total`, `observers_for`
      returned everyone and these predicates were **never consulted**; under `all_five` they decide
      every deposit in the game. An `assumption`-grade `FORMULA x5` went from decorative to
      load-bearing on the whole epistemic layer -- and only THREE of the five can admit anyone in a
      world the fold can currently drive (`chronicle` matches nobody, `post_remit` needs an obligee
      standing at the seat an act was exercised through -- since `17a`; before it, an office whose
      remit covers the emitting verb; `test_w6_every_named_channel_has_a_predicate_and_they_are_data`
      asserts exactly which two are inert). That is the risk this row is carrying, said here rather
      than left for a reader to derive.
      Every predicate below is computed from WORLD STATE and never from a recipient the emitter
      declared -- §19.3 is explicit that an Event carries NO TARGET, *"observers are computed at
      WITNESS from presence; the emitter declares no recipient"*, so a channel that needed the
      emitter to name someone would be a different design and not a fill of this hole.
      ⚠ `chronicle` IS DELIBERATELY NOT `everyone`. A public channel that matched every person
      would make the `all_five` union identical to `total`, and the sweep would have two points
      that are the same arm wearing different names -- an arrangement that cannot measure
      anything. It is the MATTER-OF-RECORD channel: what a binding decision emits is public,
      because a binding decision is the design's own category for an act whose effect is
      institutional rather than private.
    # ⚠ THE NAMES ARE NOT REPEATED HERE. `witness_channels` above is the one place the five are
    # named; this row carries only what each one MEANS. The names are loaded by `data/rosters.py`
    # (`WITNESS_CHANNELS`) and read by `epistemic.py` -- which built `CHANNEL_PREDICATES` from them
    # and picks the `all_five` arm with them; this said `shape.py` until step 6 of the decomposition
    # moved that reader out. ⚠ This file is MECHANISM under `CLAUDE.md` §0.05 -- code opens it at
    # runtime -- so a stale reader named here is worse than one in a design doc. The first version listed all five again in a `values:` key, so a
    # definition lived twice in one file and a test had to guard that the two copies agreed —
    # guarding a duplicate is the shape §8 asks you not to create. Found by the `W6` adversarial
    # pass.
    predicates:
      co_located:    "the person shares a live `contain` Tenure with the Event's place -- the presence index S28 already builds and the fan-out never read"
      document_key:  "the person holds a live `hold` Tenure over something THIS EVENT CHANGED -- a subject named in `changes[]` (a Record, a store). ⚠ THIS ROW READ *the Event's SUBJECT* until `R8.4`, and that clause is why the channel could not fire on a single act: every fold-emitted Event sets `subject = a.actor` and no `hold` takes a PERSON as object, so the equality held only on `MATTER`/`CALENDAR` kinds, which carry no verb and no actor. The parenthetical was always right and the clause it qualified was wrong. Corrected here in the same change as the predicate, because this row is where the meaning lives (see the note above) and `R5` quotes it verbatim as the channel's definition"
      witness_key:   "the person IS the Event's anchor (`state/attribution.py::anchor_of` -- the actor where one acted, the written thing otherwise; it read the deleted `Event.subject` until G1b), or shares a live `knot` Tenure with it -- S28's knot deposit, which already reuses the Event id"
      post_remit:    "the person is an OBLIGEE of the seat the Event's act was exercised through (`Act.via`) -- a live `oblige` Tenure to it, read through `queries/world_q.py::establishment_of`, the one owner of that set -- AND stands AT that seat: the seat's rung is where they are or above it (`state/gate.py::purview_reaches`). Plan position `17a`, r2 item 9. ⚠ THIS ROW READ *the person holds a live office Tenure whose remit covers the verb that emitted this kind* until `17a` -- a remit-holder learning of every covered act anywhere in the realm, the place-blind broadcast r2 `02` §A.7 and `01` both delete. An Event no act caused, or an act exercised through no seat, admits nobody through this predicate. ONE other admission rides this channel's source (`inferred`) and its live/off switch, in `loop/witness.py` (v9 IN-22): an ACTORLESS Event's observation READS (MATTER's recorded shortfall) go to the holders of a live seat whose purview reaches the read rung (`queries/world_q.py::governors_of`) -- reads only, never an event-kind, `seen` or `content:` claim"
      chronicle:     "the kind is emitted by a `binding_decision` verb -- a matter of record, and public because the decision is institutional"

  observation_terms:
    source: "`R8.1`, `references/design_rulings_2026-09-06.md` -- Jordan: *\"I saw this person doing y, but I don't know what y is\"*, *\"someone looking like y did x\"*, *\"they saw someone skulking around for no reason they could discern\"*. One `seen` claim per (witness, event), BESIDE the two existing deposits; its value is a frozen struct of these four terms, each `None` where the channel withholds it"
    cite: "R8"
    open: true
    ordered: true
    note: >-
      `values:` IS THE STRUCT, IN FIELD ORDER -- `epistemic.Seen` refuses at import if its fields
      and this list differ, and every term needs a `_term_<name>` reader there (the
      `CHANNEL_PREDICATES` precedent: a named member with no reader RAISES, never quietly reads
      `None`). `stratum` is the coarse WHAT (`strata`), never the verb TOKEN -- a witness can say
      *someone was doing something social* without naming `tell`. ⚠ Not never the INFORMATION:
      `movement` has exactly one member (`move`), so that one stratum is bijective with its verb --
      see `epistemic._term_stratum`'s docstring, found by adversarial review. (⚠ TWO since plan
      position `19c` added `migrate` to it; a `movement` witness no longer knows which.) `marks` is the
      actor's appearance; `Person.marks` itself was DELETED 2026-09-24 (`ED-IN-0261` item 1) as a
      zero-reader/zero-writer field, so this term now reads nothing rather than a deleted
      attribute and is `()` for every actor (see `epistemic._term_marks`) -- `()` still means
      *seen, and nothing describable*, and `None` still means *this channel does not show a body
      at all*. `who` is the actor's id. `why` is the motive.
      ⚠ `supplied_by:` IS WHAT EACH CHANNEL SHOWS, and a witness's struct is the UNION over the
      channels that admit them under the live `fan_out_mode` (`epistemic.live_channels`). The
      `total` arm is `H-33`'s control and shows EVERY term to every witness, so this table is read
      only by the narrow arms. Two cells are ruled: `R8.5` quotes the ratified line *"a co-located
      witness saw who acted; a document holder saw only that the document changed"* -- so
      `document_key` shows NOTHING, and its witness holds an all-`None` struct, which IS deposited
      (the claim's subject still says WHERE something happened). `witness_key`, `post_remit` and
      `chronicle` are unruled: they withhold rather than invent, and are an injected default in
      `H-33`'s sense, exactly as the channel predicates themselves are.
      ⚠ NO CHANNEL SUPPLIES `why`, AND THAT IS `R8.4`'s DEFECT, NOT A CHOICE MADE HERE:
      `Candidate.why` is dropped at `pack_scenes` and `Act` carries no motive, so the engine
      forgets it before the act executes and no witness can learn it. Case 4 (*no discernible
      reason*) is therefore every deposit today. `Person.marks` has zero writers, so `marks` is
      `()` wherever it is shown -- case 2 (*someone looking like y*, `who=None`) is supported by
      the struct and reached by nothing until a recognition producer exists, which `R8.2` defers
      to its own commit.
    values: [stratum, marks, who, why]
    deposit:
      predicate: seen
    supplied_by:
      co_located:   [stratum, marks, who]
      witness_key:  [stratum, who]
      document_key: []
      post_remit:   [stratum]
      chronicle:    [stratum]

  # ── WHAT THE SEASON LOOP IS ───────────────────────────────────────────────────────────────────
  # RULED BY JORDAN, 2026-09-05:
  #   *"season loop governs inputs into the seams and collected outputs. it's the processor of all
  #    events, and it enables events to occur without a scene being called for not players"*
  #   *"only players really need the scene in its entirety"*
  #
  # THREE PROPERTIES, and the loop already implements two of them — verified in `SeasonDriver`:
  #
  # 1. IT MARSHALS THE SEAMS. Nothing crosses a seam except what the loop puts in, and nothing
  #    returns except what the loop collects. `deliberate` produces the acts, `resolve` is where a
  #    contest is called (S39: exactly one place), `witness` collects. A subsystem never reaches
  #    into the world and the world never reaches into a subsystem.
  #
  # 2. IT IS THE PROCESSOR OF ALL EVENTS — ONE LOG, NOT TWO (S19.5). `season()` merges both
  #    channels before deposit: `self.witness(token, pending_matter + events)` (`loop/driver.py`).
  #    Already true in code.
  #
  # 3. IT ENABLES EVENTS WITHOUT A SCENE, FOR NON-PLAYERS. `matter(actorless)` is that channel and
  #    it already exists: an actorless Event has NO ACTOR by type — "attribution is a per-witness
  #    Claim" — so the world can move with nobody acting and nobody watching. ⚠ THIS IS NERS **R**'s
  #    half with no player in it (§0.06: *emergent hooks and scenarios WITHOUT player involvement*),
  #    and it is the property that makes the world generate drama when nobody is looking.
  #
  # ⚠ SO THERE ARE TWO WAYS INTO THE EVENT STREAM AND THEY ARE NOT THE SAME COST:
  #     ACTORLESS  — `matter()`, no scene, no deliberation, no player. The world moving.
  #     ACTED      — `deliberate()` -> `resolve()`, a person chose. A seam may be called here.
  #   Both converge at `witness()` into one log. A mode of play that needs no scene attaches to the
  #   first channel; one that plays out attaches to the second.
  #
  # ⚠ AND THE SCENE IS PLAYER GRANULARITY, NOT WORLD GRANULARITY. Jordan: *"only players really
  # need the scene in its entirety."* An NPC's action does not require a scene to be constructed and
  # played out — it needs a resolution and an event. This binds R-03's scene tick directly: the tick
  # must give a PLAYER scene-by-scene granularity WITHOUT forcing every NPC in the realm through a
  # full scene, or the cost of a season scales with the cast rather than with the players. Do not
  # implement the tick as "every person gets a scene per round".

  # ── THE SEAMS ─────────────────────────────────────────────────────────────────────────────────
  # RULED BY JORDAN, 2026-09-05, and this is the architecture, not a taxonomy:
  #   *"what matters is the seams"*
  #   *"each mode of play is separately called FROM the season loop"*
  #   *"ignore their shapes. we will be rebuilding probably"*
  #
  # THE SEASON LOOP IS THE DRIVER. Every mode of play is a CALL OUT AND A RETURN BACK — one uniform
  # pattern, differing only in where it attaches and what crosses. A seam survives a rebuild of the
  # subsystem behind it; a signature does not, which is why nothing here cites one.
  #
  # A seam declares three things and only three: WHERE IT ATTACHES, WHAT GOES IN, WHAT COMES BACK.
  #
  # | mode of play        | attaches at        | in | out | state |
  # |---------------------|--------------------|----|-----|-------|
  # | personal combat     | RESOLVE (S39)      | claimants, prize, causes | a degree | BUILT — `modules/combat/fight.py`, called by `seam/wrappers/combat.py`. Jordan: "combat engine isn't done" |
  # | social contest      | RESOLVE (S39)      | claimants, prize, causes | a degree | BUILT, σ-LEVERAGE MODE — `a standing`/`a matter` are rolled by `modules/social_contest/roll.py` (a `Margin`), called by `seam/wrappers/sigma.py`, provider `social_contest` (v9 SC-01 steps 13 + 15); the proceedings nested run is unbuilt |
  # | mass battle         | ENCOUNTER (`a field`) | claimants, prize, causes | a degree | BUILT — `modules/mass_battle/massbattle.py`, called by `seam/wrappers/mass_battle.py` (the `contest_subsystems` row `a field`) |
  # | investigation       | RESOLVE (FI-01)    | actor, subject (`examine`: site) | a degree | ITS OWN KIND — not a contest: GRADED, by the roll the `graded_inquiries` row names (below), with no prize |
  # | settlement mgmt     | UNRULED (see below)| UNRULED | UNRULED | ⚠ NOT CALLED — done INLINE (see below) |
  # | faction mgmt        | UNRULED            | UNRULED | UNRULED | absent from the loop entirely |
  # | character dev       | UNRULED            | UNRULED | UNRULED | no creation, no progression, no chronicle |
  #
  # ⚠ THE CONTEST ROWS' CONTRACT IS RULED AND THE UNRULED ROWS ARE HONEST BLANKS. S39 fixes the contest attach point at
  # RESOLVE — "exactly one place" — and its return at a degree. The blanks are Jordan questions, not
  # session guesses: writing a plausible IN/OUT for a mode nobody has ruled would be inventing the
  # architecture rather than recording it, and the seam is precisely the thing that must not be
  # invented.
  #
  # ⚠ SETTLEMENT IS THE ONE THE RULING RESOLVES. `loop/matter.py::matter` runs stores/yield/subsistence
  # INLINE, and `systems/settlements` holds no sim module now (its economy sims were deleted at plan
  # position `29c`), so which owner wins is moot: the loop's own is the only one. Under the ruling an
  # economy the loop computes itself is a mode that never got its seam; whether it is ever CALLED
  # instead is unruled, which is why the row above reads UNRULED. Two ladders for one quantity is a
  # NERS **S** defect (§0.06, *calculations consistent in methodology*).
  #
  # ⚠ FACTION CANNOT BE A STRAIGHT PORT even once its seam is ruled. Layer 1 PART D rows 1/8/14
  # forbid a faction that acts, a stored aggregate, and a banner holding territory, so
  # `game_state.Faction` cannot cross a seam as-is; what crosses must be re-expressed in the loop's
  # shape (a Faction is a type with no verbs; `holdings` is a Query over members' `hold` Tenures).
  #
  # ⚠ INVESTIGATION MUST NOT BE MADE A CONTEST TO BECOME GRADEABLE. Six investigation acts carry no
  # `contests:` cell and that is CORRECT — they are not ungraded contests but a different kind of
  # resolution whose seam is unbuilt. Giving them a prize so the existing machinery can grade them
  # is scripting drift: forcing one mechanism's shape onto another because it is the one that exists.
  # ⚠ v9 FI-01 (`ED-FI-0009`, J-22 option (A)) GRADES THEM WITHOUT A PRIZE: `graded_inquiries`, below,
  # is a ROUTING row -- verb -> the provider and module entry that roll it -- read by the loop
  # (`loop/resolve.py::_grade`), never by `contest()` and never by `manifest.resolve("contest", …)`.
  # It carries no `module:` and no prize key, so no `contest_subsystems` reader can see it.
  #
  # Nothing below declares a seam that does not exist. Declaring one would be the dead-carrier
  # defect this file names elsewhere — a carrier built before its reader.

  graded_inquiries:
    source: >-
      v9 FI-01 (`ED-FI-0009`; J-22 answered option (A)): the inquiries are graded by degree, as
      ladder step 3 answered (RESOLVE -> WITNESS, "Claims graded by degree; Failure emits
      `finding.none` and deposits nothing"), through a declared routing column that is NOT a prize
      and NOT a `contests:` shape. A-21: one roll owner (S27.2) -- the `social_contest` module's
      entry, with the obstacle at the host input builder's non-person default.
    row: H-111
    note: >-
      ⚠ A ROUTE, NOT A PRIZE. Each row names the provider registered under `@provider("contest", …)`
      and the composition role that provider calls; the pool is `seam/wrappers/sigma.py::_pool_of`
      (`verb_capability`, else the swept `pool_default`) and the obstacle the module's own
      (`modules/social_contest/roll.py::obstacle`: `obstacle_default`, swept, while no
      `verb_capability` row names an inquiry -- an inquiry's subject can be a person-kind Rung). The pair must be one a `contest_subsystems` prize row already
      binds (`manifest/registry.py::check_graded_inquiries`), so this row adds no roll and no
      resolver. No `verb_capability` row is added for the inquiries: which capability an inquiry
      draws on is stated nowhere, so every inquirer rolls `pool_default` -- the declared finding
      cut, re-read by `corpus_run`, not quoted here.
      ⚠ THREE ROWS, AND THE OTHER THREE ARE NOT GRADED: `interview` is a PROMPT (#453 K-36: the
      questioned person answers by their own `tell`, so there is no degree on the asker);
      `reconstruct` waits on a value space nothing supplies (K-37: no invented number); `thread_read`
      waits on that and on H-85 (no Thread Sensitivity carrier). `surveil`'s Person case is absent
      from its row (one cell binds one kind) and waits on ED-FI-0009. A verb that waits keeps its
      flat `emits:` and is not counted as graded.
    keys: [verb_table]
    values:
      research: {provider: "social_contest", module_entry: "social_contest.roll"}
      examine:  {provider: "social_contest", module_entry: "social_contest.roll"}
      surveil:  {provider: "social_contest", module_entry: "social_contest.roll"}


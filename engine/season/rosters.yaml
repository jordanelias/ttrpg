      3-HA1: {holds: [argue], ground: "★ Constitutional Precedent '(-1 Audience Resistance when citing constitutional clause)' moves the Argue contest's Persuasion Track parameter (social_contest_v30.md:102) by a Recall citation (:177) -> argue; ★ Procedural Objection (a Regroup) -> none (:330)"}

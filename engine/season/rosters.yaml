  # and the roster goes." Deferred at 8a's own commit only because a concurrent plan position
  # owned this file in the same shared working tree that day (offices.yaml's own header names
  # the scope decision); that window closed by the end of the same session's Phase 1, so the
  # physical deletion HANDOFF_IN.md's position-8a row named as follow-up lands here. Full text
  # (Jordan's 2026-09-02 ruling, the H-90/H-91 history, the superseded revocation rule) survives
  # at `engine/season/offices.yaml: titles:`'s own header and in this file's git history --
  # nothing here reads this key any more (`data/rosters.py::TITLE_DOMAINS` reads `offices.yaml`).

  conditional_emission_rows:
    source: "`W4`. Part D's `emits:` column does not distinguish a kind emitted ON EVERY WRITE from one emitted only WHEN A CONDITION HOLDS, and the two are different things."
    note: >-
      ⚠ THIS ROSTER EXISTS BECAUSE PART D'S COLUMN IS AMBIGUOUS, AND THE AMBIGUITY IS REGISTERED AS
      `H-86` RATHER THAN DECIDED HERE. `W4` makes a MATTER write on a row that declares an `emits:`
      kind name one -- that is `D22`, and `H-12` is RULED that way. But `(Record, ttl)` declares
      only `record.expired`, and the row is DECREMENTED EVERY SEASON: emitting `record.expired` on
      every decrement would publish an expiry that has not happened, which is worse than the silent
      write the gate exists to stop. `(Site, condition)` shows the other shape -- `condition.worn`
      per write PLUS `condition.band_crossed` on a condition -- so the column carries both kinds of
      kind with nothing to tell them apart. Listing the rows whose declared emissions are ALL
      conditional is the smallest thing that is true; deciding the column's schema is a Part D
      change and belongs to whoever ratifies `H-86`.
    why:
      "Record.ttl": "`record.expired` fires at zero; every other decrement of §13's licensed clock is a tick with no declared kind, and emitting the terminal one would assert an expiry that has not happened"
    cite: "H-86"
    values: ["Record.ttl"]

  knowledge_kinds:
    source: "`H-85`; NPC-087's own `season_requires` supplies the two values"
    open: true
    note: >-
      ⚠ THE GATE IS NOT HERE AND THAT IS THE POINT. #353 §9.2 says *"The only class-shaped gate in
      the design is Thread Sensitivity"* and supplies no carrier, no predicate and no taxonomy for
      it to gate OVER. This roster is the taxonomy half — the half `rosters.yaml` is the ruled
      home for — and `H-85` records that the gate half stays open.
      The two values are NPC-087's own: material "retainable by ordinary non-sensitive minds"
      against "Thread-substrate knowledge subject to the setting's epistemological barrier". A
      third kind, or a per-subject scheme, is `H-85`'s sweep, not an edit anyone should make here
      without moving the row.
    values: [mundane, thread_substrate]

# ===========================================================================
# TABLES — a MAPPING, where a roster is a SET. `table()` reads these; `roster()` raises on them
# and vice versa, so the two shapes cannot be confused at a call site.
# ===========================================================================

  site_kinds:
    source: "#353 §12 — `Site.kind`. `W8`."
    row: H-07
    note: >-
      ⚠ THE SET IS EXTENSIBLE AND THE LOOKUP STILL REFUSES, and those are different properties.
      Adding a kind means adding a row here; asking about a kind that has no row RAISES, because
      §42.2.1's worked example is exactly this table: *"a wear table that returns 20 for an
      unregistered site kind does not fail — it answers, plausibly and wrongly, forever."*
      ⚠ `harbour`, `seam` AND `body` ARE THE INSTRUMENT'S, NOT #353's, so `H-07` is `assumption`,
      not transcription.
      ⚠⚠ `body` IS NOT A SITE. It is `(Person, body)`'s band row, here because `band_floors` keys on
      THIS roster and `H-38` ruled *"`Site.condition` is the model"* — no second scheme. See `p32`.
      ⚠ `dwelling` IS JORDAN'S, 2026-09-25 (`ED-SE-0055`, plan position `24d-i`): `ED-SE-0051`'s
      `capacity(w, rung)` counts *"the rung's dwelling Sites"*, and he chose to make that phrase
      literal rather than re-read it as the hearth rungs. `harness/populated.build_realm` mints one
      per `hearth` rung. Adding it forced the `wear_per_season` and `band_floors` rows below
      (`data/fixtures.py`'s `_load_matter_tables` refuses a site kind with no row); it has no
      `site_yield` row, because a dwelling produces nothing and that table's `default_cell` is 0.
      ⚠ `garrison` IS JORDAN'S, 2026-09-28 (`ED-IN-0279` clause (a), M4): asked how a settlement's
      fortification should be modelled, given he wants it build-able and upgradeable, he chose *"a
      Site's condition"* over a cohort-Person alternative -- `H-38`'s *"`Site.condition` is the
      model"* ruling applied to fortification rather than a second scheme invented for it. Adding
      it forces the same two rows `dwelling` forced, for the same loader reason, and it has no
      `site_yield` row for `dwelling`'s reason: a wall produces nothing. **UPGRADING ONE IS NOT
      BUILT BY M4** -- the pre-existing, declared `restore` verb (`verb_table.yaml`,
      `writes: Site.condition`) is the disclosed route and it shipped M4 still unimplemented
      (no `_eff_restore`, excluded from `resolvable_verbs()`); M4 only reads the field a field
      battle already needs, at whatever condition a garrison was seeded with. ⚠ AMENDED
      2026-09-29 (plan position `24e`): `_eff_restore` EXISTS and `restore` is resolvable, raising
      any fabric its actor stands at toward the ceiling a works allows (the full scale where none
      names it).
    values: [harbour, seam, body, dwelling, garrison]

  matter_kinds:
    source: "#353 §10.4 VERBATIM: *It is a type parameter, not an enumeration. Grain, salt, timber, ore and coin are rows in a registry, not members of a closed set in a source file.*"
    row: H-11
    note: >-
      ⚠ OPEN MEANS ADDABLE, NOT UNCHECKED — and this file is the registry §10.4 asks for. #353
      forbids *a closed set in a source file*; it does not license a lookup that answers for a
      kind nobody registered. Both halves hold here: add a kind by adding a row, and a draw
      against an unregistered kind raises.
      ⚠ THE FIVE ARE #353's OWN EXAMPLES and nothing more. It names them as illustrations of what
      a row looks like, so starting the registry with exactly them is the least-invented content
      available — but it is still a choice, which is what `H-11` grades.
    values: [grain, salt, timber, ore, coin]

  wear_per_season:
    source: "#353 §22 assigns `wear per site kind` to params; no in-chain table exists. `H-07`."
    row: H-07
    note: >-
      ⚠ MOVED OUT OF THE INSTRUMENT BODY BY `W8`, WHICH IS WHAT PLAN `W8` ASKS FOR: *per-kind wear
      and floors as registry rows rather than `DEFAULT_FIXTURES` literals*. `DEFAULT_FIXTURES`
      READS this mapping, so the declaration still lives once — the objection recorded in
      `shape.py` when these were literals (*"splitting them into rosters.yaml would put one
      declaration in two files"*) is answered by the fixture reading the data rather than
      restating it.
      ⚠ `dwelling: 0` IS THE CONTROL ARM, SHIPPED DELIBERATELY (`24d-i`), and it is `H-07`'s own
      *"no wear at all"* sweep point applied to one kind. ⚠ **NOT THE SAME SHAPE AS `body_step = 0`**
      (corrected 2026-09-26 — a prior version of this note claimed it was): that arm `continue`s
      past the write itself (`loop/matter.py`), so nothing is emitted at its control arm. `wear_per_season` carries no such skip — MATTER writes every Site every
      season whatever its rate, so `dwelling: 0` still emits (see below). A dwelling sits AT a
      hearth and persons live in hearths. A non-zero rate
      together with any floor in `band_floors.dwelling` would let a dwelling's condition cross it;
      the crossing Event is witnessed `co_located` regardless of any of this (position `11a` did
      not touch witnessing), and the claim it deposits (subject = the dwelling) would then reach
      every co-located resident as a live `claim_landed` question, once `reach`/`place_of`
      (`queries/world_q.py`, `11a`) admit a claim about a place through a person's own ledger. That
      would put a dwelling-condition Question in front of every resident every season, which is
      exactly what `test_24d_i_the_control_arm_crosses_no_band_and_moves_no_question_in_one_season`'s
      control-arm identity pins against. Either half at its control arm blocks the crossing; both
      ship there. At 0 no dwelling's condition moves.
      ⚠ ZERO IS NOT SILENT. `loop/matter.py`'s wear loop still WRITES every Site every season,
      and `World.write` emits one `condition.worn` per write (`H-12`), so every dwelling emits
      one wear Event a season, and its residents witness it (`co_located`) as a claim. A non-zero
      rate is chosen with a consumer in front of it, at `24e`/`24f`, never here.
      ⚠ `garrison: 0` IS `dwelling`'s CONTROL ARM APPLIED FOR THE SAME REASON, NOT A SEPARATE
      CHOICE (M4, `ED-IN-0279` clause (a)): `restore` -- the declared writer of `Site.condition`
      upward -- ships this plan unimplemented, so a non-zero rate here would erode every
      garrison's condition every season with no consumer able to counteract it, silently drifting
      every field battle's fortification term toward zero over a long campaign. That is exactly
      the undisclosed drift `dwelling`'s note above refuses. A non-zero rate is chosen once
      `restore` exists to answer it, never here.
      ⚠ `restore` EXISTS SINCE PLAN POSITION `24e` (2026-09-29), SO THIS NOTE'S STATED REASON HAS
      LAPSED AND THE RATE IS STILL `0`: choosing one is a pacing decision (where every fabric sits
      at rest), `24e`'s instruction does not make it, and it is registered rather than taken --
      `H-165` and `H-07` (the rate). ⚠ CORRECTED (`24f`, 2026-09-30): `restore` now executes on the
      populated realm's SETTLEMENT fabrics (harbour, seam -- rate 10, a cohort stands beside them),
      so `H-165`'s limit is the DWELLING/GARRISON rate specifically -- the two rows this note is
      actually about, both still `0`, and still never below full for that reason alone.
    rates:
      harbour:  10
      seam:     10
      body:     10
      dwelling: 0
      garrison: 0

  capacity_floor:
    source: "`RULINGS.yaml` RR-2 (`ED-SE-0051`, ruled 2026-09-17): *\"a `capacity(w, rung)` QUERY over the rung's dwelling Sites, with a FLOOR — never a fixture table\"*; `01_THE_BUILD_ORDER.md` S10: *\"the floor is a table keyed on site kind, beside `band_floors`\"*. Plan position `24d-ii`, landed with its caller at `19c`."
    row: H-167
    sweep: [declared, zero, doubled]
    note: >-
      ⚠ ITS CELLS HOLD THE FLOOR AND NOTHING ELSE (plan `24d-ii`, corrected 2026-09-25). A cell is a
      LOWER BOUND on `queries/world_q.py::capacity`'s derived quantity -- `max(floor, the dwelling
      Sites at the rung and below)` -- never what one dwelling houses: a per-kind *houses N* cell is
      capacity AUTHORED per kind, the `hearth_capacity` fixture RR-2 refused, a second home for a
      fact the Sites carry. What is derived is the count of Sites itself.
      ⚠ WHY 1 FOR `dwelling`: RR-2's own reasoning -- the floor keeps a population from being
      throttled to zero by a rung with no dwelling at all, *"the same shape as `W5`'s own
      floor-of-1 choice for budget"*. The number is that precedent's, not a ruling's, so `H-167`
      grades it and sweeps it: `zero` is RR-2's refused reading and the CONTROL (a rung with no
      dwelling houses nobody), `doubled` the other side.
      ⚠ THE OTHER FOUR CELLS ARE 0 AND `capacity` READS NONE OF THEM TODAY: it counts `dwelling`
      Sites (`world_q.DWELLING_KIND`, Jordan's `ED-SE-0055`: *"capacity queries descendant Sites
      of that kind"*). They are here because the table is keyed on the whole `site_kinds` roster
      and `data/fixtures.py` checks it in both directions, as it checks `wear_per_season` and
      `band_floors` -- so a missing `dwelling` row REFUSES at load instead of silently flooring
      every rung at nothing. A second housing kind is a roster row, a cell here, and `capacity`'s
      count widened with it.
    floors:
      harbour:  0
      seam:     0
      body:     0
      dwelling: 1
      garrison: 0

  works_cost:
    source: "v9 IN-28 (`H-166` limit 1, its own design order: the cost first). r2 `proposals/2026-09-17-governance-and-holdings-r2/04_MATTER_AND_WORKS.md` §A.6.6 (intent): *\"the cost is paid by `transfer` into the works' rung\"*, and nothing debited that rung when the place rose. `proposals/2026-09-10-settlements-factions-populations/04_EVALUATION.md` §6 (intent): `found` costs *\"the stake\"*, `build` costs *\"timber\"*."
    row: H-166
    sweep: [declared, halved, doubled]
    note: >-
      WHAT A WORKS' PLAN COSTS: `{plan kind: {matter kind: amount}}`, paid out of the WORKS' RUNG
      (`Record.rung`, where the works is kept and where `transfer` delivers to it) when the place
      rises. `loop/effects_founding.py` is the one reader. `found` moves its stake TWO-SIDED into the
      Rung it founds, so the grain stays in the world and provisions the new hearth (`_shift`, the one
      body of a conserved store move). `build` CONSUMES its cost into the fabric, one-sided, a lawful
      sink. 04_EVALUATION §6 S passes the pair in exactly that shape: *"`build` debits one side as a
      lawful consumption sink; `found` is two-sided"*.
      ⚠ A PLAN KIND WITH NO ROW HAS NO PRICE, SO NOBODY CAN PAY FOR IT, AND `found`/`build` REFUSE IT.
      That is a refusal that emits, never a free place: a missing row is not a cost of zero. The
      loader checks one way only -- every key a `rung_kinds` or `site_kinds` member, every cell
      non-empty, every matter kind a `matter_kinds` member, every amount a positive int
      (`data/fixtures.py::_load_works_cost`). It is NOT keyed on `site_kinds` in both directions as
      `wear_per_season` is, because three groups of members get no row by design:
        * `body` IS NOT A SITE (`site_kinds`' own note). A works planning one is refused here, by the
          roster, rather than by a kind literal in `_eff_build` (`H-166` limit 4, narrowed: `body`
          stays in `site_kinds` for `band_floors`).
        * `person` is CENSUS's to mint (F.30), never a works'.
        * `settlement` and above are unpriced: founding a settlement collides with SE-9(a)'s held
          question (*"never adding nodes"* to the fixed settlement registry), and 02_PROPOSALS P4
          restricts founding to `hearth` and `community` for that reason.
      [ASSUMPTION; medium; Jordan to correct; revert: delete this roster and its reader, and
      `found`/`build` cost nothing again (`H-166` limit 1 reopens)]. THE KINDS are 04_EVALUATION's
      (grain for the stake, timber for a fabric). THE AMOUNT IS INVENTED and it is ONE number, 10,
      for every row: `site_yield.seam.timber` is 10, so a fabric costs one season of a full seam's
      timber, and the stake reuses the same magnitude so the two verbs share one scale rather than
      two. `H-166` sweeps it; `halved` and `doubled` scale every cell.
    costs:
      hearth:    {grain: 10}
      community: {grain: 10}
      harbour:   {timber: 10}
      seam:      {timber: 10}
      dwelling:  {timber: 10}
      garrison:  {timber: 10}

  subsistence_weight:
    source: "`H-11` — *the subsistence formula over an OPEN MatterKind registry*. ARCHITECTURE_V2.md's default: *draw from the containing rung's stores, scaled by weight*."
    row: H-11
    note: >-
      ⚠ THE WEIGHTS ARE INVENTED AND THE ROW IS WHAT MAKES THAT LAWFUL. #353 states the SHAPE — a
      draw from the containing rung's stores, scaled per kind — and supplies no numbers, so this
      is an injected default with a `site:` and a sweep, exactly as `wear_per_season` beside it.
      ⚠ A KIND WITH NO WEIGHT IS NOT A KIND WITH WEIGHT ZERO. A missing row RAISES rather than
      drawing nothing, for `wear`'s reason: a silent zero is a person who eats nothing and never
      starves, which is a plausible wrong answer that no test would ever surface.
      ⚠ ONLY `grain` AND `salt` CARRY A WEIGHT, and that is deliberate rather than an omission:
      timber, ore and coin are stored and not eaten. They are registered in `matter_kinds` and
      absent here, so a draw against them raises — which is the refusal above doing its job on
      the very first kind somebody adds to a larder by mistake.
    weights:
      grain: 2
      salt:  1
  factions:
    source: "`systems/world/reference/geography_v30.md` (`## Status: CANONICAL`) starting-control table; `systems/world/reference/worldbuilding_v30.md` §3, §4, §5, §8, §10."
    row: H-99
    note: >-
      ⚠ SOURCED FROM `systems/world/` BECAUSE JORDAN RULED THE PRECEDENCE, AND THE FIRST VERSION OF
      THIS ROSTER WAS SOURCED WRONG. It cited `systems/factions/reference/faction_canon_v30.md`. Jordan,
      2026-09-02: *"systems/factions, systems/settlements are for inspiration/reference only.
      systems/world contains information to use regarding factions ... but for the
      identity/names/organizations it is canon"*, then: *"systems/factions if it concerns directly
      the identity of a faction can be concerned near-canon but superseded by anything in world."*
      A faction's NAME is identity, so this roster is world's to give. See the file header for the
      three-tier order.
      ⚠ `Ministry of the Peninsula` IS EXCLUDED, AND NOT BY THE PRECEDENCE RULING — BY THE
      NEAR-CANON SOURCE'S OWN WORDS. It was in the first version of this list. It appears ZERO
      times in all of `systems/world/`, and `faction_canon_v30.md:374` says of it: *"Treated as
      institutional infrastructure, NOT a faction."* So the tier-2 document I had over-read
      excludes it itself. An office may still BELONG to a ministry — that is `office_bodies`'
      `Ministries` row, which is what a ministry actually is here.
      ⚠ TWO NAMES IN CIRCULATION ARE SUPERSEDED AND ARE NOT MEMBERS. `People's Revolution`
      (`southernmost_v30.md` §6.2, one occurrence) is the old name for `Restoration Movement` —
      `geography_v30.md`'s ED-061 is *"'Revolution' -> 'Restoration Movement' naming
      standardisation across all docs"*, i.e. the rename is ordered and unpropagated, not a second
      faction. `Niflhel` (10 occurrences) is DISSOLVED: `worldbuilding_v30.md` §3.2 renames the
      mechanic *"Olafsson-Broker Exposure (formerly Olafsson-Niflhel)"* and §10 says
      *"post-Niflhel-dissolution"*. A frequency-ranked grep over `systems/world/` returns both at
      ranks that would have carried them in; they are excluded by reading, not by counting.
      ⚠ `Schoenland` IS A MEMBER AND IS FOREIGN. Canon gives it T16 and Altonian naval passage
      (`geography_v30.md`). ⚠ THE TYPED LAYER CARRIES NO T16 ROW AND THAT IS DELIBERATE, NOT A GAP
      TO FILL: `references/world_initial_state.yaml:44` (retired at plan position `29d-ii`; open it
      with `git show fd321c81:references/world_initial_state.yaml`) — *"There is no T16 — the gap is
      in the source data"* — and `harness/populated.py:331`. No `role_template`; recorded, not filled.
      ⚠ REFERENCE, NOT MECHANISM (§0.05), AND A FACTION STILL NEVER ACTS. `ARCHITECTURE_V2.md:93`
      lists a faction acting among five refusals held under all 143 cases. This roster names what
      an OFFICE BELONGS TO; the actor is always the person holding the office.
    # NO `values:` -- the members ARE `names_index.yaml`'s `token_class: faction` rows, read
    from_names: faction   # via engine/substrate/names.py. Edit the naming index, not here.

  role_templates:
    source: "`systems/factions/reference/faction_canon_v30.md` §4 'Role Templates and Expected Convictions', per PP-686 §3.3.1 over the PP-684 13-Conviction taxonomy."
    row: H-99
    note: >-
      ⚠ TIER 2 — NEAR-CANON, AND IT SURVIVES BECAUSE WORLD IS SILENT, NOT BECAUSE IT OUTRANKS
      ANYTHING. Jordan: *"systems/factions if it concerns directly the identity of a faction can be
      concerned near-canon but superseded by anything in world."* §4 binds each template to a
      weighted conviction vector and to a player-eligible faction — that is directly a faction's
      identity — and `systems/world/` has no competing role-template concept, so there is nothing
      to be superseded BY. The day world says otherwise, world wins and this roster changes.
      ⚠ TWO FACTIONS HAVE NO TEMPLATE, RECORDED AS AN ABSENCE BY NAME (the roster's size is not
      an invariant — RULED 2026-09-19). §4's player-eligible
      column covers Crown, Church of Solmund, Hafenmark, Varfell, Löwenritter and Restoration
      Movement. `Guilds` and `Schoenland` are absent from it. `faction_role_template` leaves them
      out rather than assigning a plausible one — inventing `mercantile-procedural` for the Guilds
      is exactly the fabrication the source-precedence ruling exists to prevent, and it would read
      as canon a session later.
      ⚠ `intelligence-diplomatic` IS UNCLAIMED BY ANY FACTION AND STAYS IN THE ROSTER. §4's own
      note assigns Varfell to `military-order` on Jordan's 2026-04-19 decision that Vaynard
      expansion is *"purely military"*, leaving this template a candidate nothing holds. It is a
      member because a corpus case may name an intelligence office; it binds to no faction.
    values: [sovereign, ecclesiastical, mercantile-procedural, intelligence-diplomatic,
             reformist, military-order]
    by_faction:
      # ⚠ A ROLE TEMPLATE IS A PROPERTY OF THE FACTION, NOT OF THE OFFICE, so it is a mapping keyed
      # on `factions` rather than a field on the office block. §4's table is a function of the
      # faction: every Crown office is `sovereign`, whoever holds it. Carrying it per-office would
      # store the same derivable fact 47 times and let two offices of one faction disagree.
      # ⚠ TWO NAMED GAPS, AND BOTH ARE DELIBERATE. `Guilds` and `Schoenland` are not
      # in §4's player-eligible column and get no entry, so a lookup for them RAISES per §42.2's
      # polarity rule. Assigning the Guilds `mercantile-procedural` because it sounds right is the
      # fabrication the precedence ruling exists to stop, and it would read as canon a session on.
      # ⚠ `Varfell` AND `Löwenritter` SHARE `military-order`, WHICH IS CANON AND NOT A COLLISION.
      # §4: *"Both Varfell and Löwenritter use military-order template; their differentiation comes
      # from Mission, leader Convictions, and stat profile, not role template."*
      "Crown": sovereign
      "Church of Solmund": ecclesiastical
      "Hafenmark": mercantile-procedural
      "Varfell": military-order
      "Löwenritter": military-order
      "Restoration Movement": reformist

  faction_leaders:
    source: >-
      systems/factions/reference/faction_state_authoring_v30.md — each faction block's own `leader:`
      field (crown :44 `almud`, church_of_solmund :92 `cardinal_himlensendt`, hafenmark :144
      `baralta`, varfell :193 `vaynard`, restoration_movement :248 `yrsa_vossen`, lowenritter :302
      `ehrenwall`). TIER 2, and it survives because `systems/world/` names no competing leader.
    row: H-99
    note: >-
      ⚠ **WHY A FACTION NEEDS A PERSON AT ALL: Q4's REFERENT.** ⭐ Jordan ruled 2026-09-13 that a
      faction's creed is an `OUGHT`. `world_q.questions_for`'s Q4 raises a standing question from
      every live `commit` to an OUGHT and emits `(prop.subject,)` as the referent — and a faction
      NAME is not a person and not even a rung, so a creed subject-ed on the faction would put a
      non-entity into every member's deliberation. That is `build_at`'s measured rung-subject defect
      one level worse: its one rung-subject Proposition produced **0 of 4,870 acts naming another
      person**, which `ED-IN-0210` Ruling 1 exists to correct (*"verbs invoke mechanisms or
      interactions between a character and another entity/character. they are not fiats."*).
      So the creed is subject-ed on the faction's LEADER, who is a person an act can name.
      ⚠ **THE SLUGS WERE VERIFIED AGAINST THE CAST, NOT ASSUMED.** Each authored slug resolves to
      exactly one of the 46 registry rows, checked by surname match: `cardinal_himlensendt` is Arne
      Himlensendt (NPC-021) and `ehrenwall` is Lisbeth Ehrenwall (NPC-070) — neither spelling
      appears in the roster the way the faction file writes it, which is why this is a transcribed
      mapping and not a runtime string match.
      ⚠ **SIX OF EIGHT, AND THE SAME TWO ARE MISSING AS EVERYWHERE ELSE.** `Guilds` and
      `Schoenland` have no authored leader — and no `role_template`, and no expected-conviction
      vector. That is consistent rather than coincidental: a faction canon gives no head and no
      expectations has no creed to commit to, and this file does not invent one for it.
    by_faction:
      "Crown": "NPC-020"                    # Almud Almqvist
      "Church of Solmund": "NPC-021"        # Arne Himlensendt
      "Hafenmark": "NPC-050"                # Inge Baralta
      "Varfell": "NPC-052"                  # Magnus Vaynard
      "Restoration Movement": "NPC-003"     # Yrsa Vossen
      "Löwenritter": "NPC-070"              # Lisbeth Ehrenwall

  office_bodies:
    source: "`systems/world/reference/worldbuilding_v30.md` §6.1 (Court Parliament and Governance), §3.1 (Church Four-Cardinal structure), §4.1 (Löwenritter internal structure), §5.1 (Guild structure)."
    row: H-99
    note: >-
      ⚠ THIS IS THE *TYPE OF OFFICE* AXIS JORDAN ASKED FOR, AND IT IS CANON'S OWN ORGANIZATION
      NAMES RATHER THAN A TAXONOMY FOLDED OUT OF THEM. Jordan, 2026-09-02: *"does the office schema
      include faction belonging, scale of office, type of office, etc?"* — it did not; the office
      block carried `post`, `remit`, `why` and nothing else. World gives four tables of bodies with
      a Function column each, and the temptation was to collapse those functions into a tidy set
      (`judicial, military, economic, knowledge, administrative, ...`) because the Church's four
      arms and the Crown's five bodies genuinely do converge on one. THAT FOLD IS NOT TAKEN. World
      is canon for ORGANIZATIONS; an invented functional taxonomy sitting where canon named bodies
      would read as canon to the next session, which is the defect the precedence ruling names.
      ⚠ `faction` AND `function` ARE PROPERTIES OF THE BODY, SO AN OFFICE AUTHORS ONE FIELD AND
      DERIVES TWO. `office.body` is the authored value; the faction it belongs to and what it does
      are looked up here. Where a case's office has no canonical body — the Restoration Movement's
      authority is *"informal"* (§8) and it has no organ in world — `office.faction` is authored
      directly and `body` is absent. That is a real gap in canon, carried as one.
      ⚠ THE `function` STRINGS ARE QUOTED, NOT PARAPHRASED. Each is world's own Function/Portfolio
      cell, so a reader can diff this against the source table without interpretation in between.
      ⚠ `Lions' Helm` CARRIES ITS OWN CANON WARNING. §4.1's cell is literally *"Naval affairs [NO
      MECHANICS — ED-NEW-10: future naval design question]"*. It is a member because it is a real
      arm of a real faction; an office seated in it has no mechanical support and canon says so.
      ⚠ SCALE IS NOT HERE. An office's scale is the rung it is seated at (`rung_kinds`), which the
      case's `scale.is` already carries. A body does not fix a rung: `Praefectures` administer
      regions and `Ministries` serve the realm, but the SEAT is where the person sits.
    # ⚠ MEMBERSHIP LIVES IN `faction:`, NOT IN A `values:` LIST — the `titles` precedent (§8),
    # which also carries its membership in its mapping. A body with no faction is not a body.
    faction:
      # --- Crown / realm government · worldbuilding_v30.md §6.1 ---
      "Imperial Court": "Crown"
      "Court Parliament": "Crown"
      "Ministries": "Crown"
      "Rectorates": "Crown"
      "Praefectures": "Crown"
      # --- Church of Solmund · worldbuilding_v30.md §3.1 ---
      "Holy See": "Church of Solmund"
      "Cardinal of Fortitude": "Church of Solmund"
      "Cardinal of Justice": "Church of Solmund"
      "Cardinal of Prudence": "Church of Solmund"
      "Cardinal of Temperance": "Church of Solmund"
      # --- Löwenritter · worldbuilding_v30.md §4.1 ---
      "Lions' Table": "Löwenritter"
      "Lions' Helm": "Löwenritter"
      "Knights of the Peace": "Löwenritter"
      "Royal Investigators": "Löwenritter"
      "Riskbreakers": "Löwenritter"
      # --- Guilds · worldbuilding_v30.md §5.1, §5.3 ---
      "Guild": "Guilds"
      # --- LEADERSHIP bodies · npc_behavior_v30.md §2.15-§2.17 (TIER 2a, the superseding doc) ---
      # ⚠ THESE THREE ARE A DIFFERENT KIND OF ORGAN FROM THE SIXTEEN ABOVE, AND THE DIFFERENCE IS
      # STATED RATHER THAN BLURRED. World names ADMINISTRATIVE organs — a ministry executes, a
      # rectorate judges. These are the leader's INNER COUNCIL: who is in the room when the faction
      # decides. World does not name them, `npc_behavior_v30.md` does, and Jordan ruled it superior
      # to `faction_politics_v30.md` on 2026-09-13 — which matters here, because politics §1.2c/
      # §1.3c gives these councils four and five members where behaviour gives two and two.
      # ⚠ ONLY THREE ARE ADDED, AND THE RESTRAINT IS THIS FILE'S OWN PRECEDENT. `faction_politics_v30`
      # PART 7 names 22 more organs with quoted jurisdictions — six Crown ministries, six Hafenmark
      # committees, four Church dicasteries, five Varfell councils. NOT ONE IS READ by anything that
      # builds a world: `build_realm` takes an office's body from the sub-organization
      # `references/npc_registry.yaml` packs into its `faction` cell, and these three are what it
      # contains. Adding the other 22 would repeat `governance_modes` and `power_bases`, deleted from
      # this file for exactly that — "not wrong; UNREAD", and §0.1 pt 5 forbids apparatus that is
      # load-bearing on nothing. They go in the day a seat needs one.
      "Inner Circle": "Crown"
      "Inner Council": "Hafenmark"
      "Jarl Council": "Varfell"
    function:
      # --- Crown / realm government · worldbuilding_v30.md §6.1 ---
      "Imperial Court": "Advisory. Informal power arena."
      "Court Parliament": "Recommends policies, nominates Ministers/Rectorates/Magistrates."
      "Ministries": "Execute government services."
      "Rectorates": "Judicial. Execute law."
      "Praefectures": "Local governance. Administer regions."
      # --- Church of Solmund · worldbuilding_v30.md §3.1 ---
      "Holy See": "Church leadership. 'Holy See' = formal title, 'Confessor' = address (§2, ED-NEW-04)."
      "Cardinal of Fortitude": "Military. Knights Templar, enforcement, monstrous incursion suppression."
      "Cardinal of Justice": "Judicial. Inquisitors, Grand Adjudication, heresy investigation, text suppression."
      "Cardinal of Prudence": "Economic. Tithes, charities, Church land management."
      "Cardinal of Temperance": "Knowledge. Universities, observatories, monasteries, archives."
      # --- Löwenritter · worldbuilding_v30.md §4.1 ---
      "Lions' Table": "Military coordination, levy operations, Royal Guard."
      "Lions' Helm": "Naval affairs [NO MECHANICS — ED-NEW-10: future naval design question]."
      "Knights of the Peace": "Road patrol, civilian protection, law enforcement."
      "Royal Investigators": "Investigation, counter-espionage, court prosecution."
      "Riskbreakers": "Extralegal infiltration. Loyal to Valoria the concept, not institutions."
      # --- Guilds · worldbuilding_v30.md §5.1, §5.3 ---
      "Guild": "Burgher status: Guild Masters and Free Masters qualify for political participation."
      # ⚠ THE FUNCTION CELLS BELOW ARE COMPOSITIONAL, NOT PORTFOLIOS, AND THAT IS SAID HERE BECAUSE
      # THE NOTE ABOVE PROMISES QUOTED Function/Portfolio CELLS. Canon gives these three no portfolio
      # — `npc_behavior_v30.md` §2.15-§2.17 are tables of Role/Name/Conviction, and
      # `faction_canon_v30.md` §10 describes them by WHO IS IN THEM. So what is quoted is that, and
      # a reader is told it is that rather than left to assume a jurisdiction was dropped.
      "Inner Circle": "Inner Circle (5 named NPCs per npc_behavior §2.15) + Specialty Branches. The Crown leader's standing council."
      "Inner Council": "Inner Council (2 named per npc_behavior §2.16). The Duchess's standing council; §1.2c names four and is SUPERSEDED (Jordan, 2026-09-13)."
      "Jarl Council": "Jarl Council (2 named per npc_behavior §2.17). The Jarl Assembly's standing seats; §1.3c names five and is SUPERSEDED (Jordan, 2026-09-13)."

  goal_object_kinds:
    source: "v9 IN-66 (`workplans/valoria_master_workplan_v9_part5.md` A-31; ED-IN-0293 (8)) -- what a goal's `object:` may be, each kind with its reader (IN-67)."
    open: false
    note: >-
      WHAT AN ORGANIZATION'S GOAL IS ABOUT, read by `data/goals.py` (the ONE loader of
      `engine/season/goals.yaml`), which refuses a row whose `object.kind` is off this list.
      `person` -- one named person (`case:`, a cast case id). `seat_holders` -- the live holders of
      the listed `seats:` ("the monarch", "the royal family"), so the goal survives a succession.
      `rung` -- a place (`rung:`, a rung id; checked at seeding, IN-68, because a rung exists only
      once built). `deed_doers` -- the doers of a declared deed class, read from the holder's OWN
      ledger ("threats", "heretical activity", "corruption"): ONE of the `forms:` below.
      `orientation` -- a pure condition ("stability", "security") that mints no Proposition (an
      OUGHT about nobody is not a motive, the rule in `harness/populated.py::build_realm`'s want block); its `pursuits:` join
      the organization's expected vector. `open: false`: a sixth kind is a new reader, a design
      change and not a table edit.
      ⚠ `forms:` IS THE `deed_doers` KIND'S OWN CLOSED SET, kept on this row because it is that
      kind's referent grammar and nothing else reads it. `against` -- the doers of deeds whose
      patient is in a named goal's referents (`against: <goal id>`). `engaging` -- the doers of a
      deed whose kind engages a named affiliation (`engaging: <affiliation>`). `kinds` -- the doers
      of the listed deed kinds (`kinds: [<deed kind>, ...]`). A `deed_doers` object names EXACTLY
      ONE form.
    values: [person, seat_holders, rung, deed_doers, orientation]
    forms:
      deed_doers: [against, engaging, kinds]

  goal_derivations:
    source: "v9 IN-66 (`workplans/valoria_master_workplan_v9_part5.md` A-31, A-32; ED-IN-0293 (8)) -- how a goal at one organizational level derives from a goal at the level above."
    open: false
    note: >-
      THE TWO WAYS A GOAL'S `derives: {from: <goal id>, kind: ...}` MAY RELATE IT TO ITS PARENT,
      read by `data/goals.py`, which refuses a kind off this list. `establishes` -- the child goal
      REPLACES the parent for the child organization's members (an office's mandate is the
      faction's goal made specific). `influences` -- they commit to both. The roster names the
      two relations and nothing else: which commits follow is IN-68's seeding rule, not a definition.
    values: [establishes, influences]

  requires_operands:
    source: "`W-A`. The names a `requires_typed` cell may bind, closed."
    note: >-
      ⚠ THE OPERAND VOCABULARY IS CLOSED, AND THAT CLOSURE IS WHAT STOPS THE GRAMMAR BECOMING A
      SECOND RESOLVER. A cell naming an operand outside this roster REFUSES AT LOAD. It is the
      reason `exchange` carries `requires_typed: none` rather than a typed cell: it needs the
      counterparty's side of a trade, which has no name here. Coining one would be filling `H-94`
      by keyword argument, which is the ruling `H-94` is waiting for and not a table edit.
      (`comply` carried the same reason, for a DISPENSATION, until v9 IN-09 typed it without a new
      name: the act's `subject` IS the held writ, a `Record` of kind `dispensation` --
      `verb_table.yaml`'s `comply` row.)
      ⚠ WHERE AN OPERAND COMES FROM IS NOT THIS ROSTER'S QUESTION. Today it is `Act.payload`,
      which carries only `subject` for a computed act, so most cells bind incompletely and
      evaluate to UNKNOWN -- which the fold reports as a refusal, exactly as the untyped
      predicates did.
    values: [actor, subject, from, to, site, kind, amount, floor]

  record_sourced_operands:
    source: >-
      #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §10.1, *the shared enabler*, plan
      position IN-10 (`workplans/valoria_master_workplan_v9_part5.md`); it replaces plan position
      `15c`'s flat `writ_sourced_operands` (`to, kind, amount`), whose source was r2
      `02_THE_WRIT_AND_THE_WORD.md` §A.13.
    note: >-
      PER RECORD KIND, WHICH OF THE CLOSED EIGHT OPERANDS (`requires_operands`) A RECORD OF THAT KIND
      ANSWERS, AND FROM WHICH OF ITS OWN CONTENT KEYS -- `operand: content key`. `data/requires.py`
      refuses at import a kind that is not a `record_kinds` member, an empty entry, an operand that is
      not one of the eight, a content key that is not one of THAT KIND's keys (`record_kinds.values`),
      and `from` on any kind. ⚠ `from` IS ON NO KIND, r2's own ruling: a document naming *where the
      actor stands* would let a Duke's writ reach into a larder the executor is not standing in. `at`
      is no operand (r2: *"I do not coin a ninth operand"*), so no kind maps it. ⚠ `kind` AND `amount`
      LEFT WITH THE FLAT LIST: no live kind carries either key, so they declined every time and
      dropping them moves nothing; a later kind that carries them (the deferred `debt`) adds them here.
      ⚠ TWO READERS, `decision/options.py`, ONE MAP. (1) A QUESTION ABOUT A DOCUMENT (`q.about` names a
      `content:<kind>` claim in the asker's own ledger, `_from_content_claim`): the document answers
      every name it maps BUT `subject`, which stays the question's referent -- the act is about the
      document itself (`give` it, answer it). `15c`'s channel; it moves nothing. (2) A HELD RECORD
      (`held_record_claims`: the asker's own live `hold` on a Record whose content claim he holds):
      the document answers every name it maps, `subject` included -- the act is about what the
      document SAYS, so a held dispensation's `terms` answers `subject` (`_derive_operand`'s `held=`).
      `operand_bags` forms one bag per held Record whose `terms` is the referent the Candidate is
      formed on, on a row whose second side a known person fills (`known_person_operands`): the
      document's addressee is then a second side beside the persons the holder knows. No faction
      actor, no new form, no ninth operand, no coined name.
      ⚠ `faction_sheet` IS THE SHEET CONSUMER (v9 IN-45 `forge`, H-169 limit 5: *"no operand, cell or
      score reads `members`/`holdings`/`seats` off a `content:faction_sheet` claim"*), on H-169's own
      design order -- *"a sheet-sourced operand, `15c`'s route"* -- and so a ROW HERE, not a branch.
      A sheet answers `to` with the `head` it names: on a question about a sheet its holder holds,
      a petition (`to` bound without `subject`, reader (1)) is ADDRESSED TO WHOEVER THE SHEET SAYS
      HEADS THE FACTION -- the decision H-169's `unblocks:` names (*"a petition's addressee"*). A
      stale or forged sheet addresses it wrongly, and nothing tells the petitioner. `head` and not
      `members`/`seats`: it is the sheet's one single-person key, so it answers without
      `_content_answer`'s singleton collapse; `seats` are offices and a petition's addressee is a
      Person (`verb_table.yaml`'s `petition` row). `subject: proposition` keeps reader (2) on its
      own rule -- a held sheet adds a fanned bag only on an act about the faction it describes --
      where a sheet mapping no `subject` would pass that check vacuously on every referent.
      [ASSUMPTION; medium; Jordan to correct; revert: drop this row and the sheet is read by nothing
      again.] `head` is `None` on every true sheet this tree builds today (`queries/faction_q.py::
      head`: no `commit` carries a degree), so a true sheet answers nothing and falls through to the
      referent exactly as before; a forged one names its forger (`loop/effects_information.py::
      _eff_forge`).
    values:
      dispensation: {to: to, subject: terms}
      petition:     {to: to, subject: terms}
      faction_sheet: {to: head, subject: proposition}

  warrant_sourced:
    source: >-
      #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.1, the `seize` row: *"the warrant
      is the Candidate's source (a held dispensation whose `terms` names the Record)"*, and the
      Warrant row of its documents table (*"`dispensation` whose `terms` is a Person or a Record"*);
      plan position IN-12 step 6 (`workplans/valoria_master_workplan_v9_part5.md`).
    note: >-
      WHICH VERBS TAKE THEIR `subject` FROM A HELD WARRANT, AND WHICH RECORD KIND IS THE WARRANT --
      `verb: record kind`. ONE LOADER, `data/verbs.py::WARRANT_SOURCED`, read once beside the verb table and
      refused at import when a line names a verb the table lacks or a kind `record_sourced_operands`
      gives no `subject` key; both readers below import it from there. A verb named here is formed person-side ONLY on a `subject` that a held
      Record of that kind names (`decision/options.py::opening_set`: `held_record_claims`, answered
      through `record_sourced_operands`' `subject` key, the one map of what a Record's content says),
      and the effect's RECORD half licenses the act on the same reading read WORLD-side
      (`loop/effects_information.py::_held_warrant_names`, called by `_eff_seize`). ⚠ WHY A ROSTER AND NOT A FAN: IN-10's held-Record
      fan (`operand_bags`) is bound to a known-person operand (`known_person_operands`), and `seize`
      names no second party (#453 K-04), so the fan never reaches it; this is the one place that says
      a verb's referent comes from a warrant instead of from the question. Without the line a
      `remit:issue` seat forms `seize` on every Record any question names and the fold refuses it
      each time -- `requisition`'s scene tax (H-163) for a licence nobody holds. A warrant naming a PERSON
      (`arrest`, step 5) adds its own line here; a Person `subject` is declined by `seize`'s effect
      (since v9 IN-13 the row's `existence` conjunct is gone: its object widened to a Rung, and the
      effect, `_eff_seize`, declines anything that is neither a held Record nor an occupied
      settlement). The Rung half forms person-side wherever a held dispensation's `terms` names the rung
      (`test_season_shape.py` plants one on a hearth); at the effect it licenses on OCCUPATION, not on the
      warrant, so the formation and execution licences differ for the Rung half; no computed source of
      such a warrant has been measured. [ASSUMPTION; medium; Jordan to correct; revert: drop this roster, its
      loader (`data/verbs.py::WARRANT_SOURCED`) and its readers (`decision/options.py::opening_set` and
      `loop/effects_information.py::_held_warrant_names`),
      and `seize` forms on any referent, refused in the fold.]
    values:
      seize: dispensation

  terms_sourced:
    source: >-
      #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §10.1, *"What it unblocks: ... `commit`
      (a covenant dispensation's `terms` answers `subject`)"*, and §10.4 step 7's falsifier, *"the
      addressee's `commit` to the covenant's Proposition, formed from the held dispensation after a
      `give`"*; plan position IN-12 step 7 (`workplans/valoria_master_workplan_v9_part5.md`), the
      route `hole_register.yaml` H-94 records as missing (*"Proposition terms (a covenant, `commit`)
      have no route"*).
    note: >-
      WHICH VERBS MAY ALSO FORM ON WHAT A HELD DOCUMENT SAYS -- `verb: [record kinds]`. A verb named
      here forms, BESIDE its own referents, on the `terms` of each Record of a named kind that the
      question carries as a held writ (`queries/world_q.py::writs_held`: a Record on the person's own
      live `hold` whose addressee list names him, stamped `Record`-classed onto the question he
      answers), read off the person's OWN content claim on it (`decision/options.py::
      held_record_claims`, answered through `record_sourced_operands`' `subject` key -- the one map of
      what a Record is about). The act is about what the document SAYS, as IN-10's held-Record channel
      reads it (`_derive_operand`'s `held=`); the writ is the referent, so §F1 clause 3 is not widened
      past the question -- a person holding no such writ, or answering a question that does not carry
      it, forms exactly what he formed before. ⚠ WHY NOT IN-10's FAN: `operand_bags` fans held Records
      only on a row binding a known-person operand, and only where a Record's `terms` IS already the
      referent; `commit` binds `subject` alone, and nobody's question is ABOUT a Proposition he has
      only been handed, so the fan never reaches it. ⚠ WHY NOT A `referent_class: Proposition`: a row
      declaring a class forms ONLY on that class (`Question.referents_for`), so `commit` would lose
      the plain referents IN-11's utterer route forms on. ONE LOADER, `data/verbs.py::TERMS_SOURCED`,
      refused at import when a line names a verb the table lacks, or a kind that is no held-writ
      occasion (`RECORD_REFERENT_KINDS`, which `writs_held` stamps) or whose `subject` no held Record
      answers -- either would form for nobody. Whether the act then passes is the fold's (`commit`'s
      own cell: the terms exist and are a Proposition; a writ whose terms name a person is refused
      there, `commitment.refused`). [ASSUMPTION; medium; Jordan to correct; revert: drop this roster,
      its loader and its reader in `opening_set`, and `commit` forms on its question's referents
      only -- a covenant's addressee then never accepts it.]
    values:
      commit: [dispensation]

  vocation_sourced:
    source: >-
      #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.4, the `train` row: *"The
      capability raised ranges over the capability names `verb_capability` maps verbs to"*, and its
      blocker, *"a capability-key operand -- the `kind` operand ... [ASSUMPTION]"*; J-13 answered (iii)
      as the interim (`workplans/valoria_master_workplan_v9_part5.md` §J.1, RS-21 item 10, [medium;
      Jordan to correct]): *"`train` forms and writes `Person.capability` only where a case names a
      vocation, and `pool_default` holds everywhere else"*.
    note: >-
      WHICH VERBS CARRY A VOCATION, AND ON WHICH OPERAND -- `verb: operand`. A VOCATION is a
      capability key `verb_capability` maps some verb to (its VALUES, `data/verbs.py::VOCATIONS`;
      today `copying` only, #453 K-20's range). A verb named here forms ONE Candidate per vocation in
      that range, the key riding on the named operand (`decision/options.py::opening_set`) -- the
      `kind` operand #453 §9.4's blocker names, which `_derive_operand` would otherwise answer with a
      store kind. ⚠ THE ACTOR'S OWN CAPABILITY IS NOT READ, AND THAT IS THE POINT: capability GATES
      NOTHING (#353 §9.2; `harness/probes.py` P11 zeroes it and asks that the option set not move), so
      J-13 (iii)'s *"`train` forms ... only where a case names a vocation"* is built as its WRITE half
      only -- the effect (`loop/effects_combat.py::_eff_train`) raises the key only where the SUBJECT
      already holds it, and is refused everywhere else. ONE LOADER, `data/verbs.py::VOCATION_SOURCED`,
      refused at import when a line names a verb the table lacks, a verb that writes no
      `Person.capability`, or an operand outside `requires_operands`. [ASSUMPTION; medium; Jordan to
      correct; revert: a formation decline on the actor's own vocations (the plan's *"forms"* half),
      which first needs P11 / #353 §9.2 re-ruled for `train`.]
    values:
      train: kind

  held_document_declines:
    source: >-
      #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.3, the `conceal` row's producer
      line, *"a person-side decline while the actor holds a live cover"*, and §10.4 step 10 (the same
      words); its open-questions table, *"`decision/options.py::opening_set` | person-side own-state
      declines: ... plus `conceal`'s (a live cover)"*; plan position IN-12 step 10
      (`workplans/valoria_master_workplan_v9_part5.md`).
    note: >-
      WHICH VERBS A PERSON DOES NOT FORM WHILE HE HOLDS A DOCUMENT OF A NAMED KIND ABOUT HIMSELF --
      `verb: record kind`. Read in `decision/options.py::opening_set`, person-side and World-free
      (AX-2): the person's OWN live `hold` Tenures and the `content:<kind>` claims his OWN ledger holds
      on their objects (`loop/witness.py`'s content deposit to a new holder), declining the verb when
      one such claim's content names him. ⚠ "LIVE" IS READ AS "HELD", AND THAT IS THE NARROWEST
      PERSON-SIDE READING: whether a cover's stages have matured is world state (`Record.stages`, the
      log's `term.matured`, `state/attribution.py::live_cover`) that no ledger carries, so a person
      holding a cover whose stages have all matured still declines a new one until it leaves his hand
      (`destroy_record`, `give`). [ASSUMPTION; medium; Jordan to correct; revert: decline only while a
      stage is unmatured, which first needs a person-side carrier for maturity.] ONE LOADER,
      `data/verbs.py::HELD_DOCUMENT_DECLINES`, refused at import when a line names a verb the table
      lacks or a kind `record_kinds` does not carry.
    values:
      conceal: cover

  own_stance_declines:
    source: >-
      #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.4, the `forgive` row's requires
      line, *"that a negative row naming `subject` exists is a read of the actor's own state
      (`p.stance`), so it is a person-side decline in `opening_set`, not a stem: one own-state decline,
      beside the one pass 1 proposed for `release`"*; §10.4 step 13 (*"with its own person-side own-state
      decline"*); plan position IN-12 step 13 (`workplans/valoria_master_workplan_v9_part5.md`).
    note: >-
      WHICH VERBS A PERSON FORMS ONLY ON A REFERENT HE HOLDS A ROW AGAINST -- a list of verbs. Read in
      `decision/options.py::opening_set`, person-side and World-free (AX-2): his OWN `Person.stance`
      rows naming the referent with a valence below zero (`queries/person_q.py::held_against`, the one
      reader the verb's effect reads too); a referent he holds nothing against forms no Candidate, so no
      scene is spent on a `forgive.refused` he could have known. The roster names the verb and the loader VALIDATES it against the row's `writes:`; no verb name is spelt in code: ONE LOADER, `data/verbs.py::OWN_STANCE_DECLINES`, refused at import when a
      member names a verb the table lacks or one whose row writes no `Person.stance`. ⚠ `release`'s
      hook (#453 Appendix A, pass 1's §4: declined when the actor holds no releasable edge to the
      referent) is NOT built here: it reads `p.tenures`, not `p.stance`, and plan row 13 builds
      `forgive`'s decline beside it, not the hook itself. [ASSUMPTION; medium; Jordan to correct;
      revert: build `release`'s hook in the same position.]
    values: [forgive]

  own_hold_declines:
    source: >-
      plan position IN-26 (BOUND-PAPER, `workplans/valoria_master_workplan_v9_part5.md`), `A-13`'s
      *"record-holding referent"* (`_part5`'s A table: `destroy_record` *"needs a record-holding question
      referent -- `give`'s shape"*); `own_stance_declines`' shape (above), one field over.
    note: >-
      WHICH VERBS A PERSON FORMS ONLY ON A REFERENT HE HIMSELF HOLDS -- a list of verbs. Read in
      `decision/options.py::opening_set`, person-side and World-free (AX-2): the objects of his OWN live
      `hold` Tenures; a referent he does not hold forms no Candidate, so no scene is spent on a refusal of
      the row's `held_by` conjunct he could have known. It is the person-side reading of that conjunct for the verbs LISTED (six rows carry the conjunct;
      this roster names the ones whose formation it narrows): ONE LOADER, `data/verbs.py::OWN_HOLD_DECLINES`, refused at import when a member names a
      verb the table lacks or one whose typed cell asks no `relation` of `subject` `held_by`. What he holds
      that is no Record (a seat, a Proposition he uttered) still forms and is refused at the row's
      `existence` conjunct, whose read clause 4 then learns (H-156's decaying shape).
      [ASSUMPTION; medium; Jordan to correct; revert: drop the member, and `destroy_record` forms on every
      referent, plan position `14`'s measured shape.]
    values: [destroy_record]

  shortfall_sourced_operands:
    source: >-
      plan position `19d` (DEMAND · DELIVERY), `workplans/2026-09-28-the-plan-one-order-mc-v18-retired.md`
      §3.2 row 11, and the driver-retirement plan's G3: *"wiring the existing `transfer` verb's
      operands from a shortfall claim"*.
    note: >-
      ⚠ `record_sourced_operands`' CLAIM-SOURCED SHAPE, ONE ROW DOWN, FOR A SECOND KIND OF CLAIM: the operand names a
      SHORTFALL CLAIM may answer, before `decision/options.py::_derive_operand` falls through to the
      referent or the fixture. A subset of `requires_operands`, refused at import otherwise
      (`data/requires.py`). The claim is `(rung, "<predicate>:<kind>", units)`: MATTER records it
      on the `stores.changed` Event of a larder the draw ran dry with a mouth unfed, as `demanded -
      delivered` over the rung's subtree (`queries/world_q.py`), and WITNESS deposits it into those
      who witness that write.
      ⚠ TWO NAMES, NOT THREE, AND `to` IS LEFT OUT ON PURPOSE. For a `claim_landed` question the
      referent IS the claim's subject (`questions_for` builds `(c.subject,)`), so `to` already binds
      the drained rung through the referent rule. A claim branch for it would always return the same
      value as the fallback beneath it, and a branch that can never change an outcome is `ID-13`.
      A document maps `to` because a writ's addressee is NOT its subject (the Record). `from` stays
      the actor's own rung for r2 §A.13's reason: a claim about somewhere else must not reach into a
      larder the actor is not standing in.
      ⚠ THE PREDICATE STEM IS DATA, AND IT MAY NOT BE A WORD THE `requires` GRAMMAR READS: a claim
      whose stem `LedgerReader` answered would become a belief about a store LEVEL. It may not be
      the content stem either. `data/requires.py` refuses both collisions at import.
    claim:
      predicate: shortfall
    values: [kind, amount]

  known_person_operands:
    source: >-
      telling workplan `T4` (`workplans/2026-10-01-telling-workplan.md` §3 and §4, `ED-IN-0282`):
      *"`known_persons`: ids from truthy `exists:Person` claims, `Seen.who`, told `chain[-1]`; minus
      self and referent"*, and one Candidate per known person.
    note: >-
      ⚠ THE SIBLINGS' SHAPE FOR A THIRD KIND OF ANSWER: the operand names a person answers with
      SOMEBODY THEY KNOW rather than with the question's referent. A subset of `requires_operands`,
      refused at import otherwise (`data/requires.py`). `decision/options.py::operand_bags` forms one
      operand bag per known person, and only for a row whose typed cell binds `subject` SEPARATELY
      from the name -- `tell`, whose topic is `subject` and whose hearer is `to`, since plan
      position `14` `give`, whose Record is `subject` and whose receiver is `to`, and since plan
      position IN-10 (#453 §10.1) `issue`, whose `terms` is `subject` and whose executor is `to`, so a
      writ is no longer addressed to what it is about. A row binding `to` without `subject`
      (`petition`) keeps the referent rule: what it is addressed to IS what it is about there,
      `H-94`'s single referent. Since IN-10 a held Record's addressee is a second side too
      (`record_sourced_operands`, reader (2)).
      ⚠ `claim` IS WHERE A PERSON BECOMES KNOWN, and `queries/person_q.py::known_persons` reads it:
      `predicate` -- a truthy existence reading of a person (deposited by the `existence` form's
      fold); `seen_term` -- the `seen` claim's term naming who was seen doing something. The third
      source, the teller of a told claim (`Claim.chain[-1]`), is structural and needs no row here.
      Nothing else makes a person known: no roster of acquaintances, no world read.
    claim:
      predicate: "exists:Person"
      seen_term: who
    values: [to]

  intent_claim:
    source: >-
      v9 IN-16, telling `T7` (G9, declared intent; `workplans/valoria_master_workplan_v9_part4.md`,
      `ED-IN-0282`): *"a teller may tell a hearer an act they have CHOSEN-AND-NOT-YET-DONE, as a
      position and a claim kind"*.
    note: >-
      THE CLAIM KIND A DECLARED INTENT IS. `decision/choose.py::declare_intents` mints it at CHOOSE,
      through `queries/person_q.py::intent_said`, onto a telling's `said`, so the told deposit lands
      it in each hearer's ledger as `(teller, <stem>:<verb>, ((name, id), ...))`: `claim.predicate`
      is the STEM, the intended act's verb its argument, and `values` are the operand names of the
      intended act whose ids the value carries, in this order. `queries/world_q.py::named` reads
      those ids back (through `person_q.intent_named`), so a hearer whose reach covers a person or
      place the intent names is raised a `claim_landed` question about the teller. ⚠ NOT A CELL:
      the stem is refused at import if it is a `requires` grammar stem (it would read as a world
      fact and `record` would pair it), the `seen` predicate, the `content:` predicate or an emitted
      event kind (`person_q._check_intent_claim`). Whether the act was later done is not read by
      anything (`hole_register.yaml` `H-191`).
    claim:
      predicate: intent
    values: [subject, to]

  stance_polarities:
    source: >-
      v9 IN-18 `G2` (telling workplan §5, `ED-IN-0282`): *"polarity in §F2 term 2"* -- the score's
      regard term read by the ROLE the regarded party plays in the act, with `declared` against
      `legacy` as the falsifier's two arms.
    note: >-
      THE ARMS OF `Fixtures.stance_polarity` (`H-194`), read by `decision/choose.py::stance_term`
      (its `_stance_arm`), score term 2. `legacy` is the pre-G2 term, `+ stance_toward(p, c.subject)` for every row --
      the CONTROL, shipped: an act against a disliked opponent then scores LOWER, the sign §F2's
      term never distinguished. `declared` reads `regard(p, c.subject)` (G1's, so its judged and
      told halves enter at their own gains) and NEGATES it where the subject is the act's OPPONENT
      (`decision/options.py::subject_is_opponent`: the row contests and names no counterparty), so
      fighting the disliked scores higher. A Rung subject reads 0 at G1's control; at live gains it
      reads the deed claims held about it (`transfer.made` on a changed rung, under
      `claim_subject_rule: both`). Its regarded party under the ROLE reading would be its HOLDER,
      and no ledger holds a `held_by` claim (M0g, `H-195`). `regard` is the
      midpoint: G1's regard with `+` on every row, so the sweep separates what regard adds from
      what the sign adds.
    values: [legacy, regard, declared]

  said_slants:
    source: >-
      v9 IN-18 `G3` (telling workplan §5, `ED-IN-0282`): *"slant -- the strongly valenced older
      claim is told under `valence`, the newer neutral one at control"*.
    note: >-
      THE ARMS OF `Fixtures.said_slant` (`H-196`), read by `queries/person_q.py::said_of`. `newest`
      is the pre-G3 pick -- the newest non-`seen` claim about the subject, then the most confident
      -- the CONTROL, shipped. `valence` first narrows the teller's claims about the subject to
      those THEY judge most strongly (the largest `|deed_valence|` by their own pursuits) and picks
      among those by the same comparator; with no valenced claim it is `newest` exactly.
    values: [newest, valence]

  beneficiary_kinds:
    source: >-
      `CAT-2`, closed at step 5 (`proposals/2026-09-17-governance-and-behaviour/RULINGS.yaml`).
      The carriers a verb's `beneficiary:` column may name -- *"a carrier a Candidate ALREADY
      holds (the actor, `subject`, or a named operand), NOT a fifth field on `Candidate`."*
    note: >-
      ⚠ THIS IS A SUBSET OF `requires_operands` PLUS TWO, AND IT IS NOT THAT ROSTER. The operand
      vocabulary says what a PRECONDITION may bind; this says who an act is taken FOR THE GOOD OF.
      `from`, `site`, `kind`, `amount` and `floor` are absent because none of them names a person,
      and a beneficiary that is not a person is not a beneficiary -- it is the `none` member.
      ⚠ `actor` IS A MEMBER HERE AND IS NEVER CARRIED IN `operands` (`operands_for` skips it:
      *"`actor` is structural on both sides and is never carried"*). That asymmetry is the point.
      The actor is the one carrier every Candidate holds unconditionally, so a verb declaring
      `beneficiary: actor` resolves for every candidate ever formed, where `to` resolves only
      where the cell binds it.
      ⚠ `none` IS A DECLARATION, NOT A BLANK, and the loader requires the column on every row.
      An act whose good accrues to a Record, an Office, a Site or a Rung has no person-beneficiary
      the Candidate carries, and saying so in the data is what distinguishes it from a row nobody
      graded. Absence would read as `false` for every verb -- the UNKNOWN/False collapse
      `operands_for` refuses one level down.
      ⚠ WHAT THIS ROSTER DOES NOT DECIDE: the WEIGHT. `synthesis.md` §1.3 spells the term
      `orient · benefits_me(c)`. CORRECTED 2026-09-20 (`ED-IN-0260`): this note read *"`orient` is
      a Person-interior scalar with no producer (`STR-1`, phase 6e)"*, which proves too much --
      no verb writes `Person.convictions` either, and that is term 1 of the live score. The
      missing piece is the STATE: `Person` has no `orient` field and `data/cast.py` skips the 28
      authored `self_other_initial` values in `references/npc_registry.yaml`. The term is `6f`'s.
      This roster and its column deliver `benefits_me(c)`; nothing multiplies it yet, and
      `decision/choose.py`'s `score` is untouched.
    values: [actor, subject, to, none]
    # ⚠ WHICH MEMBERS NEED A CELL TO BIND, DECLARED PER MEMBER RATHER THAN DERIVED IN A BODY.
    # `structural` -- the carrier is on the Candidate no matter what the row's `requires_typed`
    # says (`actor` is held by every Candidate; `subject` is a field on it; `none` carries
    # nothing by definition). `operand` -- carried ONLY where the row's own cell binds or admits
    # it, so loader invariant 13's third check must verify carriability for it.
    # ⚠⚠ THIS EXISTS BECAUSE `verbs.py` HELD THE SPLIT AS A LITERAL AND JORDAN'S OWN GUARD CAUGHT
    # IT (`test_jordan_no_definition_is_hardcoded_in_a_body`). A hand-kept tuple beside a roster
    # that promises *"a fifth carrier is a data edit argued for in the roster rather than a new
    # string here"* is the second owner that promise exists to prevent: add a member, and the
    # check silently does not cover it. Classified here, a new member without a classification
    # REFUSES at load instead.
    carriage: {actor: structural, subject: structural, to: operand, none: structural}

  requires_forms:
    source: >-
      `architecture/meta/04_CODE_ARCHITECTURE.md` §F.24a -- SEVEN forms, read
      off the 32 live `requires` cells rather than designed. `F.24` had said *"assumed: a small
      typed predicate grammar"* and supplied none.
    note: >-
      ⚠ CLOSED AT SEVEN. A cell naming a form outside this roster REFUSES AT LOAD, because an
      eighth form is a new thing a precondition can ask and that is a design change, not a table
      edit -- the same polarity `eligibility_kinds` already carries against a fifth kind.
      ⚠ TWO OF THE SEVEN HAVE NO TYPED CELL TODAY AND THAT IS NOT AN OMISSION. `cardinality`'s and
      `basis`'s only live cells are `confer` and `revoke`, whose eligibility is `remit:` and not
      `own`; `W-A` types the `own`-eligible rows, so those two keep their `REQUIRES_PREDICATES`
      entry and this roster records that the grammar has room for them.
      ⚠ `existence` IS READ WIDER THAN §F.24a's ONE-LINE GLOSS, DELIBERATELY. The gloss says
      *"existence over an edge kind"* and names `repudiate` (a live `commit`) and `revoke` (a live
      `hold`). But §F.24a also claims the seven forms close 30 of 32 cells, and `carry` (*a
      Petition exists*), `commit` (*the Proposition exists*) and `dispatch` (*the named person
      exists*) fit no other form -- so the closure claim is only true if `existence` covers an
      OBJECT of a named class as well as an EDGE of a named kind. It is read that way here, and
      the widening is stated rather than left for a reader to infer from a passing test.
      DORMANT BRANCH (ID-13 shape): v9 IN-11 cut `repudiate`, and no `requires_typed` cell in
      `verb_table.yaml` names a tenure kind now (the `existence` cells name Person, Proposition,
      petition, Record, works, Rung, Site and DocketItem), so `queries/world_q.py`'s
      `exists:<edge kind>` branch is reached by no cell; it stays, unchanged.
      ⚠ CONJUNCTION IS NOT AN EIGHTH FORM. `restore` (*the site exists AND the actor is present at
      it*), `confer` and `revoke` all carry an `and` IN THE PROSE, so a cell may be written as
      `all: [<form>, <form>]`. §F.24a enumerated the ATOMS; the `and` was already in the cells it
      read. Disjunction is deliberately absent: `confer`'s `or` is the only one, `confer` is not
      `own`-eligible, and adding a combinator no cell uses is the dead carrier `ID-13` refuses.
      `needs:` is the closed set of operands a cell OF THAT FORM may reference -- checked at load
      against `requires_operands`, so a form cannot quietly reach an operand its shape has no use
      for.
    values: [existence, scalar_threshold, contain_path, cardinality, relation, own_ledger, basis]
    needs:
      existence:        [subject, site, from, to]
      scalar_threshold: [subject, site, from, to, kind, amount, floor]
      contain_path:     [actor, subject, from, to]
      cardinality:      [subject, from, to]
      relation:         [actor, subject, site, from, to]
      own_ledger:       [subject]
      basis:            [subject, from, to]

  fan_out_modes:
    source: "`H-33`'s declared sweep. The three arm names were PYTHON LITERALS in `epistemic.py::observers_for`'s if/elif/else until 2026-09-16; its `else` already REFUSED an unrecognised mode, so the closed set was enforced — it was simply not data."
    cite: "H-33"
    note: >-
      ⚠ MOVED HERE UNDER JORDAN'S 2026-09-02 RULING, WHICH `data/rosters.py:70-73` quotes:
      *"I do not want definitions etc to be hardcoded"* … *"these must be easy to modify"* …
      *"that goes for all"*. Six rosters moved then and this one was missed, which is visible
      in the asymmetry it left: its SIBLING switch `observation_deposit_modes` is a roster read
      at `loop/witness.py`, while this one's arms lived in code. Two switches on the same
      pipeline, one governed as data and one not.
      ⚠ THIS ROSTER NAMES THE ARMS AND NOTHING ELSE. Which channels each arm selects is
      BEHAVIOUR and stays in `epistemic.py::observers_for` — `total` short-circuits to everyone,
      `presence_only` selects `co_located`, `all_five` selects `witness_channels` entire. Moving
      the dispatch here would make this file carry a rule rather than a definition.
      ⚠ THE DEFAULT IS NOT HERE EITHER — it is the `fan_out_mode` FIXTURE
      (`data/fixtures.py`), because a default is a value standing free of the roster, which
      `04 §B.13`'s own line makes a fixture: *"a number standing free of any roster is a
      fixture"*. R7 (ED-IN-0205) moved it off `total`; this roster says nothing about that.
    values: [total, presence_only, all_five]

  conferral_bases:
    source: "JORDAN, ED-IN-0256 ruling (2), 2026-09-18, VERBATIM: *\"appointed, elected, annex\"* -- HOW A SEAT IS FILLED. Plan position `13d-i`."
    open: false
    note: >-
      ⚠ THE VALUES ARE THE RULING'S, THE SHAPE IS r2's (`proposals/2026-09-17-governance-and-holdings-r2/03_SEATS_AND_CONTENT.md`
      §A.4). r2 spelled this roster `[confer, determine, succeed]`, keyed on the ACT that opens
      the hold; that list predates ED-IN-0256 and is superseded by it. The two vocabularies do not
      correspond by name, so no r2 seat's value carries over -- a seat's basis is authored against
      THIS list. `open: false`: a fourth way to fill a seat is a design change, not a table edit.
      READ BY: `Office.__post_init__`, which refuses a declared basis off this list (the
      `remit_acts` refusal's shape, so a typo is loud rather than a seat nobody can ever fill), and
      `state/gate.py::has_conferral_basis` (moved from `loop/predicates.py` by G3, since the gate
      asks it and may not import the loop; `predicates.py` re-imports the name), the ONE basis test
      `_req_confer` and `_req_establish` share, and `state/gate.py::REVOCATION_DISPOSAL` (v9 IN-31: what a revocation costs, by this basis) -- CORRECTED (antagonist pass, 2026-09-27), this
      said `loop/predicates.py::has_conferral_basis`. ⚠ NOTHING DISCRIMINATES BETWEEN THE THREE YET: `confer` admits a seat
      declaring any of them. Which act fills an `elected` or an `annex` seat is not ruled, and no
      election or annexation verb exists; narrowing `confer` to `appointed` would leave the other
      two seats fillable by nothing.
    values: [appointed, elected, annex]

  revocation_bases:
    source: "JORDAN, ED-IN-0256 ruling (3), 2026-09-18, VERBATIM: *\"rung above of same faction\"* -- WHO MAY STRIP A SEAT. Plan position `13d-i`; closes the `is_title` branch (`H-109`)."
    open: false
    note: >-
      ⚠ TWO VALUES. `rung_above_in_holdings` (JORDAN, 2026-10-12: *"it's not ONLY based on hierarchy of rungs,
      but also where it is placed in holdings"*): the seat's rung is one of the revoker's HOLDINGS and the
      revoker sits on the rung directly above; a seat whose rung nobody holds is stripped by nobody, its
      holder resigns. `rung_above_same_faction`, the one value ED-IN-0256 ruled: the holder of a seat on the rung DIRECTLY ABOVE the
      seat's own rung, in the SAME faction -- structural, NOT a rank comparison, and applied to
      every seat alike. It replaces both of the 2026-09-02 rules the `titles` note above records
      (purview for an office; purview + holdings + higher rank for a title) and r2's
      `[purview, holdings, none]`. A seat with NO declared basis (`None`) is revocable by nobody,
      which is what r2's `none` meant; it needs no member of its own.
      ⚠ THIS ROSTER NAMES THE BASIS AND NOTHING ELSE -- the `fan_out_modes` split above. The rule
      is BEHAVIOUR and lives in `state/gate.py` (`REVOCATION_RULES`, moved from `loop/predicates.py`
      by G3 for the same reason as `has_conferral_basis` above -- CORRECTED, antagonist pass,
      2026-09-27), which refuses at IMPORT if a member here has no rule there or the reverse, so
      the roster cannot grow a value the resolver silently treats as another.
    values: [rung_above_same_faction, rung_above_in_holdings]

  binds_bases:
    source: "`ARCH §B.7`'s ratified `Seat :=` line, `remit(acts[], binds)`, and `ARCH F.17`'s own resolution of *how a person joins an establishment* -- *\"`oblige`'s `requires` reads the seat's `binds`\"*. r2 `05_LEDGER_AND_BUILD.md` §A.1.5 RULED (b). Plan position `17a`."
    open: false
    note: >-
      HOW A SEAT TAKES ON THOSE WHO SERVE IT -- the seat's third rostered basis, beside
      `conferral_bases` (how it is filled) and `revocation_bases` (who may strip it), in the same
      shape. ONE VALUE, because one was ruled: `members_by_admission`, the `Office.binds` default on
      every seat in the tree. A person joins by their OWN `oblige` (`own`-eligible), so admission is
      the joiner's act and `remit_acts` needs no sixth member -- the cost `ARCH F.17` warns of
      (*"a ruling, not a row"*), avoided.
      READ BY: `Office.__post_init__`, which refuses a declared value off this list (the sibling
      rosters' refusal, so a typo is loud rather than a seat nobody can ever join), and
      `loop/predicates.py::_req_oblige`, which admits an `oblige` only to a seat whose `binds` is a
      member -- `has_conferral_basis`'s shape one field along.
      ⚠ A ROSTER WITH ONE VALUE AND ONE READER, CONCEDED IN r2 `05` RULED (b)'s own counter-argument:
      today every seat answers the same, and what answers that is the reader landing the same day.
      `open: false` -- a second way to bind is a design change, and it arrives WITH its rule in
      `_req_oblige`, not as a table edit the predicate would read as this one.
    values: [members_by_admission]

  interposition_kinds:
    source: "`proposals/2026-09-05-proceedings-subsystem/03_PARAMETERS.md` PART D's `interposed:` schema comment -- Fig. 24 -- and §E.2's twelve worked rows, every one of which draws its `interposed:` list from exactly this set. Plan position `18` (PROC-A)."
    open: true
    note: >-
      ⚠ WHAT AN ARRANGEMENT'S `interposed:` KEY IS A SUBSET OF (`data/arrangements.py`'s loader
      checks membership against this roster, not a local literal). `latitude` is DERIVED from
      `interposed[]` (§B.1) -- never stored, never a roster value of its own -- so this roster
      names WHO OR WHAT MAY STAND BETWEEN A PARTY AND THE ROOM, not the derived quantity.
      `pair` is two envoys who must agree before anything is reported (§E.2, "negotiation through
      envoys") -- a genuine sixth kind, not a multiplicity of `person`.
    values: [person, office, document, procedure, ceremony, pair]

  genres:
    source: "`03_PARAMETERS.md` §B.3 / Fig. 23 -- the genre triangle. `genre` is DERIVED from the bench's remit acts (a Query, never an authored key on a row -- §B.3: \"not a field on the game\"), and is a SET, not a single value (the assembly-as-magistrate bend needs both `forensic` and `deliberative` at once). This roster is the closed CODOMAIN that derivation may return into, the same relationship `rung_kinds` has to `title_domain`."
    open: true
    note: >-
      `forensic` -- a PAST matter, did it happen: the issue ladder runs. `deliberative` -- a
      FUTURE matter, shall we do it: no issue ladder: the fact is not in dispute. `epideictic` --
      no bench at all: amplification; the only prize is standing. ⚠ NOTHING DERIVES `genre` YET
      (the Query is `19_PLAN.md` PHASE 2/3 work, not this position's five parts) -- this roster is
      the closed set that derivation will read into, authored now because `speech_kinds`' own
      "which genres it is apt in" column already needs somewhere closed to point at.
    values: [forensic, deliberative, epideictic]

  proofs:
    source: "`03_PARAMETERS.md` PART D's `proofs:` schema comment -- Fig. 6 -- and §E.2's worked rows (`record`, `testimony`, `oath`, `confession` are the four names actually used across all twelve games)."
    open: true
    note: >-
      ⚠ A KNOWN-THIN ROSTER, NAMED RATHER THAN PADDED. `03_PARAMETERS.md` §E.2's own examination
      row flags a strain: what an examination weighs is a *performance*, and Fig. 6 (which this
      roster transcribes) enumerates what a FORENSIC proceeding admits -- so `proofs` may need a
      fifth member (`performance`) once a non-forensic proof-bearing game is authored, registered
      there as `10_LOOPS_AND_GAPS.md` `P-13` and NOT invented here. Adding a member is a roster
      edit, never a code change -- the closure claim this roster exists to make survives the gap.
    values: [record, testimony, oath, confession]

  ladder_rungs:
    source: "`18_FINDINGS.md`:180 and §5 item 5 (Fig. 27) -- the forensic ISSUE LADDER a party descends under `interrogation`'s `order: scripted` / `registers: [restricted]`, verbatim: \"deny, cite something incompatible, impugn the motive, concede the fact, concede the harm, hand the error back.\" Plan position `18` (PROC-A)."
    open: true
    note: >-
      ⚠ SIX RUNGS, ORDERED HIGH-TO-LOW (deny is the strongest position; handing the error back
      concedes everything). `speech_kinds` reuses these SAME SIX AS ITS ONLY SIX MEMBERS (below,
      itself flagged partial against the ten `19_PLAN.md` step 7 promises) rather than minting a
      second vocabulary for what is, on this corpus's own reading, one ladder read two ways -- a
      RUNG one descends and a KIND OF SPEECH one performs to descend it are the same six acts.
      `impugn_motive` is `18_FINDINGS.md`'s *"Partial by construction"* figure (Fig. 24's fixed
      native band, §5 item 5) -- reachable-bands data on `speech_kinds`' own row, not a second
      roster.
    values: [deny, cite_incompatible, impugn_motive, concede_fact, concede_harm, hand_error_back]

  module_kinds:
    source: "plan v8 `_part5` `### A-25` (`ED-IN-0284`, revised by `ED-IN-0285`) -- the seven headings of its roster paragraph."
    cite: "A-25"
    note: >-
      WHAT A `modules:` ENTRY IS, one word each, defined here and in `data/rosters.py` where the loader
      reads it (`CLAUDE.md` §4). `minigame` -- a container the player can also play as a game inside
      the game (combat, mass battle, social contests, fieldwork). `management_space` -- a container
      played as an interface over the world (governance, faction management, the character sheet).
      `world_surface` -- where the player meets NPCs and events: DELIBERATE's player mode, unbuilt.
      `loop_resident` -- computation that runs inside the season loop's own steps. `data_register` --
      a centralized register of information the loop reads, not a module. `host` -- the season loop's
      own work, never a module. `stub` -- not a system of gameplay, kept so its name still resolves.
    values: [minigame, management_space, world_surface, loop_resident, data_register, host, stub]

  modules:
    source: "plan v8 `_part5` `### A-25`'s roster paragraph -- authored from the list `ED-IN-0284` and `ED-IN-0285` rule, NOT from the directories that hold code (that test drops `factions`, whose directory holds at most an untracked identifier census)."
    cite: "A-25; ED-IN-0284; ED-IN-0285"
    note: >-
      THE ONE OWNER OF RETENTION (A-25, `SM-14`): what the repository keeps as a system, a host
      concern or a stub, and where each one lives. The KEY is the entry's one identity -- for a
      module, its directory name (A-25: `combat`, never `personal_combat`; a `provider:` name on a
      prize row says what runs and is a different name). `kind:` is a `module_kinds` member. `home:`
      is the repo-relative path the entry lives at -- a directory ends in `/`; `npcs`' is the one file
      that holds it; a home may not exist
      yet (`game/` is unbuilt) and nothing here moves a file (`31a`-`31c` move module code into
      `modules/<name>/`, which A-25 derives from the composition rows, not from this roster). A
      `systems/<name>/` directory that no entry names as its `home:` is not retained as a system:
      `R04_PENDING_SUBSYSTEMS` is computed from exactly that, and `tools/evacuation_plan.py` reads
      its two `systems/` rules from here instead of spelling directories. ⚠ [ASSUMPTION, position
      `30`] the four stubs' homes follow `ED-IN-0284`'s own reasons -- `articulation` and `ui` are
      presentation (holonic §45's `game/`), `victory` is a set of conditions the host would
      evaluate (`H-176`, unbuilt), `_architecture` is not a system and its subject is Layer 1's --
      so none is a `systems/` home, and a `systems/<stub>/` directory, where one exists, stays in
      `R04_PENDING_SUBSYSTEMS` as `ED-IN-0284` rules (with `npcs`). `factions` keeps `systems/factions/` (`ED-IN-0283`: the folders are the
      homes of their systems); its automated play is `decision/` (A-25).
    members:
      combat:          {kind: minigame,         home: "systems/combat/"}
      mass_battle:     {kind: minigame,         home: "systems/mass_battle/"}
      social_contest:  {kind: minigame,         home: "systems/social_contest/"}
      fieldwork:       {kind: minigame,         home: "systems/fieldwork/"}
      governance:      {kind: management_space, home: "engine/season/"}
      factions:        {kind: management_space, home: "systems/factions/"}
      characters:      {kind: management_space, home: "systems/characters/"}
      world_surface:   {kind: world_surface,    home: "game/"}
      settlements:     {kind: loop_resident,    home: "systems/settlements/"}
      overview:        {kind: loop_resident,    home: "systems/overview/"}
      threadwork:      {kind: loop_resident,    home: "systems/threadwork/"}
      world:           {kind: data_register,    home: "systems/world/"}
      npcs:            {kind: data_register,    home: "references/npc_registry.yaml"}
      decision:        {kind: host,             home: "engine/season/decision/"}
      proceedings:     {kind: host,             home: "engine/season/"}
      _architecture:   {kind: stub,             home: "architecture/"}
      articulation:    {kind: stub,             home: "game/"}
      ui:              {kind: stub,             home: "game/"}
      victory:         {kind: stub,             home: "engine/season/"}

  standing_routes:
    source: "proceedings `19_PLAN.md` PHASE 3 step 20 (route erosion) and `03_PARAMETERS.md` row 25 (`route ∈ {prestige, dominance}`, *it sets the EROSION PROFILE*), read as INTENT; built at v9 SC-02 `22a` (B-P)"
    open: true
    note: >-
      THE PARTITION OF THE DEED KINDS BY THE ROUTE TO STANDING THE ACT TAKES, read by
      `queries/world_q.py::reception` and nothing else. `dominance` lists the COERCIVE kinds -- an act
      that takes from, or forces, another (a death, a wound, a field won, a seizure, a requisition);
      `prestige` is EVERY OTHER deed kind, the complement, so it carries no list: the one behaviour
      step 20 rules (*a failure against a dominance-standing speaker zeroes that hearer's
      dominance-sourced weight: the single called bluff*) reads the coercive half only, and a second
      list nothing read would be a declared-but-unread carrier. A hearer who holds, untold, a
      dominance-kind deed done TO the speaker by somebody else (`person_q.suffered_deeds`, the
      `seen.who` pairing) stops counting every dominance-kind deed of the speaker's no newer than it.
      Every member must be a deed kind (`data/verbs.py::DEED_KINDS`); `data/verbs.py::_check_dominance_kinds` refuses at
      import otherwise. [ASSUMPTION; medium; Jordan to correct -- the membership: which acts are
      coercive is stated nowhere in the corpus; revert: an empty `dominance` list, and no hearer's
      weight is ever eroded.]
    values: [dominance, prestige]
    kinds:
      dominance: [person.died, body.changed, field.won, rung.seized, record.seized, requisition.taken]

  # ── v9 FI-02 + FI-03 (`SM-3`, `ED-FI-0002`): THE INQUIRY ROLE AND WHAT A FINDING UNCOVERS ─────────
  # Appended after `modules:` rather than beside `graded_inquiries`, so no line-cited row above moves.
  inquiry_modules:
    source: >-
      v9 FI-02 (`SM-3`, Jordan 2026-09-05: *"investigation is not a contest seam. it is its own
      thing."*), built in one landing with FI-03 (`ED-FI-0002`, the counter-espionage loop with
      fieldwork as host): the second role in `manifest/registry.py::_ROLE_ROSTERS`, `inquiry`.
    cite: "SM-3; ED-FI-0002"
    note: >-
      ⚠ KEYED BY THE KIND A FINDING EMITS, NEVER BY THE VERB. `graded_inquiries` is already the
      verb-keyed table, and FI-01 rules it a ROUTE that may carry nothing but `{provider,
      module_entry}` (`data/verbs.py`), so a second verb-keyed table would be two tables on one key.
      A prize is what is contested; the inquiry analogue is what is FOUND, so the key is the Event
      kind -- `undeposited_kinds`' keying, for its reason. A `Failure` inquiry emits `finding.none`,
      which no row claims, so `manifest.resolve("inquiry", ...)` answers `None` and nothing is found,
      with no branch on a band anywhere in the host. An ungraded `finding.made` (`interview`,
      `reconstruct`, `thread_read`) reaches the row and finds nothing: it carries no degree, and
      `finding_terms` keys on the degree. Each row names `module:` (the module's one identity, its
      directory, A-25), `provider:` (`@provider("inquiry", ...)`, `seam/wrappers/fieldwork.py`) and
      `module_entry:` (the composition row the provider calls through `MODULE_ENTRIES`). Refused at
      driver construction by `manifest/registry.py::check_inquiry_modules`, and at boot by
      `check_rows()` naming the row.
    findings:
      "finding.made": {module: "fieldwork", provider: "fieldwork", module_entry: "fieldwork.find"}

  finding_terms:
    source: >-
      v9 FI-03 (`ED-FI-0002`): what a graded finding learns of a trail, by its degree. The terms are
      `observation_terms`' (`epistemic.Seen`'s fields): the finder holds what a witness of the act
      would have held, through the same deposit shapes, masked to these terms.
    cite: "ED-FI-0002"
    note: >-
      [ASSUMPTION; medium; Jordan to correct; revert: every finding band shows the hand (the partial
      band gains `who`)]. KEYED BY DEGREE BAND (`engine/dice_engine/dice_engine.py::DEGREE_LABEL`,
      the one owner; a key off the ladder is refused at load, `data/rosters.py::_load_finding_terms`)
      and valued in `observation_terms` members (a term outside them is refused). A band with no row
      uncovers nothing: the failing band has none, and an ungraded finding has no band. In words: a
      partial finding learns THAT the deed was done to the thing, and a better one also learns WHOSE
      HAND did it. ⚠ A PARTIAL FINDING WITHHOLDS `who` FROM THE FINDER (an inference is less than a
      sight) -- both the `seen` claim's `who` term and the event-kind claim anchored on the actor. A
      WITNESS'S anchor claim is NOT masked: a witness admitted by any channel holds `(actor, kind,
      True)` under `claim_subject_rule: both` whatever its channel shows of `who`. So the two
      quantities differ BY DESIGN -- a finder's knowledge of a hand is graded, a witness's event-kind
      claim is not. `why` is never shown: no reader supplies it (`epistemic._term_why`, R8.4). The
      better bands are identical: depth has no carrier (FI-01's own note on the finding bands).
      ⚠ `bands:`, NOT `values:`: the mapping's keys are the ladder's labels, which this file does not
      own, and a `values:` row is read as a roster of its keys (`test_season_shape.py`'s duplicate-roster
      scan), so the ladder would have read as declared twice.
    bands:
      Overwhelming: [stratum, marks, who]
      Success:      [stratum, marks, who]
      Partial:      [stratum, marks]

  covert_kinds:
    source: >-
      v9 FI-03 (`ED-FI-0002`): the deed kinds that leave a FINDABLE trail -- an Event an inquiry can
      uncover for someone no witness channel admitted (`epistemic.trail_of`).
    cite: "ED-FI-0002"
    note: >-
      DATA, NOT A WALK OF EVERY DEED KIND: a kind joins the trail by a line here, and each member
      must be a deed kind the verb table emits (`data/verbs.py::DEED_KINDS`; refused at import,
      naming it, `data/verbs.py::_check_covert_kinds`), so a misspelling cannot find nothing and
      report the trail built. One member today: `forge` is the one covert act that executes
      (`record.forged`, v9 IN-45). `conceal`, `arrest`, a covert `destroy_record` (H-75) and a
      costed `surveil` (ED-FI-0009) are unbuilt and belong to their own positions.
      Why a trail is reachable only through a plant: see `epistemic.trail_of`.
    values: ["record.forged"]

tables:

  site_yield:
    source: "`W8` / `H-93`. #353 §25 lists `yield` as written at MATTER and *blocked on `season_factor`'s distribution* (§22.3); it never says what a place produces."
    row: H-93
    default_cell: 0
    sweep: [declared, uniform, none]
    keys: [site_kinds, matter_kinds]
    note: >-
      ⚠ WHAT A HARBOUR PRODUCES IS INVENTED. #353 supplies the BARRIER, the ORDER and the BLOCKER
      and no quantities at all, so this table is an injected default with a row and a sweep — the
      same standing as `alignment` and `band_floors`, and stated here rather than left to look
      derived.
      ⚠ WHAT IS *NOT* INVENTED IS THE SCALING. Production is the base scaled by the site's
      `condition / condition_scale` and then by `season_factor`. Condition is the model (`H-38`
      closed with *"`Site.condition` is the model"*), `condition_scale` is an existing registered
      fixture, and `season_factor` is #353's own named blocker — so a WORN PLACE PRODUCES LESS
      without a second wear concept being invented to make it do so. That is why yield is keyed
      on the SITE and not on the rung: the rung has no quantity that could fall.
      ⚠ `none` IS THE CONTROL ARM, not a third opinion: with every cell zero the economy has no
      source, every store depletes monotonically, and `W8`'s own proof clause must fail. A sweep
      whose control arm cannot break the claim is not a control.
    cells:
      harbour:
        grain: 40
        salt:  30
      seam:
        ore:    50
        timber: 10
      body: {}

  band_floors:
    source: "#353 §12.1 / L5 — the band edges a crossing fires on. `H-08`."
    row: H-08
    default_cell: 0
    sweep: [declared, halved, doubled]
    keys: [site_kinds]
    note: >-
      ⚠ MOVED OUT OF THE INSTRUMENT BODY BY `W8` for `wear_per_season`'s reason. The verb keys are
      SITE-USE verbs (what the site is good for at that condition), NOT verb-table rows, so unlike
      `alignment` this table is not validated against `verb_table.yaml` — a check that would fail
      on every cell. The outer key IS validated against `site_kinds`.
      ⚠ THE FLOORS ARE INVENTED. #353 states that a band edge crossing emits and may produce no
      outcome; it supplies no edges. `H-08` is the row, and until `W8` it was an `assumption` with
      no `site:` and no sweep at all — one of `PLAN.md` §1.5's unowned residue, now owned.
      ⚠ `dwelling: {}` IS EMPTY ON PURPOSE (`24d-i`, the control arm beside `wear_per_season`'s
      `dwelling: 0`). No floor means no band edge, so `loop/matter.py`'s `_crossings` fires
      nothing for a dwelling at any wear. `halved` and `doubled` leave an empty cell empty.
      ⚠ AN EMPTY CELL IS NOT A WORKABLE SITE, AND THE `floor` READ SAYS SO TYPED: `queries/
      world_q.py`'s `floor` stem checks `if not floors:` before `min(floors.values())` and raises
      a typed `Unspecified` (S12.1) rather than a bare `ValueError` on `{}` -- CORRECTED
      (code-review pass on the accumulated Phase alpha+beta diff, 2026-09-27): this said the read
      was untyped and would crash, which was true when `24d-i` first landed and is not true of the
      tree today (`world_q.py`'s own comment at the guard names `dwelling`'s control-arm row by
      id). It is unreached only while no question names a dwelling as a referent, since `work`
      binds its `site` from the referent. None does at the control arm; `24d-i`'s test in
      `engine/season/tests/test_governance_build.py` asserts it over one populated season.
      ⚠ `garrison: {}` IS EMPTY FOR THE SAME REASON, NOT A SEPARATE CHOICE (M4, `ED-IN-0279` clause
      (a)). A field battle's fortification term reads `Site.condition` DIRECTLY -- `queries/
      world_q.fortification_of` -- never through `floor`'s band-crossing read, so the empty cell
      is never reached: nothing names a garrison as a `work`-style referent, and no march-battle
      code calls `floor` on one. Filling this in would invent a band-crossed Question a garrison
      cannot yet answer (no verb writes `Site.exists`/`condition` toward it from the field-battle
      side except through the unbuilt `restore`), which is `wear_per_season`'s `garrison: 0` note
      applied to the other half of the same table.
    cells:
      harbour:
        bulk_shipping:   800
        fishing:         100
      seam:
        deep_mining:     700
        surface_gleaning: 50
      body:
        full_operations: 800
        limited:         500
        withdrawal_only: 100
      dwelling: {}
      garrison: {}

  # IN-08 H10 -- WHICH AFFILIATIONS STRAIN WHEN HELD TOGETHER (ED-IN-0251 R1: confliction is DERIVED
  # from this relation and never stored; `queries/person_q.py::confliction`). A HALF-MATRIX: each
  # unordered pair is keyed ONCE, under either order, and `data/affiliations.py::_load_incompatible`
  # refuses an unrostered name, a self-pair and a pair keyed twice. `true` = holding both puts the
  # person in confliction; `false` = compatible; `null` = considered, no source either way (read as
  # not incompatible).
  incompatible:
    source: >-
      proposals/2026-09-26-decision-layer-execution-plan/candidate_affiliation_content.md §2 (pairs
      1, 2, 3, 5, 6, 8 under the §1.3 roster and its renames), FOLDED INTO THE BUILD by Jordan
      2026-10-06 (RS-1, ED-IN-0291). Pair 2 is Jordan's own worked example ("devoutly Solmund but
      also believes in Threadwork and therefore experiences religious confliction").
    default_cell: null
    keys: [affiliations, affiliations]
    note: >-
      Ten pairs over five affiliations; five filled (one cited, four derived) and five null (pair 6,
      and the four `altonian_civics` pairs added with that roster member, ED-IN-0293). The
      draft's four `altonian_theocracy` pairs died with that struck candidate. The per-pair argument
      is the draft's §2 table; the values here are the build's (`CLAUDE.md` §0.05).
    cells:
      solmund_orthodoxy:
        inner_tradition: true      # pair 1, derived: "do not share a referent"; held together at strain
        thread_truth: true         # pair 2, cited: Jordan's worked example
        einhir_restoration: true   # pair 3, derived: the two poles of the absorbed Truth / PT tracks
      inner_tradition:
        thread_truth: false        # pair 5, derived: the inner tradition is the tradition of thread practice
        einhir_restoration: null   # pair 6, null: no source either way (the knife-edge is Jordan's to promote)
      thread_truth:
        einhir_restoration: false  # pair 8, derived: the same pole of both tracks
      # ED-IN-0293: `altonian_civics` is a political structure, not a theology; no source says it
      # strains against any creed, so its four pairs are keyed (considered) and null (no source).
      altonian_civics:
        solmund_orthodoxy: null
        inner_tradition: null
        thread_truth: null
        einhir_restoration: null

  # IN-08 H11 -- WHAT AN ACT DOES TO A HELD AFFILIATION: the verb x affiliation table (J-5's C4, the
  # draft's rule R-C4, folded into the build by Jordan 2026-10-06, RS-1, ED-IN-0291). Read by
  # `data/affiliations.py::engagement`; its one reader today is the scar (`queries/person_q.py::
  # elements_violated_by`, called by `loop/resolve.py::_scar_witnesses` beside the pursuit sign
  # test): an observer holding affiliation `a` takes one count on `a` per act he saw whose cell for
  # `a` is NEGATIVE. The magnitudes are not read by the scar; only the sign is.
  affiliation_engagement:
    source: >-
      proposals/2026-09-26-decision-layer-execution-plan/candidate_affiliation_content.md §4.2
      (R-C4.1, R-C4.2, R-C4.3) and §4.3 (the sketch), FOLDED INTO THE BUILD by Jordan 2026-10-06
      (RS-1, ED-IN-0291). The shared column's ten cells and their reasons are the old `sacred`
      alignment row as it stood before IN-08's cells work removed it (`git show 16faff76:engine/season/
      rosters.yaml`, the `sacred:` block of `alignment`), carried as R-C4.1 says. v9 IN-11 (#453
      R-3 (b)) cut `repudiate` and DROPPED its shared cell (-0.6, the vow-break) with the row --
      not moved onto `release`, which ends a commitment voluntarily and is a different act -- so
      nine of the ten remain.
    default_cell: null
    # The outer key is a COLUMN: the one shared column (named by `shared_column:`, read by the
    # loader rather than spelled in code) or a rostered affiliation. The inner key is a verb, spelled
    # as `verb_table.yaml` spells it; the loader refuses one that names no verb.
    keys: [affiliation_columns, verb_table]
    shared_column: sacred
    note: >-
      THREE CLAUSES, ONE TABLE. (R-C4.1) THE SHARED COLUMN `sacred`: the vow-shaped verbs engage
      EVERY affiliation identically -- a vow is a vow under every creed on the roster -- so the
      column is not per affiliation; a verb's cell here is its cell for every affiliation a person
      holds. (R-C4.2) THE PER-AFFILIATION CELLS: a verb violates a NAMED affiliation only where
      canon says that affiliation condemns the act's kind. They are graded `derived, sign only`, so
      each is `-1` or `1` and the loader refuses any other value: the 1 is a unit, not a weight, and
      a reader that wants a magnitude must be given authored values first. A verb carries a shared
      cell or per-affiliation cells, never both: no source says how the two would compose, so the
      loader refuses the overlap rather than choose a rule. (R-C4.3) CONTENT-KEYED VIOLATIONS ARE
      NOT CELLS: `utter`, `speak`, `tell`, `create_record` and `destroy_record` violate an
      affiliation by WHAT is said or recorded (forbidden vocabulary, an Einhir record destroyed),
      which needs a tag on the Proposition or Record read at RESOLVE by the same scar writer. No such
      tag exists; nothing here stands in for it, and `destroy_record`'s shared cell is the vow-shaped
      half only.
      ⚠ TWO OF THE DRAFT'S CELLS ARE NOT CARRIED, BOTH NARROWER READINGS [ASSUMPTION; Jordan to
      correct]. (i) `restore` "as Mending" (draft §4.3: `-` under `solmund_orthodoxy`, `+` under
      `einhir_restoration`): the draft read `restore` as Mending's nearest verb on the premise that
      it is unresolvable; that premise is stale -- `restore` executes, and what it does is raise a
      Site's `condition` (`loop/effects_economy.py::_eff_restore`), a repair of fabric, not a thread
      operation. With no way to tell a Mending from mending a wall, carrying the cell would scar every
      orthodox witness of a house repair. Revert: a thread-operation verb or a restore kind exists,
      and the two cells land on it. (ii) The shared column's `fight` (was `kill / wound`) and
      `surveil` cells are `null`, as R-C4.1 strikes them: the first reason was self-flagged as
      unsourced inference, the second is a cost rather than a creed.
      ⚠ NEARLY INERT IN PLAY TODAY, AND SAID RATHER THAN HIDDEN. Every cast row holds `affiliations:`
      since IN-64 (a cast person can be scarred on one); the corpus builder `build_at` still fills no
      `Person.conviction`, so the `11` and corpus worlds hold none. Of the verbs carrying a negative cell, only `destroy_record` is in
      `resolvable_verbs()`, and it refuses through the fold (`H-75`); `thread_read` writes nothing at
      RESOLVE, and the scar is earned only by an outcome that MOVED state (`_fold`'s `changed`), so
      its cell cannot fire even when it becomes resolvable unless it gains a RESOLVE write.
    cells:
      sacred:
        utter:           0.8    # carried: the word once spoken becomes an immutable Proposition -- a vow's shape, not mere speech
        tie / knot:      0.7    # carried: a bound tie is the marriage-and-fealty shape, the consecrated bond of the six kinds
        commit:          0.7    # carried: a standing obligation is the vow's own form
        confer:          0.5    # carried: investiture into office carries the anointing/oath-of-office residue
        oblige:          0.4    # carried: duty-taken has the same vow-shape as `commit`, without the immutable Proposition behind it
        establish:       0.3    # carried: founding a new office-seat is a small consecration of a place that had none
        fight:           null   # struck by R-C4.1: the old reason was self-flagged inference; nothing in canon puts a body-contest under any creed
        evade / defy:   -0.3    # carried: refusing what a vow or office asked undercuts the oath behind the demand, not just the demand
        destroy_record: -0.3    # carried: erasing what a ruling produced is a desecration (the vow-shaped half; the content half is R-C4.3)
        forge:          -0.5    # carried: counterfeiting a record for advantage is the false-witness shape, dressed as evidence
        surveil:         null   # struck by R-C4.1: covert watching is worldly craft, a cost and not a creed
      solmund_orthodoxy:
        thread_read:    -1      # derived, sign only: witnessed threadwork violates orthodoxy -- the Church's theology is "an anti-threadwork formation" (canon/philosophy/08_history.md §8.8, §8.10)
      inner_tradition:
        thread_read:     1      # derived, sign only: the inner tradition IS practised technique (canon/philosophy/05_confrontation_and_sensitivity.md §5.7)
      thread_truth:
        thread_read:     1      # derived, sign only: the pole that holds the Thread as the ground of being

  # ⚠ RENAMED 2026-09-24 (`ED-IN-0261` item 1, rename half only): this table was
  # `role_template_convictions:`; cells, `row:` and `default_cell:` are byte-identical.
  role_template_pursuits:
    source: >-
      systems/factions/reference/faction_canon_v30.md §4 "Role Templates and Expected Convictions"
      (per PP-686 §3.3.1, over the PP-684 13-Conviction taxonomy). TIER 2 — near-canon, and it
      survives because `systems/world/` has no competing concept, the same standing `role_templates`
      itself has.
    row: H-99
    default_cell: 0.0
    keys: [role_templates, pursuits]
    note: >-
      ⚠ **WHAT A FACTION EXPECTS OF ITS MEMBERS, WHICH IS NOT THE SAME AS WHAT ANY MEMBER HOLDS.**
      `pursuit_projection` maps a PERSON's fifteen weights into the seven axes; this maps a ROLE
      TEMPLATE's expectations onto the same fifteen. The two multiply against each other nowhere —
      they are different objects with one shared vocabulary, and the vocabulary is the canonical
      fifteen in both cases, read from the single owner.
      ⚠ **TRANSCRIBED, THEN MIGRATED BY A STATED RULE.** Every cell is §4's own weight, carried to
      the fifteen by `candidate_pursuit_cells.md` §4.1/§4.2 (see the comment above `cells:`).
      Nothing is normalised, rounded or filled in here, and a template's unlisted pursuits read
      `default_cell` (0.0) rather than being assigned a share.
      ⚠ **SIX TEMPLATES, AND TWO FACTIONS HAVE NONE.** `role_templates.by_faction` covers Crown,
      Church of Solmund, Hafenmark, Varfell, Löwenritter and Restoration Movement. `Guilds` and
      `Schoenland` are absent from §4's player-eligible column and get no row — the same deliberate
      gap `role_templates` already records, and inventing `mercantile-procedural` for the Guilds is
      exactly the fabrication the source-precedence ruling exists to stop.
      ⚠ `intelligence-diplomatic` IS UNCLAIMED BY ANY FACTION and is transcribed anyway, because
      §4 carries it and `role_templates` already lists it as a member no faction holds.

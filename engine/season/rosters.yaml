      event-kind claim, so a refused or failed inquiry teaches its actor nothing and the same person
      re-forms it (measured at v9 FI-01: refused `research` 3 -> 12 headless, clause-4 drops 240 -> 104 on
      `ARC-01`; the W-B and W-D notes in `test_season_shape.py`). The narrower
      arm -- skip only the `finding.none` event-kind claim -- is the alternative Jordan would name.
    values: ["finding.none"]

  fold_kinds:
    source: >-
      `04_CODE_ARCHITECTURE.md` §B.13 loader invariant 7 and `F.20b` (F13): *"the Event-kind roster is
      derived from every emission column, and the log accepts no other kind"*. v9 SC-02 `23`.
    note: >-
      ⚠ THE KINDS THE FOLD EMITS WHEN NO VERB ROW DECLARES ONE -- the three that were body literals in
      `loop/resolve.py` (`F.20b`: *"a definition living as a literal in a body is what ID-12 refuses"*).
      `ineligible` is the kind of an act whose actor is gone (S27.1) or whose eligibility declined on a
      row that declares no kind for that clause; `refused` is the fallback of every other refusal
      point; `attempt_refused` is S27.4's refusal of an attempt past the obstacle ceiling (it
      declares no verb row). The CLOSED SET OF KEYS is what `loop/resolve.py` reads and the loader
      checks (`data/rosters.py::check_fold_kinds`): a key the fold reads and this roster lacks, or a

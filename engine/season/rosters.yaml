  alignment:
    source: >-
      proposals/2026-09-26-decision-layer-execution-plan/candidate_pursuit_cells.md §3 (the re-cell
      over the seven axes), FOLDED INTO THE BUILD by Jordan 2026-10-06 (RS-1, ED-IN-0291), plus the
      six table verbs the draft does not cell (`build`, `found`, `give`, `march`, `migrate`,
      `survey`), celled in IN-08's cells commit by the draft's own method (each cell's reason
      below). Formula: ARCHITECTURE_V2.md §F2 — `score(c) = Σ_axis axis_weight[axis] ·
      alignment(c.verb, axis)`, the person's axis weights being their pursuits projected through
      `pursuit_projection`.
    row: H-66
    default_cell: 0.0
    # ⚠⚠ THE DENSITY RULE (IN-08), AND THE LOADER ENFORCES IT (`data/verbs.py::_load_alignment`):
    # every `verb_table.yaml` verb carries a cell on EACH of the seven axis rows below -- a number,
    # or an explicit `null` meaning "considered; no source and no lean" (the draft's `null` grade,
    # read as `default_cell`) -- OR it is named here, in `uncelled:`, with its reason, and then it
    # carries no cell on any axis. A verb row added to the table without either refuses at load,
    # naming the verb and the missing axes. Sparse is still lawful in the VALUES (a `null` reads
    # 0.0); what is no longer lawful is a verb nobody considered.
    uncelled:
      covenant: >-
        v9 IN-12 step 7: NOT CELLED BY THE PRODUCER -- authoring an alignment cell is a judgment the
        build position does not own (the plan's CLAUDE.md §0 note on IN-08's cells), and #453 §9.2
        gives the row no lean on any axis. It scores 0.0 on every axis until a cell is authored, so
        `corpus_run`'s RANKING counts no covenant Candidate as a tie or a discrimination. Revert: the
        seven cells, IN-08's method.
      argue: >-
        v9 IN-12 step 9: NOT CELLED BY THE PRODUCER -- authoring an alignment cell is a judgment the
        build position does not own (`covenant`'s reason, above), and #453 §9.4 gives the row no lean
        on any axis. It scores 0.0 on every axis until a cell is authored. Its second emission,
        `pursuit.moved`, reads the authored `deed:pursuit.moved` cells (held at 0.0), not these.
        Revert: the seven cells, IN-08's method.
      sabotage: >-
        v9 IN-12 step 9: NOT CELLED BY THE PRODUCER (`covenant`'s reason, above); #453 §9.3 gives the
        row no lean on any axis. It scores 0.0 on every axis until a cell is authored, so no witness
        is scarred by a sabotage. Revert: the seven cells, IN-08's method.
      tend: >-
        v9 IN-12 step 9: NOT CELLED BY THE PRODUCER (`covenant`'s reason, above); #453 §9.4 gives the
        row no lean on any axis. It scores 0.0 on every axis until a cell is authored. Revert: the
        seven cells, IN-08's method.
      train: >-
        v9 IN-12 step 9: NOT CELLED BY THE PRODUCER (`covenant`'s reason, above); #453 §9.4 gives the
        row no lean on any axis. It scores 0.0 on every axis until a cell is authored. Revert: the
        seven cells, IN-08's method.
      conceal: >-
        v9 IN-12 step 10: NOT CELLED BY THE PRODUCER (`covenant`'s reason, above); #453 §9.3 gives the
        row no lean on any axis. It scores 0.0 on every axis until a cell is authored, so no witness
        is scarred by a cover taken, and what a covered act's witnesses are scarred by is that act's
        own cell. Revert: the seven cells, IN-08's method.
      forgive: >-
        v9 IN-12 step 13: NOT CELLED BY THE PRODUCER (`covenant`'s reason, above); #453 §9.4 gives the
        row no lean on any axis (*"the row takes the default alignment cell, 0.0"*). It scores 0.0 on
        every axis until a cell is authored, so no witness is scarred by a forgiveness and its one
        emission, `stance.moved`, judges as no deed. Revert: the seven cells, IN-08's method.
      tell: >-
        No cell on any axis BY DESIGN: testimony's moral weight is in WHAT is told (a claim), which
        no verb x axis cell can carry, and telling is driven by regard (the telling workplan's G1),
        not by pursuit (`candidate_pursuit_cells.md` §3.6 `:999`, §7.4 `:1377`; G-1, [medium;
        Jordan to correct]). `corpus_run`'s RANKING counts only candidates whose verb has a celled
        axis, so a `tell` is neither a tie nor a discrimination there.
      thread_read: >-
        No typed cell (`H-85`), not in `resolvable_verbs()`, and `opening_set` can never form a
        Candidate for it, so a weight on it would be dead (`candidate_pursuit_cells.md` §3.7
        `:1028`, carrying the old table's rule).
      restore: >-
        The draft gives it no cell (§7.4 `:1382`) on the premise that it is unresolvable. ⚠ THE
        PREMISE IS STALE: `restore` IS in `resolvable_verbs()` and executes in `corpus_run` (read
        on IN-08's base commit). It is listed here because the plan's declared set names it, not
        because the reason still holds; its cells are owed by the draft's method and it scores
        0.0 on every axis meanwhile, exactly as it did on the old four-axis table, which gave it
        no cell either.
    # §G's third term. ORDER IS SEMANTIC: `declared` is the default and the first arm, and every
    # point is built from it rather than from the previous one. `uniform` is THE CONTROL — every
    # (verb, axis) pair equal, so convictions cannot discriminate at all and a verdict that does
    # not move between `declared` and `uniform` is a verdict this table was never deciding.
    # `sign_only` keeps the directions and discards the magnitudes, which is the separation worth
    # having when the magnitudes are declared invented and the directions are argued.
    sweep: [declared, uniform, sign_only]
    keys: [pursuit_axes, verb_table]
    note: >-
      ⚠ THESE WEIGHTS ARE ARGUED, NOT SOURCED, AND THE ROW IS WHAT MAKES THAT LAWFUL. PLAN `W5`: the
      table is "**registered as its own `assumption` row** … **the table is a row before it is a
      formula**." §G's discipline is DECLARE · DEFAULT · SWEEP, and all three are discharged —
      `H-66` is the declaration, this is the default, and `sweep: [declared, uniform, sign_only]`
      is the sweep. Each cell carries its grade and one-line reason: `carried` (an old-table cell
      moved to the new axis with its reason, sign per `axis_roster.scale`), `derived` (direction
      read off the verb row's text or an old reason re-homed, magnitude the draft's) and `reasoned`
      (the six extension verbs, placed by the same method in IN-08's cells commit). A reason is not
      a citation.
      ⚠ `selfish_selfless` CARRIES NO NON-NULL CELL, BY DESIGN (draft §3.4): the per-candidate fact
      "for whom" is single-owned by `verb_table.yaml`'s `beneficiary:` column (ED-IN-0261: *"the
      selfish axis score supplies the disposition, the column supplies the per-candidate fact"*); a
      cell here would be a second copy of that column. Its row is all `null`, so the density rule
      still sees every verb considered on it.
      ⚠ IT MUST NOT BE A ZERO MATRIX and `--check` enforces it. PLAN §W5's guardrail: "a zero
      matrix makes convictions inert, which is the dead-carrier defect #353 `:739-744` names, and
      it would pass every test while meaning nothing". `default_cell: 0.0` is the SPARSE default
      for an unlisted pair, which is a different thing from an all-zero table: the loader raises if
      every listed cell is also zero.
      ⚠ `uniform` IS THE CONTROL, not a third opinion. Every cell equal makes `Σ_axis conviction ·
      alignment` constant across verbs, so convictions cannot discriminate at all. A verdict that
      does NOT move between `declared` and `uniform` is a verdict the table was never deciding.
      VERB KEYS ARE VERB-TABLE KEYS, spelled exactly as `verb_table.yaml` spells them (`evade /
      defy`, `fight`). The loader raises on a key naming no verb, so a rename over there cannot
      leave a silently dead cell over here -- exactly what caught this cell when `kill / wound`
      was renamed to `fight` (2026-09-29, plan `FIGHT-RENAME`). The draft's `kill`/`wound` cells
      are moot: they are not verbs (Jordan, RS-5; ED-IN-0288).
    cells:
      # ⚠⚠ RE-CELLED OVER THE SEVEN BIPOLAR AXES BY IN-08's CELLS COMMIT (B-G). The source is the
      # draft's §3, which carried the four-axis table's cells forward where an old reason still
      # holds (`hierarchical` -> `hierarchical_equal`, sign kept under the bipolar convention, so an
      # old `+x` is `-x` here; `traditional` -> `precedent_substantive`, sign flipped likewise;
      # `instrumental` -> `deontological_instrumental`, unchanged; `sacred` LEFT the moral basis for
      # `Person.conviction`, ED-IN-0261, and three of its reasons were re-homed to
      # `deontological_instrumental` where they were about binding rather than the numinous).
      # Every cell names its grade. `null` is a considered "no source, no lean" and reads 0.0.
      # The six extension verbs' cells (`build`, `found`, `give`, `march`, `migrate`, `survey`)
      # are graded `reasoned`, derived from their own `verb_table.yaml` rows in this commit, one
      # reason each so Jordan can strike any of them.
      hierarchical_equal:
        # negative = rank-bearing, status-asserting · positive = equal, peer-levelling (draft §3.1)
        determine:      -1.0    # carried: the licensed judgement made by the holder licensed to make it
        "deed:matter.undetermined": 0.0   # [ASSUMPTION; medium; Jordan to correct; revert: delete this cell and its twin] a Failed `determine` writes nothing, so WITNESS's empty-changes rule (`epistemic.py`'s empty-changes rule) lands the claim on the PARTY, and a null cell would fall back to `determine`'s own (`data/verbs.py`: `_load_alignment` drops a null, `align_kind` falls back to the verb): the hearing that changed nothing is judged as no deed at all. Numeric, not null, for that reason. (`speak`'s four `matter.*` kinds share the shape: H-192 (a).)
        "deed:pursuit.moved": 0.0   # [ASSUMPTION; medium; Jordan to correct; revert: delete this cell and its twin] `determine`'s consequence write (v9 SC-02 `22b` step 24) and `argue` (v9 IN-12 step 9) both emit `pursuit.moved`, so the kind is SHARED and absent from `KIND_VERB`; before `argue` it mapped to `determine`, and a null cell would judge the judge's interior shift by `determine`'s alignment, a second time beside `matter.determined`; and `_ch_chronicle` publishes it to everyone (`determine` is a `binding_decision`). A pursuit moving is no one's deed; numeric, not null, for the same reason as `deed:matter.undetermined`. Held at 0.0 it survives the second emitter (`argue`); `train` emits `capability.raised`, not this kind.
        confer:         -0.8    # carried: conferral seats an office; the paradigm top-down act
        evade / defy:    0.9    # carried: refusing a demand outright is the direct negation of command
        establish:      -0.7    # carried: founding an office adds a rung to the ladder that was not there
        revoke:         -0.7    # carried: an officeholder unmaking a subordinate's standing; rank exercised
        issue:          -0.6    # carried: a dispensation is a remit reaching the executors named in scope
        comply:         -0.6    # carried: obeying a dispensation's terms is literal deference to the issuer
        requisition:           -0.6    # carried: taking a rung's stores under a remit is rank drawing on subjects
        seize:          -0.6    # reasoned (IN-12 step 6): `requisition`'s reading for a held Record -- taking what a subject holds under a remit, a seat exercising rank over the holder; `remit:issue`-eligible as `requisition` is
        dispatch:       -0.5    # carried: an order sent down the office to a named person
        open_case:      -0.5    # carried: opening a case invokes the remit's institution over the matter
        petition:       -0.4    # carried: the channel a subordinate has; using it works the hierarchy
        surveil:         0.3    # carried: watching "without leave" is unauthorized by definition
        destroy_record:  0.4    # carried: defacing what an office's ruling produced
        convene:        -0.4    # derived: a `remit:convene` act that gathers a venue's rung -- the remit-act family `dispatch`/`issue` sit in
        found:          -0.3    # reasoned: its effect demands strict ascent into the works' `at` -- a new rung on the containment ladder; `establish`'s reason read for a place, not an office, and `own`-eligible, so smaller
        march:          -0.5    # reasoned: `remit:dispatch`-eligible -- an army sent under an office's remit, `dispatch`'s own cell
        carry:          null    # carried absence: the old table refused this cell as "the lowest-magnitude, weakest-justified cell in the set"
        build:          null    # reasoned: `own`-eligible, and the row names no rank -- a works held by its maker, whoever he is
        give:           null    # reasoned: `own`-eligible, a handover between two persons present together; no remit is exercised
        migrate:        null    # reasoned: `own`-eligible; where a person chooses to live says nothing about rank
        survey:         null    # reasoned: `own`-eligible; commissioning a sheet uses no seat
        # no source: no old cell and no row text about rank (draft §3.1, "the other 26")
        commit:         null
        create_record:  null
        exchange:       null
        forge:          null
        fight:          null
        move:           null
        oblige:         null
        construe:       null
        release:        null
        speak:          null
        succeed:        null
        examine:        null
        interview:      null
        research:       null
        reconstruct:    null
        tie / knot:     null
        transfer:       null
        utter:          null
        work:           null
        challenge:      null
        accept:         null

      precedent_substantive:
        # negative = returns to previous ideas/actions · positive = forges new ones (draft §3.2)
        seize:          null    # reasoned (IN-12 step 6): taking a document under a warrant follows a form without returning to or breaking one -- considered, no lean

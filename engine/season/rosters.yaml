      `decision/choose.py::_stance_arm` under `stance_polarity: declared`. `+1`: a person's liking for the act's subject pulls him toward the act;
      `-1`: away from it; `0`: it reads nothing (regard for a person says nothing about whether to look into him or travel to him). A row naming
      none is given the sign the table read before the column: `-1` where the act is done against its subject
      (`VerbRow.opposed_to_subject`: contested against it, or an `opposed_without_prize` row), else `+1`. No cell is authored (BA1's content).
    values: [1, -1, 0]

  scar_season_caps:

  standing_routes:
    source: "proceedings `19_PLAN.md` PHASE 3 step 20 (route erosion) and `03_PARAMETERS.md` row 25 (`route ∈ {prestige, dominance}`, *it sets the EROSION PROFILE*), read as INTENT; built at v9 SC-02 `22a` (B-P)"
    open: true
    note: >-
      THE PARTITION OF THE DEED KINDS BY THE ROUTE TO STANDING THE ACT TAKES, read by
      `queries/world_q.py::reception` and, since v9 IN-23, `queries/person_q.py::UNREST_KINDS`. `dominance` lists the COERCIVE kinds -- an act
      that takes from, or forces, another (a death, a wound, a field won, a seizure, a requisition);
      `prestige` is EVERY OTHER deed kind, the complement, so it carries no list: the one behaviour
      step 20 rules (*a failure against a dominance-standing speaker zeroes that hearer's
      dominance-sourced weight: the single called bluff*) reads the coercive half only, and a second
      list nothing read would be a declared-but-unread carrier. A hearer who holds, untold, a
      dominance-kind deed done TO the speaker by somebody else (`person_q.suffered_deeds`, the
      `seen.who` pairing) stops counting every dominance-kind deed of the speaker's no newer than it.
      Every member must be a deed kind (`data/verbs.py::DEED_KINDS`); `data/verbs.py::_check_dominance_kinds` refuses at
      import otherwise. [ASSUMPTION; medium; Jordan to correct -- the membership: which acts are
      coercive is stated nowhere in the corpus; revert: an empty `dominance` list, and no hearer's
      weight is ever eroded -- and, since v9 IN-23, `person_q.UNREST_KINDS` is empty too, so
      `person_q.stability`'s deed half counts nothing.]
    values: [dominance, prestige]
    kinds:
      dominance: [person.died, body.changed, field.won, rung.seized, record.seized, requisition.taken]

  # ── v9 FI-02 + FI-03 (`SM-3`, `ED-FI-0002`): THE INQUIRY ROLE AND WHAT A FINDING UNCOVERS ─────────
  inquiry_modules:
    source: >-
      v9 FI-02 (`SM-3`, Jordan 2026-09-05: *"investigation is not a contest seam. it is its own
      thing."*), built in one landing with FI-03 (`ED-FI-0002`, the counter-espionage loop with
      fieldwork as host): the second role in `manifest/registry.py::_ROLE_ROSTERS`, `inquiry`.
    cite: "SM-3; ED-FI-0002"
    note: >-
      ⚠ KEYED BY THE KIND A FINDING EMITS, NEVER BY THE VERB. `graded_tasks` is already the
      verb-keyed table, and FI-01 rules it a ROUTE that carries `{provider,
      module_entry}` and, from B07.01, `form` and `armed_by` (`data/verbs.py`), so a second verb-keyed table would be two tables on one key.
      A prize is what is contested; the inquiry analogue is what is FOUND, so the key is the Event
      kind -- `undeposited_kinds`' keying, for its reason. A `Failure` inquiry emits `finding.none`,
      which no row claims, so `manifest.resolve("inquiry", ...)` answers `None` and nothing is found,
      with no branch on a band anywhere in the host. An ungraded `finding.made` (`interview`,
      `reconstruct`, `thread_read`) reaches the row and finds nothing: it carries no degree, and
      `finding_terms` keys on the degree. Each row names `module:` (the module's one identity, its
      directory, A-25), `provider:` (`@provider("inquiry", ...)`, `seam/wrappers/fieldwork.py`) and
      `module_entry:` (the composition row the provider calls through `MODULE_ENTRIES`). Refused at
      driver construction by `manifest/registry.py::check_inquiry_modules`, and at boot by
      `check_rows()` naming the row.
    findings:
      "finding.made": {module: "fieldwork", provider: "fieldwork", module_entry: "fieldwork.find"}

  finding_terms:
    source: >-
      v9 FI-03 (`ED-FI-0002`): what a graded finding learns of a trail, by its degree. The terms are
      `observation_terms`' (`epistemic.Seen`'s fields): the finder holds what a witness of the act
      would have held, through the same deposit shapes, masked to these terms.
    cite: "ED-FI-0002"
    note: >-
      [ASSUMPTION; medium; Jordan to correct; revert: every finding band shows the hand (the partial
      band gains `who`)]. KEYED BY DEGREE BAND (`engine/dice_engine/dice_engine.py::DEGREE_LABEL`,
      the one owner; a key off the ladder is refused at load, `data/rosters.py::_load_finding_terms`)
      and valued in `observation_terms` members (a term outside them is refused). A band with no row
      uncovers nothing: the failing band has none, and an ungraded finding has no band. In words: a
      partial finding learns THAT the deed was done to the thing, and a better one also learns WHOSE
      HAND did it. ⚠ A PARTIAL FINDING WITHHOLDS `who` FROM THE FINDER (an inference is less than a
      sight) -- both the `seen` claim's `who` term and the event-kind claim anchored on the actor. A
      WITNESS'S anchor claim is NOT masked: a witness admitted by any channel holds `(actor, kind,
      True)` under `claim_subject_rule: both` whatever its channel shows of `who`. So the two
      quantities differ BY DESIGN -- a finder's knowledge of a hand is graded, a witness's event-kind
      claim is not. `why` is never shown to a finder: no band lists it (`epistemic._term_why`'s antecedent is a witness's). The
      better bands are identical: depth has no carrier (FI-01's own note on the finding bands).
      ⚠ `bands:`, NOT `values:`: the mapping's keys are the ladder's labels, which this file does not
      own, and a `values:` row is read as a roster of its keys (`test_season_shape.py`'s duplicate-roster
      scan), so the ladder would have read as declared twice.
    bands:
      Overwhelming: [stratum, marks, who]
      Success:      [stratum, marks, who]
      Partial:      [stratum, marks]

  covert_kinds:
    source: >-
      v9 FI-03 (`ED-FI-0002`): the deed kinds that leave a FINDABLE trail -- an Event an inquiry can
      uncover for someone no witness channel admitted (`epistemic.trail_of`).
    cite: "ED-FI-0002"
    note: >-
      DATA, NOT A WALK OF EVERY DEED KIND: a kind joins the trail by a line here, and each member
      must be a deed kind the verb table emits (`data/verbs.py::DEED_KINDS`; refused at import,
      naming it, `data/verbs.py::_check_covert_kinds`), so a misspelling cannot find nothing and
      report the trail built. One member today: `forge` is the one covert act that executes
      (`record.forged`, v9 IN-45). `conceal`, `arrest`, a covert `destroy_record` (H-75) and a
      costed `surveil` (ED-FI-0009) are unbuilt and belong to their own positions.
      Why a trail is reachable only through a plant: see `epistemic.trail_of`.
    values: ["record.forged"]

  strife_kinds:
    source: >-
      CR-75 (workplan v11, batch B11-S3): which Event KINDS the person reading may count as a strife move.
      Read by `data/rosters.py::STRIFE_KINDS`; checked at import against `EVENT_KINDS` in
      `data/verbs.py::_check_strife_kinds`. A step of the loop reads it: `queries/world_q.py::questions_for` through
      `flows_known` and `flow_stakes` (CR-78's stamp, `stamp_flow_stakes`, shipped ON).
    cite: "ED-IN-0316"
    note: >-
      WHY A KIND LIST. The person reading sees an Event's kind and nothing else, and the registry's
      `kinds` columns (`harness/strife_moves.yaml`) are upper bounds: read as the definition of a move they
      would make `news.told`, `duty.taken` and `travel.moved` strife, and strands ordinary life.
      THE FOUR LISTS (under `lists:`, because `roster_map` returns a mapping; `values:` names them, so the
      loader spells none of them and refuses a missing or an extra list):
        opens     a kind whose presence alone meets the study's test, so one claim of it starts a strand.
        joins     a kind that is a move only in company: it attaches to a strand an `opens` kind started
                  and may conclude it, and never starts one.
        never     everyday or refusal kinds. Explicit, so every kind the registry names has a decision
                  (`tests/test_strife_kinds.py` refuses a registry kind in none of the three).
        concludes the kinds that may conclude a strand AT THE PERSON READING: a kind concludes only if
                  every code it maps to in `strife_moves.yaml` is terminal (`ends` above 0 and not XP),
                  so a kind that maps to one code which never ends a case does not conclude (`detention.ended`
                  and `ban.ended` map to AM; `field.won` and `field.lost` to WR; `tenure.closed` to BR;
                  `requisition.taken` to VI). Of those only `field.won` and `field.lost` conclude in the
                  world reading, which knows their code (WA) through the verb and side; the rest end no case
                  in either reading. A hand-maintained list over the opens and joins kinds, checked
                  by `tests/test_strife_kinds.py`'s re-derivation (it is red where the list and the rule
                  disagree). Top-down the world sees a war end; bottom-up a
                  person who holds only a field's outcome may still doubt it.
      The checks at import: a kind in any list absent from `EVENT_KINDS`; a kind in more than one of
      opens, joins and never; a `concludes` kind outside opens and joins.
      `concludes` is checked against `ends` counts hand-read from the study and cross-checked against it (A3,
      `strife-00` §10; `strife_moves.yaml`).
      [ASSUMPTION; medium; Jordan to correct; revert: each of the five rulings of `strife-01` §6 reverses
      alone by moving one kind between `opens` and `joins`, or striking one content opener; to revert
      `concludes`, make it an empty derivation in code: a code edit at `Move.terminal`'s construction in
      both readings (`queries/world_q.py::flows_in` and `_known_moves`) and in `_check_strife_kinds`. Dropping
      `concludes` from `values:`/`lists:` raises a KeyError at import (`world_q` and `data/verbs.py` index it
      directly). With no concluding kinds no strand ever concludes.]
    values: [opens, joins, never, concludes]   # the names of the four lists, in reading order
    lists:
      opens: [field.won, field.lost, rung.seized, rung.razed, record.seized, arrest.made, compliance.withheld,
              requisition.taken, site.damaged]
      joins: [march.declared, army.arrived, field.unopposed, person.died, succession.claimed, petition.filed,
              petition.carried, covenant.offered, matter.determined, dispensation.issued, rung.ceded,
              detention.ended, ban.ended, record.given, transfer.made, record.destroyed, tenure.closed,
              tenure.opened, office.established, rung.founded, army.recruited, army.formed, army.assigned]
      never: [argument.lost, argument.won, commitment.ended, commitment.made, date.scheduled, duty.refused,
              duty.taken, news.told, order.given, residence.changed, stance.moved, travel.moved]
      concludes: [army.arrived, succession.claimed, petition.filed, petition.carried, covenant.offered,
                  matter.determined, dispensation.issued, rung.ceded, record.given, transfer.made,
                  record.destroyed, tenure.opened]

  foreign_factions:
    source: >-
      CR-75: moved here from `harness/strife_moves.yaml` (one owner; R16's text unchanged), so
      `queries/world_q.py`, which may not import the harness, can read it. Read by
      `data/rosters.py::FOREIGN_FACTIONS`.
    cite: "ED-IN-0316"
    note: >-
      The two foreign nations, external, functioning as spoilers and limits on the game world (Jordan,

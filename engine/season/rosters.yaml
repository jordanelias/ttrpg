      of the throne (any claim naming it) re-forms `succeed` on it while a King sits, and is refused each time. ONE LOADER, `data/verbs.py::OWN_TITLE_DECLINES`, refused at import
      when a member names a verb the table lacks or one whose row declares no `referent_class: Office`.

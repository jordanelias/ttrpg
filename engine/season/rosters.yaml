      order_unit: >-
        ED-IN-0306 phase 2: NOT CELLED BY THE PRODUCER (`covenant`'s reason, above), and no person forms it (`Fixtures withheld_verbs`): it is a menu command on the army record, whose alignment lean nothing yet reads. It scores 0.0 on every axis. Revert: the seven cells, IN-08's method.
      disband_unit: >-
        ED-IN-0306 phase 2: NOT CELLED BY THE PRODUCER (`covenant`'s reason, above), and no person forms it (`Fixtures withheld_verbs`): it is a menu command on the army record, whose alignment lean nothing yet reads. It scores 0.0 on every axis. Revert: the seven cells, IN-08's method.
      discharge_troops: >-

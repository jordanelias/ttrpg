      should be above zero. `opposes`: verbs whose lean should be below zero, and below every favoured verb's.
      Verb keys are `verb_table.yaml`'s, spelled as it spells them (`"evade / defy"`). The loader refuses a pursuit
      off the roster and a verb off `VERB_TABLE`; a verb with no `alignment` cell is lawful and reads lean 0.

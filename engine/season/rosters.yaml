      capability key a verb's `capability:` column names (`data/verbs.py::VOCATIONS`, a subset of `descriptors.CAPABILITIES`;
      `copying`, `argue` and `inquiry`, #453 K-20's range). A verb named here forms ONE Candidate per vocation in

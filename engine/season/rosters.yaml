      capability raised ranges over the capability names `verb_capability` maps verbs to"* (quoted as written: that roster is deleted; the names are now the verb table's `capability:` column over `descriptors.CAPABILITIES`), and its
      blocker, *"a capability-key operand -- the `kind` operand ... [ASSUMPTION]"*; J-13 answered (iii)

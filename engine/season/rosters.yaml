      `any` is the CONTROL (every held element an act violates, today's rule); `primary` counts only a person's primary pursuits (the fewest
      top-weighted ones whose weights sum to `Fixtures.scar_primary_mass`) and the affiliations he stands for (`person_q.stands_for`).
      [ASSUMPTION: the roster's name and shape -- basis: B10.06's `scar_season_caps`; Jordan to correct.]

      moves the creed in crisis by a whole number of steps on `conviction_map`'s closed spine (an integer; the reader clamps it); `scar` sets the
      count on the creed in crisis (a named setting); `branch` names the one composite rule the Failure band applies (today's FOLD / DESTROYED
      branches, with the third arm that replaces the unbuilt RESTABILISE). [ASSUMPTION: the closed set of write names -- basis: the source states

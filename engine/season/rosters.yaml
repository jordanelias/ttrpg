  undeposited_kinds:
    source: >-
      RS-21 item 1 (H-111 ANSWERED [medium; Jordan to correct]): SKIP at WITNESS, except keyed kinds a
      verb declares (`news.untold` and `tell.refused` stay, T4; CP-T05-03 split the one kind in two) -- a refused inquiry deposits nothing, and no
      `finding.none` is deposited. Built by v9 FI-01 as the deposit half of `ED-FI-0009`.
    row: H-111
    note: >-
      ⚠ THE EVENT KINDS WITNESS FANS TO NOBODY (`loop/witness.py::witness`): an Event of one of these
      kinds stays in the log and in its act's causes, and no ledger receives any claim from it.
      Keyed on the KIND, never on a band or on an empty `changes[]`: those would also swallow
      `matter.undetermined`, `news.untold` and `tell.refused`, which keep depositing. [ASSUMPTION; medium; Jordan to
      correct] the six inquiry rows' `finding.none` only, not every refusal kind -- a widening would
      move every refusal-bearing row's deposits, which nothing here measured. Revert: Jordan rules
      deposit at WITNESS, and this roster is deleted. Each member must be a kind some verb row
      declares (`data/verbs.py` refuses one that is not, so a misspelling cannot skip nothing).
      THE SKIP IS STRICT, AND ITS CONSEQUENCE IS THE THING TO CORRECT: the plan's words ("a refused
      inquiry deposits nothing") drop the actor's own observation reads and `seen` claims as well as the
      event-kind claim, so a refused or failed inquiry teaches its actor nothing and the same person
      re-forms it. The narrower arm is `finding_none_deposit_arms` below (B09.04): at `actor` the
      Event is deposited to its own doer and to nobody else; `none` (shipped) is the skip as written here.
    values: ["finding.none"]

  finding_none_deposit_arms:
    source: >-
      B09.04 (`U5a_DICE_owed_edits` §4; H-111, `undeposited_kinds`' own note: "the narrower arm ... is the alternative
      Jordan would name"): who receives a `finding.none` Event at WITNESS, the one kind `undeposited_kinds` skips.
    row: H-111
    note: >-
      `none` is THE CONTROL and ships: the Event fans to nobody, as `undeposited_kinds` says. `actor` deposits it to
      its own doer alone -- the `witness_key` channel's rule, *change claims about self* -- so a person who failed a
      search holds the claim `(subject, finding.none, doer = himself)` that `person_q.refused_before` reads
      (`finding.none` is in `emits_on_refusal` of the inquiry rows) and `decision/choose.py::admission_weight`
      discounts, until it fades or news of the subject lands. No non-actor receives it at either arm, and no other
      reader is added. Read once per barrier by `loop/witness.py::witness`; a value outside the roster refuses.
    values: [none, actor]

  fold_kinds:
    source: >-
      `04_CODE_ARCHITECTURE.md` §B.13 loader invariant 7 and `F.20b` (F13): *"the Event-kind roster is
      derived from every emission column, and the log accepts no other kind"*. v9 SC-02 `23`.
    note: >-
      ⚠ THE KINDS THE FOLD EMITS WHEN NO VERB ROW DECLARES ONE -- the two that were body literals in
      `loop/resolve.py` (`F.20b`: *"a definition living as a literal in a body is what ID-12 refuses"*).
      `ineligible` is the kind of an act whose actor is gone (S27.1) or whose eligibility declined on a
      row that declares no kind for that clause; `refused` is the fallback of every other refusal
      point. The CLOSED SET OF KEYS is what `loop/resolve.py` reads and the loader
      checks (`data/rosters.py::check_fold_kinds`): a key the fold reads and this roster lacks, or a
      key nothing reads, refuses the load naming this row. The derived Event-kind roster
      (`data/verbs.py::EVENT_KINDS`) is the union of every emission column and these two.
      `F.20b` also names `contest.resolved` as a third literal; the live fold emits none of that
      name (a contest's outcome is the verb row's degree-keyed `emits:`).
    values:
      ineligible: "act.ineligible"
      refused: "act.refused"

  logged_kinds:
    source: >-
      `04_CODE_ARCHITECTURE.md` §B.13 loader invariant 7 and `F.20b`: *"the Event-kind roster is derived
      from every emission column, and the log accepts no other kind"*. v9 SC-02 `22b` step 23, found by
      the B-P `layer-conformance` pass.
    note: >-
      ⚠ THE KINDS `loop/matter.py` LOGS DIRECTLY WITH NO WRITE BEHIND THEM -- an Event with `changes=[]`
      caused by deposits, which no `write_matrix.yaml` row and no verb row can declare (`§A.2`: MATTER
      emits *"per matrix row"*; its sibling `condition.band_crossed` is a matrix row's). `standing_crossed`
      is step 23's person-keyed band crossing: a record that a person's standing gap changed band, read
      only as a QUESTION about its tellers (`queries/world_q.py::standing_crossed`), never a write. The
      derived Event-kind roster (`data/verbs.py::EVENT_KINDS`) is the union of every emission column,
      `fold_kinds` and these.
    values:
      standing_crossed: "standing.band_crossed"

  # B04.04 (U1 §1): the skills, by the `pursuit_axes` precedent -- this row POINTS at the one owner
  # (`references/descriptor_registry.yaml: capabilities`, read through `engine/substrate/descriptors.py::CAPABILITIES`)
  # and carries no `values:`. The verb -> skill map this file used to hold (`verb_capability`) is DERIVED in `data/verbs.py`
  # from the verb table's `capability:` column; the skill -> attribute map (`vocation_attribute`) is deleted, and which
  # attributes a verb reads is the verb row's own `governing:` and `opposed_attribute:` (B05.25).
  capabilities:
    from_descriptor: capabilities

  # B04.12 (CAP A7 / DEF Edit 4): THE KEYS A CAST ROW AUTHORS THAT NO ENGINE CODE READS BY NAME -- declared so, once, here. `data/cast.py`
  # refuses a row key that is in neither `references/npc_registry.yaml: schema` (`required` + `optional`: the keys a reader takes) nor
  # this list. The first eight are reference prose on the row; `certainty` and `coherence` are threadwork's tracks, with no reader until
  # that lane builds one. A key leaves this list by gaining a reader (and joining the registry's `schema:`) or by leaving the registry.
  cast_unread_keys:
    values: [first_name, last_name, age, birthplace, territory, goals, notes, source, certainty, coherence]

  # B04.05 (U1 §3, MAP §A and §C): where a skill is USED. `capability_roles` is the ten ways a skill (or an attribute or a
  # practitioner stat) changes an outcome -- closed and ordered; `fields` is each role's row of the role-field table (the
  # columns of `tables.capability_uses` that role takes, beside the three every row carries: `use`, `role`, `key`).
  # `capability_use_sites` is a MAP from a site to its ONE reader (U1 §3 item 7); a site string says where its reader is, or says plainly that none reads the row on this tree yet (`fight`, `kit`).
  # `choice_temper` reads at `decision/choose.py::temper` (B10.28). The rows are
  # `tables.capability_uses`; the loader is `data/rosters.py::_load_capability_uses`, which refuses a row naming a site no
  # reader registers, an unknown role or key, a field its role does not take, a `circumstance` row with a negative gain, a
  # `gate` row on any key but Thread Sensitivity or at any site but the two gate sites, a `level` outside `LEVEL_SIGMA`, a
  # `per` outside its roster and a `gain`, `add` or `floor` that is not a registered Fixture. A reader whose `use` has no row
  # reads no capability (a factor of exactly 1, UNKNOWN for a gate), never a default.
  capability_roles:
    values: [dice, addend, opposes, edge, circumstance, resource, threshold, rate, judgement, gate]
    fields:
      dice: [side, add, floor]
      addend: [when]
      opposes: [side]
      edge: [side, when, level, per, against]
      circumstance: [side, when, gain]
      resource: [side]
      threshold: [side]
      rate: [when, gain]
      judgement: [side, gain]
      gate: [side, gain]

  capability_use_sites:
    social_roll: seam/wrappers/sigma.py::contest_input
    fight: "seam/wrappers/combat.py::combat_input -> PersonalCombatInput (applied by the module: the fight's attribute input is the six attributes on `PersonalCombatInput.attributes`, sigma-assembled in `modules/combat`, so the site carries no host-side `edge` row and `advantage_sigma` adds no second attribute term to a fight)"
    kit: "combat_systems.act_cost's caller -- no reader of this row on this tree; B05 (CAP B1, B7) builds it"
    told_claim_credit: decision/options.py::competence
    choice_temper: decision/choose.py::temper
    choice_exposure: decision/choose.py::score_terms     # B10.31: `nerve`, how far a person's Spirit lets him bear a danger, on the `risk` element; no row ships
    own_state_gate: queries/person_q.py::OwnStateReader
    crisis: loop/resolve.py::_crisis_net_sigma   # B10.15: the crisis of faith's roll, read only at `Fixtures.crisis_arm: drawn`

  # WHAT A SITE'S READER READS OF A ROW, where it reads the row by ROLE and not by the row's other columns (B04 Phase 3): a row
  # of that `role` at that site must carry exactly this `key` and `side`, and the site carries one row of the role. Any other
  # row would load and change nothing the reader does, while a record that reports the row's columns (`fed_by`,
  # `seam/wrappers/sigma.py`) says it did. The loader refuses it (`data/rosters.py::_load_capability_uses`).
  capability_site_reads:
    social_roll:
      dice: {key: verb, side: actor}
      opposes: {key: verb, side: subject}
    own_state_gate:
      gate: {side: actor}

  # `side`: whose sheet a row reads -- not who benefits (U1 §3 item 3). `per`: once when held, once per rank, or signed steps
  # of the held value from its scale's mid-point (U1 §3 item 2). `key` selectors: the skill the act's verb names (`verb`)
  # and that skill's governing attribute (`verb.base`) (U1 §3 item 1).
  capability_sides:
    values: [actor, subject, each]
  capability_per:
    values: [held, rank, mid]
  # the columns whose value names a registered `Fixtures` entry (a `gain`, and a `dice` row's pool rule)
  capability_fixture_columns:
    values: [gain, add, floor]
  capability_key_selectors:
    values: [verb, verb.base]
  # B04.10 (DEF Edit 2): the keys a row's `when` may carry. `rank_at_least: <n>` holds when the holder's SKILL rank (the held rank
  # on the row's `scale`, never a seat rank) in the row's `key` is at least `n`: it selects which of two rows on one key apply
  # (`data/rosters.py::when_holds`), and is never a condition of attempting an act (A-11: a `gate` row takes no `when`).
  capability_when_keys:
    values: [rank_at_least]

  # A-11 (U1 §3 item 5): a `gate` row is closed to its one held value, at the two sites that gate on it.
  capability_gate_keys:
    values: [prac.thread_sensitivity]
  capability_gate_sites:
    values: [own_state_gate, told_retain]

  # B10.64 (`U5a_CHAR_self_knowledge_is_a_belief` edit 1): THE KEYS A PERSON MAY BE UNAWARE OF IN HIMSELF.
  self_believed:
    source: >-
      B10.64 (`U5a_CHAR_self_knowledge_is_a_belief`, A-34: a belief, built narrowly): the one gated gift, plus the pursuit roster.
    note: >-
      THE NON-PURSUIT MEMBERS. A cast row's `unaware:` may name only a member of `data/rosters.py::SELF_BELIEVED`, which is these values JOINED TO the `pursuits`
      roster at the one binding (a roster carries a `values:` or an owner pointer, never both, so the pursuit half is not copied here). `data/cast.py::unaware_of`
      refuses any other key, and any key the row does not hold. For such a key the person-side answer is his own claim `self:<key>` (`queries/person_q.py::knows_self`);
      every other own-state stem is answered from the field as before. [ASSUMPTION; medium; Jordan to correct -- basis: the source's own roster; revert: the roster is empty.]
    values: [prac.thread_sensitivity]

  # B05.14 (OBS §1, §2; SC-B Edit A; D-U1-04): THE OBSTACLE'S FORM. `difficulty_levels` is the closed, ordered set of levels a rolled
  # verb row's `difficulty:` names (`data/verbs.py`); `Fixtures.difficulty_ob` sizes each one. `obstacle_terms` is the closed,
  # ordered set of the terms the social roll's obstacle is composed of (`modules/social_contest/roll.py::obstacle`), bound member
  # by member to ONE host function each (`seam/wrappers/sigma.py::OBSTACLE_TERMS`, refused at import both ways). Lane A's
  # `task_difficulty` (a number per verb) is deleted: a verb names a LEVEL, the fixture says how hard that level is.
  difficulty_levels:
    source: "B05.14 (`proposals/05_SC_obstacle_difficulty_and_modifiers_B.md` Edit A, D-U1-04): what lane A's `task_difficulty` roster becomes -- a level a row names, not a number a roster holds"
    note: >-
      THE LEVELS A ROLLED VERB ROW'S `difficulty:` CELL NAMES, in order of how hard the act itself is. `data/verbs.py` refuses a
      row that is contested on the social roll's prize or graded to it with no `difficulty:`, a value outside this set, and a
      `difficulty:` on a row nothing rolls. `Fixtures.difficulty_ob` gives each level its size in obstacle (refused at load if its
      keys are not exactly these). A new level is a member here and a size there, and no code.
    ordered: true
    values: [plain, routine, demanding, hard]

  obstacle_terms:
    source: "B05.14, B05.15, B05.17, B05.21 (`proposals/U5c_SC_one_obstacle_form.md` §1, §2; 29_DICE Item 29-4 step 4; PES-A; `proposals/13_SC_tuning_tables.md` T2-T4): the members the obstacle is composed of, in OBS §2's order"
    note: >-
      THE TERMS OF THE SOCIAL ROLL'S OBSTACLE, IN COMPOSITION ORDER (`roll.py::obstacle` sums them, then the document's
      lane A step, then the ceiling and the floor). `even` -- the pool's even line, `MU_PER_DIE x pool_add`
      (`sigma_leverage.even_line`); `difficulty` -- the act's own, its level's size (`Fixtures.difficulty_ob`); `opposition` -- the
      one acted against, `opposed_ob(opposing attribute + skill score, opposition_rate)`, or the untrained score where no person
      is opposite (never absent); `standard` -- what the room demands (OBS §2 member 3; B05.21): for an act a bench hears on a
      docketed matter, the size (`Fixtures.difficulty_ob`) of the `standard:` level of the arrangement row the matter is docketed
      under; `stakes` -- the weight of what the act would take or impose (member 5): `Fixtures.stakes_ob` of the Tenure kind the act
      opens (a kind the verb alone opens, or the one the docketed row `disposes:` for a verb that opens several); `regard` -- the
      counterparty's hostility to the actor (member 7): `regard_step x clamp(-stance / STANCE_MAX, 0, 1)` over the stance rows he
      holds toward the actor (`person_q.stance_toward`), for one person counterparty and no audience (its favourable half is
      leverage, `advantage_sources: favour`); `reception` -- the audience's hostility (OBS §2 member 8; B05.17): a bench that regards the speaker
      ill raises the obstacle by `reception_gain x |reception|` (`world_q.reception`, the hostile half, for a prize a room hears,
      0 where none hears it; its favourable half is leverage, `advantage_sources: favour`); `capability` -- a circumstance that punishes a want, the sum over the `circumstance` rows of
      `tables: capability_uses` for the act's site whose `when` holds, each its held value times its `gain` (B05.15; no row ships,
      so it stands at 0). Every member stands AGAINST the act and is never negative. `even`, `difficulty`, `opposition`,
      `reception` and `capability` stand in every act's terms (at 0.0 where they weigh nothing); `standard`, `stakes` and `regard`
      are listed only where they weigh, so a world whose three are at their control sizes carries the terms it carried before them
      (the terms are folded into the Event's `ending` and so into the content hash). A member lands with its host
      function in `sigma.OBSTACLE_TERMS` and no other code; later members are those the verb lanes add (OBS §2's table).
    ordered: true
    values: [even, difficulty, opposition, standard, stakes, regard, reception, capability]


        hierarchical_equal:          -0.2
        precedent_substantive:       -0.2
        partisan_equitable:           0.3
        selfish_selfless:            -0.2
        rigid_flexible:               0.2
        grandiose_humble:             0.2
        deontological_instrumental:  -0.3
      honour:            # §2.2 · reasoned: selfish_selfless, grandiose_humble
        hierarchical_equal:          -0.5
        precedent_substantive:       -0.8
        partisan_equitable:          -0.3
        selfish_selfless:             0.2
        rigid_flexible:              -0.6
        grandiose_humble:            -0.4
        deontological_instrumental:  -0.7
      liberty:           # §2.3 · reasoned: partisan_equitable, rigid_flexible, grandiose_humble
        hierarchical_equal:           0.7
        precedent_substantive:        0.5
        partisan_equitable:           0.2
        selfish_selfless:            -0.1
        rigid_flexible:              -0.3
        grandiose_humble:             0.0
        deontological_instrumental:   0.1
      justice:           # §2.4 · reasoned: precedent_substantive (a source conflict resolved), partisan_equitable, rigid_flexible, grandiose_humble
        hierarchical_equal:           0.4
        precedent_substantive:        0.1
        partisan_equitable:           0.8
        selfish_selfless:             0.2
        rigid_flexible:              -0.3
        grandiose_humble:             0.0
        deontological_instrumental:  -0.2
      wealth:            # §2.5 · reasoned: hierarchical_equal, partisan_equitable, rigid_flexible, grandiose_humble
        hierarchical_equal:          -0.2
        precedent_substantive:        0.4
        partisan_equitable:          -0.4
        selfish_selfless:            -0.6
        rigid_flexible:               0.5
        grandiose_humble:             0.0
        deontological_instrumental:   0.6
      reputation:        # §2.6 · reasoned: hierarchical_equal, precedent_substantive, partisan_equitable, rigid_flexible, deontological_instrumental
        hierarchical_equal:          -0.3
        precedent_substantive:       -0.2
        partisan_equitable:          -0.3
        selfish_selfless:            -0.6
        rigid_flexible:               0.3
        grandiose_humble:            -0.4
        deontological_instrumental:   0.3
      scholastics:       # §2.7 · reasoned: precedent_substantive (a source conflict resolved), rigid_flexible, grandiose_humble
        hierarchical_equal:          -0.1
        precedent_substantive:       -0.1
        partisan_equitable:           0.4
        selfish_selfless:             0.0
        rigid_flexible:               0.3
        grandiose_humble:             0.2
        deontological_instrumental:   0.3
      stability:         # §2.8 · reasoned: grandiose_humble
        hierarchical_equal:           0.0
        precedent_substantive:       -0.4
        partisan_equitable:           0.4
        selfish_selfless:             0.0

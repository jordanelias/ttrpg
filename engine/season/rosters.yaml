      CONTROL and is not a member (uncapped, today's counts). `element` keeps one count per person per element per season;
      `person` keeps one count per person per season, on the element he holds most violated. [ASSUMPTION: the roster's name and
      shape -- basis: neither source names one; `stance_polarities` is the tree's form for a swept string arm; Jordan to correct.]

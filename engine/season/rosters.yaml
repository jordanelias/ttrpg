    values: [Altonia, Schoenland]

  # ── v9 IN-27 (END-VICTORY; H-176, GD-1): THE ENDING VOCABULARY ────────────────────────────────────
  # A closed set of definitions the loop reads is a roster (this file's header), and `modules:` is
  # the sibling row shape (`members:` keyed by identity, each row refused by name at load).
  endings:
    source: >-
      v9 IN-27 (END-VICTORY), on #457 D6's adopted answer (`workplans/valoria_master_workplan_v9_part5.md`
      RS-21 row 3): *"the ending vocabulary is a Query over holds and seats that the season reports --
      never an actor"*. Read by `queries/world_q.py::endings_reached`, reported by
      `loop/driver.py::SeasonDriver.season` as `endings`.
    cite: "H-176; GD-1; #457 D6; T-b"
    note: >-
      WHAT ENDS A PLAYED REALM, as opposed to its running out of seasons. Terms, defined where the
      loader reads them (`CLAUDE.md` §4): an ENDING is a row here; it is REACHED when every hold its
      `holds:` selects is live and every holder coheres under `under:`, AND an act opened at least one
      edge the condition stands on (`T-b`: the realm as built reaches nothing; a holder's `commit` is
      such an edge only when it is his sole live commit to that faction, so a redundant `commit` act is
      not credited). ⚠ THE CROSSING ITSELF MAY BE AUTHORLESS: an old `commit` act is credited while a
      MATTER death (no act) completes the condition, and no pure read can locate the crossing, because
      the moment the condition was last false is not stored (`T-a`) [ASSUMPTION; medium; Jordan to
      correct]. Revert: every edge the condition reads opened by an act -- which makes
      `peninsular_sovereignty` unreachable by construction (every seeded territory hold re-opened by an
      act, and `terr_T15`'s, unheld at build, by a verb that does not exist, `H-186`). A `holds:`
      selects by a world field, EXACTLY ONE of `{post: <an offices.yaml seat post>}` (every Office with
      that post; since v10 CP-T02-02 a seat an `offices.yaml` row stands for is built under that row's id,
      and a seat with no row keeps its `off_<holder>` slug) or `{rung_kind: <a rung_kinds member>}` (every rung of that kind UNDER A `realm`
      RUNG, held at or above it, `holder_faction_of`'s walk; `terr_T16`, Schoenland's foreign root, is
      outside the realm and not selected).
      `under:` is a `factions` member, or `one_faction` (every selected holder under the same faction,
      whichever). `victory:` marks GD-1's win path; GD-1 permits exactly one, and the load refuses a
      second. A row stores nothing and is not an actor: reaching one emits no Event, halts nothing and
      writes nothing (`SeasonDriver.season` reports it). ⚠ NOT CARRIED, BY THE CUTS: no stored
      stability or legitimacy value, no threshold counter, no clock (#457 §5; `T-a`, `T-b`, `T-c`).
    members:
      peninsular_sovereignty:
        victory: true
        holds: {rung_kind: territory}
        under: one_faction
        source: >-
          GD-1 (`canon/04_game_design_constraints.md`): *"Peninsular Sovereignty is the sole victory
          condition ... control all 15 territories"*.
        assumption_note: >-
          [ASSUMPTION; medium; Jordan to correct] GD-1's other clauses are not carried: `Accord >= 2`
          and `Political Stability <= 6` read stored scalars #457 §5 cuts, `sustained 2 consecutive
          seasons` is a clock, and `treaties counting` has no carrier. Every territory under a `realm`
          rung counts, not a fixed 15; the foreign root (`terr_T16`, Schoenland's, kept out of the realm
          by `build_realm`) is excluded. UNREACHABLE IN COMPUTED PLAY whoever holds what: `terr_T15`
          is Uncontrolled at build (`H-186`) and no verb opens a `hold` on any territory (`H-176`).
          A consumer that treats `victory: true` as the game's end must carry this caveat itself --
          the row is GD-1 minus its sustain, Accord and Stability clauses, and nothing in the loop
          halts on it (`SeasonDriver.season` only reports `endings`).
          Revert: Jordan names a carrier for any of them.
      theocracy:
        victory: false
        holds: {post: King}
        under: "Church of Solmund"
        source: >-
          #457 D6's context (RS-21 row 3), Jordan 2026-10-04: *"ratcheting of Church as faction until it
          attempts to seize lands and become a theocracy"* -- an endpoint. NOT a victory: GD-1 strikes
          `Altonian Theocracy` as an alternate win path.
        assumption_note: >-
          [ASSUMPTION; medium; Jordan to correct] "become a theocracy" is read as the King's seat held by
          a person who coheres under the Church of Solmund (a Church man crowned, or a king converted).
          The land half ("seize lands") is not a condition. Revert: Jordan names the Church's endpoint.

  # ── CP-T01-05 (v10, B10-08): THE SOCIAL ROLL'S ADVANTAGE CHANNEL ─────────────────────────────────
  advantage_sources:
    source: >-
      CP-T01-05 (`proposals/2026-10-23-subsystem-completion/2026-10-23-subsystem-completion-01-resolution-
      and-dice.md` §2), read as INTENT; the form is `resolution-diagnostic` §2's: advantage reaches a roll
      only as named levels through `levels_to_net_sigma` -> `net_boost`, a mu-shift, never a flat bonus on
      the net and never an Ob reduction.
    cite: "CP-T01-05"
    open: true
    ordered: true
    note: >-
      THE ONLY DOOR INTO THE SOCIAL ROLL'S SIGMA TERM. `seam/wrappers/sigma.py::contest_input` sums the
      named levels each member returns for the act and hands the sum to `levels_to_net_sigma`; with no
      member contributing (the shipped chooser forms no `effort`) the term is 0.0 and the roll is as it
      was. A later source (a threat, a held secret, a held finding, a bribe) is a ROW HERE plus its
      function in `sigma.ADVANTAGE_SOURCES`, never a flat bonus on the net and never an inline
      re-derivation of `net_boost`. `seam/wrappers/sigma.py` refuses at import a member with no
      function and a function with no member, so the roster is the closed set and the table is its
      binding.
      `effort`: an act carrying `effort` e in its payload (0, 1 or 2) contributes e levels named by the
      `effort_level` fixture (`Fixtures`, shipped `moderate`) and fills `1 + e` of its scene's
      interaction slots (`state/carriers.py::Scene.slots`), so effort's whole cost is the acts the
      person does not take in that scene.
      [ASSUMPTION; medium; Jordan to correct; revert: delete this row and `sigma.ADVANTAGE_SOURCES`'
      `effort` entry -- the channel then sums to 0.0 and `Scene.slots` counts every act as one slot].
      `capability` (B05.10, MAP §G edit 6): the `edge` rows of `tables.capability_uses` at the act's site, read by ONE
      function (`sigma._capability_levels`), so a skill, an attribute or a trait becomes a level on the roll by a ROW and never
      by a function per trait. THE CHANNEL IS SIGNED: each member returns `(levels for the roller, levels against him)`;
      `levels_to_net_sigma` takes both lists. A row's count is once when held (`per: held`), once per rank (`per: rank`) or
      the signed steps of the held value from its scale's mid-point (`per: mid`: above counts for the side named, below
      against; an unauthored value is the mid-point, zero steps); `against: true` flips the sign, so it counts against the
      ROLLER. No `edge` row ships at the social roll (B05.25: the roller's attributes are in his dice, averaged, and the
      opponent's is the opposition's), so the member returns no level and the roll is as it was.
      `proofs` (B05.17, PES-A edit 1): one `proof_level` per whole unit of `world_q.proofs(speaker, opponent, venue)` (the
      remove-weighted, unmirrored sum, rounded half up). `favour`: one `favour_level` per whole unit of `reception_gain x reception`
      where that is positive. Both are FOR the roller only (the defender list waits on cited items, B24); a hostile bench is not here
      but the obstacle's `reception` member. A fixture of None is the control: the source brings no level.
      `office` (B05.20, U1-D, D-U1-01a): the one level named by the `modifier:` of the seat an act is exercised through (`Act.via`),
      where the prize row says `heard_by: bench` and that seat sits over the room (`state/gate.py::sits_over`); FOR the roller only
      (the defender column is struck, OBS §3). A seat declaring none, an act through no seat and a prize no bench hears bring no
      level; no shipped row authors a `modifier:` (the bench seats' first values land with B05.23).
      `wounds` (B05.60, ADV Edits B to D; A-8): one `wound_level` AGAINST the roller per `wound_step` of body his person has lost below his
      `body_ceiling`, and one FOR him per `wound_step` the person he acts on has lost, each side at most `wound_levels_max`
      (`sigma._wound_levels`); never an obstacle term and never a die. A person subject's body is read only by the true input: a believer's
      own body is his to know, another's is not (`believed_input`). A `wound_level` of None is the control: the source brings no level.
    values: [effort, capability, proofs, favour, office, wounds]

  # ── B03.68 (`09_WR_threadwork_module` edit 3): THE THREAD OPERATIONS ─────────────────────────────
  thread_operations:
    source: "`09_WR_threadwork_module` edit 3: the seven operations `systems/threadwork/sim/operations.py` has an entry point for (`attempt_leap`, `attempt_weaving`, `attempt_pulling`, `attempt_past_pulling`, `attempt_locking`, `attempt_dissolution`, `attempt_mending`)."
    cite: "B03.68"
    note: >-
      WHAT A THREAD OPERATION IS: one named working a practitioner attempts on the thread, as an operation is one
      task performed. The closed set of their names, read by `data/verbs.py`'s verb loader: a verb row that names
      one through its `operation:` column names a member or the load refuses at import, as it refuses an
      off-roster `beneficiary:`. NO SHIPPED ROW NAMES ONE YET -- the thread rows (CP-T07-03, -04, -11) are B35's.
      The names are the roster's own spelling, not the oracle's labels (`operations.py` reports `Weaving`,
      `Past-Oriented Pulling`, `Locking`): the oracle under `systems/` may not import `engine/season`, so it
      reads no list from here and keeps its labels. `knot` joins when the `tie` / `knot` split lands (A-28, B35).
    values: [leap, weave, pull, past_pull, lock, dissolve, mend]

  # ── B09.12 (`16_PESSIMIST_GAME_standing_occasions_carry_their_cause`): THE EVENT THAT OPENS A STANDING OCCASION ──
  standing_occasion_opened_by:
    source: "`16_PESSIMIST_GAME_standing_occasions_carry_their_cause` edit 1 (workplan v12 B09.12; A-33, A-47)"
    cite: "H-457"
    note: >-
      THE EVENT KINDS THAT OPEN A STANDING OCCASION OF EACH REFERENT CLASS, most specific first -- a mapping,
      `{class: [kinds]}`, each class a `referent_classes` member. A standing occasion is a classed referent a person's
      question carries (`state/carriers.py::Question.classes`: a vacancy, a writ held, a wounded person, a detainee, a larder, a flow
      stake); the OPENING Event is the first kind listed here that `World.last_emission_of(kind, referent, written=True)`
      finds in the log, and `loop/resolve.py::_occasion_ids` puts its id after the act's own in `causes[]` of every Event the
      act folds (one id, so `causes[]` does not fan; nothing when the log holds none, as for a seat vacant since the
      build). Read by `data/rosters.py::STANDING_OCCASION_OPENED_BY`; held at import to `data/verbs.py::EVENT_KINDS`, which
      is every verb row's `emits` plus the fold, MATTER and CALENDAR kinds (`_check_standing_occasion_opened_by`, beside
      `_check_strife_kinds`), and to `referent_classes`. Switched by `Fixtures.standing_occasion_cause` (H-457; `False` is
      the control: no opening Event is named).
      [ASSUMPTION; medium; Jordan to correct; revert: set `standing_occasion_cause` False (an empty list for a class is refused at import, `data/rosters.py::_load_standing_occasion_opened_by`). The kind lists
      are the proposal's reading of each source's docstring in `queries/world_q.py::questions_for`.]
    values:
      Office:      [tenure.closed, office.established]
      Record:      [dispensation.issued, petition.filed, record.created]
      Person:      [body.changed]              # `wounded_with`
      Detainee:    [person.captured, arrest.made]
      Rung:        [stores.changed, rung.seized]
      Site:        [condition.band_crossed]
      Proposition: [proposition.uttered]

tables:

  # B04.05 (MAP §C, U1 §3): the uses table -- today's rules restated, one row per place a skill changes an outcome. Read by
  # `data/rosters.py::capability_uses()`; no reader reads it before B04.06. The `social_roll` `dice` row names `add: pool_add` and
  # `floor: pool_floor` (B05.10: `pool.py::faculty` reads the two names off the row); the `fight` row names the same two (B05.57: the
  # pair is carried raw on `PersonalCombatInput.pool_add` and `.pool_floor`, `seam/wrappers/combat.py::combat_input`, and the module applies it). No row ships for `edge`, `circumstance`, `addend` or `rate`: the social roll's `edge` reader is
  # `sigma.py::_capability_levels`, and a planted row is read by it (B05.10; no `side: actor` or `side: subject` row on
  # `verb.base` ships, B05.25).
  # The `social_roll` rows are the single roll's (`seam/wrappers/sigma.py::contest_input`); a proceeding's dice and opposition
  # are the social contest's (V2), not rows here.
  capability_uses:
    rows:
      - {use: social_roll,       role: dice,      key: verb, side: actor, add: pool_add, floor: pool_floor}
      - {use: social_roll,       role: opposes,   key: verb, side: subject}
      - {use: fight,             role: dice,      key: verb, side: each, add: pool_add, floor: pool_floor}
      - {use: fight,             role: opposes,   key: verb, side: each}
      - {use: fight,             role: resource,  key: attr.body.endurance, side: each}
      - {use: kit,               role: threshold, key: attr.body.strength,  side: each}
      - {use: told_claim_credit, role: judgement, key: attr.social.attunement,  side: actor, gain: competence_gain}
      - {use: choice_temper,     role: judgement, key: attr.mind.focus,         side: actor, gain: temper_gain}
      - {use: own_state_gate,    role: gate,      key: prac.thread_sensitivity, side: actor, gain: thread_sensitivity_gate}
      # B10.15 (`16_PESSIMIST_CHAR_A` "The resolution, decided" 2, A-7): the attribute that governs a crisis of faith, read by `loop/resolve.py::_crisis_net_sigma`
      # through the one `edge` reader (`sigma.ADVANTAGE_SOURCES["capability"]`) and only at `Fixtures.crisis_arm: drawn`. The source's `side: roller` is not a member of
      # `capability_sides` (actor, subject, each), so it reads `side: actor`: the one who rolls is the one in crisis. Its key is `attr.spirit.will`, which B01a.06
      # renamed from the source's `attr.mind.will` (a legacy alias that `capability_uses` does not accept). `level: minor` is the smallest step of `LEVEL_SIGMA`:
      # each point of Spirit above or below the scale's mid-point is one such step for or against him.
      # [ASSUMPTION; medium; Jordan to correct: Spirit governs faith, and by one `minor` step a point -- basis: the source's "will governs faith"; the CHAR content pass may
      # substitute; revert: delete this row, and the crisis reads no attribute.]
      - {use: crisis,            role: edge,      key: attr.spirit.will, side: actor, level: minor, per: mid}

  site_yield:
    source: "`W8` / `H-93`. #353 §25 lists `yield` as written at MATTER and *blocked on `season_factor`'s distribution* (§22.3); it never says what a place produces."
    row: H-93
    default_cell: 0
    sweep: [declared, uniform, none]
    keys: [site_kinds, matter_kinds]
    note: >-
      ⚠ WHAT A HARBOUR PRODUCES IS INVENTED. #353 supplies the BARRIER, the ORDER and the BLOCKER
      and no quantities at all, so this table is an injected default with a row and a sweep — the
      same standing as `alignment` and `band_floors`, and stated here rather than left to look
      derived.
      ⚠ WHAT IS *NOT* INVENTED IS THE SCALING. Production is the base scaled by the site's
      `condition / condition_scale` and then by `season_factor`. Condition is the model (`H-38`
      closed with *"`Site.condition` is the model"*), `condition_scale` is an existing registered
      fixture, and `season_factor` is #353's own named blocker — so a WORN PLACE PRODUCES LESS
      without a second wear concept being invented to make it do so. That is why yield is keyed
      on the SITE and not on the rung: the rung has no quantity that could fall.
      ⚠ `none` IS THE CONTROL ARM, not a third opinion: with every cell zero the economy has no
      source, every store depletes monotonically, and `W8`'s own proof clause must fail. A sweep
      whose control arm cannot break the claim is not a control.
    cells:
      harbour:
        grain: 40
        salt:  30
      seam:
        ore:    50
        timber: 10
      body: {}

  band_floors:
    source: "#353 §12.1 / L5 — the band edges a crossing fires on. `H-08`."
    row: H-08
    default_cell: 0
    sweep: [declared, halved, doubled]
    keys: [site_kinds]
    note: >-
      ⚠ MOVED OUT OF THE INSTRUMENT BODY BY `W8` for `wear_per_season`'s reason. The verb keys are
      SITE-USE verbs (what the site is good for at that condition), NOT verb-table rows, so unlike
      `alignment` this table is not validated against `verb_table.yaml` — a check that would fail
      on every cell. The outer key IS validated against `site_kinds`.
      ⚠ THE FLOORS ARE INVENTED. #353 states that a band edge crossing emits and may produce no
      outcome; it supplies no edges. `H-08` is the row, and until `W8` it was an `assumption` with
      no `site:` and no sweep at all — one of `PLAN.md` §1.5's unowned residue, now owned.
      ⚠ `dwelling: {}` IS EMPTY ON PURPOSE (`24d-i`, the control arm beside `wear_per_season`'s
      `dwelling: 0`). No floor means no band edge, so `loop/matter.py`'s `_crossings` fires
      nothing for a dwelling at any wear. `halved` and `doubled` leave an empty cell empty.
      ⚠ AN EMPTY CELL IS NOT A WORKABLE SITE, AND THE `floor` READ SAYS SO TYPED: `queries/
      world_q.py`'s `floor` stem checks `if not floors:` before `min(floors.values())` and raises
      a typed `Unspecified` (S12.1) rather than a bare `ValueError` on `{}` (`world_q.py`'s own
      comment at the guard names `dwelling`'s control-arm row by id). It is unreached only while no
      question names a dwelling as a referent, since `work` binds its `site` from the referent.
      None does at the control arm; `24d-i`'s test in
      `engine/season/tests/test_governance_build.py` asserts it over one populated season.
      ⚠ `garrison: {}` IS EMPTY FOR THE SAME REASON, NOT A SEPARATE CHOICE (M4, `ED-IN-0279` clause
      (a)). A field battle's fortification term reads `Site.condition` DIRECTLY -- `queries/
      world_q.fortification_of` -- never through `floor`'s band-crossing read, so the empty cell
      is never reached: nothing names a garrison as a `work`-style referent, and no march-battle
      code calls `floor` on one. Filling this in would invent a band-crossed Question a garrison
      cannot yet answer (no verb writes `Site.exists`/`condition` toward it from the field-battle
      side except through the unbuilt `restore`), which is `wear_per_season`'s `garrison: 0` note
      applied to the other half of the same table.
    cells:
      harbour:
        bulk_shipping:   800
        fishing:         100
      seam:
        deep_mining:     700
        surface_gleaning: 50
      body:
        full_operations: 800
        limited:         500
        withdrawal_only: 100
      dwelling: {}
      garrison: {}
      barracks:       {}
      archery_range:  {}
      stable:         {}
      siege_workshop: {}

  # v10 CR-33 -- THE 34 LIFEPATHS AS CREATION TEMPLATES: WHICH CAPABILITY KEYS A LIFEPATH'S STARTING SKILLS NAME.
  # A cast row's `lifepath:` key is expanded by `data/cast.py::capability_of` into `Person.capability` entries
  # (each key at `pool_default`) at world build, and the lifepath id is stored NOWHERE on the `Person`.
  lifepath_templates:
    source: >-
      `character_histories_v30.md` (archived), STAGE 3, the
      `Starting Skills (★)` column, rows `:310-382` of that file. Each `ground:` cites the row's line there.
    row: H-126
    keys: [lifepaths, capabilities]
    note: >-
      ⚠ A CUT, NOT A TRANSCRIPTION. Every authored dice magnitude (+1D, +2D, TS +3, Ob and strain changes) is
      DROPPED: a template names which of the skills a verb's `capability:` column names (`copying`, `argue`, `inquiry`; `descriptors.CAPABILITIES`) a lifepath's
      starting skills draw on, and nothing else. A key is held at `pool_default`, so the grant changes no pool;
      it makes the key one `train` can raise (`loop/effects_combat.py::_eff_train` raises only a key the subject
      already holds). A lifepath whose starting skills no key covers holds NONE (`holds: []`), RECORDED here
      and not invented.
      ⚠ THE RULE EACH ROW WAS READ BY, so a reviewer can re-read the text and not the taste. Only the `★`
      skills count: the `Third Skill (spark)` column is a skill that may be sparked later, not held at creation
      (the archived file's own header, `Starting Skills (★)` against `Third Skill (spark)`). `argue` is named
      when a starting skill's text says the Argue act, or adds dice to, or moves a resistance parameter of,
      the Argue exchange itself (a Recall bonus in a contest genre, an Obscuring bonus in a private
      negotiation, Audience Resistance: `social_contest_v30.md:102,115,168,177`); a strain, an Appraise, a
      Regroup or a payout on a win is not the roll and holds nothing. `inquiry` is named when it says
      Investigation, institutional records or documents recalled (`research`), assessing or authenticating a
      thing of the kinds `examine` reads (evidence, architecture, documents, objects: `verb_table.yaml`
      `examine`), or recon of a place (`surveil`: observe a location, person or operation). `copying` is
      named when it says relaying or copying a text; no starting skill does, so no row holds it. A text that
      says only a bonus in a domain, a defence, a strain, an identification of forces, the threat of a being
      or a navigation holds nothing, and the near misses are said in the row's own `ground:` (3-CH3, 3-CR5,
      3-HA3, 3-LO2, 3-LO4, and 3-CF4's Knot, which names copying). The wider reading (Appraise, strain
      and Regroup effects inside the contest also hold `argue`) is NOT adopted; it would add argue to
      3-CR3, 3-VA1, 3-VA4, 3-GU1, 3-LO3, 3-CF3 and 3-CF5.
      CLOSED, BOTH WAYS (`data/rosters.py::_load_lifepaths`): a row for every id of `rosters:
      lifepaths` and for nothing else, each `holds:` entry a skill of `descriptors.CAPABILITIES`, a `ground:` on every row.
      [ASSUMPTION; medium; Jordan to correct; revert: delete the `lifepath:` keys from the cast rows (one
      re-pin); the key mapping is content.]
    cells:
      3-CR1: {holds: [argue], ground: "★ Courtly Grace '+1D Argue before Expert Judge in Crown territory' names the Argue act -> argue; ★ Read the Room '(Appraise TN 6)' -> none (:310)"}
      3-CR2: {holds: [], ground: "★ Riposte '(counter-Strike after successful Defence)' and ★ Formation Discipline '(+1 Discipline start)' are combat and formation, no key (:311)"}
      3-CR3: {holds: [], ground: "★ Schoenland Contacts '(+1D DA involving Schoenland)' is a domain action and ★ Haggler's Nerve '(-1 strain in private negotiation)' a strain; neither names Argue or an inquiry (:312)"}
      3-CR4: {holds: [inquiry], ground: "★ Paper Trail '(+1D institutional records)' names records -> inquiry (research); ★ Procedural Objection '(force Regroup or +1 Ob once/contest)' names no Argue -> none (:313)"}
      3-CR5: {holds: [], ground: "★ Harvest Leverage '(+1D on DA involving food supply)' is a domain action; ★ Seasons Reader '(+1D Cognition for weather/terrain/agriculture)' is a domain knowledge bonus naming no assessment -> none (:314)"}
      3-CH1: {holds: [argue], ground: "★ Doctrinal Authority '(+3D Recall bonus in Memory genre on theology)': Memory is a style picked inside the Argue exchange and the Recall bonus is dice added to that roll (social_contest_v30.md:168,172-177) -> argue; ★ Liturgical Composure '(+2 Composure in Church Tribunal)' -> none (:320)"}
      3-CH2: {holds: [], ground: "★ Smite the Heretic '(+1D Offence ...)' and ★ Shield of Faith '(+1D Defence in Full Guard)' are combat, no key (:321)"}
      3-CH3: {holds: [], ground: "★ Sermon Delivery '(+1 Piety Track on Revealing win before Crowd)' names no Argue; ★ Folk Trust '(-1 Ob DA involving common population)' is a domain action -> none (:322)"}
      3-CH4: {holds: [inquiry], ground: "★ Forbidden Knowledge '(once/arc suppressed document recall)' and ★ Paper Trail '(+1D institutional records)' name documents and records -> inquiry (research) (:323)"}

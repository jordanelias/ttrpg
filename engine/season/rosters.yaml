  violence_contexts:
    source: >-
      v11 CR-87 (commit `c7145842` (1); ED-IN-0337, RULED, Jordan
      2026-11-05: fighting is exceptional -- it belongs to civil war, criminal contexts and duels, is rare in
      civil society and is not simply chosen); `held_edge_declines`' shape (above), `verb: [context, ...]`.
    note: >-
      WHICH VERBS A PERSON FORMS ONLY ON A SUBJECT HE HOLDS A CONTEXT OF VIOLENCE AGAINST, AND WHICH CONTEXTS
      COUNT -- `verb: [context, ...]`. Read in `decision/options.py::opening_set`, person-side and World-free
      (AX-2), after every widening: a referent no listed context names forms no Candidate. A CONTEXT IS A NAME
      OF ONE READER IN `options.py::VIOLENCE_CONTEXT_READERS`, the closed set (code, not this file): `war` -- the
      subject is stamped `Enemy` on the question he answers (`queries/world_q.py::enemies_heard`: a person of a
      faction `faction_q.at_war` with his own, over a war Proposition he has heard of or committed to); `crime`
      -- the subject is named by a warrant he holds that is ADDRESSED TO HIM (a held Record of a `warrant_sourced`
      kind, the reading `arrest` forms on, narrowed by `person_q.addressed_to`: the maker of a writ about a person
      is not charged with it [ASSUMPTION; medium; Jordan to correct; revert: no addressee test]) or stamped
      `Detainee` (a live `detain` on his seat: `arrest`'s and `capture`'s
      custody); `duel` -- he holds a `challenge` Record naming himself and the subject as its two parties
      (PC-10b's Record, read through `record_sourced_operands`); `defence` -- the subject's own act against
      him, of a kind a VIOLENT opponent-rule row emits (`options.subject_is_opponent` and `violent_prizes`,
      below: an attack, not a hard word), that he saw done to him in the newest season his ledger holds
      (`person_q.attackers_of`: `suffered_deeds`' pairing, `recent_claims`' window) [ASSUMPTION; medium; Jordan
      to correct; revert: drop `defence`]. ED-IN-0336's "duels only" is the line
      `fight: [duel]`. It NARROWS and widens nothing; the hand-built fold, which never forms, is untouched,
      and the coercion rows (`arrest`, `detain`, `capture`, `interrogate`, `seize`, `raze`, `march`) keep their
      own gates. ONE LOADER, `data/verbs.py::VIOLENCE_CONTEXTS`, refused at import when a line names a verb the
      table lacks or one whose `subject` is not its opponent; `options.py` refuses a context it has no reader
      for. An empty block is the CONTROL: no decline. [ASSUMPTION; medium; Jordan to correct; revert: `{}`.]
      B11 lane A (carrying `14_VERBS_PHYSICAL_A` A3's first line): `duel` DROPPED from `fight`. The challenger
      holds every challenge he issues, so the context licensed him to attack the man he had called out, under
      `fight`'s lethal terms, without an acceptance. A duel is `accept`'s, fought under its challenge's
      terms. The `duel` reader stays in the closed set for a later line. [ASSUMPTION; medium; Jordan to correct;
      revert: restore `duel`.]
      B10.61 READING, KEPT: it reads the world's contexts (a war, a warrant, a deed done to him), none of them his own
      state, so `OwnStateReader` cannot answer it. Without it `fight` forms on 4170, 4049 and 4344 more
      (person, question) pairs at seeds 0-2, 252 of them at lap 0.
    values:
      fight: [war, crime, defence]

  opposed_without_prize:
    source: >-
      B11 lane A (the duel chain's fifth link; ED-IN-0336, RULED: a duel settles a dispute).
    note: >-
      THE ROWS THAT NAME NO PRIZE AND ARE NONETHELESS DONE AGAINST THEIR SUBJECT -- a list of `verb_table.yaml`
      verbs whose second side is their `subject` (`counterparty: subject`). `decision/options.py::subject_is_opponent`
      reads a member as it reads a contested row, so the chooser's stance term (`stance_polarity: declared`) scores
      it AGAINST the subject: a grievance raises a challenge to the man it is held against, where it had lowered it.
      Without it `challenge` was never chosen: it was formed on every standing grievance beside its holder and
      scored below the best candidate. `oblige` shares the columns and is not listed: a
      man asking service of another is not acting against him. Refused at import for a verb the table lacks or one
      whose second side is not its subject. [ASSUMPTION; medium; Jordan to correct; revert: `[]`.]
    values: [challenge]

  violent_prizes:
    source: >-
      v11 CR-87 (commit `c7145842` (3): the grudge's weight on the
      violent rows only).
    note: >-
      THE CONTEST PRIZES WHOSE ROWS ARE VIOLENT -- a list of `contest_subsystems.prizes` keys. A row is violent
      when its `contests:` is listed (`data/verbs.py::VIOLENT_VERBS`, derived off the table: today `fight`,
      `capture` and `accept`); `decision/choose.py::stance_term` reads `Fixtures hostile_stance_gain` in place
      of `1 + stance_gain` on such a row where its subject is its opponent, so a grudge's pull on violence is
      bounded apart from its pull on every other act. Refused at import when a member is no prize.
      [ASSUMPTION; medium; Jordan to correct; revert: `hostile_stance_gain` null, which reads `1 + stance_gain`.]
    values: ["the body"]

  bodily_prizes:
    source: >-
      v12 B10.31 (`02_CHAR_what_an_act_risks` edit 2): the contest prizes whose loss a person's own body or field pays.
    note: >-
      THE CONTEST PRIZES THE ACTOR HIMSELF STAKES IN BODY OR IN THE FIELD -- a list of `contest_subsystems.prizes` keys. A candidate
      is EXPOSED when its row's `contests:` is listed (`data/verbs.py::BODILY_PRIZES`; read off the row's own column, never a verb
      name); `decision/choose.py::score_terms`' `risk` element prices only an exposed candidate. Today `the body` (`fight`, `capture`,
      `accept`) and `a field` (`march`). Refused at import when a member is no prize any verb row contests (a closed set read against
      the verb table, so a renamed prize cannot leave the term reading nobody).
      [ASSUMPTION; medium; Jordan to correct; revert: delete the row, and `risk` reads 0 for every candidate.]
    values: ["the body", "a field"]

  shortfall_sourced_operands:
    source: >-
      plan position `19d` (DEMAND · DELIVERY), `workplans/2026-09-28-the-plan-one-order-mc-v18-retired.md`
      §3.2 row 11, and the driver-retirement plan's G3: *"wiring the existing `transfer` verb's
      operands from a shortfall claim"*.
    note: >-
      ⚠ `record_sourced_operands`' CLAIM-SOURCED SHAPE, ONE ROW DOWN, FOR A SECOND KIND OF CLAIM: the operand names a
      SHORTFALL CLAIM may answer, before `decision/options.py::_derive_operand` falls through to the
      referent or the fixture. A subset of `requires_operands`, refused at import otherwise
      (`data/requires.py`). The claim is `(rung, "<predicate>:<kind>", units)`: MATTER records it
      on the `stores.changed` Event of a larder the draw ran dry with a mouth unfed, as `demanded -
      delivered` over the rung's subtree (`queries/world_q.py`), and WITNESS deposits it into those
      who witness that write.
      ⚠ TWO NAMES, NOT THREE, AND `to` IS LEFT OUT ON PURPOSE. For a `claim_landed` question the
      referent IS the claim's subject (`questions_for` builds `(c.subject,)`), so `to` already binds
      the drained rung through the referent rule. A claim branch for it would always return the same
      value as the fallback beneath it, and a branch that can never change an outcome is `ID-13`.
      A document maps `to` because a writ's addressee is NOT its subject (the Record). `from` stays
      the actor's own rung for r2 §A.13's reason: a claim about somewhere else must not reach into a
      larder the actor is not standing in.
      ⚠ THE PREDICATE STEM IS DATA, AND IT MAY NOT BE A WORD THE `requires` GRAMMAR READS: a claim
      whose stem `LedgerReader` answered would become a belief about a store LEVEL. It may not be
      the content stem either. `data/requires.py` refuses both collisions at import.
    claim:
      predicate: shortfall
    values: [kind, amount]

  known_person_operands:
    source: >-
      telling workplan `T4` (`workplans/2026-10-01-telling-workplan.md` §3 and §4, `ED-IN-0282`):
      *"`known_persons`: ids from truthy `exists:Person` claims, `Seen.who`, told `chain[-1]`; minus
      self and referent"*, and one Candidate per known person.
    note: >-
      ⚠ THE SIBLINGS' SHAPE FOR A THIRD KIND OF ANSWER: the operand names a person answers with
      SOMEBODY THEY KNOW rather than with the question's referent. A subset of `requires_operands`,
      refused at import otherwise (`data/requires.py`). `decision/options.py::operand_bags` forms one
      operand bag per known person, and only for a row whose typed cell binds `subject` SEPARATELY
      from the name -- `tell`, whose topic is `subject` and whose hearer is `to`, since plan
      position `14` `give`, whose Record is `subject` and whose receiver is `to`, and since plan
      position IN-10 (#453 §10.1) `issue`, whose `terms` is `subject` and whose executor is `to`, so a
      writ is no longer addressed to what it is about. A row binding `to` without `subject`
      (`petition`) keeps the referent rule: what it is addressed to IS what it is about there,
      `H-94`'s single referent. Since IN-10 a held Record's addressee is a second side too
      (`record_sourced_operands`, reader (2)).
      ⚠ `claim` IS WHERE A PERSON BECOMES KNOWN, and `queries/person_q.py::known_persons` reads it:
      `predicate` -- a truthy existence reading of a person (deposited by the `existence` form's
      fold); `seen_term` -- the `seen` claim's term naming who was seen doing something. The third
      source, the teller of a told claim (`Claim.chain[-1]`), is structural and needs no row here.
      Nothing else makes a person known: no roster of acquaintances, no world read.
    claim:
      predicate: "exists:Person"
      seen_term: who
    values: [to]

  intent_claim:
    source: >-
      v9 IN-16, telling `T7` (G9, declared intent; `workplans/valoria_master_workplan_v9_part4.md`,
      `ED-IN-0282`): *"a teller may tell a hearer an act they have CHOSEN-AND-NOT-YET-DONE, as a
      position and a claim kind"*.
    note: >-
      THE CLAIM KIND A DECLARED INTENT IS. `decision/choose.py::declare_intents` mints it at CHOOSE,
      through `queries/person_q.py::intent_said`, onto a telling's `said`, so the told deposit lands
      it in each hearer's ledger as `(teller, <stem>:<verb>, ((name, id), ...))`: `claim.predicate`
      is the STEM, the intended act's verb its argument, and `values` are the operand names of the
      intended act whose ids the value carries, in this order. `queries/world_q.py::named` reads
      those ids back (through `person_q.intent_named`), so a hearer whose reach covers a person or
      place the intent names is raised a `claim_landed` question about the teller. ⚠ NOT A CELL:
      the stem is refused at import if it is a `requires` grammar stem (it would read as a world
      fact and `record` would pair it), the `seen` predicate, the `content:` predicate or an emitted
      event kind (`person_q._check_intent_claim`). Whether the act was later done is not read by
      anything (`hole_register.yaml` `H-191`).
    claim:
      predicate: intent
    values: [subject, to]

  stance_polarities:
    source: >-
      v9 IN-18 `G2` (telling workplan §5, `ED-IN-0282`): *"polarity in §F2 term 2"* -- the score's
      regard term read by the ROLE the regarded party plays in the act, with `declared` against
      `legacy` as the falsifier's two arms.
    note: >-
      THE ARMS OF `Fixtures.stance_polarity` (`H-194`), read by `decision/choose.py::stance_term`
      (its `_stance_arm`), score term 2. `legacy` is the pre-G2 term, `+ stance_toward(p, c.subject)` for every row --
      the CONTROL (shipped until CR-16): an act against a disliked opponent then scores LOWER, the sign §F2's
      term never distinguished. `declared` reads `regard(p, c.subject)` (G1's, so its judged and
      told halves enter at their own gains) and NEGATES it where the subject is the act's OPPONENT
      (`decision/options.py::subject_is_opponent`: the row contests and its second side is its subject,
      `VerbRow.opponent_operand()`), so
      fighting the disliked scores higher. A Rung subject reads 0 at G1's control; at live gains it
      reads the deed claims held about it (`transfer.made` on a changed rung, under
      `claim_subject_rule: both`). Its regarded party under the ROLE reading would be its HOLDER,
      and no ledger holds a `held_by` claim (M0g, `H-195`). `regard` is the
      midpoint: G1's regard with `+` on every row, so the sweep separates what regard adds from
      what the sign adds.
    values: [legacy, regard, declared]

  regard_signs:
    source: >-
      B10.11 (`02_CHAR_scar_cap_and_regard_unit` Addendum, H-337, H-282; `17_CENSUS_C1A_02` W4): the sign of regard, a column of the verb row.
    note: >-

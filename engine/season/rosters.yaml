      holder's `seen` claims (`person_q.deed_counterparty`). [ASSUMPTION: the roster's name and shape -- basis: `stance_polarities` is the tree's form for
      a swept string arm; Jordan to correct.]
    values: [paired_only, person_subject]

  crisis_arms:
    source: >-
      B10.13 (`16_PESSIMIST_CHAR_A` "The resolution, decided" 3; U1 F-43: the switch is `Fixtures.crisis_arm`, values `rule` and `drawn`):
      the two ways a crisis of faith comes out.
    note: >-
      THE ARMS OF `Fixtures.crisis_arm` (`H-472`), read by `data/fixtures.py::load` (a shipped value outside this set is refused) and,
      from B10.15, by `loop/resolve.py::_conviction_crisis`. `rule` is the CONTROL (today's function: the branch is chosen by a rule over state

      `+-Fixtures.manner_offset_bound`); each is a member of `pursuit_axes`. The other axes stay as their pursuits project them (A-108: "the other axes
      ... projected"). `selfish_selfless` is left out by M34's default (spread 0). [ASSUMPTION: the roster's name and shape -- basis: `crisis_write_kinds`' closed
      set of names read by a loader; Jordan to correct.]
    values: [rigid_flexible, grandiose_humble, deontological_instrumental]

  relation_grounds:
    source: >-
      B10.62 (`IS-B2-CHAR-03`): the six edge types of the archived relational-graph design, as plain words (CHAR addendum B).
    note: >-
      THE GROUNDS A CAST ROW'S `relations:` ENTRY MAY NAME, read by `data/cast.py::relations_of`, which refuses any other. A ground is what another
      person is to the holder, and it is the predicate suffix of the `bond:<ground>` claim `boot/realm.py::seed_relations` deposits in the holder's

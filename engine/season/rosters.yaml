             "3-RE1", "3-RE2", "3-RE3",
             "3-LO1", "3-LO2", "3-LO3", "3-LO4",
             "3-CF1", "3-CF2", "3-CF3", "3-CF4", "3-CF5", "3-CF6"]

  contest_subsystems:
    source: "`references/module_contracts.yaml` names `combat` (was `personal_combat`; one identity per module, A-25), `mass_battle` and `social_contest` as modules with real docs and real resolvers. `ARCHITECTURE_V2.md:394` declares `contests: <prize>` — *if set, routes to the seam at RESOLVE (§39)*."
    cite: "H-88"
    note: >-
      ⚠ A CONTEST IS A DISPATCH, NOT A GENERIC ROLL. Jordan, 2026-09-02: *"a contest seems like it
      can be a call for a different subsystem like personal combat, mass battle or social
      contest."* The three subsystems each have a doc, a sim module and a declared resolver
      (`d_sigma` for all three), so the seam dispatches to
      them rather than rolling generically.
      ⚠ JORDAN, 2026-09-02, VERBATIM: *"we aren't using the .md or anything for those systems.
      those are super outdated. you are allowed to refer to the currently existing python work for
      those systems (and only those systems) in repository."* So the LIVE artifact for each is its
      Python, not its `*_v30.md`: `systems/combat/combat_engine_v1/`,
      `systems/mass_battle/sim/`, `systems/social_contest/sim/contest/`. `contest_subsystem` reads
      `sim_module:` and never `doc:` for that reason.
      This roster maps a PRIZE to the subsystem that owns it. The prize is what Part E's column
      carries; the subsystem is what `module_contracts.yaml` already names, so neither half is
      invented here.
    # ⚠⚠ **`module:` AND `provider:` ARE TWO FIELDS ON PURPOSE.** `module:` is WHOSE prize it is — the
    # subsystem that owns the contest, which is what `references/module_contracts.yaml` is checked
    # against and what the seam names when it refuses. `provider:` is WHAT ACTUALLY RUNS IT, which is a
    # different question the moment an interim resolver stands in for a subsystem that has not been
    # built: *this prize belongs to social_contest* and *this prize is rolled by sigma_leverage* are
    # not the same sentence. Repointing a provider is ONE FIELD ON A ROW rather than a code change
    # (`02 §D.4`; ED-SC-0033 clause (2)).
    prizes:
      # `person_inputs:` (B05.25) IS HOW THE PRIZE'S MODULE READS A PERSON, and it is what exempts a verb from naming attributes
      # (`data/verbs.py::_check_governing_attributes`): `own` -- the module reads the person by its own rule and the verb row
      # names no `governing:` (combat's `scores`, `addends` and mapped attributes, `seam/wrappers/combat.py::combat_input`; the field's
      # records); `pool` -- the module takes the pool `seam/wrappers/pool.py::faculty` builds from the verb's `governing:`
      # attributes and skill rank (`seam/wrappers/sigma.py::contest_input`), and the row names the `opposed_attribute` of the
      # person opposite.
      "the body":
        module:   "combat"
        person_inputs: "own"
        provider: "personal_combat"
        module_entry: "combat.fight"   # `31b`, as `a standing`'s: the composition role `seam/wrappers/combat.py` calls through `MODULE_ENTRIES`, for EVERY verb contesting this prize (`fight` and `accept`); the composition row's `verb:` names one of them (`fight`), the registrar's one-verb shape.
        step:     "ENCOUNTER"   # `a field`'s pair. Every fight is declared at RESOLVE and fought at ENCOUNTER, in AUTOMATED and PLAYABLE alike -- the one step the host may suspend at (`seam/wrappers/combat.py::resolve`'s `host`).
        declares: "Declared"
        cite:     "H-88; the seam already calls it (seam/wrappers/combat.py); `step:`/`declares:` v10 REM-31, design `proposals/2026-10-07-grid-mode-suspension.md` §1 (PROPOSED, held back)"
      "a field":
        module:   "mass_battle"
        person_inputs: "own"
        provider: "mass_battle"
        module_entry: "mass_battle.resolve_field"   # `31c`, as `the body`'s and `a standing`'s: the composition role `seam/wrappers/mass_battle.py` calls through `MODULE_ENTRIES`
        step:     "ENCOUNTER"
        declares: "Declared"
        cite: >-
          M3 of the driver-retirement plan (ED-IN-0279): the row had a `module:` and no `provider:`
          because sides needed `faction_q.resolve` (`04 §C.5.1`), which M2 built. `provider:` now
          names `seam/wrappers/mass_battle.py`, which resolves the `subject` side by proposition id,
          builds the record and calls `modules.mass_battle.massbattle:resolve_field` (`31c`) through the
          `mass_battle.resolve_field` composition role.
          ⚠ `step:`/`declares:` ARE M4'S OWN FIELDS (ED-IN-0279 clause (a), 2026-09-28), read by
          `manifest.resolve()` and validated at `check_rows()`. `step: ENCOUNTER` says this prize
          is NOT fought where its verb is admitted: `march` (`verb_table.yaml`) declares
          `contests: "a field"` and is admitted and DECLARED at RESOLVE, folding at the band
          `declares:` names -- `Declared`, a member of `field_degree_bands` that no subsystem
          reports -- and is actually fought at the new ENCOUNTER step, on the world the whole
          round's fold left. A prize row with no `step:` (`a standing`, `a proposition`) fights at
          RESOLVE as it always has; `step:`'s absence is the default, not a second code path.
          `the body` carries the same pair since v10 REM-31.
      "a standing":
        module:   "social_contest"
        person_inputs: "pool"
        provider: "social_contest"   # repointed from the interim `sigma_leverage`, ED-SC-0033 clause (2) -- a ROW change. `seam/wrappers/sigma.py` registers this string; refusal (c) refuses construction if nothing does
        module_entry: "social_contest.roll"   # `31a`: the composition role the provider calls through `MODULE_ENTRIES`; refused at construction (`manifest/registry.py::check_contest_prizes`) unless a composition row declares it, as a `verb_call` into this row's `module:`, bound to a verb whose prize names it. A-25: the prize row and the composition row are the two owners of which module is called.
        # The entry is the σ-leverage roll: SC-05's measurement kept it over the kernel (`modules/social_contest/roll.py`'s docstring), and it returns a `Margin` the provider holds it to.
        cite: >-
          JORDAN, 2026-09-09, VERBATIM: "we have the sigma leverage d10 resolver in engine to use." A third option neither
          of ED-SC-0037's two costed, and the row is `status: ruled`. ⚠ ED-SC-0033 (2026-09-06) rules that (2) the two
          contest prizes mapping to `social_contest` REPOINT TO THE PROCEEDINGS PROVIDER -- "this provider" there means THE
          PROCEEDINGS SUBSYSTEM'S, not this row -- and that (3) THE OBSTACLE HAS A SINGLE OWNER.
          ⚠⚠ CLAUSE (3) IS HONOURED SINCE v9 SC-01 STEP 14, AND NOT BY THIS ROW. `sigma_leverage` does NOT own the obstacle: `eff_ob` CONSUMES a `base_ob` and is
          "DISPLAY ONLY (not the resolution value)" by its own docstring, `effective_ob` is a pure
          arg-order alias of it, and the tree's live composition has the CALLER supply `base_ob`.
          The host input builder's own site (`seam/wrappers/sigma.py::_obstacle_of`, once the former row H-127) was deleted at step 14; the social contest
          module composes the obstacle (`modules/social_contest/roll.py::obstacle`, under `H-213`'s ceiling). So
          `interim: true` carried CLAUSE (2) ALONE, and steps 13 + 15 discharged it: the row names `social_contest` (`02 §D.4`).
      "a proposition":
        module:   "social_contest"
        person_inputs: "pool"
        provider: "social_contest"   # as `a standing`'s
        module_entry: "social_contest.roll"   # as `a standing`'s
        # `determine` contests it (`speak` -> `a matter`, `tell` -> `a standing`).
        cite:     "as `a standing`. Same ruling, clause (3) honoured by the module since step 14, same repoint."
      "a matter":
        module:   "social_contest"
        person_inputs: "pool"
        provider: "social_contest"   # as `a standing`'s
        module_entry: "social_contest.roll"   # as `a standing`'s
        heard_by: "bench"   # the bench at the act's rung hears this prize (`world_q.reception`, `world_q.proofs`; `manifest/registry.py::_check_heard_by`).
        cite:     "v9 SC-01 step 12 (B-N): `speak`'s prize (`proposals/2026-09-05-proceedings-subsystem/04_VERBS.md` §B.1, `08_SEAM.md`: `a matter` -> the proceedings provider). Routed to the interim provider at step 12; ED-SC-0033 clause (2)'s repoint (steps 13 + 15, ONE change) reached THIS row too, so it was three rows, not the two the plan names [ASSUMPTION; medium; revert: no row, and `speak` declares no `contests:`]."
      # B07.04 (`U5c_VERBS_residue` §2 edit 3): the two governance prizes, with the room each is heard in (`seam/wrappers/sigma.py::audience_of`'s table
      # keyed by room). No verb row names either yet: a row naming one lands with its verb (`a seat`: confer, revoke, succeed, establish; `a holding`: surrender).
      "a seat":
        module:   "social_contest"
        person_inputs: "pool"
        provider: "social_contest"   # as `a proposition`'s
        module_entry: "social_contest.roll"   # as `a proposition`'s
        heard_by: "seat_body"   # the members of the body the act's seat belongs to, else the seated persons at that seat's rung (`audience_of`).
        cite:     "U5c_VERBS_residue §2 edit 3 (B07.04): the audience is a cell of the prize row, read by one host function and by no verb's name."
      "a holding":
        module:   "social_contest"
        person_inputs: "pool"
        provider: "social_contest"   # as `a proposition`'s
        module_entry: "social_contest.roll"   # as `a proposition`'s
        heard_by: "residents"   # the persons residing at the act's place (`audience_of`).
        toward: "to"   # the residents' stance toward whoever would hold the place: the room is asked about the receiver, not the actor (`sigma.py::_read_social_roll`).
        cite:     "U5c_VERBS_residue §2 edits 3 and 4 (B07.04)."
    # NO `values:` — the members ARE the `prizes:` mapping above, read with `roster_map()`. A `values: []` would be a declared-but-unread key (`04 §B.13` ID-12) and `roster()` would return an EMPTY frozenset, which is the silent-false this file's own header forbids.

  # titles: DELETED -- its domains live in `engine/season/offices.yaml: titles:`
  # (`data/rosters.py::TITLE_DOMAINS` reads `offices.yaml`); nothing here reads such a key.

  conditional_emission_rows:
    source: "`W4`. Part D's `emits:` column does not distinguish a kind emitted ON EVERY WRITE from one emitted only WHEN A CONDITION HOLDS, and the two are different things."
    note: >-
      ⚠ THIS ROSTER EXISTS BECAUSE PART D'S COLUMN IS AMBIGUOUS, AND THE AMBIGUITY IS REGISTERED AS
      `H-86` RATHER THAN DECIDED HERE. `W4` makes a MATTER write on a row that declares an `emits:`
      kind name one -- that is `D22`, and `H-12` is RULED that way. But `(Record, ttl)` declares
      only `record.expired`, and the row is DECREMENTED EVERY SEASON: emitting `record.expired` on
      every decrement would publish an expiry that has not happened, which is worse than the silent
      write the gate exists to stop. `(Site, condition)` shows the other shape -- `condition.worn`
      per write PLUS `condition.band_crossed` on a condition -- so the column carries both kinds of
      kind with nothing to tell them apart. Listing the rows whose declared emissions are ALL
      conditional is the smallest thing that is true; deciding the column's schema is a Part D
      change and belongs to whoever ratifies `H-86`.
    why:
      "Record.ttl": "`record.expired` fires at zero; every other decrement of §13's licensed clock is a tick with no declared kind, and emitting the terminal one would assert an expiry that has not happened"
    cite: "H-86"
    values: ["Record.ttl"]

  knowledge_kinds:
    source: "`H-85`; NPC-087's own `season_requires` supplies the two values"
    open: true
    note: >-
      ⚠ THE GATE IS NOT HERE AND THAT IS THE POINT. #353 §9.2 says *"The only class-shaped gate in
      the design is Thread Sensitivity"* and supplies no carrier, no predicate and no taxonomy for
      it to gate OVER. This roster is the taxonomy half — the half `rosters.yaml` is the ruled
      home for. The VERB gate is built since v9 PC-06 K-3 (`thread_read`'s typed cell over
      `Person.thread_sensitivity`, `H-85`/`H-239`); a gate over these KINDS is not: no code reads
      this roster, so `thread_substrate` gates nothing yet (`H-85`).
      The two values are NPC-087's own: material "retainable by ordinary non-sensitive minds"
      against "Thread-substrate knowledge subject to the setting's epistemological barrier". A
      third kind, or a per-subject scheme, is `H-85`'s sweep, not an edit anyone should make here
      without moving the row.
    values: [mundane, thread_substrate]

# ===========================================================================
# TABLES — a MAPPING, where a roster is a SET. `table()` reads these; `roster()` raises on them
# and vice versa, so the two shapes cannot be confused at a call site.
# ===========================================================================

  site_kinds:
    source: "#353 §12 — `Site.kind`. `W8`."
    row: H-07
    note: >-
      ⚠ THE SET IS EXTENSIBLE AND THE LOOKUP STILL REFUSES, and those are different properties.
      Adding a kind means adding a row here; asking about a kind that has no row RAISES, because
      §42.2.1's worked example is exactly this table: *"a wear table that returns 20 for an
      unregistered site kind does not fail — it answers, plausibly and wrongly, forever."*
      ⚠ `harbour`, `seam` AND `body` ARE THE INSTRUMENT'S, NOT #353's, so `H-07` is `assumption`,
      not transcription.
      ⚠⚠ `body` IS NOT A SITE. It is `(Person, body)`'s band row, here because `band_floors` keys on
      THIS roster and `H-38` ruled *"`Site.condition` is the model"* — no second scheme. See `p32`.
      ⚠ `dwelling` IS JORDAN'S, 2026-09-25 (`ED-SE-0055`): `ED-SE-0051`'s `capacity(w, rung)` counts
      *"the rung's dwelling Sites"*, and he chose to make that phrase literal rather than re-read it
      as the hearth rungs. `harness/populated.build_realm` mints one per `hearth` rung. A site kind
      needs a `wear_per_season` and a `band_floors` row (`data/fixtures.py`'s `_load_matter_tables`
      refuses one without); `dwelling` has no `site_yield` row, because a dwelling produces nothing and
      that table's `default_cell` is 0.
      ⚠ `garrison` IS JORDAN'S, 2026-09-28 (`ED-IN-0279` clause (a), M4): asked how a settlement's
      fortification should be modelled, given he wants it build-able and upgradeable, he chose *"a
      Site's condition"* over a cohort-Person alternative -- `H-38`'s *"`Site.condition` is the
      model"* ruling applied to fortification rather than a second scheme invented for it. It needs
      the same two rows `dwelling` does, and has no `site_yield` row for `dwelling`'s reason: a wall
      produces nothing. The `restore` verb (`writes: Site.condition`) raises any fabric its actor
      stands at toward the ceiling a works allows (the full scale where none names it).
    # ED-IN-0306 (Jordan, 2026-10-28: recruiting needs "specific infrastructure for specific kinds of troops"): FOUR TRAINING
    # KINDS, `barracks`, `archery_range`, `stable`, `siege_workshop`. Each is a Site whose CONDITION is how much of its
    # troop class the place can train (`modules/mass_battle/troop_types/recruitment.py`, the one reader and the owner of
    # which troop type trains where). They take `garrison`'s treatment in every table below and for its reason: nothing
    # wears them down (`wear_per_season` 0), they have no floor and no band (`capacity_floor` 0, `band_floors` {}), and
    # `works_cost` prices them like any fabric so `found`/`build` can raise one. [ASSUMPTION; medium; Jordan to correct.]
    values: [harbour, seam, body, dwelling, garrison, barracks, archery_range, stable, siege_workshop]

  matter_kinds:
    source: "#353 §10.4 VERBATIM: *It is a type parameter, not an enumeration. Grain, salt, timber, ore and coin are rows in a registry, not members of a closed set in a source file.*"
    row: H-11
    note: >-
      ⚠ OPEN MEANS ADDABLE, NOT UNCHECKED — and this file is the registry §10.4 asks for. #353
      forbids *a closed set in a source file*; it does not license a lookup that answers for a
      kind nobody registered. Both halves hold here: add a kind by adding a row, and a draw
      against an unregistered kind raises.
      ⚠ THE FIVE ARE #353's OWN EXAMPLES and nothing more. It names them as illustrations of what
      a row looks like, so starting the registry with exactly them is the least-invented content
      available — but it is still a choice, which is what `H-11` grades.
    values: [grain, salt, timber, ore, coin]

  arms_kinds:
    source: "v11 CP-T03-03 (`-08` AM-C-04; T03 home §2): arms are `matter_kinds` members, so a person's kit is what the rungs he holds store."
    note: >-
      `kinds:` maps an ARMS KIND to the one Combatant field it fills and the key it sets there:
      `{<kind>: {field: weapon|armor, key: <a weapons.py WEAPONS key | an armour tier>, rank: <int>}}`. Each kind
      must be a `matter_kinds` member, `field` one of the fields `engine/substrate/combat_kit.py::FIELDS` names, `key`
      a member of THAT FIELD'S closed set in the same module (the typed `kit` section of
      `engine/engine_params/combat_engine_v1.json`, `tools/export_engine_params.py --check`) and `rank` a whole
      number, unique among the kinds of one field; refused whole at import otherwise
      (`data/rosters.py::_check_arms_kinds`). The key sets are never copied here.
      `queries/world_q.py::kit_of` is the one reader: per field, the highest-ranked kind with a positive count in the
      stores of the rungs the person holds, else of his residence, else the Combatant's own default.
      ⚠ EMPTY ON PURPOSE: which arms exist, which key each sets and how they rank is Jordan's content and is not
      invented here (`-08` AM-C-04). While `kinds:` is empty `kit_of` returns the Combatant default for everyone and
      every fight is dealt exactly as before the mechanism existed.
    kinds: {}

  arms_at_build:
    source: "v11 CP-T03-03 (`-08` AM-C-04): the arms a rung is built holding, by the rung's kind [ASSUMPTION; medium; Jordan to correct]."
    note: >-
      `kinds:` maps a RUNG KIND to the stores that kind of rung is seeded with when a realm is built:
      `{<rung kind>: {<arms kind>: <positive whole number>}}`. Every key must be a `rung_kinds` member, every inner key
      an `arms_kinds` member (so a seed can only name an arm that has a kind), every amount a positive whole number;
      refused whole at import otherwise (`data/rosters.py::_check_arms_at_build`). `harness/populated.py::build_realm`
      is the one seeder (`seed_arms`). ⚠ EMPTY ON PURPOSE, as `arms_kinds` is: the inventory is Jordan's content, so
      no rung is built holding arms and `build_realm`'s world is unchanged.
    kinds: {}

  wear_per_season:
    source: "#353 §22 assigns `wear per site kind` to params; no in-chain table exists. `H-07`."
    row: H-07
    note: >-
      ⚠ `W8`: per-kind wear and floors are registry rows rather than `DEFAULT_FIXTURES` literals.
      `DEFAULT_FIXTURES` READS this mapping, so the declaration lives once.
      ⚠ `dwelling: 0` IS THE CONTROL ARM, SHIPPED DELIBERATELY, and it is `H-07`'s own
      *"no wear at all"* sweep point applied to one kind. ⚠ **NOT THE SAME SHAPE AS `body_step = 0`**:
      that arm `continue`s past the write itself (`loop/matter.py`), so nothing is emitted at its
      control arm. `wear_per_season` skips the same way since `H-135` (B09.21): MATTER does not
      write a Site whose wear is 0, so `dwelling: 0` emits nothing (see below). A dwelling sits AT a
      hearth and persons live in hearths. A non-zero rate
      together with any floor in `band_floors.dwelling` would let a dwelling's condition cross it;
      the crossing Event is witnessed `co_located`, and the claim it deposits (subject = the
      dwelling) would then reach every co-located resident as a live `claim_landed` question, once
      `reach`/`place_of` (`queries/world_q.py`) admit a claim about a place through a person's own
      ledger. That would put a dwelling-condition Question in front of every resident every season,
      which is exactly what
      `test_24d_i_the_control_arm_crosses_no_band_and_moves_no_question_in_one_season`'s
      control-arm identity pins against. Either half at its control arm blocks the crossing; both
      ship there. At 0 no dwelling's condition moves.
      ⚠ ZERO IS SILENT SINCE `H-135` (B09.21). `loop/matter.py`'s wear loop writes a Site only
      where its wear this season is non-zero, and `World.write` emits one `condition.worn` per
      write (`H-12`), so a dwelling emits no wear Event and its residents witness no claim of it.
      A non-zero rate is chosen with a consumer in front of it, at `24e`/`24f`, never here.
      ⚠ `garrison: 0` IS `dwelling`'s CONTROL ARM FOR THE SAME REASON (M4, `ED-IN-0279` clause (a)):
      a non-zero rate would erode every garrison's condition every season, silently drifting every
      field battle's fortification term toward zero over a long campaign. The rate is a pacing
      decision (where every fabric sits at rest), registered rather than taken -- `H-165` and
      `H-07` (the rate). `restore` executes on the populated realm's SETTLEMENT fabrics (harbour,
      seam -- rate 10, a cohort stands beside them), so `H-165`'s limit is the DWELLING/GARRISON
      rate specifically, both `0`.
    rates:
      harbour:  10
      seam:     10
      body:     10
      dwelling: 0
      garrison: 0
      barracks:       0
      archery_range:  0
      stable:         0
      siege_workshop: 0

  capacity_floor:
    source: "`RULINGS.yaml` RR-2 (`ED-SE-0051`, ruled 2026-09-17): *\"a `capacity(w, rung)` QUERY over the rung's dwelling Sites, with a FLOOR — never a fixture table\"*; `01_THE_BUILD_ORDER.md` S10: *\"the floor is a table keyed on site kind, beside `band_floors`\"*. Plan position `24d-ii`, landed with its caller at `19c`."
    row: H-167
    sweep: [declared, zero, doubled]
    note: >-
      ⚠ ITS CELLS HOLD THE FLOOR AND NOTHING ELSE (plan `24d-ii`). A cell is a
      LOWER BOUND on `queries/world_q.py::capacity`'s derived quantity -- `max(floor, the dwelling
      Sites at the rung and below)` -- never what one dwelling houses: a per-kind *houses N* cell is
      capacity AUTHORED per kind, the `hearth_capacity` fixture RR-2 refused, a second home for a
      fact the Sites carry. What is derived is the count of Sites itself.
      ⚠ WHY 1 FOR `dwelling`: RR-2's own reasoning -- the floor keeps a population from being
      throttled to zero by a rung with no dwelling at all, *"the same shape as `W5`'s own
      floor-of-1 choice for budget"*. The number is that precedent's, not a ruling's, so `H-167`
      grades it and sweeps it: `zero` is RR-2's refused reading and the CONTROL (a rung with no
      dwelling houses nobody), `doubled` the other side.
      ⚠ THE OTHER FOUR CELLS ARE 0 AND `capacity` READS NONE OF THEM TODAY: it counts `dwelling`
      Sites (`world_q.DWELLING_KIND`, Jordan's `ED-SE-0055`: *"capacity queries descendant Sites
      of that kind"*). They are here because the table is keyed on the whole `site_kinds` roster
      and `data/fixtures.py` checks it in both directions, as it checks `wear_per_season` and
      `band_floors` -- so a missing `dwelling` row REFUSES at load instead of silently flooring
      every rung at nothing. A second housing kind is a roster row, a cell here, and `capacity`'s
      count widened with it.
    floors:
      harbour:  0
      seam:     0
      body:     0
      dwelling: 1
      garrison: 0
      barracks:       0
      archery_range:  0
      stable:         0
      siege_workshop: 0

  works_cost:
    source: "v9 IN-28 (`H-166` limit 1, its own design order: the cost first). r2 `proposals/2026-09-17-governance-and-holdings-r2/04_MATTER_AND_WORKS.md` §A.6.6 (intent): *\"the cost is paid by `transfer` into the works' rung\"*, and nothing debited that rung when the place rose. `proposals/2026-09-10-settlements-factions-populations/04_EVALUATION.md` §6 (intent): `found` costs *\"the stake\"*, `build` costs *\"timber\"*."
    row: H-166
    sweep: [declared, halved, doubled]
    note: >-
      WHAT A WORKS' PLAN COSTS: `{plan kind: {matter kind: amount}}`, paid out of the WORKS' RUNG
      (`Record.rung`, where the works is kept and where `transfer` delivers to it) when the place
      rises. `loop/effects_founding.py` is the one reader. `found` moves its stake TWO-SIDED into the
      Rung it founds, so the grain stays in the world and provisions the new hearth (`_shift`, the one
      body of a conserved store move). `build` CONSUMES its cost into the fabric, one-sided, a lawful
      sink. 04_EVALUATION §6 S passes the pair in exactly that shape: *"`build` debits one side as a
      lawful consumption sink; `found` is two-sided"*.
      ⚠ A PLAN KIND WITH NO ROW HAS NO PRICE, SO NOBODY CAN PAY FOR IT, AND `found`/`build` REFUSE IT.
      That is a refusal that emits, never a free place: a missing row is not a cost of zero. The
      loader checks one way only -- every key a `rung_kinds` or `site_kinds` member, every cell
      non-empty, every matter kind a `matter_kinds` member, every amount a positive int
      (`data/fixtures.py::_load_works_cost`). It is NOT keyed on `site_kinds` in both directions as
      `wear_per_season` is, because three groups of members get no row by design:
        * `body` IS NOT A SITE (`site_kinds`' own note). A works planning one is refused here, by the
          roster, rather than by a kind literal in `_eff_build` (`H-166` limit 4, narrowed: `body`
          stays in `site_kinds` for `band_floors`).
        * `person` is CENSUS's to mint (F.30), never a works'.
        * `settlement` and above are unpriced: founding a settlement collides with SE-9(a)'s held
          question (*"never adding nodes"* to the fixed settlement registry), and 02_PROPOSALS P4
          restricts founding to `hearth` and `community` for that reason.
      [ASSUMPTION; medium; Jordan to correct; revert: delete this roster and its reader, and
      `found`/`build` cost nothing again (`H-166` limit 1 reopens)]. THE KINDS are 04_EVALUATION's
      (grain for the stake, timber for a fabric). THE AMOUNT IS INVENTED and it is ONE number, 10,
      for every row: `site_yield.seam.timber` is 10, so a fabric costs one season of a full seam's
      timber, and the stake reuses the same magnitude so the two verbs share one scale rather than
      two. `H-166` sweeps it; `halved` and `doubled` scale every cell.
    costs:
      hearth:    {grain: 10}
      community: {grain: 10}
      harbour:   {timber: 10}
      seam:      {timber: 10}
      dwelling:  {timber: 10}
      garrison:  {timber: 10}
      barracks:       {timber: 10}
      archery_range:  {timber: 10}
      stable:         {timber: 10}
      siege_workshop: {timber: 10}

  subsistence_weight:
    source: "`H-11` — *the subsistence formula over an OPEN MatterKind registry*. ARCHITECTURE_V2.md's default: *draw from the containing rung's stores, scaled by weight*."
    row: H-11
    note: >-
      ⚠ THE WEIGHTS ARE INVENTED AND THE ROW IS WHAT MAKES THAT LAWFUL. #353 states the SHAPE — a
      draw from the containing rung's stores, scaled per kind — and supplies no numbers, so this
      is an injected default with a `site:` and a sweep, exactly as `wear_per_season` beside it.
      ⚠ A KIND WITH NO WEIGHT IS NOT A KIND WITH WEIGHT ZERO. A missing row RAISES rather than
      drawing nothing, for `wear`'s reason: a silent zero is a person who eats nothing and never
      starves, which is a plausible wrong answer that no test would ever surface.
      ⚠ ONLY `grain` AND `salt` CARRY A WEIGHT, and that is deliberate rather than an omission:
      timber, ore and coin are stored and not eaten. They are registered in `matter_kinds` and
      absent here, so a draw against them raises — which is the refusal above doing its job on
      the very first kind somebody adds to a larder by mistake.
    weights:
      grain: 2
      salt:  1
  hunger_bands:
    source: "REM-50, as repaired by AM-A-04 (`workplans/valoria_master_workplan_v10_part13.md`, REM-50): a settlement's hunger, read by `world_q.hunger`"
    open: false
    ordered: true
    note: >-
      The bands of a settlement's hunger, MOST SEVERE FIRST. The first, `starving`, is `unmet > 0` (the
      next draw leaves a mouth unfed) and the last, `fed`, is "under no floor"; neither is a floor. The
      members between them are the FLOOR bands, in the order `Fixtures.hunger_band_floors` lists their
      floors (`world_q.HUNGER_FLOOR_BANDS`). A roster of fewer than two members cannot name `starving`
      and `fed` and raises at import (`world_q`'s unpack).
    values: [starving, hungry, lean, fed]
  factions:
    source: "`systems/world/reference/geography_v30.md` (`## Status: CANONICAL`) starting-control table; `systems/world/reference/worldbuilding_v30.md` §3, §4, §5, §8, §10."
    row: H-99
    note: >-
      ⚠ SOURCED FROM `systems/world/` BECAUSE JORDAN RULED THE PRECEDENCE. Jordan,
      2026-09-02: *"systems/factions, systems/settlements are for inspiration/reference only.
      systems/world contains information to use regarding factions ... but for the
      identity/names/organizations it is canon"*, then: *"systems/factions if it concerns directly
      the identity of a faction can be concerned near-canon but superseded by anything in world."*
      A faction's NAME is identity, so this roster is world's to give. See the file header for the
      three-tier order.
      ⚠ `Ministry of the Peninsula` IS EXCLUDED BY THE NEAR-CANON SOURCE'S OWN WORDS. It appears ZERO
      times in all of `systems/world/`, and `faction_canon_v30.md:374` says of it: *"Treated as
      institutional infrastructure, NOT a faction."* An office may still BELONG to a ministry — that
      is `office_bodies`' `Ministries` row, which is what a ministry actually is here.
      ⚠ TWO NAMES IN CIRCULATION ARE SUPERSEDED AND ARE NOT MEMBERS. `People's Revolution`
      (`southernmost_v30.md` §6.2, one occurrence) is the old name for `Restoration Movement` —
      `geography_v30.md`'s ED-061 is *"'Revolution' -> 'Restoration Movement' naming
      standardisation across all docs"*, i.e. the rename is ordered and unpropagated, not a second
      faction. `Niflhel` is DISSOLVED: `worldbuilding_v30.md` §3.2 renames the
      mechanic *"Olafsson-Broker Exposure (formerly Olafsson-Niflhel)"* and §10 says
      *"post-Niflhel-dissolution"*.
      ⚠ `Schoenland` IS A MEMBER AND IS FOREIGN. Canon gives it T16 and Altonian naval passage
      (`geography_v30.md`). ⚠ THE TYPED LAYER CARRIES NO T16 ROW AND THAT IS DELIBERATE, NOT A GAP
      TO FILL: `references/world_initial_state.yaml:44` (retired) — *"There is no T16 — the gap is
      in the source data"* — and `harness/populated.py:331`. No `role_template`; recorded, not filled.
      ⚠ REFERENCE, NOT MECHANISM (§0.05), AND A FACTION STILL NEVER ACTS. `ARCHITECTURE_V2.md:93`
      lists a faction acting among five refusals held under all 143 cases. This roster names what
      an OFFICE BELONGS TO; the actor is always the person holding the office.
    # NO `values:` -- the members ARE `names_index.yaml`'s `token_class: faction` rows, read
    from_names: faction   # via engine/substrate/names.py. Edit the naming index, not here.
    # CR-86 (ED-IN-0342): the seat whose live holder heads the faction (`queries/faction_q.py::head`). Keyed by the
    # canonical faction name (Valorsmark is the Crown's: "Crown" is its alias). A faction absent here has no head
    # seat authored (the Löwenritter, the Guilds, the Restoration Movement, Altonia, Schoenland) and `head` is None.
    # [ASSUMPTION; medium; Jordan to correct; revert: the Church's head a Holy See seat if one is authored]
    head_seat:
      "Valorsmark": off_king
      "Hafenmark": off_duchess_hafenmark
      "Varfell": off_duke_varfell
      "Church of Solmund": off_confessor

  role_templates:
    source: "`systems/factions/reference/faction_canon_v30.md` §4 'Role Templates and Expected Convictions', per PP-686 §3.3.1 over the PP-684 13-Conviction taxonomy."
    row: H-99
    note: >-
      ⚠ TIER 2 — NEAR-CANON, AND IT SURVIVES BECAUSE WORLD IS SILENT, NOT BECAUSE IT OUTRANKS
      ANYTHING. Jordan: *"systems/factions if it concerns directly the identity of a faction can be
      concerned near-canon but superseded by anything in world."* §4 binds each template to a
      weighted conviction vector and to a player-eligible faction — that is directly a faction's
      identity — and `systems/world/` has no competing role-template concept, so there is nothing
      to be superseded BY. The day world says otherwise, world wins and this roster changes.
      ⚠ TWO FACTIONS HAVE NO TEMPLATE, RECORDED AS AN ABSENCE BY NAME (the roster's size is not
      an invariant — RULED 2026-09-19; v9 IN-36 adds a THIRD, `Altonia`, which has a head and no template, below). §4's player-eligible
      column covers Crown, Church of Solmund, Hafenmark, Varfell, Löwenritter and Restoration
      Movement. `Guilds` and `Schoenland` are absent from it. `faction_role_template` leaves them
      out rather than assigning a plausible one — inventing `mercantile-procedural` for the Guilds
      is exactly the fabrication the source-precedence ruling exists to prevent, and it would read
      as canon a session later.
      ⚠ `intelligence-diplomatic` IS UNCLAIMED BY ANY FACTION AND STAYS IN THE ROSTER. §4's own
      note assigns Varfell to `military-order` on Jordan's 2026-04-19 decision that Vaynard
      expansion is *"purely military"*, leaving this template a candidate nothing holds. It is a
      member because a corpus case may name an intelligence office; it binds to no faction.
    values: [sovereign, ecclesiastical, mercantile-procedural, intelligence-diplomatic,
             reformist, military-order]
    by_faction:
      # ⚠ A ROLE TEMPLATE IS A PROPERTY OF THE FACTION, NOT OF THE OFFICE, so it is a mapping keyed
      # on `factions` rather than a field on the office block. §4's table is a function of the
      # faction: every Crown office is `sovereign`, whoever holds it. Carrying it per-office would
      # store the same derivable fact 47 times and let two offices of one faction disagree.
      # ⚠ TWO NAMED GAPS, AND BOTH ARE DELIBERATE. `Guilds` and `Schoenland` are not
      # in §4's player-eligible column and get no entry, so a lookup for them RAISES per §42.2's
      # polarity rule. Assigning the Guilds `mercantile-procedural` because it sounds right is the
      # fabrication the precedence ruling exists to stop, and it would read as canon a session on.
      # ⚠ `Varfell` AND `Löwenritter` SHARE `military-order`, WHICH IS CANON AND NOT A COLLISION.
      # §4: *"Both Varfell and Löwenritter use military-order template; their differentiation comes
      # from Mission, leader Convictions, and stat profile, not role template."*
      "Valorsmark": sovereign
      "Church of Solmund": ecclesiastical
      "Hafenmark": mercantile-procedural
      "Varfell": military-order
      "Löwenritter": military-order
      "Restoration Movement": reformist

  faction_leaders:
    source: >-
      systems/factions/reference/faction_state_authoring_v30.md — each faction block's own `leader:`
      field (crown :44 `almud`, church_of_solmund :92 `cardinal_himlensendt`, hafenmark :144
      `baralta`, varfell :193 `vaynard`, restoration_movement :248 `yrsa_vossen`, lowenritter :302
      `ehrenwall`). TIER 2, and it survives because `systems/world/` names no competing leader.
    row: H-99
    note: >-
      ⚠ **WHY A FACTION NEEDS A PERSON AT ALL: Q4's REFERENT.** ⭐ Jordan ruled 2026-09-13 that a
      faction's creed is an `OUGHT`. `world_q.questions_for`'s Q4 raises a standing question from
      every live `commit` to an OUGHT and emits `(prop.subject,)` as the referent — and a faction
      NAME is not a person and not even a rung, so a creed subject-ed on the faction would put a
      non-entity into every member's deliberation (`ED-IN-0210` Ruling 1: *"verbs invoke mechanisms
      or interactions between a character and another entity/character. they are not fiats."*).
      So the creed is subject-ed on the faction's LEADER, who is a person an act can name.
      ⚠ **EACH AUTHORED SLUG RESOLVES TO EXACTLY ONE OF THE 46 REGISTRY ROWS**, by surname match:
      `cardinal_himlensendt` is Arne Himlensendt (NPC-021) and `ehrenwall` is Lisbeth Ehrenwall
      (NPC-070) — neither spelling appears in the roster the way the faction file writes it, which
      is why this is a transcribed mapping and not a runtime string match.
      ⚠ **SIX OF EIGHT, AND THE SAME TWO ARE MISSING AS EVERYWHERE ELSE.** `Guilds` and
      `Schoenland` have no authored leader — and no `role_template`, and no expected-conviction
      vector. That is consistent rather than coincidental: a faction canon gives no head and no
      expectations has no creed to commit to, and this file does not invent one for it.
    by_faction:
      "Valorsmark": "NPC-020"                    # Almud Almqvist
      "Church of Solmund": "NPC-021"        # Arne Himlensendt
      "Hafenmark": "NPC-050"                # Inge Baralta
      "Varfell": "NPC-052"                  # Magnus Vaynard
      "Restoration Movement": "NPC-003"     # Yrsa Vossen
      "Löwenritter": "NPC-070"              # Lisbeth Ehrenwall
      # v9 IN-36 (#457 D4, RS-21 item 4). [ASSUMPTION; medium; Jordan to correct] The empire's head is the
      # Katepano (frontier governor), the one registry row whose own arc sentence was *"Decides whether
      # Altonia probes, presses, or invades"* (now a comment on his case entry, `cases/NPC5.yaml`). No `role_templates` entry accompanies it: canon gives the
      # empire none, so the head has a person to be a referent and a goal (`goals.yaml`) but no creed
      # template to be loyal to. Revert: the Doux (NPC-011) or the Kommerkiarios (NPC-090) as head.
      "Altonia": "NPC-089"                  # Zoe Palaiologina

  foreign_cast:
    source: >-
      v9 IN-36 (#457 D4, answered RS-21 item 4 [medium; Jordan to correct]: one foreign faction, two
      seats, in `references/npc_registry.yaml`), read by `harness/populated.py::build_realm(foreign=)`
      through `data/rosters.py::FOREIGN_CAST`.
    row: IN-36
    note: >-
      WHAT THIS IS. The factions whose persons and places `build_realm(foreign=True)` seats and
      `foreign=False` (the control arm; the shipped default is `True` since ED-IN-0310) leaves out of the world: a faction named here has no
      Proposition, no member, no seat, no goal and no rung in the control arm, so that arm is byte-identical
      to the realm before the empire existed. A foreign faction is still a `factions` member in BOTH arms
      (`names_index.yaml: token_class: faction` is its owner), which is what puts it in
      `data/rosters.py::FACTION_BY_PROP` and lets `cast.faction_of` resolve its cast rows with no edit.
      ⚠ `Schoenland` IS NOT HERE AND IS FOREIGN ALL THE SAME: its persons and its T16 root are already in
      the realm as built (`build_realm` keeps T16 out of the realm by giving it no parent), so a switch on
      it would move a world that does not need to move. This block is the factions whose WHOLE existence is
      new, and it is not a roster of every foreign faction.
      WHAT A ROW SAYS. `territory` is the foreign ROOT RUNG, a `territory` with no `contain` edge into
      `r_valoria` -- never a `realm`, so `endings_reached`'s victory selector (every territory under a
      `realm` rung) and `populated.census`'s `uncontrolled_in_realm` do not count it; the BORDER is that
      absence. `settlement` is the one place its persons live, under the root. Crossing the border is a
      `march`'s arrival leg (`loop/effects_migration.py::_relocate`), so nothing here is a path.
      ⚠ NOT BUILT, AND NOT THIS ROW'S: a scheduled arrival (#457 `:145-155`), perception channels at the
      border, the Schoenland trade demand (FA-01, which needs IN-33's `exchange`).
      [ASSUMPTION; medium; Jordan to correct] The codes are the author's, and a place has a code and no
      name because a `Rung` carries no name (`state/carriers.py`): canon names Altonia's chokepoint only as
      T3's `Lowenskyst Fortress` (`venues.yaml`), not a homeland place. `ALT` is the empire's frontier
      territory and `ALT-1` its staging post, the settlement the Katepano and the Kommerkiarios seat at.
      Revert: Jordan names the homeland places.
    by_faction:
      "Altonia":
        territory:  {code: "ALT"}
        settlement: {code: "ALT-1"}

  office_bodies:
    source: "`systems/world/reference/worldbuilding_v30.md` §6.1 (Court Parliament and Governance), §3.1 (Church Four-Cardinal structure), §4.1 (Löwenritter internal structure), §5.1 (Guild structure)."
    row: H-99
    note: >-
      ⚠ THIS IS THE *TYPE OF OFFICE* AXIS JORDAN ASKED FOR, AND IT IS CANON'S OWN ORGANIZATION
      NAMES RATHER THAN A TAXONOMY FOLDED OUT OF THEM. Jordan, 2026-09-02: *"does the office schema
      include faction belonging, scale of office, type of office, etc?"* World gives four tables of
      bodies with a Function column each; collapsing those functions into a tidy set
      (`judicial, military, economic, knowledge, administrative, ...`) is NOT TAKEN. World
      is canon for ORGANIZATIONS; an invented functional taxonomy sitting where canon named bodies
      would read as canon to the next session, which is the defect the precedence ruling names.
      ⚠ `faction` AND `function` ARE PROPERTIES OF THE BODY, SO AN OFFICE AUTHORS ONE FIELD AND
      DERIVES TWO. `office.body` is the authored value; the faction it belongs to and what it does
      are looked up here. Where a case's office has no canonical body — the Restoration Movement's
      authority is *"informal"* (§8) and it has no organ in world — `office.faction` is authored
      directly and `body` is absent. That is a real gap in canon, carried as one.
      ⚠ THE `function` STRINGS ARE QUOTED, NOT PARAPHRASED. Each is world's own Function/Portfolio
      cell, so a reader can diff this against the source table without interpretation in between.
      ⚠ `Lions' Helm` CARRIES ITS OWN CANON WARNING. §4.1's cell is literally *"Naval affairs [NO
      MECHANICS — ED-NEW-10: future naval design question]"*. It is a member because it is a real
      arm of a real faction; an office seated in it has no mechanical support and canon says so.
      ⚠ SCALE IS NOT HERE. An office's scale is the rung it is seated at (`rung_kinds`), which the
      case's `scale.is` already carries. A body does not fix a rung: `Praefectures` administer
      regions and `Ministries` serve the realm, but the SEAT is where the person sits.
    # ⚠ MEMBERSHIP LIVES IN `faction:`, NOT IN A `values:` LIST — the `titles` precedent (§8),
    # which also carries its membership in its mapping. A body with no faction is not a body.
    faction:
      # --- Crown / realm government · worldbuilding_v30.md §6.1 ---
      "Imperial Court": "Valorsmark"
      "Court Parliament": "Valorsmark"
      "Ministries": "Valorsmark"
      "Rectorates": "Valorsmark"
      "Praefectures": "Valorsmark"
      # --- Church of Solmund · worldbuilding_v30.md §3.1 ---
      "Holy See": "Church of Solmund"
      "Cardinal of Fortitude": "Church of Solmund"
      "Cardinal of Justice": "Church of Solmund"
      "Cardinal of Prudence": "Church of Solmund"
      "Cardinal of Temperance": "Church of Solmund"
      # --- Löwenritter · worldbuilding_v30.md §4.1 ---
      "Lions' Table": "Löwenritter"
      "Lions' Helm": "Löwenritter"
      "Knights of the Peace": "Löwenritter"
      "Royal Investigators": "Löwenritter"
      "Riskbreakers": "Löwenritter"
      # --- Guilds · worldbuilding_v30.md §5.1, §5.3 ---
      "Guild": "Guilds"
      # --- LEADERSHIP bodies · npc_behavior_v30.md §2.15-§2.17 (TIER 2a, the superseding doc) ---
      # ⚠ THESE THREE ARE A DIFFERENT KIND OF ORGAN FROM THE SIXTEEN ABOVE, AND THE DIFFERENCE IS
      # STATED RATHER THAN BLURRED. World names ADMINISTRATIVE organs — a ministry executes, a
      # rectorate judges. These are the leader's INNER COUNCIL: who is in the room when the faction
      # decides. World does not name them, `npc_behavior_v30.md` does, and Jordan ruled it superior
      # to `faction_politics_v30.md` on 2026-09-13 — which matters here, because politics §1.2c/
      # §1.3c gives these councils four and five members where behaviour gives two and two.
      # ⚠ ONLY THREE ARE ADDED, AND THE RESTRAINT IS THIS FILE'S OWN PRECEDENT. `faction_politics_v30`
      # PART 7 names 22 more organs with quoted jurisdictions — seven Crown ministries (six and the proposed Hochschule), six Hafenmark
      # committees, four Church dicasteries, five Varfell councils. NOT ONE IS READ by anything that
      # builds a world: `build_realm` takes an office's body from the sub-organization
      # `references/npc_registry.yaml` packs into its `faction` cell, and these three are what it
      # contains. Adding the other 22 would repeat `governance_modes` and `power_bases`, deleted from
      # this file for exactly that — "not wrong; UNREAD", and §0.1 pt 5 forbids apparatus that is
      # load-bearing on nothing. They go in the day a seat needs one.
      # ⚠ THE MINISTRIES RULING, WRITTEN ONCE HERE AT ITS OWNER. Three ministry lists disagree, and
      # the source-precedence ruling at the head of this file (tier 1 `systems/world/`; tier 2
      # `systems/factions/`, "superseded by anything in world") settles which reading stands:
      #   * `worldbuilding_v30.md` (world, TIER 1) names the ORGAN, `Ministries` ("Execute
      #     government services"), and, in its Ministry Collapse card, the SERVICES: Law, Taxation,
      #     Guilds, Water/Granaries.
      #   * PP-194 names Law, Guilds, Logothetes,
      #     Granaries and Pure Water, which read onto those services; Logothetes is read as the
      #     fiscal ministry, i.e. Taxation. [ASSUMPTION; medium; Jordan to correct; revert: delete
      #     this inserted comment and restore the sentence above to its earlier wording]
      #   * `faction_politics_v30.md` §7.1 (TIER 2) lists its own set and is superseded where it
      #     disagrees with world: war and intelligence are Löwenritter organs in world, not Crown
      #     ministries.
      # RULING: ONE `Ministries` ROW STANDS until a seat needs a ministry; that ministry's row then

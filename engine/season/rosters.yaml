      v10 CR-33: the 34 lifepaths (the Stage 3 vocations of `character_histories_v30.md`, archived), by the
      ids that file prints, `3-CR1` ... `3-CF6`. THE CLOSED SET `tables: lifepath_templates` is keyed by,
      refused at import both ways (`data/rosters.py::_load_lifepaths`), and the set a cast row's

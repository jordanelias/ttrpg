      ⚠ A VERB WITH NO ROW HERE IS NOT AN ERROR. `seam/wrappers/sigma.py::_pool_of` falls through
      to `pool_default`, which is the `assumption` grade's own polarity: `absent` refuses, and this
      is not one. The table is therefore OPEN in the sense that matters -- adding a contested verb
      does not require adding a row before the seam will run it.
      ⚠ AND IT IS NEARLY INERT ON THE CORPUS TODAY, WHICH IS SAID HERE SO NOBODY READS THE ROWS AS

# THE ROSTERS — every closed set the loop reads, as DATA.
#
# ⚠ RULED BY JORDAN, 2026-09-02, and this file exists because of it. Verbatim, across four
# messages: *"please note that convictions roster and axes etc may be modified in future"* …
# *"that goes for all"* … *"these must be easy to modify"* … *"I do not want definitions etc to
# be hardcoded."*
#
# THE RULE, STATED SO A LATER SESSION CANNOT SOFTEN IT: a DEFINITION — a roster, a taxonomy, an
# axis set, a kind list, a closed set of any sort — is read at runtime from here. Changing one is
# a DATA EDIT, never a code change, and it touches no other system. A definition written as a
# literal in a Python body is a defect, whatever else is true of it.
#
# WHAT THIS IS NOT. It is not a place for MECHANISM — the step→write-class map is a relation the
# code owns, not a definition someone may edit. The test is: *would changing this change the GAME,
# or change how the code works?* A roster changes the game. `STEP_CLASS` changes the code.
#
# ⚠ THE "NO NUMBERS" CLAUSE, NARROWED BY `W5` — and narrowed rather than deleted, because the
# distinction it was reaching for is real. It read *"it is not a place for NUMBERS — those are
# `Fixtures`"*, which is right about a free-standing tuning scalar and WRONG about a weight that
# is part of a definition. `alignment` below is a verb × axis matrix: its cells are numbers, but
# the matrix IS the definition, it is keyed on a roster in this file, and it is precisely the
# thing Jordan named (*"convictions roster and axes etc"*). Pushing it into `Fixtures` would put
# it back in a Python literal, which is the outcome the ruling forbids.
#
#   > **The test, stated so it is idempotent:** a number that is a PROPERTY OF A ROSTER MEMBER
#   > travels with the roster and lives here. A number that stands free of any roster — `K = 12`,
#   > a budget base, a ledger cap — is a `Fixture`. `alignment[axis][verb]` has no meaning apart
#   > from `pursuit_axes` and the verb table; `view_k` has meaning on its own.
#
# TABLES ARE A SECOND TOP-LEVEL KEY, not a roster with a strange shape. A roster is a SET and
# `roster()` returns a frozenset; a table is a MAPPING and `table()` returns a dict. Reading one
# with the other's function raises, so the two shapes cannot be confused at the call site.
#
# HOW TO CHANGE ONE. Edit the list. Nothing else. `shape.py` reads this file at import; a name
# the code asks for that is not here RAISES rather than defaulting, which is §42.2's polarity
# rule applied to definitions — an absent roster is a refusal, never an empty set.
#
# SCOPE AND SHAPE — BOTH RULED BY JORDAN, 2026-09-02, when this file asked.
#   * "only this proposal chain is in scope" — so `keys.py`'s `ROLES`, `SCALES` and
#     `PERMANENCE_VALUES` are not governed by it. ⚠ `AXES` LEFT ANYWAY, ED-IN-0230 (2026-09-14).
#     The live engine is outside the chain (PR #337 -> now) and stays that way. A later session
#     reading the ruling as tree-wide would be widening it; it was asked and answered narrow.
#   * "one file rosters i think" — ONE FILE, not one per subsystem. If it grows past legibility
#     that is a reason to ask again, not a reason to split it unilaterally.
#
# SOURCE PRECEDENCE FOR CANON VOCABULARY — RULED BY JORDAN, 2026-09-02, ACROSS FOUR MESSAGES.
# Read this before adding or changing any roster whose members are WORLD content (faction names,
# organizations, offices, places, people). It does not govern rosters that are architecture
# (`rung_kinds`, `remit_acts`, `tenure_kinds`) — those come from #353 and this chain.
#
#   TIER 1 · `systems/world/`   — CANON.  Verbatim: *"systems/world contains information to use
#            regarding factions that should be considered more thoroughly for actions, but for the
#            identity/names/organizations it is canon."*
#   TIER 2 · `systems/factions/` — NEAR-CANON, AND ONLY CONDITIONALLY. Verbatim: *"systems/factions
#            if it concerns directly the identity of a faction can be concerned near-canon but
#            superseded by anything in world."* Two conditions, both required: it must concern
#            directly a faction's IDENTITY, and world must not say otherwise.
#   TIER 2a · `systems/npcs/reference/npc_behavior_v30.md` SUPERSEDES
#            `systems/factions/reference/faction_politics_v30.md`. ⭐ RULED by Jordan, 2026-09-13,
#            verbatim: *"NPC behaviour supersedes faction politics."* The two disagree about WHO SITS
#            IN A FACTION'S INNER CIRCLE (politics gives Hafenmark four and Varfell five; behaviour
#            gives two and two). `references/npc_registry.yaml` already matches behaviour on every
#            contested cell, so building from the registry IS building to this ruling. The one
#            apparent difference, Björn Holdar's conviction (behaviour `Continuity`, registry
#            `Warden`), is the ratified PP-685 §4 legacy migration (its Continuity -> Warden default:
#            NPC-001's note, references/npc_registry_history.md), not a conflict.
#   TIER 3 · `research/`        — REFERENCE. Verbatim: *"research/ contains useful information to
#            make everything more robust"*, and *"the research directory will also speak towards
#            the kind of governance and bureaucratic functions that may be relevant to game too."*
#            It informs DESIGN; it is not a source of canon names.
#   TIER 4 · `systems/settlements/reference/governance_play_redesign_v1.md` — IDEAS. Verbatim: *"governance
#            play redesign is just for ideas. do not treat as required."*
#
# ⚠ THE PRECEDENCE IS A RULE ABOUT SOURCING. `factions` takes its members from TIER 1 (world never
# names `Ministry of the Peninsula`, which tier 2 itself calls *"institutional infrastructure, not a
# faction"*). A roster nothing in the loop or the office schema consumes is not minted (`§0.1`
# point 5); the insight behind such a list is recorded at `H-100`.
#
# ⚠ SILENCE IN TIER 1 IS NOT SUPERSESSION. `role_templates` is tier 2 and survives because world
# has no competing concept — not because tier 2 won. The day world names one, world wins.
#
# ⚠ EVERY ROSTER HERE IS OPEN BY THE SAME RULING. None of them is closed by being written down.
# The `source:` field says where the current membership comes from; it is provenance, NOT
# ratification, and a roster with `open: true` must never be cited as settling a register row.

rosters:

  tenure_kinds:
    source: "#353 §15 `:537-544` — the seven Tenure kinds and their cardinalities; `reside` is plan position `19c`'s"
    open: true
    note: >-
      ⚠ `reside` (Person -> Rung, ONE live per person) IS THE EIGHTH, AND IT IS WHERE A PERSON LIVES AS
      DISTINCT FROM WHERE THEY ARE. `contain` is where they are (`04_CODE_ARCHITECTURE.md` §B: *"its
      contain edge is where they are"*) and `move` re-homes it; `reside` is opened only by `migrate`
      (and minted beside the first `contain` by every world builder), so a `move` leaves it behind. It
      is what `world_q.population` counts and `world_q.capacity` throttles (`RULINGS.yaml` RR-2). Like
      `contain`, it is NOT in `release`'s domain: its end is a relocation (`migrate` closes the old
      edge as it opens the new), and a released residence would leave a person living nowhere.
      ⚠ `detain` (prisoner -> a seat) AND `ban` (person -> the excluding seat) ARE THE NINTH AND
      TENTH (#453 §10.4 step 3, K-53; ratified as intent, ED-IN-0288). Each is a disposal a
      determination opens under an arrangement whose `disposes:` names it
      (`loop/effects_information.py::_eff_determine`). Neither is in `release`'s domain
      (`data/rosters.py::RESTRAINT_KINDS`): a prisoner who could release his own custody, or an
      outlaw his own ban, would walk out of the sentence, which is why they are kinds and not an
      `oblige` (#453 §8.3). Their readers: `move`/`migrate` decline a person holding a live `detain`,
      a mustered army excludes him (`loop/sides.py`), `oblige` refuses a `ban` holder service and
      `confer` declines to seat one. `revoke` opens a `ban` too, on the man whose `appointed` seat it
      strips (`state/gate.py::REVOCATION_DISPOSAL`), so `ban`'s derived openers are `determine` and
      `revoke`; a revocation's ban has no term. `arrest` opens a `detain` too (on the seat that
      ISSUED the warrant), so `detain`'s derived openers are `arrest` and `determine`; and `pardon`
      is the CLOSER of both (`domain: [detain, ban]`, the loader's closer clause), through the seat
      that is the edge's object, under the gate's `determination` basis.
    values: [hold, contain, commit, oblige, succeed, tie, knot, reside, detain, ban]
    # ⚠ LOADER INVARIANT 6's SECOND HALF (`04 §B.13 #6`, `04:466-467`, `ID-14`): every kind's OPENER
    # set is declared, and it is DERIVED, not written here: `data/verbs.py`'s
    # `_derive_openers_from_effects()` walks `effects.py`'s own source (an AST scan for `Tenure(...)`
    # calls inside each `@effect_for`-registered function), so one owner states which verb opens
    # which kind. `succeed`, `tie` and `knot` each declare `writes: Tenure.since` (verb_table.yaml)
    # and no effect constructs a Tenure of that kind -- `tenure_kinds_without_an_opener()` reports
    # them.

  hold_object_kinds:
    source: "`architecture/holonic_ARCHITECTURE.md` §15's Tenure table — *\"`hold` | Person → Office | Rung | Record | Proposition | 1 per object\"*. Item 16 of `proposals/2026-09-17-governance-and-behaviour/01_THE_BUILD_ORDER.md` (⊕ R13)."
    open: true
    note: >-
      ⚠ THE CLASSES A `hold` MAY POINT AT, AND THE ROSTER IS THE OWNER RATHER THAN A LITERAL IN
      `add_tenure`. `holonic §15` states the domain and the codomain of every Tenure kind; `add_tenure`
      validates the KIND against `tenure_kinds` and `contain`'s DIRECTION, and this roster checks a
      `hold`'s object. A `hold` whose subject is a faction (a Proposition, not a person) would make
      `in_holdings` (which reads *a `hold` whose object is a Rung*) false for every person over
      every rung.
      ⚠ **AN UNRESOLVABLE ID PASSES, AND THAT IS DELIBERATE RATHER THAN A HOLE.** `_rehome` exists
      because a Tenure may legitimately be added BEFORE its subject is in `w.persons`, so a guard
      that refused every unknown id would refuse the ordering the store is built to tolerate. The
      conjunct refuses only an id that resolves to a class NOT on this roster — a Site, or a
      person — which is what makes `Tenure(..., "fac_crown", "terr_T1", "hold")` raise while
      `Tenure(..., "p_late", "off_x", "hold")` still lands in `_unowned` and rehomes.
    values: [Office, Rung, Record, Proposition]

  hold_subject_kinds:
    source: "`architecture/holonic_ARCHITECTURE.md` §15 — the DOMAIN half of the same row: `hold` is a PERSON's edge."
    open: true
    note: >-
      One member, and it is a roster rather than an `is not None` because the codomain above is
      one too (§8 — the rule lives once) and because the next kind to acquire a domain check reads
      its own row here instead of growing a second spelling. A subject that resolves to none of
      the world's collections is UNKNOWN, not wrong, for the `_rehome` reason stated above.
    values: [Person]

  record_kinds:
    source: >-
      `architecture/meta/04_CODE_ARCHITECTURE.md` §B.5's synthesis call, ratified (ED-IN-0204): *"`Petition`
      and `Dispensation` become `Record` kinds ... two existence rows collapse into one"*, and PART A row
      11. The KEY LISTS are r2 `02_THE_WRIT_AND_THE_WORD.md` §A.3/§A.5's (ED-IN-0234, PROPOSED); plan
      position `15` builds them. `faction_sheet` is plan position `20-iii`'s (THE INFORMATION CLUSTER,
      narrative #14 §F -- `proposals/2026-09-12-emergent-narrative-primitives-v2/01_THE_TEN.md`
      proposal 14 -- `D1-a` of `proposals/2026-09-27-mc-v18-retirement-plan/PROPOSAL.md`).
    open: true
    note: >-
      ⚠ THE KEYS ARE EXACT, NOT A MINIMUM. `Record.__post_init__` (`state/carriers.py`) refuses a
      `subject_matter` whose key set is not its kind's IN EITHER DIRECTION, and refuses a kind that is
      not listed here -- r2 `05_LEDGER_AND_BUILD.md`'s ⊕L35. A missing key is an operand no reader can
      bind; an extra key is a second vocabulary. `text: []` is why every plain Record stays lawful:
      its `subject_matter` is `None`, which has no keys.
      ⚠ r2's `commission` (r2 item 11) IS NOT HERE, DELIBERATELY: it has no producer yet and lands with
      the effect that mints it. A kind nothing mints is a member no reader reaches (`ID-13`).
      (`faction_sheet` below is NOT r2's `commission` -- a commission is a document conferring a
      charge; a sheet is a description of a faction.)
      ⚠ `works` (r2 item 12, `04_MATTER_AND_WORKS.md` §A.6): `found` and `build` make what its `plan`
      names at the rung its `at` names, and `queries/world_q.py::ceiling` bounds a Site's condition by
      how many of its declared terms have matured. Its PRODUCER is the `create_record` that already
      runs (r2 §A.6.2 moment 1): an act declaring `kind: works` and `subject_matter: {plan, at}`.
      `plan` is a KIND -- a `rung_kinds` member for `found`, a `site_kinds` member for `build` -- and
      `at` is a RUNG id: "a <plan> at <at>". The verb says whether a Rung or a Site is made, so there
      is no `as` key. ⚠ THERE IS NO `stage` KEY -- r2 §A.6.1 RULED it out (an ungated write on
      `subject_matter`, which has no matrix row, and a second progress ladder beside
      `Site.condition`); the terms are `Record.stages`, matured at MATTER.
      ⚠ `faction_sheet` (producer `survey`, `loop/effects.py::_eff_survey`): a document whose content
      is `queries/faction_q.py::resolve`'s five-field view of ONE faction -- who is committed to it,
      the rungs and the seats they hold -- RESOLVED AT THE MOMENT OF WRITING and frozen there, so it
      goes stale as the world moves and nothing re-reads it. ITS KEYS ARE `faction_q.Faction`'s
      FIELDS, IN THAT DATACLASS'S ORDER, and `faction_q.py` REFUSES AT IMPORT if the two drift: the
      view owns the shape, this row owns what a Record of the kind may carry (⊕L35 reads it). It has
      NO addressee key, so `world_q.named` reads nobody out of it and a sheet summons no one into a
      question; its HOLDER learns what it says through the content deposit below, like any document
      -- holding a document is reading it, and no act is spent to do so.
      ⚠ THIS ROW IS ALSO A VOCABULARY OF THE `exists:` STEM. `requires_typed: {form: existence, kind:
      petition}` asks *a Record of kind petition exists* (`queries/world_q.py::WorldReader.read`), so a
      member here must never also be a `tenure_kinds` member -- `data/rosters.py` refuses the overlap at
      load rather than letting one reading silently shadow the other.
    values:
      text:         []
      dispensation: [terms, to, at]
      petition:     [terms, to, from]
      works:        [plan, at]
      faction_sheet: [proposition, members, holdings, seats, head]
      # A CONCEALED IDENTITY (#453 §8.2, §9.3; K-19). ONE key, `terms`, and it names
      # the ACTOR, written by `conceal`'s effect whatever the act's `subject` (the one kind whose
      # `terms` does not follow `content.read_from` below); the Record's own id is the alias. Its
      # stages are the mint's (`_declared_stages`). Its reader is `state/attribution.py::anchor_of`:
      # an act by a person holding a cover whose `terms` is himself, while a stage is unmatured,
      # anchors on the cover's id. Not a `record_sourced_operands` kind: a cover answers no operand,
      # and `ledger_names` reads nobody out of it (`ABOUT_KEYS`).
      cover:        [terms]
      # (Jordan, 2026-10-28: a faction's army is an order-of-battle record, not only
      # `PersonId[] at weight`): A FACTION'S ARMY. Its four keys are `modules/mass_battle/armyrecord.py::KEYS`
      # (`test_mass_battle_army_record.py` pins the two equal); that module owns what each key says and every
      # operation on it, and the four army verbs (`recruit`, `form_unit`, `assign_troops`, `order_unit`) call it
      # through the `mass_battle.army` composition row. MINTED by `create_record` (`kind: army`); CHANGED by the
      # four verbs, the one kind whose `subject_matter` is written after the mint (the `(Record, subject_matter)`
      # matrix row). Not a `record_sourced_operands` kind: an army answers no operand.
      army:         [faction, strategy, trained, units]
      # A STANDING CHALLENGE TO A DUEL (H-240 route (1)), minted by `challenge`
      # (`loop/effects_information.py::_eff_challenge`) into the challenger's hand. `terms` is whom it
      # challenges (`read_from`: the act's `subject`) and `to` the same person as its ADDRESSEE (so
      # `world_q.writs_held` stamps it on his question once he holds it); `stakes` is the TERM the duel
      # is fought under (`challenge_terms`, below), absent on a computed challenge, which carries no
      # payload; `challenger` is the actor, written by the effect. ⚠ THE KEY SPLIT: the duel's term is
      # `stakes` and the person is `terms` -- a term read from `terms` would read a person id.
      # `record_sourced_operands` maps it, so the `names:` stem (`data/requires.py`) reads `challenger`
      # for `to` and `terms` for `actor` and `subject`. [ASSUMPTION; medium; Jordan to correct; revert:
      # drop the kind, `challenge` writes nothing and `accept` takes a person as its subject.]
      challenge:    [terms, to, stakes, challenger]
      # A STANDING ORDER (B10-12, `marshal`), minted by `marshal`
      # (`loop/effects_information.py::_eff_marshal`) into the marshal's hand through `_mint_document`, the one mint. `at`
      # is the settlement the order is read about (the side's place: the attacker's origin, the defender's target),
      # `role` a `order_roles` member and `retreat_at` an `order_retreat_at` member. THREE KEYS, NOT THE HOME'S FIVE:
      # `reserve` and `general` are dropped (`RESERVE_COMMIT_TURN` stays the module's). READ by
      # `seam/wrappers/mass_battle.py::field_input`, which picks per side the order whose holder edge is newest.
      # Not a `record_sourced_operands` kind: an order answers no operand. [ASSUMPTION; medium; Jordan to correct; revert:
      # add the omitted keys back with their home wiring.]
      standing_order: [at, role, retreat_at]
    # HOW A MINTED DOCUMENT'S CONTENT IS READ OFF THE ACT, AND WHAT A HOLDER LEARNS FROM IT. One
    # owner for three facts the mint (`loop/effects.py::_mint_document`) and the deposit rule
    # (`loop/witness.py`) both read, so neither spells them.
    content:
      # A KEY IS READ FROM THE ACT'S OPERAND OF THE SAME NAME, EXCEPT WHERE IT IS LISTED HERE. `terms`
      # is what the document is ABOUT, which is the act's `subject` -- the one entity a computed act
      # always carries (`decision/choose.py::_payload_of`). A key naming a `requires_operands` member
      # is required (a missing one is `_operand`'s caller defect); a key naming none -- `at`, r2 §A.6's
      # place of discharge -- is read as declared and may be absent.
      read_from:
        terms: subject
      # THE KEY THAT NAMES WHOM A DOCUMENT ADDRESSES, stored as an id LIST whatever the act carried
      # (r2 §A.9.1 -- *"the id set under the addressee key its kind declares"*). One shape for one
      # key across every kind that has it.
      addressee: to
      # THE DEPOSIT RULE'S PREDICATE STEM. A person who comes to hold a Record holds
      # `(record, "content:<kind>", <subject_matter, frozen>)` in their own ledger (r2 §A.9;
      # `loop/witness.py::content_value` owns the frozen shape).
      predicate: content

  rung_kinds:
    source: "#353 §10 — the containment ladder. `contain : Rung → Rung`, one parent"
    open: true
    values: [person, hearth, community, settlement, territory, province, duchy, realm]

  scale_of_rung:
    source: >-
      Plan position `20-ii` (U9/R-04). `.designs/systems/_architecture/reference/
      scale_transitions_v30.md` §2's Scope column (ARCHIVED-NOT-CANON, quarantined -- read for
      VOCABULARY ONLY, per `CLAUDE.md` §1/§0.05; cited for the mapping's derivation, never as the
      reason it is correct). Canon's `Scope` cell per scale, verbatim: Object -- "one item, one
      wound"; Personal -- "one person"; Relational -- "small group, social agreement";
      Territorial -- "a duchy, a district"; Structural -- "a kingdom, an institution".
    open: false
    note: >-
      ⚠ **A VOCABULARY MAPPING, AND ONLY THAT.** The eight `rung_kinds` admit neither `faction` nor
      `world`, and canon's five scales are a DIFFERENT vocabulary, so something must translate
      between the two ladders wherever a caller needs canon's scale-band language. This roster does
      **not** make a `faction`- or `world`-scale corpus CASE representable (neither is a `rung_kinds`
      member for the mapping to receive as a KEY); that is `harness/corpus_run.py::rescales` and the
      `cases/exercises/*.yaml` overlays (`H-95`).
      ⚠ **THE MAPPING IS DERIVED FROM THE SCOPE CELLS ABOVE, NOT INVENTED.** `person` is canon's own
      example of `Personal` ("one person"). `hearth`/`community` are sub-settlement social units,
      matching `Relational`'s "small group, social agreement". `Territorial`'s own example is *"a
      duchy, a district"*: `duchy` appears by name, and `settlement`/`territory`/`province` are every
      rung strictly between `community` and `duchy` on the SAME containment ladder, so all four take
      `Territorial`. `Structural`'s example is *"a kingdom, an institution"* -- `realm` is the one
      rung above `duchy`.
      ⚠ **`Object` RECEIVES NO RUNG, AND THAT IS AN HONEST GAP.** Canon's `Object` scale is "one item,
      one wound" -- sub-personal, with no analogue on the CONTAINMENT ladder (nothing in `rung_kinds`
      sits below `person`). Mapping a rung onto it would be fabrication (`CLAUDE.md` §0.05: "generate
      none automatically rather than fabricate"). `SCALE_OF_RUNG` is therefore a TOTAL map on
      `rung_kinds` (every rung has exactly one scale) and a PARTIAL map onto canon's five scales.
    scale:
      person:     Personal
      hearth:     Relational
      community:  Relational
      settlement: Territorial
      territory:  Territorial
      province:   Territorial
      duchy:      Territorial
      realm:      Structural

  remit_acts:
    source: "#353 §11 — the CLOSED five remit acts, plus `convene`"
    open: false
    note: >-
      ⚠ H-52 turns on this roster. `ARCHITECTURE_V2.md` gates `open_case` on `remit:determine`,
      and #353's closed remit acts do not include opening a case — so V2 invented an eligibility.
      The roster is closed (#353 §11's five acts plus `convene`), and H-52's case is not added to
      it: a seventh value here would be the hardcoding the ruling above forbids.
    values: [issue, determine, confer, revoke, dispatch, convene]

  remit_default:
    source: "⚠⚠ NOT CANON. A TESTING FIXTURE, RULED BY JORDAN 2026-09-18: *\"anyway, for testing purposes for now, just build out a generic remit\"*."
    open: true
    note: >-
      ⚠⚠ **THIS IS A TEST FIXTURE AND IT IS OBVIOUSLY NOT A DESIGN. READ THIS BEFORE USING IT FOR
      ANYTHING.** It hands EVERY seated office EVERY remit act, which is exactly the authority
      `harness/populated.py` refused to invent on its own account: *"inventing one would silently
      hand somebody an authority nobody granted"*. That refusal stands; Jordan asked for a generic
      remit SO THE GOVERNANCE VERBS CAN BE EXERCISED AT ALL, and a value that is transparently wrong
      is safer as a placeholder than a plausible one, because nobody will mistake *"every office can
      do everything"* for canon.

      WHY IT EXISTS. A holder's remit rides on their `hold` Tenure and `person_side_eligible` reads
      it (`H-71`, `ED-IN-0255`); an office with no remit blocks the governance verbs by DATA, not by
      any mechanism. This roster is that data, provisionally.

      ⚠ IT DEFERS TO ANY REAL REMIT AND NEVER OVERWRITES ONE. The three grounded overlays
      (NPC-008 `issue`; NPC-033 `issue`/`dispatch`; NPC-038 `issue`/`determine`/`dispatch`) keep
      exactly what their case text supports. This fills ONLY an empty remit.

      WHAT REPLACES IT, and the shape is already known. A remit belongs to a POST, and an office is
      a post plus a scope. ⚠ BUT `Office.post` DOES NOT CURRENTLY HOLD A POST: the realm's posts
      include `"Cardinal Justice"`, `"Queen (Widow Regent if Almud eliminated)"`, `"Senior Jarl of
      the Western Highlands"` and `"Archbishop's Representative / Father"`, each fusing a post with
      a scope, a condition or a relationship. Jordan, 2026-09-18: *"cardinal is a post / king is a
      post / confessor is a post"*. So per-post remits need the post field normalised first.

      ⚠ ECCLESIASTICAL POSTS ARE THE AWKWARD CASE. Jordan: *"Confessor governs the Church tho"* and
      *"they are super weird in that they don't have territories at first"*. So a Confessor's scope
      is a BODY (`rosters.yaml` maps `"Church of Solmund": ecclesiastical`) and NOT a rung, with
      territory arriving later if at all. `data/cast.py::title_of` says `Doux`, `Confessor`, `Father`
      and `Prince` *"are real titles that govern no rung"* -- true of the RUNG LADDER, not of
      governing nothing. `Office.rung` is already `Optional` (*"null is the office-cluster case
      (S6.2)"*) and `Office.body`/`faction` carry the institution.

      ⚠ IT POINTS AT `remit_acts` RATHER THAN RESTATING IT: "every remit act" is what the fixture
      MEANS, so the pointer states the intent and carries no second copy (§0.05 cl.3). Narrowing it
      later means replacing `from_roster:` with a `values:` list, which the loader accepts and which
      is a visible edit rather than a silent divergence.
    from_roster: remit_acts

  witness_channels:
    source: "#353 §28 `:1004` — the five channels the fan-out computes an observer set from · order and `claim_source:` from proceedings `19_PLAN.md` step 4 (a)/(b), plan position `15d`"
    open: true
    note: >-
      The channels are named; their PREDICATES are `H-33` and are graded `assumption` with total
      fan-out as the default and the control. Naming a channel is not specifying it.
      ⚠ ORDER IS SEMANTIC HERE (position `15d`): it is the PRECEDENCE, strongest first. A person
      admitted to one Event by several channels is credited to the FIRST of them
      (`epistemic.observers_for`), and that one channel sets the deposit's source through
      `claim_source:` below. The order follows `19_PLAN.md`'s ordinal of remove (*firsthand >
      knot-sourced > told*): presence first, so a person who WAS IN THE ROOM is never downgraded to
      hearsay because they also hold the changed thing or sit in the office whose remit covers it
      — which is what `19_PLAN.md` step 4's *breaks if wrong* names. Between the two `told_by`
      channels the order decides only which channel is reported, never the source: the holder of
      the changed thing before the public record. Editing the order changes who holds what as
      hearsay, a game change, which is why it is data.
      ⚠ `post_remit` IS LAST, AND THAT IS THE SAME ORDINAL TAKEN ONE STEP FURTHER. `19_PLAN.md`'s
      ordinal of remove is *firsthand > knot-sourced > told > inferred* in full (`:517`), and
      `post_remit` mints `inferred`, so it ranks below both `told_by` channels: an obligee who is
      ALSO admitted by the public record (`chronicle`, every `binding_decision` emission) holds the
      Event `told_by`, never downgraded to `inferred`. `claim_source:` is keyed on exactly these five
      and names only `claim_sources` members (`data/rosters.py` refuses at import otherwise).
      `chronicle` is `told_by` on `04_CODE_ARCHITECTURE.md` §C.6's own row, and so is
      `post_remit`'s `inferred` (§C.6: *"the change claims, `inferred`"*). `post_remit` is the
      place-bound remit channel (r2 item 9: *"the place-blind remit channel -> obligees co-located,
      minting `inferred`"*); see `epistemic._ch_post_remit`.
      ⚠ `witness_key` ADMITS THE EVENT'S OWN ANCHOR AS WELL AS ITS KNOT PARTNERS
      (`_ch_witness_key`'s `pid == anchor`), and one channel carries one source. So an actor with
      NO PLACE -- whom `co_located` cannot admit -- holds their own act `firsthand_via_knot`, under
      the event id (S28's knot deposit). §C.6 separates the two (*"change claims about self; via a
      knot, the partner's deposits"*) and one channel cannot. A placed actor is credited first by
      presence (`co_located`).
    ordered: true
    values: [co_located, witness_key, document_key, chronicle, post_remit]
    claim_source:
      co_located:   firsthand
      witness_key:  firsthand_via_knot
      document_key: told_by
      chronicle:    told_by
      post_remit:   inferred

  claim_sources:
    source: "#353 §20 — how a Claim came to be held"
    open: true
    note: >-
      ⚠ Jordan, 2026-09-02: *"our understanding of all other words and actions is subjective and
      singular."* Every value here is a way ONE person came to hold ONE claim. A source that
      described a shared or aggregated understanding would contradict the ruling, not extend it.
    values: [firsthand, told_by, inferred, firsthand_via_knot]

  strata:
    source: "#353 §27 — the five strata, in canonical resolution order"
    open: true
    note: >-
      ⚠ ORDER IS SEMANTIC HERE, not alphabetical: the fold resolves in this sequence, so editing
      the order changes which acts see which world. That is a game change, which is precisely why
      it belongs in data rather than in a body.
    ordered: true
    values: [movement, binding_decision, contested_physical, uncontested_material, social]

  eligibility_kinds:
    source: "#353 §9.2 / ARCHITECTURE_V2.md §E4 — the four ways a verb can be made available"
    open: true
    note: >-
      ⚠ `capability` IS NOT AND MUST NEVER BE A MEMBER. #353 §9.2: "`capability` supplies dice and
      GATES NOTHING… The only class-shaped gate in the design is Thread Sensitivity." An office
      makes an ORDINARY verb eligible; no verb exists only for office-holders. Adding a fifth kind
      is a DESIGN CHANGE — a new way to make a verb unavailable to someone — and not a table edit,
      so it needs a ruling before it needs an entry.
    values: [own, remit, hold, presence]

  brute_kinds:
    source: "B05.24 (`ED-IN-0379`), `proposals/2026-11-13-verb-governing-attributes.md` §0: Jordan, 2026-11-13, a verb that is a brute function (authorised, gated or recorded by a seat, a standing or another's decision; its efficacy not in question) names no attribute and does not roll at all"
    note: >-
      WHAT AUTHORISES A VERB THAT NEVER ROLLS, the value of a verb row's `brute:` (`data/verbs.py::_check_governing_attributes`
      reads this roster and refuses any other). `seat` -- a seat's remit, purview or conferral basis (the row's eligibility
      carries `remit:` or its referent class is `Office`); `own` -- an act on his own state or what he holds; `counterparty` --
      another person's own decision completes it, drawn in that person's choice. A fourth kind is a design change: a new way for
      an act to happen with no draw.
    values: [seat, own, counterparty]

  person_inputs_kinds:
    source: "B05.25 (`engine/season/verb_table.yaml`'s row shape): how a `contest_subsystems.prizes` row's module reads a person"
    note: >-
      THE VALUES OF A PRIZE ROW'S `person_inputs:`. `own` -- the module reads the person by its own rule (combat's `scores`, `addends` and
      mapped attributes, the field's records), so a verb contesting the prize names no `governing:`; `pool` -- the module takes the
      pool `seam/wrappers/pool.py::faculty` builds from the verb's `governing:` attributes (the social roll), so the verb names
      them and, contested against a person, the `opposed_attribute` of the person opposite.
    values: [own, pool]

  # The season-side roster of PURSUITS (`ED-IN-0261`), read from the single owner.
  pursuits:
    source: >-
      references/descriptor_registry.yaml `pursuit_roster`, count 15 (ED-IN-0261), exported to
      engine/engine_params/descriptors.json behind a BLOCKING --check (tools/export_descriptors.py).
    open: true
    note: >-
      ⚠ **READ FROM THE SINGLE OWNER, NOT RE-TYPED.** The fifteen pursuits over seven axes
      (`ED-IN-0261`) are what this roster carries. JORDAN, 2026-09-02, VERBATIM: *"please note that
      convictions roster and axes etc may be modified in future."* Populating a roster from a
      single-owner export is a DATA EDIT, which the same ruling says is the correct shape; `open:
      true` says in data that the roster may change.
      ⚠ **THESE ARE PURSUITS AND THEY ARE NOT AXES.** The row below carries SEVEN bipolar axes; a
      person's pursuits are weights over THESE FIFTEEN, and they reach the axes only through
      `tables.pursuit_projection` (15×7).
    # ⚠⚠ **NO `values:` HERE, AND THAT IS THE WHOLE POINT OF THE ROW.** A `values:` list would be a
    # SECOND ROSTER. `tests/valoria/test_conviction_roster_single_owner.py` scans PYTHON, so a copy in
    # YAML would slip past it while being the same defect (three incompatible conviction rosters once
    # shipped at the same time and silently disabled ED-912 §6.1's Conviction Scar).
    # `data/rosters.py` binds `PURSUITS` from `engine.substrate.descriptors` (as `CONVICTIONS`,
    # the leaf's own unrenamed name) — the one leaf reader, fed by the one exporter, from the one
    # owner at `references/descriptor_registry.yaml:pursuit_roster`. This row carries the
    # SOURCE and the NOTE, which is what a roster row is for when the values live somewhere better.
    # ⚠ `from_descriptor:`, NOT `values: []`: an EMPTY list makes `roster("pursuits")` return
    # `frozenset()` — the "membership test silently false" outcome `roster()`'s own refusal text
    # forbids. `from_descriptor` is the mechanism ED-IN-0230 built; it also puts the data-side
    # `forbidden:` bar within reach of this roster, which a direct import cannot do.
    from_descriptor: pursuit_roster

  pursuit_axes:
    source: >-
      references/descriptor_registry.yaml `axis_roster` — SEVEN bipolar axes, both poles named
      (ED-IN-0261), scale "[-1,+1] bipolar; negative = the first-named pole, positive = the second".
      Owned in code by descriptors.py's `axis_roster` leaf.
    open: true
    forbidden: [exposure]
    # CR-21 (M14), H-146's repair: WHICH POLE OF AN AXIS A PERSON REFUSES THROUGH, as a sign on the axis's own
    # scale (`axis_roster.scale`: -1 the first-named pole, +1 the second). Read by `data/rosters.py::refusing_pole`,
    # asked, through `decision/options.py::scruple`, by the ranker's strike (`decision/choose.py::make_ranker`, B10.24). Only the ruled axis is authored (ED-IN-0261, Jordan: deontology is a
    # REFUSAL, "it's a refusal to take certain actions"): the deontological pole, the first-named, refuses. An axis
    # absent here REFUSES at the gate rather than defaulting. The gate is armed nowhere (`Fixtures refusal_axis`
    # ships unset; arming it is H-146's remaining position). [ASSUMPTION; medium; Jordan to correct; revert: restore the
    # hardcoded `>` in `decision/options.py::refuses`, drop the `refusing_pole(axis)` call in `refusal_tolerance` and the
    # import-time `_refusing_poles()` call in `data/rosters.py`, THEN delete this key (deleted alone it makes
    # `roster_map` raise at import, and every import of `engine.season` fails).]
    refusing_pole:
      deontological_instrumental: -1
    # B10.21 (16_PESSIMIST_CHAR_C item 1): THE "CERTAIN ACTIONS" ED-IN-0261 GATES, per axis. A verb not listed is never
    # refused, whatever its cell on the axis. Read by `data/rosters.py::refusable`, asked by `decision/options.py::refuses`;
    # an axis with a refusing pole authors its list here or the gate refuses (never defaults). Checked at load
    # (`data/rosters.py::check_refusable`, run at the foot of `data/verbs.py`): a verb off `verb_table.yaml`, or one with
    # a zero cell on its axis, is refused -- a scruple can only forbid an act the axis engages.
    # [ASSUMPTION; medium; Jordan to correct: content. `destroy_record`, `sabotage`, `conceal`, `raze`, `seize` join when
    # they carry a cell on this axis (16_PESSIMIST_CHAR_B, step 2). Revert: delete this key AND the `refusable(axis)` call
    # in `decision/options.py::refuses` and the `check_refusable()` call at the foot of `data/verbs.py` together.]
    refusable:
      deontological_instrumental: [forge, lie, "evade / defy", construe]
    note: >-
      ⚠⚠ **SEVEN BIPOLAR AXES (`ED-IN-0261`).** Convictions (now pursuits) and axes are different
      index sets: the roster above holds the fifteen pursuits, this row holds the seven axes, and
      `tables.pursuit_projection` is the 15×7 between them. V2 §F2's `conviction[axis]` is computed
      rather than looked up -- `Σ_conv conviction[conv] · projection[conv][axis]`.
      ⚠ `exposure` IS FORBIDDEN AS A BARE AXIS NAME and the loader RAISES on it — #353 `:1897`
      names "The Exposure collision — three senses of one word, including a need scalar and a
      per-person tally". Spell the sense you mean.
      ⚠⚠ **THERE IS NO `values:` LIST, AND THAT IS THE REPAIR (ED-IN-0230).** A literal copy here
      could disagree in silence with `engine/substrate/keys.py::AXES` (nothing under `engine/season/`
      read it), so a fifth axis in one place would leave the other scoring on four.
      ⚠ **`from_descriptor:` IS THE `conviction_roster` PRECEDENT.** The roster lives in
      `references/descriptor_registry.yaml` with `engine/substrate/descriptors.py` as the one
      code-side reader, so a fifth axis or a rename is ONE edit -- `axis_roster.names`.
    from_descriptor: axis_roster

  # IN-08 H10: the religious affiliations `Person.conviction` is keyed on (ED-IN-0251 R1/R2), read
  # from the single owner like the two rows above. `tables.incompatible` is keyed on these.
  affiliations:
    source: >-
      references/descriptor_registry.yaml `affiliation_roster` (count 4, scale 0-5), exported to
      engine/engine_params/descriptors.json behind a BLOCKING --check (tools/export_descriptors.py).
    open: true
    note: >-
      AN AFFILIATION IS A SIDE, NOT A PURSUIT. The pursuit `doctrine` is how much of a person's
      action concerns religious matters at all; `Person.conviction` says which affiliations they
      hold and how intensely. Neither is the faction `Church of Solmund`.
    from_descriptor: affiliation_roster

  question_sources:
    source: "ARCHITECTURE_V2.md §F1 (Q1–Q3) · PLAN.md `W5` (Q4 `need`) · folded to two at position `11a`, r2 `01_ATTENTION_AND_REACH.md` §A.2"
    open: true
    ordered: true
    note: >-
      ⚠ TWO SOURCES (`ARCH §B.13` `ID-13` -- a declared source that reaches no code is the defect, not
      a design worth keeping). Dates coming due and bands being crossed fold into `claim_landed`:
      the underlying Event is already witnessable and already deposits a claim, and `reach`/`place_of`
      (`queries/world_q.py`) carry that claim to someone not standing where it happened as a FILTER
      over the claims a person's own ledger already holds, never as a new witness channel (`01` §A.4.4).
      ⚠ `need` IS THE SECOND SOURCE. PLAN `W5`: "**Without Q4 an NPC with a standing ambition and a
      quiet season forms no candidates at all**, which is most of the NPC corpus" (#353 `:509`,
      `:605`, `:1297`). A closed set that turned out to be missing a member is the strongest possible
      argument for keeping closed sets in data.
      THE ORDER IS A TIEBREAK WITHIN AN ATTENTION TIER (v9 IN-57, RS-22): `questions_for` sorts on
      `world_q.attention_key`, a tiered read of the person's own state, and `(order[q.source],
      q.id)` breaks ties inside a tier, so editing this order changes which question a
      budget-bounded person answers first only among questions of one tier. Within a tier `q.id`
      is still the last tiebreak.
    values: [claim_landed, need]

  referent_classes:
    source: "v9 IN-53 (H-207 'VACANCY AS NEED', DECISION 2026-10-13 D1)"
    open: false
    note: >-
      THE CLASSES A QUESTION MAY CARRY A REFERENT AS, and the closed set a verb row's
      `referent_class:` column may name (`verb_table.yaml`, validated by `data/verbs.py`). A CLASSED
      referent is a second partition of a question's referents (`state/carriers.py::Question.classes`),
      beside its plain `referents`: a row declaring a class forms ONLY on referents carried as that
      class, and a row declaring none forms ONLY on the plain ones, exactly as before IN-53
      (`decision/options.py::opening_set`, through `VerbRow.referents_of`). It exists because
      `opening_set` has no World (L2) and cannot ask what kind of thing an id is. `Office`: the
      vacant seats a person may fill (`queries/world_q.py::vacancies`, IN-53) AND the seats he has
      been told of (`seats_named`, v9 IN-10 (a)), which `questions_for` adds to the question the
      person answers (`_stamped`); `confer` and `oblige` declare it, and since v10 REM-28 `revoke` (which
      the column keeps from forming on anything but a seat, and which still executes nothing: its
      `verb_table.yaml` note); a class is the carrier's own type name, so a
      stamp of a type this roster does not name is refused at the Question's construction.
      `Record` (v9 IN-09, H-203, DECISION 2026-10-13 [ASSUMPTION; medium; Jordan to correct]): the
      writs a person HOLDS (`queries/world_q.py::writs_held` -- a live `hold` on a Record of a kind
      `data/verbs.py::RECORD_REFERENT_KINDS` derives from the rows declaring this class), which
      `questions_for` adds to the question he answers beside his seats; `comply` declares it,
      and since v10 REM-2B `evade / defy` and `construe` do too (H-203).
      REVERT: drop the value and the row's column.
      v10 REM-25 (B10-05, AM-A-10, [ASSUMPTION; medium; Jordan to correct]): WIDENED. `carry`, `found`
      and `build` declare it too, and the term gains its second half beside the writs
      (`queries/world_q.py::records_held_for_holding_rows`: the Records on a person's live `hold` edges of
      a kind in `data/verbs.py::HOLDING_RECORD_KINDS`, which that module derives from the `Record` rows
      whose cell also asks `held_by` of `subject` -- a petition, a works -- with no addressee test, since
      those rows ask only that the actor hold the document). The class is a collection and not a
      sub-kind, so it is SHARED: a held petition is a `Record` for all four rows and the fold refuses it
      on the kind the three others ask (`verb_table.yaml`'s `carry` note has the readings). REVERT: the
      three rows' columns and the term.
      v10 REM-2C (B10-05, AM-A-11, [ASSUMPTION; medium; Jordan to correct]): `research` declares it too,
      asking `existence` of the collection itself (any document, `data/verbs.py::_record_subkinds_answered`
      adds no kind to either set), and the class leaves `occasion_only_classes` (below), so the
      question's own Records are stamped as well (`own_referents_of_class`). REVERT: `research`'s
      column and `Record` back in `occasion_only_classes`.
      `Rung` (v9 IN-45 `migrate`, H-168 limit 1, [ASSUMPTION; medium; Jordan to correct]): the
      places a person has been told of and could settle in (`queries/world_q.py::places_named` --
      a Rung his own ledger names, the §10 ladder seats him in, and he does not already live
      under), which `questions_for` adds to the question he answers beside his seats and writs;
      `migrate` declares it (and `requisition`, below, and since v10 REM-27 `march`, whose `subject` binds a stamped Rung
      as its field, and since v10 REM-28 `convene`, whose `subject` binds one as its venue), so its `to` binds ANOTHER
      place rather than the single referent
      of whatever he was asked about (most often his own residence). The destination channel H-168
      names, on IN-53 D1's partition and `seats_named`'s knowledge source: no operand is added
      (`to` still binds the referent, `decision/options.py::_derive_operand`) and no Record kind.
      REVERT: drop the value, `migrate`'s column and `places_named`'s splice.
      v9 IN-49 `requisition` (H-163 limit 3, [ASSUMPTION; medium; Jordan to correct]): AND the larders a
      seat may requisition (`queries/world_q.py::larders_in_purview` -- a Rung his own ledger names, holding
      the fixtures' requisition of their matter, inside the purview of a seat of his granting the remit act
      of a row declaring this class, `data/verbs.py::RUNG_REMIT_ACTS`, and not that seat's own rung,
      its treasury), stamped after the places and
      never twice; `requisition` declares it beside `migrate`, so its `subject` binds a stocked rung in
      purview rather than whatever he was asked about. The class is shared, as `Office` is between
      `confer` and `oblige`: each row forms on both sources and the fold disposes. REVERT: `requisition`'s
      column (which removes `issue` from `RUNG_REMIT_ACTS`, the union over the `Rung` rows) and `larders_in_purview`'s splice.
      v11 CR-25 (CR-11's design, [ASSUMPTION; medium; Jordan to correct; revert: `establish`'s column and
      `holdings_to_found`'s splice]): AND the holdings a seat may found an office over
      (`queries/world_q.py::holdings_to_found` -- a rung on one of his own live `hold` edges that
      `founds_over` admits through a seat of his granting an act `establish` is eligible by,
      `data/verbs.py::FOUNDING_REMIT_ACTS`: held, in that seat's purview, below its rank, the seat on its
      parent), stamped directly after the larders and never twice; `establish` declares the class, so its
      `subject` binds the holding `loop/predicates.py::office_founded_by` derives the office from. Shared, as
      above: the other `Rung` rows form on a stamped holding too, and `establish` on a place named or a
      larder; the fold disposes. `RUNG_REMIT_ACTS` gains `confer`.
      v10 REM-21 (B10-05, AM-A-06, [ASSUMPTION; medium; Jordan to correct]): `Site`, `Proposition`
      and `Person` -- THE THINGS A QUESTION IS ITSELF ABOUT, carried as their kind. Not a standing
      occasion: `queries/world_q.py::own_referents_of_class`, one more term of `questions_for`'s
      splice, stamps the PLAIN referents of the question the person answers whose collection
      (`World.class_of`) is a class some verb row declares (`data/verbs.py::DECLARED_CLASSES`) and
      that `occasion_only_classes` (below) does not hold back. It reads the question and never the
      ledger, so a person who knows fifty people is offered none of them unless his question is
      about one. `Site`: a worked or built place standing on a rung (`w.sites`,
      `state/carriers.py::Site` -- a harbour, a seam, a works, a dwelling). `Proposition`: a stated
      thing a person may commit to, assert or dispute (`w.propositions`,
      `state/carriers.py::Proposition` -- an OUGHT, a covenant's term). `Person`: a person or cohort
      by his own id (`w.persons`, `state/carriers.py::Person`); his `person`-kind rung shares the id
      and `class_of` answers `Person` for it; `open_case` and `petition` declare it, and since v10
      REM-28 `dispatch`. While no row declares one of the three, the term stamps
      nothing for it and no formation moves; a row's `referent_class:` naming it is what makes the
      term stamp it. REVERT: drop the three values and the term.
      v11 CR-28 (G-04 (a), B10-09 close two; CP-T02-05's re-take, [ASSUMPTION; medium; Jordan to correct;
      revert: drop the term in `questions_for`]): `Proposition` GAINS A STANDING OCCASION beside the
      own-referent term -- `queries/world_q.py::propositions_heard`, the Propositions among
      `person_q.ledger_names` of the claims in a person's own ledger that do not record his own act
      (`Claim.doer`, the own-act screen's test): an `utter` he witnessed or was told of, another's
      commitment, a document whose terms name one. `questions_for` appends it last to its splice;
      `commit` and `argue` form on what it stamps, and `held_edge_declines` (below) declines `commit` on
      a cause he already holds. The class stays out of `occasion_only_classes`, so a question's own
      Propositions are still stamped by the own-referent term.
      `Detainee` (v10 IN-12 step 5, H-226 route (a) with the decline H-232 names [ASSUMPTION; medium;
      Jordan to correct; revert: drop the value, `interrogate` declares `Person`]): THE RESTRAINED-PERSONS
      CLASS -- a person held by a live `detain` whose object is a seat the asker holds, stamped by the
      standing occasion `queries/world_q.py::detainees_held` onto the question he answers. THE ONE CLASS
      THAT IS NO COLLECTION: the id is a `Person`, so `World.class_of` never answers it and the stamp names
      it (`data/verbs.py::DETAINEE_CLASS`); it is occasion-only (below). It exists because `Person` is filled
      with every person a question names, so custody could not be told apart in it. `interrogate`
      declares it. Empty while no live `detain` exists.
      `Enemy` (v11 CR-87, the WAR context of `violence_contexts` [ASSUMPTION; medium; Jordan to correct; revert:
      drop the value, and `war` has no reader]): A PERSON OF A FACTION AT WAR WITH THE ASKER'S, stamped by the
      standing occasion `queries/world_q.py::enemies_heard` onto the question he answers, `Detainee`'s shape (no
      collection; named by `data/verbs.py::ENEMY_CLASS`; occasion-only). No row declares it, so no verb FORMS on
      it: `decision/options.py::opening_set` reads it as the war context of the `fight` decline. Empty while no
      war Proposition is live, which is every buildable world before CR-91.
      `Disputant` (B11 lane A, the duel chain's second link [ASSUMPTION; medium; Jordan to correct; revert: drop the
      value, `challenge` declares `Person`]): A PERSON BESIDE THE ASKER WHOM HE HOLDS A DISPUTE WITH, stamped by the
      standing occasion `queries/world_q.py::disputes_held` (over `person_q.holds_dispute`, the one owner) onto the
      question he answers, `Enemy`'s shape (no collection; named by `data/verbs.py::DISPUTANT_CLASS`; occasion-only).
      `challenge` declares it. It is a class of its own, not `Person`, because `Person` is shared: stamped as
      `Person`, `capture` formed on the same men and executed where no context licensed violence (ED-IN-0337).
    values: [Office, Record, Rung, Site, Proposition, Person, Detainee, Enemy, Disputant]

  occasion_only_classes:
    source: "v10 REM-21 (B10-05, AM-A-06's exclusion)"
    open: false
    note: >-
      THE REFERENT CLASSES ONLY A STANDING OCCASION STAMPS -- never from a question's own referents.
      `queries/world_q.py::questions_for` stamps a class onto the question a person answers in two
      ways: a standing occasion, a named term of its splice reading the person's own seats, edges and
      ledger (`vacancies` and `seats_named` as `Office`, `writs_held` and `records_held_for_holding_rows`
      as `Record`, `places_named` and `larders_in_purview` as `Rung`), or `own_referents_of_class`, which carries the question's own
      plain referents of every class a verb row declares EXCEPT the ones listed here. The three of
      REM-21 were held back because their rows (`confer`, `oblige`, `comply`, `migrate`, `requisition`, and
      `carry`, `found` and `build`) form on plain referents: carrying the question's own seat, writ or
      place as that class would widen them onto it. A member must be a `referent_classes` value
      (`data/rosters.py` refuses another at load).
      Removing a class from this list is the edit that lets the own-referent term stamp it. REVERT:
      with the term, the list goes.
      v10 REM-2C (B10-05, AM-A-11; M19 taken, [ASSUMPTION; medium; Jordan to correct]): `Record` IS NOT
      ON THE LIST. `research` declares it and asks `existence` of the collection itself (any
      document), which no standing occasion answers, so the own-referent term stamps the question's
      own Records too, beside `writs_held` and `records_held_for_holding_rows` (`_stamped` keeps one
      pair where both name one Record). The term reads the question and never the ledger. The class
      is shared, so `comply`, `carry`, `found` and `build` form on a question's own Record as well
      and the fold disposes (`verb_table.yaml`'s `research` note has the readings). A WRIT IS THE
      EXCEPTION: the term skips a Record of a writ kind (`data/verbs.py::RECORD_REFERENT_KINDS`),
      which only `writs_held`'s addressee test stamps, so a bystander who saw a writ issued is offered
      no `comply`. REVERT: put `Record` back here (with `research`'s column).
      `Detainee`, `Enemy` and `Disputant` are members because only their standing occasions
      (`detainees_held`, `enemies_heard`, `disputes_held`) stamp them: no collection is named so, so
      the own-referent term could never match them.
    values: [Office, Rung, Detainee, Enemy, Disputant]

  flow_stake_classes:
    source: "v11 CR-78 (B11-S4, `strife-00` section 5, the stamp)"
    open: false
    note: >-
      THE CLASSES A FLOW'S STAKE MAY BE STAMPED AS (`queries/world_q.py::flow_stakes`, behind
      `Fixtures stamp_flow_stakes`, `hole_register.yaml` H-274): the rungs, persons and offices a strand
      names. Any other class `World.class_of` gives an id (`Record`, `Site`, `Proposition`) or none (a custody
      edge's Tenure id, an id the World does not hold) is left unstamped by `_of_stamped_class`, the one class
      test. `Enemy` is never among them: no row forms on it and the `fight` decline reads it as licence, so a
      flow a person knows of must never by itself make another man his enemy. A member must be a
      `referent_classes` value (`data/rosters.py` refuses another at load). REVERT: with the term.
    values: [Rung, Person, Office]

  person_predicates:
    source: "#353 §14 `:331` — `marks[]` … \"heritage · grade · Church standing · office · residence\""
    open: true
    note: >-
      THE PREDICATE VOCABULARY `standing` NEEDS (PLAN `W5`). A Claim carries `(subject, predicate,
      value)`; `standing` pairs claims ABOUT ME by predicate, so without a vocabulary "pairs by
      predicate" is pairing on a free string. #353 `:331` supplies one: these are the five things
      `marks[]` records about a person, which is the corpus's own list of what is readable off
      someone. Open, because a claim may assert something `marks[]` does not record.
    values: [heritage, grade, church_standing, office, residence]

  view_builder_rules:
    source: "#353 §18 `:623` — \"at most K claim ids from the holder's OWN ledger -- built, not filtered\""
    open: true
    note: >-
      ⚠ "BUILT, NOT FILTERED" SAYS WHAT A VIEW IS NOT AND NEVER SAYS WHICH K. PLAN `W5` names the
      gap: "`K = 12` says nothing about **which** K, and the instrument takes the last k". Each
      value here is one rule for choosing WHICH ids; `H-53` is the row, `recent` is its default,
      and all three are swept. `recent` is the instrument's incumbent and is kept as the default so
      the sweep has an honest control — not because it is argued for.
    values: [recent, highest_confidence, question_relevant]

  question_aggregation:
    source: "PLAN.md §1.4 hole 15 / `H-54` — \"nothing says how many questions a person forms per season\""
    open: true
    note: >-
      ⚠ `deliberate` once took `qs[0]` -- the first question in `question_sources` order -- with no
      row or marker, and `question_sources` is ORDERED, so that silently meant *a Date always beats a
      need*, an unruled priority rule that decides what every NPC does first. `first` is that
      behaviour DECLARED, kept as the default because it is the incumbent and a sweep needs an honest
      control -- not because it is argued for.
      `all` gives the person every question and lets the budget triage them, which is what §26.3's
      triage is FOR; `one_per_source` is the middle reading. `H-54` is the row.
    ordered: true
    values: [first, all, one_per_source]

  scene_packing_rules:
    source: "`W17` — which interactions share one scene. `player_agency_v30.md` §6.3 says a scene HOLDS 1–3 and never says WHICH"
    open: true
    note: >-
      ⚠ `H-76` registers HOW MANY interactions a scene admits; this roster says WHICH ones share
      one (`make_chooser` once answered it in a comment: *"the default policy fills scenes greedily
      in score order"*, which H-53 calls *"AN INVENTION"*).
      `greedy` is that invention DECLARED and kept as the sweep's control, not argued for.
      `one_per_scene` is the pre-ruling accounting — one interaction per scene action — and is
      the honest floor. `by_subject` is the reading `player_agency_v30.md` §6.3's own words
      suggest: *"one scene opportunity pursued"* is about SOMETHING, so the interactions sharing
      a scene are the ones sharing a subject. `H-78` is the row.
    values: [greedy, one_per_scene, by_subject]

  claim_subject_rules:
    source: "#353 §20 — `Claim := (id, holder, subject, predicate, value, ...)`, and NOTHING says what `subject` is for a WITNESS deposit"
    open: true
    note: >-
      ⚠ WITNESS once deposited every claim with `subject = event.subject`, which the fold sets to the
      ACTOR, so every claim in the world was "I hold that <actor> did <kind>" and §F1's Q2 --
      *"a claim landing in the holder's ledger whose subject is that person, SOMETHING THEY HOLD,
      or a Proposition they have committed to"* -- could never fire on its second clause. These
      rules say what a deposit's `subject` is.
      `actor` is the incumbent, kept as the sweep's control. `per_change` mints one claim per
      `StateChange` with the CHANGED THING as its subject, which is what makes "something they
      hold" reachable and what #353 §13.1's own narration needs — a copy that can be found,
      carried, hidden or destroyed. `both` keeps the actor claim and adds the per-change ones.
      ⚠ **THAT HOLDS ONLY WHERE `changes[]` IS NON-EMPTY.** An Event that WROTE NOTHING has no
      per-change subject to add, and under `per_change` and `both` alike its deposit is minted about
      WHAT THE ACT NAMED instead of about the actor (`H-102`): a claim about the teller can never
      satisfy *the holder, or something they hold*.
      ⚠ **THE PRICE: WHERE THE ACT NAMED SOMETHING, NO LEDGER RECORDS WHO SPOKE.** For a speech, a
      telling, a compliance or a refusal THAT NAMES ITS SUBJECT, the deposit no longer names the
      actor, so under the DEFAULT arm the attribution of that act is in nobody's ledger. The
      replacement is guarded on `any(refs)`: a write-nothing act that names NOTHING leaves `out`
      untouched, and the actor survives via the standing `out or [anchor]` fallback under
      `per_change` (`anchor_of` returns the same actor), and because the actor is already in `out`
      under `both`. That false arm is unreachable from the corpus as it stands (every Act the fold
      mints comes from `pack_scenes` with `payload={"subject": ...}` drawn from non-empty
      referents); `H-111`'s refusal question is where a witness would first appear.
      Attribution reads `causes[]` through `state/attribution.py` -- an Event carries no actor and
      no `subject` (`T-d`, `H-107`). The `actor` arm is where the incumbent behaviour survives.
      ⚠ **IT REPLACES RATHER THAN JOINS, AND THAT IS NOT A DERIVATION.** Joining mints one extra
      claim per write-nothing Event; the cap evicts on `(confidence, recency)`, and `H-40`'s decay
      sweep then read a minimum confidence of 100 in all three arms (a damping loop made
      unobservable by an amplifying one, `H-103`'s cite). The ground for the choice is that the
      teller is not the news.
      ⚠ THIS ADDS NO FIELD TO `Event`. `PLAN.md` §8.1 forbids adding a `target` or `actor` field
      to Event; `changes[]` already names what was written, so the subject is READ off the Event
      the design already has. `H-79` is the row.
    values: [actor, per_change, both]

  observation_deposit_modes:
    source: "`W-B`. #353 §28 says WITNESS deposits a Claim and never says whether a deposit may carry WHAT THE FOLD READ, or to whom. §20 types the Claim and stops there."
    cite: "H-122"
    open: true
    note: >-
      ⚠ THIS IS THE WRITE SIDE OF `H-116`. `belief_contradicts` evaluates the verb's own
      `requires_typed:` cell against `LedgerReader`, so the vocabulary a claim must be in to reach §F1
      clause 4 is `stores:<kind>` / `condition` / `contain.path:<to>` / `claim.held` / `exists:<kind>`
      / a relation stem — the strings `Observation` DERIVES from the cell's own fields. A deposit
      carrying `predicate = e.kind` and `value = True` is a DISJOINT vocabulary and a value no
      comparator can send to False, so clause 4 could never fire on it.
      `none` is THE CONTROL (no read is deposited), so every measurement of this item has a
      baseline (`CLAUDE.md` §0.1 point 4). `actor` deposits an act's reads to the actor
      alone — the minimum that closes the loop, and the arm where every claim minted is one its
      holder can read back, because `belief_contradicts` binds `from` to the person's OWN
      containing rung and `actor` to their own id. `total` gives the reads the same fan-out the
      Event itself got, which is #353 §61's shape for the Event and is not stated for the read.
      ⚠ THE OBJECTION TO `total` IS §F1'S EPISTEMOLOGY AND IT IS WEAKER THAN IT LOOKS. The fold
      reads with `WorldReader` — world truth — so fanning a read to everyone teaches everyone a
      VERIFIED fact, and §F1 rests on people acting on beliefs that may be wrong. But
      `LedgerReader` resolves on `(when, confidence)` and the cap evicts, so a season-1 observation
      of `stores:grain = 5` is a STALE belief the moment the granary empties, and a person acting
      on it acts wrongly. The epistemic gap survives as RECENCY rather than as absence. That is a
      reading, not a result; the arm is swept and the measurement is on `H-122`.
      ⚠ UNKNOWN IS NEVER DEPOSITED IN ANY ARM. A read the world could not answer is the
      INSTRUMENT'S gap, and `H-94`'s `operands_for` refuses to mint an act with a hole precisely so
      that gap does not become a false belief; depositing UNKNOWN would reintroduce it from the
      other end. It is inert besides — it reads back UNKNOWN and can contradict nothing — while
      still costing a ledger slot the cap evicts somebody else for.
    values: [none, actor, total]

  combat_degree_bands:
    source: "JORDAN, 2026-09-03, VERBATIM: *\"kill/wound degrees should be directly taken from scene combat, which is what actually needs to be called when kill/wound is considered.\"* And 2026-09-04: *\"the combat engine determines the result there. your code just has to accept the result.\"*"
    cite: "H-98"
    note: >-
      ⚠ THE ORDER IS SEMANTIC AND IT IS SEVERITY, WORST FIRST. `shape.py` unpacks this row
      positionally (`FELLED, WOUNDED, UNTOUCHED = COMBAT_BANDS`), so reordering it renames the
      bands rather than reordering them, and `verb_table.yaml`'s `kill / wound` keys its
      degree-keyed `writes:`/`emits:` on the same three strings. A drift between the two is loud
      at the first act that folds: `VerbRow.writes_at` refuses an unlisted degree and PRINTS BOTH
      SETS.
      ⚠ THESE ARE NOT THE LADDER'S FOUR BANDS AND MUST NOT BE CONFUSED WITH THEM. `S39.4` reads
      four bands off a MARGIN and its single owner is `engine/dice_engine/dice_engine.py::
      degree_from_net`, which `shape.degree_of` IMPORTS AND CALLS. Combat is EXEMPT from that
      ladder by the ruling above: its bands are a READ of the engine's own `WoundTracker` — the
      subject went down, the subject bled, the subject was untouched — and every one of the three
      is a field `combat_seam.resolve` returns in `wound_state`.
      ⚠ WHY THERE IS NO FOURTH. The engine does not separate a DECISIVE win from a NARROW one
      beyond wound count on the victor, so an `Overwhelming`-vs-`Success` split has NO SOURCE IN
      THE DATA and is not invented. That is the whole of what survives in `H-98`.
    values: [Felled, Wounded, Untouched]

  wound_quantities:
    source: "`seam/wrappers/combat.py::resolve`'s `wound_state` -- the fields of the engine's own `WoundTracker` that the seam lifts per party before `wrapper.fight` collapses the scene to an int. Jordan 2026-09-02: *\"I do not want definitions etc to be hardcoded\"* -- the list was a literal inside `_state`."
    cite: "H-98"
    note: >-
      ⚠ THIS ROW IS THE CLOSED SET `combat_band_edges` IS VALIDATED AGAINST, AND `_state` READS IT TOO.
      One owner, so an edge cannot name a quantity the seam does not lift: `_state` builds each
      party's `wound_state` from THIS list and refuses, by name, a member the `WoundTracker` does not
      carry; `combat_band_edges` refuses at load an edge on a member that is not here. The ORDER is
      the order `wound_state` has always been built in (`felled` first), kept so the lifted dict is
      identical to the literal it replaced.
      ⚠ A QUANTITY IS A NUMBER OR A BOOLEAN THE TRACKER COMPUTES, NEVER A DERIVED RATIO. A ratio
      (`health_remaining / health_full`) is a magnitude `wound_harm_models` already reads at its own
      site; an edge over one would be a second reading of the same quantity.
    values: [felled, wounds, max_wounds, health_remaining, health_full]

  estimate_outcomes:
    source: "CP-T03-05 (`H-251`, `-08` AM-C-02): the four ways a personal fight can end, as the player's odds display shows them."
    cite: "H-251"
    note: >-
      THE KEYS OF `seam/wrappers/combat.py::fight_estimate`'s shares, in the order `sigma.odds_of` returns them for
      a row contesting `the body`: the actor felled (the result is the subject's), the subject felled (the actor's),
      a yield (a standing party gave up, the engine's `surrender`), and undecided (the ruled outcome, result 0).
      The ORDER is the tuple's; the shares sum to 1.
    values: [actor_felled, subject_felled, yielded, undecided]

  fight_endings:
    source: "CP-T03-02 (home `proposals/2026-10-23-subsystem-completion/` T03 §2): how each party's fight ended, as the band's Event carries it (`Event.ending`): fight/accept at Felled/Wounded, and capture at any band where an edge is opened."
    cite: "CP-T03-02"
    note: >-
      ONE VALUE PER PARTY, read off the scene by `loop/effects_combat.py::fight_ending`: `felled` (his own band is
      `Felled`, `seam/ladder.py::party_degree` off the lifted `wound_state`), `yielded` (the scene's `surrender` names
      him), `prevailed` (B14.02, D-U1-11a: he is neither felled nor the yielder while the other party is -- the one left
      standing), `undecided` (neither party is felled or yielded). The ORDER is the tuple's: felled, yielded, undecided,
      prevailed.
      [ASSUMPTION; medium; Jordan to correct; revert: the field and the Observation]
    values: [felled, yielded, undecided, prevailed]

  margin_endings:
    source: "SC-P1 (H-284): what a margin provider's contest leaves on its Events"
    note: >-
      THE SOCIAL PROVIDER'S ENDING SHAPE, beside `fight_endings` (the scene's): `Event.ending` of a margin provider's act is
      `((key, value), ...)` in THIS roster's order, built by `loop/resolve.py::_fold` from the result `seam/wrappers/sigma.py::resolve`
      returned and nothing recomputed: `pool` and `ob` the roll's, `net` the draw plus its boost, `margin` the real margin `net - ob`
      the ladder quantises once (the result's `settled_margin`), `terms` `Margin.terms` (the obstacle's named terms in roster order,
      summing to `ob`), `levels` `((source, aggressor n, defender n), ...)` one per `advantage_sources` member, `leverage` the act's
      net sigma. A refusal carries none: no dice were dealt. It names no actor, target or subject, and is no `Claim`'s predicate
      (`test_sc01_provider.py::test_no_claim_predicate_is_a_margin_ending_after_witness`).
    values: ["pool", "ob", "net", "margin", "terms", "levels", "leverage"]

  duel_terms:
    source: "CP-T03-09 (`-08` AM-C-03; home `proposals/2026-10-23-subsystem-completion/` T03 §2): the terms a verb's fight is fought under."
    cite: "AM-C-03"
    note: >-
      WHICH TERMS A VERB'S SCENE IS FOUGHT UNDER -- `verb: term`. TWO ENTRIES: `capture: yield`, the fight ends when a
      party has yielded and the loser is taken into a seat's custody rather than killed (`loop/effects_combat.py`),
      and, since v11 CR-87, `accept: blood` (below). A verb NOT named here fights under the engine's lethal terms
      (`PersonalCombatInput.terms`' default, the string `'death'`), so `fight` is unchanged. READ BY `seam/wrappers/combat.py::combat_input`, which fills
      `PersonalCombatInput.terms` from it -- the ONE path a term reaches the fight by (PC-10b extends this roster and
      adds no second path). ⚠ THE CLOSED SET OF TERMS IS THE ENGINE'S (`modules/combat/wrapper.py::DUEL_TERMS`), NOT
      THIS FILE'S: `engine/season/data` may not import the module, so the loader (`data/verbs.py::DUEL_TERMS_BY_VERB`)
      refuses a verb the table lacks or a non-string, and `combat_input` refuses a value outside the engine's tuple,
      NAMING this roster, before the call -- a term is checked against that tuple and never re-declared here.
      [ASSUMPTION; medium; Jordan to correct; revert: drop this roster and `capture` fights to the death, which is
      `fight`.] ⚠ AN ACT WHOSE `subject` IS A `challenge` Record (`accept`) is fought under that Record's `stakes`
      (`challenge_terms`), read by the same `combat_input` into the same `PersonalCombatInput.terms`; a challenge
      naming no stakes falls through to this roster's `accept` line.
      `accept: blood` (ED-IN-0336, RS-25: *"a duel doesn't have to be lethal"*): a duel whose
      challenge names no stakes (every computed `challenge`: it carries no payload) is fought to the first wound,
      not to the death -- through `duel_terms_of`'s fall-through, the same one path; a challenge that names its
      stakes is still fought under them. [ASSUMPTION; medium; Jordan to correct; revert: drop the `accept` line,
      and the duel is fought at `PersonalCombatInput.terms`' own `'death'` default.]
    values:
      capture: yield
      accept: blood

  challenge_terms:
    source: "v10 PC-10b (RS-25, Jordan 2026-10-14: *a duel doesn't have to be lethal*; H-240 route (1)): the terms a challenge may name."
    cite: "H-240"
    note: >-
      THE CLOSED SET OF A `challenge` RECORD'S `stakes` (`record_kinds.challenge`). Its members are the engine's
      (`modules/combat/wrapper.py::DUEL_TERMS`): `engine/season/data` may not import the module, so the two are held
      equal by a TEST (`engine/season/tests/test_pc10b_challenge_record.py`), never by an import and never re-declared
      unchecked. `_eff_challenge` refuses a `stakes` outside it; a computed challenge names none, and its duel is fought
      under `duel_terms`' `accept` line, `blood` since v11 CR-87. [ASSUMPTION; medium; Jordan to correct -- the three
      terms; revert: no terms, a duel is lethal, as before.]
    values: [yield, blood, death]

  combat_band_edges:
    source: "`H-98`, plan position `8` (closed; `workplans/valoria_master_workplan_v8_part4.md`, retired, at `FORK:7b619328`) -- the edge between the bands was two literals in `seam/ladder.py::combat_degree` (`if st[\"felled\"]` / `st[\"wounds\"] > 0`). Jordan 2026-09-02: *\"I do not want definitions etc to be hardcoded\"*. The bands themselves are `combat_degree_bands`, ruled 2026-09-03/04 as a READ of the scene."
    cite: "H-98"
    keyed_on: combat_degree_bands
    note: >-
      ⚠ ONE EDGE PER BAND EXCEPT THE LAST, KEYED ON `combat_degree_bands`, AND THE LAST IS WHAT IS
      LEFT. `combat_degree` walks the bands in the order that row declares (SEVERITY, WORST FIRST)
      and returns the first whose edge HOLDS -- `quantity` strictly above `above` -- else the final
      band. `Felled` / `Wounded` / (`Untouched`) is therefore exactly the old
      `if felled: Felled; elif wounds > 0: Wounded; else Untouched`, and the SHIPPED values below
      reproduce it. The loader refuses a band with no edge, an edge on a band that row does not
      carry, an edge on the residual band, and an edge on a `quantity` that `wound_quantities` does
      not list (`rosters.load_combat_band_edges`).
      ⚠ `above` IS A COUNT OR THE NAME OF ANOTHER `wound_quantities` MEMBER, NEVER A RATIO AND NEVER
      A THIRD KIND OF THING. `felled` is a boolean the tracker computes and is compared as 0/1, so
      `{quantity: felled, above: 0}` is the engine's own verdict, accepted rather than re-decided
      (Jordan 2026-09-04: *\"the combat engine determines the result there. your code just has to
      accept the result.\"*). It is NOT swept, because sweeping it would re-decide who went down.
      ⚠ ONLY THE `Wounded` EDGE'S `above` IS A SWEPT FIXTURE -- `Fixtures.combat_wounded_above`,
      `None` meaning THIS ROW'S value (so `0` is authored once, here). The arms are on `H-98`:
      `0` (SHIPPED: any wound), `1` (the first wound is not enough), and `max_wounds` (the count
      must EXCEED the engine's own cap: a subject sitting exactly AT `max_wounds` reads Untouched). `wounds` is capped by the tracker at `max_wounds + 1`, so
      `wounds > max_wounds` holds only for a subject who reached the cap and is still standing --
      NOT for nobody; it is the arm at which the `Wounded` band shrinks to that one case.
      ⚠ THIS IS NOT THE FOURTH BAND. A decisive-vs-narrow split has no source in the data and is not
      invented (`combat_degree_bands`' own note); this row moves WHERE the existing split falls.
    edges:
      Felled: {quantity: felled, above: 0}
      Wounded: {quantity: wounds, above: 0}

  wound_harm_models:
    source: "`W-E`. #353's Part E `writes:` column names the CELL and never the VALUE, and no in-chain document says how much body a wound costs. `H-114` measured what the instrument did instead: `harm` defaulted to the person's whole body, so a fold at degree `Wounded` DELETED THE PERSON."
    cite: "H-123"
    note: >-
      HOW MUCH BODY A WOUND COSTS, WHEN THE SCENE SAYS THE SUBJECT BLED AND DID NOT GO DOWN.
      `scene_fraction` is the DEFAULT and it introduces no constant: the body is scaled by the
      fraction of health the fight left standing (`health_remaining / health_full`), both fields
      the engine's own `WoundTracker` computed on Combatants `combat_seam` still holds. That is
      Jordan's 2026-09-04 ruling applied to the magnitude as well as to the band — *the combat
      engine determines the result there* — rather than a number this chain chose.
      ⚠ `total` IS THE CONTROL: `_eff_kill` subtracts `d.get("harm", p.body)`, i.e. the whole body, so
      every wound kills and `Wounded` is indistinguishable from `Felled`. Running this arm re-runs
      that defect deliberately, which is how the degree's worth is measured rather than asserted
      (`CLAUDE.md` §0.1 point 4).
      `none` is the SECOND control and isolates the other half: a wound writes nothing, the fold's
      own write-nothing guard emits the REFUSAL instead of the success, and what is left is only
      the difference the SELECTED WRITE SET makes.
      ⚠ A WOUND CANNOT KILL ON ANY ARM EXCEPT `total`. The band means the engine did not fell this
      person, so the body floors at 1 — `seam/wrappers/combat.py::party_end`'s own floor (*a dying person
      still fights*), followed rather than reinvented.
    values: [scene_fraction, total, none]

  body_mark_models:
    source: "v11 CP-T03-07 (P32, a permanent injury mark). A fight can wound and every recovery heals to the scale, so no fight leaves a lasting mark; `Person.body_ceiling` is the bound a recovery heals toward."
    cite: "H-258"
    note: >-
      WHETHER A FIGHT LEAVES A LASTING MARK. `deepest_gate` is the SHIPPED arm: a party who survives
      a fight at the engine's deepest gate short of felling (`wounds >= max_wounds` on his lifted
      tracker, both `wound_quantities` members) has his `body_ceiling` fall to one below the next
      `band_floors["body"]` floor beneath it, so the marks are as many as the body has floors
      (`loop/effects_combat.py::marked_ceiling`). `none` is the CONTROL: no ceiling moves and
      every outcome is the pre-item tree's (the field itself is still a schema mover). `drawn` (B14.23,
      `U5b_PC_residue` section 7) is NOT shipped: the same survivor at his limit rolls once, on the one
      sampler, against the fixture `mark_ob` -- Failure lowers the ceiling twice, Partial once (as
      `deepest_gate` does), Success and better not at all -- and the mark is told as the Observation `marked`.
    values: [deepest_gate, none, drawn]

  field_degree_bands:
    source: "M4, `ED-IN-0279` clause (a). The token every `march` fold writes -- `seam/ladder.py`'s `field_degree`, analogous to `combat_degree_bands` above."
    row: H-147
    note: >-
      ⚠ ORDERED, AND UNPACKED POSITIONALLY LIKE `combat_degree_bands`. `Declared` is first because
      it is the band ENCOUNTER's own declaration fold writes at RESOLVE (`04 §A.2`, amended
      2026-09-28) -- the seventh-phase design's own deferral token, not a band any subsystem
      grades. `Won` / `Lost` / `Unopposed` are read off `seam/wrappers/mass_battle.py`'s lifted
      `unopposed` marker and each side's `routed` / `conceded` flags, the shape `combat_degree` reads off a scene's own
      `wound_state` one row above.
      ⚠ `Declared` COSTS SOMETHING AND THE COST IS STATED HERE, NOT HIDDEN. `04 §C.4:621` fixes a
      verb at five columns, none conditional on the outcome except through `contests:`; a prize row
      that defers to ENCOUNTER folds once at RESOLVE writing nothing, under this band, because
      nothing has been fought yet. That is the price of the seventh-phase timing Jordan chose
      (M4 planning round 2) over synchronous resolution at RESOLVE, paid in the open rather than
      smuggled into a verb row nobody reads twice.
      CP-T04-06 (B10-12) APPENDS `Invested` LAST, SO THE FOUR POSITIONS ABOVE DO NOT MOVE: the band a `march` under the
      `besiege` posture (`march_postures`) folds on when it meets an opposing side -- no battle is fought, nobody
      relocates, nobody is hurt, and the garrison Sites in the target's subtree lose condition
      (`loop/effects_combat.py::_eff_march`). It is read off the provider's `invested` marker
      (`seam/wrappers/mass_battle.py`), as `Unopposed` is read off `unopposed`.
      B17.01 APPENDS `Drawn` LAST, AFTER `Invested`, so the five positions above do not move: the band of a fought field in
      which both sides are out (routed or conceded) or neither is when the ticks ran down (`seam/ladder.py::field_degree`,
      the one owner of the rule). It writes each side's `body` by its own share and the ration debit, no stance row, and
      leaves every army at its station (`loop/effects_combat.py::_eff_march`).
    values: [Declared, Won, Lost, Unopposed, Invested, Drawn]

  field_casualty_models:
    source: "M4, `ED-IN-0279` clause (a). How much `Person.body` a lost field costs -- `wound_harm_models`'s question above, asked of mass_battle's survivor-ratio result instead of a scene's `WoundTracker`."
    row: H-148
    note: >-
      ⚠ THE MODELS ARE INVENTED, AS `wound_harm_models`' WERE, AND FOR THE SAME REASON: no ruling
      states a magnitude. `total` and `none` are the same two controls that row ships: `total`
      re-runs "losing kills you exactly as winning it does" deliberately, and `none` isolates
      whether the WRITE ITSELF, rather than its magnitude, is what a defeated side's later choices
      track (`CLAUDE.md` §0.1 pt 4 -- a number without a control is not a measurement in either
      direction).
      ⚠ THE DEFAULT IS `scaled_by_degree`, SET THE SAME WAY `wound_harm_model`'s WAS: A READ, NOT
      A CHOICE. Jordan's 2026-09-04 ruling on that row -- *"the combat engine determines the
      result there"* -- is a general principle about who owns a magnitude the engine already
      computed, and `attacker_size_pct`/`defender_size_pct` (`seam/wrappers/mass_battle.py`'s own
      `resolve()` return, read from the real dice-pool engine call at `engine_resolve_field`, not
      invented in this chain) is that same shape of number for a field battle. No fresh ruling
      settles the magnitude, so this row still ships `assumption`-graded -- but the choice among
      the three arms is settled by that precedent, not by a pending measurement.
    values: [scaled_by_degree, total, none]

  field_winner_casualty_arms:
    source: "CR-24 (M4 Ask B (b)). Whether the WINNING side of a fought field takes casualties too -- `field_casualty_models`' question asked of the winner."
    row: H-360
    note: >-
      `off` is the field as ED-IN-0279 left it (a lost field writes the loser only; nothing is specified for the
      winner). `engine` writes each winner's `body` by his own side's or subunit's survivor ratio, `body` only: no
      stance row, no morale hit, and a winner is never appended to `touched`. Under `field_casualty_model: total` a
      winner takes the same body-to-0 and the same death write a loser does; `none` writes no body on either side.
    values: ["off", engine]     # quoted: bare `off` is YAML 1.1 False

  march_postures:
    source: "CP-T04-06 (B10-12; AM-C-11 REPAIR). How a `march` meets an opposing side: `storm` fights the field (today); `besiege` sits before the walls and wears the garrison."
    note: >-
      THE POSTURE A `march` DECLARES, A PAYLOAD KEY (`posture`) ON `confer`'s `term` PRECEDENT, NOT A `requires_operands`
      MEMBER: the closed operand vocabulary stays closed. Read by `seam/wrappers/mass_battle.py::resolve`, which answers
      an opposed `besiege` as `Invested` (no battle, `field_degree_bands`) and an unopposed one as `Unopposed`, as a storm
      would; `storm` is the default for an act that declares none. `loop/effects_combat.py::_eff_march` writes the wear on
      the `Invested` band: `condition -= _fall(w, site)` DIRECTLY, for each garrison Site in the target's subtree, because
      wear staged through `World.stage` at ENCOUNTER is never applied (`loop/encounter.py` has no `take_staged`; the
      accumulator is RESOLVE-scoped).
      ⚠ SHIPPED `[storm]`, AND A ONE-MEMBER ROSTER FANS NOTHING: `rosters.yaml: choice_sourced` ranges the posture, and
      `decision/options.py::_fanned_choices` skips a key whose range has one member, so no `march` Candidate carries a
      `posture` and every shipped season is what it was. `besiege` joins this list in its own declared-mover commit, whose
      body must state that `restore` executed on a garrison Site in a natural run (seeds 0-2) after REM-22: until then
      besiege-then-storm dominates storm, since the wear is permanent. `share` floors `n` at 1, so at a rung with one
      person present a single besiege act zeroes the walls. [ASSUMPTION; medium; Jordan to correct; revert: delete the
      roster, the `choice_sourced` line and the `Invested` band, and a march is a storm.]
    values: [storm]

  march_target_kinds:
    source: "M4, `ED-IN-0279` clause (a). What a `march` may target."
    row: H-149
    note: >-
      ⚠ A CLOSED SET, NOT AN OPEN ONE, AND THE ROSTER IS CLOSED FOR A REASON BOUND ELSEWHERE. Its members are
      `settlement` and, on Jordan's ruling (ED-IN-0306 phase 4), `territory` (a territory is marched on, occupied
      and seized).
      Person containment never terminates at a settlement rung -- every person's `contain` targets
      a `home` building beneath one (`harness/populated.py`) -- and `contain_ascends`
      (`state/world.py`) forbids a sideways move to a foreign settlement, so "the exact rung
      marched to" is vacuous read literally. Jordan's ruling (M4 planning round 2) is "settlement
      plus everything under it", which only a `Rung` of kind `settlement` can anchor -- a subtree
      read, matching `world_q.density`'s existing composition rather than a new one. #353 names no
      other march target and this roster invented none; a member is added the moment a kind is ruled, as
      `territory` was. `subtree_occupation_kinds` below says how each is occupied.
    values: [settlement, territory]

  subtree_occupation_kinds:
    source: "ED-IN-0306 phase 4. Which `march_target_kinds` are occupied by standing ANYWHERE UNDER them."
    note: >-
      A settlement's people stand in buildings beneath it (`march_target_kinds`' note), so a faction is
      occupying a settlement when it is mustered anywhere in its subtree. A territory is not occupied that way:
      standing in one town of a territory is not occupying the territory, and reading it so would let one won
      settlement seize the land around it. A territory is occupied by an army that has ARRIVED AT IT (a won or
      unopposed `march` on the territory), and an army occupying a territory occupies the settlements beneath
      it as well, so it may seize them (`world_q.occupies`). Every `march_target_kinds` member not listed here
      is occupied by standing at it.
    values: [settlement]

  arrival_only_kinds:
    source: "ED-IN-0306 phase 5. Which rung kinds a person is placed at ONLY by a `march`'s arrival."
    note: >-
      A territory is occupied by an army standing AT it (`subtree_occupation_kinds`), and occupation is presence, so a
      `move` or a `migrate` that could seat a person at a territory would let one member of a faction walk onto a
      defended territory and seize it with no field. Both decline a destination of these kinds; a won or unopposed
      `march` is the only act that writes presence there (`_eff_march`'s relocation).
    values: [territory]

  raze_target_kinds:
    source: "ED-IN-0306 phase 4. What `raze` may end."
    note: >-
      `raze` deletes the rung and closes every edge naming it. It stays a settlement's act: `march_target_kinds`
      gained the territory (a territory is marched on, occupied and seized), and razing the land a duchy stands on
      is not a thing any act in the game does.
    values: [settlement]

  witness_channel_predicates:
    source: "#353 §20 names the five witness channels and gives NONE of them a predicate. `S61`: *\"WITNESS AS SPECIFIED FANS EVERY EVENT TO EVERY PERSON. Nothing said in private is private.\"*"
    cite: "H-33"
    note: >-
      ⚠ THESE PREDICATES ARE AN INJECTED DEFAULT, NOT SOMETHING #353 STATES. `H-33` is graded
      `assumption` for exactly that reason, and its declared sweep is `total / presence-only / all
      five`.
      ⚠ **`total` IS THE CONTROL AND THE SPECIFIED BEHAVIOUR, AND IT IS NOT THE DEFAULT**
      (`ED-IN-0205`). `R7` chose the architecture model over the echo model -- *legitimacy falls where
      the news has reached* -- and total fan-out is that echo model at the deposit layer. The
      shipped arm is `all_five`, in `data/fixtures.py`. **The GRADE does not move with it**: `R7`
      rules which arm ships and says nothing about what these five predicates are, so they remain
      an injected default and this row stays `assumption`.
      ⚠ **UNDER `all_five` THESE PREDICATES DECIDE EVERY DEPOSIT.** Under `total`, `observers_for`
      returned everyone and they were never consulted. Only THREE of the five can admit anyone in a
      world the fold can currently drive (`chronicle` matches nobody, `post_remit` needs an obligee
      standing at the seat an act was exercised through;
      `test_w6_every_named_channel_has_a_predicate_and_they_are_data` asserts exactly which two are
      inert).
      Every predicate below is computed from WORLD STATE and never from a recipient the emitter
      declared -- §19.3 is explicit that an Event carries NO TARGET, *"observers are computed at
      WITNESS from presence; the emitter declares no recipient"*, so a channel that needed the
      emitter to name someone would be a different design and not a fill of this hole.
      ⚠ `chronicle` IS DELIBERATELY NOT `everyone`. A public channel that matched every person
      would make the `all_five` union identical to `total`, and the sweep would have two points
      that are the same arm wearing different names -- an arrangement that cannot measure
      anything. It is the MATTER-OF-RECORD channel: what a binding decision emits is public,
      because a binding decision is the design's own category for an act whose effect is
      institutional rather than private.
    # ⚠ THE NAMES ARE NOT REPEATED HERE. `witness_channels` above is the one place the five are
    # named; this row carries only what each one MEANS. The names are loaded by `data/rosters.py`
    # (`WITNESS_CHANNELS`) and read by `epistemic.py`, which builds `CHANNEL_PREDICATES` from them
    # and picks the `all_five` arm with them. ⚠ This file is MECHANISM under `CLAUDE.md` §0.05 --
    # code opens it at runtime. A `values:` key listing the five again would be a definition living
    # twice in one file.
    predicates:
      co_located:    "the person shares a live `contain` Tenure with the Event's place -- the presence index S28 already builds and the fan-out never read"
      document_key:  "the person holds a live `hold` Tenure over something THIS EVENT CHANGED -- a subject named in `changes[]` (a Record, a store). ⚠ THIS ROW READ *the Event's SUBJECT* until `R8.4`, and that clause is why the channel could not fire on a single act: every fold-emitted Event sets `subject = a.actor` and no `hold` takes a PERSON as object, so the equality held only on `MATTER`/`CALENDAR` kinds, which carry no verb and no actor. The parenthetical was always right and the clause it qualified was wrong. Corrected here in the same change as the predicate, because this row is where the meaning lives (see the note above) and `R5` quotes it verbatim as the channel's definition"
      witness_key:   "the person IS the Event's anchor (`state/attribution.py::anchor_of` -- the actor where one acted, the written thing otherwise; it read the deleted `Event.subject` until G1b), or shares a live `knot` Tenure with it -- S28's knot deposit, which already reuses the Event id"
      post_remit:    "the person is an OBLIGEE of the seat the Event's act was exercised through (`Act.via`) -- a live `oblige` Tenure to it, read through `queries/world_q.py::establishment_of`, the one owner of that set -- AND stands AT that seat: the seat's rung is where they are or above it (`state/gate.py::purview_reaches`). Plan position `17a`, r2 item 9. ⚠ THIS ROW READ *the person holds a live office Tenure whose remit covers the verb that emitted this kind* until `17a` -- a remit-holder learning of every covered act anywhere in the realm, the place-blind broadcast r2 `02` §A.7 and `01` both delete. An Event no act caused, or an act exercised through no seat, admits nobody through this predicate. ONE other admission rides this channel's source (`inferred`) and its live/off switch, in `loop/witness.py` (v9 IN-22): an ACTORLESS Event's observation READS (MATTER's recorded shortfall) go to the holders of a live seat whose purview reaches the read rung (`queries/world_q.py::governors_of`) -- reads only, never an event-kind, `seen` or `content:` claim"
      chronicle:     "the kind is emitted by a `binding_decision` verb -- a matter of record, and public because the decision is institutional"

  observation_terms:
    source: "`R8.1`, `references/design_rulings_2026-09-06.md` -- Jordan: *\"I saw this person doing y, but I don't know what y is\"*, *\"someone looking like y did x\"*, *\"they saw someone skulking around for no reason they could discern\"*. One `seen` claim per (witness, event), BESIDE the two existing deposits; its value is a frozen struct of these four terms, each `None` where the channel withholds it"
    cite: "R8"
    open: true
    ordered: true
    note: >-
      `values:` IS THE STRUCT, IN FIELD ORDER -- `epistemic.Seen` refuses at import if its fields
      and this list differ, and every term needs a `_term_<name>` reader there (the
      `CHANNEL_PREDICATES` precedent: a named member with no reader RAISES, never quietly reads
      `None`). `stratum` is the coarse WHAT (`strata`), never the verb TOKEN -- a witness can say
      *someone was doing something social* without naming `tell`. ⚠ Not never the INFORMATION:
      `movement` has two members (`move`, `migrate`), so a `movement` witness does not know which
      (`epistemic._term_stratum`'s docstring). `marks` is the actor's appearance and carries ONE
      member, the actor's `Person.heritage` (descent): `(heritage,)` where it is authored and `()`
      where it is not (`epistemic._term_marks`), public at co-location and deposited true and
      verbatim, as `who` is. `()` means *seen, and nothing describable*, and `None` means *this
      channel does not show a body at all*. `who` is the actor's id. `why` is an antecedent claim the witness holds (below), not a motive.
      ⚠ `supplied_by:` IS WHAT EACH CHANNEL SHOWS, and a witness's struct is the UNION over the
      channels that admit them under the live `fan_out_mode` (`epistemic.live_channels`). The
      `total` arm is `H-33`'s control and shows EVERY term to every witness, so this table is read
      only by the narrow arms. Two cells are ruled: `R8.5` quotes the ratified line *"a co-located
      witness saw who acted; a document holder saw only that the document changed"* -- so
      `document_key` shows NOTHING, and its witness holds an all-`None` struct, which IS deposited
      (the claim's subject still says WHERE something happened). `witness_key`, `post_remit` and
      `chronicle` are unruled: they withhold rather than invent, and are an injected default in
      `H-33`'s sense, exactly as the channel predicates themselves are.
      `why` IS THE ANTECEDENT A WITNESS HOLDS AND MAY CONNECT, NOT THE ACTOR'S MOTIVE (B09.17, `R8.4` narrowed; the engine
      keeps no motive: `Candidate.why` is dropped at `pack_scenes` and `Act` carries none): the id of a claim in the witness's
      OWN ledger that was deposited from an antecedent Event of the one he witnessed (`epistemic._term_why`). A channel that
      supplies `why` (`co_located`, `witness_key`) makes the witness ELIGIBLE; whether he connects them is one keyed draw at
      `Fixtures connection_chance` (`H-458`), which ships 0.0, so no deposit carries `why` until B98 raises it, and case 4 (*no
      discernible reason*) is still every deposit. `document_key` never supplies it (`R8.5`, ruled). `Person.heritage` has ONE writer, the
      world build (`data/cast.py::heritage_of`), and `marks` shows it wherever `who` is shown -- so
      case 2 (*someone looking like y*, `who=None`) is supported by the struct and reached by
      nothing until a recognition producer exists (`R8.2`).
    values: [stratum, marks, who, why]
    deposit:
      predicate: seen
    supplied_by:
      co_located:   [stratum, marks, who, why]
      witness_key:  [stratum, who, why]
      document_key: []
      post_remit:   [stratum]
      chronicle:    [stratum]

  # ── WHAT THE SEASON LOOP IS ───────────────────────────────────────────────────────────────────
  # RULED BY JORDAN, 2026-09-05:
  #   *"season loop governs inputs into the seams and collected outputs. it's the processor of all
  #    events, and it enables events to occur without a scene being called for not players"*
  #   *"only players really need the scene in its entirety"*
  #
  # THREE PROPERTIES, and the loop already implements two of them — verified in `SeasonDriver`:
  #
  # 1. IT MARSHALS THE SEAMS. Nothing crosses a seam except what the loop puts in, and nothing
  #    returns except what the loop collects. `deliberate` produces the acts, `resolve` is where a
  #    contest is called (S39: exactly one place), `witness` collects. A subsystem never reaches
  #    into the world and the world never reaches into a subsystem.
  #
  # 2. IT IS THE PROCESSOR OF ALL EVENTS — ONE LOG, NOT TWO (S19.5). `season()` merges both
  #    channels before deposit: `self.witness(token, pending_matter + events)` (`loop/driver.py`).
  #    Already true in code.
  #
  # 3. IT ENABLES EVENTS WITHOUT A SCENE, FOR NON-PLAYERS. `matter(actorless)` is that channel and
  #    it already exists: an actorless Event has NO ACTOR by type — "attribution is a per-witness
  #    Claim" — so the world can move with nobody acting and nobody watching. ⚠ THIS IS NERS **R**'s
  #    half with no player in it (§0.06: *emergent hooks and scenarios WITHOUT player involvement*),
  #    and it is the property that makes the world generate drama when nobody is looking.
  #
  # ⚠ SO THERE ARE TWO WAYS INTO THE EVENT STREAM AND THEY ARE NOT THE SAME COST:
  #     ACTORLESS  — `matter()`, no scene, no deliberation, no player. The world moving.
  #     ACTED      — `deliberate()` -> `resolve()`, a person chose. A seam may be called here.
  #   Both converge at `witness()` into one log. A mode of play that needs no scene attaches to the
  #   first channel; one that plays out attaches to the second.
  #
  # ⚠ AND THE SCENE IS PLAYER GRANULARITY, NOT WORLD GRANULARITY. Jordan: *"only players really
  # need the scene in its entirety."* An NPC's action does not require a scene to be constructed and
  # played out — it needs a resolution and an event. This binds R-03's scene tick directly: the tick
  # must give a PLAYER scene-by-scene granularity WITHOUT forcing every NPC in the realm through a
  # full scene, or the cost of a season scales with the cast rather than with the players. Do not
  # implement the tick as "every person gets a scene per round".

  # ── THE SEAMS ─────────────────────────────────────────────────────────────────────────────────
  # RULED BY JORDAN, 2026-09-05, and this is the architecture, not a taxonomy:
  #   *"what matters is the seams"*
  #   *"each mode of play is separately called FROM the season loop"*
  #   *"ignore their shapes. we will be rebuilding probably"*
  #
  # THE SEASON LOOP IS THE DRIVER. Every mode of play is a CALL OUT AND A RETURN BACK — one uniform
  # pattern, differing only in where it attaches and what crosses. A seam survives a rebuild of the
  # subsystem behind it; a signature does not, which is why nothing here cites one.
  #
  # A seam declares three things and only three: WHERE IT ATTACHES, WHAT GOES IN, WHAT COMES BACK.
  #
  # | mode of play        | attaches at        | in | out | state |
  # |---------------------|--------------------|----|-----|-------|
  # | personal combat     | RESOLVE (S39)      | claimants, prize, causes | a degree | BUILT — `modules/combat/fight.py`, called by `seam/wrappers/combat.py`. Jordan: "combat engine isn't done" |
  # | social contest      | RESOLVE (S39)      | claimants, prize, causes | a degree | BUILT, σ-LEVERAGE MODE — `a standing`/`a matter` are rolled by `modules/social_contest/roll.py` (a `Margin`), called by `seam/wrappers/sigma.py`, provider `social_contest` (v9 SC-01 steps 13 + 15); the proceedings nested run is unbuilt |
  # | mass battle         | ENCOUNTER (`a field`) | claimants, prize, causes | a degree | BUILT — `modules/mass_battle/massbattle.py`, called by `seam/wrappers/mass_battle.py` (the `contest_subsystems` row `a field`) |
  # | investigation       | RESOLVE (FI-01)    | actor, subject (`examine`: site) | a degree | ITS OWN KIND — not a contest: GRADED, by the roll the `graded_tasks` row names (below), with no prize |
  # | settlement mgmt     | MATTER (+ ENCOUNTER: `provision`) | stores, sites, residents | stores, yield, a draw | CALLED — `modules/settlements/` (`settlements.subsist` and `settlements.produce`, `step_call`s MATTER makes; the `query` entries `world_q` makes), v9 IN-07 |
  # | faction mgmt        | UNRULED            | UNRULED | UNRULED | absent from the loop entirely |
  # | character dev       | UNRULED            | UNRULED | UNRULED | no creation, no progression, no chronicle |
  #
  # ⚠ THE CONTEST ROWS' CONTRACT IS RULED AND THE UNRULED ROWS ARE HONEST BLANKS. S39 fixes the contest attach point at
  # RESOLVE — "exactly one place" — and its return at a degree. The blanks are Jordan questions, not
  # session guesses: writing a plausible IN/OUT for a mode nobody has ruled would be inventing the
  # architecture rather than recording it, and the seam is precisely the thing that must not be
  # invented.
  #
  # ⚠ SETTLEMENT IS CALLED. MATTER calls the `settlements` module (`modules/settlements/`), so the loop
  # has no inline economy and there is one ladder for each quantity (two would be a NERS **S** defect,
  # §0.06, *calculations consistent in methodology*).
  #
  # ⚠ FACTION CANNOT BE A STRAIGHT PORT even once its seam is ruled. Layer 1 PART D rows 1/8/14
  # forbid a faction that acts, a stored aggregate, and a banner holding territory, so
  # `game_state.Faction` cannot cross a seam as-is; what crosses must be re-expressed in the loop's
  # shape (a Faction is a type with no verbs; `holdings` is a Query over members' `hold` Tenures).
  #
  # ⚠ INVESTIGATION MUST NOT BE MADE A CONTEST TO BECOME GRADEABLE. Six investigation acts carry no
  # `contests:` cell and that is CORRECT — they are not ungraded contests but a different kind of
  # resolution whose seam is unbuilt. Giving them a prize so the existing machinery can grade them
  # is scripting drift: forcing one mechanism's shape onto another because it is the one that exists.
  # ⚠ v9 FI-01 (`ED-FI-0009`, J-22 option (A)) GRADES THEM WITHOUT A PRIZE: `graded_tasks`, below,
  # is a ROUTING row -- verb -> the provider and module entry that roll it -- read by the loop
  # (`loop/resolve.py::_grade`), never by `contest()` and never by `manifest.resolve("contest", …)`.
  # It carries no `module:` and no prize key, so no `contest_subsystems` reader can see it.
  #
  # Nothing below declares a seam that does not exist. Declaring one would be the dead-carrier
  # defect this file names elsewhere — a carrier built before its reader.

  graded_tasks:
    source: >-
      v9 FI-01 (`ED-FI-0009`; J-22 answered option (A)): the inquiries are graded by degree, as
      ladder step 3 answered (RESOLVE -> WITNESS, "Claims graded by degree; Failure emits
      `finding.none` and deposits nothing"), through a declared routing column that is NOT a prize
      and NOT a `contests:` shape. A-21: one roll owner (S27.2) -- the `social_contest` module's
      entry, with the obstacle at the host input builder's non-person default.
    row: H-111
    note: >-
      ⚠ A ROUTE, NOT A PRIZE. Each row names the provider registered under `@provider("contest", …)`
      and the composition role that provider calls; the pool is `seam/wrappers/sigma.py::faculty`
      (the verb's `capability:` column, `descriptors.CAPABILITIES`, else the swept `pool_default`) and the obstacle the module's own
      (`modules/social_contest/roll.py::obstacle`: the row's `difficulty:` level plus `opposed_ob(pool_default)` where no person is opposite, or
      plus `opposed_ob` of the person's skill score and resisting attribute, `sigma.py::_opposing` -- an inquiry's subject can be a person-kind Rung). The pair must be one a `contest_subsystems` prize row already
      binds (`manifest/registry.py::check_graded_tasks`), so this row adds no roll and no
      resolver. the verb table's `capability:` column now names `inquiry` for the three (REM-30, B10-10; the rows were deferred at
      CP-T01-01): an inquirer who HOLDS an `inquiry` key rolls it, and one who holds none still rolls
      `pool_default` (`seam/wrappers/sigma.py::faculty`).
      ⚠ THREE ROWS, AND THE OTHER THREE ARE NOT GRADED: `interview` is a PROMPT (#453 K-36: the
      questioned person answers by their own `tell`, so there is no degree on the asker);
      `reconstruct` waits on a value space nothing supplies (K-37: no invented number); `thread_read`
      waits on that (its H-85 Thread Sensitivity carrier and gate landed at v9 PC-06 K-3). `surveil`'s Person case is absent
      from its row (one cell binds one kind) and waits on ED-FI-0009. A verb that waits keeps its

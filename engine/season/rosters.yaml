      weight times an alignment cell); `stance` counts each deed in valence steps (`person_q.deed_steps`: the cosine of the holder's projected pursuits
      against the deed kind's alignment row, a paired deed's times its `_bond`), the unit of a stance row's valence, so a deed is at most one step before the gains.
      [ASSUMPTION: the roster's name and shape -- basis: `scar_holds`, B10.07's two-arm string roster; Jordan to correct.]
    values: [raw, stance]

  deed_counterparties:
    source: >-
      B10.20 (`U5a_CHAR_owed_amendments` §4, amending `02_CHAR_relations_have_a_ground`; F-PES-CHAR-08): whether a deed done to a person is weighed by
      the judge's bond to the one it was done to.
    note: >-

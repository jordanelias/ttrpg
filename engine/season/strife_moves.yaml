# The 40 move codes of the strife study (the artifact "Mechanics of Strife to c. 1600"), as a READING
# of what the season loop can produce. It resolves nothing: `harness/strife.py` reads it to report
# which codes the loop can reach, and which it did reach, in a seeded run.
#
# Each row:
#   code        the study's two-letter code (NOTE and OTH are not moves and are not rows)
#   name        the study's name for the move
#   verbs       verbs of `verb_table.yaml` whose act can produce the move (loader refuses a name not there)
#   kinds       Event kinds whose presence in the log counts as an instance (loader refuses a kind the
#               loop does not declare)
#   needs       what a kind alone cannot tell, so the count is an upper bound:
#                 side     the study splits the move by side (authority / rebels / outside power)
#                 office   the kind covers any person or seat, the move only an office-holder
#                 context  the move is defined by what precedes it (first outbreak, later trouble)
#   dark        a switch or value that ships off and so keeps the move out of default play
#   gap         no verb or kind in the tree produces the move
#
# [ASSUMPTION; medium; Jordan to correct; revert: delete this file, `data/strife.py` and
# `harness/strife.py`] Every `verbs` and `kinds` entry is a reading of `verb_table.yaml`'s `emits:`
# column by name, not an execution. The instrument's observed count is the check, and a count of 0
# over several seeds is a finding about default play, not about the table.

row_keys: [code, name, verbs, kinds, needs, dark, gap]
needs_vocabulary: [side, office, context]

moves:
  - {code: SH,   name: Natural shock,           verbs: [],                                kinds: [],                                              gap: "season_factor_draw ships () and calamity bands are unbuilt (CP-T10-02); no Event is emitted for a shock"}
  - {code: DR,   name: Ruler dies,              verbs: [fight],                           kinds: [person.died],                                     needs: [office], dark: "age_step and illness_rate ship 0.0"}
  - {code: IN,   name: Successor installed,     verbs: [succeed, confer, establish],      kinds: [succession.claimed, tenure.opened]}
  - {code: IM,   name: New burden,              verbs: [issue, requisition, transfer, oblige], kinds: [dispensation.issued, requisition.taken, duty.taken]}
  - {code: BR,   name: Breach of right,         verbs: [revoke, arrest, seize],           kinds: [tenure.closed, arrest.made, record.seized],      needs: [side, office]}
  - {code: OW,   name: Outside war,             verbs: [march],                           kinds: [march.declared, field.won, field.lost],           needs: [side], dark: "build_realm foreign=False"}
  - {code: PT,   name: Petition or demand,      verbs: [petition, carry],                 kinds: [petition.filed, petition.carried]}
  - {code: MO,   name: Mobilization,            verbs: [recruit, form_unit, assign_troops, convene], kinds: [army.recruited, army.formed, army.assigned, date.scheduled], needs: [side]}
  - {code: OP,   name: Rising begins,           verbs: [march, fight, raze, seize],       kinds: [march.declared, rung.seized, rung.razed],       needs: [side, context]}
  - {code: RF,   name: Refusal or mutiny,       verbs: ["evade / defy"],                  kinds: [compliance.withheld],                              needs: [side]}
  - {code: VI,   name: Violence or plunder,     verbs: [fight, raze, sabotage, requisition], kinds: [rung.razed, site.damaged, requisition.taken],  needs: [side]}
  - {code: SZ,   name: Seizure,                 verbs: [seize, march],                    kinds: [rung.seized, record.seized, field.unopposed]}
  - {code: RG,   name: Rival government,        verbs: [establish, found, convene],       kinds: [office.established, rung.founded],                 needs: [side]}
  - {code: CL,   name: Claim or deposition,     verbs: [succeed, revoke],                 kinds: [succession.claimed],                               needs: [side]}
  - {code: SP,   name: Spread or joining,       verbs: [march, recruit, commit],          kinds: [army.recruited, commitment.made],               needs: [context]}
  - {code: FR,   name: Force sent,              verbs: [march, dispatch, order_unit],     kinds: [march.declared, army.arrived, order.given],     needs: [side]}
  - {code: NG,   name: Talks,                   verbs: [speak, argue, convene, covenant, determine], kinds: [argument.won, argument.lost, covenant.offered, matter.determined]}
  - {code: CO,   name: Concession,              verbs: [issue, give, transfer, pardon],  kinds: [dispensation.issued, record.given, transfer.made], needs: [side]}
  - {code: CP,   name: Co-option,               verbs: [transfer, give, confer],          kinds: [transfer.made, record.given, tenure.opened],   needs: [side]}
  - {code: RU,   name: Refusal or inaction,     verbs: ["evade / defy", comply],          kinds: [compliance.withheld, duty.refused],               needs: [office]}
  - {code: RV,   name: Grant revoked,           verbs: [revoke, destroy_record],          kinds: [tenure.closed, record.destroyed],                  needs: [context]}
  - {code: CH,   name: Religious sanction,      verbs: [],                                kinds: [],                                                 gap: "no verb or Event kind names a church sanction; ban/detain tenures exist but no church seat issues them"}
  - {code: WN,   name: Siege or battle,         verbs: [march, fight, raze],              kinds: [march.declared, field.won, field.lost]}
  - {code: WA,   name: Authority wins,          verbs: [march, fight],                    kinds: [field.won, field.lost],                            needs: [side]}
  - {code: WR,   name: Rising wins,             verbs: [march, fight],                    kinds: [field.won, field.lost],                            needs: [side]}
  - {code: FA,   name: Authority flees,         verbs: [move, migrate],                   kinds: [travel.moved, residence.changed],                  needs: [side, context]}
  - {code: RT,   name: Rising retreats,         verbs: [move, migrate],                   kinds: [travel.moved, residence.changed],                  needs: [side, context]}
  - {code: SB,   name: Surrender,               verbs: [give, covenant],                  kinds: [rung.ceded, field.unopposed],                      needs: [side]}
  - {code: DA,   name: Defection or split,      verbs: [release, commit, forgive],        kinds: [commitment.ended, stance.moved],                 needs: [side]}
  - {code: KL,   name: Leader killed,           verbs: [fight],                           kinds: [person.died],                                     needs: [side, office]}
  - {code: CA,   name: Leader captured,         verbs: [arrest],                          kinds: [arrest.made],                                      needs: [side, office]}
  - {code: XA,   name: Outside power,           verbs: [march, tell, petition],           kinds: [march.declared, news.told],                       needs: [side], dark: "build_realm foreign=False"}
  - {code: AM,   name: Pardon or amnesty,       verbs: [pardon],                          kinds: [detention.ended, ban.ended]}
  - {code: DN,   name: Leader dies,             verbs: [],                                kinds: [person.died],                                     needs: [side, office], dark: "age_step and illness_rate ship 0.0"}
  - {code: XS,   name: Settlement,              verbs: [covenant, determine, issue],      kinds: [covenant.offered, matter.determined, dispensation.issued]}
  - {code: XN,   name: Regime or border,        verbs: [seize, give, succeed],            kinds: [rung.seized, rung.ceded, succession.claimed],     needs: [context]}
  - {code: XE,   name: Leader executed,         verbs: [],                                kinds: [],                                                 gap: "no verb puts a held person to death by an authority's act; fight is the only killing verb"}
  - {code: PU,   name: Punishment,              verbs: [arrest, raze, determine],         kinds: [arrest.made, rung.razed, matter.determined],       needs: [side]}
  - {code: PC,   name: Penalty on place,        verbs: [requisition, issue, raze],        kinds: [requisition.taken, dispensation.issued, rung.razed], needs: [side]}
  - {code: XP,   name: Trouble persists,        verbs: [],                                kinds: [],                                                 needs: [context], gap: "defined by later risings the dossier links; a reading over the log, not a verb"}

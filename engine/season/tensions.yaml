# `engine/season/tensions.yaml` -- WORLD-GEN CONTENT: the Tensions deck. B12b.45 (CL-EVENTS commit (3)); the loader is `data/tensions.py`, the ONE
# reader, which refuses every key outside the schema below. `boot/realm.py::build_realm(tensions=True)` draws ONE card, equally likely, at the
# world's making; it is read once at build and by no step of the season loop, and it adds no World field. `tensions=False` (the default) draws
# nothing, so the realm is the realm it was whatever the deck holds. B12b.46 (CL-EVENTS commit (4)) ships the six cards below.
#
# A TENSION is a strain drawn at the world's making that sets some people's aims (`rosters.yaml: tension_effects`' note). It is the world's
# starting weather, not an event: it names no date and fires on no condition, so nothing in it can be late, missed or answered.
#
# CARD SCHEMA (one card = one row):
#   id:       the card's id. Unique.
#   text:     what the strain is, for display.
#   source:   a provenance string (`goals.yaml`'s precedent).
#   effects:  a list, possibly empty, of effects, each `{kind: <tension_effects member>, ...}` and the kind's own keys:
#               goal         -> `goal: <a goals.yaml row, whole>`. It is parsed TOGETHER WITH `goals.yaml`'s rows by `data/goals.py::parse`,
#                               so its id, org, seats and `derives` resolve in one pass under the one validator; its id may not be a
#                               `goals.yaml` id. It is seeded by `boot/realm.py::seed_goals` beside `goals.yaml`'s own rows.
#               yield_scale  -> `territory: <geography territory code>`, `scale: <number > 0>`: the territory's season factor is multiplied by
#                               it for the world's life (`Fixtures territory_yield_scale`, read by `world_q.season_factor_of`). A territory
#                               is scaled once per card.
#   choose_one:  not a card key. Anywhere a value stands in an effect's goal row, `{choose_one: [a, b, ...]}` stands for ONE of the listed
#               values, picked at the draw by the factory keyed on (the card's id, the list's ordinal in the card). A list may not be empty,
#               and every combination of picks must load: the loader parses them all.
#
# NOT DATA OF A CARD (M20's line applied to a card), each refused by name at its key: a date, a deadline or a firing condition (`fires_at`,
# `deadline`, `when`), an outcome, a write to standing, a seat, a tenure or a stance of a person, and the keys `closing`, `successor` and `deal`.
# A card says what is strained; what anyone does about it is the people's.
#
# THE SIX CARDS (B12b.46, CL-EVENTS commit (4); D-19: authored values drafted here and ratified at the batch's merge). Each is a card of
# the archived 6-card fuse deck (`conflict_architecture_proposal.md:127-146`, quarantined under `.designs/`, ARCHIVED-NOT-CANON: intent and
# history only), whose `source:` quotes its archived row. The archived deck's S8+ events, its fuses and its aversion window are NOT carried:
# each names a date, a firing condition or an outcome, which a card may not hold (the list above). What a card keeps is the strain: whose
# aims it sets toward what. Every value -- the plotters, the targets, the seat, the rung, the scale, the stance and every pursuit weight --
# is `[ASSUMPTION; medium; Jordan to correct]`, and each card's revert is named in its own `source:`.
tensions:
  - id: tension_royal_crisis
    text: the succession is in question, and a faction outside the Crown means to see a royal seat emptied
    source: >-
      conflict_architecture_proposal.md:135 (archived, intent): "| 1 | **Royal Crisis** | T1 Crown-Church friction + succession | One
      Royal family member assassinated (sub-roll for target) |". The archive's sub-roll for the target is the seat's `choose_one`; the
      assassination is an outcome and is the people's, not the card's. [ASSUMPTION; medium; Jordan to correct; revert: the row goes]
    effects:
      - kind: goal
        goal:
          id: goal_tension_royal_crisis
          org: {faction: {choose_one: [Varfell, Restoration Movement, Hafenmark]}}
          text: the holder of a royal seat should be brought down
          object: {kind: seat_holders, seats: [{choose_one: [off_king, off_widow_regent, off_heir]}]}
          stance: -1
          pursuits: {liberty: 0.5, reputation: 0.5}
          source: >-
            tensions.yaml tension_royal_crisis (B12b.46). The plotters (Varfell, the Restoration Movement, Hafenmark) and the targets
            (the King, the widow-regent, the Heir) are each one keyed pick. [ASSUMPTION; medium; Jordan to correct -- the plotters, the targets,
            the weights; revert: the card's row goes]

  - id: tension_feldmark_famine
    text: the Crown's breadbasket is failing, and Feldmark yields three quarters of what it should for as long as the world lasts
    source: >-
      conflict_architecture_proposal.md:136 (archived, intent): "| 2 | **Feldmark Famine** | T5 Crown breadbasket | Prosperity collapse in
      Crown's food supply → economic crisis |". The collapse and the crisis are outcomes; the card keeps the strain, a lean harvest on T5
      (Feldmark, `valoria_geography_v30.yaml` `sub: Breadbasket`). [ASSUMPTION; medium; Jordan to correct -- the scale 0.75; revert: 1.0]
    effects:
      - {kind: yield_scale, territory: T5, scale: 0.75}

  - id: tension_cardinal_independence
    text: a Cardinal looks past the Holy See to the Crown's own capital, as a see of his to govern
    source: >-
      conflict_architecture_proposal.md:137 (archived, intent): "| 3 | **Cardinal Independence** | T1 + T9 Church internal | Rogue Cardinal
      unilaterally appoints bishop-governor in Crown settlement |". The appointment is an outcome; the card keeps the Cardinal's attention
      on the Crown's seat settlement (Valorsplatz, `set_s_001`). [ASSUMPTION; medium; Jordan to correct -- which Cardinal; revert: the row
      goes]
    effects:
      - kind: goal
        goal:
          id: goal_tension_cardinal_independence
          org: {seat: off_cardinal_prudence}
          text: Valorsplatz should answer to the Cardinal's own hand
          object: {kind: rung, rung: set_s_001}
          pursuits: {doctrine: 0.4, reputation: 0.4, individuality: 0.2}
          source: >-
            tensions.yaml tension_cardinal_independence (B12b.46). The Cardinal of Prudence, the seat once bodied as the temporal
            affairs (`offices.yaml` off_cardinal_prudence's note: "body remapped from `Dicastery for Temporal Affairs`"); attention
            only, no stance. [ASSUMPTION; medium;
            Jordan to correct -- which Cardinal, the weights; revert: the card's row goes]

  - id: tension_guild_fracture
    text: the Guild is splitting, and its Comptroller's eye is on the market at Gransol
    source: >-
      conflict_architecture_proposal.md:138 (archived, intent): "| 4 | **Guild Fracture** | T8 Hafenmark-Guild friction | S017 Guild schism →
      Market Quarter becomes contested |". The Market Quarter is a district of Gransol (S-018, PP-726's collapse; S-017 is Holzbrück), so the
      rung is `set_s_018`; the schism and the contest are the people's. [ASSUMPTION; medium; Jordan to correct; revert: the row goes]
    effects:
      - kind: goal
        goal:
          id: goal_tension_guild_fracture
          org: {seat: off_guild_comptroller}
          text: the market at Gransol should be the Guild's to order
          object: {kind: rung, rung: set_s_018}
          pursuits: {wealth: 0.5, individuality: 0.3, community: 0.2}
          source: >-
            tensions.yaml tension_guild_fracture (B12b.46). [ASSUMPTION; medium; Jordan to correct -- the seat, the rung, the weights;
            revert: the card's row goes]

  - id: tension_einhir_incident
    text: an Einhir confrontation is brewing in Varfell's highlands and southern fjords, and the Restoration's leader is drawn to it
    source: >-
      conflict_architecture_proposal.md:139 (archived, intent): "| 5 | **Einhir Incident** | T4 + T13 Varfell-RM friction | Public Einhir
      cultural confrontation forces all factions to declare position |". The confrontation and the declarations are the people's; the card
      keeps the leader's attention on T4 (Grauwald) and T13 (Oastad), one goal row each, no stance. [ASSUMPTION; medium; Jordan to correct;
      revert: the row goes]
    effects:
      - kind: goal
        goal:
          id: goal_tension_einhir_grauwald
          org: {seat: off_restoration_leader}
          text: the Einhir of Grauwald should be seen and heard
          object: {kind: rung, rung: terr_T4}
          pursuits: {community: 0.5, liberty: 0.3, virtue: 0.2}
          source: >-
            tensions.yaml tension_einhir_incident (B12b.46), T4. [ASSUMPTION; medium; Jordan to correct -- the seat, the weights; revert: the
            card's row goes]
      - kind: goal
        goal:
          id: goal_tension_einhir_oastad
          org: {seat: off_restoration_leader}
          text: the Einhir of Oastad should be seen and heard
          object: {kind: rung, rung: terr_T13}
          pursuits: {community: 0.5, liberty: 0.3, virtue: 0.2}
          source: >-
            tensions.yaml tension_einhir_incident (B12b.46), T13. [ASSUMPTION; medium; Jordan to correct -- the seat, the weights; revert:
            the card's row goes]

  - id: tension_ministry_crisis
    text: the Crown's Ministries are failing, and the Church's man at court means to see their chief clerk out
    source: >-
      conflict_architecture_proposal.md:140 (archived, intent): "| 6 | **Ministry Crisis** | T14 Crown-Löwenritter + Crown governance |
      Ministry bureaucracy collapses → Crown governance vacuum → Church fills |". The collapse and the vacuum are outcomes; the card keeps
      the Church's side against the Ministries' one seat (`off_parliamentary_clerk`, body `Ministries`). [ASSUMPTION; medium; Jordan to
      correct -- whether to keep this card at all; revert: the row goes]
    effects:
      - kind: goal
        goal:
          id: goal_tension_ministry_crisis
          org: {seat: off_archbishops_rep}
          text: the Ministries' chief clerk should give way to the Church's counsel
          object: {kind: seat_holders, seats: [off_parliamentary_clerk]}
          stance: -1
          pursuits: {doctrine: 0.4, stability: 0.4, stewardship: 0.2}
          source: >-
            tensions.yaml tension_ministry_crisis (B12b.46). The Church seat is the Archbishop's Representative, the Church's seat at T1
            (`offices.yaml` off_archbishops_rep, faction Church of Solmund). [ASSUMPTION; medium; Jordan to correct -- the Church seat, the
            weights, the card; revert: the card's row goes]

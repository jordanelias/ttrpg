    beneficiary_note: "a restored site benefits whoever holds it, which is a WORLD read (`Tenure` on the site) and not a carrier the Candidate holds. `S10`'s territory, not this column's."
    referent_class: Site
    referent_class_note: "v10 REM-22 (B10-05, AM-A-07; M19 taken, [ASSUMPTION; medium; Jordan to correct]): FORMED ONLY ON A `Site`-CLASSED REFERENT -- the plain referent of the question he answers that is a Site (`queries/world_q.py::own_referents_of_class`, REM-21's term, stamps it through `_stamped`; `decision/options.py::opening_set` then forms on the classed ids alone, IN-53 D1's partition), so `site`, `subject` and `to` bind a Site and never a person, a Record or a rung. THE CLASS REMOVES WRONG-KIND FORMATIONS ONLY: this row's cell, its eligibility and who is present at the site are unchanged, and it claims no execution. No question the realm delivers carries a Site among its referents, so the row forms nowhere there (a sideways move, declared, not progress; R-05 is not claimed to move). A person present at a worn Site executes it through the real fold (`tests/test_referent_class_stamps.py`). REVERT: delete this column."

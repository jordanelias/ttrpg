    requires_note: "EVALUABLE (plan position `19`), AND SO `issue` IS RESOLVABLE. r2 `02` §A.6's proposal -- `commit`'s `existence of subject kind Proposition` -- is NOT taken: the prose says nothing about the terms, and a computed act binds `subject` and `to` to the question's ONE referent (`H-94`), so the Proposition conjunct and the executor conjunct could never hold at once and every computed `issue` would refuse -- `confer`'s 100% at `★`, for a clause the row does not state. IN-10 separated the two (`requires_typed_note`: `to` fans over known persons), and the Proposition conjunct is STILL not taken: a writ's `terms` may name a person or a Record (a warrant), not only a Proposition (#453 §10.1)."

      all:
        - form:      existence
          of:        site
          kind:      Site
        - form:      relation
          of:        site
          relation:  present_at
    requires_typed_note: "`fieldwork_v30.md:293` -- *Examine · Cognition · Study physical evidence, architecture, documents, objects*. The two clauses are `restore`'s, and for its reason: a physical trace is somewhere, and you have to be there to study it. `Site` rather than `Record` per the block comment's reading of `:315-322`."
    writes:      []
    writes_note: "— (a finding is a Claim, minted at WITNESS from the Event; `04:237` forbids a social aggregate on a Rung, and `fieldwork_v30.md:256`'s Evidence Track is a COUNT over what the investigator holds, not a meter anybody writes)"
    emits:       ["finding.made"]
    emits_on_refusal: ["finding.none"]
    grade:       "assumption"
    source:      "systems/fieldwork/reference/investigation_systems_v30.md:217 names the six; systems/fieldwork/reference/fieldwork_v30.md:293 (§4.2) and :317 (§4.3) carry this row's content"
  - verb:        "interview"

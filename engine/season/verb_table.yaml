    refusal_note: "PLAN POSITION `19`: KEYED PER CLAUSE (`04 §B.13` invariant 4's per-conjunct half). `requisition.refused` is §27.1's SCARCITY channel -- *the second claimant on an emptied granary gets a DIFFERENT Event* -- and it is now the `stores` conjunct's alone: two requisitions on one larder in one fold, and the second finds it short (`tests/test_u7_remit.py`). `requisition.unauthorized` is the SEAT refusing: none exercised grants `issue`, or its purview does not reach the rung. A witness can tell a seat that could not reach the larder from a larder that could not cover the requisition."

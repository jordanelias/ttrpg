  - verb:        "work"
    stratum:     "uncontested_material"
    eligibility: ["own", "presence:<site>"]
    requires:    "condition >= floor(verb) (§12.1)"
    requires_typed:
      form:      scalar_threshold
      of:        site
      scalar:    condition
      threshold_predicate: floor
      comparator: ">="
    requires_typed_note: "§E3 `:420` — *`condition >= floor(verb)`* (§12.1). ⚠ **RETRACTED BY THE `W-C` ADVERSARIAL PASS: THIS CELL SAID THE THRESHOLD READS UNKNOWN AND DOES NOT SUBSTITUTE, AND THE CODE DOES THE OPPOSITE.** `WorldReader.read`'s `floor` branch returns `min(floors.values())` and argues at length for doing so — *`work` is the GENERIC labour verb, so a site is workable if it clears the floor of its LEAST demanding use* — having built and measured both alternatives (`max` refuses a seam surface-gleaning supports; `UNKNOWN` destroys the gate outright, since `work`'s precondition could then never return False). Measured on the fixture: `floor` reads **100** for `site_harbour` and **50** for `site_seam`, and a named workable site emits `site.worked` (`test_tracer_is_honest.py`). So the `W-A` correction landed in THIS PROSE and was reversed in the CODE, and the prose was never retracted. Under `CLAUDE.md` §0.05 the code is the mechanism: the substitution is LIVE, it is a declared reading of `floor(verb)` for a verb that names no use, and it is registered on `H-08`/`H-94`. The paragraph below is kept because the objection it records is real and is what the code answers — read it as the argument, not as the behaviour. The first version resolved `floor` to `min(band_floors[site.kind].values())` — but `band_floors`' own roster note says its inner keys are SITE-USE verbs (bulk_shipping, fishing, deep_mining …), **NOT verb-table rows**, so `work` is not among them and the cell silently substituted the LOOSEST floor for the one the prose names. On a harbour it asked `condition >= 100` where `floor(bulk_shipping)` is 800: every condition in 100..800 was ADMITTED WHERE THE PROSE REFUSES — an UNDER-refusal, which `G4` weighs equally with an invention. Worse, the reader raised `Unspecified` for an unregistered site KIND citing §42.2.1 (*forbids picking a plausible number for a kind nobody registered*) and then picked a plausible number for a VERB nobody registered, three lines on. ⚠ THE SITE-USE IS AN OPERAND THE CLOSED ROSTER DOES NOT CARRY, and the reader's answer to that is `min` WITH THE READING STATED, not UNKNOWN — see the retraction above. What stays open, and is not papered over, is that a `work` MEANING deep-mining is admitted on a seam only surface-gleaning could support, because nothing on the act says which use is intended. ⚠ AND THE LATENCY IS SPENT: `W-C` binds `site` to the question's referent, so the substitution is now reached on every computed `work` — the corpus refuses all 723 because no referent it produces is a Site, which is a fact about these worlds and not about the threshold. Registered on `H-08`/`H-94`; typing the threshold needs a site-use operand first."
    writes:      ["Site.condition"]
    emits:       ["site.worked"]
    emits_on_refusal: ["work.unavailable"]
    grade:       "ruled"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"

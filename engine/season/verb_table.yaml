    referent_class: Person
    referent_class_note: "B11 lane A (the duel chain's reach, `challenge`'s repair and reason): FORMED ONLY ON A `Person`-CLASSED REFERENT, so the row no longer forms on a referent that is no person. The `existence` conjunct stays for a hand-built act. [ASSUMPTION; medium; Jordan to correct; revert: delete this column.]"
    requires:    "the subject is a living individual, present where the actor is"
    requires_typed:
      all:

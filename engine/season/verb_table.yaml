  - verb:        "restore"
    stratum:     "uncontested_material"
    eligibility: ["own", "presence:<site>"]
    requires:    "the site exists and the actor is present at it"
    requires_typed:
      all:
        - form:      existence
          of:        site
          kind:      Site
        - form:      relation
          of:        site
          relation:  present_at
    requires_typed_note: "The `requires` cell here is W3's, not §E3's — §E3 `:421` put an EFFECT formula in the column and W3 moved it to `effect:`, leaving *the site exists and the actor is present at it*. Two clauses, conjoined because the prose conjoins them. ⚠ `present_at` DUPLICATES THE `presence:<site>` ELIGIBILITY ALTERNATIVE, and that duplication is in the prose rather than introduced here; eligibility is a DISJUNCTION (`own | presence:<site>`) so `own` alone admits, and the precondition is where presence actually binds. ⚠ THE PREMISE OF THIS CELL'S LAST SENTENCE WAS FALSIFIED BY `W-C` AND ITS CONCLUSION SURVIVES; corrected by the `W-C` adversarial pass rather than left standing. It read *\"`site` is unbound for every computed act\"*, and `operands_for` now BINDS `site` from the question's referent — a `restore` Candidate carries `{site: <referent>, subject: <referent>, to: <referent>}`. What keeps `restore` unexecutable is the OTHER half, unchanged and now the only half: it writes `Site.condition` and has no `EFFECTS` entry, so `resolvable_verbs()` excludes it and the chooser never offers it to the fold at all. Were it offered, the `existence` clause would still read UNKNOWN, because no referent this corpus produces is a Site."
    writes:      ["Site.condition"]
    emits:       ["site.restored"]
    emits_on_refusal: ["restore.refused"]
    grade:       "ruled"
    effect:      "Δ = +(1 − condition) × f(degree) × share (§54 it. 7's mirror)"
    effect_note: "W3: this formula was in the `requires` column. A precondition is a question the fold asks of the world; an effect is what the write does. Conflating them is how a resolver grows a second body."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"

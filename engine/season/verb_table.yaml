    requires_typed_note: "REASON (c) OF THE THREE `data/verbs.py:239-248` ADMITS -- an operand the closed `requires_operands` roster has no name for -- AND IT IS ALREADY REGISTERED, so this is a citation and not a new hole. `hole_register.yaml` H-85: Thread Sensitivity is what #353 §9.2 calls *'the only class-shaped gate in the design'*, and §9.2 *specifies NO carrier, NO roster of what it gates, and NO predicate*. `fieldwork_v30.md:297` requires TS >= 30 for this act and `:37` gates Depth 4 on the same number. Typing it would mean coining an operand, which `rosters.yaml: requires_operands` calls *'filling H-94 by keyword argument, which is the ruling H-94 is waiting for and not a table edit'*. ⚠ THE CONSEQUENCE IS STATED PLAINLY: with no typed cell and no `REQUIRES_PREDICATES` entry this verb is NOT in `resolvable_verbs()`, so it is a row that exists and cannot yet be attempted. That is what canon says of a character below the gate (`:76` -- *'Characters below the gate cannot attempt the action'*), and it is the honest state rather than a stand-in threshold."

    referent_class_note: "v10 REM-27 (B10-06, AM-A-13 limit, [ASSUMPTION; medium; Jordan to correct]): THE FIELD. FORMED ONLY ON A `Rung`-CLASSED REFERENT -- the Rungs the standing occasions already stamp onto the question he answers: `queries/world_q.py::places_named` (every Rung his own ledger names that the ladder would seat him in and that he does not live under, so every known settlement but the one he lives under) and `larders_in_purview` (a stocked Rung in his seat's purview) -- and `subject` binds it through the unchanged referent rule (`decision/options.py::_derive_operand`). NO STAMP TERM OF ITS OWN: a `fields_named` term (Rungs of a `rosters.yaml: march_target_kinds` kind, offered to a seat granting a `Rung` row's remit act) was built and found unearned -- `places_named` already stamps what it would; its marginal reach is the settlement he lives under, which is not a target (`engine/season/tests/test_referent_class_stamps.py::test_rem27_*`). A non-settlement Rung `march` forms on (a hearth, a larder) is `loop/sides.py::sides_of`'s to refuse against the roster (H-149, `requires_typed_note` below). No operand, no seam: the field still enters through the mass-battle wrapper and its composition row, and `loop/sides.py::sides_of` still enforces the roster. THE DERIVED WIDENING, NAMED: classing this row adds its `remit:dispatch` to `RUNG_REMIT_ACTS` (`{issue}` to `{issue, dispatch}`), so `larders_in_purview` offers larders to dispatch-holding seats and `requisition` and `migrate` may form on a stamped settlement, and `march` on a stamped place or larder (the H-163 shared-class cost, read by REM-27's stop rule, not prevented). THE READING IS 'REACHES A FIELD', NEVER 'CONTESTS ONE': at `troops=weight` a realm force routs on contact whoever is stronger (`modules/mass_battle/massbattle.py::_weighted_unit`); who wins is REM-32's and JQ-4's. REVERT: delete this column; `RUNG_REMIT_ACTS` loses `dispatch` (the set is the union of the `remit:` acts over the `Rung` rows, `data/verbs.py`, so `convene`'s and `requisition`'s still stand)."

    requires_typed_note: "PLAN POSITION `19`: ONE CONJUNCT, `Basis` (§F.24a form 7) with the `purview` rule -- the seat exercised has purview over the place the matter is AT (`world_q.place_of`, the one owner; ruling (4), `04:330`). A cluster seat reaches nowhere and opens nothing. The matter is the act's `subject`, any id a question can be about: a person, a Record, a rung. Whether the matter is ALREADY before a room is a NEGATION the grammar cannot spell, so `_eff_open_case` declines it (`case.refused`, the `write` clause)."
    writes:      ["Record.exists", "Record.stages", "DocketItem.matter", "DocketItem.arrangement", "DocketItem.petition"]
    writes_note: "PLAN POSITION `19` ADDED `DocketItem.matter`: *'`open_case` gains `writes: DocketItem.matter` ... a proceeding with zero authored acts needs somebody to have put the matter before the room, and no step did that'*. `loop/effects_information.py::_eff_open_case` draws the case file up at the opening seat's rung (`Record.exists`/`Record.stages`, `_mint_document`) and, in the same `apply`, dockets the matter with `_docket_item`'s keys (`matter`, `arrangement`, `petition`; v9 SC-03a): into the nearest open slot CALENDAR formed at a venue holding the matter, which keeps its `date` (v9 SC-01 fired-slot step, `world_q.slot_for`), else as an appended dateless item. That is the one write of these cells by an ACT; CALENDAR's is actorless and forms empty slots. Every pair after the first is check-only (each `DocketItem` cell admits RES in the ACTS class); `arrangement` and `petition` are declared because a filled slot gains them in an item CALENDAR created (`04` PART D row 3)."
    emits:       ["case.opened"]
    emits_on_refusal:
      eligibility: ["case.unauthorized"]
      authority:   ["case.unauthorized"]
      write:       ["case.refused"]
    refusal_note: "PLAN POSITION `19`: KEYED PER CLAUSE (`04 §B.13` invariant 4's per-conjunct half). `case.unauthorized` -- the SEAT: none exercised grants `determine` (this row's eligibility, `H-52`), or its purview does not reach the matter. `case.refused` -- the matter is already on a docket, or the mint moved nothing. The family is `case.*`, the row's own `case.opened`."
    grade:       "assumption"
    eligibility_note: "W3: graded `assumption`, NOT `ruled`. #353's five remit acts are CLOSED -- issue, determine, confer, revoke, dispatch -- and opening a case is not among them, so V2 invented this eligibility. `own` is a different game (anyone may open a case), which is why it is swept rather than chosen. The roster is `rosters.yaml: remit_acts`."
    eligibility_sweep_note: ["remit:determine (V2's value)", "own", "hold:<the matter's record>"]
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "pardon"
    scale:       "settlement"
    scale_note:  "#453 §9.1: *'settlement'* -- a pardon is the bench's act at the seat that owns the restraint, `determine`'s scale"
    stratum:     "binding_decision"
    eligibility: ["remit:determine"]
    beneficiary: "subject"
    beneficiary_note: "#453 §9.1: *'beneficiary `subject`'* -- the man released."
    requires:    "the subject is a person over whom the exercised seat sits as a bench"
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      Person
        - form:      basis
          of:        subject
          basis:     bench
    requires_typed_note: "⚠ v9 IN-12 step 5 KEEPS THE ROW TYPED, ON `seize`'s IN-13 PRECEDENT, WHERE #453 §9.1 SENDS IT UNTYPED. #453: *'a live edge of kind `detain` or `ban` whose object is the exercised seat ... a disjunction over kinds, which the typed grammar does not have, so the row takes `release`'s route: `requires_typed: none` ... and a registered predicate'*. This keeps the TWO conjuncts the grammar CAN spell and moves the disjunction to the effect: `existence` of `subject` kind Person (only a person owns a restraint) and `basis` `bench` of `subject` -- the SAME `state/gate.py::may_determine` the gate's `determination` basis asks to admit the closure (#453: *'under the widened `determination` basis'*), read early, so the fold refuses exactly what the gate would raise on. WHICH EDGE closes -- a live `detain` or `ban` of the subject's whose object is `Act.via` -- is `loop/effects_governance.py::_eff_pardon`'s, which declines a subject holding none (`pardon.refused`, the `write` clause). ⚠ THE CLOSURE BASIS (the entry's): `determination` closes a restraint only THROUGH THE SEAT THAT IS THE EDGE'S OBJECT, by a bench-granted holder -- so a warrant-opened `detain` (object: the ISSUING seat, `arrest`) is pardoned by that seat's bench, and a revocation's `ban` (object: the revoking seat, IN-31) by the revoking seat's. [ASSUMPTION; medium; Jordan to correct; revert: `requires_typed: none` + a registered predicate asking the same two reads and the edge, #453's own text.]"
    domain:      [detain, ban]
    domain_note: "#453 §8.2: THE LOADER'S CLOSER CLAUSE READS THIS COLUMN ON EVERY ROW (`data/verbs.py`, loader invariant 6's closer clause, v9 IN-12 step 5): every Tenure kind outside `RELEASABLE_KINDS` and the two that end by a relocation (`contain`, `reside`) -- `data/rosters.py::RESTRAINT_KINDS` -- must sit in some row's declared `domain:`; the load is red without this row's `[detain, ban]`. `_eff_pardon` closes `RESTRAINT_KINDS`, the gate's closable pair; the loader refuses a domain naming any other kind (a releasable kind is `release`'s)."
    writes:      ["Tenure.until"]
    writes_note: "#453 §9.1: *'writes: `Tenure.until`, under the widened `determination` basis (closing `detain` and `ban` only, §8.3)'*. `_eff_pardon` closes EVERY live restraint the subject owns on `Act.via` -- a custody and a ban on one seat both end (*'grant wholly'*) [ASSUMPTION; medium; Jordan to correct; revert: the oldest one only]. Never an `oblige` (D-5: no obligee-side closer of an obligation, §8.3); the gate's `determination` clause closes `RESTRAINT_KINDS` only."
    emits:       ["detention.ended", "ban.ended"]
    emits_note: "#453 §9.1: *'`detention.ended` / `ban.ended`, per-kind closers on R-3's `commitment.ended` precedent'*. EACH CLOSED EDGE EARNS ITS OWN KIND (`Subject.earns`), so a pardoned custody never publishes an ended ban. ORDER IS READ: `_eff_pardon` unpacks this column `detain` then `ban` (`seize`'s precedent). Two NEW kinds; `binding_decision`, so `chronicle` broadcasts them."
    emits_on_refusal: ["pardon.refused"]
    refusal_note: "#453 §9.1: *'refusal `pardon.refused`'* -- FLAT, one kind for every failable clause: ineligible; no person; the exercised seat does not sit as a bench over him (`bench`); or he holds no live `detain`/`ban` on the exercised seat (the effect's decline)."
    grade:       "assumption"
    grade_note:  "an argued addition (#453 §10.4 step 5): the matrix row `(Tenure, until)` is the tree's; the row, the typed-route reading and the closure basis are v9 IN-12's, on #453 §9.1 `:1710-1740`, §8.2-§8.3."
    source:      "v9 IN-12 step 5 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.1 `:1710-1740`"
  - verb:        "petition"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "actor"
    referent_class: Person
    referent_class_note: "v10 REM-24 (B10-05, AM-A-09; M19 taken, [ASSUMPTION; medium; Jordan to correct]): FORMED ONLY ON A `Person`-CLASSED REFERENT -- the plain referent of the question he answers that is a person (`queries/world_q.py::own_referents_of_class`, REM-21's term, stamps it through `_stamped`; `decision/options.py::opening_set` then forms on the classed ids alone, IN-53 D1's partition), so `to` -- the counterparty, the operand this row's cell binds, in a cell that binds no `subject` -- and `subject` bind a person and never a rung, a Site, a Record or a Proposition. THE CLASS REMOVES WRONG-KIND FORMATIONS AND ONE ROUTE BESIDE THEM: this row's cell, its eligibility, the person-side self-address decline (`counterparty:`) and who may petition whom are unchanged, and it claims no new execution; but a classed row forms on its classed referent alone and skips the reader of the document the question is about (`decision/options.py::_derive_operand`, `on_referent`), so a question about a held sheet or petition Record -- whose document names the addressee (`rosters.yaml: record_sourced_operands`, `faction_sheet: to: head`) -- no longer forms a `petition`, though that `to` is a person. MEASURED at the base: every `petition` act of the realm was self-referent (`to` = `subject`; 19/17/20 at seeds 0/1/2) and none was addressed through a document, so no execution there rode the route; it is reachable in a hand-built world only (`tests/test_information_cluster.py`). A PERSON'S OWN `person`-KIND RUNG IS A PERSON: it shares the person's id and `World.class_of` asks `persons` before `rungs`, so a referent that is such an id is stamped `Person` and kept (measured at the realm build, seed 0: 83 `person`-kind rungs, all 83 sharing a person's id; the first questions carry 43 `Person` referents, every one of them such an id, and 4 pure `Rung` referents -- a settlement or a hearth -- and only those 4 are removed), and `places_named` never stamps it as a place (`class_of == \"Rung\"`), so `migrate` and `requisition` are untouched. MEASURED before the class (`73aee085`, `aperture 1 s`, realm arm, s = 0/1/2): formed for 82/81/82 of 83 persons, attempted 19/17/20, executed 10/4/8, refused 9/13/12 as `petition.refused`, every one on the last read `exists:Person=0` (9/13/12); those formations stop, and the refusal Events they emitted stop with them, with the WITNESS deposits those carried (AM-A-09). READ AFTER (same instrument): formed for 40/39/43 persons -- those whose question names a person among its referents -- attempted 10/4/8, executed 10/4/8, refused 0/0/0, `exists:Person=0` 0/0/0. Attempts fall by exactly the refusals and executions do not fall, so AM-A-09's stopping rule (a fall in executions not explained by petitions that reached a person another way) does not fire: no petition formed on a rung executed. A person who answers a question naming a person executes it through the real fold (`tests/test_referent_class_stamps.py`). REVERT: delete this column."
    requires:    "a petition has two sides and both exist: the person it is addressed to, and the place it rises from"
    counterparty: to
    counterparty_note: "⚠ THE OTHER PARTY TO THE ACT, NAMED BY THE OPERAND THAT CARRIES THEM (plan position `15`). `decision/options.py::opening_set` forms no Candidate whose counterparty is the person themselves -- the contested-verb rule one column over (*a person is not their own adversary*), for the same reason: being oneself is not a belief anyone can be wrong about, so it is declined person-side rather than attempted and refused. MEASURED before this column existed, `populated.run` seed 0: with the self-address declined only at the fold, self-addressed petitions went 1 -> 2 -> 5 per season, because each refusal deposited a claim about the petitioner that raised another question about them -- a feedback loop, never learned, since no read the fold makes can say *that is you*. The loader requires the operand to be one the row's typed cell BINDS, so the Candidate always carries it."
    requires_typed:
      all:
        - form:      existence
          of:        to
          kind:      Person
        - form:      existence
          of:        from
          kind:      Rung
    requires_note: "— no dedup, no cap, no per-venue limit (§26.3). ⚠ THOSE THREE ABSENCES STAND; WHAT CHANGED AT PLAN POSITION `15` IS THAT A PETITION NOW NAMES WHOM IT IS FOR. The cell was `—` and the verb had no effect, so it was never folded; the moment it mints a document it must say to whom, or it is a fiat. ⚠ AND IT IS NOW RESOLVABLE -- typed precondition plus `_eff_petition` -- so NPCs form and file petitions in computed play: a declared behaviour change that moves every run whose chooser can reach it."
    requires_typed_note: "⚠ TWO-SIDED, PER `ED-IN-0210` RULING 2 (Jordan, 2026-09-10): *`petition` <-> WITHDRAW (petitioner) or DENY (receiver) ... `petition`'s pair is TWO-SIDED (withdraw and deny close the same state from opposite sides), the first in the set where a counterparty is structurally required.* RULING 1 on the same row is what makes each side an EXISTENCE clause: *a fiat needs no counterparty, so nothing checked that the object of an `oblige` was an entity* -- so each named side must BE one, and the grammar's `existence` form is the check. ⚠ THE RECEIVER IS A PERSON, BECAUSE RULING 2 NAMES WHAT THE RECEIVER DOES -- *DENY* -- and only a person acts (AX-1); the next position's `give` (`16`, H-84) moves a Record *to another person*, which is how a petition reaches the hand that may deny it. THE SEAT READING WAS BUILT AND MEASURED, AND REFUSED ON THE MEASUREMENT: with `kind: Office`, `populated.run` seed 0 formed 28, 21, 24, 22 petitions over four seasons and FILED NONE -- no question's referent is ever a seat, so every one was refused, a constant scene tax with nothing behind it. The self-petition that `kind: Person` admits is declined person-side by `counterparty:` (above), not here: the grammar has no negation. `from` is the operand's one meaning (`decision/options.py::_derive_operand`: where the actor is) -- the place the petition rises from, #353 §36.1's *a demand rises from a hearth*. ⚠ WHAT A COMPUTED ACT CANNOT YET SAY: `to` and `subject` both bind the question's ONE referent (`_REFERENT_OPERANDS`), so a computed petition is addressed to the person it is about. That is `H-94`'s single-referent limit, not this cell's choice, and plan position `15c` (content operands) is what separates them."
    writes:      ["Record.exists"]
    emits:       ["petition.filed"]
    emits_on_refusal: ["petition.refused"]
    grade:       "ruled"
    refusal_note: "PLAN POSITION `15`: added with the typed cell. §E2 -- 'failure emits, never raises'. Refusal condition: the addressee is not an existing person or the place of origin is no rung, or -- for a hand-built act only, since a computed one is never formed -- the petition is addressed to the petitioner (the FOLD's `counterparty` clause, `loop/resolve.py::_admits`, plan position `14`; `_eff_petition` no longer declines it and the keyed row emits this verb's one kind)."
    writes_note: "— (a Petition is created, not written)  ||  ⚠ W3, ON THE W2 AUDIT: Part E says a Petition is 'created, not written', and PLAN §1.4 hole 4 says THAT IS THE DEFECT — #353 :1061-1064, 'Either the gate applies the write, or direct assignment is made impossible.' With `writes: []` the creation row W2 added was INERT and creation still bypassed the gate.  ||  ⚠ PLAN POSITION `15`: `Petition.exists` -> `Record.exists`. A petition is a `Record` of kind `petition` (`04_CODE_ARCHITECTURE.md` §B.5, `rosters.yaml: record_kinds`), minted with the petitioner's `hold` by `loop/effects.py::_eff_petition`, so `forge`, `destroy_record`, `hold` and `carry` reach it with no new row. `(Petition, exists)` is deleted from the matrix in the same commit."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "construe"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "actor"
    requires:    "as comply — ⚠ emitter- or receiver-side is absent, D18"
    requires_typed: none
    requires_typed_note: "§E3 `:432` — *as `comply` — ⚠ **emitter- or receiver-side is `absent`, D18***. Grade `absent`. `comply`'s operand is answered since v9 IN-09 (its `subject` read as the writ), and this row's IN-09 typing was REVERTED at 0 executions through the real chooser (H-203 / H-44 AMENDED 2026-10-13; the typed row is in `60073e75`); beyond that, WHOSE ledger is read is the thing `D18` records as missing, and a typed cell would have to pick one. §42.2.1: the honest behaviour is to refuse, not to pick."
    requires_decline_note: "PLAN POSITION IN-41 (`SM-11`), carried after v9 IN-09 (the typing reverted, `requires_typed_note:`), and the grade is `absent` besides -- whose ledger is read is the thing `D18` records as missing, so a predicate would have to pick one, and §42.2.1's honest behaviour is to refuse rather than pick. Nothing evaluates the precondition; `resolvable_verbs()` leaves the verb out."
    writes:      []
    emits:       ["terms.distorted"]
    emits_on_refusal: ["construal.impossible"]
    naming_note: "⚠ RENAMED `refract` -> `construe` 2026-09-18 ON JORDAN'S RULING: *\"refract is the wrong word to use for whatever it is tho\"*, then *\"construe\"*. `CLAUDE.md` §4 -- coin nothing a plain word already covers, and a reader with no memory of this repo must land on the meaning. `refract` was a physics metaphor for interpreting an order's terms; `construe` is the ordinary legal-administrative word for reading an instrument, so the triple is now **comply / evade|defy / construe**. ⚠ AND HIS OWN 2026-09-02 RULING WAS ALREADY REACHING FOR IT (`hole_register.yaml`, the refraction row): *\"people's actions are objectively the case but the meaning of those actions are subject to interpretation - signified vs signifier\"*. That mechanism IS construal. ⚠ `refraction` SURVIVES AS THE PHENOMENON AND THAT IS DELIBERATE, not a missed rename: the same ruling holds that what is distorted is *\"the PREMISES AND RATIONALE, minted per receiver as a Claim\"*, receiver-side. The premise is refracted BY the act of construing -- cause and effect, two names for two things. So `terms.distorted` is UNCHANGED (it never carried the rejected word and reads correctly), and only the verb and its refusal emit move. The refusal follows the sibling convention: `comply` -> `compliance.impossible`, so `construe` -> `construal.impossible`."
    grade:       "absent"
    writes_note: "—"
    refusal_note: "W3: added. §E2 -- 'failure emits, never raises'. This verb has a `requires` and had no refusal channel, so a failed precondition produced no Event, no witness and no arc. Refusal condition: as `comply`"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "release"
    stratum:     "binding_decision"
    eligibility: ["own"]
    beneficiary: "subject"
    requires:    "a live tenure of a releasable kind, owned by the actor, toward the subject"
    requires_typed: none
    domain:      [hold, commit, oblige, succeed, tie, knot]
    writes:      ["Tenure.until"]
    emits:       ["tenure.closed", "commitment.ended"]
    emits_on_refusal: ["release.refused"]
    grade:       "ruled"
    emits_note:  "v9 IN-11 (#453 §10.4 step 2, R-3 (b) adopted): `repudiate` IS CUT and its row deleted -- it was a second closer of one edge, since `commit` is in this row's `domain:` -- so the vow-break is witnessed HERE: `_eff_release` earns `commitment.ended` when an edge it closes is a `commit` -- WHOLE-ACT earning: when any closed edge is a `commit`, every edge it closes earns the row's every kind (`earns=None`) -- and `tenure.closed` alone otherwise. `repudiate`'s seven alignment cells and its `sacred` cell in `rosters.yaml: tables.affiliation_engagement` were DROPPED with the row, not moved onto this one: a voluntary release is a different act. ⚠ THE VOW-BREAK IS NOT UNPRICED: `commitment.ended` now has ONE emitter, this row, so `data/verbs.py::KIND_VERB` maps it to `release` and a witnessed vow-break is judged (`queries/person_q.py::deed_valence` -> `align_kind`) at `release`'s own alignment cells -- `precedent_substantive` +0.3 and `rigid_flexible` +0.3 in `rosters.yaml` when this was written; read them there -- until a `deed:commitment.ended` cell is authored (the IN-11 entry, `workplans/valoria_master_workplan_v9_part5.md` `### IN-11` WHAT: its pricing becomes a `deed:` cell, IN-08). None is authored here."
    requires_typed_note: "⚠ `none` WITH A REASON, AND THE REASON IS THE GRAMMAR, NOT NEGLECT — the third admissible ground (`data/verbs.py`: *an operand the closed `requires_operands` roster has no name for*), reached from the other side: the cell this row needs is a DISJUNCTION OVER KINDS and the grammar has none. `data/requires.py:542` carries `all` and no `any`, and §F.24a form 1 `existence` takes ONE `kind:`, so the six releasable kinds cannot be spelled: `all` of them would mean *a live edge of every kind at once*, which is the opposite requirement, and `existence` of one kind would silently narrow the verb to that kind. Adding an `any` combinator is a GRAMMAR CHANGE — `REQUIRES_STEMS` is closed and refuses an unknown stem at load — and `04 §A.3` row 14 asks for a verb, not a new form. So this row takes `revoke`'s route: a prose `requires:` read by a registered predicate, with the domain declared above and asserted at load. ⚠ IF AN `any` COMBINATOR IS EVER RULED, THIS CELL IS THE FIRST THING TO TYPE."
    domain_note: "⚠ THE `domain:` COLUMN EXISTS FOR THIS ROW AND IS CHECKED AT LOAD — `04_CODE_ARCHITECTURE.md` PART D row 15: *`release` generic; the loader asserts its domain equals `tenure_kinds \\ {contain}` (invariant 6, as corrected for F4)*. It is DECLARED here rather than derived so the assertion has content: `data/verbs.py` compares this list against `rosters.yaml: tenure_kinds` minus `contain`, so adding an eighth tenure kind and forgetting its closer FAILS THE LOAD instead of shipping an open-without-close. A derived domain would make the check compare the roster to itself, which is `CLAUDE.md` §0.1 pt 2 — an assertion that cannot observe the failure it excludes."
    requires_note: "⚠ PROSE + A REGISTERED PREDICATE, LIKE `revoke`, AND NOT `requires_typed` — deliberately. The domain is a SET of six kinds and the typed grammar has NO DISJUNCTION: `data/requires.py:542` carries `all` and no `any`, and §F.24a form 1 `existence` takes ONE `kind:`. Six `all` clauses would mean *a live edge of every kind at once*, which is the opposite of what this verb needs, and adding an `any` combinator is a GRAMMAR CHANGE (`REQUIRES_STEMS` is closed and refuses an unknown stem at load). `_req_release` reads the same roster the loader asserts against."
    source:      "`04_CODE_ARCHITECTURE.md` §A.3 row 14, QUOTED WHOLE: *four closing verbs missing | one `release` verb, eligibility `own`, generic over kind; `Tenure.term?` for declared ends | T-m, T-n, ID-14*. ⚠ THE CLAUSE AFTER THE SEMICOLON IS NOT DELIVERED HERE AND EARLIER RENDERINGS OF THIS CELL STOPPED BEFORE IT WITH NO ELLIPSIS, WHICH IS CONCEALMENT RATHER THAN SCOPE. `Tenure` carries no `term` field (`state/carriers.py`), so `T-n`'s declared-ends half — a tenure that ENDS BY ITS OWN TERMS rather than by somebody releasing it — is unbuilt and is recorded here as unbuilt. ⚠ AMENDED 2026-09-29 (plan position `17b`): THAT HALF IS NOW BUILT for the one kind given a term, `oblige` — `Tenure.term` exists (`state/carriers.py::Term`), `_eff_oblige` declares it, MATTER matures it (`loop/matter.py`, gate basis `T-n`), and a `transfer` paying the seat's `upkeep` renews it. `release` itself is unchanged: it is still the owner's early way out, and T-m still admits it. The scope taken is `architecture/meta/HANDOFF_NEXT.md` §2a's, which asks for the verb: *the design says a person may resign; the verb table does not let them. Fix the table, and do not re-open the design.* The same shape one level up: `04:464-465` states loader invariant 6 as TWO conjuncts, the domain and *every kind's OPENER set is declared too*, and `data/verbs.py` implements the first — the second is HANDOFF_NEXT item 1e and is open. Also PART D row 15."
    disposal_release_note: "⚠ PLAN POSITION `22` (PROC-B), PHASE 2 step 8: `oblige` IS IN THIS ROW'S DOMAIN, AND THAT ALREADY COVERS A DISPOSAL — `determine`'s finding (plan position `19`) opens an `oblige` owned by the party it binds (`21_RECONCILIATION.md` C-1, RULED A), so the same `own`/T-m route this row has always given every obligee lets that party end it: *'the subject may `release` what the finding opened (`T-m`, and `D-5`/`ED-SC-0035` left `T-m` unamended). A convict can discharge his own penance.'* `19_PLAN.md` PART H, D-5 (RULED 2026-09-06 by Jordan, *'second-person lever stays refused'*) is why this is the ONLY route: no creditor verb, no `call_in`, no obligee-side closer on an obligation exists or will — the bench that bound him cannot force the term to run, and cannot force it to end either. C-1's own price for the same ruling: *'That is not a hole — it is public, witnessed, priced by reception, and accepted by ruling.'* No code changes here: `RELEASABLE_KINDS`/`domain:` already carry `oblige`, so a disposal releases exactly as any other `oblige` does, and this note records the ruling the row's existing behaviour already satisfies, per PART E's ban on an obligee-side (`ED-SC-0035`/`D-5`) or a creditor-verb closer — neither of which this route needs or builds."
  - verb:        "restore"
    stratum:     "uncontested_material"
    eligibility: ["own", "presence:<site>"]
    beneficiary: "none"
    beneficiary_note: "a restored site benefits whoever holds it, which is a WORLD read (`Tenure` on the site) and not a carrier the Candidate holds. `S10`'s territory, not this column's."

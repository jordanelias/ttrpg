      Felled:      ["person.died", "tenure.closed", "body.changed", "capability.raised"]
      Wounded:     ["body.changed", "person.captured", "capability.raised"]
      Untouched:   ["person.captured"]
    emits_note: "`fight`'s kinds, with `contest.undecided` REPLACED by the new `person.captured` on the two bands a yielder stands in (earned only by the opened `detain`, `_fold`'s `earned` intersection, so a Wounded scene with no yield emits `body.changed` alone), and `fight.declared` by `capture.declared` (`march`'s deferral band, `the body` carrying `step: ENCOUNTER`). `person.captured` has one emitter, so `data/verbs.py::KIND_VERB` maps it."
    emits_on_refusal: ["capture.refused"]
    refusal_note: "FLAT: one kind for every failable clause, `fight`'s shape. Refusal conditions: the subject is no living individual, or is not where the actor is (the cell), the actor holds no seat granting `dispatch` (the eligibility clause shares the one kind), or the scene moved nobody: no yield and no wound (the write clause)."
    grade:       "assumption"
    grade_note:  "[ASSUMPTION; medium; Jordan to correct; revert: hold `capture` until PC-10b's Record route lands] -- `-08` AM-C-03 (ladder step 4): the row, its terms and its custody are the completion item's; the bands and the scene are `fight`'s, ruled."
    source:      "v10 CP-T03-09 (`workplans/valoria_master_workplan_v11_part13.md`, AM-C-03), on home T03 §2 CP-T03-09 and `fight`'s row"

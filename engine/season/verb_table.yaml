    referent_class_note: "v9 IN-49 `requisition` (H-163 limit 3, [ASSUMPTION; medium; Jordan to correct]): THE REQUISITIONED RUNG. FORMED ONLY ON A `Rung`-CLASSED REFERENT -- chiefly a larder his seat may requisition, which `queries/world_q.py::larders_in_purview` stamps onto the question he answers (a rung his own ledger names, holding at least the fixtures' requisition of their matter, inside the purview of a seat of his granting a `Rung` row's remit act (`data/verbs.py::RUNG_REMIT_ACTS`, widened at v10 REM-27/REM-28, so a `dispatch`- or `convene`-only seat is offered larders `requisition` cannot take: its `authority` conjunct asks the exercised `issue` seat), and not that seat's own rung, the treasury `_eff_requisition` pays into, where a requisition moves nothing) -- and `subject` binds it through the unchanged referent rule (`decision/options.py::_derive_operand`; a claim the question is about re-aims neither the subject nor `kind`/`amount`). No ninth operand, no Record kind: the closed roster stands. ⚠ THE CLASS IS SHARED WITH `migrate`: a place `places_named` stamps forms a requisition too (refused `requisition.unauthorized` where no seat reaches it, after which the levier holds the read and stops forming it, `epistemic.belief_contradicts`), and a larder forms a `migrate` (refused where he already lives under it) -- H-163 records the measured cost. REVERT: delete this column (`RUNG_REMIT_ACTS` loses `issue`; the set is the union over the `Rung` rows, so `march`'s and `convene`'s acts still stand and `larders_in_purview` still stamps larders to a seat granting either -- to stamp nothing, drop the term in `questions_for`)."

  - verb:        "oblige"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "actor"
    requires:    "the subject is a seat whose `binds` admits the joiner, the actor does not hold it, and the actor has no live `oblige` to it"
    requires_note: "PLAN POSITION `17a` (r2 item 9, `03_SEATS_AND_CONTENT.md` §A.9, `05` §A.1.5 RULED (b)). §E3's cell was `—`, and with no effect the verb was never folded; the moment it OPENS a Tenure it must name a real seat, or it is the fiat `ED-IN-0211` reverted (`einhir_texts`, a bare string). Evaluated by `loop/predicates.py::_req_oblige`, which states the four clauses and why each is there. ⚠ `03` §A.9 REFUSED reading `binds`; `05` RULED (b) reversed that on `ARCH F.17`'s own resolution, and the later ruling is the one built."
    requires_typed: none
    referent_class: Office
    referent_class_note: "IN-10 (a) (H-203, DECISION 2026-10-13 [ASSUMPTION; medium; Jordan to correct]): THE SEAT RIDES `subject` AS AN `Office`-CLASSED REFERENT (`confer`'s partition, IN-53 D1), and #453's 'type clause 1' (`:524`) is taken as this column rather than a typed cell -- the row stays untyped, the precondition stays `_req_oblige`'s (`:1389-1391`: 'the row is unchanged'; a typed cell beside the predicate is what `test_wa_one_owner_...` forbids). The referents are the seats the person has been TOLD OF (`queries/world_q.py::seats_named`: a ledger claim about the seat -- the `tenure.opened` deposit, K-25 -- or a held document whose `terms` names it), carried on the question he answers (`questions_for`); `decision/options.py::_operands` then carries the seat on `subject`, so the counterparty clause sees it. A person told of no seat forms no `oblige`. REVERT: delete this column (and `seats_named`'s splice)."
    referent_named: true
    referent_named_note: "IN-10 (a) (H-203, DECISION 2026-10-13 [ASSUMPTION; medium; Jordan to correct]): ONE CLASS, TWO SOURCES, AND `oblige` ANSWERS ONLY ONE. The `Office` referents a question carries are a conferrer's VACANCIES (`world_q.vacancies`, a world read, IN-53) and the seats a person was TOLD OF (`world_q.seats_named`); `confer` forms on both, `oblige` only on a seat the person's OWN LEDGER names (`queries/person_q.py::ledger_names`), asked person-side in `decision/options.py::opening_set` -- #453's own source rule (`:524`: 'from a held Record's `terms` ... or a `tenure.opened` deposit') and this position's FALSIFIER (an `oblige` formed with no seat named by a held Record or a deposit -> fail). MEASURED before this column (4 seasons, `build_realm(0)`): a conferrer formed `oblige` on his own vacancies, which no ledger named. REVERT: delete this column (the row then forms on every `Office` referent)."
    requires_typed_note: "⚠ `none` FOR THE GRAMMAR'S REASON, ON `release`'s AND `give`'s ROUTE: a prose `requires:` read by the registered predicate `loop/predicates.py::_req_oblige`. Clause 1 would type (`existence` of `subject`, `kind: Office`), and the rest cannot: clause 2 reads a field OF the seat (`Office.binds`) against a roster, and no stem reads a seat's own field; clause 4 is a NEGATION (no live `oblige` from the actor to it already), and the grammar has no `not` -- the wall `release`'s disjunction hits from the other side. A typed cell AND a predicate on one row is what `test_wa_one_owner_...` forbids, so the whole cell is the predicate's."
    counterparty: subject
    counterparty_note: "⚠ THE SEAT IS THE SECOND SIDE, AND THE CHOOSER CANNOT NAME ONE (plan position `17a`, on `give`'s precedent, plan position 16). `ED-IN-0210` ruling 1 names this verb: *a fiat needs no counterparty, so nothing checked that the object of an `oblige` was an entity*. On this UNTYPED row no operand is carried, so `decision/options.py::opening_set` forms no `oblige` Candidate at all -- for any question, a seat-referent one included -- and it must not yet: no Question's referent is ever a seat (plan position `15` measured it for `petition`'s seat reading: 28, 21, 24, 22 petitions formed over four seasons, none filed), so a computed `oblige` would be `duty.refused` every time, a constant scene tax with nothing behind it (`7a`'s `commit` measured what that tax does to the corpus). MEASURED at `17a`: before this column the untyped row DID form `oblige` Candidates (the chooser then dropped them, the verb being unresolvable), so `opening_set`'s output falls by exactly that one verb -- `test_wb_a_refusals_reads_land_...`'s denominator 28 -> 27, and results.json's probe counts 28 -> 27 verbs / 56 -> 54 candidates. An `oblige` executes from an act that names its seat on `subject`; a person forms one only once this row binds `subject` in a typed cell AND a question can be about a seat -- neither is this position's. ⚠ SUPERSEDED AT v9 IN-10 (a): the row now forms on a seat the person was TOLD OF -- `referent_class: Office` above, the seat carried on `subject` (`decision/options.py::_operands`) -- with the row still untyped; a person told of no seat still forms none."
    writes:      ["Tenure.since", "Tenure.term"]
    writes_note: "PLAN POSITION `17b`: `Tenure.term` ADDED, on `establish`'s `Tenure.payload` precedent -- the fold gates exactly the pairs a verb declares, and `_eff_oblige` now opens the edge WITH a declared term (`matures_at = tick + oblige_term`, `declared_by` this act; T-n, *'the opening act declares the terms'*), so undeclared, that write would ride under `Tenure.since`'s gate. The second pair is check-only (class, step, partition); the effect runs once, on the first. Under `H-159`'s control arm (`oblige_term: None`) the edge opens with no term, exactly as at `17a`."
    emits:       ["duty.taken"]
    emits_on_refusal: ["duty.refused"]
    grade:       "ruled"
    refusal_note: "PLAN POSITION `17a`: added with the precondition. §E2 -- 'failure emits, never raises'; W3's rule, *a verb with a `requires` and no refusal channel* produces no Event, no witness and no arc. Refusal condition: the subject is no seat, or the seat's `binds` is off `binds_bases`, or the actor holds the seat, or he is already obliged to it."
    formation_decline_note: "PLAN POSITION `14` (U7-own) DID NOT MAKE THIS FORMABLE, AND MEASURED WHY. `populated.build_realm(0)`, one season, `questions_for` over every claim the season landed: of 4,451 question referents none is a seat (2,300 rungs, 805 persons, 633 Records, 585 Sites, 81 `need` persons, 47 ids of no collection) and no ledger holds a single claim about an office -- so a typed `existence` of `subject` kind `Office` would form on every referent and refuse on every one, growing the always-refused set. `T4`'s bags supply known PERSONS, not seats, and a known-seat source is a second binding mechanism. The fold's `counterparty` clause covers it for the hand-built act."
    source:      "ARCHITECTURE_V2.md §E3, transcribed; body, precondition and refusal from r2 item 9 / `03` §A.9 at plan position `17a`"

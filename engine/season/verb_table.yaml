    contests: "the body"
    requires_typed_note: "⚠ v9 IN-59 (a) (RS-26, the ATTACK half of the access gate) ADDED THE SECOND CONJUNCT, `relation` of `subject`, `with` -- `give`'s co-location carrier, no form, operand or stem added: an attack needs the attacker where his target is. `with` is WORLD-ONLY (`data/requires.py: WORLD_ONLY_STEMS`), so the fighter forms the Candidate on the person he knows of and the fold refuses a target who is not where he is (`kill.refused`, the row's one refusal kind). `presence:` is NOT what carries it (the fold and `opening_set` both decline that column, `H-33`). [ASSUMPTION; medium; Jordan to correct; revert: the single `existence` cell, under which a man fights anyone living anywhere.] ⚠⚠ RULED BY JORDAN 2026-09-20: *\"admit kill and wound as resolvable verbs\"* (`ED-IN-0261`, amended). This cell is what carries that ruling, and the ruling it REVERSES is in the same row: `ED-IN-0261` as first written refused `H-80`'s item on the ground that the row is not a verb. THE ROW WAS UNTYPED (`requires: —`) AND THAT IS THE WHOLE OF WHY IT WAS UNCHOOSABLE — `driver.py`'s contest gate asks `row.requires_typed is not None` because `operands_for` returns `{}` for an untyped row, so a computed contested act would have reached the seam with ONE claimant and `combat_seam` would have returned `PARTY-GAP`. Typing it binds `subject`, which IS the second claimant, and the gate's own recorded reason for the exclusion therefore no longer holds. ⚠ THE CLAUSE IS NOT A STAND-IN AND IS THE NARROWEST ONE THAT DOES THE JOB: you cannot fight someone who is not there, `Person.exists` is the field this row's `Felled` band writes, and `exists:Person` is answered by the reader today (`requires.py:191`). A WIDER precondition — a hostility test, an eligibility-to-fight test — would be an invention, and `G4` weighs under-refusing and inventing equally. What this cell must NOT be read as saying is that a killing needs no more justification than a living target; it says the FOLD can form and carry the act, and everything about whether the person WANTS to is `score` and the deontological gate, neither of which exists yet. ⚠ THE SLASHED NAME SURVIVES THIS COMMIT AND IS SEPARATELY RULED WRONG (*\"kill / wound isn't supposed to be a verb by itself\"*). Splitting it into `kill` and `wound` needed a row of alignment cells each, and `ALIGNMENT` was re-celled whole over the seven `pursuit_axes` — so the split rode that commit (IN-08), where it landed as `challenge` -> `accept` alone: `kill` and `wound` are not verbs (RS-5, ED-IN-0288)."
    requires_note: "⚠ `contests:` IS A REAL FIELD NOW, NOT A NOTE. ARCHITECTURE_V2.md:394 declares the column -- `contests: <prize> | none`, *if set, routes to the seam at RESOLVE (§39)* -- and :434 sets it on this row. The transcription put it here, where nothing reads it, so the fold executed a kill as a DIRECT WRITE. Jordan, 2026-09-02: *that would trigger the personal combat scene. you can't just kill or wound.* The design already said so."
    # ⚠ DEGREE-KEYED 2026-09-03 (#358 rev.2 §C.4 / F6, loader invariant 12). The flat list below
    # was UNCONDITIONAL AFTER THE SEAM RESOLVED, so LOSING the fight killed the loser's target
    # exactly as winning it did. `contests:` routed to the seam and then nothing read the degree
    # that came back -- which is the same defect as the transcription note above, one layer deeper:
    # the column was honoured and its RESULT was discarded.
    #
    # `Failure: []` is lawful HERE AND NOWHERE ELSE, and the act still EMITS with degree=Failure:
    # the attempt happened, was witnessed, and cost a scene. That is what separates a LOSS (the
    # contest occurred and went against you) from a REFUSAL (the precondition failed, no contest).
    #
    # ⚠ RE-DERIVED 2026-09-03 ON A JORDAN RULING, AND THE FIRST VERSION OF THIS BLOCK WAS WRONG
    # IN KIND. Verbatim: *"kill/wound degrees should be directly taken from scene combat, which is
    # what actually needs to be called when kill/wound is considered."*
    #
    # The first version guessed four bands and graded them `assumption` with a sweep. That was an
    # invented MAPPING from a winner to a degree -- exactly the second resolver §27.2 forbids,
    # arriving as a data row instead of as code. The ruling says the degree is not mapped: it is
    # READ OFF THE SCENE, because scene combat computed it.
    #
    # WHAT THE SCENE ACTUALLY CARRIES (`combat_seam.resolve` -> `wound_state`, read from the
    # engine's own WoundTracker on the combatants the seam holds):
    #   felled            -- the fighter went down. `wrapper.fight` sets a result on a
    #                        felling or an unrefused §11.4 yield: read `felled`, never `result != 0`.
    #   wounds            -- gates crossed, floor(cumulative_damage / wound_interval)
    #   health_remaining  -- what is left
    #   result == 0       -- UNRESOLVED, and a RULED legitimate outcome (Jordan 2026-06-02):
    #                        *"an undecided fight is a legitimate outcome."* Not a failure.
    #
    # SO THE BANDS BELOW ARE A READING, NOT A GUESS, AND TWO OF THE THREE ARE MECHANICAL:
    #   felled                      -> the person is down: body, existence, and every tenure
    #                                  naming them closes. This is the kill.
    #   unresolved AND wounds > 0   -> blood was drawn and nobody fell: body only. This is the
    #                                  wound, and it is the case the verb's name has always
    #                                  carried and the table could not express.
    #   unresolved AND wounds == 0  -> the fight happened and changed nothing. WRITES NOTHING and
    #                                  STILL EMITS: the attempt was made, witnessed, and cost a
    #                                  scene. That is a LOSS, not a REFUSAL.
    #
    # ⚠ WHAT REMAINS OPEN IS NARROWER THAN IT WAS AND IS STILL H-98: the engine does not separate
    # a decisive win from a narrow one beyond wound count on the VICTOR, so a fourth band
    # (Overwhelming vs Success) has no source in the data. It is NOT invented here. The three
    # bands below are the ones the scene can distinguish.
    # ⚠ `Person.scar` IS NOT A BAND WRITE, AND ITS TWO CELLS HERE (added 2026-09-18, `ED-IN-0249`)
    # WERE DROPPED: since IN-08 H3 `_eff_kill` writes no scar. The scar is per OBSERVER, written by
    # the fold after any outcome that moved state (`loop/resolve.py::_scar_witnesses`), so no band
    # produces it and declaring it here only ran a check-only gate call for a write nobody made.
    # The `(Person, scar)` row in `write_matrix.yaml` carries the honest `unproduced:` instead.
    # ⚠ AND `scar.taken` IS DELIBERATELY NOT ADDED TO `emits:` BELOW. An `emits:` cell fires PER
    # BAND from the table, but a scar is taken per observer and may be taken by nobody, so a
    # band-level `scar.taken` would report a scar nobody took — the exact `ID-9` defect the flat
    # `person.died` above was, in the same row, one column across.
    writes:
      Felled:       ["Person.body", "Person.exists", "Tenure.until"]
      Wounded:      ["Person.body"]
      Untouched:    []
    writes_grade_note: "ruled -- the SPLIT is read from scene combat (Jordan 2026-09-03); H-98 keeps only the question of whether a decisive win is distinguishable from a narrow one, which the engine currently does not answer. ⚠ EXECUTED 2026-09-04 (`W-E`): all three branches now run end to end through `SeasonDriver.resolve` -> `contest()` -> `combat_seam` -> `wrapper.fight`, and their consequences differ -- Felled deletes the subject and emits `person.died`, Wounded leaves them alive with a lower body and emits `body.changed`, Untouched writes nothing and emits `contest.undecided`. Falsifier: `test_we_a_contested_acts_consequence_differs_by_degree`."
    writes_source_note: "combat_seam.resolve -> wound_state[THE ACT'S SUBJECT]: felled | wounds. ⚠ CORRECTED 2026-09-04 BY `W-E`, AND THE OLD CELL SAID `wound_state[loser]`, WHICH WOULD KILL THE WRONG PERSON. This verb's writes land on `payload[\"subject\"]` (`_eff_kill`), so if the ACTOR is the one felled, reading `[loser]` selects the `Felled` branch and the fold deletes the TARGET -- who is standing. The band is read off the person the writes land on. `health_remaining`/`health_full` are still read, but for the MAGNITUDE (`wound_harm_model`, `H-123`), not for the band."
    # ⚠ `emits:` IS DEGREE-KEYED TOO, AND THE FLAT VERSION WAS A LIVE `ID-9` DEFECT.
    # This read `["person.died"]` for every band. With the bands above that means A WOUND EMITS
    # `person.died` -- a success report for something that did not happen, in the verb whose own
    # name carries the distinction. Every witness in the world would mint a claim that a living
    # man was killed.
    #
    # ⚠ AND THE ANSWER WAS ALREADY IN THE MATRIX, WHICH IS WHY THIS IS A TRANSCRIPTION DEFECT
    # RATHER THAN A DESIGN GAP: `write_matrix.yaml`'s `Person.body` row declares
    # `body.changed` · `person.died`, and `Person.exists` declares `person.died`. The kinds
    # existed; the verb table used one of them for both outcomes.
    #
    # `contest.undecided` is the one NEW kind, and declaring it here IS its declaration -- under
    # invariant 7 the registered roster is DERIVED from the emission columns, so a kind for an
    # outcome that writes nothing has no other home. It is required because the act still
    # happened: it was attempted, witnessed, and cost a scene. Jordan, 2026-06-02: *an undecided
    # fight is a legitimate outcome.* An outcome nothing emits is an outcome nobody can witness.
    emits:
      Felled:      ["person.died"]
      Wounded:     ["body.changed"]
      Untouched:   ["contest.undecided"]

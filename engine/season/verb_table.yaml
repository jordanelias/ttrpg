    requires_typed_note: "`move`'s cell, clause for clause and for `move`'s reasons (§E3 `:408`, *a `contain` path exists*): the journey is the same journey, so a person who believes there is no road (`contain.path:<to>` False, deposited off a `travel.blocked`) forms neither a `move` nor a `migrate` there, through the one reader (`belief_contradicts`). NAMED `path` because the row keys its refusals. The destination's ROOM is not a cell: the grammar compares one entity's scalar against an operand or a second read on the SAME entity, and room is the destination's capacity against its residents PLUS the migrant's own weight, minus himself if he already lives under it -- so it is the effect's decline, on `_eff_found`'s precedent for what the grammar cannot spell. So is a destination the ladder will not seat him in, and one he already lives in."

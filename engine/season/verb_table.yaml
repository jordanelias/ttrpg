# PART E, AS DATA — THE VERB TABLE, WHICH IS THE RESOLVER'S BODY.
#
# W3 of `architecture/PLAN.md`, and PLAN §5.1 calls it "the item
# that turns grading into running". #353 gives `resolve : (Act[], World) -> Event[]` and NEVER SAYS
# WHAT ANY VERB DOES — the semantics are prose scattered across §11, §36, §37 and §54. That is
# defect `D20`, and it is why the tested instrument could only GRADE cases and never RUN them: with
# no table, every act needed a hand-written `effect` lambda, and a lambda per act IS a second
# resolver.
#
# ONE `resolve` READS THIS TABLE. The fold is: eligibility → `requires` evaluated AGAINST THE WORLD
# THE PREDECESSORS LEFT → each `writes:` through `write()` → `emits` or `emits_on_refusal`.
#
# `emits_on_refusal` IS THE SCARCITY CHANNEL AND IT IS LOAD-BEARING (§27.1, §E2). "The second
# claimant on an emptied granary gets a DIFFERENT Event." A verb that RAISES on a failed
# precondition produces no Event, no witness and no arc — so scarcity stops being something the
# world does and becomes something the engine forbids.
#
# `writes:` ENTRIES MUST BE ROWS OF `write_matrix.yaml`. Anything else is an unmarked cell under
# §30's own rule. The loader checks it; a verb naming a pair Part D does not carry raises at load
# rather than at the first act that uses it.
#
# ⚠ `OBSTACLE` IS NOT `OBSTRUCTION`, AND THIS TABLE IS WHERE THE TWO GET CONFUSED (ED-IN-0220).
# `ED-IN-0210` Ruling 1 — Jordan, 2026-09-10 — says a real interaction has a COUNTERPARTY, an
# OBSTACLE and a DEGREE. The OBSTACLE is the difficulty this act is resolved against: the `Ob` a
# pool is thrown at, resolver-side, a number, and a person may BE one. It is what `contests:`
# routes to. OBSTRUCTION is a different thing entirely — `T-g` in
# `architecture/meta/01_AXIOMS.md`, where another person's PRIOR act refuses yours, enforced by a
# precondition like `confer`'s 1-per-object and carried by `emits_on_refusal`. An obstacle is
# ROLLED AGAINST; an obstruction produces a REFUSAL and no degree at all, and needs no verb, no
# field and no knowledge of the obstructor. Look for an `obstruct` verb here and you will not find
# one, by design. Defined at both sites per `CLAUDE.md` §4; `T-g` is the prose home.
#
# ELIGIBILITY IS ONE OF FOUR KINDS — `own`, `remit:<act>`, `hold:<object>`, `presence:<rung>` — AND
# NEVER `capability`. #353 §9.2: "`capability` supplies dice and GATES NOTHING." An office makes an
# ORDINARY verb eligible; no verb exists only for office-holders, and none carries a modifier.
#
# WHAT W3 CHANGED, each with the reason:
#   * FOUR VERBS ADDED that #353 names and Part E omits — `utter`, `establish`, `exchange`,
#     `succeed`. Without `utter` NO PROPOSITION EXISTS and `commit`/`petition`/`issue` cannot fire,
#     so the season cannot start.
#   * SIX REFUSAL EVENTS ADDED. W3 names `tell`; applying W3's own rule rather than its list finds
#     the same defect in `commit`, `repudiate`, `comply`, `evade`/`defy` and `construe` — each had a
#     `requires` and no refusal channel. The eight verbs still without one genuinely have no
#     precondition.
#   * `restore`'s EFFECT FORMULA moved out of its `requires` column. A precondition is a question
#     the fold asks of the world; an effect is what the write does.
#   * `open_case`'s eligibility graded `assumption` with `own` swept — #353's five remit acts are
#     CLOSED and opening a case is not among them, so V2 invented one.
#   * `create_record` and `destroy_record` regraded from `D7` — a Part B DEFECT ID sitting in the
#     grade column — to `ruled`, which W2 earned by landing Part D's five `Record` rows.
#
# PROVENANCE. The 28 carried rows are extracted mechanically from §E3's markdown table. ⚠ The first
# extraction SILENTLY DROPPED FOUR of them — `transfer`, `work`, `restore`, `destroy_record` —
# because their cells contain an ESCAPED pipe (`own \| hold:<store>`) and a naive split produced
# nine columns, which a `len == 8` filter then discarded without a word. The extractor asserts that
# nothing is skipped now. A filter that drops what it cannot parse reports clean over an unknown
# number of missing rows.

# =============================================================================================
# ⚠ CONDITIONED BY #358 rev.2, 2026-09-03. WHAT THIS TABLE NOW FAILS, AND THE RESOLUTION FOR EACH.
#
# #358's Stage 4 was rewritten after an adversarial pass; its loader gained a twelfth invariant and
# corrected four others. Run against THIS table, the rewritten loader refuses it in three places.
# They are recorded here rather than fixed silently, because two of the three need a ruling.
#
# 1. `scale:` ON NINE ROWS FAILS INVARIANT 10 (unknown key; `scale:` refused BY NAME).
#    Rows: confer, determine, dispatch, establish, exchange, issue, requisition, revoke, succeed.
#    #358 §E.3 and Stage 2 §C.3: scale is a POSITION IN THE CONTAINMENT TREE, derived on demand,
#    stored nowhere -- "a label cannot be walked", and indexing code by scale deletes the property
#    that makes one type with many kinds worth having.
#    ⚠ DO NOT DELETE THE NINE KEYS YET. They answer a real Jordan question ("is it unnecessary to
#    nest these and instead just explicitly define scale?"), and #358 rev.2 supplies the answer:
#    THE SCOPE OF THE SEAT BEING EXERCISED -- `Act.via.scope` -- not a column on the verb. The key
#    is retired when `Act.via` carries the scope; until then each row's `scale_note` is the
#    provenance that would be lost. Tracked as the conditioning item, not as a hole.
#    ⚠ `convene`'s WAS THE TENTH AND IS GONE (plan position `18`/PROC-A, 2026-09-29). It is the one
#    row `Act.via` did not need to earn: Jordan's 2026-09-05 correction replaces it with an ordinal
#    read off the act's own `subject` operand rather than the exercising seat's scope, so it did
#    not wait on the general retirement condition above -- see the row's own `requires_note:`.
#
# 2. `kill / wound` NOW CARRIES A `Degree`-KEYED `writes` (invariant 12, #358 §C.4 / F6).
#    Done, in this file. It is the only row declaring `contests:`, so it is the only row affected.
#    The BANDS are `assumption` and swept at H-98; the SHAPE is ruled.
#
# 3. INVARIANT 4 IS WIDENED to every failable clause, not only a `requires`.
#    `kill / wound` gained `kill.refused` (a seam can return a typed Refusal at the depth cap).
#    ⚠ STILL OPEN: eligibility itself can decline -- `destroy_record` declines on BOTH its
#    alternatives (H-75) and can never fire -- and no row declares an eligibility-refusal kind.
#    The live fold emitted `act.ineligible`, `act.refused` and `attempt.refused` as BODY LITERALS; since
#    v9 SC-02 `23` they are the declared column `rosters.yaml: fold_kinds` and members of the derived
#    roster (`data/verbs.py::EVENT_KINDS`), which `loop/resolve.py::_act_events` holds the fold to. The
#    flat half of invariant 4 is the loader's too: a flat row with two or more failable clauses may
#    declare ONE refusal kind (`data/rosters.py::PERSON_DEMANDED`, the kind the fold keeps only when earned, is exempt).
#
# WHAT #358 rev.2 DOES NOT CHANGE HERE, checked rather than assumed: all 32 `writes:` entries
# resolve to `write_matrix.yaml` rows; all eligibility kinds are in the four-member roster and none
# is `capability`; all 24 verbs carrying a `requires` carry a non-empty `emits_on_refusal`.
# ⚠ THE LAST FIGURE IS 2026-09-03's AND ED-FI-0009 MOVED IT. The six investigation acts each carry
# a real `requires` and a `finding.none` refusal. MEASURED off the loaded table: **28** rows carry a
# `requires` that is not the em-dash, and **none of them lacks an `emits_on_refusal`** — the
# invariant this line asserts still holds, at a larger denominator. ⚠ THE FIRST WRITING OF THIS
# NOTE SAID 30, WHICH WAS 24 + 6 DONE IN MY HEAD RATHER THAN READ OFF THE TABLE; the old 24 and the
# new 28 do not differ by six, so the earlier figure counted something differently and is left as
# the dated statement it is rather than reconciled here.
# =============================================================================================

verbs:
  - verb:        "carry"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "none"
    beneficiary_note: "the good accrues to the PETITIONER, and a `carry` Candidate carries the petition (`subject`, a `Record` of kind `petition`) rather than the person who filed it."
    referent_class: Record
    referent_class_note: "v10 REM-25 (B10-05, AM-A-10; M19 taken, [ASSUMPTION; medium; Jordan to correct]): FORMED ONLY ON A `Record` THE PERSON HOLDS -- `queries/world_q.py::records_held_for_holding_rows` stamps the Records on his live `hold` edges whose kind a `Record` row asking `held_by` of `subject` asks `existence` of (`data/verbs.py::HOLDING_RECORD_KINDS`, derived off the cells: this row's `petition`, `found`'s and `build`'s `works`) onto the question he answers as `Record`, beside `writs_held`'s writs (IN-53 D1's partition, `_stamped`), and `decision/options.py::opening_set` then forms on the classed ids alone, so `subject` binds a held Record and never a person, a Site, a Proposition or a rung. `Record` is held back from the own-referent term (`rosters.yaml: occasion_only_classes`): a question about a petition does not stamp it, holding it does. THE CLASS REMOVES WRONG-COLLECTION FORMATIONS AND IS SHARED: this row's cell, its eligibility and the fold's `held_by` test are unchanged, and `comply` keeps its addressee test (a petition's holder is not its addressee); but one class cannot tell a petition from a works or a writ, so this row also forms on a held writ (a dispensation naming him), and `comply`, `found` and `build` form on a held petition, and the fold refuses each on its own kind (`tests/test_referent_class_stamps.py`). MEASURED before the class (`f2381695`, `aperture 1 s`, realm arm, s = 0/1/2): formed for 83 of 83 persons, attempted 15/18/12, executed 0/0/0, every one refused `carry.refused` on the last read `exists:petition=0` (15/18/12); those formations stop, and the refusal Events they emitted stop with them, with the WITNESS deposits those carried. READ AFTER (same instrument): formed for 9/4/9 persons -- those who hold a petition -- attempted 2/0/1, executed 2/0/1, refused 0/0/0; `carry` executes where it did not, a reading of a seeded trajectory and not a claim that it will. Wrong-kind refusals over the four `Record` rows (`comply`, `carry`, `found`, `build`; REM-11's last-read `exists:<K>=0`, one season): 38/45/45 before, 2/3/2 after (`comply` 2/2/1 on `exists:dispensation=0`, `build` 0/1/1), so the home's stopping rule (not below the base: revert) does not fire. A person who holds a petition forms this row on it and the fold executes it; one who holds none forms none (`tests/test_referent_class_stamps.py`). REVERT: delete this column (and the term in `questions_for`)."
    requires:    "a Petition exists, and the actor holds it; costs budget like any act"
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      petition
        - form:      relation
          of:        subject
          relation:  held_by
    held_note:   "v9 IN-45: THE SECOND CONJUNCT IS `found`'s CELL (`relation` of `subject`, `held_by`) and no form, operand or stem is added. #453's row for `carry` (*'the petitioner holds his petition'*) and its relation table (*'a held petition -> the docket'*): `carry` is the right of the one who holds the document, as `open_case` is the remit of a seat. The petitioner holds his petition from the mint (`_mint_document`'s maker's `hold`), and `give` can hand it on, so a petition can be carried by another hand only once it is in that hand. Refused, it is `carry.refused`. [ASSUMPTION; medium; Jordan to correct; revert: the single `existence` cell, under which anyone who knows of a petition may docket it.]"
    kind_note:   "⚠ `Petition` -> `petition` AT PLAN POSITION `15`, AND IT IS A CHANGE OF WHAT IS ASKED, NOT A SPELLING. `exists:Petition` read `World.petitions`, a dict no production code wrote; that dict is deleted and a petition is a `Record` of kind `petition` (`04_CODE_ARCHITECTURE.md` §B.5 -- *`forge`, `destroy_record`, `hold` and `carry` reach them with no new rows*). `exists:petition` asks *a Record of that kind exists*, which `queries/world_q.py::WorldReader.read` answers from `rosters.yaml: record_kinds`. Until v9 IN-45 `carry` did not execute: Part E never says WHAT a carried petition puts on which docket (`H-63`); IN-45 answered it (`writes_note`)."
    requires_typed_note: "§E3 `:415` — *a Petition exists; **costs budget like any act***. The second half is not a precondition; §26.3's budget is spent by every act and is charged in `pack_scenes`. ⚠ THE SCOPING IS A CHOICE AND IS DECLARED: the prose is INDEFINITE (*a* Petition) and this reads it as *the petition being carried*, which is the act's `subject`. The alternative — any Petition anywhere in the world — would admit a `carry` of a petition that does not exist, and `carry` writes `(DocketItem, matter)`, i.e. it carries a PARTICULAR one. Under-refusing is the failure `G4` weighs equally with an invention, so the tighter reading is taken and named."
    writes:      ["Record.stages", "DocketItem.matter", "DocketItem.arrangement", "DocketItem.petition"]
    emits:       ["petition.carried"]
    emits_on_refusal: ["carry.refused"]
    grade:       "ruled"
    writes_note: "v9 IN-45 BUILT THE EFFECT (`loop/effects_information.py::_eff_carry`) ON AN EXISTING GATE SHAPE -- NO FOURTH `Subject`. Plan position `14` (U7-own) declined it because the one write, `(DocketItem, matter)`, is an append to `World.docket`, a SEQUENCE the gate has no `get()` for, and `carry` minted nothing for the append to ride on, so every carry would name nothing that moved and refuse as `NoOpReceipt`. #453's `carry` row is the answer, and it needs no new shape: *build on `open_case`'s body, writing the petition's `Record.stages`*. `Record.stages` is ADDED as the FIRST pair -- the act re-winds the petition's clock (`_declared_stages`, `H-80`'s default for a computed act), so the petition RECORD moves, the gate's `entity` shape observes it, and its receipt names the petition, which the appended docket item names under `DOCKET_PETITION` (v9 SC-03a). The append rides on that receipt, as `open_case`'s rides on its case file; every decline comes before the write, because the gate does not restore a docket. The MATTER (`H-63`'s value for this row) is the petition's `terms`, `open_case`'s precedent (it dockets its subject, the party `determine` binds). [ASSUMPTION; medium; Jordan to correct; revert: the matter is the petition's own id; the stages appended rather than replaced.] The later pairs, `(DocketItem, matter)` and the item's `arrangement` (`None`) and `petition` keys, are check-only (each admits RES in the ACTS class), as on `open_case`, which declares the same three cells for the same `_docket_item` shape."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "argue"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "actor"
    beneficiary_note: "v9 IN-12 step 9 (#453 §9.4: *'beneficiary `actor`'*): THE ARGUER -- he argues for what he holds right; the hearer is the counterparty, not the party served."
    requires:    "the argued thing is an uttered Proposition, and the hearer is with the arguer"
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      Proposition
        - form:      relation
          of:        to
          relation:  with
    requires_typed_note: "v9 IN-12 step 9 -- #453 §9.4's cell, verbatim in shape: *`existence` of `subject` kind Proposition ∧ `relation` of `to`, `with`*. `commit`'s `subject` conjunct (the thing argued is an uttered Proposition, in the arguer's reach since IN-11's maker's hold) and `tell`'s `hearer` conjunct (world-only, `ED-IN-0282`). ⚠ THE CELL BINDS `to` BESIDE `subject`, so `TypedRequires.known_person_operands` names `to` and `decision/options.py::operand_bags` forms one Candidate per person the arguer KNOWS (#453: *'the hearer, by the known-person fan'*) -- `tell`'s and `covenant`'s shape. A computed `argue` on any referent that is no Proposition is refused in the fold (`argument.refused`), as `commit`'s and `covenant`'s are."
    counterparty: to
    counterparty_note: "THE HEARER IS THE SECOND SIDE (#453 §9.4: *'counterparty `to` (the hearer, by the known-person fan)'*): the contest's opponent (`loop/resolve.py::_contest` reads `row.counterparty`), and the person whose pursuits a won argument moves. An argument with oneself is declined person-side and refused by the fold's `counterparty` clause, `tell`'s precedent."
    contests:    "a proposition"
    contests_note: "v9 IN-12 step 9 (#453 §9.4: *'contests: `a proposition` (social_contest, interim `sigma_leverage`)'*): the prize `determine` already claims (`rosters.yaml: contest_subsystems.prizes`), rolled by the social contest module (`social_contest.roll`, steps 13 + 15 repointed the interim). No new prize, no new provider."
    writes:
      Overwhelming: ["Person.pursuits"]
      Success:      ["Person.pursuits"]
      Partial:      []
      Failure:      []
    writes_note: "v9 IN-12 step 9 (#453 §9.4; K-21): `loop/effects_information.py::_eff_argue` MOVES THE HEARER'S `Person.pursuits` -- the ARGUMENT half of `(Person, pursuits)`'s *'moved by argument and consequence, never by evidence'* (#353 §9.3; AX-3), whose CONSEQUENCE half `determine` has produced since SC-02 `22b` step 24. HOW FAR AND TOWARD WHAT is #453's own [GAP] (*'which weight moves, and toward what'*), answered here by the narrowest reading the tree composes on [ASSUMPTION; medium; Jordan to correct; revert: Jordan names the direction]: each pursuit the hearer HOLDS (a weight above zero, `consequence_pursuits`' sense) moves TOWARD THE ARGUER'S OWN WEIGHT on it by `pursuit_shift x DEGREE_STEP[band]` of the gap (`queries/person_q.py::argued_pursuits`) -- the swept `Fixtures.pursuit_shift` (`H-221`) and the one degree ladder `determine` reads, so two moves of one field share one methodology (§0.06 S). ⚠ `Partial` WRITES `[]`: #453 writes it *'at the Partial magnitude [ASSUMPTION]'*, and on `DEGREE_STEP` that magnitude is 0 (*'a held matter moves nothing'*), so declaring the write would turn every Partial into `argument.refused` (`NoOpReceipt`). `Failure` writes nothing (#453: *'Failure → `[]`'*). A won argument that leaves the hearer where he stood (the same weights, none held, or `pursuit_shift` 0, the control) moved nothing and is `argument.refused` at its write (F9)."
    emits:
      Overwhelming: ["argument.won", "pursuit.moved"]
      Success:      ["argument.won", "pursuit.moved"]
      Partial:      ["argument.won"]
      Failure:      ["argument.lost"]
    emits_note: "#453 §9.4's kinds (*'Overwhelming, Success, Partial → `argument.won`; Failure → `argument.lost`'*), plus `pursuit.moved` -- the matrix row's own kind (`write_matrix.yaml` `(Person, pursuits)`), `determine`'s precedent -- on the two bands that write it. ⚠ `argue` IS THE SECOND EMITTER OF `pursuit.moved`, so the kind is SHARED (`data/verbs.py::KIND_VERB` no longer maps it) and `align_kind` reads its authored `deed:pursuit.moved` cells, held at `0.0` on every axis (`rosters.yaml: alignment`): a moved pursuit is no deed of the person moved. `test_season_shape.py::test_t2_align_kind_reads_the_one_emitter_and_a_deed_key_needs_an_emitted_kind` is the designed tripwire for this second emitter."
    emits_on_refusal: ["argument.refused"]
    refusal_note: "v9 IN-12 step 9, #453 §9.4: *'Refusal: `argument.refused` (one kind)'* -- the loader's contested-row rule too (the seam's party-gap refusal emits the row's union): the argued thing is no Proposition, the hearer is not with the arguer, the hearer is the arguer (the fold's `counterparty` clause), or a won argument moved nothing."
    grade:       "assumption"
    grade_note:  "an argued addition (#453 §10.4 step 9): the row, the pursuit direction and the Partial reading are v9 IN-12's, on #453 §9.4 `:1896-1923`, K-21 `:2737-2742`."
    source:      "v9 IN-12 step 9 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.4 `:1896-1923`"
  - verb:        "arrest"
    stratum:     "contested_physical"
    eligibility: ["remit:dispatch"]
    eligibility_note: "v9 IN-12 step 5 (#453 §9.1, the `arrest` row): `remit:dispatch` -- the act `state/gate.py::WARRANT_ACT` names, so the fold's eligibility and the gate's `warrant` basis read one grant. J-8 (whether `dispatch` is a remit act at all, `offices.yaml` `meta: remit_unruled`) is Jordan's; this row moves with `WARRANT_ACT` and the ruling. Built on `remit_default` (§A v9, J-8 partly answered)."
    beneficiary: "none"
    beneficiary_note: "#453 §9.1: `none` -- custody is taken AGAINST the prisoner and FOR the seat that issued the warrant (K-17/K-52), an Office no Candidate carries; `seize`'s and `revoke`'s shape."
    requires:    "the subject is a person"
    requires_typed:
      form:      existence
      of:        subject
      kind:      Person
      conjunct:  party
    requires_typed_note: "v9 IN-12 step 5 -- #453 §9.1's cell, one conjunct: *'`existence` of `subject` kind Person (conjunct `party`)'*. ⚠ THE WARRANT IS NOT A CONJUNCT, AND THAT IS THE ROW'S OWN TEXT (*'The warrant is not a stem'*): a Record's content, which no form of the grammar reads and no gate basis may (K-52). Person-side it is `rosters.yaml: warrant_sourced` (`arrest: dispensation`, `seize`'s line beside it) -- `arrest` forms only on a `subject` a HELD dispensation's `terms` names (`decision/options.py::opening_set`); world-side the effect (`loop/effects_information.py::_eff_arrest`) reads the same held warrant and declines an act whose actor holds none (`arrest.refused`, the `write` clause). The seat's authority is the gate's `warrant` basis (`state/gate.py::may_warrant`), asked by the effect before it builds the edge, so an admitted act is never killed at the gate."
    counterparty: subject
    counterparty_note: "#453 §9.1: *'counterparty `subject`'* -- THE PRISONER IS THE SECOND SIDE: the contest's opponent (`loop/resolve.py::_contest` reads `row.counterparty`), the man who resists. A self-arrest is declined person-side and refused by the fold's `counterparty` clause (`may_warrant` refuses it at the gate too)."
    contests:    "a standing"
    contests_note: "#453 §9.1: *'contests: `a standing` (`sigma_leverage`, interim) [CONFIDENCE: medium -- whether resisting arrest is a contest of standing or of the body]'*: the prize `tell` already claims (`rosters.yaml: contest_subsystems.prizes`). No new prize, no new provider. [ASSUMPTION; medium; Jordan to correct; revert: a contest of the body, whose Failure hands off to `fight` rather than carrying its own prize.]"
    writes:
      Overwhelming: ["Tenure.since"]
      Success:      ["Tenure.since"]
      Partial:      ["Tenure.since"]
      Failure:      []
    writes_note: "v9 IN-12 step 5 (#453 §9.1): `loop/effects_information.py::_eff_arrest` OPENS ONE `detain` EDGE, prisoner -> THE SEAT THAT ISSUED THE WARRANT, read through `state/attribution.py::causing_act` on the warrant Record's creating Event -- that Act's `via` (K-17/K-52): the enforcement seat acts `via` but does not own the edge, so the issuing seat's bench is who may `pardon` it. Admitted at the gate under the `warrant` basis (`state/gate.py::may_warrant`: the exercised seat sits, grants `WARRANT_ACT`, and its purview reaches the prisoner's home). `Partial` opens the edge as `Success` does (#453: *'[ASSUMPTION: no degraded magnitude exists for an edge]'*); no `Tenure.degree` is written (the row does not declare it). `Failure` writes nothing: the man resisted. DECLINES (`NO_CHANGE` -> `arrest.refused`, the `write` clause): no held warrant names the subject; its issuing seat is unreadable or no seat; the subject is already in custody (one live `detain` per prisoner, #453 §8.1 Custody [ASSUMPTION]); or the gate's `warrant` basis would refuse."
    emits:
      Overwhelming: ["arrest.made"]
      Success:      ["arrest.made"]
      Partial:      ["arrest.made"]
      Failure:      ["arrest.resisted"]
    emits_note: "#453 §9.1's kinds, keyed on the ladder's own four names. Two NEW kinds, each emitted by this row alone (`data/verbs.py::KIND_VERB`)."
    emits_on_refusal:
      eligibility:  ["arrest.unauthorized"]
      party:        ["arrest.refused"]
      write:        ["arrest.refused"]
      counterparty: ["arrest.refused"]
    refusal_note: "#453 §9.1: *'eligibility -> `arrest.unauthorized`; party, write, counterparty -> `arrest.refused`'*. TWO KINDS ON A CONTESTED KEYED ROW ARE LAWFUL SINCE v9 IN-12 step 5's PARTY-GAP FOLD EDIT (K-02): the seam's party gap and S27.4's under-1D refusal emit `row.refusal_for(COUNTERPARTY_CLAUSE)` (`loop/resolve.py::_refuse_party_gap`), and the loader's contested-row rule narrows to rows that key no `counterparty` (`data/verbs.py`). ⚠ S27.4's refusal is labelled with the counterparty kind (`arrest.refused`) though it is the actor's pool, not the counterparty, that failed [ASSUMPTION; medium; Jordan to correct; revert: one kind under every key]."
    grade:       "assumption"
    grade_note:  "an argued addition (#453 §10.4 step 5): the matrix row `(Tenure, since)` is the tree's; the row, the issuing-seat reading and the warrant formation are v9 IN-12's, on #453 §9.1 `:1570-1611`, K-17, K-52, K-53."
    source:      "v9 IN-12 step 5 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.1 `:1570-1611`"

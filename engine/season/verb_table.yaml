    referent_class: Person
    referent_class_note: "v10 REM-28 (B10-06, AM-A-14, [ASSUMPTION; medium; Jordan to correct]): THE NAMED PERSON. FORMED ONLY ON A `Person`-CLASSED REFERENT -- the plain referent of the question he answers that is a person or a cohort (`queries/world_q.py::own_referents_of_class`, REM-21's term, stamps it through `_stamped`, as `open_case` and `petition` use it: `Person` is not `occasion_only`, and a person's own `person`-kind rung is a `Person` there, `World.class_of`) -- and `decision/options.py::opening_set` then forms on the classed ids alone (IN-53 D1's partition), `subject` binding it through the unchanged referent rule (`_derive_operand`), so `subject` never binds a rung, a Record or a Site. `loop/predicates.py::_req_dispatch` ('the named person exists': `subject` in `w.persons`) is the only reader of the referent -- the row writes nothing and has no effect function, so what is ordered rides `order.given`. THE CLASS REMOVES WRONG-KIND FORMATIONS ONLY: this row's eligibility (`remit:dispatch`), its cell and whom a seat may order are unchanged. THE LIMIT, STATED: `dispatch` is an UNTYPED PREDICATE row, so a refusal records no `observed` read -- REM-11 files its refusals under 'other', and REM-22's test shape for the typed rows (a refusal on an `exists:<kind>` read) cannot observe it; the kind failure is read off the predicate's own refusal clause (REM-14's `_refuse` trace) and `tests/test_referent_class_stamps.py` holds the untyped row to that. The class is shared with `open_case` and `petition` and moves no derived set: `DECLARED_CLASSES` already holds `Person`, and `RUNG_REMIT_ACTS` reads `Rung` rows alone. A computed `dispatch` forms only on an id `World.class_of` holds, so `person.demanded` (SE-01's census individuation trigger, `loop/census.py`) is reachable only by a hand-built act. REVERT: delete this column."

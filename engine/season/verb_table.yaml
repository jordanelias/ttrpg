    referent_class: Record
    referent_named: true
    referent_class_note: "v9 IN-09 (H-203, DECISION 2026-10-13 [ASSUMPTION; medium; Jordan to correct]): FORMED ON A WRIT THE PERSON HOLDS AND IS ADDRESSED BY, AND HIS OWN LEDGER NAMES. `queries/world_q.py::writs_held` stamps the dispensations on his live `hold` edges onto the question he answers as `Record` (IN-53 D1's partition, `_stamped`), and `referent_named` (IN-10 (a)'s column) keeps the Candidate to a writ `person_q.ledger_names` names -- the content claim WITNESS deposits for a new holder. A WRIT is stamped by `writs_held` alone (the own-referent term skips it), so a bystander who merely saw it issued is offered no `comply`; the shared `Record` class also forms the row on a held petition or works and on a Record the question names, which the fold refuses on `exists:dispensation`. REVERT: drop both columns."
    requires:    "a claim of the dispensation's terms is in the actor's own ledger"
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      dispensation
        - form:      own_ledger
          of:        subject
    requires_typed_note: "v9 IN-09 (`19b`, J-2 arm A, J-10) TYPES THIS CELL. §E3 `:430` — *a claim of the dispensation's terms is in the actor's **own** ledger*. §F.24a form 6, `tell`'s form, and THE OPERAND IS THE ACT'S `subject`, READ AS THE WRIT: after plan positions `15`/`15c` a dispensation is a `Record` of kind `dispensation` (`rosters.yaml: record_kinds`), and its holder holds `(writ, content:dispensation, <terms>)` by the content deposit (`loop/witness.py`), so the act's subject IS the dispensation whose terms are sought and no operand is coined (`H-94` is not filled; the closed roster stands). TWO CONJUNCTS, UNNAMED (`survey`'s precedent: an unnamed own-ledger clause carries no `said`): `existence` of `subject` kind `dispensation` -- the act answers a WRIT, so a person, a rung or another kind of document is refused; `own_ledger` of `subject` -- the actor's own ledger holds a claim on that writ (the `F8` carve-out, `claim.held`). ⚠ LIMIT: `claim.held` accepts ANY claim on the writ, not only its `content:` claim, so a person who saw the writ issued and never read it passes the fold; a predicate-typed ledger read is a grammar change. In computed play the formation (`referent_class` above) offers it only to a writ's addressee who holds it (`writs_held`), who holds the content claim; the own-referent term never stamps a writ (the B10-05 close), so a non-addressee whose question names it is offered no `comply`, though this cell would admit him (`test_in09_dispensation_answer.py`'s fourth test). ⚠ ARM (A)'s `dispatch`ed ORDER IS NOT ANSWERED: an order mints no Record, so there is no writ to bind."
    writes:      []
    emits:       ["compliance.given"]
    emits_on_refusal: ["compliance.impossible"]
    grade:       "ruled"
    writes_note: "per the term's own row. ⚠ v9 IN-09: EMISSION-ONLY, #453's hook (`proposals/2026-10-03-verb-coverage-and-gap-fill.md:502`): `comply` writes nothing itself and emits `compliance.given`; what compliance PERFORMS is the separate act the writ names (`transfer`, ...). The fold calls an effect only for a declared write and `effect_carried` answers a row writing nothing without one, so no `_eff_comply` exists (it would be a body nothing calls, `ID-13`). Which acts a dispensation's `terms` may name stays `H-44`'s (re-scoped)."
    refusal_note: "§E2 -- 'failure emits, never raises': a verb with a `requires` needs a refusal channel, or a failed precondition produces no Event, no witness and no arc. Refusal condition: no claim of the dispensation's terms is in the actor's own ledger"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "conceal"
    difficulty:  "plain"
    difficulty_note: "B07.01 (18-A, The resolution, decided, 3): `plain`, 18-A's default where the owning verb lane has stated no level; read by the draw only (`task_draw_arm` `on`)."
    capability:  "none"
    capability_note: "B07.01 (workplan v12 B07-task-draw UNDECIDED (11) (iv)) [ASSUMPTION; Jordan to correct]: no skill of `descriptor_registry.yaml: capabilities` (argue, arms, copying, inquiry, law) covers `conceal`, so the draw rolls the untrained `pool_default` (`seam/wrappers/pool.py::faculty`) until a skill is defined for it."
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "actor"
    governing:   [attr.social.grace, attr.mind.focus]
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    beneficiary_note: "v9 IN-12 step 10 (#453 §9.3: *'beneficiary `actor`'*): THE CONCEALER -- the cover is minted into his own hand and hides his own name."
    requires:    "the actor is an individual, not a population"
    requires_typed:
      form:      relation
      of:        actor
      relation:  individual
      conjunct:  individual
    requires_typed_note: "B10.60 (`proposals/02_CHAR_offer_what_can_be_done.md` edit 3; [ASSUMPTION; medium; Jordan to correct; revert: drop this cell and the `individual` refusal key, which restores `requires: —`): `fight`'s `individual` conjunct of `actor`. A population's heavy moves are petition, migrate, work, tend, comply or refuse and riot (A-56); taking a cover is none of them. A cohort forms none (`queries/person_q.py::OwnStateReader`, B10.59) and a hand-built cohort act is refused with the row's one refusal kind. The cell is the ONLY precondition: the note below states the row as #453 §9.3 had it, with none."
    requires_note: "#453 §9.3: *'requires: — (no precondition, so an empty `emits_on_refusal` is lawful)'*. Untyped before B10.60, `create_record`'s shape: a computed `conceal` forms on its question's referents and carries `subject`, which the effect does not read (the cover names the actor, not the referent). ⚠ ONE PERSON-SIDE DECLINE, NOT A PRECONDITION: a person holding a cover that names him forms no second one (`rosters.yaml: held_document_declines`, read in `decision/options.py::opening_set`), #453's *'a person-side decline while the actor holds a live cover'*; a hand-built act is not declined by the fold."
    writes:      ["Record.exists"]
    writes_note: "v9 IN-12 step 10 (#453 §9.3; K-19): `loop/effects_information.py::_eff_conceal` MINTS A `Record` OF KIND `cover` through `_mint_document` -- `terms` THE ACTOR, written by the effect whatever the act's `subject` (#453: *'`terms` = the actor, written by the effect whatever the act's `subject`'*); the Record's own id is the alias; the maker's `hold` opens with it; its stages are the mint's (`_declared_stages`, `H-80`'s default for a computed act), which MATTER matures, not `Record.ttl`. `forge`'s declaration, the one pair the mint writes as its declared write (the stages are wound inside it). WHAT THE COVER CHANGES IS ATTRIBUTION AFTERWARDS, NOT WITNESSING (K-19): `state/attribution.py::anchor_of` answers the cover's id at tier 1 for an act by a person holding a cover whose `terms` is himself while a stage is unmatured (`live_cover`), so the deposits about his later acts are about the alias and his knot-partners stop witnessing by key (`epistemic._ch_witness_key` tests `pid == anchor`); `seen.who` still names him for those present (`epistemic._term_who` reads the act). Ended by `destroy_record` or by its stages maturing (#453 §8.1)."
    emits:       ["cover.assumed"]
    emits_note: "#453 §9.3's kind, emitted by this row alone. ⚠ NO CHANNEL EXCEPTION (K-19): taking a cover is witnessed as any act is, by `witness_channels`' ordinary precedence -- a per-verb exception there would be scripting drift. `social`, so `_ch_chronicle` does not broadcast it."
    emits_on_refusal:
      individual:  ["conceal.refused"]
      write:       ["conceal.refused"]
      draw:        ["conceal.failed"]
    draw_note:   "B07.01 (18-A item 4; A-81): the `draw` clause's Event reports a LOST DRAW, not a refusal (04 §C.4: a refusal is a precondition failed, a loss an outcome that went against you) -- emitted at the Failure band once `task_draw_arm` is `on` (B07.05), with no typed write; its durable write is the Event and the claims WITNESS deposits of it. Kept out of the refusal union (`data/verbs.py::VerbRow.draw_kinds`)."
    refusal_note: "#453 §9.3: no precondition (B10.60 adds the actor's `individual` conjunct, refused with this kind too); a mint that moves nothing (a hand-built act naming the id of an identical Record) is the `write` clause's `conceal.refused` (B07.01; it was the fold's flat `act.refused`)."
    grade:       "assumption"
    grade_note:  "an argued addition (#453 §10.4 step 10): the matrix row `(Record, exists)` is the tree's; the row, the `cover` kind and the `anchor_of` cover read are v9 IN-12's, on #453 §8.2 `:1486-1495`, §9.3 `:1826-1863`, K-19 `:2722-2727`."
    source:      "v9 IN-12 step 10 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.3 `:1826-1863`"
  - verb:        "confer"
    scale:   "settlement"
    scale_note: "conferral seats an office, and an office sits at a rung"
    stratum:     "binding_decision"
    eligibility: ["remit:confer"]
    referent_class: Office
    referent_class_note: "IN-53 (H-207, DECISION 2026-10-13 D1). THE REFERENT CLASS, A PARTITION: `decision/options.py::opening_set` forms a `confer` ONLY on the referents its question carries as `Office` (`state/carriers.py::Question.classes`, via `VerbRow.referents_of`) -- the vacant seats the conferrer may fill and, since v9 IN-10 (a), the seats he was told of (`seats_named`; `confer` does not declare `referent_named`, so it forms on both and the fold refuses a held one), which `queries/world_q.py::questions_for` puts on the question he answers (`_stamped`) -- and never on its plain referents; a row declaring no class forms only on the plain ones, so nothing else moves. A person-side reader has no World and cannot tell an office id from a rung, person, Record or Site id; `data/verbs.py` refuses at load a class `rosters.yaml: referent_classes` does not declare. The office the act names is read by `loop/predicates.py::office_named_by` (`subject`, or a hand-built act's `office`). `revoke` declares no class (D1: it keeps its base behaviour)."
    counterparty: to
    counterparty_note: "IN-53: THE CONFEREE IS THE SECOND SIDE, AND A COMPUTED `confer` MUST CARRY HIM. The row is untyped (`_req_confer`'s `or` and its cardinality have no cell in the closed grammar, and the fold evaluates a typed cell OR a predicate, never both, `loop/resolve.py`), and an untyped row carries nothing, so `_eff_confer`'s `_operand(a, 'to')` would raise `InstrumentDefect` (H-207 cause 4). `to` is a `known_person_operands` member, so `VerbRow.known_person_operands` fans the Candidate over the persons the conferrer KNOWS (`give`'s receiver, `tell`'s hearer): one bag per known person, none when he knows nobody. `determine`'s precedent for a row naming its second side; the fold's counterparty clause (`loop/resolve.py::_admits`) refuses a hand-built `confer` naming nobody as `confer.refused` (the conferrer himself is admitted, `counterparty_may_be_self` below). Formed only on an Office referent (`referent_class` above)."
    counterparty_may_be_self: true
    counterparty_may_be_self_note: "IN-53 (H-207, DECISION 2026-10-13 D2) [ASSUMPTION; medium; Jordan to correct]. THE CONFERRER MAY CONFER ON HIMSELF: the lord who assumes a vacant seat (the cast already has one person holding several). `decision/options.py::operand_bags` ranges `to` over the persons he knows PLUS himself -- he knows himself from his own state, so `known_persons` keeps its three sources (AX-2, ED-IN-0282) -- and both counterparty sites (`opening_set`, `loop/resolve.py::_admits`) waive the self-exclusion for this row alone (`VerbRow.self_counterparty_refused`). ED-IN-0210 ruling 1 (*verbs are not fiats*) is not crossed: a self-conferral writes `Tenure(actor, office)`, not the `Tenure(X,X)` self-loop; it can fail on the world's terms (`may_fill` through `Act.via`, 1-per-object) and be undone by `revoke`; the write gate opens a seat-`hold` under `conferral` even for the actor's own (`state/gate.py::tenure_write_basis`). REVERT: delete this column."
    beneficiary: "subject"
    brute:       "seat"
    brute_note:  "the conferral basis and 1-per-object (`requires`); Grace's pull on who is chosen (AR-35) weighs the choice (AR-04), not a roll"
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    requires:    "the office's conferral basis, the conferee is a living person, and 1-per-object: no live hold on the object, or the holder-Proposition has zero live commit (§54 it. 20)"
    writes:      ["Tenure.until", "Tenure.since", "Tenure.term"]
    writes_note: "IN-10 (b) (#453 §7.2 `:1382`, §9.6 `:2071`: 'the edits are `_eff_confer` and the row's `writes:`'): `Tenure.term` ADDED, on `oblige`'s precedent (plan position `17b`) -- `_eff_confer` opens the seat-hold WITH the term the act declares (`loop/effects_governance.py::_declared_term`, the payload's `term`, a length in seasons; `Term(tick + n, act)`), so undeclared that write would ride under `Tenure.since`'s gate. Check-only, like the second pair. A computed `confer` declares none and opens an untermed hold exactly as before; a termed one is REGENCY or a TERM-LIMITED SEAT, matured at MATTER (`loop/matter.py`'s term branch) under `T-n`, which leaves the seat vacant. The conferral basis admits the opened edge whole (`state/gate.py`). LIMIT carried from #453: the effect still closes EVERY live hold on the seat, so a termed regent displaces the principal; delegation without a hold is IN-48's. [ASSUMPTION; medium; Jordan to correct -- the term's source: an act-declared payload length, `create_record`'s `stages` precedent, since no operand of the closed roster and no live Record kind carries one. REVERT: drop this pair and `_declared_term`.]"
    emits:       ["tenure.opened", "tenure.closed"]
    emits_on_refusal: ["confer.refused"]
    grade:       "ruled"
    eligibility_note: "§E3's eligibility cell carried a PRECONDITION as well as the remit act (`remit:confer + ...`). The act is the eligibility and the basis is a `requires`: the fold splits on the first `:` and tests the whole tail against the remit roster."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "convene"
    stratum:     "binding_decision"
    eligibility: ["remit:convene"]
    beneficiary: "none"
    brute:       "seat"
    brute_note:  "`remit:convene`"
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    referent_class: Rung
    referent_class_note: "v11 CR-56 (reasons-to-convene RL1, [ASSUMPTION; medium; Jordan to correct; revert: drop the `matters_awaiting` term in `questions_for` and the re-slot loop in `loop/calendar.py`]): THE TIER WHERE A MATTER WAITS JOINS THE VENUES. `queries/world_q.py::matters_awaiting` stamps, as `Rung` beside `places_named`, for each undated person-matter on the docket the lowest rung among the convener's own seats granting this row's remit act that contains the matter's place; a sitting convened there fires a slot `world_q.slot_for` reaches from the matter, and CALENDAR's re-slot step fills the waiting matter into it (and into any open slot that reaches it). RL2 (this row stops forming on `places_named`, as a class of its own) was NOT taken, its stated revert: the score reads the verb, never the matter (reasons-to-convene N6). RL5, a matter-sensitive score term, is NOT BUILT: it would be a fourth `score_terms` summand, which amends `ARCHITECTURE_V2.md` §F2 (the resolution design's I6, RJ-layer1), a Layer-1 question. v10 REM-28 (B10-06, AM-A-14, [ASSUMPTION; medium; Jordan to correct]): THE VENUE. FORMED ONLY ON A `Rung`-CLASSED REFERENT -- the Rungs the standing occasions already stamp onto the question he answers: `queries/world_q.py::places_named` (every Rung his own ledger names that the ladder would seat him in and that he does not live under) and `larders_in_purview` (a stocked Rung in his seat's purview) -- and `subject` binds it through the unchanged referent rule (`decision/options.py::_derive_operand`). `loop/predicates.py::_req_convene` (a Rung of rank above `person`, or no subject) and `loop/effects_governance.py::_eff_convene` (which reads `subject` as the venue) are unchanged. THE CLASS REMOVES WRONG-KIND FORMATIONS. THE LIMIT, STATED: THE RUNG STAMP IS PLACES-TO-SETTLE, NOT VENUES. `Rung` is `occasion_only`, so the question's own Rung referent and the place he lives under are NOT carried and every place he has been told of IS, so the row also forms on hearths and settlements known by hearsay (`_req_convene` asks no presence of a convener: 'convene could happen at any scale except individual/person'); each convened date carries the seat that convened it (SC-01's holder step), so CALENDAR forms a docket slot (CP-T05-02, B10-13). THE DERIVED WIDENING, NAMED: classing this row adds its `remit:convene` to `RUNG_REMIT_ACTS` (`{issue, dispatch}` to `{issue, dispatch, convene}`), so `larders_in_purview` is asked of convene-holding seats too; no seat grants `convene` without `issue` or `dispatch`, so no offer moves. REVERT: delete this column; `RUNG_REMIT_ACTS` narrows back to `{issue, dispatch}`."
    requires:    "rank(subject.kind) > rank(person) -- an ordinal floor above the person tier, or subject is NONE (§6.2)"
    requires_note: "⚠ `scale: \"settlement\"` IS DELETED (plan position `18`/PROC-A, `21_RECONCILIATION.md` PHASE 2 step 9). Jordan, 2026-09-05, correcting the row: *\"convene could happen at any scale except individual/person\"* -- and on the reason, *\"unless you mean convene as limited by physical location of participants, but this game can assume people will travel to somewhere ... the `person` kind is the address slot and the `Person` is who stands in it. A proceeding convenes at a place; a person-rung is an address, not a place.\"* `rung_kinds` is an ORDERED roster (person first), so the lawful expression is the ordinal `rank(venue.kind) > rank(person)`, not a kind enumeration (`03_PARAMETERS.md` §C.1's own falsifier: change the roster's membership and see what breaks). Evaluated in `loop/predicates.py::_req_convene`, NOT as a `requires_typed: scalar_threshold` cell -- that form's `check()` reads both sides off the SAME bound entity, so it has no channel for a literal constant without either coining a `requires_operands` member or overloading `floor`'s already-declared, structurally different meaning (`decision/options.py::_derive_operand`'s own stated rule: one meaning per operand name, never a per-verb table). The venue rides the act's `subject` operand -- C-11 (`21_RECONCILIATION.md:379`): *\"subject already binds the rung\"* -- not a `venue` key `requires_operands` has never carried."
    writes:      ["Date.due_at", "ConveningCondition.attached"]
    emits:       ["date.scheduled"]
    emits_on_refusal: ["convene.refused"]
    grade:       "ruled"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "covenant"
    stratum:     "social"
    eligibility: ["remit:issue"]
    eligibility_note: "v9 IN-12 step 7 (#453 §9.2, the `covenant` row): `remit:issue` THROUGH A SEAT ONLY -- an `own` alternative would let anyone mint a treaty (#453 K-14). `issue`'s act, because the instrument IS a dispensation (K-54): a covenant is the seat's writ addressed ACROSS purview rather than down it, so the issuing grant licenses it and no new remit act is coined (`rosters.yaml: remit_acts` is closed). [ASSUMPTION; medium; Jordan to correct; revert: a `remit:` act of its own, which the closed roster would have to admit.]"
    beneficiary: "to"
    brute:       "seat"
    brute_note:  "`remit:issue`; acceptance is the counterparty's own act"
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    beneficiary_note: "THE COUNTERPARTY, who the instrument is FOR -- the `to` operand the typed cell binds (`give`'s and `petition`'s reading of a document handed to its addressee). `subject` is the Proposition, which acts for nobody."
    requires:    "the counterparty is a person, and the terms are an uttered Proposition"
    requires_typed:
      all:
        - form:      existence
          of:        to
          kind:      Person
        - form:      existence
          of:        subject
          kind:      Proposition
    requires_typed_note: "v9 IN-12 step 7 -- #453 §9.2's cell, verbatim in shape: *`existence` of `to` kind Person ∧ `existence` of `subject` kind Proposition (the terms are uttered first)*. TWO CONJUNCTS, each on an existing form: the counterparty EXISTS AND IS A PERSON (`issue`'s `executors` conjunct, unnamed here -- only a person acts, and accepts by his own `commit`, AX-1), and the terms EXIST AND ARE A PROPOSITION (`commit`'s own cell, so the instrument names exactly what its acceptance commits to; K-54: a treaty or alliance is an uttered Proposition both holders commit to, never a Record kind of its own). ⚠ NO PURVIEW CONJUNCT, AND THAT IS THE ROW'S AXIS (#453's CONFLICTS line, *'a writ reaches down; a covenant reaches across, so the authority conjunct is dropped'*): a covenant is addressed to ANOTHER seat's holder, whose home the issuing seat's purview need not reach. ⚠ THE CELL BINDS `to` BESIDE `subject`, so `TypedRequires.known_person_operands` names `to` and `decision/options.py::operand_bags` forms one Candidate per person the maker KNOWS (#453's producer line, *'the known-person fan over seat-holders the actor knows'*; the fan does not narrow to seat-holders -- no stem reads *holds a seat*, and the grammar has no negation to exclude the rest) -- `issue`'s IN-10 shape. A computed covenant forms on a Proposition referent (the utterer's own, since v9 IN-11's maker's hold put it in his reach); on any other referent the `subject` conjunct refuses it in the fold (`covenant.refused`), as `commit`'s does."
    counterparty: to
    counterparty_note: "THE OTHER SEAT'S HOLDER IS THE SECOND SIDE (#453 §9.2, *'counterparty `to` (the other seat's holder)'*), and a covenant with oneself is the `Tenure(X,X)` fiat `ED-IN-0210` ruling 1 names: declined person-side (`opening_set`) and refused by the fold's `counterparty` clause for a hand-built act (`loop/resolve.py::_admits`), `issue`'s and `petition`'s precedent."
    writes:      ["Record.exists", "Record.stages"]
    writes_note: "v9 IN-12 step 7: `loop/effects_information.py::_eff_covenant` MINTS A `dispensation` through `_mint_document`, the one mint `issue` shares -- `terms` the act's `subject` (the Proposition), `to` the counterparty (`rosters.yaml: record_kinds`' `read_from`), drawn up at the exercised seat's rung (`_seat_rung`), with the maker's `hold`. NO NEW RECORD KIND (#453 K-11, K-54): a covenant is a dispensation distinguished by what its `terms` names. `Record.stages` is the TERM (#453: *'`Record.stages` as the term (matures at MAT)'*), wound by the mint (`_declared_stages`, `H-80`'s default for a computed act); the pair is check-only, as on `open_case`, whose case file is minted the same way. THE COUNTERPARTY LEARNS THE TERMS ONLY BY HOLDING THE RECORD (#453 K-54): the mint holds only the maker and no channel carries a `social` mint, so the instrument is handed on by `give`, and the addressee's acceptance is his own `commit`, formed from the held dispensation (`rosters.yaml: terms_sourced`). ITS READERS ARE DEFERRED (#453 §10.4 step 7): `loop/effects_economy.py::_renewals` reads `oblige` edges only and `queries/world_q.py::mustered` faction members only, so neither tribute nor allied sides read a covenant. No `war` kind (war is a Proposition, K-29); no `truce` (K-32); `proclaim` deferred (K-50); no `debt` kind (deferred with its `seize` reader, K-14)."
    emits:       ["covenant.offered"]
    emits_note:  "⚠ A NEW KIND, NOT `dispensation.issued`: `issue`'s kind is a `binding_decision` row's, which `epistemic.py::_ch_chronicle` broadcasts by kind, and a covenant must not be read as a public writ -- #453 K-54: no channel carries a `social` mint, so the counterparty learns the terms only by holding the Record. Emitted by this row alone; `_ch_post_remit` hands it to the obligees standing at the exercised seat (the seat read off the causing act, `seize`'s note), and the content of the instrument reaches nobody but its holder."
    emits_on_refusal: ["covenant.refused"]
    refusal_note: "v9 IN-12 step 7, #453 §9.2: *'refusal `covenant.refused`'* -- one flat kind, `transfer`'s shape for a `remit:`-eligible row: the counterparty is no person, the subject is no Proposition, the counterparty is the maker (the fold's `counterparty` clause), or the mint moved nothing."
    grade:       "assumption"
    grade_note:  "an argued addition (#453 §10.4 step 7): the matrix rows `(Record, exists)` and `(Record, stages)` and the `dispensation` kind are the tree's; the row, its `remit:issue` eligibility and the dropped purview conjunct are v9 IN-12's, on #453 `:1418-1420` and `:1755-1791`."
    source:      "v9 IN-12 step 7 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.2 `:1755-1791`, K-54 `:3104-3119`"
  - verb:        "create_record"
    stratum:     "uncontested_material"
    eligibility: ["own"]
    beneficiary: "none"
    brute:       "own"
    brute_note:  "his own paper (18_DET `bookkeeping`); a false one is `forge`"
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    requires:    "the actor is an individual, not a population"
    requires_typed:
      form:      relation

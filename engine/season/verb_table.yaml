    writes_note: "`challenge`'s, `issue`'s and `petition`'s column: ONE `(Record, exists)` write through `_mint_document`, the one mint, with the marshal's `hold` riding on the Record's receipt (admitted as `T-m`, `create_record`'s). The Record is kind `standing_order` (`rosters.yaml: record_kinds`: `at` the subject, `role`, `retreat_at`). It is WRITTEN ONCE AND NEVER CHANGED: a newer order is a second Record, and `field_input` reads, per side, the one whose holder edge is newest (`since`; ties, later in `w.tenures`); older orders are ignored, not deleted. The `(Record, exists)` matrix row is the tree's. Each order adds one `hold` to its holder's budget (`decision/budget.py`), H-92's known drift, named and not new."
    emits:       ["order.marshaled"]
    emits_note:  "A KIND OF ITS OWN, NOT `record.created`: a standing order is read by the field and by whoever comes to hold it (the content deposit), and is no public record of the settlement."
    emits_on_refusal:
      eligibility: ["marshal.unauthorized"]
      authority:   ["marshal.unauthorized"]
      write:       ["marshal.refused"]
      draw:        ["marshal.failed"]
    draw_note:   "B07.01 (18-A item 4; A-81): the `draw` clause's Event reports a LOST DRAW, not a refusal (04 §C.4: a refusal is a precondition failed, a loss an outcome that went against you) -- emitted at the Failure band once `task_draw_arm` is `on` (B07.05), with no typed write; its durable write is the Event and the claims WITNESS deposits of it. Kept out of the refusal union (`data/verbs.py::VerbRow.draw_kinds`)."
    refusal_note: "KEYED PER CLAUSE, `seize`'s shape. `marshal.unauthorized` -- the SEAT, at `authority`: none exercised grants `dispatch`, or its purview does not reach the subject's place. `marshal.refused` -- the WORLD, at `write`: the effect declined (a hand-built act naming a `role` outside `order_roles` or a `retreat_at` outside `order_retreat_at` is refused before anything is written, a caller defect) or the mint moved nothing."
    grade:       "assumption"
    grade_note:  "an argued addition (v11 CP-T04-02, AM-C-09): the matrix row `(Record, exists)` is the tree's; the verb, its `remit:dispatch` eligibility, the three-key kind and the `role_allowed` bypass (the `role` ranges over the module's whole `ROLE_SPEC`, `H-361`) are this item's, on the user's ruling to build it as the entry writes it."
    source:      "v11 CP-T04-02 (`proposals/2026-10-24-master-workplan-v10/2026-10-24-v10-09-build-B10-12.md`), AM-C-09 (`workplans/valoria_master_workplan_v11_part13.md`); home `proposals/2026-10-23-subsystem-completion/2026-10-23-subsystem-completion-04-mass-battle.md` §2 CP-T04-02"
  # ===========================================================================================
  # v11 CP-T04-07 (B10-12; AM-C-12 REPAIR) -- SURRENDER: THE HOLDER YIELDS A THREATENED PLACE ON TERMS. A seat granting `dispatch`
  # whose faction holds a settlement a `siege.pressed` names this season gives the place to the person who pressed it, and no
  # field is fought. Ships WITHHELD (`Fixtures withheld_verbs`, `marshal`'s precedent): formable, it moves every seeded season.
  # ===========================================================================================
  - verb:        "surrender"
    scale:       "settlement"
    scale_note:  "a place is yielded where it stands: the settlement IS the subject, as `march`'s and `marshal`'s are, and the exercised seat's purview must reach it."
    stratum:     "binding_decision"
    eligibility: ["remit:dispatch"]
    beneficiary: "none"
    brute:       "seat"
    brute_note:  "the seat's purview (`requires`)"
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    beneficiary_note: "`seize`'s column, for the same reason mirrored: the place passes to the person who pressed the siege, who is no operand of this act (nothing in the row binds him; he is read off the threat), and the yielder gains no more than the end of the war's cost, which no operand carries."
    referent_class: Rung
    referent_class_note: "v11 CP-T04-07: FORMED ONLY ON A `Rung`-CLASSED REFERENT, `march`'s and `marshal`'s class, so a seat granting `dispatch` is offered the same Rungs for all three and the fold disposes (`surrender.unauthorized`: the exercised seat's purview must reach the place; `surrender.refused`: the effect declines a place that is no settlement, is not held, is under no siege this season, or is held by a faction other than the seat's). [ASSUMPTION; medium; Jordan to correct; revert: drop this row, `cession` and `siege_pressed_by`, and a town changes hands only by blood or by `give`.]"
    requires:    "the exercised seat's purview reaches the subject, a settlement"
    requires_typed:
      form:      basis
      of:        subject
      basis:     purview
      conjunct:  authority
    requires_typed_note: "v11 CP-T04-07: `marshal`'s, `seize`'s and `requisition`'s ONE CONJUNCT, `authority` -- the exercised seat's purview reaches the subject's place (`state/gate.py::purview_reaches`). NO NEW STEM (AM-C-12): that the seat BELONGS TO `holder_faction_of(subject)` is asked by the EFFECT, through the cession basis's predicate (`state/gate.py::may_cede`, `may_warrant`'s shape), as `_eff_arrest` asks `may_warrant`; `data/requires.py` has no stem for a seat's faction and a typed conjunct for one would add a grammar. THE COST, STATED: Candidates form and are refused for seats of the wrong faction. [ASSUMPTION; medium; Jordan to correct; revert: the home's text, actor any member present.]"
    writes:      ["Tenure.until", "Tenure.since"]
    writes_note: "ONE PER SIDE, `seize`'s pair: the yielding seat's live `hold` on the place, if the place is held directly, closes (`Tenure.until`) and the receiver's opens (`Tenure.since`), in ONE effect (`loop/effects_information.py::_eff_surrender` through `_take_hold`). Seeded settlements are held through their territory, so usually nothing closes and the territory's holder keeps the territory, while the settlement's own `hold` now shadows it in `holder_faction_of`'s walk. The gate admits both under `cession` (`state/gate.py`). No `write_matrix.yaml` row is added: both pairs exist. NO BODY, STANCE OR LEG IS WRITTEN: that is the whole difference from a `march` that wins the field."
    emits:       ["place.surrendered"]
    emits_note:  "A KIND OF ITS OWN: a cession under arms, distinct from `rung.seized` (a taking by a warrant and an occupation) and `rung.ceded` (`give`, consensual and unthreatened). It is an act exercised through a seat, so `_ch_post_remit` hands it to the obligees standing at that seat; `chronicle` keys on `binding_decision` rows, so a town yielded is a chronicled event."
    emits_on_refusal:
      eligibility: ["surrender.unauthorized"]
      authority:   ["surrender.unauthorized"]
      write:       ["surrender.refused"]
    refusal_note: "KEYED PER CLAUSE, `seize`'s shape. `surrender.unauthorized` -- the SEAT, at `authority`: none exercised grants `dispatch`, or its purview does not reach the place. `surrender.refused` -- the WORLD, at `write`: the subject is no settlement or nobody holds it, no `siege.pressed` names it this season, the person who pressed it is not a living person of another faction, the seat's faction is not the place's holder faction, or the yielding hold is one the seat may not close."
    grade:       "assumption"
    grade_note:  "an argued addition (v11 CP-T04-07, AM-C-12): the matrix rows `(Tenure, until)` and `(Tenure, since)` are the tree's; the verb, its `remit:dispatch` eligibility, the `cession` basis and the threat reading are this item's."
    source:      "v11 CP-T04-07 (`proposals/2026-10-24-master-workplan-v10/2026-10-24-v10-09-build-B10-12.md`), AM-C-12 (`workplans/valoria_master_workplan_v11_part13.md`); home `proposals/2026-10-23-subsystem-completion/2026-10-23-subsystem-completion-04-mass-battle.md` §2 CP-T04-07"
  # ===========================================================================================
  # PLAN POSITION `19c` -- MIGRATE (`RULINGS.yaml` RR-2: *"must be able to build hearths and accept
  # people who move settlements"*; *"migration is a verb persons take"*). `move` is travel: it
  # re-homes `contain`, where a person IS. `migrate` is travel AND settling: it re-homes `contain`
  # and `reside`, where a person LIVES, and is throttled by the destination's `capacity`. The split
  # and the rejected carriers are `loop/effects.py::_eff_migrate`'s docstring.
  # ===========================================================================================
  - verb:        "migrate"
    difficulty:  "plain"
    difficulty_note: "B07.01 (18-A, The resolution, decided, 3): `plain`, 18-A's default where the owning verb lane has stated no level; read by the draw only (`task_draw_arm` `on`)."
    capability:  "none"
    capability_note: "B07.01 (workplan v12 B07-task-draw UNDECIDED (11) (iv)) [ASSUMPTION; Jordan to correct]: no skill of `descriptor_registry.yaml: capabilities` (argue, arms, copying, inquiry, law) covers `migrate`, so the draw rolls the untrained `pool_default` (`seam/wrappers/pool.py::faculty`) until a skill is defined for it."
    stratum:     "movement"
    eligibility: ["own"]
    beneficiary: "actor"
    governing:   [attr.body.endurance]
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    beneficiary_note: "`move`'s column and reason: the migrant goes where he chose to live. No operand beneficiary -- the destination is a Rung, which no Candidate carrier holds."
    referent_class: Rung
    referent_class_note: "v9 IN-45 `migrate` (H-168 limit 1, [ASSUMPTION; medium; Jordan to correct]): THE DESTINATION CHANNEL. FORMED ONLY ON A PLACE THE PERSON HAS BEEN TOLD OF AND DOES NOT ALREADY LIVE UNDER -- `queries/world_q.py::places_named` stamps those Rungs onto the question he answers as `Rung` (IN-53 D1's partition, `_stamped`), and `to` binds that referent through the unchanged referent rule (`decision/options.py::_derive_operand`; the document a question is about does not re-aim a classed referent). No ninth operand, no Record kind: the closed roster stands. ATTACKED FIRST AND REJECTED: the held-Record channel (`rosters.yaml: record_sourced_operands`) -- `to` is already mapped on `dispensation`, `petition` and `faction_sheet` to an addressee, and the one kind with a free place key, `works: {to: at}`, is declared by no computed act (H-165 limit 2, ED-IN-0297) and would re-aim every `to`-binding row on a question about a works; the shortfall channel answers `kind`/`amount` and leaves `to` the drained rung, a dearth and not a destination. REVERT: delete this column (and `places_named`'s splice)."
    requires:    "a contain path exists, the actor may enter the destination, and the destination has room"
    requires_typed:
      all:
        - form:      contain_path
          of:        actor
          to:        to
          conjunct:  path
        - form:      relation
          of:        to
          relation:  audience
          conjunct:  audience
        - form:      relation
          of:        to
          relation:  room
          conjunct:  room
    requires_typed_note: "⚠ v9 IN-59 (b) (RS-26, the AUDIENCE half of the access gate) ADDED `move`'s second conjunct here too, `relation` of `to`, `audience` -- otherwise a settler walks past the guard a traveller is stopped by. NAMED `audience` because the row keys its refusals, and keyed to `travel.blocked`: a guarded door refusing him is the journey failing, the fact `path` already emits; `audience` is WORLD-ONLY, so no witness deposits it as a belief about the road. [ASSUMPTION; medium; Jordan to correct; revert: the single `path` cell.] `move`'s cell, clause for clause and for `move`'s reasons (§E3 `:408`, *a `contain` path exists*): the journey is the same journey, so a person who believes there is no road (`contain.path:<to>` False, deposited off a `travel.blocked`) forms neither a `move` nor a `migrate` there, through the one reader (`belief_contradicts`). NAMED `path` because the row keys its refusals. ⚠ v10 REM-29 (B10-06, `-08` AM-A-15, [ASSUMPTION; medium; Jordan to correct; revert: delete the `room` conjunct and its refusal key, the `room` stem and `world_q.has_room`, so the throttle is the effect's inline decline again]) ADDED THE THIRD CONJUNCT, `relation` of `to`, `room` -- RR-2's throttle, which was the effect's hidden decline (`04 §B.13` inv. 4: every failable clause has a refusal kind). Room is the destination's capacity against its residents PLUS the migrant's own weight, unless he already lives under it -- a fact about the PAIR (rung, actor), so it is a `relation` stem asked of the destination and the actor (`audience`'s shape), answered by `queries/world_q.py::has_room`, the one owner `_eff_migrate`'s decline also calls; the grammar compares nothing new. NOT world-only: the refusal's read `(to, room:<actor>, False)` rides `Event.observed`, WITNESS deposits it to the actor (`observation_deposit_mode: actor`), and `belief_contradicts` reads it back, so a migrant refused for room does not re-form that `migrate`. THE LIMIT, STATED (AX-2 permits it): the belief is the migrant's alone and outlives any measured run (`confidence_default` 100 over `claim_decay_per_season` 5), so room freed later -- a death, a departure, a dwelling built -- is not seen by him until he is told otherwise. `room` is asked at admission, before the effect's custody and ladder declines, so a detained or off-ladder migrant aimed at a full rung is refused on `room` (the same `migrate.refused`). Still the effect's decline (`write`): a destination the ladder will not seat him in, and one he already lives in."
    writes:      ["Person.travel_leg", "Tenure.until", "Tenure.since"]
    writes_note: "`move`'s three pairs, because the journey is `move`'s (`loop/effects.py::_relocate`, one body for both verbs): the leg (ended at the next MATTER), the old `contain` closed and the new opened. The `reside` edges ride the same two Tenure pairs -- the old residence's `until`, the new one's `since` -- which is why no pair is added. No `write_matrix.yaml` row is added: a Tenure's `since`/`until` rows are kind-agnostic, and the gate's F3 judges each edge (all four are the migrant's own, `T-m`)."
    emits:       ["residence.changed"]
    emits_on_refusal:
      path:     ["travel.blocked"]
      audience: ["travel.blocked"]
      room:     ["migrate.refused"]
      write:    ["migrate.refused"]
      draw:        ["travel.failed"]
    draw_note:   "B07.01 (18-A item 4; A-81): the `draw` clause's Event reports a LOST DRAW, not a refusal (04 §C.4: a refusal is a precondition failed, a loss an outcome that went against you) -- emitted at the Failure band once `task_draw_arm` is `on` (B07.05), with no typed write; its durable write is the Event and the claims WITNESS deposits of it. Kept out of the refusal union (`data/verbs.py::VerbRow.draw_kinds`)."
    refusal_note: "KEYED PER CLAUSE (`04 §B.13` invariant 4's per-conjunct half, plan position `19`'s shape). `path` is the journey failing, and it emits `move`'s own `travel.blocked` because it IS the same fact -- *there is no road from here to there* -- so a witness of either verb learns the same thing. `room` (v10 REM-29) is the destination refusing the settler for RR-2's throttle -- AT CAPACITY, a newcomer whose weight would take `world_q.population` past `world_q.capacity` (`world_q.has_room`) -- and emits `migrate.refused`, the kind the effect's capacity decline emitted, so what a witness learns is unchanged; the read rides the Event. `write` is the destination refusing him in the effect: the ladder will not seat him there, he already lives there, he is in custody (a live `detain`, v9 SC-03a: `_decline_custody`), or (a caller running the effect without the fold's admission) no room. `audience` (v9 IN-59 (b)) is the mover's standing at a guarded destination, and emits `travel.blocked` too: it is the same fact as `move`'s refusal of an unadmitted entrant. ELIGIBILITY is `own`, which cannot decline, so it keys nothing."
    grade:       "assumption"
    grade_note:  "the VERB is RR-2's (ruled: *a verb persons take*); its row -- the cell, the writes, the kinds, the throttle's place -- is plan position `19c`'s, argued at `_eff_migrate`, graded as `found`'s and `build`'s are. Its `alignment` cells arrived with IN-08's cells commit, graded `reasoned` (`rosters.yaml: tables.alignment`)."
    source:      "plan `workplans/2026-09-18-governance-settlement-behaviour-plan_part2.md` 19c (MIGRATE, carrying 24d-ii); `proposals/2026-09-17-governance-and-behaviour/RULINGS.yaml` RR-2; `01_THE_BUILD_ORDER.md` S9"
  - verb:        "move"
    difficulty:  "plain"
    difficulty_note: "B07.01 (18-A, The resolution, decided, 3): `plain`, 18-A's default where the owning verb lane has stated no level; read by the draw only (`task_draw_arm` `on`)."
    capability:  "none"
    capability_note: "B07.01 (workplan v12 B07-task-draw UNDECIDED (11) (iv)) [ASSUMPTION; Jordan to correct]: no skill of `descriptor_registry.yaml: capabilities` (argue, arms, copying, inquiry, law) covers `move`, so the draw rolls the untrained `pool_default` (`seam/wrappers/pool.py::faculty`) until a skill is defined for it."
    stratum:     "movement"
    eligibility: ["own"]
    beneficiary: "actor"
    governing:   [attr.body.endurance]
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    requires:    "a contain path exists, and the actor may enter the destination"
    requires_typed:
      all:
        - form:      contain_path
          of:        actor
          to:        to
          conjunct:  path
        - form:      relation
          of:        to
          relation:  audience
          conjunct:  audience
    requires_typed_note: "⚠ v9 IN-59 (b) (RS-26, the AUDIENCE half of the access gate) ADDED THE SECOND CONJUNCT, `relation` of `to`, `audience` -- `with`'s shape asked of the destination rung and the actor, one new stem (`data/requires.py: REQUIRES_STEMS`), no form or operand added. `world_q.admits_audience` answers it: admitted if a seat the mover holds reaches the rung, or he holds a live writ from such a seat (`issue`), or he owes a live sworn `oblige` to one (IN-40), or nobody guards it (`guard_weight == 0`, IN-60). WORLD-ONLY, so the mover forms the Candidate and the fold refuses (`travel.blocked`, the row's one refusal kind). NOT a `basis` conjunct: that form takes its seat from `Act.via`, and a seatless `move` would then be refused everywhere. [ASSUMPTION; medium; Jordan to correct; revert: the single `contain_path` cell.] §E3 `:408` — *a `contain` path exists*. ⚠ THIS DROPS TWO TERMS `_req_move` CARRIED AND THE DROP IS DELIBERATE: that predicate ended `on_ladder or here.kind == \"person\"`, which is true of every actor with a person-rung, so the ladder term decided nothing; and its `dest == a.actor` refusal is kept, as the reader's own rule that a node is not a path to itself. What replaces them is an actual path check — the two rungs must be connected in the containment forest — which is what the cell says and what `_req_move` never tested. `operands_for` binds `to` from the question's referent, so a computed `move` carries a destination, and the path check decides it — `corpus_run.build_at` makes every person a `person`-kind rung, so a SIBLING destination fails `contain_ascends` and emits `travel.blocked`, while the actor's own containing rung is a valid ascent."
    writes:      ["Person.travel_leg", "Tenure.until", "Tenure.since"]
    emits:       ["travel.moved"]
    emits_on_refusal:
      path:        ["travel.blocked"]
      audience:    ["travel.blocked"]
      write:       ["travel.blocked"]
      draw:        ["travel.failed"]
    draw_note:   "B07.01 (18-A item 4; A-81): the `draw` clause's Event reports a LOST DRAW, not a refusal (04 §C.4: a refusal is a precondition failed, a loss an outcome that went against you) -- emitted at the Failure band once `task_draw_arm` is `on` (B07.05), with no typed write; its durable write is the Event and the claims WITNESS deposits of it. Kept out of the refusal union (`data/verbs.py::VerbRow.draw_kinds`)."
    grade:       "assumption"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "oblige"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "actor"
    brute:       "seat"
    brute_note:  "the seat's `binds` admits the joiner (`requires`; referent an Office)"
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    requires:    "the subject is a seat whose `binds` admits the joiner, the actor does not hold it, and the actor has no live `oblige` to it"
    requires_note: "PLAN POSITION `17a` (r2 item 9, `03_SEATS_AND_CONTENT.md` §A.9, `05` §A.1.5 RULED (b)). §E3's cell was `—`, and with no effect the verb was never folded; the moment it OPENS a Tenure it must name a real seat, or it is the fiat `ED-IN-0211` reverted (`einhir_texts`, a bare string). Evaluated by `loop/predicates.py::_req_oblige`, which states the four clauses and why each is there. ⚠ `03` §A.9 REFUSED reading `binds`; `05` RULED (b) reversed that on `ARCH F.17`'s own resolution, and the later ruling is the one built."
    requires_typed: none
    referent_class: Office
    referent_class_note: "IN-10 (a) (H-203, DECISION 2026-10-13 [ASSUMPTION; medium; Jordan to correct]): THE SEAT RIDES `subject` AS AN `Office`-CLASSED REFERENT (`confer`'s partition, IN-53 D1), and #453's 'type clause 1' (`:524`) is taken as this column rather than a typed cell -- the row stays untyped, the precondition stays `_req_oblige`'s (`:1389-1391`: 'the row is unchanged'; a typed cell beside the predicate is what `test_wa_one_owner_...` forbids). The referents are the seats the person has been TOLD OF (`queries/world_q.py::seats_named`: a ledger claim about the seat -- the `tenure.opened` deposit, K-25 -- or a held document whose `terms` names it), carried on the question he answers (`questions_for`); `decision/options.py::_operands` then carries the seat on `subject`, so the counterparty clause sees it. A person told of no seat forms no `oblige`. REVERT: delete this column (and `seats_named`'s splice)."
    referent_named: true
    referent_named_note: "IN-10 (a) (H-203, DECISION 2026-10-13 [ASSUMPTION; medium; Jordan to correct]): ONE CLASS, TWO SOURCES, AND `oblige` ANSWERS ONLY ONE. The `Office` referents a question carries are a conferrer's VACANCIES (`world_q.vacancies`, a world read, IN-53) and the seats a person was TOLD OF (`world_q.seats_named`); `confer` forms on both, `oblige` only on a seat the person's OWN LEDGER names (`queries/person_q.py::ledger_names`), asked person-side in `decision/options.py::opening_set` -- #453's own source rule (`:524`: 'from a held Record's `terms` ... or a `tenure.opened` deposit') and this position's FALSIFIER (an `oblige` formed with no seat named by a held Record or a deposit -> fail). REVERT: delete this column (the row then forms on every `Office` referent)."
    requires_typed_note: "⚠ `none` FOR THE GRAMMAR'S REASON, ON `release`'s AND `give`'s ROUTE: a prose `requires:` read by the registered predicate `loop/predicates.py::_req_oblige`. Clause 1 would type (`existence` of `subject`, `kind: Office`), and the rest cannot: clause 2 reads a field OF the seat (`Office.binds`) against a roster, and no stem reads a seat's own field; clause 4 is a NEGATION (no live `oblige` from the actor to it already), and the grammar has no `not` -- the wall `release`'s disjunction hits from the other side. A typed cell AND a predicate on one row is what `test_wa_one_owner_...` forbids, so the whole cell is the predicate's."
    counterparty: subject
    counterparty_note: "THE SEAT IS THE SECOND SIDE, AND THE CHOOSER CANNOT NAME ONE (plan position `17a`, on `give`'s precedent, plan position 16). `ED-IN-0210` ruling 1 names this verb: *a fiat needs no counterparty, so nothing checked that the object of an `oblige` was an entity*. The row is UNTYPED, so the cell carries no operand; since v9 IN-10 (a) the row forms on a seat the person was TOLD OF (`referent_class: Office` above), the seat carried on `subject` (`decision/options.py::_operands`), so the counterparty clause sees it, and a person told of no seat forms none. An `oblige` executes from an act that names its seat on `subject`."
    writes:      ["Tenure.since", "Tenure.term"]
    writes_note: "PLAN POSITION `17b`: `Tenure.term` ADDED, on `establish`'s `Tenure.payload` precedent -- the fold gates exactly the pairs a verb declares, and `_eff_oblige` now opens the edge WITH a declared term (`matures_at = tick + oblige_term`, `declared_by` this act; T-n, *'the opening act declares the terms'*), so undeclared, that write would ride under `Tenure.since`'s gate. The second pair is check-only (class, step, partition); the effect runs once, on the first. Under `H-159`'s control arm (`oblige_term: None`) the edge opens with no term, exactly as at `17a`."
    emits:       ["duty.taken"]
    emits_on_refusal: ["duty.refused"]
    grade:       "ruled"
    refusal_note: "§E2 -- 'failure emits, never raises': a verb with a `requires` needs a refusal channel (W3's rule; plan position `17a`). Refusal condition: the subject is no seat, or the seat's `binds` is off `binds_bases`, or the actor holds the seat, or he is already obliged to it."
    formation_decline_note: "A typed `existence` of `subject` kind `Office` is not authored: of the referents `questions_for` stamps none was a seat and no ledger held a claim about an office (plan position `14`, U7-own; `populated.build_realm(0)`), so the cell would form on every referent and refuse on every one, growing the always-refused set. `T4`'s bags supply known PERSONS, not seats, and a known-seat source is a second binding mechanism; formation is the `Office` class's (`referent_class` above). The fold's `counterparty` clause covers the hand-built act."
    source:      "ARCHITECTURE_V2.md §E3, transcribed; body, precondition and refusal from r2 item 9 / `03` §A.9 at plan position `17a`"
  - verb:        "open_case"
    stratum:     "social"
    eligibility: ["remit:determine"]
    beneficiary: "none"
    brute:       "seat"
    brute_note:  "`remit:determine`; the act declares the stages (`requires`); how the matter is judged is `determine`'s"
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    beneficiary_note: "whom a case serves is the party it is opened on behalf of; the act writes a `Record` and carries no such person."
    referent_class: Person
    referent_class_note: "v10 CP-T05-04 (B10-05, AM-D-05; M19 taken, [ASSUMPTION; medium; Jordan to correct]): FORMED ONLY ON A `Person`-CLASSED REFERENT -- the plain referent of the question he answers that is a person (`queries/world_q.py::own_referents_of_class`, REM-21's term, stamps it through `_stamped`; `decision/options.py::opening_set` then forms on the classed ids alone, IN-53 D1's partition), so `subject`, the matter, binds a person and never a rung, a Site, a Record or a Proposition (a person's own `person`-kind rung shares his id and is a `Person`). ⚠ THE FIRST CLASS THAT REMOVES FORMATIONS THE FOLD ADMITS, not only refusals: this row is a remit verb whose cell asks the exercised seat's purview over the matter's PLACE and no kind (`basis: purview`), so a case opened on a settlement rung or a Site the seat reaches is admitted and executes; but such a matter can never be taken off the docket (`determine`'s `party` conjunct needs a person, so the rung stays docketed for ever and `docketed` declines a second case on it), which is why the home removes the formation (D:#75). A hand-built act may still docket a Rung (a later `Record` disposal, L11 M5, needs it); this row's cell, its eligibility and `docketed`'s decline are unchanged. HR-9's control (3), that a class removes only refusals, does NOT hold for this row: `tests/test_referent_class_stamps.py` pins the removed Candidates the fold admits (the Site and the rung) and the one it refuses (a Proposition has no place, `purview` False). THE DOCKET QUESTION ALSO REACHES THIS ROW: its referents are matters still on the docket and `Person` is a class this row declares, so a seat-holder delivered that question forms `open_case` on a docketed matter and the fold refuses it (`case.refused`, `_eff_open_case`'s `docketed` decline), pinned in a hand-built world by `tests/test_referent_class_stamps.py`. REVERT: delete this column."
    requires:    "the act DECLARES the stages and their terms (§13.1)"
    requires_note: "⚠ THE PROSE IS §F.24a's WELL-FORMEDNESS CONSTRAINT, NOT A QUESTION OF THE WORLD (*'they belong in the `Act` schema and are refused at construction'*), and it is met the way `create_record` meets it: the act's declared stages, else `H-80`'s declared default, minted by `_mint_document`. PLAN POSITION `19` gives the row the precondition the plan gives every remit verb, *'a predicate reading `via.scope`'* -- the typed cell below -- which the prose does not state and which is attributed there rather than written into the transcribed cell."
    requires_typed:
      form:      basis
      of:        subject
      basis:     purview
      conjunct:  authority
    requires_typed_note: "PLAN POSITION `19`: ONE CONJUNCT, `Basis` (§F.24a form 7) with the `purview` rule -- the seat exercised has purview over the place the matter is AT (`world_q.place_of`, the one owner; ruling (4), `04:330`). A cluster seat reaches nowhere and opens nothing. The matter is the act's `subject`, any id a question can be about: a person, a Record, a rung. Whether the matter is ALREADY before a room is a NEGATION the grammar cannot spell, so `_eff_open_case` declines it (`case.refused`, the `write` clause)."
    writes:      ["Record.exists", "Record.stages", "DocketItem.matter", "DocketItem.arrangement", "DocketItem.petition"]
    writes_note: "PLAN POSITION `19` ADDED `DocketItem.matter`: *'`open_case` gains `writes: DocketItem.matter` ... a proceeding with zero authored acts needs somebody to have put the matter before the room, and no step did that'*. `loop/effects_information.py::_eff_open_case` draws the case file up at the opening seat's rung (`Record.exists`/`Record.stages`, `_mint_document`) and, in the same `apply`, dockets the matter with `_docket_item`'s keys (`matter`, `arrangement`, `petition`; v9 SC-03a): into the nearest open slot CALENDAR formed at a venue holding the matter, which keeps its `date` (v9 SC-01 fired-slot step, `world_q.slot_for`), else as an appended dateless item. That is the one write of these cells by an ACT; CALENDAR's is actorless and forms empty slots. Every pair after the first is check-only (each `DocketItem` cell admits RES in the ACTS class); `arrangement` and `petition` are declared because a filled slot gains them in an item CALENDAR created (`04` PART D row 3)."
    emits:       ["case.opened"]
    emits_on_refusal:
      eligibility: ["case.unauthorized"]
      authority:   ["case.unauthorized"]
      write:       ["case.refused"]
    refusal_note: "PLAN POSITION `19`: KEYED PER CLAUSE (`04 §B.13` invariant 4's per-conjunct half). `case.unauthorized` -- the SEAT: none exercised grants `determine` (this row's eligibility, `H-52`), or its purview does not reach the matter. `case.refused` -- the matter is already on a docket, or the mint moved nothing. The family is `case.*`, the row's own `case.opened`."
    grade:       "assumption"
    eligibility_note: "W3: graded `assumption`, NOT `ruled`. #353's five remit acts are CLOSED -- issue, determine, confer, revoke, dispatch -- and opening a case is not among them, so V2 invented this eligibility. `own` is a different game (anyone may open a case), which is why it is swept rather than chosen. The roster is `rosters.yaml: remit_acts`."
    eligibility_sweep_note: ["remit:determine (V2's value)", "own", "hold:<the matter's record>"]
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "pardon"
    scale:       "settlement"
    scale_note:  "#453 §9.1: *'settlement'* -- a pardon is the bench's act at the seat that owns the restraint, `determine`'s scale"
    stratum:     "binding_decision"
    eligibility: ["remit:determine"]
    beneficiary: "subject"
    brute:       "seat"
    brute_note:  "the bench seat over him (`requires`)"
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    beneficiary_note: "#453 §9.1: *'beneficiary `subject`'* -- the man released."
    requires:    "the subject is a person over whom the exercised seat sits as a bench"
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      Person
        - form:      basis
          of:        subject
          basis:     bench
    requires_typed_note: "⚠ v9 IN-12 step 5 KEEPS THE ROW TYPED, ON `seize`'s IN-13 PRECEDENT, WHERE #453 §9.1 SENDS IT UNTYPED. #453: *'a live edge of kind `detain` or `ban` whose object is the exercised seat ... a disjunction over kinds, which the typed grammar does not have, so the row takes `release`'s route: `requires_typed: none` ... and a registered predicate'*. This keeps the TWO conjuncts the grammar CAN spell and moves the disjunction to the effect: `existence` of `subject` kind Person (only a person owns a restraint) and `basis` `bench` of `subject` -- the SAME `state/gate.py::may_determine` the gate's `determination` basis asks to admit the closure (#453: *'under the widened `determination` basis'*), read early, so the fold refuses exactly what the gate would raise on. WHICH EDGE closes -- a live `detain` or `ban` of the subject's whose object is `Act.via` -- is `loop/effects_governance.py::_eff_pardon`'s, which declines a subject holding none (`pardon.refused`, the `write` clause). ⚠ THE CLOSURE BASIS (the entry's): `determination` closes a restraint only THROUGH THE SEAT THAT IS THE EDGE'S OBJECT, by a bench-granted holder -- so a warrant-opened `detain` (object: the ISSUING seat, `arrest`) is pardoned by that seat's bench, and a revocation's `ban` (object: the revoking seat, IN-31) by the revoking seat's. [ASSUMPTION; medium; Jordan to correct; revert: `requires_typed: none` + a registered predicate asking the same two reads and the edge, #453's own text.]"
    domain:      [detain, ban]
    domain_note: "#453 §8.2: THE LOADER'S CLOSER CLAUSE READS THIS COLUMN ON EVERY ROW (`data/verbs.py`, loader invariant 6's closer clause, v9 IN-12 step 5): every Tenure kind outside `RELEASABLE_KINDS` and the two that end by a relocation (`contain`, `reside`) -- `data/rosters.py::RESTRAINT_KINDS` -- must sit in some row's declared `domain:`; the load is red without this row's `[detain, ban]`. `_eff_pardon` closes `RESTRAINT_KINDS`, the gate's closable pair; the loader refuses a domain naming any other kind (a releasable kind is `release`'s)."
    writes:      ["Tenure.until"]
    writes_note: "#453 §9.1: *'writes: `Tenure.until`, under the widened `determination` basis (closing `detain` and `ban` only, §8.3)'*. `_eff_pardon` closes EVERY live restraint the subject owns on `Act.via` -- a custody and a ban on one seat both end (*'grant wholly'*) [ASSUMPTION; medium; Jordan to correct; revert: the oldest one only]. Never an `oblige` (D-5: no obligee-side closer of an obligation, §8.3); the gate's `determination` clause closes `RESTRAINT_KINDS` only."
    emits:       ["detention.ended", "ban.ended"]
    emits_note: "#453 §9.1: *'`detention.ended` / `ban.ended`, per-kind closers on R-3's `commitment.ended` precedent'*. EACH CLOSED EDGE EARNS ITS OWN KIND (`Subject.earns`), so a pardoned custody never publishes an ended ban. ORDER IS READ: `_eff_pardon` unpacks this column `detain` then `ban` (`seize`'s precedent). Two NEW kinds; `binding_decision`, so `chronicle` broadcasts them."
    emits_on_refusal: ["pardon.refused"]
    refusal_note: "#453 §9.1: *'refusal `pardon.refused`'* -- FLAT, one kind for every failable clause: ineligible; no person; the exercised seat does not sit as a bench over him (`bench`); or he holds no live `detain`/`ban` on the exercised seat (the effect's decline)."
    grade:       "assumption"
    grade_note:  "an argued addition (#453 §10.4 step 5): the matrix row `(Tenure, until)` is the tree's; the row, the typed-route reading and the closure basis are v9 IN-12's, on #453 §9.1 `:1710-1740`, §8.2-§8.3."
    source:      "v9 IN-12 step 5 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.1 `:1710-1740`"
  - verb:        "petition"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "actor"
    brute:       "counterparty"
    brute_note:  "filing; the addressee's answer is his own act (18_DET `bookkeeping`); the persuasion is where the matter is heard (`speak`)"
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    referent_class: Person
    referent_class_note: "v10 REM-24 (B10-05, AM-A-09; M19 taken, [ASSUMPTION; medium; Jordan to correct]): FORMED ONLY ON A `Person`-CLASSED REFERENT -- the plain referent of the question he answers that is a person (`queries/world_q.py::own_referents_of_class`, REM-21's term, stamps it through `_stamped`; `decision/options.py::opening_set` then forms on the classed ids alone, IN-53 D1's partition), so `to` -- the counterparty, the operand this row's cell binds, in a cell that binds no `subject` -- and `subject` bind a person and never a rung, a Site, a Record or a Proposition. THE CLASS REMOVES WRONG-KIND FORMATIONS AND ONE ROUTE BESIDE THEM: this row's cell, its eligibility, the person-side self-address decline (`counterparty:`) and who may petition whom are unchanged; but a classed row forms on its classed referent alone and skips the reader of the document the question is about (`decision/options.py::_derive_operand`, `on_referent`), so a question about a held sheet or petition Record -- whose document names the addressee (`rosters.yaml: record_sourced_operands`, `faction_sheet: to: head`) -- no longer forms a `petition`, though that `to` is a person; that route is reachable in a hand-built world only (`tests/test_information_cluster.py`). A PERSON'S OWN `person`-KIND RUNG IS A PERSON: it shares the person's id and `World.class_of` asks `persons` before `rungs`, so a referent that is such an id is stamped `Person` and kept, and `places_named` never stamps it as a place (`class_of == \"Rung\"`), so `migrate` and `requisition` are untouched. A person who answers a question naming a person executes it through the real fold (`tests/test_referent_class_stamps.py`). REVERT: delete this column."
    requires:    "a petition has two sides and both exist: the person it is addressed to, and the place it rises from"
    counterparty: to
    counterparty_note: "⚠ THE OTHER PARTY TO THE ACT, NAMED BY THE OPERAND THAT CARRIES THEM (plan position `15`). `decision/options.py::opening_set` forms no Candidate whose counterparty is the person themselves -- the contested-verb rule one column over (*a person is not their own adversary*), for the same reason: being oneself is not a belief anyone can be wrong about, so it is declined person-side rather than attempted and refused. Declined only at the fold, a self-address is a feedback loop: each refusal deposits a claim about the petitioner that raises another question about them, and no read the fold makes can say *that is you*. The loader requires the operand to be one the row's typed cell BINDS, so the Candidate always carries it."
    requires_typed:
      all:
        - form:      existence
          of:        to
          kind:      Person
        - form:      existence
          of:        from
          kind:      Rung
    requires_note: "— no dedup, no cap, no per-venue limit (§26.3). ⚠ THOSE THREE ABSENCES STAND; WHAT CHANGED AT PLAN POSITION `15` IS THAT A PETITION NOW NAMES WHOM IT IS FOR. The cell was `—` and the verb had no effect, so it was never folded; the moment it mints a document it must say to whom, or it is a fiat. ⚠ AND IT IS NOW RESOLVABLE -- typed precondition plus `_eff_petition` -- so NPCs form and file petitions in computed play: a declared behaviour change that moves every run whose chooser can reach it."
    requires_typed_note: "⚠ TWO-SIDED, PER `ED-IN-0210` RULING 2 (Jordan, 2026-09-10): *`petition` <-> WITHDRAW (petitioner) or DENY (receiver) ... `petition`'s pair is TWO-SIDED (withdraw and deny close the same state from opposite sides), the first in the set where a counterparty is structurally required.* RULING 1 on the same row is what makes each side an EXISTENCE clause: *a fiat needs no counterparty, so nothing checked that the object of an `oblige` was an entity* -- so each named side must BE one, and the grammar's `existence` form is the check. ⚠ THE RECEIVER IS A PERSON, BECAUSE RULING 2 NAMES WHAT THE RECEIVER DOES -- *DENY* -- and only a person acts (AX-1); the next position's `give` (`16`, H-84) moves a Record *to another person*, which is how a petition reaches the hand that may deny it. THE SEAT READING (`kind: Office`) IS NOT TAKEN: no question's referent is ever a seat, so every such petition would be refused, a constant scene tax with nothing behind it. The self-petition that `kind: Person` admits is declined person-side by `counterparty:` (above), not here: the grammar has no negation. `from` is the operand's one meaning (`decision/options.py::_derive_operand`: where the actor is) -- the place the petition rises from, #353 §36.1's *a demand rises from a hearth*. ⚠ WHAT A COMPUTED ACT CANNOT YET SAY: `to` and `subject` both bind the question's ONE referent (`_REFERENT_OPERANDS`), so a computed petition is addressed to the person it is about. That is `H-94`'s single-referent limit, not this cell's choice, and plan position `15c` (content operands) is what separates them."
    writes:      ["Record.exists"]
    emits:       ["petition.filed"]
    emits_on_refusal: ["petition.refused"]
    grade:       "ruled"
    refusal_note: "§E2 -- 'failure emits, never raises'. Refusal condition: the addressee is not an existing person or the place of origin is no rung, or -- for a hand-built act only, since a computed one is never formed -- the petition is addressed to the petitioner (the FOLD's `counterparty` clause, `loop/resolve.py::_admits`, plan position `14`; `_eff_petition` no longer declines it and the keyed row emits this verb's one kind)."
    writes_note: "— (a Petition is created, not written)  ||  ⚠ W3, ON THE W2 AUDIT: Part E says a Petition is 'created, not written', and PLAN §1.4 hole 4 says THAT IS THE DEFECT — #353 :1061-1064, 'Either the gate applies the write, or direct assignment is made impossible.' With `writes: []` the creation row W2 added was INERT and creation still bypassed the gate.  ||  ⚠ PLAN POSITION `15`: `Petition.exists` -> `Record.exists`. A petition is a `Record` of kind `petition` (`04_CODE_ARCHITECTURE.md` §B.5, `rosters.yaml: record_kinds`), minted with the petitioner's `hold` by `loop/effects.py::_eff_petition`, so `forge`, `destroy_record`, `hold` and `carry` reach it with no new row. `(Petition, exists)` is deleted from the matrix in the same commit."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "construe"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "actor"
    brute:       "own"
    brute_note:  "his own reading, a belief (row `writes_note`)"
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    requires:    "as comply — ⚠ emitter- or receiver-side is absent, D18"
    referent_class: Record
    referent_named: true
    referent_class_note: "v10 REM-2B: as `comply` -- FORMED ON A WRIT THE PERSON HOLDS AND IS ADDRESSED BY, AND HIS OWN LEDGER NAMES (`queries/world_q.py::writs_held`, `referent_named`). THE HOLDING IS CARRIED BY THIS FORMATION, NOT BY A CONJUNCT: `construe` is the HOLDER's reading, and the only persons offered it are the holder-addressees `writs_held` stamps. REVERT: drop both columns and the typed cell AND restore the row's `requires_decline_note:` (IN-41; the row returns to `requires_typed: none`, which `resolvable_verbs()` drops, and a dropped row must say why)."
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      dispensation
        - form:      own_ledger
          of:        subject
    requires_typed_note: "v10 REM-2B restores v9 IN-09's typing (`19b`) ON A DECLARED READING [ASSUMPTION; medium; Jordan to correct]. §E3 `:432` — *as `comply` — ⚠ **emitter- or receiver-side is `absent`, D18***. #453 places construal WITNESS-side (`proposals/2026-10-03-verb-coverage-and-gap-fill.md:504`, *'not an act: the content deposit already reads per holder'*); Jordan kept it as a verb (J-2), so it is built as an act whose one effect is THE CONSTRUER'S OWN READING OF A WRIT HE HOLDS -- RECEIVER-side, the side Jordan's 2026-09-02 refraction ruling names (*'the PREMISES AND RATIONALE, minted per receiver'*), which answers `D18` by a reading, not a ruling. So `comply`'s cell VERBATIM (existence of `subject` kind `dispensation`; `own_ledger` of `subject`), no operand coined. THERE IS NO `relation` `held_by` CONJUNCT (*the construer HOLDS the writ, not merely heard of it*): a Record row whose cell asks `held_by` is a HOLDING row (`data/verbs.py::HOLDING_RECORD_KINDS`, REM-25), so that conjunct would move `dispensation` into the set `records_held_for_holding_rows` stamps for every holder, issuer and custodian included -- widening `comply`'s, `evade / defy`'s, `carry`'s, `found`'s and `build`'s formation past the addressee test and breaking the split's rule that a kind is in exactly one set. The holding is therefore carried by the formation (`referent_class` above), and the fold, like `comply`'s, admits a reader of the terms who does not hold the writ (a hand-built act). REVERT: Jordan states `construe` is witness-side only; the row returns to `requires_typed: none` and R-05 counts it witness-side."
    writes:      []
    emits:       ["terms.distorted", "scruple.overridden"]
    emits_on_refusal: ["construal.impossible"]
    naming_note: "`construe` is the ordinary legal-administrative word for reading an instrument (`CLAUDE.md` §4 -- coin nothing a plain word already covers), so the triple is **comply / evade|defy / construe**. Jordan, 2026-09-18, on the earlier name `refract`: *\"refract is the wrong word to use for whatever it is tho\"*, then *\"construe\"*. His 2026-09-02 ruling was already reaching for it (`hole_register.yaml`, the refraction row): *\"people's actions are objectively the case but the meaning of those actions are subject to interpretation - signified vs signifier\"*. `refraction` SURVIVES AS THE PHENOMENON, deliberately: the same ruling holds that what is distorted is *\"the PREMISES AND RATIONALE, minted per receiver as a Claim\"*, receiver-side, and the premise is refracted BY the act of construing. So `terms.distorted` is unchanged, and the refusal follows the sibling convention: `comply` -> `compliance.impossible`, so `construe` -> `construal.impossible`."
    grade:       "assumption"
    grade_note:  "v10 REM-2B (v9 IN-09): `absent` -> `assumption`. `D18` (emitter- or receiver-side) is answered by a DECLARED reading (receiver-side, the holder's own reading), not by a ruling; see `requires_typed_note:`."
    writes_note: "— ⚠ EMISSION-ONLY (v9 IN-09, restored at v10 REM-2B). The construer's reading is a BELIEF, and `(Person, claim_ledger)` is written at WITNESS only, so the act writes no cell and no `_eff_construe` exists. What the act puts in the world is `terms.distorted` about the writ, which WITNESS deposits on the construer (and on whoever else observes it) like any event: that deposit is his reading, reached by choice. ⚠ NOT BUILT: #453's construal falsifier, *two holders of one writ holding different `content:dispensation` values*, needs a per-holder distortion of the content claim (`H-36`'s magnitude half), which neither IN-09 nor REM-2B authors."
    refusal_note: "§E2 -- 'failure emits, never raises': a verb with a `requires` needs a refusal channel, or a failed precondition produces no Event, no witness and no arc. Refusal condition: as `comply`"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "release"
    stratum:     "binding_decision"
    eligibility: ["own"]
    beneficiary: "subject"
    brute:       "own"
    brute_note:  "his own tenure (`requires`)"
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    requires:    "a live tenure of a releasable kind, owned by the actor, toward the subject"
    requires_typed: none
    domain:      [hold, commit, oblige, succeed, tie, knot]
    writes:      ["Tenure.until"]
    emits:       ["tenure.closed", "commitment.ended"]
    emits_on_refusal: ["release.refused"]
    grade:       "ruled"
    emits_note:  "v9 IN-11 (#453 §10.4 step 2, R-3 (b) adopted): `repudiate` IS CUT and its row deleted -- it was a second closer of one edge, since `commit` is in this row's `domain:` -- so the vow-break is witnessed HERE: `_eff_release` earns `commitment.ended` when an edge it closes is a `commit` -- WHOLE-ACT earning: when any closed edge is a `commit`, every edge it closes earns the row's every kind (`earns=None`) -- and `tenure.closed` alone otherwise. ⚠ THE VOW-BREAK IS NOT UNPRICED: `commitment.ended` now has ONE emitter, this row, so `data/verbs.py::KIND_VERB` maps it to `release` and a witnessed vow-break is judged (`queries/person_q.py::deed_valence` -> `align_kind`) at `release`'s own alignment cells -- see `rosters.yaml: tables.alignment` -- until a `deed:commitment.ended` cell is authored (the IN-11 entry, `workplans/valoria_master_workplan_v9_part5.md` `### IN-11` WHAT: its pricing becomes a `deed:` cell, IN-08). None is authored here."
    requires_typed_note: "⚠ `none` WITH A REASON, AND THE REASON IS THE GRAMMAR, NOT NEGLECT — the third admissible ground (`data/verbs.py`: *an operand the closed `requires_operands` roster has no name for*), reached from the other side: the cell this row needs is a DISJUNCTION OVER KINDS and the grammar has none. `data/requires.py:542` carries `all` and no `any`, and §F.24a form 1 `existence` takes ONE `kind:`, so the six releasable kinds cannot be spelled: `all` of them would mean *a live edge of every kind at once*, which is the opposite requirement, and `existence` of one kind would silently narrow the verb to that kind. Adding an `any` combinator is a GRAMMAR CHANGE — `REQUIRES_STEMS` is closed and refuses an unknown stem at load — and `04 §A.3` row 14 asks for a verb, not a new form. So this row takes `revoke`'s route: a prose `requires:` read by a registered predicate, with the domain declared above and asserted at load. ⚠ IF AN `any` COMBINATOR IS EVER RULED, THIS CELL IS THE FIRST THING TO TYPE."
    domain_note: "⚠ THE `domain:` COLUMN EXISTS FOR THIS ROW AND IS CHECKED AT LOAD — `04_CODE_ARCHITECTURE.md` PART D row 15: *`release` generic; the loader asserts its domain equals `tenure_kinds \\ {contain}` (invariant 6, as corrected for F4)*. It is DECLARED here rather than derived so the assertion has content: `data/verbs.py` compares this list against `rosters.yaml: tenure_kinds` minus `contain`, so adding an eighth tenure kind and forgetting its closer FAILS THE LOAD instead of shipping an open-without-close. A derived domain would make the check compare the roster to itself, which is `CLAUDE.md` §0.1 pt 2 — an assertion that cannot observe the failure it excludes."
    requires_note: "PROSE + A REGISTERED PREDICATE, LIKE `revoke`, AND NOT `requires_typed` (the reason is `requires_typed_note`'s): `_req_release` reads the same roster the loader asserts against. VB-A: formed only on a referent the actor is tied to by a live edge of a kind in `domain:` (`rosters.yaml: own_edge_declines`); the predicate stays the fold's check, and since A-37 it also refuses an edge a bench's `determine` opened (`rosters.yaml: own_edge_declines: disposal`)."
    source:      "`04_CODE_ARCHITECTURE.md` §A.3 row 14, QUOTED WHOLE: *four closing verbs missing | one `release` verb, eligibility `own`, generic over kind; `Tenure.term?` for declared ends | T-m, T-n, ID-14*. ⚠ THE CLAUSE AFTER THE SEMICOLON IS NOT DELIVERED HERE AND EARLIER RENDERINGS OF THIS CELL STOPPED BEFORE IT WITH NO ELLIPSIS, WHICH IS CONCEALMENT RATHER THAN SCOPE. `Tenure` carries no `term` field (`state/carriers.py`), so `T-n`'s declared-ends half — a tenure that ENDS BY ITS OWN TERMS rather than by somebody releasing it — is unbuilt and is recorded here as unbuilt. ⚠ AMENDED 2026-09-29 (plan position `17b`): THAT HALF IS NOW BUILT for the one kind given a term, `oblige` — `Tenure.term` exists (`state/carriers.py::Term`), `_eff_oblige` declares it, MATTER matures it (`loop/matter.py`, gate basis `T-n`), and a `transfer` paying the seat's `upkeep` renews it. `release` itself is unchanged: it is still the owner's early way out, and T-m still admits it. The scope taken is `architecture/meta/HANDOFF_NEXT.md` §2a's, which asks for the verb: *the design says a person may resign; the verb table does not let them. Fix the table, and do not re-open the design.* The same shape one level up: `04:464-465` states loader invariant 6 as TWO conjuncts, the domain and *every kind's OPENER set is declared too*, and `data/verbs.py` implements the first — the second is HANDOFF_NEXT item 1e and is open. Also PART D row 15."
    disposal_release_note: "PLAN POSITION `22` (PROC-B): `oblige` IS IN THIS ROW'S DOMAIN, AND THAT ALREADY COVERS A DISPOSAL -- `determine`'s finding (plan position `19`) opens an `oblige` owned by the party it binds (`21_RECONCILIATION.md` C-1, RULED A), so the same `own`/T-m route this row gives every obligee lets that party end it: *'A convict can discharge his own penance.'* `19_PLAN.md` PART H, D-5 (RULED 2026-09-06 by Jordan, *'second-person lever stays refused'*) is why this is the ONLY route: no creditor verb, no `call_in`, no obligee-side closer on an obligation exists or will (`ED-SC-0035`) -- the bench that bound him cannot force the term to run, and cannot force it to end either. C-1's own price for the same ruling: *'That is not a hole — it is public, witnessed, priced by reception, and accepted by ruling.'* `RELEASABLE_KINDS`/`domain:` carry `oblige`, so a disposal releases exactly as any other `oblige` does."

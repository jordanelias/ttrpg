verbs:
  - verb:        "carry"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "none"
    beneficiary_note: "the good accrues to the PETITIONER, and a `carry` Candidate carries the petition (`subject`, a `Record` of kind `petition`) rather than the person who filed it."
    requires:    "a Petition exists; costs budget like any act"
    requires_typed:
      form:      existence
      of:        subject
      kind:      petition
    kind_note:   "⚠ `Petition` -> `petition` AT PLAN POSITION `15`, AND IT IS A CHANGE OF WHAT IS ASKED, NOT A SPELLING. `exists:Petition` read `World.petitions`, a dict no production code wrote; that dict is deleted and a petition is a `Record` of kind `petition` (`04_CODE_ARCHITECTURE.md` §B.5 -- *`forge`, `destroy_record`, `hold` and `carry` reach them with no new rows*). `exists:petition` asks *a Record of that kind exists*, which `queries/world_q.py::WorldReader.read` answers from `rosters.yaml: record_kinds`. `carry` STILL DOES NOT EXECUTE: it writes `(DocketItem, matter)` and has no effect, because Part E never says WHAT a carried petition puts on which docket (`H-63`) -- probe `F7` still ends there, at the same clause as before, now over a petition `Record` its own petitioner filed through `_eff_petition`. Its precondition now reaches the carrier; its write is the open half."
    requires_typed_note: "§E3 `:415` — *a Petition exists; **costs budget like any act***. The second half is not a precondition; §26.3's budget is spent by every act and is charged in `pack_scenes`. ⚠ THE SCOPING IS A CHOICE AND IS DECLARED: the prose is INDEFINITE (*a* Petition) and this reads it as *the petition being carried*, which is the act's `subject`. The alternative — any Petition anywhere in the world — would admit a `carry` of a petition that does not exist, and `carry` writes `(DocketItem, matter)`, i.e. it carries a PARTICULAR one. Under-refusing is the failure `G4` weighs equally with an invention, so the tighter reading is taken and named."
    writes:      ["DocketItem.matter"]
    emits:       ["petition.carried"]
    emits_on_refusal: ["carry.refused"]
    grade:       "ruled"
    effect_decline_note: "PLAN POSITION `14` (U7-own) DECLINED THE EFFECT. Its one write, `(DocketItem, matter)`, is an append to `World.docket`, a SEQUENCE, and `state/gate.py::Subject` names only an entity, an edge or a staged cell -- `_eff_open_case`'s own docstring: *THE DOCKET APPEND IS NOT A NAMED SUBJECT AND CANNOT BE ONE*; it rides the case file's receipt. `carry` mints nothing to ride on, so under G4 every carry would name nothing that moved and refuse as `NoOpReceipt`: an always-refused verb. Building it needs a fourth `Subject` shape at the gate, and which matter a carried petition puts before the room (the petition, or its `terms`) is unread by the tree (`H-63`)."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "commit"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "actor"
    requires:    "the Proposition exists (immutable, §14)"
    requires_typed:
      form:      existence
      of:        subject
      kind:      Proposition
    requires_typed_note: "§E3 `:426` — *the Proposition exists (immutable, §14)*. Definite article: the one the act commits to, which is the act's `subject`. §14 makes a Proposition immutable and `utter` is the only verb that creates one, so this is the clause that makes `utter` a precondition of the social layer rather than a formality."
    writes:      ["Tenure.since"]
    emits:       ["commitment.made"]
    emits_on_refusal: ["commitment.refused"]
    grade:       "ruled"
    refusal_note: "W3: added. §E2 -- 'failure emits, never raises'. This verb has a `requires` and had no refusal channel, so a failed precondition produced no Event, no witness and no arc. Refusal condition: the Proposition does not exist (§14 -- it is immutable and must be uttered first)"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "comply"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "none"
    beneficiary_note: "the obliger is who compliance is FOR, and `comply` is one of the two rows that carry `requires_typed: none` because the dispensation it answers has no name in `requires_operands`. `H-94`, not a table edit."
    requires:    "a claim of the dispensation's terms is in the actor's own ledger"
    requires_typed: none
    requires_typed_note: "§E3 `:430` — *a claim of the dispensation's terms is in the actor's **own** ledger*. §F.24a form 6, and the FORM is not the problem — `tell` is typed on it. THE OPERAND IS: the entity is a DISPENSATION, and `rosters.yaml: requires_operands` is closed on (actor, subject, from, to, site, kind, amount, floor) with no name for one. Typing it as `of: subject` would assert that an act's subject IS the dispensation whose terms are sought, which no in-chain document says; coining `dispensation` would be filling `H-94` by keyword argument. Stays on REQUIRES_PREDICATES, where it has no predicate, so the fold refuses and names what is missing — today's behaviour exactly."
    requires_decline_note: "PLAN POSITION IN-41 (`SM-11`) RECORDS WHAT `resolvable_verbs()` ALREADY DID WITHOUT A WORD. Nothing evaluates this precondition: the cell is untyped for the reason `requires_typed_note:` gives -- a Dispensation operand the closed `requires_operands` roster has no name for (`H-94`) -- and no `REQUIRES_PREDICATES` entry exists, so the fold would raise `Unspecified` (E2) on any act of it and the verb stays out of the game. A hand-written predicate would have to read the same unnamed operand; naming it is `H-94`'s."
    writes:      []
    emits:       ["compliance.given"]
    emits_on_refusal: ["compliance.impossible"]
    grade:       "ruled"
    writes_note: "per the term's own row"
    refusal_note: "W3: added. §E2 -- 'failure emits, never raises'. This verb has a `requires` and had no refusal channel, so a failed precondition produced no Event, no witness and no arc. Refusal condition: no claim of the dispensation's terms is in the actor's own ledger"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "confer"
    scale:   "settlement"
    scale_note: "conferral seats an office, and an office sits at a rung"
    stratum:     "binding_decision"
    eligibility: ["remit:confer"]
    beneficiary: "subject"
    requires:    "the office's conferral basis, and 1-per-object: no live hold on the object, or the holder-Proposition has zero live commit (§54 it. 20)"
    writes:      ["Tenure.until", "Tenure.since"]
    emits:       ["tenure.opened", "tenure.closed"]
    emits_on_refusal: ["confer.refused"]
    grade:       "ruled"
    eligibility_note: "⚠ W3 AUDIT: §E3's eligibility cell carried a PRECONDITION as well as the remit act — `remit:confer + ...`. The fold split on the first `:` and tested the whole tail against the remit roster, so it NEVER MATCHED and a holder of the remit was silently refused. The act is the eligibility; the basis is a `requires`."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "convene"
    stratum:     "binding_decision"
    eligibility: ["remit:convene"]
    beneficiary: "none"
    requires:    "rank(subject.kind) > rank(person) -- an ordinal floor above the person tier, or subject is NONE (§6.2)"
    requires_note: "⚠ `scale: \"settlement\"` IS DELETED (plan position `18`/PROC-A, `21_RECONCILIATION.md` PHASE 2 step 9). Jordan, 2026-09-05, correcting the row: *\"convene could happen at any scale except individual/person\"* -- and on the reason, *\"unless you mean convene as limited by physical location of participants, but this game can assume people will travel to somewhere ... the `person` kind is the address slot and the `Person` is who stands in it. A proceeding convenes at a place; a person-rung is an address, not a place.\"* `rung_kinds` is an ORDERED roster (person first), so the lawful expression is the ordinal `rank(venue.kind) > rank(person)`, not a kind enumeration (`03_PARAMETERS.md` §C.1's own falsifier: change the roster's membership and see what breaks). Evaluated in `loop/predicates.py::_req_convene`, NOT as a `requires_typed: scalar_threshold` cell -- that form's `check()` reads both sides off the SAME bound entity, so it has no channel for a literal constant without either coining a `requires_operands` member or overloading `floor`'s already-declared, structurally different meaning (`decision/options.py::_derive_operand`'s own stated rule: one meaning per operand name, never a per-verb table). The venue rides the act's `subject` operand -- C-11 (`21_RECONCILIATION.md:379`): *\"subject already binds the rung\"* -- not a `venue` key `requires_operands` has never carried."
    writes:      ["Date.due_at", "ConveningCondition.attached"]
    emits:       ["date.scheduled"]
    emits_on_refusal: ["convene.refused"]
    grade:       "ruled"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "create_record"
    stratum:     "uncontested_material"
    eligibility: ["own"]
    beneficiary: "none"
    requires:    "—"
    writes:      ["Record.exists", "Record.stages"]
    emits:       ["record.created"]
    emits_on_refusal: []
    grade:       "ruled"
    grade_note:  "V2 §E3 put `D7` in the grade column -- a Part B defect id, not one of §G4's four grades. W2 landed Part D's five `Record` rows, which IS D7's discharge, so the verb is `ruled` on that table."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "destroy_record"
    stratum:     "uncontested_material"
    eligibility: ["hold:<record>", "presence"]
    beneficiary: "actor"
    requires:    "—"
    writes:      ["Record.exists"]
    emits:       ["record.destroyed"]
    emits_on_refusal: ["destroy.refused"]
    grade:       "ruled"
    grade_note:  "V2 §E3 put `D7` in the grade column -- a Part B defect id, not one of §G4's four grades. W2 landed Part D's five `Record` rows, which IS D7's discharge, so the verb is `ruled` on that table."
    formation_decline_note: "PLAN POSITION `14` (U7-own) TOOK `A-13` AT LADDER STEP 4 AND HELD IT ON MEASUREMENT. `give`'s shape -- eligibility `own | hold:<record> | presence` (`own` first), the holding as a typed cell (`existence` of `subject` kind `Record`, `relation` of `subject` `held_by`), and `_eff_destroy_record` reading the bound `subject` instead of a `record` key no Candidate carries -- makes the row FORMABLE, and it EXECUTES: the 143-world corpus burns in 3 worlds (refused in 77), `populated.build_realm(0)` 1 in its first season (21 refused). It is held because the same measurement trips this position's falsifier and a test it may not edit: formed on every referent and mostly refused, it CROWDS `release` out of its 2 corpus worlds -- the always-refused set grows 8 -> 9, `H-156`'s shape (the pin then; the live pin is SEVEN, `test_season_shape.py:~7623`, so the same crowding would read 7 -> 8). ⚠ CORRECTED AT THE BATCH C CLOSE, TWO OF THIS NOTE'S REASONS DO NOT HOLD AT HEAD. (1) The second reason given here -- the realm's first season minting no chained told claim (`news.told` 3 -> 2, `news.untold` 3 -> 5), so `test_told_by_channel.py::test_15d_...`'s control goes vacuous -- is WITHDRAWN: after `13d-iii` seed 0 deposits no chained told claim, and that control runs SEED=5 (`tests/test_told_by_channel.py:~234-243`). (2) THE FIGURES ABOVE ARE NOT REPRODUCIBLE: the commit that took this decision said the formable variant was saved as a patch outside the tree for a ruling, and NO SUCH PATCH IS KEPT, so the crowding measurement (the corpus burns, `release` crowded out) is a record of a run at that tree and NOT RE-MEASURED AT HEAD; `destroy_record` forms for nobody in the realm today (`aperture 1 0`: eligible 0/0, formed 0). The unformable state is §E3's own cell, unchanged: both alternatives are placeholders (`H-75`)."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "determine"
    scale:   "settlement"
    scale_note: "a sitting decides at the venue's rung"
    stratum:     "binding_decision"
    eligibility: ["remit:determine"]
    beneficiary: "none"
    beneficiary_note: "who a determination FAVOURS is the `judging_set`, which `requires` itself records as *D11, absent*. `none` here is that absence declared, not a reading of the verb. ⚠ PLAN POSITION `19`: the bench now EXISTS (`judging_set`, `18`) and the determination binds the party it names (`counterparty:`, below) -- but a finding is taken AGAINST the party and FOR no carrier the Candidate holds (the bench's seat), `revoke`'s and `dispatch`'s shape, so `none` stands."
    requires:    "a fired Date with a DocketItem; judging_set — D11, absent"
    requires_note: "PLAN POSITION `19` (U7-remit) EVALUATES THIS, AS THE TYPED CELL BELOW, AND THE READING OF EACH HALF IS STATED. *A fired Date with a DocketItem* is read as `existence` of a DocketItem naming the matter -- the proceedings design's own corrected cell (`proposals/2026-09-05-proceedings-subsystem/04_VERBS.md` §B.2: `{form: existence, of: subject, kind: DocketItem}`), which drops the date: in a computed world no date fires with a holder (nothing sets one), so CALENDAR never forms a slot, and `open_case` dockets a matter with no date at all. *judging_set* is two conjuncts: the seat exercised SITS ON THE BENCH for the party (`basis: bench`, the write gate's own `may_determine` -- `judging_set`'s containment test, `H-32`'s default, asked of the party's home), and the bench MEETS QUORUM (`bench.size >= quorum`, the fixture `bench_quorum`, `H-161`). `D11` is `H-32`, built at `18`, so the grade moves `absent` -> `assumption`. The subject must be a PERSON (`party`): the disposal is an edge he owns."
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      Person
          conjunct:  party
        - form:      existence
          of:        subject
          kind:      DocketItem
          conjunct:  docket
        - form:      basis
          of:        subject
          basis:     bench
          conjunct:  bench
        - form:      scalar_threshold
          of:        subject
          scalar:    "bench.size"
          threshold_predicate: quorum
          conjunct:  quorum
    requires_typed_note: "FOUR CONJUNCTS, EACH NAMED FOR THE KEYED REFUSAL IT EMITS, IN THE ORDER A READER CAN TELL THEM APART. `party` -- the matter is a person (only a person owns an `oblige`). `docket` -- somebody put the matter before the room (`open_case`, `19`'s other half), read through `world_q.docketed`, the reader's `docket` branch. `bench` -- `Basis` (§F.24a form 7, `data/requires.py`) with the `bench` rule: the SAME predicate the write gate's `determination` basis asks, so the fold refuses (`determine.unauthorized`) exactly what the gate would raise on. `quorum` -- `scalar_threshold` (form 2) of `bench.size` against the SECOND READ `quorum`, `work`'s `floor` shape: the bench's distinct seated members against the fixture, with NO operand added to `cardinality` (`21_RECONCILIATION.md` A.1 struck that as a widening) and NOTHING STORED (C-7: *'no stored tally'*; a grep for `count`/`tally`/`quorum_reached` finds no field). ⚠ QUORUM IN ITS ORDINARY SENSE -- the members a bench needs to sit -- NOT C-7's vote threshold (live `commit`s to the disposition), which needs a disposition Proposition and two grammar entries and is `H-161`'s recorded alternative. ⚠ AT THE SHIPPED `bench_quorum = 1` THE QUORUM CONJUNCT CANNOT REFUSE an actor the bench admitted (he is a member): the observable *below quorum, `determine.refused`* is run at 2 and 3 (`tests/test_u7_remit.py`)."
    counterparty: subject
    counterparty_note: "PLAN POSITION `19`: THE PARTY IS THE SECOND SIDE (`ED-IN-0210` ruling 1, *a real interaction has a COUNTERPARTY*), and a judge does not bind himself -- `may_determine` refuses it at the fold and the gate. Declined person-side here, on `petition`'s precedent, so a self-determination is never formed: no read the fold makes can teach a person *that is you*, so a refusal would only tax his scenes."
    writes:      ["Tenure.since", "DocketItem.matter"]
    writes_note: "⚠ PLAN POSITION `19` REWROTE THIS COLUMN, AND DROPPED A WRITE. It read `[Tenure.degree]` -- a verb that could GRADE an edge and not OPEN one, the defect `04_VERBS.md` §B.2 correction ⑴ names -- and no effect ever wrote it. `21_RECONCILIATION.md:575`'s observable is *'a determination OPENS the disposal Tenure on its subject via the seat'*, so the first pair is `Tenure.since`: `loop/effects.py::_eff_determine` opens an `oblige` owned by the party on the seat exercised, admitted at the gate under the EIGHTH basis, `determination` (`state/gate.py::may_determine`). The second pair is `DocketItem.matter`, check-only: the same effect takes the matter off the docket, so it is determined once. `Tenure.degree` is GONE because an uncontested act carries no degree (`loop/resolve.py::_fold`: *'None on every uncontested act, which is honest'*); the degree-keyed row that grades a disposal is the CONTESTED determination, PHASE 2 steps 13-15, and `write_matrix.yaml`'s `(Tenure, degree)` row now declares `unproduced: H-162`."
    emits:       ["matter.determined"]
    emits_on_refusal:
      eligibility: ["determine.unauthorized"]
      party:       ["determine.refused"]
      docket:      ["determine.refused"]
      bench:       ["determine.unauthorized"]
      quorum:      ["determine.refused"]
      write:       ["determine.refused"]
      counterparty: ["determine.refused"]
    refusal_note: "PLAN POSITION `19`: KEYED PER CLAUSE (`04 §B.13` invariant 4's per-conjunct half, F7; `data/verbs.py` checks the keys are exactly this row's failable clauses). Two kinds, split by WHO said no. `determine.unauthorized` -- the SEAT: none exercised grants `determine`, or the one exercised does not sit in judgment over the party. `determine.refused` -- the WORLD: the matter is no person, is on no docket, the bench is below quorum, or the effect found nothing to open (the party already owes this seat an `oblige`). ⚠ `determine.unseated`, the proceedings design's second kind (`04_VERBS.md` §B.2), is NOT taken: read cold it names an Event in which somebody was UNSEATED -- `revoke`'s outcome -- which is the opposite of a refusal; `unauthorized` is the ordinary word for *not permitted by any authority the act carries* (`CLAUDE.md` §4). The design's struck `determine.unheard` (P-23) stays struck. ⚠ PLAN POSITION `14`: THE ROW NAMES `counterparty: subject`, AND THAT CLAUSE (`loop/resolve.py::_admits`, asked only AFTER the precondition passes) CAN NEVER FIRE FOR THIS ROW. Both of its cases are refused earlier, by the precondition: a self-determination is refused by the `bench` conjunct (`may_determine`, `state/gate.py` conjunct 2, *a judge does not bind himself*) as `determine.unauthorized`, and an act naming no subject dies at `party` (`determine.refused`) first. The `counterparty:` key under `emits_on_refusal` (`determine.refused`) is in `data/verbs.py`'s expected set BY DERIVATION from the row's `counterparty:` column (`data/verbs.py:704-705`), so the loader refuses a keyed row without it and does not call it an ID-13 EXTRA: THE LOADER CANNOT JUDGE REACHABILITY, only that a key names a clause the row derives. The key is read at `loop/resolve.py:290` and is dead for `determine` only because the `bench` conjunct (`may_determine`, `state/gate.py`, conjunct 2) runs first, which is a fact about this row's precondition and about nothing the loader checks; the `_eff_determine` self-check this clause replaced was already dead for the same reason (`loop/effects_information.py:270-272`)."
    grade:       "assumption"
    grade_note:  "PLAN POSITION `19`: was `absent` on `D11` (`judging_set` raised unconditionally). `18` built it (`H-32`, graded `assumption`), and the quorum is a swept fixture (`H-161`), so the row is `assumption`, not `ruled`."
    source:      "ARCHITECTURE_V2.md §E3, transcribed; precondition, disposal, keyed refusals and writes at plan position `19` (`workplans/2026-09-18-governance-settlement-behaviour-plan_part2.md` `19 — INSTRUCTION`; `21_RECONCILIATION.md:575`)"

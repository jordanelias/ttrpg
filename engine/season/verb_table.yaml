          of:        site
          relation:  present_at
    requires_typed_note: "The `requires` cell here is W3's, not §E3's — §E3 `:421` put an EFFECT formula in the column and W3 moved it to `effect:`, leaving *the site exists and the actor is present at it*. Two clauses, conjoined because the prose conjoins them. ⚠ `present_at` DUPLICATES THE `presence:<site>` ELIGIBILITY ALTERNATIVE, and that duplication is in the prose rather than introduced here; eligibility is a DISJUNCTION (`own | presence:<site>`) so `own` alone admits, and the precondition is where presence actually binds. ⚠ THE PREMISE OF THIS CELL'S LAST SENTENCE WAS FALSIFIED BY `W-C` AND ITS CONCLUSION SURVIVES; corrected by the `W-C` adversarial pass rather than left standing. It read *\"`site` is unbound for every computed act\"*, and `operands_for` now BINDS `site` from the question's referent — a `restore` Candidate carries `{site: <referent>, subject: <referent>, to: <referent>}`. What kept `restore` unexecutable was the OTHER half: it writes `Site.condition` and had no `EFFECTS` entry, so `resolvable_verbs()` excluded it and the chooser never offered it to the fold at all. ⚠ PLAN POSITION `24e` CLOSED THAT HALF (`loop/effects.py::_eff_restore`), so `restore` is resolvable and this cell is now what decides it; since `11a` a referent CAN be a Site (a claim about a co-located dwelling), so the `existence` clause reads true for those and `present_at` decides the rest."
    writes:      ["Site.condition"]
    emits:       ["site.restored"]
    emits_on_refusal: ["restore.refused"]
    grade:       "ruled"
    effect_formula_note: "Δ = +(1 − condition) × f(degree) × share (§54 it. 7's mirror). ⚠ BUILT AT PLAN POSITION `24e` as `loop/effects.py::_rise`, the one owner `work` also reads when it advances a works: `(1 − condition)` is the headroom to the works' ceiling (`queries/world_q.py::ceiling`, the full scale where no works names the site), `share` is `queries/world_q.py::share` (one over those standing at the fabric), and `f(degree)` is the IDENTITY because this row is uncontested and `_fold` hands it no degree (`H-164`). Staged on `(Site, condition)` and clamped once under the ceiling, `work`'s G4 shape."
    effect_note: "W3: this formula was in the `requires` column. A precondition is a question the fold asks of the world; an effect is what the write does. Conflating them is how a resolver grows a second body."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "revoke"
    scale:   "settlement"
    scale_note: "as `confer` -- it unseats the same office"
    stratum:     "binding_decision"
    eligibility: ["remit:revoke"]
    beneficiary: "none"
    beneficiary_note: "revocation is taken AGAINST the holder and FOR the revoking remit -- an Office, which no Candidate carries. Same shape as `dispatch`."
    requires:    "the office's revocation basis, and a live hold exists, and the seat's conferral basis has a revocation disposal"
    writes:      ["Tenure.until", "Tenure.since"]
    emits:       ["tenure.closed"]
    emits_on_refusal: ["revoke.refused"]
    grade:       "ruled"
    disposal_note: "v9 IN-31 (H-100): WHAT A REVOCATION COSTS THE MAN REVOKED, read off the SEAT'S conferral basis (`Office.conferral`, ED-IN-0256 (2)). The one owner is `state/gate.py::REVOCATION_DISPOSAL` (JORDAN, 2026-10-21, answering the IN-31 design's A1: `appointed` -> a PERMANENT `ban : him -> Act.via`, SC-03a's restraint, which `confer`, `oblige` and the fold's readers already refuse; `elected`, `annex`, `None` -> nothing). `Tenure.since` is the ban's opening (`determine`'s precedent). `emits` STAYS `tenure.closed`: the ban earns no event of its own (`determine`'s disposal earns only `matter.determined`), and `tenure.opened` here would make it a second emitter of a kind `data/verbs.py::KIND_VERB` maps to `confer`, unpricing every `confer` deed. The ban carries no term and no effect closes one, so only death ends it. NOT REVOCATIONS, and so costing nothing: a termed hold maturing at MATTER (`T-n`), a `release` or a self-revocation of one's own seat (`T-m`; no self-ban), a `confer` displacing an incumbent (A1), a death (`cascade`). ⚠ It is the seat's basis, not the route by which the man came to sit: `confer` fills all three bases. A computed `revoke` executes 0 times on `build_realm(0)` (H-207 ruling (A)), so the outcome is observed by hand-built acts (`tests/test_in31_revocation_cost.py`)."
    eligibility_note: "⚠ W3 AUDIT: §E3's eligibility cell carried a PRECONDITION as well as the remit act — `remit:revoke + ...`. The fold split on the first `:` and tested the whole tail against the remit roster, so it NEVER MATCHED and a holder of the remit was silently refused. The act is the eligibility; the basis is a `requires`."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "sabotage"

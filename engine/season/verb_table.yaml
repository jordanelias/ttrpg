  # ===========================================================================================
  # PLAN POSITION `24e` -- WORKS & FOUNDING. `ARCH` F.20 (`04_CODE_ARCHITECTURE.md`): *"the world
  # only decays -- nothing is ever founded or built"*. `(Rung, exists)` and `(Site, exists)` were
  # declared matrix rows with no producer (`H-41`); these two rows are the producers. Both make what
  # a WORKS plans (`rosters.yaml: record_kinds`, `works: [plan, at]` -- *"a <plan> at <at>"*), which
  # `create_record` declares and its maker holds: the works carries the kind and the place, which
  # the closed operand vocabulary cannot (`at` is no `requires_operands` member and must not
  # become one), so each act's only operand is `subject`, the works.
  # ⚠ TWO VERBS, NOT r2's ONE. r2 `04` §A.7.1 folds both into one `found` writing two rows, one
  # earned per act, citing round one's *"there is no `build`"*. The plan's `24e` (2026-09-25, later
  # and the position's own text) names both -- *"a `found` row and `_eff_found` ... Then a `build` row
  # and `_eff_build`"* -- and says why they are two: *"A founded hearth has no dwelling until one is
  # BUILT"*. They make different carriers (a Rung and its `contain` edge; a Site, which has no edge),
  # admit different gate bases (`founding`; none), and a person founding a hearth and a person
  # raising a house in it are different acts with different preconditions on the plan's kind.
  # ⚠ NEITHER CARRIES A CAPACITY REFUSAL (the plan's CORRECTION, 2026-09-25): they are how capacity
  # GROWS; a `found` refused at a full rung would deadlock it. The refusal is `19c`'s `migrate`'s.
  # ===========================================================================================
  - verb:        "found"
    stratum:     "uncontested_material"
    eligibility: ["own"]
    beneficiary: "none"
    beneficiary_note: "a founded place is a Rung, and a Rung is no carrier the Candidate holds; who benefits from a new hearth is whoever comes to live or hold there, a WORLD read, which is `restore`'s and `work`'s shape. No `hold` on the new Rung is minted (`H-166`)."
    requires:    "the subject is a works, and the actor holds it -- the maker's standing"
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      works
        - form:      relation
          of:        subject
          relation:  held_by
    requires_typed_note: "PLAN POSITION `24e`, whose CORRECTED text gives `found` exactly *'its own preconditions (well-formed operands, the maker's standing, strict ascent)'* and no capacity refusal. TWO CONJUNCTS, BOTH EXISTING FORMS AND STEMS -- no form, operand, combinator or stem added. `existence` of `subject`, `kind: works` -- a Record OF THAT KIND (`WorldReader.read`'s `record_kinds` branch, `carry`'s route): the WELL-FORMED OPERAND, a works and not any id. `relation` of `subject`, `held_by` -- `succeed`'s live cell: THE MAKER'S STANDING, read as r2 `04` §A.6.2 reads it, the actor holds the works (*'held by the actor'*), which `create_record` mints for its maker and `give` hands on (so a rival may become master of a works and found it). STRICT ASCENT is not a cell: the plan's kind and its `at` live in the works' content, which no stem reads, so `loop/effects.py::_eff_found` declines it through `rung_kind_ascends`, the one owner `add_tenure` raises on (`_eff_move`'s precedent). ⚠ r2 §A.7.1's THIRD CONJUNCT, `matured >= 1`, IS NOT TAKEN: the plan's corrected list omits it, and the grammar cannot spell it without a new stem and a constant threshold read. The terms bind where r2 itself put their teeth -- at the fabric's `ceiling` -- so a plot may be staked before a term ripens and nothing built on it can be raised until one does. ⚠ AND r2's `cardinality` CONJUNCT (one works per target) LIVES AT THE PRODUCER: `create_record` declines a second live works on a target (`queries/world_q.py::works_for`)."
    writes:      ["Rung.exists", "Tenure.since"]
    writes_note: "`Rung.exists` is the first pair and the effect's own: the new Rung, whole. `Tenure.since` is the `contain` edge placing it in the works' `at`, opened through `World.add_tenure` in the same `apply` and admitted at the gate under the NINTH basis, `founding` (`state/gate.py`: a `contain` opened for a thing this same write brought into existence, its only parent -- the mirror of `cascade`). Declared on `establish`'s precedent (`Tenure.payload`): the fold gates exactly the pairs a verb declares, so this second pair is checked for class, step and partition; the effect runs once, on the first. No `write_matrix.yaml` row is added: both pairs exist, and `(Rung, exists)`'s `unproduced:` is deleted in the same commit (loader invariant 2)."
    emits:       ["rung.founded"]
    emits_on_refusal: ["found.refused"]
    grade:       "assumption"
    grade_note:  "the matrix row `(Rung, exists)` is the tree's (`W2/H-41`); the VERB is plan position `24e`'s, on r2 `04` §A.7.1's reading, and its preconditions are the plan's corrected list -- an argued addition, graded as `succeed`, `utter` and `forge` are."
    refusal_note: "FLAT: one kind for every failable clause, which a flat row declares (`data/verbs.py`, invariant 4). Refusal conditions: the subject is no works, or the actor does not hold it (the cell); the works plans no `rung_kinds` member, names no rung, has already founded, or its plan does not strictly ascend into its `at` (the effect's decline, the `write` clause)."
    source:      "plan `workplans/2026-09-18-governance-settlement-behaviour-plan_part2.md` 24e (as corrected 2026-09-25); r2 `proposals/2026-09-17-governance-and-holdings-r2/04_MATTER_AND_WORKS.md` §A.6.2 moment 3, §A.7.1; `write_matrix.yaml` `(Rung, exists)` (W2/H-41)"
  - verb:        "build"
    stratum:     "uncontested_material"
    eligibility: ["own"]
    beneficiary: "none"
    beneficiary_note: "a built fabric is a Site, and a Site is no carrier the Candidate holds -- `found`'s reason, and `restore`'s and `work`'s: who benefits from a new dwelling or harbour is a WORLD read."
    requires:    "the subject is a works, and the actor holds it -- the maker's standing"
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      works
        - form:      relation
          of:        subject
          relation:  held_by
    requires_typed_note: "`found`'s cell, conjunct for conjunct and for `found`'s reasons: a works (the well-formed operand), held by the actor (the maker's standing). No ascent clause -- a Site hangs off its rung by a field, not a ladder edge -- and no capacity refusal (the plan's correction of 2026-09-25: building at a full rung is how its capacity grows). Whether the works plans a `site_kinds` member, names a rung, or has already built is `loop/effects.py::_eff_build`'s decline, the `write` clause."
    writes:      ["Site.exists"]
    writes_note: "`(Site, exists)`'s first producer (`W2/H-41`, *'building a site'*): the Site the works plans, at the rung it names, at condition 0 (r2 §A.7.1: *'a fabric begins at NOTHING'*). `Site.rung`, `Site.kind` and the initial `condition` are the Site's own construction inside this one write -- no `(Site, condition)` pair is declared, as `create_record` declares none for a Record's content; the condition then RISES only through `restore`/`work` on the accumulator. `(Site, exists)`'s `unproduced:` is deleted in the same commit (loader invariant 2)."
    emits:       ["site.built"]
    emits_on_refusal: ["build.refused"]
    grade:       "assumption"
    grade_note:  "`found`'s grade and reason: the matrix row is the tree's, the verb is plan position `24e`'s."
    refusal_note: "FLAT, as `found`'s. Refusal conditions: the subject is no works, or the actor does not hold it (the cell); the works plans no `site_kinds` member, names no rung, or has already built (the effect's decline)."
    source:      "plan `workplans/2026-09-18-governance-settlement-behaviour-plan_part2.md` 24e (*'Then a `build` row and `_eff_build` minting a Site of a `site_kinds` member'*); r2 `04_MATTER_AND_WORKS.md` §A.7.1 (the Site half of its one-verb `found`); `write_matrix.yaml` `(Site, exists)` (W2/H-41)"
  - verb:        "give"
    stratum:     "social"
    eligibility: ["own", "hold:<record>"]
    beneficiary: "to"
    beneficiary_note: "THE RECEIVER, who a gift is for -- the `to` operand, which this row's typed cell BINDS since plan position `14` (it read `none` while the row was untyped and could carry no `to`, the loader refusing `beneficiary: to` on a cell that binds none). `subject` is the Record."
    requires:    "the actor holds the subject, and the receiver is present where the actor is"
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      Record
        - form:      relation
          of:        subject
          relation:  held_by
        - form:      relation
          of:        to
          relation:  with
    requires_typed_note: "PLAN POSITION `14` (U7-own) TYPED THIS CELL AND RETIRED `loop/predicates.py::_req_give`, WHICH IS WHAT MAKES A GIFT FORMABLE. It was `none` FOR THE GRAMMAR'S REASON: the co-location conjunct had no stem (*'IF A PERSON-TO-PERSON CO-LOCATION STEM IS EVER RULED, THIS IS THE CELL WAITING FOR IT'*), and the telling workplan's `T4` built exactly that stem, `with` (`data/requires.py: REQUIRES_STEMS`, `relation` of `to` -- `tell`'s `hearer`). THREE CONJUNCTS, `_req_give`'s four clauses less the one the fold now owns, each on an existing form and stem: `existence` of `subject`, `kind: Record` (clause 1, `give` hands on a DOCUMENT -- the `handover` basis is general over every non-seat `hold`, and this row narrows the verb); `relation` of `subject`, `held_by` (clause 2, the actor holds it -- `succeed`'s and `found`'s cell; `hold_force`'s raise on two live holders is not asked here because the gate's `handover` makes two unreachable); `relation` of `to`, `with` (clause 4, the receiver stands where the actor does -- UNKNOWN for a receiver who is no person, so `_req_give`'s *a person* rides here too). Clause 3, *a person other than the actor*, is `ED-IN-0210` ruling 1's second party and is the FOLD's (`loop/resolve.py::_admits`, the `counterparty` clause, `14`), not this cell's: the grammar has no negation. ⚠ THE CONSEQUENCE: the cell binds `to` BESIDE `subject`, so `TypedRequires.known_person_operands` names `to` and `decision/options.py::operand_bags` forms one Candidate per person the giver KNOWS (`known_persons`, `tell`'s primitive) -- the topic is the referent (the Record) and the receiver is somebody known, never the referent. `with` is WORLD-ONLY, so a giver forms the Candidate on whom he knows and the fold refuses an absent receiver."
    counterparty: to
    counterparty_note: "THE RECEIVER. Since plan position `14` the typed cell binds `to`, so every Candidate carries it (from `operand_bags`' known persons) and `opening_set` declines only a gift to oneself, as it does a petition; the FOLD refuses the same case for a hand-built act (`_admits`' `counterparty` clause). BEFORE `14` the row was UNTYPED and this column made `opening_set` form NONE -- MEASURED then: 3 person-formed `give`s in `headless.run(3, 0)` and 41 in `populated.run(2, 0)`, every one `give.refused` for want of a receiver, which is the scene tax the column existed to stop."
    writes:      ["Tenure.until", "Tenure.since"]
    writes_note: "ONE PER SIDE, `confer`'s pair: the giver's `hold` closes (`Tenure.until`) and the receiver's opens (`Tenure.since`), in ONE effect (`loop/effects.py::_eff_give`), so the fold never sees two live holders. The gate admits the close as `T-m` and the open as `handover` (`state/gate.py`), and the second requires the first IN THE SAME WRITE -- release-before-mint is the gate's condition, not the effect's habit (r2 `05` row 6, ⊕ R14). No `write_matrix.yaml` row is added: both pairs exist."
    emits:       ["record.given"]
    emits_on_refusal: ["give.refused"]
    emits_note: "⚠ A NEW KIND, AND IT MUST NOT BE `record.created` OR `tenure.opened`/`tenure.closed`. `epistemic.py::_ch_chronicle` broadcasts every kind a `binding_decision` row emits and `_ch_post_remit` every kind a `remit:`-eligible row emits, both by kind; `confer`, `revoke` and `release` emit the tenure kinds and `issue` shares `record.created`'s family, so reusing either would make every handover in the realm public. `record.given` is emitted by this row alone, `social` and `own`-eligible, so neither channel reads it."
    grade:       "ruled"
    grade_note:  "RATIFIED PROGRAM POSITION 16 -- *one two-party verb ... `own` + `hold:<record>` eligibility, writing the holder's `hold` closed and the receiver's open* -- named against `architecture/VOCABULARY.md` (no row for give, grant, hand, convey or deliver; checked again at the build), and the gate's basis for the receiver's edge settled at G3's pre-flight (`ED-IN-0277`). `hold:<record>` is a PLACEHOLDER and declines on both sides (`H-75`); `own` admits first, as `transfer`'s `own | hold:<store>` does."
    source:      "plan `workplans/2026-09-18-governance-settlement-behaviour-plan_part2.md` position 16 (≡ `15a`); r2 `proposals/2026-09-17-governance-and-holdings-r2/02_THE_WRIT_AND_THE_WORD.md` §A.7 (the row, the predicate, the name); `hole_register.yaml` H-84"
  - verb:        "issue"
    scale:   "province"
    scale_note: "a Dispensation's `scope` enumerates executors -- §37.1 -- so its reach is the domain the issuer governs"
    stratum:     "binding_decision"
    eligibility: ["remit:issue"]
    beneficiary: "none"
    requires:    "scope enumerates executors, not places (§37.1)"
    requires_note: "⚠ EVALUABLE SINCE PLAN POSITION `19`, AND SO `issue` IS RESOLVABLE (it had the effect since `15`). This note read *'STILL PROSE, AND THAT IS WHY `issue` IS NOT RESOLVABLE EVEN WITH AN EFFECT'*: the fold raised `Unspecified` on the prose and `resolvable_verbs()` excluded the verb. ⚠ r2 `02` §A.6's proposal -- `commit`'s `existence of subject kind Proposition` -- is NOT taken: the prose says nothing about the terms, and a computed act binds `subject` and `to` to the question's ONE referent (`H-94`), so the Proposition conjunct and the executor conjunct could never hold at once and every computed `issue` would refuse -- `confer`'s 100% at `★`, for a clause the row does not state."
    requires_typed:
      all:
        - form:      existence
          of:        to
          kind:      Person
          conjunct:  executors
        - form:      basis
          of:        to
          basis:     purview
          conjunct:  authority
    requires_typed_note: "PLAN POSITION `19`. §F.24a calls this cell *'a constraint on the well-formedness of the Act ... refused at construction'* -- and the Act schema does not refuse it, so the fold does, as two conjuncts. `executors` -- *scope enumerates EXECUTORS, not places*: the addressee (`to`, the dispensation's addressee key) exists and is a PERSON, so a writ addressed to a rung is refused. `authority` -- `Basis` (§F.24a form 7) with the `purview` rule: the issuing seat's purview reaches where the executor lives -- the row's `scale_note`, *'its reach is the domain the issuer governs'*, and `04:330`, purview asked of the seat exercised. ⚠ ONE EXECUTOR PER ACT: `existence` reads one id, and `decision/options.py::_from_content_claim` collapses a held writ's addressee list to its one member or declines; a hand-built act naming several is outside what this cell can ask."
    counterparty: to
    counterparty_note: "PLAN POSITION `19`: THE EXECUTOR IS THE SECOND SIDE, AND AN ISSUER IS NOT HIS OWN. `petition`'s precedent exactly: its typed cell binds `to`, and `opening_set` forms no Candidate whose `to` is the person -- a writ a man addresses to himself would EXECUTE (he is a person, and his seat's purview reaches his own home) and mint a document that orders nobody, a constant scene tax the fold could never refuse."
    writes:      ["Record.exists"]
    emits:       ["dispensation.issued"]
    emits_on_refusal:
      eligibility: ["issue.unauthorized"]

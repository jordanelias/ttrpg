    requires_typed:
      all:
        - form:      existence
          of:        site
          kind:      Site
          conjunct:  exists
        - form:      relation
          of:        site
          relation:  present_at
          conjunct:  present
    requires_typed_note: "The `requires` cell here is W3's, not §E3's — §E3 `:421` put an EFFECT formula in the column and W3 moved it to `effect:`, leaving *the site exists and the actor is present at it*. Two clauses, conjoined because the prose conjoins them. ⚠ `present_at` DUPLICATES THE `presence:<site>` ELIGIBILITY ALTERNATIVE, and that duplication is in the prose rather than introduced here; eligibility is a DISJUNCTION (`own | presence:<site>`) so `own` alone admits, and the precondition is where presence actually binds. `operands_for` binds `site` from the question's referent -- a `restore` Candidate carries `{site: <referent>, subject: <referent>, to: <referent>}` -- and `loop/effects.py::_eff_restore` (plan position `24e`) makes `restore` resolvable, so this cell decides it; since `11a` a referent CAN be a Site (a claim about a co-located dwelling), so the `existence` clause reads true for those and `present_at` decides the rest."
    writes:      ["Site.condition"]
    emits:       ["site.restored"]
    emits_on_refusal:
      eligibility: ["restore.refused"]
      exists:      ["restore.refused"]
      present:     ["restore.refused"]
      write:       ["restore.refused"]
      draw:        ["restore.failed"]
    draw_note:   "B07.01 (18-A item 4; A-81): the `draw` clause's Event reports a LOST DRAW, not a refusal (04 §C.4: a refusal is a precondition failed, a loss an outcome that went against you) -- emitted at the Failure band once `task_draw_arm` is `on` (B07.05), with no typed write; its durable write is the Event and the claims WITNESS deposits of it. Kept out of the refusal union (`data/verbs.py::VerbRow.draw_kinds`)."
    grade:       "ruled"
    effect_formula_note: "Δ = +(1 − condition) × f(degree) × share (§54 it. 7's mirror). ⚠ BUILT AT PLAN POSITION `24e` as `loop/effects.py::_rise`, the one owner `work` also reads when it advances a works: `(1 − condition)` is the headroom to the works' ceiling (`queries/world_q.py::ceiling`, the full scale where no works names the site), `share` is `queries/world_q.py::share` (one over those standing at the fabric), and `f(degree)` is `task_fraction`'s share of the band (B07.02, `_rise`; the whole headroom with no band: the arm `off`, or Success) -- it was the identity while `_fold` handed it no degree (`H-164`). Staged on `(Site, condition)` and clamped once under the ceiling, `work`'s G4 shape."
    effect_note: "An effect formula is not a precondition: a precondition is a question the fold asks of the world, an effect is what the write does, and conflating them is how a resolver grows a second body."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"

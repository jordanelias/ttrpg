    source:      "investigation_systems_v30.md:217; fieldwork_v30.md:297 (§4.2), :321 (§4.3), §4.5 :341-347. ⚠ P-01 CO-MOVEMENT AND THE COHERENCE COST (§4.5 :344-346) ARE NOT EXPRESSED HERE and are not silently dropped: they are threadwork effects with no carrier in this loop, carried on ED-FI-0009 with the Exposure gap"
  - verb:        "reconstruct"
    stratum:     "uncontested_material"
    eligibility: ["own"]
    beneficiary: "actor"
    requires:    "the actor holds a claim on the subject"
    requires_typed:
      form:      own_ledger
      of:        subject
    requires_typed_note: "`fieldwork_v30.md:298` -- *Reconstruct · Recall · Assemble existing evidence into a coherent picture. No new information gathered — this action synthesises.* The precondition is that there IS assembled evidence, and `fieldwork_v30.md:256`'s Evidence Track is a count over what the investigator holds -- which in this loop is the actor's own ledger, the one ledger `04 §B.2`'s F8 carve-out lets the fold read. Same form and same cell shape as `tell`. ⚠ WHAT THIS CELL DOES NOT CARRY IS THE OBSTACLE, AND CANON GIVES ONE: `Ob = (threshold − current progress), min 1` (:298), where the threshold is 3 / 5 / 8 by investigation scope (`:262-264`) chosen at opening BY A GM (`:266`) -- a role this engine does not have. A `Question` carries `(id, source, referents, about)` and no scope, so there is nothing to read a threshold off; picking one is §42.2.1's invented number. ED-FI-0009."

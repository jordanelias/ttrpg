# PART E, AS DATA — THE VERB TABLE, WHICH IS THE RESOLVER'S BODY.
#
# W3 of `architecture/PLAN.md`, and PLAN §5.1 calls it "the item
# that turns grading into running". #353 gives `resolve : (Act[], World) -> Event[]` and NEVER SAYS
# WHAT ANY VERB DOES — the semantics are prose scattered across §11, §36, §37 and §54. That is
# defect `D20`, and it is why the tested instrument could only GRADE cases and never RUN them: with
# no table, every act needed a hand-written `effect` lambda, and a lambda per act IS a second
# resolver.
#
# ONE `resolve` READS THIS TABLE. The fold is: eligibility → `requires` evaluated AGAINST THE WORLD
# THE PREDECESSORS LEFT → each `writes:` through `write()` → `emits` or `emits_on_refusal`.
#
# `emits_on_refusal` IS THE SCARCITY CHANNEL AND IT IS LOAD-BEARING (§27.1, §E2). "The second
# claimant on an emptied granary gets a DIFFERENT Event." A verb that RAISES on a failed
# precondition produces no Event, no witness and no arc — so scarcity stops being something the
# world does and becomes something the engine forbids.
#
# `writes:` ENTRIES MUST BE ROWS OF `write_matrix.yaml`. Anything else is an unmarked cell under
# §30's own rule. The loader checks it; a verb naming a pair Part D does not carry raises at load
# rather than at the first act that uses it.
#
# ELIGIBILITY IS ONE OF FOUR KINDS — `own`, `remit:<act>`, `hold:<object>`, `presence:<rung>` — AND
# NEVER `capability`. #353 §9.2: "`capability` supplies dice and GATES NOTHING." An office makes an
# ORDINARY verb eligible; no verb exists only for office-holders, and none carries a modifier.
#
# WHAT W3 CHANGED, each with the reason:
#   * FOUR VERBS ADDED that #353 names and Part E omits — `utter`, `establish`, `exchange`,
#     `succeed`. Without `utter` NO PROPOSITION EXISTS and `commit`/`petition`/`issue` cannot fire,
#     so the season cannot start.
#   * SIX REFUSAL EVENTS ADDED. W3 names `tell`; applying W3's own rule rather than its list finds
#     the same defect in `commit`, `repudiate`, `comply`, `evade`/`defy` and `refract` — each had a
#     `requires` and no refusal channel. The eight verbs still without one genuinely have no
#     precondition.
#   * `restore`'s EFFECT FORMULA moved out of its `requires` column. A precondition is a question
#     the fold asks of the world; an effect is what the write does.
#   * `open_case`'s eligibility graded `assumption` with `own` swept — #353's five remit acts are
#     CLOSED and opening a case is not among them, so V2 invented one.
#   * `create_record` and `destroy_record` regraded from `D7` — a Part B DEFECT ID sitting in the
#     grade column — to `ruled`, which W2 earned by landing Part D's five `Record` rows.
#
# PROVENANCE. The 28 carried rows are extracted mechanically from §E3's markdown table. ⚠ The first
# extraction SILENTLY DROPPED FOUR of them — `transfer`, `work`, `restore`, `destroy_record` —
# because their cells contain an ESCAPED pipe (`own \| hold:<store>`) and a naive split produced
# nine columns, which a `len == 8` filter then discarded without a word. The extractor asserts that
# nothing is skipped now. A filter that drops what it cannot parse reports clean over an unknown
# number of missing rows.

# =============================================================================================
# ⚠ CONDITIONED BY #358 rev.2, 2026-09-03. WHAT THIS TABLE NOW FAILS, AND THE RESOLUTION FOR EACH.
#
# #358's Stage 4 was rewritten after an adversarial pass; its loader gained a twelfth invariant and
# corrected four others. Run against THIS table, the rewritten loader refuses it in three places.
# They are recorded here rather than fixed silently, because two of the three need a ruling.
#
# 1. `scale:` ON TEN ROWS FAILS INVARIANT 10 (unknown key; `scale:` refused BY NAME).
#    Rows: confer, convene, determine, dispatch, establish, exchange, issue, levy, revoke, succeed.
#    #358 §E.3 and Stage 2 §C.3: scale is a POSITION IN THE CONTAINMENT TREE, derived on demand,
#    stored nowhere -- "a label cannot be walked", and indexing code by scale deletes the property
#    that makes one type with many kinds worth having.
#    ⚠ DO NOT DELETE THE TEN KEYS YET. They answer a real Jordan question ("is it unnecessary to
#    nest these and instead just explicitly define scale?"), and #358 rev.2 supplies the answer:
#    THE SCOPE OF THE SEAT BEING EXERCISED -- `Act.via.scope` -- not a column on the verb. The key
#    is retired when `Act.via` carries the scope; until then each row's `scale_note` is the
#    provenance that would be lost. Tracked as the conditioning item, not as a hole.
#
# 2. `kill / wound` NOW CARRIES A `Degree`-KEYED `writes` (invariant 12, #358 §C.4 / F6).
#    Done, in this file. It is the only row declaring `contests:`, so it is the only row affected.
#    The BANDS are `assumption` and swept at H-98; the SHAPE is ruled.
#
# 3. INVARIANT 4 IS WIDENED to every failable clause, not only a `requires`.
#    `kill / wound` gained `kill.refused` (a seam can return a typed Refusal at the depth cap).
#    ⚠ STILL OPEN: eligibility itself can decline -- `destroy_record` declines on BOTH its
#    alternatives (H-75) and can never fire -- and no row declares an eligibility-refusal kind.
#    The live fold emits `act.ineligible` and `act.refused` as BODY LITERALS, which invariant 7's
#    derived kind roster refuses at `append` and which ID-12 refuses outright. Owner: this table.
#
# WHAT #358 rev.2 DOES NOT CHANGE HERE, checked rather than assumed: all 32 `writes:` entries
# resolve to `write_matrix.yaml` rows; all eligibility kinds are in the four-member roster and none
# is `capability`; all 24 verbs carrying a `requires` carry a non-empty `emits_on_refusal`.
# ⚠ THE LAST FIGURE IS 2026-09-03's AND ED-FI-0009 MOVED IT. The six investigation acts each carry
# a real `requires` and a `finding.none` refusal. MEASURED off the loaded table: **28** rows carry a
# `requires` that is not the em-dash, and **none of them lacks an `emits_on_refusal`** — the
# invariant this line asserts still holds, at a larger denominator. ⚠ THE FIRST WRITING OF THIS
# NOTE SAID 30, WHICH WAS 24 + 6 DONE IN MY HEAD RATHER THAN READ OFF THE TABLE; the old 24 and the
# new 28 do not differ by six, so the earlier figure counted something differently and is left as
# the dated statement it is rather than reconciled here.
# =============================================================================================

verbs:
  - verb:        "carry"
    stratum:     "social"
    eligibility: ["own"]
    requires:    "a Petition exists; costs budget like any act"
    requires_typed:
      form:      existence
      of:        subject
      kind:      Petition
    requires_typed_note: "§E3 `:415` — *a Petition exists; **costs budget like any act***. The second half is not a precondition; §26.3's budget is spent by every act and is charged in `pack_scenes`. ⚠ THE SCOPING IS A CHOICE AND IS DECLARED: the prose is INDEFINITE (*a* Petition) and this reads it as *the petition being carried*, which is the act's `subject`. The alternative — any Petition anywhere in the world — would admit a `carry` of a petition that does not exist, and `carry` writes `(DocketItem, matter)`, i.e. it carries a PARTICULAR one. Under-refusing is the failure `G4` weighs equally with an invention, so the tighter reading is taken and named."
    writes:      ["DocketItem.matter"]
    emits:       ["petition.carried"]
    emits_on_refusal: ["carry.refused"]
    grade:       "ruled"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"

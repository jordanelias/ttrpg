    requires_typed_note: "W3's own cell — *both sides' stores cover their side of the exchange*. §F.24a form 2 TWICE, one clause per side, and the SECOND side cannot be written: it needs the counterparty's matter kind and quantity, and `rosters.yaml: requires_operands` is closed with no names for them. ⚠ TYPING ONE SIDE ONLY IS THE `_req_confer` DEFECT — a dropped conjunct is an over-admission, and `G4` weighs it equally with an invention. Stays on REQUIRES_PREDICATES with no predicate, so the fold refuses."
    requires_decline_note: "PLAN POSITION IN-41 (`SM-11`): nothing evaluates this precondition. The cell is untyped for the reason `requires_typed_note:` gives -- the second side's matter kind and quantity have no names in the closed `requires_operands` (`H-94`), and typing one side is the `_req_confer` defect -- and no `REQUIRES_PREDICATES` entry exists, for the same reason. The verb is out of the game on this gate as well as on its missing effect (`effect_decline_note:`)."

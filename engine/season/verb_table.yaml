    # `fight`'s bands and cells, plus `Tenure.since` WHERE A YIELDER CAN STAND: a yielder is not felled, so he reads
    # `Untouched` or `Wounded` off his own tracker (`modules/combat/fight.py::_surrender`: the yield rides the result,
    # not the band). `Tenure.since` is declared in both so a clean yield (`Untouched`) runs the effect, which is what

    referent_class_note: "v10 REM-22 (B10-05, AM-A-07; M19 taken, [ASSUMPTION; medium; Jordan to correct]): FORMED ONLY ON A `Site`-CLASSED REFERENT -- the plain referent of the question he answers that is a Site (`queries/world_q.py::own_referents_of_class`, REM-21's term, stamps it through `_stamped`; `decision/options.py::opening_set` then forms on the classed ids alone, IN-53 D1's partition), so `site`, `subject` and `to` bind a Site and never a person, a Record or a rung. THE CLASS REMOVES WRONG-KIND FORMATIONS ONLY: this row's cell, its eligibility and who is present at the site are unchanged, and it claims no execution. MEASURED before the class (`c88905e7`, `aperture 1 s`, realm arm, s = 0/1/2): formed for 83 of 83 persons, attempted 6/21/15, executed 0/0/0, every one refused `restore.refused` on the last read `exists:Site=0` (6/21/15); those formations stop, and the refusal Events they emitted stop with them, with the WITNESS deposits those carried (AM-A-07). READ AFTER (same instrument): attempted 0/0/0 -- no question the realm delivers carries a Site among its referents, so the row forms nowhere there and moves from attempted-and-always-refused to never attempted (sideways, declared, not progress; R-05 is not claimed to move). A person present at a worn Site executes it through the real fold (`tests/test_referent_class_stamps.py`). REVERT: delete this column."

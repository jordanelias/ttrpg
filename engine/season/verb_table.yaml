  - verb:        "levy"
    scale:   "settlement"
    scale_note: "a levy moves a Rung's stores -- the rung IS the subject"
    stratum:     "uncontested_material"
    eligibility: ["remit:issue", "presence:<rung>"]
    beneficiary: "actor"
    beneficiary_note: "UNCHANGED BY PLAN POSITION `19`, AND STATED BECAUSE THE EFFECT NOW SAYS WHERE THE MATTER GOES: into the SEAT'S treasury (the rung of `Act.via`), not the actor's hearth. `revoke`/`dispatch` read *taken for the remit* as `none`; this row declared `actor` before `19` and the column's semantics are `CAT-2`'s, not this position's to re-rule."

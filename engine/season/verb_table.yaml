  # ===========================================================================================
  # THE SIX INVESTIGATION ACTS, AS SIX ROWS. Jordan, 2026-09-10: *"'the six investigation acts'
  # is a massive issue: that is not a verb"*, and *"you must ensure you build the six from
  # investigation systems"*.
  #
  # WHAT THEY REPLACE. One row spelled `"the six investigation acts"`, `requires: "per act"`,
  # `requires_typed: none`, `grade: assumption`. It named no act, so nothing could form one; the
  # corpus prints its blocker verbatim -- `engine/season/runs/CASELOG_NPC.md:64`:
  # *"'the six investigation acts' is on the table and the fold cannot execute it: needs a
  # `requires:` predicate"*. THE SIX ARE NAMED IN CANON, not coined here:
  # `systems/fieldwork/reference/investigation_systems_v30.md:217` -- *Examine, Interview,
  # Research, Surveil, Thread-Read, Reconstruct. No new action vocabulary.*
  #
  # ⚠ THE SPLIT REMOVES THE ONLY REASON THE UNTYPED CELL WAS LAWFUL, WHICH IS WHY EACH ROW
  # CARRIES A TYPED ONE. `data/verbs.py:239-248` admits three reasons for `requires_typed: none`,
  # and the placeholder used reason (b), *a `per act` cell* -- the cell deferred to six acts the
  # table did not carry. Once the acts ARE rows there is nothing left to defer to, so five of the
  # six are typed here and the sixth carries reason (c), an operand the closed roster has no name
  # for. NOTHING IN THE GRAMMAR IS EXTENDED: every clause below uses an existing form
  # (`rosters.yaml: requires_forms`), an existing operand (`requires_operands`) and an existing
  # predicate stem (`data/requires.py: REQUIRES_STEMS`). No new form, no new operand, no new stem.
  #
  # ⚠ SUPERSEDED IN PART BY v9 FI-01 (`ED-FI-0009`, J-22 option (A)): `research`, `examine` and
  # `surveil` key `emits:` by degree, graded by the `graded_inquiries` route in `rosters.yaml` -- a
  # routing row, not a prize, so still no `contests:` here -- and `Failure` emits `finding.none`, which
  # WITNESS deposits nothing for (`undeposited_kinds`). `interview` (a prompt, K-36), `reconstruct`
  # (K-37) and `thread_read` (K-37, H-85) stay flat: not graded. What follows is the original record.
  # ⚠ AND `emits:` IS FLAT, NOT DEGREE-KEYED, WHICH IS THE HALF THIS COMMIT DOES NOT BUILD.
  # `fieldwork_v30.md:302-309` grades every one of these acts on four bands (Failure's false
  # lead, Partial's incomplete detail, Success's reliable one, Overwhelming's bonus revelation)
  # and NOTHING HERE CAN RESOLVE A BAND. `rosters.yaml:482` types investigation's seam
  # `UNRULED | UNRULED | UNRULED -- ITS OWN KIND, not a contest`, and `:487-491` rules what a
  # session may do about that: *"the blanks are Jordan questions, not session guesses: writing a
  # plausible IN/OUT for a mode nobody has ruled would be inventing the architecture rather than
  # recording it, and the seam is precisely the thing that must not be invented."* `:505-508`
  # closes the near escape: *"INVESTIGATION MUST NOT BE MADE A CONTEST TO BECOME GRADEABLE …
  # Giving them a prize so the existing machinery can grade them is scripting drift."* So these
  # rows declare no `contests:`, no obstacle column and no roll.
  # ⚠ **THE DEGREE IS WORK, NOT A RULING, AND ED-FI-0009 SAID OTHERWISE FOR ABOUT AN HOUR.**
  # `workplans/2026-09-06-season-loop-execution-plan.md:647` had already run this blank through
  # §0's five tests and closed it at test 3: *"NOT A SEAM. The loop IS the mechanism"*, attaching
  # RESOLVE → WITNESS, out *"Claims graded by degree; Failure emits `finding.none` and deposits
  # nothing"*, work item **4.5** — whose own acceptance line reads *"the six acts must stay six
  # acts, not become one"* (`:610`), which is this block. The refusal half is shipped here; the
  # producer is 4.5's. A degree-keyed `emits:` with nothing to key it on would raise
  # `Unspecified` at the first fold (`VerbRow.emits_at`), which is a hole wearing a mechanism.
  #
  # ⚠ ONE READING RUNS THROUGH ALL SIX AND IS STATED ONCE HERE. §F.24a's grammar has no
  # disjunction (`rosters.yaml: requires_forms` -- *"Disjunction is deliberately absent"*), so an
  # act whose canon cell names several kinds of object must bind ONE. The split used is canon's
  # own, from the reliability table at `fieldwork_v30.md:315-322`: Examine (physical) is tagged
  # `Verified` and Research (archival) `Documentary`, so the physical carrier is `Site` and the
  # documentary one is `Record`. Interview questions a person; Surveil watches a place. That is a
  # reading of two canon tables, not a transcription of one.
  #
  # ⚠ **AND THE GRADE COLUMN NOW SAYS SO. THE FIRST WRITING OF THIS BLOCK ENDED "and it is graded
  # as such below" AND THEN GRADED ALL SIX `ruled`** -- the same grade `tell` and `transfer` carry
  # for verbatim §E3 transcription. The column that separates canon from interpretation was the
  # one place the interpretation was not admitted, in the sentence that promised to admit it. The
  # five rows whose object class is this reading are `assumption`, which is what `succeed`,
  # `utter` and `forge` carry for an argued addition; `reconstruct` stays `ruled` because its cell
  # binds no object class -- `own_ledger` reads the actor's own ledger and nothing else.
  # ⚠ NOTHING VALIDATES `grade:` AT LOAD (`data/verbs.py` checks stratum, scale, eligibility and
  # writes, never grade), so this is reference under §0.05 and not mechanism. It is corrected
  # anyway, because the reading is load-bearing on a published RESULT: `examine`->`Site` is what
  # makes `examine` always-refused, which is then reported as a fact about the worlds.
  # ⚠ AND THE NARROWING IS ITSELF CONTESTABLE, WHICH THE GRADE NOW CARRIES RATHER THAN HIDES:
  # `:293` gives Examine *"physical evidence, architecture, documents, objects"*, and `Record` is
  # a live `World` collection -- binding `examine` to `Record` instead would have made it
  # EXECUTABLE. `Site` is chosen on `:317` vs `:319`'s Verified/Documentary split and on nothing
  # else, and choosing the binding that makes a verb refuse is the harder-to-flatter option, not
  # the easier one.
  # ===========================================================================================
  - verb:        "examine"
    stratum:     "contested_physical"
    stratum_note: "§27's strata are a RESOLUTION-ORDER band over what an act touches, and they are not the `contests:` column -- these six declare no prize (see the block comment). The placeholder filed all six under `contested_physical` and this splits them three ways on what each act TOUCHES -- the physical world, a conversation, or the actor's own held evidence. ⚠ THE FIRST WRITING OF THIS NOTE CITED `fieldwork_v30.md:353-355` AS THE WARRANT AND THAT LINE DOES NOT LICENSE IT: `:355` reads -- *EACH investigation action faces: base Ob (from Depth) + Concealment Ob* -- so canon makes ALL SIX contestable and conditions concealment on the concealer being PRESENT IN THE SCENE, not on the act being physical. The split may still be right for resolution ORDER, which is all a stratum decides; it is not derived from that line, and it is graded with the row."

    writes_provision_note: "v9 IN-52 (the levy-to-field feed, [ASSUMPTION LF-3, delegated-ruled]): `Won` and `Lost` gain `Rung.stores` ONCE PER SIDE, `requisition`'s ×2 shape -- a fought field eats its ration from the attacker's treasury (the rung of `Act.via`'s office) and the defender's (the nearest held rung at or above the target), `settlements.provision`'s `consumed`, debited by `_eff_march` last, after the casualties and the arrival. Both pairs are check-only (the effect runs once, on `Person.body`). `Unopposed` fights no field and eats nothing. While `field_provisioning` is off (shipped) the entry consumes nothing and no store moves; the pairs are still gated, as every declared pair is. Revert: delete both pairs from both bands."
    writes_note: "v9 IN-13 (#453 §10.4 step 8, THE ARRIVAL): `Won` and `Unopposed` add `move`'s three pairs -- every claimant's live `contain` closes (`Tenure.until`), one opens to the destination (`Tenure.since`), and the destination is appended to his `Person.travel_leg` -- through `move`'s one journey body (`loop/effects_migration.py::_relocate`, keyed on the mover), at ENCOUNTER (`write_matrix.yaml`'s three `ENC` cells, M4's precedent). The gate admits the marcher's own legs as `T-m` and every other claimant's under `muster` (`state/gate.py::may_muster`: the seat granted `dispatch`, the claimant committed to its faction). `Lost` is unchanged -- a routed army stays at its origin (#453 R-7, [ASSUMPTION; medium; Jordan to correct]). No `hold` is written on any band: a won field moves presence, never title (#453 R-6, β)."
    writes_grade_note: "M4 (`ED-IN-0279` clause (a)), Jordan's ruling on the second open clause: a loss writes \"casualties only, decrease in morale, and a grudge token\" -- nothing else, and nothing on the WINNING side. `Won`/`Lost` here are the ATTACKER's own outcome (`seam/ladder.py::field_degree`), so `_eff_march` reads which SIDE actually lost from `resolution.result`'s `parties` and writes there -- the defenders on `Won`, the attacker's own claimants on `Lost` -- never the winner, on either band. `Declared` writes nothing: it is RESOLVE's own deferral fold (`loop/resolve.py::_contest`). ⚠ SINCE v9 IN-13 an unopposed march, which has no losing side to write on, writes the ARRIVAL (`writes_note`), as `Won` does beside its casualties. v9 IN-52: the ration debit on `Won`/`Lost` (`writes_provision_note`) is not a loss effect: both sides of a fought field eat (LF-2/LF-3, delegated-ruled, `_part5` section J.2), and the sentence above, nothing on the WINNING side, governs casualties, morale and the grudge token."

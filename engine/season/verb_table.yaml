  - verb:        "give"
    stratum:     "social"
    eligibility: ["own", "hold:<record>"]
    beneficiary: "to"
    brute:       "own"
    brute_note:  "he holds it and the receiver is present (`requires`)"
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    beneficiary_note: "THE RECEIVER, who a gift is for -- the `to` operand, which this row's typed cell BINDS (the loader refuses `beneficiary: to` on a cell that binds none). `subject` is the Record."
    requires:    "the actor holds the subject, and the receiver is present where the actor is"
    requires_typed:
      all:
        - form:      relation
          of:        subject
          relation:  held_by
        - form:      relation
          of:        to
          relation:  with
    requires_typed_note: "v9 IN-12 (`give` + Rung, #453 §9.6): THE CELL HAS NO `existence` CONJUNCT; THE OBJECT'S KIND IS THE EFFECT'S, `seize`'s precedent (v9 IN-13): the typed grammar has no disjunction, and `existence` of `subject` kind `Record` refused every Rung, so *a Record or a Rung* cannot be spelt. The cell keeps the conjuncts that carry the licence (`held_by`, `with`); `_eff_give` declines a subject that is neither a Record nor a Rung (`give.refused`, the `write` clause), and the gate's `handover` still admits only a non-seat `hold`, so a seat handed over is `NotYours`. THAT LOOSENS FORMATION (#453 §9.6 says so): the cell no longer filters on what the subject IS, so the person-side reading of the `held_by` conjunct (`OwnStateReader`, B10.59; formerly `rosters.yaml: own_hold_declines`, deleted at B10.61) is what keeps a person from forming a gift of a referent he does not hold. [ASSUMPTION; medium; Jordan to correct; revert: restore the `existence` conjunct (`kind: Record`); the Rung half is then unformable.] The typed cell (plan position `14`, U7-own) is what makes a gift formable, in place of `loop/predicates.py::_req_give`. TWO CONJUNCTS, each on an existing form and stem: `relation` of `subject`, `held_by` (the actor holds it -- `succeed`'s and `found`'s cell; `hold_force`'s raise on two live holders is not asked here because the gate's `handover` makes two unreachable); `relation` of `to`, `with` (the receiver stands where the actor does, UNKNOWN for a receiver who is no person, so *a person* rides here too; `with` is the telling workplan's `T4` stem, `data/requires.py: REQUIRES_STEMS`, `relation` of `to` -- `tell`'s `hearer`). *A person other than the actor* is `ED-IN-0210` ruling 1's second party and is the FOLD's (`loop/resolve.py::_admits`, the `counterparty` clause), not this cell's: the grammar has no negation. THE CELL BINDS `to` BESIDE `subject`, so `TypedRequires.known_person_operands` names `to` and `decision/options.py::operand_bags` forms one Candidate per person the giver KNOWS (`known_persons`, `tell`'s primitive) -- the topic is the referent (the Record) and the receiver is somebody known, never the referent. `with` is WORLD-ONLY, so a giver forms the Candidate on whom he knows and the fold refuses an absent receiver."
    counterparty: to
    counterparty_note: "THE RECEIVER. The typed cell binds `to`, so every Candidate carries it (from `operand_bags`' known persons) and `opening_set` declines only a gift to oneself, as it does a petition; the FOLD refuses the same case for a hand-built act (`_admits`' `counterparty` clause)."
    writes:      ["Tenure.until", "Tenure.since"]

    referent_class: Disputant
    referent_class_note: "B11 lane A (the duel chain's reach; REM-28's precedent, which classed `convene`): FORMED ONLY ON A `Disputant`-CLASSED REFERENT -- a man beside the challenger whom the challenger holds a dispute with (`queries/world_q.py::disputes_held`, over `person_q.holds_dispute`, the one owner the cell's `dispute` stem reads; stamped by `questions_for`). The grievance is the occasion, `Detainee`'s and `Enemy`'s shape: the question a man answers almost never names the man he holds the wrong against. The cell's three conjuncts stay for a hand-built act. [ASSUMPTION; medium; Jordan to correct; revert: `referent_class: Person` and `challenge: [dispute]` in `violence_contexts`.]"

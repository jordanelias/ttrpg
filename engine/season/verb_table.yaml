    counterparty: subject
    counterparty_note: "THE CAPTIVE IS THE SECOND SIDE, `arrest`'s shape (`counterparty: subject`): the contest's opponent, and a man does not capture himself (the fold's `counterparty` clause refuses a hand-built self-capture; `opening_set` forms none)."
    contests: "the body"

      all:
        - form:      contain_path
          of:        actor
          to:        to
          conjunct:  path
        - form:      relation
          of:        to
          relation:  audience
          conjunct:  audience
    requires_typed_note: "⚠ v9 IN-59 (b) (RS-26, the AUDIENCE half of the access gate) ADDED `move`'s second conjunct here too, `relation` of `to`, `audience` -- otherwise a settler walks past the guard a traveller is stopped by. NAMED `audience` because the row keys its refusals, and keyed to `travel.blocked`: a guarded door refusing him is the journey failing, the fact `path` already emits; `audience` is WORLD-ONLY, so no witness deposits it as a belief about the road. [ASSUMPTION; medium; Jordan to correct; revert: the single `path` cell.] `move`'s cell, clause for clause and for `move`'s reasons (§E3 `:408`, *a `contain` path exists*): the journey is the same journey, so a person who believes there is no road (`contain.path:<to>` False, deposited off a `travel.blocked`) forms neither a `move` nor a `migrate` there, through the one reader (`belief_contradicts`). NAMED `path` because the row keys its refusals. The destination's ROOM is not a cell: the grammar compares one entity's scalar against an operand or a second read on the SAME entity, and room is the destination's capacity against its residents PLUS the migrant's own weight, minus himself if he already lives under it -- so it is the effect's decline, on `_eff_found`'s precedent for what the grammar cannot spell. So is a destination the ladder will not seat him in, and one he already lives in."
    writes:      ["Person.travel_leg", "Tenure.until", "Tenure.since"]
    writes_note: "`move`'s three pairs, because the journey is `move`'s (`loop/effects.py::_relocate`, one body for both verbs): the leg (ended at the next MATTER), the old `contain` closed and the new opened. The `reside` edges ride the same two Tenure pairs -- the old residence's `until`, the new one's `since` -- which is why no pair is added. No `write_matrix.yaml` row is added: a Tenure's `since`/`until` rows are kind-agnostic, and the gate's F3 judges each edge (all four are the migrant's own, `T-m`)."
    emits:       ["residence.changed"]
    emits_on_refusal:
      path:     ["travel.blocked"]
      audience: ["travel.blocked"]
      write:    ["migrate.refused"]
    refusal_note: "KEYED PER CLAUSE (`04 §B.13` invariant 4's per-conjunct half, plan position `19`'s shape). `path` is the journey failing, and it emits `move`'s own `travel.blocked` because it IS the same fact -- *there is no road from here to there* -- so a witness of either verb learns the same thing. `write` is the destination refusing the settler: the ladder will not seat him there, he already lives there, he is in custody (a live `detain`, v9 SC-03a: `_decline_custody`), or -- RR-2's throttle -- it is AT CAPACITY, a newcomer whose weight would take `world_q.population` past `world_q.capacity`. `audience` (v9 IN-59 (b)) is the mover's standing at a guarded destination, and emits `travel.blocked` too: it is the same fact as `move`'s refusal of an unadmitted entrant. ELIGIBILITY is `own`, which cannot decline, so it keys nothing."
    grade:       "assumption"
    grade_note:  "the VERB is RR-2's (ruled: *a verb persons take*); its row -- the cell, the writes, the kinds, the throttle's place -- is plan position `19c`'s, argued at `_eff_migrate`, graded as `found`'s and `build`'s are. Its `alignment` cells arrived with IN-08's cells commit, graded `reasoned` (`rosters.yaml: tables.alignment`)."
    source:      "plan `workplans/2026-09-18-governance-settlement-behaviour-plan_part2.md` 19c (MIGRATE, carrying 24d-ii); `proposals/2026-09-17-governance-and-behaviour/RULINGS.yaml` RR-2; `01_THE_BUILD_ORDER.md` S9"

  - verb:        "exchange"
    scale:   "settlement"
    scale_note: "as `requisition` -- it writes `Rung.stores`"
    stratum:     "uncontested_material"
    eligibility: ["own"]
    beneficiary: "none"
    beneficiary_note: "the counterparty is the other beneficiary and is exactly what `exchange` cannot carry -- left untyped, unlike `comply` since v9 IN-09, for want of operand names for the other side of a trade (the return's kind and amount): IN-33 coined two and was reverted at 0 executions (H-58)."
    requires:    "both sides' stores cover their side of the exchange"

    eligibility_substitution_note: "The source cell named `remit:requisition`, and `requisition` IS NOT IN `remit_acts` (issue · determine · confer · revoke · dispatch · convene, a CLOSED roster). `remit:issue` is substituted, declared here: an instrument may fill exactly what the register declares (§42.2/G.4.8), so either `requisition` joins the roster (a ruling: it is a SEVENTH remit act) or `issue` is genuinely the remit a requisition exercises (defensible -- a requisition is issued). The same substitution is live on `establish`, which uses `remit:confer` and is likewise not a remit act. The substitution EXECUTES (a holder granted `issue` can requisition), and the open eligibility question (plan position `19`: *'stays an open eligibility question this position inherits (a neighbour of `H-52`)'*) is carried by `H-52`'s row."

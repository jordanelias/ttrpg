  - verb:        "examine"
    stratum:     "contested_physical"
    stratum_note: "§27's strata are a RESOLUTION-ORDER band over what an act touches, and they are not the `contests:` column -- these six declare no prize (see the block comment). The placeholder filed all six under `contested_physical` and this splits them three ways on what each act TOUCHES -- the physical world, a conversation, or the actor's own held evidence. ⚠ THE FIRST WRITING OF THIS NOTE CITED `fieldwork_v30.md:353-355` AS THE WARRANT AND THAT LINE DOES NOT LICENSE IT: `:355` reads -- *EACH investigation action faces: base Ob (from Depth) + Concealment Ob* -- so canon makes ALL SIX contestable and conditions concealment on the concealer being PRESENT IN THE SCENE, not on the act being physical. The split may still be right for resolution ORDER, which is all a stratum decides; it is not derived from that line, and it is graded with the row."
    eligibility: ["own", "presence:<site>"]
    beneficiary: "actor"
    beneficiary_note: "the six investigation verbs (`examine`, `interview`, `research`, `surveil`, `thread_read`, `reconstruct`) all write `[]` and emit `finding.made`: a finding is a Claim minted at WITNESS into THE ACTOR'S OWN LEDGER, which is the carrier the good lands on. `tell` is the one that points the other way -- it deposits with the person told, so its beneficiary is `subject`."

      already had. [TRUE OF `U1`, BEFORE v9 IN-18 `G6`: G6 added a third kind, `confidence.broken`,
      on the three telling bands -- see `emits_note` above. The U1 column itself still adds none.] Do NOT cite loader invariant 7 as what admits them: `04 §F.20b:1084` records

    eligibility_substitution_note: "⚠ DECLARED 2026-09-03 rather than left silent. The source cell named `remit:requisition`, and `requisition` IS NOT IN `remit_acts` (issue · determine · confer · revoke · dispatch · convene, a CLOSED roster). W3 substituted `remit:issue` and wrote no note, which is an off-register fill under §42.2/G.4.8 — an instrument may fill exactly what the register declares. Either `requisition` joins the roster (a ruling: it is a SEVENTH remit act) or `issue` is genuinely the remit a requisition exercises (defensible — a requisition is issued). Injected as `issue`, declared here, swept at the site. The same substitution is live on `establish`, which uses `remit:confer` and is likewise not a remit act. ⚠ PLAN POSITION `19` INHERITS IT AND DOES NOT DECIDE IT (the plan's own `19` entry: *'stays an open eligibility question this position inherits (a neighbour of `H-52`)'*). What `19` changes is that the substitution now EXECUTES -- a holder granted `issue` can requisition -- so the open question has live consequences it did not have while no requisition could run; `H-52`'s row carries the pair."

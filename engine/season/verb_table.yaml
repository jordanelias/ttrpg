      kind:      Proposition
    requires_typed_note: "§E3 `:426` — *the Proposition exists (immutable, §14)*. Definite article: the one the act commits to, which is the act's `subject`. §14 makes a Proposition immutable and `utter` is the only verb that creates one, so this is the clause that makes `utter` a precondition of the social layer rather than a formality."
    writes:      ["Tenure.since"]
    emits:       ["commitment.made"]
    emits_on_refusal: ["commitment.refused"]
    grade:       "ruled"
    refusal_note: "W3: added. §E2 -- 'failure emits, never raises'. This verb has a `requires` and had no refusal channel, so a failed precondition produced no Event, no witness and no arc. Refusal condition: the Proposition does not exist (§14 -- it is immutable and must be uttered first)"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"

  # makes `examine` always-refused, which is then reported as a fact about the worlds.
  # ⚠ AND THE NARROWING IS ITSELF CONTESTABLE, WHICH THE GRADE NOW CARRIES RATHER THAN HIDES:
  # `:293` gives Examine *"physical evidence, architecture, documents, objects"*, and `Record` is
  # a live `World` collection -- binding `examine` to `Record` instead would have made it
  # EXECUTABLE. `Site` is chosen on `:317` vs `:319`'s Verified/Documentary split and on nothing

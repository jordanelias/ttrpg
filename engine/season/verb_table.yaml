    counterparty_note: "TELLING WORKPLAN `T4` (`ED-IN-0282`): THE HEARER IS THE SECOND SIDE, AND THE TOPIC IS NOT. `subject` stays what the telling is ABOUT and `to` is whom it is told to; the contest's opponent is `to` (`loop/resolve.py::_contest` reads `row.counterparty or \"subject\"`), so `sigma` throws the teller's pool against the HEARER's standing and not against a rung or a person merely talked about. `to` comes from `decision/options.py::operand_bags` -- one Candidate per person the teller KNOWS (`queries/person_q.py::known_persons`, `rosters.yaml: known_person_operands`) -- and never from the question's referent. `opening_set` forms none whose `to` is the teller (`petition`'s rule); a telling ABOUT oneself to somebody else IS formed, because a row naming its counterparty is not caught by the contested-verb self-subject skip (Decision 3). ⚠ NO `addressed` CHANNEL: an emitter names no recipient (§19.3, T-e). The addressee hears by PRESENCE, through `co_located`, like every bystander -- the `hearer` conjunct only refuses a telling to someone who is not there."
    requires_typed_note: "TELLING WORKPLAN `T4` (`ED-IN-0282`): TWO NAMED CONJUNCTS. `holds` -- the cell below, unchanged in what it asks. `hearer` -- `relation` (form 5) on the new `with` stem (`data/requires.py: REQUIRES_STEMS`): the person told and the teller share a place (`world_q.place_of`); UNKNOWN if either is no person or has no place, and ALWAYS UNKNOWN person-side (`WORLD_ONLY_STEMS`), so the teller forms the Candidate on whom they know and the fold refuses an absent hearer with `tell.refused` keyed `hearer` (`news.untold` before CP-T05-03; it is now the lost telling's kind alone). `holds` being NAMED is also what `opening_set` reads to carry `said` and to decline a Candidate with nothing to say (`TypedRequires.named_own_ledger_operands`); `survey` and `reconstruct` share the form unnamed and carry nothing. ⚠ THE CELL'S FIRST CONJUNCT, AS IT WAS: §E3 `:417` — *the teller holds a claim on the subject*. §F.24a form 6's first named cell, and the one the `F8` carve-out was written for. This is `_req_tell` verbatim: `any(c.subject == subj for c in teller.ledger)`, with the ledger reached through a reader that can name no other person's. `any(c.subject == subj ...)` is UNTYPED on predicate, so a `seen` claim satisfies it exactly as a `condition.worn` or `stores:grain` claim does (`R8.1`): `seen` gives the teller more subjects to hold a claim on, and the same ambient claim reaching the RECIPIENT means more of what is told is already held firsthand and the dedup guard drops it."
    contests:    "a standing"
    writes:
      Overwhelming: []
      Success:      []
      Partial:      []
      Failure:      []
    emits:
      Overwhelming: ["news.told", "confidence.broken"]
      Success:      ["news.told", "confidence.broken"]
      Partial:      ["news.told", "confidence.broken"]
      Failure:      ["news.untold"]
    emits_note: "v9 IN-18 `G6` (`H-197`, confidences): `confidence.broken` is DECLARED on every band that tells and EMITTED only when the act breaks a circle -- the teller holds the said claim under a `Claim.visibility` circle (a confided telling's deposit, `loop/witness.py::_circle_of`) and the addressee `to` is outside it (`loop/resolve.py::_confidence_broken`, the fold's one act-earned kind; `tell` writes nothing, so no effect earns it). Not on `Failure`: a telling the hearer did not take in told nothing. It adds no refusal route. At the shipped `telling_privacy` 0 no circle exists and the kind is never emitted."
    contests_note: >-
      The prize is `a standing`, which is already rostered: loader invariant 9 (`04:467`) requires a
      verb's prize to be in the subsystem roster, and inventing a prize to dodge a ruling was considered
      and refused (`U1` / R-09, ED-SC-0037). `tell.refused` is the one kind on `emits_on_refusal:`, and
      `news.untold` stays on `emits:` at `Failure` ONLY (CP-T05-03, AM-D-04), so a lost telling is a
      realised act (the loop drops it until the next season, as `argument.lost` drops a lost `argue`) and
      a refused one -- the hearer is absent, nothing is held, the counterparty is no person -- is not,
      and re-forms next round. `04 §F.20b:1084` records that the derived Event-kind roster is SPECIFIED
      AND UNBUILT, so loader invariant 7 is not what admits the kinds.
      `writes:` IS `[]` AT EVERY BAND AND THAT IS LAWFUL RATHER THAN A HOLE. `04 §C.4:630-634` rules that
      a `Failure: []` is the only place in this architecture where writing nothing is correct, because
      the act still EMITS -- the difference between a refusal, where the precondition failed and no
      contest occurred, and a loss, where the contest occurred and went against you. A telling deposits
      at WITNESS, not here.
      There is NO `Person.stance` WRITE (TELLING WORKPLAN `T4`, `ED-IN-0282`): (1) the opponent is `to`,
      not `subject` -- the contest is thrown against the HEARER (`counterparty: to`, read by
      `loop/resolve.py::_contest`), so `subject` is the TOPIC and was never the party a standing is won
      from; (2) what a telling leaves is a chain, not a write: the hearer's told claim carries `chain =
      said.chain + (teller,)` (`T3b`), and how far a hearer credits the teller is read off that chain
      when the claim is weighed (`T3a`'s `teller_weight`), never stored as a stance. So `claim_subjects`'
      (`H-79`) empty-changes fallback lands the claim on what was told, `test_n3_..._a_telling_is_about_what_was_told`
      holds, `H-62`'s producer gap for `(Person, stance)` stays closed by `march` (M4), and the judged
      half of regard is the gated `G1`.
      A telling with nothing to say is not formed (T1's deferred decline, taken at T4): `opening_set`
      declines a `tell` Candidate whose `said_of` is `None`, because the `holds` conjunct is NAMED;
      `survey`/`reconstruct` share the form unnamed and are not declined.
    emits_on_refusal:
      holds:  ["tell.refused"]
      hearer: ["tell.refused"]
      counterparty: ["tell.refused"]
    grade:       "ruled"
    writes_note: "— (deposits at WITNESS, not here)"
    refusal_note: "§E2 -- 'failure emits, never raises': a verb with a `requires` needs a refusal channel, or a failed precondition produces no Event, no witness and no arc. Refusal condition: the teller holds no claim on the subject. ⚠ KEYED AT `T4` (`issue`'s precedent, `data/verbs.py` invariant 4's per-conjunct half): `holds` -- nothing held about the subject; `hearer` -- the person told is not with the teller. ONE KIND FOR BOTH (`tell.refused` since CP-T05-03, which split it from the lost telling's `news.untold`: a refusal is not a realised act and re-forms next round, a loss is and does not), so the seam's party-gap refusal, which emits the row's union, still emits exactly the kind each conjunct does; that single-kind union is what the loader requires of a CONTESTED keyed row. ⚠ PLAN POSITION `14`: `counterparty` -- a telling to nobody, or to the teller -- is the fold's own clause (`loop/resolve.py::_admits`), keyed to the row's one kind."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  # ===========================================================================================
  # THE SIX INVESTIGATION ACTS, AS SIX ROWS. Jordan, 2026-09-10: *"'the six investigation acts'
  # is a massive issue: that is not a verb"*, and *"you must ensure you build the six from
  # investigation systems"*. THE SIX ARE NAMED IN CANON, not coined here:
  # `systems/fieldwork/reference/investigation_systems_v30.md:217` -- *Examine, Interview,
  # Research, Surveil, Thread-Read, Reconstruct. No new action vocabulary.*
  #
  # Five of the six are typed and the sixth carries reason (c) of `data/verbs.py:239-248`, an
  # operand the closed roster has no name for. NOTHING IN THE GRAMMAR IS EXTENDED: every clause below
  # uses an existing form (`rosters.yaml: requires_forms`), an existing operand (`requires_operands`)
  # and an existing predicate stem (`data/requires.py: REQUIRES_STEMS`).
  #
  # `research`, `examine` and `surveil` key `emits:` by degree (v9 FI-01, `ED-FI-0009`, J-22 option
  # (A)), graded by the `graded_tasks` route in `rosters.yaml` -- a routing row, not a prize, so
  # no `contests:` here -- and `Failure` emits `finding.none`, which WITNESS deposits nothing for
  # (`undeposited_kinds`). `interview` (a prompt, K-36), `reconstruct` (K-37) and `thread_read`
  # (K-37, H-85) are routed from B07.01, armed by `task_draw_arm` (arm `off`: flat). `fieldwork_v30.md:302-309` grades every one of these acts on
  # four bands (Failure's false lead, Partial's incomplete detail, Success's reliable one,
  # Overwhelming's bonus revelation); `rosters.yaml:482` types investigation's seam
  # `UNRULED | UNRULED | UNRULED -- ITS OWN KIND, not a contest`, and `:505-508` closes the near escape:
  # *"INVESTIGATION MUST NOT BE MADE A CONTEST TO BECOME GRADEABLE … Giving them a prize so the
  # existing machinery can grade them is scripting drift."* So these rows declare no `contests:`, no
  # obstacle column and no roll. THE DEGREE IS WORK, NOT A RULING:
  # `workplans/2026-09-06-season-loop-execution-plan.md:647` ran the blank through §0's five tests and
  # closed it at test 3 (*"NOT A SEAM. The loop IS the mechanism"*), work item **4.5**, whose acceptance
  # line reads *"the six acts must stay six acts, not become one"* (`:610`). A degree-keyed `emits:`
  # with nothing to key it on would raise `Unspecified` at the first fold (`VerbRow.emits_at`).
  #
  # ONE READING RUNS THROUGH ALL SIX. §F.24a's grammar has no disjunction (`rosters.yaml:
  # requires_forms` -- *"Disjunction is deliberately absent"*), so an act whose canon cell names
  # several kinds of object must bind ONE. The split used is canon's own, from the reliability table
  # at `fieldwork_v30.md:315-322`: Examine (physical) is tagged `Verified` and Research (archival)
  # `Documentary`, so the physical carrier is `Site` and the documentary one is `Record`. Interview
  # questions a person; Surveil watches a place. That is a reading of two canon tables, not a
  # transcription of one.
  #
  # GRADE: the five rows whose object class is this reading are `assumption`, as `succeed`, `utter`
  # and `forge` are for an argued addition; `reconstruct` stays `ruled` because its cell binds no
  # object class -- `own_ledger` reads the actor's own ledger and nothing else. NOTHING VALIDATES
  # `grade:` AT LOAD (`data/verbs.py` checks stratum, scale, eligibility and writes, never grade), so
  # this is reference under §0.05 and not mechanism; it is stated because the reading is load-bearing
  # on a published RESULT: `examine`->`Site` is what makes `examine` always-refused.
  # THE NARROWING IS CONTESTABLE, WHICH THE GRADE CARRIES RATHER THAN HIDES: `:293` gives Examine
  # *"physical evidence, architecture, documents, objects"*, and `Record` is a live `World`
  # collection -- binding `examine` to `Record` would have made it EXECUTABLE. `Site` is chosen on
  # `:317` vs `:319`'s Verified/Documentary split and on nothing else, and choosing the binding that
  # makes a verb refuse is the harder-to-flatter option, not the easier one.
  # ===========================================================================================

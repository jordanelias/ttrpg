    requires:    "a live occasion at the actor's venue whose docket names the subject"
    requires_typed:
      form:      existence
      of:        subject
      kind:      DocketItem
    requires_typed_note: "v9 SC-01 step 12 (B-N). The proceedings design's own cell, one clause (`04_VERBS.md` §B.1: `form: existence, of: subject, kind: DocketItem`), and `determine`'s `docket` conjunct exactly: the matter is on a docket (`world_q.docketed`, the reader's `docket` branch). It is what stops `speak` being a way to chat: no docket item names the subject, no contest. THE VENUE HALF IS NOT TYPED, as `determine`'s date half is not: a docket item has no venue key, a dateless one (`carry`'s, and `open_case`'s where no slot is open) names no sitting at all, and a filled slot reaches a venue only through its `date`'s Date, which no operand of this cell reads -- so *at the actor's venue* has no operand to read. Unnamed and flat (`survey`'s precedent): one conjunct, one refusal kind."
    contests:    "a matter"
    contests_note: "v9 SC-01 step 12: `04_VERBS.md` §B.1's prize, *the proceeding is ONE act at the season scale*. `rosters.yaml: contest_subsystems.prizes` carries an `a matter` row routed to the social contest scene's `social_contest` provider (ED-SC-0033 clause (2)), so a docketed `speak` resolves there. The opponent is `subject` (the row names no `counterparty:`), so the docketed matter's party stands against the speaker when it is a person, and the provider's `opposed_ob(pool_default)` stands in when it is not (`modules/social_contest/roll.py::obstacle`, under `H-213`'s ceiling since step 14). v10 CP-T05-02 (iii): `subject_may_be_self` (below) waives `opening_set`'s contested-verb decline (*a person is not his own adversary*) for this row, so a docketed party speaks to his own matter in computed play; `seam/wrappers/sigma.py::contest_input` reads no opposition for a subject who is the actor, so the plea rolls at the row's difficulty plus `opposed_ob(pool_default)` under the room's terms."
    subject_may_be_self: true
    subject_may_be_self_note: "v10 CP-T05-02 (iii) (AM-D-02) [ASSUMPTION; medium; Jordan to correct; revert: remove the column]. THE ACCUSED ANSWERS: a person docketed, holding the docketing claim, forms `speak {subject: himself}` -- the self-plea. Waives `decision/options.py::opening_set`'s self-subject decline for this row alone (the loader admits the column only on a row contested against its subject, `VerbRow.opponent_operand() == 'subject'`). It is NOT `counterparty_may_be_self` (`confer`), which waives the counterparty operand's self-exclusion. A DECLARED MOVER of every world in which a docketed party is offered his own matter."
    writes:
      Overwhelming: []
      Success:      []
      Partial:      []
      Failure:      []
    writes_note: "⚠ EMPTY AT EVERY BAND, AND THE DESIGN'S ROW IS NOT, SO THIS IS A STOP, NOT A READING (v9 SC-01 step 12; the measurement is `hole_register.yaml` `H-63`'s step-12 clause). `04_VERBS.md` §B.1 writes `Person.stance` on `Overwhelming`/`Success`/`Failure` (the SPEAKER's own, (ix)) and `DocketItem.matter` on `Partial` (*the docket grows*, (vii)). NEITHER IS BUILT: (1) the stance write names no VALUE -- no referent, sign or weight (`H-63`: Part E names the cell, never the value; `march`'s `(faction, -1.0, w)` rows are a different act's); (2) `Partial`'s append has NO CARRIER the gate can receipt -- `World.docket` is a SEQUENCE with no `get()` (`state/gate.py`), and `Partial` writes nothing else to ride on -- and no operand names WHAT is docketed (*the speaker's operand*, `21_RECONCILIATION.md:576`). Building three bands' writes and not the fourth would make `Partial` the empty middle band §B.1 (vii) rejects, so all four write nothing, `tell`'s precedent (a contest whose product is a deposit at WITNESS), and `_eff_speak` does not exist (the plan builds it only for a non-empty `writes:`). Each band still leaves the room in a different place: what it emits is witnessed, so hearers hold which way the matter went. Revert: the row before SC-01 step 12 (above)."
    emits:
      Overwhelming: ["matter.carried"]
      Success:      ["matter.advanced"]
      Partial:      ["matter.held"]
      Failure:      ["matter.turned"]
    emits_note: "v9 SC-01 step 12: §B.1's emissions, one per band, keyed on the ladder's own four names (`degree_from_net`'s labels; the design's coined `Carried · Advanced · Held · Turned` keys would raise at the first fold). `Partial`'s second kind, `docket.formed`, is NOT declared: it reports the docket write the row does not make (`writes_note`), and declaring it would publish a docket that did not form (`ID-9`)."
    emits_on_refusal: ["speech.unheard"]
    refusal_note: "v9 SC-01 step 12: §B.1's refusal kind. FLAT, one kind for the one clause, which is also what the party-gap refusal of a contested row emits (`data/verbs.py`, invariant 4's contested half). Refusal conditions: no docket item names the subject; and, on a docketed matter, S27.4 (`Ob > 2 x Pool`): a speaker whose pool is under 1D is refused by the provider and the fold emits this kind rather than aborting the season (`loop/resolve.py::_contest`; `tests/test_sc01_speak.py::test_sc01_s12_a_speaker_under_one_die_is_refused_not_a_crash`)."
    grade:       "assumption"
    source:      "ARCHITECTURE_V2.md §E3, transcribed; typed cell, prize, bands and refusal at v9 SC-01 step 12 (`workplans/valoria_master_workplan_v9_part6.md` §SC-01), on `proposals/2026-09-05-proceedings-subsystem/04_VERBS.md` §B.1 (design intent) and `21_RECONCILIATION.md:576`"
  - verb:        "succeed"
    scale:   "person"
    scale_note: "succession is one person taking another's tenure; the office's rung does not change"
    stratum:     "binding_decision"
    eligibility: ["own"]
    beneficiary: "actor"
    brute:       "seat"
    brute_note:  "no live hold and the title its `successions` names (`requires`); rival claims are other men's acts"
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    beneficiary_note: "v10 IN-61: THE CLAIMANT -- he takes the seat; the seat (`subject`) is what he claims, and acts for nobody."
    referent_class: Office
    referent_class_note: "v10 IN-61 (RS-27, B10-09): FORMED ONLY ON AN `Office`-CLASSED REFERENT -- `confer`'s machinery (IN-53): the seats the question he answers carries as `Office`, which for the heir is the vacant throne he was told of (`queries/world_q.py::seats_named`, the death's or the release's `tenure.closed` claim naming the seat, CP-T02-01; executed by `engine/season/tests/test_in61_heir_hears_vacancy.py`). NARROWED person-side to the seats whose `successions` title he holds (`rosters.yaml: own_title_declines`), so nobody else told of a seat forms a claim on it."
    requires:    "the seat has no live hold, its conferral basis is opened by the claim (`FILLED_BY`), and the actor holds the title `successions` names for it"
    requires_typed: none
    requires_typed_note: "⚠ `none` FOR THE GRAMMAR'S REASON, `oblige`'s and `confer`'s route (v10 IN-61): a prose `requires:` read by the registered predicate `loop/predicates.py::_req_succeed`, which asks the write gate's own `state/gate.py::may_claim`. The closed grammar has no cell for the ABSENCE of a live `hold` on the subject (it has no negation), nor for a `successions` lookup from the subject to the title the actor must hold, so neither conjunct types."
    requires_note: "v10 IN-61 (RS-27; Jordan 2026-10-14: *'designated heir is not a verb but a status or title. the heir still has to claim their throne'*): RE-SPECIFIED AS THE HEIR'S CLAIM -- admitted iff the throne has no live `hold` and the actor holds `successions[throne]` (the heir's title, `off_heir`, itself filled by an ordinary `confer`). UNTYPED (`requires_typed_note`). The W3 cell it replaces (`relation` of `subject` `held_by` -- the actor holds the office whose heir he designates) is retired with the designation reading: a title is designated by `confer`, not by this verb. LIMITS: the route only awards a vacant seat; the first valid claim wins; one title deep; `off_duke_valorsmark` has no `successions` row yet (CP-T09-06, B10-17). The contested-succession arms and H-217's `succession` arrangement are CR-35's (B10-17). [ASSUMPTION; medium; Jordan to correct; revert: the W3 cell and the effect decline below.]"
    writes:      ["Tenure.until", "Tenure.since"]
    writes_note: "v10 IN-61: ONE ACT, ONE WRITE (`loop/effects_governance.py::_eff_succeed`): it opens the claimant's `hold` on EVERY vacant seat whose `successions` title is the one he claims by (`state/gate.py::claimable_seats`) -- `Tenure.since`, the write gate's claim basis -- and closes his `hold` on that title -- `Tenure.until`, `T-m`. The claim basis is licensed by that closure in the same write, so the two cannot be split. The opened `hold` is a literal `Tenure(..., \"hold\")`, so `data/verbs.py::_derive_openers_from_effects` lists `succeed` among `hold`'s openers and `world_q.endings_reached` credits a seat taken by claim. It writes no `succeed` Tenure: that kind (`rosters.yaml: tenure_kinds`) keeps no opener."
    emits:       ["succession.claimed", "tenure.closed"]
    emits_note:  "v10 IN-61: each earned per edge (`Subject.edge`): `succession.claimed` by each seat taken, `tenure.closed` by the title laid down. A `binding_decision` row's kinds are broadcast by `epistemic.py::_ch_chronicle`, and WITNESS expands each `hold` Tenure id to the seat it is on (keyed on the Tenure's kind, never the event's), so the realm hears who took the throne. ⚠ ITS OWN SUCCESS KIND, NOT `confer`'s `tenure.opened`,: `data/verbs.py::KIND_VERB` maps a kind to a verb only where ONE row emits it, so a second emitter of `tenure.opened` would zero the deed alignment of every `tenure.opened` claim in every ledger (`align_kind`). `tenure.closed` is already shared (seven rows), so the title's closure moves nothing."
    emits_on_refusal: ["succession.refused"]
    refusal_note: "one flat kind for the predicate's conjuncts: a held seat, a seat the claim does not open, a title he does not hold, or a seat with no `successions` row."
    grade:       "assumption"
    source:      "W3 -- `succeed`, a W3 addition (#353 `:371`, `:542`); RE-SPECIFIED by v10 IN-61 (`workplans/valoria_master_workplan_v10_part4.md` IN-61; RS-27, RS-29) as the heir's claim of a vacant seat by his title."
  # ===========================================================================================
  # PLAN POSITION `20-iii` -- THE INFORMATION CLUSTER (narrative #14 §F, `D1-a`). A person cannot
  # read a faction: a `View` holds his own claims, and `AX-2` puts world truth nowhere inside a
  # decision. Proposal 14 (`proposals/2026-09-12-emergent-narrative-primitives-v2/01_THE_TEN.md`)
  # makes the faction-scale picture DIEGETIC instead -- a document somebody had to make, dated by
  # when it was made, which can be wrong, burned or handed on -- and puts the price on MAKING it:
  # *"Free to read, costly to obtain, stale by construction."* `survey` is the act that pays.
  # ⚠ NAMED `survey`, THE ORDINARY WORD FOR *examine something whole and record what is there*, and
  # proposal 14's own verb (*"somebody had to survey the valley"*). NOT `surveil` -- covert
  # watching, one of the six investigation acts, the FI lane's (`ED-FI-0009`) -- and not `compile`,
  # which a reader of this repository meets first as the build step.
  # ===========================================================================================
  - verb:        "survey"
    difficulty:  "plain"
    difficulty_note: "B07.01 (18-A, The resolution, decided, 3): `plain`, 18-A's default where the owning verb lane has stated no level; read by the draw only (`task_draw_arm` `on`)."
    capability:  "inquiry"

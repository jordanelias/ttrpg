    writes_note: "CP-T03-09: `loop/effects_combat.py::_eff_capture` -- `_eff_kill`'s wounds for each party by his own band, and, when the scene's `surrender` names the SUBJECT as the one who yielded, ONE `detain` EDGE, captive -> THE SEAT THE ACT IS EXERCISED THROUGH (`Act.via`), opened where `may_warrant` and `_may_close_custody` both hold (`arrest`'s pair of tests, so an admitted act is never killed at the gate and a custody nothing could close is never opened). The captive stays in `w.persons`; a yield by the ACTOR opens nothing. The gate's `warrant` basis is unchanged."
    emits:

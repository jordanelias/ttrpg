    referent_class_note: "v10 REM-22 (B10-05, AM-A-07; M19 taken, [ASSUMPTION; medium; Jordan to correct]): FORMED ONLY ON A `Site`-CLASSED REFERENT, as `restore` (`queries/world_q.py::own_referents_of_class` stamps the question's own Site, `decision/options.py::opening_set` forms on it alone). THE CLASS REMOVES WRONG-KIND FORMATIONS ONLY and claims no execution. A `work` formed on a referent that is no Site is refused `work.unavailable` on `condition=UNKNOWN` (the threshold of such a referent reads UNKNOWN), and this row's cell asks no `existence`; no question the realm delivers carries a Site among its referents, so the class makes the row never attempted there (sideways). ED-IN-0297 IS UNTOUCHED: `work` still advances only a works (`loop/effects_economy.py`); a Site no works names stages nothing, and a `work` formed there reads `work.unavailable`. RESIDUE, RECORDED AND NOT FIXED: `work` on a `dwelling` or `garrison` Site still refuses `condition=UNKNOWN` (S12.1: those kinds ship no band floors, `loop/resolve.py::_admits`). REVERT: delete this column."
    requires:    "condition >= floor(verb) (§12.1)"
    requires_typed:
      form:      scalar_threshold
      of:        site
      scalar:    condition
      threshold_predicate: floor
      comparator: ">="
      conjunct:  floor
    requires_typed_note: "§E3 `:420` — *`condition >= floor(verb)`* (§12.1). THE THRESHOLD IS A DECLARED READING OF `floor(verb)` FOR A VERB THAT NAMES NO USE: `WorldReader.read`'s `floor` branch returns `min(floors.values())` and argues for doing so — *`work` is the GENERIC labour verb, so a site is workable if it clears the floor of its LEAST demanding use*; `max` refuses a seam surface-gleaning supports, and `UNKNOWN` destroys the gate outright, since `work`'s precondition could then never return False. `floor` reads **100** for `site_harbour` and **50** for `site_seam`, and a named workable site emits `site.worked` (`test_tracer_is_honest.py`). The objection the reading answers is real: `band_floors`' inner keys are SITE-USE verbs (bulk_shipping, fishing, deep_mining …), **NOT verb-table rows**, so `work` is not among them, and on a harbour the cell asks `condition >= 100` where `floor(bulk_shipping)` is 800 -- every condition in 100..800 is ADMITTED WHERE THE PROSE REFUSES, an UNDER-refusal, which `G4` weighs equally with an invention. THE SITE-USE IS AN OPERAND THE CLOSED ROSTER DOES NOT CARRY, so the reader answers with `min` WITH THE READING STATED, not UNKNOWN. What stays open is that a `work` MEANING deep-mining is admitted on a seam only surface-gleaning could support, because nothing on the act says which use is intended. `W-C` binds `site` to the question's referent, so the substitution is reached on every computed `work`. Registered on `H-08`/`H-94`; typing the threshold needs a site-use operand first."
    writes:      ["Site.condition"]
    writes_note: "WHAT THE WRITE CARRIES, since plan position `24e`: the act's own DECLARED delta where it declares one (`H-94`'s hand-built channel, unchanged), and otherwise -- only at a site a live works names (a `works` Record planning this site's kind at its rung, `queries/world_q.py::works_for`) -- `restore`'s rise, `loop/effects.py::_rise`: the headroom to the works' ceiling over those standing at the fabric. That is *'`work` advances `stage`'* read against r2 `04` §A.6.1, which RULED out a `stage` key on the Record: the stage a works has reached is its fabric's condition against the ceiling its ripened terms allow. A site no works names stages nothing, so a `text` Record is never advanced (the position's control). Staged and clamped once, G4's accumulator."
    emits:       ["site.worked"]
    emits_on_refusal:
      eligibility: ["work.unavailable"]
      floor:       ["work.unavailable"]
      write:       ["work.unavailable"]
      draw:        ["work.failed"]
    draw_note:   "B07.01 (18-A item 4; A-81): the `draw` clause's Event reports a LOST DRAW, not a refusal (04 §C.4: a refusal is a precondition failed, a loss an outcome that went against you) -- emitted at the Failure band once `task_draw_arm` is `on` (B07.05), with no typed write; its durable write is the Event and the claims WITNESS deposits of it. Kept out of the refusal union (`data/verbs.py::VerbRow.draw_kinds`)."
    grade:       "ruled"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"

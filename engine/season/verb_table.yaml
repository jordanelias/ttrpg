    writes_note: "v10 PC-10b (RS-25; H-240 route (1)): A CHALLENGE IS A STANDING `Record` OF KIND `challenge` (`rosters.yaml: record_kinds`), minted into the challenger's hand by `loop/effects_information.py::_eff_challenge` through `_mint_document`, the one mint: `terms` the challenged (the act's `subject`), `to` the same person as its addressee, `stakes` the term the duel is fought under (`challenge_terms`; absent on a computed challenge, which carries no payload, so its duel is fought under `duel_terms`' `accept` line, `blood`, v11 CR-87), `challenger` the actor. It is the carrier `accept` reads (`names:to`, `names:actor`). The `(Record, exists)` matrix row is the tree's. [ASSUMPTION; medium; Jordan to correct; revert: `writes: []` and `accept` reads no Record.] ⚠ THE RECORD REACHES THE CHALLENGED ONLY BY A `give` (ED-IN-0292 (1) RULED NO: no mint into an addressee's hand; H-229: `give` is unreached in the realm), so in computed play a challenge mints and no `accept` forms on it -- `accept`'s named R-05 residue."

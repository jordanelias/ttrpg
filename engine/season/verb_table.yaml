    referent_class_note: "v10 REM-28 (B10-06, AM-A-14, [ASSUMPTION; medium; Jordan to correct]): THE SEAT REVOKED. FORMED ONLY ON AN `Office`-CLASSED REFERENT -- the seats the standing occasions already stamp onto the question he answers, the stamp `confer` and `oblige` use (`queries/world_q.py::vacancies`, the vacant seats a conferrer may fill, and `seats_named`, the seats his own ledger names; `Office` is `occasion_only`, so the question's own referent is NOT carried as one) -- and `decision/options.py::opening_set` then forms on the classed ids alone (IN-53 D1's partition), `subject` binding it through the unchanged referent rule (`_derive_operand`), so `subject` never binds a person, a rung, a Record or a Site. THE CLASS REMOVES WRONG-KIND FORMATIONS ONLY: this row's eligibility (`remit:revoke`), its cell, `may_revoke` and the disposal (`state/gate.py::REVOCATION_DISPOSAL`) are unchanged. THE LIMIT, STATED IN PLAIN WORDS: THIS COLUMN EXECUTES NOTHING. `_req_revoke` and `_eff_revoke` read `payload['office']`, every computed act carries `subject` (a hand-built one supplies `office`), `loop/predicates.py::office_named_by` says `revoke` IS NOT A CALLER (IN-53 D1, DECISION 2026-10-13) and H-207 ruling (A) says a computed `revoke` is not driven; so every formation that survives is refused on that same clause until a caller reads `subject`, and that edit is H-207 (A)'s. The class is shared with `confer` and `oblige` and moves no derived set: `DECLARED_CLASSES` already holds `Office`, and `RUNG_REMIT_ACTS` reads `Rung` rows alone. REVERT: delete this column."

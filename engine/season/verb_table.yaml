    writes_note: "v9 IN-12 step 9 (#453 §9.4; K-20, K-21): `loop/effects_combat.py::_eff_train` (beside `tend`, the person's other raiser, G15) RAISES ONE CAPABILITY OF THE SUBJECT BY ONE WHOLE POINT -- the vocation the act carries as `kind` (`rosters.yaml: vocation_sourced`, read in `decision/options.py::opening_set`: one Candidate per vocation in `verb_capability`'s values). ⚠ J-13 ANSWERED (iii) AS THE INTERIM (`workplans/valoria_master_workplan_v9_part5.md` §J.1, RS-21 item 10) [medium; Jordan to correct]: `train` WRITES `Person.capability` ONLY WHERE A CASE NAMES A VOCATION -- the subject must ALREADY hold the key to be raised in it (a pupil holding none is declined at the effect, `train.refused`), so no key is ever minted below `pool_default` (a minted `{copying: 1}` would replace the default 2 and LOWER the pupil's pool) and `pool_default` holds everywhere a case names none. ⚠ THE PLAN'S *'forms ... only where'* HALF IS NOT BUILT: a formation read of the actor's capability is a capability gate, which #353 §9.2 and probe P11 (`harness/probes.py`) refuse [ASSUMPTION; medium; Jordan to correct; revert: the formation decline, once P11 is re-ruled for `train`]. ONE point: `capability` is a whole-number dice count (`harness/corpus_run.py::_check_capability`), and one is its unit [ASSUMPTION; medium; Jordan to correct; revert: a swept fixture step]. THE RANGE IS `verb_capability`'s VALUES (K-20; today `copying` only): Thread Sensitivity has no carrier (H-85) and so is structurally outside it -- P-08 forbids non-sensitives gaining Thread-level capability by study (`canon/02_canon_constraints.md:49`). `(Person, capability)` is UN-RETIRED in the same commit, with this producer (K-21; `write_matrix.yaml`'s own rule, *'a row exists because a producer produces it'*)."

  - verb:        "establish"
    scale:   "settlement"
    scale_note: "founding an office is an act on the rung that will hold it"
    stratum:     "binding_decision"
    eligibility: ["remit:confer"]
    beneficiary: "none"
    brute:       "seat"
    brute_note:  "the conferral basis and a rung (`requires`)"
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    referent_class: Holding
    referent_class_note: "B21.08 (VB-A commit A2, [ASSUMPTION; medium; Jordan to correct; revert: `referent_class: Rung`]): THE UNFOUNDED HOLDING A FOUNDING STANDS ON. FORMED ONLY ON A `Holding`-CLASSED REFERENT -- a holding his seat may found an office over whose office is not yet founded (`queries/world_q.py::holdings_to_found`, which `questions_for` stamps by name as `Holding`, `data/verbs.py::HOLDING_CLASS`; no collection holds the class), so `subject` binds the rung `office_founded_by` derives the office from, and the row no longer forms on a place named, a larder in purview, or a holding already founded (the repeat the fold refused at clause 4). The `Rung` stamp of `holdings_to_found` is KEPT, so `migrate`, `requisition`, `march` and `convene` are unmoved. v11 CR-25 (CR-11's design) had this row on `Rung`, shared with those rows, where the fold disposed. THE DERIVED NARROWING, NAMED: `data/verbs.py::RUNG_REMIT_ACTS` (the union over the `Rung` rows) loses `confer`, no other `Rung` row being eligible by it, so `larders_in_purview` is no longer asked of a `confer`-only seat. REVERT: `referent_class: Rung` (`RUNG_REMIT_ACTS` regains `confer`)."
    requires:    "the establishing office's conferral basis, and a rung to establish it at"
    requires_note: "Evaluated as `_req_establish` in `loop/predicates.py` (`13f`), AND THE READING IS STATED THERE: *the establishing office* is the office the act describes -- the one being founded, or re-remitted on an id that exists -- NOT the office the actor sits in. That office's declared `conferral` must pass the SAME basis test `_req_confer` asks (`has_conferral_basis`), so an establish can never found a seat `confer` would refuse forever. Operands ride on the payload when an act carries them: `office`, `post`, `rung`, `remit`, `body` and/or `faction`, `conferral`, optional `revocation` -- the office overlay's own keys; otherwise (v11 CR-25, CR-11's design, decision 3) `loop/predicates.py::office_founded_by` (the World-taking sibling of `office_described_by`, read by `_req_establish` and `_eff_establish` alike) DERIVES the office from `subject` (a holding, admitted by `queries/world_q.py::founds_over`'s four conjuncts) and `Act.via` (the seat exercised): post from `offices.yaml: titles.domains`, faction and body the seat's, remit the seat's less `confer` and `revoke`, conferral `appointed`, revocation `rung_above_in_holdings`. Clause 5 carries H-144 (b) (any existing office asks `may_fill`) and H-132 (b) (a reduction of a sitting holder's grant asks `may_revoke`). No operand is added."
    writes:      ["Office.exists", "Office.remit_acts", "Tenure.payload"]
    writes_note: "`Office.remit_acts` is the key reconciled at the matrix row (see that row). `Tenure.payload` is declared because the effect re-stamps the grant on every live `hold` on the office it writes, through `World._grant_remit`, and the fold gates exactly the pairs a verb declares -- undeclared, that write would ride under the `Office` pair's gate. `Office.establishment` is NOT a pair: who serves a seat is `world_q.establishment_of`, a Query over live `oblige` Tenures, which this verb does not write (r2 `05:214-221`)."
    emits:       ["office.established", "remit.changed", "tenure.payload_set"]
    emits_on_refusal: ["establish.refused"]
    grade:       "assumption"
    source:      "W3 -- #353 names it and Part E omits it, and V2 NAMES IT IN ITS OWN `(Office, remit)` ROW ('`establish` is an act') while giving it no verb row. Its three Part D rows were RETIRED BY W2 for having no producing verb; they return in the same commit as this row, which is the discipline: a row exists because a producer produces it. Eligibility is `assumption` -- #353 does not say which remit establishes an office. Register rows H-41, H-34."

        - form:      existence
          of:        to
          kind:      Person
          conjunct:  executors
        - form:      basis
          of:        to
          basis:     purview
          conjunct:  authority
        - form:      own_ledger
          of:        subject
          conjunct:  terms
    requires_typed_note: "PLAN POSITION IN-10 (#453 §10.1, *`issue` joins the known-person fan for `to`*): `terms` IS THE CELL'S THIRD CONJUNCT (with `executors` and `authority`, below), AND ITS JOB IS TO BIND `subject`. A computed `issue` would otherwise bind `subject` and `to` to the question's ONE referent, so every writ's `terms` would name its own executor (`loop/effects_information.py::_eff_issue`) -- and a warrant read off such a writ would have the holder arrest himself. A cell binding `subject` beside `to` puts `to` in `TypedRequires.known_person_operands` (`data/requires.py`: the fan is empty for a cell binding `to` alone), so `decision/options.py::operand_bags` forms one `issue` per person the issuer knows and `data/verbs.py::act_key` keys each act by `subject>to`: the referent is the writ's `terms`, a known person its executor. [ASSUMPTION; medium; Jordan to correct; revert: an unpriced `terms` clause, which the grammar cannot write (a keyed row names every conjunct, and no form holds of every referent)] WHAT THE CONJUNCT ASKS: the issuer HOLDS A CLAIM ON THE TERMS (`own_ledger`, §F.24a form 6, `tell`'s form) -- a writ is about something its issuer knows of. It is the weakest clause the grammar can write on a referent of any class: a `claim_landed` referent is a claim the issuer holds, so it never refuses one. Refused, it is `issue.refused` -- the issuer, not the seat, said no. ⚠ TWO SHAPES CONSIDERED AND NOT TAKEN: the seat's purview over the terms (`Basis` `purview`) REFUSES A PROPOSITION, which has no place -- so a covenant dispensation, whose `terms` is a Proposition (#453 K-54, `commit`'s route), could never be issued; and r2 `02` §A.6's `existence of subject kind Proposition` refuses a warrant, whose `terms` is a person (#453 §10.1, `arrest`/`seize`). ⚠ A NAMED `own_ledger` CONJUNCT CARRIES `said` (`decision/options.py::opening_set`, telling `T4`), and a Candidate with nothing to say is declined: an `issue` act's payload holds the issuer's newest claim on the terms. Nothing reads it off an `issue` -- WITNESS reads `said` on `news.told` only, and the mint reads the kind's keys -- except `decision/choose.py::declare_intents`, which treats any act carrying `said` as a telling at a swept `intent_disclosure` > 0 (shipped 0). The Person clause stays on the executor alone: `terms` may name a person, a Record, a place or a Proposition. THE OTHER TWO CONJUNCTS, which the fold refuses (§F.24a calls this cell *'a constraint on the well-formedness of the Act'*). `executors` -- *scope enumerates EXECUTORS, not places*: the addressee (`to`, the dispensation's addressee key) exists and is a PERSON, so a writ addressed to a rung is refused. `authority` -- `Basis` (§F.24a form 7) with the `purview` rule: the issuing seat's purview reaches where the executor lives -- the row's `scale_note`, *'its reach is the domain the issuer governs'*, and `04:330`, purview asked of the seat exercised. ⚠ ONE EXECUTOR PER ACT: `existence` reads one id, and `decision/options.py::_from_content_claim` collapses a held writ's addressee list to its one member or declines; a hand-built act naming several is outside what this cell can ask."
    counterparty: to
    counterparty_note: "PLAN POSITION `19`: THE EXECUTOR IS THE SECOND SIDE, AND AN ISSUER IS NOT HIS OWN. `petition`'s precedent exactly: its typed cell binds `to`, and `opening_set` forms no Candidate whose `to` is the person -- a writ a man addresses to himself would EXECUTE (he is a person, and his seat's purview reaches his own home) and mint a document that orders nobody, a constant scene tax the fold could never refuse."
    writes:      ["Record.exists"]

  # ===========================================================================================
  # PLAN POSITION `20-iii` -- THE INFORMATION CLUSTER (narrative #14 §F, `D1-a`). A person cannot
  # read a faction: a `View` holds his own claims, and `AX-2` puts world truth nowhere inside a
  # decision. Proposal 14 (`proposals/2026-09-12-emergent-narrative-primitives-v2/01_THE_TEN.md`)
  # makes the faction-scale picture DIEGETIC instead -- a document somebody had to make, dated by
  # when it was made, which can be wrong, burned or handed on -- and puts the price on MAKING it:
  # *"Free to read, costly to obtain, stale by construction."* `survey` is the act that pays.
  # ⚠ NAMED `survey`, THE ORDINARY WORD FOR *examine something whole and record what is there*, and
  # proposal 14's own verb (*"somebody had to survey the valley"*). NOT `surveil` -- covert
  # watching, one of the six investigation acts, the FI lane's (`ED-FI-0009`) -- and not `compile`,
  # which a reader of this repository meets first as the build step.
  # ===========================================================================================
  - verb:        "survey"
    stratum:     "uncontested_material"
    eligibility: ["own"]
    beneficiary: "actor"
    beneficiary_note: "the sheet is minted into the SURVEYOR's hand, and its content lands in HIS ledger at WITNESS (the content deposit, `rosters.yaml: record_kinds.content`) -- the investigation acts' shape: a finding is the actor's."
    requires:    "the actor has heard of what he surveys, and it coheres under one faction"
    requires_typed:
      form:      own_ledger
      of:        subject
    requires_typed_note: "PLAN POSITION `20-iii`. ONE CONJUNCT TYPES AND ONE CANNOT. `own_ledger` of `subject` -- `reconstruct`'s and `tell`'s cell: a claim on the subject in the actor's OWN ledger, the one ledger the fold may read (`04 §B.2`, F8's carve-out). It is the epistemic half of commissioning -- nobody surveys a faction he has never heard of -- and it is what carries `subject` onto a computed act (an UNTYPED row carries nothing: `decision/options.py::operands_for`). *It coheres under one faction* has no stem in `data/requires.py: REQUIRES_STEMS`, so it is `loop/effects.py::_eff_survey`'s decline, through `world_q.faction_holding` -- the one owner of *which faction does this cohere under*, answering for a faction's own Proposition and for a person. ⚠ `existence` of `subject`, kind `Proposition` (`commit`'s cell) WAS REJECTED: no computed act's referent is a Proposition, so it would be formed on every referent and refused on every one (`H-156`'s scene tax); the effect's docstring gives the measurement."
    writes:      ["Record.exists"]
    writes_note: "`issue`'s and `petition`'s column: one `(Record, exists)` write through `_mint_document`, the one mint, with the surveyor's `hold` riding on the Record's receipt (admitted as `T-m`, `create_record`'s). The content is `faction_q.resolve`'s view AT THE MOMENT OF WRITING (`asdict`, fresh lists), keyed as `rosters.yaml: record_kinds.faction_sheet`, which `faction_q.py` checks against `Faction`'s fields at import. No `write_matrix.yaml` row is added; `faction.surveyed` joins `(Record, exists)`'s `emits:` in the same commit."
    emits:       ["faction.surveyed"]
    emits_note: "A KIND OF ITS OWN, NOT `record.created`: a survey is a private act (`own`, `uncontested_material`), and neither broadcast channel reads it -- `_ch_chronicle` reads the kinds `binding_decision` rows emit and `_ch_post_remit` those of `remit:`-eligible rows (`give`'s `emits_note` gives the reason in full). Witnesses learn THAT a survey was made of the subject, by the channels that admit them; only the holder learns what it says."
    emits_on_refusal: ["survey.refused"]
    refusal_note: "FLAT: one kind for every failable clause (`data/verbs.py`, invariant 4). Refusal conditions: the surveyor holds no claim on the subject (the cell); the subject coheres under no single faction -- a person committed to none or to two, a rung, a site, a document, an unrostered Proposition (the effect's decline, the `write` clause)."
    grade:       "assumption"
    grade_note:  "an argued addition, graded as `found`, `build` and `forge` are: the matrix row `(Record, exists)` is the tree's; the verb, its cell and its reading of WHICH faction are plan position `20-iii`'s, on proposal 14's reconciliation. The operand reading is `faction_holding`'s, not a new rule."
    source:      "plan `workplans/2026-09-28-the-plan-one-order-mc-v18-retired.md` position `20-iii` (*'narrative #14 §F (D1-a) and the chain half of #7 (intelligence before action)'*); `proposals/2026-09-27-mc-v18-retirement-plan/PROPOSAL.md` D1-a; `proposals/2026-09-12-emergent-narrative-primitives-v2/01_THE_TEN.md` §F, proposal 14 (Jordan's) and 14.1 (Jordan's extension, NOT built -- `H-169`)"
  - verb:        "tell"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "subject"
    requires:    "the teller holds a claim on the subject, and the person told is with the teller"
    requires_typed:
      all:
        - form:      own_ledger
          of:        subject
          conjunct:  holds
        - form:      relation
          of:        to
          relation:  with
          conjunct:  hearer
    counterparty: to
    counterparty_note: "TELLING WORKPLAN `T4` (`ED-IN-0282`): THE HEARER IS THE SECOND SIDE, AND THE TOPIC IS NOT. `subject` stays what the telling is ABOUT and `to` is whom it is told to; the contest's opponent is `to` (`loop/resolve.py::_contest` reads `row.counterparty or \"subject\"`), so `sigma` throws the teller's pool against the HEARER's standing and not against a rung or a person merely talked about. `to` comes from `decision/options.py::operand_bags` -- one Candidate per person the teller KNOWS (`queries/person_q.py::known_persons`, `rosters.yaml: known_person_operands`) -- and never from the question's referent. `opening_set` forms none whose `to` is the teller (`petition`'s rule); a telling ABOUT oneself to somebody else IS formed, because a row naming its counterparty is not caught by the contested-verb self-subject skip (Decision 3). ⚠ NO `addressed` CHANNEL: an emitter names no recipient (§19.3, T-e). The addressee hears by PRESENCE, through `co_located`, like every bystander -- the `hearer` conjunct only refuses a telling to someone who is not there."
    requires_typed_note: "TELLING WORKPLAN `T4` (`ED-IN-0282`): TWO NAMED CONJUNCTS. `holds` -- the cell below, unchanged in what it asks. `hearer` -- `relation` (form 5) on the new `with` stem (`data/requires.py: REQUIRES_STEMS`): the person told and the teller share a place (`world_q.place_of`); UNKNOWN if either is no person or has no place, and ALWAYS UNKNOWN person-side (`WORLD_ONLY_STEMS`), so the teller forms the Candidate on whom they know and the fold refuses an absent hearer with `news.untold` keyed `hearer`. `holds` being NAMED is also what `opening_set` reads to carry `said` and to decline a Candidate with nothing to say (`TypedRequires.named_own_ledger_operands`); `survey` and `reconstruct` share the form unnamed and carry nothing. ⚠ THE CELL'S FIRST CONJUNCT, AS IT WAS: §E3 `:417` — *the teller holds a claim on the subject*. §F.24a form 6's first named cell, and the one the `F8` carve-out was written for. This is `_req_tell` verbatim: `any(c.subject == subj for c in teller.ledger)`, with the ledger reached through a reader that can name no other person's. ⚠ `R8.1` WIDENS THIS CELL'S OWN SUBJECT, MEASURED RATHER THAN ASSUMED: `any(c.subject == subj ...)` is UNTYPED on predicate, so a `seen` claim satisfies it exactly as a `condition.worn` or `stores:grain` claim does. Corpus measurement (both arms at seed 0, `seen` live vs `seen_subject` forced to `None`): `tell` reaches 60 -> 81 of 89 live worlds WITH `seen`, and `told_holders` (transmissions that survive the dedup guard) falls 8 -> 5 over the same run. One mechanism, two directions: `seen` gives the teller more subjects to hold a claim on, so `tell` is eligible more often; the same ambient claim reaches the RECIPIENT too, so more of what gets told is already held firsthand and the dedup guard drops it. Confirmed by controlled measurement 2026-09-27 (`HANDOFF_IN.md`'s R8.1 row); not a defect in either mechanism, reported as a consequence of `R8.1`'s design rather than fixed here."
    contests:    "a standing"
    writes:
      Overwhelming: []
      Success:      []
      Partial:      []
      Failure:      []
    emits:
      Overwhelming: ["news.told", "confidence.broken"]
      Success:      ["news.told", "confidence.broken"]
      Partial:      ["news.told", "confidence.broken"]
      Failure:      ["news.untold"]
    emits_note: "v9 IN-18 `G6` (`H-197`, confidences): `confidence.broken` is DECLARED on every band that tells and EMITTED only when the act breaks a circle -- the teller holds the said claim under a `Claim.visibility` circle (a confided telling's deposit, `loop/witness.py::_circle_of`) and the addressee `to` is outside it (`loop/resolve.py::_confidence_broken`, the fold's one act-earned kind; `tell` writes nothing, so no effect earns it). Not on `Failure`: a telling the hearer did not take in told nothing. It adds no refusal route. At the shipped `telling_privacy` 0 no circle exists and the kind is never emitted."
    contests_note: >-
      ⚠ `U1` / R-09. THE PRIZE IS `a standing`, WHICH IS ALREADY ROSTERED -- loader invariant 9
      (`04:467`) requires a verb's prize to be in the subsystem roster, and inventing a prize to
      dodge a ruling was considered and refused as worse than either option ED-SC-0037 costed.
      ⚠ THIS INTRODUCES NO NEW EVENT KIND, WHICH IS THE LOAD-BEARING PROPERTY AND IT IS CHECKABLE
      BY READING THE ROW. `news.told` and `news.untold` were BOTH already declared here -- one on
      `emits:`, one on `emits_on_refusal:` -- so the degree-keyed column redistributes kinds the row
      already had. Do NOT cite loader invariant 7 as what admits them: `04 §F.20b:1084` records
      that the derived Event-kind roster is SPECIFIED AND UNBUILT, so nothing admits them and
      nothing has to.
      ⚠ `writes:` IS `[]` AT EVERY BAND AND THAT IS LAWFUL RATHER THAN A HOLE. `04 §C.4:630-634`
      rules that a `Failure: []` is the only place in this architecture where writing nothing is
      correct, and that it is correct because the act still EMITS -- which is the difference
      between a refusal, where the precondition failed and no contest occurred, and a loss, where
      the contest occurred and went against you. A telling deposits at WITNESS, not here, which is
      what this row's own `writes_note` has always said.
      ⚠ POSITION 10 (U5/R-07) ATTEMPTED A `Person.stance` WRITE HERE AND REVERTED IT, AND TELLING
      WORKPLAN `T4` (`ED-IN-0282`) SUPERSEDES THE QUESTION RATHER THAN REOPENING IT. Two of the
      paragraph's premises no longer hold. (1) THE OPPONENT IS `to`, NOT `subject`: the contest is
      thrown against the HEARER (`counterparty: to`, read by `loop/resolve.py::_contest`), so the
      `subject` operand is the TOPIC and was never the party a standing is won from. (2) WHAT A
      TELLING LEAVES IS A CHAIN, NOT A WRITE: the hearer's told claim carries `chain = said.chain +
      (teller,)` (`T3b`), and how far a hearer credits the teller is read off that chain when the
      claim is weighed (`T3a`'s `teller_weight`), never stored as a stance. So `writes:` stays `[]`
      at every band, `claim_subjects`' (`H-79`) empty-changes fallback still lands the claim on what
      was told, and `test_n3_..._a_telling_is_about_what_was_told` still holds; `H-62`'s producer gap
      for `(Person, stance)` stays closed by `march` (M4), and the judged half of regard is the gated
      `G1`. The old "MEASURED to be a Rung, never a Person" is REPLACED by T0's measurement (scratch
      `t0/m0_summary.md`, M0a): 24.5% of the corpus's and 21.4% of the realm's `tell` Candidates
      name a person as their topic, and 2 executed tellings in each instrument did.
      ⚠ AND A TELLING WITH NOTHING TO SAY IS NOT FORMED (T1's deferred decline, taken at T4):
      `opening_set` declines a `tell` Candidate whose `said_of` is `None`, because the `holds`
      conjunct is NAMED; `survey`/`reconstruct` share the form unnamed and are not declined.
      ⚠⚠ AND `speak` DID NOT GET ONE, WHICH `U1`'s PLAN EXPECTED IT TO. That plan names `tell` AND
      `speak`, on the ground that both carry `requires_typed`, form `own_ledger`. Measured against
      this table: `speak`'s `requires` is an em-dash and it carries NO typed cell. An untyped verb
      yields an empty operand bag from `operands_for`, so a computed `speak` would reach the seam
      with ONE claimant -- the exact ground `kill / wound` is excluded on, and the third gate in
      `resolvable_verbs()` refuses it for that reason rather than by name. Typing `speak`'s
      precondition would be INVENTING one, because §E3 gives it none. So R-05's count moves 1 -> 2
      rather than 1 -> 3, and the third is owed to whoever rules a precondition for `speak`.
    emits_on_refusal:
      holds:  ["news.untold"]
      hearer: ["news.untold"]
      counterparty: ["news.untold"]
    grade:       "ruled"
    writes_note: "— (deposits at WITNESS, not here)"
    refusal_note: "W3: added. §E2 -- 'failure emits, never raises'. This verb has a `requires` and had no refusal channel, so a failed precondition produced no Event, no witness and no arc. Refusal condition: the teller holds no claim on the subject. ⚠ KEYED AT `T4` (`issue`'s precedent, `data/verbs.py` invariant 4's per-conjunct half): `holds` -- nothing held about the subject; `hearer` -- the person told is not with the teller. ONE KIND FOR BOTH, so the seam's party-gap refusal, which emits the row's union, still emits exactly the kind each conjunct does; that single-kind union is what the loader requires of a CONTESTED keyed row. ⚠ PLAN POSITION `14`: `counterparty` -- a telling to nobody, or to the teller -- is the fold's own clause (`loop/resolve.py::_admits`), keyed to the row's one kind."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  # ===========================================================================================
  # THE SIX INVESTIGATION ACTS, AS SIX ROWS. Jordan, 2026-09-10: *"'the six investigation acts'
  # is a massive issue: that is not a verb"*, and *"you must ensure you build the six from
  # investigation systems"*.
  #
  # WHAT THEY REPLACE. One row spelled `"the six investigation acts"`, `requires: "per act"`,
  # `requires_typed: none`, `grade: assumption`. It named no act, so nothing could form one; the
  # corpus prints its blocker verbatim -- `engine/season/runs/CASELOG_NPC.md:64`:
  # *"'the six investigation acts' is on the table and the fold cannot execute it: needs a
  # `requires:` predicate"*. THE SIX ARE NAMED IN CANON, not coined here:
  # `systems/fieldwork/reference/investigation_systems_v30.md:217` -- *Examine, Interview,
  # Research, Surveil, Thread-Read, Reconstruct. No new action vocabulary.*
  #
  # ⚠ THE SPLIT REMOVES THE ONLY REASON THE UNTYPED CELL WAS LAWFUL, WHICH IS WHY EACH ROW
  # CARRIES A TYPED ONE. `data/verbs.py:239-248` admits three reasons for `requires_typed: none`,
  # and the placeholder used reason (b), *a `per act` cell* -- the cell deferred to six acts the
  # table did not carry. Once the acts ARE rows there is nothing left to defer to, so five of the
  # six are typed here and the sixth carries reason (c), an operand the closed roster has no name
  # for. NOTHING IN THE GRAMMAR IS EXTENDED: every clause below uses an existing form
  # (`rosters.yaml: requires_forms`), an existing operand (`requires_operands`) and an existing
  # predicate stem (`data/requires.py: REQUIRES_STEMS`). No new form, no new operand, no new stem.
  #
  # ⚠ AND `emits:` IS FLAT, NOT DEGREE-KEYED, WHICH IS THE HALF THIS COMMIT DOES NOT BUILD.
  # `fieldwork_v30.md:302-309` grades every one of these acts on four bands (Failure's false
  # lead, Partial's incomplete detail, Success's reliable one, Overwhelming's bonus revelation)
  # and NOTHING HERE CAN RESOLVE A BAND. `rosters.yaml:482` types investigation's seam
  # `UNRULED | UNRULED | UNRULED -- ITS OWN KIND, not a contest`, and `:487-491` rules what a
  # session may do about that: *"the blanks are Jordan questions, not session guesses: writing a
  # plausible IN/OUT for a mode nobody has ruled would be inventing the architecture rather than
  # recording it, and the seam is precisely the thing that must not be invented."* `:505-508`
  # closes the near escape: *"INVESTIGATION MUST NOT BE MADE A CONTEST TO BECOME GRADEABLE …

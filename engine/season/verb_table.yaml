          threshold: amount
          comparator: ">="
          conjunct:  stores
    requires_typed_note: "PLAN POSITION `19`: *'`requires: stores(...) >= amount` is untyped: author it as `transfer`'s own form-2 `stores >= amount` cell'* -- and it is, field for field, with `of: subject` where `transfer` has `of: from`: the row's own `scale_note` makes the requisitioned rung THE SUBJECT. So `operands_for` carries `subject`, `kind` and `amount` for a computed requisition exactly as for a transfer (`kind`/`amount` from a held shortfall claim, else the fixtures, `H-94`). PLUS the conjunct the plan gives every remit verb, *'a predicate reading `via.scope`'*: `Basis` (§F.24a form 7, `data/requires.py`) with the `purview` rule, so the requisitioning seat's purview must reach the requisitioned rung (ruling (4), `04:330`) -- and a rungless seat, which reaches nothing, is refused before the effect could look for a treasury it lacks. ONE OWNER: the whole cell is typed, no predicate beside it (`test_wa_one_owner_...`)."
    writes:      ["Rung.stores", "Rung.stores"]
    writes_note: "×2, ONE PER SIDE -- PLAN POSITION `19`, `transfer`'s shape and the W3 audit's reason (*'six grain left the world and arrived nowhere'*): the requisitioned rung goes down and the seat's treasury, the rung of `Act.via`, goes up by the same, in one effect (`loop/effects.py::_eff_requisition`, through `_shift`, the one body of every move between two rungs' stores). The second pair is check-only. It declared ×1 before `19` and no effect existed to perform even that."
    emits:       ["requisition.taken"]
    emits_on_refusal:
      eligibility: ["requisition.unauthorized"]
      authority:   ["requisition.unauthorized"]
      stores:      ["requisition.refused"]
      write:       ["requisition.refused"]
    refusal_note: "PLAN POSITION `19`: KEYED PER CLAUSE (`04 §B.13` invariant 4's per-conjunct half). `requisition.refused` is §27.1's SCARCITY channel -- *the second claimant on an emptied granary gets a DIFFERENT Event* -- and it is now the `stores` conjunct's alone: two requisitions on one larder in one fold, and the second finds it short (`tests/test_u7_remit.py`). `requisition.unauthorized` is the SEAT refusing: none exercised grants `issue`, or its purview does not reach the rung. A seat that could not reach the larder and a larder that could not cover the requisition were one Event before; a witness can now tell them apart."
    grade:       "assumption"

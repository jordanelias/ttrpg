# PART E, AS DATA — THE VERB TABLE, WHICH IS THE RESOLVER'S BODY.
#
# W3 of `architecture/PLAN.md`, and PLAN §5.1 calls it "the item
# that turns grading into running". #353 gives `resolve : (Act[], World) -> Event[]` and NEVER SAYS
# WHAT ANY VERB DOES — the semantics are prose scattered across §11, §36, §37 and §54. That is
# defect `D20`, and it is why the tested instrument could only GRADE cases and never RUN them: with
# no table, every act needed a hand-written `effect` lambda, and a lambda per act IS a second
# resolver.
#
# ONE `resolve` READS THIS TABLE. The fold is: eligibility → `requires` evaluated AGAINST THE WORLD
# THE PREDECESSORS LEFT → each `writes:` through `write()` → `emits` or `emits_on_refusal`.
#
# `emits_on_refusal` IS THE SCARCITY CHANNEL AND IT IS LOAD-BEARING (§27.1, §E2). "The second
# claimant on an emptied granary gets a DIFFERENT Event." A verb that RAISES on a failed
# precondition produces no Event, no witness and no arc — so scarcity stops being something the
# world does and becomes something the engine forbids.
#
# `writes:` ENTRIES MUST BE ROWS OF `write_matrix.yaml`. Anything else is an unmarked cell under
# §30's own rule. The loader checks it; a verb naming a pair Part D does not carry raises at load
# rather than at the first act that uses it.
#
# ⚠ `OBSTACLE` IS NOT `OBSTRUCTION`, AND THIS TABLE IS WHERE THE TWO GET CONFUSED (ED-IN-0220).
# `ED-IN-0210` Ruling 1 — Jordan, 2026-09-10 — says a real interaction has a COUNTERPARTY, an
# OBSTACLE and a DEGREE. The OBSTACLE is the difficulty this act is resolved against: the `Ob` a
# pool is thrown at, resolver-side, a number, and a person may BE one. It is what `contests:`
# routes to. OBSTRUCTION is a different thing entirely — `T-g` in
# `architecture/meta/01_AXIOMS.md`, where another person's PRIOR act refuses yours, enforced by a
# precondition like `confer`'s 1-per-object and carried by `emits_on_refusal`. An obstacle is
# ROLLED AGAINST; an obstruction produces a REFUSAL and no degree at all, and needs no verb, no
# field and no knowledge of the obstructor. Look for an `obstruct` verb here and you will not find
# one, by design. Defined at both sites per `CLAUDE.md` §4; `T-g` is the prose home.
#
# ELIGIBILITY IS ONE OF FOUR KINDS — `own`, `remit:<act>`, `hold:<object>`, `presence:<rung>` — AND
# NEVER `capability`. #353 §9.2: "`capability` supplies dice and GATES NOTHING." An office makes an
# ORDINARY verb eligible; no verb exists only for office-holders, and none carries a modifier.
#
# `scale:` ON A ROW. #358 §E.3 / Stage 2 §C.3: scale is a POSITION IN THE CONTAINMENT TREE, derived on
# demand, stored nowhere -- "a label cannot be walked". A row that still carries `scale:` answers a real
# Jordan question ("is it unnecessary to nest these and instead just explicitly define scale?"; #358 rev.2,
# 2026-09-03): the answer is THE SCOPE OF THE SEAT BEING EXERCISED -- `Act.via.scope` -- not a column on the
# verb. The key is retired when `Act.via` carries the scope; until then each such row's `scale_note` is the
# provenance that would be lost. `convene` has none: its venue test is an ordinal read off the act's own
# `subject` operand (its `requires_note:`).
#
# The flat `emits_on_refusal` rule (invariant 4) covers every failable clause, not only a `requires`.
# STILL OPEN: eligibility itself can decline -- `destroy_record` declines on BOTH its alternatives (H-75)
# and can never fire -- and no row declares an eligibility-refusal kind. The fold's `act.ineligible`,
# `act.refused` and `attempt.refused` are the declared column `rosters.yaml: fold_kinds` and members of the
# derived roster (`data/verbs.py::EVENT_KINDS`), which `loop/resolve.py::_act_events` holds the fold to; a
# flat row with two or more failable clauses may declare ONE refusal kind (`data/rosters.py::PERSON_DEMANDED`,
# the kind the fold keeps only when earned, is exempt).
#
# `regard_sign:` ON A ROW (B10.11; `rosters.yaml: regard_signs`, `data/verbs.py::VerbRow.regard_sign`): `1`, `-1` or `0` -- whether a person's
# liking for the act's subject pulls him toward the act, away from it or not at all, read by `decision/choose.py::_stance_arm`. A row naming none
# takes `-1` where the act is done against its subject (`VerbRow.opposed_to_subject`), else `1`; NO ROW AUTHORS ONE YET (cells are BA1's content).
# =============================================================================================

verbs:
  - verb:        "carry"
    difficulty:  "plain"
    difficulty_note: "B07.01 (18-A, The resolution, decided, 3): `plain`, 18-A's default where the owning verb lane has stated no level; read by the draw only (`task_draw_arm` `on`)."
    capability:  "copying"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "none"
    governing:   [attr.social.charisma, attr.social.grace]
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    beneficiary_note: "the good accrues to the PETITIONER, and a `carry` Candidate carries the petition (`subject`, a `Record` of kind `petition`) rather than the person who filed it."
    referent_class: Record
    referent_class_note: "v10 REM-25 (B10-05, AM-A-10; M19 taken, [ASSUMPTION; medium; Jordan to correct]): FORMED ONLY ON A `Record` THE PERSON HOLDS -- `queries/world_q.py::records_held_for_holding_rows` stamps the Records on his live `hold` edges whose kind a `Record` row asking `held_by` of `subject` asks `existence` of (`data/verbs.py::HOLDING_RECORD_KINDS`, derived off the cells) onto the question he answers as `Record`, and `decision/options.py::opening_set` then forms on the classed ids alone, so `subject` binds a held Record and never a person, a Site, a Proposition or a rung. The class is SHARED with `comply`, `found` and `build` and a Record the question itself names is stamped too, so this row also forms on a petition or works the question names and he does not hold (refused on `held_by`), and on a held writ (a writ kind, `data/verbs.py::RECORD_REFERENT_KINDS`, stamped by `writs_held`'s addressee test alone); the fold refuses each on `held_by` or its own kind (`tests/test_referent_class_stamps.py`). REVERT: delete this column (and the term in `questions_for`)."
    requires:    "a Petition exists, and the actor holds it; costs budget like any act"
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      petition
          conjunct:  exists
        - form:      relation
          of:        subject
          relation:  held_by
          conjunct:  held
    held_note:   "v9 IN-45: THE SECOND CONJUNCT IS `found`'s CELL (`relation` of `subject`, `held_by`); no form, operand or stem is added. `carry` is the right of the one who holds the document (#453: *'the petitioner holds his petition'*), as `open_case` is the remit of a seat; the petitioner holds it from the mint (`_mint_document`'s maker's `hold`) and `give` can hand it on. Refused, it is `carry.refused`. [ASSUMPTION; medium; Jordan to correct; revert: the single `existence` cell, under which anyone who knows of a petition may docket it.]"
    kind_note:   "`exists:petition` asks *a Record of that kind exists* (a petition is a `Record` of kind `petition`, `04_CODE_ARCHITECTURE.md` §B.5), which `queries/world_q.py::WorldReader.read` answers from `rosters.yaml: record_kinds`. What a carried petition puts on which docket (`H-63`) is the row's `writes_note`."
    requires_typed_note: "§E3 `:415` — *a Petition exists; **costs budget like any act***. The second half is not a precondition: §26.3's budget is charged in `pack_scenes`. THE SCOPING IS A CHOICE: the prose is INDEFINITE (*a* Petition) and this reads it as *the petition being carried*, the act's `subject`, because `carry` writes `(DocketItem, matter)` -- a PARTICULAR one; any Petition anywhere would admit a `carry` of a petition that does not exist."
    writes:      ["Record.stages", "DocketItem.matter", "DocketItem.arrangement", "DocketItem.petition"]
    emits:       ["petition.carried"]
    emits_on_refusal:
      exists:      ["carry.refused"]
      held:        ["carry.refused"]
      write:       ["carry.refused"]
      draw:        ["carry.failed"]
    draw_note:   "B07.01 (18-A item 4; A-81): the `draw` clause's Event reports a LOST DRAW, not a refusal (04 §C.4: a refusal is a precondition failed, a loss an outcome that went against you) -- emitted at the Failure band once `task_draw_arm` is `on` (B07.05), with no typed write; its durable write is the Event and the claims WITNESS deposits of it. Kept out of the refusal union (`data/verbs.py::VerbRow.draw_kinds`)."
    grade:       "ruled"
    writes_note: "v9 IN-45 (`loop/effects_information.py::_eff_carry`), built on `open_case`'s body (#453: *build on `open_case`'s body, writing the petition's `Record.stages`*): `Record.stages` is the FIRST pair -- the act re-winds the petition's clock (`_declared_stages`, `H-80`'s default for a computed act), so the petition RECORD moves, the gate's `entity` shape observes it, and its receipt names the petition, which the appended docket item names under `DOCKET_PETITION` (v9 SC-03a). The append rides on that receipt, as `open_case`'s rides on its case file, and every decline comes before the write because the gate does not restore a docket. The MATTER (`H-63`'s value for this row) is the petition's `terms`, `open_case`'s precedent. [ASSUMPTION; medium; Jordan to correct; revert: the matter is the petition's own id; the stages appended rather than replaced.] The later pairs, `(DocketItem, matter)` and the item's `arrangement` (`None`) and `petition` keys, are check-only (each admits RES in the ACTS class), as on `open_case`."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "argue"
    difficulty:  "routine"
    stratum:     "social"
    capability:  "argue"
    capability_note: "[ASSUMPTION; medium; Jordan to correct; revert: Jordan names the skill] carried over from `rosters.yaml: verb_capability` (`argue` is its own vocation, v10 REM-30)."
    eligibility: ["own"]
    beneficiary: "actor"
    governing:   [attr.social.charisma, attr.social.attunement, attr.mind.acuity]
    opposed_attribute: attr.spirit.will
    governing_note: "B05.25 INTERIM [ASSUMPTION; medium; Jordan to correct at BA1.13]: a hand-off to the social subsystem (R3, R6); B24p.16 writes this row's `proceeds:` cell beside these, B24p.19 deletes `governing:` and `opposed_attribute:`."
    beneficiary_note: "v9 IN-12 step 9 (#453 §9.4: *'beneficiary `actor`'*): THE ARGUER -- he argues for what he holds right; the hearer is the counterparty, not the party served."
    referent_class: Proposition
    referent_class_note: "v10 CP-T05-04 (B10-05, AM-D-05; M19 taken, [ASSUMPTION; medium; Jordan to correct]): FORMED ONLY ON A `Proposition`-CLASSED REFERENT -- the plain referent of the question he answers that is a Proposition (`queries/world_q.py::own_referents_of_class`, REM-21's term, stamps it through `_stamped`; `decision/options.py::opening_set` then forms on the classed ids alone, IN-53 D1's partition), so `subject` binds a Proposition and never a person, a Site, a Record or a rung, while `to` still fans over the persons he knows. The class removes wrong-kind formations only: this row's cell, its eligibility and who may argue to whom are unchanged, and the `Proposition` stamp is NOT widened beyond REM-21's own-referent term and the term T02 CP-T02-05 defines (`tests/test_referent_class_stamps.py`). REVERT: delete this column."
    requires:    "the argued thing is an uttered Proposition, and the hearer is with the arguer"
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      Proposition
        - form:      relation
          of:        to
          relation:  with
    requires_typed_note: "v9 IN-12 step 9 -- #453 §9.4's cell: *`existence` of `subject` kind Proposition ∧ `relation` of `to`, `with`*. `commit`'s `subject` conjunct (the thing argued is an uttered Proposition, in the arguer's reach since IN-11's maker's hold) and `tell`'s `hearer` conjunct (world-only, `ED-IN-0282`). THE CELL BINDS `to` BESIDE `subject`, so `TypedRequires.known_person_operands` names `to` and `decision/options.py::operand_bags` forms one Candidate per person the arguer KNOWS (#453: *'the hearer, by the known-person fan'*) -- `tell`'s and `covenant`'s shape. A computed `argue` on any referent that is no Proposition is refused in the fold (`argument.refused`), as `commit`'s and `covenant`'s are."
    counterparty: to
    counterparty_note: "THE HEARER IS THE SECOND SIDE (#453 §9.4: *'counterparty `to` (the hearer, by the known-person fan)'*): the contest's opponent (`loop/resolve.py::_contest` reads `row.counterparty`), and the person whose pursuits a won argument moves. An argument with oneself is declined person-side and refused by the fold's `counterparty` clause, `tell`'s precedent."
    contests:    "a proposition"
    contests_note: "v9 IN-12 step 9 (#453 §9.4: *'contests: `a proposition` (social_contest, interim `sigma_leverage`)'*): the prize `determine` already claims (`rosters.yaml: contest_subsystems.prizes`), rolled by the social contest module (`social_contest.roll`, steps 13 + 15 repointed the interim). No new prize, no new provider."
    writes:
      Overwhelming: ["Person.pursuits"]
      Success:      ["Person.pursuits"]
      Partial:      []
      Failure:      []
    writes_note: "v9 IN-12 step 9 (#453 §9.4; K-21): `loop/effects_information.py::_eff_argue` MOVES THE HEARER'S `Person.pursuits` -- the ARGUMENT half of `(Person, pursuits)`'s *'moved by argument and consequence, never by evidence'* (#353 §9.3; AX-3), whose CONSEQUENCE half `determine` produces. HOW FAR AND TOWARD WHAT is #453's own [GAP] (*'which weight moves, and toward what'*), answered by the narrowest reading the tree composes on [ASSUMPTION; medium; Jordan to correct; revert: Jordan names the direction]: each pursuit the hearer HOLDS (a weight above zero, `consequence_pursuits`' sense) moves TOWARD THE ARGUER'S OWN WEIGHT on it by `pursuit_shift x DEGREE_STEP[band]` of the gap (`queries/person_q.py::argued_pursuits`) -- the swept `Fixtures.pursuit_shift` (`H-221`) and the one degree ladder `determine` reads, so two moves of one field share one methodology (§0.06 S). `Partial` WRITES `[]`: its magnitude on `DEGREE_STEP` is 0 (*'a held matter moves nothing'*), so declaring the write would turn every Partial into `argument.refused` (`NoOpReceipt`). `Failure` writes nothing (#453: *'Failure → `[]`'*). A won argument that leaves the hearer where he stood (the same weights, none held, or `pursuit_shift` 0) moved nothing and is `argument.refused` at its write (F9)."
    emits:
      Overwhelming: ["argument.won", "pursuit.moved"]
      Success:      ["argument.won", "pursuit.moved"]
      Partial:      ["argument.won"]
      Failure:      ["argument.lost"]
    emits_note: "#453 §9.4's kinds (*'Overwhelming, Success, Partial → `argument.won`; Failure → `argument.lost`'*), plus `pursuit.moved` -- the matrix row's own kind (`write_matrix.yaml` `(Person, pursuits)`), `determine`'s precedent -- on the two bands that write it. `argue` IS THE SECOND EMITTER OF `pursuit.moved`, so the kind is SHARED (`data/verbs.py::KIND_VERB` does not map it) and `align_kind` reads its authored `deed:pursuit.moved` cells, held at `0.0` on every axis (`rosters.yaml: alignment`): a moved pursuit is no deed of the person moved. `test_season_shape.py::test_t2_align_kind_reads_the_one_emitter_and_a_deed_key_needs_an_emitted_kind` is the tripwire for a second emitter."
    emits_on_refusal: ["argument.refused"]
    refusal_note: "v9 IN-12 step 9, #453 §9.4: *'Refusal: `argument.refused` (one kind)'* -- the loader's contested-row rule too (the seam's party-gap refusal emits the row's union): the argued thing is no Proposition, the hearer is not with the arguer, the hearer is the arguer (the fold's `counterparty` clause), or a won argument moved nothing."
    grade:       "assumption"
    grade_note:  "an argued addition (#453 §10.4 step 9): the row, the pursuit direction and the Partial reading are v9 IN-12's, on #453 §9.4 `:1896-1923`, K-21 `:2737-2742`."
    source:      "v9 IN-12 step 9 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.4 `:1896-1923`"
  - verb:        "arrest"
    difficulty:  "routine"
    stratum:     "contested_physical"
    capability:  "arms"
    capability_note: "[ASSUMPTION; medium; Jordan to correct; revert: Jordan names the skill] carried over from `rosters.yaml: verb_capability` (lane A's row, D-U1-07)."
    eligibility: ["remit:dispatch"]
    eligibility_note: "v9 IN-12 step 5 (#453 §9.1): `remit:dispatch` -- the act `state/gate.py::WARRANT_ACT` names, so the fold's eligibility and the gate's `warrant` basis read one grant. J-8 (whether `dispatch` is a remit act at all, `offices.yaml` `meta: remit_unruled`) is Jordan's; this row moves with `WARRANT_ACT` and the ruling. Built on `remit_default` (§A v9)."
    beneficiary: "none"
    governing:   [attr.body.strength, attr.social.charisma]
    opposed_attribute: attr.body.strength
    governing_note: "B05.25 (`proposals/2026-11-13-verb-governing-attributes.md` §2) [ASSUMPTION; medium; Jordan to correct at BA1.13]."
    beneficiary_note: "#453 §9.1: `none` -- custody is taken AGAINST the prisoner and FOR the seat that issued the warrant (K-17/K-52), an Office no Candidate carries; `seize`'s and `revoke`'s shape."
    requires:    "the subject is a person"
    requires_typed:
      form:      existence
      of:        subject
      kind:      Person
      conjunct:  party
    requires_typed_note: "v9 IN-12 step 5 -- #453 §9.1's cell, one conjunct: *'`existence` of `subject` kind Person (conjunct `party`)'*. ⚠ THE WARRANT IS NOT A CONJUNCT, AND THAT IS THE ROW'S OWN TEXT (*'The warrant is not a stem'*): a Record's content, which no form of the grammar reads and no gate basis may (K-52). Person-side it is `rosters.yaml: warrant_sourced` (`arrest: dispensation`, `seize`'s line beside it) -- `arrest` forms only on a `subject` a HELD dispensation's `terms` names (`decision/options.py::opening_set`); world-side the effect (`loop/effects_information.py::_eff_arrest`) reads the same held warrant and declines an act whose actor holds none (`arrest.refused`, the `write` clause). The seat's authority is the gate's `warrant` basis (`state/gate.py::may_warrant`), asked by the effect before it builds the edge, so an admitted act is never killed at the gate."
    counterparty: subject
    counterparty_note: "#453 §9.1: *'counterparty `subject`'* -- THE PRISONER IS THE SECOND SIDE: the contest's opponent (`loop/resolve.py::_contest` reads `row.counterparty`), the man who resists. A self-arrest is declined person-side and refused by the fold's `counterparty` clause (`may_warrant` refuses it at the gate too)."
    contests:    "a standing"
    contests_note: "#453 §9.1: *'contests: `a standing` (`sigma_leverage`, interim) [CONFIDENCE: medium -- whether resisting arrest is a contest of standing or of the body]'*: the prize `tell` already claims (`rosters.yaml: contest_subsystems.prizes`). No new prize, no new provider. [ASSUMPTION; medium; Jordan to correct; revert: a contest of the body, whose Failure hands off to `fight` rather than carrying its own prize.]"
    writes:
      Overwhelming: ["Tenure.since"]
      Success:      ["Tenure.since"]
      Partial:      ["Tenure.since"]
      Failure:      []
    writes_note: "v9 IN-12 step 5 (#453 §9.1): `loop/effects_information.py::_eff_arrest` OPENS ONE `detain` EDGE, prisoner -> THE SEAT THAT ISSUED THE WARRANT, read through `state/attribution.py::causing_act` on the warrant Record's creating Event -- that Act's `via` (K-17/K-52): the enforcement seat acts `via` but does not own the edge, so the issuing seat's bench is who may `pardon` it. Admitted at the gate under the `warrant` basis (`state/gate.py::may_warrant`: the exercised seat sits, grants `WARRANT_ACT`, and its purview reaches the prisoner's home). `Partial` opens the edge as `Success` does (#453: *'[ASSUMPTION: no degraded magnitude exists for an edge]'*); no `Tenure.degree` is written (the row does not declare it). `Failure` writes nothing: the man resisted. DECLINES (`NO_CHANGE` -> `arrest.refused`, the `write` clause): no held warrant names the subject; its issuing seat is unreadable or no seat; the subject is already in custody (one live `detain` per prisoner, #453 §8.1 Custody [ASSUMPTION]); or the gate's `warrant` basis would refuse."
    emits:
      Overwhelming: ["arrest.made"]
      Success:      ["arrest.made"]
      Partial:      ["arrest.made"]
      Failure:      ["arrest.resisted"]
    emits_note: "#453 §9.1's kinds, keyed on the ladder's own four names. Two NEW kinds, each emitted by this row alone (`data/verbs.py::KIND_VERB`)."
    emits_on_refusal:
      eligibility:  ["arrest.unauthorized"]
      party:        ["arrest.refused"]
      write:        ["arrest.refused"]
      counterparty: ["arrest.refused"]
    refusal_note: "#453 §9.1: *'eligibility -> `arrest.unauthorized`; party, write, counterparty -> `arrest.refused`'*. TWO KINDS ON A CONTESTED KEYED ROW ARE LAWFUL SINCE v9 IN-12 step 5's PARTY-GAP FOLD EDIT (K-02): the seam's party gap and S27.4's under-1D refusal emit `row.refusal_for(COUNTERPARTY_CLAUSE)` (`loop/resolve.py::_refuse_party_gap`), and the loader's contested-row rule narrows to rows that key no `counterparty` (`data/verbs.py`). ⚠ S27.4's refusal is labelled with the counterparty kind (`arrest.refused`) though it is the actor's pool, not the counterparty, that failed [ASSUMPTION; medium; Jordan to correct; revert: one kind under every key]."
    grade:       "assumption"
    grade_note:  "an argued addition (#453 §10.4 step 5): the matrix row `(Tenure, since)` is the tree's; the row, the issuing-seat reading and the warrant formation are v9 IN-12's, on #453 §9.1 `:1570-1611`, K-17, K-52, K-53."
    source:      "v9 IN-12 step 5 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.1 `:1570-1611`"

    source:      "plan `workplans/2026-09-18-governance-settlement-behaviour-plan_part2.md` 24e (*'Then a `build` row and `_eff_build` minting a Site of a `site_kinds` member'*); r2 `04_MATTER_AND_WORKS.md` §A.7.1 (the Site half of its one-verb `found`); `write_matrix.yaml` `(Site, exists)` (W2/H-41)"
  - verb:        "give"
    stratum:     "social"
    eligibility: ["own", "hold:<record>"]
    beneficiary: "to"
    beneficiary_note: "THE RECEIVER, who a gift is for -- the `to` operand, which this row's typed cell BINDS since plan position `14` (it read `none` while the row was untyped and could carry no `to`, the loader refusing `beneficiary: to` on a cell that binds none). `subject` is the Record."
    requires:    "the actor holds the subject, and the receiver is present where the actor is"
    requires_typed:
      all:
        - form:      relation
          of:        subject
          relation:  held_by
        - form:      relation
          of:        to
          relation:  with
    requires_typed_note: "⚠ v9 IN-12 (`give` + Rung, #453 §9.6) DROPPED THE `existence` CONJUNCT AND MOVED THE OBJECT'S KIND TO THE EFFECT, `seize`'s precedent (v9 IN-13): the typed grammar has no disjunction, and `existence` of `subject` kind `Record` refused every Rung, so *a Record or a Rung* cannot be spelt. The cell keeps the two conjuncts that carry the licence (`held_by`, `with`); `_eff_give` declines a subject that is neither a Record nor a Rung (`give.refused`, the `write` clause), and the gate's `handover` still admits only a non-seat `hold`, so a seat handed over is `NotYours`. ⚠ IT LOOSENS FORMATION (#453 §9.6 says so): the cell no longer filters on what the subject IS, so `rosters.yaml: own_hold_declines` carries `give` too -- the person-side reading of the `held_by` conjunct, which keeps a person from forming a gift of a referent he does not hold. [ASSUMPTION; medium; Jordan to correct; revert: restore the `existence` conjunct (`kind: Record`) and drop `give` from `own_hold_declines`; the Rung half is then unformable.] THE REST OF THIS NOTE IS PLAN POSITION `14`'S AS WRITTEN, ITS FIRST CONJUNCT NOW GONE: PLAN POSITION `14` (U7-own) TYPED THIS CELL AND RETIRED `loop/predicates.py::_req_give`, WHICH IS WHAT MAKES A GIFT FORMABLE. It was `none` FOR THE GRAMMAR'S REASON: the co-location conjunct had no stem (*'IF A PERSON-TO-PERSON CO-LOCATION STEM IS EVER RULED, THIS IS THE CELL WAITING FOR IT'*), and the telling workplan's `T4` built exactly that stem, `with` (`data/requires.py: REQUIRES_STEMS`, `relation` of `to` -- `tell`'s `hearer`). THREE CONJUNCTS, `_req_give`'s four clauses less the one the fold now owns, each on an existing form and stem: `existence` of `subject`, `kind: Record` (clause 1, `give` hands on a DOCUMENT -- the `handover` basis is general over every non-seat `hold`, and this row narrows the verb); `relation` of `subject`, `held_by` (clause 2, the actor holds it -- `succeed`'s and `found`'s cell; `hold_force`'s raise on two live holders is not asked here because the gate's `handover` makes two unreachable); `relation` of `to`, `with` (clause 4, the receiver stands where the actor does -- UNKNOWN for a receiver who is no person, so `_req_give`'s *a person* rides here too). Clause 3, *a person other than the actor*, is `ED-IN-0210` ruling 1's second party and is the FOLD's (`loop/resolve.py::_admits`, the `counterparty` clause, `14`), not this cell's: the grammar has no negation. ⚠ THE CONSEQUENCE: the cell binds `to` BESIDE `subject`, so `TypedRequires.known_person_operands` names `to` and `decision/options.py::operand_bags` forms one Candidate per person the giver KNOWS (`known_persons`, `tell`'s primitive) -- the topic is the referent (the Record) and the receiver is somebody known, never the referent. `with` is WORLD-ONLY, so a giver forms the Candidate on whom he knows and the fold refuses an absent receiver."
    counterparty: to
    counterparty_note: "THE RECEIVER. Since plan position `14` the typed cell binds `to`, so every Candidate carries it (from `operand_bags`' known persons) and `opening_set` declines only a gift to oneself, as it does a petition; the FOLD refuses the same case for a hand-built act (`_admits`' `counterparty` clause). BEFORE `14` the row was UNTYPED and this column made `opening_set` form NONE -- MEASURED then: 3 person-formed `give`s in `headless.run(3, 0)` and 41 in `populated.run(2, 0)`, every one `give.refused` for want of a receiver, which is the scene tax the column existed to stop."
    writes:      ["Tenure.until", "Tenure.since"]
    writes_note: "ONE PER SIDE, `confer`'s pair: the giver's `hold` closes (`Tenure.until`) and the receiver's opens (`Tenure.since`), in ONE effect (`loop/effects.py::_eff_give`), so the fold never sees two live holders. The gate admits the close as `T-m` and the open as `handover` (`state/gate.py`), and the second requires the first IN THE SAME WRITE -- release-before-mint is the gate's condition, not the effect's habit (r2 `05` row 6, ⊕ R14). No `write_matrix.yaml` row is added: both pairs exist."
    emits:       ["record.given", "rung.ceded"]
    emits_on_refusal: ["give.refused"]
    emits_note: "v9 IN-12 (`give` + Rung): `rung.ceded` is the Rung half's kind (the cession of a rung `hold`), `seize`'s `rung.seized` beside it -- each half's subjects earn their own kind (`Subject.earns`), so a handed Record never publishes a ceded rung, and the dominance roster (`rosters.yaml`) lists the taking and not the gift. [ASSUMPTION; medium; Jordan to correct; revert: the Rung half emits `record.given`.] ⚠ `record.given` IS A NEW KIND, AND IT MUST NOT BE `record.created` OR `tenure.opened`/`tenure.closed`. `epistemic.py::_ch_chronicle` broadcasts every kind a `binding_decision` row emits and `_ch_post_remit` every kind a `remit:`-eligible row emits, both by kind; `confer`, `revoke` and `release` emit the tenure kinds and `issue` shares `record.created`'s family, so reusing either would make every handover in the realm public. `record.given` is emitted by this row alone, `social` and `own`-eligible, so neither channel reads it."
    grade:       "ruled"
    grade_note:  "RATIFIED PROGRAM POSITION 16 -- *one two-party verb ... `own` + `hold:<record>` eligibility, writing the holder's `hold` closed and the receiver's open* -- named against `architecture/VOCABULARY.md` (no row for give, grant, hand, convey or deliver; checked again at the build), and the gate's basis for the receiver's edge settled at G3's pre-flight (`ED-IN-0277`). `hold:<record>` is a PLACEHOLDER and declines on both sides (`H-75`); `own` admits first, as `transfer`'s `own | hold:<store>` does."
    source:      "plan `workplans/2026-09-18-governance-settlement-behaviour-plan_part2.md` position 16 (≡ `15a`); r2 `proposals/2026-09-17-governance-and-holdings-r2/02_THE_WRIT_AND_THE_WORD.md` §A.7 (the row, the predicate, the name); `hole_register.yaml` H-84"
  - verb:        "issue"
    scale:   "province"
    scale_note: "a Dispensation's `scope` enumerates executors -- §37.1 -- so its reach is the domain the issuer governs"
    stratum:     "binding_decision"
    eligibility: ["remit:issue"]
    beneficiary: "none"
    requires:    "scope enumerates executors, not places (§37.1)"
    requires_note: "⚠ EVALUABLE SINCE PLAN POSITION `19`, AND SO `issue` IS RESOLVABLE (it had the effect since `15`). This note read *'STILL PROSE, AND THAT IS WHY `issue` IS NOT RESOLVABLE EVEN WITH AN EFFECT'*: the fold raised `Unspecified` on the prose and `resolvable_verbs()` excluded the verb. ⚠ r2 `02` §A.6's proposal -- `commit`'s `existence of subject kind Proposition` -- is NOT taken: the prose says nothing about the terms, and a computed act binds `subject` and `to` to the question's ONE referent (`H-94`), so the Proposition conjunct and the executor conjunct could never hold at once and every computed `issue` would refuse -- `confer`'s 100% at `★`, for a clause the row does not state. ⚠ PLAN POSITION IN-10 SEPARATED THE TWO (`requires_typed_note`: `to` fans over known persons), and the Proposition conjunct is STILL not taken: the prose still says nothing about the terms, and a writ's `terms` may name a person or a Record (a warrant), not only a Proposition (#453 §10.1)."
    requires_typed:
      all:
        - form:      existence
          of:        to
          kind:      Person
          conjunct:  executors
        - form:      basis
          of:        to
          basis:     purview
          conjunct:  authority
        - form:      own_ledger
          of:        subject
          conjunct:  terms
    requires_typed_note: "⚠ PLAN POSITION IN-10 (#453 §10.1, *`issue` joins the known-person fan for `to`*) ADDED `terms`, THE CELL'S THIRD CONJUNCT (with `executors` and `authority`, below), AND ITS JOB IS TO BIND `subject`. A computed `issue` bound `subject` and `to` to the question's ONE referent, so every writ's `terms` named its own executor (`loop/effects_information.py::_eff_issue`) -- and a warrant read off such a writ would have the holder arrest himself. A cell binding `subject` beside `to` puts `to` in `TypedRequires.known_person_operands` (`data/requires.py`: the fan is empty for a cell binding `to` alone), so `decision/options.py::operand_bags` forms one `issue` per person the issuer knows and `data/verbs.py::act_key` keys each act by `subject>to`: the referent is the writ's `terms`, a known person its executor. [ASSUMPTION; medium; Jordan to correct; revert: an unpriced `terms` clause, which the grammar cannot write (a keyed row names every conjunct, and no form holds of every referent)] WHAT THE CONJUNCT ASKS: the issuer HOLDS A CLAIM ON THE TERMS (`own_ledger`, §F.24a form 6, `tell`'s form) -- a writ is about something its issuer knows of. It is the weakest clause the grammar can write on a referent of any class: a `claim_landed` referent is a claim the issuer holds, so it never refuses one. Refused, it is `issue.refused` -- the issuer, not the seat, said no. ⚠ TWO SHAPES CONSIDERED AND NOT TAKEN: the seat's purview over the terms (`Basis` `purview`) REFUSES A PROPOSITION, which has no place -- so a covenant dispensation, whose `terms` is a Proposition (#453 K-54, `commit`'s route), could never be issued; and r2 `02` §A.6's `existence of subject kind Proposition` refuses a warrant, whose `terms` is a person (#453 §10.1, `arrest`/`seize`). ⚠ A NAMED `own_ledger` CONJUNCT CARRIES `said` (`decision/options.py::opening_set`, telling `T4`), and a Candidate with nothing to say is declined: an `issue` act's payload holds the issuer's newest claim on the terms. Nothing reads it off an `issue` -- WITNESS reads `said` on `news.told` only, and the mint reads the kind's keys -- except `decision/choose.py::declare_intents`, which treats any act carrying `said` as a telling at a swept `intent_disclosure` > 0 (shipped 0). The Person clause stays on the executor alone: `terms` may name a person, a Record, a place or a Proposition. THE OTHER TWO CONJUNCTS, which the fold refuses (§F.24a calls this cell *'a constraint on the well-formedness of the Act'*). `executors` -- *scope enumerates EXECUTORS, not places*: the addressee (`to`, the dispensation's addressee key) exists and is a PERSON, so a writ addressed to a rung is refused. `authority` -- `Basis` (§F.24a form 7) with the `purview` rule: the issuing seat's purview reaches where the executor lives -- the row's `scale_note`, *'its reach is the domain the issuer governs'*, and `04:330`, purview asked of the seat exercised. ⚠ ONE EXECUTOR PER ACT: `existence` reads one id, and `decision/options.py::_from_content_claim` collapses a held writ's addressee list to its one member or declines; a hand-built act naming several is outside what this cell can ask."
    counterparty: to
    counterparty_note: "PLAN POSITION `19`: THE EXECUTOR IS THE SECOND SIDE, AND AN ISSUER IS NOT HIS OWN. `petition`'s precedent exactly: its typed cell binds `to`, and `opening_set` forms no Candidate whose `to` is the person -- a writ a man addresses to himself would EXECUTE (he is a person, and his seat's purview reaches his own home) and mint a document that orders nobody, a constant scene tax the fold could never refuse."
    writes:      ["Record.exists"]
    emits:       ["dispensation.issued"]
    emits_on_refusal:
      eligibility: ["issue.unauthorized"]
      executors:   ["issue.refused"]
      authority:   ["issue.unauthorized"]
      terms:       ["issue.refused"]
      write:       ["issue.refused"]

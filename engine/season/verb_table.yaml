    beneficiary_note: "who a determination FAVOURS is the `judging_set`, which `requires` itself records as *D11, absent*. The determination binds the party it names (`counterparty:`, below), but a finding is taken AGAINST the party and FOR no carrier the Candidate holds (the bench's seat), `revoke`'s and `dispatch`'s shape, so `none` stands."
    requires:    "a fired Date with a DocketItem; judging_set — D11, absent"
    requires_note: "EVALUATED AS THE TYPED CELL BELOW (plan position `19`, U7-remit), AND THE READING OF EACH HALF IS STATED. *A fired Date with a DocketItem* is read as `existence` of a DocketItem naming the matter -- the proceedings design's own corrected cell (`proposals/2026-09-05-proceedings-subsystem/04_VERBS.md` §B.2: `{form: existence, of: subject, kind: DocketItem}`), which drops the date: the cell reads only that the matter is docketed, dated or not (v9 SC-01: `_eff_convene` gives its Date the convener's seat as holder, CALENDAR forms the slot and `open_case` fills it via `world_q.slot_for`), and the bench is ASKED about a sitting's matters by `world_q.questions_for` (`sittings_before`). *judging_set* is two conjuncts: the seat exercised SITS ON THE BENCH for the party (`basis: bench`, the write gate's own `may_determine` -- `judging_set`'s containment test, `H-32`'s default, asked of the party's home), and the bench MEETS QUORUM (`bench.size >= quorum`, the fixture `bench_quorum`, `H-161`). `D11` is `H-32`, so the grade is `assumption`. The subject must be a PERSON (`party`): the disposal is an edge he owns."
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      Person
          conjunct:  party
        - form:      existence
          of:        subject
          kind:      DocketItem
          conjunct:  docket
        - form:      basis
          of:        subject
          basis:     bench
          conjunct:  bench
        - form:      scalar_threshold
          of:        subject
          scalar:    "bench.size"
          threshold_predicate: quorum
          conjunct:  quorum
        - form:      scalar_threshold
          of:        subject
          scalar:    "declared.votes"
          threshold_predicate: "declared.quorum"
          conjunct:  vote
    requires_typed_note: "FIVE CONJUNCTS, EACH NAMED FOR THE KEYED REFUSAL IT EMITS. `party` -- the matter is a person (only a person owns an `oblige`). `docket` -- somebody put the matter before the room (`open_case`, `19`'s other half), read through `world_q.docketed`. `bench` -- `Basis` (§F.24a form 7, `data/requires.py`) with the `bench` rule: the SAME predicate the write gate's `determination` basis asks, so the fold refuses (`determine.refused`) exactly what the gate would raise on. `quorum` -- `scalar_threshold` (form 2) of `bench.size` against the SECOND READ `quorum`, `work`'s `floor` shape: the bench's distinct seated members against the fixture, with NO operand added to `cardinality` (`21_RECONCILIATION.md` A.1) and NOTHING STORED (C-7: *'no stored tally'*). QUORUM IN ITS ORDINARY SENSE -- the members a bench needs to sit -- NOT C-7's vote threshold. `vote` (v11 CR-34, last, so a refusal before it reads exactly what it read): `scalar_threshold` of `declared.votes` (distinct bench members holding a LIVE `commit` to an OUGHT whose subject is the party and whose predicate names the kind the matter's arrangement row `disposes:`, `world_q.declared_votes`, computed when read and stored nowhere) against `declared.quorum` (that row's own `quorum:` key). Both read 0 for a matter heard under no declared row, so the conjunct is vacuous there (it still records its two 0-valued reads on the Event, which is hashed); only `excommunication_deliberation` declares one. `quorum` is the bench SITTING and `vote` the bench CONCURRING [ASSUMPTION; medium; Jordan to correct; revert: any Proposition about the party]. AT THE SHIPPED `bench_quorum = 1` THE QUORUM CONJUNCT CANNOT REFUSE an actor the bench admitted (he is a member): the observable *below quorum, `determine.refused`* is run at 2 and 3 (`tests/test_u7_remit.py`)."
    counterparty: subject
    counterparty_note: "PLAN POSITION `19`: THE PARTY IS THE SECOND SIDE (`ED-IN-0210` ruling 1, *a real interaction has a COUNTERPARTY*), and a judge does not bind himself -- `may_determine` refuses it at the fold and the gate. Declined person-side here, on `petition`'s precedent, so a self-determination is never formed: no read the fold makes can teach a person *that is you*, so a refusal would only tax his scenes."
    contests:    "a proposition"
    contests_note: "v9 SC-03b (#453 §10.4 step 4, ED-IN-0288 as INTENT): `determine` is a CONTESTED act through the social contest scene's `social_contest` provider, the prize `a proposition` (`rosters.yaml: contest_subsystems.prizes`, a row no verb claimed until now). ONE ROLL OWNER (S27.2): the roll is the module entry `social_contest.roll`; the host (`seam/wrappers/sigma.py`) builds the input and produces none. The OPPONENT is the row's `counterparty:` operand (`subject`, the party), read by `loop/resolve.py::_contest` as `tell`'s hearer is, so the judge (the actor) rolls against the party; the pool is the judge's `pool_default` (`determine` has no `verb_capability` row, so it falls to the default, `H-126`'s polarity) and the obstacle is the row's difficulty plus the stand-in `opposed_ob(pool_default)` (B05.14; was `obstacle_default`) under `H-213`'s ceiling for EVERY party: `seam/wrappers/sigma.py::_opposition_of` finds no `verb_capability` key to read on the party (the party is named, and the roll is the same for every party). The band is the one ladder's reading of the margin (`seam/ladder.py::degree_of`); this row adds no ladder, no band table and no special case. [ASSUMPTION; medium; Jordan to correct; revert: the flat `writes:`/`emits:` and no `contests:`, the row before SC-03b.]"
    writes:
      Overwhelming: ["Tenure.since", "DocketItem.matter", "Tenure.degree", "Person.pursuits"]
      Success:      ["Tenure.since", "DocketItem.matter", "Tenure.degree", "Person.pursuits"]
      Partial:      ["Tenure.since", "DocketItem.matter", "Tenure.degree"]
      Failure:      []
    pursuits_note: "v9 SC-02 `22b` step 24 (`proposals/2026-09-05-proceedings-subsystem/19_PLAN.md` step 24, *conviction moves by consequence*; the plan's `convictions` is `(Person, pursuits)` since `ED-IN-0261` item 1): `Overwhelming` and `Success` ALSO write the DETERMINER'S OWN `Person.pursuits`, check-only beside the edge (the same effect, `_eff_determine`, moves each held pursuit by `pursuit_shift x DEGREE_STEP[band] x pursuit_lean(determine, pursuit)`, `queries/person_q.py::consequence_pursuits`), earning `pursuit.moved` only when a pursuit moved. `Partial` (the held matter) moves nothing and so declares nothing. `Failure` (the plan: *moves the determiner AGAINST their own axis*) is NOT BUILT (`hole_register.yaml` H-221): a write there gives the failed hearing's Event a change, so its witnessed claim leaves the party for the judge, the scar runs on an act that did nothing, and a judge holding no leaning pursuit would refuse instead of failing. [ASSUMPTION; medium; Jordan to correct; revert: drop `Person.pursuits` and `pursuit.moved` from both bands, `pursuit_shift = 0`.]"
    writes_note: "v9 SC-03b: DEGREE-KEYED, on `04_VERBS.md` §B.2's row (design intent; the code decides). `Tenure.degree` is written (H-162): a CONTESTED act carries a degree (`loop/resolve.py::_fold`), an uncontested one does not. `loop/effects_information.py::_eff_determine` opens the kind the docketed arrangement `disposes:` (v9 SC-03a: `oblige`, `detain` or `ban`; an `oblige` when the docket names no row) owned by the party on the seat exercised, admitted at the gate under the `determination` basis (`state/gate.py::may_determine`), and sets the opened edge's `degree` to the band the contest decided (`Resolution.degree`). `Overwhelming`, `Success` and `Partial` declare the SAME three pairs: `Tenure.since` is the first (the opening, `21_RECONCILIATION.md:575`'s observable); `DocketItem.matter` and `Tenure.degree` are check-only (the same effect takes the matter off the docket and grades the edge it opened). `Partial` opens the disposal graded `Partial` (`proposals/2026-10-03-verb-coverage-and-gap-fill.md:2070`, the plan's SOURCE: *Partial convicts under the one `Partial` rule*; `arrest` reads it the same way, `:1588`). `04_VERBS.md` §B.2 writes `Partial: Tenure.degree` alone, which the gate makes unbuildable: THE GATE ADMITS A `Tenure.degree` WRITE ONLY ON AN EDGE THE WRITE OPENED (`determination` asks `opened` first, `state/gate.py`'s `determination` basis (`opened` asked first): authority to bind is not authority to re-grade, `test_19_determination_opens_only_a_disposed_kind_and_closes_only_a_restraint`), so a Partial that wrote only a degree has no edge to grade. The declared column therefore names what the one effect body does. [ASSUMPTION; medium; Jordan to correct; revert: `Partial: [Tenure.degree]`, which under-names the opening.] `Failure`: `[]` -- the bench did not carry the matter, nothing opens, the matter stays on the docket, `matter.undetermined`."
    emits:
      Overwhelming: ["matter.determined", "pursuit.moved"]
      Success:      ["matter.determined", "pursuit.moved"]
      Partial:      ["matter.determined"]
      Failure:      ["matter.undetermined"]
    emits_note: "v9 SC-03b: §B.2's emissions, keyed on the ladder's own four names (`speak`'s shape). `matter.undetermined` is the Failure band's kind: the room heard the matter and did not dispose of it, which a witness reads differently from a refusal (`determine.refused`: the act never reached the contest)."
    emits_on_refusal:
      eligibility: ["determine.refused"]
      party:       ["determine.refused"]
      docket:      ["determine.refused"]
      bench:       ["determine.refused"]
      quorum:      ["determine.refused"]
      vote:        ["determine.refused"]
      write:       ["determine.refused"]
      counterparty: ["determine.refused"]
    refusal_note: "KEYED PER CLAUSE (`04 §B.13` invariant 4's per-conjunct half, F7; `data/verbs.py` checks the keys are exactly this row's failable clauses), BUT ONE KIND: `determine.refused` under every key (v9 SC-03b). The row is contested, and the loader refuses a contested row keying more than one refusal kind unless it keys `counterparty` (`data/verbs.py`, invariant 4's contested half: the seam's party-gap refusal, `loop/resolve.py::_refuse_party_gap`, no clause names, and it emits the UNION, so two kinds would publish a kind for a clause that did not fail; v9 IN-12 step 5 narrowed this for a row that keys the counterparty clause, as `arrest` does). The keys stay -- they are the failable clauses, and the fold reads `row.refusal_for(clause)` -- and they all answer alike. What is lost: the SEAT's `determine.unauthorized` (none exercised grants `determine`, or the one exercised does not sit in judgment over the party) is not split from the WORLD's `determine.refused` (the matter is no person, is on no docket, the bench is below quorum, the vote falls short of a declared row's `quorum:`, or the effect found nothing to open); the reason survives on the Event's `observed` for the `bench` conjunct only, and an eligibility refusal carries none (`loop/resolve.py`'s ineligibility return is `Verdict(UNKNOWN, ())`). [ASSUMPTION; medium; Jordan to correct; revert: the two-kind keys, and the row uncontested.] ⚠ `determine.unseated`, the proceedings design's second kind (`04_VERBS.md` §B.2), is NOT taken: read cold it names an Event in which somebody was UNSEATED -- `revoke`'s outcome -- which is the opposite of a refusal (`CLAUDE.md` §4). The design's struck `determine.unheard` (P-23) stays struck. The S27.4 refusal (`Ob > 2 x Pool`, a judge whose pool is under 1D) takes this kind too, as `speak`'s does. THE ROW NAMES `counterparty: subject`, AND THAT CLAUSE (`loop/resolve.py::_admits`, asked only AFTER the precondition passes) CAN NEVER FIRE FOR THIS ROW: a self-determination is refused by the `bench` conjunct (`may_determine`, `state/gate.py` conjunct 2, *a judge does not bind himself*) and an act naming no subject dies at `party`, both as `determine.refused`. The `counterparty:` key under `emits_on_refusal` is in `data/verbs.py`'s expected set BY DERIVATION from the row's `counterparty:` column, so the loader refuses a keyed row without it: THE LOADER CANNOT JUDGE REACHABILITY, only that a key names a clause the row derives."
    grade:       "assumption"
    grade_note:  "`assumption`, not `ruled`: `judging_set` is built (`H-32`, graded `assumption`) and the quorum is a swept fixture (`H-161`)."
    source:      "ARCHITECTURE_V2.md §E3, transcribed; precondition, disposal, keyed refusals and writes at plan position `19` (`workplans/2026-09-18-governance-settlement-behaviour-plan_part2.md` `19 — INSTRUCTION`; `21_RECONCILIATION.md:575`)"

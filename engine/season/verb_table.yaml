    emits_on_refusal: ["exchange.refused"]
    grade:       "assumption"
    writes_note: "`(Rung, stores)` x2, one per side -- as `transfer`"
    effect_decline_note: "PLAN POSITION `14` (U7-own) DECLINED IT, FOR THIS ROW'S OWN REASON (`requires_typed_note`): the second side's matter kind and quantity have no names in the closed `requires_operands`, and `T4`'s `operand_bags` supplies a known PERSON for `to`, not what he gives back. Typing one side is the `_req_confer` defect; coining the names is filling `H-94` by keyword argument -- a second binding mechanism this position may not build."
    source:      "W3 -- #353 `:1899` names it and Part E omits it. Modelled on `transfer`, whose scarcity property (§27.1) it must share: the second party on an emptied larder gets a DIFFERENT Event, not a raise."
  - verb:        "forge"
    stratum:     "uncontested_material"
    eligibility: ["own"]
    beneficiary: "actor"
    beneficiary_note: "the forgery is minted into the FORGER's hand (`_mint_document`'s maker's `hold`), `survey`'s carrier: he holds it to plant it (`give`)."
    requires:    "the forger has heard of what he forges a sheet on, and it coheres under one faction"
    requires_typed:
      form:      own_ledger
      of:        subject
    requires_typed_note: "v9 IN-45: `survey`'s cell, for `survey`'s reasons (its `requires_typed_note:`) -- #453's row for the verb, *'a faction the forger holds a claim on (`survey`'s cell)'*. `own_ledger` of `subject` carries `subject` onto a computed act, which is what makes the row TYPED: plan position `14` declined the effect because an untyped row carries nothing, so a computed `forge` had no faction to forge a sheet on. THE KIND IS THE VERB'S, NOT AN OPERAND: a forgery is a `faction_sheet` (`loop/effects_information.py::_eff_forge`), supplied by the verb that knows it as `issue`, `petition` and `survey` supply theirs -- `requires_operands`' `kind` is a MATTER kind and is not bound, and no ninth operand is coined. *It coheres under one faction* is the effect's decline, `survey`'s."
    writes:      ["Record.exists", "Record.forgery_quality"]
    writes_note: "one mint, `survey`'s: `_mint_document` writes the Record whole -- the sheet `faction_q.resolve` gives, with the forger as its `head` -- with the forger's `hold` riding on its receipt (`T-m`). `Record.forgery_quality` (check-only, the same mint) RETURNED AT v9 SC-02 `22b` step 25 WITH ITS READER (`H-210`): the Record carries `Fixtures.default_forgery_quality`, and an inquiry examining it carries that quality into its roll's obstacle (`seam/wrappers/sigma.py::contest_input` -> `modules/social_contest/roll.py::obstacle`). It left at v9 IN-45 because a pair written and read by nothing is `ID-13`'s defect. [ASSUMPTION; medium; Jordan to correct; revert: drop the pair, the writer and the reader together.]"
    emits:       ["record.forged"]
    emits_note: "v9 IN-45: `record.created` -> `record.forged`, the kind the matrix names for a forgery (`write_matrix.yaml`'s `(Record, forgery_quality)` row), so the row and the matrix agree; it joins `(Record, exists)`'s `emits:` in the same commit, the column this row writes, as `faction.surveyed` did for `survey`. Its own kind for `survey`'s reason (`faction.surveyed`'s `emits_note:`): a forgery is a private act, and neither broadcast channel reads it. Witnesses learn THAT a document was made; that it is false, nobody learns from the Event."
    emits_on_refusal: ["forge.refused"]
    refusal_note: "FLAT: one kind for every failable clause (`data/verbs.py`, invariant 4). Refusal conditions, `survey`'s: the forger holds no claim on the subject (the cell); the subject coheres under no single faction (the effect's decline, the `write` clause)."
    grade:       "assumption"
    grade_note:  "an argued addition: the matrix rows `(Record, exists)` and `(Record, forgery_quality)` are the tree's; the cell, the kind and the false key (`head`) are v9 IN-45's, on #453 `:515`. The forged sheet's CONTENT is read -- the sheet consumer, `rosters.yaml: record_sourced_operands.faction_sheet` -- and since v9 SC-02 `22b` step 25 its `forgery_quality` too, by the examination's obstacle (`H-210`)."
    source:      "ARCHITECTURE_V2.md §E3, transcribed; typed and effected at v9 IN-45 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) `:515` and `:557`"
  - verb:        "forgive"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "subject"
    beneficiary_note: "v9 IN-12 step 13 (#453 §9.4: *'beneficiary `subject`'*): THE ONE FORGIVEN -- the referent the forgiver stops holding his rows against. Structural only: a faction's Proposition or a person, whoever the rows named."
    requires:    "—"
    requires_note: "#453 §9.4: *'requires: — (no precondition)'*. Untyped: a computed `forgive` forms on its question's referents and carries `subject`. ⚠ ONE PERSON-SIDE DECLINE, NOT A PRECONDITION (#453: *'that a negative row naming `subject` exists is a read of the actor's own state (`p.stance`), so it is a person-side decline in `opening_set`, not a stem'*): a person forms `forgive` only on a referent he holds a row against (`rosters.yaml: own_stance_declines`, read in `decision/options.py::opening_set` through `queries/person_q.py::held_against`). A hand-built act is not declined by the formation; the effect refuses one with nothing to end (`forgive.refused`)."
    writes:      ["Person.stance"]
    writes_note: "v9 IN-12 step 13 (#453 §9.4; K-41, K-49): `loop/effects_combat.py::_eff_forgive` REMOVES THE ACTOR'S OWN `Person.stance` ROWS NAMING `subject` WITH A VALENCE BELOW ZERO (`queries/person_q.py::held_against`, the one reader) and nothing else -- his positive rows toward the same referent and every row toward any other referent stay. A stance row carries no kind, so the write ends EVERY negative row toward the referent: a field's grudge (`_eff_march`'s `(winner faction, -1.0, field_grudge_weight)`), the morale row `_eff_march` writes toward the loser's own faction, a seeded disloyalty (K-49: *'to forgive is to stop holding a thing against someone, whatever it was'*). The matrix row admits RES and already has a producer (`march`), so no `unproduced:` declaration is touched. No fade (#453 R-9 (a), adopted by the plan): a grudge ends by its holder's act, never by MATTER."
    emits:       ["stance.moved"]
    emits_note: "#453 §9.4: the matrix row's declared kind (`write_matrix.yaml` `(Person, stance)`), emitted by this row alone (`march` emits its field kinds), so `data/verbs.py::KIND_VERB` maps it here and a witnessed forgiveness is judged at this row's alignment cells -- none authored (`rosters.yaml: alignment`, `uncelled:`), so 0.0 on every axis."
    emits_on_refusal: ["forgive.refused"]
    refusal_note: "#453 §9.4: *'refusal flat, `forgive.refused` (no negative row -> `NO_CHANGE`)'*: the actor holds no row against the referent, or is no person. One flat kind; no precondition, so the refusal is the effect's decline."
    grade:       "assumption"
    grade_note:  "an argued addition (#453 §10.4 step 13): the matrix row `(Person, stance)` is the tree's; the row, its reach (K-49) and the own-state decline are v9 IN-12's, on #453 §9.4 `:1970-2047`, K-41 `:2942-2949`, K-49 `:2998-3009`, R-9 (a) `:3348-3353`."
    source:      "v9 IN-12 step 13 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.4 `:1970-2047`"
  # ===========================================================================================
  # PLAN POSITION `24e` -- WORKS & FOUNDING. `ARCH` F.20 (`04_CODE_ARCHITECTURE.md`): *"the world
  # only decays -- nothing is ever founded or built"*. `(Rung, exists)` and `(Site, exists)` were
  # declared matrix rows with no producer (`H-41`); these two rows are the producers. Both make what
  # a WORKS plans (`rosters.yaml: record_kinds`, `works: [plan, at]` -- *"a <plan> at <at>"*), which
  # `create_record` declares and its maker holds: the works carries the kind and the place, which
  # the closed operand vocabulary cannot (`at` is no `requires_operands` member and must not
  # become one), so each act's only operand is `subject`, the works.
  # ⚠ TWO VERBS, NOT r2's ONE. r2 `04` §A.7.1 folds both into one `found` writing two rows, one
  # earned per act, citing round one's *"there is no `build`"*. The plan's `24e` (2026-09-25, later
  # and the position's own text) names both -- *"a `found` row and `_eff_found` ... Then a `build` row
  # and `_eff_build`"* -- and says why they are two: *"A founded hearth has no dwelling until one is
  # BUILT"*. They make different carriers (a Rung and its `contain` edge; a Site, which has no edge),
  # admit different gate bases (`founding`; none), and a person founding a hearth and a person
  # raising a house in it are different acts with different preconditions on the plan's kind.
  # ⚠ NEITHER CARRIES A CAPACITY REFUSAL (the plan's CORRECTION, 2026-09-25): they are how capacity
  # GROWS; a `found` refused at a full rung would deadlock it. The refusal is `19c`'s `migrate`'s.
  # ===========================================================================================
  - verb:        "found"
    stratum:     "uncontested_material"
    eligibility: ["own"]
    beneficiary: "none"
    beneficiary_note: "a founded place is a Rung, and a Rung is no carrier the Candidate holds; who benefits from a new hearth is whoever comes to live or hold there, a WORLD read, which is `restore`'s and `work`'s shape. ⚠ SINCE v9 IN-28 the founder's `hold` on the new Rung IS minted (`H-166` limit 2, `loop/effects_founding.py::_eff_found`), and the column stays `none`: the holding is a Tenure the effect opens, not a Candidate carrier."
    referent_class: Record
    referent_class_note: "v10 REM-25 (B10-05, AM-A-10; M19 taken, [ASSUMPTION; medium; Jordan to correct]): FORMED ONLY ON A `Record` THE PERSON HOLDS, as `carry` (`queries/world_q.py::records_held_for_holding_rows` stamps it, `HOLDING_RECORD_KINDS` holding `works` for this row; `decision/options.py::opening_set` forms on the classed ids alone). DECLARED SIDEWAYS MOVE, NOT PROGRESS: no computed act declares a works (ED-IN-0297), so the base's formation on every referent -- always refused -- becomes a formation on a held Record that is never a works in the realm: always-refused becomes never-attempted. THE CLASS IS SHARED, so one class cannot tell a works from a petition: a held petition is a Record this row forms on, and the fold refuses it on `exists:works=0`. MEASURED before the class (`f2381695`, `aperture 1 s`, realm arm, s = 0/1/2): formed for 83 of 83 persons, attempted 11/14/21, executed 0/0/0, every one refused `found.refused` on the last read `exists:works=0` (11/14/21); those formations stop, and the refusal Events they emitted stop with them, with the WITNESS deposits those carried. READ AFTER (same instrument): formed for 9/4/9 persons -- the holders of a petition, a Record of the wrong sub-kind -- attempted 0/0/0, executed 0/0/0, refused 0/0/0: never attempted (R-05 is not claimed to move). A maker holding a works executes it through the real fold, in a hand-built world only (`tests/test_referent_class_stamps.py`). REVERT: delete this column."
    requires:    "the subject is a works, and the actor holds it -- the maker's standing"
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      works
        - form:      relation
          of:        subject
          relation:  held_by
    requires_typed_note: "PLAN POSITION `24e`, whose CORRECTED text gives `found` exactly *'its own preconditions (well-formed operands, the maker's standing, strict ascent)'* and no capacity refusal. TWO CONJUNCTS, BOTH EXISTING FORMS AND STEMS -- no form, operand, combinator or stem added. `existence` of `subject`, `kind: works` -- a Record OF THAT KIND (`WorldReader.read`'s `record_kinds` branch, `carry`'s route): the WELL-FORMED OPERAND, a works and not any id. `relation` of `subject`, `held_by` -- `succeed`'s live cell: THE MAKER'S STANDING, read as r2 `04` §A.6.2 reads it, the actor holds the works (*'held by the actor'*), which `create_record` mints for its maker and `give` hands on (so a rival may become master of a works and found it). STRICT ASCENT is not a cell: the plan's kind and its `at` live in the works' content, which no stem reads, so `loop/effects.py::_eff_found` declines it through `rung_kind_ascends`, the one owner `add_tenure` raises on (`_eff_move`'s precedent). ⚠ r2 §A.7.1's THIRD CONJUNCT, `matured >= 1`, IS NOT TAKEN: the plan's corrected list omits it, and the grammar cannot spell it without a new stem and a constant threshold read. The terms bind where r2 itself put their teeth -- at the fabric's `ceiling` -- so a plot may be staked before a term ripens and nothing built on it can be raised until one does. ⚠ AND r2's `cardinality` CONJUNCT (one works per target) LIVES AT THE PRODUCER: `create_record` declines a second live works on a target (`queries/world_q.py::works_for`)."
    writes:      ["Rung.exists", "Tenure.since", "Rung.stores"]
    writes_note: "⚠ v9 IN-28 (`H-166` limits 1, 2): `Rung.stores` ADDED, check-only like `Tenure.since` -- the plan's `rosters.yaml: works_cost` stake moves two-sided out of the works' rung (`Record.rung`) into the new Rung, the payer named as a subject so the gate reads its store either side; and the `Tenure.since` pair now covers TWO edges, the `contain` and the founder's `hold` on the new Rung (admitted under `T-m`: the actor opening his own edge on a thing that is no seat). `Rung.exists` is the first pair and the effect's own: the new Rung, whole. `Tenure.since` is the `contain` edge placing it in the works' `at`, opened through `World.add_tenure` in the same `apply` and admitted at the gate under the NINTH basis, `founding` (`state/gate.py`: a `contain` opened for a thing this same write brought into existence, its only parent -- the mirror of `cascade`). Declared on `establish`'s precedent (`Tenure.payload`): the fold gates exactly the pairs a verb declares, so this second pair is checked for class, step and partition; the effect runs once, on the first. No `write_matrix.yaml` row is added: every pair exists -- `(Rung, stores)` is `[MAT, RES]` and `transfer`/`requisition` already produce it -- and `(Rung, exists)`'s `unproduced:` is deleted in the same commit (loader invariant 2)."
    emits:       ["rung.founded"]
    emits_on_refusal: ["found.refused"]
    grade:       "assumption"
    grade_note:  "the matrix row `(Rung, exists)` is the tree's (`W2/H-41`); the VERB is plan position `24e`'s, on r2 `04` §A.7.1's reading, and its preconditions are the plan's corrected list -- an argued addition, graded as `succeed`, `utter` and `forge` are."
    refusal_note: "FLAT: one kind for every failable clause, which a flat row declares (`data/verbs.py`, invariant 4). Refusal conditions: the subject is no works, or the actor does not hold it (the cell); the works plans no `rung_kinds` member, names no rung, has already founded, or its plan does not strictly ascend into its `at`; and since v9 IN-28, the plan has no `works_cost` row or the works' rung cannot pay it (the effect's decline, the `write` clause)."
    source:      "plan `workplans/2026-09-18-governance-settlement-behaviour-plan_part2.md` 24e (as corrected 2026-09-25); r2 `proposals/2026-09-17-governance-and-holdings-r2/04_MATTER_AND_WORKS.md` §A.6.2 moment 3, §A.7.1; `write_matrix.yaml` `(Rung, exists)` (W2/H-41)"
  - verb:        "build"
    stratum:     "uncontested_material"
    eligibility: ["own"]
    beneficiary: "none"
    beneficiary_note: "a built fabric is a Site, and a Site is no carrier the Candidate holds -- `found`'s reason, and `restore`'s and `work`'s: who benefits from a new dwelling or harbour is a WORLD read."
    referent_class: Record
    referent_class_note: "v10 REM-25 (B10-05, AM-A-10; M19 taken, [ASSUMPTION; medium; Jordan to correct]): FORMED ONLY ON A `Record` THE PERSON HOLDS, as `found` and `carry` (`queries/world_q.py::records_held_for_holding_rows`, `HOLDING_RECORD_KINDS`). DECLARED SIDEWAYS MOVE, NOT PROGRESS: no computed act declares a works (ED-IN-0297), so always-refused becomes (nearly) never-attempted. THE CLASS IS SHARED, so one class cannot tell a works from a petition: a held petition is a Record this row forms on, and the fold refuses it on `exists:works=0`. MEASURED before the class (`f2381695`, `aperture 1 s`, realm arm, s = 0/1/2): formed for 83 of 83 persons, attempted 12/13/12, executed 0/0/0, every one refused `build.refused` on the last read `exists:works=0` (12/13/12); those formations stop, and the refusal Events they emitted stop with them, with the WITNESS deposits those carried. READ AFTER (same instrument): formed for 9/4/9 persons -- the holders of a petition -- attempted 0/1/1, executed 0/0/0, refused 0/1/1 as `build.refused`, each on `exists:works=0` of a held petition: NOT never attempted at seeds 1 and 2, the residue of the shared class. A maker holding a works executes it through the real fold, in a hand-built world only (`tests/test_referent_class_stamps.py`). REVERT: delete this column."
    requires:    "the subject is a works, and the actor holds it -- the maker's standing"
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      works
        - form:      relation
          of:        subject
          relation:  held_by
    requires_typed_note: "`found`'s cell, conjunct for conjunct and for `found`'s reasons: a works (the well-formed operand), held by the actor (the maker's standing). No ascent clause -- a Site hangs off its rung by a field, not a ladder edge -- and no capacity refusal (the plan's correction of 2026-09-25: building at a full rung is how its capacity grows). Whether the works plans a `site_kinds` member, names a rung, or has already built is `loop/effects.py::_eff_build`'s decline, the `write` clause."
    writes:      ["Site.exists", "Rung.stores"]
    writes_note: "⚠ v9 IN-28 (`H-166` limit 1): `Rung.stores` ADDED, check-only -- the plan's `rosters.yaml: works_cost` is CONSUMED out of the works' rung (`Record.rung`), one-sided, the payer named as a subject so the gate reads its store either side. No `hold` is opened: a `hold` never reaches a Site (`rosters.yaml: hold_object_kinds`), so a built fabric is held through its rung. `(Site, exists)`'s first producer (`W2/H-41`, *'building a site'*): the Site the works plans, at the rung it names, at condition 0 (r2 §A.7.1: *'a fabric begins at NOTHING'*). `Site.rung`, `Site.kind` and the initial `condition` are the Site's own construction inside this one write -- no `(Site, condition)` pair is declared, as `create_record` declares none for a Record's content; the condition then RISES only through `restore`/`work` on the accumulator. `(Site, exists)`'s `unproduced:` is deleted in the same commit (loader invariant 2)."
    emits:       ["site.built"]
    emits_on_refusal: ["build.refused"]
    grade:       "assumption"
    grade_note:  "`found`'s grade and reason: the matrix row is the tree's, the verb is plan position `24e`'s."

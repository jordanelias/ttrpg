    refusal_note: "PLAN POSITION `19`: KEYED PER CLAUSE (`04 §B.13` invariant 4's per-conjunct half). `issue.unauthorized` -- the SEAT: none exercised grants `issue`, or its purview does not reach the executor. `issue.refused` -- the WORLD: the addressee is no person, the issuer holds no claim on the terms (`terms`, plan position IN-10), or the mint moved nothing. `unauthorized` is `determine`'s word for the same refusal, and its note says why it is not `unseated`. ⚠ PLAN POSITION `14`: `counterparty` -- the writ names no executor or names its issuer -- is the fold's own clause (`loop/resolve.py::_admits`), keyed `issue.refused`."
    grade:       "ruled"
    writes_note: "— (a Dispensation is not a state write — §37.3)  ||  ⚠ W3, ON THE W2 AUDIT: as `petition`. Part E's '(a Dispensation is not a state write)' is the bypass §1.4 hole 4 names, not a licence for one.  ||  ⚠ PLAN POSITION `15`: `Dispensation.exists` -> `Record.exists`. A dispensation is a `Record` of kind `dispensation` (`04_CODE_ARCHITECTURE.md` §B.5, `rosters.yaml: record_kinds`), minted with the issuer's `hold` by `loop/effects.py::_eff_issue`; `(Dispensation, exists)` is deleted from the matrix in the same commit, which the loader requires (an entry naming no row is refused at load)."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"

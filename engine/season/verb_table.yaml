    requires_typed_note: "⚠ TWO-SIDED, PER `ED-IN-0210` RULING 2 (Jordan, 2026-09-10): *`petition` <-> WITHDRAW (petitioner) or DENY (receiver) ... `petition`'s pair is TWO-SIDED (withdraw and deny close the same state from opposite sides), the first in the set where a counterparty is structurally required.* RULING 1 on the same row is what makes each side an EXISTENCE clause: *a fiat needs no counterparty, so nothing checked that the object of an `oblige` was an entity* -- so each named side must BE one, and the grammar's `existence` form is the check. ⚠ THE RECEIVER IS A PERSON, BECAUSE RULING 2 NAMES WHAT THE RECEIVER DOES -- *DENY* -- and only a person acts (AX-1); the next position's `give` (`16`, H-84) moves a Record *to another person*, which is how a petition reaches the hand that may deny it. THE SEAT READING WAS BUILT AND MEASURED, AND REFUSED ON THE MEASUREMENT: with `kind: Office`, `populated.run` seed 0 formed 28, 21, 24, 22 petitions over four seasons and FILED NONE -- no question's referent is ever a seat, so every one was refused, a constant scene tax with nothing behind it. The self-petition that `kind: Person` admits is declined person-side by `counterparty:` (above), not here: the grammar has no negation. `from` is the operand's one meaning (`decision/options.py::_derive_operand`: where the actor is) -- the place the petition rises from, #353 §36.1's *a demand rises from a hearth*. ⚠ WHAT A COMPUTED ACT CANNOT YET SAY: `to` and `subject` both bind the question's ONE referent (`_REFERENT_OPERANDS`), so a computed petition is addressed to the person it is about. That is `H-94`'s single-referent limit, not this cell's choice, and plan position `15c` (content operands) is what separates them."

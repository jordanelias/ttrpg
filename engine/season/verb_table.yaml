    grade:       "ruled"
    effect_decline_note: "PLAN POSITION `14` (U7-own) STOPPED ON IT (`H-182`). ⚠ THE GROUND IS NOT `ID-13` FOR BOTH KINDS (CORRECTED AT THE BATCH C CLOSE): `ID-13`, A CARRIER NOBODY READS, HOLDS FOR `tie` ONLY, because `knot` HAS A READER (below). WHAT STOPS `tie / knot` IS THE PARTNER OPERAND THE ROW DOES NOT BIND (BOTH KINDS) AND, FOR `knot`, THAT IT BELONGS TO `29f`'S KNOTS WORK; `tie`'s own ground is `ID-13` AND that operand. ⚠ AN EARLIER READING OF THIS NOTE WAS FALSE AND IS CORRECTED HERE: it rested on `holonic §15.1` (a tie stored ONCE on the lower id), so a tie by the higher-id party *writes an edge he does not own* and `release` *cannot end it from his side*. 04 §A.3 row 9 (`:191`) overrides it -- two directed edges -- so each party owns his own, `state/gate.py`'s `T-m` (`:707-710`) admits the owner opening it, and `release`'s `domain:` includes `tie` and `knot`, so nobody writes an edge he does not own and the owner can end it. WHAT STOPS IT, PER KIND: `tie` has NO production reader -- the only code naming the kind is `release`'s domain and `harness/probes.py` -- so an executed `tie` would write an edge nothing reads; the reader that would make it live is `decision/options.py::teller_weight`'s `relation` term (`~:1032-1079`, the hearer's relation to the teller), which today reads `rank` and `regard` and no tie. `knot` HAS a reader, `epistemic.py::_ch_witness_key`, and it reads the edge UNDIRECTED (either endpoint, either role), against 04 `:388` (*`tie`/`knot` are directed*) -- recorded as an observation for the `29f` lane, which owns the `firsthand_via_knot` channel, and not decided here. BOTH kinds also lack the operand: the row's cells bind the actor and no partner, so a computed act names nobody to bond with. The row still names two kinds for one opener. The decline stands."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "transfer"
    stratum:     "uncontested_material"
    eligibility: ["remit:issue", "own", "hold:<store>"]
    eligibility_note: "`H-160` LIMIT 1, THROUGH `H-158`'s FIRST REMEDY -- *'an eligibility alternative that names a seat'* -- [ASSUMPTION; medium; Jordan to correct; revert: the other remedy, a ruling that an `own` verb may be exercised through a seat]. `remit:issue` is the existing grammar's way to name one (`decision/options.py::exercised_seat` returns the hold that grants it, `pack_scenes` puts it on `Act.via`, `loop/resolve.py::_eligible` admits through `seat_hold`), so no fifth eligibility kind and no new form. FIRST, because the first alternative that admits decides which one `via` reflects: a holder of a seat granting `issue` gives THROUGH it, and his `from` is the seat's rung, its treasury (`treasury_of`, off the grant's `seat_rung` snapshot); anyone else falls through to `own` exactly as before. The fold admits the same acts either way (`own` still follows), so WHO PAYS FROM WHERE moves, and with it what `Act.via` reaches: the seat's obligees at its rung witness the transfer (`epistemic._ch_post_remit`; `off_restoration_leader` grants `issue` and has one), `_renewals` clauses 1-2 become meetable, and the fold admits the withdrawal through `own` without re-asking the seat (a queued withdrawal survives a same-round revoke or re-stamp; `test_term_upkeep`'s `_ONE_CLAUSE_BROKEN` asserts such a transfer still executes, so no `_eff_transfer` guard); a rungless seat is passed over (`need_treasury`). ⚠ `issue` IS `levy`'s SUBSTITUTION CARRIED ONE VERB OVER, not a ruling -- `transfer` is not a remit act (`rosters.yaml: remit_acts` is closed), and a payment out of a treasury is read as issued, the converse of a levy into it (`H-52`'s neighbour; its `eligibility_substitution_note`). ⚠ AND A HOLDER OF SUCH A SEAT NO LONGER FORMS A TRANSFER AS HIMSELF: one alternative per row decides, so his gifts from his own home are not formed (on the realm they were refused every time -- `H-160`'s hearths hold nothing). A candidate per admitting alternative is where that choice would go if it ever matters."
    beneficiary: "to"
    requires:    "stores(hearth(giver), kind) >= amount (§54 it. 7)"
    requires_typed:
      form:      scalar_threshold
      of:        from
      scalar:    stores
      key:       kind
      threshold: amount
      comparator: ">="
    requires_typed_note: "§E3 `:418` — ***`stores(hearth(giver), kind) >= amount`*** (§54 it. 7), the scarcity predicate §27.1 rests on. ⚠ `operand_defaults:` STOOD HERE AND `W-C` DELETED IT. It held `kind: grain` / `amount: 1`, carried over from `_req_transfer`'s two literals, and `evaluate` bound them for any act whose payload lacked them — i.e. THE FOLD supplied the person's operands, invisibly, under the person. Once `H-94`'s structural half closed that became two owners of one value AND an incoherence: the cell would ADMIT a transfer on operands it had invented, and `_eff_transfer` would then raise on those same operands being absent from the payload. The values moved unchanged to `DEFAULT_FIXTURES` (`default_store_kind`, `default_transfer_amount`), where `operands_for` derives them PERSON-SIDE and the act CARRIES them; `from` is the actor's own live `contain` Tenure and `to` is the question's referent, so neither is a fixture at all."
    writes:      ["Rung.stores", "Rung.stores", "Tenure.term"]
    emits:       ["transfer.made", "term.renewed"]
    emits_on_refusal: ["transfer.refused"]
    grade:       "ruled"
    writes_note: "×2, ONE PER SIDE (§E3 `:418`). ⚠ W3 AUDIT: this was collapsed to ×1 and the effect only DECREMENTED the giver, so six grain left the world and arrived nowhere — in an economy where `yield` is the only source (#353 `:856`).  ||  ⚠ PLAN POSITION `17b`: `Tenure.term` ADDED, and `term.renewed` beside `transfer.made`. A transfer is a PAYMENT OF UPKEEP when it is exercised through a seat (`Act.via`) the actor sits in, out of that seat's own rung, to another rung that is the home of persons obliged to the seat: it then renews as many of their `oblige` terms as the amount covers at `upkeep_of(seat)` apiece (`loop/effects.py::_renewals` states the four clauses and why each is there; the gate admits each renewed edge under the `renewal` basis). This is `04 F.18`'s repair -- *'A MATTER payment would be a fourth clock, so the repair is a verb'* -- and the retirement plan's G2, *'payment = the existing `transfer` verb'*: no new verb, no new operand. The third pair is check-only, like the second. `term.renewed` is earned only by an edge whose term actually moved, and each rung earns `transfer.made` by name, so an ordinary transfer emits exactly what it did before `17b`. ⚠ Every computed transfer carried `via=None` (`exercised_seat`: `own`/`hold` alternatives exercise no seat), so none renewed anything -- ⚠ SUPERSEDED AT `H-160` LIMIT 1 (`eligibility_note` above): a holder of a seat granting `issue` now gives through it, out of its rung, so a computed transfer CAN meet `_renewals`' clauses 1 and 2; whether one reaches an obligee's home is the chooser's and the world's."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "utter"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "none"
    requires:    "—"
    writes:      ["Proposition.exists"]
    writes_note: "v9 IN-11 (#453 §10.4 step 2): `_eff_utter` also opens the UTTERER'S `hold` on the new Proposition (the maker's-hold shape `create_record` already carries, and like it not a declared `writes:` pair -- the receipt is the Proposition's). It is what lets `commit` execute in computed play: a Proposition has no place, so only a live edge puts it in `reach`, and Q2 then raises the utterer's own claim about it as a question `commit`'s `existence` cell admits."
    emits:       ["proposition.uttered"]

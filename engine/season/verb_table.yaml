    beneficiary: "actor"
    referent_class: Proposition
    referent_class_note: "v10 REM-23 (B10-05, AM-A-08; M19 taken, [ASSUMPTION; medium; Jordan to correct]): FORMED ONLY ON A `Proposition`-CLASSED REFERENT -- the plain referent of the question he answers that is a Proposition (`queries/world_q.py::own_referents_of_class`, REM-21's term, stamps it through `_stamped`; `decision/options.py::opening_set` then forms on the classed ids alone, IN-53 D1's partition), so `subject` binds a Proposition and never a person, a Site, a Record or a rung. THE CLASS REMOVES WRONG-KIND FORMATIONS ONLY: this row's cell, its eligibility and who may commit are unchanged, it claims no execution, and it does NOT answer IN-57's own-act screen (ED-IN-0296 (3)), which is why `commit` left the executed set; B10-09's CR-10 does that. MEASURED before the class (`e66a22ec`, `aperture 1 s`, realm arm, s = 0/1/2): formed for 83 of 83 persons, attempted 38/33/34, executed 0/1/1, refused 36/32/33 as `commitment.refused`, every one on the last read `exists:Proposition=0` (36/32/33); those formations stop, and the refusal Events they emitted stop with them, with the WITNESS deposits those carried (AM-A-08). READ AFTER (same instrument): formed for 6/2/1 persons -- those whose question names a Proposition among its referents -- attempted 1/1/1, executed 1/1/1, refused 0/0/0, `exists:Proposition=0` 0/0/0; executed 0/1/1 -> 1/1/1 is a reading of a seeded trajectory (seed 0: the act stores part at the seventh act), not a claim that `commit` executes. No `commit` is formed on a goal Proposition (`data/goals.py::goal`): a person's own goals are not among the referents a question carries, and the stamp for them is a separate term (B10-05 CR-28). A person who answers a question naming a Proposition executes it through the real fold (`tests/test_referent_class_stamps.py`). REVERT: delete this column."
    requires:    "the Proposition exists (immutable, §14)"
    requires_typed:
      form:      existence
      of:        subject
      kind:      Proposition
    requires_typed_note: "§E3 `:426` — *the Proposition exists (immutable, §14)*. Definite article: the one the act commits to, which is the act's `subject`. §14 makes a Proposition immutable and `utter` is the only verb that creates one, so this is the clause that makes `utter` a precondition of the social layer rather than a formality."
    writes:      ["Tenure.since"]
    emits:       ["commitment.made"]
    emits_on_refusal: ["commitment.refused"]
    grade:       "ruled"
    refusal_note: "W3: added. §E2 -- 'failure emits, never raises'. This verb has a `requires` and had no refusal channel, so a failed precondition produced no Event, no witness and no arc. Refusal condition: the Proposition does not exist (§14 -- it is immutable and must be uttered first)"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "comply"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "none"
    beneficiary_note: "the obliger is who compliance is FOR, and no Candidate carries him: the writ's issuer is its maker, not an operand of the act that answers it."
    referent_class: Record
    referent_named: true
    referent_class_note: "v9 IN-09 (H-203, DECISION 2026-10-13 [ASSUMPTION; medium; Jordan to correct]): FORMED ONLY ON A WRIT THE PERSON HOLDS AND HIS OWN LEDGER NAMES. `queries/world_q.py::writs_held` stamps the dispensations on his live `hold` edges onto the question he answers as `Record` (IN-53 D1's partition, `_stamped`), and `referent_named` (IN-10 (a)'s column) keeps the Candidate to a writ `person_q.ledger_names` names -- the content claim WITNESS deposits for a new holder. MEASURED before the class (`30d38a12`): the typed cell formed on every referent a question named, 609 always-refused Candidates per verb; those cannot form now. REVERT: drop both columns."
    requires:    "a claim of the dispensation's terms is in the actor's own ledger"
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      dispensation
        - form:      own_ledger
          of:        subject
    requires_typed_note: "v9 IN-09 (`19b`, J-2 arm A, J-10) TYPES THIS CELL. §E3 `:430` — *a claim of the dispensation's terms is in the actor's **own** ledger*. §F.24a form 6, `tell`'s form, and THE OPERAND IS THE ACT'S `subject`, READ AS THE WRIT: after plan positions `15`/`15c` a dispensation is a `Record` of kind `dispensation` (`rosters.yaml: record_kinds`), and its holder holds `(writ, content:dispensation, <terms>)` by the content deposit (`loop/witness.py`), so the act's subject IS the dispensation whose terms are sought and no operand is coined (`H-94` is not filled; the closed eight stand). TWO CONJUNCTS, UNNAMED (`survey`'s precedent: an unnamed own-ledger clause carries no `said`): `existence` of `subject` kind `dispensation` -- the act answers a WRIT, so a person, a rung or another kind of document is refused; `own_ledger` of `subject` -- the actor's own ledger holds a claim on that writ (the `F8` carve-out, `claim.held`). ⚠ LIMIT: `claim.held` accepts ANY claim on the writ, not only its `content:` claim, so a person who saw the writ issued and never read it passes the fold; a predicate-typed ledger read is a grammar change. In computed play the formation (`referent_class` above) offers it only to the writ's holder, who holds the content claim. ⚠ ARM (A)'s `dispatch`ed ORDER IS NOT ANSWERED: an order mints no Record, so there is no writ to bind. Was `requires_typed: none` with a `requires_decline_note:` (IN-41) until IN-09."
    writes:      []
    emits:       ["compliance.given"]
    emits_on_refusal: ["compliance.impossible"]
    grade:       "ruled"
    writes_note: "per the term's own row. ⚠ v9 IN-09: EMISSION-ONLY, #453's hook (`proposals/2026-10-03-verb-coverage-and-gap-fill.md:502`): `comply` writes nothing itself and emits `compliance.given`; what compliance PERFORMS is the separate act the writ names (`transfer`, ...). The fold calls an effect only for a declared write and `effect_carried` answers a row writing nothing without one, so no `_eff_comply` exists (it would be a body nothing calls, `ID-13`). Which acts a dispensation's `terms` may name stays `H-44`'s (re-scoped)."
    refusal_note: "W3: added. §E2 -- 'failure emits, never raises'. This verb has a `requires` and had no refusal channel, so a failed precondition produced no Event, no witness and no arc. Refusal condition: no claim of the dispensation's terms is in the actor's own ledger"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "conceal"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "actor"
    beneficiary_note: "v9 IN-12 step 10 (#453 §9.3: *'beneficiary `actor`'*): THE CONCEALER -- the cover is minted into his own hand and hides his own name."
    requires:    "—"
    requires_note: "#453 §9.3: *'requires: — (no precondition, so an empty `emits_on_refusal` is lawful)'*. Untyped, `create_record`'s shape: a computed `conceal` forms on its question's referents and carries `subject`, which the effect does not read (the cover names the actor, not the referent). ⚠ ONE PERSON-SIDE DECLINE, NOT A PRECONDITION: a person holding a cover that names him forms no second one (`rosters.yaml: held_document_declines`, read in `decision/options.py::opening_set`), #453's *'a person-side decline while the actor holds a live cover'*; a hand-built act is not declined by the fold."
    writes:      ["Record.exists"]
    writes_note: "v9 IN-12 step 10 (#453 §9.3; K-19): `loop/effects_information.py::_eff_conceal` MINTS A `Record` OF KIND `cover` through `_mint_document` -- `terms` THE ACTOR, written by the effect whatever the act's `subject` (#453: *'`terms` = the actor, written by the effect whatever the act's `subject`'*); the Record's own id is the alias; the maker's `hold` opens with it; its stages are the mint's (`_declared_stages`, `H-80`'s default for a computed act), which MATTER matures, not `Record.ttl`. `forge`'s declaration, the one pair the mint writes as its declared write (the stages are wound inside it). WHAT THE COVER CHANGES IS ATTRIBUTION AFTERWARDS, NOT WITNESSING (K-19): `state/attribution.py::anchor_of` answers the cover's id at tier 1 for an act by a person holding a cover whose `terms` is himself while a stage is unmatured (`live_cover`), so the deposits about his later acts are about the alias and his knot-partners stop witnessing by key (`epistemic._ch_witness_key` tests `pid == anchor`); `seen.who` still names him for those present (`epistemic._term_who` reads the act). Ended by `destroy_record` or by its stages maturing (#453 §8.1)."
    emits:       ["cover.assumed"]
    emits_note: "#453 §9.3's kind, emitted by this row alone. ⚠ NO CHANNEL EXCEPTION (K-19): taking a cover is witnessed as any act is, by `witness_channels`' ordinary precedence -- a per-verb exception there would be scripting drift. `social`, so `_ch_chronicle` does not broadcast it."
    emits_on_refusal: []
    refusal_note: "#453 §9.3: no precondition, so an empty `emits_on_refusal` is lawful (`create_record`'s shape); a mint that moves nothing (a hand-built act naming the id of an identical Record) is the fold's flat `act.refused`."
    grade:       "assumption"
    grade_note:  "an argued addition (#453 §10.4 step 10): the matrix row `(Record, exists)` is the tree's; the row, the `cover` kind and the `anchor_of` cover read are v9 IN-12's, on #453 §8.2 `:1486-1495`, §9.3 `:1826-1863`, K-19 `:2722-2727`."
    source:      "v9 IN-12 step 10 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.3 `:1826-1863`"
  - verb:        "confer"
    scale:   "settlement"
    scale_note: "conferral seats an office, and an office sits at a rung"
    stratum:     "binding_decision"
    eligibility: ["remit:confer"]
    referent_class: Office
    referent_class_note: "IN-53 (H-207, DECISION 2026-10-13 D1). THE REFERENT CLASS, A PARTITION: `decision/options.py::opening_set` forms a `confer` ONLY on the referents its question carries as `Office` (`state/carriers.py::Question.classes`, via `VerbRow.referents_of`) -- the vacant seats the conferrer may fill and, since v9 IN-10 (a), the seats he was told of (`seats_named`; `confer` does not declare `referent_named`, so it forms on both and the fold refuses a held one), which `queries/world_q.py::questions_for` puts on the question he answers (`_stamped`) -- and never on its plain referents; a row declaring no class forms only on the plain ones, so nothing else moves. A person-side reader has no World and cannot tell an office id from a rung, person, Record or Site id; `data/verbs.py` refuses at load a class `rosters.yaml: referent_classes` does not declare. MEASURED before this column (`30d38a12`): formed on every referent a question named, refused by the fold on every one; those formations stop. The office the act names is read by `loop/predicates.py::office_named_by` (`subject`, or a hand-built act's `office`). `revoke` declares no class (D1: it keeps its base behaviour)."
    counterparty: to
    counterparty_note: "IN-53: THE CONFEREE IS THE SECOND SIDE, AND A COMPUTED `confer` MUST CARRY HIM. The row is untyped (`_req_confer`'s `or` and its cardinality have no cell in the closed grammar, and the fold evaluates a typed cell OR a predicate, never both, `loop/resolve.py`), and an untyped row carries nothing -- so a computed `confer` carried only `subject`, and once a seat admitted it `_eff_confer`'s `_operand(a, 'to')` raised `InstrumentDefect` (H-207 cause 4). `to` is a `known_person_operands` member, so `VerbRow.known_person_operands` fans the Candidate over the persons the conferrer KNOWS (`give`'s receiver, `tell`'s hearer): one bag per known person, none when he knows nobody. `determine`'s precedent for a row naming its second side; the fold's counterparty clause (`loop/resolve.py::_admits`) refuses a hand-built `confer` naming nobody as `confer.refused` (the conferrer himself is admitted since D2, `counterparty_may_be_self` below), before the effect would raise. Formed only on an Office referent (`referent_class` above)."
    counterparty_may_be_self: true
    counterparty_may_be_self_note: "IN-53 (H-207, DECISION 2026-10-13 D2) [ASSUMPTION; medium; Jordan to correct]. THE CONFERRER MAY CONFER ON HIMSELF: the lord who assumes a vacant seat (the cast already has one person holding several). `decision/options.py::operand_bags` ranges `to` over the persons he knows PLUS himself -- he knows himself from his own state, so `known_persons` keeps its three sources (AX-2, ED-IN-0282) -- and both counterparty sites (`opening_set`, `loop/resolve.py::_admits`) waive the self-exclusion for this row alone (`VerbRow.self_counterparty_refused`). ED-IN-0210 ruling 1 (*verbs are not fiats*) is not crossed: a self-conferral writes `Tenure(actor, office)`, not the `Tenure(X,X)` self-loop; it can fail on the world's terms (`may_fill` through `Act.via`, 1-per-object) and be undone by `revoke`; the write gate opens a seat-`hold` under `conferral` even for the actor's own (`state/gate.py::tenure_write_basis`). REVERT: delete this column."
    beneficiary: "subject"
    requires:    "the office's conferral basis, the conferee is a living person, and 1-per-object: no live hold on the object, or the holder-Proposition has zero live commit (§54 it. 20)"
    writes:      ["Tenure.until", "Tenure.since", "Tenure.term"]
    writes_note: "IN-10 (b) (#453 §7.2 `:1382`, §9.6 `:2071`: 'the edits are `_eff_confer` and the row's `writes:`'): `Tenure.term` ADDED, on `oblige`'s precedent (plan position `17b`) -- `_eff_confer` opens the seat-hold WITH the term the act declares (`loop/effects_governance.py::_declared_term`, the payload's `term`, a length in seasons; `Term(tick + n, act)`), so undeclared that write would ride under `Tenure.since`'s gate. Check-only, like the second pair. A computed `confer` declares none and opens an untermed hold exactly as before; a termed one is REGENCY or a TERM-LIMITED SEAT, matured at MATTER (`loop/matter.py`'s term branch) under `T-n`, which leaves the seat vacant. The conferral basis admits the opened edge whole (`state/gate.py`). LIMIT carried from #453: the effect still closes EVERY live hold on the seat, so a termed regent displaces the principal; delegation without a hold is IN-48's. [ASSUMPTION; medium; Jordan to correct -- the term's source: an act-declared payload length, `create_record`'s `stages` precedent, since no operand of the closed eight and no live Record kind carries one. REVERT: drop this pair and `_declared_term`.]"
    emits:       ["tenure.opened", "tenure.closed"]
    emits_on_refusal: ["confer.refused"]
    grade:       "ruled"
    eligibility_note: "⚠ W3 AUDIT: §E3's eligibility cell carried a PRECONDITION as well as the remit act — `remit:confer + ...`. The fold split on the first `:` and tested the whole tail against the remit roster, so it NEVER MATCHED and a holder of the remit was silently refused. The act is the eligibility; the basis is a `requires`."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "convene"
    stratum:     "binding_decision"
    eligibility: ["remit:convene"]
    beneficiary: "none"
    requires:    "rank(subject.kind) > rank(person) -- an ordinal floor above the person tier, or subject is NONE (§6.2)"
    requires_note: "⚠ `scale: \"settlement\"` IS DELETED (plan position `18`/PROC-A, `21_RECONCILIATION.md` PHASE 2 step 9). Jordan, 2026-09-05, correcting the row: *\"convene could happen at any scale except individual/person\"* -- and on the reason, *\"unless you mean convene as limited by physical location of participants, but this game can assume people will travel to somewhere ... the `person` kind is the address slot and the `Person` is who stands in it. A proceeding convenes at a place; a person-rung is an address, not a place.\"* `rung_kinds` is an ORDERED roster (person first), so the lawful expression is the ordinal `rank(venue.kind) > rank(person)`, not a kind enumeration (`03_PARAMETERS.md` §C.1's own falsifier: change the roster's membership and see what breaks). Evaluated in `loop/predicates.py::_req_convene`, NOT as a `requires_typed: scalar_threshold` cell -- that form's `check()` reads both sides off the SAME bound entity, so it has no channel for a literal constant without either coining a `requires_operands` member or overloading `floor`'s already-declared, structurally different meaning (`decision/options.py::_derive_operand`'s own stated rule: one meaning per operand name, never a per-verb table). The venue rides the act's `subject` operand -- C-11 (`21_RECONCILIATION.md:379`): *\"subject already binds the rung\"* -- not a `venue` key `requires_operands` has never carried."
    writes:      ["Date.due_at", "ConveningCondition.attached"]
    emits:       ["date.scheduled"]
    emits_on_refusal: ["convene.refused"]
    grade:       "ruled"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "covenant"
    stratum:     "social"
    eligibility: ["remit:issue"]
    eligibility_note: "v9 IN-12 step 7 (#453 §9.2, the `covenant` row): `remit:issue` THROUGH A SEAT ONLY -- an `own` alternative would let anyone mint a treaty (#453 K-14). `issue`'s act, because the instrument IS a dispensation (K-54): a covenant is the seat's writ addressed ACROSS purview rather than down it, so the issuing grant licenses it and no new remit act is coined (`rosters.yaml: remit_acts` is closed). [ASSUMPTION; medium; Jordan to correct; revert: a `remit:` act of its own, which the closed roster would have to admit.]"
    beneficiary: "to"
    beneficiary_note: "THE COUNTERPARTY, who the instrument is FOR -- the `to` operand the typed cell binds (`give`'s and `petition`'s reading of a document handed to its addressee). `subject` is the Proposition, which acts for nobody."
    requires:    "the counterparty is a person, and the terms are an uttered Proposition"
    requires_typed:
      all:
        - form:      existence
          of:        to
          kind:      Person
        - form:      existence
          of:        subject
          kind:      Proposition
    requires_typed_note: "v9 IN-12 step 7 -- #453 §9.2's cell, verbatim in shape: *`existence` of `to` kind Person ∧ `existence` of `subject` kind Proposition (the terms are uttered first)*. TWO CONJUNCTS, each on an existing form: the counterparty EXISTS AND IS A PERSON (`issue`'s `executors` conjunct, unnamed here -- only a person acts, and accepts by his own `commit`, AX-1), and the terms EXIST AND ARE A PROPOSITION (`commit`'s own cell, so the instrument names exactly what its acceptance commits to; K-54: a treaty or alliance is an uttered Proposition both holders commit to, never a Record kind of its own). ⚠ NO PURVIEW CONJUNCT, AND THAT IS THE ROW'S AXIS (#453's CONFLICTS line, *'a writ reaches down; a covenant reaches across, so the authority conjunct is dropped'*): a covenant is addressed to ANOTHER seat's holder, whose home the issuing seat's purview need not reach. ⚠ THE CELL BINDS `to` BESIDE `subject`, so `TypedRequires.known_person_operands` names `to` and `decision/options.py::operand_bags` forms one Candidate per person the maker KNOWS (#453's producer line, *'the known-person fan over seat-holders the actor knows'*; the fan does not narrow to seat-holders -- no stem reads *holds a seat*, and the grammar has no negation to exclude the rest) -- `issue`'s IN-10 shape. A computed covenant forms on a Proposition referent (the utterer's own, since v9 IN-11's maker's hold put it in his reach); on any other referent the `subject` conjunct refuses it in the fold (`covenant.refused`), as `commit`'s does."
    counterparty: to
    counterparty_note: "THE OTHER SEAT'S HOLDER IS THE SECOND SIDE (#453 §9.2, *'counterparty `to` (the other seat's holder)'*), and a covenant with oneself is the `Tenure(X,X)` fiat `ED-IN-0210` ruling 1 names: declined person-side (`opening_set`) and refused by the fold's `counterparty` clause for a hand-built act (`loop/resolve.py::_admits`), `issue`'s and `petition`'s precedent."
    writes:      ["Record.exists", "Record.stages"]
    writes_note: "v9 IN-12 step 7: `loop/effects_information.py::_eff_covenant` MINTS A `dispensation` through `_mint_document`, the one mint `issue` shares -- `terms` the act's `subject` (the Proposition), `to` the counterparty (`rosters.yaml: record_kinds`' `read_from`), drawn up at the exercised seat's rung (`_seat_rung`), with the maker's `hold`. NO NEW RECORD KIND (#453 K-11, K-54): a covenant is a dispensation distinguished by what its `terms` names. `Record.stages` is the TERM (#453: *'`Record.stages` as the term (matures at MAT)'*), wound by the mint (`_declared_stages`, `H-80`'s default for a computed act); the pair is check-only, as on `open_case`, whose case file is minted the same way. THE COUNTERPARTY LEARNS THE TERMS ONLY BY HOLDING THE RECORD (#453 K-54): the mint holds only the maker and no channel carries a `social` mint, so the instrument is handed on by `give`, and the addressee's acceptance is his own `commit`, formed from the held dispensation (`rosters.yaml: terms_sourced`). ITS READERS ARE DEFERRED (#453 §10.4 step 7): `loop/effects_economy.py::_renewals` reads `oblige` edges only and `queries/world_q.py::mustered` faction members only, so neither tribute nor allied sides read a covenant. No `war` kind (war is a Proposition, K-29); no `truce` (K-32); `proclaim` deferred (K-50); no `debt` kind (deferred with its `seize` reader, K-14)."
    emits:       ["covenant.offered"]
    emits_note:  "⚠ A NEW KIND, NOT `dispensation.issued`: `issue`'s kind is a `binding_decision` row's, which `epistemic.py::_ch_chronicle` broadcasts by kind, and a covenant must not be read as a public writ -- #453 K-54: no channel carries a `social` mint, so the counterparty learns the terms only by holding the Record. Emitted by this row alone; `_ch_post_remit` hands it to the obligees standing at the exercised seat (the seat read off the causing act, `seize`'s note), and the content of the instrument reaches nobody but its holder."
    emits_on_refusal: ["covenant.refused"]
    refusal_note: "v9 IN-12 step 7, #453 §9.2: *'refusal `covenant.refused`'* -- one flat kind, `transfer`'s shape for a `remit:`-eligible row: the counterparty is no person, the subject is no Proposition, the counterparty is the maker (the fold's `counterparty` clause), or the mint moved nothing."
    grade:       "assumption"
    grade_note:  "an argued addition (#453 §10.4 step 7): the matrix rows `(Record, exists)` and `(Record, stages)` and the `dispensation` kind are the tree's; the row, its `remit:issue` eligibility and the dropped purview conjunct are v9 IN-12's, on #453 `:1418-1420` and `:1755-1791`."
    source:      "v9 IN-12 step 7 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.2 `:1755-1791`, K-54 `:3104-3119`"
  - verb:        "create_record"
    stratum:     "uncontested_material"
    eligibility: ["own"]
    beneficiary: "none"
    requires:    "—"
    writes:      ["Record.exists", "Record.stages"]
    emits:       ["record.created"]
    emits_on_refusal: []
    grade:       "ruled"
    grade_note:  "V2 §E3 put `D7` in the grade column -- a Part B defect id, not one of §G4's four grades. W2 landed Part D's five `Record` rows, which IS D7's discharge, so the verb is `ruled` on that table."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "destroy_record"
    stratum:     "uncontested_material"
    eligibility: ["own", "hold:<record>", "presence"]
    eligibility_note: "v9 IN-26 (BOUND-PAPER; `A-13`'s held shape, H-75's re-scoped half): `own` FIRST (`give`'s order; `transfer` lists `remit:issue` before it). §E3's two alternatives stay and still decline (both placeholders, `H-75`); what they meant -- the actor holds the Record -- is the typed cell's `held_by` conjunct below, which binds the act's `subject`, so the placeholder is answered by the cell and not by guessing which object a `hold:<record>` named."
    beneficiary: "actor"
    requires:    "the subject is a Record, and the actor holds it"
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      Record
        - form:      relation
          of:        subject
          relation:  held_by
    requires_typed_note: "v9 IN-26: `give`'s first two conjuncts, for `give`'s reasons (`A-13`, plan position `14`'s measured shape): `existence` of `subject` kind `Record` (a document, not a seat, a rung or a Proposition -- a Proposition is never destroyed, §14) and `relation` of `subject` `held_by` (the actor holds it). The bound `subject` is what `loop/effects_information.py::_eff_destroy_record` destroys; the `record` payload key it read before is gone, since no Candidate carries it. WHETHER A PERSON FORMS IT is not this cell's: `opening_set` forms it only on a referent the person holds (`rosters.yaml: own_hold_declines`) and not at all while `Fixtures withheld_verbs` names it (H-156 option (a), shipped -- the sink arm OFF)."
    writes:      ["Record.exists"]
    emits:       ["record.destroyed"]
    emits_on_refusal: ["destroy.refused"]
    grade:       "ruled"
    grade_note:  "V2 §E3 put `D7` in the grade column -- a Part B defect id, not one of §G4's four grades. W2 landed Part D's five `Record` rows, which IS D7's discharge, so the verb is `ruled` on that table."
    formation_decline_note: "⚠ v9 IN-26 (BOUND-PAPER) LANDS `A-13`'s SHAPE AND MOVES THE HOLD FROM THE ROW TO AN ARM. The row is typed and `own`-eligible (above), so a hand-built `destroy_record` executes through the fold; FORMATION is decided in `decision/options.py::opening_set` by two reads: `rosters.yaml: own_hold_declines` (it forms only on a referent the person himself holds -- his own live `hold` edge, never every referent, which is the scene tax `14` measured below) and `Fixtures withheld_verbs` (H-156 option (a) as a switch: SHIPPED naming this verb, so nobody forms it and every hash is today's; `()` is the sink arm, H-156 option (b) for this row). [ASSUMPTION; medium; Jordan to correct; revert: drop the row's `own` and cell and the roster line, and the fixture's member with them.] HISTORY: plan position `14` (U7-own) took `A-13` at ladder step 4 and held it on measurement before IN-26 built it; its figures are not reproducible and are not kept here (git has them)."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "determine"
    scale:   "settlement"
    scale_note: "a sitting decides at the venue's rung"
    stratum:     "binding_decision"
    eligibility: ["remit:determine"]
    beneficiary: "none"
    beneficiary_note: "who a determination FAVOURS is the `judging_set`, which `requires` itself records as *D11, absent*. `none` here is that absence declared, not a reading of the verb. ⚠ PLAN POSITION `19`: the bench now EXISTS (`judging_set`, `18`) and the determination binds the party it names (`counterparty:`, below) -- but a finding is taken AGAINST the party and FOR no carrier the Candidate holds (the bench's seat), `revoke`'s and `dispatch`'s shape, so `none` stands."
    requires:    "a fired Date with a DocketItem; judging_set — D11, absent"
    requires_note: "PLAN POSITION `19` (U7-remit) EVALUATES THIS, AS THE TYPED CELL BELOW, AND THE READING OF EACH HALF IS STATED. *A fired Date with a DocketItem* is read as `existence` of a DocketItem naming the matter -- the proceedings design's own corrected cell (`proposals/2026-09-05-proceedings-subsystem/04_VERBS.md` §B.2: `{form: existence, of: subject, kind: DocketItem}`), which drops the date: when `19` landed no computed date fired with a holder (nothing set one), so CALENDAR never formed a slot and `open_case` docketed every matter with no date. ⚠ v9 SC-01 FIRED-SLOT STEP: `_eff_convene` now gives its Date the convener's seat as holder, CALENDAR forms the slot, and `open_case` fills it (`world_q.slot_for`); the cell still reads only that the matter is docketed, dated or not, and the bench is ASKED about a sitting's matters by `world_q.questions_for` (`sittings_before`). *judging_set* is two conjuncts: the seat exercised SITS ON THE BENCH for the party (`basis: bench`, the write gate's own `may_determine` -- `judging_set`'s containment test, `H-32`'s default, asked of the party's home), and the bench MEETS QUORUM (`bench.size >= quorum`, the fixture `bench_quorum`, `H-161`). `D11` is `H-32`, built at `18`, so the grade moves `absent` -> `assumption`. The subject must be a PERSON (`party`): the disposal is an edge he owns."
    requires_typed:
      all:
        - form:      existence
          of:        subject
          kind:      Person
          conjunct:  party
        - form:      existence
          of:        subject
          kind:      DocketItem
          conjunct:  docket
        - form:      basis
          of:        subject
          basis:     bench
          conjunct:  bench
        - form:      scalar_threshold
          of:        subject
          scalar:    "bench.size"
          threshold_predicate: quorum
          conjunct:  quorum
    requires_typed_note: "FOUR CONJUNCTS, EACH NAMED FOR THE KEYED REFUSAL IT EMITS, IN THE ORDER A READER CAN TELL THEM APART. `party` -- the matter is a person (only a person owns an `oblige`). `docket` -- somebody put the matter before the room (`open_case`, `19`'s other half), read through `world_q.docketed`, the reader's `docket` branch. `bench` -- `Basis` (§F.24a form 7, `data/requires.py`) with the `bench` rule: the SAME predicate the write gate's `determination` basis asks, so the fold refuses (`determine.refused`, flattened at v9 SC-03b) exactly what the gate would raise on. `quorum` -- `scalar_threshold` (form 2) of `bench.size` against the SECOND READ `quorum`, `work`'s `floor` shape: the bench's distinct seated members against the fixture, with NO operand added to `cardinality` (`21_RECONCILIATION.md` A.1 struck that as a widening) and NOTHING STORED (C-7: *'no stored tally'*; a grep for `count`/`tally`/`quorum_reached` finds no field). ⚠ QUORUM IN ITS ORDINARY SENSE -- the members a bench needs to sit -- NOT C-7's vote threshold (live `commit`s to the disposition), which needs a disposition Proposition and two grammar entries and is `H-161`'s recorded alternative. ⚠ AT THE SHIPPED `bench_quorum = 1` THE QUORUM CONJUNCT CANNOT REFUSE an actor the bench admitted (he is a member): the observable *below quorum, `determine.refused`* is run at 2 and 3 (`tests/test_u7_remit.py`)."
    counterparty: subject
    counterparty_note: "PLAN POSITION `19`: THE PARTY IS THE SECOND SIDE (`ED-IN-0210` ruling 1, *a real interaction has a COUNTERPARTY*), and a judge does not bind himself -- `may_determine` refuses it at the fold and the gate. Declined person-side here, on `petition`'s precedent, so a self-determination is never formed: no read the fold makes can teach a person *that is you*, so a refusal would only tax his scenes."
    contests:    "a proposition"
    contests_note: "v9 SC-03b (#453 §10.4 step 4, ED-IN-0288 as INTENT): `determine` is a CONTESTED act through the social contest container's `social_contest` provider, the prize `a proposition` (`rosters.yaml: contest_subsystems.prizes`, a row no verb claimed until now). ONE ROLL OWNER (S27.2): the roll is the module entry `social_contest.roll`; the host (`seam/wrappers/sigma.py`) builds the input and produces none. The OPPONENT is the row's `counterparty:` operand (`subject`, the party), read by `loop/resolve.py::_contest` as `tell`'s hearer is, so the judge (the actor) rolls against the party; the pool is the judge's `pool_default` (`determine` has no `verb_capability` row, so it falls to the default, `H-126`'s polarity) and the obstacle is `obstacle_default` under `H-213`'s ceiling for EVERY party: `seam/wrappers/sigma.py::_opposition_of` finds no `verb_capability` key to read on the party (the party is named, and the roll is the same for every party). The band is the one ladder's reading of the margin (`seam/ladder.py::degree_of`); this row adds no ladder, no band table and no special case. [ASSUMPTION; medium; Jordan to correct; revert: the flat `writes:`/`emits:` and no `contests:`, the row before SC-03b.]"
    writes:
      Overwhelming: ["Tenure.since", "DocketItem.matter", "Tenure.degree", "Person.pursuits"]
      Success:      ["Tenure.since", "DocketItem.matter", "Tenure.degree", "Person.pursuits"]
      Partial:      ["Tenure.since", "DocketItem.matter", "Tenure.degree"]
      Failure:      []
    pursuits_note: "v9 SC-02 `22b` step 24 (`proposals/2026-09-05-proceedings-subsystem/19_PLAN.md` step 24, *conviction moves by consequence*; the plan's `convictions` is `(Person, pursuits)` since `ED-IN-0261` item 1): `Overwhelming` and `Success` ALSO write the DETERMINER'S OWN `Person.pursuits`, check-only beside the edge (the same effect, `_eff_determine`, moves each held pursuit by `pursuit_shift x DEGREE_STEP[band] x pursuit_lean(determine, pursuit)`, `queries/person_q.py::consequence_pursuits`), earning `pursuit.moved` only when a pursuit moved. `Partial` (the held matter) moves nothing and so declares nothing. `Failure` (the plan: *moves the determiner AGAINST their own axis*) is NOT BUILT (`hole_register.yaml` H-221): a write there gives the failed hearing's Event a change, so its witnessed claim leaves the party for the judge, the scar runs on an act that did nothing, and a judge holding no leaning pursuit would refuse instead of failing. [ASSUMPTION; medium; Jordan to correct; revert: drop `Person.pursuits` and `pursuit.moved` from both bands, `pursuit_shift = 0`.]"
    writes_note: "⚠ v9 SC-03b: DEGREE-KEYED, on `04_VERBS.md` §B.2's row (design intent; the code decides). `Tenure.degree` IS WRITTEN AT LAST (H-162): plan position `19` took it off this row because an UNCONTESTED act carries no degree (`loop/resolve.py::_fold`), and a contested one does. `loop/effects_information.py::_eff_determine` opens the kind the docketed arrangement `disposes:` (v9 SC-03a: `oblige`, `detain` or `ban`; an `oblige` when the docket names no row) owned by the party on the seat exercised, admitted at the gate under the `determination` basis (`state/gate.py::may_determine`), and sets the opened edge's `degree` to the band the contest decided (`Resolution.degree`). `Overwhelming`, `Success` and `Partial` declare the SAME three pairs: `Tenure.since` is the first (the opening, `21_RECONCILIATION.md:575`'s observable); `DocketItem.matter` and `Tenure.degree` are check-only (the same effect takes the matter off the docket and grades the edge it opened). `Partial` opens the disposal graded `Partial` (`proposals/2026-10-03-verb-coverage-and-gap-fill.md:2070`, the plan's SOURCE: *Partial convicts under the one `Partial` rule*; `arrest` reads it the same way, `:1588`). `04_VERBS.md` §B.2 writes `Partial: Tenure.degree` alone, which the gate makes unbuildable: THE GATE ADMITS A `Tenure.degree` WRITE ONLY ON AN EDGE THE WRITE OPENED (`determination` asks `opened` first, `state/gate.py`'s `determination` basis (`opened` asked first): authority to bind is not authority to re-grade, `test_19_determination_opens_only_a_disposed_kind_and_closes_only_a_restraint`), so a Partial that wrote only a degree has no edge to grade. The declared column therefore names what the one effect body does. [ASSUMPTION; medium; Jordan to correct; revert: `Partial: [Tenure.degree]`, which under-names the opening.] `Failure`: `[]` -- the bench did not carry the matter, nothing opens, the matter stays on the docket, `matter.undetermined`."
    emits:
      Overwhelming: ["matter.determined", "pursuit.moved"]
      Success:      ["matter.determined", "pursuit.moved"]
      Partial:      ["matter.determined"]
      Failure:      ["matter.undetermined"]
    emits_note: "v9 SC-03b: §B.2's emissions, keyed on the ladder's own four names (`speak`'s shape). `matter.undetermined` is the Failure band's kind: the room heard the matter and did not dispose of it, which a witness reads differently from a refusal (`determine.refused`: the act never reached the contest)."
    emits_on_refusal:
      eligibility: ["determine.refused"]
      party:       ["determine.refused"]
      docket:      ["determine.refused"]
      bench:       ["determine.refused"]
      quorum:      ["determine.refused"]
      write:       ["determine.refused"]
      counterparty: ["determine.refused"]
    refusal_note: "PLAN POSITION `19`: KEYED PER CLAUSE (`04 §B.13` invariant 4's per-conjunct half, F7; `data/verbs.py` checks the keys are exactly this row's failable clauses). ⚠ v9 SC-03b FLATTENED THE KIND: ONE kind, `determine.refused`, under every key. The row is contested now, and the loader refuses a contested row keying more than one refusal kind unless it keys `counterparty` (`data/verbs.py`, invariant 4's contested half: the seam's party-gap refusal, `loop/resolve.py::_refuse_party_gap`, no clause names, and it emits the UNION, so two kinds would publish a kind for a clause that did not fail; v9 IN-12 step 5 narrowed this for a row that keys the counterparty clause, as `arrest` does). The keys stay -- they are the failable clauses, and the fold reads `row.refusal_for(clause)` -- and they all answer alike. What is lost, said: plan position `19` split the SEAT's `determine.unauthorized` (none exercised grants `determine`, or the one exercised does not sit in judgment over the party) from the WORLD's `determine.refused` (the matter is no person, is on no docket, the bench is below quorum, or the effect found nothing to open); the reason survives on the Event's `observed` for the `bench` conjunct only (the reads that conjunct made); an eligibility refusal carries none (`loop/resolve.py`'s ineligibility return is `Verdict(UNKNOWN, ())`), so there the reason is no longer recorded at all. [ASSUMPTION; medium; Jordan to correct; revert: the two-kind keys, and the row uncontested.] ⚠ `determine.unseated`, the proceedings design's second kind (`04_VERBS.md` §B.2), is NOT taken: read cold it names an Event in which somebody was UNSEATED -- `revoke`'s outcome -- which is the opposite of a refusal (`CLAUDE.md` §4). The design's struck `determine.unheard` (P-23) stays struck. The S27.4 refusal (`Ob > 2 x Pool`, a judge whose pool is under 1D) takes this kind too, as `speak`'s does. ⚠ PLAN POSITION `14`: THE ROW NAMES `counterparty: subject`, AND THAT CLAUSE (`loop/resolve.py::_admits`, asked only AFTER the precondition passes) CAN NEVER FIRE FOR THIS ROW. Both of its cases are refused earlier, by the precondition: a self-determination is refused by the `bench` conjunct (`may_determine`, `state/gate.py` conjunct 2, *a judge does not bind himself*) as `determine.refused`, and an act naming no subject dies at `party` (`determine.refused`) first. The `counterparty:` key under `emits_on_refusal` (`determine.refused`) is in `data/verbs.py`'s expected set BY DERIVATION from the row's `counterparty:` column (`data/verbs.py`'s counterparty expected-set), so the loader refuses a keyed row without it and does not call it an ID-13 EXTRA: THE LOADER CANNOT JUDGE REACHABILITY, only that a key names a clause the row derives. The key is read at `loop/resolve.py`'s `counterparty` clause read and is dead for `determine` only because the `bench` conjunct (`may_determine`, `state/gate.py`, conjunct 2) runs first, which is a fact about this row's precondition and about nothing the loader checks; the `_eff_determine` self-check this clause replaced was already dead for the same reason (`_eff_determine`'s docstring (*the second this body carried*))."
    grade:       "assumption"
    grade_note:  "PLAN POSITION `19`: was `absent` on `D11` (`judging_set` raised unconditionally). `18` built it (`H-32`, graded `assumption`), and the quorum is a swept fixture (`H-161`), so the row is `assumption`, not `ruled`."
    source:      "ARCHITECTURE_V2.md §E3, transcribed; precondition, disposal, keyed refusals and writes at plan position `19` (`workplans/2026-09-18-governance-settlement-behaviour-plan_part2.md` `19 — INSTRUCTION`; `21_RECONCILIATION.md:575`)"

    requires_typed_note: "§E3 `:408` — *a `contain` path exists*. ⚠ THIS DROPS TWO TERMS `_req_move` CARRIED AND THE DROP IS DELIBERATE: that predicate ended `on_ladder or here.kind == \"person\"`, which is true of every actor with a person-rung, so the ladder term decided nothing; and its `dest == a.actor` refusal is kept, as the reader's own rule that a node is not a path to itself. What replaces them is an actual path check — the two rungs must be connected in the containment forest — which is what the cell says and what `_req_move` never tested. ⚠ THIS CELL ENDED *\"No case moves: `to` is unbound for every computed act (`H-94`), so the verdict is UNKNOWN and the fold refuses, exactly as before\"* AND `W-C` FALSIFIED IT WITHOUT EDITING IT. Struck by the `W-C` adversarial pass. `operands_for` binds `to` from the question's referent, so a computed `move` carries a destination: measured over the 89 runnable corpus worlds, `move` EXECUTES 650 times and is blocked 73. The path check is what decides it now — `corpus_run.build_at` makes every person a `person`-kind rung, so a SIBLING destination fails `contain_ascends` and emits `travel.blocked`, while the actor's own containing rung is a valid ascent."
    writes:      ["Person.travel_leg", "Tenure.until", "Tenure.since"]
    emits:       ["travel.moved"]
    emits_on_refusal: ["travel.blocked"]
    grade:       "assumption"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"

    requires_typed_note: "v10 CP-T03-01 added the last two conjuncts, `relation` `individual` of `subject` and of `actor` (`data/requires.py: WORLD_ONLY_STEMS`, answered by `Person.is_cohort`): a cohort is never a party to a personal fight, on either side -- a population is fought by `march`. Refused with the row's one kind (`kill.refused`). v9 IN-59 (a) (RS-26, the ATTACK half of the access gate) added the second conjunct, `relation` of `subject`, `with` -- `give`'s co-location carrier, no form, operand or stem added: an attack needs the attacker where his target is. `with` is WORLD-ONLY (`data/requires.py: WORLD_ONLY_STEMS`), so the fighter forms the Candidate on the person he knows of and the fold refuses a target who is not where he is (`kill.refused`, the row's one refusal kind). `presence:` is NOT what carries it (the fold and `opening_set` both decline that column, `H-33`). [ASSUMPTION; medium; Jordan to correct; revert: the single `existence` cell, under which a man fights anyone living anywhere.] ⚠⚠ RULED BY JORDAN 2026-09-20: *\"admit kill and wound as resolvable verbs\"* (`ED-IN-0261`, amended). This cell is what carries that ruling. THE ROW WAS UNTYPED (`requires: —`) AND THAT WAS THE WHOLE OF WHY IT WAS UNCHOOSABLE — `driver.py`'s contest gate asks `row.requires_typed is not None` because `operands_for` returns `{}` for an untyped row, so a computed contested act would reach the seam with ONE claimant and `combat_seam` would return `PARTY-GAP`. Typing it binds `subject`, which IS the second claimant. THE CLAUSE IS NOT A STAND-IN AND IS THE NARROWEST ONE THAT DOES THE JOB: you cannot fight someone who is not there, `Person.exists` is the field this row's `Felled` band writes, and `exists:Person` is answered by the reader (`requires.py:191`). A WIDER precondition — a hostility test, an eligibility-to-fight test — would be an invention, and `G4` weighs under-refusing and inventing equally. What this cell must NOT be read as saying is that a killing needs no more justification than a living target; it says the FOLD can form and carry the act, and everything about whether the person WANTS to is `score` and the deontological gate, neither of which exists yet. THE SLASHED NAME IS RULED WRONG (*\"kill / wound isn't supposed to be a verb by itself\"*): `kill` and `wound` are not verbs (RS-5, ED-IN-0288); the split rode the alignment re-cell (IN-08) as `challenge` -> `accept` alone."
    requires_note: "`contests:` IS A REAL FIELD, NOT A NOTE: ARCHITECTURE_V2.md:394 declares the column -- `contests: <prize> | none`, *if set, routes to the seam at RESOLVE (§39)* -- and :434 sets it on this row. Jordan, 2026-09-02: *that would trigger the personal combat scene. you can't just kill or wound.*"
    # DEGREE-KEYED (#358 rev.2 §C.4 / F6, loader invariant 12): `contests:` routes to the seam and the degree that
    # comes back selects the write, so LOSING the fight does not kill the loser's target as winning it does.
    #
    # `Failure: []` is lawful HERE AND NOWHERE ELSE, and the act still EMITS with degree=Failure:
    # the attempt happened, was witnessed, and cost a scene. That is what separates a LOSS (the
    # contest occurred and went against you) from a REFUSAL (the precondition failed, no contest).
    #
    # THE DEGREE IS READ OFF THE SCENE, NOT MAPPED. Jordan, 2026-09-03, verbatim: *"kill/wound degrees
    # should be directly taken from scene combat, which is what actually needs to be called when
    # kill/wound is considered."* A mapping from a winner to a degree would be the second resolver §27.2
    # forbids, arriving as a data row instead of as code.
    #
    # WHAT THE SCENE CARRIES (`combat_seam.resolve` -> `wound_state`, read from the
    # engine's own WoundTracker on the combatants the seam holds):
    #   felled            -- the fighter went down. `wrapper.fight` sets a result on a
    #                        felling or an unrefused §11.4 yield: read `felled`, never `result != 0`.
    #   wounds            -- gates crossed, floor(cumulative_damage / wound_interval)
    #   health_remaining  -- what is left
    #   result == 0       -- UNRESOLVED, and a RULED legitimate outcome (Jordan 2026-06-02):
    #                        *"an undecided fight is a legitimate outcome."* Not a failure.
    #
    # THE BANDS BELOW ARE A READING, AND TWO OF THE THREE ARE MECHANICAL:
    #   felled                      -> the person is down: body, existence, and every tenure
    #                                  naming them closes. This is the kill.
    #   unresolved AND wounds > 0   -> blood was drawn and nobody fell: body only. This is the
    #                                  wound, and it is the case the verb's name has always
    #                                  carried and the table could not express.
    #   unresolved AND wounds == 0  -> the fight happened and changed nothing. WRITES NOTHING and
    #                                  STILL EMITS: the attempt was made, witnessed, and cost a
    #                                  scene. That is a LOSS, not a REFUSAL.
    #
    # STILL OPEN (H-98): the engine does not separate a decisive win from a narrow one beyond wound
    # count on the VICTOR, so a fourth band (Overwhelming vs Success) has no source in the data. It is
    # NOT invented here. The three bands below are the ones the scene can distinguish.
    # `Person.scar` IS NOT A BAND WRITE: `_eff_kill` writes no scar. The scar is per OBSERVER, written by
    # the fold after any outcome that moved state (`loop/resolve.py::_scar_witnesses`), so no band
    # produces it. The `(Person, scar)` row in `write_matrix.yaml` carries the honest `unproduced:`.
    # `scar.taken` IS DELIBERATELY NOT IN `emits:` BELOW. An `emits:` cell fires PER
    # BAND from the table, but a scar is taken per observer and may be taken by nobody, so a
    # band-level `scar.taken` would report a scar nobody took -- the `ID-9` defect.
    # v10 REM-31 (IN-46): `Declared` is `march`'s deferral band -- `the body` carries `step: ENCOUNTER`, so the
    # fight is admitted and DECLARED at RESOLVE (writing nothing) and fought at ENCOUNTER, the one step the host's
    # PLAYABLE mode may suspend at. The same cells on `accept`, which contests the same prize.
    # v11 CP-T03-04 (iv): `Felled` and `Wounded` (and `capture`'s and `accept`'s) gain `Person.capability` and
    # `capability.raised` -- build-by-doing, `loop/effects_combat.py::_grown`: each surviving party who ALREADY
    # holds the verb's key (`rosters.yaml: verb_capability`, `arms`) gains one; nothing is minted. LAST in each
    # band, because the effect runs on the first pair. `Untouched` stays `[]`: a write there would turn every
    # untouched fight between non-holders into the no-op refusal (`_grown`'s docstring).
    # v11 CP-T03-07: `Felled` and `Wounded` (and `capture`'s and `accept`'s) gain `Person.body_ceiling` -- the lasting
    # mark, `loop/effects_combat.py::marked_ceiling`: a party who survives at `wounds >= max_wounds` has his ceiling
    # fall one below the next body band floor (`body_mark_model`, `H-258`). LAST, for the same reason.
    writes:
      Declared:     []
      Felled:       ["Person.body", "Person.exists", "Tenure.until", "Person.capability", "Person.body_ceiling"]
      Wounded:      ["Person.body", "Person.capability", "Person.body_ceiling"]
      Untouched:    []
    writes_grade_note: "ruled -- the SPLIT is read from scene combat (Jordan 2026-09-03); H-98 keeps only the question of whether a decisive win is distinguishable from a narrow one, which the engine currently does not answer. All three branches run end to end through `SeasonDriver.resolve` -> `contest()` -> `combat_seam` -> `wrapper.fight` and their consequences differ -- Felled deletes the party and emits `person.died`, Wounded leaves them alive with a lower body and emits `body.changed`, Untouched writes nothing and emits `contest.undecided`; each band is read PER PARTY and the act's band is the worst over both. Falsifier: `test_we_a_contested_acts_consequence_differs_by_degree`."
    writes_source_note: "combat_seam.resolve -> wound_state[EACH PARTY]: felled | wounds. EACH PARTY -- the actor and the subject -- is written by HIS OWN band (`seam/ladder.py::party_degree`, read per party in `_eff_kill`), and the act's band, the token these cells key on, is the WORST over both (`combat_degree`): a felled attacker makes the fight `Felled` though his target stands (CP-T03-00, `-08` AM-C-01). Each party's band lands on that party only: reading the loser's band onto the subject would delete a standing TARGET when the ACTOR is felled. `health_remaining`/`health_full` are read for the MAGNITUDE (`wound_harm_model`, `H-123`), not for the band."
    # `emits:` IS DEGREE-KEYED TOO: a flat `["person.died"]` for every band would make A WOUND EMIT
    # `person.died` -- a success report for something that did not happen, in the verb whose own
    # name carries the distinction. `write_matrix.yaml`'s `Person.body` row declares
    # `body.changed` · `person.died`, and `Person.exists` declares `person.died`.
    #
    # `contest.undecided` is the one NEW kind, and declaring it here IS its declaration -- under
    # invariant 7 the registered roster is DERIVED from the emission columns, so a kind for an
    # outcome that writes nothing has no other home. It is required because the act still
    # happened: it was attempted, witnessed, and cost a scene. Jordan, 2026-06-02: *an undecided
    # fight is a legitimate outcome.* An outcome nothing emits is an outcome nobody can witness.
    # CP-T02-01 (H-230 limit 1): `Felled` gains `tenure.closed` beside `person.died` -- the death names
    # each seat it empties, one `tenure.closed` earned by the seat `hold`s the cascade closes and
    # receipted under the Office's id (`state/gate.py::death_subjects`), so it reaches every person
    # through `chronicle` as a claim about the seat. A death emptying no seat earns none.
    # CP-T03-00 (`-08` AM-C-01): `Felled` gains `body.changed` -- the band is the WORST over both
    # parties, so a felled party beside a WOUNDED one is a `Felled` fight in which the wounded party
    # earns `body.changed`; the cell licenses it, and a fight felling one party and leaving the other
    # untouched still emits no `body.changed` (kinds are earned by what moved, `_fold`).
    # `contest.undecided` is therefore emitted only when BOTH parties are untouched.
    emits:
      Declared:    ["fight.declared"]
      Felled:      ["person.died", "tenure.closed", "body.changed", "capability.raised"]
      Wounded:     ["body.changed", "capability.raised"]
      Untouched:   ["contest.undecided"]
    # Under #358 rev.2 loader invariant 4 (widened, F7) every failable clause needs a refusal kind, and a
    # contested verb can be refused by the seam at the depth cap (§C.5 returns a typed Refusal, never a raise).
    # A contest that cannot report its own refusal is D22.
    emits_on_refusal: ["kill.refused"]
    grade:       "ruled"
    source:      "ARCHITECTURE_V2.md §E3, transcribed; writes re-keyed by #358 rev.2 §C.4"
  # v10 CP-T03-09 (`-08` AM-C-03; M5): `capture`, A NAMED FOLD OF `fight` -- the same scene over the same prize, fought

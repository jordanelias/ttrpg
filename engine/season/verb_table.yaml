        - form:      relation
          of:        site
          relation:  present_at
    requires_typed_note: "v9 IN-12 step 9 -- #453 §9.3: *'requires: `restore`'s cell'*, copied whole: the site exists and the actor stands at it."
    writes:      ["Site.condition"]
    writes_note: "v9 IN-12 step 9 (#453 §9.3, K-09): `loop/effects_economy.py::_eff_sabotage` LOWERS THE SITE BY `_rise`'s MIRROR THROUGH THE SAME ACCUMULATOR (`_fall`): the footroom to the scale's floor (the condition itself) shared among those standing at the fabric (`queries/world_q.py::share`), staged NEGATIVE on `(Site, condition)` and clamped ONCE at 0 by `resolve()` (S27.3). A fabric already at 0 stages nothing and is `sabotage.refused` (`NoOpReceipt`); one that a `restore` in the same fold cancels is refused after the fact, `work`'s G4 shape. LOWERS, NEVER ENDS: ending a Site is `raze`'s (IN-12 step 11). `work`'s declared delta is restricted to >= 0 in the same commit, so each verb owns one sign (K-09)."
    emits:       ["site.damaged"]
    emits_on_refusal: ["sabotage.refused"]
    refusal_note: "v9 IN-12 step 9, #453 §9.3: *'refusal `sabotage.refused`'* -- one flat kind, `restore`'s shape: the site is not a Site, the saboteur is not at it, or the write moved nothing."
    grade:       "assumption"
    grade_note:  "an argued addition (#453 §10.4 step 9): the row and the mirror are v9 IN-12's, on #453 §9.3 `:1865-1890`, K-04 `:2600-2605`, K-09 `:2640-2646`."
    source:      "v9 IN-12 step 9 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.3 `:1865-1890`"
  - verb:        "raze"
    scale:       "settlement"
    scale_note:  "#453 §9.2: a razing ends the settlement it names -- the place IS the subject, `march`'s and `seize`'s scale for the same reason."
    stratum:     "contested_physical"
    eligibility: ["remit:dispatch"]
    eligibility_note: "v9 IN-12 step 11 (#453 §9.2, the `raze` row): `remit:dispatch`, the act that musters the army (`march`'s eligibility, `state/gate.py::MUSTER_ACT`'s grant) -- the seat that can put an army on a town is the seat that can level it. J-8 (whether `dispatch` is a remit act at all, `offices.yaml` `meta: remit_unruled`) is Jordan's; this row moves with the ruling. Built on `remit_default` (§A v9, J-8 partly answered), `arrest`'s precedent."
    beneficiary: "none"
    beneficiary_note: "#453 K-06: `none`, the declaration for an act whose good accrues to a Site or a Rung (`rosters.yaml: beneficiary_kinds`) -- and a razed Rung is no longer there to carry it."
    requires:    "the subject is an existing Rung"
    requires_typed:
      form:      existence
      of:        subject
      kind:      Rung
    requires_typed_note: "⚠ v9 IN-12 step 11 KEEPS THE ROW TYPED, ON `march`'s CELL, WHERE #453 §9.2 SENDS IT UNTYPED. #453: *'untyped -- \"Site or Rung\" is a disjunction ... a registered predicate and a flat `raze.refused`'*. This row ends a RUNG ONLY (the entry's falsifier is `w.rungs` shrinks), so the disjunction is not asked and the one conjunct the grammar can spell is kept: `existence` of `subject` kind `Rung`, `march`'s own cell (`WorldReader.read` answers `exists:Rung` generically). THE SUB-KIND AND THE LICENCE ARE THE EFFECT'S (`loop/effects_founding.py::_eff_raze`): a `march_target_kinds` member (a settlement), and OCCUPATION -- the exercised seat's faction `mustered` there, the place held by another faction -- the read `seize`'s Rung half inlines (`_seize_rung`), copied. A refusal at either is `raze.refused` (the `write` clause). The Site half of #453's row (`Site.exists` -> absent, `site.razed`) is NOT BUILT (`hole_register.yaml` H-228). [ASSUMPTION; medium; Jordan to correct; revert: `requires_typed: none` + a registered predicate asking the same reads, #453's own text.]"
    writes:      ["Rung.exists"]
    writes_note: "NO `contests:` (#453 §9.2: *'contests: none'*): the fight for the town is `march`'s field, already fought; the razing is what an occupier does with what the field gave him. v9 IN-12 step 11:`loop/effects_founding.py::_eff_raze` DELETES THE RUNG and closes every live Tenure naming it, in ONE write -- `_eff_destroy_record`'s body on the Rung store, and Layer 1's cascade exactly (`architecture/meta/04_CODE_ARCHITECTURE.md` §B.8: *'`destroy` sets `until` on every Tenure naming the id and nothing else'*). The closures are admitted at the gate under `cascade` (the Rung is in the write's `gone`) and are not declared, as `destroy_record` declares none. `(Rung, exists)` admits `[RES]`, ACTS, social (`write_matrix.yaml`); no matrix row is added. ⚠ NOTHING IS RE-HOMED (#453's recorded GAP; H-228): what stood in the town is left placeless and a Site's `rung` field keeps the gone id."
    emits:       ["rung.razed"]
    emits_note:  "#453 §9.2's kind for the Rung half (`site.razed` waits on the Site half, H-228). A NEW kind, emitted by this row alone (`data/verbs.py::KIND_VERB`); not `rung.seized` -- a taking keeps the place and a razing ends it."
    emits_on_refusal: ["raze.refused"]
    refusal_note: "#453 §9.2: *'refusal `raze.refused` (flat)'*, `march`'s shape on a typed row: the subject is no Rung (the `existence` conjunct), or the effect declined -- not a settlement, the seat has no faction, nobody or the seat's own faction holds the place, or the seat's faction is not mustered there (no army)."
    grade:       "assumption"
    grade_note:  "an argued addition (#453 §10.4 step 11): the row is v9 IN-12's, on #453 §9.2 `:1800-1822`, K-06 `:2617-2619`; the occupation licence is IN-13's read (`_seize_rung`), copied."
    source:      "v9 IN-12 step 11 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.2 `:1800-1822`"
  - verb:        "seize"
    scale:       "settlement"
    scale_note:  "a seizure reaches the place its object is at, as `requisition`'s reaches a rung: the exercised seat's purview over where the dispossessed holder lives"
    stratum:     "uncontested_material"
    eligibility: ["remit:issue"]
    beneficiary: "none"
    beneficiary_note: "v9 IN-12 step 6 (#453 `seize` row): `none`, `revoke`'s and `destroy_record`'s precedent for a non-consensual act on another's edge -- the taking is for the seat's warrant, and the Record's new holder is the actor, who is no operand's beneficiary here (no operand carries him)."
    requires:    "the exercised seat's purview reaches where the subject is (a Record or a settlement)"
    requires_typed:
      form:      basis
      of:        subject
      basis:     purview
      conjunct:  authority
    requires_typed_note: "⚠ v9 IN-13 (#453 §10.4 step 8) WIDENED THE OBJECT TO A RUNG AND DROPPED THE `object` CONJUNCT: `existence` of `subject` kind `Record` refused every Rung, and 'Record or Rung' is a disjunction the typed grammar lacks (#453 §9.1, the `seize` row), so the grammar cannot write it. #453 sends the row to `pardon`'s route, untyped and flat; this keeps it TYPED AND KEYED on the one conjunct it can still spell -- `authority`, `requisition`'s `purview` conjunct (the exercised seat's purview over the subject's place: a Record's holder's home, a Rung's own place) -- and the OBJECT'S KIND moves to the effect, which splits on Record vs Rung (`loop/effects_information.py`: `_eff_seize`, then `_seize_rung`) and declines anything that is neither a held Record nor an occupied settlement (`seize.refused`, the `write` clause). [ASSUMPTION; medium; Jordan to correct; revert: `requires_typed: none` + a registered predicate and a flat `seize.refused`, #453's own text -- a flat revert must move the seat-purview check into `_seize_rung` unconditionally (with no hold on the town, the `authority` conjunct is the only purview check the Rung half has).] A SEAT is never seized: it refuses at `authority`, since an Office has no place (`world_q.place_of`) and so no seat's purview reaches it (`seize.unauthorized`); planted past the precondition, the effect declines it and the gate's `seizure` clause admits only a Record or a Rung. THE RECORD HALF AS BUILT AT v9 IN-12 step 6 (#453 §9.1): `authority` is the seat half of the gate's `seizure` basis asked of the precondition, so a seat refusing is `seize.unauthorized` and not a refusal for the world. [ASSUMPTION; medium; Jordan to correct; revert: drop the `authority` conjunct and the key -- the effect then declines the same act as `seize.refused` through `may_seize`.] ⚠ THE WARRANT IS NOT A CONJUNCT, AND THAT IS THE ROW'S OWN TEXT (*'the licence is the effect's: a held warrant naming the Record'*): it is a Record's content, which no form of the grammar reads and no gate basis may (K-52). Person-side it is `rosters.yaml: warrant_sourced` -- `seize` forms only on a `subject` a held dispensation's `terms` names (`decision/options.py::opening_set`) -- and world-side the Record half of the effect (`_eff_seize`) reads the same held dispensation; the Rung half licenses on OCCUPATION instead (`_seize_rung`). A seat may license itself with one `issue`: a held warrant is any live hold on a dispensation whose terms name the Record (C3, recorded, not changed)."
    writes:      ["Tenure.until", "Tenure.since"]
    writes_note: "ONE PER SIDE, `give`'s pair and for the same reason: the dispossessed holder's `hold` closes (`Tenure.until`) and the seizer's opens (`Tenure.since`), in ONE effect (`loop/effects_information.py::_eff_seize`), so the fold never sees two live holders. The gate admits the close under `seizure` (`state/gate.py`: `may_seize`) and the open as `T-m`, the actor opening a non-seat `hold` for himself. No `write_matrix.yaml` row is added: both pairs exist."
    emits:       ["record.seized", "rung.seized"]
    emits_note:  "v9 IN-13: `rung.seized` (#453 §9.1's own kind) for the Rung half -- each half's subjects earn their own kind (`Subject.earns`), so a taken Record never publishes a taken town. ⚠ A NEW KIND, NOT `record.given` OR `tenure.closed`: `give` is consensual and `seize` is not, and a reader that asks whether a Record changed hands by consent must not read a taking. It is an act exercised through a seat (`Act.via`), so `_ch_post_remit` hands it to the obligees standing at that seat (`epistemic.py`: the seat is read off the causing act, never a broadcast by kind); `chronicle` keys on `binding_decision` rows and this row is `uncontested_material`."
    emits_on_refusal:
      eligibility: ["seize.unauthorized"]
      authority:   ["seize.unauthorized"]
      write:       ["seize.refused"]
    refusal_note: "⚠ v9 IN-13: the `object` key went with its conjunct (`requires_typed_note`). KEYED PER CLAUSE (`04 §B.13` invariant 4's per-conjunct half), `requisition`'s shape. `seize.unauthorized` -- the SEAT, at `authority`: none exercised grants `issue`, or its purview does not reach the subject's place; a SEAT named as the subject refuses here (an Office has no place, so no purview). `seize.refused` -- the WORLD, at `write`: the subject is neither a held Record nor an occupied settlement, or the effect declined (Record half: no held warrant names the Record, the actor already holds it, or nobody else does; Rung half: the actor is not committed to the seat's faction, that faction is not mustered there, nobody holds the town or the seat's own faction does, or the actor already holds it). No counterparty clause: the row names no second party (K-04)."
    grade:       "assumption"
    grade_note:  "an argued addition (#453 §10.4 step 6): the matrix rows `(Tenure, until)` and `(Tenure, since)` are the tree's; the row, its `remit:issue` eligibility, the `seizure` basis and the warrant reading are v9 IN-12's, on #453 `:1412` and `:1662`."
    source:      "v9 IN-12 step 6 (`workplans/valoria_master_workplan_v9_part5.md`), on #453 (`proposals/2026-10-03-verb-coverage-and-gap-fill.md`) §9.1 `:1662-1698`"
  - verb:        "speak"
    stratum:     "social"
    eligibility: ["own"]
    beneficiary: "none"
    requires:    "a live occasion at the actor's venue whose docket names the subject"
    requires_typed:
      form:      existence
      of:        subject
      kind:      DocketItem
    requires_typed_note: "v9 SC-01 step 12 (B-N). The proceedings design's own cell, one clause (`04_VERBS.md` §B.1: `form: existence, of: subject, kind: DocketItem`), and `determine`'s `docket` conjunct exactly: the matter is on a docket (`world_q.docketed`, the reader's `docket` branch). It is what stops `speak` being a way to chat: no docket item names the subject, no contest. THE VENUE HALF IS NOT TYPED, as `determine`'s date half is not: a docket item has no venue key, a dateless one (`carry`'s, and `open_case`'s where no slot is open) names no sitting at all, and a filled slot reaches a venue only through its `date`'s Date, which no operand of this cell reads -- so *at the actor's venue* has no operand to read. Unnamed and flat (`survey`'s precedent): one conjunct, one refusal kind. Was `—`, untyped, uncontested, `writes: []`, emitting `speech.made` -- the emptiest row in the table, formed and executed on any referent."
    contests:    "a matter"
    contests_note: "v9 SC-01 step 12: `04_VERBS.md` §B.1's prize, *the proceeding is ONE act at the season scale*. `rosters.yaml: contest_subsystems.prizes` carries an `a matter` row, added at step 12 routed to the interim `sigma_leverage` provider (the one `tell`'s `a standing` resolved through) and repointed to the social contest container's `social_contest` provider at steps 13 + 15 (ED-SC-0033 clause (2), ONE commit), so a docketed `speak` resolves there. The opponent is `subject` (the row names no `counterparty:`), so the docketed matter's party stands against the speaker when it is a person, and the provider's `obstacle_default` stands in when it is not (`modules/social_contest/roll.py::obstacle`, under `H-213`'s ceiling since step 14). ⚠ LIMIT, `opening_set`'s contested-verb rule: a person never forms a `speak` whose subject is himself (*a person is not his own adversary*), so a docketed party does not speak to his own matter in computed play."
    writes:
      Overwhelming: []
      Success:      []
      Partial:      []
      Failure:      []
    writes_note: "⚠ EMPTY AT EVERY BAND, AND THE DESIGN'S ROW IS NOT, SO THIS IS A STOP, NOT A READING (v9 SC-01 step 12; the measurement is `hole_register.yaml` `H-63`'s step-12 clause). `04_VERBS.md` §B.1 writes `Person.stance` on `Overwhelming`/`Success`/`Failure` (the SPEAKER's own, (ix)) and `DocketItem.matter` on `Partial` (*the docket grows*, (vii)). NEITHER IS BUILT: (1) the stance write names no VALUE -- no referent, sign or weight (`H-63`: Part E names the cell, never the value; `march`'s `(faction, -1.0, w)` rows are a different act's); (2) `Partial`'s append has NO CARRIER the gate can receipt -- `World.docket` is a SEQUENCE with no `get()` (`state/gate.py`), and `Partial` writes nothing else to ride on, which is the exact ground `carry` was declined on before v9 IN-45 gave it the petition's `Record.stages` -- and no operand names WHAT is docketed (*the speaker's operand*, `21_RECONCILIATION.md:576`). Building three bands' writes and not the fourth would make `Partial` the empty middle band §B.1 (vii) rejects, so all four write nothing, `tell`'s precedent (a contest whose product is a deposit at WITNESS), and `_eff_speak` does not exist (the plan builds it only for a non-empty `writes:`). Each band still leaves the room in a different place: what it emits is witnessed, so hearers hold which way the matter went. Revert: the row before SC-01 step 12 (above)."
    emits:
      Overwhelming: ["matter.carried"]
      Success:      ["matter.advanced"]
      Partial:      ["matter.held"]
      Failure:      ["matter.turned"]
    emits_note: "v9 SC-01 step 12: §B.1's emissions, one per band, keyed on the ladder's own four names (`degree_from_net`'s labels; the design's coined `Carried · Advanced · Held · Turned` keys would raise at the first fold). `Partial`'s second kind, `docket.formed`, is NOT declared: it reports the docket write the row does not make (`writes_note`), and declaring it would publish a docket that did not form (`ID-9`)."
    emits_on_refusal: ["speech.unheard"]
    refusal_note: "v9 SC-01 step 12: §B.1's refusal kind. FLAT, one kind for the one clause, which is also what the party-gap refusal of a contested row emits (`data/verbs.py`, invariant 4's contested half). Refusal conditions: no docket item names the subject; and, on a docketed matter, S27.4 (`Ob > 2 x Pool`): a speaker whose pool is under 1D is refused by the provider and the fold emits this kind rather than aborting the season (`loop/resolve.py::_contest`; `tests/test_sc01_speak.py::test_sc01_s12_a_speaker_under_one_die_is_refused_not_a_crash`)."
    grade:       "assumption"
    source:      "ARCHITECTURE_V2.md §E3, transcribed; typed cell, prize, bands and refusal at v9 SC-01 step 12 (`workplans/valoria_master_workplan_v9_part6.md` §SC-01), on `proposals/2026-09-05-proceedings-subsystem/04_VERBS.md` §B.1 (design intent) and `21_RECONCILIATION.md:576`"
  - verb:        "succeed"
    scale:   "person"
    scale_note: "succession is one person taking another's tenure; the office's rung does not change"
    stratum:     "binding_decision"
    eligibility: ["own"]
    beneficiary: "subject"
    requires:    "the actor holds the office or estate whose heir is being designated"
    requires_typed:
      form:      relation
      of:        subject
      relation:  held_by
    requires_typed_note: "W3's cell — *the actor holds the office or estate whose heir is being designated* (`succeed` is a W3 addition; #353 `:371`, `:542` name it and Part E omits it). §F.24a form 5, whose named live cell is this one. The relation is a live `hold` Tenure from the actor to the subject."
    writes:      ["Tenure.since"]
    emits:       ["heir.designated"]
    emits_on_refusal: ["succession.refused"]
    grade:       "assumption"
    writes_note: "a `succeed` Tenure -- the kind is in `rosters.yaml`"
    effect_decline_note: "PLAN POSITION `14` (U7-own) STOPPED ON IT, AND THE GROUND IS `ID-13` -- A CARRIER NOBODY READS -- TOGETHER WITH THE HEIR OPERAND THE ROW DOES NOT BIND (both are given below). ⚠ AN EARLIER READING OF THIS NOTE WAS FALSE AND IS CORRECTED HERE: it rested on `holonic §15` (a `succeed` edge is `Rung -> Person`, a Tenure its subject's), so *no gate basis admits the holder's write* and `release` *cannot end one*. `architecture/meta/04_CODE_ARCHITECTURE.md` §A.3 row 8 (`:190`) overrides §15 -- `succeed : Person -> Person`, owned by the holder -- so `state/gate.py`'s `T-m` (`:707-710`) admits the owner opening one, and `release`'s `domain:` includes `succeed` (that row), so the holder can also end it. WHAT STOPS IT: (1) its one reader, transmission at death (#353 `:542`), is unbuilt (`state/carriers.py:938-941` deleted the `transmission` field for want of a reader), so an executed `succeed` would write an edge nothing reads; a MATTER death transmission reading the live `succeed` edge is the reader that would make it live. (2) the row binds no operand for the HEIR: the typed cell names the actor and a `subject` he holds, and the edge's other end has no operand in this row. The decline stands."
    source:      "W3 -- heir designation. #353 `:371`, `:542` name `succeed` as a Tenure kind and `transmission` as the mechanism, and Part E carries no verb that CREATES one. Without it F13's contested-succession cases have no producer."
  # ===========================================================================================
  # PLAN POSITION `20-iii` -- THE INFORMATION CLUSTER (narrative #14 §F, `D1-a`). A person cannot
  # read a faction: a `View` holds his own claims, and `AX-2` puts world truth nowhere inside a
  # decision. Proposal 14 (`proposals/2026-09-12-emergent-narrative-primitives-v2/01_THE_TEN.md`)
  # makes the faction-scale picture DIEGETIC instead -- a document somebody had to make, dated by
  # when it was made, which can be wrong, burned or handed on -- and puts the price on MAKING it:
  # *"Free to read, costly to obtain, stale by construction."* `survey` is the act that pays.
  # ⚠ NAMED `survey`, THE ORDINARY WORD FOR *examine something whole and record what is there*, and

    contests:    "a field"
    writes:
      Declared:  []
      Won:       ["Person.body", "Person.stance", "Tenure.until", "Tenure.since", "Person.travel_leg", "Rung.stores", "Rung.stores"]
      Lost:      ["Person.body", "Person.stance", "Rung.stores", "Rung.stores"]

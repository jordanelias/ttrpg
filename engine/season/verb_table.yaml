    # refusal kind, and a contested verb can be refused by the seam at the depth cap (§C.5 returns
    # a typed Refusal, never a raise). A contest that cannot report its own refusal is D22.
    emits_on_refusal: ["kill.refused"]
    grade:       "ruled"
    source:      "ARCHITECTURE_V2.md §E3, transcribed; writes re-keyed by #358 rev.2 §C.4"

    writes_provision_note: "v9 IN-52 (the levy-to-field feed, [ASSUMPTION LF-3, delegated-ruled]): `Won` and `Lost` gain `Rung.stores` ONCE PER SIDE, `requisition`'s ×2 shape -- a fought field eats its ration from the attacker's treasury (the rung of `Act.via`'s office) and the defender's (the nearest held rung at or above the target), `settlements.provision`'s `consumed`, debited by `_eff_march` last, after the casualties and the arrival. Both pairs are check-only (the effect runs once, on `Person.body`). `Unopposed` fights no field and eats nothing. While `field_provisioning` is off (shipped) the entry consumes nothing and no store moves; the pairs are still gated, as every declared pair is. Revert: delete both pairs from both bands."
    writes_note: "v9 IN-13 (#453 §10.4 step 8, THE ARRIVAL): `Won` and `Unopposed` add `move`'s three pairs -- every claimant's live `contain` closes (`Tenure.until`), one opens to the destination (`Tenure.since`), and the destination is appended to his `Person.travel_leg` -- through `move`'s one journey body (`loop/effects_migration.py::_relocate`, keyed on the mover), at ENCOUNTER (`write_matrix.yaml`'s three `ENC` cells, M4's precedent). The gate admits the marcher's own legs as `T-m` and every other claimant's under `muster` (`state/gate.py::may_muster`: the seat granted `dispatch`, the claimant committed to its faction). `Lost` is unchanged -- a routed army stays at its origin (#453 R-7, [ASSUMPTION; medium; Jordan to correct]). No `hold` is written on any band: a won field moves presence, never title (#453 R-6, β). CP-T04-06 (B10-12, AM-C-11): `Invested` writes `(Site, condition)` ALONE -- under the `besiege` posture (`march_postures`) an OPPOSED march fights no field, relocates nobody and hurts nobody, and `loop/effects_combat.py::_eff_march` lowers each garrison Site in the target's subtree by `condition -= _fall(w, site)` (`loop/effects_economy.py`, `sabotage`'s one formula) WRITTEN DIRECTLY through the gate: wear staged through `World.stage` at ENCOUNTER is never applied (`loop/encounter.py` has no `take_staged`; the accumulator is RESOLVE-scoped). No accumulator, no fixture, no ratio. No `travel_leg` is written: a besieger makes no journey. An unopposed `besiege` is `Unopposed`, as a storm would be. A band whose subtree holds no garrison with condition to lose writes nothing and declines to `march.refused`. Revert: delete the `Invested` band."
    writes_grade_note: "M4 (`ED-IN-0279` clause (a)), Jordan's ruling on the second open clause: a loss writes \"casualties only, decrease in morale, and a grudge token\" -- nothing else, and nothing specified for the winner. `Won`/`Lost` here are the ATTACKER's own outcome (`seam/ladder.py::field_degree`), so `_eff_march` reads which SIDE actually lost from `resolution.result`'s `parties` and writes there -- the defenders on `Won`, the attacker's own claimants on `Lost`. CR-24 (`field_winner_casualties`, `H-360`, shipped `engine`): the winners take their own engine casualties on `body` only, each at his own side's or subunit's survivor ratio -- no stance row, no morale hit, and a winner is not a loser (`touched`); `off` is the field as it was. `Declared` writes nothing: it is RESOLVE's own deferral fold (`loop/resolve.py::_contest`). ⚠ SINCE v9 IN-13 an unopposed march, which has no losing side to write on, writes the ARRIVAL (`writes_note`), as `Won` does beside its casualties. v9 IN-52: the ration debit on `Won`/`Lost` (`writes_provision_note`) is not a loss effect: both sides of a fought field eat (LF-2/LF-3, delegated-ruled, `_part5` section J.2), and the sentences above govern casualties, morale and the grudge token: nothing specified for the winner, and CR-24 gives the winner a `body` casualty only. B17.01 (A-67, A-68, A-70, A-80, A-81): `Drawn` is the band of a field in which both sides are out (routed or conceded) or neither is (`seam/ladder.py::field_degree`): every band names its durable write, and `Drawn`'s is each side's `body`, scaled by its own side's (or own subunit's) share exactly as a winner's is (`field_casualty_model`), the ration debit as on `Won` and `Lost`, and `field.drawn` told to those present. No stance row is written (nobody lost), nobody is relocated (each army stands at its station: the aggressor where the march began, the defender at its own base, so there is no journey to write), and the fatigue half of A-69 is `27_MB_E`'s write (B22)."

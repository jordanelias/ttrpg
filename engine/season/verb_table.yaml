  - verb:        "establish"
    scale:   "settlement"
    scale_note: "founding an office is an act on the rung that will hold it"
    stratum:     "binding_decision"
    eligibility: ["remit:confer"]
    beneficiary: "none"
    requires:    "the establishing office's conferral basis, and a rung to establish it at"
    requires_note: "`13f` (2026-09-25) evaluates this as `_req_establish` in `loop/predicates.py`, and THE READING IS STATED THERE: *the establishing office* is the office the act describes -- the one being founded, or re-remitted on an id that exists -- NOT the office the actor sits in. That office's declared `conferral` must pass the SAME basis test `_req_confer` asks (`has_conferral_basis`), so an establish can never found a seat `confer` would refuse forever. Operands ride on the payload: `office`, `post`, `rung`, `remit`, `body` and/or `faction`, `conferral`, optional `revocation` -- the office overlay's own keys. A computed act carries none of them (`requires_typed` is absent, so `operands_for` returns `{}`) and REFUSES until `15c` widens the operand vocabulary."
    writes:      ["Office.exists", "Office.remit_acts", "Tenure.payload"]
    writes_note: "`13f`: `Office.remit` -> `Office.remit_acts`, the key reconciled at the matrix row (see that row). `Tenure.payload` ADDED because the effect re-stamps the grant on every live `hold` on the office it writes, through `World._grant_remit`, and the fold gates exactly the pairs a verb declares -- undeclared, that write would ride under the `Office` pair's gate. ⚠ `Office.establishment` WAS THE THIRD ENTRY, declared and never written, and plan position `17a` DELETED it with the field and its matrix row (r2 `05:214-221`, *three edits, not one*): who serves a seat is `world_q.establishment_of`, a Query over live `oblige` Tenures, which this verb does not write."
    emits:       ["office.established", "remit.changed", "tenure.payload_set"]

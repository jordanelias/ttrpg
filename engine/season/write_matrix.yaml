# PART D, AS DATA -- the write matrix keyed on `(kind, field)`.
#
# W2 of `architecture/PLAN.md`. `ARCHITECTURE_V2.md` §D3 is the
# source and this file is the object: `tracer/shape.py`'s `write()` gate reads it, and six
# hand-maintained Python structures -- `WRITE_MATRIX`, `WRITE_CLASS_OF`, `PARTITION`,
# `PARTITION_ASSUMED`, `MATRIX_FIELD_OF`, `PARTITION_MISSING` -- are replaced by a loader.
#
# WHY THE RE-KEYING IS THE WHOLE POINT (defect `D1`). #353 §30's matrix names THINGS -- `stance`,
# `condition`, `Tenure` -- not `(kind, field)` pairs, so `(Person, convictions)` RODE ON `stance`'s
# row and a real gap silently became a PASS. Two rows and two declared-missing cannot type ~30
# fields. Keyed this way, the rule §30 already states -- ANY UNMARKED CELL IS A WRITE-CLASS
# VIOLATION -- becomes applicable rather than aspirational.
#
# THE `class` COLUMN IS DERIVED, NOT STORED TWICE. A step determines its write class exactly:
# CAL->CALENDAR, MAT->MATTER, RES->ACTS, WIT->INTERIOR, CEN->MATTER, DEL->ACTS. The `class:` field
# carries V2's own string so the derivation can be CHECKED against the prose it came from; the
# loader asserts they agree and raises if they do not. One owner, one cross-check.
#
# `social:` IS A STATIC SCHEMA COLUMN (L4) and takes `true`, `false` or `n/a` -- never a
# per-step value. `(Date, due_at)` was the one row that broke this, and W2 struck its CAL cell
# rather than keep a column that varies by step.
#
# ONE NOTATION NORMALISATION, declared rather than left to be discovered. V2 writes two keys with
# a subscript -- `(Person, scar[axis])` and `(Person, axis_count[axis])`. The `[axis]` says ONE ROW
# PER AXIS; it is not part of the field name, and the row is the same row for every axis. The key
# here is `scar` / `axis_count`, and the keying is carried in `by:`. The roster of axes is its own
# hole (`H-20`, and its enumeration is `H-46`), which is where it belongs.
#
# PROVENANCE. The 28 rows carried over are extracted mechanically from §D3's markdown table;
# `python tracer/register.py --verify-write-matrix` re-extracts and fails on drift. The 10 rows
# W2 ADDS each name the §1.4 hole they carry and the `hole_register.yaml` row that grades it, so
# no row here is a value nobody can trace.

# =============================================================================================
# ⚠ CONDITIONED BY #358 rev.2, 2026-09-03 — INVARIANT 2, MEASURED RATHER THAN ASSERTED.
#
# #358 rev.2 build step 2 says this file cannot pass its loader today, and the first publication
# named TWO failing rows. Measured against this table and `verb_table.yaml` together, the count is
# ELEVEN, and both smaller figures were wrong in different ways.
#
#   Reproduce:
#     python3 -c "import yaml; rows=yaml.safe_load(open('write_matrix.yaml'))['rows']; \
#       v=yaml.safe_load(open('verb_table.yaml'))['verbs']; p=set(); \
#       [p.update(sum(x['writes'].values(),[]) if isinstance(x.get('writes'),dict) else (x.get('writes') or [])) for x in v]; \
#       print([f\"{r['kind']}.{r['field']}\" for r in rows if 'RES' in (r.get('steps') or []) and f\"{r['kind']}.{r['field']}\" not in p])"
#
#   ELEVEN RES-stepped rows with no producing verb:
#     Date.fired · Rung.dates · Rung.exists · Site.exists · Tenure.payload
#     Person.axis_count · Person.beliefs · Person.coherence · Person.convictions
#     Person.scar · Person.stance
#
#   NINE after #358 rev.2's two schema changes land: `Person.beliefs` is DELETED (§D.1.1 -- a
#   belief is a `commit` to an OUGHT, not a field) and `Tenure.payload` is REPLACED by `term?`
#   (§B.8). Both figures are true of their own basis; a session citing either must say which.
#
#   Date.fired is now fixed in place (below) -- it was a data error, not a hole.
#
# ⚠ THE SIX `Person` ROWS ARE THE FINDING, AND THEY ARE ONE HOLE, NOT SIX.
# NO VERB IN THE 32-ROW TABLE WRITES ANY `Person` INTERIOR FIELD. That is tier-0 `H-62`, and it
# means every interior consequence is inert: convictions cannot move, so `choose` scores against a
# constant and `standing` has nothing to diverge from. #358 rev.2 §C.4 supplies the SHAPE of the
# answer -- an interior write is a CONSEQUENCE OF AN OUTCOME, which is what the new `Degree`-keyed
# `writes` column declares. The verbs are still unwritten; what changed is that there is now a
# column to write them in.
#
# ⚠ AND THE HEADER'S OWN RETIREMENT RULE IS NOT APPLIED TO ITSELF. This file retires rows with no
# producing verb; eleven such rows are live. The discrepancy is tracked (H-41, H-50, H-62) and the
# rule as stated is false of its own table -- recorded, per §0.1 pt 3, rather than quietly widened.
# =============================================================================================

rows:
  - kind:    "Act[]"
    field:   "returned"
    steps:   [DEL]
    class:   "ACTS"
    social:  "n/a"
    by:      "DELIBERATE writes nothing else"
    emits:   "—"
  - kind:    "Claim"
    field:   "confidence"
    steps:   [MAT]
    class:   "MATTER"
    social:  "false"
    by:      "W2/H-40 -- the THIRD licensed clock (#353 :864). Part D carried NO `Claim` row, so Part D was not total for a clock #353 licenses -- V2's own falsifier at §I1 row 1"
    emits:   "`claim.decayed`"
  - kind:    "ConveningCondition"
    field:   "attached"
    steps:   [CAL, RES]
    class:   "CALENDAR/ACTS"
    social:  "false"
    by:      "DR-3"
    emits:   "`condition.attached`"
  - kind:    "Date"
    field:   "due_at"
    steps:   [RES]
    class:   "ACTS"
    social:  "true"
    by:      "W2 -- CAL struck. `due_at` is written ONLY by `convene`, which is an act (Part E), and V2 marked the row `true at RES` on a column L4 calls a STATIC SCHEMA COLUMN. A per-step `social:` is not a static column"
    emits:   "`date.scheduled`"
  - kind:    "Date"
    field:   "fired"
    # ⚠ `RES` DROPPED 2026-09-03 (#358 rev.2 invariant 2). This row's own provenance says
    # "§24 has NO ACTOR" -- a date fires because the calendar reaches it, which is CAL. The `RES`
    # made it an ACTS-class row, so invariant 2 demanded a producing VERB for a thing no person
    # does, and no verb has ever written it. This is a data error, not a hole: the column
    # contradicted the `by:` cell on its own line.
    steps:   [CAL]
    class:   "CALENDAR"
    social:  "false"
    by:      "DR-3 · §24 has no actor"
    emits:   "`date.fired`"
  - kind:    "Dispensation"
    field:   "exists"
    steps:   [RES]
    class:   "ACTS"
    social:  "true"
    by:      "W2/H-43 -- as `(Petition, exists)`"
    emits:   "`dispensation.issued`"
  - kind:    "DocketItem"
    field:   "matter"
    steps:   [CAL, RES]
    class:   "CALENDAR/ACTS"
    social:  "false"
    by:      "DR-3 · §24 *\"dockets form\"*, no actor"
    emits:   "`docket.formed`"
  - kind:    "Office"
    field:   "exists"
    steps:   [RES]
    class:   "ACTS"
    social:  "true"
    by:      "W2/H-41 -- establishing an office"
    emits:   "`office.established`"
  - kind:    "Office"
    field:   "establishment"
    steps:   [RES]
    class:   "ACTS"
    social:  "true"
    by:      "DR-2. ⚠ RETIRED BY W2 for having no producing verb, RETURNED BY W3 WITH `establish`, which is the discipline the retirement rule encodes: a row exists because a producer produces it. Its SIZE per office kind is H-34 and stays `assumption`"
    emits:   "`establishment.changed`"
  - kind:    "Office"
    field:   "remit"
    steps:   [RES]
    class:   "ACTS"
    social:  "true"
    by:      "DR-2 -- `establish` is an act. ⚠ RETIRED BY W2, RETURNED BY W3 WITH its producer. V2 named `establish` in THIS ROW while giving it no verb row, which is how the row came to look dead"
    emits:   "`remit.changed`"
  - kind:    "Person"
    field:   "axis_count"
    steps:   [RES]
    class:   "ACTS"
    social:  "true"
    by:      "ONE ROW PER AXIS (V2 writes it `axis_count[axis]`). D6. L3 clause 1's counter. `axis` on D6's registry"
    emits:   "`axis.incremented`"
  - kind:    "Person"
    field:   "beliefs"
    steps:   [RES]
    class:   "ACTS"
    social:  "true"
    by:      "DR-2; §9.3"
    emits:   "`belief.revised`"
  - kind:    "Person"
    field:   "body"
    steps:   [MAT, RES]
    class:   "MATTER/ACTS"
    social:  "false"
    by:      "DR-1"
    emits:   "`body.changed` · `person.died`"
  - kind:    "Person"
    field:   "claim_ledger"
    steps:   [WIT]
    class:   "INTERIOR"
    social:  "false"
    by:      "DR-3 · §20 makes `witness` the only minter, and it is not an act"
    emits:   "`claim.deposited`"
  - kind:    "Person"
    field:   "coherence"
    steps:   [RES]
    class:   "ACTS"
    social:  "false"
    by:      "W2/H-47, CORRECTED BY W2's ADVERSARIAL PASS -- IT WAS WRONG IN BOTH DIRECTIONS. It admitted MAT only, and #353 :98 puts the seam at RESOLVE via `contest`, so the ONE writer #353 licenses (:1904, 'written only through seam Events') would have RAISED -- an over-refusal, G4. And admitting MAT with `social: false` made THE WORLD a writer of coherence, which is a FOURTH LICENSED CLOCK against §25.1 :862-866, 'the three licensed clocks are exhaustive -- matter, bodies, and the confidence of a memory'. Now RES, `social: false` so a seam Event may write it, and the seam bound is ENFORCED IN `write()` on `(Tenure, until)`'s precedent rather than asserted in this cell -- a comment is not a constraint"
    emits:   "`coherence.changed`"
  - kind:    "Person"
    field:   "convictions"
    steps:   [RES]
    class:   "ACTS"
    social:  "true"
    by:      "DR-2; §9.3 — moved by argument and consequence, never by evidence"
    emits:   "`conviction.moved`"
  - kind:    "Person"
    field:   "exists"

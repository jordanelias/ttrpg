# RETIRED BY W2 -- kept as a list, not as rows, so a reader knows they went and why.
# Each carried an `emits:` kind that NO PART E VERB PRODUCES and no MATTER site
# writes (§7.2's per-item guardrail: such a row is red). Verified against Part E's
# `writes` column, not assumed.
# ⚠ TWO CAME BACK AT W3, WITH THEIR PRODUCER, and a third row -- `(Office, exists)` -- came
# with them. `establish` is a verb #353 names
# and Part E omits; V2 names it in its own `(Office, remit)` row. W3 adds the verb, and
# the row returns in the same commit -- which is the whole discipline the rule encodes:
# a row exists because a producer produces it.
retired:

      hardness: core
    - need: "Among the paths available to win a succession contest, one path must be able to run specifically through broad popular support, distinct from and tracked separately from elite or institutional backing."
      why: "The source specifically marks her succession path as running through popular mandate rather than institutional favor -- collapsing this into one generic 'win the succession' check erases the entire point of casting her as the communal candidate rather than an elite one."
      hardness: core
    - need: "A council seat must be able to represent a distinct constituency (rural or communal interests) whose preferences can diverge from and conflict with a different seat's urban or elite constituency, on the same council."
      why: "Her defining framing is as a communal voice against city power-politics; without a mechanical constituency divide, that framing has nothing to act against."
      hardness: important
    - need: "A person occupying a council seat must be able to step into an active dispute between two other named parties and reduce its severity or help broker a resolution, without thereby becoming the ruling authority over either party."
      why: "Her archetype is specifically a mediator, not a ruler or an interested party -- without a genuine third-party mediation action, the archetype reduces to 'another councillor with an opinion.'"

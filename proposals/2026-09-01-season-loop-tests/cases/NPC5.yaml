    - need: "A seat-holder's recorded convictions must be able to bias which side of a commune-versus-city dispute, or which succession candidate, she supports, in a way a third party can anticipate."
      why: "Without this, her two named dispositions are unused data rather than something that shapes her choices."
      hardness: important
    - need: "UNCLEAR: the source names the current office-holder whose fall would trigger the succession she is a candidate for, but no entry for that person appears in this extraction, so what office he holds, what would cause him to fall, and who the other succession candidates are, is unresolved from this data alone."
      why: "Without this, it's unclear what event actually starts her defining subplot or how contested it would be."
      hardness: important
    - need: "UNCLEAR: no territory is recorded for this character despite her title naming her a representative of a specific communal constituency, so which population or locality she actually represents is unspecified."
      why: "Without this, it's unclear whose interests her mediation and succession candidacy are meant to serve."
      hardness: important
    - need: "A seat-holder marked as not-yet-canonical must already carry a specific succession-eligibility flag that persists and matters if the triggering condition is ever authored into play."
      why: "Her development status should not by itself erase the conditional succession premise that is her main authored content."

- id: NPC-080
  name: Vidar Haldorsen
  one_line: A covert-order operative with zero of the perceptual sense that would let him detect a category of harm his own completed missions cause, framed explicitly as ignorance rather than malice.
  scale: person
  season_requires:
    - need: "A person must be able to hold a hard floor of zero in a perceptual capacity that governs whether he can detect a specific category of harm his own actions cause, such that he completes tasks with a real ongoing cost he is structurally incapable of noticing, through no fault of will or character."
      why: "This is the entire premise of the entry, explicitly framed against a 'pre-germ-theory surgeon' comparison -- without a hard, never-fluctuating zero (not merely low odds of noticing), he is just an agent who is sometimes unlucky, and the perceptual-limitation-not-malice point collapses."
      hardness: core
    - need: "Two members of the same covert operational role must be able to diverge on whether to complete or abort the same category of mission, where one member's abort decision is driven by information the other is constitutionally unable to perceive at all."
      why: "Without this divergence being mechanically live and visible in play, 'completes missions [a named colleague] aborts' is narration with no comparison point that demonstrates the perceptual gap actually changes outcomes."
      hardness: core
    - need: "A covert order must be able to assign or withhold specific missions based on which of its operatives can or cannot perceive a given risk category, using that as a deliberate selection criterion rather than assigning missions at random."
      why: "If mission assignment cannot route around a known perceptual gap, the order's practical use of this character specifically for the missions his colleague refuses has no mechanical basis."
      hardness: important
    - need: "A doctrine-following operative's recorded conviction toward honor and obedience must be able to keep him completing assigned missions even in a hypothetical where a colleague with different perception would refuse the same order on collateral grounds."
      why: "Without conviction driving continued compliance, the doctrine-versus-conscience contrast the entry sets up has no behavioral engine and is only asserted, not produced."
      hardness: important
    - need: "UNCLEAR: the source's role field names one individual as this character's dramatic foil, while its arc description names a different individual as the one whose aborted missions he specifically completes -- whether these are the same person under two labels, two distinct relationships, or one field is stale, is not resolved."
      why: "Without resolving this, it's unclear which relationship is actually meant to drive play."
      hardness: important
    - need: "A covert-ladder member marked as not-yet-canonical must be able to already carry a specific, load-bearing mechanical role (a named mission-completion foil dynamic) that persists and matters once the character is used in play, rather than that status blocking his use."
      why: "His development status should not by itself prevent his defining dynamic from functioning when called on."
      hardness: flavour
    - need: "A person with a hard-zero perceptual capacity must be able to eventually be shown, by some other party who does have that capacity, evidence of the harm he has been causing, in a way that could plausibly change his future choices once perceived."
      why: "Without a path from 'cannot see it' to 'can be shown it happened,' the tragic-ignorance framing the entry sets up has no possible resolution and he can never develop past being a pure instrument."
      hardness: important
  temporal:
    span_seasons: ongoing
    needs_memory_of: "which missions his colleague has refused and which he has since completed in her place; any occasion on which someone with the relevant perception has shown him evidence of the harm his missions caused"
    needs_deadline: "no"
  who_acts:
    - Vidar Haldorsen
    - the named colleague whose aborted missions he completes
    - the covert order's leadership, which assigns missions
    - a third party with the relevant perceptual capacity who could eventually reveal the harm to him
  knowledge:
    - "Vidar does not know, and by his own zero perceptual floor cannot come to know through his own senses, that his completed missions carry a specific category of collateral harm; only an outside party with the relevant capacity can surface this to him."
    - "UNCLEAR: whether his colleague or anyone else already knows about his perceptual blindness and is deliberately routing him toward the missions she refuses, or whether the pattern has arisen coincidentally, is unspecified."
  ends_when: "never specified -- no end condition is authored; the entry gestures at a hidden-capacity-revealed arc without stating what would trigger or resolve it"

- id: NPC-081
  name: Uta Falkenrath
  one_line: A council seat-holder representing communal rather than urban interests, named as a specific succession candidate should the current highest office-holder fall, via a distinctly popular rather than elite path.
  scale: faction
  season_requires:

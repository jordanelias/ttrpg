      why: "Without a channel from the leader's conduct to this subordinate's continued support, the named fracture line is color with no mechanical trigger and can never actually fire."
      hardness: core
    - need: "A military commander holding a named council seat must be able to command levies or forces distinct from the council's collective decision-making, so that his personal break with the faction's leader has a material consequence beyond a changed vote."
      why: "His title implies command of actual force; without a mobilizable command attached to the seat, his eventual defection or continued loyalty changes nothing tangible."
      hardness: important
    - need: "A seat-holder's recorded convictions must be able to bias how readily and at what threshold he breaks from a leader whose conduct offends the cause, distinguishing him from a differently-weighted colleague facing the identical leader conduct."
      why: "Without this, his two named dispositions are unused data rather than something that shapes when he actually breaks."
      hardness: important
    - need: "UNCLEAR: the source numbers this as a specific council seat, while two other characters in this extraction hold seats on the apparently same council without a stated number, and a separate faction-governing document states the council has only two named seats -- how many seats the council actually has, and where this numbered seat sits relative to the others, is unresolved."
      why: "Without this, it's unclear whether all these seat-holders can be seated simultaneously."
      hardness: flavour
    - need: "A seat-holder marked as not-yet-canonical must already carry a specific, nameable break condition -- the leader's ego diverging from the cause -- precise enough to be triggered later, rather than a vague personality note."
      why: "His development status should not by itself erase the specific, actionable premise that is his main authored content."
      hardness: flavour
    - need: "UNCLEAR: no territory is recorded for a titled military commander, so whether he commands levies tied to a specific mapped territory or holds an unlanded, peninsula-wide military office is unspecified."
      why: "Without this, it's unclear what physical force actually follows him if he breaks."
      hardness: important
  temporal:
    span_seasons: ongoing
    needs_memory_of: "how far the leader's conduct has diverged from the cause across seasons, since a single incident is unlikely to be sufficient alone, and whether this character has already broken, remained loyal, or is still watching"
    needs_deadline: "no"
  who_acts:

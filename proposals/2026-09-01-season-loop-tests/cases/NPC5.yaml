  ends_when: "never specified -- an ongoing external-threat governance role with no stated resolution condition"

- id: NPC-090
  name: Stephanos Doukas
  one_line: A foreign empire's trade official enforcing a pre-existing treaty at a named interface, in an ongoing paired relationship with a specific named counterparty from the other side.
  scale: faction
  season_requires:
    - need: "A trade relationship between two polities must be able to be governed by a specific pre-existing treaty whose terms constrain what either side's trade officials can unilaterally change, such that violating or renegotiating it is a distinguishable act from ordinary commerce."
      why: "'Enforces ancient trade treaties' presupposes the treaty is a real constraining document, not decorative history -- without enforceable terms, there is nothing for him to enforce."
      hardness: core
    - need: "Two named officials from different polities must be able to interact directly and repeatedly over the same ongoing trade relationship, with each one's individual choices -- strict enforcement versus flexibility -- shifting the relationship's trajectory."
      why: "Being 'counterparty to' a specific named individual describes a recurring bilateral relationship, not a one-off encounter -- without recurring paired interaction, the counterparty framing is unused."
      hardness: core
    - need: "A trade official's recorded conviction toward established precedent and order must be able to bias him toward strict, by-the-letter enforcement of old treaty terms even where a more flexible reading would be more advantageous, in a way his counterparty can anticipate and plan around."
      why: "Without predictable rigidity, his archetype -- a famously exacting, rule-bound regulator -- reduces to a generic trade contact."
      hardness: important
    - need: "The regulated trade interface must be able to generate a specific, resolvable dispute -- a violation, a disputed toll, a smuggling attempt, a request for an exception -- that the two counterparty officials must jointly or adversarially resolve, distinct from the treaty's terms simply applying themselves automatically."

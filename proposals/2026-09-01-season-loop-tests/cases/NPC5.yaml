  temporal:
    span_seasons: ongoing
    needs_memory_of: "whether the sitting office-holder has fallen, whether a succession contest has opened, any standing support she has accumulated toward the popular-mandate path, and the current state of any commune-versus-city dispute she has mediated"
    needs_deadline: "no fixed date is stated; a succession contest, once triggered, would plausibly need one, but the source is silent on it"
  who_acts:

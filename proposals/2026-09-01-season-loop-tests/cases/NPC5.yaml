- id: NPC-089
  name: Zoe Palaiologina
  one_line: A frontier governor of a foreign empire who is the personal decision-point for whether that empire probes, pressures, or invades the peninsula, driven by a sincerely-held imperial conviction rather than cynicism.
  scale: realm
  season_requires:
    - need: "A foreign power's posture toward a neighboring territory must be selectable, on a recurring basis, from at least three qualitatively different graduated options -- a minimal probing action, a more assertive pressure action, and outright invasion -- each carrying different costs and different threshold conditions for the more severe response."
      why: "Deciding whether the empire 'probes, presses, or invades' is a structured three-way choice, not a binary war-or-peace toggle -- without the middle option being genuinely distinct with its own consequences, the whole escalation ladder collapses to a coin flip."
      hardness: core
    - need: "A single named frontier governor must be able to be the actual decision-point for which of those graduated postures her empire takes, such that influencing, replacing, or removing her personally changes which option gets chosen."
      why: "Without her being the real locus of decision rather than a passive reporter of a decision made elsewhere, she is a titled placeholder and the entire 'foreign threat governed by one person's judgment' premise fails."
      hardness: core
    - need: "A frontier governor's recorded conviction toward her own polity's legitimacy and mission -- framed explicitly as sincere rather than cynical -- must be able to bias her escalation choice toward more assertive options than a self-interested equivalent in her seat would choose, in a way a third party could exploit or work around."
      why: "Her sincerity is presented as a specific, load-bearing character trait, implicitly contrasted against opportunism; without it actually shifting her decisions, it is unused flavor."
      hardness: important
    - need: "Actions taken by the neighboring power she is watching must be able to visibly shift which of the three postures currently looks justified to her, so that choices on that side can provoke or de-escalate her rather than her following a fixed script."
      why: "Without her escalation ladder being responsive to observable conduct, there is no way for the neighboring side's play to affect the external threat level at all."
      hardness: important
    - need: "UNCLEAR: the source does not state what territory or frontier zone she governs, nor what resources -- troops, ships, administrative reach -- her office commands, so the material weight behind any of the three postures is unspecified."
      why: "Without this, it's unclear how large a consequence 'invade' would actually be relative to 'press.'"
      hardness: important
    - need: "UNCLEAR: whether her decision is made unilaterally from her frontier post or requires authorization from a more senior authority above her is not stated."
      why: "Without this, it's unclear whether influencing her alone is sufficient to change the empire's posture, or whether a higher authority could simply override her."
      hardness: important
    - need: "A person marked as not-yet-canonical must already carry a fully-formed three-option escalation framework precise enough to drive distinguishable outcomes for the wider external-threat axis, rather than a vague personality note."
      why: "Her development status should not by itself erase the concrete decision structure that is her main authored content."
      hardness: flavour
  temporal:
    span_seasons: ongoing
    needs_memory_of: "the current posture level and what conduct on the neighboring side has pushed it up or down across past seasons"
    needs_deadline: "unclear -- an active graduated-threat ladder implies accumulating pressure toward invasion, but the source states no specific date"
  who_acts:
    - Zoe Palaiologina
    - a more senior authority above her, if one exists (unnamed in the source)
    - the neighboring factions whose conduct she observes
  knowledge:

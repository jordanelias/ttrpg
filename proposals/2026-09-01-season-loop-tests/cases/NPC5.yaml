    - "Any parties she mediates between would need to know she is acting as a neutral broker rather than an interested party for the mediation to function as described; the source does not specify how that neutrality is established or verified."
  ends_when: "never specified -- an ongoing council seat with a conditional succession subplot that only resolves if and when the triggering vacancy is authored"

- id: NPC-082
  name: Njal Torberg

# NPC-086 — `exercises:` for `W10`'s declared routing.
#
# ⚠ AUTHORED BY READING EACH ROW, NOT BY MATCHING IT. `PLAN.md` `W10` retired the regex
# router precisely so a binding could be argued with; every `from:` below names what the
# row rests on and why, and a reader who disagrees can say which row is wrong. Nothing here

    default:   "BOUNDED, AND UNDER THIS INSTRUMENT'S OWN FIXTURES IT CANNOT AMPLIFY AT ALL -- which is a statement about the fixtures, not about the topology. Three devices: `ask_budget` (five scenes a season, so a person cannot act on every question they form), `ledger_cap` = 200 with eviction on `(confidence, recency)`, and `claim_decay_per_season` -- all three are `DEFAULT_FIXTURES` literals in `shape.py`. ⚠ AND A FOURTH THAT IS NOT A BOUND BUT FLATTENS IT ANYWAY: `question_aggregation_rule: first` collapses any number of landed claims to ONE question per person per season, so acts do not grow with claims however many land. ⚠ THE LOOP'S PERIOD IS ONE SEASON -- WITNESS at the end of `t` is read at DELIBERATE in `t+1` -- so the budget cuts it EVERY PERIOD rather than between periods; the first writing of this cell said the opposite"

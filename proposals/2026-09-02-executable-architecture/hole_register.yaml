  - id:        H-36
    tier:      1
    hole:      "refraction: emitter- or receiver-side, and by how much"
    kind:      "RULING + FORMULA"
    owner:     "the design; params"
    grade:     "ruled"
    default:   "RECEIVER-SIDE. ⚠ AN EMISSION IS NEVER DISTORTED (Jordan, 2026-09-02): what refracts is the PREMISES AND RATIONALE, minted per receiver as a Claim. The MAGNITUDE is a separate hole and stays open"
    site:      ""
    sweep:     []
    unblocks:  "2"
    cite:      "✅ RULED BY JORDAN, 2026-09-02, on the escalation this row raised, in two statements. FIRST, VERBATIM: 'Receiver side distortion, if I understand without much context, makes more sense as people's actions are objectively the case but the meaning of those actions are subject to interpretation - signified vs signifier.' THEN, SHARPENED AND VERBATIM: 'emissions are never distorted as that implies the veracity of an action actively being performed is disjunct in actuality from its performance. instead, only the premises and rationale are distorted, which again points towards receiver side.' THE SECOND STATEMENT IS THE STRONGER ONE AND IT CLOSES THE EMITTER-SIDE READING RATHER THAN OUTWEIGHING IT: an Event is what HAPPENED, so distorting an emission would make an action's veracity disjunct from its performance -- the world lying about what occurred. What distorts is the interpretive layer. This is #353's architecture exactly: the Event carries what happened and carries NO actor and NO target (:666-670), and 'attribution is a per-witness Claim, not a field on the Event' (:668). The act is the signifier and is objective; the premises and rationale are the signified and are minted per receiver. IT ALSO DISSOLVES §37.4's COLLISION instead of picking a side -- R-2's 'emitting a refraction' cannot mean a distorted Event, so it is MODULE-level downward influence, and `refract` the act is person-level: two different things, not two answers. MECHANICAL CONSEQUENCE, RECORDED: a `refract` writes a CLAIM about a Dispensation's terms; it never writes the `dispensation.issued` Event. THIRD, THE PLAINEST FORM AND THE ONE A LATER SESSION WILL CARRY, VERBATIM: 'we can't control how others perceive and interpret our words or actions.' FOURTH, THE GENERAL FORM, VERBATIM: 'which in turn means that our understanding of all other words and actions is subjective and singular.' ⚠ THE FOURTH STATEMENT REACHES BEYOND THIS ROW and is recorded here because this is where it was ruled: it is not a fact about dispensations, it is a fact about EVERY claim. #353 already builds it -- `witness` is the only minter and mints PER PERSON, and `(Person, claim_ledger)` is INTERIOR. Two other rows inherit it. H-39, the construal spread: if understanding is SINGULAR per person, a cohort's spread is the spread ACROSS its members, not a distribution inside one -- which settles the representation the row was about. H-33, the witness channels: fan-out decides WHO forms an understanding, and each forms their own, so a channel predicate can never be a shared-interpretation mechanism. ⚠ HOW THIS ROW GOT HERE MATTERS AND IS NOT SMOOTHED OVER. PLAN §3.4 closed it receiver-side AS A SESSION JUDGEMENT and offered it for objection; an adversarial pass OVERTURNED that closure on #353 §37.4 :1310-1316, twenty-two lines below the passage the closure cited and never read, which says the chain 'has not reconciled these' and 'this document does not pick one', and on §62 :1986-1994, which lists this question BESIDE scene-vs-act as a live design choice. The row was correctly `absent` and correctly Jordan's; it is `ruled` now because JORDAN RULED IT, not because a session closed it. ⚠ THE COST I RAISED IS ANSWERED BY THE SHARPENING: a SHARED misreading is a shared RATIONALE, which propagates through a shared teller or a shared document (the `document_key` channel, H-33) and needs no distorted emission to carry it."
    source:    "ARCHITECTURE_V2.md §VII.2, transcribed verbatim | V2's grade cell: **absent**"

# THE HOLE REGISTER -- AS DATA.
#
# W0 of `proposals/2026-09-02-executable-architecture/PLAN.md`. Everything in that plan waits on
# this file, for one reason: `ARCHITECTURE_V2.md` §0.3 row 13 claims Part VII is "rows, not
# prose", and IT WAS A MARKDOWN TABLE THAT NOTHING READ. Not one of its 32 rows carried the
# `site:`, `sweep:` or `cite:` fields its own §G4 defines; its self-reported counts did not
# reproduce from its own rows; and it could not report that TWENTY-TWO holes had no row at all.
# By `CLAUDE.md` §0.05's test -- would the game behave differently if this were deleted? -- it
# was reference. This file is the object. `tracer/register.py` is the only thing that reads it,
# and `register.py --check` is what makes a wrong row FAIL rather than merely read oddly.
#
# THE ROW SHAPE is `ARCHITECTURE_V2.md` §G4's TEN FIELDS VERBATIM --
#   id . hole . kind . owner . grade . default . site . sweep . unblocks . cite
# -- plus exactly TWO, declared here so nobody grows the shape quietly later (rule R0 fails on
# any row carrying a key outside this list, and on any row missing one):
#   tier    -- V2's own §VII.1 / §VII.2 split. Artifact 0 ("Part VII has no `absent` row in
#              Tier 0") IS STATED IN TERMS OF IT and cannot be checked without it.
#   source  -- where the row came from, and V2's cells verbatim where this file normalised them.
#              A transcription that cannot be re-derived is an assertion, and this register
#              exists because an assertion was mistaken for data.
#
# PROVENANCE OF THE 32 TRANSCRIBED ROWS. Extracted from the markdown tables of
# `ARCHITECTURE_V2.md` §VII.1 and §VII.2 by a parser rather than by hand. ⚠ **"Mechanical" is the
# wrong word for SEVEN of the 32**, and the exception is stated here rather than left to be found:
# two rows carry a JUDGED grade and five a normalised default (below). The other 25 are verbatim.
# `python register.py --verify-transcription` re-extracts all 32 and fails if `hole`, `kind`,
# `owner`, `unblocks`, `tier` or `default` has drifted from V2 IN EITHER DIRECTION -- `default`
# through its one declared normalisation, and `grade` deliberately NOT pinned, because W1 re-grades
# by design and its re-grades are reported as notes. Two normalisations, both per row in `source:`:
#   * H-10's `sweep: [2, 5, 9]`, which V2 supplies inside its `default` CELL ("swept 2·5·9")
#     rather than in a sweep field. Recovering it is extraction, not invention.
#   * an `absent` row whose default reads "none" FOLLOWED BY COMMENTARY ("none. ⚠ every contest
#     is blocked") is normalised to `none`. The field means *the value an instrument may inject*,
#     and a warning is not a value.
#
# GRADE, WHERE V2 GIVES MORE THAN ONE. Two rows -- H-02 and H-20 -- carry split grades. The
# register records THE STRICTEST GRADE PRESENT, because §42.2's polarity rule sends zero evidence
# to the verdict AGAINST the thing measured: a hole that is `absent` in part must refuse in part,
# and refusing is the only question a grade answers. ⚠ BOTH THEN FAIL RULE R3, because V2 supplies
# each of them a default. THAT IS A TRUE FINDING AND NOT NOISE: a part-absent, part-ruled hole with
# one `default:` field is NOT REPRESENTABLE in §G4's shape, and §42.2.1 forbids the combination it
# expresses. Do not "fix" it by deleting the default -- fix it by splitting the hole, which is
# W3's work for H-02 and W1's for H-20.
#
# WHY SO MANY ROWS CARRY AN EMPTY `cite:` -- `register.py --counts` prints the figure, and this
# comment does not, because stating one here is the defect the last paragraph forbids. It is the
# measurement, not an omission. Rule G6 requires
# `CLAUDE.md` §0's five tests to have been RUN before a row is graded `absent`, with the result in
# `cite:`. `PLAN.md` §2.6's finding is that NOBODY EVER RAN THAT LADDER. So the rows stand as V2
# left them, `register.py --check` FAILS on G6, and it names every row. W1 is the item that runs
# the ladder. A `cite:` backfilled here with "V2 says so" would launder a transcription into a
# closure, which is the exact move this register exists to stop.
#
# COUNTS ARE NEVER WRITTEN HERE. `python register.py --counts` computes them. G11: a number with
# no adjacent command is a defect, and V2's hand-typed "39 holes · 13 assumption" is why.


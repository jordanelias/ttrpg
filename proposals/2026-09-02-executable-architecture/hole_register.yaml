    unblocks:  "unmeasured"
    cite:      "NARROWED BY `W-A`, 2026-09-04, AND THE REMAINDER IS NAMED RATHER THAN COUNTED. `04_CODE_ARCHITECTURE.md` §F.24a read SEVEN forms off the 32 live cells, so the column can be TYPED rather than re-read once per verb, and one declaration now has three readers: `SeasonDriver._fold` (through `WorldReader`), `belief_contradicts` (through `LedgerReader`, `H-72`) and `resolvable_verbs`. MEASURED 2026-09-04: 23 of 32 verbs carry a prose precondition; 9 have a TYPED CELL (carry · commit · move · repudiate · restore · succeed · tell · transfer · work), 4 have a PREDICATE (confer · convene · dispatch · revoke), and the REMAINDER IS TEN, listed so it cannot be reported as a number: comply · determine · establish · evade / defy · exchange · issue · levy · open_case · refract · the six investigation acts. Reproducible with `python -c \"import sys;sys.path.insert(0,'proposals/2026-09-01-season-loop-tests/tracer');import shape as S;p=[v for v,r in S.VERB_TABLE.items() if r.requires.strip() not in S.NO_PRECONDITION];print(len(p), sorted(v for v in p if S.VERB_TABLE[v].requires_typed is not None), sorted(v for v in p if v in S.REQUIRES_PREDICATES), sorted(v for v in p if S.VERB_TABLE[v].requires_typed is None and v not in S.REQUIRES_PREDICATES))\"`. ⚠ THE PREVIOUS CITE SAID '26 of the 32 verbs carry a prose precondition and 3 have a predicate'. THE 26 WAS ALREADY STALE — the same command returns 23 against the table as it stood before this item, which changed no `requires:` prose — and the 3 was a snapshot taken before the governance slice added four. Corrected rather than carried. ⚠ THE REMAINDER IS NOT ONE HOLE. Two of the ten (`issue`, `open_case`) are §F.24a's own finding that their cells are NOT PREDICATES AT ALL but constraints on the well-formedness of the Act, which belong in the `Act` schema; three (`comply`, `evade / defy`, `refract`) fit form 6 and are blocked on an OPERAND the closed `requires_operands` roster has no name for — a Dispensation — which is `H-94`; one (`exchange`) needs the counterparty's side of a trade, same cause; `refract` is additionally `absent` (D18); and `determine`, `establish`, `levy` and `the six investigation acts` are `remit:`-eligible or defer to acts the table does not carry. ⚠ ONE BEHAVIOUR MOVED AND IT IS RECORDED HERE RATHER THAN LEFT TO BE FOUND: `_req_work` ended in a bare `return True` for an act naming no Site, so for every COMPUTED act its precondition could not fail. The typed cell binds `site` from the act's operands and UNKNOWN refuses, so `work` leaves the corpus's executed set and joins `move` and `transfer` in the always-refused set — the same cause, `H-94`. Falsifier: `test_wa_work_refuses_for_want_of_a_site_and_that_is_a_polarity_correction`."
    source:    "PLAN.md §1.4 — a hole an instrument must fill that carried no row"

# ---------------------------------------------------------------------------
# THE DISCHARGE MAP -- guardrail G8.
# "Every defect gets a register row, or is discharged with a named section."
# THE FAILURE THAT EARNED IT: `D16` was the ONLY one of Part B's 26 defects with no Part VII row
# AND no Part D-G discharge, and it was claimed discharged anyway. Nothing could report that,
# because the binding between Part B's enumeration and the register was PROSE.
#
# A value is either `row:H-NN` -- and rule G8 fails if that row does not exist -- or a section
# reference. The binding is EXPLICIT rather than inferred from whether a defect id happens to
# appear in a row's text: an inferred binding is a keyword search, and a keyword search is a
# router, and PLAN.md §7.4 is the sixth recurrence of what routers do.
#
# G8 fails on: a Part B defect with no entry; an entry naming a row that does not exist; an entry
# for an id Part B does not define. Part B's ids are re-read from the document, never pinned here.
# ---------------------------------------------------------------------------


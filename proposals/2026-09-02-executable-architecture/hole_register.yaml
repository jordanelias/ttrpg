H ALREADY EXISTED, so rank is the ordinal position in a roster the tree already has and needs no second scale -- and it is TOTAL, bottoming out at a person governing themselves, which means Part E's `own` eligibility is the person-scale rung of this same ladder rather than a separate kind of permission. ⚠ WHAT IS RULED AND WHAT IS NOT, CORRECTED: the ladder, the purview rule and the two-rule revocation are ruled and BUILT. HOLDINGS IS NOW PARTLY BUILT -- this row previously said holdings was *modelled by nothing*, which was false in the same commit that wrote it, because `shape.in_holdings` is an ownership relation distinct from governance and `_req_revoke` reads it to decide an outcome. What is NOT built: holdings as a GENERAL relation (nothing but revocation consults it, and no verb creates one), SOVEREIGN POWER (no relation at all -- and the falsifier for that is a concept check, since the first version asserted `not hasattr(w, 'sovereign')`, a test on an attribute NAME which passed only because the holdings relation had been encoded as a Tenure), PARLIAMENT (does not exist), and DELEGATION -- assigning a lesser-ranked governor, a council, or mayoral elections, the mechanism behind regency and puppet rulers, which has no verb. Those four are the open work; they are named here rather than left for a reader to discover."

everyone under `presence_only` too; the fall is MATTER emissions whose subject has no place being dropped from the fan, not speech reach. An arm on the wrong variable is §0.1 point 4's second half, and it reads exactly like evidence. ARM 2, `presence_only` + one person moved to another rung: R3 still TRUE; the moved person's ledger falls 104 -> 30 and deposits 312 -> 178. Propagation survives losing one of three, which is correct -- the remaining pair are still co-located and R3 asks whether ANY act is caused by another's. ARM 3, `presence_only` + ALL THREE at different rungs: **R3 = FALSE, with 63 acts still resolved and 104 deposits**. ⚠ ARM 3 IS THE ONE THAT EARNS THE ROW. It shows the detector returning FALSE on a POPULATED world -- three actors, sixty-three acts -- which is the specificity `planted_control` cannot show, since that one short-circuits on fewer than two acts. R3 is measuring propagation and not merely answering true to anything. REPRODUCE, EXACTLY, BECAUSE THE ARM THAT EARNS THE ROW IS THE ONE A READER MUST BE ABLE TO RE-RUN: rebind `S.DEFAULT_FIXTURES = S.DEFAULT_FIXTURES.sweep(\"fan_out_mode\", \"presence_only\")` BEFORE importing `corpus_run`; for arm 3, additionally close each person's live `contain` Tenure (set `until`) and open one per person against three DISTINCT non-person rungs; then `run_case` over both lanes and read `_r3_propagates`. Arm 1 is the sweep alone; arm 2 moves one person; arm 3 moves all three. R3 is 'an act by one person whose causes walk back to an act of another', and it was the ONLY check the corpus failed. ⚠ THE CONTROL CLAUSE HERE READ 'R1, R4 and R5 passed every runnable case before and after, so nothing else moved' AND IS NARROWED 2026-09-04: `R1` is the literal `True` on the success path of `corpus_run.py`, so 'R1 passed every runnable case' is true by the definition of RUNNABLE and evidences nothing, and `R5` can return `None`, which is neither pass nor fail. The load-bearing control is `R4`, plus the byte-identical `corpus_run` output and the eight world content hashes -- those are what say nothing else moved. The falsifier is `test_n3_an_act_cites_what_occasioned_it_and_a_telling_is_about_what_was_told`, which is mutation-checked: it fails on the pre-fix `shape.py` and passes after, and carries its own control asserting the detector says FALSE on a world where nobody has acted. ⚠ THE SIGN IS `+` AND THAT IS THE POINT OF RECORDING IT: this design is made almost entirely of refusals and every refusal is a damping term, so an amplifying path is the rare one and is the one a reader needs told about"

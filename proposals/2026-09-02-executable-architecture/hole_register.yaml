moves the WORLD and not the DECISION. ⚠ TWO FINDINGS THE SWEEP PRODUCED AND NEITHER IS FLATTERING. (a) At 0 the fold still emits `transfer.made`: the fold's guard against an effect that touched nothing emitting the success watches the IDS an effect returns, not the VALUES it changed, so a transfer of nothing publishes a success. Reported, not fixed — the guard's polarity is the fold's business and the default is 1. (b) 650 of the corpus's 723 transfers are SELF-transfers (`from == to`, net zero) because most questions these worlds raise are about the actor's own containing rung; 73 cross rungs. A first reading of one sampled case said ALL of them were self-transfers and was wrong, which is §0.1 point 4 exactly — corrected by measuring the whole corpus, and recorded rather than quietly fixed. FALSIFIERS, all green: `test_wc_transfer_executes_in_the_corpus_and_the_executed_set_is_exactly_this`, `test_wc_the_amount_sweep_runs_all_three_points_and_zero_spends_nothing`, `test_wc_a_candidate_declines_when_its_hearth_cannot_be_derived`, `test_wc_no_corpus_refusal_arises_from_a_missing_operand`, `test_wc_no_operand_carries_a_silent_default_outside_eff_kill`."

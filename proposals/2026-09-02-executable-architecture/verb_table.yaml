  - verb:        "transfer"
    stratum:     "uncontested_material"
    eligibility: ["own", "hold:<store>"]
    requires:    "stores(hearth(giver), kind) >= amount (§54 it. 7)"
    writes:      ["Rung.stores", "Rung.stores"]
    emits:       ["transfer.made"]
    emits_on_refusal: ["transfer.refused"]
    grade:       "ruled"
    writes_note: "×2, ONE PER SIDE (§E3 `:418`). ⚠ W3 AUDIT: this was collapsed to ×1 and the effect only DECREMENTED the giver, so six grain left the world and arrived nowhere — in an economy where `yield` is the only source (#353 `:856`)."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "utter"
    stratum:     "social"
    eligibility: ["own"]
    requires:    "—"
    writes:      ["Proposition.exists"]
    emits:       ["proposition.uttered"]
    emits_on_refusal: []
    grade:       "assumption"
    source:      "W3 -- #353 names it and Part E omits it. WITHOUT IT NO PROPOSITION EXISTS, and `commit`, `petition` and `issue` all `require` one, so the season cannot start. Register row H-42. §14 makes a Proposition IMMUTABLE, so this row admits its CREATION and nothing else -- there is no verb that alters one."

  - verb:        "utter"
    stratum:     "social"
    eligibility: ["own"]
    requires:    "—"
    writes:      ["Proposition.exists"]
    emits:       ["proposition.uttered"]
    emits_on_refusal: []
    grade:       "assumption"
    source:      "W3 -- #353 names it and Part E omits it. WITHOUT IT NO PROPOSITION EXISTS, and `commit`, `petition` and `issue` all `require` one, so the season cannot start. Register row H-42. §14 makes a Proposition IMMUTABLE, so this row admits its CREATION and nothing else -- there is no verb that alters one."
  - verb:        "work"
    stratum:     "uncontested_material"
    eligibility: ["own", "presence:<site>"]
    requires:    "condition >= floor(verb) (§12.1)"
    writes:      ["Site.condition"]
    emits:       ["site.worked"]
    emits_on_refusal: ["work.unavailable"]
    grade:       "ruled"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"

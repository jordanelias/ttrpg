    grade:       "ruled"
    effect:      "Δ = +(1 − condition) × f(degree) × share (§54 it. 7's mirror)"
    effect_note: "W3: this formula was in the `requires` column. A precondition is a question the fold asks of the world; an effect is what the write does. Conflating them is how a resolver grows a second body."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "revoke"
    scale:   "settlement"
    scale_note: "as `confer` -- it unseats the same office"
    stratum:     "binding_decision"
    eligibility: ["remit:revoke"]
    requires:    "the office's revocation basis, and a live hold exists"
    writes:      ["Tenure.until"]
    emits:       ["tenure.closed"]
    emits_on_refusal: ["revoke.refused"]
    grade:       "ruled"
    eligibility_note: "⚠ W3 AUDIT: §E3's eligibility cell carried a PRECONDITION as well as the remit act — `remit:revoke + ...`. The fold split on the first `:` and tested the whole tail against the remit roster, so it NEVER MATCHED and a holder of the remit was silently refused. The act is the eligibility; the basis is a `requires`."
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "speak"
    stratum:     "social"
    eligibility: ["own"]
    requires:    "—"
    writes:      []
    emits:       ["speech.made"]
    emits_on_refusal: []
    grade:       "assumption"
    writes_note: "—"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "succeed"
    scale:   "person"
    scale_note: "succession is one person taking another's tenure; the office's rung does not change"
    stratum:     "binding_decision"
    eligibility: ["own"]
    requires:    "the actor holds the office or estate whose heir is being designated"
    writes:      ["Tenure.since"]
    emits:       ["heir.designated"]
    emits_on_refusal: ["succession.refused"]
    grade:       "assumption"
    writes_note: "a `succeed` Tenure -- the kind is in `rosters.yaml`"
    source:      "W3 -- heir designation. #353 `:371`, `:542` name `succeed` as a Tenure kind and `transmission` as the mechanism, and Part E carries no verb that CREATES one. Without it F13's contested-succession cases have no producer."
  - verb:        "tell"
    stratum:     "social"
    eligibility: ["own"]
    requires:    "the teller holds a claim on the subject"
    writes:      []
    emits:       ["news.told"]
    emits_on_refusal: ["news.untold"]
    grade:       "ruled"
    writes_note: "— (deposits at WITNESS, not here)"
    refusal_note: "W3: added. §E2 -- 'failure emits, never raises'. This verb has a `requires` and had no refusal channel, so a failed precondition produced no Event, no witness and no arc. Refusal condition: the teller holds no claim on the subject"
    source:      "ARCHITECTURE_V2.md §E3, transcribed"
  - verb:        "the six investigation acts"
    stratum:     "contested_physical"
    eligibility: ["own"]
    requires:    "per act"
    writes:      []
    emits:       ["finding.made"]
    emits_on_refusal: ["finding.none"]
    grade:       "assumption"
    writes_note: "— (they produce claims at WITNESS)"
    eligibility_note: "eligibility NEVER consults office (T9)"

      - "[E] 0 stance rows across all 12 persons in a built realm — term 2 is not merely producerless, it is measurably zero"
      - "[R] no verb writes (Person, stance): it is social:true and the verb table has no producer"
      - "[R] clock_registry_v30.md:105 specifies `Disposition`, -5 to +5, faction-indexed, per-NPC — the SAME RANGE. `stance` IS Disposition under a second name."
      - "[R] a View carries only {holder, claim_ids, question}; everything else raises. A character cannot read another's interior — only hold CLAIMS about them."
    question: >-
      Jordan: an enemy is deposited "from stuff like poor opinions of someone or
      like antagonistic factions". Poor opinions have a field with no producer;
      factional antagonism has 8 faction names and NO relation between them in
      engine code.
    options:
      - "regard is produced by witnessed acts — a verb writes it at RESOLVE"
      - "regard is DERIVED from claims about the other, never stored (consistent with View's constraint, and it makes regard epistemic like everything else)"
    note: >-
      The inverted direction — 'how will they judge me' — needs a model of what the

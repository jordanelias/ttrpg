      - "[R] queries/world_q.py Q4 fires a standing question off it EVERY SEASON — that IS the ambition mechanism"
      - "[E] Q4 leads for 12/12 persons at genesis and 0/12 in every season after; reactive traffic reaches 136-180 questions while `need` stays at 12"
      - "[E] q_rule=one_per_source restores ambition's reach from 0/12 to 12/12 — a one-word data edit"
      - "[R] loop/effects.py:430 — every person-formed Proposition has mood='OUGHT', predicate='', value=None, because `utter` is untyped"
      - "[R] NOTHING in the decision path reads prop.predicate or prop.value"
      - "[E] `fear|fears` matches ONE file in all of engine/ — a case fixture. No field, no roster, no verb."
    question: >-
      Jordan ruled fear is GENERATIVE — it directs toward the acts that avert the
      feared state, so the minus sign is on the TARGET and not on the action. That
      makes fear and ambition one mechanism. But an ambition cannot currently say
      WHAT is wanted — the Proposition has no readable content.
    options:
      - "one mechanism, signed target: ambition (+) / fear (-) / need (+ with a duration counter), distinguished by Proposition.mood"
      - "three mechanisms with separate carriers"
    sub_questions:
      - "does a need get a STORED counter, or is duration derived from Tenure.since?"
      - "direct vs mediated fear is decidable from the verb table — a fear is DIRECT iff some `own`-eligible verb writes the feared field. Measured: starving is direct (exchange, transfer); demotion is mediated (only remit:revoke). Is that the right test?"

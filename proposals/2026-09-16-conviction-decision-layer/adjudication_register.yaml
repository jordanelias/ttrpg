      - "[R] witness_channels includes `document_key` and `chronicle` — the 'read by the person' channels"
      - "[E] 580 claims after 2 seasons: 100% firsthand. told_by, inferred, firsthand_via_knot all ZERO"
      - "[E] `tell` RESOLVED 9 times and deposited 0 claims"
      - "[R] the one live consumer of provenance is decision/options.py:461 (standing_of)"
      - "[E] consequently standing_of returns 1000 — the maximum-gap default — for ALL 12 persons, permanently"
    question: >-
      RULED by Jordan: claim value is modified by the hearer's BELIEF about their
      relation to the teller — lord > peer > enemy. This needs the teller's identity,
      and a Claim does not record it: `source` is a channel kind, `holder` is the
      hearer, and witness.py:358 has the teller in scope and discards it.
    options:
      - "grade at deposit — no new field, but the relation FREEZES at the moment of telling; a lord later exposed as a fraud keeps his inflated confidence"
      - "store the teller on Claim — re-gradable, consistent with 'hearer's belief', but Claim's own docstring says `round` is 'THE ONLY CARRIER FIELD U2 ADDS, AND THE ONLY ONE IT MAY ADD'"
    note: "A belief that cannot be revised is not a belief, so the ruling appears to imply the field. Stated, not taken."
    blocks: "every mediated fear; standing_of; the whole second-hand knowledge half"
    ruling:

  - id: CAT-4
    name: commitments
    holds: "signed targets the character pursues or averts, some carrying a counter"
    absorbs: [1 ambitions, 2 needs, 3 fears]
    operator: generator
    carrier: "a live `commit` Tenure whose object is a Proposition"
    status: LIVE-BUT-CONTENTLESS
    evidence:

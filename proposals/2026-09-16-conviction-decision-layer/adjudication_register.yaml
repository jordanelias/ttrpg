      - "[R] decision/choose.py:302 — term 1 of the live score, the only conviction→action path"
      - "[E] the alignment table it multiplies is 52 of 152 cells; 7 verbs sit on no axis"
    question: >-
      Are moral and religious value ONE kind or two? They share one field today —
      a devout and a secular character differ by a Faith weight, a difference of
      DEGREE where you may want a difference of KIND.
    options:
      - "one kind: religious value is a conviction weight (status quo)"
      - "two kinds: religion is a second operator — e.g. a modifier on acts a doctrine forbids"
    blocks: "the axis question — a second kind would need its own basis"
    answered_pending_STR_6: >-
      ⚠ Jordan's 2026-09-17 reservation of `conviction` for piety selects the SECOND option —
      two kinds — and makes religious commitment its own quantity. Recorded here; the ruling
      belongs on STR-6, not duplicated into this row.
    ruling:

  - id: CAT-2
    name: orientation
    holds: "for whose benefit the character acts"
    absorbs: [8 self interest vs public interest]
    operator: weight
    basis: temperament          # an axis OF CAT-9, not a standalone scalar
    carrier: "none in engine/season/. A by-reference registry row only."
    status: ABSENT
    evidence:
      - "[R] references/descriptor_registry.yaml:260 — `orient.self_other`, scale [-1,+1], under a header reading 'REGISTERED BY REFERENCE — authoritative content stays in the source doc'"
      - "[E] Person has no `orient` field"
      - "[D] R7: axes are a LINEAR map from the conviction vector, so identical vectors are identical on every axis — while taxonomy §2.3 requires Borgia and the magistrate to differ at identical vectors. Self/other therefore CANNOT be an axis. It is the one quantity that must sit outside the vector."
    question: >-
      ⚠ RE-FILED 2026-09-17 ON JORDAN'S CORRECTION, AND THE CORRECTION IS A PROMOTION.
      This row first led with prior work's reading — a modifier on OUTCOME ATTRIBUTION, i.e.
      how much of a win accrues to the faction after the fact. Jordan, verbatim: "self interest
      versus care for others or whatever DRAMATICALLY WEIGHTS HOW ONE CHOOSES AND BEHAVES."
      That is a WEIGHT AT APPRAISAL, on the choosing — not a post-hoc attribution. The operator
      is corrected above.
      ⚠ ALSO CORRECTED: this session listed "self-interest cannot be a conviction" among the
      impurities it was removing, which mis-attributed a position to Jordan. He listed it as
      input (8), DISTINCT from moral (6) and religious (7) values, and never called it a
      conviction. R7 is a fact about the tree's projection architecture; it corrects nothing
      he said.
    the_obstacle: >-
      Weighting candidates by whose benefit needs a BENEFICIARY PER CANDIDATE, and a Candidate
      carries only (verb, subject, why, operands) — no beneficiary. But the Key substrate
      ALREADY declares the role: ROLES = (subject, object, witness, BENEFICIARY, bystander).
      The concept exists one layer up and does not reach the decision layer. This is a bridge,
      not an invention.
    options:
      - "derive it: a verb's `writes:` says WHAT changes, so whoever holds the changed thing is the beneficiary — the information may already be in the operand binding and merely unextracted. UNVERIFIED across all 38 verbs."
      - "declare it: a beneficiary column on the verb table, or a fifth field on Candidate"
      - "prior work's reading (demoted from the lead): a modifier on attribution, raw x (1 - 0.5*max(0,orient)) — weaker, because it changes what a win is WORTH rather than what gets CHOSEN"
    blocks: "Jordan's proposed axis 1 (Selfish vs Selfless), which R7 disqualifies as an AXIS — the input is not disqualified, only that placement"
    ruling:

  - id: CAT-3
    name: claims
    holds: "what the character knows, tagged by how they came to know it"
    absorbs: [4 memories, 5 worldly understanding]
    operator: gate
    carrier: "Person.ledger — Claim(id, holder, subject, predicate, value, when, source, confidence, visibility, round)"
    status: LIVE-BUT-HALF-EMPTY
    evidence:

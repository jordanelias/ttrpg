          described ("perform duties so as to impress superiors"). It merges with ambition
          into CAT-4.
        * FEAR OF A CHALLENGE — "armed men", "a tribunal", "deep water". Names NO state to
          reach or avoid. A disposition toward the COST OF A PATH, not toward a destination.
          It does NOT merge. Its antonym is bravery: the same axis, other end.
      THE TEST: does it name a STATE or a KIND OF ENCOUNTER? A state is a commitment (CAT-4).
      An encounter-kind is this category.
    why_it_cannot_merge: >-
      A commitment is a GENERATOR — it proposes candidates. Courage is a MODIFIER keyed on what
      a candidate DEMANDS rather than what it ACHIEVES. Keeping them independent is what lets a
      coward hold an ambition and a brave man dread disgrace; the merge would have made that
      character inexpressible.
    evidence:
      - "[E] `courage` appears in 15 files and every one is PROSE. The single hit in engine/season/state/carriers.py is the word 'discouraged' inside a law string. `bravery`, `mettle`, `valour`: 0 files. The name is free — no §4 collision."
    question: >-
      What is a "challenge kind", and what enumerates them? A courage table is per-character
      over a CLOSED ROSTER of challenge kinds, and that roster does not exist. Candidates would
      need to declare what they demand, the way verbs already declare what they write.
    options:
      - "a modifier: a challenge a character fears costs more (raises the Ob of the act)"
      - "a gate at the extreme: below a threshold the candidate is not formed at all"
      - "a susceptibility: courage sets the gain on threat-input, folding it into the intake operator rather than the decision operators"
    blocks: "nothing today — it is absent in both directions"
    ruling:


# ---------------------------------------------------------------------------
# BEHAVIOUR LAYER — ADJUDICATION REGISTER
#
# STATUS: PROPOSED — held back in full. Every `ruling:` is empty and stays empty
#         until Jordan fills it. Nothing here is decided.
#
# WHY YAML AND NOT PROSE: CLAUDE.md §0.05 clause 1, as widened 2026-09-16 —
#   "A `.md` is NEVER the authored head of a fact code reads. The head is YAML
#    or JSON under `references/`, or a single Python owner."
#   Jordan, verbatim: "all definitions/terms/etc need to come from code, never
#   prose." A category roster IS a definition. So this is the shape that can be
#   ratified into `references/` and read, rather than a document describing one.
#
# WHAT IT IS: six categories, distilled from Jordan's twelve decision inputs.
#   Each row carries what the category holds, what carries it in code today,
#   its MEASURED mechanical status, and the question he is ruling on.
#
# HOW TO USE IT: fill `ruling:` on each row. `status:` is measured, not opinion —
#   correct it only against a re-run, never against a reading.
#
# EVIDENCE CLASSES (CLAUDE.md §0.1):
#   E = executed on this tree.  R = read at the cited file:line.  D = derived.
#   ⚠ Every E in this file was produced by ONE operator with ONE instrument.
#     Neither independent critic had an execution tool. One earlier E-class claim
#     in this session was already found to measure the wrong stage.
# ---------------------------------------------------------------------------

meta:
  source_inputs: >-
    Jordan, session opening: "(1) ambitions; (2) needs; (3) fears; (4) memories;
    (5) worldly understanding (epistemic); (6) moral values; (7) religious values;
    (8) self interest vs public interest; (9) character opinions; (10) obligations
    and duties (faction, office); (11) ethnicity/caste; (12) job/profession/
    educational background" — plus "the whole 'how will the other judge me' is
    another axis that needs to be considered".
  distillation_claim: >-
    ⚠ FIRST STATED AS SIX AND CORRECTED TO EIGHT BY JORDAN, 2026-09-17, in two moves.
    (a) `station` falsely merged caste with office/profession — mutability splits them,
        so caste is its own row (CAT-7).
    (b) `commitments` falsely merged the two senses of fear — the outcome sense merges
        with ambition, the CHALLENGE sense does not and is its own row (CAT-8).
    The thirteenth input ("how will the other judge me") is `regard` inverted and still
    adds no category. A distillation that removes something irreducible is a reduction,
    and both corrections were removals of exactly that kind.
  operators:
    # The kinds an input can BE. Prior work wrote five as one, which is why they
    # never composed. Susceptibility is struck: it is an input to OTHER people's
    # decisions, not to this character's.
    gate:      "decides whether a candidate exists at all"
    generator: "decides which candidates are proposed"
    weight:    "decides the ranking among them"
    modifier:  "decides the cost of one — distinct from `weight` because Valoria resolves by DRAW, so moving the obstacle and moving the preference are different acts"
  operators_at_intake:
    # ⚠ CORRECTED BY JORDAN, 2026-09-17, and the correction is structural rather than a
    # relabelling. This session first STRUCK susceptibility, reasoning that Resonant Style
    # "describes what works ON this character, so it is an input to OTHER characters'
    # decisions". Jordan, verbatim: "Susceptibility is a modifier that transforms the input
    # received from others." That is this character's own processing, not somebody else's.
    #
    # The four operators above act on CANDIDATES at decision time. Susceptibility acts on
    # INFORMATION at intake time. It was not a category error — it is a DIFFERENT STAGE, and
    # filing it beside the four is what made it look misplaced.
    susceptibility: >-
      the gain on what reaches this character. ONE operator with TWO keys, and naming them
      together is the consolidation the correction buys:
        * keyed on FORM   — Resonant Style (Evidence · Consequence · Authority · Solidarity),
                            a closed four at npc_behavior_v30.md:32
        * keyed on SOURCE — Jordan's ruling: claim value modified by the hearer's BELIEF about
                            their relation to the teller (lord > peer > enemy)
      These were two separate problems in this session's earlier work. They are one operator.
    why_S9_3_agrees: >-
      WITNESS *is* intake. Susceptibility is the one thing licensed to act there — it sets
      `Claim.confidence`, which witness already writes. Convictions are exactly what may not
      move there. The refusal law and this operator model agree rather than collide.


# ===========================================================================
# BASES — the coordinate systems a character is held in.
# ⚠ ADDED 2026-09-17. A category says WHAT a character holds; a basis says IN
#   WHAT COORDINATES. This section exists because Jordan's second axis list
#   turned out not to be a competing conviction basis but a SECOND basis, and
#   because that dissolves R7.
# ===========================================================================
bases:

  moral_values:
    # ⚠ RENAMED FROM `conviction` BY JORDAN, 2026-09-17: "conviction should be reserved for a
    #   different concept, not moral values" — then, naming it: "piety".
    #   The 13-roster holds VALUE-FRAMES. `conviction` is reserved. See STR-6 for the cost and
    #   the collision, which are both larger than a rename usually is.
    held_as: "13 weights over the roster currently SPELLED `convictions` in code"
    reaches_axes_by: "PROJECTION — conviction[a] = SUM_c w_c * P[c][a] (choose.py:53)"
    axes_today: [hierarchical, sacred, instrumental, traditional]
    proposed_axes:
      # Jordan, 2026-09-17 — offered AFTER the seven, and separating the two registers
      # himself: these four are value-frames (what is right), the seven are bearing.
      - "traditional <-> progressive"
      - "equality    <-> hierarchy"
      - "equity      <-> partiality"
      - "objective   <-> subjective"     # NEW — not in the earlier seven
    changed_from_the_earlier_seven: >-
      Three carried over (traditional, equality, equity); `substantive <-> procedural` dropped;
      `objective <-> subjective` added; and the three now filed as temperament are absent.
      ⚠ That this matches the placer's clustering is CONSISTENT, not CONFIRMING — see the
      withdrawn claim under `temperament`. Jordan may have dropped `substantive` for reasons
      unrelated to any measurement, and no inference should be drawn from the agreement.
    open_on_objective_vs_subjective: >-
      ⚠ IT READS TWO WAYS AND THEY ARE DIFFERENT AXES.
        (a) META-ETHICAL — is there a fact of the matter about what is right, discoverable by
            anyone? A genuine conviction axis.
        (b) PROCEDURAL — do I judge by the case's own merits or by who stands before me? That
            is close to `equity <-> partiality` and would be largely redundant with it.
      ⚠ AND IT COLLIDES WITH A LIVE TRACK the other three do not. `Truth` (ex-Certainty,
      ex-Piety) is a per-character metaphysical stance, 0-5, Solmund-orthodoxy <-> Thread-truth,
      with players seeing qualitative bands only (CURRENT.md clocks row, ED-IN-0075). A
      character's position on whether truth is objective may ALREADY be that track rather than
      a conviction axis. Rule the collision before this gets a column.
    constraint: >-
      ⚠ R7 BINDS HERE AND ONLY HERE. The projection is a LINEAR map from the weight
      vector, so two persons with identical conviction vectors are identical on every
      conviction axis, necessarily. taxonomy §2.3 requires the opposite for self/other
      (Borgia and the public-spirited magistrate at identical Utility). Any quantity
      that must vary at fixed convictions CANNOT be a conviction axis.

  temperament:
    held_as: "the axis values DIRECTLY on the Person — no roster underneath, no projection"
    reaches_axes_by: "nothing: the character IS the vector"
    proposed_axes:
      - "courage        <-> cowardice"
      - "altruistic     <-> selfish"
      - "pacifist       <-> militaristic"
      - "diplomacy      <-> intimidation"
      - "passive        <-> aggressive"
      - "humble         <-> vain"
      - "insecure       <-> self-assured"
      # Jordan, 2026-09-17.
    why_it_dissolves_R7: >-
      ⚠ THE PAYOFF, AND IT IS THE BIGGEST RESULT OF THIS THREAD. R7 binds axes REACHED
      THROUGH A PROJECTION. A directly-held vector is not a function of the conviction
      weights, so Borgia and the magistrate share Utility 0.9 and differ on `selfish`.
      Jordan's first axis works — it was only ever unsatisfiable in the CONVICTION basis.
      The tree already contains the pattern: `orient.self_other` is exactly a
      directly-held scalar, deliberately kept OUT of the Conviction set by taxonomy §2.3
      for this very reason. The seven generalise that one scalar into a basis.
    what_supports_it: >-
      ⚠ A DEFINITIONAL TEST, NOT A STATISTICAL ONE — and the statistical claim this row
      first carried has been WITHDRAWN (see `withdrawn_claim` below).
      THE TEST: can a character hold conviction X with temperament Y, for every X and Y?
        Faith + vain -> a proud priest.  Faith + humble -> a meek one.  Both coherent.
        Equity + militaristic -> a revolutionary.  Equity + pacifist -> a reformer.  Both.
        Warden + cowardly -> a frightened steward who keeps the work anyway. Coherent.
      Now the same test on a CONVICTION AXIS: Faith + anti-sacred? INCOHERENT — Faith IS the
      sacred-leaning conviction, and the axis value is ENTAILED by holding it.
      THAT ASYMMETRY IS THE ARGUMENT. A conviction axis is entailed by the convictions; a
      temperament is free of them. It needs no placer, no threshold and no sample, and anyone
      can check it against the taxonomy definitions.
    withdrawn_claim:
      claim: >-
        This row first read: "MEASURED, and the split is BIMODAL rather than a ranking" —
        citing per-axis abstention counts, spans and mean |v| from an independent placer's
        13 x 7 matrix, and concluding that the three low-scoring axes were orthogonal.
      withdrawn_by: "Jordan, 2026-09-17: 'unless you can explain your methodology here, this doesn't mean anything here'"
      why_it_does_not_support_the_conclusion:
        - "NOT MEASUREMENTS. Every cell is one model's judgment. There is no ground truth and nothing anchors the numbers; a different placer, or different wording, could return different ones."
        - "THE 0.2 ABSTENTION THRESHOLD WAS CHOSEN BY THIS SESSION AFTER SEEING THE DATA. A different threshold gives different counts and possibly no gap."
        - "'BIMODAL' OVER SEVEN POINTS IS NOT A DISTRIBUTION CLAIM. A 4/3 split of seven hand-placed values has a gap somewhere by construction."
        - "CIRCULARITY NOT RULED OUT. The placer was given THIS SESSION'S pole definitions. Vague definitions would produce abstentions that measure the prompt, not the axis."
        - >-
          THE INFERENCE DOES NOT SELECT ITS CONCLUSION. Low placement variance is equally
          consistent with: orthogonality; a vague axis; a badly-worded axis; a placer that did
          not grasp it; or a real axis uncorrelated with THESE THIRTEEN specifically. This
          session chose orthogonality because it fitted the argument being built — the same
          failure §0.1 pt 3 names, committed after being caught at it twice in one session.
      status_of_the_numbers: "at best weak corroboration; they are NOT the finding and must not be cited as one"
    still_measured_and_still_standing:
      - "[E] no temperament roster exists: 34 rosters in engine/season/rosters.yaml, none carrying disposition"
      - "[R] `orient.self_other` is already a DIRECTLY-HELD scalar kept out of the Conviction set by taxonomy §2.3 — the pattern this basis generalises"
    cost: >-
      A second basis needs its OWN alignment table — an N x 38 verb matrix parallel to the
      conviction one, which is 52 of 152 cells full. It does NOT need a projection matrix,
      which is the expensive half of the conviction chain and the half R6 makes atomic.


# ===========================================================================
# Not a category. These are the STRUCTURAL rulings the six sit on, and none of
# the six can be built past its blocker until they are taken.
# ===========================================================================
structural:

  - id: STR-1
    name: person-interior write path
    question: >-
      Nothing may write a Person's interior. Six loop steps: MATTER, CALENDAR,
      CENSUS and WITNESS each carry a refusal law; DELIBERATE "returns an act array
      and writes nothing else". Only RESOLVE remains — i.e. only an act — and no
      verb does it (H-62).
    consequence: >-
      Pressure, scar, the needs counter, the fear item and regard production are
      NOT five problems. They are one, and one ruling unblocks all five.
    options:
      - "a verb at RESOLVE writes it — the interior moves by ACT, which is how everything else in this engine moves"
      - "a seventh step with a new write class — larger, and needs its own ruling"
      - "nothing persists: the interior is recomputed every season from claims and tenures"
    note: "The third option is cheaper than it looks and has not been considered: if regard and pressure are DERIVED rather than stored, H-62 never binds."
    ruling:

  - id: STR-2
    name: the axis basis
    reshaped_2026_09_17: >-
      ⚠ THIS ROW WAS WRITTEN ASSUMING ONE BASIS. There are two (see `bases:`), and three of
      the seven axes it scores — selfish, passive, peaceful — belong to the TEMPERAMENT basis
      rather than the conviction one. Their poor projection onto the thirteen Convictions is
      what identifies them as temperament, so this row must be re-read: it measured four
      conviction-axis candidates and three temperament axes against a conviction yardstick.
    question: >-
      Jordan proposed seven axes to replace the live four. R7 disqualifies the first
      (Selfish vs Selfless) structurally. Two of the remaining six re-measure existing
      axes (Equality = hierarchical flipped at r=-0.971; Traditional = traditional at
      r=+0.989). Three are genuinely new (substantive, equity, peaceful). One failed
      to measure (Passive vs Assertive: 6/13 abstain, nothing reaching ±0.7).
    consequence: >-
      Migration is ATOMIC: _load_projection and _load_alignment raise at MODULE SCOPE,
      so a 13x7 projection and a 7x38 alignment table must both exist before first
      import. There is no partial state and no graceful degradation.
    measured:
      - "[E] the seven span 3.18 effective directions against the live four's 2.27, normalised"
      - "[E] equality x traditional = -0.733, reproducing the live basis's worst pair (hierarchical x traditional = +0.743) to within 0.01 under an INDEPENDENT placement — the defect is in the Convictions, not the matrix"
      - "[E] a Key with symbolic_dimensions={'equity': 0.5} raises KeyValidationError today"
    ruling:

  - id: STR-3
    name: the noise floor
    question: >-
      choose.py:318 runs _sample_order AFTER the score sort. P(inversion) =
      1/(1+exp(D/tau)) — the Gumbel difference is Logistic. At the shipped tau=0.1
      a term is decisive at 95% only if its score gap D >= 0.294.
    consequence: >-
      Any new term must declare a RANGE and clear that floor, or it cannot be shown
      to decide anything. The measured live plateau gap is 0.0000 — the coin-flip row.
    measured:
      - "[E] closed form verified against 200,000 simulated draws per row to 4 decimals"
      - "[E] the sampler changes the top choice for 9 of 12 persons"
    options:
      - "keep tau=0.1 and require every term to declare its range against the floor"
      - "lower tau — more rational characters, less variety"
      - "raise tau — more variety, weaker convictions"
    ruling:

  - id: STR-6
    name: "`conviction` is reserved, and the 13-roster is misnamed"
    raised_by: >-
      Jordan, 2026-09-17: "conviction should be reserved for a different concept, not moral
      values" — and, naming the concept: "piety".
    what_it_rules: >-
      The thirteen-item roster holds MORAL VALUES / value-frames. It must not be called
      `conviction`. That word is reserved for piety.
    consequence_for_CAT_1: >-
      ⚠ THIS ANSWERS CAT-1'S OPEN QUESTION. CAT-1 asked whether moral and religious value are
      ONE kind or TWO, noting they share one field today so a devout and a secular character
      differ only by a Faith weight — a difference of DEGREE where a difference of KIND may be
      wanted. Reserving `conviction` for piety makes them TWO. Religious commitment becomes its
      own quantity; `Faith` as one of thirteen value-frames is then either redundant or is the
      value-frame half of a thing whose other half is piety.
    rename_cost_measured:
      - "[E] 40 Python files under engine/ tools/ tests/ carry the name"
      - "[E] 60 YAML/JSON files under engine/ references/ registers/ carry it"
      - "[E] 107 design documents under systems/ canon/ architecture/ carry it"
      - "[R] the single owner is references/descriptor_registry.yaml:236 `conviction_roster`; engine/season/rosters.yaml binds CONVICTION_AXES and the 13x4 projection off the same name"
      - "[D] §0.05 clause 3 governs the method: edit the OWNER and re-derive; never hand-edit downstream and never keep a second copy."
    the_piety_collision:
      - "[E] `piety` appears NOWHERE in engine/season/ — not in code, not in the 34 rosters. Person-side, the name is vacant in live code."
      - "[R] because the character `Piety Track` was RETIRED into `Truth` (ED-IN-0075) — so this would restore an earlier name to a narrower concept, which is legitimate."
      - "[R] ⚠ BUT territory-scale **Piety (PT)** is LIVE and CURRENT.md declares it DISTINCT and unchanged. Two scales, one word: a later session reading `piety` cold cannot tell which is meant — §4's idempotency test failing, exactly as STR-5 does for `belief`."
      - "[R] the person-scale religious slot that ALREADY EXISTS is `church_standing`, a person predicate carried as a CLAIM (asserted about you, contestable), alongside heritage/grade/office/residence."
    questions:
      - "what does `conviction` denote once reserved — piety itself, or the firmness with which anything is held? Ordinary usage supports BOTH, which is why §4 wants it pinned before it is used."
      - "if piety is person-scale, how is it distinguished in writing from territory-scale Piety (PT)? A qualifier on one, or a different word for one?"
      - "does piety SUBSUME `church_standing`, sit beside it, or is church_standing the observable half (what others say of your devotion) of which piety is the interior half?"
      - "what does the 13-roster get called? `moral_values` is used in this register as a placeholder, not a proposal."
    interacts_with: "STR-5 — `belief` is overloaded six ways. Settling `conviction`, `piety` and `belief` separately will re-collide them; they are one vocabulary problem with three words."
    ruling:

  - id: STR-5
    name: the word "belief" is in vocabulary conflict
    raised_by: "Jordan, 2026-09-17"
    question: >-
      `belief` carries SIX live senses inside the decision layer. CLAUDE.md §4's idempotency
      rule requires a later session to read a process word cold and land on the same meaning.
      It cannot. Which sense keeps the word, and what do the others get called?
    senses_measured:
      - "[E] `Person.beliefs` — a carrier field with ZERO readers anywhere under engine/season/. The only `.beliefs` in the engine is autoload/game_state.py, a WORLD-level dict — a different object."
      - "[R] `belief_contradicts()` — §F1 clause 4's filter. Its docstring reads 'is requires(verb) KNOWN-FALSE from p's OWN CLAIMS?'. The name says belief; the body reads the claim ledger, not the field."
      - "[R] S9.3's refusal law is titled 'WITNESS NEVER TOUCHES A BELIEF' and its own next clause reads 'if evidence can move a CONVICTION'. Name and reason disagree; the row it guards covers convictions, beliefs, scar and axis_count — the whole moral interior."
      - "[R] Belief as a DESIGN TIER — derived_stats_v30.md:216: 'specific stance taken in the moment; may be revised; produces CP awards on revision', sitting between Conviction and Inspiration."
      - "[R] Belief as a PER-NPC COMMITMENT — npc_behavior_v30_infill.md:45: 'Conviction-derived commitment + situation-specific application', 2-3 per named NPC, becoming a SCAR on revision."
      - "[D] A Claim is itself a subjective holding — Jordan, 2026-09-02: 'our understanding of all other words and actions is subjective and singular.'"
    options:
      - "`belief` keeps the TIER sense (the revisable situated commitment) and the field is renamed or deleted — it has no readers, so deleting costs nothing measurable"
      - "`belief` keeps the EPISTEMIC sense (what I hold true) and the tier is renamed — but then belief_contradicts is correctly named and the field is the impostor"
      - "the word is retired from process vocabulary entirely; each sense takes an ordinary word that already covers it (claim · commitment · conviction)"
    note: >-
      §4's own worked failure is the precedent: `evacuate` was coined for what `retire`
      already covered, a later session read it cold, derived the wrong meaning, and escalated
      a non-existent blocker across three surfaces. This is the same shape with a word that
      was not even coined — it was overloaded.
    blocks: "CAT-3 (claims) and CAT-4 (commitments) both borrow it; the tier model in the distillation rests on it"
    ruling:

  - id: STR-4
    name: question expressiveness
    question: >-
      A Question carries {id, source, referents, about}. `source` is PROVENANCE, not
      type: claim_landed covers a threat, a gift, an insult and a rumour identically.
      Jordan: "Questions may need to be expanded/rewritten to enable more variability
      and information."
    consequence: >-
      MEASURED: the aperture is ~25 candidates per referent, LINEAR — but distinct
      verbs reached is 28 under every aggregation rule. More referents buy more
      candidates and NOT ONE new kind of action. Volume is bounded by referents;
      VARIETY is bounded by the gate (CAT-6). Adding question sources cannot fix variety.
    also: >-
      aggregate_questions RE-MINTS the question, keeping only source, about and a
      flattened referent union — so every new field needs its own FOLD RULE, and
      per-referent roles cannot survive the union at all.
    ruling:

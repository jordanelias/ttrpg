  - id: "CAT-4"
    source: "adjudication_register.yaml"
    question: >-
      Jordan ruled fear is GENERATIVE, which makes fear and ambition one
      mechanism differing in the sign on the target. One mechanism (signed
      target, distinguished by `Proposition.mood`) or three mechanisms with
      separate carriers? And: a stored counter for a need, or duration derived
      from `Tenure.since`?
    disposition: closed
    step: 1
    answer: >-
      ONE MECHANISM, and Jordan's own two corrections of 2026-09-17 are what
      close it. He split exactly the two things that do NOT merge — caste out of
      `station` (now CAT-7) and CHALLENGE-fear out of `commitments` (now CAT-8) —
      on the ground that a distillation removing something irreducible is a
      reduction. Splitting off precisely what does not merge is an endorsement of
      the merge of what remains: ambition (+), outcome-fear (−) and need (+ with
      duration) are one signed target on one carrier.
      Two supports, neither of which is the ruling:
        * ONE CARRIER ALREADY EXISTS AND IS SINGLE-OWNED. `commit` writes
          `Tenure.since` and `world_q`'s Q4 `need` fires off it. Three carriers
          would be three producers of one question source, which is §8.
        * SUB-QUESTION (a) — THE COUNTER IS DERIVED, NOT STORED, at step 5.
          `Tenure.since` exists and `w.tick - since` is the duration. A stored
          counter is a new `Person`-interior field, which is a NEW ROW in the
          write matrix and a NEW instance of the tier-0 hole `H-62`
          (`hole_register.yaml:715-717`) — paying the tree's worst open hole for
          a number subtraction already yields. Precedent: `Claim` stores `when`
          and eviction computes recency from it rather than storing an age
          (`carriers.py:135-136`).
        * SUB-QUESTION (b) — the direct/mediated test ("a fear is DIRECT iff some
          `own`-eligible verb writes the feared field") is the RIGHT test, because
          eligibility is exactly the predicate the engine already uses to decide
          what a person can form, and `person_side_eligible`'s `remit:` decline
          (`options.py:163-165`) IS the mediation. ⚠ ITS ANSWERS MOVE: r2 items
          10 and 11 rewrite both eligibility predicates, so the test is stable and
          the classification of any given fear is not. Re-run it after r2, do not
          re-cite it.
      ⚠ WHAT IS NOT A RULING AND MUST NOT BE FILED AS ONE: *"an ambition cannot
      currently say WHAT is wanted."* `utter` defaults `mood` to `"OUGHT"`,
      `predicate` to `""` and `value` to `None` (`effects.py:431-433`) because the
      payload is untyped. That is a BUILD item — type `utter`'s payload — not a
      decision. Jordan is not the person who makes a dataclass carry a string.
    citation:
      - "proposals/2026-09-16-conviction-decision-layer/adjudication_register.yaml:36-44 (Jordan's two corrections and the reduction test)"
      - "proposals/2026-09-16-conviction-decision-layer/adjudication_register.yaml:513-525 (the split that does not merge)"

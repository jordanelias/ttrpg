  - id: "CAT-8"
    source: "adjudication_register.yaml"
    question: >-
      Courage — the half of `fear` naming an ENCOUNTER rather than an OUTCOME. What
      is a "challenge kind" and what enumerates them? And is courage a modifier (the
      act costs more), a gate at the extreme (the candidate never forms), or a
      susceptibility (gain on threat-input)?
    disposition: closed
    step: 3
    answer: >-
      A MODIFIER, RAISING THE OBSTACLE, KEYED ON A PER-VERB `demands:` DECLARATION.
      The other two options are each closed by a document, and the shape of the third
      is supplied by precedent.
        * THE GATE OPTION IS CLOSED AT STEP 3. "Below a threshold the candidate is not
          formed at all" is a fifth way to make a verb unavailable to someone, which is
          `eligibility_kinds`'s own definition of a design change needing a ruling —
          and the sentence above it, *"the only class-shaped gate in the design is
          Thread Sensitivity"*, says a per-character disposition is not one. It is the
          same closure as CAT-7's gate half, on the same four lines.
        * THE SUSCEPTIBILITY OPTION IS A STAGE ERROR, closed against the register's own
          unified model. Susceptibility acts at `PHI-0 INTAKE`, runs at WITNESS, and
          the model names `Claim.confidence` as *"the one write licensed here"*. Courage
          is keyed on WHAT A CANDIDATE DEMANDS. No candidate exists at intake — candidates
          are formed at `PHI-2` from questions deposited at `PHI-0`. An operator cannot
          be keyed on an object that does not exist at its stage.
        * SO THE MODIFIER SURVIVES, and the register's own reason is the right one and is
          stronger than it looks: *"A modifier moves the obstacle; a weight moves the
          preference. In an additive system these collapse; under a draw they do not."*
          Valoria resolves by draw, so the distinction is real and the modifier is the
          operator that expresses "I will face this, at a price" rather than "I prefer
          not to".
        * AND THE ENUMERATION QUESTION IS ANSWERED BY PRECEDENT, NOT BY A RULING. The
          register states the shape itself and then does not take it: *"Candidates would
          need to declare what they demand, the way verbs already declare what they
          write."* That is exactly right and it is the tree's existing idiom — `writes:`
          and `eligibility:` are static per-verb columns on `verb_table.yaml`, whose header
          calls the table *"the resolver's body"*, and their value vocabularies are rosters
          in `rosters.yaml`. A `demands:` column plus a `challenge_kinds` roster is one more
          instance of a pattern the table already runs twice. ⚠ THE ROSTER'S MEMBERSHIP IS
          CONTENT AUTHORING, NOT A RULING — naming which challenges exist is design work
          anyone can do against the verb table, and `blocks: nothing today` means nothing
          waits on it.
      ⚠ ONE CONSEQUENCE STATED SO IT IS NOT DISCOVERED LATE: a modifier that raises an
      obstacle is NOT a term in `choose.py`'s score. It acts on the resolution, not on the
      ranking, which means STR-3's noise floor does not bind it — and that is the first
      thing a builder will get wrong, because every other operator in this register is
      scored.

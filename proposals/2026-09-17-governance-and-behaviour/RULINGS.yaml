  - id: "CAT-3"
    source: "adjudication_register.yaml"
    question: >-
      Jordan RULED that a claim's value is modified by the hearer's BELIEF about
      their relation to the teller (lord > peer > enemy). A `Claim` does not
      record the teller. Grade at deposit (no new field, relation frozen), or
      store the teller on `Claim` (re-gradable, but the docstring appears to
      forbid a new field)?
    disposition: closed
    step: 5
    answer: >-
      STORE THE TELLER. The option that looked blocked is not blocked, and the
      option that looked cheap contradicts the ruling it implements.
        * GRADE-AT-DEPOSIT CONTRADICTS THE RULING'S OWN WORDS. Jordan ruled on
          the hearer's BELIEF about the relation. A belief is revisable by
          definition; freezing the grade at the moment of telling makes a lord
          later exposed as a fraud keep his inflated confidence forever, which is
          a belief that cannot be revised. The register's own `note:` states this
          and then declines to take it. It is taken here.
        * THE DOCSTRING BLOCKER IS A MIS-READ, AND THIS IS THE CORRECTION THAT
          CHANGES THE ROW'S COST. `Claim`'s docstring reads *"`round` IS THE ONLY
          CARRIER FIELD `U2` ADDS, AND THE ONLY ONE IT MAY ADD"* — a bound on the
          workplan item `U2`, not a freeze on the dataclass. Its companion clause
          *"AND NO OTHER CARRIER GETS ONE"* is about no other carrier getting a
          `round`, for a stated reason (a fourth clock), which does not reach a
          teller field at all. The register cited the sentence as though it closed
          the option. It does not.
        * AND THE TELLER IS ALREADY IN SCOPE, one branch above the constructor:
          `_act.actor` at `witness.py:316` is the teller's id and is read there to
          exclude self-telling. The `Claim` built at `:361-363` writes ten
          positional fields and is not one of them. The edit is one argument, not
          a lookup.
      ⚠ ORDERING, NOT A CONFLICT: r2 item 8 rewrites the SAME constructor to
      deposit a lossy copy at `Partial`. `00_THE_SEAM.md` §3.1 has this right —
      both belong in one edit, and item 8's falsifier is stronger with the teller
      present.
    citation:
      - "engine/season/state/carriers.py:132-146 (the U2-scoped bound, read in full)"
      - "engine/season/state/carriers.py:147-156 (the ten fields, no teller)"
      - "engine/season/loop/witness.py:316 (`_act.actor` — the teller id, in scope)"

    why_not_closable: >-
      STEP 1 — NOT SUPERSEDED. The four proposed axes are Jordan's own, offered
      2026-09-17, after the seven; nothing later has touched them.
      STEP 2 — NOT IRRELEVANT, and ED-IN-0232 made it CHEAPER rather than closing
      it. The row's own `[E] ⚠ WITHDRAWN` entry records this: with the Key substrate
      retired there is no `KeyValidationError`, no validator and no invariant 6, so
      *"the axis roster's only remaining owner is `engine/season/rosters.yaml`"* —

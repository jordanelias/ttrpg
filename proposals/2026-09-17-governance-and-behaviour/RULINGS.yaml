  - id: "STR-3"
    source: "adjudication_register.yaml"
    question: >-
      `_sample_order` runs after the score sort; `P(inversion) = 1/(1+exp(Δ/τ))`, so
      at the shipped `τ = 0.1` a term is decisive at 95% only if its score gap
      `Δ ≥ 0.294`. Keep `τ = 0.1` and require every term to declare a range against
      that floor, lower `τ` (more rational characters, less variety), or raise it
      (more variety, weaker convictions)?
    disposition: closed
    step: 5
    answer: >-
      KEEP `τ = 0.1`. NOT because 0.1 is right — nobody knows that — but because the
      other two arms are a re-tune with no control, and §0.1 pt 4 is explicit that *"a
      number without a control is not a measurement — in either direction."*
        * THERE IS NOTHING TO TUNE AGAINST YET. The register's own `consequence:` reads
          *"Any new term must declare a RANGE and clear that floor"* and *"the measured
          live plateau gap is 0.0000 — the coin-flip row."* NOT ONE of the terms this
          whole register proposes has a declared range: `alignment` is 52 of 152 cells,
          temperament has no table, stance is 0 rows, orientation has no carrier.
          Moving `τ` today changes the inversion probability of a score built from one
          populated term and a plateau. The arms "more rational" and "more variety" are
          descriptions of a score that does not exist yet.
        * OPTION 1 IS NOT A THIRD ARM — IT IS THE STATUS QUO PLUS A METHOD RULE, and the
          method rule is already `CLAUDE.md` §0.1 pt 3 (*"Name the falsifier, or you have
          not attacked the result"*). Adopting it costs nothing and adds nothing new to
          the tree; it is a restatement of a Layer-0 obligation, applied to a term's range.

  - id: "CAT-7"
    source: "adjudication_register.yaml"
    question: >-
      Jordan says caste is immutable and intrinsic; the live model carries it as a
      CONTESTED `heritage` claim. Which model stands — INTRINSIC (a field), CONTESTED
      (status quo), or BOTH? And does caste GATE, MODIFY, or only supply dice and
      connections?
    disposition: closed
    step: 3
    answer: >-
      CASTE DOES NOT GATE, AND THE CONTESTED MODEL STANDS. Two halves, closed by two
      different steps, and the second half is the one the register thought was open.
        * THE GATE HALF CLOSES AT STEP 3, on a design document quoted inside a roster
          the loader reads at runtime. `rosters.yaml`'s `eligibility_kinds` note
          quotes `#353 §9.2`: *"`capability` supplies dice and GATES NOTHING… **The
          only class-shaped gate in the design is Thread Sensitivity.**"* Caste is a
          class-shaped gate in the exact sense of that sentence. The design does not
          merely fail to authorise a fifth eligibility kind for caste — it names the
          one class-shaped gate it has and caste is not it. The roster's own
          *"needs a ruling before it needs an entry"* is the PROCEDURE for a fifth
          kind; the sentence above it is the ANSWER for this one.
        * THE CARRIER HALF CLOSES AT STEP 4, AND THEN AT STEP 5. Precedent: every
          fact anyone holds about a person in this engine is epistemic.
          `person_predicates` is `[heritage, grade, church_standing, office,
          residence]` — five things ASSERTED about a person, heritage among them
          (`rosters.yaml:272-278`). `standing_of` is built on exactly the gap between
          what others claim about you and what you claim about yourself
          (`options.py:443-464`). A `View` carries only `{holder, claim_ids,
          question}`. The tree has taken this shape five times.
          AND THEN THE DECIDING ARGUMENT, WHICH IS WHY THIS IS NOT AN ESCALATION:
          **BOTH IS CONTESTED PLUS A FIELD.** Option `BOTH` is the strict superset of
          option `CONTESTED` — it adds an intrinsic field beside the claim that is
          already there. Nothing built on the contested model has to be unbuilt to
          reach it later, and the field costs the same in a year as today. So the two
          arms are not a fork, and §0's escalation test — *two defensible options
          leading to materially different games* — is not met: one option is reachable
          from the other at unchanged cost. `INTRINSIC` alone is the only arm that
          forecloses anything, and it is the arm that gives up passing, denunciation
          and disputed lineage, which the register itself calls the reason the
          contested model may be better.
        * ON JORDAN'S WORDS, WHICH THE REGISTER READS AS A CONFLICT AND WHICH ARE NOT
          ONE. *"Caste is immutable and intrinsic"* was said to SPLIT CAT-6, on
          mutability: an office is opened and closed by an act and caste is changed by
          nothing. The contested model satisfies both terms — no verb writes a
          `heritage` claim's value, so it is immutable, and the fiction is intrinsic.
          What is contestable is what people SAY you are, which is a different
          proposition from what you are.
      ⚠ WHAT WOULD RE-OPEN THIS: a design decision that the engine must know a
      person's true lineage independently of anyone's claim — a lineage verb, an
      inheritance rule that resolves against truth rather than against belief. That
      is option `BOTH` arriving with a reason, and it is additive when it comes.

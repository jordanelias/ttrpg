  - id: "CAT-2"
    source: "adjudication_register.yaml"
    question: >-
      Orientation (self-interest vs care for others) is a weight keyed on
      BENEFICIARY, and a `Candidate` carries no beneficiary. Derive it from the
      verb's `writes:`, declare it as a new field or column, or fall back to
      prior work's post-hoc attribution modifier?
    disposition: closed
    step: 5
    answer: >-
      DECLARE IT — and declare it as a STATIC COLUMN ON `verb_table.yaml`
      resolving to a carrier a Candidate ALREADY holds (the actor, `subject`, or
      a named operand), NOT as a fifth field on `Candidate`. Two of the three
      options are eliminated by measurement and by a prior Jordan ruling, and the
      third is eliminated by an invariant in the carrier's own docstring:
        * OPTION 3 (post-hoc attribution) is DEAD BY RULING. Jordan, verbatim:
          *"self interest versus care for others or whatever DRAMATICALLY WEIGHTS
          HOW ONE CHOOSES AND BEHAVES."* That is a weight at appraisal. An
          attribution modifier changes what a win is WORTH after the fact, which
          is the thing he corrected. The register already demoted it; this closes
          it.
        * OPTION 1 (derive from the operand binding) is DEAD BY MEASUREMENT.
          The register filed it *"UNVERIFIED across all 38 verbs"*. IT IS NOW
          VERIFIED AND IT FAILS.
          INSTRUMENT, named so it can be re-run: `engine.season.data.verbs.VERB_TABLE`
          loaded in-process; for each row, `requires_typed.operands()` unioned with
          `{subject, to} & requires_typed.needs()` — which is exactly what
          `operands_for` carries (`options.py:385-396`), and `req is None` returns
          `{}`, so an untyped verb carries nothing.
          MEASURED 2026-09-17: **24 of 38 verbs are UNTYPED and can carry NO operand
          at all.** Of the 14 typed, `to` can be carried by **12**, `from` by **1**
          (`transfer`), `kind` by 1, `amount` by 1, `site` by 3.
          ⚠ THE FIRST WRITING OF THIS ROW SAID `to` APPEARED IN TWO VERBS. That
          number came from a regular expression over the `requires` and
          `requires_typed` TEXT and it counted prose — `establish`'s `to` is a word
          in a sentence, not a bound operand, and it missed the ten verbs that admit
          `to` through `_REFERENT_OPERANDS` (`options.py:343`) rather than through a
          cell. The corrected figure is 12, and the finding survives it: **26 of 38
          verbs can carry no recipient operand, and 24 of those can carry nothing
          whatever**, so there is no beneficiary to extract for the majority of the
          table and the binder is not where one can live. The error is recorded
          rather than quietly fixed because it is §0.1 pt 3's fourth row exactly —
          a measurement that returned a number without the instrument having
          observed the thing it was asked about.
        * OPTION 2's OBVIOUS SPELLING — a fifth `Candidate` field — is refused by
          `Candidate`'s own invariant: *"AND THE FIELD IS NEVER PARTIAL. A form
          whose operands cannot all be bound forms NO Candidate."* A beneficiary
          that binds for 2 of 38 verbs and is carried in `operands` would REFUSE
          36 verbs outright. A beneficiary that binds for 2 of 38 and is carried
          as a fifth field OUTSIDE `operands` is a second partial-binding rule
          beside a rule that forbids partial binding — §8's two owners.
      So the beneficiary is a PROPERTY OF THE VERB, declared once per row beside
      `writes:` and `eligibility:` which are the same shape of static per-verb
      declaration, and resolved at score time against fields the Candidate
      already has. This is what the table is for: its own header calls it *"the
      resolver's body"*.
      ⚠ AND IT DISSOLVES `00_THE_SEAM.md` §3.4's forced ordering. The seam warns
      that *"a beneficiary added as a fifth field after item 7 rewrites the binder
      twice and re-opens that invariant twice."* A verb-table column never touches
      `_derive_operand`, so r2 item 7 and this are independent. The seam's §3.4 is
      a consequence of the option the register led with, not of the question.
    citation:
      - "proposals/2026-09-16-conviction-decision-layer/adjudication_register.yaml:328-334 (Jordan's verbatim correction)"

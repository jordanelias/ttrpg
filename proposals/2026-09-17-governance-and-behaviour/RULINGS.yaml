  - id: "RR-3"
    source: "r2 05 §C.4"
    question: >-
      The zoom-trigger table on `scale_transitions_v30.md`'s `CANONICAL` line: adopt
      `03`'s claim-landing replacement, or keep the thirteen authored rows?
    disposition: closed
    step: 3
    answer: >-
      ADOPT THE REPLACEMENT. **r2 STATES THE CLOSING ARGUMENT IN THE SAME SENTENCE IN
      WHICH IT FILES THE REQUEST AS SURVIVING**, and this is the one place in §C.4 where
      an independent run of the gate disagrees with r2's own.
      §C.4:1469-1472 reads: *"RR-3 · … **SURVIVES** as `03_THE_SURFACE.md` states it, and
      it is still the weakest of all six, because that file carries a second, different
      `## Status:` line, sits in a retire set, and holds **zero `.py`** — **so under §0.05
      it binds nothing at runtime.**"* Every clause after "because" is a reason it does
      not survive.
        * §0.05's TABLE IS EXPLICIT. *"a `## Status: RATIFIED` line on a `.md` | **no** —
          reference."* A `CANONICAL` line is the same object. So the departure is not
          from a MECHANISM, and there is no ratified canon being overwritten — which is
          the only ground a ruling request stands on when steps 1–4 are silent.
        * §0.05's OWN TEST, APPLIED: *"if this document were deleted, would the game
          behave differently?"* Zero `.py`. No.
        * AND THE "KEEP" ARM IS ARCHITECTURALLY UNAVAILABLE AS STATED. §0.05 clause 1:
          *"A `.md` is NEVER the authored head of a fact code reads."* Thirteen authored
          zoom triggers are exactly a fact code would read. Keeping them means AUTHORING
          them into a runtime-read roster — which is build work anyone may do, not a
          ruling Jordan must take. The arm as written asks him to preserve prose as a
          head, which Layer 0 forbids.
        * STEP 2 SUPPORTS THE SAME CLOSURE FROM THE OTHER SIDE. The file is at
          `.designs/systems/_architecture/reference/scale_transitions_v30.md`, quarantined
          by ED-IN-0231, and `CLAUDE.md` §1 is direct about it: *"do not read it as
          authority: §0.05 already forbids that, and this is only the filesystem finally
          agreeing."* r2 already knows this — it records the file as *"in a retire set"* —
          and files the request anyway.
      SO: adopt `03`'s claim-landing replacement. If a later session wants particular
      zoom triggers, it authors them into a roster with a single owner and an execution
      artifact, under §0.05, and that is content work rather than a Jordan gate.
      ⚠ WHAT WOULD RE-OPEN IT — and it is worth stating so this closure is falsifiable:
      evidence that any of the thirteen triggers is READ BY CODE, at which point it is a
      mechanism and the departure is a real one. MEASURED: the file holds zero `.py` and
      lives behind a dot-directory that `glob.glob` and ripgrep skip. Produce one reader
      and this row re-opens.

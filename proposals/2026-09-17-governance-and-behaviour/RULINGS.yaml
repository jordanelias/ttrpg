      exists — **which is a cost argument, not a design one.**"*
      That last clause is the whole of why step 5 cannot take it, and it is the
      distinction this gate most often gets wrong: cheapness is not correctness.
      STEPS 1–4 — all silent, and the row says so, having run them itself: it is *"the
      one question in `proposals/2026-09-10-settlements-factions-populations/` that
      survived all five of `CLAUDE.md` §0's tests; every other open question in that set

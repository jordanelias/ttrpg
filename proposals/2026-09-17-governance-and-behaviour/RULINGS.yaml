      seeing qualitative bands only — and says *"the 13 Convictions … and the
      territory-scale Piety (PT) are DISTINCT and unchanged."* So a `Truth` track
      exists and is ruled distinct from the conviction roster, which means
      `objective <-> subjective` as a conviction axis either duplicates a ruled track
      or is a different thing, and no document says which.
      STEP 4 — NO PRECEDENT. There is no prior instance of this tree choosing a moral
      basis; the live four came from `conviction_axis_matrix_v30.md` and are the thing
      being replaced.
      STEP 5 — REFUSED, ON BOTH branches of §0's test. THE AXES ARE THE MORAL CONTENT
      OF THE GAME: they are what every conviction weight projects onto and what every
      verb is scored against, so two axis sets are two different games by construction.
      And the migration has no partial state — `_load_projection` and `_load_alignment`
      raise at MODULE SCOPE, so a 13×N projection and an N×38 alignment table must both
      exist before first import. There is no cheap way to try one.
      ⚠ WHAT IS ALREADY DECIDED INSIDE THIS ROW AND SHOULD NOT BE RE-ASKED: the
      register's `reshaped_2026_09_17:` note is correct that three of the seven
      (`selfish`, `passive`, `peaceful`) are TEMPERAMENT and were measured against a

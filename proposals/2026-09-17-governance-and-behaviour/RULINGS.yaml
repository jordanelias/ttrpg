    - {id: "CAT-6", one_line: "H-71 — which of FOUR routes lets a seated person know their own remit? The register offers three; r2 built a fourth. Precedent favours arm 4, which produces the behaviour AX-2 exists for; arm 2's carrier is now on r2's deletion list."}

# ---------------------------------------------------------------------------
# RULINGS.yaml — the twenty-one open questions between Jordan and two suites,
#                run through `CLAUDE.md` §0's five-step gate.
#
# ## Status: PROPOSED — held back. NOTHING HERE RATIFIES ANYTHING, and this file
#            flips no `## Status:` line anywhere in the tree.
#
# WHAT IT IS. Twenty-one questions sit between Jordan and two suites that cannot
#   be built until they are answered:
#     * SIX ruling requests from `../2026-09-17-governance-and-holdings-r2/`
#       `05_LEDGER_AND_BUILD.md` §C.4 — RR-P, RR-A, RR-B, RR-C, RR-2, RR-3.
#     * FIFTEEN rows carrying an empty `ruling:` in
#       `../2026-09-16-conviction-decision-layer/adjudication_register.yaml`
#       — nine `CAT-*` categories and six `STR-*` structural rows.
#   Every one was run through §0's gate IN ORDER: superseded → irrelevant →
#   answered by a design document → answered by precedent → answered by what
#   makes sense for the architecture.
#
# HOW TO READ IT.
#   * `disposition: closed`   — the gate answered it. The row carries the STEP
#     that answered it, the ANSWER, and a CITATION. Every cited `file:line` in
#     this file was OPENED at that line (§0.1 pt 3, row three). Where a line
#     could not be opened the claim is written WITHOUT a line rather than with
#     an invented one.
#   * `disposition: escalate` — it survived all five. It is a genuine Jordan
#     decision: two defensible options leading to materially different games, or
#     an answer that would overwrite ratified canon. Every escalated row carries
#     `why_not_closable:` naming which of the five steps was tried and why each
#     was silent.
#
# WHAT `closed` DOES NOT MEAN. It does not mean built, ratified or agreed. It
#   means the tree already decided this and the decision was findable. A closed
#   row is `CLAUDE.md` §0's own instruction executed: *"find a stale
#   `needs_jordan` on a settled question and CLOSE it with its citation.
#   Preserving a dead question is not conservatism; it is how the queue formed."*
#
# ⚠ THE ONE ASYMMETRY WORTH DECLARING. This file was written by the session that
#   also wrote `00_THE_SEAM.md`'s subject map, so its bias runs toward closing —
#   a smaller queue looks like more work done. The counter-pressure applied at
#   every row was §0's own escalation test, stated as a question with a
#   falsifiable answer: WOULD THE TWO ARMS PRODUCE MATERIALLY DIFFERENT GAMES?
#   Where the answer is YES the row escalates even though a step-5 argument was
#   available — CAT-6, STR-2 and STR-6 are that case. Where the answer is NO the
#   row closes even though the question FEELS like a call, which is §0's own
#   instruction: *"Do not escalate a call that has an obvious engineering answer
#   merely because it is a call."* CAT-7, CAT-9 and STR-3 are that case, and each
#   says inside its own `answer:` what would re-open it.
#
# ⚠ TEN CORRECTIONS TO THE SOURCES, listed at `corrections_to_the_sources:` at the
#   foot of this file. Five are citation drift and change nothing. FIVE ARE
#   SUBSTANTIVE — entries 6, 7, 8, 9 and 10 — and three of those change what a row
#   COSTS, what an arm IS, or whether a rider still binds, which is why every one is
#   recorded rather than quietly fixed. **Entry 8 is the one to read: the register
#   names its entire second basis on a word that is already taken at another scale.**
#   ⚠ AND ONE ERROR OF THIS FILE'S OWN, caught by its own adversarial pass before
#   publication and left visible inside `CAT-2` rather than tidied away: a first
#   operand census was taken with a regular expression over verb-table TEXT and
#   counted prose. It was re-taken with the loader in-process. The wrong figure, the
#   right figure and the reason the first instrument could not see the thing it was
#   asked about are all in that row.
# ---------------------------------------------------------------------------


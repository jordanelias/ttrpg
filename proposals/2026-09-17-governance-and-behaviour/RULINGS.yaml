  - id: "STR-1"
    source: "adjudication_register.yaml"
    question: >-
      Nothing writes a `Person`'s interior. Does a verb at RESOLVE write it, does a
      SEVENTH loop step with a new write class write it, or does nothing persist —
      the interior recomputed every season from claims and tenures?
    disposition: closed
    step: 3
    answer: >-
      A VERB AT RESOLVE WRITES IT. This is not a choice between three designs; it is
      the design the ratified write matrix ALREADY PRESCRIBES, with the producers
      missing. The register states the problem as a prohibition — *"nothing MAY write
      a Person's interior"* — and the matrix says the opposite: the six rows are a
      LICENCE nobody has taken up.
        * WHAT THE MATRIX SAYS, read at the rows. Every one of the six is
          `steps: [RES]`, `class: "ACTS"`, with its own `emits:` kind —
          `axis.incremented`, `belief.revised`, `coherence.changed`,
          `conviction.moved`, `scar.taken`, `stance.moved`. The header states the
          derivation the loader enforces: *"A step determines its write class exactly:
          CAL->CALENDAR, MAT->MATTER, **RES->ACTS**, WIT->INTERIOR, CEN->MATTER,
          DEL->ACTS … the loader asserts they agree and raises if they do not."* So
          `[RES] ACTS` MEANS "written by an act at RESOLVE", declared, checked at load,
          and read by `shape.py`'s `write()` gate at runtime — mechanism under §0.05,
          not prose.
        * AND `H-62` SAYS SO IN ITS OWN WORDS: *"an interior write is a CONSEQUENCE OF
          AN OUTCOME, which is what the new Degree-keyed `writes` column declares — so
          the verbs are still unwritten and **there is now a column to write them in**."*
          The matrix header repeats it: *"The verbs are still unwritten; what changed is
          that there is now a column to write them in."* A hole whose own shape field
          names the answer is not an open design question.
        * OPTION 2 (A SEVENTH STEP) IS CLOSED AT STEP 3 AND WOULD NOT BE MINE TO TAKE.
          RATIFIED `04_CODE_ARCHITECTURE.md` §A.2:134 reads *"loop/ driver + six steps.
          The driver is the ONLY constructor of write tokens"*, quoted in `driver.py:3-4`,
          and `:4-5` names the six by file: `loop/{calendar, matter, deliberate, resolve,
          witness, census}.py`. A seventh step makes a ratified Layer-1 sentence
          false, which is `RR-B`-shaped: step 5 may not overwrite ratified canon. It is
          also unnecessary, since the licence already exists.
        * OPTION 3 — "NOTHING PERSISTS" — ASSESSED PROPERLY, BECAUSE THE ROW SAYS IT IS
          *"cheaper than it looks and has not been considered."* IT IS CHEAPER THAN IT
          LOOKS, AND IT IS AXIOM-BARRED FOR TWO OF THE SIX, WHICH IS WHAT KILLS IT AS A
          CLASS ANSWER.
            - FOR `convictions` IT IS BARRED BY `AX-3`. *"Evidence moves what is held
              true. Argument and consequence move what is held right."* Recomputing
              convictions from the claim ledger makes EVIDENCE move what is held right.
              `AX-3` exists for exactly this: *"if evidence could move a conviction, then
              finding a document would change what a person believes is right, and the
              moral layer would collapse into a second epistemic layer"* — which the
              chain calls *"the single most dangerous [collision] in the design"*.
              Option 3 IS that collision, implemented.
            - FOR `scar` IT IS BARRED BY THE FADING CARVE-OUT. `AX-5`'s licensed fading
              *"only REMOVES and never REVISES"*, and claims decay and are evicted on
              `confidence × recency` (`carriers.py:135-136`). A derived scar would
              therefore UN-SCAR a person as the memory of the event dims — a permanent
              mark that expires, which is `AX-6`'s *"nothing becomes permanent without
              an author"* run backwards: the author acted and the permanence evaporated
              on a clock.
            - AND ITS ONE REAL VIRTUE IS WHY IT MUST BE REFUSED AS A CLASS ANSWER. It
              genuinely IS right for `regard` — CAT-5's option 2 is option 3 for one
              field, and deriving regard from claims about the other is coherent. But
              STR-1's entire value is its `consequence:` line: *"Pressure, scar, the
              needs counter, the fear item and regard production are NOT five problems.
              They are one, and one ruling unblocks all five."* A per-field answer
              destroys that. Two of the six cannot be derived, so the class answer is
              "stored, written by an act", and any individual field may still be derived
              later on its own merits — CAT-5's `(Person, stance)` row being the first
              place to argue it.
      ⚠ ON `(Person, body)` — CONFIRMED, AND `00_THE_SEAM.md` §4 IS RIGHT ON THE
      SUBSTANCE. `write_matrix.yaml:161-167` files it `steps: [MAT, RES] · class:
      "MATTER/ACTS" · social: "false" · by: "DR-1"`. It is not one of the six and STR-1
      does not bind r2 item 3b. ⚠ BUT THE SEAM'S VOCABULARY IS WRONG IN A WAY THAT
      MATTERS HERE — it calls the six *"the INTERIOR class"*, and in the matrix's own
      literal `class:` column the six are `ACTS`; the only `INTERIOR` row in the file is
      `(Person, claim_ledger)` at `[WIT]`. Measured: 22 `ACTS`, 1 `INTERIOR`, 6 `MATTER`,
      6 `MATTER/ACTS`, 1 `CALENDAR`, 3 `CALENDAR/ACTS`. The distinction is the whole of
      why this row closes: `INTERIOR` is the class WITNESS writes and no act may touch,
      whereas `ACTS` is the class an act is licensed to write. Reading the six as
      `INTERIOR` is what makes STR-1 look like a prohibition needing a ruling to lift.
      See `corrections_to_the_sources:` entry 6.
    citation:

  - id: "CAT-9"
    source: "adjudication_register.yaml"
    question: >-
      Is `bearing` ONE vector with seven components (a second basis with its own
      N×38 alignment table), SEVEN independent quantities sharing only a register,
      or a HYBRID? Plus: does it drift, and is it visible to others?
    disposition: closed
    step: 5
    answer: >-
      THE HYBRID, AND IT IS FORCED RATHER THAN CHOSEN. The row's own `operator:`
      field decides it before the options are read: *"MIXED — the seven do not share
      one operator, which is why they were never going to be one axis set."* An
      alignment table is a map from (axis × verb) to a WEIGHT. Three of the seven are
      verb-weights and fit that shape; four are not, and no table cell can hold them:
        * `courage <-> cowardice` is a MODIFIER on an obstacle (CAT-8). A table of
          weights cannot express a cost on a draw.
        * `altruistic <-> selfish` is a weight keyed on BENEFICIARY (CAT-2), which is
          a per-verb declaration resolving to a Candidate field — not an axis column.
        * `humble <-> vain` is ALREADY BUILT as `standing_of` — the gap between the
          told-by claims about a person and their own firsthand claims
          (`options.py:443-464`). It is a derived quantity, not a held one.
        * `insecure <-> self-assured` is the susceptibility GAIN at `PHI-0`, the
          intake operator Jordan restored — a third key on an operator that already
          exists, acting a stage earlier than any table.
      So: ONE temperament alignment table over THREE axes (`pacifist <-> militaristic`,
      `diplomacy <-> intimidation`, `passive <-> aggressive`), held directly on the
      Person; and four quantities that keep the machinery they already have or are
      getting. 7 = 3 + 1 + 1 + 1 + 1. The "ONE vector" option is not a defensible
      alternative — it is refuted by the register's own measured placement table — and
      "SEVEN quantities" differs from the hybrid by exactly one shared table, which is
      a §8 question (one owner for one rule) and not a game question.
      SUB-QUESTION — VISIBILITY. Closed at step 3 by `AX-2` and the `View` constraint:
      temperament is visible to others ONLY as claims about the person, never as a
      read of the field. `standing_of` is already the worked instance — `humble/vain`
      is "visible" precisely because it is COMPUTED FROM CLAIMS. Nothing special is
      needed and nothing new may be added.
      SUB-QUESTION — DRIFT. Closed at step 4, and the answer is *not yet, and then by
      the same route convictions take.* Convictions move by argument and consequence
      and never by evidence (`AX-3`, `01_AXIOMS.md:113-115`), carried at RESOLVE by an
      act (`write_matrix.yaml:182-188`). A drifting temperament is the same object: a
      `[RES] ACTS` row with an act as its producer. Adding a SECOND producerless
      interior field while `H-62` — *"NO VERB IN THE 32-ROW TABLE WRITES ANY `Person`
      INTERIOR FIELD"* — is the tree's live tier-0 hole would be minting the defect
      twice. So temperament is fixed until STR-1's producer exists, and inherits its
      route when it does. That is an ORDERING, not a refusal.
      ⚠⚠ AND THE ONE THING THAT MUST BE SETTLED BEFORE A LINE OF THIS IS BUILT, WHICH
      THE REGISTER DOES NOT NAME: **`temperament` IS ALREADY TAKEN.**
      `references/descriptor_registry.yaml:298` carries `temp.*`, `kind:
      temperament_type`, *"5 territory temperaments"*, `scope: "territory/faction
      (pop-weighted avg)"`, sourced to `territory_temperaments_v30.md` — which
      `CURRENT.md:30` lists as a live canonical head of the settlement/territory
      subsystem. This register names its entire second basis, its `bases:` section and
      four of its rows on a word that already denotes a DIFFERENT quantity at a
      DIFFERENT SCALE with a DIFFERENT CARDINALITY (five, not seven). That is the same
      §4 idempotency failure STR-6 catches for `piety` — *"two scales, one word: a later
      session reading it cold cannot tell which is meant"* — missed on the word this
      register uses most. **The naming decision belongs with STR-5 and STR-6, which
      escalate; the SHAPE above does not wait on it.** See `corrections_to_the_sources:`
      entry 8.

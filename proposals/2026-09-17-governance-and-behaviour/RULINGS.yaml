  - id: "STR-2"
    source: "adjudication_register.yaml"
    question: >-
      Jordan proposed a replacement axis set for the live four (`hierarchical ·
      sacred · instrumental · traditional`). With two bases now identified, which
      axes does the MORAL-VALUE basis carry — and is `objective <-> subjective` a

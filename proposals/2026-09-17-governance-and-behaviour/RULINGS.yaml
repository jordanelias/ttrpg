    is mostly its consequence. Then RR-B, whose `B-8` limb is a game change hiding
    in a list of sentences. Then CAT-6, which is now a four-arm question and was a
    three-arm one. Then the vocabulary pass (STR-5 + STR-6) as ONE decision over
    five words. Then STR-2, which the vocabulary pass shapes. RR-P and RR-2 are
    independent of all of it and gate nothing.
  rows:
    - {id: "RR-A",  one_line: "Is the named act itself the compliance — or does ED-IN-0210's letter require the three response rows to exist? Step 5 may not overwrite a ruling. BLOCKS r2 item 13, and nothing else."}
    - {id: "RR-B",  one_line: "Amend eight RATIFIED `architecture/` sentences, or narrow the design? Seven are text; B-8 is a GAME change — a lower seat that holds the land may unmake the seat above it — and branch (ii) on B-6 is a whole subsystem."}

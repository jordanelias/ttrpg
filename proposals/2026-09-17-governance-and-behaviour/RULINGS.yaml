    - {id: "RR-2",  one_line: "ED-SE-0051 — demographic loop bounded by matter only, or matter plus hearth capacity? The ledger row ran the gate itself and reached the same answer. ⚠ Now rulable ALONE and scoped to POPULATIONS: ED-WR-0011 was RULED 2026-09-13 and its pairing rider is discharged for NPC generation. Gates nothing."}


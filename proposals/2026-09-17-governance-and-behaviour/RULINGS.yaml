  - id: "CAT-1"
    source: "adjudication_register.yaml"
    question: >-
      Are moral value and religious value ONE kind or two? They share one field
      today, so a devout and a secular character differ by a Faith weight — a
      difference of DEGREE where a difference of KIND may be wanted.
    disposition: closed
    step: 1
    answer: >-
      TWO KINDS. Jordan's 2026-09-17 reservation of the word `conviction` for
      piety SELECTS the second option and makes religious commitment its own
      quantity; the register says so itself in two places and then declines to
      write the ruling down. Jordan, verbatim: *"conviction should be reserved
      for a different concept, not moral values"*, and, naming it, *"piety"*.
      A ruling that is recorded but not entered is still a ruling — step 1.
      ⚠ WHAT DOES NOT CLOSE WITH IT: what the two quantities are CALLED, and how
      person-scale piety is told apart from territory-scale Piety (PT). That is
      STR-6, which escalates. The KIND question and the NAMING question are
      different objects and only the first is answered here — CAT-1 asked
      whether they are one kind or two, not what to spell them.
    citation:

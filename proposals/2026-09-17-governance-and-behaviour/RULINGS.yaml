  - id: "CAT-5"
    source: "adjudication_register.yaml"
    question: >-
      Is regard (`Person.stance`) PRODUCED by witnessed acts — a verb writes it at
      RESOLVE — or DERIVED from the actor's claims about the other and never
      stored?
    disposition: closed
    step: 3
    answer: >-
      PRODUCED AND STORED. A verb writes it at RESOLVE. The ratified write matrix
      says so in a file `engine/season/shape.py`'s `write()` gate READS AT RUNTIME,
      which makes it mechanism under §0.05 rather than prose:
      `(Person, stance)` is `steps: [RES] · class: "ACTS" · social: "true" ·
      emits: "stance.moved"`. A derived quantity has no write-matrix row, no write
      class and no emit kind; this one has all three. The question is answered by
      the design, at the row.
      ⚠ AND OPTION 2's ARGUMENT DOES NOT BEAR. The register justifies "derived,
      never stored" as *"consistent with View's constraint"* — a `View` carries
      only `{holder, claim_ids, question}`, so a character cannot read another's
      interior. `stance` is read by `stance_toward(p, ...)` from `p`'s OWN rows
      inside `p`'s own deliberation (`choose.py:78-85`, invoked at `:305` with
      `p`). There is no cross-holder read to forbid. The status quo already
      satisfies the constraint that was offered as a reason to change it.
      SO CAT-5 REDUCES TO STR-1 — `stance` has a licensed writer and no verb takes
      the licence, which is `H-62`, one hole and not six. It carries no independent
      ruling.
      ⚠ CARRIED FORWARD, NOT RULED HERE: the register's own `[R]` that
      `clock_registry_v30.md:105`'s `Disposition` has the SAME RANGE and that
      *"`stance` IS Disposition under a second name"* is a §4 idempotency defect of
      the same family as STR-5 and STR-6. It belongs with them, and it is named in
      those rows rather than duplicated into a third.
    citation:
      - "engine/season/write_matrix.yaml:203-209 (the `(Person, stance)` row)"
      - "engine/season/write_matrix.yaml:4 (`shape.py`'s `write()` gate reads this file)"
      - "engine/season/write_matrix.yaml:14-17 (the class derivation: RES -> ACTS)"
      - "engine/season/decision/choose.py:78-85 (stance_toward reads p's own rows)"
      - "engine/season/decision/choose.py:305 (invoked with p, no cross-holder read)"
    blocks_build_item: null

  - id: "CAT-6"
    source: "adjudication_register.yaml"
    question: >-
      H-71 — a seated person must be able to know their own remit, person-side,
      so that offices can inform the suite of choices available to a character.
      By which route?
    disposition: escalate
    step: null
    why_not_closable: >-
      STEP 1 — NOT SUPERSEDED, AND THIS IS THE ROW'S REAL DEFECT. A fourth route
      was RULED in the sibling directory on the same day
      (`03_SEATS_AND_CONTENT.md:794`) and CAT-6's option list does not carry it,
      so a ruling taken from the register alone would choose among three arms with
      a fourth built beside it. `00_THE_SEAM.md` §2 found this and calls it *"a
      defect in the question"*, which is right. The question is repaired here and
      put once, over four arms.
      STEP 2 — NOT IRRELEVANT. `H-71` is `tier: 0`, `grade: absent`, and its own
      `cite:` records that the 2026-09-02 governance slice built the RESOLVE half
      of a mechanism this hole blocks, so `resolvable_verbs()` moved 8 → 12 and
      *"the 8-to-12 move CANNOT AFFECT ANY RUN."* Live and load-bearing.
      STEP 3 — SILENT BY ITS OWN ADMISSION. `§F1` asserts the clause is
      person-side and does not say HOW; `H-71`'s `owner:` field reads
      *"unassigned"* for exactly that reason.
      STEP 4 — PRECEDENT EXISTS AND IT FAVOURS ARM 4, BUT IT CANNOT CLOSE A ROW
      JORDAN HAS ALREADY BEEN ASKED. He filled this sweep himself on 2026-09-16.
      STEP 5 — REFUSED ON PRINCIPLE. Taking it would be an agent choosing which of
      four governance models the game has, on a tier-0 hole its own register puts
      to Jordan, after he has already engaged with it. That is the definition of a
      live design choice.
      ⚠ ONE THING THE REGISTER SAYS THAT IS NO LONGER TRUE, AND IT CHANGES WHAT AN
      ARM COSTS — see `corrections_to_the_sources:` entry 7. ARM 2's CARRIER IS ON
      r2's DELETION LIST. `03_SEATS_AND_CONTENT.md:744` files *"the grant on
      `Tenure.payload` | the 2026-09-16 sweep | REFUSED — retired"*, citing
      `ARCH §B.8`'s `term? … Replaces payload?`; `05` lists `(Tenure, payload)`
      among the fields item 14 deletes and `05:972` states it as done after the
      suite. `00_THE_SEAM.md` §2 says arm 4 *"keeps `AX-2` untouched the same way
      arm 2 does"*, which reads arm 2 as live. It is not: choosing arm 2 now costs
      un-deleting a field RATIFIED `ARCH §B.8` prescribes deleting, which makes arm
      2 an `RR-B`-shaped request rather than a free choice. THIS IS NOT A REASON TO
      REFUSE ARM 2 — it is a price that must be on the sheet when it is chosen.
    the_four_arms: >-
      Stated side by side, in each source's own words, because the whole failure
      here was an option list that was short by one.
        ARM 1 · DECLINE (status quo). `hole_register.yaml:803`: *"`remit:` is
          unevaluable person-side, so the verb never forms (the default; it is the
          INCUMBENT, not a choice)."* The row is emphatic that ARM 1 WAS NEVER
          DECIDED — `grade: absent`, `owner: unassigned`, `default: none` — and
          that the instrument filled §F1's silence by refusing. COST: under arm 1 a
          holder cannot know their own powers; every governance ambition is
          unformable and every office opaque to the person holding it. That is the
          thing Jordan's 2026-09-16 statement asks for and does not get.
        ARM 2 · THE GRANT RIDES ON THE `hold` TENURE'S PAYLOAD.
          `hole_register.yaml:804`. Its case, at `:807`: *"A remit on the Tenure is
          not a second copy of the office's remit; it is the GRANT, which is what a
          holder actually has … It reaches no `World`, so `AX-2` is untouched and
          `choose`'s signature does not move."* COST: as above — the carrier is
          retired by the sibling suite and by `ARCH §B.8`.
        ARM 3 · THROUGH `sense()`. `hole_register.yaml:805`, and the row grades it
          itself: *"ARM 3 IS INCLUDED FOR HONESTY AND IS THE WEAKEST: it leaves the
          store alone at the cost of a third `Sensation` scalar, and S18.2 rules
          that type to EXACTLY TWO, so taking it amends a ruled constraint rather
          than filling this hole."*
        ARM 4 · A CLAIM ABOUT A HELD DOCUMENT. `03_SEATS_AND_CONTENT.md:794`:
          *"RULED: the grant is a CLAIM about a HELD DOCUMENT, and H-71 closes on
          both sides."* A `commission` `Record` minted by `confer`; the deposit rule
          puts a `content:commission` claim in the holder's own ledger naming a seat
          whose `remit_acts` include the act; `person_side_eligible`'s decline
          becomes a claim read, while world-side `_eligible` keeps asking the actual
          hold. COST: depends on `02`'s `record_kinds` roster, which does not exist
          (`03:798-800` declares it); it is r2 EXECUTION_PLAN item 11, gated on
          items 5 and 10.
    which_precedent_favours: >-
      ARM 4, and the margin is not close — but the reason is not the one
      `00_THE_SEAM.md` gives.
      ⚠ THE SEAM SAYS ARM 4 *"keeps `AX-2` untouched the same way arm 2 does"*.
      OPENED AND CHECKED, THAT UNDERSTATES IT, AND THE TWO ARMS ARE NOT
      `AX-2`-EQUIVALENT. Arm 2's claim is NON-VIOLATION — *"it reaches no `World`"*
      (`hole_register.yaml:807`). Arm 4's claim is CONFORMANCE: `AX-2` reads *"A
      person decides from what they hold, and what they hold MAY BE FALSE. There is
      no view of world truth available inside a decision"*
      (`01_AXIOMS.md:102-103`), and a claim in a ledger is the canonical instance of
      a thing held that may be false. `03:789-792` makes exactly this argument and
      it survives reading: *"A claim about a seat IS the person's own state."*
      THE TEST THAT SEPARATES THEM: CAN THE PERSON BE WRONG ABOUT THEIR OWN REMIT?
      Under arm 2 the Tenure payload is authoritative world state the holder carries,
      so a revoked man's grant vanishes the instant the world changes and he can
      never act on a stale belief. Under arm 4 he can — `03:785-787` builds the case
      deliberately: the holder deposits a `content:commission` claim in good faith,
      attempts the act, and RESOLVE refuses it because RESOLVE asks the seat. *"No
      special case, no forgery branch in the predicate."* `AX-2` exists to make a
      false conclusion indistinguishable from a true one to the person holding it
      (`01_AXIOMS.md:105-107`). Arm 2 satisfies the axiom's letter; ARM 4 PRODUCES
      THE BEHAVIOUR THE AXIOM EXISTS FOR.
      Two further supports, both from outside r2: `ARCH §C.3` puts no `World` in
      `decision/`, which arm 4 honours by construction; and `person_predicates`
      already carries `office` as a CLAIM about a person alongside heritage, grade,
      church_standing and residence (`rosters.yaml:272-278`) — so arm 4 files a
      seat's remit where the tree already files the seat.
      ⚠ AND THE CASE AGAINST ARM 4, STATED BECAUSE NOBODY ELSE STATES IT: it is the
      only arm that makes a governance power EPISTEMIC, so an office's reach becomes
      a function of what its holder was told. If Jordan wants a seat to be a hard
      permission rather than a believed one, arm 2 is the arm that says so, and its
      retired carrier is a price rather than a refusal. That is the decision, and it

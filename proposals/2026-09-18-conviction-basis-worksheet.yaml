    canon: "canon/00_philosophical_foundations.md:241,257"
    gloss: "the outer tradition — Church institutional theology; the perceptual prophylaxis as received doctrine"
    keep: ~            # true / false
  - name: inner_tradition
    canon: "canon/00_philosophical_foundations.md:283-285"
    gloss: "within the Church; thread-sensitive; preserves ontological knowledge as poetry and practice, not propositional doctrine"
    keep: ~            # true / false
  - name: threadwork
    canon: "canon/00_philosophical_foundations.md:263-265"
    gloss: "active practice — suspension of all grounding in order to touch threads"
    keep: ~            # true / false
  - name: einhir_revival

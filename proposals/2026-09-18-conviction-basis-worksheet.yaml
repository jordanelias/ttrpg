# ============================================================================
# 6. ⚠⚠⚠ THE DOCKET — does `6f` GET BUILT, OR DELETED?
# ============================================================================
# `decision-procedure-docket.md` supersedes the adjudication's two-stage proposal and REPLACES THE
# UTILITY SUM IN FULL with an ordered list of TESTS, each returning EXCLUDE / DECIDE / PASS. Run in
# order until one DECIDEs, one option remains, or the set EMPTIES. Three bands; only the middle
# (six DECISIVE tests: obligation · threat · conviction · standing · goal · habit) is authored, and
# what is authored is THEIR ORDER, not a number.
#
# THIS IS NOT A REFINEMENT OF PHASE 6. `6f` IS *"the score function itself -- pull(c) - cost(c)"*
# (01_THE_BUILD_ORDER.md:1032). Under the docket there is no score function. 6f is not built; it is
# deleted, and 6a-6e's carriers are relocated into individual tests instead of summed.
#
# ── WHAT THIS TREE ALREADY AGREES WITH ───────────────────────────────────────
#   * THE APERTURE IS ALREADY PROHIBITION-SHAPED. `opening_set` is four DISCRETE clauses with no
#     arithmetic and it REMOVES rather than scoring low, which is the docket's own definition of an
#     honest refusal. Stage 1-2 partly exists.
#   * A SUM CANNOT BE NARRATED, and this tree has the absence measured: `trace_log` records actor,
#     verb and budget only; the per-term breakdown lives transiently in `choose.py:359-369` and is
#     thrown away. The docket's `reason = test.name` is exactly the datum that is missing.
#
# ── WHAT THIS TREE MEASURES AGAINST IT, AND IT IS THE DOCKET'S STRONGEST ARGUMENT ──
# The document's best claim is that a procedure can DETECT a dilemma (the live set empties) where a
# sum only ever returns a least-bad number. MEASURED on `build_realm(0)`, 2026-09-18, separating
# the two different empties the tree currently treats as one:
#
#     persons                                46
#     no QUESTION at all                      0   <- `questions.py:29`'s case
#     has a question, ZERO candidates left    0   <- the DOCKET's dilemma case
#     has a question, exactly ONE left        0   <- decided by exclusion alone

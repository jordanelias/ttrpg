# RULINGS.yaml:1094-1096) and the four LIVE today (traditional/sacred/instrumental/hierarchical).
# STR-2's whole point was that two axis sets are two different games; three is not better.
#
# FOUR THINGS ABOUT IT, MEASURED OR READ, BEFORE YOU CHOOSE:
#
#  (a) ⚠ ITS DEFINITIONS LIVE IN A FILE THAT DOES NOT EXIST. Part 5 defers "full descriptor, axis
#      definitions, aggregation rules and sweep arms" to `conviction_projection_vnext.yaml`.
#      SEARCHED 2026-09-18: absent from the repository AND from the uploads. So the three axes are
#      named here and defined nowhere.
#
#  (b) ⚠ `purity` AGGREGATES BY WEIGHTED **MAX**, NEVER SUM -- and the single owner cannot compute
#      that. `data/convictions.to_axes` IS `Sigma_conv w[conv] * P[conv][axis]`, a linear sum, and
#      §8 makes it the one owner of convictions->axes. A max-aggregating axis needs that owner
#      changed, not a new column.
#      ⚠ It does NOT escape R7, and it is worth being clear about that: max is still a function of
#      the weight vector ALONE, so two people with identical weights are still identical on it.
#      Max buys a different SHAPE, not per-character variation.
#
#  (c) ⚠ `facing` IS USED FOR TWO DIFFERENT OBJECTS IN ONE DOCUMENT -- a conviction AXIS here, and
#      a character FIELD at its §1.7 ("weights obligation upward / lateral / downward"). And
#      synthesis.md:229 already owns the second sense as the personality parameter. Three uses of
#      one word; §4's cold-reader test fails.

# CONVICTION + MORAL BASIS — Jordan's authoring surface
#
# STATUS: WORKSHEET. Not a proposal, not canon, ratifies nothing. It exists so the CELLS are
# in front of you instead of statistics about them. Type values here; they get written to the
# OWNERS below and this file is then deleted. It holds no fact of its own (CLAUDE.md §0.05 cl.3).
#
# OWNERS the values land at:
#   affiliations + incompatibility -> references/descriptor_registry.yaml (roster) + engine/season/rosters.yaml (table)
#   moral basis axes + rows        -> references/descriptor_registry.yaml (conviction_roster, axis_roster)
#   the 13xN projection            -> engine/season/rosters.yaml tables.conviction_projection
#   the verb x axis alignment      -> engine/season/rosters.yaml tables.alignment
#
# RULINGS THIS SERVES (2026-09-18, in session, NOT YET RECORDED IN THE TREE):
#   R1  `conviction` is reserved for RELIGIOUS AFFILIATION AND INTENSITY. A vector over
#       affiliations; confliction DERIVED from an incompatibility relation, never stored. (= STR-6)
#   R2  `Truth` IS NOW `Conviction`. ED-IN-0075's 0-5 pole (Solmund-orthodoxy <-> Thread-truth,
#       CURRENT.md:31, ruled 'DISTINCT and unchanged') is ABSORBED. Its two poles stop being ends
#       of one axis and become two affiliations a person can hold at full intensity at once —
#       which is the case a pole scalar structurally could not express.
#   R3  The cells are yours.

# ============================================================================
# 1. THE RELIGIOUS CONVICTION VECTOR  (R1 + R2).  NOTHING OF THIS EXISTS TODAY.
# ============================================================================
# Measured 2026-09-18: no affiliation roster, no incompatibility relation, and
# `church_standing` is one string in a claim-predicate values list (rosters.yaml:312) that
# nothing reads. The only religious FACTION is 'Church of Solmund'.
#
# CANDIDATES BELOW ARE DRAWN FROM canon/, not invented — cited so you can reject on the source.
# Strike what you don't want, add what's missing, set nothing else.

affiliations:
  - name: solmund_orthodoxy
    canon: "canon/00_philosophical_foundations.md:241,257"
    gloss: "the outer tradition — Church institutional theology; the perceptual prophylaxis as received doctrine"
    keep: ~            # true / false
  - name: inner_tradition
    canon: "canon/00_philosophical_foundations.md:283-285"
    gloss: "within the Church; thread-sensitive; preserves ontological knowledge as poetry and practice, not propositional doctrine"
    keep: ~            # true / false
  - name: threadwork
    canon: "canon/00_philosophical_foundations.md:263-265"
    gloss: "active practice — suspension of all grounding in order to touch threads"
    keep: ~            # true / false
  - name: einhir_revival
    canon: "canon/03_canonical_timeline.md:22; canon/02_canon_constraints.md:71"
    gloss: "Varfell; the pre-Calamity civilisation's working restored"
    keep: ~            # true / false
  - name: altonian_theocracy
    canon: "canon/02_canon_constraints.md:71"
    gloss: "Hafenmark-aligned; a rival ecclesiastical polity"
    keep: ~            # true / false

# INTENSITY — what a person's per-affiliation number means. Truth was 0-5 with players seeing
# qualitative bands only (ED-IN-0075). A vector can keep that or not; your call.
intensity:
  scale: ~                 # e.g. '0-5' (Truth's, inherited) or '[0,1]' or '0-3'
  player_sees: ~           # 'bands' (Truth's ruling) or 'number'
  bands: ~                 # if bands: name them, lowest first

# INCOMPATIBILITY — the relation confliction is DERIVED from. Fill the half-matrix.
# true  = holding BOTH at high intensity puts the person in religious confliction
# false = compatible; a person may hold both without strain
incompatible:
  solmund_orthodoxy + inner_tradition: ~
  solmund_orthodoxy + threadwork: ~
  solmund_orthodoxy + einhir_revival: ~
  solmund_orthodoxy + altonian_theocracy: ~
  inner_tradition + threadwork: ~
  inner_tradition + einhir_revival: ~
  inner_tradition + altonian_theocracy: ~
  threadwork + einhir_revival: ~
  threadwork + altonian_theocracy: ~
  einhir_revival + altonian_theocracy: ~

# ⚠ THE ONE PAIR THAT IS YOUR OWN WORKED EXAMPLE: solmund_orthodoxy + threadwork. You said
#   'devoutly Solmund but also believes in Threadwork and therefore experiences religious
#   confliction' — so that pair is `true` unless you now say otherwise. Every other cell is open.


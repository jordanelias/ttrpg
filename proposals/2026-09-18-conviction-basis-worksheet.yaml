# ============================================================================
# 4. THE BEARING BASIS — Jordan's 12 concepts, 2026-09-18
# ============================================================================
# "pragmatism, flexibility, rigidity, fluidity, means before ends, ends justify means,
#  indirect, direct, humble, grandstanding, insecure, secure"
#
# THESE ARE BEARING, NOT VALUE-FRAMES, AND YOU SEPARATED THEM YOURSELF ALREADY:
#   adjudication_register.yaml:201 — *"these four are value-frames (what is right), the seven
#   are bearing."*
#
# ⚠ AND THERE IS A STRUCTURAL REASON IT MUST BE THE SECOND BASIS, NOT A COLUMN ON THE FIRST.
#   R7, adjudication_register.yaml:223-228: the projection is a LINEAR map from the weight
#   vector, so TWO PERSONS WITH IDENTICAL MORAL WEIGHTS ARE IDENTICAL ON EVERY MORAL AXIS,
#   NECESSARILY. A rigid man and a fluid man who hold the same principles is the whole point of
#   this list — and it is structurally IMPOSSIBLE as a moral axis and FREE as a held one.
#   The second basis is held DIRECTLY on the Person: no roster underneath, no projection
#   (adjudication_register.yaml:232-234 — *"the character IS the vector"*).
#
# MEASURED 2026-09-18, live code / both registries / .designs/systems/characters:
#   flexibility · rigidity · fluidity · humble · grandstanding · insecure · secure
#     -> 0 / 0 / 0 everywhere. Genuinely vacant; no collision to manage.
#   pragmatism -> 0 live, 0 registry, but see the collision note below.

# ⚠⚠ THE PAIRING BELOW WAS REFUTED THE SAME DAY, BY A SECOND UPLOADED DOCUMENT
# (`character-model-term-index.md`, Part 4). The original is struck and kept rather than tidied
# away, because the correction is the useful part.
#
#   ~~five bipolar HELD AXES: rigidity<->flexibility · means-before-ends<->ends-justify-means ·
#     indirect<->direct · humble<->grandstanding · insecure<->secure, plus pragmatism and
#     fluidity unpaired~~
#
# WHY IT WAS WRONG. It read all twelve as axes of one basis. They are not the same KIND of thing:
# the document sorts every term into FIELD (stored) / READOUT (computed, never stored) /
# STRUCTURE (a property of how fields relate) / DISPOSED, and most of the twelve are not fields.
# A readout stored as a field throws away what generated it.
#
# THE RESOLUTION, and it COLLAPSES the basis rather than growing it — five of your twelve are ONE
# FIELD read from different angles:
#
#   rigidity            = HIGH bend_price
#   flexibility         = LOW  bend_price
#   means before ends   = bend_price = INFINITY -- a GATE (the option is not scored at all)
#   ends justify means  = a READOUT over the bend_price VECTOR, weighted by tag frequency
#   pragmatism          = low bend_price + stable goal weights + derived warrant
#
# ⚠ SO `means before ends` AND `ends justify means` ARE NOT TWO POLES OF ONE AXIS. One is a gate
#   on the field; the other is a summary of the whole vector. My pairing made a readout into a pole.
# ⚠ AND `pragmatism` IS NOT A DUPLICATE OF `instrumental`/`Utility` after all — that collision
#   claim is WITHDRAWN. It is a bend_price reading. The document adds the sharp part: the
#   parameters are IDENTICAL to "unprincipled", and which word an observer uses depends on whether
#   they share the ends. Nothing in the character distinguishes them.
#
# THREE ARE READOUTS -- computed after the fact, never stored:
#   humble / grandstanding  = the integrity delta read the other way; it IS `social_weight` made
#                             visible. (Agrees with synthesis.md:112's `regard` inverted.)
#   insecure / secure       = distance between CLAIMED and PERCEIVED identity tags.
#                             ⚠ THAT IS `standing_of` (decision/options.py:443-464) ALREADY --
#                             gap(told_by claims about p, p's own firsthand claims about p).
#                             The document found the concept; the tree already computes it.
#   ends justify means      = above.
#
# TWO SPLIT INTO SEPARATE FIELDS RATHER THAN PAIRING:
#   direct / indirect  = TWO fields, not one axis: SPEECH CONVENTION (a culture prior) and
#                        `means_directness` (force to the source, or displaced onto a proxy).
#                        "The polite killer and the blunt schemer are both real." With
#                        `initiation_threshold` and `proportionality` this is the 2x2 plus a
#                        magnitude -- passive-aggressive is a CELL, assertive is low-threshold +
#                        direct + proportionate.
#
# ONE IS GENUINELY NEW AND ANSWERS THE QUESTION THIS FILE ASKED:
#   fluidity = `drift_rate` -- the rate at which OPERATIVE weights themselves migrate -- and the
#              document states flatly it is NOT the opposite of rigidity. Rigidity is what you will
#              not pay; drift is whether what you hold moves at all. So they are independent, and
#              this file's "far end of one axis, or its own axis?" is answered: ITS OWN FIELD.
#
# MEASURED 2026-09-18 -- every new name is vacant, live code / references / .designs / proposals:
#   bend_price 0/0/0/0 · drift_rate 0/0/0/0 · concern_curve 0/0/0/0 · social_weight 0/0/0/0 ·
#   suppression_residue 0/0/0/0. The `warrant` and `purity` hits elsewhere are ordinary English,
#   not terms. No collision to manage on any of them.

bearing_fields:
  # Confirm, reject, or re-cut. These are the document's, not yours, and nothing is ratified.
  - name: bend_price
    holds: "per character x conviction, in cost units -- the cost at which the conviction yields"
    absorbs: [rigidity, flexibility, "means before ends", "ends justify means", pragmatism]
    keep: ~
    note: >-
      INFINITY means a GATE and finite means a WEIGHT, and that difference is load-bearing in this
      engine: a gate removes the option from the candidate set, a weight scores it at a price.
      ⚠ The document recommends ONE GLOBAL VALUE FIRST, per-conviction later (its cut, item 3).

  - name: drift_rate
    holds: "rate at which operative weights migrate"
    absorbs: [fluidity, progressive, traditional]
    keep: ~
    note: "independent of bend_price, not its opposite"

  - name: means_directness
    holds: "force to the source, or displaced onto a proxy"
    absorbs: [indirect, direct]
    keep: ~
    note: "pairs with initiation_threshold as a 2x2; add proportionality and `assertive` appears"

  - name: social_weight
    holds: "how much the predicted reading of an act enters the score"
    absorbs: [humble, grandstanding]
    keep: ~
    note: >-
      ⚠⚠ ~~THE INTEGRITY READOUT COMES FREE with it (score twice, once with the social term
      zeroed).~~ WITHDRAWN 2026-09-18 -- the formula it came from is CIRCULAR, and its own author
      retracted it (`character-model-adjudication.md` D1). `U(act) - U(act | social zeroed, COST
      zeroed)` is algebraically `social_weight x social_term`, so it recovers a parameter you set
      and measures nothing about the character.
      THE CORRECTED FORM ZEROES THE SOCIAL TERM AND **KEEPS THE COST**: `integrity = U(act) -
      U(act | social_term = 0)`. That answers a real question -- would he still do it unwitnessed,
      AT THIS PRICE -- and its answer depends on `bend_price` against the cost, which no single
      parameter yields.
      ⚠ AND IT STILL HAS NO ARM ON THIS TREE: the social term is measurably ZERO (0 stance rows),
      so every live decision already IS the social-term-zeroed arm. The corrected formula is
      buildable only once something writes a social term.

bearing_readouts: ~   # computed, never stored: integrity · grandstanding/humility ·
                      # insecurity/security · hypocrisy · adaptability · denial
bearing_held_as: ~    # confirm: values DIRECTLY on the Person, no roster, no projection (R7's escape)
bearing_scale: ~      # e.g. '[-1,+1]' per field, or '0-5' like Truth's, or something else


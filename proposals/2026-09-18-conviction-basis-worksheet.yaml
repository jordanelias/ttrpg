#  (d) ITS DIAGNOSIS OF THE LIVE MATRIX IS CORRECT AND REPRODUCES. It cites "an effective rank of
#      1.87" for v30. MEASURED on rosters.yaml's own cells: participation ratio on the CORRELATION

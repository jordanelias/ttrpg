#
# STATUS: WORKSHEET. Not a proposal, not canon, ratifies nothing. It exists so the CELLS are
# in front of you instead of statistics about them. Type values here; they get written to the
# OWNERS below and this file is then deleted. It holds no fact of its own (CLAUDE.md §0.05 cl.3).
#
# OWNERS the values land at:
#   affiliations + incompatibility -> references/descriptor_registry.yaml (roster) + engine/season/rosters.yaml (table)
#   moral basis axes + rows        -> references/descriptor_registry.yaml (conviction_roster, axis_roster)
#   the 13xN projection            -> engine/season/rosters.yaml tables.conviction_projection
#   the verb x axis alignment      -> engine/season/rosters.yaml tables.alignment
#
# RULINGS THIS SERVES (2026-09-18, in session, NOT YET RECORDED IN THE TREE):
#   R1  `conviction` is reserved for RELIGIOUS AFFILIATION AND INTENSITY. A vector over
#       affiliations; confliction DERIVED from an incompatibility relation, never stored. (= STR-6)
#   R2  `Truth` IS NOW `Conviction`. ED-IN-0075's 0-5 pole (Solmund-orthodoxy <-> Thread-truth,
#       CURRENT.md:31, ruled 'DISTINCT and unchanged') is ABSORBED. Its two poles stop being ends
#       of one axis and become two affiliations a person can hold at full intensity at once —
#       which is the case a pole scalar structurally could not express.
#   R3  The cells are yours.


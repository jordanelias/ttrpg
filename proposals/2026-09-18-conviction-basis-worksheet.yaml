# 5. ⚠⚠ A THIRD AXIS SET ARRIVED, AND IT IS THE ONE THING HERE ONLY YOU CAN SETTLE
# ============================================================================
# `character-model-term-index.md` Part 5 declares the roster as 13 convictions x THREE axes:
#
#     warrant  (-3 given      ... +3 derived)
#     facing   (-3 downward   ... +3 upward)
#     purity   ( 0 violation costs ... 3 violation defiles)

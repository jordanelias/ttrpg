# INTENSITY — what a person's per-affiliation number means. Truth was 0-5 with players seeing
# qualitative bands only (ED-IN-0075). A vector can keep that or not; your call.
intensity:
  scale: ~                 # e.g. '0-5' (Truth's, inherited) or '[0,1]' or '0-3'
  player_sees: ~           # 'bands' (Truth's ruling) or 'number'
  bands: ~                 # if bands: name them, lowest first

# INCOMPATIBILITY — the relation confliction is DERIVED from. Fill the half-matrix.
# true  = holding BOTH at high intensity puts the person in religious confliction
# false = compatible; a person may hold both without strain
incompatible:
  solmund_orthodoxy + inner_tradition: ~
  solmund_orthodoxy + threadwork: ~
  solmund_orthodoxy + einhir_revival: ~
  solmund_orthodoxy + altonian_theocracy: ~
  inner_tradition + threadwork: ~
  inner_tradition + einhir_revival: ~
  inner_tradition + altonian_theocracy: ~
  threadwork + einhir_revival: ~
  threadwork + altonian_theocracy: ~
  einhir_revival + altonian_theocracy: ~

# ⚠ THE ONE PAIR THAT IS YOUR OWN WORKED EXAMPLE: solmund_orthodoxy + threadwork. You said
#   'devoutly Solmund but also believes in Threadwork and therefore experiences religious

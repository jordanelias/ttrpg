#      `harness/conviction_spread` prints as 1.85. SAME FINDING, two normalizations -- not a
#      disagreement, and worth knowing so 1.87 and 1.85 are not read as two numbers.
#      Its stated reason for three axes rather than four is that merging `update_rule` into
#      `warrant` "repeats the error that gave v30 an effective rank of 1.87".

third_axis_set_verdict: ~   # 'take warrant/facing/purity' | 'keep memory/substantive/equity/selfish'
                            # | 'neither, and here is the set'

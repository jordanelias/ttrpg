<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1500" width="980" height="1500" font-family="Georgia, 'Times New Roman', serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4036"/></marker></defs>
<rect width="980" height="1500" fill="#fffdf8"/>
<text x="490.0" y="1488" text-anchor="middle" font-size="12" fill="#6b6256">How a proceeding may work · reference model built from Jordan's rulings R-5 to R-41 (proposals/2026-10-29-parliament-and-debate) · not yet code</text>
<rect x="290" y="20" width="400" height="66" rx="10" fill="#e9f0e4" stroke="#3b5a2e" stroke-width="1.6"/>
<text x="490.0" y="44" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">1  A reason to convene</text>
<text x="490.0" y="66" text-anchor="middle" font-size="13" fill="#1d1a16">a charge, a petition, a vacant seat, an offer, a dispute</text>
<line x1="490" y1="86" x2="490" y2="112" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="290" y="112" width="400" height="74" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="490.0" y="136" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">2  Frame the matter</text>
<text x="490.0" y="158" text-anchor="middle" font-size="13" fill="#1d1a16">it goes on the docket; its mood is HOLDS (a past fact)</text>
<text x="490.0" y="176" text-anchor="middle" font-size="13" fill="#1d1a16">or OUGHT (a future act)</text>
<line x1="490" y1="186" x2="490" y2="201" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<polygon points="490,201.0 850.0,276 490,351.0 130.0,276" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="490" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#14283a">3  Whose authority?</text>
<text x="490" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#14283a">between the parties  |  the polity (crown)  |  the church</text>
<text x="490" y="280" text-anchor="middle" font-size="13" font-weight="400" fill="#14283a">the bench = holders of offices of that authority</text>
<text x="490" y="298" text-anchor="middle" font-size="13" font-weight="400" fill="#14283a">its weight scales with local legitimacy or piety</text>
<text x="490" y="316" text-anchor="middle" font-size="13" font-weight="400" fill="#14283a">the crown may modulate the church</text>
<line x1="490" y1="351" x2="490" y2="372" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="240" y="372" width="500" height="86" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="490.0" y="396" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">4  The venue row sets what is allowed</text>
<text x="490.0" y="418" text-anchor="middle" font-size="13" fill="#1d1a16">who may speak (floor) · in what order · which proofs may be offered</text>
<text x="490.0" y="436" text-anchor="middle" font-size="13" fill="#1d1a16">who may act for whom · which acts are open · where an appeal may go</text>
<line x1="490" y1="458" x2="490" y2="470" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="190" y="470" width="600" height="200" rx="10" fill="#fbf7ee" stroke="#4a4036" stroke-width="1.6"/>
<text x="490.0" y="494" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">5  Acts, one at a time (the loop)</text>
<text x="490" y="516" text-anchor="middle" font-size="13" fill="#1d1a16">An attendee takes one permitted act: speak, tell, argue, offer proof, question, concede, commit.</text>
<rect x="215" y="530" width="250" height="120" rx="10" fill="#e9f0e4" stroke="#3b5a2e" stroke-width="1.6"/>
<text x="340.0" y="554" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">Pool (what they bring)</text>
<text x="340.0" y="576" text-anchor="middle" font-size="13" fill="#1d1a16">capability (attribute, charisma,</text>
<text x="340.0" y="594" text-anchor="middle" font-size="13" fill="#1d1a16">title, office, faction) + argument</text>
<text x="340.0" y="612" text-anchor="middle" font-size="13" fill="#1d1a16">+ evidence + leverage + standing</text>
<text x="340.0" y="630" text-anchor="middle" font-size="13" fill="#1d1a16">normally 5D or more</text>
<rect x="515" y="530" width="250" height="120" rx="10" fill="#f3e6e1" stroke="#7a3b2a" stroke-width="1.6"/>
<text x="640.0" y="554" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">Obstacle (what stands against)</text>
<text x="640.0" y="576" text-anchor="middle" font-size="13" fill="#1d1a16">opponent&#x27;s score ÷ 2 + the room&#x27;s</text>
<text x="640.0" y="594" text-anchor="middle" font-size="13" fill="#1d1a16">reception + proofs held against</text>
<text x="640.0" y="612" text-anchor="middle" font-size="13" fill="#1d1a16">+ office weight, up to a ceiling</text>
<text x="640.0" y="630" text-anchor="middle" font-size="13" fill="#1d1a16">above the default</text>
<text x="490" y="595" text-anchor="middle" font-size="22" fill="#4a4036">vs</text>
<line x1="490" y1="670" x2="490" y2="704" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<polygon points="490,709.0 770.0,764 490,819.0 210.0,764" fill="#fbf0d9" stroke="#8a6a1c" stroke-width="1.6"/>
<text x="490" y="750" text-anchor="middle" font-size="13" font-weight="700" fill="#14283a">6  One draw, four bands</text>
<text x="490" y="768" text-anchor="middle" font-size="13" font-weight="400" fill="#14283a">Overwhelming  |  Success  |  Partial  |  Failure</text>
<text x="490" y="786" text-anchor="middle" font-size="13" font-weight="400" fill="#14283a">Partial: the matter stays and the docket grows</text>
<path d="M 770 764 L 900 764 L 900 570 L 792 570" fill="none" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="822" y="752" font-size="12" fill="#4a4036" font-style="italic">more acts?</text>
<text x="905" y="660" font-size="12" fill="#4a4036" font-style="italic" transform="rotate(90 905,660)">until the bench is ready, nobody acts, or the term runs out</text>
<line x1="490" y1="819" x2="490" y2="856" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="498" y="842" font-size="12" fill="#4a4036" font-style="italic">the bench is ready</text>
<polygon points="490,870.0 840.0,930 490,990.0 140.0,930" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="490" y="916" text-anchor="middle" font-size="13" font-weight="700" fill="#14283a">7  Who decides?</text>
<text x="490" y="934" text-anchor="middle" font-size="13" font-weight="400" fill="#14283a">nobody but the target  |  the parties agree or reach impasse</text>
<text x="490" y="952" text-anchor="middle" font-size="13" font-weight="400" fill="#14283a">a bench rules (determine)  |  a count of commits against a threshold</text>
<line x1="490" y1="990" x2="490" y2="1024" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="290" y="1024" width="400" height="86" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="490.0" y="1048" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">8  Dispose</text>
<text x="490.0" y="1070" text-anchor="middle" font-size="13" fill="#1d1a16">oblige · detain · ban · a Record · a licence for the</text>
<text x="490.0" y="1088" text-anchor="middle" font-size="13" fill="#1d1a16">owner&#x27;s act · a seat conferred or revoked</text>
<line x1="490" y1="1110" x2="490" y2="1144" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="240" y="1144" width="500" height="86" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="490.0" y="1168" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">9  Record and reach</text>
<text x="490.0" y="1190" text-anchor="middle" font-size="13" fill="#1d1a16">witnessed as claims; each person learns at the speed of news</text>
<text x="490.0" y="1208" text-anchor="middle" font-size="13" fill="#1d1a16">who learns the ruling is set by the row; opinions drift; a reaction must exist</text>
<line x1="490" y1="1230" x2="490" y2="1264" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<polygon points="490,1270.0 750.0,1330 490,1390.0 230.0,1330" fill="#fbf0d9" stroke="#8a6a1c" stroke-width="1.6"/>
<text x="490" y="1316" text-anchor="middle" font-size="13" font-weight="700" fill="#14283a">10  The outcome rides</text>
<text x="490" y="1334" text-anchor="middle" font-size="13" font-weight="400" fill="#14283a">no immediate retry before the same bench</text>
<text x="490" y="1352" text-anchor="middle" font-size="13" font-weight="400" fill="#14283a">a party may appeal to ANOTHER authority</text>
<path d="M 230 1330 L 90 1330 L 90 1380" fill="none" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="1380" width="300" height="70" rx="10" fill="#e9f0e4" stroke="#3b5a2e" stroke-width="1.6"/>
<text x="170.0" y="1404" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">A new proceeding</text>
<text x="170.0" y="1426" text-anchor="middle" font-size="13" fill="#1d1a16">petition to the other authority</text>
<text x="170.0" y="1444" text-anchor="middle" font-size="13" fill="#1d1a16">(church to crown, lower to higher)</text>
<path d="M 750 1330 L 890 1330 L 890 1380" fill="none" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="670" y="1380" width="290" height="70" rx="10" fill="#f3e6e1" stroke="#7a3b2a" stroke-width="1.6"/>
<text x="815.0" y="1404" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">Compliance or defiance</text>
<text x="815.0" y="1426" text-anchor="middle" font-size="13" fill="#1d1a16">enforcement, evasion, a reaction</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1450" width="1180" height="1450" font-family="Georgia, 'Times New Roman', serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4036"/></marker></defs><rect width="1180" height="1450" fill="#fffdf8"/><text x="590.0" y="1438" text-anchor="middle" font-size="12" fill="#6b6256">Proposal 2, staged proceeding: the stages are row data; each stage is closed by one act (one draw, one choice or one count); Partial is a detour.</text><text x="590.0" y="34" text-anchor="middle" font-size="20" fill="#4a4036" >A proceeding is its row&#x27;s stage list, run on the case file</text>
<rect x="40" y="64" width="450" height="104" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="265.0" y="88" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">Convene, then open the case</text>
<text x="265.0" y="110" text-anchor="middle" font-size="13" fill="#1d1a16">a denunciation, a petition, a motion, an offer</text>
<text x="265.0" y="128" text-anchor="middle" font-size="13" fill="#1d1a16">open_case draws up the case file and winds the</text>
<text x="265.0" y="146" text-anchor="middle" font-size="13" fill="#1d1a16">row&#x27;s stages onto Record.stages: the agenda</text>
<rect x="650" y="56" width="490" height="180" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="895.0" y="80" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">Inside every stage</text>
<text x="895.0" y="102" text-anchor="middle" font-size="13" fill="#1d1a16">admitted acts = the row&#x27;s acts AND the stage&#x27;s acts</text>
<text x="895.0" y="120" text-anchor="middle" font-size="13" fill="#1d1a16">speech kinds priced by stage: wrong kind, higher Ob</text>
<text x="895.0" y="138" text-anchor="middle" font-size="13" fill="#1d1a16">every act is one draw: dice, Ob, sigma (armature D)</text>
<text x="895.0" y="156" text-anchor="middle" font-size="13" fill="#1d1a16">closed by ONE act of the stage&#x27;s own decider: a bench</text>
<text x="895.0" y="174" text-anchor="middle" font-size="13" fill="#1d1a16">of that stage&#x27;s authority, a count, the parties</text>
<text x="895.0" y="192" text-anchor="middle" font-size="13" fill="#1d1a16">the band moves the agenda by the stage kind&#x27;s table</text>
<text x="895.0" y="210" text-anchor="middle" font-size="13" fill="#1d1a16">a row lists only the stages it uses (K1: one stage)</text>
<line x1="265.0" y1="168" x2="265.0" y2="262" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="262" width="450" height="104" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="265.0" y="286" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">1  ADMIT</text>
<text x="265.0" y="308" text-anchor="middle" font-size="13" fill="#1d1a16">Is there a case to answer before this authority?</text>
<text x="265.0" y="326" text-anchor="middle" font-size="13" fill="#1d1a16">closed by the screening seat&#x27;s determine (a draw)</text>
<text x="265.0" y="344" text-anchor="middle" font-size="13" fill="#1d1a16">Failure: dismissed, and the file closes</text>
<rect x="650" y="262" width="490" height="104" rx="10" fill="#fbf0d9" stroke="#8a6a1c" stroke-width="1.6"/>
<text x="895.0" y="286" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">Partial: held over or referred</text>
<text x="895.0" y="308" text-anchor="middle" font-size="13" fill="#1d1a16">re-staged at a later sitting, or sent to a lower</text>
<text x="895.0" y="326" text-anchor="middle" font-size="13" fill="#1d1a16">authority&#x27;s row as a new docket item</text>
<line x1="490" y1="296" x2="650" y2="296" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="540" y="289" font-size="12" fill="#4a4036" font-style="italic">Partial</text>
<line x1="265.0" y1="366" x2="265.0" y2="396" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="273.0" y="386" font-size="12" fill="#4a4036" font-style="italic">Success</text>
<rect x="40" y="396" width="450" height="104" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="265.0" y="420" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">2  FORUM</text>
<text x="265.0" y="442" text-anchor="middle" font-size="13" fill="#1d1a16">Is this the right authority? (exceptio, translatio)</text>
<text x="265.0" y="460" text-anchor="middle" font-size="13" fill="#1d1a16">closed by the bench&#x27;s determine on the plea</text>
<text x="265.0" y="478" text-anchor="middle" font-size="13" fill="#1d1a16">Failure: the case proceeds here</text>
<rect x="650" y="396" width="490" height="104" rx="10" fill="#fbf0d9" stroke="#8a6a1c" stroke-width="1.6"/>
<text x="895.0" y="420" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">Success for the challenger: translatio</text>
<text x="895.0" y="442" text-anchor="middle" font-size="13" fill="#1d1a16">the matter moves to the other row&#x27;s docket</text>
<text x="895.0" y="460" text-anchor="middle" font-size="13" fill="#1d1a16">Partial: the forum question is docketed before</text>
<text x="895.0" y="478" text-anchor="middle" font-size="13" fill="#1d1a16">the authority appeal_basis names; this case waits</text>
<line x1="490" y1="430" x2="650" y2="430" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="540" y="423" font-size="12" fill="#4a4036" font-style="italic">plea</text>
<line x1="265.0" y1="500" x2="265.0" y2="530" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="273.0" y="520" font-size="12" fill="#4a4036" font-style="italic">Success</text>
<rect x="40" y="530" width="450" height="104" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="265.0" y="554" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">3  PLEA</text>
<text x="265.0" y="576" text-anchor="middle" font-size="13" fill="#1d1a16">What is contested? (litis contestatio, stasis)</text>
<text x="265.0" y="594" text-anchor="middle" font-size="13" fill="#1d1a16">closed by the respondent&#x27;s own choice: no draw</text>
<text x="265.0" y="612" text-anchor="middle" font-size="13" fill="#1d1a16">the choice rewrites the agenda (right)</text>
<rect x="650" y="530" width="490" height="104" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="895.0" y="554" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">The stasis ladder as an agenda edit</text>
<text x="895.0" y="576" text-anchor="middle" font-size="13" fill="#1d1a16">concede the fact: PROOF leaves the agenda</text>
<text x="895.0" y="594" text-anchor="middle" font-size="13" fill="#1d1a16">plead justification: QUALITY is added</text>
<text x="895.0" y="612" text-anchor="middle" font-size="13" fill="#1d1a16">deny: PROOF, then judgment; the order is data</text>
<line x1="490" y1="564" x2="650" y2="564" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="540" y="557" font-size="12" fill="#4a4036" font-style="italic">choice</text>
<line x1="265.0" y1="634" x2="265.0" y2="664" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="273.0" y="654" font-size="12" fill="#4a4036" font-style="italic">plea entered</text>
<rect x="40" y="664" width="450" height="104" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="265.0" y="688" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">4  PROOF</text>
<text x="265.0" y="710" text-anchor="middle" font-size="13" fill="#1d1a16">Is the fact proved, and to what grade?</text>
<text x="265.0" y="728" text-anchor="middle" font-size="13" fill="#1d1a16">acts: proofs, testimony, a graded inquiry</text>
<text x="265.0" y="746" text-anchor="middle" font-size="13" fill="#1d1a16">Failure: not proved; the burden&#x27;s default</text>
<rect x="650" y="664" width="490" height="104" rx="10" fill="#fbf0d9" stroke="#8a6a1c" stroke-width="1.6"/>
<text x="895.0" y="688" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">Partial: half proof, a detour</text>
<text x="895.0" y="710" text-anchor="middle" font-size="13" fill="#1d1a16">a further-proof stage is pushed to a later sitting</text>
<text x="895.0" y="728" text-anchor="middle" font-size="13" fill="#1d1a16">names given in interrogation: new docket items</text>
<text x="895.0" y="746" text-anchor="middle" font-size="13" fill="#1d1a16">(the cluster: one trial seeds many)</text>
<line x1="490" y1="698" x2="650" y2="698" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="540" y="691" font-size="12" fill="#4a4036" font-style="italic">Partial</text>
<line x1="265.0" y1="768" x2="265.0" y2="798" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="273.0" y="788" font-size="12" fill="#4a4036" font-style="italic">Success</text>
<rect x="40" y="798" width="450" height="104" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="265.0" y="822" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">5  QUALITY</text>
<text x="265.0" y="844" text-anchor="middle" font-size="13" fill="#1d1a16">Was it justified or excusable?</text>
<text x="265.0" y="862" text-anchor="middle" font-size="13" fill="#1d1a16">apt: concede_fact, concede_harm, hand_error_back</text>
<text x="265.0" y="880" text-anchor="middle" font-size="13" fill="#1d1a16">Failure: no excuse holds</text>
<rect x="650" y="798" width="490" height="104" rx="10" fill="#fbf0d9" stroke="#8a6a1c" stroke-width="1.6"/>
<text x="895.0" y="822" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">Partial: mitigated</text>
<text x="895.0" y="844" text-anchor="middle" font-size="13" fill="#1d1a16">the finding is a claim the judges hold in their</text>
<text x="895.0" y="862" text-anchor="middle" font-size="13" fill="#1d1a16">own ledgers; the judgment&#x27;s choice reads it</text>
<text x="895.0" y="880" text-anchor="middle" font-size="13" fill="#1d1a16">(the speech-to-judgment link: not small)</text>
<line x1="490" y1="832" x2="650" y2="832" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="540" y="825" font-size="12" fill="#4a4036" font-style="italic">Partial</text>
<line x1="265.0" y1="902" x2="265.0" y2="932" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="273.0" y="922" font-size="12" fill="#4a4036" font-style="italic">Success</text>
<rect x="40" y="932" width="450" height="104" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="265.0" y="956" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">6  JUDGMENT</text>
<text x="265.0" y="978" text-anchor="middle" font-size="13" fill="#1d1a16">What follows? choice picks, determine grades it</text>
<text x="265.0" y="996" text-anchor="middle" font-size="13" fill="#1d1a16">or members&#x27; commits counted (licence, R-29)</text>
<text x="265.0" y="1014" text-anchor="middle" font-size="13" fill="#1d1a16">Failure: undetermined, which is legitimate (R-1)</text>
<rect x="650" y="932" width="490" height="104" rx="10" fill="#fbf0d9" stroke="#8a6a1c" stroke-width="1.6"/>
<text x="895.0" y="956" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">Partial: doubtful, adjourned</text>
<text x="895.0" y="978" text-anchor="middle" font-size="13" fill="#1d1a16">the red ball: back to PROOF at a later sitting</text>
<text x="895.0" y="996" text-anchor="middle" font-size="13" fill="#1d1a16">(Venice, the Forty: Contarini p.90-91)</text>
<text x="895.0" y="1014" text-anchor="middle" font-size="13" fill="#1d1a16">a body short of its threshold re-ballots later</text>
<line x1="490" y1="966" x2="650" y2="966" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="540" y="959" font-size="12" fill="#4a4036" font-style="italic">Partial</text>
<line x1="265.0" y1="1036" x2="265.0" y2="1066" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="273.0" y="1056" font-size="12" fill="#4a4036" font-style="italic">Success</text>
<rect x="40" y="1066" width="450" height="104" rx="10" fill="#e9f0e4" stroke="#3b5a2e" stroke-width="1.6"/>
<text x="265.0" y="1090" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">7  DISPOSAL</text>
<text x="265.0" y="1112" text-anchor="middle" font-size="13" fill="#1d1a16">a Tenure, a Record or a licence; reach by the row</text>
<text x="265.0" y="1130" text-anchor="middle" font-size="13" fill="#1d1a16">a warrant goes to the officer who must act;</text>
<text x="265.0" y="1148" text-anchor="middle" font-size="13" fill="#1d1a16">his arrest is his own choice and his own draw</text>
<rect x="650" y="1066" width="490" height="104" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="895.0" y="1090" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">Appeal is a route, not a retry (R-35)</text>
<text x="895.0" y="1112" text-anchor="middle" font-size="13" fill="#1d1a16">a petition carried to appeal_basis enters that</text>
<text x="895.0" y="1130" text-anchor="middle" font-size="13" fill="#1d1a16">row&#x27;s REVIEW stage; a closed judgment is never</text>
<text x="895.0" y="1148" text-anchor="middle" font-size="13" fill="#1d1a16">re-entered before the same bench</text>
<line x1="490" y1="1100" x2="650" y2="1100" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="540" y="1093" font-size="12" fill="#4a4036" font-style="italic">after</text>
<line x1="650" y1="744" x2="490" y2="744" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="528" y="760" font-size="12" fill="#4a4036" font-style="italic">next sitting</text>
<path d="M 1140 984 L 1162 984 L 1162 716 L 1140 716" fill="none" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1070" y="918" font-size="12" fill="#4a4036" font-style="italic">back to PROOF</text>
<rect x="40" y="1206" width="1100" height="150" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="590.0" y="1230" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">What is stored, and where</text>
<text x="590.0" y="1252" text-anchor="middle" font-size="13" fill="#1d1a16">the row (arrangements.yaml): its stages list; the stage kinds are one closed roster in the same file</text>
<text x="590.0" y="1270" text-anchor="middle" font-size="13" fill="#1d1a16">the case file (Record.stages): the remaining agenda; its head is the current stage; closing acts rewrite it</text>
<text x="590.0" y="1288" text-anchor="middle" font-size="13" fill="#1d1a16">the docket item: one new key, case, naming the file; nothing else is added to World</text>
<text x="590.0" y="1306" text-anchor="middle" font-size="13" fill="#1d1a16">every transition is an Event, witnessed: persons know the stage only as claims they hold (AX-2, S-7)</text>
<text x="590.0" y="1324" text-anchor="middle" font-size="13" fill="#1d1a16">the file can be seized, forged or destroyed, and it stops when its holder is gone (matter.py:330-346)</text>
<text x="590.0" y="1342" text-anchor="middle" font-size="13" fill="#1d1a16">the module (modules/social_contest/roll.py) never sees a stage: it rolls one record, as it does today</text></svg>
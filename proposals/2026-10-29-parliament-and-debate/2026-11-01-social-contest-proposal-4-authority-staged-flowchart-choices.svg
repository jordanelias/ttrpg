<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1520" width="1240" height="1520" font-family="Georgia, 'Times New Roman', serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4036"/></marker></defs><rect width="1240" height="1520" fill="#fffdf8"/><text x="620.0" y="1508" text-anchor="middle" font-size="12" fill="#6b6256">Proposal 4: the player&#x27;s decisions in a hearing, what each option leads to, and which character it favours. Computed in stress_p4_choices.py; PROPOSED, reference only.</text><text x="620.0" y="34" text-anchor="middle" font-size="18" fill="#4a4036" >The decisions a hearing presents, in order; each survives at 2D, 5D and 12D under R-37&#x27;s ceiling of 3</text>
<rect x="14" y="116" width="124" height="78" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="76.0" y="140" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">BEFORE</text>
<text x="76.0" y="162" text-anchor="middle" font-size="13" fill="#1d1a16">the citation</text>
<rect x="150" y="64" width="530" height="182" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="415.0" y="88" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">2a. The accuser: which authority&#x27;s rite</text>
<text x="415.0" y="110" text-anchor="middle" font-size="13" fill="#1d1a16">polity (accusatorial): his own dice prove; the arm reaches;</text>
<text x="415.0" y="128" text-anchor="middle" font-size="13" fill="#1d1a16">  he is named and liable if the proof fails</text>
<text x="415.0" y="146" text-anchor="middle" font-size="13" fill="#1d1a16">church (inquisitorial): the bench proves; he is secret,</text>
<text x="415.0" y="164" text-anchor="middle" font-size="13" fill="#1d1a16">  not liable; a ban bites only as far as L</text>
<text x="415.0" y="182" text-anchor="middle" font-size="13" fill="#1d1a16">favours: church for the weak or exposed accuser;</text>
<text x="415.0" y="200" text-anchor="middle" font-size="13" fill="#1d1a16">  polity for a strong one with nothing to hide</text>
<rect x="690" y="64" width="530" height="182" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="955.0" y="88" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">3b. The term of grace: come forward or wait</text>
<text x="955.0" y="110" text-anchor="middle" font-size="13" fill="#1d1a16">come forward: light penance, a public penance, and</text>
<text x="955.0" y="128" text-anchor="middle" font-size="13" fill="#1d1a16">  the cluster named (his friends become matters)</text>
<text x="955.0" y="146" text-anchor="middle" font-size="13" fill="#1d1a16">wait: maybe never denounced (hidden), or cited later</text>
<text x="955.0" y="164" text-anchor="middle" font-size="13" fill="#1d1a16">  with his best plea and no grace</text>
<text x="955.0" y="182" text-anchor="middle" font-size="13" fill="#1d1a16">favours: the weak who expect denunciation and do not</text>
<text x="955.0" y="200" text-anchor="middle" font-size="13" fill="#1d1a16">  value those they would name</text>
<line x1="415.0" y1="246" x2="415.0" y2="276" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="955.0" y1="246" x2="955.0" y2="276" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="14" y="328" width="124" height="78" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="76.0" y="352" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">CITATION</text>
<text x="76.0" y="374" text-anchor="middle" font-size="13" fill="#1d1a16">served by give</text>
<rect x="150" y="276" width="530" height="182" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="415.0" y="300" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">1. Appear, evade or defy the writ</text>
<text x="415.0" y="322" text-anchor="middle" font-size="13" fill="#1d1a16">appear: a scene and the road; his plea and proofs count</text>
<text x="415.0" y="340" text-anchor="middle" font-size="13" fill="#1d1a16">evade: tried in absentia at Ob 2; custody only if the</text>
<text x="415.0" y="358" text-anchor="middle" font-size="13" fill="#1d1a16">  arm serves the warrant; seen when the citation matures</text>
<text x="415.0" y="376" text-anchor="middle" font-size="13" fill="#1d1a16">defy: as evade, plus a witnessed deed (standing signed</text>
<text x="415.0" y="394" text-anchor="middle" font-size="13" fill="#1d1a16">  by L), a contempt ban, and the authority&#x27;s L falls</text>
<text x="415.0" y="412" text-anchor="middle" font-size="13" fill="#1d1a16">favours: appear for strong; evade/defy where the arm is weak</text>
<rect x="690" y="276" width="530" height="182" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="955.0" y="300" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">5. Speak yourself or send an advocate</text>
<text x="955.0" y="322" text-anchor="middle" font-size="13" fill="#1d1a16">self: all three pleas, his own dice, his own standing</text>
<text x="955.0" y="340" text-anchor="middle" font-size="13" fill="#1d1a16">advocate: the advocate&#x27;s dice, presence x 0.7 latitude;</text>
<text x="955.0" y="358" text-anchor="middle" font-size="13" fill="#1d1a16">  deny only (a principal alone concedes); absorbs the</text>
<text x="955.0" y="376" text-anchor="middle" font-size="13" fill="#1d1a16">  disproved denial, not his lie; an `oblige` owed</text>
<text x="955.0" y="394" text-anchor="middle" font-size="13" fill="#1d1a16">  accusatorial rite only (the inquisitio admits none)</text>
<text x="955.0" y="412" text-anchor="middle" font-size="13" fill="#1d1a16">favours: the commoner hires; the advocate and scholar speak</text>
<line x1="415.0" y1="458" x2="415.0" y2="488" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="955.0" y1="458" x2="955.0" y2="488" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="14" y="540" width="124" height="78" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="76.0" y="564" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">ISSUE</text>
<text x="76.0" y="586" text-anchor="middle" font-size="13" fill="#1d1a16">litis contestatio</text>
<rect x="150" y="488" width="530" height="182" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="415.0" y="512" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">3. The plea, by what each concedes (Rhet. III.15)</text>
<text x="415.0" y="534" text-anchor="middle" font-size="13" fill="#1d1a16">deny: the fact is tried; the accuser or bench bears it</text>
<text x="415.0" y="552" text-anchor="middle" font-size="13" fill="#1d1a16">concede the fact: the definition is tried; cap 1</text>
<text x="415.0" y="570" text-anchor="middle" font-size="13" fill="#1d1a16">concede the definition: he argues justification; cap 2</text>
<text x="415.0" y="588" text-anchor="middle" font-size="13" fill="#1d1a16">rule of thumb: a witness, deny; a writ, concede the</text>
<text x="415.0" y="606" text-anchor="middle" font-size="13" fill="#1d1a16">  fact; neither, justify. Each concession is witnessed</text>
<text x="415.0" y="624" text-anchor="middle" font-size="13" fill="#1d1a16">favours: deny dead for the commoner, live for the others</text>
<rect x="690" y="488" width="530" height="182" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="955.0" y="512" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">2b. The forum plea (translatio)</text>
<text x="955.0" y="534" text-anchor="middle" font-size="13" fill="#1d1a16">answer here: the rite he is in</text>
<text x="955.0" y="552" text-anchor="middle" font-size="13" fill="#1d1a16">plead the forum: one sitting before the OTHER</text>
<text x="955.0" y="570" text-anchor="middle" font-size="13" fill="#1d1a16">  authority&#x27;s seat, its own choice; R-34 gives a</text>
<text x="955.0" y="588" text-anchor="middle" font-size="13" fill="#1d1a16">  royal party to the polity; refused, he looks evasive</text>
<text x="955.0" y="606" text-anchor="middle" font-size="13" fill="#1d1a16">best from a church bench, rarely from a royal one</text>
<text x="955.0" y="624" text-anchor="middle" font-size="13" fill="#1d1a16">favours: those strong where the other rite weighs</text>
<line x1="415.0" y1="670" x2="415.0" y2="700" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="955.0" y1="670" x2="955.0" y2="700" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="14" y="752" width="124" height="78" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="76.0" y="776" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">STAGES</text>
<text x="76.0" y="798" text-anchor="middle" font-size="13" fill="#1d1a16">one draw each</text>
<rect x="150" y="700" width="530" height="182" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="415.0" y="724" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">4. Proofs: offer now or hoard</text>
<text x="415.0" y="746" text-anchor="middle" font-size="13" fill="#1d1a16">offer the strong proof: + Ob on the fact; it is spent</text>
<text x="415.0" y="764" text-anchor="middle" font-size="13" fill="#1d1a16">offer both: helps a low-elaboration room, dilutes a</text>
<text x="415.0" y="782" text-anchor="middle" font-size="13" fill="#1d1a16">  high one (a weak proof drags a strong one down)</text>
<text x="415.0" y="800" text-anchor="middle" font-size="13" fill="#1d1a16">hoard: worth it when a kept proof is worth 12% to</text>
<text x="415.0" y="818" text-anchor="middle" font-size="13" fill="#1d1a16">  16% of a sentence elsewhere (leverage, a later case)</text>
<text x="415.0" y="836" text-anchor="middle" font-size="13" fill="#1d1a16">cut: the weak proof alone; holding for a later sitting</text>
<rect x="690" y="700" width="530" height="182" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="955.0" y="724" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">6. Speech kind (aptness priced, never refused)</text>
<text x="955.0" y="746" text-anchor="middle" font-size="13" fill="#1d1a16">plain argument: reasoning carries it</text>
<text x="955.0" y="764" text-anchor="middle" font-size="13" fill="#1d1a16">cite a licence: cheap if he holds a writ; implicates</text>
<text x="955.0" y="782" text-anchor="middle" font-size="13" fill="#1d1a16">  its issuer</text>
<text x="955.0" y="800" text-anchor="middle" font-size="13" fill="#1d1a16">hand the error back: eloquence; lands if the room</text>
<text x="955.0" y="818" text-anchor="middle" font-size="13" fill="#1d1a16">  regards him (hidden); turns it on the accuser</text>
<text x="955.0" y="836" text-anchor="middle" font-size="13" fill="#1d1a16">impugn motive: makes an enemy. favours: per faculty</text>
<line x1="415.0" y1="882" x2="415.0" y2="912" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="955.0" y1="882" x2="955.0" y2="912" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="14" y="964" width="124" height="78" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="76.0" y="988" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">PROCEDURE</text>
<text x="76.0" y="1010" text-anchor="middle" font-size="13" fill="#1d1a16">the file and the bench</text>
<rect x="150" y="912" width="530" height="182" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="415.0" y="936" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">7a. Challenge a judge; name mortal enemies</text>
<text x="415.0" y="958" text-anchor="middle" font-size="13" fill="#1d1a16">challenge: apt only with a witnessed grievance; won,</text>
<text x="415.0" y="976" text-anchor="middle" font-size="13" fill="#1d1a16">  a neutral judge; lost, a judge sure to be hostile</text>
<text x="415.0" y="994" text-anchor="middle" font-size="13" fill="#1d1a16">name enemies (inquisitio): if the secret accuser is</text>
<text x="415.0" y="1012" text-anchor="middle" font-size="13" fill="#1d1a16">  among them the charge fails; each named learns it</text>
<text x="415.0" y="1030" text-anchor="middle" font-size="13" fill="#1d1a16">real but narrow: best in 2 to 9 of 18 cells</text>
<text x="415.0" y="1048" text-anchor="middle" font-size="13" fill="#1d1a16">favours: the well-informed respondent</text>
<rect x="690" y="912" width="530" height="182" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="955.0" y="936" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">7b. Burn or forge the case file</text>
<text x="955.0" y="958" text-anchor="middle" font-size="13" fill="#1d1a16">burn (needs the file in hand): the agenda is lost,</text>
<text x="955.0" y="976" text-anchor="middle" font-size="13" fill="#1d1a16">  the case restarts; found out, an obstruction matter</text>
<text x="955.0" y="994" text-anchor="middle" font-size="13" fill="#1d1a16">forge: alter the agenda; the bench examines it</text>
<text x="955.0" y="1012" text-anchor="middle" font-size="13" fill="#1d1a16">  against its forgery quality; found, +1 grade</text>
<text x="955.0" y="1030" text-anchor="middle" font-size="13" fill="#1d1a16">burn is near-dominant once he holds the file: the</text>
<text x="955.0" y="1048" text-anchor="middle" font-size="13" fill="#1d1a16">  real gate is access (only the holder writes it)</text>
<line x1="415.0" y1="1094" x2="415.0" y2="1124" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="955.0" y1="1094" x2="955.0" y2="1124" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="14" y="1176" width="124" height="78" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="76.0" y="1200" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">AFTER</text>
<text x="76.0" y="1222" text-anchor="middle" font-size="13" fill="#1d1a16">judgment and the arm</text>
<rect x="150" y="1124" width="530" height="182" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="415.0" y="1148" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">8. Appeal (R-35): accept, the crown, the Holy See</text>
<text x="415.0" y="1170" text-anchor="middle" font-size="13" fill="#1d1a16">accept: the sentence rides</text>
<text x="415.0" y="1188" text-anchor="middle" font-size="13" fill="#1d1a16">the crown: nearer, readier to void; can refuse its arm</text>
<text x="415.0" y="1206" text-anchor="middle" font-size="13" fill="#1d1a16">  to church custody; cannot lift a ban&#x27;s social bite</text>
<text x="415.0" y="1224" text-anchor="middle" font-size="13" fill="#1d1a16">the Holy See: far (a season more), slower to undo its</text>
<text x="415.0" y="1242" text-anchor="middle" font-size="13" fill="#1d1a16">  own bench, but the only one that ends a ban</text>
<text x="415.0" y="1260" text-anchor="middle" font-size="13" fill="#1d1a16">favours: crown for custody; Holy See for a ban where L is high</text>
<rect x="690" y="1124" width="530" height="182" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="955.0" y="1148" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">9. The warrant-holder: serve or decline</text>
<text x="955.0" y="1170" text-anchor="middle" font-size="13" fill="#1d1a16">serve: an arrest draw and a scene; regard with the</text>
<text x="955.0" y="1188" text-anchor="middle" font-size="13" fill="#1d1a16">  issuer; the prisoner&#x27;s kin become enemies</text>
<text x="955.0" y="1206" text-anchor="middle" font-size="13" fill="#1d1a16">decline: the warrant matures unserved, a decline</text>
<text x="955.0" y="1224" text-anchor="middle" font-size="13" fill="#1d1a16">  the world sees; his seat at risk if the issuer can</text>
<text x="955.0" y="1242" text-anchor="middle" font-size="13" fill="#1d1a16">  revoke it, else only a ban</text>
<text x="955.0" y="1260" text-anchor="middle" font-size="13" fill="#1d1a16">favours: decline only for a strong server who opposes it</text>
<rect x="150" y="1340" width="1070" height="118" rx="10" fill="#e9f0e4" stroke="#3b5a2e" stroke-width="1.6"/>
<text x="685.0" y="1364" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">How many survive (section 4&#x27;s table; the headline ceiling is R-37&#x27;s 3)</text>
<text x="685.0" y="1386" text-anchor="middle" font-size="13" fill="#1d1a16">pool grid: every one of the ten survives at 2D, 5D and 12D after the fixes; cut on the way: accusatorial</text>
<text x="685.0" y="1404" text-anchor="middle" font-size="13" fill="#1d1a16">confession, grace as a plea (now 3b), offering the weak proof alone, holding a proof for a later sitting</text>
<text x="685.0" y="1422" text-anchor="middle" font-size="13" fill="#1d1a16">by character (attributes -&gt; faculties): a choice dead for one is live for another; the commoner&#x27;s deny, the</text>
<text x="685.0" y="1440" text-anchor="middle" font-size="13" fill="#1d1a16">scholar&#x27;s appeal to the room and his motive-impugning are dead; each is live for the advocate</text></svg>
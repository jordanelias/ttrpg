<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2010" width="1200" height="2010" font-family="Georgia, 'Times New Roman', serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4036"/></marker></defs><rect width="1200" height="2010" fill="#fffdf8"/><text x="600.0" y="1998" text-anchor="middle" font-size="12" fill="#6b6256">Proposal 4, authority first with the staged hearing. PROPOSED, reference only. Every contested stage is one draw of the armature&#x27;s engine; everything else is a person&#x27;s own act.</text><text x="600.0" y="34" text-anchor="middle" font-size="19" fill="#4a4036" >A proceeding under Proposal 4: authority, rite, citation, plea, stages, judgment, arm, appeal</text>
<rect x="380" y="56" width="440" height="76" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="600.0" y="80" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">A matter in the world</text>
<text x="600.0" y="102" text-anchor="middle" font-size="13" fill="#1d1a16">a deed claim, a denunciation, a petition</text>
<text x="600.0" y="120" text-anchor="middle" font-size="13" fill="#1d1a16">(a fact somebody holds, at the speed of news)</text>
<line x1="600" y1="132" x2="600" y2="162" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="270" y="162" width="660" height="94" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="600.0" y="186" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">The opener chooses the authority&#x27;s row (open_case)</text>
<text x="600.0" y="208" text-anchor="middle" font-size="13" fill="#1d1a16">case-opening reads the seat&#x27;s JUDGING reach (scope_rung); arrest,</text>
<text x="600.0" y="226" text-anchor="middle" font-size="13" fill="#1d1a16">seize and issue keep its acting reach (rung)  [repair g]</text>
<text x="600.0" y="244" text-anchor="middle" font-size="13" fill="#1d1a16">computed open_case names its row  [dead core 1]</text>
<line x1="380" y1="256" x2="170" y2="300" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="600" y1="256" x2="600" y2="300" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="820" y1="256" x2="1030" y2="300" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="300" width="330" height="150" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="185.0" y="324" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">PARTIES: arbitral / mutual rite</text>
<text x="185.0" y="346" text-anchor="middle" font-size="13" fill="#1d1a16">K1 persuasion, K2 negotiation, K7 display</text>
<text x="185.0" y="364" text-anchor="middle" font-size="13" fill="#1d1a16">decider: the target, or both commit</text>
<text x="185.0" y="382" text-anchor="middle" font-size="13" fill="#1d1a16">an arbiter both choose (the game</text>
<text x="185.0" y="400" text-anchor="middle" font-size="13" fill="#1d1a16">before the game)</text>
<text x="185.0" y="418" text-anchor="middle" font-size="13" fill="#1d1a16">no bench, no citation, no appeal</text>
<rect x="435" y="300" width="330" height="150" rx="10" fill="#e9f0e4" stroke="#3b5a2e" stroke-width="1.6"/>
<text x="600.0" y="324" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">POLITY: accusatorial rite</text>
<text x="600.0" y="346" text-anchor="middle" font-size="13" fill="#1d1a16">the accuser proves fact and definition</text>
<text x="600.0" y="364" text-anchor="middle" font-size="13" fill="#1d1a16">and is liable if he fails (Lateran IV c.8)</text>
<text x="600.0" y="382" text-anchor="middle" font-size="13" fill="#1d1a16">names disclosed; counsel admitted</text>
<text x="600.0" y="400" text-anchor="middle" font-size="13" fill="#1d1a16">open floor: a concession is witnessed</text>
<text x="600.0" y="418" text-anchor="middle" font-size="13" fill="#1d1a16">appeal_to: none (the sovereign)</text>
<rect x="850" y="300" width="330" height="150" rx="10" fill="#fbf0d9" stroke="#8a6a1c" stroke-width="1.6"/>
<text x="1015.0" y="324" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">CHURCH: inquisitorial rite</text>
<text x="1015.0" y="346" text-anchor="middle" font-size="13" fill="#1d1a16">the bench proves (the judge is the accuser)</text>
<text x="1015.0" y="364" text-anchor="middle" font-size="13" fill="#1d1a16">qualifiers rule the definition</text>
<text x="1015.0" y="382" text-anchor="middle" font-size="13" fill="#1d1a16">names secret; no counsel; cluster:</text>
<text x="1015.0" y="400" text-anchor="middle" font-size="13" fill="#1d1a16">a conceded fact yields names</text>
<text x="1015.0" y="418" text-anchor="middle" font-size="13" fill="#1d1a16">term of grace BEFORE citation</text>
<path d="M 185 450 L 185 466 L 10 466 L 10 1790 L 250 1790" fill="none" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="16" y="1812" font-size="12" fill="#4a4036" font-style="italic">parties: no stages; commit, or impasse (R-1)</text>
<line x1="600" y1="450" x2="600" y2="482" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M 1015 450 L 1015 470 L 660 470 L 660 482" fill="none" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="330" y="482" width="540" height="112" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="600.0" y="506" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">One case file, one citation, minted together</text>
<text x="600.0" y="528" text-anchor="middle" font-size="13" fill="#1d1a16">case file: kind `case`, held by the opener; only its holder writes</text>
<text x="600.0" y="546" text-anchor="middle" font-size="13" fill="#1d1a16">the agenda; determine needs it held  [repair c]</text>
<text x="600.0" y="564" text-anchor="middle" font-size="13" fill="#1d1a16">citation: a dispensation addressed to the party, served</text>
<text x="600.0" y="582" text-anchor="middle" font-size="13" fill="#1d1a16">by `give` where he is  [repair h]</text>
<line x1="600" y1="594" x2="600" y2="624" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<polygon points="600,625.0 910.0,700 600,775.0 290.0,700" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="600" y="686" text-anchor="middle" font-size="13" font-weight="700" fill="#14283a">The party holds the citation:</text>
<text x="600" y="704" text-anchor="middle" font-size="13" font-weight="400" fill="#14283a">comply, evade or defy?</text>
<text x="600" y="722" text-anchor="middle" font-size="13" font-weight="400" fill="#14283a">(his own choice, reading his own opinion of the authority)</text>
<path d="M 290 700 L 140 700 L 140 790" fill="none" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="200" y="690" font-size="12" fill="#4a4036" font-style="italic">evade</text>
<path d="M 910 700 L 1060 700 L 1060 790" fill="none" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="930" y="690" font-size="12" fill="#4a4036" font-style="italic">defy (witnessed)</text>
<rect x="20" y="790" width="270" height="130" rx="10" fill="#f3e6e1" stroke="#7a3b2a" stroke-width="1.6"/>
<text x="155.0" y="814" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">In absentia</text>
<text x="155.0" y="836" text-anchor="middle" font-size="13" fill="#1d1a16">no plea, no proofs, no speech</text>
<text x="155.0" y="854" text-anchor="middle" font-size="13" fill="#1d1a16">resists at obstacle_default 2</text>
<text x="155.0" y="872" text-anchor="middle" font-size="13" fill="#1d1a16">custody needs the arm (warrant)</text>
<text x="155.0" y="890" text-anchor="middle" font-size="13" fill="#1d1a16">the citation&#x27;s stage matures</text>
<text x="155.0" y="908" text-anchor="middle" font-size="13" fill="#1d1a16">unanswered: the bench sees it</text>
<rect x="880" y="790" width="300" height="130" rx="10" fill="#f3e6e1" stroke="#7a3b2a" stroke-width="1.6"/>
<text x="1030.0" y="814" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">Contempt</text>
<text x="1030.0" y="836" text-anchor="middle" font-size="13" fill="#1d1a16">a deed claim in every witness</text>
<text x="1030.0" y="854" text-anchor="middle" font-size="13" fill="#1d1a16">a ban, no arm needed, bites ~ L</text>
<text x="1030.0" y="872" text-anchor="middle" font-size="13" fill="#1d1a16">unpunished: the authority&#x27;s L</text>
<text x="1030.0" y="890" text-anchor="middle" font-size="13" fill="#1d1a16">falls there at the next barrier</text>
<text x="1030.0" y="908" text-anchor="middle" font-size="13" fill="#1d1a16">[repair i]</text>
<line x1="600" y1="775" x2="600" y2="810" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="610" y="797" font-size="12" fill="#4a4036" font-style="italic">comply</text>
<rect x="360" y="810" width="480" height="150" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="600.0" y="834" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">THE PLEA (the respondent&#x27;s act, no draw)</text>
<text x="600.0" y="856" text-anchor="middle" font-size="13" fill="#1d1a16">fixes which question is tried (litis contestatio)</text>
<text x="600.0" y="874" text-anchor="middle" font-size="13" fill="#1d1a16">deny: the FACT is tried</text>
<text x="600.0" y="892" text-anchor="middle" font-size="13" fill="#1d1a16">concede the fact: the DEFINITION is tried, cap 1</text>
<text x="600.0" y="910" text-anchor="middle" font-size="13" fill="#1d1a16">concede the definition: his JUSTIFICATION, cap 2</text>
<text x="600.0" y="928" text-anchor="middle" font-size="13" fill="#1d1a16">or plead the forum (translatio)  [repair j]</text>
<path d="M 840 940 L 1045 940 L 1045 980" fill="none" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="860" y="932" font-size="12" fill="#4a4036" font-style="italic">forum plea</text>
<rect x="900" y="980" width="290" height="150" rx="10" fill="#fbf0d9" stroke="#8a6a1c" stroke-width="1.6"/>
<text x="1045.0" y="1004" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">Forum stage, same case</text>
<text x="1045.0" y="1026" text-anchor="middle" font-size="13" fill="#1d1a16">decided by the OTHER authority&#x27;s</text>
<text x="1045.0" y="1044" text-anchor="middle" font-size="13" fill="#1d1a16">seat (its own choice) [repair d]</text>
<text x="1045.0" y="1062" text-anchor="middle" font-size="13" fill="#1d1a16">R-34: a royal party, the polity</text>
<text x="1045.0" y="1080" text-anchor="middle" font-size="13" fill="#1d1a16">takes it; otherwise the sitting</text>
<text x="1045.0" y="1098" text-anchor="middle" font-size="13" fill="#1d1a16">bench keeps it unless it consents</text>
<path d="M 1045 1130 L 1045 1165 L 882 1165" fill="none" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="895" y="1185" font-size="12" fill="#4a4036" font-style="italic">stays, or moves to the other rite</text>
<line x1="600" y1="960" x2="600" y2="1000" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="320" y="1000" width="560" height="200" rx="10" fill="#e9f0e4" stroke="#3b5a2e" stroke-width="1.6"/>
<text x="600.0" y="1024" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">CONTESTED STAGES (at most three per row) [repair e]</text>
<text x="600.0" y="1046" text-anchor="middle" font-size="13" fill="#1d1a16">each closed by ONE draw of whoever bears it, against the</text>
<text x="600.0" y="1064" text-anchor="middle" font-size="13" fill="#1d1a16">other side&#x27;s score / 2 (ceiling-bounded) + offered proofs + aptness</text>
<text x="600.0" y="1082" text-anchor="middle" font-size="13" fill="#1d1a16">proof: accuser (polity) or bench (church)</text>
<text x="600.0" y="1100" text-anchor="middle" font-size="13" fill="#1d1a16">definition: accuser or the bench&#x27;s qualifiers</text>
<text x="600.0" y="1118" text-anchor="middle" font-size="13" fill="#1d1a16">justification: the respondent himself</text>
<text x="600.0" y="1136" text-anchor="middle" font-size="13" fill="#1d1a16">S or O: answered, go on.  P: answered at half, cap +1,</text>
<text x="600.0" y="1154" text-anchor="middle" font-size="13" fill="#1d1a16">the judge&#x27;s own choice whether to proceed.  F: HELD to the</text>
<text x="600.0" y="1172" text-anchor="middle" font-size="13" fill="#1d1a16">next sitting; the third F closes it against the roller</text>
<path d="M 320 1100 L 200 1100 L 200 1160" fill="none" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="230" y="1092" font-size="12" fill="#4a4036" font-style="italic">3rd F</text>
<path d="M 155 920 L 155 980 L 380 980 L 380 1000" fill="none" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="162" y="972" font-size="12" fill="#4a4036" font-style="italic">tried in absentia (deny)</text>
<rect x="20" y="1160" width="270" height="92" rx="10" fill="#e9f0e4" stroke="#3b5a2e" stroke-width="1.6"/>
<text x="155.0" y="1184" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">Acquitted</text>
<text x="155.0" y="1206" text-anchor="middle" font-size="13" fill="#1d1a16">the accuser liable (accusatorial)</text>
<text x="155.0" y="1224" text-anchor="middle" font-size="13" fill="#1d1a16">a deed: &#x27;he charged and failed&#x27;</text>
<line x1="600" y1="1200" x2="600" y2="1240" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="310" y="1240" width="580" height="130" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="600.0" y="1264" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">JUDGMENT: the bench of the row&#x27;s authority</text>
<text x="600.0" y="1286" text-anchor="middle" font-size="13" fill="#1d1a16">one may_determine with the authority conjunct in the bench stem,</text>
<text x="600.0" y="1304" text-anchor="middle" font-size="13" fill="#1d1a16">read off the held case file, shared by bench and gate [repair l]</text>
<text x="600.0" y="1322" text-anchor="middle" font-size="13" fill="#1d1a16">the judge&#x27;s own regard for the party is his sigma (own ledger)</text>
<text x="600.0" y="1340" text-anchor="middle" font-size="13" fill="#1d1a16">grade = band - concession caps; 3 Failures: undetermined (R-1)</text>
<line x1="600" y1="1370" x2="600" y2="1405" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="310" y="1405" width="580" height="112" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="600.0" y="1429" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">DISPOSAL, witnessed</text>
<text x="600.0" y="1451" text-anchor="middle" font-size="13" fill="#1d1a16">ban: needs no arm; bites as far as the territory heeds it</text>
<text x="600.0" y="1469" text-anchor="middle" font-size="13" fill="#1d1a16">detain: direct if he appeared or the seat&#x27;s purview reaches him;</text>
<text x="600.0" y="1487" text-anchor="middle" font-size="13" fill="#1d1a16">otherwise a warrant to a holder of dispatch whose purview does</text>
<text x="600.0" y="1505" text-anchor="middle" font-size="13" fill="#1d1a16">office weight x L in the bench&#x27;s dice (R-36), swept small</text>
<path d="M 890 1460 L 1060 1460 L 1060 1545" fill="none" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="930" y="1450" font-size="12" fill="#4a4036" font-style="italic">warrant</text>
<rect x="900" y="1545" width="290" height="112" rx="10" fill="#fbf0d9" stroke="#8a6a1c" stroke-width="1.6"/>
<text x="1045.0" y="1569" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">The warrant-holder&#x27;s duty</text>
<text x="1045.0" y="1591" text-anchor="middle" font-size="13" fill="#1d1a16">serve: an arrest draw, a scene</text>
<text x="1045.0" y="1609" text-anchor="middle" font-size="13" fill="#1d1a16">decline: the warrant matures</text>
<text x="1045.0" y="1627" text-anchor="middle" font-size="13" fill="#1d1a16">unserved (due &lt;= tick) [repair b]:</text>
<text x="1045.0" y="1645" text-anchor="middle" font-size="13" fill="#1d1a16">a decline the world sees</text>
<line x1="600" y1="1517" x2="600" y2="1555" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="330" y="1555" width="540" height="112" rx="10" fill="#e8eef4" stroke="#2f4a63" stroke-width="1.6"/>
<text x="600.0" y="1579" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">APPEAL (R-35): petition + carry to `appeal_to`</text>
<text x="600.0" y="1601" text-anchor="middle" font-size="13" fill="#1d1a16">never the same bench; review on the record (hoarded proofs</text>
<text x="600.0" y="1619" text-anchor="middle" font-size="13" fill="#1d1a16">stay out); the appellant shows the error; the appellate seat</text>
<text x="600.0" y="1637" text-anchor="middle" font-size="13" fill="#1d1a16">voids (new closure basis), commutes one grade, or lets it ride</text>
<line x1="600" y1="1667" x2="600" y2="1705" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="250" y="1705" width="700" height="130" rx="10" fill="#f4f1ea" stroke="#4a4036" stroke-width="1.6"/>
<text x="600.0" y="1729" text-anchor="middle" font-weight="700" font-size="16" fill="#1d1a16">THE WORLD LEARNS IT (R-21, S-6, S-7)</text>
<text x="600.0" y="1751" text-anchor="middle" font-size="13" fill="#1d1a16">Tenure edges, the case file and the citation are Records others can hold, seize, burn</text>
<text x="600.0" y="1769" text-anchor="middle" font-size="13" fill="#1d1a16">deed claims spread by tell; residents&#x27; opinion_of moves; each authority&#x27;s L</text>
<text x="600.0" y="1787" text-anchor="middle" font-size="13" fill="#1d1a16">per territory is re-read at the next barrier (defined: no residents or a zero</text>
<text x="600.0" y="1805" text-anchor="middle" font-size="13" fill="#1d1a16">denominator reads 0.5)  [repair k]</text>
<path d="M 950 1770 L 1190 1770 L 1190 94 L 822 94" fill="none" stroke="#4a4036" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1110" y="1790" font-size="12" fill="#4a4036" font-style="italic">next matter</text>
<text x="600.0" y="1870" text-anchor="middle" font-size="13" fill="#4a4036" font-style="italic">Not on any draw: will, the size of the ask, burden (who rolls), the arm, the forum, the appeal route.</text>
<text x="600.0" y="1892" text-anchor="middle" font-size="13" fill="#4a4036" font-style="italic">On every draw: dice (faculty-built pool, title, seat x L, faction, offered proofs), obstacle (score / 2 bounded, then</text>
<text x="600.0" y="1914" text-anchor="middle" font-size="13" fill="#4a4036" font-style="italic">modifiers and aptness), leverage (sigma: the decider&#x27;s own regard where he is the actor; argument fit).</text>
<text x="600.0" y="1950" text-anchor="middle" font-size="13" fill="#4a4036" font-style="italic">Bracketed repairs (a) to (m) are the stress tests&#x27; deficiencies, each built in; their table is in section 3.</text></svg>
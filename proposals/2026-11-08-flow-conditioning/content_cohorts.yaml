# (coordinator rulings B1-B5). The builder's input, read by nothing at runtime. Replaces the `cohorts:` block of engine/season/cohorts.yaml only; `temperaments:` and
# `guards:` stay. Every row is [ASSUMPTION; medium; Jordan to correct]; provenance is in content_provenance.md
# (table B), and the values carry no marks.
#
# NO ROW CARRIES `faction:` (B1). A `commit` makes the faction occupy the settlement at build
# (world_q.py:2021-2062), so allegiance is carried by `heritage` and `conviction` alone, and faction
# commitment is HELD behind a reader audit.
#
# THE RULES (applied in this order):
#  H  majority cohort, one per settlement, NO label (keeps today's id `cohort_<rung>`), weight 2.
#       H1 T4, T12, T13 (Varfell; faction_politics_v30.md:657 names T4, T13 and the western fjords) -> southern_einhir
#       H2 T11 (Varfell; north-of-lake central fjords, geography:152,161; :655 "Varfell highlands")  -> northern_einhir
#       H3 other territory at radiation band <= 1 (T6; :657)                                          -> southern_einhir
#       H4 band 2-3 (T1, T5, T14; :656 "Valorsmark core")                                             -> central_einhir
#       H5 band >= 4 (T2 T3 T7 T8 T9 T10 T17; :655 "Hafenmark, Crown heartland")                     -> northern_einhir
#       H6 T16 Schoenland (foreign root) -> its people's heritage                                     -> schoenlander
#  C  caste cohort (label = the first word of the heritage), weight 2, only where sum <= capacity:
#       C1 non-Varfell territory at band <= 2 (T5, T6): the other side of the caste line -- southern_einhir where the
#          majority is not southern (T5), and the holder's seat-territory heritage (T1 -> central_einhir) where it is (T6)
#       C2 T11 (northern majority): a southern_einhir cohort in every settlement (capacities 7/4/4)
#       C3 southern-majority Varfell settlement of capacity >= 6: a northern_einhir cohort (S-026 S-031 S-032 S-033 S-034)
#       C4 a venues.yaml `seats:` tag that is a heritage_roster member's people (`Altonian` -> altonian;
#          names_index.yaml:352, a people): an altonian cohort at that seat (S-007)
#  V  conviction, ONE rule on the geography's radiation bands b (valoria_geography_v30.yaml:842-872):
#       southern_einhir: einhir_restoration (its engaged affiliation, descriptor_registry.yaml:245-247) = 6 - b
#       northern/central_einhir: solmund_orthodoxy = min(5, 1 + b); the Church's seat territory (T9) = 5
#       every other affiliation = 1
#     [ASSUMPTION; one rule on the geography's band data, swept with the bands; Jordan to correct]
#     V branches on whether the HERITAGE HAS BAND DATA, i.e. holds a majority cohort in a territory under
#     r_valoria (rule H) -- a data test, not a name test:
#       V1 band data (northern/central/southern_einhir): as above.
#       V2 no band data (altonian, schoenlander): the heritage's ENGAGED affiliation (descriptor_registry.yaml:245-247)
#          = median_low of the engaged affiliation over the cast rows of that people's faction (the faction whose cast
#          rows carry the heritage: altonian -> Altonia, NPC-011; median of 3/4/5 = 4); every other member 1.
#          schoenlander has NO `engages:` cell, so V2 gives it 1 throughout.
#       [ASSUMPTION; medium; Jordan to correct; revert: 1 everywhere]
#     (s = solmund_orthodoxy, e = einhir_restoration, c = altonian_civics)


; Pytest configuration for the Valoria design repo.
;
; WHY THIS FILE EXISTS (2026-07-29). `pytest tests/valoria` is the SHIPPING gate (CLAUDE.md §0.1),
; and it is slow: 968 tests, of which a small set of full-roster sweeps, byte-exact goldens and
; corpus-wide graph builds own the overwhelming majority of the wall clock. That cost is REAL and
; those tests EARN it — see the DO-NOT-WEAKEN note below. But paying it on every inner-loop run
; discourages running the suite at all, and this repo has already been bitten by exactly that: a
; PR broke a regression pin because the suite was run BEFORE the change rather than after
; (`tools/valoria_local.py --staged` does not run pytest, so local-green != CI-green).
;
; The `slow` marker gives the inner loop an OPT-IN fast lane:
;
;     python -m pytest tests/valoria -q -m "not slow"     # fast lane, seconds not minutes
;     python -m pytest tests/valoria -q                   # the real gate, unchanged
;
; ============================================================================================
; THE ONE RULE: there is deliberately NO `addopts` line in this file.
; ============================================================================================
; Adding `addopts = -m "not slow"` would silently change what `python -m pytest tests/valoria -q`
; executes — including in `.github/workflows/valoria-ci.yml`'s `unit-tests` job, which invokes
; exactly that command. That is a SHIPPING-GATE COVERAGE CUT, not an optimisation, and per
; CLAUDE.md §0.1 it is Jordan's call, made loudly, never a side effect of a speed change.
;
; `tests/valoria/test_pytest_marker_discipline.py` is the guard that fails on recurrence: it
; asserts this file declares no `addopts`, that CI's invocation carries no `-m` filter, and that
; the marked and unmarked partitions still sum to the full collection (so marking can never
; silently drop a test from the gate).
;
; DO NOT "SPEED UP" THE MARKED TESTS BY NARROWING THEM. Several are load-bearing guards whose
; whole point is breadth: `test_plate_participation_guard_is_not_blind` caught a gate that watched
; one weapon out of a class of fourteen, and `test_combat_armour_reference` is a committed golden.
; Restricting them to a watched subset is the exact blind spot they exist to close. Marking a test
; `slow` is a statement about its RUNTIME, never about its importance.

[pytest]
testpaths = tests/valoria

markers =
    slow: takes multiple seconds — full-roster sweeps, byte-exact goldens, corpus-wide graph builds.
        Deselect for the inner loop with `-m "not slow"`. NEVER filtered by default: see the note
        above and tests/valoria/test_pytest_marker_discipline.py.

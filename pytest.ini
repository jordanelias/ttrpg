; Pytest configuration for the Valoria design repo.
;
; WHY THIS FILE EXISTS (2026-07-29). `pytest tests/valoria` is the SHIPPING gate (CLAUDE.md §0.1),
; and it is slow: a small set of full-roster sweeps, byte-exact goldens and corpus-wide graph builds
; own the overwhelming majority of the wall clock. That cost is REAL and those tests EARN it — see the
; DO-NOT-WEAKEN note below. But paying it on every inner-loop run discourages running the suite at all,
; and this repo has already been bitten by exactly that: a PR broke a regression pin because the suite
; was run BEFORE the change rather than after (`tools/valoria_local.py --staged` does not run pytest,
; so local-green != CI-green).
;
; The `slow` marker gives the inner loop an OPT-IN fast lane:
;
;     python -m pytest tests/valoria -q -m "not slow"     # fast lane
;     python -m pytest tests/valoria -q -n auto           # the real gate, unchanged
;
; MEASURED 2026-09-11 (ED-IN-0212, 1817 tests collected, 4 cores) — read this before tuning either:
;
;     serial, unfiltered                     9m 01s
;     -n auto, unfiltered                    2m 36s   <- the gate. 3.5x, same collection.
;     -n auto, -m "not slow"                 2m 27s   <- the fast lane bought NINE SECONDS.
;
; PARALLELISM BEATS DESELECTION HERE, AND THE FAST LANE'S FLOOR IS ONE TEST. Under `-n auto` xdist
; distributes by test, so wall clock floors at the LONGEST SINGLE TEST, and deselecting cheaper ones
; around it changes nothing. The floor was `test_engine_does_not_import_systems.py::
; test_the_one_declared_path_seam_is_still_the_only_one` at 78.8s, unmarked; it is marked now. The
; next floors are SESSION-SCOPED FIXTURES (conftest's `generated_layer`, ~27s; `test_contract_index`'s
; module `docs`, ~19s) and marking a test CANNOT free those — the fixture is shared, so its cost
; returns the moment any consumer is selected. Do not chase them with marks.
;
; CADENCE IS THE REAL SAVING, NOT THE MARKER. The full gate is a CLOSE step, run once, before the
; commit; mid-session you run the one FILE covering your edit (seconds). CLAUDE.md §0.4 is the owner
; of that rule and this file does not restate it.
;
; ============================================================================================
; THE ONE RULE: there is deliberately NO `addopts` line in this file.
; ============================================================================================
; Adding `addopts = -m "not slow"` would silently change what `python -m pytest tests/valoria -q`
; executes — including in `.github/workflows/valoria-ci.yml`'s `unit-tests` job, which invokes
; exactly that command. That is a SHIPPING-GATE COVERAGE CUT, not an optimisation, and per
; CLAUDE.md §0.1 it is Jordan's call, made loudly, never a side effect of a speed change.
;
; `tests/valoria/test_pytest_marker_discipline.py` is the guard that fails on recurrence: it
; asserts this file declares no `addopts`, that CI's invocation carries no `-m` filter, and that
; the marked and unmarked partitions still sum to the full collection (so marking can never
; silently drop a test from the gate).
;
; DO NOT "SPEED UP" THE MARKED TESTS BY NARROWING THEM. Several are load-bearing guards whose
; whole point is breadth: `test_plate_participation_guard_is_not_blind` caught a gate that watched
; one weapon out of a class of fourteen, and `test_combat_armour_reference` is a committed golden.
; Restricting them to a watched subset is the exact blind spot they exist to close. Marking a test
; `slow` is a statement about its RUNTIME, never about its importance.

[pytest]
testpaths = tests/valoria

markers =
    slow: takes multiple seconds — full-roster sweeps, byte-exact goldens, corpus-wide graph builds.
        Deselect for the inner loop with `-m "not slow"`. NEVER filtered by default: see the note
        above and tests/valoria/test_pytest_marker_discipline.py.

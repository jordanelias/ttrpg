# action_vocabulary.yaml — the performable domain-action VERB roster
# ─────────────────────────────────────────────────────────────────────────────
# Central home for the performable-action vocabulary (the verbs a faction/player can
# DO on the strategic layer). This exists so the roster lives ONCE in a register
# (CLAUDE.md §8) instead of hardcoded inside the vector-audit skill — the vector-audit
# sources CLASSES['action'] from here (token_class: action).
#
# ⚠️ STATUS: PROVISIONAL — there is no domain-action registry to defer to: the `domain_actions`
# contract row is retired (A-10: a faction's acts are persons' verbs via their seats; ED-IN-0232).
# History and discussion: references/vocab_history.md
#
# Distinct from the `da.*` 5-tag OUTCOME taxonomy (da.antinomian_action, da.covert_betrayal,
# da.diplomatic_alliance, da.economic_intervention, da.public_governance) which lives in
# references/module_contracts.yaml as emitted Key types — those are the Keys domain-action
# resolution EMITS; the verbs below are the actions a player SELECTS.
status: provisional
# provisional: the strategic layer's acts are rows of `engine/season/verb_table.yaml`. ED-FA-0002
# is CLOSED by its superseding row of 2026-10-06 (`registers/editorial_ledger_fa_archive.jsonl`);
# `blocked_on` keeps its value as a record.
blocked_on: ED-FA-0002
token_class: action
source_note: >-
  curated from references/module_contracts.yaml (ED-FA-0006 verb note) +
  references/module_contracts.yaml (faction_state wiring note: "conquest/muster/govern/uniques")
verbs:
  # military
  - Muster
  - March
  - Fortify
  - Blockade
  - Conquest
  # governance / economy
  - Govern
  - Trade
  - Subsidy
  - Treaty
  - Diplomacy
  # intelligence
  - Spy
  - Investigate
  - Counter-Intelligence
  # coercive / political
  - Censure
  - Embargo
  - Outlawry
  - Excommunication
  - Active Inquisition
  - Church Seizure
  - Recognition Challenge
  - Succession Endorsement
  - War Authorisation
  # popular / religious
  - Piety Spread
  - Community Organising
  - Martial Governance

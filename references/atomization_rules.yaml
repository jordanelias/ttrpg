# History and discussion: references/atomization_rules_history.md
version: 1
established: 2026-04-18
philosophy: |
  Rules are deterministic. The atomizer must be able to apply them without
  semantic understanding. If a file requires human judgment to split, it
  needs a custom split_map file, not a new rule type.

defaults:
  compliance_check_on_bootstrap: true
  compliance_check_on_commit: true
  compliance_check_on_close: true
  # No program reads `defaults:` (tools/compliance_check.py reads `policies:` only; its auto-fix half was excised).
  # History: references/atomization_rules_history.md.
  auto_fix_on_violation: true
  # RULED 2026-07-26 (Jordan): the index/skeleton + infill split is RETIRED as a default.
  force_skeleton_routing_for_design_docs: false
  skeleton_threshold_tokens: 15000
  sequential_chunk_tokens: 15000        # a doc over this splits into `_part2`, `_part3`, ... in reading order
  archive_chunk_max_tokens: 10000
  unknown_file_warn_tokens: 10000
  max_auto_fix_iterations: 3

# ── Policies are evaluated top to bottom; first match wins ──

policies:

  # ────────────────────────────────────────────────────────────
  # SESSION FILES
  # ────────────────────────────────────────────────────────────
  - match: "session_log_current.md"
    max_tokens: 2000
    on_exceed: "block_commit"
    write_policy: "auto_generated_only"
    note: "Auto-generated pointer to session_logs/index.md. Direct writes blocked."

  - match: "session_logs/index.md"
    max_tokens: 2000
    on_exceed: "block_commit"
    write_policy: "managed_only"
    managed_by: ["start_session_log", "close_session_log"]
    note: "Auto-generated active session list. Only written by session lifecycle functions."

  - match: "session_logs/*.md"
    exclude_match: ["session_logs/index.md"]
    max_tokens: 2000
    on_exceed: "block_commit"
    write_policy: "single_writer"
    note: "Per-session log files. Single writer per file (owning session only)."
    on_close: "archive_to"
    archive_target_pattern: "deprecated/archives/session/session_log_{scope}_{date}_{token}.md"

  - match: "deprecated/archives/session/session_log_archive.md"
    max_tokens: 50000
    on_exceed: "chunk_by_quarter"
    chunk_pattern: "deprecated/archives/session/session_log_archive_{year}_q{quarter}.md"
    index_file: "deprecated/archives/session/session_log_archive_index.md"

  # ────────────────────────────────────────────────────────────
  # REGISTERS — patches
  # ────────────────────────────────────────────────────────────
  - match: "registers/patch_register_active.yaml"
    max_tokens: 15000
    auto_archive_status: [applied, struck, superseded]
    archive_target_pattern: "registers/patch_register_archive_{range}.yaml"
    archive_chunk_max: 10000
    archive_chunk_by: pp_range
    index_file: "registers/patch_register_index.md"
    index_max_tokens: 3000
    regenerate_index_on: [any_change]

  - match: "registers/patch_register_archive*.yaml"
    max_tokens: 10000
    on_exceed: "error"
    read_restriction: "index_first"

  - match: "registers/patch_register_index.md"
    max_tokens: 6000
    note: "Full-history index across all archives (199+ entries). Raised from 3000 after fixing index_gen to parse all archive formats."
    split_active_only: true
    regenerate_from: "registers/patch_register_active.yaml"

  # ────────────────────────────────────────────────────────────
  # REGISTERS — editorial ledger
  # ────────────────────────────────────────────────────────────
  # Editorial ledger: registers/editorial_ledger.jsonl plus one registers/editorial_ledger_<lane>.jsonl per lane;
  # consumers read all of them. Size caps for all ledger files live in tools/ci_register_size_check.py's
  # THRESHOLDS, not here.

  # ────────────────────────────────────────────────────────────
  # REGISTERS — audit/simulation-run verdict registry
  # ────────────────────────────────────────────────────────────
  # references/audit_registry.jsonl is the audit/simulation-run verdict registry (appended by
  # tools/audit_registry.py). Its size cap lives in tools/ci_register_size_check.py's THRESHOLDS, not here.

  # ────────────────────────────────────────────────────────────
  # HANDOFF / CONTINUITY — root index + lane files
  # ────────────────────────────────────────────────────────────
  # HANDOFF.md and the lane files: pruned narrative moves to registers/handoffs/HANDOFF_archive.md.
  # THE FROZEN ED ARCHIVE: skipped, because nobody may edit these fragments and a size warning on them is one
  # nobody can act on.
  # THE RATIFIED ARCHITECTURE (ED-IN-0204): the two architecture rows below skip the size WARNING.
  # ⚠ THIS IS AN EXEMPTION FROM THE WARNING, NOT A RULING THAT THE DOCUMENTS ARE RIGHTLY SIZED.
  # They exceed §4's ~15k split threshold and §4 still applies to them. What the exemption buys is
  # that the split is done DELIBERATELY, as its own change: every one of these files is cited by
  # section number across the tree (`PLAN.md §3.3`, `§C.12`, `§F.24a`, `§B.9`), and a split that
  # renames the containing file breaks those citations wholesale. A warning nobody may act on
  # without a plan is a warning that stops being read, which is what the note above is about.
  - match: "architecture/*.md"
    on_exceed: "skip"
    note: "Layer 1, RATIFIED 2026-09-05 (ED-IN-0204). Oversized by §4 and exempt from the WARNING only; the sequential-part split is tracked work, not a licence to grow. Cited by section number tree-wide."

  - match: "architecture/meta/*.md"
    on_exceed: "skip"
    note: "Layer 1 meta-architecture, RATIFIED 2026-09-05 (ED-IN-0204). Same posture as architecture/*.md above."

  # The season loop's runtime registries: MECHANISM under CLAUDE.md §0.05, parsed by register.py --check, so skipped.
  - match: "engine/season/*.yaml"
    on_exceed: "skip"
    note: "Runtime registries the season loop reads (rosters, verb_table, write_matrix, hole_register, requirements). Mechanism under §0.05, gated by register.py --check."

  - match: "registers/archive/*"
    on_exceed: "skip"
    note: "Frozen pre-cutover ED-ledger fragments, read by the blocking citation gate. Never edited; grows only by archival. Relocated from deprecated/{archives/editorial*,canon}/ on 2026-08-23 (S6/6b)."

  - match: "registers/handoffs/HANDOFF_archive.md"
    on_exceed: "skip"
    note: "Frozen archive of pruned HANDOFF.md narrative (2026-07-08). Grows by archival, not editing."

  # ⚠ THE HANDOFF.md AND HANDOFF_<LANE>.md CAPS FIRE AS REAL SIGNAL, AND WHAT THEY ASK FOR IS ADJUDICATION WORK,
  # NOT A SWEEP. The threshold is NOT raised and the rule is NOT set to skip. Whoever takes it reads each section
  # for live items (open, held, needs_jordan) BEFORE moving it, and moves rather than deletes. Reasoning and the
  # ED-IN-0221 move that did it for four lanes: references/atomization_rules_history.md.
  - match: "HANDOFF.md"
    max_tokens: 4000
    on_exceed: "flag_for_split"
    archive_target_pattern: "registers/handoffs/HANDOFF_archive.md"
    note: "Root continuity index, read every session (CLAUDE.md §2), so keep it thin. Move closed/dated narrative to the archive; lane-owned '## Next actions' content belongs in that lane's registers/handoffs/HANDOFF_<LANE>.md, never here. on_exceed is flag_for_split (warn-tier in compliance_check.py's CI-mode severity map), not block_commit, by design."

  # Per-lane CLOSED narrative (ED-IN-0221, 2026-09-13). MUST stay above the `*.md` glob below —
  # `_match_rule` is first-match, so the order is the rule.
  - match: "registers/handoffs/HANDOFF_*_closed.md"
    on_exceed: "skip"
    note: "Closed work for one lane, moved VERBATIM out of HANDOFF_<LANE>.md and never read for orientation; the live file carries an index of what moved. Uncapped: an archive's size is not a defect. The thing that must stay small is the LIVE file, and that is the rule below."

  # Per-lane HISTORY (ED-IN-0240, 2026-09-17, Jordan: "TRIM THE HANDOFFS"). Same placement rule
  # as the _closed sibling above: it MUST stay above the `*.md` glob, because first-match wins.
  - match: "registers/handoffs/HANDOFF_*_history.md"
    on_exceed: "skip"
    note: "Dated lane narrative, moved VERBATIM out of HANDOFF_<LANE>.md and never read for orientation; the live file carries an index of every OPEN MARKER the moved units hold. Distinct from _closed: _closed is what the marker predicate proved FINISHED, _history is dated narrative regardless of markers (CLAUDE.md §4 forbids a file named *closed* holding open items). Uncapped, like _closed. The thing that must stay small is the LIVE file, and that is the rule below."

  - match: "registers/handoffs/*.md"
    max_tokens: 20000
    on_exceed: "flag_for_split"
    note: "Per-lane continuity files. Large by design (active session narrative for one lane), but not unbounded — archive resolved/superseded entries when approaching the cap."

  # ────────────────────────────────────────────────────────────
  # REGISTERS — coverage matrix
  # ────────────────────────────────────────────────────────────
  - match: "tests/coverage_matrix.md"
    max_tokens: 15000
    on_exceed: "flag_for_manual_archive"
    note: "SINGLE SOURCE for the coverage_matrix cap: tools/ci_register_size_check.py reads this max_tokens at runtime (yaml_max_tokens) rather than carrying its own literal. Change the cap HERE only. Markdown narrative file; auto-archive-by-status does not apply (no per-entry status field). When THIS threshold is reached, manually move closed-finding paragraphs to tests/coverage_matrix_archive_<date>.md and reset."

  # ────────────────────────────────────────────────────────────
  # REGISTERS — propagation map (append-only propagation log)
  # ────────────────────────────────────────────────────────────
  - match: "references/propagation_map.md"
    max_tokens: 10000
    on_exceed: "flag_for_manual_archive"
    note: "Append-only per-PP propagation log; grows over time and archives old batches to deprecated/archives/propagation/ (see the file's header). Archiving by batch, not a hard split, is the maintenance path. When it approaches the cap, move the oldest active batches to a new deprecated/archives/propagation/propagation_map_archive_<date>.md."

  # ────────────────────────────────────────────────────────────
  # PARAMS FILES — atomized by domain
  # ────────────────────────────────────────────────────────────
  - match: "engine/params/board_game.md"
    max_tokens: 5000
    split_strategy: custom_map
    split_map: "references/splits/params_board_game_split.yaml"
    index_replaces_canonical: true

  - match: "engine/params/threadwork.md"
    max_tokens: 5000
    split_strategy: canonical_vs_superseded
    superseded_marker: "SUPERSEDED SECTIONS"
    superseded_target: "engine/params/threadwork_superseded.md"
    superseded_max_tokens: 15000

  - match: "engine/params/factions.md"
    max_tokens: 5000
    split_strategy: by_level_2_heading
    split_cap_per_file: 5000
    target_pattern: "engine/params/factions/{slug}.md"
    index_replaces_canonical: true

  # Superseded params: frozen for reference. Never shrinks.
  - match: "engine/params/threadwork_superseded.md"
    on_exceed: "skip"
    note: "Superseded by engine/params/threadwork.md. Frozen for reference only."

  - match: "engine/params/*.md"
    max_tokens: 10000
    on_exceed: "flag_for_split"
    require_rule_above_threshold: true

  # ────────────────────────────────────────────────────────────
  # ARC REGISTER
  # ────────────────────────────────────────────────────────────
  - match: "arcs/registers/arc_register.md"
    max_tokens: 5000
    split_strategy: by_vector_category
    split_cap_per_file: 10000
    target_pattern: "arcs/registers/arc_register_{category}.md"
    index_replaces_canonical: true
    categories:
      - name: clocks
        matches: ["I — Clock Vectors"]
      - name: threads
        matches: ["II — Thread Vectors"]
      - name: factions
        matches: ["III — Faction Vectors"]
      - name: territory
        matches: ["IV — Territory Vectors"]
      - name: events
        matches: ["V — BG Conviction Events", "VI — Convergence Markers"]

  # ────────────────────────────────────────────────────────────
  # PROPAGATION MAP
  # ────────────────────────────────────────────────────────────
  - match: "references/propagation_map.md"
    max_tokens: 5000
    split_strategy: tables_vs_log
    log_split_marker: "BROKEN DEPENDENCIES"
    log_target: "references/propagation_log.md"
    log_max_tokens: 10000
    log_chunk_pattern: "references/propagation_log_{year}_q{quarter}.md"
    regenerate_log_index_on: [any_change]

  # ────────────────────────────────────────────────────────────
  # DESIGN DOCS — skeleton required above threshold
  # ────────────────────────────────────────────────────────────
  # RETIRED 2026-08-12 (ED-IN-0159 §1.6): the one skeleton/index row matched `designs/`, a retired tree. This does not
  # undo the 2026-07-26 ruling (existing skeleton/index pairs grandfathered, pattern retired as a default).

  # ────────────────────────────────────────────────────────────
  # REFERENCE INDEXES — must stay compact
  # ────────────────────────────────────────────────────────────
  - match: "references/file_index.md"
    max_tokens: 8000
    summary_file: "references/file_index_summary.md"
    summary_max_tokens: 1000

  - match: "references/design_registry.yaml"
    max_tokens: 8000

  - match: "references/canonical_sources.yaml"
    max_tokens: 14000
    note: "Machine-written canonical_sha metadata (freshness_gate --update), not authored content, drives this cap. There is no _archive file, so the checker's suggested action does not exist. tools/ci_register_size_check.py carries its own literal for this file (14_000) and points here."

  - match: "references/module_contracts.yaml"
    max_tokens: 32000
    on_exceed: "warn_only"
    note: "Genuinely comprehensive per-module IN/resolver/OUT contract registry, validated by tools/export_composition.py (blocking --check); expected to grow, not shrink, as doc:null gaps close. The cap is single-sourced here: tools/ci_register_size_check.py reads this max_tokens (MODULE_CONTRACTS_LIMIT). Re-measure with `python3 tools/ci_register_size_check.py`, which prints the token count. Raise history and measurements: references/atomization_rules_history.md."


  # ────────────────────────────────────────────────────────────
  # FROZEN / HISTORICAL CONTENT — explicit exemptions from catch-all
  # ────────────────────────────────────────────────────────────

  # Deprecated: frozen forever. No archival, no split. Large files are expected.
  - match: "deprecated/**"
    on_exceed: "skip"
    note: "Frozen historical content. Size is expected and non-actionable."

  # Archives: frozen historical. May exceed chunk limits legitimately.
  - match: "deprecated/archives/**"
    max_tokens: 100000
    on_exceed: "warn_only"
    note: "Historical archive content. Warn but do not block."

  # Atoms-pending staging area: large manifests and queued docs are expected.
  - match: "references/atoms_pending/**"
    on_exceed: "skip"
    note: "Staging area for atomization work. Not a governed register."

  # Superseded params: frozen historical. Never shrinks.
  - match: "engine/params/threadwork_superseded.md"
    on_exceed: "skip"
    note: "Superseded by engine/params/threadwork.md. Frozen for reference only."

  # Reference data: large but stable.
  - match: "references/npc_registry.yaml"
    max_tokens: 15000
    on_exceed: "warn_only"
    note: "NPC registry grows with NPCs; triage when approaching 15k."

  - match: "references/proper_noun_triage_round2.yaml"
    max_tokens: 15000
    on_exceed: "warn_only"

  # Mechanical terms index: large diagnostic proposal, actively being structured.
  # T6 target — extract synonym/collision/deprecated as yaml; then this shrinks.
  - match: "references/mechanical_terms_index.md"
    max_tokens: 40000
    on_exceed: "warn_only"
    note: "Pending T6 structural extraction. Size expected until T6 complete."

  # RETIRED (ED-IN-0194, 2026-08-21): the size rules for tools/observability/DECISIONS.md and PROPOSALS.md went
  # with tools/observability/ and its generators; a cap on a file that cannot be produced is a rule no run can satisfy.

  # Foundational canon: not splittable. Philosophically complete by design.
  - match: "canon/00_philosophical_foundations.md"
    max_tokens: 20000
    on_exceed: "warn_only"
    note: "Foundational canon; content is load-bearing, not compressible."

  # Historical test sim outputs: archived run data, frozen.
  - match: "tests/sim/sim_*.md"
    on_exceed: "skip"
    note: "Historical sim-run outputs. Frozen; not actionable."

  - match: "tests/sim/sim_batch_*.md"
    on_exceed: "skip"

  # Archived stress test output
  - match: "tests/stress/*.md"
    on_exceed: "skip"
    note: "Stress test historical output. Frozen."

  - match: "tests/emergent_arc_*.md"
    on_exceed: "skip"

  - match: "tests/coverage_matrix_archive*.md"
    max_tokens: 50000
    on_exceed: "warn_only"
    note: "Archive of coverage matrix findings. Grows over time."

  # Skill support files: read-only reference docs for prose-writer skill.
  - match: "skills/prose-writer/references/*.md"
    max_tokens: 25000
    on_exceed: "warn_only"
    note: "Prose-writer skill support files. Large by design (technique libraries)."


  # Simulation framework workplans + resolution docs: large planning artifacts.
  # Comprehensive workplans enumerating every mechanical system legitimately exceed
  # the 15k catch-all (V1.1 workplan is ~25k tokens). Splitting would fragment the
  # single source of truth for stress planning.
  - match: "tests/sim_framework/*.md"
    max_tokens: 30000
    on_exceed: "warn_only"
    note: "Workplan + resolution docs. Large by design (comprehensive system enumeration)."

  # ────────────────────────────────────────────────────────────
  # RESEARCH NOTES + SIM ACTIVITY LOGS — reference/historical, not governed registers
  # (added 2026-05-31, Lane B item 5.6; precedent: deprecated/** · deprecated/archives/** · tests/sim/sim_*.md skip-policies)
  # ────────────────────────────────────────────────────────────
  - match: "research/**"
    on_exceed: "skip"
    note: "Historical/HEMA research notes feeding design. Long-form reference prose, not a splittable register."

  - match: "tests/sim/**/session_activity_log.md"
    on_exceed: "skip"
    note: "Per-run sim activity logs. Frozen historical output (same class as tests/sim/sim_*.md)."

  # RETIRED 2026-08-12 (ED-IN-0165): the `skip` row for one file under designs/audit/ was DELETED, not repointed.
  # ⚠ The `note:` key below is a DUPLICATE on the preceding row (tests/sim/**/session_activity_log.md); PyYAML keeps
  # the last, so this one is the value that row parses to. Left as found, because removing either changes the data.
    note: "Frozen evidence artifact of a completed one-off audit merge stage (self-declared 'QUARANTINE-NOTE: not a registry and not a source of canonical truth' in the file header). Was hitting the generic **/*.yaml 10000 catch-all at ~18.5k tokens with no action possible or intended — same class as the tests/sim/ and research/ skip-policies above, scoped to this specific file rather than a blanket designs/audit/**/*.yaml exemption."

  # ────────────────────────────────────────────────────────────
  # AUDIT CORPUS — 30k (Jordan, 2026-08-11)
  # Audit files get 30,000 (RULED, Jordan 2026-08-11). Placed ABOVE the catch-all because `_match_rule` is first-match.
  # SINGLE OWNER: this row. Do not add a second cap for audit files in ci_register_size_check's THRESHOLDS.
  - match: "audit/**/*.md"
    max_tokens: 30000
    on_exceed: "flag_unknown_pattern"

  # ────────────────────────────────────────────────────────────
  # CATCH-ALL — MEASURED INTO SILENCE 2026-09-13 (ED-IN-0220)
  # ────────────────────────────────────────────────────────────
  # ⚠ THE `max_tokens` ON BOTH CATCH-ALLS IS DELETED, DELIBERATELY, AND THE RULES STAY SO THE MATCH IS STILL DOCUMENTED.
  # They matched everything, so their warnings described the tree's ordinary document size rather than outliers
  # (ED-IN-0220). What survives is CLAUDE.md §4's convention: a long document splits into `_part2`, `_part3`, ... in
  # reading order. NOT TOUCHED: every EXPLICIT per-file cap above, including the blocking ones. The measurements and
  # the §0.1 pt 5 reasoning: references/atomization_rules_history.md.
  - match: "**/*.md"
    on_exceed: "flag_unknown_pattern"

  - match: "**/*.yaml"
    on_exceed: "flag_unknown_pattern"

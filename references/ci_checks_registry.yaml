    posture: harden
    role: >-
      M1 acceptance gate (CLAUDE.md §0.2's instrument) — the five falsifiable rows that say whether
      a milestone juncture EXECUTES. Rows 1-2 run a seeded one-season headless probe of
      engine/season/ (the head; re-pointed from mc_v18 by ED-IN-0226) and compare its
      content_hash across two same-seed runs; neither can be satisfied by writing.
    ci_job: validators-report
    notes: >-
      REPORT-ONLY, deliberately: `--check` exits 1 today because stub_invocations and m1_junctures both fail, which
      is the true state of the milestone. A bare --check has no baseline and would red on arrival, refusing
      unrelated authors' commits for a pre-existing condition. ED-IN-0112 paid for that mistake once.

      ⚠ NAMED AS A LOSS, because the rewire was not neutral and the first version of this row did
      not say so. `review_core.py` carried `m1.acceptance` inside the REQUIRED compliance job and
      graded it against a baseline, so a REGRESSION genuinely red CI — that is exactly why the
      2026-08-20 plan of record (§1.A4) valued it. Report-only here cannot red on anything. So the
      net effect of culling wave 2 is that NO GAME-FACING SIGNAL CAN NOW FAIL CI ON REGRESSION,
      and the only reason that is tolerable is that the milestone's true state is already NOT MET,
      so there is nothing green to protect. It stops being tolerable the moment a juncture passes:
      whoever greens the first row must restore a blocking form in the same commit, with a
      baseline, or the gate that defines `done` will be advisory at exactly the point it matters.

  - path: tools/fold_ledger_to_latest.py
    level: 5
    subject: compliance
    posture: harden
    role: >-
      The editorial-ledger queue instrument (plan position `1` CLOSE-PASS's own deliverable,
      `workplans/2026-09-28-the-plan-one-order-mc-v18-retired.md` §3.1 item 1). Folds every
      `registers/editorial_ledger*.jsonl` row to the last row per id (the ED-IN-0149 precedent)
      and reports `needs_jordan: true` at any status — HANDOFF.md's own definition of "rows
      awaiting Jordan" — plus the narrower `∧ status: open` subset old plan position 1's own
      OBSERVABLE text names, replacing four disagreeing hand counts (108/158, 151/105, 41/51/77,
      37) with one reproducible command. A Phase-3 terminal critique of this tool's own first
      cut found that reporting ONLY the narrower subset silently excludes real, live Jordan
      items filed under a status other than `open` (`ED-IN-0210`/`ruled`, `ED-IN-0261`/`partial`,
      `ED-IN-0247`/`resolved` all carry `needs_jordan: true` and are all still his) — a fifth
      disagreeing figure rather than a retirement of the first four. Both counts are reported now.
    ci_job: ""
    notes: >-
      DELIBERATELY NOT WIRED INTO CI: this is a measurement instrument for a queue Jordan reviews by hand, not a gate
      over game state, and nothing here should fail a build. Manual invocation only:
      `python tools/fold_ledger_to_latest.py --queue`. Does NOT scan the older, pre-migration
      `registers/archive/*.yaml` corpus, structurally separate from the `.jsonl` ledgers this tool reads — a row
      resolved only there reads as "not found," not as resolved, to `--id` (exact-id lookup only; it does not accept
      a fragment or a prefix). That corpus is not reliably all-terminal (a live flagged row can sit there) and this tool does not verify it.



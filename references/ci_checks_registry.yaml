# History and discussion: references/ci_checks_registry_history.md
# Valoria CI / Compliance / Verifier Checks — Registry
#
# Single source of truth for what tools/ scripts exist, what they enforce, and
# what level of enforcement they sit at on the architecture spec's
# enforcement_spectrum.
#
# Architecture spec V2.2 explicitly names "code and text drifting apart is its
# own defect." This file mechanizes that discipline for the CI/compliance class.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# SUBJECT AND POSTURE — the depth axis (Jordan, 2026-08-22). READ THIS BEFORE ADDING A ROW.
#
# ⚠ THIS AXIS IS NOT THE LAYER 0/1/2 GOVERNANCE SCHEME, AND WAS SPELLED `layer:` UNTIL 2026-09-09.
#   Governance (Layer 0 = `CLAUDE.md`, Layer 1 = `architecture/`, Layer 2 = the game code) is owned by
#   `CLAUDE.md`, not restated here. This file owns only SUBJECT DEPTH: what a CHECK is ABOUT.
#   Two axes, two vocabularies, no shared word. Do not reintroduce `layer:` here.
#
# `level:` (below) is ENFORCEMENT LOCUS: where a rule is applied — prose, skill, pre-commit, CI.
# `subject:` is DEPTH OF SUBJECT: what the check is ABOUT. Independent axes; never conflate them.
# A tool can be `level: 5, subject: compliance` (export_descriptors) or `level: 5, subject:
# verification` (ci_vacuous_assertion_check). Knowing one tells you nothing about the other.
#
#   subject: game          engine/, systems/*/sim/, engine/substrate/, the engine_params/*.json
#                          runtime inputs, and runtime instrumentation the engine or the Godot port
#                          consumes. posture: grow.  NOTHING IN THIS FILE IS `game`; a gate is never
#                          the game.
#   subject: compliance    compliance over `game` and canon. posture: HARDEN, do not grow. Every row
#                          here is `compliance` except the one noted below.
#   subject: verification  verification of a `compliance` artifact. posture: CAP. Admitted only where
#                          a compliance gate's failure would be SILENT AND GAME-COSTLY, and each
#                          member must be MUTATION-VERIFIED at introduction so it terminates in
#                          execution rather than in a further guard.
#   (a fourth tier)        DOES NOT EXIST AS CODE, ever. Its subject would be a `verification` guard —
#                          apparatus — and `CLAUDE.md` §0.1 pt 5 rules load-bearing is not transitive
#                          through apparatus. This repo built one four times (review_core +
#                          review_baseline, scope_ratchet, the observability generators, the
#                          SessionStart banner) and retired all four with measurements attached; §0.3
#                          records why. The slot is filled by the fresh-context adversarial stage and
#                          Jordan's rulings, which cannot accrete artifacts. This is the same rule the
#                          governance scheme states as "Layer -1 is a failure", counted the other way.
#
# ONLY ONE ROW HERE IS `verification`: `tools/ci_vacuous_assertion_check.py`, whose subject is the
# assertions inside tests/valoria + engine/tests. The rest of that tier is not in this file because it
# is TESTS, not tools — tests/valoria/{test_field_golden_pins, test_pytest_marker_discipline}.py, the
# known-red register in conftest.py, broken_dependency_checker's registry-coverage function, and the
# export falsifiers. If you add a `verification` member anywhere, it needs a mutation check in the
# same commit.
#
# THE ORCHESTRATOR HAS NO SUBJECT, AND THAT IS WHAT KEEPS IT SAFE: `tools/valoria_local.py` dispatches validators
# and holds no rule, so it occupies no rung and cannot deepen the stack. `tools/ci_common.py` is the same: shared
# primitives, no subject.
#
#   ⚠ THE LINE AN ORCHESTRATOR MUST NOT CROSS: dispatching is plumbing; AGGREGATING VERDICTS is the
#   forbidden tier. The moment an orchestrator scores, ratchets, or rolls its children's results into
#   a single repo-wide judgement, it has become `review_core.py` — which did exactly that over twelve
#   signals, eleven of them apparatus, and was retired for it. Add a validator to the list; never add
#   a summary of the list.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────

# NB: the ladder below is cited to `project-architecture-valoria-v2_2.md`, which resolves nowhere on main and has no
# references/restructure_ledger.md row. The `subject:` axis above is defined in place and depends on nothing absent.
# Levels (from project-architecture-valoria-v2_2.md):
#   1 — text rule in PI (low reliability)
#   2 — skill description (medium)
#   3 — pre-commit grep / heuristic check (high)
#   5 — CI external check via GitHub Actions (highest, post-push, mirror)
#
# LEVEL 4 IS RETIRED (2026-08-12, G3 / ED-IN-0159 §1.10). The numbering stays 1/2/3/5 with the gap visible:
# renumbering 5 to 4 would silently rewrite the meaning of every `level: 5` row already in this file.
#
# Field definitions:
#   path             — script path
#   args             — the invocation flags that select WHICH rule this row is about, when one script serves more
#                      than one row (`ci_naming_check.py`: block tier and warn tier). No consumer reads `args`; it
#                      disambiguates the row for a HUMAN. `path` is existence-checked by `broken_dependency_checker`,
#                      so the flags cannot be folded into it.
#   level            — enforcement locus (3 or 5). WHERE the rule is applied.
#   subject          — game / compliance / verification. WHAT the check is about. See the block
#                      above. Renamed from `layer:` 2026-09-09; not `CLAUDE.md`'s Layer 0/1/2.
#   posture          — grow (game) / harden (compliance) / cap (verification). What may happen
#                      to this tier's size.
#   role             — what defect class it catches
#   ci_job           — name of the GitHub Actions job that invokes it (empty
#                      if not wired in CI yet)
#   notes            — anything important
#
# `paired_hook` was removed 2026-08-12 with its subject; nothing reads it.
#
# Drift discipline: when ci-yml adds or removes a tool invocation, this registry must update
# in the same commit; `broken_dependency_checker.check_ci_registry_coverage()` enforces that
# join in both directions.


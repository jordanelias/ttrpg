# descriptor_registry.yaml
# Single source of truth for all quantified-qualitative descriptors (W1.13).
# Systems bind descriptors BY KEY (name-indexed), so a descriptor can be renamed / recategorized /
# extended HERE without rewriting any consumer.
# History and discussion: references/descriptor_registry_history.md
#
# Schema: `name` is the current primary; `aliases` carry alternatives + LEGACY names so existing formula
# references back-resolve (this is what makes a roster cheap to churn). ONE registry, partitioned by `domain`.
# The 9-attribute roster is IN FLUX (see ATTRIBUTES below). `resonance_style` is DEPRECATED (see `deprecated:`).
#
# KIND: attribute_scalar | attribute_aggregate | faction_stat | settlement_stat |
#       practitioner_stat | territory_stat | conviction_weight | ethical_axis |
#       conviction_axis_map | orientation_scalar | contest_style | temperament_type | template |
#       personal_track
#   `personal_track` names the Category-B REGISTRATION BATCH (section below), not a shared runtime shape.
# Entries that ALREADY have a canonical source doc are REGISTERED BY REFERENCE (source:) rather
# than re-transcribed here -- the source doc stays authoritative (re-transcription = drift).

version: v1
ratified: 2026-06-06
domains: [actor, settlement, equipment, environment]

# ============================================================================
# ATTRIBUTES (actor) -- DEFINED HERE. No prior single source existed; that gap is W1.13's reason.
# Scalar 1-7. Roster IN FLUX: primary name + aliases (incl. legacy names for back-resolution).
#
# ⚠ THE COUNT IS RULED; THE ROSTER IS NOT COMPLETE. Jordan, 2026-08-14: "it will be 10 attributes".
# NINE are defined below. The TENTH IS UNNAMED — naming it is the open workshop, and it is the ONLY
# thing still open about the count. Do not infer the tenth from the aliases: Spirit folds to Will and
# Perception folds to Attunement by the rows below, so neither is a candidate slot.
# Until the tenth is named, "IN FLUX" stays and Godot fields stay unbound (CLAUDE.md §5). ED-IN-0193.
# ============================================================================
attributes:
  scale: "1-7"
  default: 1
  body:
    - {key: attr.body.strength,  name: Strength,  aliases: []}
    - {key: attr.body.endurance, name: Endurance, aliases: [Vitality]}
    - {key: attr.body.agility,   name: Agility,   aliases: [Dexterity]}
  mind:
    - {key: attr.mind.focus,  name: Focus,  aliases: []}
    - {key: attr.mind.acuity, name: Acuity, aliases: [Reasoning, Cognition]}   # [ASSUMPTION] legacy 'Cognition' folds to Acuity -- Jordan veto
    - {key: attr.mind.will,   name: Will,   aliases: [Spirit]}                  # 'spirit move': formerly standalone Spirit; legacy formulas resolve via alias
  social:
    - {key: attr.social.attunement, name: Attunement, aliases: [Perception]}
    # `Influence` is not an attribute (it was `fac.influence`'s name); see names_index.yaml.
    - {key: attr.social.charisma,   name: Charisma,   aliases: [Presence]}
    - {key: attr.social.bonds,      name: Bonds,      aliases: [Sincerity, Affability]}

# AGGREGATES (W2.8 PLACEHOLDERS) -- computed from category members; NOT yet wired into derived values.
aggregates:
  entries:
    - {key: agg.body,   name: Body,   compute: sum, members: [attr.body.strength, attr.body.endurance, attr.body.agility], status: placeholder}
    - {key: agg.mind,   name: Mind,   compute: sum, members: [attr.mind.focus, attr.mind.acuity, attr.mind.will],          status: placeholder}
    - {key: agg.social, name: Social, compute: sum, members: [attr.social.attunement, attr.social.charisma, attr.social.bonds], status: placeholder}
  # Placeholders only: R7 + derived_stats §14 remain authoritative for derived values.

# ============================================================================
# PRACTITIONER stats (actor/thread-practitioner).
# ============================================================================
practitioner_stats:
  source: "engine/params/threadwork.md; references/glossary.md (Thread Practitioner Stats)"
  entries:
    - {key: prac.thread_sensitivity, name: Thread Sensitivity, aliases: [TS], scale: "0-100+"}
    - {key: prac.tps, name: Thread Pool Score, aliases: [TPS], derived_from: prac.thread_sensitivity, formula: "floor(TS / 10)"}

# ============================================================================
# TERRITORY/PROVINCE stats: a distinct scale from settlement_stats below.
# ============================================================================
territory_stats:
  source: "engine/params/bg/geography.md; systems/settlements/reference/settlement_layer_v30.md (Fort Level)"
  entries:
    - {key: terr.fort_level, name: Fort Level, aliases: [Fort], scale: "0-4"}

# ============================================================================
# FACTION stats: RETIRED at plan position `29b`; no `fac.*` descriptor block exists here (a declared field that
# reaches no reader is not declared, architecture/meta/01_AXIOMS.md ID-13). The block is in git at
# `5c5d8ec6:references/descriptor_registry.yaml`. `set.legitimacy` (settlement_stats below) is unaffected.
# ============================================================================

# ============================================================================
# SETTLEMENT stats (settlement domain).
# ============================================================================
settlement_stats:
  source: "systems/settlements/reference/settlement_layer_v30.md §1.8"
  entries:
    - {key: set.legitimacy,      name: Legitimacy,       scale: "0-7"}
    - {key: set.popular_support, name: Popular Support,  scale: "0-7"}
    - {key: set.prosperity,      name: Prosperity,       scale: "0-5"}
    - {key: set.defense,         name: Defense,          scale: "0-5"}
    - {key: set.order,           name: Order,            scale: "0-5"}
    - {key: set.facility_tier,   name: Facility Tier,    aliases: [FacilityTier, FacilityTier_s], scale: "0-3", source: "systems/settlements/reference/settlement_layer_v30.md §1.8 line 162"}   # distinct from `terr.fort_level`; derived companion `settlement_weight` is under not_descriptors

# ============================================================================
# CATEGORY-B SCALARS. These are POINTER REGISTRATIONS ONLY -- they name each scalar and cite its canonical
# home (a `state:` row in references/module_contracts.yaml, itself pointing at the defining
# design doc), they do NOT define a formula, scale, or Godot resource binding here. Per the
# roster-IN-FLUX warning (CLAUDE.md §5, derived-stat schema IN FLUX): do not bind Godot resource
# fields to these keys yet -- resolve the live value through the cited contract row / design doc,
# never by re-deriving it from this entry.
# ============================================================================
category_b_scalars:
  entries:
    - {key: pc.wounds, kind: personal_track, name: Wounds, scope: actor,
       source: "references/module_contracts.yaml personal_combat state: :870 (bucket: track, writable: true) -- systems/combat/combat_engine_v1/ (ED-1041 bilateral-Ob wounds)"}
    - {key: pc.poise, kind: personal_track, name: Poise, scope: actor,
       source: "references/module_contracts.yaml personal_combat state: :873 (bucket: track, writable: true) -- systems/combat/combat_engine_v1/ (kuzushi/structure, full port pending -- combat.poise module PENDING)"}
    - {key: pc.initiative, kind: personal_track, name: Initiative, scope: actor,
       source: "references/module_contracts.yaml personal_combat state: :872 (bucket: track, writable: true) -- systems/combat/combat_engine_v1/ (Vor/Nach, full port pending -- combat.initiative module PENDING)"}
    - {key: prov.turmoil, kind: personal_track, name: Turmoil, scope: territory,
       source: "references/module_contracts.yaml peninsular_strain state: :548 (bucket: clock, writable: true) -- systems/overview/reference/peninsular_strain_v30.md §4, scale 0-10 (clock_registry)"}
    - {key: set.accord, kind: personal_track, name: "province Accord", scope: settlement,
       source: "references/module_contracts.yaml settlement_layer state: :598 (bucket: derived_value, writable: false) -- systems/settlements/reference/settlement_layer_v30.md §1.3 (floor(mean Order across settlements)); [CORRECTION] the lane prompt's '§5.5' citation does not resolve in the source doc (no §5.5 heading exists) -- §1.3 is the actual Accord-derivation section, confirmed in-tree."}
    - {key: fac.coup_posture, kind: personal_track, name: "Coup posture", scope: faction,
       source: "references/module_contracts.yaml faction_politics state: :776 (bucket: track, writable: true) -- systems/factions/reference/faction_politics_v30.md §1.1d/§2.1 Coup Counter (numeric mechanics deferred per §10.1 ED-POL-09; declared W3/ED-IN-0096 with the state row it names)"}
    - {key: fac.succession_status, kind: personal_track, name: "Succession status", scope: faction,
       source: "references/module_contracts.yaml faction_politics state: :777 (bucket: track, writable: true) -- systems/factions/reference/faction_politics_v30.md §1.0 SUC-01-03/LIN-01-04 + §6 Baralta outcomes (declared W3/ED-IN-0096 with the state row it names)"}
    - {key: clock.season_counter, kind: personal_track, name: "season counter", scope: environment,
       source: "references/module_contracts.yaml engine_clock state: :745 (bucket: clock, writable: true, [ASSUMPTION]) -- doc: is null (home doc unresolved, ED-1051 open). FORK-3 GATE: engine_clock is fork-3-gated (ED-1051, sole T0) -- this registration is a pointer only and does NOT assert the module is live or that its consumer set is closed; re-check fork 3's resolution before treating this entry as more than a name+pointer."}
  note: >
    Registrations, not schema bindings (see section header). Bucket values (track / clock /
    derived_value) are transcribed from the cited module_contracts.yaml row for orientation only
    -- module_contracts.yaml remains the authoritative bucket source; if the two ever disagree,
    module_contracts.yaml wins and this entry is stale (re-sync on discovery).

# ============================================================================
# CONVICTION ROSTER -- ENUMERATED HERE, because a roster stated only in prose is one no code can read (CLAUDE.md 0.05).
# ============================================================================
# Exported into `engine/engine_params/descriptors.json` behind the existing blocking `--check`, and read by
# `engine/substrate/descriptors.py`; every subsystem reads that leaf. One roster, one home: edit it HERE.
conviction_roster:
  source: "systems/characters/reference/conviction_taxonomy_v30.md §2"
  count: 13
  names:
    - Faith        # devotion to ecclesiastical authority and theological order
    - Authority    # deference to and assertion of legitimate command
    - Order        # procedural correctness, rule-following, institutional regularity
    - Scholastic   # reasoned inquiry, learning, scholarly method
    - Utility      # effectiveness, results, instrumental judgment
    - Equity       # fairness across station; relief of injustice
    - Liberty      # self-determination, freedom from imposed authority
    - Precedent    # reverence for ancestral practice
    - Community    # belonging to the immediate community; common life
    - Identity     # membership in a categorical group; tribe, lineage, faction
    - Warden       # stewardship of the dependent and the vulnerable
    - Virtue       # cultivation of moral character
    - Honor        # pledged oath, honor-code, reputation as binding

# ----------------------------------------------------------------------------
# THE FOUR ETHICAL AXES -- enumerated here for the same reason the Convictions are: one roster, read through
# `engine/substrate/descriptors.py`, so a fifth axis or a rename is ONE edit every reader sees. `by_reference`
# below still carries the `axis.*` row for the axis SEMANTICS; what is here is the NAME SET code compares against.
#
# ⚠ THE ORDER IS SEMANTIC AND IS `keys.py`'s, EXACTLY. `engine/season/decision/choose.py` sums
# over this set per candidate; a projection matrix column is keyed by name, so a reorder is safe
# for scoring and unsafe for anything that zips two axis vectors positionally. Keep it stable.
#
# ⚠ A FIFTH AXIS IS PERMITTED BUT DEFERRED. `key_substrate_v30.md` §2.4: *"A 5th axis is permitted
# as a Class B extension if Stage 10 calibration finds the simplification load-bearing; treat as
# deferred unless required."* Adding one here is now ONE edit that both readers see.
axis_roster:
  source: "systems/_architecture/reference/key_substrate_v30.md §2.4 / conviction_axis_matrix_v30.md / PP-687"
  count: 4
  scale: "[-1,+1] basis"
  names:
    - hierarchical   # + rank-bearing, status-asserting · - egalitarian, peer-levelling
    - sacred         # + numinous, oath-binding · - secular, contractually bounded
    - instrumental   # + end-justifies-means, calculative · - principled, deontological
    - traditional    # + precedent-respecting, ancestral · - progressive, reformist

# ============================================================================
# REGISTERED BY REFERENCE -- authoritative content stays in the source doc (no re-transcription).
# ============================================================================
by_reference:
  - {key: "conv.*",  kind: conviction_weight,    name: "13 Convictions",                                         scale: "0-1 weight (vector)", scope: "actor + faction", source: "systems/characters/reference/conviction_taxonomy_v30.md §2"}
  - {key: "axis.*",  kind: ethical_axis,         name: "4 ethical axes (hierarchical/sacred/instrumental/traditional)", scale: "[-1,+1] basis",       source: "systems/characters/reference/conviction_axis_matrix_v30.md / PP-687"}
  - {key: map.conviction_axis, kind: conviction_axis_map, name: CONVICTION_AXIS_MATRIX,                           shape: "13x4",                source: "systems/characters/reference/conviction_axis_matrix_v30.md §2"}
  - {key: orient.self_other,   kind: orientation_scalar,  name: "Self-Other Orientation",                         scale: "[-1,+1]",             source: "systems/characters/reference/conviction_taxonomy_v30.md §3"}
  - {key: "style.*", kind: contest_style,        name: "Contest styles (Precedent/Suppression/Vision/Insinuation = Memory|Projection x Revealing|Obscuring)", effect: "style bonus die", source: "systems/social_contest/reference/social_contest_v30.md (Step 2-3)"}
  - {key: "temp.*",  kind: temperament_type,     name: "5 territory temperaments",                               value: "alpha (outcomes) + beta (conduct) weights", scope: "territory/faction (pop-weighted avg)", source: "systems/settlements/reference/territory_temperaments_v30.md §3.4.1"}
  - {key: template.cultural_background, kind: template, name: "Cultural Background Templates (conviction-distribution presets)", source: "systems/characters/reference/conviction_taxonomy_v30.md §5"}

# ============================================================================
# DEPRECATED.
# ============================================================================
deprecated:
  - {key: resonance_style, reason: "Was the 'most-persuasive mode of argument'. Superseded by contest_style (social_contest Step 2-3) + Conviction-driven interpretation. Never canonically enumerated (player_agency §2 references but does not define it). Retired 2026-06-06 (Jordan). ⚠️ CORRECTION (ED-IN-0025, 2026-07-07, C-VERIFY-20): the 'never canonically enumerated' premise is factually FALSE — npc_behavior_v30.md §1.3's Resonant Style Taxonomy is CANONICAL (approved 2026-04-17) and player_agency_v30.md:71 treats it as live, bidirectional, load-bearing. Whether the retirement should stand given this is a Jordan design call (NEEDS-JORDAN), not re-litigated here; retirement status left unchanged."}

# ============================================================================
# NOT DESCRIPTORS -- computed/bounded runtime containers (derived_stats §14). Listed so consumers
# do not mistake them for registry-bound descriptors.
#
# ============================================================================
not_descriptors:
  derived_values: [Health, Stamina, Composure, Concentration, Thread Fatigue, Resolve, Garrison Strength, Local Economy, Mandate, Wound Interval, Max Wounds, Face, TroopCount, "Legitimacy (faction, derived)", Treasury, Levies Available, Reputation, "Discipline (faction)", Intelligence Holdings, Public Order, Settlement Weight]
  tracks:  [Piety, Disposition, Renown, Standing, Persuasion, Coherence, Warden Recognition]
  clocks:  [Evidence, CI, MS, IP]
  pools:   [Combat, Argue, Thread, Fieldwork, Knot, MassCombat, FactionDomain, Political Pool]
  # Name collisions to know: "Legitimacy (faction, derived)" is Mandate x 20, distinct from `set.legitimacy`;
  # "Discipline (faction)" is Stability x 10, distinct from the mass-battle Discipline stat (display label ratified OPT-AV-18: prefer "Faction Discipline" in new UI/prose); "Coherence" is a
  # `track`; "Political Pool" is the parliamentary vote-tally construct. Derivation specs: derived_stats §14.1.

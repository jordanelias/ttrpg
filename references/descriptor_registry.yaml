# ============================================================================
# FACTION stats (actor/faction).
#
# TWO JORDAN RULINGS, 2026-08-23, and they change this block's shape rather than a number in it:
#
#   1. "LEGITIMACY IS A BASE." `fac.legitimacy` joins the roster as a BASE descriptor. It was the
#      one Faction field the code carried and this registry did not declare -- written by 20 of
#      `Faction.adjust`'s 31 non-test call sites -- and its status was the open question this file
#      recorded as `unimplemented.faction_L` for six weeks. It is answered: base, not derived.
#   2. "INFLUENCE CAN BE 0." This SUPERSEDES the floor of 1 that ED-IN-0029 ratified on
#      2026-07-08 (OPT-AV-14/D14, rationale "never fully vanishes institutionally"). All six
#      faction stats now floor at 0.
#
# JORDAN'S RATIONALE, recorded because it is what makes the first ruling coherent rather than a
# reversal: "now that we're using continuous, we don't have to worry near as much either as we can
# just aggregate these stats as opposed to weird derivations." The continuous engine removes the
# pressure that produced derived-stat machinery in the first place -- a quantity that has to be
# reconstructed from a formula can instead just be carried and aggregated.
#
# ⚠ MANDATE IS STILL DERIVED, AND IT IS NOT THIS. Mandate is the size-weighted aggregate of
# settlement L/PS (settlement_layer §1.8); `fac.legitimacy` is a faction-scale base stat. The code
# field `Faction.L` has served as BOTH at different times -- `parliamentary_bridge` still comments
# "Mandate == Faction.L pre-LPS-1" -- and that conflation is older than these rulings and is not
# resolved by them. What IS resolved: the field is a declared base descriptor with declared bounds.
#
# PRIOR RULING IN TENSION, recorded rather than quietly overwritten (2026-05-30, faction_canon_v30
# :243): "the 6-stat faction lineup is correct -- L and PS are per-territory, not faction stats."
# That ruling was about the SETTLEMENT-scale L/PS pair under LPS-1. Today's is about the faction
# field the engine actually carries and mutates. A future session that finds both should read them
# in that order, and `set.legitimacy` (settlement_stats below, 0-7) remains a separate descriptor.
#
# Per-entry floor/ceiling first RATIFIED 2026-07-08 (ED-IN-0029, OPT-AV-14/D14 + OPT-AV-18): the
# prior blanket "1-7" scale had lost the per-stat floor table in engine/params/bg/core.md §Stat
# Ceilings and Floors.
#
# LEGITIMACY'S FLOOR OF 0 IS RULED (Jordan, 2026-08-23: "floor ruling 0"). It is no longer an
# inference, and the value did not change -- the ruling CONFIRMS what shipped on 2026-08-22, so no
# golden moves and none was re-recorded. The question is closed; do not reopen it as open.
#
# THE HISTORY IS KEPT BECAUSE IT IS A WORKED EXAMPLE, not because the matter is unsettled. The first
# version of this note claimed "OPT-AV-18's DEFAULT for a stat with no independently-declared floor
# is 0 -- that is how Intel was ratified", i.e. that a standing default supplied the number. Checked,
# and retracted: the docket's per-item outcomes live in
# `designs/audit/2026-07-08-attribute-value-coherence-audit/ed_options.md`, which is EVACUATED and
# not on this tree, and the reachable summary records the OPPOSITE posture for an item with no
# declared bound -- `registers/handoffs/HANDOFF_IN.md` notes OPT-AV-13 and OPT-AV-18's Renown-cap
# sub-item were "left explicitly open -- no default stated, none invented". Intel's floor was
# EXPLICITLY ratified (the "Intel-floor naming" sub-item), which is a different fact from a default
# having supplied it. The lesson survives the ruling: a session had reached the right number by the
# wrong route, and dressing a choice as a precedent is the failure mode, not the number.
#
# What a session had to say before the ruling, and the shape a pending item should take: after
# Jordan's "Influence can be 0", every other faction stat floors at 0, so 0 made the roster uniform
# and introduced no new distinction -- an argument for a default, not a ratification of one.
# ============================================================================
faction_stats:
  source: engine/params/factions/stats_1_7_scale.md
  entries:
    - {key: fac.influence,  name: Influence,  scale: "0-7"}   # floor 1 -> 0, Jordan 2026-08-23 ("Influence can be 0"), superseding ED-IN-0029/OPT-AV-14
    - {key: fac.legitimacy, name: Legitimacy, scale: "0-7"}   # BASE descriptor AND floor 0, both RULED by Jordan 2026-08-23. The floor is his, not OPT-AV-18's default -- that justification was retracted (see the note above) before he ruled
    - {key: fac.wealth,     name: Wealth,     scale: "0-7"}
    - {key: fac.military,   name: Military,   scale: "0-7"}
    - {key: fac.intel,      name: Intel,      scale: "0-7"}   # floor ratified 2026-07-08, OPT-AV-18 (no prior declared floor anywhere)
    - {key: fac.stability,  name: Stability,  scale: "0-7"}
  note: "SIX base faction stats as of 2026-08-23. Mandate remains a size-weighted derived aggregate of settlement L/PS (settlement_layer §1.8) -- NOT a base attribute and NOT the same thing as fac.legitimacy."


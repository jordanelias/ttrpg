# names_index.yaml — UNIFIED NAMES INDEX (the one place a definition's name lives).
#
# One place a definition's name lives; rename HERE, never in a consumer.
# History and discussion: references/names_index_history.md
#
# HOW IT IS READ (one source, many readers — all via tools/names.py):
#   * tools/ci_naming_check.py   — hard gate; flags any `legacy` name of an `enforce: block` entry.
#   * tools/ci_naming_check.py --warn — report-only drift lint; flags `legacy` names of `enforce: warn`
#                                 entries. Same tool, same rule, other tier (merged 2026-08-23, S6/D2).
#   * tools/ci_names_consistency.py — asserts the mirror name fields in descriptor_registry.yaml /
#                                  proper_noun_registry.yaml still match the `canonical` here.
#
# ENTRY SCHEMA:
#   <dotted.key>:
#     canonical: <the ONE display string>
#     aliases:   [<allowed equivalent phrasings — not errors>]
#     legacy:    [<deprecated names that must NOT appear in active docs>]
#     category:  attribute | aggregate | faction_stat | settlement_stat | clock |
#                track | mechanic | mass_combat_stat | substrate | proper_noun |
#                conviction | pressure_point   (new 2026-07-21, Reconciliation R2 / ED-IN-0082)
#     enforce:   block | warn
#                  block = hard CI gate (ci_naming_check) — naming invariants.
#                  warn  = report-only drift lint (ci_naming_check --warn) until triaged, then flipped.
#                  ⚠ NOTHING VALIDATES THIS FIELD. `tools/names.py: all_legacy` does
#                  `e.get('enforce', 'warn')` and filters by exact string, so an unknown value or a
#                  typo silently reads as neither tier. Spell one of the two.
#     context:   [<regex terms>]  — OPTIONAL. When the `canonical` display collides with a
#                  common English word (Faith / Order / Reason / …), the disambiguation terms
#                  that must co-occur for a prose hit to count as THIS definition. The single
#                  home for the §3.5 disambiguation gate — vector_audit reads it FROM here
#                  (CLAUDE.md §8), migrated verbatim from the prior hardcoded SEED table so P2
#                  stays byte-identical. Terms are Python regex fragments (word-boundaried).
#
# MIRRORS (consistency-checked by tools/ci_names_consistency.py):
#   attr.* / agg.* / fac.* / set.*  -> references/descriptor_registry.yaml
#   world.* (and other proper nouns) -> references/proper_noun_registry.yaml
# Mechanic/clock/track legacy entries are seeded from references/deprecated_terms_registry.yaml
# and references/synonym_registry.yaml; they drive the drift lint + rename, not a mirror.
#
# `world.*` rows are warn-tier and generated from proper_noun_registry.yaml; ci_names_consistency
# keeps the pair agreeing. Flipping `warn -> block` per entry is done as each is triaged.

# ── NAMESPACE PREFIXES (id ↔ silo table; Reconciliation Program §3.2) ─────────────────
# Every id's first dotted segment is a namespace prefix bound to ONE class/silo. Engine and
# pre-existing ids WIN any conflict; references/name_collision_database.yaml stays the
# historical silo authority. Existing prefixes are kept as-is; NEW prefixes are added only for
# classes that lacked one. Key-family prefixes used in module_contracts (scene. da. env.
# mechanical. …) are the engine's own and are NOT re-homed here.
#   attr.      character attribute            (mirror: descriptor_registry.yaml)   [existing]
#   agg.       attribute aggregate            (mirror: descriptor_registry.yaml)   [existing]
#   fac.       faction stat                   (mirror: descriptor_registry.yaml)   [existing]
#   set.       settlement stat                (mirror: descriptor_registry.yaml)   [existing]
#   world.     proper noun (place/person/org) (mirror: proper_noun_registry.yaml)  [existing]
#   clock.     named clock                                                          [existing]
#   mass.      mass-combat stat                                                     [existing]
#   thread.    threadwork mechanic                                                  [existing]
#   substrate. Key substrate primitive                                             [existing]
#   conv.      character conviction (the 7-axis class)                              [NEW 2026-07-21]
#   ppt.       social-contest pressure point (the 4-axis class)                     [NEW 2026-07-21]
#   mech.      strategic-layer mechanic (Disposition/Standing/Stability/Mandate/…)  [NEW 2026-07-22]
# An entry MAY also carry `token_class: <cls>` (audit vocabulary class) distinct from its naming
# `category` — e.g. a world.* proper_noun tagged `token_class: faction`, or a mech.* tagged
# `token_class: mech` — so the vector-audit CLASSES roster + §3.5 disambiguation live here (§8)
# without disturbing the category/mirror. `scale:` overrides the audit scale when it differs.
# Reserved for the R2 migration wave (authored as entries land, not pre-populated):
#   npc.  named character · place.  location · org.  organisation/order
#   ppl.  people/populace group · concept.  design concept · act.  performable action verb
# ID-form tokens ([[conv.faith]]) are resolved to display by tools/tag_normalizer.py and are
# EXCLUDED from prose matching (A6 / perf).
version: 3

entries:

  # ── ATTRIBUTES (mirror: descriptor_registry.yaml attributes; scalar 1-7) ──────
  attr.body.strength:    {canonical: Strength,   aliases: [],                     legacy: [], category: attribute, enforce: warn}
  attr.body.endurance:   {canonical: Endurance,  aliases: [Vitality],             legacy: [], category: attribute, enforce: warn}
  attr.body.agility:     {canonical: Agility,    aliases: [Dexterity],            legacy: [], category: attribute, enforce: warn}
  attr.mind.focus:       {canonical: Focus,      aliases: [],                     legacy: [], category: attribute, enforce: warn}
  attr.mind.acuity:      {canonical: Acuity,     aliases: [Reasoning, Cognition], legacy: [], category: attribute, enforce: warn}
  attr.mind.will:        {canonical: Will,       aliases: [Spirit],               legacy: [], category: attribute, enforce: warn}
  attr.social.attunement: {canonical: Attunement, aliases: [Perception],          legacy: [], category: attribute, enforce: warn}
  # `Influence` is deliberately NOT an alias here: it is the roll stat's own name, not Charisma's.
  attr.social.charisma:  {canonical: Charisma,   aliases: [Presence],  legacy: [], category: attribute, enforce: warn}
  attr.social.bonds:     {canonical: Bonds,      aliases: [Sincerity, Affability], legacy: [], category: attribute, enforce: warn}

  # ── AGGREGATES (mirror: descriptor_registry.yaml aggregates; placeholders) ────
  agg.body:   {canonical: Body,   aliases: [], legacy: [], category: aggregate, enforce: warn}
  agg.mind:   {canonical: Mind,   aliases: [], legacy: [], category: aggregate, enforce: warn}
  agg.social: {canonical: Social, aliases: [], legacy: [], category: aggregate, enforce: warn}

# ── CONVICTIONS (the 7-axis character conviction class) ──
# `context` is the §3.5 disambiguation gate; vector_audit reads it FROM here. enforce: warn — every
# display collides with a common word. Single-quoted so YAML keeps the regex backslashes literal.
  conv.faith:      {canonical: Faith,      aliases: [], legacy: [], category: conviction, enforce: warn, context: ['\bConviction\b', '\bFramework\b', '\bDivine\b', '\bChurch\b', '\bCardinal\b', '\bdoctrine\b']}
  conv.order:      {canonical: Order,      aliases: [], legacy: [], category: conviction, enforce: warn, context: ['\bConviction\b', '\bFaith\b', '\bAutonomy\b', '\bReason\b', '\bEquity\b']}
  conv.reason:     {canonical: Reason,     aliases: [], legacy: [], category: conviction, enforce: warn, context: ['\bConviction\b', '\bFaith\b', '\bOrder\b', '\bAutonomy\b']}
  conv.equity:     {canonical: Equity,     aliases: [], legacy: [], category: conviction, enforce: warn, context: ['\bConviction\b', '\bRestoration\b']}
  conv.precedent:  {canonical: Precedent,  aliases: [], legacy: [], category: conviction, enforce: warn, context: ['\bConviction\b', '\bHafenmark\b', '\blegal\b']}
  conv.autonomy:   {canonical: Autonomy,   aliases: [], legacy: [], category: conviction, enforce: warn, context: ['\bConviction\b', '\bVarfell\b', 'L[oö]wenritter']}
  conv.continuity: {canonical: Continuity, aliases: [], legacy: [], category: conviction, enforce: warn, context: ['\bConviction\b', '\bRestoration\b']}

# ── PRESSURE POINTS (the 4-axis social-contest class) ──
# Same shape as convictions; vector_audit sources CLASSES['pressure_point'] + the SEED tokens FROM here.
  ppt.evidence:    {canonical: Evidence,    aliases: [], legacy: [], category: pressure_point, enforce: warn, context: ['\bPressure Point\b', '\bInvestigation\b', '\bEvidence Track\b']}
  ppt.consequence: {canonical: Consequence, aliases: [], legacy: [], category: pressure_point, enforce: warn, context: ['\bPressure Point\b', '\bConsequentialist\b']}
  ppt.authority:   {canonical: Authority,   aliases: [], legacy: [], category: pressure_point, enforce: warn, context: ['\bPressure Point\b', '\bAuthority Challenge\b', '\binstitutional\b']}
  ppt.loyalty:     {canonical: Loyalty,     aliases: [], legacy: [], category: pressure_point, enforce: warn, context: ['\bPressure Point\b', '\bKnot\b', '\brelational\b']}

# ── MECHANICS (strategic-layer mechanic tokens) ──
# Namespaced ids keep a generic "Stability"/"Mandate"/"Standing" collision-safe — author with
# [[mech.stability]]. token_class: mechanic sources `patterns` into the audit.
  mech.disposition: {canonical: Disposition, aliases: [], legacy: [], category: mechanic, token_class: mech, scale: mechanic, enforce: warn, patterns: ['\bDisposition\b']}
  mech.standing:    {canonical: Standing,    aliases: [], legacy: [], category: mechanic, token_class: mech, scale: mechanic, enforce: warn, patterns: ['\bStanding\b']}
  mech.stability:   {canonical: Stability,   aliases: [], legacy: [], category: mechanic, token_class: mech, scale: mechanic, enforce: warn, patterns: ['\bStability\b']}
  mech.mandate:     {canonical: Mandate,     aliases: [], legacy: [], category: mechanic, token_class: mech, scale: mechanic, enforce: warn, patterns: ['\bMandate\b']}
  mech.tensions:    {canonical: Tensions,    aliases: [], legacy: [], category: mechanic, token_class: mech, scale: mechanic, enforce: warn, patterns: ['\bTensions\b']}


  # ── CLOCK TRACKS (abbreviation audit tokens; new 2026-07-22, R2 namespacing / ED-IN-0082) ──
  # clock.<abbr> ids for the 6 peninsular clocks (full-name clock.church_influence etc. stay
  # separate). token_class clock_track so the 2 existing full-name clock.* aren't pulled.
  clock.ms: {canonical: "MS", aliases: [], legacy: [], category: clock, token_class: clock, scale: clock, enforce: warn, patterns: ['\bMS\b(?![A-Za-z])', 'Mending Stability']}
  clock.ci: {canonical: "CI", aliases: [], legacy: [], category: clock, token_class: clock, scale: clock, enforce: warn, patterns: ['\bCI\b(?![A-Za-z])', 'Church Influence']}
  # `patterns:` is a matcher list, not a definition: canonical expansion FIRST, recorded rival SECOND.
  clock.ip: {canonical: "IP", aliases: [], legacy: [], category: clock, token_class: clock, scale: clock, enforce: warn, patterns: ['\bIP\b(?![A-Za-z])', 'Institutional Pressure', 'Invasion Pressure']}
  # Same shape: canonical (`Public Instability`) first, rival second.
  clock.pi: {canonical: "PI", aliases: [], legacy: [], category: clock, token_class: clock, scale: clock, enforce: warn, patterns: ['\bPI\b(?![A-Za-z])', 'Public Instability', 'Political Instability']}
  clock.ts: {canonical: "TS", aliases: [], legacy: [], category: clock, token_class: clock, scale: clock, enforce: warn, patterns: ['\bTS\b(?![A-Za-z])', 'Thread Sensitivity']}
  clock.tcv: {canonical: "TCV", aliases: [], legacy: [], category: clock, token_class: clock, scale: clock, enforce: warn, patterns: ['\bTCV\b']}

  # ── FACTION STATS: RETIRED. No `fac.*` rows: a mirror row with no `descriptor_registry.yaml`
  # entry is refused by tools/ci_names_consistency.py. `Legitimacy` is `set.legitimacy` alone. ──


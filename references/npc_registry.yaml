# VALORIA — Named Character Registry
# Canonical source of truth for ALL named characters.
# Every named NPC, faction leader, royal family member, or arc character gets an entry.
#
# ENFORCEMENT: No character name may appear in design docs without an entry here.
# Each `convictions:` entry's `conviction:` value is a PURSUIT from
# `references/descriptor_registry.yaml: pursuit_roster` (fifteen; ED-IN-0261), read through
# `engine/season/data/cast.py::pursuits_of`, which RAISES on any other name. The values were
# migrated in IN-08's cells commit by the retired pursuit-cells draft's §4.1 rule and §4.3 table
# (folded into the build, Jordan 2026-10-06, RS-1); weights are carried, never renormalised, and
# two names that collapse into one pursuit add. Three weights had no successor and no text to read
# one from and are DROPPED, not homed: NPC-033 Utility .30, NPC-086 Utility .20 (§4.3's own drops)
# and NPC-089 Identity .50 (§4.3 left it to Jordan; dropped on the same precedent) [ASSUMPTION].
#
# ED-IN-0293 (the user, 2026-10-14: every NPC holds a full pursuit vector and a conviction on
# Einhir, Altonia and the Church): every row's `convictions.primary` names ALL FIFTEEN pursuits.
# The weights authored before it are kept unchanged and listed first; the ones it added follow,
# small unless the row's own text warrants more. Every row also carries `affiliations:`, holding a
# Church member (`solmund_orthodoxy` and/or `inner_tradition`), `einhir_restoration` and
# `altonian_civics`; the comment on each row's `affiliations:` line states its basis. The scale has
# no AGAINST direction: a 0 is a considered REJECTION of the pole, kept as a present key (IN-63), so
# an opponent the row's comment names holds 0 (re-encoded from the producer's "present but low (1)"
# at v9 IN-64); a 1 is a pole held weakly, not opposed. THE WHOLE AUTHORING IS [ASSUMPTION; medium;
# Jordan to correct]. `engine/season/data/cast.py` refuses a row naming fewer than the fifteen, or
# holding no member of a concern (`descriptor_registry.yaml: affiliation_roster.concerns`).
#
# Stats and skill scores are authored (BA1.01, `IS-A-11` table (a), uncorrected) for the rows the draft grounds;
# a row it does not ground keeps `stats: null`.
# History and discussion: references/npc_registry_history.md

schema:
  required: [id, faction, role, status]
  optional: [heritage, lifepath, ts, stats, convictions, affiliations, title, capabilities, resonant_style, manner, relations, unaware]
  # B04.12: `engine/season/data/cast.py` reads `required` + `optional` as the keys a row may carry THAT A READER TAKES BY NAME, and
  # REFUSES any other, except the keys it declares unread (`cast.UNREAD_KEYS`, the one list: authored prose and threadwork's tracks
  # that no engine code reads -- `first_name`, `last_name`, `age`, `birthplace`, `territory`, `goals`, `notes`, `source`, `certainty`,
  # `coherence`). A key leaves `UNREAD_KEYS` by gaining a reader (and joining this block) or by leaving the registry.
  # `heritage:` (v10 CR-30) is one of `references/descriptor_registry.yaml: heritage_roster`, read by
  # `engine/season/data/cast.py::heritage_of` into `Person.heritage`, which RAISES on any other value. Authored
  # ONLY where canon names the person's descent or the row's own `birthplace:` states it; silence is no key.
  # `lifepath:` (v10 CR-33) is one of the 34 ids of `engine/season/rosters.yaml: lifepaths` (`3-CR1` ... `3-CF6`),
  # expanded by `engine/season/data/cast.py::capability_of` into `Person.capability` entries (the capability keys the
  # lifepath's template names, each at `pool_default`); the id itself is stored on no Person. Authored ONLY where the
  # row's own text (role, notes) names or clearly states one of the 34; silence is no key. It is NOT `vocation:` --
  # in code "vocation" names a capability key.
  # `stats:` (the ten attributes, v10 CR-20) reads through `cast.py::attributes_of`; legacy spellings resolve.
  # `manner:` (B10.58, A-108) is `{<axis>: <number>}`, a person's own stored offset on a manner axis, over `engine/season/rosters.yaml: manner_offset_axes`, each within
  # `+-Fixtures.manner_offset_bound`; read by `cast.py::manner_offset_of` into `Person.manner_offset`, which RAISES on any other axis or a value outside the bound. No row
  # authors one where the IS-A-11 draft's `manner:` cell is filled (BA1.02); silence is no key. Sign: negative = the axis name's first pole (`descriptor_registry.yaml: axis_roster`).
  # `relations:` (B10.62) is a list of `{to: <registry case id>, ground: <a `engine/season/rosters.yaml: relation_grounds` member>, valence: -1 or +1,
  # weight: <whole number 0-5>}`, read by `engine/season/data/cast.py::relations_of`, which RAISES on an unknown id, ground or valence and on a weight outside the
  # stance row's own bound. A relation is authored on the side that HOLDS it: a symmetric one is two rows, one on each person, and they need not agree. At build
  # `boot/realm.py::seed_relations` gives the holder a stance row `(<to's person id>, valence, weight)` and his own `bond:<ground>` claim about `to`. No row authors one
  # yet (the cast content pass's, BA1); silence is no key.
  # `unaware:` (B10.64, A-34) is a list of keys the person does not know of himself, each a member of `engine/season/data/rosters.py::SELF_BELIEVED` (`engine/season/rosters.yaml:
  # self_believed` and the pursuit roster) that the row itself holds (a pursuit in `convictions:`, the gift in `ts:`), read by `engine/season/data/cast.py::unaware_of`, which RAISES
  # on any other key. A marked key is read from the person's own `self:<key>` claim and not from the field (`queries/person_q.py::knows_self`). No row authors one yet (the cast
  # content pass's, BA1); silence is no key.
  # `affiliations:` (IN-08 H10) is `{<affiliation>: <int 0-5>}` over
  # `references/descriptor_registry.yaml: affiliation_roster` -- the person's religious affiliations
  # and, since ED-IN-0293, `altonian_civics` (the political structure they want), read by
  # `engine/season/data/cast.py::conviction_of` into `Person.conviction`. NOT `convictions:`,
  # which holds pursuits. Every row carries it (ED-IN-0293), with a member of each concern
  # (`affiliation_roster.concerns`); an int 0-5 per pole, 0 a considered rejection (IN-63).


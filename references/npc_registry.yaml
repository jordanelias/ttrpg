# VALORIA — Named Character Registry
# Canonical source of truth for ALL named characters.
# Every named NPC, faction leader, royal family member, or arc character gets an entry.
#
# ENFORCEMENT: No character name may appear in design docs without an entry here.
# Each `convictions:` entry's `conviction:` value is a PURSUIT from
# `references/descriptor_registry.yaml: pursuit_roster` (fifteen; ED-IN-0261), read through
# `engine/season/data/cast.py::pursuits_of`, which RAISES on any other name. The values were
# migrated in IN-08's cells commit by `candidate_pursuit_cells.md` §4.1's rule and §4.3's table
# (folded into the build, Jordan 2026-10-06, RS-1); weights are carried, never renormalised, and
# two names that collapse into one pursuit add. Three weights had no successor and no text to read
# one from and are DROPPED, not homed: NPC-033 Utility .30, NPC-086 Utility .20 (§4.3's own drops)
# and NPC-089 Identity .50 (§4.3 left it to Jordan; dropped on the same precedent) [ASSUMPTION].
#
# ED-IN-0293 (the user, 2026-10-14: every NPC holds a full pursuit vector and a conviction on
# Einhir, Altonia and the Church): every row's `convictions.primary` names ALL FIFTEEN pursuits.
# The weights authored before it are kept unchanged and listed first; the ones it added follow,
# small unless the row's own text warrants more. Every row also carries `affiliations:`, holding a
# Church member (`solmund_orthodoxy` and/or `inner_tradition`), `einhir_restoration` and
# `altonian_civics`; the comment on each row's `affiliations:` line states its basis. The scale has
# no AGAINST direction: a 0 is a considered REJECTION of the pole, kept as a present key (IN-63), so
# an opponent the row's comment names holds 0 (re-encoded from the producer's "present but low (1)"
# at v9 IN-64); a 1 is a pole held weakly, not opposed. THE WHOLE AUTHORING IS [ASSUMPTION; medium;
# Jordan to correct]. `engine/season/data/cast.py` refuses a row naming fewer than the fifteen, or
# holding no member of a concern (`descriptor_registry.yaml: affiliation_roster.concerns`).
#
# Stats are deferred per npc_roster_v30 (most rows carry `stats: null`).
# History and discussion: references/npc_registry_history.md

schema:
  required: [id, first_name, last_name, faction, role, status]
  optional: [age, birthplace, territory, ts, coherence, stats, convictions, affiliations, goals, arc_trajectory, notes]
  # `affiliations:` (IN-08 H10) is `{<affiliation>: <int 0-5>}` over
  # `references/descriptor_registry.yaml: affiliation_roster` -- the person's religious affiliations
  # and, since ED-IN-0293, `altonian_civics` (the political structure they want), read by
  # `engine/season/data/cast.py::conviction_of` into `Person.conviction`. NOT `convictions:`,
  # which holds pursuits. Every row carries it (ED-IN-0293), with a member of each concern
  # (`affiliation_roster.concerns`); an int 0-5 per pole, 0 a considered rejection (IN-63).


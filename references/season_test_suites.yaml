# The season suites: which subsystem suite each `engine/season/tests/test_<name>.py` belongs to. The OWNER of that fact; the root conftest.py
# reads it and marks every test `<suite>_season`. A file is placed by what its tests OBSERVE, not by its name (many names are batch or item
# ids). Suites are the workplan's lanes (P18): pc personal combat, mb mass battle, sc social contest, fa faction actions and governance,
# fi field investigation, se settlements, wr world, ch character (a person's interior, choice, cast), in infrastructure and cross-cutting.
# A file not listed here is marked `in_season` until someone places it. Classified 2026-11-26 (Jordan: "properly classify the tests into
# the appropriate suites") by reading each file's header, test names and imports; move a file by moving one line.

ld be the sole speaker, and a sitting of one character is refused"}, {batch: B24p-sc-proceeding, added: 1, behaviour: "a rig between unequal powers moves only the non-party seats' start by presume_step x tilt toward the arranger and nothing else in the room or the rite, never the turns; equals, a rite where only a party decides, and a third party tied to neither side tilt nothing and name no arranger"}, {batch: B24p-sc-proceeding, added: 1, behaviour: "the proceeding builder reads each person's ledger only while building that person's own record (his believes and items are his own claim's), and the record it returns holds no carrier"}, {batch: B24p-sc-proceeding, added: 1, behaviour: "a word of no effort that nobody watches runs as the one-speech form, effort or a watching floor makes it the full rite, and an explicit form is kept"}, {batch: B24p-sc-proceeding, added: 2, behaviour: "over 200 keyed sittings no beat makes a move the card bars, shows an item of a kind it does not admit, or speaks more turns than the card gives, and the verdicts are the card's adjudicators' alone; the built grounds, the rite's reason lean and the era weight come from the rosters and the context table, and a planted edit in a copy of each moves the built value and the card's reason share"}, {batch: B24p-sc-proceeding, added: 7, behaviour: "each of a speaker's six attributes (Reason, Attunement, Presence, Grace, Focus, Will) and R11's blend moves only its own operand on a speech, in the sign V2 states, and exactly 0 with that operand's setting off"}, {batch: B24p-sc-proceeding, added: 6, behaviour: "a judge's Reason, Focus, Attunement, Presence and seat each move only their own operand when he hears a speech or a press, his Grace moves nothing in the sitting, and a listener's Will resists an argument and a press"}, {batch: B24p-sc-proceeding, added: 5, behaviour: "a proceeding act is read off the entry's typed outcome and graded on the one ladder: a return that is not an Outcome of Margin
# The test-lane ratchet's floor: how many tests each lane may hold, and how many files tools/ may track.
# Owner of the rule: tools/ci_test_lane_ratchet.py (blocking, CI job `unit-tests`). Jordan, 2026-11-23: "Do NOT
# allow unwarranted accretion to happen." A lane may not hold more tests than `base` plus the `added` of its
# `warrants`; it may not hold FEWER either without `--tighten` (the floor follows every retirement down, so a
# retirement is never spent again by someone else). A warrant is a deliberate edit: the batch, how many it adds, and
# the game-state behaviour those tests observe (or, for tools/, the caller). Nothing else raises the cap.
# Lanes are assigned in conftest.py; `process` is the leftover lane and is meant to reach zero.
lanes:
  season_loop:    {base: 2793, warrants: [{batch: B10-character, added: 1, behaviour: "a strong loyalty makes acting against its object rare in a person's choices and not impossible, across the stance_scale sweep"}, {batch: B10-character, added: 1, behaviour: "the deciding term stamped on each Scene's first act counts the same as the one decision_spread reads, one owner of the rule"}, {batch: B10-character, added: 1, behaviour: "a person who sees the same violating act five times in one season holds one scar count at the cap and five uncapped"}, {batch: B10-character, added: 1, behaviour: "a person can be scarred only on what he chiefly lives for (his primary pursuits and the affiliations he stands for) and only by an act that leans against it past the floor"}, {batch: B10-character, added: 1, behaviour: "a person who sees an act honour a primary pursuit he holds a count on loses one count, once a season, never below zero"}, {batch: B10-character, added: 1, behaviour: "a pursuit whose favoured verb leans below zero, or whose opposed verb leans above zero or above a favoured verb, is reported as a signature break"}, {batch: B10-character, added: 1, behaviour: "a person's decisiveness reads the length of his projected pursuit vector"}, {batch: B10-character, added: 1, behaviour: "the development sheet shows the person's decisiveness at the chooser's scar shift"}, {batch: B10-character, added: 1, behaviour: "a person scarred past the threshold on every held pursuit still shifts weight from the most-scarred to the least-scarred at the dormant scar_weight_shift arm"}, {batch: B10-character, added: 1, behaviour: "a stance sum past the stance row type's bound reads at the bound through the stance term when stance_clamp is on, and unclamped when off"}, {batch: B10-character, added: 1, behaviour: "a creed whose favoured verb is not engaged above zero, or whose opposed verb is engaged at or above zero or above a favoured verb, is reported as a signature break"}, {batch: B10-character, added: 1, behaviour: "a verb off the refusable list is never refused by a person's scruple however far its cell lies past his tolerance"}, {batch: B10-character, added: 2, behaviour: "a person's refusal tolerance is his share of the deontological axis, on the cells' scale of plus or minus one"}, {batch: B10-character, added: 1, behaviour: "a person's own choice temperature factor is exactly one at the shipped gain and falls as his Focus rises at a negative gain"}, {batch: B10-character, added: 1, behaviour: "a low-Focus person's sampled choice departs from his score top more often than a high-Focus person's at a negative temper gain"}, {batch: B10-character, added: 1, behaviour: "a refused act's scruple is the margin past his tolerance, zero outside the closed set"}, {batch: B10-character, added: 1, behaviour: "the temperature-zero column of the season reading under the control arm counts fewer distinct verb multisets than the shipped arm, so the instrument can fail"}, {batch: B10-character, added: 1, behaviour: "a high-Focus person takes the same first act on a redraw more often than a low-Focus person at a negative temper gain"}, {batch: B10-character, added: 1, behaviour: "on the realm a person agrees with himself on a redrawn first act more often than two persons agree, at every swept temper gain"}, {batch: B10-character, added: 1, behaviour: "one deed counts at most one stance step in regard at arm stance"}, {batch: B10-character, added: 1, behaviour: "six deeds outweigh a weight-two loyalty row in regard where one does not"}, {batch: B10-character, added: 1, behaviour: "a deed done to a person is weighed by the judge's bond to the one it was done to"}, {batch: B10-character, added: 1, behaviour: "a person's scruple strikes a refusable candidate after scoring and the Scene keeps the struck candidates that out-scored its first act"}, {batch: B10-character, added: 1, behaviour: "a person who does what his own scruple marked emits a scruple.overridden event caused by the act and graded by no band"}, {batch: B10-character, added: 1, behaviour: "a crisis at band=None folds, destroys or leaves a creed exactly as before the draw"}, {batch: B10-character, added: 1, behaviour: "a shared-column wound puts the lowest-intensity co-held creed in crisis"}, {batch: B10-character, added: 1, behaviour: "each crisis band moves the creed in crisis and its scar count as its table row says"}, {batch: B10-character, added: 1, behaviour: "a person scarred past the threshold by two acts of one tick rolls his crisis twice under keys that carry the act id, and every conviction it moves is told by a conviction.moved event naming the act"}]}
  engine:         {base: 1041, warrants: []}
  combat:         {base: 473,  warrants: []}
  mass_battle:    {base: 324,  warrants: []}
  social_contest: {base: 0,    warrants: []}
  threadwork:     {base: 22,   warrants: []}
  process:        {base: 8,    warrants: []}
tools:
  files: {base: 55, warrants: []}   # 54 + the ratchet itself

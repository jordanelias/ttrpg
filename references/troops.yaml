# The troop file: every kind of soldier and every arm a soldier carries, authored once.
#
# OWNER: mass battle (MB lane). EXPORT: engine/engine_params/troops.json, by `tools/export_troops.py` (its blocking
# `--check` round trip); a hand edit of the JSON fails the check. READER: `modules/mass_battle/troop_types/table.py`,
# loaded once; it refuses an unknown column, a row naming an arm, armour tier, role or site kind outside its closed set
# (the header keys below), an arm whose mass is stated here AND in personal combat's export
# (`engine/engine_params/combat_engine_v1.json`, `sections.weapons`), and a `secondary` equal to the `primary`; and (B19a.01) an
# arm with neither a `duel_key` nor a `sidearm`, a `duel_key` or `sidearm` that is not a key of that export, a `duel_key_status`
# outside its set, a `contact` value with no `status`, and a `matchups` row naming a class, situation, `closes` or `status`
# outside its closed set.
#
# WHAT THIS FILE IS AT LANDING (B17.10): a TRANSCRIPTION of the tables it replaced -- `TROOP_TYPE_STATS`,
# `MOUNTED_TYPES`, `TROOP_TYPE_DENSITY_CAP`, `TROOP_TYPE_ROLES`, `ROLE_SPEC`, `TROOP_LOADOUT`, `TRAINING_SITE` -- row for
# row, so no read of any of them moved. Every `secondary` is null, so no field computes anything from a second weapon.
# Read by nothing yet: `strength`, `upkeep`, `secondary` (a later stage). `depth` (was `ranks`) and `deployment` are read (B19.17). `charge`, `wheel`, `default_role`, `arms` and
# `classes` are read (`troop_types/table.py`, `registry.py`: the four name tests and `reach_for`, B17.11). A missile arm carries its
# volley's `range` (least and greatest cell distance), its `range_stated` (the sourced reach, the flip's value) and its `volleys` (the
# stock a body starts with): B19.21 moved them here from `VOLLEY_MIN_RANGE`, `VOLLEY_MAX_RANGE` and `MB_VOLLEYS_START` (`config.py`).
#
# CONTENT FOR JORDAN (authored seeds, not decisions of this file): every `mass_kg` is a seed at memory grade; every
# `strength` is the smallest whole number at or above the carry demand of the row's own armour (personal combat's
# `ARMOR_DEMAND`: none 0, light 5/3, medium 10/3, heavy 5), so a type carrying only its primary pays nothing, as today;
# `heavy_cut` and `heavy_blunt` are weight classes more than weapons, and both carry a pole weapon's reach today;
# knights templar are `mounted: false` with a 75-troop cell and a lance class, which today's tables say and which
# contradict each other (one visible cell to set); which named weapons of personal combat's roster troops carry
# (`arming` is the example the proposal uses).

# The closed sets a row may name. `site_kinds` is a subset of the season's `rosters.yaml: site_kinds` (the exporter
# refuses a member that is not there); `armour_tiers` are `equipment/armour.py`'s tiers, in order.
site_kinds: [barracks, archery_range, stable, siege_workshop]
armour_tiers: [none, light, medium, heavy]

# The menu of a troop type with no menu of its own (a row whose `roles` is null) and of a type the file does not name:
# today's `TROOP_TYPE_ROLES["any"]`.
default_roles: [Support, Reserve]

# What a role is: a typical shape and an instruction package (today's `config.ROLE_SPEC`). The names are the closed set
# a row's `roles`, a row's `default_role` and a standing order's `role` range over; B17.07 took `Pursue`, `Screen`, `Harass`
# and `Feint` off every menu, and their names stay because a standing order ranges over all.
role_specs:
  ShieldWall: {shape: Line,       instructions: [brace, hold]}
  Hold:       {shape: Line,       instructions: [hold]}
  Anvil:      {shape: Line,       instructions: [brace]}
  Push:       {shape: Line,       instructions: [push]}
  Skirmish:   {shape: GappedLine, instructions: []}          # open order is the shape's gaps: `loose` and `harass` have no primitive
  Screen:     {shape: Line,       instructions: []}          # `screen` has no primitive; on no menu
  Pursue:     {shape: Line,       instructions: []}          # `pursue` has no primitive; on no menu
  Shock:      {shape: Arrowhead,  instructions: [charge]}
  Flanker:    {shape: Line,       instructions: [envelop]}   # Column shape not yet defined; Line placeholder
  Feint:      {shape: Line,       instructions: [lure]}
  VolleyLine: {shape: Line,       instructions: []}          # a shape: `volley` has no primitive. Not `hold`: hold freezes archers (STANCE_SPEED_MOD -99) and braces them against shock
  Harass:     {shape: GappedLine, instructions: []}          # `loose` and `shoot_move` have no primitive; on no menu
  Kite:       {shape: GappedLine, instructions: [kite]}      # blocked on the kiting primitive
  Support:    {shape: Line,       instructions: [reserve]}
  Reserve:    {shape: Line,       instructions: [reserve]}

# What a soldier fights with. `mass_kg` is stated here only for an arm personal combat's export does not carry.
# `duel_key` is the arm's key in personal combat's weapon export (`combat_engine_v1.json`, `sections.weapons`), or null; its
# `duel_key_status` says how near: `exact` (the same weapon), `proxy` (the nearest duel weapon by kind, until personal combat
# carries the kit) or `none` (no duel weapon). A missile arm has no duel key and fights hand to hand with its `sidearm`
# (a weapon key too). An arm carries a `duel_key` or a `sidearm`, one at least (B19a.01, MBA §2.1).
# [ASSUMPTION: the five seeds below, nearest duel weapon by kind (`04_MB_unit_loadout_and_weapon_in_hand_B.md`); content for Jordan]
arms:
  light_cut:   {class: non_pole, mass_kg: 1.2, duel_key: arming,  duel_key_status: exact}
  heavy_cut:   {class: pole,     mass_kg: 2.0, duel_key: falchion, duel_key_status: proxy}
  heavy_blunt: {class: pole,     mass_kg: 1.5, duel_key: mace,    duel_key_status: exact}
  spear:       {class: pole,                   duel_key: spear,   duel_key_status: exact}   # mass from personal combat's export (its key `spear`)
  arming:      {class: non_pole,               duel_key: arming,  duel_key_status: exact}   # mass from personal combat's export (its key `arming`)
  pike:        {class: pike,     mass_kg: 3.5, duel_key: spear,   duel_key_status: proxy}
  bow:         {class: missile,  mass_kg: 2.0, duel_key: null, duel_key_status: none, sidearm: dagger, range: [2, 8], range_stated: [2, 40], volleys: 10}
  crossbow:    {class: missile,  mass_kg: 4.0, duel_key: null, duel_key_status: none, sidearm: dagger, range: [2, 8], range_stated: [2, 40], volleys: 10}
  sling:       {class: missile,  mass_kg: 0.8, duel_key: null, duel_key_status: none, sidearm: dagger, range: [2, 8], range_stated: [2, 8], volleys: 10}
  javelin:     {class: missile,  mass_kg: 2.5, duel_key: null, duel_key_status: none, sidearm: dagger, range: [2, 8], range_stated: [1, 6], volleys: 10}
  siege:       {class: missile,  mass_kg: 0.0, duel_key: null, duel_key_status: none, sidearm: dagger, range: [2, 8], range_stated: [2, 8], volleys: 10}   # crew-served: not carried

# A missile arm's volley (B19.21; `table.volley_range`, `table.volleys_of`, read by `core/volley.py`, `hierarchy/units.py`, `armies.py`):
#   range         the least and the greatest distance, in cells, at which a body shoots (a body nearer than the least is in contact and does
#                 not shoot). THE CONTROL: [2, 8] for every arm, the engine's `VOLLEY_MIN_RANGE` and `VOLLEY_MAX_RANGE` (a fitted pair, no source)
#   range_stated  the sourced reach, beside `range` so the flip (B19.24) is one key: javelin [1, 6] (20-25 m for the heaviest javelins, ACOUP);
#                 bow and crossbow [2, 40] (about 200 m, some say 300 for the longbow; W-CRE); sling and siege [2, 8], NOT ESTABLISHED, today's
#                 value kept. Read by nothing until the flip
#   volleys       the volleys a body of the arm starts with (today's `MB_VOLLEYS_START`, 10 for every arm until Jordan sets one)
# A body whose primary arm is not a missile arm (a `ranged` body of the unmustered `infantry`) shoots as `table.DEFAULT_MISSILE_ARM`.
# The ruled P-DEC-1 map (ED-MB-0014), authored once.
classes:
  non_pole: {reach: 0.1, support_ranks: 1}
  pole:     {reach: 0.2, support_ranks: 2}
  pike:     {reach: 0.3, support_ranks: 3}
  missile:  {reach: 0.1, support_ranks: 1}      # a missile weapon used hand to hand: REACH_MELEE_DEFAULT

# What a contact reads (A-100; B19a.01). READ BY NOTHING YET: the contact draw (B19) and the missile regime read it; no field
# does today. Every value is `{value, status}`, `status` in seed | calibrated | derived (`table.STATUSES`); the loader refuses a
# value with no status, and a null value anywhere but `exposure.base`. Every status below is `seed`: transcribed from today's
# constants by the tree's own conversion (`SIGMA_PER_D` 0.2 sigma units per die, one die per point of skill), swept in B19.
contact:
  exposure:                       # duel rounds a front-rank man fights in one field tick: `base x posture x arc x crowding x cover`
    base: {value: null, status: seed}      # UNCALIBRATED in absolute level: set in B19 by T-1 and T-2 and Sabin's bound read as a ceiling [ASSUMPTION: null rather than a number -- basis: MBA §1.4 gives no seed; the loader admits null only for `base`]
    posture_k: {value: 0.5, status: seed}  # the factor `1 + 0.5 x (cA + cB)`, floored at 0.25, c from STANCE_COMMITMENT
    cover:
      walls: {value: 0.5, status: seed}    # WALLS_DEFENDER_DR (3) as the defender's cover behind walls
  levels:                         # in skill steps, on the one ladder
    intent_offense: {value: 0.5, status: seed}    # INTENT_OFFENSE_D
    intent_defense: {value: 1.0, status: seed}    # INTENT_DEFENSE_D
    terrain_die: {value: 1, status: seed}         # one step a die (terrain dice)
    charge_cap: {value: 2.75, status: seed}       # MB_CHARGE_SIGMA 0.55 at its cap, over SIGMA_PER_D
    morale_near_rout: {value: 4, status: seed}    # MORALE_SIGMA_SCALE 0.8, over SIGMA_PER_D
  K: {value: 6, status: seed}     # the duel round index the felling chance is read to (the hazard is flat from round 4)
  # The missile regime by range band (MBA §3.1). `hit` and `felling_per_hit` are [ASSUMPTION; content for Jordan]: the ORDER is
  # the design's (hit falls close > effective > long; felling falls with the armour tier none > light > medium > heavy, the
  # crossbow's `armour_piercing` raising medium and heavy over the bow's), the magnitudes are small seeds, uncalibrated.
  # Only `bow` and `crossbow` carry seeds: the sling, javelin and siege have none yet.
  missile:
    bands: {value: [0.25, 0.5], status: seed}     # close up to a quarter of the arm's range, effective up to a half, long the rest
    hit:
      bow:      {close: {value: 0.30, status: seed}, effective: {value: 0.20, status: seed}, long: {value: 0.10, status: seed}}
      crossbow: {close: {value: 0.35, status: seed}, effective: {value: 0.25, status: seed}, long: {value: 0.15, status: seed}}
    shots_per_tick:               # "up to ten arrows a minute" and "about twice a minute" over the 4 s field tick
      bow: {value: 0.67, status: seed}
      crossbow: {value: 0.13, status: seed}
    felling_per_hit:
      bow:      {none: {value: 0.30, status: seed}, light: {value: 0.20, status: seed}, medium: {value: 0.10, status: seed}, heavy: {value: 0.05, status: seed}}
      crossbow: {none: {value: 0.30, status: seed}, light: {value: 0.20, status: seed}, medium: {value: 0.15, status: seed}, heavy: {value: 0.10, status: seed}}
    profile:                      # the target's size class: a horse is a larger mark
      foot: {value: 1.0, status: seed}
      mounted: {value: 1.6, status: seed}

# How one class of troops meets another in one situation (MBA §3.2). SHIPPED EMPTY: B19 writes the first rows and B31 the rest.
# A row is {a, d, situation, closes, close_ob, first_tick: {exposure_a, exposure_d, levels_a, levels_d}, stand, status}: `a` and
# `d` range over `table.MATCHUP_CLASSES`, `situation` over `table.SITUATIONS`, `closes` over `table.CLOSES`, `status` over `table.STATUSES`.
matchups: []

# What tires a body (`fatigue`, a closed set of rows, each a bare number): `lull_recover` is the stamina a column block regains at
# each between-turn lull, on the 0..STAMINA_MAX scale (B19.28: `BETWEEN_TURN_STAMINA_RECOVERY`, `orchestration.py`, deleted; its one reader
# is `modules/mass_battle/orchestration.py::between_turn_recovery`, B19.22, which the lull between two bouts of a field calls). The other rows (`clash_drain`, `rest`, `fast_move_drain`, `entry`) are B31.06's.
fatigue:
  lull_recover: 30         # BETWEEN_TURN_STAMINA_RECOVERY (orchestration.py), per lull (today)

# How a body of troops is laid into cells at deployment (B19.17; `orderofbattle.cells_for` is the one function, three callers: an order of
# battle's units and the two headcount constructors). A cell is the ground sixteen men stand in close order on, about four metres square.
#   cell_troops   the troops a cell holds at deployment. SEED: the tier table's density at 400 troops (25 cells). `width` = the body's troops
#                 over (depth x cell_troops), at least 1, unless the unit row names one
#   arm           `cap`: today's packing (the densest a cell may be, `cell_cap`), the control arm; `grid`: the width x depth grid above
#   scale         (B19.20) what the numbers stand for. Read by the report; by NO resolver. The 50 m tile and 5-minute turn are not adopted.
#   max_bouts     (B19.20) the bouts a battle may run. 1 is today's field, the control; the seed for the flip is 6 (B19.22: read into `MassBattleInput.max_bouts`)
deployment:
  cell_troops: 16
  arm: cap
  scale:
    cell_m: 4              # 16 men at about 3 ft of front and of depth each: four files by four ranks (MV F1)
    tick_s: 4              # one cell at an ordinary marching pace (MV M3; snippet tier: a seed)
    bout_ticks: 18         # a bout is one clash, about seventy seconds. States `config.ROUTE_BUDGET_TICKS` (3 x TICKS_PER_PHASE); that constant is the head, nothing here reads it
    bout_minutes: 30       # a bout and the stand-off before the next, as the report tells it
  max_bouts: 1

# The army's formation, one row per named formation (B19.18; `orderofbattle.place_posts` is the one reader: the season's `_place` and the harness's
# `build_envelopment` / `build_refused_flank` both call it). An army's strategy names its formation (`line` unless the strategy is another row's name);
# a unit stands at a POST of it, `post` on the unit row, else the one `default_post` gives its class.
#   opening_rows  the clear rows between the two armies' foremost faces at the start (the MB "opening distance"; was `_APPROACH_ROWS`): a whole
#                 number, or `auto` (B19.21): the longest `range[1]` among the missile arms on either side, capped so both lines fit the field,
#                 floor 3 (`orderofbattle.APPROACH_ROWS`). Every row is `3` at the control, so no field reads `auto` yet
#   frontage      `centre`: the centre line is centred alone and the side posts stand outside it; `whole`: it is centred with the side posts
#   posts         name -> where it stands:
#     rank_line   which line behind the first (0 the first); a line stands one clear row behind the depth of the line in front of it
#     across      `centre`: in the centre line; `left` / `right`: outside its edge, clear of it by the deploy gap; `wide_left` / `wide_right`:
#                 outside it by the wing gap (`armies.ENVELOP_WING_GAP`)
#     forward     optional, rows toward the enemy from the line (negative: back), default 0
#     gap         optional, the empty columns between the post and what it stands beside, instead of the `across` term's own
#   default_post  class (`melee`, `ranged`, `mounted`) -> a post, or a list of posts the units of that class take in turn
formations:
  line:                       # today's rule, transcribed: the control
    opening_rows: 3           # [ASSUMPTION; medium; Jordan to correct] the smallest gap measured to join every melee type in one turn
    frontage: centre
    posts:
      centre:  {rank_line: 0, across: centre}
      rear:    {rank_line: 1, across: centre}     # one clear row behind the centre's depth
      left:    {rank_line: 0, across: left}
      right:   {rank_line: 0, across: right}
      reserve: {rank_line: 2, across: centre}
    default_post: {melee: centre, ranged: rear, mounted: [left, right]}   # alternating, as now
  envelopment:                # the harness's `build_envelopment` (the Cannae pattern): the centre bowed forward, the wings wide of it. The wings' hold-then-wheel is a standing order, not a row.
    opening_rows: 3
    frontage: centre
    posts:
      centre: {rank_line: 0, across: centre, forward: 2}   # the apex, two rows forward of the flank line
      rear:   {rank_line: 1, across: centre}
      left:   {rank_line: 0, across: wide_left}
      right:  {rank_line: 0, across: wide_right}
    default_post: {melee: centre, ranged: rear, mounted: [left, right]}
  refused_flank:              # the harness's `build_refused_flank` (Leuctra): the strong wing at the front, the refused wing beside it and echeloned back
    opening_rows: 3
    frontage: whole
    posts:
      centre: {rank_line: 0, across: centre}
      rear:   {rank_line: 1, across: centre}
      right:  {rank_line: 0, across: right, gap: 0, forward: -6}   # abutting the strong wing, six rows back
    default_post: {melee: centre, ranged: rear, mounted: right}

# One row per troop type, in `TROOP_TYPE_STATS`' order, then the unmustered body.
#   skill, discipline, morale   today's stat line (§B.2); a row with a null among the three has no preset (`stats_for` None).
#                               `skill` was `power`, values unchanged: the men's martial skill on the duel's `faculty` scale (B19a.01).
#                               The loader returns no `power` key (the alias was deleted, B19.15).
#   strength                    the score the carry demand is charged against (seed rule above)
#   mounted                     speed, deployment on the flanks (today's `MOUNTED_TYPES`)
#   charge                      charge penetration: 3 for today's `cavalry`, 0 otherwise
#   wheel                       the fast enveloping wheel: today's `cavalry` and `light_cavalry`
#   default_role                the role a unit of the type takes when none is named: `Kite` for today's `mounted_archers`
#   cell_cap                    the most troops a cell holds: 75 for the four horse types (P-DEC-3: a horse and rider take more ground, so fewer than `CELL_CAP`; Jordan, 2026-11-20, "Horse maximum 75", so the horse band is `CELL_FLOOR` 50 to 75 and both rulings hold), `CELL_CAP` (100) else
#   depth                       the unit formation's default depth, in cells (was `ranks`; the sourced depths): 2 for sword and spear foot and for
#                               horse, 4 for pike, and 2 for missile troops [ASSUMPTION: missile depth not established in the sourced note --
#                               basis: the lowest sourced foot depth]. A unit row's own `depth` and `width` (optional) win; read at `deployment.arm: grid`
#   primary, secondary          an `arms` key, or null
#   armour                      an `armour_tiers` member, or null
#   roles                       the type's menu, or null for `default_roles`
#   training_site               a `site_kinds` member, or null (levy: the call-up of ordinary people needs no ground)
#   min_site_condition          the least condition fraction of that site at which the type trains at all
#   upkeep                      a column for the party economy; nothing reads it
troops:
  levy:
    {skill: 1, discipline: 1, morale: 2, strength: 0, mounted: false, charge: 0, wheel: false, default_role: null,
     cell_cap: 100, depth: 2, primary: light_cut, secondary: null, armour: none, roles: null,
     training_site: null, min_site_condition: 0.0, upkeep: 0}
  light_infantry:
    {skill: 3, discipline: 3, morale: 4, strength: 2, mounted: false, charge: 0, wheel: false, default_role: null,
     cell_cap: 100, depth: 2, primary: light_cut, secondary: null, armour: light, roles: [Skirmish],
     training_site: barracks, min_site_condition: 0.0, upkeep: 0}
  heavy_infantry:
    {skill: 4, discipline: 4, morale: 5, strength: 4, mounted: false, charge: 0, wheel: false, default_role: null,
     cell_cap: 100, depth: 2, primary: heavy_cut, secondary: null, armour: medium, roles: [ShieldWall, Hold, Anvil, Push],
     training_site: barracks, min_site_condition: 0.0, upkeep: 0}
  cavalry:
    {skill: 5, discipline: 5, morale: 5, strength: 5, mounted: true, charge: 3, wheel: true, default_role: null,
     cell_cap: 75, depth: 2, primary: heavy_cut, secondary: null, armour: heavy, roles: [Shock, Flanker],
     training_site: stable, min_site_condition: 0.0, upkeep: 0}
  archers:
    {skill: 3, discipline: 3, morale: 3, strength: 2, mounted: false, charge: 0, wheel: false, default_role: null,
     cell_cap: 100, depth: 2, primary: bow, secondary: null, armour: light, roles: [VolleyLine],
     training_site: archery_range, min_site_condition: 0.0, upkeep: 0}
  crossbow:
    {skill: 3, discipline: 3, morale: 3, strength: 2, mounted: false, charge: 0, wheel: false, default_role: null,
     cell_cap: 100, depth: 2, primary: crossbow, secondary: null, armour: light, roles: null,
     training_site: archery_range, min_site_condition: 0.0, upkeep: 0}
  sling:
    {skill: 2, discipline: 2, morale: 3, strength: 2, mounted: false, charge: 0, wheel: false, default_role: null,
     cell_cap: 100, depth: 2, primary: sling, secondary: null, armour: light, roles: null,
     training_site: archery_range, min_site_condition: 0.0, upkeep: 0}
  artillery:
    {skill: 2, discipline: 2, morale: 3, strength: 0, mounted: false, charge: 0, wheel: false, default_role: null,
     cell_cap: 100, depth: 2, primary: siege, secondary: null, armour: none, roles: null,
     training_site: siege_workshop, min_site_condition: 0.5, upkeep: 0}
  knights_templar:
    {skill: 5, discipline: 6, morale: 6, strength: 5, mounted: false, charge: 0, wheel: false, default_role: null,
     cell_cap: 75, depth: 2, primary: heavy_blunt, secondary: null, armour: heavy, roles: null,
     training_site: stable, min_site_condition: 0.5, upkeep: 0}
  pike:
    {skill: 4, discipline: 4, morale: 5, strength: 4, mounted: false, charge: 0, wheel: false, default_role: null,
     cell_cap: 100, depth: 4, primary: pike, secondary: null, armour: medium, roles: [ShieldWall, Hold, Anvil],
     training_site: barracks, min_site_condition: 0.0, upkeep: 0}
  spearmen:
    {skill: 3, discipline: 3, morale: 4, strength: 2, mounted: false, charge: 0, wheel: false, default_role: null,
     cell_cap: 100, depth: 2, primary: spear, secondary: null, armour: light, roles: [ShieldWall, Hold, Anvil],
     training_site: barracks, min_site_condition: 0.0, upkeep: 0}
  skirmishers:
    {skill: 2, discipline: 2, morale: 3, strength: 2, mounted: false, charge: 0, wheel: false, default_role: null,
     cell_cap: 100, depth: 2, primary: javelin, secondary: null, armour: light, roles: [Skirmish],
     training_site: archery_range, min_site_condition: 0.0, upkeep: 0}
  mounted_archers:
    {skill: 3, discipline: 3, morale: 3, strength: 2, mounted: true, charge: 0, wheel: false, default_role: Kite,
     cell_cap: 75, depth: 2, primary: bow, secondary: null, armour: light, roles: [Kite],
     training_site: stable, min_site_condition: 0.0, upkeep: 0}
  light_cavalry:
    {skill: 3, discipline: 3, morale: 4, strength: 2, mounted: true, charge: 0, wheel: true, default_role: null,
     cell_cap: 75, depth: 2, primary: light_cut, secondary: null, armour: light, roles: [Flanker],
     training_site: stable, min_site_condition: 0.0, upkeep: 0}
  # The unmustered body of a side with no army Record, carrying the literals that side lends it today
  # (`massbattle._SEASON_FORCE_POWER` 4, `_MVP_UNIT_COMMAND['discipline']` 5). It has no `morale` (`_weighted_unit` sets
  # it from the season) and so no stat preset: `stats_for('infantry')` stays None, as today. No weapon, no armour:
  # `loadout_for('infantry')` stays `(None, None)`.
  infantry:
    {skill: 4, discipline: 5, morale: null, strength: 0, mounted: false, charge: 0, wheel: false, default_role: null,
     cell_cap: 100, depth: 2, primary: null, secondary: null, armour: null, roles: [Hold, Push, ShieldWall],
     training_site: null, min_site_condition: 0.0, upkeep: 0}

# review_baseline.yaml — the ratchet for the Repository State Armature (ED-IN-0077).
#
# One row per report-only signal in tools/review_core.py's CHECKS registry. `baseline` is the
# ACCEPTED DEBT CEILING as measured at seeding: review_core `--check` fails only when a signal
# exceeds its baseline (a REGRESSION), so report-only signals are blocking-on-regression from day
# one WITHOUT branch-protection edits or CI job renames. Debt can only shrink — lowering a
# `baseline` is a one-line edit in the PR that earns it; when a row reaches `target` it is fully
# blocking. See systems/_architecture/repo_state_armature_v1.md §2.3.
#
# Governance: registers/review_baseline.yaml is CODEOWNERS-gated to Jordan (a debt ceiling is a
# design commitment). Raising any baseline requires an explicit ED and a loud call-out per ED-1094.
schema_version: 1
seeded: "2026-07-20"
seeded_by: "ED-IN-0077"
# `baseline` is a DEBT-COUNT ceiling: review_core parses the count each tool prints on failure
# (count_re in tools/review_core.py's CHECKS) and regresses only when count > baseline. Where a
# tool prints no parseable count (wiring), the ratchet falls back to boolean (any failure on a
# baseline-0 signal regresses). Banked 2026-07-20 (ED-IN-0077) to true measured debt after the
# currency/freshness reconcile drove currency to 0 — the shrink is banked per the ratchet rule
# "debt can only shrink; each shrink is a one-line baseline edit in the PR that earns it."
signals:
  currency.stamps:
    baseline: 0        # reconciled to 0 this PR (CURRENT.md paths + id ceilings all current); any drift now regresses
    target: 0
  vocab.a17:
    baseline: 29       # A17 quantity-vocabulary closure: measured 29/71 unresolved (was seeded 36, stale by 7)
    target: 0
    flip_blocking_at: 0
  wiring.coverage:
    baseline: 0        # wiring_map_check --check passes (27/27 · 7/7); boolean fallback — any failure regresses
    target: 0
  definitions.parity:
    baseline: 0        # definitions store current + name parity holds; boolean fallback — drift/mismatch regresses
    target: 0
  vocab.parity:
    baseline: 0        # folded vocab register views match vocab_source.yaml (ED-IN-0078); drift regresses
    target: 0
  sim_params.export:
    baseline: 0        # sim_params.json matches a fresh extract from the sim code (ED-IN-0079); regen on drift
    target: 0
  value_links.export:
    baseline: 0        # value_pointer_links.json matches a fresh build (ED-IN-0079); regen on drift
    target: 0
  stubs.count:
    # Wave-1 bookkeeping seed (ED-IN-0093, per 01_orchestration_plan_v1.md §3 Wave 1
    # pre-declared protocol; supersedes the Spine-stage placeholder 0 + TODO).
    # Arithmetic (RE-MEASURED post-fix-batch, 2026-07-29 — supersedes this row's own prior
    # 23+1=24 seed, which was banked BEFORE the fix batch's kernel-guard update (item A) added a
    # `from engine.substrate.stubwire import StubResult` import to
    # systems/social_contest/sim/contest/_kernel_tests.py, which moved that file INTO the
    # stub_wired set): measured stub_wired module count on the final Wave-1 tree = 24 (via
    # `python3 skills/valoria-vector-audit/scripts/structure_audit.py --stub-count`, 2026-07-29)
    # + 1 for the MB-owned systems/mass_battle/sim/altonian_reinforcements.py (not yet
    # converted — critic F4: seed at the FULL expected set so MB's later conversion moves the
    # count toward, never past, the ceiling) = 25.
    # SEMANTICS (not a converted-stub census): the predicate is "imports
    # engine.substrate.stubwire" — this counts every importer of that module, including
    # telemetry CONSUMERS (engine.mc_v18, which reads stubwire.invocations for CampaignResult
    # telemetry, never calls stub_resolve itself) and test files that import StubResult purely
    # to assert on it (this fix batch's own _kernel_tests.py). It is therefore a CEILING on
    # stub-adjacent modules, not an exact count of converted call sites. A call-site predicate
    # (counting stub_resolve invocations, not stubwire importers) would be exact but is deferred
    # — see 04_execution_ledger.md's predicate-refinement row (W5 candidate).
    baseline: 25
    target: 25

# scope_baseline.yaml — the SCOPE ratchet for the M1 program (ED-IN-0112).
#
# Companion to registers/review_baseline.yaml, which ratchets TECHNICAL debt. This file
# ratchets SCOPE. Same mechanism, different target, and the target is the point: the
# diagnosed failure of this project is not defect density, it is that the apparatus
# generates work faster than it retires it. review_baseline could not see that, because
# every signal it grades is a quality signal and scope growth is not a quality regression.
#
# SEMANTICS (identical to review_baseline): `baseline` is an ACCEPTED CEILING measured at
# seeding. tools/scope_ratchet.py --check fails when a signal EXCEEDS its baseline. Debt can
# only shrink; each shrink is a one-line edit in the PR that earns it. A row that reaches
# `target` is fully closed.
#
# RAISING A BASELINE requires an explicit ED and a loud call-out per ED-1094 — the same
# governance review_baseline.yaml carries. A raised scope ceiling is the project deciding to
# grow, which is a design commitment, not housekeeping.
#
# WHY THESE FIVE. Each is a measured proxy for one way scope leaks:
#   ed.stale               — work opened >30d ago and STILL not closed (not a raw census:
#                            filing is the cure, rot is the disease — see the FIXED note below)
#   ed.needs_jordan_stale  — stale work that cannot close without the one bottleneck resource
#   audit.files        — the corpus that grows when "comprehensive review" is the directive
#   tracked.files      — total surface area under maintenance
#   proposals.open     — designs authored but never ratified or killed
#
# All five were measured on the working tree at seeding (2026-07-31), not estimated.
schema_version: 1
seeded: "2026-07-31"
seeded_by: "ED-IN-0112"
program: "M1 — one playable season"

# The ratchet is ACTIVE only while the M1 program runs. When M1 ships, re-seed against the
# post-M1 tree rather than carrying these ceilings forward as though nothing happened.
active_until: "M1 junctures closed == 7"

# ✅ METRIC FLAW FIXED (ED-IN-0114, 2026-07-31). `ed.open`/`ed.needs_jordan` conflated WORK
# OPENED with WORK NOT CLOSED, so filing an ED — the behaviour CLAUDE.md §2 expects of
# substantively every PR — always regressed them. A gate that fires on the correct action is a
# gate that gets ignored. They are now AGE-WEIGHTED: `ed.stale` / `ed.needs_jordan_stale` count
# only items open longer than STALE_DAYS (30). A freshly-filed item adds nothing; one left to rot
# adds one. Staleness is the disease; the raw census never was.
#
# UNDATED ROWS COUNT AS STALE (4 today). An entry with no parseable date cannot be shown to be
# fresh, and treating unknown age as zero is the same "absence of evidence reads as a pass"
# defect this file already rejects for unmeasurable signals.
#
# SEEDING IS A ONE-TIME EVENT, AND THIS IS IT. The seeding commit (ED-IN-0112) raised
# tracked.files by 5 — its own instruments (scope_ratchet.py, m1_acceptance.py,
# scope_baseline.yaml, test_scope_ratchet.py, the POINTER). That raise is legitimate exactly
# once, because a ceiling must include the ruler. EVERY LATER COMMIT PAYS: new surface is
# funded by retiring dead surface, not by re-seeding.
#
# ARITHMETIC RECONCILED (adversarial pass flagged 3103 + 5 = 3108, not 3109). The sixth file
# is not this program's: merging origin/main brought in
# `audit/2026-07-30-audit-family-critique/00_critique.md` (ED-IN-0099). Verified with
# `git diff --name-status 3f41a32..HEAD | grep '^A'` -> exactly 6 additions, five of them the
# instruments named above. So 3103 + 5 (ours) + 1 (main's) = 3109, and audit.files 1264 -> 1265
# is that same file. No unearned headroom; the ceiling includes one file this program did not
# author and could not have refused.
#
# The falsifier for that claim is `seeded:` above. If a future session raises tracked.files or
# audit.files and calls it seeding, `seeded` will still read 2026-07-31 and the git log will show
# the raise landing months later. A second "seeding" is a governance failure, not a measurement.
signals:
  ed.stale:
    baseline: 76  # measured 2026-07-31 via obs_core; 61 aged 31-60d, 11 aged >60d, 4 undated
    target: 20
    note: >-
      Open items older than 30 days. NOT a raw census — 213 items are open, and most of those
      are current work that filing more of is correct. 76 have rotted. Target 20 is a real
      reduction rather than a round number: the derivation engine should clear the
      canon-/research-/consistency-derivable majority, and what survives that is the genuine
      backlog. Undated rows (4) count as stale — an entry that cannot be shown to be fresh
      is not evidence of freshness.

  ed.needs_jordan_stale:
    # 87 -> 94 on 2026-07-31: a CORRECTED MEASUREMENT, not scope growth. The first seeding
    # used a bare `needs_jordan` boolean read; the signal now delegates to obs_core (the
    # ED-IN-0068 single owner), whose normalization adds the free-text rescue for
    # pre-cutover rows predating the field. Same tree, same day, +7 — the earlier ceiling
    # was simply undercounting. Left unfixed, the dashboard would have published two
    # different "needs Jordan" figures from two cards on one page.
    baseline: 21  # measured 2026-07-31 via obs_core (of 94 open needs_jordan, 21 are stale)
    target: 3
    note: >-
      The bottleneck signal, age-weighted. 94 items await a ruling; 21 have awaited one for
      over a month, and those are the ones actually blocking. Target 3 follows the measured
      ~1-in-6 genuine-taste share of the stale subset — everything else is canon-, research-,
      consistency- or arithmetic-derivable and should never have needed a ruling at all.

  audit.files:
    baseline: 1265  # measured 2026-07-31 (git ls-files audit | wc -l)
    target: 1264
    note: >-
      NOT a shrink target — audits are history and deleting them destroys provenance. This
      ceiling exists to stop the corpus GROWING during M1. A new audit is permitted only if
      it gates an M1 juncture, and it must be paid for by consolidating an equal count.

  tracked.files:
    # 3109 -> 3110 (ED-IN-0113 §A): systems/_architecture/decision_policy_v1.md. Raised with a
    # stated reason rather than absorbed, per this file's own rule. The trade is deliberate and
    # net-negative on scope: one file is added so that ~18 of the 21 stale needs_jordan items can
    # resolve without a ruling. If the policy works, ed.needs_jordan_stale falls 21 -> ~3 and this
    # row's cost is repaid many times over in the signal it exists to reduce. If it does not, this
    # is one file of dead weight and should be retired rather than kept out of politeness.
    # 3110 -> 3111 (ED-MB-0062): tests/coverage_matrix_archive_2026-08-01.md. ARCHIVING adds a
    # file even though it shrinks a capped one — the live matrix went 14,655 -> 12,987 of its
    # 15,000-token cap, from 2.3% headroom to 13%. Raised with the reason rather than absorbed,
    # because "the ratchet counts files, and archiving is how this repo stays under its register
    # caps" is a real tension worth seeing rather than a bug to route around: a +1 here buys
    # ~1,770 tokens of room in a file that was one entry from breaching a BLOCKING gate.
    # 3111 -> 3112 (ED-MB-0063 follow-on): references/id_reservations_history.md. The state/history
    # split for `references/id_reservations.yaml`, which sat at 14,263 of its 15,000-token BLOCKING
    # cap — about two ED allocations from failing the allocation path for EVERY lane at once. The
    # YAML is now 6,280 (58% headroom).
    #
    # This raise is the clearest case yet for the "archiving costs a file" tension this row keeps
    # hitting, and it is worth stating rather than absorbing: ONE new file buys ~8,000 tokens of
    # headroom on the single most contended file in the repo. The alternative was deleting the
    # narrative, which was checked and rejected — the ED-IN-0064 LEDGER entry is about the
    # governance research corpus, a different item entirely, so the duplicate-key incident
    # write-up existed ONLY in that YAML comment. Deleting would have destroyed provenance;
    # moving preserves it (verified: 11/11 narratives byte-identical, 0 ids lost).
    baseline: 3112  # measured 2026-08-01 (git ls-files | wc -l)
    target: 3103
    note: >-
      Total surface under maintenance. Flat is the goal, not shrinkage: the season loop will
      add engine files, so landing loop work requires retiring dead weight to stay under.
      That trade is the mechanism, not a side effect.

  proposals.open:
    baseline: 20  # measured 2026-07-31 (proposals/*.md)
    target: 5
    note: >-
      Unratified designs. Each is either ratified, killed, or explicitly deferred with a
      stated reason. "Still thinking about it" after four months is a decision that was made
      by default; this row makes it visible.

# The single health number for the whole program. Not a ratchet row (it must GROW), tracked
# here so one file answers "is this working?".
health:
  m1_junctures_closed:
    measured: 0         # 2026-07-31: 0 done, 4 in_progress, 1 blocked, 2 not_started
    total: 7
    note: >-
      The program falsifier. If this is still 0 at week 6, the plan failed, and the cause is
      visible in the rows above: if audit.files or tracked.files grew, scope leaked.

- {id: H1-037, name: "The seasonal Mandate penalty is coded as permanent, and its own note says temporary", source: "systems/social_contest/sim/parliamentary_vote.py:207-219", system: parliament-politics, touches: [faction-strategy], slice: gap, status: built, status_evidence: "systems/social_contest/sim/parliamentary_vote.py:207-219", rolls: yes-resolver, shape: none, statement: "On §10 Total Victory/Defeat the losing coalition's dominant faction takes Mandate -1 via direct adjust('L',...) with note '[one-season penalty; temporary-modifier restoration deferred to season_manager]'. season_manager defines exactly two functions; Faction.reset_seasonal clears exactly two booleans. There is NO temporary-modifier machinery anywhere in the engine. The penalty is permanent and compounds. Confirmed live with ECHO_TRANSPORT default ON."}
- {id: H1-038, name: "mass_seizure writes a canonical Accord index into a continuous field", source: "systems/factions/sim/mass_seizure.py:291-293", system: faction-strategy, touches: [territory-world], slice: gap, status: built, status_evidence: "systems/factions/sim/mass_seizure.py:291-293", rolls: no, shape: none, formula: "ACCORD_MAP = {0:1.0,1:2.5,2:4.0,3:5.5,4:7.0}", statement: "Writes t.accord = float(starting_accord), a 0-4 INDEX, into a CONTINUOUS field. Sibling site does it correctly: parliamentary_transfer.py:278 uses ACCORD_MAP[accord_level]. Seizure at Accord level 2 stores 2.0 where canon means 4.0. game_state.py:65-70 warns modules MUST bucket through the helpers. Site comment half-admits it. mass_seizure has ZERO test coverage, unlike its six sibling stubs. A live wrong-scale write bug."}
- {id: H1-039, name: "ED-874's Domain Action resolver is ratified and has zero implementations", source: "proposals/2026-08-23-MASTER-vocabulary-and-rulings.md:361", system: faction-strategy, touches: [parliament-politics], slice: gap, status: ruled-unexecuted, rolls: no, shape: none, provenance: [ED-874], statement: "ED-874 'supersedes the bare-stat-pool-vs-Ob dice approach' for Domain Actions. Zero implementations; every faction action still uses the superseded method. TWO SHARPENINGS: validate_ed_citations.py names ED-874 as NONEXISTENT and uses it as its own bad-citation fixture, and its only home on main is the byte-faithful capture of the EVACUATED engine/params/ tree, which §0.05 rules is history not canon. So 'implement ED-874' is not obviously the remedy — the ruling itself needs re-examination."}
- {id: H1-040, name: "The Suppress domain-action step can never fire in any campaign season", source: "proposals/2026-08-23-MASTER-vocabulary-and-rulings.md:362", system: faction-strategy, slice: gap, status: stub, status_evidence: "systems/overview/sim/ci_track.py", rolls: no, shape: none, conflicts_with: [H1-049], statement: "apply_seasonal_ci(world) is called with no kwargs; Suppress's gate is 'if suppress_attempted and suppress_success:' — both always false-default. Step 4 cannot fire in any campaign season with the current caller."}
- {id: H1-041, name: "Governor succession — three layers deep, nothing emits it", source: "proposals/2026-08-23-suite-04-wiring-gaps-and-orphans.md:154-158", system: settlement-governance, touches: [faction-strategy], slice: gap, status: designed-canonical, status_evidence: "engine/cross_scale/articulation.py:119", rolls: no, shape: none, statement: "state.succession is named in articulation.py:119's consumer roster and nowhere emitted. key_graph.json names its producer as faction_politics, which exists only as a design doc. Below that: Faction carries NO leader field of any kind, so the Key's payload (prior_leader_id, new_leader_id) has no coded source. Not a missing emitter — a missing ENTITY, three layers deep."}
- {id: H1-042, name: "Faction.adjust bypasses the Key bus on 30 of 31 call sites", source: "proposals/2026-08-24-completion-plan-v1.md:165-173", system: faction-strategy, touches: [cross-scale-plumbing], slice: gap, status: built, status_evidence: "systems/factions/sim/faction_action.py:485-489", rolls: no, shape: none, statement: "30 of 31 sites write faction stats directly, bypassing the Key bus, though the governing principle is already ruled: 'a request for a computed answer stays a call; an announcement that something HAPPENED is a Key'. Live precedent exists at echo_transport.py:454-457. First migration pre-identified. Read/write-asymmetry hazard under §0.1 pt1; extend the existing .adjust( census into a shrink-only ratchet rather than mint a new guard."}
- {id: H1-043, name: "Authored per-settlement Legitimacy/Popular-Support seed table has no loader", source: "systems/factions/faction_state_authoring_v30.md:323-338", system: settlement-governance, touches: [faction-strategy], slice: gap, status: designed-canonical, status_evidence: "systems/settlements/sim/registry.py::populate_from_geography", rolls: no, shape: none, statement: "§8 authors per-settlement starting L/PS seeds (Crown 5/5, Church 5/5, Hafenmark 4/4, Varfell 4/4, Guilds 3/3, RM 0/0, Loewenritter 0/0), stating they seed each controlled settlement at game start. populate_from_geography reads only the geography YAML, which carries no L/PS keys, so all 37 load at 0/0. INVERTS the apparent remedy: not 'L/PS is unauthored' but 'an authored canonical table has no loader' — a ~10-line fix, not a design item."}
- {id: H1-044, name: "Schoenland (T16/S-037) is authored, adjacency-linked, and absent from the playable world", source: "proposals/2026-08-23-suite-02-narrative-texture-census.md:68-89", system: settlement-governance, touches: [territory-world, npc-social], slice: gap, status: audit-finding, status_evidence: systems/settlements/valoria_geography_v30.yaml, rolls: no, shape: none, conflicts_with: [H1-021], statement: "S-037 coherently attested across three surfaces — settlement registry, an adjacency edge {from:T1,to:T16,type:coastal}, and NPC-012 Rikard's entry — and absent from world.territories, STARTING_OWNER and the four known factions. game_state.py carries ALL_PLAYABLE_15 (15) and STARTING_OWNER (16) eight lines apart, neither including T16. A region authored across the content layer and never added to the geography layer."}
- {id: H1-045, name: "The NPC-registry loader is blocked on five unmade decisions, not one missing function", source: "proposals/2026-08-22-wiring-map.md:25-58", system: npc-social, touches: [personnel-roster, settlement-governance], slice: gap, status: designed-canonical, status_evidence: "systems/world/sim/npe.py:114-134", baseline_ref: "personnel_muster_integration_master_v1 §3 Phase P0 options A/B/C", rolls: no, shape: none, conflicts_with: [H1-028,H1-032,H1-033], statement: "(1) only 7 of 46 carry a territory and world.npcs is territory-keyed, so 39 authored people cannot be placed; (2) the 7 are formatted 'T15 (Southernmost)' against bare 'T1'..'T15','T17' keys and one names T16 which is not in the map; (3) 20 faction strings have no mapping to STARTING_STATS; (4) ConvictionState has no weight field for 81 weighted primaries; (5) the field sets do not correspond, only faction and territory mapping directly. populate_from_geography already exists as an in-tree pattern to copy."}
- {id: H1-046, name: "NPC settlement membership is ambiguous — per-settlement field, per-territory data", source: "proposals/2026-08-22-wiring-map.md:122", system: personnel-roster, touches: [settlement-governance, npc-social], slice: gap, status: designed-canonical, status_evidence: "systems/settlements/sim/registry.py:87", rolls: no, shape: none, conflicts_with: [H1-045], statement: "npc_ids is per-settlement; the registry's only locational field is per-territory; several territories host 1-3 settlements (mean 2.3). Which settlement holds a person is an unmade decision downstream of the loader gap."}
- {id: H1-047, name: "religious_building stored twice, in two keyspaces, never synced", source: "proposals/2026-08-23-competing-vocabularies-index.md:67", system: settlement-governance, slice: gap, status: superseded, rolls: no, shape: none, statement: "Stored on settlement (registry.py:82, sid-keyed) and on territory (infrastructure.py:81, territory-keyed), never synced. Adjudicated NARROWER than it looked: canon says it belongs on the settlement, and the Goldenfurt Chapel gate depending on it lives in the zero-caller prototype fed by its own fixture. An inert field, not a broken arc."}
- {id: H1-048, name: "temperaments.py read/write asymmetry on the drift store", source: "systems/settlements/sim/temperaments.py:117,153-158", system: settlement-governance, slice: gap, status: built, status_evidence: "systems/settlements/sim/temperaments.py:117,153-158", rolls: no, shape: none, statement: "Reads via _drift_store() (no world arg) at :117, writes via _drift_store(world) at :153-158 — a getter/setter pair on different code paths. The exact read/write-asymmetry hazard §0.1 pt1 names as the first thing to grep before trusting a change claim."}
- {id: H1-049, name: "Suppress obstacle formula — two ratified surfaces disagree, only Jordan can pick", source: "systems/factions/faction_layer_v30.md:699", system: faction-strategy, touches: [parliament-politics], slice: gap, status: designed-canonical, status_evidence: "systems/factions/faction_layer_v30.md:699", rolls: no, shape: none, formula: "Ob = Mandate   |   Ob = floor(Mandate/2) + 1", conflicts_with: [H1-040], statement: "conviction_track_v30.md:204 vs faction_layer_v30.md:699, diverging up to 3 points. Moot in practice (H1-040) but real and unresolved; NOT resolvable by §0.05 since the code implements neither value."}
- {id: H1-050, name: "Seven of thirteen canonical convictions were silent no-ops in the pre-fix runtime gate", source: "proposals/2026-08-23-suite-02-narrative-texture-census.md:135-181", system: npc-social, slice: gap, status: superseded, status_evidence: "proposals/2026-08-24-suite-07-reconciliation-against-main.md:47-64", rolls: yes-resolver, shape: none, conflicts_with: [H1-006], statement: "conviction.py:191-193 returned magnitude=0 for any name outside the coded 9-tuple, no exception, no warning. Unscarrable: Authority (14 characters — the most-used conviction in the cast), Utility 9, Liberty 6, Honor 5, Scholastic 3, Virtue 2, Identity 2. 17 of 46 characters had an unscarrable primary; TWELVE could not be scarred on ANY conviction they carried, making conviction-scarring silently inert for them."}
- {id: H1-051, name: "Goldenfurt's authored settlement numbers are not loadable — its demonstration vise runs wrong", source: "proposals/2026-08-23-MASTER-vocabulary-and-rulings.md:340", system: settlement-governance, slice: gap, status: audit-finding, status_evidence: "systems/settlements/sim/registry.py::populate_from_geography", rolls: no, shape: none, statement: "Spec authors facility_tier=1, religious_building='Chapel', subnational={Guild,Church,RM,Niflhel} for S-006. Production loader reads only geography YAML, which carries none of these, so S-006 loads facility_tier=0, ap=2, religious_building='None', subnational={}. The slice's own demonstration point '3 AP cannot serve all three' runs at 2 AP — off by a third before a card is drawn — and its Chapel-gated arc cannot fire at all."}
- {id: H1-052, name: "succeed_governor is coded-but-unreached, and circularly blocked", source: "proposals/2026-08-23-suite-04-wiring-gaps-and-orphans.md:300-304", system: settlement-governance, touches: [personnel-roster], slice: gap, status: built, status_evidence: "systems/settlements/sim/registry.py::succeed_governor", baseline_ref: "personnel_muster_integration_master_v1 (governor_id reachability census)", rolls: no, shape: none, conflicts_with: [H1-041,H1-045], statement: "No succession or appointment event exists in the season loop; nothing writes governor_id outside succeed_governor and from_dict. Circularly blocked on the person layer: no NPC exists to hold the office, so there is no candidate to appoint. The non-production harness uses bare placeholder strings like 'podesta-appointee'."}
- {id: H1-053, name: "The strategic-to-cell Unit adapter for mass battle has no canonical spec", source: "systems/mass_battle/sim/massbattle.py:1867-1873", system: mass-battle-seam, touches: [faction-strategy], slice: gap, status: ruled-unexecuted, status_evidence: "systems/mass_battle/sim/massbattle.py:1867-1873", rolls: no, shape: none, conflicts_with: [H1-001], statement: "_faction_to_unit builds Units from faction.Mil using minimum-viable defaults; its own docstring says '[GAP: faction->unit construction has no canonical spec]'. MEASURED incompatibility, reproduced not merely read: feeding a Tree A Unit to Tree B's run_battle raises AttributeError 'Subunit' object has no attribute 'cells_float'. This is Ruling A's actual blocker, independently named by suite-07 as the sole remaining open mass-battle question (Q2: what is a strategic army, in cells?)."}
- {id: H1-054, name: "Mass Battle Tree A lacks the fractional pool, the sigma head, and PP-241 Reform", source: "proposals/2026-08-23-MASTER-vocabulary-and-rulings.md:138", system: mass-battle-seam, touches: [faction-strategy], slice: gap, status: ruled-unexecuted, status_evidence: "systems/mass_battle/sim/massbattle.py", rolls: no, shape: none, conflicts_with: [H1-001,H1-053], provenance: [ED-MB-0032, PP-241], statement: "Tree A lacks the sigma head, the fractional pool, and PP-241 Reform (reform_check is an empty pass). ED-MB-0032's fractional-pool ruling is implemented only in Tree B. 40 of 51 mass-battle tests already target Tree B — the test suite has been ready for the migration longer than the code."}
- {id: H1-055, name: "Knot Pool formula ratified with a +3/min-5 term; code implements neither", source: "systems/fieldwork/knots_v30.md:37", system: fieldwork-investigation, touches: [npc-social], slice: gap, status: built, status_evidence: "systems/fieldwork/sim/knots.py:216", rolls: yes-pool, shape: none, formula: "ratified: (Spirit x 2) + History(Relevant) + 3, min 5   |   coded: (spirit*2) + history_rel, no floor", provenance: [PP-632, ED-FI-0005], statement: "The design doc contradicts itself internally: :76 gives the un-augmented form the sim actually cites. The guarding test states 'there is no sim/ oracle that computes the Knot Pool, so this is a doc-content guard' — a FALSE PREMISE, since the sim clearly does compute it — so the test pins three prose surfaces and stays green while the game plays the un-ratified variant. Under §0.05 the code is currently the formula, meaning the game plays the :76 variant, which nobody decided."}
- {id: H1-056, name: "Close-Knot-break Scar applies to one actor; canon specifies both partners", source: "systems/fieldwork/knots_v30.md:189", system: fieldwork-investigation, touches: [npc-social], slice: gap, status: built, status_evidence: "systems/fieldwork/sim/knots.py:317,361", rolls: yes-resolver, shape: none, statement: "Canon says '+1 to both partners'. apply_knot_loss scars only the single actor argument passed to it. Same gap covers the paired Composure penalty at :186."}
- {id: H1-057, name: "A fabricated conviction alias table shipped as centralization, contradicting two authored surfaces", source: "proposals/2026-08-24-error-regions-v1.md:165-171", system: npc-social, slice: gap, status: superseded, rolls: no, shape: none, provenance: [PP-685], statement: "CONVICTION_ALIASES = {'Reason':'Scholastic','Autonomy':'Liberty'} justified as 'a rename rather than a design call'. Two authored surfaces refuse that mapping: taxonomy:282 marks Reason a 'composite — see PP-685 per character', and alias_registry:658-663 lists Reason as legacy with NO canonical target; Autonomy appears in neither. The alias decided a ruling by accident. LESSON: when two authored surfaces decline to state a mapping, that silence IS the ruling (not-decided)."}
- {id: H1-058, name: "npe.py's conviction-opposites table minted six non-canonical names", source: "proposals/2026-08-24-error-regions-v1.md:172-176", system: npc-social, slice: gap, status: superseded, rolls: no, shape: none, statement: "opposites = {Faith:Reason, Order:Survival, Justice:Power, Loyalty:Truth} plus inverses — six of eight names non-canonical. Not salvageable by renaming: Justice<->Power is an opposition no taxonomy in the corpus states. Replaced with a uniform draw over the other twelve. Ratified remedy: cook the 13x4 conviction-axis matrix into an artifact (map.conviction_axis, descriptor_registry:258), currently cooked nowhere."}
- {id: H1-059, name: "knots.py's 'Honor' Scar substitution is an uncited session design call", source: "proposals/2026-08-24-error-regions-v1.md:177-179", system: npc-social, touches: [fieldwork-investigation], slice: gap, status: audit-finding, status_evidence: "systems/fieldwork/sim/knots.py:349-363", rolls: no, shape: none, conflicts_with: [H1-014], provenance: [ED-912], statement: "Defensible on Honor's gloss (taxonomy §8 D1 ratifies Honor for pledged-bond material), but canon names NO specific Conviction for ED-912 §6.1. A session call, not a transcription, and not marked as one when it shipped."}
- {id: H1-060, name: "The needs_jordan queue is current, not stale — 96 of 110 are July or August", source: "proposals/2026-08-23-suite-06-method-corrections-and-queue.md:177-189", system: faction-strategy, touches: [settlement-governance, parliament-politics], slice: gap, status: audit-finding, status_evidence: registers/editorial_ledger_se.jsonl, rolls: no, shape: none, statement: "Measured 2026-08-23: 254 genuinely open, 110 needs_jordan. Pre-July 78/14; July 135/70; August 35/26; undated 6/0. The instinct that the queue is mostly stale is WRONG: dropping pre-July removes only 14 of 110. IN (30) and SE (23) together are half the Jordan queue. Superseded in exact figure by suite-07 (154 rows, 31 genuine decisions) but the shape finding is confirmed by both."}

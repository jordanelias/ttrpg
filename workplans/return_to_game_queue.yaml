# The ordering thesis, so a later session does not 'improve' it into the loop it escapes:
# S1-S4 change what DONE MEANS in this repo, from a document state to a program state. S5-S8 are
# only safe AFTER that, because a cull or a reconcile performed while `done` still means `a document
# exists` is the ninth consolidation plan. Do not reorder S5+ ahead of S1-S4.

# ── measured baselines: the numbers a later session must beat, and how they were taken ───────

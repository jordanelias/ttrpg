# return_to_game_queue.yaml — THE EXECUTABLE QUEUE for the Return-to-Game program.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# IF YOU ARE A SESSION WITH NO MEMORY, READ THIS BLOCK AND NOTHING ELSE FIRST.
#
# WHAT THIS IS. A program that returns Jordan to building the game. It runs UNATTENDED. No step
# blocks on a human. You execute it by running the driver below; you stop when your context is
# degrading; you persist before you stop. There is nothing to ask anyone.
#
# HOW TO RUN IT.
#   1. Pick the first step whose `state: pending` and whose `precondition` observable holds ON DISK.
#      Verify the precondition yourself — do not trust a `done` marker you did not write.
#   2. Run the driver against it:  Workflow({ scriptPath: ".claude/wf_return_to_game.js", args: "<id>" })
#   3. The driver produces, critiques (structurally read-only critics), reconciles, and returns.
#   4. YOU commit, set `state`, and write `evidence` + `critic_verdict` back into this file.
#   5. Loop until your context is degrading, then Persist (below) and END THE TURN.
#
# WHY THERE IS NO AUTO-CHAIN. CLAUDE.md §11 forbids a session arming its own wake-up, and the
# deny-list in .claude/settings.json is CI-enforced (tests/valoria/test_no_polling_triggers.py).
# So the program is chained by whatever starts the next session. That costs one word ("continue")
# and zero decisions. Every phase boundary is committed, so nothing is lost at a stop.
#
# WHAT "CONTEXT IS DEGRADING" MEANS, OPERATIONALLY. Stop and Persist when ANY of these is true:
#   - the harness raised `repetition` or `round_cap` (wf_harness.js — further rounds add nothing);
#   - you are re-reading files you already read this session to recover what they said;
#   - a step's critic returned `overturn` twice on the same claim;
#   - you have completed 2 steps and the next one is Group-D residual triage.
# Stopping early is correct. A half-finished step that is committed and recorded costs one
# session. A step finished badly under context pressure costs the trust in the whole program.
#
# PERSIST, before you stop, in this order: (1) update this file's step states + evidence;
# (2) commit with `[scope] description` citing the step id; (3) update HANDOFF.md's Next actions
# to name the next pending step. A commit IS the session close (CLAUDE.md §2).
# ─────────────────────────────────────────────────────────────────────────────────────────────


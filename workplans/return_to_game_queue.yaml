       and its two grep jobs are the only functional gates. Green there does NOT mean compiles — which is
       precisely what S1's compile job fixes."
    - "A FRESH CLONE HAS NO LOCAL TIER AT ALL until `git config core.hooksPath .githooks` is run once."
    - "valoria_local --staged SILENTLY SKIPS a missing tool (:256-258). After any deletion wave, local
       pre-commit degrades toward a silent pass. Only --ci mode treats absence as failure (:139-141)."
  inverse_trap:
    - "review_core --check runs INSIDE the blocking compliance-check job (valoria-ci.yml:411). Every signal
       labelled 'report_only' in review_core.py is therefore BLOCKING-ON-REGRESSION. A missing tool grades
       `fail` rc 2, not `error`. Delete or break wiring_map_check, definitions_store, vocab_store,
       export_sim_params, link_values_pointers or structure_audit's two modes and CI goes red."
    - "compliance_check enforces a cap nobody watches: registers/patch_register_archive*.yaml blocks at
       10,000 tokens (atomization_rules.yaml:82-84) while ci_register_size_check caps the same file at
       100,000. compliance_check is BLOCKING in CI and ABSENT from valoria_local — local-green is not CI-green."
  blocking_ci_jobs: ["syntax-check", "validators (19 invocations, no fail-fast)", "unit-tests (full pytest tests/valoria -n auto)", "sim-regression (pytest engine/tests)", "field-goldens (ci_golden_modes_check, 3 byte-exact modes)", "compliance-check (compliance_check --check-only AND review_core --check)"]

pre_commit_checklist:
  prose_or_design_md_changed:
    - "If a systems/ design doc changed: stage references/canonical_sources.yaml in the SAME commit
       (ci_co_file_checker.py:52, blocking); run tools/freshness_gate.py --update if it carries a canonical_sha__ pin."
    - "Regenerate all three committed artifacts, in this order: build_identifier_census.py -> build_engine_atlas.py
       -> observability/build_glossary.py. Their freshness gates are blocking (--check at CI :122;
       test_engine_atlas::test_atlas_is_current; test_build_glossary::test_committed_output_matches_a_fresh_build).
       MENTION COUNTERS MOVE WHEN PROSE MERELY NAMES A SUBSYSTEM. Budget ~800 lines of generated churn
       for any prose commit. This is not a content defect; never hand-edit a generated artifact."
    - "Run the FULL suite: pytest tests/valoria -q -n auto. Targeted runs are how the atlas failure reached CI on PR #319."
    - "Run tools/valoria_local.py --ci (NOT --staged) — the only local mode covering all 19 CI validators."
  tests_changed:
    - "Regenerate references/test_register.json (build_test_register.py; blocking --check at CI :111)."
  tools_or_workflow_changed:
    - "Co-edit references/ci_checks_registry.yaml (broken_dependency_checker path-exists + invocation-has-row, blocking)."
    - "Co-edit tests/valoria/test_gate_coverage.py EXPECTED_COMMANDS (:107) and keep valoria_local.py's list in parity (:359)."
    - "Run tools/ci_wf_harness_check.py --fix after editing tools/wf_harness.js; run ci_claude_workflow_paths.py before committing."
  ledger_or_register_written:
    - "Check headroom FIRST: python3 tools/ci_register_size_check.py."
    - "Patch-register writes need references/propagation_map.md co-change (ci_co_file_checker.py:61)."
    - "Quantitative claims in pc/in lane ledgers need `MEASURED-BY: <existing tool>` (ci_claim_provenance_check.py:99, blocking)."
    - "Allocate IDs from references/id_reservations.yaml next_free. Never max+1."

failure_decoder:
  "test_build_glossary / test_engine_atlas / build_identifier_census --check red after a prose or deletion commit":
    "Not a content defect. A committed generated artifact went stale because prose named (or stopped naming) a subsystem. Regenerate; never hand-edit."
  "ci_names_check firing repeatedly on references/glossary/*.md":
    "Report-only in BOTH tiers. Regeneration reflowed lines containing a term already on main. Do not chase it."
  "broken_dependency_checker red naming an ED- id and a tools/ path after a deletion":
    "A LIVE ledger row cites the deleted file. Fix = a restructure/FORK remap row in the same commit. Not resurrecting the tool, and not editing the ledger (the cap may block that)."
  "compliance-check red while validators is green":
    "Either a size cap only compliance enforces (patch_register_archive > 10,000 tokens) or a review_core ratchet regression — often a deleted/broken tool in its CHECKS list. valoria_local --staged can NEVER predict this job."
  "ci_register_size_check FAIL on a ledger while your diff added one row":
    "You are the structurally-unlucky next writer at a 99% register. Archive WHOLE settled ids first. Never trim rows."
  "test_the_held_site_still_diverges red (test_degree_ladder_single_owner.py:187)":
    "You RESOLVED a HELD divergence. The guard is asserted-to-diverge by design: move the site from HELD into LADDERS and delete its HELD entry. The red is forced bookkeeping, not a regression."
  "field-goldens DIGEST mismatch":
    "A digest-relevant behaviour or env default moved. Bisect against FIELD_PINS (ci_golden_modes_check.py:51-90). If deliberate, re-record loudly with a tests/coverage_matrix.md entry — and WATCH ITS CAP, it is at 94%."
  "valoria_local prints 'all local gates passed'":
    "Read the line ABOVE it. Report-only failures print separately (:285-288) and several are CI-blocking."
  "valoria-game CI green after a GDScript change":
    "Weak evidence. The lint job cannot fail. Green there does not mean it compiles."

# Known hidden couplings that BOTH 2026-08-18 documents missed — fold into the relevant wave's
# same-commit edit list before executing any cull (H1). Not S1-S8 blockers; recorded here so the
# next reader does not rediscover them the expensive way.
cull_couplings_missed_by_both_documents:
  - "broken_dependency_checker.check_editorial_ledger (blocking) reds waves 1-3: live ledger rows cite
     deletion targets — editorial_ledger_in.jsonl:21 (ED-IN-0069 -> tools/dashboard_data.py, wave 1),
     :26 (ED-IN-0085 -> review_core.py, wave 2), :32 (ED-IN-0113 -> scope_ratchet.py, wave 2),
     :40 (ED-IN-0150 -> build_glossary.py x4, wave 1), :43-44 (ED-IN-0152/0153 -> wf_harness.js, wave 3).
     Waves 1-3 plan NO FORK/remap rows, unlike wave 4."
  - "tests/valoria/test_coverage_matrix_threshold.py:14 does `import ci_register_size_check`. Wave 2 deletes
     that tool and this test is in NO wave's deletion list -> collection ImportError in the blocking unit-tests job."
  - "check_ci_registry_coverage binds waves 2-3, not just wave 1: ~14 more registered tools and their CI lines."
  - "Wave 1 stales two blocking freshness gates it never names: build_test_register --check (deleting 8 test
     files) and build_identifier_census --check (deleting ~40 tools/skills — the exact PR #307 failure)."
  - "Wave 4's verify grep has a blind spot on its own known-live oracle: gen_sigma_parity_goldens.py:102 builds
     the audit/2026-06-03-contest-groundup/engine.py path from os.path.join segments, which
     `grep -rl 'audit/2026-'` cannot see (the constructed-path under-match class, pathres.py:13, ED-IN-0128)."
  - "A golden re-record needs a tests/coverage_matrix.md entry (ci_co_file_checker.py:78, blocking) and that
     file is at 94% of its blocking 15,000-token cap. A re-record note can trip a size gate in the same commit."

gates:  # MEASURED 2026-08-19 (S0 action 3), not assumed. Two repos: ttrpg design repo
        # (.github/workflows/valoria-ci.yml) and jordanelias/valoria-game
        # (.github/workflows/godot-ci.yml, at commit 5e01065585c451733a603bda9c3b7fccf2a462f8).
        # Method: read each workflow file directly, cross-referenced against tools/valoria_local.py's
        # per-tool blocking flags and, for review_core, against tools/review_core.py's own CHECKS list
        # and --check exit logic (read, not assumed). valoria-game's lint-job claim was additionally
        # verified empirically (see valoria_game_ci.lint below).

  jobs:  # top-level jobs in ttrpg's valoria-ci.yml
    syntax-check:         { tier: blocking, why: 'required by ci-summary needs, valoria-ci.yml:421' }
    validators:           { tier: blocking, why: '19 tool invocations under v(), no continue-on-error, exit $fail at :131; required by ci-summary needs :422' }
    validators-report:    { tier: report_only, why: 'job-level continue-on-error true at :138 AND body always exit 0 at :194; absent from ci-summary needs :420-426' }
    contract-conformance: { tier: report_only, why: 'step-level continue-on-error true at :219; absent from ci-summary needs' }
    unit-tests:           { tier: blocking, why: 'pytest tests/valoria -n auto at :299; required by ci-summary needs :423' }
    sim-regression:       { tier: blocking, why: 'pytest engine/tests at :321; required by ci-summary needs :424' }
    field-goldens:        { tier: blocking, why: 'ci_golden_modes_check.py at :345; required by ci-summary needs :425' }
    lanchester-signature: { tier: report_only, why: 'job title says REPORT-ONLY; body ends "|| true" at :375; absent from ci-summary needs' }
    compliance-check:     { tier: blocking, why: 'both internal steps lack continue-on-error, required by ci-summary needs :426 -- but its two steps differ, see compliance_check_internals' }
    ci-summary:           { tier: blocking, why: 'the single required branch-protection status check per its own comment :414-415; if:always() at :419, fails if any needed job result != success' }

  compliance_check_internals:  # the two steps INSIDE the blocking compliance-check job have different failure semantics
    compliance_check_py_check_only:
      tier: blocking
      why: 'valoria-ci.yml:401-402, "compliance_check.py --check-only --repo-state .", no continue-on-error; ABSENT from tools/valoria_local.py entirely (grepped, zero hits) -- local-green != CI-green, per CLAUDE.md S8 ED-1082 correction'
    review_core_py_check:
      tier: blocking_on_regression
      why: 'valoria-ci.yml:404-411, "review_core.py --check", no continue-on-error. Verified by reading tools/review_core.py: all 11 CHECKS entries (:59-96) are non-blocking -- 9 tier=report_only and 2 tier=info (audit.staleness :69, workplan.state :70) -- zero tier=blocking, so collect()s blocking_failures (:178) is structurally always 0 (the load-bearing statement is NO entry is tier=blocking, not that every entry is report_only; corrected at S0 adjudication after two independent critics caught the miscount); --check (main():275) fails only if blocking_failures OR regressions_vs_baseline -- so this step is blocking ONLY on a signal regressing past its registers/review_baseline.yaml ceiling (_apply_ratchet, :155-170), never on a pre-existing at-or-under-baseline report_only failure.'

  validators_job_tools:  # inside the blocking `validators` job, valoria-ci.yml:100-130 -- all 19 blocking in CI.
                          # `local` is the SAME script's blocking flag in tools/valoria_local.py's
                          # (script,args,blocking) list at :153-243 -- CI and local tiers frequently diverge.
    ci_register_size_check.py:    { ci: blocking, local: blocking }                        # valoria-ci.yml:100, valoria_local.py:160
    ci_hooks_verifier.py:         { ci: blocking, local: report_only }                      # :101, :234 -- CI-only residual, ED-IN-0176
    ci_co_file_checker.py:        { ci: blocking, local: blocking }                         # :102, :158
    ci_editorial_checker.py:      { ci: blocking, local: blocking }                         # :103, :159
    ci_pp_frozen_check.py:        { ci: blocking, local: blocking }                         # :104, :154
    ci_naming_check.py:           { ci: blocking, local: blocking, note: 'distinct tool from ci_names_check below' }  # :105, :155
    ci_names_consistency.py:      { ci: blocking, local: blocking }                         # :106, :156
    export_engine_params.py:      { ci: blocking, local: blocking, args: '--check' }        # :107, :166
    export_key_types.py:          { ci: blocking, local: blocking, args: '--check' }        # :108, :167
    build_test_register.py:       { ci: blocking, local: blocking, args: '--check' }        # :111, :171
    build_identifier_census.py:   { ci: blocking, local: report_only, args: '--check' }     # :122, :235 -- CI-only residual, ED-IN-0172
    ci_sim_fabrication_check.py:  { ci: blocking, local: blocking }                         # :123, :162
    ci_claim_provenance_check.py: { ci: blocking, local: blocking }                         # :124, :175
    ci_claude_workflow_paths.py:  { ci: blocking, local: report_only }                      # :125, :187 -- report-only locally, blocking in CI (ED-IN-0085)
    ci_wf_harness_check.py:       { ci: blocking, local: report_only }                      # :126, :186 -- report-only locally, blocking in CI (ED-IN-0087)
    ci_vetting_check.py:          { ci: blocking, local: blocking }                         # :127, :161
    validate_ed_citations.py:     { ci: blocking, local: report_only }                      # :128, :236 -- CI-only residual
    broken_dependency_checker.py: { ci: blocking, local: report_only }                      # :129, :237 -- CI-only residual
    freshness_gate.py:            { ci: blocking, local: report_only }                      # :130, :198 -- report-only locally, blocking in CI (ED-PC-0040)

  validators_report_job_tools:  # inside the report-only `validators-report` job, valoria-ci.yml:158-194.
                                 # wrapped in w() (:164, never propagates status); body ends unconditional exit 0 (:194).
    ci_supersession_check.py:        { ci: report_only, local: report_only, why: 'structurally cannot fail -- own code always returns 0' }        # :173, valoria_local.py:163
    ci_audit_registry_check.py:      { ci: report_only, local: report_only, why: 'always exits 0 by design per its own registry row' }             # :174, :173
    ci_names_check.py:               { ci: report_only, local: report_only, why: 'report-only in BOTH tiers -- distinct tool from ci_naming_check/ci_names_consistency above, both of which ARE blocking' }  # :175, :157
    currency_consistency_check.py:   { ci: report_only, local: report_only }                                                                       # :176, :172
    ci_quantity_vocabulary_check.py: { ci: report_only, local: absent }                                                                             # :177, absent from valoria_local.py entirely
    mechanics_index_gen.py:          { ci: report_only, local: absent, args: '--strict' }                                                           # :178, absent
    ci_generation_consistency.py:    { ci: report_only, local: report_only }                                                                       # :179, :164
    canon_coverage_check.py:         { ci: report_only, local: absent, args: '--strict --json' }                                                    # :180, absent
    ci_module_shape_check.py:        { ci: report_only, local: report_only }                                                                       # :181, :165
    ci_workplan_pointer_check.py:    { ci: report_only, local: report_only, why: 'report-only in BOTH tiers -- confirmed by direct read, matches S0s known-fact' }  # :182, :193
    wiring_map_check.py:             { ci: report_only, local: report_only, args: '--check', why: 'also folded into review_core CHECKS as wiring.coverage (review_core.py:64) -- additionally blocking-on-regression via the compliance-check job, same shape as review_core_py_check above' }  # :183, :174
    scope_ratchet.py:                { ci: report_only, local: report_only, args: '--check' }                                                       # :191, :210
    ci_vacuous_assertion_check.py:   { ci: report_only, local: absent }                                                                             # :192, absent
    ci_program_claim_check.py:       { ci: report_only, local: absent }                                                                             # :193, absent

  local_only_tools:  # present in tools/valoria_local.py, confirmed absent from both the ttrpg-repo
                      # workflow jobs above (grepped) and from tools/review_core.py's CHECKS list (grepped)
    single_owner_check.py:
      ci: not_wired
      local: report_only
      why: 'CLAUDE.md S8 single-owner guard -- zero references in valoria-ci.yml and zero in review_core.py CHECKS; violations it finds are never checked in CI at all'  # valoria_local.py:243

  valoria_game_ci:  # .github/workflows/godot-ci.yml in jordanelias/valoria-game, measured at commit 5e01065585c451733a603bda9c3b7fccf2a462f8
    lint:
      tier: cannot_fail
      why: 'job body is find . -name STAR.gd -exec python3 -c ... {} SEMI -- GNU finds own exit status does not propagate the -exec childs nonzero exit in that form. VERIFIED EMPIRICALLY THIS SESSION in this worktrees shell: find /tmp -maxdepth 0 -exec python3 -c "import sys; sys.exit(1)" {} SEMI exits 0. The job cannot fail regardless of GDScript content -- S1s compile job is the first functional syntax gate on that repo.'
    enum-check:
      tier: blocking
      why: 'direct grep -rn ... && exit 1 shell pattern, no -exec indirection -- propagates correctly'
    naming-check:
      tier: blocking
      why: 'same direct grep-and-exit pattern as enum-check'

  residuals:
    - 'git push origin --delete scratch-s0-push-test (jordanelias/valoria-game) returned HTTP 403 twice
       (retried once, not transient), even though the original push CREATING that branch succeeded --
       the push scope this session holds can create refs but apparently cannot delete them. The branch
       (commit d97e080, one throwaway file .s0_push_scope_test.txt, message "test: S0 push-scope
       verification (scratch, to be deleted)") is still on the remote; the local branch and working

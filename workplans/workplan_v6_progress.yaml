# RULES (anti-rot — this surface class killed roadmap_state.yaml, retired ED-IN-0006):
#   1. Rollup ONLY. Lane detail stays in registers/handoffs/HANDOFF_<LANE>.md; every row POINTS at
#      its evidence (PR / ED / commit), it never restates lane narrative.
#   2. Verify before trust: tools/workplan_status.py --check warns whenever workplan-relevant
#      paths changed since this file's last-touch commit (the machine freshness base; `as_of`
#      below is the human-facing record). The navigator skill runs the check on EVERY read;
#      stale board -> refresh rows from the registers/handoffs/ledger FIRST, then answer.
#      THE ROSTER IS NOT LISTED HERE. It is workplan_status.RELEVANT_PREFIXES, which composes
#      systems/ + registers/handoffs/ + canon/ with ci_common.sim_reference_prefixes() (the
#      single owner of the post-retirement sim roster, engine/ included). Naming it in this
#      comment is what rotted: until 2026-08-14 these lines read "designs/, ..., sim/", two
#      trees RETIRED in July, and the 2026-08-14 five-lens assessment (finding M1) read that
#      prose and reported the detector itself as half-blind. It was not — OI-53a fixed the
#      tool on 2026-07-29 and the comment was never updated. A duplicated roster rots
#      independently of its subject, which is the same defect this board exists to prevent
#      (ED-IN-0189). Point at the owner; do not restate it.
#   3. Refresh-on-use: any session that lands juncture/stage-relevant work updates the
#      touched rows + appends one last_progress line + bumps as_of (skill Workflow C).
#   4. States: not_started | in_progress | blocked | done. `blocked_on` names the gate
#      (a §5 register fork / ED); `next` is the next concrete increment (one line).
#
# Glyph legend (rendering, workplan_status.py): ■ done · ◐ in_progress · ⊘ blocked · ▢ not_started

